[[questions]]
  id = 1
  question = "Что такое итератор и как он используется?"
  answer = "**Итератор** в Python - это объект, который реализует методы **__iter__** и **__next__** .\n\nМетод **__iter__()** возвращает сам итератор, а метод **__next__** возвращает следующий элемент последовательности. Когда элементы заканчиваются, **__next__** должен вызвать исключение `StopIteration`.\n\n```python\nclass Squares:\n    def __init__(self, max_value):\n        self.max_value = max_value\n        self.current = 1\n\n    def __iter__(self):\n        # Метод __iter__ делает объект итератором. \n        # Возвращаем самого себя, так как класс сам является итератором\n        return self\n\n    def __next__(self):\n        # Метод __next__ вызывается при каждой итерации\n        if self.current <= self.max_value:\n            result = self.current ** 2\n            self.current += 1\n            return result\n        else:\n            raise StopIteration\n\nsquares = Squares(5)\nfor square in squares:\n    # На каждой итерации вызывается метод __next__ и выводится результат\n    print(square)\n```\n\n**Iterable** (Итерабельный) — это объект, который можно итерировать (проходить в цикле for) - Должен реализовывать метод `__iter__()`, который возвращает **итератор** - Примеры: список, кортеж, строка, словарь - **Можно итерировать многократно** — каждый раз создается новый итератор\n\n**Iterator** (Итератор) - **Iterator** — это объект, который непосредственно выполняет итерацию - Должен реализовывать метод `__next__()`, который возвращает следующий элемент - Должен реализовывать метод `__iter__()`, который возвращает сам себя - **Проходится только один раз** — после exhaustion (истощения) нельзя использовать снова\n\n**Ключевые различия**\n\n|Характеристика|Iterable|Iterator|\n|---|---|---|\n|**Многократное использование**|✅ Да|❌ Нет|\n|**Состояние**|Не хранит состояние итерации|Хранит текущее состояние|\n|**Методы**|`__iter__()`|`__iter__()` и `__next__()`|\n|**Примеры**|`list`, `tuple`, `dict`|`iter(list)`, `file object`|"
  popularity = 5.26

[[questions]]
  id = 2
  question = "Как реализовать протокол итератора и создать собственный итератор?"
  answer = "### Суть\n\nЧтобы объект был **итератором**, он должен реализовать два метода:\n\n```python\n__iter__()\n__next__()\n```\n\nМетод `__iter__()` должен вернуть сам объект-итератор, а `__next__()` должен вернуть следующий элемент. Когда элементы закончились, `__next__()` должен выбросить `StopIteration`. Именно так Python понимает, что итерация завершена. \n\n### Как работает `for`\n\nЦикл:\n\n```python\nfor item in obj:\n    print(item)\n```\n\nпримерно превращается в такую логику:\n\n```python\niterator = iter(obj)\n\nwhile True:\n    try:\n        item = next(iterator)\n    except StopIteration:\n        break\n\n    print(item)\n```\n\nФункция `next()` внутри вызывает у объекта метод `__next__()`. \n\n### Минимальный собственный итератор\n\n```python\nclass Countdown:\n    def __init__(self, start):\n        self.current = start\n\n    def __iter__(self):\n        return self\n\n    def __next__(self):\n        if self.current <= 0:\n            raise StopIteration\n\n        value = self.current\n        self.current -= 1\n        return value\n```\n\nИспользование:\n\n```python\ncounter = Countdown(3)\n\nfor number in counter:\n    print(number)\n```\n\nРезультат:\n\n```text\n3\n2\n1\n```\n\n### Что здесь происходит\n\n```python\ndef __iter__(self):\n    return self\n```\n\nОбъект сам является своим итератором, поэтому возвращает `self`.\n\n```python\ndef __next__(self):\n```\n\nЭтот метод вызывается каждый раз, когда Python хочет получить следующий элемент.\n\n```python\nif self.current <= 0:\n    raise StopIteration\n```\n\nКогда элементы закончились, нужно выбросить `StopIteration`.\n\n```python\nvalue = self.current\nself.current -= 1\nreturn value\n```\n\nМетод возвращает текущее значение и сдвигает внутреннее состояние итератора.\n\n### Важный момент: итератор одноразовый\n\n```python\ncounter = Countdown(3)\n\nprint(list(counter))  # [3, 2, 1]\nprint(list(counter))  # []\n```\n\nПочему второй список пустой? Потому что итератор уже дошёл до конца. После исчерпания итератор должен продолжать выбрасывать `StopIteration`. \n\n### Более правильный вариант: iterable + отдельный iterator\n\nЧасто лучше разделять:\n\n```text\nIterable-объект\n↓\nсоздаёт новый Iterator при каждом iter()\n↓\nIterator хранит состояние обхода\n```\n\nПример:\n\n```python\nclass MyRange:\n    def __init__(self, start, stop):\n        self.start = start\n        self.stop = stop\n\n    def __iter__(self):\n        return MyRangeIterator(self.start, self.stop)\n\n\nclass MyRangeIterator:\n    def __init__(self, current, stop):\n        self.current = current\n        self.stop = stop\n\n    def __iter__(self):\n        return self\n\n    def __next__(self):\n        if self.current >= self.stop:\n            raise StopIteration\n\n        value = self.current\n        self.current += 1\n        return value\n```\n\nИспользование:\n\n```python\nnumbers = MyRange(1, 4)\n\nprint(list(numbers))  # [1, 2, 3]\nprint(list(numbers))  # [1, 2, 3]\n```\n\nЗдесь `MyRange` — **итерируемый объект**, но не сам итератор. Каждый вызов `iter(numbers)` создаёт новый независимый итератор.\n\n### Разница между iterable и iterator\n\n```text\nIterable\nобъект, по которому можно пройтись в цикле for\nдолжен иметь __iter__()\n\nIterator\nобъект, который реально выдаёт элементы по одному\nдолжен иметь __iter__() и __next__()\n```\n\nПример:\n\n```python\nnumbers = [1, 2, 3]\n\niterator = iter(numbers)\n\nprint(next(iterator))  # 1\nprint(next(iterator))  # 2\nprint(next(iterator))  # 3\n```\n\nСписок — это **iterable**, но не iterator:\n\n```python\nnumbers = [1, 2, 3]\n\nprint(hasattr(numbers, \"__iter__\"))  # True\nprint(hasattr(numbers, \"__next__\"))  # False\n```\n\nА объект, возвращённый `iter(numbers)`, уже iterator:\n\n```python\niterator = iter(numbers)\n\nprint(hasattr(iterator, \"__iter__\"))  # True\nprint(hasattr(iterator, \"__next__\"))  # True\n```\n\n### Итог\n\nМинимальная реализация собственного итератора:\n\n```python\nclass MyIterator:\n    def __iter__(self):\n        return self\n\n    def __next__(self):\n        if нет_следующего_элемента:\n            raise StopIteration\n\n        return следующий_элемент\n```\n\nНа практике чаще используют второй подход:\n\n```text\nКонтейнер / коллекция:\n    __iter__() возвращает новый итератор\n\nИтератор:\n    __iter__() возвращает self\n    __next__() возвращает следующий элемент\n```\n\nТак объект можно безопасно итерировать несколько раз."
  popularity = 7.89

[[questions]]
  id = 3
  question = "Как реализовать генератор? (Не используя __iter__ и __next__)"
  answer = "Генератор в Python реализуется через функцию с `yield`, без ручного написания `__iter__()` и `__next__()`.\n\n```python\ndef my_generator():\n    yield 1\n    yield 2\n    yield 3\n```\n\nФункция, внутри которой есть `yield`, становится генераторной функцией. При вызове она не выполняется сразу, а возвращает объект-генератор. Этот объект уже сам является итератором и умеет выдавать значения по одному. \n\n### Пример использования\n\n```python\ndef numbers():\n    yield 1\n    yield 2\n    yield 3\n\n\ngen = numbers()\n\nprint(next(gen))  # 1\nprint(next(gen))  # 2\nprint(next(gen))  # 3\n```\n\nИли через `for`:\n\n```python\nfor number in numbers():\n    print(number)\n```\n\nВывод:\n\n```text\n1\n2\n3\n```\n\n### Генератор с циклом\n\n```python\ndef countdown(n):\n    while n > 0:\n        yield n\n        n -= 1\n\n\nfor value in countdown(5):\n    print(value)\n```\n\nВывод:\n\n```text\n5\n4\n3\n2\n1\n```\n\n### Что делает `yield`\n\n`yield` возвращает значение наружу, но не завершает функцию полностью. Выполнение функции временно приостанавливается, а при следующем обращении продолжается с того же места. Python сохраняет локальные переменные и состояние выполнения генератора.\n\nПример:\n\n```python\ndef example():\n    print(\"start\")\n    yield 10\n\n    print(\"middle\")\n    yield 20\n\n    print(\"end\")\n    yield 30\n\n\ngen = example()\n\nprint(next(gen))\nprint(next(gen))\nprint(next(gen))\n```\n\nВывод:\n\n```text\nstart\n10\nmiddle\n20\nend\n30\n```\n\n### Практический пример\n\nГенератор квадратов чисел:\n\n```python\ndef squares(limit):\n    for number in range(limit):\n        yield number ** 2\n\n\nfor square in squares(5):\n    print(square)\n```\n\nВывод:\n\n```text\n0\n1\n4\n9\n16\n```\n\n### Бесконечный генератор\n\n```python\ndef counter(start=0):\n    while True:\n        yield start\n        start += 1\n```\n\nИспользование:\n\n```python\ngen = counter()\n\nprint(next(gen))  # 0\nprint(next(gen))  # 1\nprint(next(gen))  # 2\n```\n\nТакой генератор не хранит все значения в памяти заранее. Он вычисляет следующее значение только тогда, когда его запрашивают.\n\n### Генераторное выражение\n\nДля простых случаев можно использовать генераторное выражение:\n\n```python\ngen = (x ** 2 for x in range(5))\n\nfor value in gen:\n    print(value)\n```\n\nЭто похоже на list comprehension, но значения создаются лениво, по одному.\n\n```python\nlst = [x ** 2 for x in range(5)]  # список сразу в памяти\ngen = (x ** 2 for x in range(5))  # генератор\n```\n\n### Главное отличие от класса-итератора\n\nЧерез класс:\n\n```python\nclass MyIterator:\n    def __iter__(self):\n        return self\n\n    def __next__(self):\n        ...\n```\n\nЧерез генератор:\n\n```python\ndef my_generator():\n    yield ...\n```\n\nТо есть `yield` — это более короткий и удобный способ создать итератор без ручной реализации `__iter__()` и `__next__()`. Python делает эту работу внутри генераторного объекта. "
  popularity = 2.63

[[questions]]
  id = 4
  question = "Какую роль выполняет метод __next__ в итерационном протоколе и какую логику он обязан реализовывать?"
  answer = "### Роль `__next__`\n\n`__next__()` — это метод, который отвечает за выдачу следующего элемента итератора.\n\nКогда ты вызываешь:\n\n```python\nnext(iterator)\n```\n\nPython внутри вызывает:\n\n```python\niterator.__next__()\n```\n\nТо есть `__next__()` — это основная рабочая часть итератора.\n\n### Что обязан делать `__next__`\n\nМетод `__next__()` обязан реализовывать три вещи:\n\n### 1. Вернуть следующий элемент\n\n```python\ndef __next__(self):\n    return value\n```\n\nНапример, если итератор проходит по числам от `0` до `3`, то каждый вызов должен возвращать следующее число:\n\n```python\n0\n1\n2\n3\n```\n\n### 2. Обновить внутреннее состояние\n\nИтератор должен помнить, где он сейчас находится.\n\nНапример:\n\n```python\nclass Counter:\n    def __init__(self, limit):\n        self.current = 0\n        self.limit = limit\n\n    def __iter__(self):\n        return self\n\n    def __next__(self):\n        if self.current >= self.limit:\n            raise StopIteration\n\n        value = self.current\n        self.current += 1\n        return value\n```\n\nИспользование:\n\n```python\ncounter = Counter(3)\n\nprint(next(counter))  # 0\nprint(next(counter))  # 1\nprint(next(counter))  # 2\nprint(next(counter))  # StopIteration\n```\n\nЗдесь `self.current` — это внутреннее состояние итератора.\n\nПосле каждого вызова `__next__()` оно изменяется:\n\n```text\ncurrent = 0 → вернуть 0 → current = 1\ncurrent = 1 → вернуть 1 → current = 2\ncurrent = 2 → вернуть 2 → current = 3\ncurrent = 3 → элементов больше нет → StopIteration\n```\n\n### 3. Завершить итерацию через `StopIteration`\n\nКогда элементы закончились, `__next__()` не должен возвращать `None`, `False`, `0` или другое специальное значение.\n\nОн обязан выбросить исключение:\n\n```python\nraise StopIteration\n```\n\nПотому что `None`, `False`, `0` — это обычные допустимые значения.\n\nНапример, такой итератор вполне может возвращать `None` как нормальный элемент:\n\n```python\nclass MyIterator:\n    def __iter__(self):\n        return self\n\n    def __next__(self):\n        return None\n```\n\nПоэтому конец итерации обозначается именно `StopIteration`, а не возвращаемым значением.\n\n### Как это использует `for`\n\nКогда ты пишешь:\n\n```python\nfor item in counter:\n    print(item)\n```\n\nPython примерно делает следующее:\n\n```python\niterator = iter(counter)\n\nwhile True:\n    try:\n        item = next(iterator)\n    except StopIteration:\n        break\n\n    print(item)\n```\n\nТо есть цикл `for` вызывает `__next__()` снова и снова, пока не получит `StopIteration`.\n\n### Полная логика `__next__`\n\nТипичная схема такая:\n\n```python\ndef __next__(self):\n    if элементов_больше_нет:\n        raise StopIteration\n\n    value = следующий_элемент\n    обновить_внутреннее_состояние\n    return value\n```\n\nПрактический пример:\n\n```python\nclass MyRange:\n    def __init__(self, start, stop):\n        self.current = start\n        self.stop = stop\n\n    def __iter__(self):\n        return self\n\n    def __next__(self):\n        if self.current >= self.stop:\n            raise StopIteration\n\n        value = self.current\n        self.current += 1\n        return value\n```\n\nИспользование:\n\n```python\nfor number in MyRange(1, 5):\n    print(number)\n```\n\nВывод:\n\n```text\n1\n2\n3\n4\n```\n\n### Важно\n\n`__next__()` не обязан создавать все элементы заранее. Он может вычислять следующий элемент прямо в момент вызова.\n\nИменно поэтому итераторы удобны для больших последовательностей:\n\n```python\nclass InfiniteCounter:\n    def __init__(self):\n        self.current = 0\n\n    def __iter__(self):\n        return self\n\n    def __next__(self):\n        value = self.current\n        self.current += 1\n        return value\n```\n\nТакой итератор бесконечный:\n\n```python\ncounter = InfiniteCounter()\n\nprint(next(counter))  # 0\nprint(next(counter))  # 1\nprint(next(counter))  # 2\n```\n\n### Итог\n\n`__next__()` в итерационном протоколе выполняет роль метода, который:\n\n```text\n1. Возвращает следующий элемент\n2. Обновляет состояние итератора\n3. Выбрасывает StopIteration, когда элементы закончились\n```\n\nКратко:\n\n```python\ndef __next__(self):\n    if конец:\n        raise StopIteration\n\n    вернуть_следующий_элемент\n```\n\n`__iter__()` делает объект итератором, а `__next__()` определяет, как именно этот итератор двигается вперёд."
  popularity = 2.63

[[questions]]
  id = 5
  question = "Объект итератор vs итерируемый объект"
  answer = "**Итерируемый объект** — объект, по которому можно пройтись в цикле `for`.\n\n**Итератор** — объект, который непосредственно выдаёт элементы по одному через `__next__()`.\n\nГлавная разница:\n\n```text\nитерируемый объект → даёт итератор\nитератор → выдаёт элементы\n```\n\nВ Python итерируемый объект передаётся в `iter()`, а `iter()` возвращает итератор. Сам итератор при вызове `next()` возвращает следующий элемент или выбрасывает `StopIteration`, когда элементы закончились. \n\n### Итерируемый объект\n\nИтерируемый объект должен уметь возвращать итератор.\n\nОбычно для этого у него есть метод:\n\n```python\n__iter__()\n```\n\nПримеры итерируемых объектов:\n\n```python\nlist\ntuple\nstr\ndict\nset\nrange\nfile\n```\n\nНапример:\n\n```python\nnumbers = [10, 20, 30]\n\nfor number in numbers:\n    print(number)\n```\n\nСписок `numbers` — это **итерируемый объект**.\n\nНо сам список не является итератором:\n\n```python\nnumbers = [10, 20, 30]\n\nprint(next(numbers))\n```\n\nБудет ошибка:\n\n```text\nTypeError: 'list' object is not an iterator\n```\n\nПочему? Потому что у списка нет прямой обязанности самому помнить текущую позицию итерации. Список хранит данные, а для обхода создаётся отдельный объект-итератор.\n\n### Итератор\n\nИтератор должен реализовывать два метода:\n\n```python\n__iter__()\n__next__()\n```\n\nПри этом `__iter__()` у итератора обычно возвращает сам объект:\n\n```python\ndef __iter__(self):\n    return self\n```\n\nА `__next__()` возвращает следующий элемент:\n\n```python\ndef __next__(self):\n    ...\n```\n\nКогда элементы закончились, `__next__()` должен выбросить:\n\n```python\nraise StopIteration\n```\n\nПо документации Python итератор представляет поток данных: повторные вызовы `__next__()` или `next()` возвращают следующие элементы, а при окончании данных выбрасывается `StopIteration`. \n\n### Пример со списком\n\n```python\nnumbers = [10, 20, 30]\n\niterator = iter(numbers)\n\nprint(iterator)\nprint(next(iterator))  # 10\nprint(next(iterator))  # 20\nprint(next(iterator))  # 30\nprint(next(iterator))  # StopIteration\n```\n\nЗдесь:\n\n```python\nnumbers\n```\n\nэто **итерируемый объект**.\n\nА:\n\n```python\niterator = iter(numbers)\n```\n\nэто уже **итератор**.\n\n### Важное отличие\n\nИтерируемый объект можно обычно проходить несколько раз:\n\n```python\nnumbers = [1, 2, 3]\n\nfor x in numbers:\n    print(x)\n\nfor x in numbers:\n    print(x)\n```\n\nВывод будет два раза:\n\n```text\n1\n2\n3\n1\n2\n3\n```\n\nПотому что список каждый раз создаёт новый итератор.\n\nА сам итератор обычно одноразовый:\n\n```python\nnumbers = [1, 2, 3]\n\niterator = iter(numbers)\n\nfor x in iterator:\n    print(x)\n\nfor x in iterator:\n    print(x)\n```\n\nВывод:\n\n```text\n1\n2\n3\n```\n\nВторой цикл ничего не выведет, потому что итератор уже исчерпан.\n\nОфициальная документация отдельно подчёркивает: контейнер вроде `list` создаёт новый итератор при каждом вызове `iter()`, а попытка повторно пройтись по уже использованному итератору вернёт тот же исчерпанный объект. \n\n### Таблица различий\n\n|Критерий|Итерируемый объект|Итератор|\n|---|---|---|\n|Назначение|Даёт возможность обхода|Непосредственно выдаёт элементы|\n|Главный метод|`__iter__()`|`__iter__()` и `__next__()`|\n|Работает с `for`|Да|Да|\n|Работает с `next()` напрямую|Обычно нет|Да|\n|Хранит текущую позицию|Обычно нет|Да|\n|Можно пройти несколько раз|Обычно да|Обычно нет|\n|Пример|`list`, `tuple`, `str`, `dict`, `range`|`iter(list)`, генератор, файловый объект|\n\n### Проверка на примере\n\n```python\nnumbers = [1, 2, 3]\n\nprint(hasattr(numbers, \"__iter__\"))   # True\nprint(hasattr(numbers, \"__next__\"))   # False\n```\n\nСписок — итерируемый объект, но не итератор.\n\nТеперь создадим итератор:\n\n```python\niterator = iter(numbers)\n\nprint(hasattr(iterator, \"__iter__\"))   # True\nprint(hasattr(iterator, \"__next__\"))   # True\n```\n\nТеперь это итератор.\n\n### Собственный итерируемый объект\n\n```python\nclass MyCollection:\n    def __init__(self, items):\n        self.items = items\n\n    def __iter__(self):\n        return iter(self.items)\n```\n\nИспользование:\n\n```python\ncollection = MyCollection([10, 20, 30])\n\nfor item in collection:\n    print(item)\n```\n\nЗдесь `MyCollection` — итерируемый объект. Он не сам выдаёт элементы, а возвращает итератор от внутреннего списка.\n\n### Собственный итератор\n\n```python\nclass MyIterator:\n    def __init__(self, items):\n        self.items = items\n        self.index = 0\n\n    def __iter__(self):\n        return self\n\n    def __next__(self):\n        if self.index >= len(self.items):\n            raise StopIteration\n\n        value = self.items[self.index]\n        self.index += 1\n        return value\n```\n\nИспользование:\n\n```python\niterator = MyIterator([10, 20, 30])\n\nprint(next(iterator))  # 10\nprint(next(iterator))  # 20\nprint(next(iterator))  # 30\n```\n\nЗдесь `MyIterator` — именно итератор, потому что он сам хранит позицию и сам выдаёт следующие элементы.\n\n### Почему каждый итератор — итерируемый объект\n\nИтератор обязан иметь `__iter__()`, который возвращает сам итератор:\n\n```python\ndef __iter__(self):\n    return self\n```\n\nПоэтому любой итератор можно использовать в `for`:\n\n```python\niterator = iter([1, 2, 3])\n\nfor item in iterator:\n    print(item)\n```\n\nТо есть:\n\n```text\nкаждый итератор является итерируемым объектом\nно не каждый итерируемый объект является итератором\n```\n\n### Итог\n\n```text\nИтерируемый объект:\n    объект, из которого можно получить итератор через iter()\n\nИтератор:\n    объект, который возвращает элементы через next()\n    и завершает обход через StopIteration\n```\n\nСамая короткая формула:\n\n```python\niterable = [1, 2, 3]        # итерируемый объект\niterator = iter(iterable)  # итератор\n\nnext(iterator)             # 1\nnext(iterator)             # 2\nnext(iterator)             # 3\n```\n\nГлавная мысль: **итерируемый объект отвечает за возможность обхода, а итератор — за сам процесс обхода**."
  popularity = 2.63

