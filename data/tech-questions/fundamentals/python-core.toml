  question = "Магические методы __init__ и __new__"
  answer = "### `__new__` и `__init__`\nПри создании объекта Python вызывает два метода:\n```python\nobj = MyClass(...)\n```\nФактически процесс такой:\n```python\nobj = MyClass.__new__(MyClass, ...)\nMyClass.__init__(obj, ...)\n```\nУпрощённо:\n```text\n__new__  → создаёт объект\n__init__ → настраивает уже созданный объект\n```\nОфициальная документация Python прямо разделяет их роли: `__new__()` вызывается для создания нового экземпляра класса, а `__init__()` вызывается после создания экземпляра, но до возврата объекта вызывающему коду.\n\n### `__init__`\n`__init__` — это инициализатор объекта.\nОн не создаёт объект, а заполняет его данными.\n```python\nclass User:\n    def __init__(self, username: str, age: int):\n        self.username = username\n        self.age = age\n\n\nuser = User(\"Alex\", 20)\n\nprint(user.username)  # Alex\nprint(user.age)       # 20\n```\nЗдесь объект `User` уже создан, а `__init__` просто добавляет ему атрибуты `username` и `age`.\n\n**Важно:** \n`__init__` не должен возвращать значение. Он обязан возвращать `None`, иначе будет `TypeError`. Это также указано в документации Python.\n\nНеправильно:\n```python\nclass User:\n    def __init__(self):\n        return \"created\"\n```\nБудет ошибка:\n```text\nTypeError: __init__() should return None\n```\n\n### `__new__`\n`__new__` — это метод, который отвечает именно за создание объекта.\n```python\nclass User:\n    def __new__(cls, *args, **kwargs):\n        print(\"__new__: создаём объект\")\n        obj = super().__new__(cls)\n        return obj\n\n    def __init__(self, username):\n        print(\"__init__: инициализируем объект\")\n        self.username = username\n\n\nuser = User(\"Alex\")\n```\nВывод:\n```text\n__new__: создаём объект\n__init__: инициализируем объект\n```\n\nПервый аргумент у `__new__` — это `cls`, то есть сам класс, объект которого нужно создать.\n```python\ndef __new__(cls, *args, **kwargs):\n    ...\n```\nА первый аргумент у `__init__` — это `self`, то есть уже созданный объект.\n```python\ndef __init__(self, ...):\n    ...\n```\n\n### Главное отличие\n\n|Метод|Что делает|Первый аргумент|Что возвращает|\n|---|---|---|---|\n|`__new__`|Создаёт объект|`cls`|Новый объект|\n|`__init__`|Инициализирует объект|`self`|Только `None`|\n\n### Почему обычно используют `__init__`, а не `__new__`\nВ обычных классах почти всегда достаточно `__init__`.\n```python\nclass Product:\n    def __init__(self, title, price):\n        self.title = title\n        self.price = price\n```\n\n`__new__` нужен редко. Его используют, когда нужно вмешаться именно в создание объекта, например:\n```python\nclass Singleton:\n    _instance = None\n\n    def __new__(cls):\n        if cls._instance is None:\n            cls._instance = super().__new__(cls)\n\n        return cls._instance\n\n\na = Singleton()\nb = Singleton()\n\nprint(a is b)  # True\n```\nЗдесь `__new__` контролирует создание объекта: если объект уже был создан, новый не создаётся, а возвращается старый.\n\n### Важный момент\n`__init__` вызывается только если `__new__` вернул экземпляр этого же класса или его подкласса. Если `__new__` вернул объект другого типа, `__init__` вызван не будет. Это поведение описано в документации Python.\n\nПример:\n```python\nclass Test:\n    def __new__(cls):\n        print(\"__new__\")\n        return \"not Test object\"\n\n    def __init__(self):\n        print(\"__init__\")\n\n\nobj = Test()\n\nprint(obj)\n```\nВывод:\n```text\n__new__\nnot Test object\n```\n`__init__` не вызвался, потому что `__new__` вернул строку, а не объект `Test`.\n\n### Когда реально нужен `__new__`\nЧаще всего `__new__` нужен при:\n1. Создании singleton-объектов.\n2. Наследовании от неизменяемых типов: `int`, `str`, `tuple`.\n3. Кэшировании объектов.\n4. Контроле создания экземпляров.\n5. Метаклассах.\n\nПример с `str`:\n```python\nclass UpperStr(str):\n    def __new__(cls, value):\n        return super().__new__(cls, value.upper())\n\n\ntext = UpperStr(\"hello\")\n\nprint(text)        # HELLO\nprint(type(text))  # <class '__main__.UpperStr'>\n```\nПочему тут нужен именно `__new__`?\n\nПотому что `str` — неизменяемый тип. После создания строки её значение уже нельзя изменить. Поэтому значение нужно задать на этапе создания объекта, то есть в `__new__`, а не в `__init__`. Документация Python отдельно указывает, что `__new__` в основном нужен для настройки создания экземпляров неизменяемых типов вроде `int`, `str` и `tuple`."
  popularity = 10.53

