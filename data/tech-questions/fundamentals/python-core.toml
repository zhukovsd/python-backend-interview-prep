  id = 32
  question = "Ограничивает ли __slots__ создание новых атрибутов объекта?"
  answer = "### Да, `__slots__` ограничивает создание новых атрибутов объекта\n\n`__slots__` позволяет заранее объявить, какие атрибуты могут быть у экземпляра класса. Если у объекта нет `__dict__`, то добавить произвольный новый атрибут уже нельзя. В документации Python указано, что `__slots__` явно объявляет data members и запрещает создание `__dict__` и `__weakref__`, если они не объявлены явно или не доступны от родителя. \n\nПример:\n```python\nclass User:\n    __slots__ = (\"name\", \"age\")\n\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n\n\nuser = User(\"Alex\", 20)\n\nuser.name = \"Bob\"      # можно\nuser.age = 21          # можно\n\nuser.email = \"a@mail\"  # AttributeError\n```\n\nОшибка:\n```text\nAttributeError: 'User' object has no attribute 'email'\n```\n\nПотому что `email` не указан в `__slots__`.\n\n### Почему так происходит\nОбычно экземпляры классов хранят свои атрибуты в специальном словаре:\n```python\nobj.__dict__\n```\n\nПример без `__slots__`:\n```python\nclass User:\n    pass\n\n\nuser = User()\nuser.name = \"Alex\"\nuser.age = 20\n\nprint(user.__dict__)\n```\n\nРезультат:\n```python\n{'name': 'Alex', 'age': 20}\n```\n\nА при использовании `__slots__` Python не создаёт обычный `__dict__` для каждого экземпляра, если только ты явно не добавил `\"__dict__\"` в `__slots__`. Поэтому набор допустимых атрибутов становится фиксированным. \n```python\nclass User:\n    __slots__ = (\"name\", \"age\")\n\n\nuser = User()\nuser.name = \"Alex\"\n\nprint(user.__dict__)\n```\n\nБудет ошибка:\n```text\nAttributeError: 'User' object has no attribute '__dict__'\n```\n\n### Но ограничение можно отключить через `\"__dict__\"`\n```python\nclass User:\n    __slots__ = (\"name\", \"__dict__\")\n\n\nuser = User()\nuser.name = \"Alex\"\nuser.age = 20\n\nprint(user.__dict__)\n```\n\nРезультат:\n```python\n{'age': 20}\n```\n\nЗдесь `name` хранится в slot, а произвольные новые атрибуты, например `age`, могут храниться в `__dict__`.\n\n### Важный момент про наследование\nОграничение работает только для класса, где объявлены `__slots__`, и зависит от родителей/наследников.\n```python\nclass Base:\n    __slots__ = (\"name\",)\n\n\nclass Child(Base):\n    pass\n```\n\nУ `Child` снова появится `__dict__`, потому что подкласс не объявил свои `__slots__`.\n```python\nchild = Child()\nchild.name = \"Alex\"\nchild.age = 20  # можно\n```\n\nЧтобы подкласс тоже был ограничен, нужно указать `__slots__` и в нём:\n```python\nclass Base:\n    __slots__ = (\"name\",)\n\n\nclass Child(Base):\n    __slots__ = (\"age\",)\n```\n\nТеперь:\n```python\nchild = Child()\nchild.name = \"Alex\"\nchild.age = 20\nchild.email = \"a@mail\"  # AttributeError\n```\n\n### Для чего используют `__slots__`\nГлавные цели:\n\n|Цель|Смысл|\n|---|---|\n|Ограничить набор атрибутов|нельзя случайно добавить `obj.emial` вместо `obj.email`|\n|Сэкономить память|не создаётся `__dict__` на каждый объект|\n|Немного ускорить доступ к атрибутам|атрибуты хранятся в фиксированных slot-ах|\n\n### Итог\nДа, `__slots__` ограничивает создание новых атрибутов объекта, но только если у экземпляра нет `__dict__`.\n\nКоротко:\n```python\nclass User:\n    __slots__ = (\"name\",)\n```\n\nЗначит:\n```python\nuser.name = \"Alex\"  # можно\nuser.age = 20       # нельзя\n```\n\nА вот так ограничение снимается:\n```python\nclass User:\n    __slots__ = (\"name\", \"__dict__\")\n```\n\nТогда объект снова сможет получать произвольные новые атрибуты."
  popularity = 2.63

[[questions]]
  id = 33
  question = "В какой структуре данных хранятся атрибуты объекта"
  answer = "### Обычно атрибуты объекта хранятся в `__dict__`\nУ обычного э\n```python\nobj.__dict__\n```\n\nПример:\n```python\nclass User:\n    pass\n\n\nuser = User()\nuser.name = \"Alex\"\nuser.age = 20\n\nprint(user.__dict__)\n```\n\nРезультат:\n```python\n{'name': 'Alex', 'age': 20}\n```\n\nТо есть после:\n```python\nuser.name = \"Alex\"\n```\n\nPython фактически сохраняет значение примерно так:\n```python\nuser.__dict__[\"name\"] = \"Alex\"\n```\n\nОфициальная документация Python указывает, что без `__slots__` у экземпляров доступен `__dict__`, а `__slots__` как раз может запретить автоматическое создание `__dict__`. \n\n### У класса тоже есть `__dict__`\nАтрибуты класса хранятся в namespace класса:\n```python\nclass User:\n    role = \"admin\"\n\nprint(User.__dict__)\n```\n\nТам будут лежать:\n```python\n{\n    \"__module__\": \"__main__\",\n    \"role\": \"admin\",\n    ...\n}\n```\n\nНо `User.__dict__` обычно отображается как `mappingproxy`, то есть read-only обёртка над словарём класса:\n```python\nprint(type(User.__dict__))\n```\n\nПримерный результат:\n```python\n<class 'mappingproxy'>\n```\n\nМенять напрямую так нельзя:\n```python\nUser.__dict__[\"role\"] = \"guest\"  # TypeError\n```\n\nНо можно через обычное присваивание:\n```python\nUser.role = \"guest\"\n```\n\n### Разница между атрибутами объекта и класса\n```python\nclass User:\n    role = \"guest\"      # атрибут класса\n\n    def __init__(self, name):\n        self.name = name  # атрибут объекта\n```\n\nИспользование:\n```python\nuser = User(\"Alex\")\n\nprint(user.__dict__)  # {'name': 'Alex'}\nprint(User.__dict__)  # содержит role, __init__, __module__ и т.д.\n```\n\n`self.name` хранится в словаре конкретного объекта:\n```python\nuser.__dict__\n```\n\n`role` хранится в словаре класса:\n```python\nUser.__dict__\n```\n\n### Что меняется при `__slots__`\nЕсли класс использует `__slots__`, экземпляр может не иметь `__dict__`:\n```python\nclass User:\n    __slots__ = (\"name\", \"age\")\n\n\nuser = User()\nuser.name = \"Alex\"\nuser.age = 20\n\nprint(user.__dict__)\n```\n\nБудет ошибка:\n```python\nAttributeError: 'User' object has no attribute '__dict__'\n```\n\nВ этом случае атрибуты хранятся не в обычном словаре экземпляра, а в заранее выделенных слотах. Документация Python описывает `__slots__` как механизм, который объявляет допустимые поля экземпляра и предотвращает автоматическое создание `__dict__`, если он явно не добавлен. ([Python documentation](https://docs.python.org/3/reference/datamodel.html?utm_source=chatgpt.com \"3. Data model — Python 3.14.5 documentation\"))\n\nМожно вернуть `__dict__` явно:\n```python\nclass User:\n    __slots__ = (\"name\", \"__dict__\")\n\n\nuser = User()\nuser.name = \"Alex\"\nuser.age = 20\n\nprint(user.__dict__)\n```\n\nРезультат:\n```python\n{'age': 20}\n```\n\n### Итог\nОбычно:\n```text\nатрибуты экземпляра -> obj.__dict__\nатрибуты класса     -> Class.__dict__\n```\n\nНо если используется `__slots__`, то экземпляр может не иметь `__dict__`, и его атрибуты будут храниться в slot-структуре, а не в обычном словаре."
  popularity = 2.63

[[questions]]
  id = 34
  question = "Можно ли применить декоратор к классу?"
  answer = "### Да, декоратор можно применить к классу\nВ Python декоратор можно применять не только к функции или методу, но и к **классу**.\n\nПример:\n```python\ndef add_repr(cls):\n    def __repr__(self):\n        return f\"{cls.__name__}({self.__dict__})\"\n\n    cls.__repr__ = __repr__\n    return cls\n\n\n@add_repr\nclass User:\n    def __init__(self, name):\n        self.name = name\n\n\nuser = User(\"Alex\")\nprint(user)\n```\n\nРезультат:\n```text\nUser({'name': 'Alex'})\n```\n\n### Что происходит внутри\nЗапись:\n```python\n@add_repr\nclass User:\n    ...\n```\n\nпримерно равна такой записи:\n```python\nclass User:\n    ...\n\nUser = add_repr(User)\n```\n\nТо есть порядок такой:\n```text\n1. Python создаёт объект класса User.\n2. Передаёт этот объект в декоратор add_repr.\n3. Декоратор возвращает класс или другой объект.\n4. Имя User связывается с результатом декоратора.\n```\n\nОфициальная документация Python описывает, что после создания объекта класса он передаётся декораторам класса, а результат связывается с именем класса. \n\n### Декоратор класса может изменить класс\nНапример, можно добавить атрибут:\n```python\ndef add_role(cls):\n    cls.role = \"admin\"\n    return cls\n\n\n@add_role\nclass User:\n    pass\n\n\nprint(User.role)  # admin\n```\n\nЗдесь декоратор получил класс `User`, добавил ему атрибут `role` и вернул тот же класс.\n\n### Декоратор класса может заменить класс\nДекоратор не обязан возвращать тот же самый класс:\n```python\ndef replace_class(cls):\n    class Wrapper:\n        pass\n\n    return Wrapper\n\n\n@replace_class\nclass User:\n    pass\n\n\nprint(User)\n```\n\nЗдесь имя `User` после декоратора будет ссылаться уже не на исходный класс, а на `Wrapper`.\n\n### Реальный пример: `@dataclass`\nОдин из самых популярных примеров декоратора класса — `@dataclass`:\n```python\nfrom dataclasses import dataclass\n\n\n@dataclass\nclass User:\n    name: str\n    age: int\n```\n\n`@dataclass` обрабатывает класс и автоматически добавляет специальные методы, например `__init__`, `__repr__`, `__eq__`. Документация `dataclasses` прямо описывает этот модуль как предоставляющий декоратор для автоматического добавления сгенерированных специальных методов к пользовательским классам. \n\n### Несколько декораторов класса\nМожно применить несколько декораторов:\n```python\n@decorator1\n@decorator2\nclass User:\n    pass\n```\n\nЭто примерно то же самое:\n```python\nclass User:\n    pass\n\nUser = decorator1(decorator2(User))\n```\n\nТо есть ближайший к классу декоратор применяется первым.\n\n### Итог\nДа, к классу можно применить декоратор.\nДекоратор класса:\n```text\nполучает объект класса\nможет изменить его\nможет вернуть тот же класс\nможет вернуть другой объект\nрезультат связывается с именем класса\n```"
