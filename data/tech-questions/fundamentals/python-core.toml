  question = "Что такое self в методах класса?"
  answer = "`self` — это ссылка на **текущий экземпляр класса** (на самого себя).\n\n**Как работает**\n```python\nclass Person:\n    def __init__(self, name):  # self — новый объект\n        self.name = name        # сохраняем имя В ЭТОТ объект\n\n    def hello(self):            # self — конкретный объект\n        print(f\"Привет, я {self.name}\")\n\np = Person(\"Анна\")  # self внутри = p\np.hello()          # self внутри = p → \"Привет, я Анна\"\n```\n\n**Что происходит на самом деле**\n```python\np.hello()          # Python превращает в:\nPerson.hello(p)    # self = p (объект передается первым аргументом)\n```\n\n**Главные правила**\n1. **Первый параметр** любого метода экземпляра — `self`\n2. **Не нужно передавать** при вызове — Python подставляет автоматически\n3. **Через self** обращаемся к атрибутам и методам объекта\n\n**Итоги**\n- `self` — это сам объект, от которого вызван метод\n- Нужен для доступа к атрибутам и другим методам\n- Без `self` метод не знает, с каким именно объектом работать\n- Можно назвать по-другому, но все используют `self`"
  popularity = 2.63

[[questions]]
  id = 21
  question = "Является ли класс объектом в модели данных?"
  answer = "### Да, класс в Python — это объект\nВ модели данных Python **всё является объектом**: числа, строки, функции, модули, классы и даже сам код. Официальная документация Python прямо говорит: все данные в программе представлены объектами или отношениями между объектами. ([Python documentation](https://docs.python.org/3/reference/datamodel.html?utm_source=chatgpt.com \"3. Data model — Python 3.14.5 documentation\"))\n\nПример:\n```python\nclass User:\n    pass\n\nprint(type(User))\n```\n\nРезультат:\n```python\n<class 'type'>\n```\n\n\n### Что это означает\nКогда ты пишешь:\n```python\nclass User:\n    pass\n```\nPython создаёт **объект класса** `User`.\n\nТо есть `User` — не просто “описание” для будущих объектов. Это полноценный объект, у которого есть:\n```python\nUser.__name__\nUser.__dict__\nUser.__bases__\nUser.__mro__\n```\n\nНапример:\n```python\nclass User:\n    role = \"admin\"\n\nprint(User.__name__)   # User\nprint(User.role)       # admin\n```\n\n### Связь с экземплярами\n```python\nuser = User()\n```\n\nЗдесь:\n```python\nUser\n```\n— объект класса.\n\nА:\n```python\nuser\n```\n— объект-экземпляр этого класса.\n\nПроверка:\n```python\nprint(type(user))  # <class '__main__.User'>\nprint(type(User))  # <class 'type'>\n```\n\nТо есть:\n```python\nuser -> экземпляр класса User\nUser -> экземпляр метакласса type\n```\n\n### Итоговая схема\n```text\nuser является объектом класса User\nUser является объектом класса type\ntype тоже является объектом\n```\n\nКоротко:\n```python\nisinstance(User, object)  # True\nisinstance(User, type)    # True\n```\n\n### Вывод\nДа, **класс является объектом в модели данных Python**.\n\nБолее точно: **класс — это объект, который обычно является экземпляром метакласса `type`**. Через это и работают `classmethod`, метаклассы, динамическое создание классов и доступ к атрибутам самого класса."
  popularity = 2.63

