  question = "Что такое и зачем нужны метаклассы?"
  answer = "### Что такое метакласс\nМетакласс — это класс, который создаёт другие классы.\nОбычный объект создаётся классом:\n```python\nuser = User()\n```\nА сам класс `User` создаётся метаклассом:\n```python\nclass User:\n    pass\n```\nУпрощённо это можно представить так:\n```python\nUser = type(\"User\", (object,), {})\n```\nТо есть `type` — стандартный метакласс в Python. Официальная документация описывает создание класса как процесс, где выбирается метакласс, подготавливается namespace, выполняется тело класса, а затем создаётся объект класса. ([Python documentation](https://docs.python.org/3/reference/datamodel.html?utm_source=chatgpt.com \"3. Data model — Python 3.14.6 documentation\"))\n\n### Главная схема\n```text\nэкземпляр → создаётся классом\nкласс     → создаётся метаклассом\n```\n\nПример:\n```python\nclass User:\n    pass\n\n\nuser = User()\n\nprint(type(user))  # <class '__main__.User'>\nprint(type(User))  # <class 'type'>\n```\nЗдесь:\n```text\nuser — экземпляр класса User\nUser — экземпляр метакласса type\n```\n\n### Зачем нужны метаклассы\nМетаклассы нужны, когда нужно управлять не отдельными объектами, а самими классами в момент их создания или вызова.\n\nОни позволяют:\n1. Проверять структуру класса при его создании.\n2. Автоматически добавлять методы или атрибуты в класс.\n3. Регистрировать классы в общем реестре.\n4. Изменять поведение вызова класса `Class(...)`.\n5. Управлять `isinstance()` и `issubclass()`.\n6. Создавать фреймворки, ORM, сериализаторы, декларативные API.\n\nНа практике метаклассы чаще нужны не в обычном бизнес-коде, а внутри библиотек и фреймворков.\n\n### Пример без метакласса\nДопустим, есть базовый класс для обработчиков:\n```python\nclass Handler:\n    pass\n\n\nclass UserHandler(Handler):\n    pass\n\n\nclass OrderHandler(Handler):\n    pass\n```\nНужно автоматически собирать все классы-наследники в реестр.\n\nМожно сделать вручную:\n```python\nregistry = {}\n\n\nclass UserHandler:\n    pass\n\n\nregistry[\"UserHandler\"] = UserHandler\n```\nНо это легко забыть.\n\n### Пример с метаклассом\n```python\nclass RegistryMeta(type):\n    registry = {}\n\n    def __new__(mcls, name, bases, namespace):\n        cls = super().__new__(mcls, name, bases, namespace)\n\n        if name != \"BaseHandler\":\n            mcls.registry[name] = cls\n\n        return cls\n\n\nclass BaseHandler(metaclass=RegistryMeta):\n    pass\n\n\nclass UserHandler(BaseHandler):\n    pass\n\n\nclass OrderHandler(BaseHandler):\n    pass\n\n\nprint(RegistryMeta.registry)\n```\n\nРезультат:\n```text\n{\n    'UserHandler': <class '__main__.UserHandler'>,\n    'OrderHandler': <class '__main__.OrderHandler'>\n}\n```\nЧто произошло:\n```text\nсоздался класс UserHandler  → метакласс автоматически добавил его в registry\nсоздался класс OrderHandler → метакласс автоматически добавил его в registry\n```\nТо есть метакласс сработал не при создании объекта `UserHandler()`, а при создании самого класса `UserHandler`.\n\n### Где метакласс вмешивается\nПри создании класса Python может вызвать методы метакласса:\n```text\nMeta.__prepare__ → подготовка namespace класса\nMeta.__new__     → создание объекта класса\nMeta.__init__    → инициализация объекта класса\n```\nДокументация Python указывает, что `__prepare__` метакласса вызывается для подготовки пространства имён класса перед выполнением тела класса. ([Python documentation](https://docs.python.org/3/reference/datamodel.html?utm_source=chatgpt.com \"3. Data model — Python 3.14.6 documentation\"))\n\nПример:\n```python\nclass Meta(type):\n    @classmethod\n    def __prepare__(mcls, name, bases):\n        print(\"__prepare__\")\n        return {}\n\n    def __new__(mcls, name, bases, namespace):\n        print(\"__new__\")\n        return super().__new__(mcls, name, bases, namespace)\n\n    def __init__(cls, name, bases, namespace):\n        print(\"__init__\")\n        super().__init__(name, bases, namespace)\n\n\nclass User(metaclass=Meta):\n    pass\n```\nВывод:\n```text\n__prepare__\n__new__\n__init__\n```\n\n### Метакласс и вызов класса\nКогда ты пишешь:\n```python\nuser = User()\n```\nвызывается не `User.__call__`, а `type(User).__call__`.\nТо есть:\n```python\nuser = User()\n```\nпримерно означает:\n```python\nuser = type(User).__call__(User)\n```\nА внутри стандартного `type.__call__` обычно вызываются:\n```text\nUser.__new__(User, ...)\nUser.__init__(obj, ...)\n```\nМетакласс может перехватить этот процесс:\n```python\nclass Meta(type):\n    def __call__(cls, *args, **kwargs):\n        print(\"Перед созданием объекта\")\n        obj = super().__call__(*args, **kwargs)\n        print(\"После создания объекта\")\n        return obj\n\n\nclass User(metaclass=Meta):\n    def __init__(self, name):\n        self.name = name\n\n\nuser = User(\"Alex\")\n```\nВывод:\n```text\nПеред созданием объекта\nПосле создания объекта\n```\nЭто можно использовать, например, для singleton, кеширования, логирования создания объектов, контроля аргументов.\n\n### Пример: запретить создавать класс без нужного метода\n```python\nclass ServiceMeta(type):\n    def __new__(mcls, name, bases, namespace):\n        if name != \"BaseService\" and \"execute\" not in namespace:\n            raise TypeError(f\"Класс {name} должен определить метод execute\")\n\n        return super().__new__(mcls, name, bases, namespace)\n\n\nclass BaseService(metaclass=ServiceMeta):\n    pass\n\n\nclass UserService(BaseService):\n    def execute(self):\n        print(\"Работаем\")\n\n\nclass BadService(BaseService):\n    pass\n```\nПри создании `BadService` будет ошибка:\n```text\nTypeError: Класс BadService должен определить метод execute\n```\nВажно: ошибка возникнет сразу при определении класса, а не потом во время работы программы.\n\n### Метаклассы и `ABCMeta`\nОдин из реальных примеров метакласса в стандартной библиотеке — `ABCMeta` из модуля `abc`.\nОн нужен для абстрактных базовых классов:\n```python\nfrom abc import ABC, abstractmethod\n\n\nclass BaseRepository(ABC):\n    @abstractmethod\n    def get(self, id):\n        pass\n```\n`ABC` использует механизм абстрактных базовых классов, а инфраструктура находится в модуле `abc`; документация прямо описывает этот модуль как инфраструктуру для определения abstract base classes. ([Python documentation](https://docs.python.org/3/library/abc.html?utm_source=chatgpt.com \"abc — Abstract Base Classes\"))\n\nБез реализации абстрактного метода объект создать нельзя:\n```python\nclass UserRepository(BaseRepository):\n    pass\n\n\nrepo = UserRepository()  # TypeError\n```\nТо есть метакласс здесь помогает контролировать правила создания экземпляров.\n\n### Метаклассы и дескрипторы\nПри создании нового класса стандартный метакласс `type` сканирует словарь класса и вызывает `__set_name__()` у дескрипторов, если он определён. Это описано в официальном Descriptor HowTo Guide.\n\nПример:\n```python\nclass Field:\n    def __set_name__(self, owner, name):\n        self.name = name\n\n\nclass User:\n    username = Field()\n```\nКогда создаётся класс `User`, `type` вызывает:\n```python\nField.__set_name__(field, User, \"username\")\n```\nЭто активно используется в ORM, валидаторах, serializers, моделях и декларативных API.\n\n### Когда метаклассы действительно нужны\nМетакласс оправдан, если нужно влиять на сам класс:\n```text\nкласс должен автоматически регистрироваться\nкласс должен проверяться при создании\nклассу нужно автоматически добавлять методы/атрибуты\nнужно изменить поведение Class(...)\nнужно изменить isinstance()/issubclass()\nстроится фреймворк или декларативный API\n```\nНапример, ORM-модель:\n```python\nclass User(Model):\n    id = IntegerField()\n    username = StringField()\n```\nВ таких системах фреймворк должен на этапе создания класса понять:\n```text\nкакие поля объявлены\nкакие у них имена\nкакая таблица соответствует модели\nкакие ограничения есть у полей\n```\nЭто можно делать через метаклассы, `__init_subclass__` и дескрипторы.\n\n### Когда метаклассы не нужны\nВо многих случаях вместо метакласса лучше использовать более простые механизмы:\n\n|Задача|Часто лучше использовать|\n|---|---|\n|Добавить поведение объекту|обычное наследование|\n|Обернуть метод|декоратор|\n|Проверить данные|`__init__`, Pydantic, dataclass|\n|Зарегистрировать подклассы|`__init_subclass__`|\n|Управлять атрибутом|descriptor или `property`|\n|Создать объект особым способом|фабрика|\n\nНапример, регистрацию подклассов можно сделать без метакласса:\n```python\nclass BaseHandler:\n    registry = {}\n\n    def __init_subclass__(cls, **kwargs):\n        super().__init_subclass__(**kwargs)\n        BaseHandler.registry[cls.__name__] = cls\n\n\nclass UserHandler(BaseHandler):\n    pass\n\n\nclass OrderHandler(BaseHandler):\n    pass\n\n\nprint(BaseHandler.registry)\n```\n`__init_subclass__` проще, чем метакласс, и часто его достаточно."
