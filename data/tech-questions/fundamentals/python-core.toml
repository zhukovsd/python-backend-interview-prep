  question = "Какие магические методы определены в базовом метаклассе?"
  answer = "Базовый метакласс — это `type`.\nОбычный класс в Python сам является объектом, а его типом обычно является `type`:\n```python\nclass User:\n    pass\n\n\nprint(type(User))  # <class 'type'>\n```\nДокументация Python указывает, что по умолчанию классы создаются через `type`, а результатом выполнения тела класса становится вызов примерно вида `type(name, bases, namespace)`.\n\n### Основные магические методы `type`\nКлючевые dunder-методы базового метакласса:\n\n|Метод|За что отвечает|\n|---|---|\n|`__prepare__`|Подготавливает namespace класса перед выполнением тела класса|\n|`__new__`|Создаёт объект класса|\n|`__init__`|Инициализирует уже созданный объект класса|\n|`__call__`|Вызывается, когда класс вызывают как функцию: `User(...)`|\n|`__instancecheck__`|Настраивает поведение `isinstance(obj, Class)`|\n|`__subclasscheck__`|Настраивает поведение `issubclass(SubClass, Class)`|\n|`__getattribute__`|Отвечает за доступ к атрибутам класса|\n|`__setattr__`|Отвечает за присваивание атрибутов класса|\n|`__delattr__`|Отвечает за удаление атрибутов класса|\n|`__repr__`|Строковое представление класса|\n|`__dir__`|Поведение `dir(Class)`|\n|`__sizeof__`|Размер объекта класса в памяти|\n|`__subclasses__`|Получение списка прямых подклассов|\n|`__or__`|Поддержка `A|\n|`__ror__`|Отражённая операция `|\n\n### Самые важные для понимания метаклассов\nПрактически на собеседованиях чаще всего ожидают не весь список, а эти методы:\n```python\n__prepare__\n__new__\n__init__\n__call__\n```\nИх порядок при создании класса примерно такой:\n```text\n__prepare__ → тело класса → __new__ → __init__\n```\nДокументация описывает процесс создания класса так: определяется метакласс, подготавливается namespace, выполняется тело класса, затем создаётся объект класса.\n\n### `type.__prepare__`\n`__prepare__` вызывается до выполнения тела класса.\nОн создаёт namespace, куда попадут атрибуты и методы класса:\n```python\nclass Meta(type):\n    @classmethod\n    def __prepare__(mcls, name, bases, **kwargs):\n        print(\"__prepare__\")\n        return {}\n\n    def __new__(mcls, name, bases, namespace, **kwargs):\n        print(\"__new__\")\n        return super().__new__(mcls, name, bases, namespace)\n\n    def __init__(cls, name, bases, namespace, **kwargs):\n        print(\"__init__\")\n        super().__init__(name, bases, namespace)\n\n\nclass User(metaclass=Meta):\n    age = 20\n```\nВывод:\n```text\n__prepare__\n__new__\n__init__\n```\n`__prepare__` должен быть реализован как classmethod; возвращённый им namespace передаётся в `__new__`.\n\n### `type.__new__`\n`__new__` метакласса создаёт сам класс.\nНе экземпляр класса, а именно объект класса:\n```python\nclass User:\n    pass\n```\nУпрощённо превращается в:\n```python\nUser = type(\"User\", (), {})\n```\nВо время создания класса через `type.__new__` Python также обрабатывает дескрипторы с `__set_name__` и вызывает `__init_subclass__` у родительского класса.\n\n### `type.__init__`\n`__init__` метакласса инициализирует уже созданный класс.\nПример:\n```python\nclass Meta(type):\n    def __new__(mcls, name, bases, namespace):\n        print(\"Создаём класс\")\n        return super().__new__(mcls, name, bases, namespace)\n\n    def __init__(cls, name, bases, namespace):\n        print(\"Инициализируем класс\")\n        super().__init__(name, bases, namespace)\n\n\nclass User(metaclass=Meta):\n    pass\n```\n`__new__` создаёт класс, `__init__` настраивает созданный класс.\n\n### `type.__call__`\n`__call__` метакласса срабатывает, когда ты вызываешь класс:\n```python\nuser = User()\n```\nУпрощённо это работает так:\n```python\nuser = type.__call__(User)\n```\nА внутри `type.__call__` обычно происходит:\n```python\nUser.__new__(User, ...)\nUser.__init__(obj, ...)\n```\nДокументация указывает, что классы являются вызываемыми объектами, обычно работают как фабрики своих экземпляров, а аргументы вызова передаются в `__new__` и обычно затем в `__init__`.\n\nПример:\n```python\nclass Meta(type):\n    def __call__(cls, *args, **kwargs):\n        print(\"Вызвали класс как функцию\")\n        return super().__call__(*args, **kwargs)\n\n\nclass User(metaclass=Meta):\n    def __init__(self, name):\n        self.name = name\n\n\nuser = User(\"Alex\")\n```\nВывод:\n```text\nВызвали класс как функцию\n```\n\n### `type.__instancecheck__` и `type.__subclasscheck__`\nЭти методы отвечают за проверки:\n```python\nisinstance(obj, SomeClass)\nissubclass(Child, Parent)\n```\n\n| Метод               | Используется для              |\n| ------------------- | ----------------------------- |\n| `__instancecheck__` | `isinstance(instance, class)` |\n| `__subclasscheck__` | `issubclass(subclass, class)` |\n\nДокументация отдельно указывает, что эти методы ищутся именно на метаклассе класса, а не как обычные classmethod внутри самого класса.\n\nПример:\n```python\nclass Meta(type):\n    def __instancecheck__(cls, instance):\n        print(\"__instancecheck__\")\n        return True\n\n\nclass User(metaclass=Meta):\n    pass\n\n\nprint(isinstance(123, User))\n```\nВывод:\n```text\n__instancecheck__True\n```\n\n### Проверка через Python\nМожно посмотреть dunder-имена, которые есть прямо в `type.__dict__`:\n```python\nfor name in sorted(type.__dict__):\n    if name.startswith(\"__\") and name.endswith(\"__\"):\n        print(name)\n```\nВ актуальном Python среди них будут примерно такие:\n```python\n__abstractmethods__\n__annotations__\n__base__\n__bases__\n__basicsize__\n__call__\n__delattr__\n__dict__\n__dictoffset__\n__dir__\n__doc__\n__flags__\n__getattribute__\n__init__\n__instancecheck__\n__itemsize__\n__module__\n__mro__\n__name__\n__new__\n__or__\n__prepare__\n__qualname__\n__repr__\n__ror__\n__setattr__\n__sizeof__\n__subclasscheck__\n__subclasses__\n__text_signature__\n__type_params__\n__weakrefoffset__\n```\nНо важно: не всё из этого — методы. Часть — это специальные атрибуты/дескрипторы класса, например:\n```python\n__name__\n__qualname__\n__bases__\n__mro__\n__dict__\n__doc__\n__module__\n```"
  popularity = 2.63

