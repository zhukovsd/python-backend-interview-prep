  question = "Как связаны магические методы и метаклассы в объектной модели?"
  answer = "### Связь простая: магические методы ищутся на типе объекта\nВ Python каждый объект имеет тип. Тип обычного объекта — это его класс. Тип класса — это его метакласс.\n```python\nclass User:\n    pass\n\n\nuser = User()\n\nprint(type(user))  # <class '__main__.User'>\nprint(type(User))  # <class 'type'>\n```\nТо есть:\n```text\nuser → объект\nUser → класс user\ntype → метакласс класса User\n```\nДокументация Python описывает это так: каждый объект имеет identity, type и value; тип определяет операции, которые объект поддерживает.\n\n### Магические методы управляют поведением объекта через его тип\nКогда ты пишешь:\n```python\nlen(obj)\nobj[key]\nobj + other\nobj()\n```\nPython не просто ищет метод в самом объекте. Он смотрит на тип объекта.\n\nНапример:\n```python\nobj[key]\n```\nпримерно превращается в:\n```python\ntype(obj).__getitem__(obj, key)\n```\nВ документации Python прямо сказано: если класс определяет `__getitem__()`, то `x[i]` для экземпляра `x` примерно эквивалентен `type(x).__getitem__(x, i)`.\n\nОтсюда главное правило:\n```text\nмагические методы объекта ищутся на его классе\nмагические методы класса ищутся на его метаклассе\n```\n\n### Обычный случай: dunder-методы в классе управляют экземплярами\n```python\nclass User:\n    def __init__(self, name):\n        self.name = name\n\n    def __str__(self):\n        return f\"User: {self.name}\"\n\n    def __call__(self):\n        return f\"Called {self.name}\"\n\n\nuser = User(\"Alex\")\n\nprint(user)     # User: Alex\nprint(user())   # Called Alex\n```\nЗдесь:\n```python\nstr(user) → User.__str__(user)\nuser()    → User.__call__(user)\n```\nТо есть `User.__str__` и `User.__call__` управляют поведением экземпляра `user`.\n\n### Метакласс: dunder-методы метакласса управляют классом\nКласс `User` сам является объектом. Его тип — `type`, либо пользовательский метакласс.\nПоэтому когда ты делаешь:\n```python\nuser = User()\n```\nPython вызывает не `User.__call__`, а `type(User).__call__`.\nОбычно это:\n```python\ntype.__call__(User, ...)\n```\nА внутри уже вызываются:\n```python\nUser.__new__(User, ...)\nUser.__init__(obj, ...)\n```\nПример:\n```python\nclass Meta(type):\n    def __call__(cls, *args, **kwargs):\n        print(\"Метакласс перехватил вызов класса\")\n        return super().__call__(*args, **kwargs)\n\n\nclass User(metaclass=Meta):\n    def __init__(self, name):\n        self.name = name\n\n\nuser = User(\"Alex\")\n```\nВывод:\n```\nМетакласс перехватил вызов класса\n```\nЗдесь `User(\"Alex\")` перехватывает не сам `User`, а его метакласс `Meta`.\n\n### Важное различие\n```python\nclass User:\n    def __call__(self):\n        print(\"Вызвали экземпляр\")\n\n\nuser = User()\n\nuser()  # работает\nUser()  # просто создаёт объект\n```\n`User.__call__` делает вызываемым экземпляр `user`.\n\nНо чтобы изменить поведение самого вызова класса `User()`, нужен `__call__` в метаклассе:\n```python\nclass Meta(type):\n    def __call__(cls, *args, **kwargs):\n        print(\"Вызвали класс\")\n        return super().__call__(*args, **kwargs)\n\n\nclass User(metaclass=Meta):\n    pass\n\n\nUser()\n```\nТо есть:\n\n|Где определён `__call__`|Что становится вызываемым|\n|---|---|\n|В обычном классе|Экземпляр|\n|В метаклассе|Сам класс|\n\n### Как это связано с `object` и `type`\n```python\nprint(isinstance(user, User))    # True\nprint(isinstance(User, type))    # True\nprint(issubclass(User, object))  # True\nprint(issubclass(type, object))  # True\n```\n`object` даёт базовое поведение обычным объектам: `__repr__`, `__str__`, `__eq__`, `__hash__`, `__getattribute__`, `__setattr__` и так далее.\n\n`type` даёт базовое поведение классам: создание класса, вызов класса, работа с атрибутами класса, проверка `isinstance` / `issubclass`.\n\n### Создание класса тоже идёт через dunder-методы метакласса\nКогда Python выполняет:\n```python\nclass User:\n    name = \"Alex\"\n```\nУпрощённо происходит:\n```python\nUser = type(\"User\", (object,), {\"name\": \"Alex\"})\n```\nПроцесс создания класса включает несколько этапов:\n```text\nвыбор метакласса\nподготовка namespace через __prepare__\nвыполнение тела класса\nсоздание объекта класса через метакласс\n```\nДокументация Python описывает порядок создания класса так: разрешаются MRO entries, определяется подходящий метакласс, подготавливается namespace, выполняется тело класса, затем создаётся объект класса.\nНапример:\n```python\nclass Meta(type):\n    @classmethod\n    def __prepare__(mcls, name, bases):\n        print(\"__prepare__\")\n        return {}\n\n    def __new__(mcls, name, bases, namespace):\n        print(\"__new__\")\n        return super().__new__(mcls, name, bases, namespace)\n\n    def __init__(cls, name, bases, namespace):\n        print(\"__init__\")\n        super().__init__(name, bases, namespace)\n\n\nclass User(metaclass=Meta):\n    pass\n```\nВывод:\n```text\n__prepare__\n__new__\n__init__\n```\nТо есть:\n```text\nMeta.__prepare__ → готовит пространство имён класса\nMeta.__new__     → создаёт объект класса\nMeta.__init__    → инициализирует объект класса\n```\nДокументация указывает, что `__prepare__` вызывается у метакласса для подготовки namespace, а после выполнения тела класса объект класса создаётся вызовом `metaclass(name, bases, namespace, **kwds)`.\n\n### Метакласс может влиять на `isinstance` и `issubclass`\nНекоторые dunder-методы работают именно на уровне метакласса:\n```python\nclass Meta(type):\n    def __instancecheck__(cls, instance):\n        print(\"__instancecheck__\")\n        return True\n\n\nclass User(metaclass=Meta):\n    pass\n\n\nprint(isinstance(123, User))\n```\nВывод:\n```text\n__instancecheck__\nTrue\n```\nДокументация Python указывает, что `__instancecheck__` и `__subclasscheck__` используются для переопределения поведения `isinstance()` и `issubclass()`, причём эти методы ищутся именно на типе класса, то есть на метаклассе.\n\n### Почему нельзя просто записать dunder-метод в экземпляр\nСпециальные методы для синтаксиса обычно ищутся не в конкретном объекте, а на его типе.\n\nНапример:\n```python\nclass Box:\n    pass\n\n\nbox = Box()\n\nbox.__len__ = lambda: 10\n\nprint(box.__len__())  # 10\nprint(len(box))       # TypeError\n```\nПочему?\nПотому что `len(box)` ищет `__len__` не в `box.__dict__`, а на уровне класса:\n```\ntype(box).__len__\n```\n\nТо есть нужно так:\n```python\nclass Box:\n    def __len__(self):\n        return 10\n\n\nbox = Box()\n\nprint(len(box))  # 10\n```\nЭто же правило работает и для классов как объектов: чтобы изменить поведение самого класса, нужно менять его тип, то есть метакласс.\n\n### Сводная схема\n```text\nЭкземпляр:\n    user.__str__?      — нет, Python смотрит в User.__str__\n    user + other       — User.__add__\n    len(user)          — User.__len__\n    user()             — User.__call__\n\nКласс:\n    User()             — type(User).__call__\n    isinstance(x, User) — type(User).__instancecheck__\n    issubclass(A, User) — type(User).__subclasscheck__\n    User.attr          — type(User).__getattribute__\n```\n\n### Итог\nМагические методы — это механизм, через который Python подключает объекты к синтаксису языка.\n\nМетаклассы — это классы для классов.\n\nСвязь такая:\n```text\ndunder-методы обычного класса управляют экземплярами\ndunder-методы метакласса управляют самими классами\n```\n"
