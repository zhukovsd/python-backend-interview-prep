  question = "Какой метод вызывается при удалении объекта?"
  answer = "**Основной метод: `__del__()`**\n```python\nclass MyClass:\n    def __del__(self):\n        print(\"Объект удаляется\")\n\nobj = MyClass()\ndel obj  # Явное удаление → вызов __del__\n```\n\n**Важные особенности**\n1. **`__del__` — деструктор**, но работает **не так, как в других языках**\n2. **`del` не гарантирует немедленный вызов** `__del__`\n3. Вызывается **сборщиком мусора**, когда объект действительно удаляется\n4. При циклических ссылках может **не вызваться вообще**\n5. Исключения внутри `__del__` **подавляются**\n\n**Главный недостаток**\n```python\nobj = MyClass()\ndel obj  # __del__ может вызваться сейчас... а может через секунду\n```\n**Нет гарантии**, когда именно выполнится `__del__`\n\n**Альтернатива**\nДля гарантированной очистки используйте **контекстные менеджеры**:\n```python\nclass Resource:\n    def __enter__(self): ...\n    def __exit__(self, *args): ...  # ← Гарантированно выполнится\n\nwith Resource() as r:  # __exit__ вызовется сразу после блока\n    pass\n```\n\n**Итоги**\n- `__del__` существует, но **ненадежен** для критической очистки\n- Используйте **`with` и контекстные менеджеры** для гарантированного освобождения ресурсов\n- `__del__` лучше вообще не использовать в реальном коде"
  popularity = 2.63

