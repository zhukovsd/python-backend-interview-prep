  question = "Как выполняется Python-код интерпретатором?"
  answer = "В CPython Python-код обычно проходит такую цепочку:\n```text\n.py файл\n↓\nлексический и синтаксический разбор\n↓\nAST\n↓\nbytecode\n↓\ncode object\n↓\nвыполнение виртуальной машиной CPython\n```\n\nPython не выполняет `.py` файл как текст построчно в прямом смысле. Сначала исходный код компилируется во внутреннее представление — байткод, а уже байткод выполняется интерпретатором.\n\n### 1. Python читает исходный код\n\nНапример, есть файл:\n```python\nx = 10\ny = 20\nprint(x + y)\n```\n\nКогда запускаешь:\n```bash\npython main.py\n```\n\nинтерпретатор читает исходный код из файла `main.py`.\n\n### 2. Код разбирается на токены и синтаксическую структуру\nPython сначала анализирует текст программы: ключевые слова, имена, операторы, отступы, строки, числа и другие элементы синтаксиса.\n\nНапример:\n```python\nx = 10\n```\n\nразбирается примерно как:\n```text\nимя x\nоператор =\nчисло 10\n```\n\nНа этом этапе Python может обнаружить синтаксические ошибки:\n```python\nif True\n    print(\"Hello\")\n```\n\nОшибка:\n```text\nSyntaxError: expected ':'\n```\n\n\n### 3. Создаётся AST\nПосле синтаксического разбора Python строит **AST** — abstract syntax tree, абстрактное синтаксическое дерево.\n\nПример:\n```python\nx = 1 + 2\n```\n\nлогически превращается в дерево:\n\n```text\nAssign\n├── target: x\n└── value: BinOp\n    ├── left: 1\n    ├── op: +\n    └── right: 2\n```\n\nМодуль `ast` в стандартной библиотеке Python позволяет работать с такими деревьями; документация указывает, что AST можно получить через `ast.parse()` или `compile(..., flags=ast.PyCF_ONLY_AST)`, а затем скомпилировать в code object через `compile()`. \n\n### 4. AST компилируется в байткод\nДальше Python компилирует AST в **байткод**.\n\nБайткод — это набор низкоуровневых инструкций для виртуальной машины Python, а не машинный код процессора.\n\nПример:\n```python\ndef add(a, b):\n    return a + b\n```\n\nМожно посмотреть байткод через `dis`:\n```python\nimport dis\n\ndef add(a, b):\n    return a + b\n\ndis.dis(add)\n```\n\nМодуль `dis` предназначен для анализа байткода Python; он умеет показывать инструкции, соответствующие функции, строке исходного кода или code object. \n### 5. Создаётся code object\n\nРезультатом компиляции становится **code object**.\n\nНапример:\n```python\ncode = compile(\"x = 10\\nprint(x)\", \"<string>\", \"exec\")\n```\n\n`compile()` компилирует исходный код в code object или AST object. Документация указывает, что code object может быть выполнен через `exec()` или `eval()`. \n\nПример:\n```python\ncode = compile(\"x = 10\\nprint(x)\", \"<string>\", \"exec\")\n\nexec(code)\n```\n\nРезультат:\n```text\n10\n```\n\n### 6. Байткод выполняется виртуальной машиной CPython\nВиртуальная машина CPython выполняет инструкции байткода одну за другой.\n\nУпрощённо:\n```text\nвзять следующую инструкцию байткода\nпонять, что она делает\nвыполнить её\nперейти к следующей инструкции\n```\n\nНапример, для выражения:\n```python\nx + y\n```\n\nбайткод может делать примерно следующее:\n```text\nзагрузить x\nзагрузить y\nвыполнить сложение\nвернуть результат\n```\n\nЭто не точный байткод для всех версий Python, потому что инструкции меняются между версиями.\n\n### 7. При импорте модулей байткод кешируется в `.pyc`\n\nКогда Python импортирует модуль, он может сохранить скомпилированный байткод в файл `.pyc` внутри папки `__pycache__`.\n\nНапример:\n```text\n__pycache__/module.cpython-312.pyc\n```\n\nPython FAQ указывает, что при первом импорте модуля или изменении исходного файла может быть создан `.pyc` файл в `__pycache__`, чтобы ускорить загрузку модуля в будущем.\n\nВажно: `.pyc` не делает Python “скомпилированным в машинный код”. Это всё ещё байткод для виртуальной машины Python.\n\n### Важное уточнение: Python компилируется, но не как C++\nPython часто называют интерпретируемым языком, но в CPython есть этап компиляции:\n```text\nисходный код -> байткод\n```\n\nОднако это не такая компиляция, как в C/C++/Rust:\n```text\nисходный код -> машинный код процессора\n```\n\nВ обычном CPython:\n```text\nисходный код Python -> байткод Python -> выполнение виртуальной машиной\n```\n\n### Пример полного процесса\nКод:\n```python\ndef add(a, b):\n    return a + b\n\nprint(add(2, 3))\n```\n\nЧто происходит:\n```text\n1. Python читает исходный код.\n2. Проверяет синтаксис.\n3. Строит AST.\n4. Компилирует AST в байткод.\n5. Создаёт code object.\n6. Выполняет байткод.\n7. Создаёт объект функции add.\n8. Вызывает print.\n9. Вызывает add(2, 3).\n10. Выполняет байткод функции add.\n11. Возвращает 5.\n12. print выводит 5.\n```\n\n### Что происходит при определении функции\nКогда Python видит:\n```python\ndef add(a, b):\n    return a + b\n```\nон не выполняет тело функции сразу.\nОн создаёт объект функции `add`, внутри которого лежит code object тела функции.\n\nТело выполнится только при вызове:\n```python\nadd(2, 3)\n```\n\nТо есть:\n```text\ndef создаёт функцию\nвызов функции выполняет её тело\n```\n\n### Что происходит при определении класса\nКогда Python видит:\n```python\nclass User:\n    name = \"Alex\"\n```\nон выполняет тело класса и создаёт объект класса `User`.\n\nУпрощённо:\n```text\n1. создать namespace класса\n2. выполнить тело класса в этом namespace\n3. передать имя, bases и namespace метаклассу\n4. получить объект класса\n5. связать имя User с этим объектом\n```\n\nЭто связано с тем, что класс в Python — тоже объект.\n\n### Итоговая схема\n```text\nmain.py\n↓\nисходный текст\n↓\nтокены\n↓\nсинтаксический разбор\n↓\nAST\n↓\nбайткод\n↓\ncode object\n↓\nвиртуальная машина CPython\n↓\nвыполнение программы\n```\n"
  popularity = 2.63

[[questions]]
  id = 50
  question = "Что такое и зачем нужен pip"
  answer = "**PIP** (Pip Installs Packages) — это стандартная система управления пакетами в Python. Это инструмент командной строки, который позволяет устанавливать, удалять и управлять дополнительными библиотеками и зависимостями, не входящими в стандартную библиотеку Python. Он взаимодействует с Python Package Index (PyPI), чтобы находить, загружать и устанавливать пакеты.\n\n### **🛠 Основные возможности**\n**Установка пакетов**\n```bash\n# Установка последней версии\npip install requests\n\n# Установка конкретной версии\npip install django==4.2.0\n\n# Установка из файла требований\npip install -r requirements.txt\n```\n\n**Поиск и информация**\n```bash\n# Поиск пакетов в репозитории\npip search \"web framework\"\n\n# Показать информацию о пакете\npip show django\n\n# Список установленных пакетов\npip list\n```\n\n**Управление зависимостями**\n```bash\n# Генерация файла зависимостей\npip freeze > requirements.txt\n\n# Установка из файла зависимостей\npip install -r requirements.txt\n```\n\n**Обновление и удаление**\n```bash\n# Обновление пакета\npip install --upgrade requests\n\n# Удаление пакета\npip uninstall django\n\n# Проверка устаревших пакетов\npip list --outdated\n```\n\n**📁 Файл requirements.txt**\nФайл `requirements.txt` — это стандартный способ хранения списка зависимостей проекта:\n```txt\n# requirements.txt\nDjango==4.2.0\nrequests>=2.25.0\nnumpy<1.22.0\ncelery[redis]\n```\n\n**Генерирация список всех установленных пакетов**\n```\npip freeze > requirements.txt\n```\n\n**Установка всех зависимостей**\n```\npip install -r requirements.txt\n```\n\n**Установка в режиме разработки**\n```\npip install -r requirements/dev.txt\n```\n\n**Обновить все пакеты до последних версий**\n```\npip install --upgrade -r requirements.txt\n```\n\n### **⚡ Ключевые особенности**\n\n**Работа с репозиторием PyPI**\nPIP по умолчанию работает с **PyPI** (Python Package Index) — официальным репозиторием пакетов Python, содержащим тысячи библиотек.\n\n**Разрешение зависимостей**\nPIP автоматически определяет и устанавливает все необходимые зависимости пакетов, обеспечивая корректную работу устанавливаемых библиотек.\n\n**Виртуальные окружения**\nPIP часто используется вместе с `venv` для создания изолированных сред, где зависимости проекта не конфликтуют с системными пакетами.\n\n### **🚀 Практическое использование**\n\n### **Типичный рабочий процесс**\n```bash\n# Создание виртуального окружения\npython -m venv myproject_env\n\n# Активация окружения\nsource myproject_env/bin/activate  # Linux/Mac\nmyproject_env\\Scripts\\activate     # Windows\n\n# Установка зависимостей проекта\npip install -r requirements.txt\n\n# Добавление нового пакета\npip install fastapi\npip freeze > requirements.txt\n```\n\n### **Совместимость с системами**\n- Работает на всех основных ОС (Windows, Linux, macOS)\n- Поддерживает все версии Python (начиная с Python 3.4)\n- Интегрируется с инструментами CI/CD\n\n### **Безопасность**\n- Проверка цифровых подписей пакетов\n- Поддержка HTTPS для загрузки\n- Возможность использования приватных репозиториев"
  popularity = 2.63

[[questions]]
  id = 51
  question = "Что такое пакет и модуль, в чем их разница?"
  answer = "**Модуль** — это файл, содержащий код Python, который может быть повторно использован в других программах.\n\n**Пакет** — это директория, содержащая один или несколько модулей (или пакетов внутри пакетов), а также специальный файл `__init__`.py, который выполняется при импорте пакета. Он может содержать код, который инициализирует переменные, функции и классы, и становится доступным для использования внутри модулей, находящихся внутри этого пакета. Это обеспечивает общую функциональность для всех модулей, находящихся внутри пакета.\n\nНапример, если у нас есть пакет mypackage, в нем может находится несколько модулей, таких как module1.py, module2.py. В файле `__init__`.py определяются функции и переменные, которые могут использоваться внутри module1 и module2. Некоторые примеры импорта:\n\n```python\nimport mymodule # импортируем модуль\n\nfrom mypackage import mymodule # импортируем модуль из пакета\n\nfrom mypackage.mymodule import myfunction # импортируем функцию из модуля в пакете\n```\n\nПример со структурой файлов\n```python\nproject/\n    main.py\n    shapes/           # пакет\n        __init__.py   # обязательный файл для пакета\n        circle.py     # модуль в пакете\n        rectangle.py  # модуль в пакете\n\n# Импорт конкретного модуля из пакета\nfrom shapes import circle\n\nresult = circle.area(5)\nprint(result)  # 78.53975\n\n# Импорт функции напрямую из модуля пакета\nfrom shapes.rectangle import area\n\nresult = area(4, 6)\nprint(result)  # 24\n\n# Импорт всего пакета (требует настройки __init__.py)\nimport shapes\n\n# После настройки __init__.py можно использовать:\n# result = shapes.circle.circumference(3)\n```\n\nНастройка `__init__.py` необходима для корректного импорта всего пакета. Без неё команда import shapes загрузит пакет, но не предоставит прямого доступа к его модулям и функциям. Основная настройка включает определение списка `__all__`для контроля импорта через звёздочку и явный реэкспорт ключевых компонентов на верхний уровень пакета. Также в `__init__.py` обычно указывают метаданные пакета, такие как версия и автор, и могут размещать код инициализации, который выполняется при первом импорте.\n\nСтатья на хабре [Python модули и пакеты](https://habr.com/ru/articles/718828/)"
  popularity = 2.63

[[questions]]
  id = 52
  question = "Глубокое и поверхностное копирование"
  answer = "**Метод copy()** создает поверхностную копию объекта, то есть создает новый объект, который содержит ссылки на те же объекты, что и исходный объект. Если вы измените какой-либо из этих объектов, изменения отразятся и на копии, и на исходном объекте.\n\n**Метод deepcopy()** создает глубокую копию объекта, то есть создает новый объект, который содержит копии всех объектов, на которые ссылаются элементы исходного объекта. Если вы измените какой-либо из этих объектов, изменения не отразятся на копии или на исходном объекте.\n\n```python\nimport copy\n\n# создание копии объекта\n    new_list = old_list.copy()\n\n# создание глубокой копии объекта\n    new_list = copy.deepcopy(old_list)\nгде old_list - исходный список, а new_list - его копия.\n```\n\n_Примечание_: для выполнения глубокого копирования объектов, сами объекты также должны поддерживать копирование. Если объекты в ваших данных не поддерживают копирование, deepcopy() вернет исходный объект, а не его копию.\n\n**Управление копированием через `__copy__` и `__deepcopy__`**\n\n**Метод `__copy__`**\n\nПозволяет кастомизировать поверхностное копирование. Когда вы определяете этот метод в классе, copy.copy() будет использовать вашу реализацию вместо стандартной.\n\nЧто можно контролировать:\n\n- Какие атрибуты копировать, а какие нет\n- Как именно создавать копии отдельных полей\n- Какие данные сбрасывать/обновлять в копии\n\n**Метод `__deepcopy__`**\n\nПозволяет кастомизировать глубокое копирование. Принимает дополнительный параметр memo — словарь для отслеживания уже скопированных объектов.\n\nЧто можно контролировать:\n\n- Глубину копирования для разных атрибутов\n- Обработку циклических ссылок\n- Оптимизацию процесса (например, не копировать неизменяемые объекты)"
  popularity = 7.89

[[questions]]
  id = 53
  question = "Что такое магичекие (dunder) методы"
  answer = "**Магические методы** (иногда также называемые специальными методами или dunder-методами от \"double underscore methods\" — то есть \"методы с двойным подчеркиванием\", то есть начинаются и заканчиваются двумя подчеркиваниями (например, `__init__()`). Это специальные методы, которые необходимы для реализации базовых операций над объектами. Благодаря этим методам объекты могут реализовывать, поддерживать и взаимодействовать с базовыми конструкциями языка, а именно:\n\n- итерирование\n- коллекции\n- доступ к атрибутам\n- перегрузка операторов\n- контекстные менеджеры\n- вызов методов\n- создание и уничтожение объектов\n\nМагические они потому, что почти никогда не вызываются явно. Их вызывают встроенные функции или синтаксические конструкции. Например, функция len() вызывает метод **`__len__()`** переданного объекта. Метод **`__add__`**(self, other) вызывается автоматически при сложении оператором +.\n\n**Какие есть магические методы и для чего они используются?**\n1. **`__init__(self, ...)`:** Вызывается при создании нового экземпляра класса и используется для инициализации его атрибутов.\n\n2. **`__repr__(self)`:** Возвращает формальное строковое представление объекта, которое должно быть максимально точным и однозначным. В идеале эта строка должна быть валидным Python-кодом, который можно использовать для воссоздания объекта. Используется в первую очередь для отладки разработчиками.\n\n3. **`__str__(self)`:** Возвращает неформальное строковое представление объекта, ориентированное на удобочитаемость. Это то, что видят пользователи при вызове print() или str(). Если `__str__` не определён, Python использует `__repr__` как запасной вариант.\n\n4. **`__len__(self)`:** Возвращает длину объекта. Это используется, когда объект поддерживает операцию получения длины, например, для строк, списков и т. д.\n\n5. **`__getitem__(self, key)`:** Позволяет объекту поддерживать доступ к элементам по индексу, как это делают списки и словари.\n\n6. **`__setitem__(self, key, value)`:** Позволяет объекту устанавливать значение элемента по ключу.\n\n7. **`__delitem__(self, key)`:** Позволяет объекту удалять элемент по ключу.\n\n8. **`__iter__(self)`:** Возвращает итератор для объекта, позволяя его использовать в циклах `for`.\n\n9. **`__next__(self)`:** Вызывается итератором для получения следующего элемента в последовательности.\n\n10. **`__enter__(self)`, `__exit__(self, exc_type, exc_value, traceback)`:** Позволяют объекту быть контекстным менеджером, что позволяет определять действия, которые должны выполняться при входе и выходе из контекста.\n\n\nЭто лишь несколько примеров магических методов, которые можно определить. Они предоставляют мощные средства для определения поведения объектов и делают Python гибким и выразительным.\n\nСтатья на хабре [Руководство по магическим методам в Питоне](https://habr.com/ru/articles/186608/)"
  popularity = 5.26

[[questions]]
  id = 54
  question = "Что такое Monkey Patching"
  answer = "Monkey patching — это техника изменения поведения кода во время выполнения путем динамической замены или добавления методов, или атрибутов в существующем объекте. Эта техника может быть полезна в том случае, когда изменения не могут быть внесены в существующий код, и требует минимальных изменений в существующем коде.\n\nНапример, можно добавить новый метод в класс в runtime, который наследуется от базового класса:\n\n```python\nclass MyBaseClass:\n    def my_method(self):\n        print('Hello from MyBaseClass')\n\ndef monkey_patch():\n    def new_method(self):\n        print('Hello from new_method')\n    MyBaseClass.my_method = new_method\n\nmonkey_patch()\nobj = MyBaseClass()\nobj.my_method()  # выведет \"Hello from new_method\"\n```\n\nВ этом примере мы добавляем новый метод `new_method()` в класс `MyBaseClass`, используя функцию `monkey_patch()`. После этого, вызов метода `obj.my_method()` выведет строку\n\n```text\nHello from new_method\n```\n\nВажно учитывать, что использование monkey patching может усложнить отладку и поддержку в будущем, поэтому следует использовать эту технику с осторожностью и только при необходимости."
  popularity = 2.63

[[questions]]
  id = 55
  question = "Работали ли вы с оператором * (звёздочка)? Что означает и для чего используется в Python?"
  answer = "Оператор `*` в Python используется в нескольких разных смыслах. Основные варианты:\n```text\n*      — умножение\n**     — возведение в степень\n*args  — собрать позиционные аргументы\n**kwargs — собрать именованные аргументы\n*iterable — распаковать iterable\n**dict — распаковать словарь в keyword-аргументы\n*      — ограничитель keyword-only параметров\n```\n\n### 1. Умножение\nСамое простое использование:\n```python\nx = 5 * 3\n\nprint(x)  # 15\n```\n\nДля чисел `*` означает умножение.\nТакже `*` работает с некоторыми последовательностями:\n```python\nprint(\"ha\" * 3)\nprint([1, 2] * 3)\n```\n\nРезультат:\n```text\nhahaha\n[1, 2, 1, 2, 1, 2]\n```\n\nТо есть для строк, списков, кортежей `*` может означать повторение.\n\n### 2. Возведение в степень через `**`\nДвойная звёздочка `**` используется для возведения в степень:\n```python\nx = 2 ** 3\n\nprint(x)  # 8\n```\n\nТо же самое можно сделать через `pow`:\n```python\nprint(pow(2, 3))  # 8\n```\n\n### 3. `*args` — сбор позиционных аргументов\nВ параметрах функции `*args` собирает лишние позиционные аргументы в кортеж:\n```python\ndef func(*args):\n    print(args)\n\n\nfunc(1, 2, 3)\n```\n\nРезультат:\n```text\n(1, 2, 3)\n```\n\nТо есть:\n```python\nfunc(1, 2, 3)\n```\n\nпревращается внутри функции в:\n```python\nargs = (1, 2, 3)\n```\n\nНазвание `args` не обязательно. Важна именно звёздочка:\n```python\ndef func(*values):\n    print(values)\n```\nНо по соглашению обычно пишут `*args`.\n\n### 4. `**kwargs` — сбор именованных аргументов\n`**kwargs` собирает лишние именованные аргументы в словарь:\n```python\ndef func(**kwargs):\n    print(kwargs)\n\n\nfunc(name=\"Alex\", age=20)\n```\n\nРезультат:\n```text\n{'name': 'Alex', 'age': 20}\n```\n\nТо есть:\n```python\nfunc(name=\"Alex\", age=20)\n```\n\nпревращается внутри функции в:\n```python\nkwargs = {\n    \"name\": \"Alex\",\n    \"age\": 20\n}\n```\n\nНазвание `kwargs` тоже не обязательно, но это стандартное соглашение.\n\n### 5. Распаковка iterable через `*`\nЗвёздочка может распаковывать список, кортеж, строку, range и другие iterable-объекты.\n\nПример:\n```python\nnumbers = [1, 2, 3]\n\nprint(*numbers)\n```\n\nРезультат:\n```text\n1 2 3\n```\n\nБез звёздочки:\n```python\nprint(numbers)\n```\n\nРезультат:\n```text\n[1, 2, 3]\n```\nСо звёздочкой список распаковывается в отдельные аргументы.\n\nПример с функцией:\n```python\ndef add(a, b, c):\n    return a + b + c\n\n\nvalues = [1, 2, 3]\n\nprint(add(*values))  # 6\n```\n\nФактически:\n```python\nadd(*values)\n```\n\nпревращается в:\n```python\nadd(1, 2, 3)\n```\n\n### 6. Распаковка словаря через `**`\nДвойная звёздочка распаковывает словарь в именованные аргументы:\n```python\ndef create_user(name, age):\n    print(name, age)\n\n\ndata = {\n    \"name\": \"Alex\",\n    \"age\": 20\n}\n\ncreate_user(**data)\n```\n\nРезультат:\n```text\nAlex 20\n```\n\nФактически:\n```python\ncreate_user(**data)\n```\n\nпревращается в:\n```python\ncreate_user(name=\"Alex\", age=20)\n```\n\nКлючи словаря должны совпадать с именами параметров функции.\n\n### 7. `*` при распаковке присваивания\n\nЗвёздочка может собрать “остаток” значений при распаковке:\n```python\na, *middle, b = [1, 2, 3, 4, 5]\n\nprint(a)\nprint(middle)\nprint(b)\n```\n\nРезультат:\n```text\n1\n[2, 3, 4]\n5\n```\n\nЗдесь:\n```text\na      -> первый элемент\nmiddle -> всё между первым и последним\nb      -> последний элемент\n```\n\nЕщё пример:\n```python\nfirst, *rest = [10, 20, 30]\n\nprint(first)  # 10\nprint(rest)   # [20, 30]\n```\n\n### 8. `*` для keyword-only параметров\n\nОдинокая звёздочка в параметрах функции означает: после неё аргументы можно передавать только по имени.\n```python\ndef create_user(name, *, age, city):\n    print(name, age, city)\n\n\ncreate_user(\"Alex\", age=20, city=\"Baku\")\n```\nТак можно.\n\nА так нельзя:\n```python\ncreate_user(\"Alex\", 20, \"Baku\")\n```\n\nБудет ошибка:\n```text\nTypeError\n```\nПотому что `age` и `city` находятся после `*`, значит они keyword-only.\n\nЭто часто используют, чтобы сделать вызов функции более явным:\n```python\ndef connect(host, *, timeout, retries):\n    ...\n```\n\nВызов:\n```python\nconnect(\"localhost\", timeout=5, retries=3)\n```\n\nТак читается лучше, чем:\n```python\nconnect(\"localhost\", 5, 3)\n```\n\n### 9. Комбинация обычных аргументов, `*args` и `**kwargs`\nЧастый вариант:\n```python\ndef func(a, b, *args, **kwargs):\n    print(a)\n    print(b)\n    print(args)\n    print(kwargs)\n\n\nfunc(1, 2, 3, 4, name=\"Alex\", age=20)\n```\n\nРезультат:\n```text\n1\n2\n(3, 4)\n{'name': 'Alex', 'age': 20}\n```\n\nРазбор:\n```text\na      -> 1\nb      -> 2\nargs   -> (3, 4)\nkwargs -> {'name': 'Alex', 'age': 20}\n```\n\n### 10. Связь с магическими методами\nОператор `*` связан с магическими методами:\n```text\na * b   -> __mul__\nb * a   -> __rmul__\na *= b  -> __imul__\na ** b  -> __pow__\n```\n\nПример:\n```python\nclass Number:\n    def __init__(self, value):\n        self.value = value\n\n    def __mul__(self, other):\n        return Number(self.value * other.value)\n\n\na = Number(2)\nb = Number(3)\n\nresult = a * b\n\nprint(result.value)  # 6\n```\n\nКогда Python видит:\n```python\na * b\n```\n\nон пытается вызвать:\n```python\na.__mul__(b)\n```\n\n### Итоговая схема\n```text\n* в Python может означать:\n\n1. умножение:\n   2 * 3\n\n2. повторение последовательности:\n   \"a\" * 3\n\n3. распаковку iterable:\n   func(*values)\n\n4. сбор позиционных аргументов:\n   def func(*args)\n\n5. сбор keyword-аргументов:\n   def func(**kwargs)\n\n6. распаковку словаря:\n   func(**data)\n\n7. сбор остатка при распаковке:\n   first, *rest = values\n\n8. разделитель keyword-only параметров:\n   def func(a, *, b)\n\n9. часть магических методов:\n   __mul__, __rmul__, __imul__, __pow__\n```\n\nКоротко: `*` — это не один оператор с одним смыслом, а синтаксический инструмент Python, который используется для умножения, распаковки, упаковки аргументов и ограничения способа передачи параметров."
  popularity = 2.63

[[questions]]
  id = 56
  question = "Что такое formatter в Python?"
  answer = "В Python слово `formatter` может означать разные вещи. Чаще всего под ним понимают одну из трёх сущностей:\n```text\n1. formatter строк\n   объект или механизм, который форматирует значения в строку\n\n2. formatter логов\n   объект logging.Formatter, который задаёт внешний вид сообщений логирования\n\n3. formatter кода\n   инструмент, который автоматически приводит Python-код к единому стилю\n```\n\nТо есть `formatter` — это не один конкретный оператор Python, а общее название для сущности, которая что-то форматирует.\n\n### 1. Formatter строк\nВ контексте строк formatter отвечает за подстановку и оформление значений внутри строки.\n\nПример через f-string:\n```python\nname = \"Alex\"\nage = 20\n\ntext = f\"User: {name}, age: {age}\"\n\nprint(text)\n```\n\nРезультат:\n```text\nUser: Alex, age: 20\n```\n\nЗдесь Python форматирует значения `name` и `age` в строку.\n\nМожно задавать правила форматирования:\n```python\nvalue = 3.14159\n\nprint(f\"{value:.2f}\")\n```\n\nРезультат:\n```text\n3.14\n```\n\nЗдесь:\n```text\n:.2f\n```\nозначает: вывести число с двумя знаками после запятой.\n\nОфициальная документация Python описывает f-strings, `str.format()` и format string syntax как механизмы форматирования строк. \n\n### 2. `string.Formatter`\nВ стандартной библиотеке есть класс:\n```python\nstring.Formatter\n```\n\nОн нужен для более низкоуровневого и настраиваемого форматирования строк.\n\nПример:\n```python\nfrom string import Formatter\n\nformatter = Formatter()\n\nresult = formatter.format(\"Hello, {name}\", name=\"Alex\")\n\nprint(result)\n```\n\nРезультат:\n```text\nHello, Alex\n```\n\nНа практике `string.Formatter` используют редко. Чаще используют:\n```text\nf-strings\nstr.format()\n```\n\nНапример:\n```python\nname = \"Alex\"\n\nprint(f\"Hello, {name}\")\nprint(\"Hello, {}\".format(name))\n```\n\nДокументация Python указывает, что `str.format()` и класс `Formatter` используют общий синтаксис format strings. \n\n### 3. Formatter в logging\nВ модуле `logging` formatter — это объект, который определяет, как будет выглядеть сообщение лога.\n\nПример:\n```python\nimport logging\n\nlogger = logging.getLogger(__name__)\nlogger.setLevel(logging.INFO)\n\nhandler = logging.StreamHandler()\n\nformatter = logging.Formatter(\n    \"%(asctime)s - %(levelname)s - %(message)s\"\n)\n\nhandler.setFormatter(formatter)\nlogger.addHandler(handler)\n\nlogger.info(\"User created\")\n```\n\nВывод будет примерно такой:\n```text\n2026-06-18 12:30:00,000 - INFO - User created\n```\n\nЗдесь `logging.Formatter` задаёт формат сообщения:\n```text\n%(asctime)s   -> время\n%(levelname)s -> уровень лога\n%(message)s   -> текст сообщения\n```\n\nТо есть formatter не пишет лог сам. Он только говорит handler-у, как оформить `LogRecord` перед выводом. Документация `logging` описывает `Formatter` как часть системы логирования, отвечающую за форматирование записей логов. \n\n### 4. Formatter кода\nТакже formatter может означать инструмент для автоматического форматирования Python-кода.\n\nНапример:\n```text\nBlack\nautopep8\nyapf\nruff format\n```\n\nТакие инструменты меняют внешний вид кода, но не должны менять его смысл.\n\nБыло:\n```python\ndef add( a,b ):\n    return a+b\n```\n\nПосле форматирования:\n```python\ndef add(a, b):\n    return a + b\n```\n\n`Black` в документации описан как opinionated code formatter: он автоматически приводит код к единому стилю, чтобы уменьшить споры о форматировании и упростить code review. "
  popularity = 2.63

[[questions]]
  id = 57
  question = "Магический метод __add__"
  answer = "`__add__` — это магический метод, который вызывается при использовании оператора `+`.\n\nТо есть выражение:\n```python\na + b\n```\n\nPython пытается выполнить через:\n```python\na.__add__(b)\n```\n\nОфициальная документация Python описывает `__add__` как специальный метод для реализации бинарной арифметической операции `+`\n\n### Простой пример\n```python\nclass Number:\n    def __init__(self, value):\n        self.value = value\n\n    def __add__(self, other):\n        return Number(self.value + other.value)\n\n\na = Number(10)\nb = Number(20)\n\nresult = a + b\n\nprint(result.value)\n```\n\nРезультат:\n```text\n30\n```\n\nКогда Python видит:\n```python\na + b\n```\n\nон вызывает:\n```python\na.__add__(b)\n```\n\nВнутри метода мы сами определяем, что значит “сложить” два объекта `Number`.\n\n### Как это работает по шагам\nКод:\n```python\nresult = a + b\n```\n\nУпрощённо превращается в:\n```text\n1. Python видит оператор +\n2. Проверяет левый объект a\n3. Ищет у его класса метод __add__\n4. Вызывает a.__add__(b)\n5. Возвращает результат\n```\n\nТо есть:\n```python\na + b\n```\n\nпримерно равно:\n```python\na.__add__(b)\n```\n\n### Пример с классом Vector\nБолее практичный пример:\n```python\nclass Vector:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def __add__(self, other):\n        return Vector(\n            self.x + other.x,\n            self.y + other.y\n        )\n\n    def __repr__(self):\n        return f\"Vector({self.x}, {self.y})\"\n\n\nv1 = Vector(2, 3)\nv2 = Vector(4, 5)\n\nprint(v1 + v2)\n```\n\nРезультат:\n```text\nVector(6, 8)\n```\n\nЗдесь мы определили, что сложение двух векторов означает:\n```text\nx складывается с x\ny складывается с y\n```\n\nТо есть:\n```text\nVector(2, 3) + Vector(4, 5)\n↓\nVector(2 + 4, 3 + 5)\n↓\nVector(6, 8)\n```\n\n### Проверка типа второго объекта\nВ хорошем коде обычно проверяют тип `other`.\n```python\nclass Vector:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def __add__(self, other):\n        if not isinstance(other, Vector):\n            return NotImplemented\n\n        return Vector(\n            self.x + other.x,\n            self.y + other.y\n        )\n```\n`NotImplemented` означает: этот класс не знает, как складываться с таким типом объекта.\n\nЭто лучше, чем сразу выбрасывать ошибку, потому что Python после этого может попробовать обратную операцию через `__radd__`.\n\n### Связь с `__radd__`\nЕсли левый объект не умеет складываться с правым, Python может попробовать метод правого объекта:\n```python\nb.__radd__(a)\n```\n\nПример:\n```python\nclass Number:\n    def __init__(self, value):\n        self.value = value\n\n    def __add__(self, other):\n        if isinstance(other, Number):\n            return Number(self.value + other.value)\n\n        return NotImplemented\n\n    def __radd__(self, other):\n        if isinstance(other, int):\n            return Number(other + self.value)\n\n        return NotImplemented\n\n\nx = Number(10)\n\nresult = 5 + x\n\nprint(result.value)\n```\n\nРезультат:\n```text\n15\n```\n\nЧто происходит:\n```text\n1. Python видит 5 + x\n2. Сначала пробует int.__add__(5, x)\n3. int не знает, как сложить int и Number\n4. Python пробует x.__radd__(5)\n5. Получает результат\n```\n\n### Связь с `__iadd__`\nДля операции:\n```python\na += b\n```\n\nPython может использовать:\n```python\na.__iadd__(b)\n```\nЭто in-place сложение.\n\nПример:\n```python\nclass Basket:\n    def __init__(self, items):\n        self.items = items\n\n    def __iadd__(self, other):\n        self.items.extend(other.items)\n        return self\n\n\nb1 = Basket([\"apple\"])\nb2 = Basket([\"banana\"])\n\nb1 += b2\n\nprint(b1.items)\n```\n\nРезультат:\n```text\n['apple', 'banana']\n```\n\nРазница:\n```text\n__add__  -> a + b\n__radd__ -> b + a, если левый объект не смог обработать операцию\n__iadd__ -> a += b\n```\n\n### Важный момент про неизменяемость\nОбычно `__add__` должен возвращать **новый объект**, а не менять текущий.\n\nНапример:\n```python\nclass Vector:\n    def __add__(self, other):\n        return Vector(self.x + other.x, self.y + other.y)\n```\nЭто ожидаемое поведение для `+`.\n\nА изменение текущего объекта больше подходит для `__iadd__`:\n```python\na += b\n```\n\n### Пример плохой реализации\nПлохо:\n```python\nclass Vector:\n    def __add__(self, other):\n        self.x += other.x\n        self.y += other.y\n        return self\n```\n\nПочему плохо:\n```text\nv1 + v2 неожиданно меняет v1\n```\nОператор `+` обычно ожидается как операция, которая создаёт результат, а не изменяет левый объект.\n\n### Итоговая схема\n```text\na + b\n↓\na.__add__(b)\n\nесли __add__ вернул NotImplemented:\n↓\nb.__radd__(a)\n\na += b\n↓\na.__iadd__(b), если он определён\n```"
  popularity = 2.63

