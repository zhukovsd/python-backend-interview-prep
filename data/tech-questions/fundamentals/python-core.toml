  id = 12
  question = "Менеджер контекста with"
  answer = "Контекстный менеджер — это объект, который управляет входом в некоторый контекст и выходом из него. Обычно он нужен для гарантированного освобождения ресурсов: закрыть файл, соединение с БД, транзакцию, lock, временно изменить состояние и потом вернуть обратно. В Python это реализуется через методы `__enter__()` и `__exit__()`, которые вызываются при входе и выходе из блока `with`. \n\nПример с файлом:\n```python\nwith open(\"data.txt\", \"r\", encoding=\"utf-8\") as file:\n    content = file.read()\n```\nЗдесь `with` гарантирует, что файл будет закрыт после выхода из блока, даже если внутри блока произойдёт исключение.\n\n### Как работает `with`\n\nКод:\n```python\nwith manager as value:\n    body\n```\nупрощённо работает так:\n```python\nmanager = manager_expression\n\nvalue = manager.__enter__()\n\ntry:\n    body\nexcept Exception as exc:\n    suppress = manager.__exit__(type(exc), exc, exc.__traceback__)\n    if not suppress:\n        raise\nelse:\n    manager.__exit__(None, None, None)\n```\nТо есть:\n```text\n__enter__ → вызывается перед входом в блок with\n__exit__  → вызывается при выходе из блока with\n```\n`__enter__()` возвращает значение, которое попадает в переменную после `as`, а `__exit__()` получает информацию об исключении, если оно произошло. \n\n### Пример своего контекстного менеджера\n```python\nclass FileManager:\n    def __init__(self, filename, mode):\n        self.filename = filename\n        self.mode = mode\n        self.file = None\n\n    def __enter__(self):\n        print(\"Открываем файл\")\n        self.file = open(self.filename, self.mode, encoding=\"utf-8\")\n        return self.file\n\n    def __exit__(self, exc_type, exc_value, traceback):\n        print(\"Закрываем файл\")\n        self.file.close()\n```\nИспользование:\n```python\nwith FileManager(\"data.txt\", \"w\") as file:\n    file.write(\"Hello\")\n```\n\nПорядок будет такой:\n```text\n1. Создаётся FileManager\n2. Вызывается __enter__\n3. Выполняется тело with\n4. Вызывается __exit__\n```\n\n### Аргументы `__exit__`\nМетод `__exit__` принимает три аргумента:\n```python\ndef __exit__(self, exc_type, exc_value, traceback):\n    ...\n```\n\n|Аргумент|Что означает|\n|---|---|\n|`exc_type`|Тип исключения|\n|`exc_value`|Сам объект исключения|\n|`traceback`|Traceback исключения|\nЕсли исключения не было, все три значения будут `None`.\n\nПример:\n```python\nclass Manager:\n    def __enter__(self):\n        print(\"Вход\")\n        return self\n\n    def __exit__(self, exc_type, exc_value, traceback):\n        if exc_type is None:\n            print(\"Вышли без ошибки\")\n        else:\n            print(f\"Произошла ошибка: {exc_value}\")\n\n        print(\"Выход\")\n\n\nwith Manager():\n    print(\"Работа внутри with\")\n```\nВывод:\n```text\nВход\nРабота внутри with\nВышли без ошибки\nВыход\n```\n\n### Подавление исключений\n`__exit__` может подавить исключение, если вернёт `True`.\n```python\nclass SuppressZeroDivision:\n    def __enter__(self):\n        return self\n\n    def __exit__(self, exc_type, exc_value, traceback):\n        if exc_type is ZeroDivisionError:\n            print(\"ZeroDivisionError подавлен\")\n            return True\n\n        return False\n\n\nwith SuppressZeroDivision():\n    result = 10 / 0\n\nprint(\"Программа продолжила работу\")\n```\nВывод:\n```text\nZeroDivisionError подавлен\nПрограмма продолжила работу\n```\nЕсли `__exit__` вернёт `False`, `None` или другое ложное значение, исключение пойдёт дальше.\n\n### Аналог через `try/finally`\n`with` часто заменяет такую конструкцию:\n```python\nfile = open(\"data.txt\", \"r\", encoding=\"utf-8\")\n\ntry:\n    content = file.read()\nfinally:\n    file.close()\n```\nЧерез `with` короче и безопаснее:\n```python\nwith open(\"data.txt\", \"r\", encoding=\"utf-8\") as file:\n    content = file.read()\n```\nPEP 343, который ввёл `with`, описывает его как способ вынести типичные случаи использования `try/finally` в отдельный переиспользуемый механизм.\n\n### Контекстный менеджер через `contextlib`\nНе всегда нужно писать класс. Можно использовать `@contextmanager`.\n```python\nfrom contextlib import contextmanager\n\n\n@contextmanager\ndef managed_resource():\n    print(\"Открываем ресурс\")\n\n    try:\n        yield \"resource\"\n    finally:\n        print(\"Закрываем ресурс\")\n\n\nwith managed_resource() as resource:\n    print(f\"Работаем с {resource}\")\n```\nВывод:\n```text\nОткрываем ресурс\nРаботаем с resource\nЗакрываем ресурс\n```\n`contextlib.contextmanager` позволяет создать контекстный менеджер из генераторной функции без отдельного класса с `__enter__` и `__exit__`. \n\n### Где используют `with`\nЧастые случаи:\n```python\n# Файлы\nwith open(\"file.txt\") as file:\n    data = file.read()\n\n# Блокировки\nwith lock:\n    shared_resource += 1\n\n# Транзакции\nwith transaction.atomic():\n    ...\n\n# Временное подавление исключений\nfrom contextlib import suppress\n\nwith suppress(FileNotFoundError):\n    remove_file()\n```\nВ backend-разработке `with` часто встречается при работе с файлами, транзакциями БД, lock-объектами, временными настройками, моками в тестах и управлением сетевыми/IO-ресурсами.\n\n### Асинхронный контекстный менеджер\nДля `async with` используются другие методы:\n```python\nclass AsyncManager:\n    async def __aenter__(self):\n        print(\"Асинхронный вход\")\n        return self\n\n    async def __aexit__(self, exc_type, exc_value, traceback):\n        print(\"Асинхронный выход\")\n```\nИспользование:\n```python\nasync with AsyncManager():\n    print(\"Работа внутри async with\")\n```\nЭто часто используется в асинхронных HTTP-клиентах, соединениях с БД и транзакциях.\n\n### Кратко\nКонтекстный менеджер — это объект, который реализует протокол:\n```python\n__enter__\n__exit__\n```\n`with` нужен, чтобы гарантированно выполнить код выхода:\n```text\nоткрыть ресурс → поработать → гарантированно закрыть ресурс\n```\n\nГлавная идея:\n```python\nwith resource:\n    work()\n```\nлучше, чем вручную писать:\n```python\ntry:\n    work()\nfinally:\n    cleanup()\n```"
