  question = "Магический метод __getattribute__"
  answer = "### Что такое `__getattribute__`\n\n`__getattribute__` — это магический метод, который вызывается **при любом обращении к атрибуту объекта**.\n\nСигнатура:\n```python\ndef __getattribute__(self, name):\n    ...\n```\n\nГде:\n```text\nself — объект\nname — имя атрибута, к которому обращаются\n```\n\nПример:\n```python\nclass User:\n    def __init__(self, name):\n        self.name = name\n\n    def __getattribute__(self, attr_name):\n        print(f\"Обращение к атрибуту: {attr_name}\")\n        return object.__getattribute__(self, attr_name)\n\n\nuser = User(\"Alex\")\n\nprint(user.name)\n```\n\nРезультат:\n```text\nОбращение к атрибуту: name\nAlex\n```\n\nОфициальная документация Python указывает, что `__getattribute__` вызывается безусловно при попытке доступа к атрибуту экземпляра класса. ([Python documentation](https://docs.python.org/3/reference/datamodel.html?utm_source=chatgpt.com \"3. Data model\"))\n\n### Чем отличается от `__getattr__`\nГлавное отличие:\n\n|Метод|Когда вызывается|\n|---|---|\n|`__getattribute__`|всегда при обращении к атрибуту|\n|`__getattr__`|только если обычный поиск атрибута не нашёл атрибут|\n\nПример:\n```python\nclass User:\n    def __init__(self):\n        self.name = \"Alex\"\n\n    def __getattribute__(self, attr_name):\n        print(\"__getattribute__:\", attr_name)\n        return object.__getattribute__(self, attr_name)\n\n    def __getattr__(self, attr_name):\n        print(\"__getattr__:\", attr_name)\n        return \"default\"\n\n\nuser = User()\n\nprint(user.name)\nprint(user.age)\n```\n\nРезультат:\n```text\n__getattribute__: name\nAlex\n__getattribute__: age\n__getattr__: age\ndefault\n```\n\nЧто произошло:\n```text\nuser.name:\n1. вызвался __getattribute__(\"name\")\n2. атрибут найден\n3. __getattr__ не вызывается\n\nuser.age:\n1. вызвался __getattribute__(\"age\")\n2. атрибут не найден\n3. возник AttributeError\n4. Python вызвал __getattr__(\"age\")\n```\n\n### Почему внутри нужно вызывать `object.__getattribute__`\nЕсли внутри `__getattribute__` обратиться к атрибуту обычным способом, можно получить бесконечную рекурсию.\n\nПлохо:\n```python\nclass User:\n    def __init__(self):\n        self.name = \"Alex\"\n\n    def __getattribute__(self, attr_name):\n        return self.name\n```\n\nПроблема:\n```text\nuser.name\n-> __getattribute__(\"name\")\n-> self.name\n-> __getattribute__(\"name\")\n-> self.name\n-> ...\n```\n\nВ итоге будет:\n```text\nRecursionError: maximum recursion depth exceeded\n```\n\nПравильно:\n```python\nclass User:\n    def __getattribute__(self, attr_name):\n        return object.__getattribute__(self, attr_name)\n```\n\nТак мы явно вызываем базовый механизм получения атрибута.\n\n### Пример контроля доступа\n```python\nclass User:\n    def __init__(self, name, password):\n        self.name = name\n        self.password = password\n\n    def __getattribute__(self, attr_name):\n        if attr_name == \"password\":\n            raise AttributeError(\"Доступ к password запрещён\")\n\n        return object.__getattribute__(self, attr_name)\n\n\nuser = User(\"Alex\", \"12345\")\n\nprint(user.name)      # Alex\nprint(user.password)  # AttributeError\n```\n\nЗдесь `__getattribute__` перехватывает любое обращение к атрибутам и запрещает чтение `password`.\n\n### Пример логирования доступа к атрибутам\n```python\nclass Config:\n    def __init__(self):\n        self.host = \"localhost\"\n        self.port = 5432\n\n    def __getattribute__(self, attr_name):\n        print(f\"Чтение атрибута: {attr_name}\")\n        return object.__getattribute__(self, attr_name)\n\n\nconfig = Config()\n\nprint(config.host)\nprint(config.port)\n```\n\nРезультат:\n```text\nЧтение атрибута: host\nlocalhost\nЧтение атрибута: port\n5432\n```\n\n### Связь с дескрипторами\nМеханизм дескрипторов (`property`, методы, `staticmethod`, `classmethod`, объекты с `__get__`) встроен в `__getattribute__`.\n\nНапример:\n```python\nclass User:\n    @property\n    def name(self):\n        return \"Alex\"\n\n\nuser = User()\n\nprint(user.name)\n```\n\nКогда выполняется:\n```python\nuser.name\n```\n\nPython идёт через `__getattribute__`, а внутри этого механизма срабатывает дескриптор `property`.\n\nВ официальном Descriptor HOWTO указано, что дескрипторы вызываются именно механизмом `__getattribute__`, и переопределение `__getattribute__` может нарушить автоматический вызов дескрипторов. \n\n### Упрощённый порядок поиска атрибута\nКогда пишем:\n```python\nobj.attr\n```\n\nPython примерно делает:\n```text\n1. вызывает obj.__getattribute__(\"attr\")\n2. внутри обычного механизма ищет data descriptor в классе\n3. ищет attr в obj.__dict__\n4. ищет non-data descriptor или обычный атрибут в классе\n5. ищет по MRO в родителях\n6. если ничего не найдено — возникает AttributeError\n7. если есть __getattr__, вызывается __getattr__(\"attr\")\n```\n\n`__getattribute__` стоит в самом начале этой цепочки.\n\n### Когда использовать `__getattribute__`\nЕго используют редко, потому что он очень низкоуровневый.\nТипичные случаи:\n```text\nпроксирование доступа к другому объекту\nлогирование всех обращений к атрибутам\nленивая загрузка атрибутов\nконтроль доступа\nсоздание ORM-подобного поведения\nсоздание специальных proxy/wrapper-объектов\n```\n\nВо многих обычных задачах лучше использовать:\n```text\n@property\n__getattr__\nдескрипторы\n```\n\n`__getattribute__` нужен, когда требуется перехватывать **вообще все** обращения к атрибутам.\n\n### Итог\n`__getattribute__` — это главный метод перехвата доступа к атрибутам.\nКоротко:\n```python\nobj.attr\n```\n\nпочти всегда проходит через:\n```python\nobj.__getattribute__(\"attr\")\n```\n\nГлавное отличие от `__getattr__`:\n```text\n__getattribute__ вызывается всегда\n__getattr__ вызывается только если атрибут не найден\n```\n\nИ главное правило при переопределении:\n```python\nreturn object.__getattribute__(self, attr_name)\n```\n\nИначе очень легко получить бесконечную рекурсию или сломать работу дескрипторов."
  popularity = 2.63

