  id = 59
  question = "Что представляет собой функциональный подход к программированию?"
  answer = "Функциональное программирование — это стиль программирования, где программа строится вокруг функций, а не вокруг изменения состояния объектов или последовательного выполнения команд.\n\nГлавная идея:  \n**данные подаются на вход функции → функция возвращает новый результат → старые данные не изменяются.**\n\nПример обычного императивного подхода:\n```python\nnumbers = [1, 2, 3, 4]\nresult = []\n\nfor number in numbers:\n    result.append(number * 2)\n\nprint(result)\n```\nФункциональный стиль:\n```python\nnumbers = [1, 2, 3, 4]\n\nresult = list(map(lambda number: number * 2, numbers))\n\nprint(result)\n```\n\n### Основные идеи\n1. **Чистые функции**\nЧистая функция зависит только от входных данных и не меняет внешний мир.\n```python\ndef add(a, b):\n    return a + b\n```\nЭто чистая функция: передали `2` и `3`, всегда получили `5`.\n\nНечистая функция:\n```python\ntotal = 0\n\ndef add_to_total(x):\n    global total\n    total += x\n```\nОна меняет внешнюю переменную `total`, поэтому результат зависит не только от аргументов.\n\n2. **Неизменяемость данных**\nВ функциональном стиле стараются не менять существующие данные, а создавать новые.\n```python\nnumbers = [1, 2, 3]\n\nnew_numbers = numbers + [4]\n```\nА не так:\n```python\nnumbers.append(4)\n```\nТо есть меньше мутаций — меньше неожиданных побочных эффектов.\n\n3. **Функции как значения**\nФункцию можно передавать в другую функцию, сохранять в переменную и возвращать из функции. Это называется функциями первого класса. Например, MDN описывает функции первого класса как функции, которые можно передавать как аргументы, возвращать из других функций и присваивать переменным.\n```python\ndef apply_operation(x, operation):\n    return operation(x)\n\ndef square(n):\n    return n * n\n\nprint(apply_operation(5, square))  # 25\n```\n\n4. **Функции высшего порядка**\nЭто функции, которые принимают другие функции или возвращают функции.\nПримеры в Python:\n```python\nmap()\nfilter()\nfunctools.reduce()\n```\nОфициальная документация Python отдельно описывает функциональный стиль и такие инструменты, как `map`, `filter`, `reduce`, генераторы и итераторы.\n\n### Зачем это нужно\nФункциональный подход помогает писать код, который:\n- легче тестировать;\n- проще читать при работе с преобразованием данных;\n- меньше зависит от глобального состояния;\n- лучше подходит для цепочек обработки данных;\n- часто проще распараллеливать, потому что функции меньше конфликтуют из-за общего состояния.\n\nНапример:\n```python\nusers = [\n    {\"name\": \"Alex\", \"age\": 17},\n    {\"name\": \"Bob\", \"age\": 20},\n    {\"name\": \"John\", \"age\": 15},\n]\n\nadult_names = [\n    user[\"name\"]\n    for user in users\n    if user[\"age\"] >= 18\n]\n\nprint(adult_names)  # ['Bob']\n```\nЗдесь мы не меняем исходный список `users`, а получаем новый результат.\n\n### В чём отличие от ООП\nВ ООП основной акцент на объектах:\n```python\nuser.activate()\norder.calculate_total()\n```\nВ функциональном подходе основной акцент на функциях и данных:\n```python\nactivate_user(user)\ncalculate_total(order)\n```\nВ ООП объект часто хранит состояние внутри себя.  \nВ функциональном подходе состояние стараются явно передавать в функцию и получать новое состояние как результат.\n\n### Где используется\nФункциональный стиль есть в Python, JavaScript, Scala, Kotlin, F#, Clojure, Haskell и других языках. Haskell, например, официально описывается как чисто функциональный язык с неизменяемостью и ссылочной прозрачностью.\n\nPython не является чисто функциональным языком, но поддерживает функциональные элементы: функции первого класса, `lambda`, `map`, `filter`, `reduce`, генераторные выражения и comprehension-синтаксис."
