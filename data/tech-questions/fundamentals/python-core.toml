  question = "Какие параметры передаются в __exit__ у контекстного менеджера?"
  answer = "### Параметры `__exit__`\nСигнатура обычного контекстного менеджера:\n```python\ndef __exit__(self, exc_type, exc_value, traceback):\n    ...\n```\nВ `__exit__` передаются три параметра, описывающие исключение, из-за которого произошёл выход из блока `with`. Если исключения не было, все три параметра равны `None`. Это указано в Python Data Model. ([Python documentation](https://docs.python.org/3/reference/datamodel.html?utm_source=chatgpt.com \"3. Data model — Python 3.14.4 documentation\"))\n\n|Параметр|Что означает|\n|---|---|\n|`exc_type`|Тип исключения, например `ZeroDivisionError`|\n|`exc_value`|Сам объект исключения, например объект с сообщением `division by zero`|\n|`traceback`|Объект traceback, то есть информация о стеке вызовов|\n\nПример:\n```python\nclass Manager:\n    def __enter__(self):\n        print(\"Вход в with\")\n        return self\n\n    def __exit__(self, exc_type, exc_value, traceback):\n        print(\"exc_type:\", exc_type)\n        print(\"exc_value:\", exc_value)\n        print(\"traceback:\", traceback)\n```\n\n### Если исключения не было\n```python\nwith Manager():\n    print(\"Работа без ошибки\")\n```\nПримерный вывод:\n```text\nВход в with\nРабота без ошибки\nexc_type: None\nexc_value: None\ntraceback: None\n```\nТо есть при нормальном выходе Python вызывает:\n```python\n__exit__(None, None, None)\n```\n\n### Если исключение было\n```python\nwith Manager():\n    10 / 0\n```\nПримерный вывод:\n```text\nВход в with\nexc_type: <class 'ZeroDivisionError'>\nexc_value: division by zero\ntraceback: <traceback object at 0x...>\n```\nТо есть Python вызывает примерно:\n```python\n__exit__(ZeroDivisionError, ZeroDivisionError(\"division by zero\"), traceback)\n```\nPEP 343 описывает этот механизм как передачу в `__exit__` типа исключения, значения исключения и traceback. \n\n### Возвращаемое значение `__exit__`\n`__exit__` может управлять тем, будет ли исключение подавлено.\nЕсли вернуть `True`, исключение подавляется:\n```python\nclass SuppressZeroDivision:\n    def __enter__(self):\n        return self\n\n    def __exit__(self, exc_type, exc_value, traceback):\n        if exc_type is ZeroDivisionError:\n            print(\"ZeroDivisionError подавлен\")\n            return True\n\n        return False\n\n\nwith SuppressZeroDivision():\n    10 / 0\n\nprint(\"Код продолжил работу\")\n```\nЕсли вернуть `False`, `None` или любое ложное значение, исключение не подавляется и пробрасывается дальше. Это поведение также описано в документации Python для `with` и `contextlib`: истинное значение из `__exit__` может подавить исключение.\n\n### Кратко\n```python\ndef __exit__(self, exc_type, exc_value, traceback):\n    ...\n```\nГде:\n```text\nexc_type   → класс исключения\nexc_value  → объект исключения\ntraceback  → traceback исключения\n```\nПри нормальном выходе:\n```python\n__exit__(None, None, None)\n```\nПри ошибке:\n```python\n__exit__(type(error), error, error.__traceback__)\n```"
  popularity = 2.63

[[questions]]
  id = 14
  question = "С какими типами ресурсов обычно используют контекстные менеджеры и почему это удобно?"
  answer = "### Где обычно используют контекстные менеджеры\nКонтекстные менеджеры используют там, где есть ресурс или состояние, которое нужно гарантированно освободить, закрыть или вернуть в исходное состояние. В Python `with` вызывает `__enter__()` при входе в блок и `__exit__()` при выходе из него; PEP 343 описывает `with` как способ вынести типичные случаи `try/finally` в переиспользуемый механизм. \n\n### 1. Файлы\nСамый частый пример:\n```python\nwith open(\"data.txt\", \"r\", encoding=\"utf-8\") as file:\n    data = file.read()\n```\nПочему удобно:\n```text\nфайл открылся → файл прочитали → файл гарантированно закрылся\n```\nБез `with` пришлось бы писать так:\n```python\nfile = open(\"data.txt\", \"r\", encoding=\"utf-8\")\n\ntry:\n    data = file.read()\nfinally:\n    file.close()\n```\n`with` короче и безопаснее, потому что `__exit__()` вызовется даже при исключении внутри блока.\n\n### 2. Соединения с базой данных\nНапример, соединение или транзакция:\n```python\nwith connection:\n    cursor.execute(\"INSERT INTO users VALUES (...)\")\n```\nИдея:\n```text\nоткрыть соединение / начать транзакцию\nвыполнить операции\nзакрыть соединение / зафиксировать или откатить транзакцию\n```\nЭто удобно, потому что при ошибке можно автоматически сделать rollback, а при успешном завершении — commit.\n\nУсловно:\n```python\nclass Transaction:\n    def __enter__(self):\n        print(\"BEGIN\")\n        return self\n\n    def __exit__(self, exc_type, exc_value, traceback):\n        if exc_type is None:\n            print(\"COMMIT\")\n        else:\n            print(\"ROLLBACK\")\n```\n\n### 3. Lock-и и синхронизация\nКонтекстные менеджеры часто используют с блокировками:\n```python\nwith lock:\n    shared_counter += 1\n```\nИдея:\n```text\nзахватить lock\nбезопасно выполнить код\nгарантированно отпустить lock\n```\nЭто важно, потому что забытый `lock.release()` может привести к зависанию программы.\nБез `with` пришлось бы писать:\n```python\nlock.acquire()\n\ntry:\n    shared_counter += 1\nfinally:\n    lock.release()\n```\n\n### 4. Сетевые соединения и HTTP-клиенты\nНапример:\n```python\nwith client:\n    response = client.get(\"https://example.com\")\n```\nИдея:\n```text\nоткрыть клиент / соединение\nсделать запросы\nзакрыть соединения и освободить ресурсы\n```\nВ async-коде часто используется `async with`:\n```python\nasync with session:\n    ...\n```\nДля `async with` используются методы `__aenter__()` и `__aexit__()`. Python Data Model отдельно описывает асинхронные контекстные менеджеры как объектный протокол для `async with`. \n\n### 5. Временные файлы и временные директории\nПример:\n```python\nfrom tempfile import TemporaryDirectory\n\nwith TemporaryDirectory() as tmp_dir:\n    print(tmp_dir)\n```\nИдея:\n```text\nсоздать временную директорию\nиспользовать её\nавтоматически удалить после выхода из блока\n```\nЭто удобно в тестах, обработке файлов, генерации отчётов, архивов и временных данных.\n\n### 6. Подавление ожидаемых исключений\nЧерез `contextlib.suppress` можно явно сказать: “эту ошибку можно проигнорировать”.\n```python\nfrom contextlib import suppress\n\nwith suppress(FileNotFoundError):\n    remove_file(\"old.log\")\n```\nЭто читается лучше, чем пустой `except`. Модуль `contextlib` в стандартной библиотеке предоставляет утилиты для работы с контекстными менеджерами, включая `suppress`, `closing`, `contextmanager` и `ExitStack`. ([Python documentation](https://docs.python.org/3/library/contextlib.html?utm_source=chatgpt.com \"contextlib — Utilities for with-statement contexts — Python ...\"))\n\n### 7. Временное изменение состояния\nНапример:\n```python\nwith change_settings(DEBUG=True):\n    run_test()\n```\n\nИдея:\n```text\nсохранить старое состояние\nвременно изменить\nпосле блока вернуть обратно\n```\nТакой подход часто используют в тестах, настройках окружения, моках, логировании, временной смене директории и временной подмене конфигурации.\n\n### Почему это удобно\nГлавные преимущества:\n```text\n1. Гарантированная очистка ресурсов.\n2. Меньше ручного try/finally.\n3. Код становится короче и читаемее.\n4. Легче не забыть закрыть файл, соединение или lock.\n5. Исключения обрабатываются централизованно в __exit__.\n```\n\nКлючевой смысл:\n```python\nwith resource:\n    work()\n```\nозначает:\n```text\nподготовить ресурс\nвыполнить работу\nгарантированно завершить работу с ресурсом\n```"
  popularity = 2.63

[[questions]]
  id = 15
  question = "Чем можно заменить контекстный менеджер? "
  answer = "Главная замена контекстного менеджера — `try/finally`.\n\n`with` как раз создан для того, чтобы удобно инкапсулировать типичные шаблоны `try/finally`: подготовить ресурс, выполнить код, затем гарантированно выполнить очистку. Это описано в документации Python по оператору `with`. ([Python documentation](https://docs.python.org/3/reference/compound_stmts.html?utm_source=chatgpt.com \"8. Compound statements\"))\n\n### 1. `try/finally`\nБыло с `with`:\n```python\nwith open(\"data.txt\", \"r\", encoding=\"utf-8\") as file:\n    data = file.read()\n```\nАналог без контекстного менеджера:\n```python\nfile = open(\"data.txt\", \"r\", encoding=\"utf-8\")\n\ntry:\n    data = file.read()\nfinally:\n    file.close()\n```\nСмысл одинаковый:\n```text\nоткрыли файл\nпоработали с ним\nгарантированно закрыли файл\n```\nДаже если внутри `try` будет ошибка, блок `finally` всё равно выполнится.\n\n### 2. Ручной вызов `open/close`, `acquire/release`, `connect/disconnect`\nНапример, без `with`:\n```python\nlock.acquire()\n\ntry:\n    # работа с защищённым ресурсом\n    ...\nfinally:\n    lock.release()\n```\nИли с соединением:\n```python\nconnection = connect()\n\ntry:\n    # работа с БД\n    ...\nfinally:\n    connection.close()\n```\nЭто рабочий вариант, но он более многословный и легче ошибиться: можно забыть `close()`, `release()` или `rollback()`.\n\n### 3. Декоратор\nИногда контекстный менеджер можно заменить декоратором, если нужно обернуть всю функцию целиком.\n\nНапример:\n```python\ndef with_logging(func):\n    def wrapper(*args, **kwargs):\n        print(\"До выполнения\")\n\n        try:\n            return func(*args, **kwargs)\n        finally:\n            print(\"После выполнения\")\n\n    return wrapper\n\n\n@with_logging\ndef process():\n    print(\"Работа функции\")\n\n\nprocess()\n```\nЭто похоже на `with`, но область действия другая:\n```text\nwith       → управляет конкретным блоком кода\ndecorator  → управляет всей функцией\n```\n\n### 4. `contextlib.contextmanager`\nЭто не замена `with`, а замена написанию класса с `__enter__` и `__exit__`.\nВместо класса:\n```python\nclass Manager:\n    def __enter__(self):\n        print(\"Вход\")\n        return self\n\n    def __exit__(self, exc_type, exc_value, traceback):\n        print(\"Выход\")\n```\nможно написать функцию:\n```python\nfrom contextlib import contextmanager\n\n\n@contextmanager\ndef manager():\n    print(\"Вход\")\n\n    try:\n        yield\n    finally:\n        print(\"Выход\")\n```\nИспользование всё равно через `with`:\n```python\nwith manager():\n    print(\"Работа\")\n```\n`contextlib.contextmanager` позволяет создавать контекстный менеджер из генераторной функции без отдельного класса. ([Python documentation](https://docs.python.org/3/library/contextlib.html?utm_source=chatgpt.com \"contextlib — Utilities for with-statement contexts — Python ...\"))\n\n### 5. `ExitStack`\n`ExitStack` используют, когда количество ресурсов заранее неизвестно или нужно динамически собрать несколько контекстных менеджеров.\n```python\nfrom contextlib import ExitStack\n\nfiles = [\"a.txt\", \"b.txt\", \"c.txt\"]\n\nwith ExitStack() as stack:\n    opened_files = [\n        stack.enter_context(open(filename, \"r\", encoding=\"utf-8\"))\n        for filename in files\n    ]\n\n    # работа со всеми файлами\n```\nЭто не совсем замена `with`, а более гибкий инструмент для сложных случаев. `contextlib.ExitStack` позволяет программно управлять стеком callbacks и контекстных менеджеров. ([Python documentation](https://docs.python.org/3/library/contextlib.html?utm_source=chatgpt.com \"contextlib — Utilities for with-statement contexts — Python ...\"))\n\n### Главное\nКонтекстный менеджер можно заменить:\n\n|Чем|Когда подходит|\n|---|---|\n|`try/finally`|Базовая ручная замена `with`|\n|Ручным `close()` / `release()`|Можно, но хуже по надёжности|\n|Декоратором|Когда нужно обернуть всю функцию|\n|`contextlib.contextmanager`|Когда не хочется писать класс|\n|`ExitStack`|Когда ресурсов много или их количество динамическое|"
  popularity = 2.63

[[questions]]
  id = 16
  question = "Какие знаешь способы реализации контекстного менеджера?"
  answer = "Основные способы:\n```text\n1. Класс с __enter__ и __exit__\n2. Функция с @contextmanager\n3. Асинхронный класс с __aenter__ и __aexit__\n4. Асинхронная функция с @asynccontextmanager\n5. Через готовые инструменты contextlib: closing, suppress, ExitStack\n```\nКонтекстный менеджер — это объект, который поддерживает протокол `with`: при входе вызывается `__enter__`, при выходе — `__exit__`. Это базовый механизм, описанный в Python Data Model и PEP 343. ([Python documentation](https://docs.python.org/3/library/contextlib.html?utm_source=chatgpt.com \"contextlib — Utilities for with-statement contexts — Python ...\"))\n\n### 1. Через класс: `__enter__` и `__exit__`\nСамый явный способ.\n```python\nclass FileManager:\n    def __init__(self, filename: str, mode: str):\n        self.filename = filename\n        self.mode = mode\n        self.file = None\n\n    def __enter__(self):\n        self.file = open(self.filename, self.mode, encoding=\"utf-8\")\n        return self.file\n\n    def __exit__(self, exc_type, exc_value, traceback):\n        self.file.close()\n        return False\n```\nИспользование:\n```python\nwith FileManager(\"data.txt\", \"w\") as file:\n    file.write(\"Hello\")\n```\nПорядок работы:\n```text\n__enter__ → тело with → __exit__\n```\nЭтот способ лучше использовать, когда у контекстного менеджера есть состояние: файл, соединение, транзакция, lock, клиент и так далее.\n\n### 2. Через `contextlib.contextmanager`\nМожно не писать класс, а сделать контекстный менеджер из генераторной функции.\n```python\nfrom contextlib import contextmanager\n\n\n@contextmanager\ndef file_manager(filename: str, mode: str):\n    file = open(filename, mode, encoding=\"utf-8\")\n\n    try:\n        yield file\n    finally:\n        file.close()\n```\nИспользование:\n```python\nwith file_manager(\"data.txt\", \"w\") as file:\n    file.write(\"Hello\")\n```\nЗдесь:\n```text\nкод до yield     → аналог __enter__\nyield value      → значение после as\nкод после yield  → аналог __exit__\n```\n`contextlib.contextmanager` официально предназначен для создания контекстных менеджеров из генераторных функций без отдельного класса. ([Python documentation](https://docs.python.org/3/library/contextlib.html?utm_source=chatgpt.com \"contextlib — Utilities for with-statement contexts — Python ...\"))\n\n### 3. Асинхронный контекстный менеджер: `__aenter__` и `__aexit__`\nДля `async with` используются методы:\n```python\n__aenter__\n__aexit__\n```\nПример:\n```python\nclass AsyncConnection:\n    async def __aenter__(self):\n        print(\"Открываем async-соединение\")\n        return self\n\n    async def __aexit__(self, exc_type, exc_value, traceback):\n        print(\"Закрываем async-соединение\")\n        return False\n```\nИспользование:\n```python\nasync with AsyncConnection() as connection:\n    print(\"Работаем с соединением\")\n```\nЭто нужно для асинхронных ресурсов: HTTP-клиентов, async DB-соединений, async-транзакций, Redis-клиентов и подобных объектов. Python Data Model отдельно описывает асинхронный протокол контекстного менеджера для `async with`. ([Python documentation](https://docs.python.org/3/library/contextlib.html?utm_source=chatgpt.com \"contextlib — Utilities for with-statement contexts — Python ...\"))\n\n### 4. Через `contextlib.asynccontextmanager`\nАсинхронный аналог `@contextmanager`.\n```python\nfrom contextlib import asynccontextmanager\n\n\n@asynccontextmanager\nasync def async_connection():\n    print(\"Открываем соединение\")\n\n    try:\n        yield \"connection\"\n    finally:\n        print(\"Закрываем соединение\")\n```\nИспользование:\n```python\nasync with async_connection() as connection:\n    print(connection)\n```\nЭтот вариант удобен, когда не хочется писать отдельный класс с `__aenter__` и `__aexit__`. В `contextlib` есть утилиты для обычных и асинхронных контекстных менеджеров.\n\n### 5. Через готовые контекстные менеджеры из `contextlib`\nВ стандартной библиотеке есть готовые инструменты.\nНапример, `suppress`:\n```python\nfrom contextlib import suppress\nfrom pathlib import Path\n\n\nwith suppress(FileNotFoundError):\n    Path(\"old.log\").unlink()\n```\nОн подавляет указанные исключения.\n`closing`:\n```python\nfrom contextlib import closing\n\n\nwith closing(get_resource()) as resource:\n    resource.do_work()\n```\nОн вызывает `resource.close()` при выходе из блока.\n`ExitStack`:\n```python\nfrom contextlib import ExitStack\n\n\nfiles = [\"a.txt\", \"b.txt\", \"c.txt\"]\n\nwith ExitStack() as stack:\n    opened_files = [\n        stack.enter_context(open(name, \"r\", encoding=\"utf-8\"))\n        for name in files\n    ]\n\n    # работа со всеми файлами\n```\n`ExitStack` удобен, когда количество контекстных менеджеров заранее неизвестно или ресурсы открываются динамически. Модуль `contextlib` как раз предоставляет утилиты для типовых задач, связанных с `with`. ([Python documentation](https://docs.python.org/3/library/contextlib.html?utm_source=chatgpt.com \"contextlib — Utilities for with-statement contexts — Python ...\"))\n\n### Что выбрать\n\n|Способ|Когда использовать|\n|---|---|\n|Класс с `__enter__` / `__exit__`|Когда нужен объект с состоянием|\n|`@contextmanager`|Когда логика простая и удобно описать её через `try/finally`|\n|Класс с `__aenter__` / `__aexit__`|Для async-ресурсов со своим состоянием|\n|`@asynccontextmanager`|Для простой async-логики|\n|`ExitStack`|Когда ресурсов много или их количество динамическое|"
  popularity = 2.63

