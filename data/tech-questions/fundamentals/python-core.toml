[[questions]]
  id = 1
  question = "Что такое Дескрипторы"
  answer = "**Дескриптор** — это объект, который управляет доступом к атрибуту другого объекта.\nПроще говоря, дескриптор позволяет перехватить операции:\n```python\nobj.attr        # чтение\nobj.attr = 10   # запись\ndel obj.attr    # удаление\n```\nДля этого объект должен реализовать хотя бы один из специальных методов:\n```python\n__get__()\n__set__()\n__delete__()\n```\nВ официальной документации Python дескриптор описывается как объект-атрибут, у которого поведение доступа переопределено через методы дескрипторного протокола: `__get__`, `__set__`, `__delete__`.\n\n**Пример:**\n```python\nclass AgeDescriptor:\n    def __get__(self, instance, owner):\n        return instance._age\n\n    def __set__(self, instance, value):\n        if value < 0:\n            raise ValueError(\"Возраст не может быть отрицательным\")\n        instance._age = value\n\n\nclass User:\n    age = AgeDescriptor()\n\n    def __init__(self, age):\n        self.age = age\n\n\nuser = User(20)\n\nprint(user.age)  # вызывается __get__\n\nuser.age = 25    # вызывается __set__\n\nuser.age = -5    # ValueError\n```\n\nЧто здесь происходит:\n```python\nuser.age\n```\nPython видит, что `age` в классе `User` — это объект с методом `__get__`, поэтому вызывает:\n```python\nAgeDescriptor.__get__(...)\n```\nА когда выполняется:\n```python\nuser.age = 25\n```\nPython вызывает:\n```python\nAgeDescriptor.__set__(...)\n```\n\n### Главное правило\nДескриптор должен лежать **в классе**, а не в конкретном объекте.\nПравильно:\n```python\nclass User:\n    age = AgeDescriptor()\n```\nНеправильно для обычного применения дескриптора:\n```python\nuser.age = AgeDescriptor()\n```\nPython вызывает дескрипторный протокол при поиске атрибута в классе или его родителях. В документации отдельно указано, что методы дескриптора применяются, когда экземпляр дескрипторного класса находится в словаре класса-владельца или его родителя.\n\n### Методы дескриптора\n```python\ndef __get__(self, instance, owner):\n    ...\n```\nВызывается при чтении атрибута:\n```python\nuser.age\n```\n`instance` — объект, через который обращаются к атрибуту.  \n`owner` — класс владельца, например `User`.\n\n```python\ndef __set__(self, instance, value):\n    ...\n```\nВызывается при записи:\n```python\nuser.age = 30\n```\n`value` — новое значение.\n\n```python\ndef __delete__(self, instance):\n    ...\n```\nВызывается при удалении:\n```python\ndel user.age\n```\n\n### Data descriptor и non-data descriptor\nВ Python есть два основных типа дескрипторов.\n#### 1. Data descriptor\nЭто дескриптор, у которого есть `__set__` или `__delete__`.\n```python\nclass Descriptor:\n    def __get__(self, instance, owner):\n        ...\n\n    def __set__(self, instance, value):\n        ...\n```\nТакой дескриптор имеет высокий приоритет. Даже если в `__dict__` объекта есть атрибут с таким же именем, data descriptor будет главнее. В документации Python указано, что data descriptors переопределяют значения в словаре экземпляра.\n\n#### 2. Non-data descriptor\nЭто дескриптор, у которого есть только `__get__`.\n```python\nclass Descriptor:\n    def __get__(self, instance, owner):\n        ...\n```\nТакой дескриптор может быть перекрыт атрибутом самого объекта. В документации Python указано, что non-data descriptors могут быть переопределены экземплярами.\n\n### `property` — это тоже дескриптор\nКогда ты пишешь:\n```python\nclass User:\n    def __init__(self, age):\n        self._age = age\n\n    @property\n    def age(self):\n        return self._age\n\n    @age.setter\n    def age(self, value):\n        if value < 0:\n            raise ValueError(\"Возраст не может быть отрицательным\")\n        self._age = value\n```\nЭто работает через механизм дескрипторов.\n\nТо есть:\n```python\nuser.age\n```\nвызывает логику чтения, а:\n```python\nuser.age = 30\n```\nвызывает логику записи.\n\nОфициальная документация Python прямо указывает, что `property()` реализован как data descriptor.\n\n### Методы класса тоже работают через дескрипторы\nОбычные методы в Python тоже связаны с дескрипторами.\n\nПример:\n```python\nclass User:\n    def say_hello(self):\n        print(\"Hello\")\n\n\nuser = User()\nuser.say_hello()\n```\nКогда ты обращаешься к:\n```python\nuser.say_hello\n```\nработает как:\n```python\nUser.say_hello(user)\n```\nДокументация Python указывает, что методы, включая `staticmethod` и `classmethod`, реализованы как non-data descriptors.\n\n### Где дескрипторы используются на практике\nДескрипторы используются в Python постоянно, даже если ты их напрямую не пишешь:\n```text\n- @property\n- @classmethod\n- @staticmethod\n- обычные методы класса\n- ORM-поля в Django / SQLAlchemy\n- валидация атрибутов\n- ленивые вычисления\n- контроль доступа к данным\n```\nНапример, ORM-поле условно можно представить так:\n```python\nclass User:\n    name = StringField()\n    age = IntegerField()\n```\n`StringField` и `IntegerField` могут быть объектами, которые управляют чтением, записью, валидацией и преобразованием значений.\n\n### Минимальный пример своего дескриптора\n```python\nclass PositiveNumber:\n    def __set_name__(self, owner, name):\n        self.private_name = \"_\" + name\n\n    def __get__(self, instance, owner):\n        return getattr(instance, self.private_name)\n\n    def __set__(self, instance, value):\n        if value <= 0:\n            raise ValueError(\"Значение должно быть положительным\")\n        setattr(instance, self.private_name, value)\n\n\nclass Product:\n    price = PositiveNumber()\n\n    def __init__(self, price):\n        self.price = price\n\n\nproduct = Product(100)\n\nprint(product.price)  # 100\n\nproduct.price = 200\nprint(product.price)  # 200\n\nproduct.price = -50   # ValueError\n```\nЗдесь `PositiveNumber` контролирует атрибут `price`.\n\nКогда создаётся класс `Product`, метод:\n```python\n__set_name__(self, owner, name)\n```\nпозволяет дескриптору узнать, под каким именем он был добавлен в класс. В документации Python этот механизм называется automatic name notification: при создании класса дескриптор может получить имя переменной, к которой он привязан."
  popularity = 15.79

[[questions]]
  id = 2
  question = "Когда и при каких операциях с атрибутом срабатывает дескриптор"
  answer = "### Когда срабатывает дескриптор\nДескриптор срабатывает, когда Python работает с атрибутом через точку:\n```python\nobj.attr\nobj.attr = value\ndel obj.attr\n```\nНо важно: дескриптор должен быть найден **в классе**, а не просто лежать в `__dict__` конкретного объекта. Официальная документация Python описывает дескрипторный протокол через методы `__get__`, `__set__`, `__delete__`; объект, определяющий один из этих методов, может переопределять стандартное поведение доступа к атрибуту.\n\n### 1. Чтение атрибута: `obj.attr`\nПри чтении атрибута вызывается:\n```python\ndescriptor.__get__(instance, owner)\n```\nПример:\n```python\nclass Descriptor:\n    def __get__(self, instance, owner):\n        print(\"__get__ вызван\")\n        return 100\n\n\nclass User:\n    age = Descriptor()\n\n\nuser = User()\n\nprint(user.age)\n```\nРезультат:\n```text\n__get__ вызван\n100\n```\nТо есть при операции:\n```python\nuser.age\n```\nPython находит `age` в классе `User`, видит, что это объект с методом `__get__`, и вызывает дескриптор.\n\n### 2. Запись атрибута: `obj.attr = value`\nПри записи вызывается:\n```python\ndescriptor.__set__(instance, value)\n```\nПример:\n```python\nclass Descriptor:\n    def __get__(self, instance, owner):\n        return instance._age\n\n    def __set__(self, instance, value):\n        print(\"__set__ вызван\")\n        instance._age = value\n\n\nclass User:\n    age = Descriptor()\n\n\nuser = User()\n\nuser.age = 20\nprint(user.age)\n```\nРезультат:\n```text\n__set__ вызван\n20\n```\nОперация:\n```python\nuser.age = 20\n```\nвызывает:\n```python\nDescriptor.__set__(...)\n```\n\n### 3. Удаление атрибута: `del obj.attr`\nПри удалении вызывается:\n```python\ndescriptor.__delete__(instance)\n```\nПример:\n```python\nclass Descriptor:\n    def __get__(self, instance, owner):\n        return instance._age\n\n    def __set__(self, instance, value):\n        instance._age = value\n\n    def __delete__(self, instance):\n        print(\"__delete__ вызван\")\n        del instance._age\n\n\nclass User:\n    age = Descriptor()\n\n\nuser = User()\nuser.age = 20\n\ndel user.age\n```\nРезультат:\n```text\n__delete__ вызван\n```\n\n### Важное условие: дескриптор должен быть атрибутом класса\nРаботает:\n```python\nclass User:\n    age = Descriptor()\n```\nПотому что `age` лежит в классе `User`.\n\nА вот так дескрипторный механизм не сработает как обычный дескриптор:\n```python\nuser = User()\nuser.age = Descriptor()\n```\nЗдесь `age` просто станет обычным атрибутом объекта `user`.\n\n### Приоритеты при чтении атрибута\nПри операции:\n```python\nuser.age\n```\nPython примерно проверяет атрибуты в таком порядке:\n1. Data descriptor в классе\n2. Атрибут в `user.__dict__`\n3. Non-data descriptor в классе\n4. Обычный атрибут класса\n5. `__getattr__`, если атрибут не найден\n\n### Обращение через класс: `Class.attr`\nДескриптор может сработать не только при обращении через объект:\n```python\nuser.age\n```\nно и при обращении через класс:\n```python\nUser.age\n```\nПример:\n```python\nclass Descriptor:\n    def __get__(self, instance, owner):\n        print(instance)\n        print(owner)\n        return 100\n\n\nclass User:\n    age = Descriptor()\n\n\nprint(User.age)\n```\nЗдесь `instance` будет `None`, потому что обращение идёт через класс, а не через конкретный объект.\n\n### Пример с логом всех операций\n```python\nclass LoggedAttribute:\n    def __get__(self, instance, owner):\n        print(\"Чтение атрибута\")\n        return instance._value\n\n    def __set__(self, instance, value):\n        print(\"Запись атрибута\")\n        instance._value = value\n\n    def __delete__(self, instance):\n        print(\"Удаление атрибута\")\n        del instance._value\n\n\nclass Example:\n    value = LoggedAttribute()\n\n\nobj = Example()\n\nobj.value = 10      # Запись атрибута\nprint(obj.value)    # Чтение атрибута\ndel obj.value       # Удаление атрибута\n```"
  popularity = 2.63

[[questions]]
  id = 3
  question = "Магический метод __get__"
  answer = "`__get__` — это метод дескриптора, который срабатывает при **чтении атрибута**.\n\nФормат:\n```python\ndef __get__(self, instance, owner):\n    ...\n```\nОн используется, когда Python видит обращение вида:\n```python\nobj.attr\n```\nили:\n```python\nClass.attr\n```\nОфициальная документация Python описывает `__get__` как часть descriptor protocol вместе с `__set__` и `__delete__`. Дескриптор может быть вызван напрямую, но обычно он вызывается автоматически при доступе к атрибуту через точку.\n\n### Параметры `__get__`\n```python\ndef __get__(self, instance, owner):\n    ...\n```\n\n|Параметр|Что означает|\n|---|---|\n|`self`|сам объект-дескриптор|\n|`instance`|объект, через который обратились к атрибуту|\n|`owner`|класс, которому принадлежит дескриптор|\nПример:\n```python\nclass Descriptor:\n    def __get__(self, instance, owner):\n        print(\"self:\", self)\n        print(\"instance:\", instance)\n        print(\"owner:\", owner)\n        return \"value\"\n\n\nclass User:\n    name = Descriptor()\n\n\nuser = User()\n\nprint(user.name)\n```\nПри вызове:\n```python\nuser.name\n```\nPython фактически делает примерно следующее:\n```python\nUser.__dict__[\"name\"].__get__(user, User)\n```\nТо есть:\n```text\nself      -> Descriptor()\ninstance  -> user\nowner     -> User\n```\n\n### Обращение через объект\n```python\nclass Descriptor:\n    def __get__(self, instance, owner):\n        return \"Чтение через объект\"\n\n\nclass User:\n    name = Descriptor()\n\n\nuser = User()\n\nprint(user.name)\n```\nРезультат:\n```text\nЧтение через объект\n```\nЗдесь `instance` — это объект `user`.\n\n### Обращение через класс\n```python\nclass Descriptor:\n    def __get__(self, instance, owner):\n        print(instance)\n        print(owner)\n        return \"Чтение через класс\"\n\n\nclass User:\n    name = Descriptor()\n\n\nprint(User.name)\n```\nРезультат будет таким:\n```python\nNone\n<class '__main__.User'>\nЧтение через класс\n```\nКогда обращение идёт через класс, `instance` будет `None`, потому что конкретного объекта нет.\n\nТо есть Python вызывает:\n```python\nUser.__dict__[\"name\"].__get__(None, User)\n```\n\n### Зачем проверять `instance is None`\nЧасто в `__get__` пишут такую проверку:\n```python\nclass Descriptor:\n    def __get__(self, instance, owner):\n        if instance is None:\n            return self\n\n        return instance.__dict__[\"value\"]\n```\nЭто нужно, чтобы при обращении через класс вернуть сам дескриптор, а при обращении через объект вернуть значение\n\nПример:\n```python\nclass Field:\n    def __get__(self, instance, owner):\n        if instance is None:\n            return self\n\n        return instance.__dict__[\"value\"]\n\n\nclass User:\n    name = Field()\n\n\nuser = User()\nuser.__dict__[\"value\"] = \"Alex\"\n\nprint(user.name)  # Alex\nprint(User.name)  # <__main__.Field object ...>\n```\n\n### `__get__` отвечает только за чтение\n\nМетод `__get__` срабатывает при чтении, для записи и удаления используются другие методы\n\n### Пример с хранением значения\n```python\nclass NameDescriptor:\n    def __get__(self, instance, owner):\n        if instance is None:\n            return self\n\n        return instance.__dict__[\"name\"]\n\n    def __set__(self, instance, value):\n        instance.__dict__[\"name\"] = value\n\n\nclass User:\n    name = NameDescriptor()\n\n\nuser = User()\n\nuser.name = \"Alex\"\n\nprint(user.name)\n```\n\nЧто происходит:\n```python\nuser.name = \"Alex\"\n```\nВызывает:\n```python\nNameDescriptor.__set__(user, \"Alex\")\n```\nА потом:\n```python\nprint(user.name)\n```\nВызывает:\n```python\nNameDescriptor.__get__(user, User)\n```\n\n### Почему значение лучше хранить в `instance.__dict__`\nДескриптор обычно один на весь класс.\nНапример:\n```python\nclass User:\n    name = NameDescriptor()\n```\nОбъект `NameDescriptor()` создаётся один раз и лежит в классе `User`.\n\nЕсли хранить значение внутри самого дескриптора:\n```python\nclass BadDescriptor:\n    def __get__(self, instance, owner):\n        return self.value\n\n    def __set__(self, instance, value):\n        self.value = value\n```\nто все объекты будут делить одно значение:\n```python\nclass User:\n    name = BadDescriptor()\n\n\nuser1 = User()\nuser2 = User()\n\nuser1.name = \"Alex\"\nuser2.name = \"Bob\"\n\nprint(user1.name)  # Bob\nprint(user2.name)  # Bob\n```\nПотому что `name = BadDescriptor()` один общий для всего класса.\n\nПравильнее хранить значение в конкретном объекте:\n```python\nclass GoodDescriptor:\n    def __get__(self, instance, owner):\n        return instance.__dict__[\"name\"]\n\n    def __set__(self, instance, value):\n        instance.__dict__[\"name\"] = value\n```\nТогда у каждого объекта будет своё значение.\n\n### Улучшенный вариант через `__set_name__`\nЧтобы не писать имя атрибута вручную, используют `__set_name__`.\n```python\nclass Field:\n    def __set_name__(self, owner, name):\n        self.name = name\n\n    def __get__(self, instance, owner):\n        if instance is None:\n            return self\n\n        return instance.__dict__[self.name]\n\n    def __set__(self, instance, value):\n        instance.__dict__[self.name] = value\n\n\nclass User:\n    name = Field()\n    age = Field()\n\n\nuser = User()\n\nuser.name = \"Alex\"\nuser.age = 20\n\nprint(user.name)  # Alex\nprint(user.age)   # 20\n```\nМетод `__set_name__` вызывается при создании класса и позволяет дескриптору узнать имя атрибута, к которому он привязан. В Python Descriptor HOWTO этот механизм описан как автоматическое уведомление дескриптора о его имени.\n\n### Пример с валидацией\n```python\nclass PositiveNumber:\n    def __set_name__(self, owner, name):\n        self.name = name\n\n    def __get__(self, instance, owner):\n        if instance is None:\n            return self\n\n        return instance.__dict__[self.name]\n\n    def __set__(self, instance, value):\n        if value <= 0:\n            raise ValueError(\"Значение должно быть положительным\")\n\n        instance.__dict__[self.name] = value\n\n\nclass Product:\n    price = PositiveNumber()\n\n    def __init__(self, price):\n        self.price = price\n\n\nproduct = Product(100)\n\nprint(product.price)  # 100\n\nproduct.price = -10   # ValueError\n```\nЗдесь `__get__` отвечает за чтение:\n```python\nproduct.price\n```\nА `__set__` отвечает за проверку и запись:\n```python\nproduct.price = 100\n```\n\n### Связь с методами класса\nОбычные методы класса тоже работают через дескрипторы.\n```python\nclass User:\n    def say_hello(self):\n        print(\"Hello\")\n\n\nuser = User()\n\nuser.say_hello()\n```\nКогда ты пишешь:\n```python\nuser.say_hello\n```\nPython достаёт функцию `say_hello` из класса `User`. Функция является дескриптором, и её `__get__` превращает обычную функцию в **bound method**, то есть метод, уже связанный с объектом `user`.\n\nПоэтому:\n```python\nuser.say_hello()\n```\nпо смыслу близко к:\n```python\nUser.say_hello(user)\n```"
  popularity = 5.26

