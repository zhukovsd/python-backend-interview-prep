  question = "Как определяется хэшируемость объектов и их связь с магическими методами __hash__ и __eq__"
  answer = "### Что такое хэшируемость\n\nОбъект считается **хэшируемым**, если:\n1. У него есть хэш-значение, которое не меняется в течение жизни объекта.\n2. Он может сравниваться с другими объектами через `__eq__`.\n3. Если два объекта равны через `__eq__`, то их хэши обязаны быть одинаковыми. Это правило прямо указано в документации Python. ([Python documentation](https://docs.python.org/3/glossary.html?utm_source=chatgpt.com \"Glossary — Python 3.14.5 documentation\"))\n    \n\nХэш нужен для использования объекта как ключа в `dict` или элемента в `set` / `frozenset`. Встроенная функция `hash()` возвращает целочисленный хэш объекта, который используется, например, при поиске ключей в словаре. ([Python documentation](https://docs.python.org/3/library/functions.html?utm_source=chatgpt.com \"Built-in Functions\"))\n\nПример:\n```python\nx = \"hello\"\n\nprint(hash(x))\n```\nСтрока хэшируема, потому что она неизменяемая.\n\n---\n\n### Связь с `__hash__`\nМетод:\n```python\n__hash__(self)\n```\n\nдолжен возвращать целое число:\n```python\nclass User:\n    def __init__(self, user_id):\n        self.user_id = user_id\n\n    def __hash__(self):\n        return hash(self.user_id)\n```\n\nКогда ты вызываешь:\n```python\nhash(user)\n```\n\nPython фактически обращается к:\n```python\nuser.__hash__()\n```\nТакже `__hash__` используется внутри `dict` и `set`.\n\n---\n\n### Связь с `__eq__`\nМетод:\n```python\n__eq__(self, other)\n```\nотвечает за сравнение объектов через `==`.\n\nПример:\n```python\nclass User:\n    def __init__(self, user_id):\n        self.user_id = user_id\n\n    def __eq__(self, other):\n        if not isinstance(other, User):\n            return NotImplemented\n        return self.user_id == other.user_id\n```\n\nТеперь:\n```python\nu1 = User(1)\nu2 = User(1)\n\nprint(u1 == u2)  # True\n```\n\nНо если объекты равны, то их хэши тоже должны быть равны:\n```python\nhash(u1) == hash(u2)\n```\nИначе объект нельзя корректно использовать в `dict` и `set`.\n\n---\n\n### Правильная реализация `__eq__` и `__hash__`\n```python\nclass User:\n    def __init__(self, user_id):\n        self.user_id = user_id\n\n    def __eq__(self, other):\n        if not isinstance(other, User):\n            return NotImplemented\n        return self.user_id == other.user_id\n\n    def __hash__(self):\n        return hash(self.user_id)\n```\n\nТеперь:\n```python\nu1 = User(1)\nu2 = User(1)\n\nprint(u1 == u2)              # True\nprint(hash(u1) == hash(u2))  # True\n\nusers = {u1, u2}\nprint(len(users))            # 1\n```\nПочему `len(users) == 1`?\n\nПотому что для `set` эти объекты считаются одинаковыми:\n```python\nu1 == u2\n```\nи имеют одинаковый хэш.\n\n---\n\n### Что будет, если определить `__eq__`, но не определить `__hash__`\nВ Python есть важное правило: если класс переопределяет `__eq__`, но не определяет `__hash__`, то Python делает класс **нехэшируемым**. В таком случае `__hash__` становится `None`. ([Python documentation](https://docs.python.org/3/reference/datamodel.html?utm_source=chatgpt.com \"3. Data model — Python 3.14.5 documentation\"))\n\nПример:\n```python\nclass User:\n    def __init__(self, user_id):\n        self.user_id = user_id\n\n    def __eq__(self, other):\n        if not isinstance(other, User):\n            return NotImplemented\n        return self.user_id == other.user_id\n\n\nu = User(1)\n\nprint(hash(u))\n```\n\nБудет ошибка:\n```python\nTypeError: unhashable type: 'User'\n```\n\nПроверка:\n```python\nprint(User.__hash__)  # None\n```\n\nPython делает так специально, чтобы объект с изменённой логикой равенства случайно не использовался как ключ словаря с некорректным хэшем.\n\n---\n\n### Почему нельзя делать хэш от изменяемых данных\n\nПлохой пример:\n```python\nclass User:\n    def __init__(self, name):\n        self.name = name\n\n    def __eq__(self, other):\n        if not isinstance(other, User):\n            return NotImplemented\n        return self.name == other.name\n\n    def __hash__(self):\n        return hash(self.name)\n```\n\nПроблема:\n```python\nu = User(\"Alex\")\n\nusers = {u}\n\nu.name = \"Bob\"\n\nprint(u in users)  # может дать неожиданное поведение\n```\n\nОбъект уже лежит в `set` по старому хэшу, но после изменения `name` его хэш изменился. Поэтому хэшируемые объекты должны опираться на данные, которые не меняются во время жизни объекта.\n\n---\n\n### Поведение по умолчанию\nЕсли ты вообще не определяешь `__eq__` и `__hash__`, класс наследует поведение от `object`.\n\nПример:\n```python\nclass User:\n    pass\n\nu1 = User()\nu2 = User()\n\nprint(u1 == u2)        # False\nprint(hash(u1))        # работает\nprint(hash(u2))        # работает\n```\n\nПо умолчанию объекты сравниваются по идентичности, то есть примерно как через `is`, а хэш связан с идентичностью объекта.\n\nТо есть:\n```python\nu1 == u2\n```\n\nбудет `False`, потому что это два разных объекта.\n\n---\n\n### Краткая таблица\n\n|Ситуация|Хэшируемость|\n|---|---|\n|Не определены ни `__eq__`, ни `__hash__`|объект хэшируем|\n|Определён `__eq__`, но не определён `__hash__`|объект нехэшируем|\n|Определены и `__eq__`, и корректный `__hash__`|объект хэшируем|\n|`__hash__ = None`|объект явно нехэшируем|\n|Хэш зависит от изменяемых полей|технически может работать, но это ошибка проектирования|\n\n---\n\n### Главное правило\nЕсли переопределяешь `__eq__`, почти всегда нужно подумать о `__hash__`.\n\nПравильный контракт:\n```python\na == b  =>  hash(a) == hash(b)\n```\n\nНо обратное не обязано быть верным:\n```python\nhash(a) == hash(b)  не значит, что  a == b\n```\nОдинаковые хэши у разных объектов возможны. Это называется **коллизия хэшей**."
  popularity = 7.89

