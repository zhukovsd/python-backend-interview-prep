  id = 18
  question = "Чем отличается @classmethod от @staticmethod?"
  answer = "**`classmethod`** и **`staticmethod`** - это специальные декораторы, которые позволяют определять методы в классах с особым поведением. Однако они имеют различия в том, как они обрабатывают аргументы и как они взаимодействуют с экземплярами класса.\n\n**classmethod:**\n- Декоратор преобразует обычный метод класса в тот, который принимает первым аргументом ссылку на класс (обычно называемый **`cls`**).\n- Это означает, что метод **`classmethod`** может обращаться к атрибутам и вызывать другие методы класса через ссылку на сам класс, а не через экземпляр класса.\n- Может использоваться, например, для создания альтернативных конструкторов класса или для работы с классовыми переменными.\n\n```python\nclass MyClass:\n    class_attribute = 123\n\n    @classmethod\n    def class_method(cls):\n        return cls.class_attribute\n\nprint(MyClass.class_method())  # Выведет: 123\n```\n\n**staticmethod:**\n- Декоратор создает метод класса, который не принимает ссылку на сам класс (неявно или явно), и не принимает ссылку на экземпляр класса (обычно называемый **`self`**).\n- Это означает, что **`staticmethod`** является статическим методом и может быть вызван как из класса, так и из экземпляра класса, но не имеет доступа к атрибутам и методам класса или экземпляра.\n- Статические методы могут быть полезны для группировки связанных функций внутри класса или для создания методов, которые не требуют доступа к состоянию класса или экземпляра.\n\n```python\nclass MyClass:\n    @staticmethod\n    def static_method():\n        return \"This is a static method\"\n\nprint(MyClass.static_method())  # Выведет: This is a static method\n```\n\nОсновное отличие между **`classmethod`** и **`staticmethod`** заключается в том, что **`classmethod`** принимает ссылку на класс, а **`staticmethod`** - нет."
  popularity = 13.16

[[questions]]
  id = 19
  question = "Чем отличается первый аргумент classmethod от метода экземпляра?"
  answer = "| |**Метод экземпляра**|**Classmethod**|\n|---|---|---|\n|**Первый аргумент**|`self`|`cls`|\n|**Что получает**|**Сам объект** (экземпляр)|**Сам класс** (не экземпляр!)|\n|**Доступ**|К атрибутам конкретного объекта|К атрибутам класса|\n|**Когда использовать**|Когда работаем с данными объекта|Когда работаем с классом в целом|\n\n```python\nclass Student:\n    school = \"Школа №1\"  # Атрибут класса\n\n    def __init__(self, name):\n        self.name = name  # Атрибут экземпляра\n\n    # Метод экземпляра — получает self (конкретного студента)\n    def show_name(self):\n        print(f\"Студент: {self.name}\")  # Данные конкретного объекта\n\n    # Classmethod — получает cls (класс Student)\n    @classmethod\n    def show_school(cls):\n        print(f\"Учебное заведение: {cls.school}\")  # Данные класса\n\n    @classmethod\n    def create_anonymous(cls):\n        return cls(\"Аноним\")  # Создает НОВЫЙ экземпляр класса\n\n# Использование\ns = Student(\"Маша\")\ns.show_name()        # self = s (объект Маша)\nStudent.show_school() # cls = Student (сам класс)\nanon = Student.create_anonymous()  # cls = Student, создает нового студента\n```\n\n**Что получают методы?**\n\n```python\nclass Demo:\n    class_attr = \"общее\"\n\n    def __init__(self, value):\n        self.instance_attr = value\n\n    def instance_method(self):\n        print(f\"self = {self}\")              # Конкретный объект\n        print(f\"Через self: {self.instance_attr}\")  # Данные объекта\n        print(f\"Через self: {self.class_attr}\")      # Тоже работает\n\n    @classmethod\n    def class_method(cls):\n        print(f\"cls = {cls}\")                 # Сам класс\n        print(f\"Через cls: {cls.class_attr}\")  # Данные класса\n        # cls.instance_attr — ОШИБКА! у класса нет атрибутов экземпляра\n\nobj = Demo(\"индивидуальное\")\nobj.instance_method()  # self = <__main__.Demo object at 0x...>\nDemo.class_method()    # cls = <class '__main__.Demo'>\n```\n\n**Таблица сравнения**\n\n|Аспект|`self` (метод экземпляра)|`cls` (classmethod)|\n|---|---|---|\n|**Что это**|Экземпляр класса|Сам класс|\n|**Когда вызывается**|`obj.method()`|`Class.method()`|\n|**Может менять**|Атрибуты объекта|Атрибуты класса|\n|**Может создавать**|Новые атрибуты объекта|Новые экземпляры класса|\n|**Доступ к атрибутам класса**|Да (через `self.__class__`)|Да (прямо через `cls`)|\n|**Доступ к атрибутам объекта**|Да|Нет|\n\n**`self`** — это \"конкретный объект\", а **`cls`** — это \"тип объекта\" (сам класс)."
  popularity = 2.63

