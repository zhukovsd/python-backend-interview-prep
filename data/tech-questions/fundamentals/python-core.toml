  question = "Какой объект является результатом работы метакласса?"
  answer = "### Результат работы метакласса — это класс\nМетакласс создаёт не обычный экземпляр, а объект класса.\n\nПример:\n```python\nclass User:\n    pass\n```\nУпрощённо это эквивалентно:\n```python\nUser = type(\"User\", (object,), {})\n```\nЗдесь результат работы `type(...)` — это класс `User`.\n```python\nprint(User)        # <class '__main__.User'>\nprint(type(User))  # <class 'type'>\n```\nТо есть:\n```text\ntype создал объект класса User\nUser потом может создавать обычные объекты user\n```\n\nДокументация Python описывает создание класса как процесс, где выбирается метакласс, подготавливается namespace, выполняется тело класса, а затем объект класса создаётся вызовом метакласса.\n\n### Схема\n```text\nметакласс → создаёт класс\nкласс     → создаёт экземпляр\n```\nПример:\n```python\nclass User:\n    pass\n\n\nuser = User()\n```\nСвязи:\n```python\nprint(type(user))  # <class '__main__.User'>\nprint(type(User))  # <class 'type'>\n```\nТо есть:\n```text\nuser — результат работы класса User\nUser — результат работы метакласса type\n```\n\n### Пример с пользовательским метаклассом\n```python\nclass Meta(type):\n    def __new__(mcls, name, bases, namespace):\n        print(\"Метакласс создаёт класс:\", name)\n        return super().__new__(mcls, name, bases, namespace)\n\n\nclass User(metaclass=Meta):\n    pass\n```\nВывод:\n```text\nМетакласс создаёт класс: User\n```\nЗдесь `Meta.__new__` вернул объект класса `User`.\n\nПроверка:\n```python\nprint(type(User))  # <class '__main__.Meta'>\n```\nТо есть `User` — это экземпляр метакласса `Meta`.\n\n### Важно различать\n```python\nclass User:\n    pass\n```\nРезультат работы метакласса:\n```python\nUser\n```\nА вот это:\n```python\nuser = User()\n```\nРезультат работы класса:\n```python\nuser\n```"
