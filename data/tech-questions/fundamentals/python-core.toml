  id = 36
  question = "Магический метод __getattr__"
  answer = "### Что такое `__getattr__`\n\n`__getattr__` — это магический метод, который вызывается **только тогда, когда обычный поиск атрибута не нашёл атрибут**.\n\nСигнатура:\n```python\ndef __getattr__(self, name):\n    ...\n```\n\nГде:\n```text\nself — объект\nname — имя атрибута, который пытались получить\n```\n\nОфициальная документация Python формулирует это так: `__getattr__` вызывается, когда обычный доступ к атрибуту завершился ошибкой `AttributeError`; метод должен вернуть значение атрибута или снова выбросить `AttributeError`. \n\n### Пример\n```python\nclass User:\n    def __init__(self, name):\n        self.name = name\n\n    def __getattr__(self, attr_name):\n        return f\"Атрибут {attr_name!r} не найден\"\n\n\nuser = User(\"Alex\")\n\nprint(user.name)\nprint(user.age)\n```\n\nРезультат:\n```text\nAlex\nАтрибут 'age' не найден\n```\n\nЧто произошло:\n```text\nuser.name найден в user.__dict__ -> __getattr__ не вызывается\nuser.age не найден              -> вызывается __getattr__(\"age\")\n```\n\n### Важный момент\n`__getattr__` не перехватывает вообще все обращения к атрибутам.\nОн вызывается только после неудачного обычного поиска:\n```python\nclass User:\n    def __init__(self):\n        self.name = \"Alex\"\n\n    def __getattr__(self, name):\n        print(\"__getattr__ вызван\")\n        return None\n\n\nuser = User()\n\nprint(user.name)  # __getattr__ не вызван\nprint(user.age)   # __getattr__ вызван\n```\n\n### Отличие `__getattr__` от `__getattribute__`\n\nЭто два магических метода, которые перехватывают доступ к атрибутам объекта. Главное отличие — **когда они вызываются**.\n\n**`__getattribute__` — перехватывает ВСЁ**\nВызывается **при любом обращении** к любому атрибуту — существующему или нет.\n```python\nclass Test:\n    def __init__(self):\n        self.name = \"Анна\"\n\n    def __getattribute__(self, name):\n        print(f\"Перехвачен доступ к: {name}\")\n        # Обязательно вызываем родительский метод, иначе всё сломается\n        return super().__getattribute__(name)\n\nobj = Test()\nprint(obj.name)  # Перехвачен доступ к: name → Анна\nprint(obj.age)   # Перехвачен доступ к: age → AttributeError\n```\n\n**Особенности:**\n- Срабатывает **всегда** при обращении к атрибуту\n- Должен вызывать `super().__getattribute__()` для реального доступа\n- Легко создать бесконечную рекурсию\n\n---\n\n**`__getattr__` — перехватывает только отсутствующее**\nВызывается **только если атрибут не найден** обычным способом.\n```python\nclass Test:\n    def __init__(self):\n        self.name = \"Анна\"\n\n    def __getattr__(self, name):\n        print(f\"Атрибут {name} не найден, создаём...\")\n        return f\"Значение для {name}\"\n\nobj = Test()\nprint(obj.name)     # Анна (__getattr__ НЕ вызван)\nprint(obj.age)      # Атрибут age не найден → \"Значение для age\"\n```\n\n**Особенности:**\n- Срабатывает **только для отсутствующих** атрибутов\n- Не нужно вызывать `super()`\n- Безопаснее, нет риска рекурсии\n\n**Сравнение в таблице**\n\n| |`__getattribute__`|`__getattr__`|\n|---|---|---|\n|**Когда вызывается**|При любом доступе к атрибуту|Только если атрибут не найден|\n|**Для существующих атрибутов**|✅ Да|❌ Нет|\n|**Для несуществующих**|✅ Да|✅ Да|\n|**Риск рекурсии**|Высокий|Низкий|\n|**Нужен super()**|Обязательно|Нет|\n|**Типичное использование**|Логирование, контроль доступа|Значения по умолчанию, динамические атрибуты|\n\n**Главное правило**\n- `__getattribute__` — **всегда первый**\n- Если атрибут есть — он возвращает значение и всё\n- Если атрибута нет — после `__getattribute__` вызывается `__getattr__`\n\n### Для чего используют `__getattr__`\nТипичные случаи:\n```text\nдинамические атрибуты\nленивая загрузка данных\nпроксирование обращения к другому объекту\nобратная совместимость старых имён атрибутов\nудобная обработка отсутствующих атрибутов\n```\n\nПример динамического атрибута:\n```python\nclass Config:\n    def __init__(self):\n        self.values = {\n            \"host\": \"localhost\",\n            \"port\": 5432,\n        }\n\n    def __getattr__(self, name):\n        try:\n            return self.values[name]\n        except KeyError:\n            raise AttributeError(f\"{type(self).__name__!r} object has no attribute {name!r}\")\n\n\nconfig = Config()\n\nprint(config.host)  # localhost\nprint(config.port)  # 5432\n```\n\nЗдесь `host` и `port` физически не лежат как обычные атрибуты объекта, но `__getattr__` достаёт их из словаря `values`.\n\n### Почему важно выбрасывать `AttributeError`\nЕсли атрибут реально не найден, нужно выбрасывать именно `AttributeError`, а не возвращать что угодно.\n\nПлохо:\n```python\nclass User:\n    def __getattr__(self, name):\n        return None\n```\n\nПроблема:\n```python\nuser = User()\n\nprint(user.anything)  # None\n```\n\nТак можно скрыть реальные ошибки и опечатки:\n```python\nuser.emial  # опечатка, но ошибки нет\n```\n\nЛучше:\n```python\nclass User:\n    def __getattr__(self, name):\n        raise AttributeError(f\"{type(self).__name__!r} object has no attribute {name!r}\")\n```\n\n### Итог\n`__getattr__` — это резервный механизм доступа к атрибутам.\n\nКоротко:\n```text\nobj.some_attr\n```\n\nPython делает примерно так:\n```text\n1. Ищет some_attr обычным способом.\n2. Если нашёл — возвращает значение.\n3. Если не нашёл — вызывает obj.__getattr__(\"some_attr\").\n4. Если __getattr__ вернул значение — оно используется.\n5. Если __getattr__ выбросил AttributeError — атрибут считается отсутствующим.\n```\n\nГлавное отличие:\n```python\n__getattr__\n```\n\nвызывается **не всегда**, а только когда обычный поиск атрибута провалился."
