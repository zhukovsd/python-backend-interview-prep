  question = "Магический метод __set__"
  answer = "`__set__` — это метод **дескриптора**, который срабатывает при **записи значения в атрибут**:\n```python\nobj.attr = value\n```\n\nФормат метода:\n```python\ndef __set__(self, instance, value):\n    ...\n```\nОфициальный descriptor protocol в Python состоит из методов `__get__`, `__set__` и `__delete__`; `__set__` отвечает именно за установку значения атрибута.\n\n### Аргументы `__set__`\n```python\ndef __set__(self, instance, value):\n    ...\n```\n\n|Аргумент|Значение|\n|---|---|\n|`self`|сам объект-дескриптор|\n|`instance`|объект, у которого меняют атрибут|\n|`value`|новое значение атрибута|\n\nПример:\n```python\nclass AgeDescriptor:\n    def __set__(self, instance, value):\n        print(\"__set__ вызван\")\n        instance.__dict__[\"age\"] = value\n\n\nclass User:\n    age = AgeDescriptor()\n\n\nuser = User()\n\nuser.age = 20\n```\n\nПри выполнении:\n```python\nuser.age = 20\n```\nPython фактически вызывает:\n```python\nUser.__dict__[\"age\"].__set__(user, 20)\n```\nРезультат:\n```text\n__set__ вызван\n```\n\n### Важное условие\nДескриптор должен лежать **в классе**, а не в объекте.\n\nПравильно:\n```python\nclass User:\n    age = AgeDescriptor()\n```\nНеправильно для дескрипторного механизма:\n```python\nuser.age = AgeDescriptor()\n```\nВо втором случае `AgeDescriptor()` просто станет обычным значением атрибута `age`, а не дескриптором.\n\n### Пример с валидацией\n```python\nclass PositiveNumber:\n    def __set__(self, instance, value):\n        if value <= 0:\n            raise ValueError(\"Значение должно быть положительным\")\n\n        instance.__dict__[\"number\"] = value\n\n\nclass Product:\n    price = PositiveNumber()\n\n\nproduct = Product()\n\nproduct.price = 100\nprint(product.__dict__)\n\nproduct.price = -50\n```\nРезультат:\n```text\n{'number': 100}ValueError: Значение должно быть положительным\n```\nЗдесь `__set__` перехватывает запись:\n```python\nproduct.price = 100\n```\nи решает, можно ли сохранить значение.\n\n### Более правильный вариант через `__set_name__`\nВ предыдущем примере имя `\"number\"` было зашито вручную. Лучше использовать `__set_name__`, чтобы дескриптор сам узнал имя атрибута.\n```python\nclass PositiveNumber:\n    def __set_name__(self, owner, name):\n        self.name = name\n\n    def __get__(self, instance, owner):\n        if instance is None:\n            return self\n\n        return instance.__dict__[self.name]\n\n    def __set__(self, instance, value):\n        if value <= 0:\n            raise ValueError(f\"{self.name} должно быть положительным\")\n\n        instance.__dict__[self.name] = value\n\n\nclass Product:\n    price = PositiveNumber()\n    quantity = PositiveNumber()\n\n\nproduct = Product()\n\nproduct.price = 100\nproduct.quantity = 5\n\nprint(product.price)     # 100\nprint(product.quantity)  # 5\n```\nМетод `__set_name__` вызывается при создании класса и позволяет дескриптору узнать имя атрибута, к которому он привязан.\n\n### `__set__` делает дескриптор data descriptor\nЕсли у дескриптора есть `__set__` или `__delete__`, он считается **data descriptor**. Такие дескрипторы имеют более высокий приоритет, чем атрибуты в `instance.__dict__`.\n\nПример:\n```python\nclass Descriptor:\n    def __get__(self, instance, owner):\n        return \"значение из дескриптора\"\n\n    def __set__(self, instance, value):\n        instance.__dict__[\"attr\"] = value\n\n\nclass Example:\n    attr = Descriptor()\n\n\nobj = Example()\n\nobj.__dict__[\"attr\"] = \"значение из __dict__\"\n\nprint(obj.attr)\n```\nРезультат:\n```text\nзначение из дескриптора\n```\nХотя в объекте есть:\n```python\nobj.__dict__[\"attr\"]\n```\nпри чтении всё равно срабатывает data descriptor, потому что `Descriptor` содержит `__set__`.\n\n### `__set__` может быть без `__get__`\nДескриптор может определить только `__set__`:\n```python\nclass WriteOnly:\n    def __set__(self, instance, value):\n        print(f\"Записано: {value}\")\n\n\nclass User:\n    name = WriteOnly()\n\n\nuser = User()\n\nuser.name = \"Alex\"\n```\nРезультат:\n```text\nЗаписано: Alex\n```\nНо при чтении:\n```python\nprint(user.name)\n```\nповедение будет уже не таким удобным: Python вернёт сам объект-дескриптор, потому что `__get__` не определён.\nПоэтому на практике обычно пишут вместе:\n```python\n__get__\n__set__\n```\n\n### Отличие `__set__` от `__setattr__`\nИх часто путают.\n`__set__` — это метод **дескриптора**:\n```python\nclass Descriptor:\n    def __set__(self, instance, value):\n        ...\n```\nОн срабатывает при записи в конкретный атрибут, который связан с этим дескриптором:\n```text\nuser.age = 20\n```\n`__setattr__` — это метод **самого объекта**:\n```python\nclass User:\n    def __setattr__(self, name, value):\n        ...\n```\nОн срабатывает почти при любой записи атрибута:\n```python\nuser.name = \"Alex\"\nuser.age = 20\nuser.email = \"a@example.com\"\n```\n\n**Сравнение:**\n\n|Метод|Где находится|Когда вызывается|\n|---|---|---|\n|`__set__`|в классе-дескрипторе|при записи в атрибут-дескриптор|\n|`__setattr__`|в классе самого объекта|при записи почти любого атрибута объекта|\n\nПример с `__setattr__`:\n```python\nclass User:\n    def __setattr__(self, name, value):\n        print(f\"Записывается атрибут {name}\")\n        super().__setattr__(name, value)\n\n\nuser = User()\nuser.name = \"Alex\"\nuser.age = 20\n```\nРезультат:\n```text\nЗаписывается атрибут name\nЗаписывается атрибут age\n```\n\n### Где используется `__set__`\n`__set__` используют, когда нужно контролировать запись значения:\n- валидация данных\n- логирование изменений\n- ORM-поля\n- ограничение доступа к атрибутам\n- приведение типов\n- проверка диапазонов\n\nНапример:\n```python\nclass StringField:\n    def __set_name__(self, owner, name):\n        self.name = name\n\n    def __get__(self, instance, owner):\n        if instance is None:\n            return self\n\n        return instance.__dict__[self.name]\n\n    def __set__(self, instance, value):\n        if not isinstance(value, str):\n            raise TypeError(f\"{self.name} должно быть строкой\")\n\n        instance.__dict__[self.name] = value\n\n\nclass User:\n    username = StringField()\n\n\nuser = User()\n\nuser.username = \"user\"\nprint(user.username)\n\nuser.username = 123\n```\nРезультат:\n```text\nuser\nTypeError: username должно быть строкой\n```"
  popularity = 2.63

