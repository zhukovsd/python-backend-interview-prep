  question = "Какие магические методы (dunder-методы) класса вы знаете и за какие группы поведения они отвечают?"
  answer = "Dunder-методы — это специальные методы вида `__method__`, через которые объект подключается к синтаксису Python: `+`, `len()`, `for`, `with`, `[]`, сравнения, вызов как функции и так далее. В документации Python они называются special method names; именно они позволяют классу определять поведение для операторов и встроенных функций.\n\n### 1. Создание и жизненный цикл объекта\n\n| Метод                 | За что отвечает                                      |\n| --------------------- | ---------------------------------------------------- |\n| `__new__(cls, ...)`   | Создание нового объекта                              |\n| `__init__(self, ...)` | Инициализация уже созданного объекта                 |\n| `__del__(self)`       | Действие перед уничтожением объекта сборщиком мусора |\nПример:\n```python\nclass User:\n    def __new__(cls, *args, **kwargs):\n        print(\"Создание объекта\")\n        return super().__new__(cls)\n\n    def __init__(self, name):\n        print(\"Инициализация объекта\")\n        self.name = name\n```\n`__new__` создаёт объект, а `__init__` вызывается после создания экземпляра и настраивает его состояние.\n\n### 2. Строковое представление объекта\n\n|Метод|За что отвечает|\n|---|---|\n|`__str__(self)`|Человекочитаемое представление объекта, используется в `print()` и `str()`|\n|`__repr__(self)`|Техническое представление объекта, используется в отладке и `repr()`|\n|`__format__(self, format_spec)`|Поведение при `format()` и f-строках с форматированием|\n|`__bytes__(self)`|Преобразование объекта в `bytes`|\nПример:\n```python\nclass User:\n    def __init__(self, name):\n        self.name = name\n\n    def __str__(self):\n        return f\"User: {self.name}\"\n\n    def __repr__(self):\n        return f\"User(name={self.name!r})\"\n\n\nuser = User(\"Alex\")\n\nprint(str(user))   # User: Alex\nprint(repr(user))  # User(name='Alex')\n```\nОбычно `__str__` делают удобным для пользователя, а `__repr__` — полезным для разработчика.\n\n### 3. Сравнение объектов\n\n|Метод|Оператор|\n|---|---|\n|`__eq__(self, other)`|`==`|\n|`__ne__(self, other)`|`!=`|\n|`__lt__(self, other)`|`<`|\n|`__le__(self, other)`|`<=`|\n|`__gt__(self, other)`|`>`|\n|`__ge__(self, other)`|`>=`|\n|`__hash__(self)`|`hash(obj)`, использование в `set` и ключах `dict`|\nПример:\n```python\nclass Product:\n    def __init__(self, price):\n        self.price = price\n\n    def __lt__(self, other):\n        return self.price < other.price\n\n    def __eq__(self, other):\n        return self.price == other.price\n\n\na = Product(100)\nb = Product(200)\n\nprint(a < b)   # True\nprint(a == b)  # False\n```\nЭти методы отвечают за rich comparison — расширенное сравнение объектов.\n\n### 4. Арифметические операции\n\n|Метод|Оператор|\n|---|---|\n|`__add__(self, other)`|`+`|\n|`__sub__(self, other)`|`-`|\n|`__mul__(self, other)`|`*`|\n|`__truediv__(self, other)`|`/`|\n|`__floordiv__(self, other)`|`//`|\n|`__mod__(self, other)`|`%`|\n|`__pow__(self, other)`|`**`|\nПример:\n```python\nclass Money:\n    def __init__(self, amount):\n        self.amount = amount\n\n    def __add__(self, other):\n        return Money(self.amount + other.amount)\n\n\na = Money(100)\nb = Money(50)\n\nresult = a + b\n\nprint(result.amount)  # 150\n```\nТо есть выражение:\n```python\na + b\n```\nпримерно превращается в:\n```python\ntype(a).__add__(a, b)\n```\nИменно так Python реализует перегрузку операторов через специальные методы.\n\n### 5. Отражённые арифметические операции\n\n|Метод|Когда вызывается|\n|---|---|\n|`__radd__(self, other)`|Когда левый объект не умеет `+`|\n|`__rsub__(self, other)`|Отражённый `-`|\n|`__rmul__(self, other)`|Отражённый `*`|\n|`__rtruediv__(self, other)`|Отражённый `/`|\nПример:\n```python\nclass Number:\n    def __init__(self, value):\n        self.value = value\n\n    def __radd__(self, other):\n        return self.value + other\n\n\nx = Number(10)\n\nprint(5 + x)  # 15\n```\nЗдесь `int.__add__` не знает, как сложить `5` и `Number`, поэтому Python пробует `Number.__radd__`.\n\n### 6. Операции с присваиванием\n\n|Метод|Оператор|\n|---|---|\n|`__iadd__(self, other)`|`+=`|\n|`__isub__(self, other)`|`-=`|\n|`__imul__(self, other)`|`*=`|\n|`__itruediv__(self, other)`|`/=`|\nПример:\n```python\nclass Counter:\n    def __init__(self, value):\n        self.value = value\n\n    def __iadd__(self, other):\n        self.value += other\n        return self\n\n\ncounter = Counter(10)\ncounter += 5\n\nprint(counter.value)  # 15\n```\n\n### 7. Унарные операции\n\n|Метод|Оператор|\n|---|---|\n|`__neg__(self)`|`-obj`|\n|`__pos__(self)`|`+obj`|\n|`__abs__(self)`|`abs(obj)`|\n|`__invert__(self)`|`~obj`|\nПример:\n```python\nclass Balance:\n    def __init__(self, amount):\n        self.amount = amount\n\n    def __neg__(self):\n        return Balance(-self.amount)\n\n\nbalance = Balance(100)\nnegative = -balance\n\nprint(negative.amount)  # -100\n```\n\n### 8. Приведение типов\n\n|Метод|За что отвечает|\n|---|---|\n|`__bool__(self)`|`bool(obj)`, проверки в `if`|\n|`__int__(self)`|`int(obj)`|\n|`__float__(self)`|`float(obj)`|\n|`__complex__(self)`|`complex(obj)`|\n|`__index__(self)`|Использование объекта как целого индекса|\nПример:\n```python\nclass Cart:\n    def __init__(self, items):\n        self.items = items\n\n    def __bool__(self):\n        return len(self.items) > 0\n\n\ncart = Cart([])\n\nif cart:\n    print(\"Корзина не пустая\")\nelse:\n    print(\"Корзина пустая\")\n```\n\n### 9. Поведение контейнера\nЭти методы позволяют объекту вести себя как список, словарь, множество или другая коллекция.\n\n|Метод|За что отвечает|\n|---|---|\n|`__len__(self)`|`len(obj)`|\n|`__getitem__(self, key)`|`obj[key]`|\n|`__setitem__(self, key, value)`|`obj[key] = value`|\n|`__delitem__(self, key)`|`del obj[key]`|\n|`__contains__(self, item)`|`item in obj`|\nПример:\n```python\nclass Users:\n    def __init__(self):\n        self._users = [\"Alex\", \"Bob\", \"John\"]\n\n    def __len__(self):\n        return len(self._users)\n\n    def __getitem__(self, index):\n        return self._users[index]\n\n    def __contains__(self, user):\n        return user in self._users\n\n\nusers = Users()\n\nprint(len(users))      # 3\nprint(users[0])        # Alex\nprint(\"Bob\" in users)  # True\n```\nДокументация отдельно описывает такие методы как способ эмулировать контейнерные типы: последовательности, отображения и другие встроенные типы\n\n### 10. Итерация\n\n|Метод|За что отвечает|\n|---|---|\n|`__iter__(self)`|Возвращает итератор|\n|`__next__(self)`|Возвращает следующий элемент|\n|`__reversed__(self)`|Поведение `reversed(obj)`|\nПример:\n```python\nclass Countdown:\n    def __init__(self, start):\n        self.current = start\n\n    def __iter__(self):\n        return self\n\n    def __next__(self):\n        if self.current <= 0:\n            raise StopIteration\n\n        value = self.current\n        self.current -= 1\n        return value\n\n\nfor number in Countdown(3):\n    print(number)\n```\nВывод:\n```text\n3\n2\n1\n```\n\n### 11. Вызов объекта как функции\n\n|Метод|За что отвечает|\n|---|---|\n|`__call__(self, ...)`|Позволяет вызывать объект как функцию|\nПример:\n```python\nclass Multiplier:\n    def __init__(self, factor):\n        self.factor = factor\n\n    def __call__(self, value):\n        return value * self.factor\n\n\ndouble = Multiplier(2)\n\nprint(double(10))  # 20\n```\nОбъект `double` здесь ведёт себя как функция.\n\n### 12. Работа с атрибутами\n\n| Метод                            | За что отвечает                                           |\n| -------------------------------- | --------------------------------------------------------- |\n| `__getattribute__(self, name)`   | Вызывается при любом обращении к атрибуту                 |\n| `__getattr__(self, name)`        | Вызывается, если обычный поиск атрибута не нашёл значение |\n| `__setattr__(self, name, value)` | Вызывается при присваивании атрибута                      |\n| `__delattr__(self, name)`        | Вызывается при удалении атрибута                          |\n| `__dir__(self)`                  | Настраивает результат `dir(obj)`                          |\nПример:\n```python\nclass User:\n    def __init__(self, name):\n        self.name = name\n\n    def __getattr__(self, name):\n        return f\"Атрибут {name} не найден\"\n\n\nuser = User(\"Alex\")\n\nprint(user.name)     # Alex\nprint(user.age)      # Атрибут age не найден\n```\nВажно различать:\n```text\n__getattribute__ вызывается всегда\n__getattr__ вызывается только если атрибут не найден\n```\nВ документации также указано, что `__setattr__` и `__delattr__` перехватывают присваивание и удаление атрибутов.\n\n### 13. Дескрипторы\n\n|Метод|За что отвечает|\n|---|---|\n|`__get__(self, instance, owner)`|Получение значения|\n|`__set__(self, instance, value)`|Установка значения|\n|`__delete__(self, instance)`|Удаление значения|\n|`__set_name__(self, owner, name)`|Получение имени атрибута при создании класса|\nПример:\n```python\nclass PositiveNumber:\n    def __set_name__(self, owner, name):\n        self.name = name\n\n    def __get__(self, instance, owner):\n        return instance.__dict__[self.name]\n\n    def __set__(self, instance, value):\n        if value <= 0:\n            raise ValueError(\"Значение должно быть положительным\")\n\n        instance.__dict__[self.name] = value\n\n\nclass Product:\n    price = PositiveNumber()\n\n\nproduct = Product()\nproduct.price = 100\n\nprint(product.price)  # 100\n```\nДескрипторы лежат в основе `property`, методов класса, `staticmethod`, `classmethod` и многих ORM-механизмов.\n\n### 14. Контекстные менеджеры\n\n|Метод|За что отвечает|\n|---|---|\n|`__enter__(self)`|Вход в блок `with`|\n|`__exit__(self, exc_type, exc_value, traceback)`|Выход из блока `with`|\nПример:\n```python\nclass FileManager:\n    def __enter__(self):\n        print(\"Открываем ресурс\")\n        return self\n\n    def __exit__(self, exc_type, exc_value, traceback):\n        print(\"Закрываем ресурс\")\n\n\nwith FileManager():\n    print(\"Работаем с ресурсом\")\n```\nВывод:\n```text\nОткрываем ресурс\nРаботаем с ресурсом\nЗакрываем ресурс\n```\nТакие методы используются для файлов, соединений с БД, транзакций, lock-объектов и других ресурсов, которые нужно гарантированно освободить.\n\n### 15. Асинхронное поведение\n\n|Метод|За что отвечает|\n|---|---|\n|`__await__(self)`|Позволяет использовать объект в `await`|\n|`__aiter__(self)`|Асинхронный итератор|\n|`__anext__(self)`|Следующее значение в `async for`|\n|`__aenter__(self)`|Вход в `async with`|\n|`__aexit__(self, exc_type, exc, tb)`|Выход из `async with`|\nПример:\n```python\nclass AsyncContext:\n    async def __aenter__(self):\n        print(\"Вход\")\n        return self\n\n    async def __aexit__(self, exc_type, exc, tb):\n        print(\"Выход\")\n\n\nasync with AsyncContext():\n    print(\"Работа внутри async with\")\n```\nЭто используется, например, в асинхронных клиентах БД, HTTP-клиентах, транзакциях и соединениях.\n\n### 16. Управление экземплярами класса\n\n|Метод|За что отвечает|\n|---|---|\n|`__slots__`|Ограничивает набор атрибутов объекта и может уменьшить расход памяти|\n|`__dict__`|Словарь атрибутов объекта|\n|`__class__`|Ссылка на класс объекта|\n\n`__slots__` — не метод, а специальный атрибут класса, но его часто упоминают рядом с dunder-механизмами.\n\nПример:\n```python\nclass Point:\n    __slots__ = (\"x\", \"y\")\n\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n\npoint = Point(1, 2)\n\npoint.z = 3  # AttributeError\n```\n\n### 17. Работа с классами и наследованием\n\n|Метод|За что отвечает|\n|---|---|\n|`__init_subclass__(cls, ...)`|Вызывается при создании подкласса|\n|`__class_getitem__(cls, item)`|Позволяет писать `MyClass[int]`|\n|`__mro_entries__(self, bases)`|Участие в построении MRO|\nПример:\n```python\nclass Base:\n    def __init_subclass__(cls, **kwargs):\n        super().__init_subclass__(**kwargs)\n        print(f\"Создан подкласс: {cls.__name__}\")\n\n\nclass Child(Base):\n    pass\n```\nВывод:\n```text\nСоздан подкласс: Child\n```\n\n### 18. Управление памятью и слабые ссылки\n|Метод / атрибут|За что отвечает|\n|---|---|\n|`__sizeof__(self)`|Размер объекта в памяти|\n|`__weakref__`|Поддержка weak references, если используются `__slots__`|\n\nНа практике эти методы используют редко, обычно в низкоуровневой оптимизации или библиотеках.\n\n### Краткая сводка по группам\n\n| Группа поведения         | Основные методы                                                        |\n| ------------------------ | ---------------------------------------------------------------------- |\n| Создание объекта         | `__new__`, `__init__`, `__del__`                                       |\n| Строковое представление  | `__str__`, `__repr__`, `__format__`, `__bytes__`                       |\n| Сравнение                | `__eq__`, `__ne__`, `__lt__`, `__le__`, `__gt__`, `__ge__`             |\n| Хеширование              | `__hash__`                                                             |\n| Арифметика               | `__add__`, `__sub__`, `__mul__`, `__truediv__`, `__pow__`              |\n| Отражённые операции      | `__radd__`, `__rsub__`, `__rmul__`                                     |\n| Операции с присваиванием | `__iadd__`, `__isub__`, `__imul__`                                     |\n| Приведение типов         | `__bool__`, `__int__`, `__float__`, `__index__`                        |\n| Контейнеры               | `__len__`, `__getitem__`, `__setitem__`, `__delitem__`, `__contains__` |\n| Итерация                 | `__iter__`, `__next__`, `__reversed__`                                 |\n| Вызов объекта            | `__call__`                                                             |\n| Атрибуты                 | `__getattribute__`, `__getattr__`, `__setattr__`, `__delattr__`        |\n| Дескрипторы              | `__get__`, `__set__`, `__delete__`, `__set_name__`                     |\n| Контекстный менеджер     | `__enter__`, `__exit__`                                                |\n| Асинхронные объекты      | `__await__`, `__aiter__`, `__anext__`, `__aenter__`, `__aexit__`       |\n| Наследование и generics  | `__init_subclass__`, `__class_getitem__`, `__mro_entries__`            |\n\n### Главное\n\nDunder-методы отвечают не за “обычные методы класса”, а за интеграцию объекта в механизмы языка Python.\n\nНапример:\n```python\nlen(obj)      # вызывает __len__\nobj[key]      # вызывает __getitem__\nobj + other   # вызывает __add__\nfor x in obj  # вызывает __iter__ и __next__\nwith obj:     # вызывает __enter__ и __exit__\nobj()         # вызывает __call__\n```\n\nВ реальной разработке чаще всего встречаются:\n```python\n__init__\n__str__\n__repr__\n__eq__\n__hash__\n__len__\n__getitem__\n__setitem__\n__iter__\n__next__\n__enter__\n__exit__\n__getattr__\n__setattr__\n__call__\n```\nОстальные обычно нужны при разработке библиотек, ORM, фреймворков, контейнеров, дескрипторов, асинхронных клиентов и собственных типов данных."
