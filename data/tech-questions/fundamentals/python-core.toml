[[questions]]
  id = 60
  question = "Сравните императивную (процедурную) и функциональную парадигмы программирования."
  answer = "**Императивная / процедурная парадигма** описывает программу как последовательность команд: что сделать сначала, что потом, какие переменные изменить, какие процедуры вызвать. Britannica сравнивает процедурные программы с «рецептами»: есть пошаговые инструкции и управляющие конструкции вроде условий и циклов.\n\n**Функциональная парадигма** описывает программу как композицию функций: данные передаются в функции, функции возвращают новые данные, а изменение внешнего состояния стараются минимизировать. В Python-документации функциональный стиль описывается как подход, где задача разбивается на функции, а предпочтение отдаётся отсутствию побочных эффектов и изменяемого состояния.\n\n### Основные различия\n| Критерий         | Императивная / процедурная                         | Функциональная                                          |\n| ---------------- | -------------------------------------------------- | ------------------------------------------------------- |\n| Главный вопрос   | **Как выполнить задачу?**                          | **Что получить из данных?**                             |\n| Основа программы | Команды, процедуры, изменения состояния            | Функции, выражения, преобразования данных               |\n| Состояние        | Часто изменяется напрямую                          | Стараются избегать изменения состояния                  |\n| Данные           | Могут изменяться на месте                          | Чаще создаются новые данные                             |\n| Побочные эффекты | Нормальная часть программы                         | Стараются изолировать или минимизировать                |\n| Читаемость       | Хороша для пошаговой логики                        | Хороша для обработки данных и цепочек преобразований    |\n| Типичный код     | `for`, `while`, присваивания, изменение переменных | `map`, `filter`, `reduce`, рекурсия, композиция функций |\n| Примеры языков   | C, Pascal, procedural-style Python                 | Haskell, Lisp, Clojure, F#, functional-style Python     |\n\n### Пример на Python\nИмперативный / процедурный стиль:\n```python\nnumbers = [1, 2, 3, 4, 5, 6]\n\nresult = []\n\nfor number in numbers:\n    if number % 2 == 0:\n        result.append(number * 2)\n\nprint(result)  # [4, 8, 12]\n```\nЗдесь мы явно описываем шаги:\n```text\nсоздай список\nпройди циклом\nпроверь условие\nизмени result\nвыведи результат\n```\n\nФункциональный стиль:\n```python\nnumbers = [1, 2, 3, 4, 5, 6]\n\nresult = list(\n    map(\n        lambda number: number * 2,\n        filter(lambda number: number % 2 == 0, numbers)\n    )\n)\n\nprint(result)  # [4, 8, 12]\n```\nЗдесь акцент другой:\n```text\nвозьми числа\nотфильтруй чётные\nпреобразуй каждое число\nполучи новый список\n```\n\nВ Python чаще пишут так:\n```python\nnumbers = [1, 2, 3, 4, 5, 6]\n\nresult = [\n    number * 2\n    for number in numbers\n    if number % 2 == 0\n]\n\nprint(result)  # [4, 8, 12]\n```\nЭто не «чистое» функциональное программирование, но стиль близок к функциональному: исходный список `numbers` не изменяется, а создаётся новый список `result`.\n\n### Главное отличие по состоянию\nВ процедурном коде нормально делать так:\n```python\nbalance = 100\n\ndef withdraw(amount):\n    global balance\n    balance -= amount\n```\nФункция меняет внешнюю переменную `balance`. Это побочный эффект.\n\nВ функциональном стиле лучше так:\n```python\ndef withdraw(balance, amount):\n    return balance - amount\n\nnew_balance = withdraw(100, 30)\n```\nФункция не меняет внешний мир. Она получает данные и возвращает новый результат.\n\n### Где что удобнее\n**Императивный / процедурный подход удобен**, когда нужно описать конкретный процесс:\n```text\nоткрыть файл\nпрочитать строки\nзаписать лог\nотправить запрос\nсохранить результат в базу\n```\nТо есть он хорошо подходит для кода с явной последовательностью действий и взаимодействием с внешним миром.\n\n**Функциональный подход удобен**, когда нужно преобразовывать данные:\n```text\nотфильтровать пользователей\nотсортировать записи\nпосчитать сумму\nпреобразовать список объектов\nсобрать новый результат\n```\nОн особенно полезен там, где важно уменьшить количество неожиданных изменений состояния.\n\n### Важный момент\nНа практике эти парадигмы часто смешиваются. Например, Python является мультипарадигменным языком: он поддерживает процедурный, объектно-ориентированный и некоторые функциональные конструкции.\n\nНапример, в реальном backend-коде часто делают так:\n```python\ndef calculate_total(items):\n    return sum(item.price * item.quantity for item in items)\n\n\ndef create_order(user, items):\n    total = calculate_total(items)\n    order = Order.objects.create(user=user, total=total)\n    return order\n```\n`calculate_total()` написана ближе к функциональному стилю: она просто считает и возвращает результат.  \n`create_order()` уже императивная: она создаёт запись в базе данных, то есть имеет побочный эффект.\n\n### Итог\nИмперативная / процедурная парадигма — это стиль **пошаговых инструкций**.\nФункциональная парадигма — это стиль **преобразования данных через функции**."
