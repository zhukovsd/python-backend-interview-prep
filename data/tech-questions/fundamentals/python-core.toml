  question = "Есть ли разница между list() и [ ]?"
  answer = "### Да, разница есть\n`[]` и `list()` оба могут создать список, но используются немного по-разному.\n\n### 1. Пустой список\n```python\na = []\nb = list()\n\nprint(a)  # []\nprint(b)  # []\n```\n\nРезультат одинаковый: создаётся пустой список.\n\nНо на практике чаще пишут:\n```python\nitems = []\n```\n\nПочему:\n```text\n[] короче\n[] читается проще\n[] немного быстрее\n```\n\nДокументация Python прямо указывает, что список можно создать несколькими способами, включая `[]` для пустого списка и `list()` через конструктор. \n\n### 2. Список с элементами\nЧерез квадратные скобки:\n```python\nnumbers = [1, 2, 3]\n```\n\nЧерез `list()` так напрямую нельзя:\n```python\nnumbers = list(1, 2, 3)  # TypeError\n```\n\nПравильно:\n```python\nnumbers = list((1, 2, 3))\n```\n\nТо есть `list()` принимает **один итерируемый объект**, например tuple, строку, range, set, dict.\n\n### 3. `list()` используют для преобразования iterable в список\n```python\nchars = list(\"abc\")\nprint(chars)\n```\n\nРезультат:\n```text\n['a', 'b', 'c']\n```\n\nЕщё пример:\n```python\nnumbers = list(range(5))\nprint(numbers)\n```\n\nРезультат:\n```text\n[0, 1, 2, 3, 4]\n```\n\nЗдесь `list()` удобен, потому что он превращает итерируемый объект в список.\n\n### 4. `[]` используют для литерального создания списка\n```python\nusers = [\"Alex\", \"Bob\", \"John\"]\n```\n\nЭто обычный способ создать список с известными элементами.\n\nДокументация Python описывает list display как выражение со значениями внутри квадратных скобок. \n\n### 5. Разница в скорости\nДля пустого списка:\n```python\na = []\n```\n\nобычно быстрее, чем:\n```python\na = list()\n```\n\nПричина: `[]` — это синтаксис языка, а `list()` — вызов встроенного класса `list`.\n\nНо в обычном коде разница минимальная. Выбирать лучше по смыслу:\n```text\n[]      — создать новый список\nlist(x) — преобразовать x в список\n```\n\n### 6. Важный пример с копированием\n```python\na = [1, 2, 3]\n\nb = list(a)\nc = a[:]\nd = a.copy()\n```\n\nВсе три варианта создают поверхностную копию списка:\n```python\nprint(a is b)  # False\nprint(a == b)  # True\n```\n\nНо если внутри вложенные объекты, они не копируются глубоко:\n```python\na = [[1], [2]]\nb = list(a)\n\nprint(a is b)        # False\nprint(a[0] is b[0])  # True\n```\n\n### Итог\n\n|Запись|Что делает|\n|---|---|\n|`[]`|создаёт новый пустой список|\n|`[1, 2, 3]`|создаёт список с элементами|\n|`list()`|создаёт пустой список через конструктор|\n|`list(iterable)`|преобразует iterable в список|\n\nГлавное правило:\n```python\nitems = []\n```\nиспользуют для создания пустого списка.\n```python\nitems = list(some_iterable)\n```\nиспользуют для преобразования другого итерируемого объекта в список."
  popularity = 2.63

[[questions]]
  id = 39
  question = "Что такое слабая ссылка"
  answer = "\"Слабая ссылка\" (англ. weak reference) — это специальный тип ссылки на объект в программировании, который не препятствует удалению этого объекта сборщиком мусора.\n\nОбычная (сильная) ссылка \"удерживает\" объект в памяти: пока на него есть хотя бы одна такая ссылка — он не будет удалён. А слабая ссылка не удерживает объект. Если все обычные ссылки на объект исчезли, то даже если есть слабые — объект будет удалён из памяти.\n\n**Где применяется**:\n- Кэширование\n- Системы наблюдения (observer pattern)\n- Деревья с родительскими ссылками (например, DOM)\n- Оптимизация памяти в длительных процессах\n\nМодуль weakref — это встроенный модуль Python, который позволяет создавать слабые ссылки (weak references) на объекты.\n```python\nimport weakref\n\nclass Well:\n    def __init__(self, name):\n        self.name = name\n\nwell = Well(\"WELL-101\")\nweak_ref = weakref.ref(well)  # слабая ссылка\n\nprint(weak_ref())  # <__main__.Well object> — объект жив\n\ndel well          # последняя сильная ссылка удалена\nprint(weak_ref())  # None — объект уничтожен сборщиком мусора\n```"
  popularity = 2.63

[[questions]]
  id = 40
  question = "Какие недостатки есть у Python?"
  answer = "У языка программирования Python есть несколько слабых сторон, которые связаны с особенностями производительности, потребления памяти, ограничений в области видимости и ограниченности стандартных библиотек для решения некоторых задач.\n\n**Производительность**\n- **Интерпретируемая природа языка** — код выполняется построчно интерпретатором, что добавляет накладные расходы по сравнению с компилируемыми языками.\n- **Динамическая типизация** — проверка типов происходит во время выполнения, что требует дополнительных вычислительных ресурсов.\n- **Глобальная блокировка интерпретатора (GIL)** — ограничивает выполнение только одной инструкции Python в любой момент времени на одном процессоре, что может стать узким местом в многопоточных приложениях. С версии 3.14 есть обход GIL.\n- **Медленные операции ввода-вывода** — если программа выполняет много операций ввода-вывода (например, чтение/запись файлов, работа с сетью), производительность может снизиться из-за ожидания завершения этих операций.\n\n**Память**\n- **Python использует больше памяти** по сравнению с жёстко типизированными языками, такими как C или C++. Это может стать ограничением при работе с большими данными или в средах с ограниченной памятью.\n- **Утечки памяти** — память выделяется для конкретной задачи, но не освобождается после завершения процесса. Это особенно вредно, если утечка находится в часто выполняемом участке кода.\n\n**Область видимости**\nПо умолчанию все имена, значения которым присваиваются внутри функции, ассоциируются с пространством имён этой функции.\n\nЭто означает, что:\n\n- Имена, определяемые внутри инструкции def, видны только программному коду внутри этой инструкции, к ним нельзя обратиться за пределами функции.\n- Область видимости переменной определяется местом, где ей было присвоено значение, а не местом, откуда была вызвана функция.\n\n**Библиотеки**\nНекоторые библиотеки Python не всегда эффективны для решения определенных задач. Например, некоторые библиотеки не освобождают память при завершении задачи или непрерывно запускают ненужные фоновые процессы, что напрягает доступные ресурсы. К таким библиотекам относятся:\n\n1. Библиотеки с агрессивным кэшированием (для производительности)  \n    TensorFlow / PyTorch — преднамеренно кэшируют память на GPU/CPU между операциями для ускорения вычислений. Это может выглядеть как «утечка», но на самом деле — оптимизация.  \n    Решение: torch.cuda.empty_cache(), tf.keras.backend.clear_session().  \n    NumPy — при работе с большими массивами и срезами (views) может удерживать ссылки на исходные данные дольше ожидаемого.  \n    Решение: использовать .copy() при необходимости.\n2. Библиотеки с глобальным состоянием  \n    Matplotlib — сохраняет все созданные фигуры в памяти до явного вызова plt.close() или plt.clf(). При генерации тысяч графиков в цикле это приводит к утечкам.  \n    Решение: всегда вызывать plt.close(fig) после сохранения.  \n    OpenCV (cv2) — при работе с видео (cv2.VideoCapture) требует явного освобождения ресурсов через .release().\n3. ORM и кэши сессий  \n    SQLAlchemy — identity map и кэш сессии могут удерживать объекты в памяти при долгоживущих сессиях.  \n    Решение: использовать session.expunge_all(), session.close() или паттерн «сессия на запрос».\n\n**Конфликты имён** — например, в модуле math есть функция `sqrt()`, но и в библиотеке `cmath` (для комплексных чисел) есть такая же функция. Это может привести к ошибкам, так как не ясно, из какого модуля используется функция."
  popularity = 5.26

[[questions]]
  id = 41
  question = "Пишут ли на Python высокопроизводительные приложения и почему?"
  answer = "### Да, на Python пишут высокопроизводительные приложения\nНо важная оговорка: обычно высокую производительность получают не за счёт “чистого Python в циклах”, а за счёт архитектуры и выноса тяжёлой работы туда, где Python не является узким местом.\n\nPython часто используют как:\n```text\nкоординирующий слой\nAPI/backend слой\nязык glue-кода\nязык бизнес-логики\nобёртку над быстрыми C/C++/Rust/Fortran-библиотеками\n```\n\n### Почему это возможно\n#### 1. Узкое место не всегда в Python\nВ backend-приложениях большая часть времени часто уходит не на выполнение Python-кода, а на:\n```text\nзапросы в БД\nсетевые вызовы\nRedis/cache\nочереди сообщений\nфайловый ввод-вывод\nHTTP-запросы к другим сервисам\n```\n\nТо есть приложение может быть высоконагруженным, даже если сам Python не самый быстрый язык по CPU. Для I/O-bound задач важнее правильно работать с конкурентностью: async, worker-процессы, connection pooling, кеширование, очереди.\n\nПример:\n```python\nasync def get_user(user_id: int):\n    user = await db.fetch_user(user_id)\n    return user\n```\n\nЗдесь основное ожидание — не вычисления Python, а ответ базы данных.\n\n#### 2. Для CPU-bound задач используют нативные библиотеки\nPython медленный в чистых циклах:\n```python\ntotal = 0\n\nfor i in range(100_000_000):\n    total += i\n```\n\nНо в научных вычислениях, ML, обработке массивов и математики Python часто вызывает быстрый код внутри библиотек.\n\nНапример, NumPy использует векторизацию: операции над массивами выполняются так, что цикл происходит в C, а не в Python. Документация NumPy прямо описывает broadcasting как способ векторизовать операции, где looping occurs in C instead of Python. \n\nПример:\n```python\nimport numpy as np\n\na = np.arange(100_000_000)\nresult = a.sum()\n```\n\nЗдесь Python только вызывает операцию, а тяжёлая работа выполняется внутри оптимизированной библиотеки.\n\n#### 3. Python легко расширяется C/C++-кодом\n\nPython официально поддерживает расширение интерпретатора модулями на C/C++. Такие модули могут определять новые функции, типы и вызывать C-библиотеки. \n\nПоэтому часто делают так:\n```text\nудобный API на Python\nгорячие участки на C/C++/Rust/Cython\n```\n\nПримерная схема:\n```text\nPython код:\n    принимает запрос\n    валидирует данные\n    вызывает быструю функцию\n\nC/Rust/C++ код:\n    выполняет тяжёлые вычисления\n```\n\nТак работают многие производительные Python-библиотеки.\n\n#### 4. Можно использовать несколько процессов\nВ CPython GIL ограничивает параллельное выполнение Python bytecode в потоках, но `multiprocessing` обходит GIL через процессы. Документация Python прямо говорит, что `multiprocessing` side-stepping the Global Interpreter Lock by using subprocesses and allows fully leverage multiple processors. \n\nПример:\n```python\nfrom multiprocessing import Pool\n\ndef calculate(x):\n    return x * x\n\nwith Pool() as pool:\n    result = pool.map(calculate, range(1_000_000))\n```\n\nДля backend это обычно выглядит как несколько worker-процессов:\n```text\ngunicorn/uvicorn workers\ncelery workers\nнесколько контейнеров\nгоризонтальное масштабирование\n```\n\n#### 5. Async даёт хорошую производительность для I/O-bound backend\nДля API-сервисов Python может быть быстрым, если задача не CPU-bound. Например, FastAPI/aiohttp/asyncio позволяют одному процессу обслуживать много сетевых операций конкурентно, пока код ожидает БД, Redis или внешние API.\n\nНо это работает только если внутри async-кода нет блокирующих вызовов:\n```python\n# плохо\ntime.sleep(5)\n\n# правильно\nawait asyncio.sleep(5)\n```\n\n### Где Python реально используют для производительных систем\nPython подходит для высокопроизводительных приложений, когда:\n```text\nосновная нагрузка I/O-bound\nесть масштабирование процессами/контейнерами\nтяжёлые вычисления вынесены в нативные библиотеки\nиспользуются NumPy/PyTorch/TensorFlow/Pandas/Polars\nгорячие участки оптимизированы отдельно\nесть кеширование, очереди, батчинг, профилирование\n```\n\nТипичные области:\n```text\nbackend API\nML/AI inference orchestration\ndata pipelines\nETL\nавтоматизация инфраструктуры\nаналитические сервисы\nмикросервисы\nscientific computing\nнагруженные web-сервисы\n```\n\n### Где Python будет плохим выбором\nPython обычно не лучший выбор, если нужно:\n```text\nмаксимально быстро выполнять чистые CPU-bound циклы\nписать игровой движок\nписать драйверы\nделать real-time систему\nжёстко контролировать память\nиспользовать много потоков для CPU-bound вычислений в обычном CPython\n```\n\nНапример, такой код лучше писать не на чистом Python:\n```python\nfor pixel in pixels:\n    process_pixel(pixel)\n```\n\nЛучше:\n```text\nNumPy/OpenCV\nCython\nRust/C++ extension\nGPU\nNumba\n```\n\n### Короткий вывод\nДа, на Python пишут высокопроизводительные приложения, потому что Python часто используют не как “самый быстрый исполнитель инструкций”, а как удобный управляющий слой.\n\nГлавная идея:\n```text\nPython управляет,\nбыстрые библиотеки считают,\nпроцессы и async дают конкурентность,\nархитектура убирает узкие места.\n```\n\nНо чистый Python-код в тяжёлых CPU-циклах обычно проигрывает C/C++/Rust/Go. Поэтому профессиональная Python-производительность — это не “писать всё на Python”, а грамотно сочетать Python с профилированием, нативными библиотеками, кешированием, async, multiprocessing и масштабированием."
  popularity = 2.63

[[questions]]
  id = 42
  question = "Магический метод __call__"
  answer = "### Что такое `__call__`\n\n`__call__` — это магический метод, который позволяет **вызывать объект как функцию**.\n\nСигнатура:\n```python\ndef __call__(self, *args, **kwargs):\n    ...\n```\n\nЕсли у объекта есть метод `__call__`, то можно писать:\n```python\nobj()\n```\n\nPython фактически выполнит:\n```python\nobj.__call__()\n```\n\nОфициальная документация Python указывает: `object.__call__(self[, args...])` вызывается, когда экземпляр класса вызывается как функция. \n\nПример\n```python\nclass Greeter:\n    def __call__(self, name):\n        return f\"Hello, {name}\"\n\n\ngreeter = Greeter()\n\nprint(greeter(\"Alex\"))\n```\n\nРезультат:\n```text\nHello, Alex\n```\n\nЗдесь `greeter` — это объект, но его можно вызвать как функцию:\n```python\ngreeter(\"Alex\")\n```\n\nПотому что внутри класса определён:\n```python\ndef __call__(self, name):\n```\n\n### Проверка через `callable`\nЕсть встроенная функция:\n```python\ncallable(obj)\n```\n\nОна проверяет, можно ли объект вызвать.\n```python\nclass A:\n    pass\n\n\nclass B:\n    def __call__(self):\n        pass\n\n\na = A()\nb = B()\n\nprint(callable(a))  # False\nprint(callable(b))  # True\n```\n\n`b` вызываемый, потому что у него есть `__call__`.\n\n### Для чего используют `__call__`\n`__call__` используют, когда объект должен вести себя как функция, но при этом хранить состояние.\n\nПример счётчика:\n```python\nclass Counter:\n    def __init__(self):\n        self.count = 0\n\n    def __call__(self):\n        self.count += 1\n        return self.count\n\n\ncounter = Counter()\n\nprint(counter())  # 1\nprint(counter())  # 2\nprint(counter())  # 3\n```\n\nОбычная функция без замыкания не хранила бы состояние так явно. А объект с `__call__` может хранить данные в атрибутах.\n\n### Пример валидатора\n```python\nclass MinLengthValidator:\n    def __init__(self, min_length):\n        self.min_length = min_length\n\n    def __call__(self, value):\n        return len(value) >= self.min_length\n\n\nvalidate_password = MinLengthValidator(8)\n\nprint(validate_password(\"abc\"))       # False\nprint(validate_password(\"password\"))  # True\n```\n\nЗдесь объект `validate_password` работает как функция, но внутри хранит настройку:\n```python\nself.min_length\n```\n\n### Пример декоратора через класс\n\n`__call__` часто используют для создания декораторов-классов:\n```python\nclass Logger:\n    def __init__(self, func):\n        self.func = func\n\n    def __call__(self, *args, **kwargs):\n        print(f\"Вызов функции {self.func.__name__}\")\n        return self.func(*args, **kwargs)\n\n\n@Logger\ndef add(a, b):\n    return a + b\n\n\nprint(add(2, 3))\n```\n\nПримерно это равно:\n```python\ndef add(a, b):\n    return a + b\n\nadd = Logger(add)\n```\n\nТеперь `add` — это объект `Logger`, но его можно вызвать как функцию, потому что у `Logger` есть `__call__`.\n\n### `__call__` у класса и создание экземпляра\n\nКогда ты вызываешь класс:\n```python\nuser = User()\n```\n\nэто тоже вызов объекта. Сам класс `User` является объектом, и его вызов обрабатывается через метакласс `type`.\n\nУпрощённо:\n```python\nUser()\n```\n\nозначает:\n```python\ntype.__call__(User)\n```\n\nА внутри обычно происходят этапы:\n```text\n1. вызывается User.__new__\n2. затем User.__init__\n3. возвращается готовый экземпляр\n```\nТо есть создание объекта класса тоже связано с механизмом `__call__`.\n\n### Отличие от обычного метода\nОбычный метод вызывается явно по имени:\n```python\nobj.run()\n```\n\nА `__call__` позволяет вызывать сам объект:\n```python\nobj()\n```\n\nПример:\n```python\nclass Task:\n    def run(self):\n        print(\"run\")\n\n    def __call__(self):\n        print(\"call\")\n\n\ntask = Task()\n\ntask.run()  # обычный метод\ntask()      # вызов __call__\n```\n\n### Итог\n`__call__` делает экземпляр класса вызываемым объектом.\n\nКоротко:\n```python\nclass MyCallable:\n    def __call__(self, *args, **kwargs):\n        ...\n```\n\nПосле этого:\n```python\nobj = MyCallable()\nobj()\n```\nстановится валидным вызовом.\n\nИспользуют `__call__`, когда нужно совместить:\n```text\nповедение функции\n+\nсостояние объекта\n```\n\nТипичные случаи:\n```text\nвалидаторы\nфабрики\nдекораторы-классы\ncallback-объекты\nобъекты-команды\nстратегии\nленивые вычисления\n```"
  popularity = 2.63

[[questions]]
  id = 43
  question = "Как связаны методы __init__ и __call__?"
  answer = "### `__call__` работает с атрибутами класса или экземпляра?\n`__call__` — это **метод класса**, но при вызове объекта он получает **экземпляр** как первый аргумент `self`.\n```python\nclass Counter:\n    step = 1  # атрибут класса\n\n    def __init__(self):\n        self.value = 0  # атрибут экземпляра\n\n    def __call__(self):\n        self.value += self.step\n        return self.value\n\n\ncounter = Counter()\n\nprint(counter())  # 1\nprint(counter())  # 2\n```\n\nЗдесь:\n```python\nself.value\n```\n— атрибут экземпляра.\n\nА:\n```python\nself.step\n```\n— атрибут класса, найденный через экземпляр.\n\nТо есть внутри `__call__` можно работать и с атрибутами экземпляра, и с атрибутами класса.\n\n### Важный нюанс\n`__call__` обычно должен быть определён **в классе**, а не просто добавлен в конкретный объект.\n```python\nclass User:\n    pass\n\n\nuser = User()\n\nuser.__call__ = lambda: \"hello\"\n\nprint(user.__call__())  # hello\nprint(user())           # TypeError\n```\n\nПочему `user()` не работает?\n\nПотому что специальные методы вроде `__call__`, `__len__`, `__iter__`, `__add__` Python ищет не как обычные атрибуты экземпляра, а через тип объекта, то есть через класс. В документации Python указано, что специальные методы вызываются специальным синтаксисом и ищутся на типе объекта. \n\nПравильно:\n```python\nclass User:\n    def __call__(self):\n        return \"hello\"\n\n\nuser = User()\n\nprint(user())  # hello\n```\n\n### Обязательно ли писать `__init__`, если есть `__call__`?\nНет, не обязательно.\n`__init__` нужен только тогда, когда объекту нужно начальное состояние.\n\nПример без `__init__`:\n```python\nclass Hello:\n    def __call__(self, name):\n        return f\"Hello, {name}\"\n\n\nhello = Hello()\n\nprint(hello(\"Alex\"))  # Hello, Alex\n```\nЗдесь `__init__` не нужен, потому что объект не хранит состояние.\n\nПример, где `__init__` нужен:\n```python\nclass Multiplier:\n    def __init__(self, factor):\n        self.factor = factor\n\n    def __call__(self, value):\n        return value * self.factor\n\n\ndouble = Multiplier(2)\n\nprint(double(10))  # 20\n```\n\nЗдесь `__init__` нужен, потому что объект должен запомнить:\n```python\nself.factor\n```\n\nДокументация Python описывает `__init__` как метод, который вызывается после создания экземпляра для его инициализации. `__call__` же вызывается, когда экземпляр вызывают как функцию. \n\n### Разница между `__init__` и `__call__`\n\n|Метод|Когда вызывается|Для чего нужен|\n|---|---|---|\n|`__init__`|при создании объекта: `obj = Class(...)`|инициализировать состояние|\n|`__call__`|при вызове объекта: `obj(...)`|сделать объект вызываемым|\n\nПример с обоими:\n```python\nclass Power:\n    def __init__(self, exponent):\n        self.exponent = exponent\n\n    def __call__(self, number):\n        return number ** self.exponent\n\n\nsquare = Power(2)\n\nprint(square(5))  # 25\n```\n\nЧто происходит:\n```text\nPower(2)   -> создаётся объект, вызывается __init__\nsquare(5) -> вызывается __call__\n```\n\n### Итог\n`__call__`:\n```text\nопределяется в классе\nвызывается на экземпляре\nполучает self\nможет работать с атрибутами экземпляра\nможет читать атрибуты класса\nделает объект вызываемым\n```\n\n`__init__` писать не обязательно. Он нужен только если перед использованием `__call__` объект должен сохранить какое-то состояние."
  popularity = 5.26

[[questions]]
  id = 44
  question = "Влияет ли typing на выполнение программы в runtime?"
  answer = "Обычный `typing` **не заставляет программу соблюдать типы в runtime**.\n```python\ndef add(a: int, b: int) -> int:\n    return a + b\n\n\nprint(add(\"10\", \"20\"))\n```\n\nРезультат:\n```text\n1020\n```\n\nХотя написано:\n```python\na: int\nb: int\n```\n\nPython не остановит выполнение. Аннотации типов в основном нужны для статических анализаторов, IDE и линтеров. Официальная документация прямо говорит, что Python runtime не enforce-ит аннотации типов функций и переменных. \n### Что тогда делает `typing`\n`typing` даёт синтаксис и инструменты для описания типов:\n```python\nfrom typing import Optional, Callable, Iterable\n\n\ndef get_name(user_id: int) -> Optional[str]:\n    ...\n```\n\nЭто помогает:\n```text\nmypy / pyright проверять код до запуска\nIDE подсказывать методы и поля\nлинтерам находить ошибки\nразработчикам лучше понимать контракты функций\n```\n\nНо сам Python во время выполнения обычно не проверяет, что `user_id` действительно `int`.\n\n### Аннотации всё же существуют в runtime\nАннотации могут сохраняться в объекте:\n```python\ndef add(a: int, b: int) -> int:\n    return a + b\n\n\nprint(add.__annotations__)\n```\n\nРезультат:\n```python\n{'a': <class 'int'>, 'b': <class 'int'>, 'return': <class 'int'>}\n```\n\nТо есть они доступны для introspection. Документация Python указывает, что аннотации функций, классов и модулей могут храниться в `__annotations__`. \n\nТакже можно использовать:\n```python\nfrom typing import get_type_hints\n\n\nprint(get_type_hints(add))\n```\n\nНо это просто получение информации о типах, а не автоматическая проверка аргументов.\n\n### Когда typing всё-таки влияет на runtime\nЕсть несколько случаев, где типы могут косвенно влиять на выполнение:\n\n#### 1. Когда библиотека сама читает аннотации\nНапример, Pydantic, FastAPI, SQLAlchemy ORM, dataclasses и другие инструменты могут читать аннотации и на их основе строить валидацию, схемы, сериализацию или поля модели.\n\nПример с Pydantic:\n```python\nfrom pydantic import BaseModel\n\n\nclass User(BaseModel):\n    id: int\n    name: str\n```\n\nЗдесь уже не сам Python проверяет типы, а библиотека.\n\n#### 2. Когда используется `dataclass`\n```python\nfrom dataclasses import dataclass\n\n\n@dataclass\nclass User:\n    name: str\n    age: int\n```\n\nНо даже `dataclass` сам по себе не проверяет типы:\n```python\nuser = User(name=123, age=\"wrong\")\nprint(user)\n```\n\nЭто выполнится, если не подключена дополнительная валидация.\n\n#### 3. Когда код явно проверяет типы\n```python\ndef add(a: int, b: int) -> int:\n    if not isinstance(a, int):\n        raise TypeError(\"a должен быть int\")\n\n    if not isinstance(b, int):\n        raise TypeError(\"b должен быть int\")\n\n    return a + b\n```\nЗдесь проверка работает, но не из-за `typing`, а из-за ручного `isinstance`.\n\n### Важное отличие\n```python\ndef func(value: int):\n    ...\n```\n\nЭто не значит:\n```text\nPython запретит передать str\n```\n\nЭто значит:\n```text\nразработчик ожидает int\ntype checker может проверить int\nIDE может подсказать int\nruntime сам не обязан проверять int\n```\n\n### Итог\n`typing` напрямую почти не влияет на выполнение программы в runtime.\nОн влияет на:\n```text\nстатическую проверку\nподсказки IDE\nчитаемость кода\nдокументацию контракта\nработу библиотек, которые читают аннотации\n```\nНо не делает Python статически типизированным языком.\n"
  popularity = 5.26

[[questions]]
  id = 45
  question = "Что такое правило LEGB и какие области видимости существуют в Python?"
  answer = "### Использование LEGB\n\nКонцепция области видимости в Python обычно представлена c использованием правила, известного как правило **LEGB**. Буквы в аббревиатуре LEGB обозначают локальную, вложенную, глобальную и встроенную (**Local, Enclosing, Global и Built-in Scope**) области.\n\n- **Локальная (или функция) область видимости (Local)** — это блок кода или тело любой функции Python или лямбда-выражения. Эта область Python содержит имена, которые вы определяете внутри функции. Эти имена будут видны только из кода функции. Он создается при вызове функции, а не при ее определении, поэтому у вас будет столько же различных локальных областей, сколько и при вызовах функций. Это верно, даже если вы вызываете одну и ту же функцию несколько раз или рекурсивно.Каждый вызов приведет к созданию новой локальной области.\n- **Вложенная (или нелокальная) область видимости (Enclosing)** — это особая область видимости, которая существует только для вложенных функций. Если локальная область видимости является внутренней или вложенной функцией, тогда вложенная область видимости является областью внешней или вложенной функции. Эта область содержит имена, которые вы определяете во вложенной функции. Имена в охватывающей области видны из кода внутренних и включающих функций.\n- **Глобальная (или модульная) область видимости (Global)** — это самая верхняя область в программе, скрипте или модуле Python. Эта область Python содержит все имена, которые вы определяете на верхнем уровне программы или модуля.Имена в этой области Python видны повсюду в вашем коде.\n- **Встроенная область видимости (Built-in)** — это специальная область видимости Python, которая создается или загружается всякий раз, когда вы запускаете скрипт или открываете интерактивный сеанс. Эта область содержит имена, такие как ключевые слова, функции, исключения и другие атрибуты, встроенные в Python. Имена в этой области Python также доступны повсюду в вашем коде. Он автоматически загружается Python при запуске программы или сценария.\n\n**Правило LEGB** — это своего рода процедура поиска имени, которая определяет порядок, в котором Python ищет имена. Например, если вы ссылаетесь на данное имя, тогда Python будет искать это имя последовательно в локальной, вложенной, глобальной и встроенной области видимости. Если имя существует, вы получите первое его появление. В противном случае вы получите ошибку.\n\nВ любой момент времени во время выполнения у вас будет не более четырех активных областей видимости — локальной, вложенной, глобальной и встроенной — в зависимости от того, где вы находитесь в коде. С другой стороны, у вас всегда будет как минимум две активные области: глобальная и встроенная. Эти две области всегда под прицелом.\n\n### Функции: локальная область видимости\nЛокальная область видимости или область функции создаётся при вызове функции. Каждый раз, при вызове функцию, создаётся новая локальная область видимости. С другой стороны, можно рассматривать каждый оператор def и лямбда-выражение как образец для новых локальных областей видимости. Эти локальные области будут появляться всякий раз при вызове функций под рукой.\n\nПо умолчанию параметры и имена, которые вы назначаете внутри функции, существуют только в пределах функции или локальной области, связанной с вызовом функции. Когда функция завершается, локальная область видимости уничтожается, а имена забываются. \n\nВот как это работает:\n```python\n>>> def square(base):\n...     result = base ** 2\n...     print(f'The square of {base} is: {result}')\n...\n>>> square(10)\nThe square of 10 is: 100\n>>> result  # Недоступен снаружи square()\nTraceback (most recent call last):\n  File \"<stdin>\", line 1, in <module>\n    result\nNameError: name 'result' is not defined\n>>> base  # Недоступен снаружи square()\nTraceback (most recent call last):\n  File \"<stdin>\", line 1, in <module>\n    base\nNameError: name 'base' is not defined\n>>> square(20)\nThe square of 20 is: 400\n</module></stdin></module></stdin>\n```\n\n`square()` — это функция, которая вычисляет квадрат заданного числа по основанию. Когда вы вызываете функцию, Python создает локальную область видимости, содержащую базу имен (аргумент) и результат (локальную переменную). После первого вызова `square()` `base` содержит значение 10, а `result` — значение 100. Во второй разлокальные имена не будут запоминать значения, которые были сохранены в них при первом вызове функции. Обратите внимание, что `base` теперь содержит значение 20, а `result` — 400.\n\nЕсли вы попытаетесь получить доступ к результату или базе после вызова функции, вы получите `NameError`, потому что они существуют только в локальной области, созданной вызовом `square()`. Всякий раз, когда вы пытаетесь получить доступ к имени, которое не определено ни в одной области Python, вы получаете ошибку `NameError`. В сообщении об ошибке будет указано имя, которое не удалось найти.\n\nПоскольку вы не можете получить доступ к локальным именам из операторов, находящихся вне функции, разные функции могут определять объекты с одинаковыми именами. Посмотрите этот пример:\n\n```python\n>>> def cube(base):\n...     result = base ** 3\n...     print(f'The cube of {base} is: {result}')\n...\n>>> cube(30)\nThe cube of 30 is: 27000\n```\n\nОбратите внимание, что вы определяете `cube()`, используя ту же переменную и параметр, которые вы использовали в `square()`. Однако, поскольку `cube()` не может видеть имена внутри локальной области видимости `square()` и наоборот, обе функции работают должным образом без какого-либо конфликта имен.\n\nВы можете избежать конфликтов имен в своих программах, правильно используя локальную область видимости Python. Это также делает функции более самодостаточными и создает поддерживаемые программные модули. Кроме того, поскольку вы не можете изменять локальные имена из удаленных мест в коде, ваши программы будет легче отлаживать, читать и изменять.\n\nВы можете проверить имена и параметры функции, используя `.__code__`, который является атрибутом, содержащим информацию о внутреннем коде функции. Взгляните на код ниже:\n\n```python\n>>> square.__code__.co_varnames\n('base', 'result')\n>>> square.__code__.co_argcount\n1\n>>> square.__code__.co_consts\n(None, 2, 'The square of ', ' is: ')\n>>> square.__code__.co_name\n'square'\n```\n\nВ этом примере кода вы проверяете `.__code__` на `square()`. Это специальный атрибут, содержащий информацию о коде функции Python. В этом случае вы видите, что `.co_varnames` содержит кортеж, содержащий имена, которые вы определяете внутри `square()`.\n\n### Вложенные функции: вложенные данные\nВложенная или нелокальная область видимости наблюдается, когда вы вкладываете функции внутрь других функций. Вложенная область видимости была добавлена в Python 2.2. Он принимает форму локальной области видимости любой вложенной функции. Имена, которые вы определяете во вложенной области Python, обычно называют **нелокальными именами**. Рассмотрим следующий код:\n\n```python\n>>> def outer_func():\n...     # Этот блок является локальной областью outer_func()\n...     var = 100  # A nonlocal var\n...     # Это также область видимости inner_func()\n...     def inner_func():\n...         # Этот блок является локальной областью inner_func()\n...         print(f\"Printing var from inner_func(): {var}\")\n...\n...     inner_func()\n...     print(f\"Printing var from outer_func(): {var}\")\n...\n>>> outer_func()\nPrinting var from inner_func(): 100\nPrinting var from outer_func(): 100\n>>> inner_func()\nTraceback (most recent call last):\n  File \"<stdin>\", line 1, in <module>\nNameError: name 'inner_func' is not defined\n</module></stdin>\n```\n\nКогда вы вызываете `external_func()`, вы также создаете локальную область видимости. Локальная область видимости `outer_func()` в то же время является охватывающей областью `inner_func()`. Изнутри `inner_func()` эта область не является ни глобальной, ни локальной. Это особая область видимости, которая находится между этими двумя областями и известна как вложенная область. В некотором смысле `inner_func()` — это временная функция, которая оживает только во время выполнения своей функции-оболочки `external_func()`. Обратите внимание, что `inner_func()` виден только коду в `outer_func()`.\n\nВсе имена, которые вы создаете во вложенной области видимости, видны изнутри `inner_func()`, кроме созданных после вызова `inner_func()`. Вот новая версия `outer_fun()`, которая показывает это:\n\n```python\n>>> def outer_func():\n...     var = 100\n...     def inner_func():\n...         print(f\"Printing var from inner_func(): {var}\")\n...         print(f\"Printing another_var from inner_func(): {another_var}\")\n...\n...     inner_func()\n...     another_var = 200  # This is defined after calling inner_func()\n...     print(f\"Printing var from outer_func(): {var}\")\n...\n>>> outer_func()\nPrinting var from inner_func(): 100\nTraceback (most recent call last):\n  File \"<stdin>\", line 1, in <module>\n    outer_func()\n  File \"<stdin>\", line 7, in outer_func\n    inner_func()\n  File \"<stdin>\", line 5, in inner_func\n    print(f\"Printing another_var from inner_func(): {another_var}\")\nNameError: free variable 'another_var' referenced before assignment in enclosing\n scope\n</stdin></stdin></module></stdin>\n```\n\nКогда вы вызываете `external_func()`, код работает до точки, в которой вы вызываете `inner_func()`. Последний оператор `inner_func()` пытается получить доступ к `another_var`. На данный момент `another_var` еще не определено, поэтому Python вызывает `NameError`, потому что не может найти имя, которое вы пытаетесь использовать.\n\nПоследний, но тем не менее важный момент, нельзя изменять имена во вложенной области из вложенной функции, если не объявите их `nonlocal` во вложенной функции.\n\n### Модули: глобальные данные\nС момента запуска программы Python вы находитесь в глобальной области действия Python. Внутренне Python превращает основной скрипт вашей программы в модуль с именем `__main__` для выполнения основной программы. Пространство имен этого модуля — основная глобальная область видимости вашей программы.\n\nВ Python понятия глобальной области видимости и глобальных имен тесно связаны с файлами модулей. Например, если вы определяете имя на верхнем уровне любого модуля Python, то это имя считается глобальным для модуля. Вот почему такая область видимости также называется областью модуля. Всякий раз, когда вы запускаете программу Python или интерактивный сеанс, интерпретатор выполняет код в модуле или скрипте, который служит точкой входа в вашу программу. Этот модуль или скрипт загружается со специальным именем `__main__`. С этого момента вы можете сказать, что ваша основная глобальная область видимости — это область видимости **main**. Для проверки имен в вашей основной глобальной области видимости, можно использовать dir(). Если вы вызовете dir() без аргументов, то получите список имен, которые находятся в текущей глобальной области видимости. Взгляните на этот код:\n\n```python\n>>> dir()\n['__annotations__', '__builtins__',..., '__package__', '__spec__']\n>>> var = 100  # Назначьте var на верхнем уровне __main__\n>>> dir()\n['__annotations__', '__builtins__',..., '__package__', '__spec__', 'var']\n```\n\nКогда вы вызываете dir() без аргументов, то получаете список имен, доступных в вашей основной глобальной области Python. Обратите внимание, что если вы назначите новое имя (например, здесь var) на верхнем уровне модуля (здесь **main**), то это имя будет добавлено в список, возвращаемый dir().\n\nНа выполнение программы существует только одна глобальная область видимости Python. Эта область сохраняется до тех пор, пока программа не завершится и все ее имена не будут забыты. В противном случае при следующем запуске программы имена будут помнить свои значения из предыдущего запуска. Вы можете получить доступ к значению любого глобального имени или сослаться на него из любого места в вашем коде. Сюда входят функции и классы. Вот пример, поясняющий эти моменты:\n\n```python\n>>> var = 100\n>>> def func():\n...     return var  # Вы можете получить доступ к var из func()\n...\n>>> func()\n100\n>>> var  # Остается неизменной\n100\n```\n\nВнутри func() вы можете свободно обращаться к значению var или ссылаться на него. Это не влияет на ваше глобальное имя var, но показывает, что к var можно получить свободный доступ из func(). С другой стороны, вы не можете назначать глобальные имена внутри функций, если вы явно не объявите их как глобальные имена с помощью глобального оператора, который вы увидите позже.\n\nКаждый раз, когда вы присваиваете значение имени в Python, может произойти одно из двух:\n\n- Вы создаете новое имя\n- Вы обновляете существующее имя\n\nКонкретное поведение будет зависеть от области Python, в которой вы назначаете имя. Если вы попытаетесь присвоить значение глобальному имени внутри функции, тогда вы создадите это имя в локальной области видимости функции, затеняя или замещая глобальное имя. Это означает, что вы не сможете изменить большинство переменных, которые были определены вне функции, изнутри функции.\n\nЕсли вы будете следовать этой логике, то поймете, что следующий код не будет работать так, как вы могли ожидать:\n\n```python\n>>> var = 100  # Глобальная переменная\n>>> def increment():\n...     var = var + 1  # Попробуйте обновить глобальную переменную\n...\n>>> increment()\nTraceback (most recent call last):\n  File \"<stdin>\", line 1, in <module>\n    increment()\n  File \"<stdin>\", line 2, in increment\n    var = var + 1\nUnboundLocalError: local variable 'var' referenced before assignment\n</stdin></module></stdin>\n```\n\nВнутри increment() вы пытаетесь увеличить глобальную переменную var. Поскольку var не объявлен глобальным внутри функции increment(), Python создает новую локальную переменную с тем же именем var внутри функции. В процессе Python понимает, что вы пытаетесь использовать локальную переменную до ее первого присвоения (var + 1), поэтому вызывает UnboundLocalError. Вот еще один пример:\n\n```python\n>>> var = 100  # Глобальная переменная\n>>> def func():\n...     print(var)  # Ссылка на глобальную переменную var\n...     var = 200   # Определить новую локальную переменную с тем же именем var\n...\n>>> func()\nTraceback (most recent call last):\n  File \"<stdin>\", line 1, in <module>\n    func()\n  File \"<stdin>\", line 2, in func\n    print(var)\nUnboundLocalError: local variable 'var' referenced before assignment\n</stdin></module></stdin>\n```\n\nВы, вероятно, ожидаете, что сможете распечатать глобальную переменную и обновить ее позже, но снова вы получите UnboundLocalError. Здесь происходит следующее: когда вы запускаете тело функции func(), Python решает, что var является локальной переменной, поскольку она назначается в области видимости функции. Это не ошибка, а выбор дизайна. Python предполагает, что имена, присвоенные в теле функции, являются локальными для этой функции.\n\nГлобальные имена можно обновлять или изменять из любого места в вашей глобальной области Python. Помимо этого, оператор global можно использовать для изменения глобальных имен практически из любого места в вашем коде.\n\nИзменение глобальных имен обычно считается плохой практикой программирования, потому что это может привести к следующему:\n\n- Трудно отладить: почти любой оператор в программе может изменить значение глобального имени.\n- Трудно понять: вам нужно знать все операторы, которые обращаются к глобальным именам и изменяют их.\n- Невозможно повторно использовать: код зависит от глобальных имен, специфичных для конкретной программы.\n\nХорошая практика программирования рекомендует использовать локальные имена, а не глобальные. Вот несколько советов:\n\n- Напишите автономные функции, которые полагаются на локальные имена, а не на глобальные.\n- Старайтесь использовать уникальные имена объектов, независимо от того, в какой области вы находитесь.\n- Избегайте глобальных модификаций имен в ваших программах.\n- Избегайте изменения имени кросс-модуля.\n- Используйте глобальные имена как константы, которые не меняются во время выполнения вашей программы.\n\nВ следующем примере показано, где расположены области видимости в вашем коде и как Python ищет имена с их помощью:\n\n```python\n>>> # Эта область является глобальной или модульной областью\n>>> number = 100\n>>> def outer_func():\n...     # Этот блок является локальной областью outer_func()\n...     # Это также область видимости inner_func()\n...     def inner_func():\n...         # Этот блок является локальной областью inner_func()\n...         print(number)\n...\n...     inner_func()\n...\n>>> outer_func()\n100\n```\n\nКогда вы вызываете outer_func(), вы получаете 100, напечатанное на вашем экране. Но как в этом случае Python ищет номер имени? Следуя правилу LEGB, вы будете искать числа в следующих местах:\n\n**Внутри inner_func()**: это локальная область видимости, но числа там не существует.\n\n**Внутри outer_func()**: это вложенная область,но и там число не определено.\n\n**В области видимости модуля**: Это глобальная область видимости, и вы найдете там номер, чтобы вы могли вывести его на экран.\n\nЕсли число не определено внутри глобальной области видимости, Python продолжает поиск, просматривая встроенную область видимости. Это последний компонент правила LEGB, как вы увидите далее.\n\n### Встроенные функции: встроенные данные\nВстроенная область видимости — это специальная область видимости Python, которая реализована в виде стандартного библиотечного модуля с именем **builtins** в Python 3.x. Все встроенные объекты Python находятся в этом модуле. Они автоматически загружаются во встроенную область видимости, когда вы запускаете интерпретатор Python. Python выполняет поиск встроенных функций последними в поиске LEGB, так что вы получите все имена, которые он определяет, бесплатно. Это означает, что вы можете использовать их без импорта какого-либо модуля.\n\nОбратите внимание, что имена во встроенных командах всегда загружаются в вашу глобальную область Python со специальным именем `__builtins__`, как вы можете видеть в следующем коде:\n\n```python\n>>> dir()\n['__annotations__', '__builtins__',..., '__package__', '__spec__']\n>>> dir(__builtins__)\n['ArithmeticError', 'AssertionError',..., 'tuple', 'type', 'vars', 'zip']\n```\n\nВ выводе первого вызова dir() вы можете видеть, что `__builtins__` всегда присутствует в глобальной области Python. Если вы проверите сам `__builtins__` с помощью dir(), вы получите полный список встроенных имен Python.\n\nВстроенная область видимости добавляет более 150 имен в вашу текущую глобальную область видимости Python. Например, в Python 3.8 вы можете узнать точное количество имен следующим образом:\n\n```python\n>>> len(dir(__builtins__))\n152\n```\n\nС помощью вызова len() вы получаете количество элементов в списке, возвращаемое функцией dir(). Это возвращает 152 имени, которые включают исключения, функции, типы, специальные атрибуты и другие встроенные объекты Python.\n\nНесмотря на то, что вы можете получить доступ ко всем этим встроенным объектам Python бесплатно (ничего не импортируя), вы также можете явно импортировать встроенные функции и получать доступ к именам, используя точечную нотацию. Вот как это работает:\n\n```python\n>>> import builtins  # Импортировать встроенные функции как обычный модуль\n>>> dir(builtins)\n['ArithmeticError', 'AssertionError',..., 'tuple', 'type', 'vars', 'zip']\n>>> builtins.sum([1, 2, 3, 4, 5])\n15\n>>> builtins.max([1, 5, 8, 7, 3])\n8\n>>> builtins.sorted([1, 5, 8, 7, 3])\n[1, 3, 5, 7, 8]\n>>> builtins.pow(10, 2)\n100\n```\n\nВы можете импортировать встроенные модули, как и любой другой модуль Python. С этого момента вы можете получить доступ ко всем именам во встроенных функциях, используя поиск атрибутов с точками или полностью определенные имена. Это может быть весьма полезно, если вы хотите убедиться, что у вас не будет конфликта имен, если какое-либо из ваших глобальных имен переопределяет любое встроенное имя. Вы можете переопределить или переопределить любое встроенное имя в своей глобальной области видимости. Если вы это сделаете, имейте в виду, что это повлияет на весь ваш код. Взгляните на следующий пример:\n\n```python\n>>> abs(-15)  # Стандартное использование встроенной функции\n15\n>>> abs = 20  # Переопределить встроенное имя в глобальной области видимости\n>>> abs(-15)\nTraceback (most recent call last):\n  File \"<stdin>\", line 1, in <module>\nTypeError: 'int' object is not callable\n</module></stdin>\n```\n\nЕсли вы переопределите или повторно назначите `abs`, то исходный встроенный `abs()` повлияет на весь ваш код. Теперь предположим, что вам нужно вызвать исходный `abs()`, но вы забыли, что переназначили имя. В этом случае, когда вы снова вызываете `abs()`, вы получите ошибку TypeError, потому что `abs` теперь содержит ссылку на целое число, которое нельзя вызвать."
  popularity = 2.63

[[questions]]
  id = 46
  question = "Как передаются переменные в Python: по ссылке или по значению?"
  answer = "Когда вы передаете аргумент в функцию, вы передаете ссылку на объект, а не сам объект. Это означает, что если вы изменяете значение аргумента внутри функции, то эти изменения будут отражены на самом объекте за пределами функции. Если вы присваиваете новое значение самому аргументу, это не изменит объекта за пределами функции.\n\n```python\ndef modify_list(my_list):\n    my_list.append(4)        # изменяем список, на который ссылается аргумент\n    my_list = [1, 2, 3]      # присваиваем новый список самому аргументу\n\noriginal_list = [0]\nmodify_list(original_list)\n\nprint(original_list)  # Выведет: [0, 4], изменения внутри функции отражены на оригинальном объекте\n```\n\nВ этом примере список **`original_list`** изменяется внутри функции **`modify_list()`**, добавляя в него элемент 4. Эти изменения отражаются на самом объекте **`original_list`**, так как мы работаем с одним и тем же списком. Однако, когда мы присваиваем новый список переменной **`my_list`** внутри функции, это не изменяет объект **`original_list`**, а только изменяет то, на что ссылается аргумент функции.\n\nАргументы передаются по ссылке на объект, но поведение может отличаться в зависимости от того, какие операции вы выполняете с аргументами внутри функции."
  popularity = 5.26

[[questions]]
  id = 47
  question = "Что такое и для чего используется @property"
  answer = "### Что такое `@property`\n`@property` — это встроенный декоратор Python, который позволяет обращаться к методу как к обычному атрибуту.\n\nТо есть вместо:\n```python\nuser.get_name()\n```\n\nможно писать:\n```python\nuser.name\n```\n\nПример:\n```python\nclass User:\n    def __init__(self, first_name, last_name):\n        self.first_name = first_name\n        self.last_name = last_name\n\n    @property\n    def full_name(self):\n        return f\"{self.first_name} {self.last_name}\"\n\n\nuser = User(\"Alex\", \"Smith\")\n\nprint(user.full_name)\n```\n\nРезультат:\n```text\nAlex Smith\n```\n\nХотя `full_name` — это метод, вызываем мы его как атрибут:\n```python\nuser.full_name\n```\n\nА не так:\n```python\nuser.full_name()\n```\n\nОфициальная документация описывает `property` как встроенный класс, который возвращает property-атрибут и позволяет определить getter, setter и deleter.  \n\n---\n\n### Зачем используется `@property`\nГлавная идея: **дать удобный доступ как к атрибуту, но оставить возможность управлять логикой получения значения**.\n\nНапример, есть вычисляемое значение:\n```python\nclass Rectangle:\n    def __init__(self, width, height):\n        self.width = width\n        self.height = height\n\n    @property\n    def area(self):\n        return self.width * self.height\n\n\nrect = Rectangle(10, 5)\n\nprint(rect.area)  # 50\n```\n`area` не хранится как отдельный атрибут. Оно вычисляется каждый раз при обращении.\n\n---\n\n### `@property` как getter\n```python\nclass User:\n    def __init__(self, age):\n        self._age = age\n\n    @property\n    def age(self):\n        return self._age\n```\n\nИспользование:\n```python\nuser = User(20)\n\nprint(user.age)\n```\n\nЗдесь:\n```python\nuser.age\n```\n\nвызывает метод:\n```python\ndef age(self):\n    return self._age\n```\n\nНо внешне выглядит как обычный атрибут.\n\n---\n\n### `@property` с setter\nМожно контролировать запись значения:\n```python\nclass User:\n    def __init__(self, age):\n        self.age = age\n\n    @property\n    def age(self):\n        return self._age\n\n    @age.setter\n    def age(self, value):\n        if value < 0:\n            raise ValueError(\"Возраст не может быть отрицательным\")\n\n        self._age = value\n```\n\nИспользование:\n```python\nuser = User(20)\n\nuser.age = 25\nprint(user.age)  # 25\n\nuser.age = -5    # ValueError\n```\n\nЗдесь `@property` отвечает за чтение:\n```python\nuser.age\n```\n\nА `@age.setter` отвечает за запись:\n```python\nuser.age = 25\n```\n\n---\n\n### `@property` без setter делает атрибут read-only\n```python\nclass User:\n    def __init__(self, name):\n        self._name = name\n\n    @property\n    def name(self):\n        return self._name\n\n\nuser = User(\"Alex\")\n\nprint(user.name)  # Alex\nuser.name = \"Bob\" # AttributeError\n```\n\nЕсли setter не определён, атрибут нельзя изменить обычным присваиванием.\n\n---\n\n### `@property` с deleter\n\nМожно также управлять удалением атрибута:\n```python\nclass User:\n    def __init__(self, name):\n        self._name = name\n\n    @property\n    def name(self):\n        return self._name\n\n    @name.deleter\n    def name(self):\n        del self._name\n```\n\nИспользование:\n```python\nuser = User(\"Alex\")\n\ndel user.name\n```\n\nПри этом вызывается:\n```python\n@name.deleter\ndef name(self):\n    del self._name\n```\n\n---\n\n### Почему часто используют `_name`\n\nВ примерах часто пишут так:\n```python\nself._age = age\n```\n\nА не так:\n```python\nself.age = age\n```\n\nПричина: если внутри getter обратиться к `self.age`, получится рекурсия.\n\nПлохо:\n```python\nclass User:\n    @property\n    def age(self):\n        return self.age\n```\n\nЧто произойдёт:\n```text\nuser.age\n-> вызывается property age\n-> внутри return self.age\n-> снова вызывается property age\n-> снова return self.age\n-> RecursionError\n```\n\nПравильно хранить реальное значение в другом атрибуте:\n```python\nself._age\n```\n\nА наружу отдавать через property:\n```python\nuser.age\n```\n\n---\n\n### Чем `@property` отличается от обычного метода\n\nОбычный метод:\n```python\nclass Rectangle:\n    def get_area(self):\n        return self.width * self.height\n```\n\nВызов:\n```python\nrect.get_area()\n```\n\n`@property`:\n```python\nclass Rectangle:\n    @property\n    def area(self):\n        return self.width * self.height\n```\n\nВызов:\n```python\nrect.area\n```\n\nРазница по смыслу:\n\n|Подход|Когда использовать|\n|---|---|\n|обычный метод|действие, операция, команда|\n|`@property`|значение, характеристика объекта|\n\nНапример:\n```python\nuser.save()\n```\n\nЭто метод, потому что это действие.\n```python\nuser.full_name\n```\n\nЭто property, потому что это характеристика объекта.\n\n---\n\n### Связь с дескрипторами\n\n`property` — это встроенный дескриптор. Он работает через механизм `__get__`, `__set__` и `__delete__`.\n\nУпрощённо:\n```python\nuser.age\n```\nвызывает getter.\n```python\nuser.age = 20\n```\nвызывает setter.\n```python\ndel user.age\n```\nвызывает deleter.\n\nЭто часть стандартного механизма доступа к атрибутам в Python.  \n\n---\n\n### Когда использовать `@property`\n`@property` используют, когда нужно:\n```text\nсделать вычисляемый атрибут\nскрыть внутреннее хранение данных\nдобавить валидацию при записи\nсделать read-only атрибут\nсохранить старый интерфейс класса\nуправлять доступом к данным без изменения синтаксиса вызова\n```\n\nПример сохранения интерфейса:\n```python\nclass User:\n    def __init__(self, birth_year):\n        self.birth_year = birth_year\n\n    @property\n    def age(self):\n        return 2026 - self.birth_year\n```\n\nСнаружи удобно:\n```python\nuser.age\n```\nХотя внутри значение вычисляется."
  popularity = 2.63

[[questions]]
  id = 48
  question = "Как динамически создать класс в runtime"
  answer = "### Основной способ — через `type()`\nВ Python класс можно создать динамически в runtime через `type`.\n\nОбычное объявление:\n```python\nclass User:\n    role = \"admin\"\n\n    def say_hello(self):\n        return \"Hello\"\n```\n\nПримерно эквивалентно:\n```python\ndef say_hello(self):\n    return \"Hello\"\n\n\nUser = type(\n    \"User\",          # имя класса\n    (),              # базовые классы\n    {\n        \"role\": \"admin\",\n        \"say_hello\": say_hello,\n    }\n)\n```\n\nИспользование:\n```python\nuser = User()\n\nprint(user.role)          # admin\nprint(user.say_hello())   # Hello\nprint(type(User))         # <class 'type'>\n```\n\n`type(name, bases, dict)` с тремя аргументами создаёт новый объект типа, то есть новый класс. Это описано в официальной документации Python по встроенной функции `type`. \n\n---\n\n### Что означают аргументы `type`\n```python\nUser = type(\"User\", (), {})\n```\n\n|Аргумент|Значение|\n|---|---|\n|`\"User\"`|имя создаваемого класса|\n|`()`|кортеж базовых классов|\n|`{}`|namespace класса: атрибуты и методы|\n\nПример с наследованием:\n```python\nclass Base:\n    def base_method(self):\n        return \"base\"\n\n\ndef user_method(self):\n    return \"user\"\n\n\nUser = type(\n    \"User\",\n    (Base,),\n    {\n        \"role\": \"admin\",\n        \"user_method\": user_method,\n    }\n)\n\nobj = User()\n\nprint(obj.base_method())  # base\nprint(obj.user_method())  # user\nprint(obj.role)           # admin\n```\nЗдесь динамически созданный `User` наследуется от `Base`.\n\n---\n\n### Добавление `__init__`\n```python\ndef __init__(self, name):\n    self.name = name\n\n\ndef greet(self):\n    return f\"Hello, {self.name}\"\n\n\nUser = type(\n    \"User\",\n    (),\n    {\n        \"__init__\": __init__,\n        \"greet\": greet,\n    }\n)\n\nuser = User(\"Alex\")\n\nprint(user.name)     # Alex\nprint(user.greet())  # Hello, Alex\n```\nВажно: функции, переданные в словарь класса, становятся методами.\n\n---\n\n### Динамическое создание класса с `@property`\n```python\ndef __init__(self, first_name, last_name):\n    self.first_name = first_name\n    self.last_name = last_name\n\n\ndef get_full_name(self):\n    return f\"{self.first_name} {self.last_name}\"\n\n\nUser = type(\n    \"User\",\n    (),\n    {\n        \"__init__\": __init__,\n        \"full_name\": property(get_full_name),\n    }\n)\n\nuser = User(\"Alex\", \"Smith\")\n\nprint(user.full_name)  # Alex Smith\n```\nЗдесь `property(get_full_name)` вручную создаёт property-атрибут.\n\n---\n\n### Динамическое создание класса с метаклассом\nТак как `type` — это стандартный метакласс, можно создать свой метакласс:\n```python\nclass Meta(type):\n    def __new__(mcls, name, bases, namespace):\n        namespace[\"created_by_meta\"] = True\n        return super().__new__(mcls, name, bases, namespace)\n\n\nUser = Meta(\n    \"User\",\n    (),\n    {\n        \"role\": \"admin\",\n    }\n)\n\nprint(User.created_by_meta)  # True\nprint(User.role)             # admin\n```\n\nЗдесь класс `User` создаётся не обычным `type`, а метаклассом `Meta`.\n\n---\n\n### Более правильный низкоуровневый способ — `types.new_class`\nВ стандартной библиотеке есть модуль `types`, который содержит утилиты для динамического создания новых типов. Документация прямо описывает `types` как модуль для помощи в динамическом создании новых типов. ([Python documentation](https://docs.python.org/3/library/types.html?utm_source=chatgpt.com \"types — Dynamic type creation and names for built-in types\"))\n\nПример:\n```python\nimport types\n\n\ndef exec_body(namespace):\n    namespace[\"role\"] = \"admin\"\n\n    def say_hello(self):\n        return \"Hello\"\n\n    namespace[\"say_hello\"] = say_hello\n\n\nUser = types.new_class(\n    \"User\",\n    (),\n    {},\n    exec_body\n)\n\nuser = User()\n\nprint(user.role)         # admin\nprint(user.say_hello())  # Hello\n```\n\n`types.new_class` полезен, когда нужно создать класс ближе к обычному механизму `class`, особенно если важны метаклассы, `__prepare__` и корректная обработка namespace.\n\n---\n\n### Когда реально используют динамическое создание классов\nОбычно это нужно не в прикладном коде, а во фреймворках и библиотеках:\n```text\nORM\nсериализаторы\nвалидаторы\nгенерация DTO / schema-классов\nдинамические proxy-классы\nтестовые mock-классы\nплагины\nметапрограммирование\n```\n\nНапример, ORM может динамически создавать классы моделей по схеме БД, а библиотека валидации — создавать классы схем на основе конфигурации.\n\n---\n\n### Когда лучше не использовать\nЕсли класс известен заранее, лучше писать обычный `class`:\n```python\nclass User:\n    pass\n```\n\nДинамическое создание через `type()` хуже читается и сложнее для IDE, type checker-ов и других разработчиков.\n\n---\n\n### Итог\nКласс в runtime можно создать так:\n```python\nUser = type(\"User\", (), {\"role\": \"admin\"})\n```\n\nЭто создаёт полноценный класс:\n```python\nuser = User()\nprint(user.role)\n```\n\nГлавная формула:\n```python\nClassName = type(\n    \"ClassName\",\n    (BaseClass,),\n    {\n        \"attr\": value,\n        \"method\": function,\n    }\n)\n```\nДля простых случаев достаточно `type()`. Для более сложного и корректного метапрограммирования лучше смотреть в сторону `types.new_class()`."
  popularity = 2.63

