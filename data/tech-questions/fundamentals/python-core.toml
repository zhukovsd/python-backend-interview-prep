  question = "Что происходит с __slots__ в наследниках класса?"
  answer = "### Кратко\n\n`__slots__` в наследовании работает так:\n```text\nслоты родителя доступны наследнику,\nно наследник по умолчанию снова получает __dict__,\nесли сам не объявит __slots__\n```\n\nОфициальная документация Python указывает: `__slots__` запрещает автоматическое создание `__dict__` и `__weakref__`, но только при соблюдении условий наследования. Слоты родителей доступны в дочерних классах, однако экземпляры подкласса получат `__dict__`, если подкласс сам не объявит `__slots__`. \n\n### 1. Родитель со `__slots__`, наследник без `__slots__`\n```python\nclass Base:\n    __slots__ = (\"name\",)\n\n\nclass Child(Base):\n    pass\n\n\nobj = Child()\nobj.name = \"Alex\"\nobj.age = 20\n\nprint(obj.name)  # Alex\nprint(obj.age)   # 20\nprint(obj.__dict__)  # {'age': 20}\n```\n\nЗдесь `name` хранится в слоте родителя, но у `Child` появился обычный `__dict__`, потому что `Child` не объявил свои `__slots__`.\n\nТо есть ограничение на новые атрибуты **сломалось**:\n```python\nobj.age = 20  # можно\n```\n\n### 2. Родитель со `__slots__`, наследник тоже со `__slots__`\n```python\nclass Base:\n    __slots__ = (\"name\",)\n\n\nclass Child(Base):\n    __slots__ = (\"age\",)\n\n\nobj = Child()\nobj.name = \"Alex\"\nobj.age = 20\nobj.email = \"a@mail\"  # AttributeError\n```\n\nЗдесь у объекта есть только:\n```text\nname — слот родителя\nage  — слот наследника\n```\n\nА произвольный атрибут `email` создать нельзя, потому что у экземпляра нет `__dict__`. Документация прямо указывает: без `__dict__` нельзя присваивать имена, не перечисленные в `__slots__`; попытка даст `AttributeError`. ([Python documentation](https://docs.python.org/3/reference/datamodel.html \"3. Data model — Python 3.14.6 documentation\"))\n\n### 3. Наследник может объявить пустые `__slots__`\nЕсли наследнику не нужны новые поля, но нужно сохранить ограничение, пишут так:\n```python\nclass Base:\n    __slots__ = (\"name\",)\n\n\nclass Child(Base):\n    __slots__ = ()\n```\n\nТеперь:\n```python\nobj = Child()\nobj.name = \"Alex\"\nobj.age = 20  # AttributeError\n```\n\n`__slots__ = ()` означает: наследник не добавляет новых слотов и не создаёт `__dict__`.\n\n### 4. Если родитель без `__slots__`, наследник со `__slots__`\n```python\nclass Base:\n    pass\n\n\nclass Child(Base):\n    __slots__ = (\"name\",)\n\n\nobj = Child()\nobj.name = \"Alex\"\nobj.age = 20\n\nprint(obj.__dict__)  # {'age': 20}\n```\n\nТак как родитель обычный и имеет `__dict__`, у наследника он всё равно будет доступен. Документация отдельно указывает: при наследовании от класса без `__slots__` атрибуты `__dict__` и `__weakref__` у экземпляров всегда доступны.\n\nТо есть `__slots__` в наследнике добавит слот `name`, но **не запретит** произвольные новые атрибуты.\n\n### 5. Нельзя дублировать имя слота из родителя\nПлохо:\n```python\nclass Base:\n    __slots__ = (\"name\",)\n\n\nclass Child(Base):\n    __slots__ = (\"name\",)  # плохо\n```\n\nЕсли подкласс объявляет слот с тем же именем, что и базовый класс, переменная из базового слота становится недоступной обычным способом, и смысл программы считается неопределённым. Документация предупреждает, что в будущем такая ситуация может быть запрещена проверкой. \n\nПравильно:\n```python\nclass Base:\n    __slots__ = (\"name\",)\n\n\nclass Child(Base):\n    __slots__ = (\"age\",)\n```\n\n### 6. Множественное наследование со слотами ограничено\n```python\nclass A:\n    __slots__ = (\"a\",)\n\n\nclass B:\n    __slots__ = (\"b\",)\n\n\nclass C(A, B):\n    __slots__ = ()\n```\n\nТакой вариант может привести к `TypeError`, потому что при множественном наследовании только один родитель может иметь непустую slot-разметку. Остальные базовые классы должны иметь пустую slot-разметку. \n\n### Итоговая таблица\n\n|Ситуация|Что будет|\n|---|---|\n|Родитель со `__slots__`, наследник без `__slots__`|слоты родителя есть, но у наследника появляется `__dict__`|\n|Родитель со `__slots__`, наследник со своими `__slots__`|слоты родителя + слоты наследника, произвольные атрибуты запрещены|\n|Родитель со `__slots__`, наследник `__slots__ = ()`|новые поля не добавляются, `__dict__` не появляется|\n|Родитель без `__slots__`, наследник со `__slots__`|`__dict__` всё равно доступен через родителя|\n|Наследник дублирует имя слота родителя|плохая практика, поведение считается неопределённым|\n|Множественное наследование от нескольких slotted-классов|есть ограничения, иначе возможен `TypeError`|\n\nГлавное правило:\n```python\nclass Base:\n    __slots__ = (\"name\",)\n\n\nclass Child(Base):\n    __slots__ = (\"age\",)\n```\n\nТак наследник сохраняет ограничение и добавляет только свои разрешённые атрибуты."
  popularity = 2.63

