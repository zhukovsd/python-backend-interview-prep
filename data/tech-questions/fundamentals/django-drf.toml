[[questions]]
  id = 1
  question = "Как устроена архитектура Django и какие основные компоненты входят в её модель взаимодействия?"
  answer = "### Общая идея\n\nDjango обычно описывают не как классический MVC, а как MTV: **Model — Template — View**. В терминах Django:\n\n```text\nModel    → данные и работа с БД\nTemplate → представление HTML\nView     → функция/класс, который принимает request и возвращает response\n```\n\nПри этом роль “controller” в классическом MVC в Django в основном выполняет сам фреймворк: механизм, который получает HTTP-запрос, находит подходящий URL-маршрут и вызывает нужную view. Официальная документация прямо описывает Django как MTV-фреймворк. \n\n### Общая схема взаимодействия\n\n```text\nКлиент / браузер\n    ↓\nHTTP request\n    ↓\nWeb server / WSGI или ASGI\n    ↓\nDjango handler\n    ↓\nMiddleware\n    ↓\nURL dispatcher / urls.py\n    ↓\nView / views.py\n    ↓\nModel / ORM\n    ↓\nDatabase\n    ↓\nTemplate / serializer / HttpResponse\n    ↓\nMiddleware\n    ↓\nHTTP response\n    ↓\nКлиент / браузер\n```\n\n### 1. URL dispatcher\n\n`URL dispatcher` отвечает за сопоставление URL с конкретной view.\n\nПример:\n\n```python\n# urls.py\nfrom django.urls import path\nfrom . import views\n\nurlpatterns = [\n    path(\"articles/<int:year>/\", views.year_archive),\n]\n```\n\nКогда приходит запрос, Django берёт корневой `URLconf`, смотрит `urlpatterns`, проходит по маршрутам по порядку и вызывает первую view, которая подходит под URL. Захваченные параметры, например `year`, передаются во view как аргументы. \n\n### 2. View\n\n`View` — это слой обработки запроса. Это может быть функция или class-based view.\n\nПример:\n\n```python\nfrom django.http import HttpResponse\n\ndef hello(request):\n    return HttpResponse(\"Hello\")\n```\n\nView принимает `HttpRequest` и возвращает `HttpResponse`. Внутри view обычно находится прикладная логика: проверка прав, вызов ORM, подготовка данных, выбор шаблона или возврат JSON. Документация Django определяет view именно как Python-функцию, которая принимает web request и возвращает web response. \n\n### 3. Model и ORM\n\n`Model` описывает структуру данных и поведение сущностей приложения.\n\nПример:\n\n```python\nfrom django.db import models\n\nclass Article(models.Model):\n    title = models.CharField(max_length=255)\n    text = models.TextField()\n```\n\nКаждая модель — это Python-класс, который наследуется от `django.db.models.Model`. Обычно одна модель соответствует одной таблице в базе данных, а поля модели соответствуют колонкам таблицы. Django на основе моделей предоставляет ORM API для запросов к базе. \n\nПример использования ORM:\n\n```python\narticles = Article.objects.filter(title__icontains=\"django\")\n```\n\nТо есть view обычно не пишет SQL напрямую, а работает через модель и ORM.\n\n### 4. Template\n\n`Template` отвечает за генерацию HTML-представления.\n\nПример:\n\n```html\n<h1>{{ article.title }}</h1>\n<p>{{ article.text }}</p>\n```\n\nШаблон получает `context` — словарь данных — и подставляет значения в HTML. В документации Django шаблон описывается как текстовый документ, размеченный Django template language, который рендерится с контекстом. \n\nПример во view:\n\n```python\nfrom django.shortcuts import render\n\ndef article_detail(request, article_id):\n    article = Article.objects.get(id=article_id)\n    return render(request, \"article_detail.html\", {\"article\": article})\n```\n\n### 5. Middleware\n\n`Middleware` — это промежуточные обработчики между входящим запросом и view, а также между view и исходящим ответом.\n\nПример задач middleware:\n\n```text\nAuthentication\nCSRF protection\nSessions\nSecurity headers\nMessages\nRequest/response logging\n```\n\nMiddleware в Django работает как цепочка. На входе request проходит middleware сверху вниз, затем вызывается view, после чего response проходит обратно через middleware в обратном порядке. Middleware может изменить request, изменить response или вообще не пустить запрос дальше. \n\nУпрощённо:\n\n```text\nRequest\n  ↓\nSecurityMiddleware\n  ↓\nSessionMiddleware\n  ↓\nAuthenticationMiddleware\n  ↓\nView\n  ↑\nAuthenticationMiddleware\n  ↑\nSessionMiddleware\n  ↑\nSecurityMiddleware\nResponse\n```\n\n### 6. Project и apps\n\nDjango-проект обычно состоит из проекта и приложений.\n\n```text\nmyproject/\n    settings.py\n    urls.py\n    asgi.py\n    wsgi.py\n\nusers/\n    models.py\n    views.py\n    urls.py\n    admin.py\n\nblog/\n    models.py\n    views.py\n    urls.py\n    templates/\n```\n\nРазделение такое:\n\n```text\nProject  → общая конфигурация всего сайта\nApp      → отдельный модуль бизнес-функциональности\n```\n\nНапример:\n\n```text\naccounts → регистрация, логин, пользователи\nstorage  → файлы\norders   → заказы\nblog     → статьи\n```\n\nВ официальной документации ключевые части Django перечисляются как модели и базы данных, обработка HTTP-запросов, URL dispatcher, views, middleware, templates, forms, migrations, auth, cache и другие подсистемы. \n\n### Полный цикл запроса\n\nПример: пользователь открывает страницу статьи `/articles/10/`.\n\n```text\n1. Браузер отправляет GET /articles/10/\n\n2. Django получает HttpRequest.\n\n3. Request проходит через middleware.\n\n4. URL dispatcher ищет подходящий маршрут в urls.py.\n\n5. Django находит view article_detail.\n\n6. View получает request и article_id=10.\n\n7. View обращается к модели Article.\n\n8. ORM делает запрос в базу данных.\n\n9. View получает объект Article.\n\n10. View передаёт article в template context.\n\n11. Template рендерит HTML.\n\n12. Django создаёт HttpResponse.\n\n13. Response проходит обратно через middleware.\n\n14. Браузер получает HTML-страницу.\n```\n\nВ коде это выглядит так:\n\n```python\n# urls.py\nfrom django.urls import path\nfrom .views import article_detail\n\nurlpatterns = [\n    path(\"articles/<int:article_id>/\", article_detail),\n]\n```\n\n```python\n# views.py\nfrom django.shortcuts import render, get_object_or_404\nfrom .models import Article\n\ndef article_detail(request, article_id):\n    article = get_object_or_404(Article, id=article_id)\n    return render(request, \"articles/detail.html\", {\"article\": article})\n```\n\n```python\n# models.py\nfrom django.db import models\n\nclass Article(models.Model):\n    title = models.CharField(max_length=255)\n    text = models.TextField()\n```\n\n```html\n<!-- templates/articles/detail.html -->\n<h1>{{ article.title }}</h1>\n<p>{{ article.text }}</p>\n```\n\n### Главное отличие от FastAPI\n\nВ FastAPI чаще явно строят архитектуру вокруг:\n\n```text\nRouter → Depends → Service → Repository → DB\n```\n\nВ Django из коробки больше встроенных слоёв:\n\n```text\nURLConf → View → Model/ORM → Template/Response\n       + Middleware\n       + Forms\n       + Admin\n       + Auth\n       + Sessions\n       + Migrations\n```\n\nТо есть Django — более “batteries included” фреймворк: он уже содержит ORM, миграции, админку, middleware, систему шаблонов, формы, auth и другие компоненты. FastAPI чаще оставляет эти решения на выбор разработчика."
  popularity = 2.63

[[questions]]
  id = 2
  question = "Что представляет собой менеджер модели в Django ORM и какую роль он выполняет при работе с объектами базы данных?"
  answer = "### Что такое менеджер модели\n\n`Manager` в Django ORM — это объект, через который модель получает доступ к операциям с базой данных.\n\nОбычно он доступен через атрибут `objects`:\n\n```python\nUser.objects.all()\nUser.objects.filter(is_active=True)\nUser.objects.get(id=1)\nUser.objects.create(username=\"admin\")\n```\n\nТо есть `objects` — это не просто название. Это стандартный менеджер модели, который Django автоматически добавляет к каждой модели, если ты не указал свой. В документации Django `Manager` описан как интерфейс, через который модели получают операции запросов к базе данных. У каждой модели есть минимум один менеджер. \n\n### Где он находится в модели\n\nПример:\n\n```python\nfrom django.db import models\n\nclass UserFile(models.Model):\n    name = models.CharField(max_length=255)\n    owner_id = models.IntegerField()\n```\n\nДаже если в модели явно ничего не написано, Django фактически даёт ей менеджер:\n\n```python\nUserFile.objects\n```\n\nЧерез него можно делать запросы:\n\n```python\nUserFile.objects.all()\nUserFile.objects.filter(owner_id=1)\nUserFile.objects.create(name=\"photo.png\", owner_id=1)\n```\n\n### Роль менеджера\n\nМенеджер выполняет роль входной точки к таблице модели.\n\n```text\nModel class\n   ↓\nManager: objects\n   ↓\nQuerySet\n   ↓\nSQL query\n   ↓\nDatabase\n```\n\nНапример:\n\n```python\nUserFile.objects.filter(owner_id=1)\n```\n\nУпрощённо означает:\n\n```text\nВозьми модель UserFile\n    ↓\nЧерез её менеджер objects создай QuerySet\n    ↓\nДобавь условие owner_id = 1\n    ↓\nПри выполнении запроса получи строки из БД\n    ↓\nПреобразуй строки в объекты UserFile\n```\n\nВажно: методы вроде `filter()`, `exclude()`, `order_by()` обычно возвращают новый `QuerySet`, а не сразу список объектов. Документация Django отдельно указывает, что многие методы `QuerySet` изменяют состав результата или SQL-запрос, но сами по себе не выполняют запрос немедленно. \n\n### Manager vs QuerySet\n\nИх часто путают.\n\n```text\nManager  → точка входа к запросам модели\nQuerySet → объект запроса, который можно уточнять и выполнять\n```\n\nПример:\n\n```python\nqs = UserFile.objects.filter(owner_id=1)\n```\n\nЗдесь:\n\n```text\nUserFile.objects        → Manager\n.filter(owner_id=1)     → возвращает QuerySet\nqs                      → QuerySet\n```\n\nДальше `QuerySet` можно уточнять:\n\n```python\nqs = UserFile.objects.filter(owner_id=1).order_by(\"-id\")\n```\n\n### Зачем нужен кастомный менеджер\n\nМенеджер можно переопределить, чтобы вынести часто используемую логику запросов.\n\nНапример, есть модель файлов:\n\n```python\nclass UserFile(models.Model):\n    name = models.CharField(max_length=255)\n    owner_id = models.IntegerField()\n    is_deleted = models.BooleanField(default=False)\n```\n\nМожно создать менеджер, который по умолчанию возвращает только неудалённые файлы:\n\n```python\nclass ActiveFileManager(models.Manager):\n    def get_queryset(self):\n        return super().get_queryset().filter(is_deleted=False)\n\n\nclass UserFile(models.Model):\n    name = models.CharField(max_length=255)\n    owner_id = models.IntegerField()\n    is_deleted = models.BooleanField(default=False)\n\n    objects = ActiveFileManager()\n```\n\nТеперь:\n\n```python\nUserFile.objects.all()\n```\n\nбудет возвращать только файлы, у которых:\n\n```python\nis_deleted=False\n```\n\nВ документации Django это описано как один из основных способов настройки менеджера: можно переопределить `get_queryset()`, чтобы изменить базовый `QuerySet`, который возвращает менеджер. \n\n### Несколько менеджеров у одной модели\n\nМожно оставить обычный менеджер и добавить специальный:\n\n```python\nclass ActiveFileManager(models.Manager):\n    def get_queryset(self):\n        return super().get_queryset().filter(is_deleted=False)\n\n\nclass UserFile(models.Model):\n    name = models.CharField(max_length=255)\n    owner_id = models.IntegerField()\n    is_deleted = models.BooleanField(default=False)\n\n    objects = models.Manager()\n    active = ActiveFileManager()\n```\n\nТеперь:\n\n```python\nUserFile.objects.all()\n```\n\nвернёт все файлы.\n\n```python\nUserFile.active.all()\n```\n\nвернёт только неудалённые файлы.\n\nDjango позволяет добавлять несколько менеджеров к одной модели. Это удобно, когда нужно иметь разные стандартные наборы запросов: например, `active`, `archived`, `published`, `drafts`. \n\n### Методы бизнес-уровня в менеджере\n\nВ менеджер часто выносят методы, которые относятся не к одному объекту, а ко всей таблице или набору записей.\n\nПример:\n\n```python\nclass UserFileManager(models.Manager):\n    def for_user(self, user):\n        return self.get_queryset().filter(owner=user)\n\n    def images(self):\n        return self.get_queryset().filter(content_type__startswith=\"image/\")\n```\n\nИспользование:\n\n```python\nUserFile.objects.for_user(request.user)\nUserFile.objects.images()\n```\n\nЭто лучше, чем размазывать одинаковые фильтры по разным view.\n\n### Важный момент про default manager\n\nПервый менеджер, объявленный в модели, Django считает менеджером по умолчанию. Некоторые части Django используют именно его. Поэтому опасно делать первым менеджером тот, который сильно фильтрует данные, например скрывает `is_deleted=True`, если где-то Django должен видеть все записи. Документация отдельно предупреждает, что первый менеджер имеет специальный статус `_default_manager`. \n\nПример осторожного варианта:\n\n```python\nclass UserFile(models.Model):\n    name = models.CharField(max_length=255)\n    is_deleted = models.BooleanField(default=False)\n\n    objects = models.Manager()      # все записи\n    active = ActiveFileManager()    # только активные\n```\n\nТак безопаснее, потому что обычный `objects` не скрывает записи.\n\n### Кратко\n\n```text\nManager в Django ORM — это интерфейс модели для работы с базой данных.\n```\n\nОн нужен, чтобы:\n\n```text\n1. Запускать запросы к таблице модели.\n2. Создавать QuerySet.\n3. Инкапсулировать часто используемые фильтры.\n4. Добавлять методы уровня таблицы.\n5. Настраивать базовый набор объектов через get_queryset().\n6. Разделять разные способы доступа к одной модели через несколько менеджеров.\n```\n\nГлавная формула:\n\n```python\nModel.objects\n```\n\nэто:\n\n```text\nМодель → менеджер → QuerySet → SQL → база данных → объекты модели\n```"
  popularity = 2.63

[[questions]]
  id = 3
  question = "Что такое middleware и какую роль он играет в обработке HTTP-запроса и HTTP-ответа?"
  answer = "Middleware в Django — это промежуточный слой обработки запросов и ответов, представляющий собой набор функций/классов, которые обрабатывают запросы и ответы перед тем, как они достигнут view или после того, как view сгенерирует ответ. Каждый middleware компонент отвечает за определенную функцию, такую как аутентификация пользователей, управление сессиями или защита от атак.\n\nКак работает middleware:\n\n1. Обертывает запрос: middleware выступает как обертка вокруг других функций или middleware.\n2. Обрабатывает запрос: перед тем как запрос достигнет целевого обработчика (например, вашей функции просмотра), middleware может модифицировать его или выполнить необходимую логику.\n3. Обрабатывает ответ: после того как запрос был обработан, middleware может модифицировать ответ перед его отправкой клиенту.\n4. Передает управление: middleware может либо передать управление следующему middleware (или просмотру), либо вернуть ответ самостоятельно, прервав дальнейшую обработку.\n\nАрхитектура Middleware\n\n```\nЗапрос → MIDDLEWARE[0] → MIDDLEWARE[1] → ... → View\nОтвет  ← MIDDLEWARE[1] ← MIDDLEWARE[0] ← ... ← View\n```\n\n**Стандартные middleware в Django** # settings.py\n\n```python\nMIDDLEWARE = [\n    'django.middleware.security.SecurityMiddleware',\n    'django.contrib.sessions.middleware.SessionMiddleware',\n    'django.middleware.common.CommonMiddleware',\n    'django.middleware.csrf.CsrfViewMiddleware',\n    'django.contrib.auth.middleware.AuthenticationMiddleware',\n    'django.contrib.messages.middleware.MessageMiddleware',\n]\n```\n\nПримеры использования middleware:\n\n- `SecurityMiddleware`: Обеспечивает защиту от различных атак, например, от XSS или CSRF.\n- `AuthenticationMiddleware`: Связывает пользователя с запросом на основе сессии.\n- `SessionMiddleware`: Обеспечивает поддержку механизма сессий в Django.\n- `CsrfViewMiddleware`: Проверяет запросы на наличие CSRF-токена для предотвращения подделки запросов.\n\n**Создание кастомного middleware**\n\nПример: Логирование запросов\n\n```python\nimport time\n\nclass TimingMiddleware:\n    def __init__(self, get_response):\n        self.get_response = get_response\n\n    def __call__(self, request):\n        start_time = time.time()\n\n        response = self.get_response(request)\n\n        duration = time.time() - start_time\n        print(f\"Запрос {request.path} выполнен за {duration:.2f} секунд\")\n\n        return response\n```\n\nВ чем польза middleware:\n\n- Гибкость: позволяет добавлять глобальную логику обработки без необходимости изменять код приложения.\n- Модульность: каждый компонент отвечает за свою функцию, что делает код более чистым и легко поддерживаемым.\n- Переиспользуемость: один и тот же middleware может использоваться в разных проектах для выполнения одинаковых задач\n- Middleware — это мощный механизм для сквозной функциональности в Django-приложениях."
  popularity = 7.89

[[questions]]
  id = 4
  question = "Что такое и как работает механизм CSRF-защиты в Django и какую роль играет CSRF-токен?"
  answer = "### Что такое CSRF\n\n`CSRF` — это атака, при которой злоумышленник заставляет браузер уже авторизованного пользователя отправить нежелательный запрос на доверенный сайт.\n\nНапример, пользователь залогинен на сайте:\n\n```text\nbank.example.com\n```\n\nПараллельно он открывает вредоносный сайт. Этот сайт может попытаться отправить форму или запрос на `bank.example.com`. Браузер автоматически приложит cookies пользователя к запросу, потому что cookies принадлежат `bank.example.com`. Именно на этом и основана CSRF-атака: сервер может принять поддельный запрос за настоящий пользовательский запрос. OWASP описывает CSRF как атаку, при которой браузер аутентифицированного пользователя вынуждают выполнить нежелательное действие на доверенном сайте. \n\n### Зачем Django нужен CSRF-токен\n\nПроблема в том, что cookie сессии браузер отправляет автоматически:\n\n```text\nПользователь авторизован\n    ↓\nВ браузере есть sessionid cookie\n    ↓\nЛюбой запрос к этому домену автоматически получает sessionid\n```\n\nПоэтому одной session cookie недостаточно, чтобы понять:\n\n```text\nЗапрос действительно отправил пользователь\nили\nзапрос был подделан другим сайтом\n```\n\nCSRF-токен нужен как дополнительное доказательство, что запрос пришёл со страницы, сгенерированной самим Django-приложением, а не с чужого сайта.\n\n### Общая схема работы\n\n```text\n1. Django отдаёт страницу с формой.\n\n2. В ответе устанавливается CSRF cookie.\n\n3. В HTML-форму добавляется hidden input с CSRF-токеном.\n\n4. Пользователь отправляет POST-запрос.\n\n5. Браузер отправляет cookie.\n\n6. Форма отправляет csrfmiddlewaretoken.\n\n7. CsrfViewMiddleware сравнивает данные.\n\n8. Если проверка успешна — запрос идёт во view.\n\n9. Если проверка неуспешна — Django возвращает 403 Forbidden.\n```\n\nСхематично:\n\n```text\nGET /profile/edit/\n    ↓\nDjango response:\n    Set-Cookie: csrftoken=...\n    <input type=\"hidden\" name=\"csrfmiddlewaretoken\" value=\"...\">\n\nPOST /profile/edit/\n    ↓\nCookie: csrftoken=...\nForm data: csrfmiddlewaretoken=...\n    ↓\nCsrfViewMiddleware проверяет соответствие\n    ↓\nView выполняется или Django возвращает 403\n```\n\nОфициальная документация Django описывает механизм как комбинацию CSRF cookie со случайным секретом, hidden form field `csrfmiddlewaretoken` и проверки входящих небезопасных HTTP-запросов через `CsrfViewMiddleware`. \n\n### Где подключается CSRF-защита\n\nОбычно CSRF-защита включена через middleware:\n\n```python\nMIDDLEWARE = [\n    ...\n    \"django.middleware.csrf.CsrfViewMiddleware\",\n    ...\n]\n```\n\n`CsrfViewMiddleware` стоит в цепочке обработки запроса до view. Он проверяет входящий запрос и может остановить его до выполнения бизнес-логики. Django указывает, что CSRF middleware включён по умолчанию в `MIDDLEWARE`, а если настройка переопределяется вручную, этот middleware нужно оставить. \n\n### Как добавляется CSRF-токен в HTML-форму\n\nВ Django template используется тег:\n\n```html\n<form method=\"post\">\n    {% csrf_token %}\n    <input type=\"text\" name=\"username\">\n    <button type=\"submit\">Save</button>\n</form>\n```\n\nПосле рендера шаблона это превращается примерно в:\n\n```html\n<form method=\"post\">\n    <input type=\"hidden\" name=\"csrfmiddlewaretoken\" value=\"TOKEN_VALUE\">\n    <input type=\"text\" name=\"username\">\n    <button type=\"submit\">Save</button>\n</form>\n```\n\nТег `{% csrf_token %}` нужно добавлять внутрь POST-форм, которые отправляются на внутренние URL приложения. Django отдельно предупреждает, что CSRF-токен не нужно вставлять в формы, которые отправляются на внешние URL, потому что так можно утечь токен наружу. \n\n### Что именно проверяет Django\n\nДля небезопасных HTTP-методов Django требует, чтобы:\n\n```text\n1. Была CSRF cookie.\n2. Был передан csrfmiddlewaretoken.\n3. Токен был корректным.\n4. Origin или Referer проходил проверку для защищённых сценариев.\n```\n\nК небезопасным методам относятся, например:\n\n```text\nPOST\nPUT\nDELETE\n```\n\nМетоды `GET`, `HEAD`, `OPTIONS`, `TRACE` Django рассматривает как safe methods и не требует для них CSRF-проверку в обычном смысле. Но это означает, что такие запросы не должны менять состояние на сервере. Django прямо указывает, что GET и другие safe methods должны быть без побочных эффектов, а небезопасные методы должны защищаться CSRF-механизмом. \n\n### Почему токен защищает от атаки\n\nЗлоумышленник может заставить браузер пользователя отправить запрос на твой сайт, и браузер приложит cookies.\n\nНо чужой сайт не может просто так узнать корректный CSRF-токен, который Django выдал пользователю.\n\n```text\nАтакующий сайт может:\n    отправить форму на твой домен\n\nАтакующий сайт не должен иметь:\n    правильный csrfmiddlewaretoken\n```\n\nПоэтому поддельный POST-запрос будет выглядеть неполным:\n\n```text\nCookie: sessionid=...\nCookie: csrftoken=...\ncsrfmiddlewaretoken отсутствует или неправильный\n```\n\nВ результате `CsrfViewMiddleware` отклонит запрос:\n\n```text\n403 Forbidden\n```\n\n### Cookie и hidden token — это не одно и то же\n\nВ Django есть:\n\n```text\nCSRF cookie      → хранит секрет\nCSRF form token  → передаётся в форме или заголовке\n```\n\nDjango не просто сравнивает две одинаковые строки. В форме используется masked token: значение маскируется и может отличаться при разных ответах, чтобы снижать риск атак типа BREACH. При проверке Django сравнивает именно секретную часть токена с секретом из cookie. \n\nУпрощённо:\n\n```text\ncsrftoken cookie\n    ↓\nсекретное значение\n\ncsrfmiddlewaretoken\n    ↓\nзамаскированное значение, связанное с тем же секретом\n\nDjango\n    ↓\nизвлекает секретную часть и проверяет соответствие\n```\n\n### Как работает CSRF при AJAX / fetch\n\nЕсли запрос отправляется не обычной HTML-формой, а через JavaScript, токен обычно передают в HTTP-заголовке:\n\n```javascript\nfetch(\"/api/profile/\", {\n    method: \"POST\",\n    headers: {\n        \"X-CSRFToken\": csrftoken\n    },\n    body: formData,\n    mode: \"same-origin\"\n});\n```\n\nDjango рекомендует для AJAX-запросов ставить заголовок `X-CSRFToken`, имя которого соответствует настройке `CSRF_HEADER_NAME`. Токен обычно берётся из cookie `csrftoken`, если не включены настройки `CSRF_USE_SESSIONS` или `CSRF_COOKIE_HTTPONLY`. \n\n### Что будет при ошибке CSRF\n\nЕсли проверка не прошла, Django не вызывает view и возвращает:\n\n```text\n403 Forbidden\n```\n\nТипичные причины:\n\n```text\n1. В форме нет {% csrf_token %}.\n2. CSRF cookie не была установлена.\n3. Токен устарел после логина.\n4. Запрос пришёл с недоверенного Origin.\n5. JavaScript не передал X-CSRFToken.\n6. POST-запрос отправлен на внешний домен или с неправильной конфигурацией.\n```\n\nDjango указывает, что при провале проверки `CsrfViewMiddleware` по умолчанию возвращает `403 Forbidden`, а такие ошибки логируются через `django.security.csrf`. \n\n### Пример полного цикла\n\n```python\n# views.py\nfrom django.shortcuts import render, redirect\n\ndef edit_profile(request):\n    if request.method == \"POST\":\n        # Если CSRF не прошёл, этот код вообще не выполнится\n        request.user.username = request.POST[\"username\"]\n        request.user.save()\n        return redirect(\"profile\")\n\n    return render(request, \"edit_profile.html\")\n```\n\n```html\n<!-- edit_profile.html -->\n<form method=\"post\">\n    {% csrf_token %}\n    <input type=\"text\" name=\"username\">\n    <button type=\"submit\">Save</button>\n</form>\n```\n\nЦикл:\n\n```text\nGET /edit-profile/\n    ↓\nDjango отдаёт форму с csrfmiddlewaretoken\n    ↓\nПользователь отправляет POST\n    ↓\nCsrfViewMiddleware проверяет cookie + token + Origin/Referer\n    ↓\nТолько после этого выполняется edit_profile()\n```\n\n### Когда CSRF особенно важен\n\nCSRF нужен там, где запрос меняет состояние:\n\n```text\nизменение пароля\nизменение email\nсоздание заказа\nудаление файла\nсоздание записи\nизменение профиля\nlogout\nоперации с деньгами\n```\n\nНе стоит делать такие действия через `GET`.\n\nПлохо:\n\n```python\npath(\"delete/<int:id>/\", delete_file)\n```\n\n```text\nGET /delete/10/\n```\n\nПравильнее:\n\n```text\nPOST /delete/10/\nDELETE /files/10/\n```\n\nи с CSRF-защитой, если используется cookie/session authentication.\n\n### Кратко\n\n```text\nCSRF-защита в Django — это механизм проверки, что небезопасный запрос пришёл со страницы самого приложения, а не был подделан внешним сайтом.\n```\n\nГлавные элементы:\n\n```text\nCsrfViewMiddleware     → проверяет запрос\ncsrftoken cookie       → хранит CSRF-секрет\n{% csrf_token %}       → добавляет hidden input в форму\ncsrfmiddlewaretoken    → токен, который отправляется вместе с POST\nX-CSRFToken            → способ передать токен в AJAX/fetch\n403 Forbidden          → ответ при провале проверки\n```\n\nОсновная схема:\n\n```text\nCookie сессии доказывает: пользователь авторизован.\nCSRF-токен доказывает: запрос пришёл из доверенного источника приложения.\n```"
  popularity = 5.26

[[questions]]
  id = 5
  question = "Что такое сигналы в Django и в каких случаях их применяют?"
  answer = "### Что такое сигналы в Django\n\n**Сигналы в Django** — это механизм уведомлений внутри фреймворка.\n\nОни позволяют одному участку кода сообщить другим участкам кода, что произошло какое-то событие.\n\nОфициальная документация описывает это как `signal dispatcher`: отправитель сообщает получателям, что некоторое действие произошло. Это полезно, когда несколько независимых частей приложения должны реагировать на одно событие. \n\nУпрощённо:\n\n```text\nПроизошло событие\n↓\nDjango отправил сигнал\n↓\nФункция-обработчик получила сигнал\n↓\nВыполнилась дополнительная логика\n```\n\nНапример:\n\n```text\nПользователь зарегистрировался\n↓\nСоздался объект User\n↓\nСработал post_save\n↓\nАвтоматически создался Profile\n```\n\n### Из чего состоит сигнал\n\nВ сигналах обычно есть:\n\n```text\nsender    — кто отправил сигнал\nreceiver  — функция, которая реагирует на сигнал\nsignal    — само событие\ninstance  — объект модели, с которым произошло событие\n```\n\nПример:\n\n```python\nfrom django.db.models.signals import post_save\nfrom django.dispatch import receiver\nfrom django.contrib.auth import get_user_model\n\nfrom .models import Profile\n\nUser = get_user_model()\n\n\n@receiver(post_save, sender=User)\ndef create_user_profile(sender, instance, created, **kwargs):\n    if created:\n        Profile.objects.create(user=instance)\n```\n\nЧто здесь происходит:\n\n```text\nsender=User\n```\n\nСигнал будет слушать события, связанные с моделью `User`.\n\n```text\npost_save\n```\n\nСигнал сработает после вызова `save()` у объекта модели.\n\n```text\ncreated\n```\n\nПоказывает, был ли объект создан впервые или просто обновлён.\n\n### Основные встроенные сигналы Django\n\nЧаще всего используются сигналы моделей:\n\n```python\npre_save\n```\n\nСрабатывает перед сохранением объекта.\n\n```python\npost_save\n```\n\nСрабатывает после сохранения объекта.\n\n```python\npre_delete\n```\n\nСрабатывает перед удалением объекта.\n\n```python\npost_delete\n```\n\nСрабатывает после удаления объекта.\n\n```python\nm2m_changed\n```\n\nСрабатывает при изменении связи `ManyToManyField`.\n\nЭти сигналы перечислены в официальной справке Django по сигналам. Например, `post_save` отправляется в конце выполнения `save()`, а `m2m_changed` связан с изменениями `ManyToManyField`. \n\n### В каких случаях применяют сигналы\n\nСигналы применяют, когда нужно выполнить дополнительное действие после события, но не хочется жёстко связывать это действие с основным кодом.\n\nТипичные случаи:\n\n```text\n1. Автоматическое создание связанных объектов\n```\n\nНапример, после создания пользователя создать профиль:\n\n```python\nUser created\n↓\nProfile created automatically\n```\n\n```text\n2. Логирование действий\n```\n\nНапример, записать в журнал, что объект был создан, изменён или удалён.\n\n```text\n3. Очистка связанных ресурсов\n```\n\nНапример, после удаления записи удалить связанный файл из S3/MinIO.\n\n```text\n4. Инвалидация кэша\n```\n\nНапример, если объект изменился, удалить старые данные из Redis/cache.\n\n```text\n5. Реакция на изменение ManyToMany-связей\n```\n\nНапример, если пользователя добавили в группу, пересчитать права или отправить уведомление.\n\n```text\n6. Отправка уведомлений\n```\n\nНапример, после создания комментария отправить уведомление владельцу поста.\n\n### Когда сигналы лучше не использовать\n\nСигналы не стоит использовать для основной бизнес-логики, от которой напрямую зависит результат операции.\n\nПлохой пример:\n\n```text\nСоздание заказа\n↓\nЧерез сигнал списываются деньги\n↓\nЧерез сигнал создаётся доставка\n↓\nЧерез сигнал меняется статус\n```\n\nТакой код сложнее читать и отлаживать, потому что важная логика спрятана не в сервисе/методе, а в сторонних обработчиках.\n\nЛучше:\n\n```python\ndef create_order(user, items):\n    order = Order.objects.create(user=user)\n\n    reserve_items(order)\n    create_payment(order)\n    create_delivery(order)\n\n    return order\n```\n\nСигналы лучше использовать для **побочных действий**, а не для ядра бизнес-процесса.\n\n### Важный момент\n\nСигналы Django не являются отдельной очередью задач.\n\nТо есть это не аналог:\n\n```text\nCelery\nRabbitMQ\nKafka\nRedis Queue\n```\n\nЕсли внутри сигнала отправлять email, обращаться к внешнему API или делать тяжёлую операцию, это может замедлить основной запрос.\n\nНапример:\n\n```text\nHTTP request\n↓\nmodel.save()\n↓\npost_save\n↓\nдолгая отправка email\n↓\nresponse задерживается\n```\n\nДля тяжёлых действий лучше из сигнала поставить задачу в Celery, а не выполнять всё прямо внутри обработчика.\n\n### Отличие от переопределения save()\n\nИногда возникает вопрос: использовать `save()` или сигнал?\n\n```python\nclass UserFile(models.Model):\n    file = models.FileField()\n\n    def save(self, *args, **kwargs):\n        # логика прямо внутри модели\n        super().save(*args, **kwargs)\n```\n\nРазница такая:\n\n```text\nsave()\n```\n\nИспользуется, когда логика является частью поведения самой модели.\n\n```text\nsignal\n```\n\nИспользуется, когда внешняя часть приложения должна отреагировать на событие модели.\n\nПример:\n\n```text\nНормализовать поле перед сохранением        → save() / clean() / serializer\nСоздать внешний audit-log после сохранения  → signal\nУдалить файл после удаления модели          → signal\n```\n\n### Кратко\n\nСигналы в Django — это механизм реакции на события внутри приложения.\n\nИх применяют для:\n\n```text\npost_save     — действия после сохранения\npre_save      — действия перед сохранением\npost_delete   — действия после удаления\npre_delete    — действия перед удалением\nm2m_changed   — реакция на изменение ManyToMany-связей\n```\n\nГлавная идея:\n\n```text\nСигналы подходят для побочных эффектов.\nСигналы не стоит использовать как основу бизнес-логики.\n```"
  popularity = 2.63

