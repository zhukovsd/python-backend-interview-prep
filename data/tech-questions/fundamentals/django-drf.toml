  id = 9
  question = "Какие подходы вы использовали бы для оптимизации Django-приложения?"
  answer = "### Общий подход\n\nОптимизацию Django-приложения я бы начинал не с хаотичного переписывания кода, а с измерений:\n\n```text\nнайти узкое место\n↓\nподтвердить его метриками\n↓\nисправить конкретную проблему\n↓\nснова измерить результат\n```\n\nВ Django чаще всего проблемы находятся в ORM-запросах, N+1, отсутствии индексов, тяжёлых сериализаторах, неправильном кэшировании, медленных внешних API и неоптимальной настройке production-окружения.\n\n### 1. Диагностика и профилирование\n\nСначала нужно понять, что именно тормозит:\n\n```text\nSQL-запросы\nрендеринг шаблонов\nDRF-сериализация\nвнешние HTTP-запросы\nработа с файлами\nкэш\nочереди\nБД\n```\n\nДля локальной диагностики можно использовать `django-debug-toolbar`: у него есть SQL-панель, которая показывает SQL-запросы, время выполнения и ссылки на `EXPLAIN`; также есть панели cache, templates, signals и request/response. \n\nПример практической проверки:\n\n```text\nОткрываем endpoint\n↓\nСмотрим количество SQL-запросов\n↓\nИщем дублирующиеся запросы\n↓\nПроверяем самые долгие queries\n↓\nИспользуем EXPLAIN / EXPLAIN ANALYZE\n```\n\nPostgreSQL официально рекомендует использовать `EXPLAIN`, чтобы увидеть план выполнения запроса, потому что выбор правильного плана критичен для производительности. \n\n### 2. Оптимизация ORM-запросов\n\nСамое частое узкое место в Django — это не сам Django, а неправильное использование ORM.\n\nПлохой пример:\n\n```python\nposts = Post.objects.all()\n\nfor post in posts:\n    print(post.author.username)\n```\n\nПроблема:\n\n```text\n1 запрос на posts\nN запросов на authors\n```\n\nДля `ForeignKey` и `OneToOneField` нужно использовать `select_related()`:\n\n```python\nposts = Post.objects.select_related(\"author\")\n```\n\n`select_related()` работает через SQL `JOIN` и получает связанные объекты в том же запросе. Он подходит для одиночных связей: `ForeignKey` и `OneToOneField`. \n\nДля `ManyToManyField` и обратных связей через `related_name` нужно использовать `prefetch_related()`:\n\n```python\nauthors = Author.objects.prefetch_related(\"books\")\n```\n\n`prefetch_related()` делает отдельные запросы и связывает данные на уровне Python, поэтому подходит для many-to-many, reverse foreign key и других связей, где у одного объекта может быть много связанных объектов. \n\n### 3. Не доставать лишние данные из БД\n\nНе всегда нужно получать полноценные model instances.\n\nНапример, плохо:\n\n```python\nusers = User.objects.all()\n\nfor user in users:\n    usernames.append(user.username)\n```\n\nЛучше:\n\n```python\nusernames = User.objects.values_list(\"username\", flat=True)\n```\n\nDjango рекомендует использовать `values()` и `values_list()`, когда нужны словари или списки значений, а не полноценные ORM-объекты. \n\nТакже можно использовать `only()` и `defer()`, но осторожно:\n\n```python\nUser.objects.only(\"id\", \"username\")\n```\n\nDjango предупреждает, что `only()` и `defer()` могут дать обратный эффект, если потом всё равно обратиться к отложенным полям: ORM сделает дополнительный запрос. Поэтому их нужно применять только после профилирования. \n\n### 4. Использовать exists(), count(), update()\n\nВместо загрузки объектов в Python лучше выполнять операции на уровне БД.\n\nПлохо:\n\n```python\nif len(User.objects.filter(is_active=True)) > 0:\n    ...\n```\n\nЛучше:\n\n```python\nif User.objects.filter(is_active=True).exists():\n    ...\n```\n\nПлохо:\n\n```python\nusers = User.objects.filter(is_active=False)\n\nfor user in users:\n    user.is_active = True\n    user.save()\n```\n\nЛучше:\n\n```python\nUser.objects.filter(is_active=False).update(is_active=True)\n```\n\nDjango рекомендует использовать `count()`, когда нужен только счётчик, `exists()`, когда нужно проверить наличие строк, и `update()`/bulk delete вместо загрузки множества объектов и индивидуального сохранения. При этом `update()` не вызывает `save()` модели и связанные сигналы. \n\n### 5. Индексы в базе данных\n\nЕсли endpoint часто фильтрует, сортирует или ищет по конкретным полям, нужно проверять индексы.\n\nПример:\n\n```python\nclass UserFile(models.Model):\n    user = models.ForeignKey(User, on_delete=models.CASCADE)\n    path = models.CharField(max_length=512)\n    uploaded_at = models.DateTimeField(auto_now_add=True)\n\n    class Meta:\n        indexes = [\n            models.Index(fields=[\"user\", \"uploaded_at\"]),\n            models.Index(fields=[\"user\", \"path\"]),\n        ]\n```\n\nDjango позволяет задавать индексы через `Meta.indexes`; документация указывает, что index-классы используются для создания индексов базы данных. \n\nДля одиночного поля есть `db_index=True`, но документация Django рекомендует по возможности использовать `Meta.indexes`, потому что этот вариант функциональнее. \n\nВажно: индекс не нужно ставить на всё подряд.\n\nИндекс полезен для:\n\n```text\nчастых WHERE\nчастых ORDER BY\nчастых JOIN\nуникальности\nпоиска по внешним ключам\n```\n\nНо лишние индексы замедляют вставку и обновление данных, потому что БД должна поддерживать их в актуальном состоянии.\n\n### 6. Пагинация и ограничение выдачи\n\nНельзя отдавать большие списки без лимитов.\n\nПлохо:\n\n```python\nUserFile.objects.filter(user=request.user)\n```\n\nЛучше:\n\n```python\nUserFile.objects.filter(user=request.user).order_by(\"-uploaded_at\")[:50]\n```\n\nДля API обычно нужна пагинация:\n\n```text\nlimit / offset\ncursor pagination\npage number pagination\n```\n\nОсобенно это важно для таблиц с файлами, уведомлениями, заказами, логами, комментариями.\n\n### 7. Кэширование\n\nКэшировать стоит данные, которые:\n\n```text\nчасто читаются\nредко изменяются\nдорого вычисляются\nне зависят от уникального состояния каждого запроса\n```\n\nВ Django есть cache framework. Он поддерживает разные уровни кэширования: можно кэшировать страницу целиком, отдельный view, фрагмент шаблона или конкретные данные через low-level cache API. Для точечного контроля Django предоставляет low-level cache API через `cache.get()` / `cache.set()`. \n\nПример:\n\n```python\nfrom django.core.cache import cache\n\ndef get_user_permissions(user_id):\n    key = f\"user_permissions:{user_id}\"\n\n    permissions = cache.get(key)\n\n    if permissions is None:\n        permissions = calculate_permissions(user_id)\n        cache.set(key, permissions, timeout=300)\n\n    return permissions\n```\n\nПрактически часто кэшируют:\n\n```text\nправа пользователя\nнастройки приложения\nсправочники\nдорогие агрегации\nрезультаты внешних API\nчасто открываемые страницы\n```\n\nГлавная проблема кэша — инвалидация. Нужно заранее понимать, когда удалять или обновлять ключ.\n\n### 8. Вынос тяжёлых задач из HTTP-запроса\n\nВнутри request/response не стоит выполнять долгие операции:\n\n```text\nотправка email\nобработка изображений\nгенерация PDF\nзагрузка больших файлов\nсинхронизация с внешним API\nмассовые операции\n```\n\nТакие задачи лучше выносить в фоновые воркеры:\n\n```text\nCelery\nRQ\nDramatiq\ncron/systemd timer\nотдельный management command\n```\n\nCelery описывает task как основную единицу работы: задача определяет, что происходит при вызове, и что выполняет worker при получении сообщения. \n\nПример:\n\n```python\n# views.py\nsend_email_task.delay(user.id)\nreturn Response({\"status\": \"queued\"})\n```\n\nТак HTTP-запрос быстро возвращает ответ, а тяжёлая работа выполняется отдельно.\n\n### 9. Оптимизация сериализаторов DRF\n\nВ DRF часто тормозит не только SQL, но и сериализация.\n\nПроблемные места:\n\n```text\nSerializerMethodField с запросами внутри\nсложные nested serializers\nотсутствие select_related / prefetch_related под serializer\nвычисления на каждый объект списка\n```\n\nПлохой пример:\n\n```python\nclass PostSerializer(serializers.ModelSerializer):\n    comments_count = serializers.SerializerMethodField()\n\n    def get_comments_count(self, obj):\n        return obj.comments.count()\n```\n\nНа списке это может дать N дополнительных запросов.\n\nЛучше заранее аннотировать:\n\n```python\nfrom django.db.models import Count\n\nposts = Post.objects.annotate(comments_count=Count(\"comments\"))\n```\n\nИ потом читать уже готовое поле:\n\n```python\nclass PostSerializer(serializers.ModelSerializer):\n    comments_count = serializers.IntegerField(read_only=True)\n```\n\n### 10. Оптимизация шаблонов\n\nДля Django templates важно не делать скрытые запросы внутри шаблона.\n\nПлохо:\n\n```django\n{% for post in posts %}\n    {{ post.author.username }}\n    {{ post.comments.count }}\n{% endfor %}\n```\n\nЛучше подготовить данные во view/queryset:\n\n```python\nposts = (\n    Post.objects\n    .select_related(\"author\")\n    .annotate(comments_count=Count(\"comments\"))\n)\n```\n\nШаблон должен отображать данные, а не провоцировать N+1 запросы.\n\n### 11. Настройки production-окружения\n\nДля production нужно отключать `DEBUG`, корректно настроить статику, БД, HTTPS, allowed hosts, логи и мониторинг.\n\nDjango deployment checklist отдельно указывает, что в production статические файлы не должны просто обслуживаться dev-сервером: нужно определить `STATIC_ROOT` и запускать `collectstatic`; также для сайтов с логином нужно использовать HTTPS, потому что через HTTP могут передаваться session cookie, пароль и reset tokens. \n\nИз практических пунктов:\n\n```text\nDEBUG=False\nнастроенный ALLOWED_HOSTS\ngunicorn/uvicorn workers\nnginx перед Django\nstatic/media через nginx или object storage\nPostgreSQL connection pooling\nлогирование ошибок\nhealthcheck endpoint\nметрики\n```\n\n### 12. Оптимизация работы с файлами\n\nДля файлового хранилища лучше не гонять большие файлы через Django, когда можно использовать object storage.\n\nНапример, для MinIO/S3:\n\n```text\nDjango проверяет права\n↓\nгенерирует presigned URL\n↓\nклиент скачивает файл напрямую из S3/MinIO\n```\n\nЭто разгружает приложение: Django не держит соединение и не стримит большой файл через себя.\n\n### Краткий ответ для собеседования\n\nЯ бы оптимизировал Django-приложение так:\n\n```text\n1. Сначала профилирование: django-debug-toolbar, логи, метрики, EXPLAIN.\n2. Устранение N+1 через select_related и prefetch_related.\n3. Сокращение лишних данных через values(), values_list(), only(), defer().\n4. Использование exists(), count(), update(), bulk_create(), bulk_update().\n5. Индексы под реальные WHERE / JOIN / ORDER BY.\n6. Пагинация больших списков.\n7. Кэширование через Redis/Django cache framework.\n8. Вынос тяжёлых задач в Celery/RQ/Dramatiq.\n9. Оптимизация DRF-сериализаторов и nested serializers.\n10. Подготовка данных во view/queryset, а не в шаблонах.\n11. Настройка production: DEBUG=False, nginx, workers, static/media, HTTPS, мониторинг.\n12. Повторное измерение после каждого изменения.\n```\n\nГлавная мысль:\n\n```text\nОптимизация Django — это не набор случайных трюков.\nЭто цикл: измерить → найти узкое место → исправить → снова измерить.\n```"
