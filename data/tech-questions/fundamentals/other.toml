  id = 1
  question = "Какими методами можно кратно ускорить выполнение программы?"
  answer = "### Главное правило\n\nКратно ускорить программу обычно можно не «микрооптимизацией», а изменением одного из фундаментальных факторов:\n\n```text\nалгоритм\nструктура данных\nколичество I/O\nобъём обрабатываемых данных\nпараллелизм\nуровень абстракции\n```\n\nЗамена:\n\n```python\nvalue = x * 2\n```\n\nна:\n\n```python\nvalue = x << 1\n```\n\nпочти никогда не даёт значимого выигрыша.\n\nА замена алгоритма `O(n²)` на `O(n log n)` может ускорить программу в сотни или тысячи раз.\n\n### 1. Сначала определить узкое место\n\nБез измерений оптимизация часто направлена не туда.\n\nНужно выяснить, где программа тратит время:\n\n```text\nCPU\nбаза данных\nсеть\nдиск\nсериализация\nблокировки\nаллокации памяти\nожидание внешнего API\n```\n\nДля Python можно использовать:\n\n```text\ncProfile\npy-spy\nscalene\nline_profiler\n```\n\nДля backend дополнительно важны:\n\n```text\nвремя SQL-запросов\nколичество SQL-запросов\nвремя внешних HTTP-вызовов\nevent loop lag\nразмер connection pool\np95/p99 latency\n```\n\nОптимизировать нужно не самый некрасивый код, а самый дорогой участок.\n\n### 2. Улучшить алгоритм\n\nЭто обычно самый сильный способ ускорения.\n\nНапример, поиск элемента в списке:\n\n```python\nusers = [1, 2, 3, 4, 5]\n\nif user_id in users:\n    ...\n```\n\nСложность:\n\n```text\nO(n)\n```\n\nЕсли проверка выполняется много раз, лучше использовать `set`:\n\n```python\nuser_ids = {1, 2, 3, 4, 5}\n\nif user_id in user_ids:\n    ...\n```\n\nСредняя сложность:\n\n```text\nO(1)\n```\n\nЕщё пример:\n\n```python\nfor user in users:\n    for blocked_user in blocked_users:\n        if user.id == blocked_user.id:\n            ...\n```\n\nЭто:\n\n```text\nO(n × m)\n```\n\nЛучше:\n\n```python\nblocked_ids = {\n    user.id\n    for user in blocked_users\n}\n\nfor user in users:\n    if user.id in blocked_ids:\n        ...\n```\n\nЭто примерно:\n\n```text\nO(n + m)\n```\n\nНа больших объёмах разница может быть кратной.\n\n### 3. Выбрать правильную структуру данных\n\nСтруктура данных определяет стоимость операций.\n\n```text\nlist\n→ быстрый последовательный обход\n→ медленный поиск по значению\n\nset\n→ быстрый поиск и проверка принадлежности\n\ndict\n→ быстрый доступ по ключу\n\ndeque\n→ эффективное добавление и удаление с обоих концов\n\nheap\n→ быстрый доступ к минимальному или максимальному элементу\n```\n\nНапример, очередь через список:\n\n```python\nitem = items.pop(0)\n```\n\nдорога, потому что остальные элементы сдвигаются.\n\nЛучше:\n\n```python\nfrom collections import deque\n\nitems = deque()\nitem = items.popleft()\n```\n\n### 4. Уменьшить количество операций с базой данных\n\nВ backend именно БД часто является главным узким местом.\n\nПлохой вариант:\n\n```python\nfor user_id in user_ids:\n    user = await User.get(id=user_id)\n```\n\nДля 1000 пользователей:\n\n```text\n1000 SQL-запросов\n```\n\nЛучше:\n\n```python\nusers = await User.filter(\n    id__in=user_ids,\n)\n```\n\nПолучается один или несколько batch-запросов.\n\nОсобенно важны:\n\n```text\nустранение N+1\nSELECT только нужных полей\nbulk insert/update\nправильные JOIN\nиндексы\nпагинация\nагрегация на стороне БД\n```\n\nНапример:\n\n```sql\nSELECT *\nFROM users\nWHERE email = $1;\n```\n\nБез индекса может потребовать полного обхода таблицы.\n\nС индексом:\n\n```sql\nCREATE INDEX idx_users_email\nON users (email);\n```\n\nпоиск может стать на порядки быстрее.\n\nНо индекс ускоряет чтение ценой:\n\n```text\nдополнительной памяти\nзамедления INSERT/UPDATE/DELETE\n```\n\n### 5. Делать batch-операции\n\nЧасто основная стоимость находится не в самой операции, а в её вызове:\n\n```text\nсетевой round trip\nсистемный вызов\nтранзакция\nсериализация\nпереключение контекста\n```\n\nВместо:\n\n```python\nfor notification in notifications:\n    await send(notification)\n```\n\nлучше, если API позволяет:\n\n```python\nawait send_many(notifications)\n```\n\nВместо тысячи отдельных `INSERT`:\n\n```sql\nINSERT INTO users (...) VALUES (...);\nINSERT INTO users (...) VALUES (...);\n```\n\nиспользовать batch:\n\n```sql\nINSERT INTO users (username, email)\nVALUES\n    (...),\n    (...),\n    (...);\n```\n\nBatching особенно эффективен для:\n\n```text\nБД\nRedis\nHTTP API\nброкеров сообщений\nфайловых операций\n```\n\n### 6. Уменьшить объём обрабатываемых данных\n\nСамые быстрые данные — те, которые не пришлось читать и обрабатывать.\n\nПлохо:\n\n```sql\nSELECT *\nFROM payments;\n```\n\nесли нужны только:\n\n```text\nid\nstatus\namount\n```\n\nЛучше:\n\n```sql\nSELECT id, status, amount\nFROM payments;\n```\n\nТакже полезно:\n\n```text\nфильтровать данные раньше\nиспользовать LIMIT\nне загружать весь файл в память\nобрабатывать данные потоково\nне сериализовать ненужные поля\n```\n\nПример генератора:\n\n```python\ndef read_large_file(path: str):\n    with open(path) as file:\n        for line in file:\n            yield line\n```\n\nЭто не обязательно ускорит CPU, но резко уменьшит потребление памяти и позволит начать обработку раньше.\n\n### 7. Использовать кеширование\n\nЕсли результат дорогой операции часто повторяется, его можно сохранить.\n\n```text\nзапрос\n→ дорогой расчёт или SQL\n→ сохранить результат\n→ последующие запросы читают кеш\n```\n\nПример:\n\n```python\ncached = await redis.get(f\"user:{user_id}\")\n\nif cached is not None:\n    return cached\n```\n\nКешировать можно:\n\n```text\nрезультаты SQL-запросов\nHTTP-ответы\nконфигурацию\nсправочники\nрезультаты вычислений\nскомпилированные шаблоны\n```\n\nНо кеш создаёт проблемы:\n\n```text\nустаревшие данные\nинвалидация\ncache stampede\nдублирование состояния\nрасход памяти\n```\n\nКеш полезен, когда:\n\n```text\nоперация дорогая\nрезультат часто повторяется\nданные допустимо хранить некоторое время\n```\n\n### 8. Использовать конкурентность для I/O-bound задач\n\nЕсли программа большую часть времени ждёт:\n\n```text\nсеть\nБД\nфайлы\nвнешние API\n```\n\nоперации можно выполнять конкурентно.\n\nПоследовательно:\n\n```python\nuser = await get_user()\norders = await get_orders()\nsettings = await get_settings()\n```\n\nЕсли вызовы независимы:\n\n```python\nimport asyncio\n\nuser, orders, settings = await asyncio.gather(\n    get_user(),\n    get_orders(),\n    get_settings(),\n)\n```\n\nУсловно:\n\n```text\n3 запроса × 300 мс последовательно\n→ около 900 мс\n\n3 запроса одновременно\n→ около 300–400 мс\n```\n\nНо конкурентность не должна быть неограниченной:\n\n```python\nsemaphore = asyncio.Semaphore(20)\n```\n\nИначе можно перегрузить:\n\n```text\nБД\nвнешний API\nconnection pool\nоперативную память\n```\n\n### 9. Использовать параллелизм для CPU-bound задач\n\n`asyncio` почти не ускоряет тяжёлые CPU-вычисления.\n\nДля CPU-bound задач нужны:\n\n```text\nmultiprocessing\nProcessPoolExecutor\nнативные расширения\nраспараллеливание на несколько ядер\n```\n\nПример:\n\n```python\nfrom concurrent.futures import ProcessPoolExecutor\n\nwith ProcessPoolExecutor() as executor:\n    results = list(\n        executor.map(calculate, items)\n    )\n```\n\nПодходит для:\n\n```text\nобработки изображений\nсжатия\nкриптографии\nчисленных расчётов\nпарсинга больших объёмов\n```\n\nНо параллелизм имеет накладные расходы:\n\n```text\nсоздание процессов\nIPC\nсериализация\nкопирование данных\nсинхронизация\n```\n\nДля маленьких задач он может оказаться медленнее.\n\n### 10. Перенести горячий код из Python\n\nPython удобен, но медленнее нативного машинного кода для плотных вычислительных циклов.\n\nВместо Python-цикла:\n\n```python\nresult = []\n\nfor value in values:\n    result.append(value * 2)\n```\n\nможно использовать библиотеку, реализованную на C:\n\n```python\nimport numpy as np\n\nresult = np.asarray(values) * 2\n```\n\nВарианты ускорения:\n\n```text\nNumPy\nNumba\nCython\nRust extension\nC/C++ extension\n```\n\nЭто может дать ускорение в десятки или сотни раз, если основная нагрузка — вычисления, а не I/O.\n\n### 11. Использовать векторизацию и SIMD\n\nПроцессор может выполнять одну операцию сразу над несколькими значениями.\n\nОбычная обработка:\n\n```text\na[0] + b[0]\na[1] + b[1]\na[2] + b[2]\na[3] + b[3]\n```\n\nSIMD условно делает:\n\n```text\n[a0, a1, a2, a3]\n+\n[b0, b1, b2, b3]\n```\n\nодной векторной инструкцией.\n\nОбычно в Python SIMD используется через:\n\n```text\nNumPy\nPyTorch\nTensorFlow\nнативные библиотеки\nкомпиляторы\n```\n\n### 12. Улучшить локальность данных\n\nПроцессор работает быстрее, когда данные расположены последовательно.\n\nЭффективно:\n\n```text\nмассив структурированных данных\nпоследовательный обход\n```\n\nМенее эффективно:\n\n```text\nцепочка объектов\n→ указатель\n→ другой объект\n→ ещё один указатель\n```\n\nПричина:\n\n```text\ncache hit\nvs\ncache miss\n```\n\nНапример, последовательный обход массива обычно быстрее обхода связного списка даже при одинаковой сложности `O(n)`.\n\nДля обычного Python backend это редко главная проблема, но для больших массивов данных и численных задач — очень важная.\n\n### 13. Сократить аллокации и копирования\n\nСоздание большого числа объектов создаёт нагрузку на:\n\n```text\nallocator\nпамять\nкеш процессора\ngarbage collector\nreference counting\n```\n\nПлохо:\n\n```python\ndata = original[:]\nresult = data[:]\nfinal = result[:]\n```\n\nЕсли копии не нужны, лучше использовать один объект или представление.\n\nТакже полезно:\n\n```text\nиспользовать генераторы\nне создавать временные списки\nповторно использовать буферы\nне копировать request/response DTO без необходимости\n```\n\n### 14. Уменьшить сериализацию\n\nВ web-приложении значительное время может уходить на:\n\n```text\nORM model\n→ domain entity\n→ DTO\n→ Pydantic model\n→ dict\n→ JSON\n```\n\nЕсли объект большой или таких объектов тысячи, это становится заметно.\n\nМожно:\n\n```text\nвозвращать только нужные поля\nизбегать лишних преобразований\nиспользовать быструю JSON-библиотеку\nне сериализовать большие вложенные объекты\nприменять пагинацию\n```\n\nНо заменять JSON-библиотеку имеет смысл только после профилирования.\n\n### 15. Сократить системные и сетевые вызовы\n\nКаждый системный вызов и сетевой round trip имеют стоимость.\n\nВместо множества маленьких записей:\n\n```python\nfor chunk in chunks:\n    file.write(chunk)\n```\n\nможно объединять данные в более крупные блоки.\n\nВместо:\n\n```text\nHTTP-запрос на каждый объект\n```\n\nиспользовать:\n\n```text\nbatch endpoint\n```\n\nВместо частого открытия соединений:\n\n```text\nсоздать соединение\nотправить запрос\nзакрыть\n```\n\nиспользовать connection pooling и keep-alive.\n\n### 16. Использовать компиляцию и JIT\n\nИнтерпретируемый код можно ускорить через:\n\n```text\nJIT-компиляцию\nahead-of-time compilation\nспециализацию типов\n```\n\nВ Python возможны:\n\n```text\nPyPy\nNumba\nCython\nmypyc\n```\n\nРезультат зависит от кода. PyPy может ускорять долгоживущие чисто Python-вычисления, но не всегда хорошо сочетается с C-расширениями и конкретными библиотеками.\n\n### 17. Устранить блокировки и конкуренцию за ресурсы\n\nМногопоточная программа может быть медленной не из-за вычислений, а из-за ожидания lock:\n\n```text\nпоток A держит mutex\nпотоки B, C, D ждут\n```\n\nПолезно:\n\n```text\nуменьшить критическую секцию\nне выполнять I/O под lock\nразделить одну глобальную блокировку\nиспользовать lock-free чтение, где оправдано\nуменьшить shared mutable state\n```\n\nДля БД аналогичная проблема:\n\n```text\nдолгие транзакции\nSELECT FOR UPDATE\nконкуренция за одну строку\ndeadlock\n```\n\nИногда ускорение достигается не увеличением CPU, а уменьшением ожидания блокировок.\n\n### 18. Масштабировать программу\n\nЕсли один процесс уже оптимизирован, throughput можно увеличить горизонтально:\n\n```text\nLoad Balancer\n├── Backend 1\n├── Backend 2\n├── Backend 3\n└── Backend 4\n```\n\nНо это помогает только если нет общего bottleneck:\n\n```text\nодна БД\nодна блокировка\nодин внешний API\nодна очередь\n```\n\nДля CPU-bound обработки можно увеличивать количество worker-процессов.\n\nДля async web backend количество workers обычно подбирают по измерениям, а не по формуле «чем больше, тем лучше».\n\n### 19. Перенести работу из request-response потока\n\nНекоторые операции не нужно выполнять до ответа клиенту:\n\n```text\nотправка email\nгенерация отчёта\nобработка изображения\nиндексация\nуведомления\n```\n\nВместо:\n\n```text\nHTTP-запрос\n→ 30 секунд работы\n→ ответ\n```\n\nможно:\n\n```text\nHTTP-запрос\n→ поставить задачу в очередь\n→ 202 Accepted\n→ worker выполняет работу\n```\n\nЭто не обязательно уменьшает суммарное CPU-время, но сильно улучшает latency и устойчивость HTTP-сервиса.\n\n### 20. Использовать специализированный инструмент\n\nИногда кратное ускорение достигается переносом работы туда, где она выполняется эффективнее:\n\n```text\nPython-цикл\n→ SQL-запрос\n\nручной поиск\n→ индекс БД\n\nPython aggregation\n→ GROUP BY\n\nлокальная очередь\n→ RabbitMQ/Kafka\n\nручные численные вычисления\n→ NumPy\n\nобработка изображения в Python\n→ OpenCV\n```\n\nНапример, плохо:\n\n```python\npayments = await Payment.all()\n\ntotal = sum(\n    payment.amount\n    for payment in payments\n)\n```\n\nЛучше:\n\n```sql\nSELECT SUM(amount)\nFROM payments;\n```\n\nБД выполнит агрегацию ближе к данным и не передаст все строки приложению.\n\n### Что обычно даёт самый большой эффект\n\nПриоритет можно представить так:\n\n```text\n1. Не делать ненужную работу\n2. Улучшить алгоритм\n3. Сократить I/O и round trips\n4. Использовать batch\n5. Добавить правильные индексы\n6. Использовать кеш\n7. Добавить конкурентность или параллелизм\n8. Перенести горячий код в нативную реализацию\n9. Применять микрооптимизации\n```\n\n### Пример для backend\n\nДопустим, endpoint обрабатывает 1000 платежей:\n\n```python\nfor payment in payments:\n    user = await get_user(payment.user_id)\n    blocked = await check_blocked(payment.account_id)\n    await save_payment(payment)\n```\n\nПолучается:\n\n```text\n1000 запросов пользователей\n1000 проверок блокировки\n1000 INSERT\n```\n\nУскоренная схема:\n\n```text\n1 запрос пользователей через IN\n1 запрос заблокированных счетов через IN\n1 bulk insert платежей\n```\n\nПлюс:\n\n```text\nмножества для поиска в памяти\nодна транзакция\nограниченный batch\n```\n\nТакое изменение может ускорить обработку не на 10–20%, а в десятки раз.\n\n### Итог\n\nКратное ускорение чаще всего дают:\n\n```text\nизменение алгоритма\nправильные структуры данных\nустранение N+1\nиндексы БД\nbatch-операции\nуменьшение объёма данных\nкеширование\nконкурентное I/O\nпараллельные CPU-вычисления\nнативный или векторизованный код\n```\n\nПравильная последовательность:\n\n```text\nизмерить\n→ найти bottleneck\n→ устранить ненужную работу\n→ изменить архитектуру или алгоритм\n→ снова измерить\n```\n\nБез профилирования легко потратить несколько дней на участок, который занимает меньше одного процента общего времени."
