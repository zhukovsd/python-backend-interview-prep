  question = "Что такое цикломатическая сложность?"
  answer = "### Что такое цикломатическая сложность\n\n**Цикломатическая сложность** — метрика, оценивающая количество независимых путей выполнения через участок кода.\n\nОна показывает, насколько сильно управление программой разветвляется из-за:\n\n- `if` и `elif`;\n    \n- циклов;\n    \n- `case` в `match`/`switch`;\n    \n- обработчиков исключений;\n    \n- иногда логических операторов `and` и `or`.\n    \n\nЧем больше ветвлений, тем больше возможных сценариев поведения и тем сложнее код понимать и тестировать.\n\n### Простейшее правило подсчёта\n\nДля одной функции цикломатическую сложность часто считают так:\n\n```text\nM = количество точек ветвления + 1\n```\n\nФункция без условий:\n\n```python\ndef add(a: int, b: int) -> int:\n    return a + b\n```\n\nЗдесь только один путь выполнения:\n\n```text\nM = 1\n```\n\n### Пример с одним условием\n\n```python\ndef get_access_message(is_admin: bool) -> str:\n    if is_admin:\n        return \"Full access\"\n\n    return \"Limited access\"\n```\n\nЕсть одна точка ветвления:\n\n```text\nM = 1 + 1 = 2\n```\n\nДва независимых пути:\n\n```text\nis_admin = True\nis_admin = False\n```\n\n### Несколько условий\n\n```python\ndef get_discount(\n    is_vip: bool,\n    total: int,\n) -> int:\n    if is_vip:\n        return 20\n\n    if total >= 1000:\n        return 10\n\n    return 0\n```\n\nДве точки ветвления:\n\n```text\nM = 2 + 1 = 3\n```\n\nОсновные пути:\n\n```text\n1. Пользователь VIP\n2. Не VIP, но сумма >= 1000\n3. Не VIP и сумма < 1000\n```\n\n### `if`, `elif`, `else`\n\n```python\ndef classify_age(age: int) -> str:\n    if age < 18:\n        return \"minor\"\n    elif age < 65:\n        return \"adult\"\n    else:\n        return \"senior\"\n```\n\nТочки принятия решения:\n\n```text\nif\nelif\n```\n\n`else` не добавляет отдельной точки решения, потому что не содержит нового условия.\n\n```text\nM = 2 + 1 = 3\n```\n\n### Циклы тоже увеличивают сложность\n\n```python\ndef find_even(numbers: list[int]) -> int | None:\n    for number in numbers:\n        if number % 2 == 0:\n            return number\n\n    return None\n```\n\nТочки ветвления:\n\n```text\nfor\nif\n```\n\nПолучается:\n\n```text\nM = 3\n```\n\nПочему цикл считается ветвлением:\n\n```text\nцикл не выполняется ни разу\nцикл выполняется один или несколько раз\n```\n\n### Обработка исключений\n\nВ зависимости от инструмента `except` обычно увеличивает сложность:\n\n```python\ndef parse_number(value: str) -> int | None:\n    try:\n        return int(value)\n    except ValueError:\n        return None\n```\n\nЕсть два пути:\n\n```text\nпреобразование успешно\nвозникает ValueError\n```\n\nУсловно:\n\n```text\nM = 2\n```\n\nПравила подсчёта могут незначительно отличаться между анализаторами.\n\n### Формальное определение через граф управления\n\nКод можно представить как **граф потока управления**:\n\n- вершины — блоки инструкций;\n    \n- рёбра — возможные переходы;\n    \n- связные компоненты — независимые участки графа.\n    \n\nФормула Маккейба:\n\n```text\nM = E - N + 2P\n```\n\nГде:\n\n```text\nE — количество рёбер графа\nN — количество вершин\nP — количество связных компонентов\n```\n\nДля одной связной функции обычно:\n\n```text\nP = 1\n```\n\nи формула превращается в:\n\n```text\nM = E - N + 2\n```\n\nВ повседневной разработке обычно проще считать точки принятия решений плюс один.\n\n### Логические операторы `and` и `or`\n\nРассмотрим:\n\n```python\ndef can_access(\n    is_active: bool,\n    is_admin: bool,\n) -> bool:\n    if is_active and is_admin:\n        return True\n\n    return False\n```\n\nНа уровне выполнения `and` содержит короткое замыкание:\n\n```text\nis_active = False\n→ is_admin даже не проверяется\n```\n\nПоэтому некоторые инструменты считают:\n\n```text\nif  → +1\nand → +1\n```\n\nТогда сложность будет `3`.\n\nДругие инструменты могут считать всё условие одной точкой решения и вернуть `2`. Поэтому числовые значения разных анализаторов иногда отличаются.\n\n### Цикломатическая сложность и количество тестов\n\nМетрика примерно показывает минимальное количество тестовых сценариев, необходимое для покрытия независимых путей.\n\nДля функции:\n\n```python\ndef calculate_fee(\n    is_vip: bool,\n    amount: int,\n) -> int:\n    if amount <= 0:\n        raise ValueError(\"Invalid amount\")\n\n    if is_vip:\n        return 0\n\n    return 100\n```\n\nСложность:\n\n```text\nдве точки ветвления + 1\n→ M = 3\n```\n\nПолезны как минимум три сценария:\n\n```python\ndef test_invalid_amount():\n    ...\n\ndef test_vip_customer():\n    ...\n\ndef test_regular_customer():\n    ...\n```\n\nНо важно:\n\n```text\nцикломатическая сложность\n≠ точное необходимое количество всех тестов\n```\n\nОдному пути могут потребоваться несколько тестов из-за:\n\n- граничных значений;\n    \n- различных входных типов;\n    \n- ошибок внешних зависимостей;\n    \n- состояний базы данных;\n    \n- конкурентного выполнения;\n    \n- бизнес-инвариантов.\n    \n\n### Высокая сложность\n\n```python\ndef process_payment(payment, user):\n    if payment.amount <= 0:\n        return \"invalid\"\n\n    if user.is_blocked:\n        return \"blocked\"\n\n    if payment.currency == \"USD\":\n        if user.country == \"US\":\n            fee = 1\n        else:\n            fee = 3\n    elif payment.currency == \"EUR\":\n        if user.is_vip:\n            fee = 0\n        else:\n            fee = 2\n    else:\n        fee = 5\n\n    if payment.is_refund:\n        if payment.original_id is None:\n            return \"invalid_refund\"\n\n    return fee\n```\n\nТакая функция имеет много путей выполнения. Разработчику приходится одновременно учитывать:\n\n```text\nвалидность суммы\nблокировку пользователя\nвалюту\nстрану\nVIP-статус\nвозврат\nналичие исходной операции\n```\n\nПроблема не только в количестве строк, а в количестве сочетаний условий.\n\n### Как уменьшать цикломатическую сложность\n\n#### Ранние возвраты\n\nГлубокая вложенность:\n\n```python\ndef process(user):\n    if user is not None:\n        if user.active:\n            if user.has_permission:\n                return perform_action(user)\n\n    return None\n```\n\nБолее линейный вариант:\n\n```python\ndef process(user):\n    if user is None:\n        return None\n\n    if not user.active:\n        return None\n\n    if not user.has_permission:\n        return None\n\n    return perform_action(user)\n```\n\nЧисловая цикломатическая сложность может остаться той же, но **когнитивная сложность** снижается: меньше уровней вложенности.\n\n#### Выделение отдельных концепций\n\n```python\ndef can_process(user) -> bool:\n    return (\n        user is not None\n        and user.active\n        and user.has_permission\n    )\n\n\ndef process(user):\n    if not can_process(user):\n        return None\n\n    return perform_action(user)\n```\n\nНо бессмысленно дробить функцию только ради улучшения метрики. Общая сложность поведения системы никуда не исчезает.\n\n#### Полиморфизм или таблица диспетчеризации\n\nВместо длинного `if/elif`:\n\n```python\ndef calculate_fee(currency: str) -> int:\n    if currency == \"USD\":\n        return 1\n    elif currency == \"EUR\":\n        return 2\n    elif currency == \"GBP\":\n        return 3\n\n    return 5\n```\n\nМожно использовать таблицу:\n\n```python\nFEES = {\n    \"USD\": 1,\n    \"EUR\": 2,\n    \"GBP\": 3,\n}\n\n\ndef calculate_fee(currency: str) -> int:\n    return FEES.get(currency, 5)\n```\n\nЭто особенно полезно, когда ветки просто сопоставляют ключ со значением или обработчиком.\n\n### Какие значения считаются допустимыми\n\nЧасто используют приблизительную шкалу:\n\n```text\n1–5\n→ простая функция\n\n6–10\n→ умеренная сложность\n\n11–20\n→ сложная функция, стоит изучить\n\nбольше 20\n→ высокий риск ошибок и трудного тестирования\n```\n\nЭто не универсальный стандарт. Значение `12` не означает автоматически плохой код, а значение `3` — хороший.\n\nНапример, сложный, но линейный алгоритм может иметь:\n\n```text\n200 строк\nцикломатическая сложность = 2\n```\n\nА короткое булево выражение может иметь высокую логическую сложность.\n\n### Ограничения метрики\n\nЦикломатическая сложность не учитывает:\n\n- понятность имён;\n    \n- длину функции;\n    \n- качество архитектуры;\n    \n- связанность компонентов;\n    \n- количество внешних зависимостей;\n    \n- сложность SQL-запросов;\n    \n- асинхронность;\n    \n- изменяемое состояние;\n    \n- распределённые ошибки;\n    \n- сложность самих условий.\n    \n\nНапример:\n\n```python\nif user.is_active:\n    ...\n```\n\nи:\n\n```python\nif (\n    account.balance - reserved_amount >= requested_amount\n    and not account.is_frozen\n    and limits.allow(transaction)\n):\n    ...\n```\n\nмогут учитываться похоже, хотя второе условие требует намного больше рассуждений.\n\n### Цикломатическая и когнитивная сложность\n\nЦикломатическая сложность считает независимые пути.\n\n**Когнитивная сложность** пытается оценить, насколько трудно человеку понимать код. Она сильнее учитывает:\n\n- вложенность;\n    \n- прерывание линейного потока;\n    \n- сложные логические выражения;\n    \n- рекурсию.\n    \n\nНапример, ранние возвраты могут не уменьшить цикломатическую сложность, но сделать код заметно понятнее.\n\n### Инструменты для Python\n\nЧасто используют:\n\n```text\nradon\nruff\nflake8 + mccabe\npylint\nSonarQube\n```\n\nНапример, `ruff` может контролировать сложность через правило McCabe:\n\n```toml\n[tool.ruff.lint.mccabe]\nmax-complexity = 10\n```\n\nПри превышении лимита линтер сообщает, что функция слишком сложна.\n\nЛимит лучше воспринимать как сигнал для анализа, а не как требование механически разбить функцию на части.\n\n### Итог\n\n```text\nЦикломатическая сложность\n→ количество независимых путей выполнения кода\n\nПриблизительный подсчёт:\nточки ветвления + 1\n\nУвеличивают сложность:\nif, elif, циклы, case, except\nи иногда and/or\n\nВысокое значение обычно означает:\nбольше сценариев\nбольше тестов\nвыше риск ошибок\nсложнее изменение кода\n```\n\nГлавная практическая роль метрики — находить функции, в которых накопилось слишком много логических решений. Она не доказывает, что код плохой, но показывает участок, который стоит внимательно проверить."
