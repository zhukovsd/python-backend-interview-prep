  question = "Что такое шифрование и ключ шифрования?"
  answer = "### Что такое шифрование\n\n**Шифрование** — это преобразование исходных данных в нечитаемый вид с помощью алгоритма и ключа.\n\n```text\nОткрытый текст\n→ алгоритм шифрования + ключ\n→ шифротекст\n```\n\nНапример:\n\n```text\nИсходные данные:\n\"Перевести 100 AZN\"\n\nПосле шифрования:\n\"8F A2 91 3C ...\"\n```\n\nЧтобы восстановить данные, выполняется расшифрование:\n\n```text\nШифротекст\n→ алгоритм расшифрования + правильный ключ\n→ исходные данные\n```\n\nГлавная цель шифрования — **конфиденциальность**: посторонний может получить зашифрованные данные, но не должен суметь их прочитать без ключа.\n\n### Что такое ключ шифрования\n\n**Ключ шифрования** — секретное или специальным образом используемое значение, которое управляет работой криптографического алгоритма.\n\nКлюч можно представить как очень большое случайное число:\n\n```text\nalgorithm(data, key) → encrypted_data\n```\n\nСам алгоритм обычно не является секретным. Безопасность должна зависеть от секретности ключа, а не от сокрытия алгоритма.\n\nНапример, многие приложения используют один и тот же алгоритм AES, но разные ключи:\n\n```text\nДанные + ключ A → один шифротекст\nДанные + ключ B → другой шифротекст\n```\n\n### Почему нельзя расшифровать без ключа\n\nСовременные алгоритмы строятся так, чтобы перебор всех возможных ключей требовал практически недостижимого количества вычислений.\n\nНапример, ключ длиной 256 бит имеет:\n\n```text\n2²⁵⁶ возможных значений\n```\n\nПоэтому важны:\n\n- достаточная длина ключа;\n    \n- криптографически безопасная случайная генерация;\n    \n- отсутствие утечек;\n    \n- правильное хранение;\n    \n- периодическая ротация ключей.\n    \n\nДлинный предсказуемый пароль не обязательно является хорошим криптографическим ключом.\n\n### Симметричное шифрование\n\nПри симметричном шифровании один и тот же секретный ключ используется для шифрования и расшифрования:\n\n```text\nДанные\n→ секретный ключ\n→ шифротекст\n\nШифротекст\n→ тот же секретный ключ\n→ данные\n```\n\nПример алгоритма:\n\n```text\nAES\n```\n\nСимметричное шифрование:\n\n- быстро работает;\n    \n- подходит для больших объёмов данных;\n    \n- используется для файлов, дисков, резервных копий, трафика и данных в БД;\n    \n- требует безопасно передать секретный ключ второй стороне.\n    \n\nПример на уровне идеи:\n\n```python\nencrypted = encrypt(data, secret_key)\ndecrypted = decrypt(encrypted, secret_key)\n```\n\nПроблема: если передать ключ по незащищённому каналу, его могут перехватить.\n\n### Асимметричное шифрование\n\nПри асимметричной криптографии используется пара связанных ключей:\n\n```text\nпубличный ключ\nприватный ключ\n```\n\nПубличный ключ можно распространять. Приватный должен храниться в секрете.\n\nУпрощённо:\n\n```text\nДанные шифруются публичным ключом\n→ расшифровать можно приватным ключом\n```\n\nНапример, Алиса публикует свой открытый ключ:\n\n```text\nБоб\n→ шифрует сообщение публичным ключом Алисы\n→ Алиса расшифровывает своим приватным ключом\n```\n\nК асимметричным алгоритмам относятся, например:\n\n```text\nRSA\nэллиптическая криптография\n```\n\nНа практике асимметричное шифрование медленнее симметричного, поэтому большие данные обычно не шифруют напрямую публичным ключом.\n\n### Гибридное шифрование\n\nВ реальных системах часто комбинируют оба подхода:\n\n```text\n1. Создаётся случайный симметричный ключ\n2. Данные шифруются этим ключом\n3. Сам ключ защищается асимметричной криптографией\n```\n\nТак работает большая часть защищённых сетевых протоколов:\n\n```text\nасимметричная криптография\n→ безопасное согласование секрета\n\nсимметричная криптография\n→ быстрое шифрование трафика\n```\n\nНапример, HTTPS использует TLS, где стороны договариваются о сеансовых ключах, а затем шифруют трафик быстрыми симметричными алгоритмами.\n\n### Шифрование не гарантирует целостность автоматически\n\nШифрование отвечает на вопрос:\n\n```text\nМожет ли посторонний прочитать данные?\n```\n\nНо отдельно нужно контролировать:\n\n```text\nНе были ли данные изменены?\nКто их отправил?\n```\n\nДля этого используют аутентифицированное шифрование, например:\n\n```text\nAES-GCM\nChaCha20-Poly1305\n```\n\nОно одновременно обеспечивает:\n\n```text\nконфиденциальность\n+ проверку целостности\n+ проверку подлинности шифротекста\n```\n\nЕсли злоумышленник изменит зашифрованные данные, проверка должна завершиться ошибкой.\n\n### Что такое nonce и IV\n\nКроме ключа, алгоритму часто требуется `nonce` или `IV` — дополнительное значение, используемое при шифровании.\n\n```text\nшифротекст = encrypt(data, key, nonce)\n```\n\nОно нужно, чтобы одинаковые данные, зашифрованные одним ключом, не всегда давали одинаковый результат.\n\n```text\nencrypt(\"hello\", key, nonce_1) → шифротекст A\nencrypt(\"hello\", key, nonce_2) → шифротекст B\n```\n\n`Nonce` обычно не является секретным и может храниться рядом с шифротекстом. Но для многих режимов критически важно не использовать одно и то же значение повторно с одним ключом.\n\n```text\nключ\n→ секретный\n\nnonce / IV\n→ обычно публичный, но должен использоваться правильно\n```\n\n### Пароль и ключ — не одно и то же\n\nПароль обычно имеет низкую энтропию:\n\n```text\nmy_password_123\n```\n\nКриптографический ключ должен выглядеть как случайный набор байтов.\n\nПоэтому пароль нельзя просто передать в AES как ключ. Сначала из пароля получают ключ с помощью функции выработки ключа:\n\n```text\nпароль\n+ salt\n+ KDF\n→ криптографический ключ\n```\n\nПримеры KDF:\n\n```text\nArgon2\nscrypt\nPBKDF2\n```\n\n`Salt` не является секретным. Он защищает от заранее подготовленных таблиц и делает одинаковые пароли разными на уровне производных ключей.\n\n### Шифрование и хеширование\n\nЭто разные операции.\n\n#### Шифрование\n\nОбратимо при наличии ключа:\n\n```text\nданные → шифротекст → исходные данные\n```\n\nПрименяется, когда данные потом нужно получить обратно:\n\n```text\nдокументы\nтокены\nрезервные копии\nсетевой трафик\n```\n\n#### Хеширование\n\nОбычно необратимо:\n\n```text\nданные → хеш\n```\n\nИспользуется для проверки целостности и хранения паролей.\n\nПароли пользователей обычно не шифруют, а хешируют специальными алгоритмами:\n\n```text\nArgon2\nbcrypt\nscrypt\n```\n\nПотому что серверу не нужно восстанавливать исходный пароль — нужно только проверить его совпадение.\n\n### Шифрование и кодирование\n\nКодирование не обеспечивает секретность:\n\n```text\nBase64\nURL encoding\nUTF-8\n```\n\nНапример:\n\n```text\nsecret → c2VjcmV0\n```\n\nЭто Base64, но любой может сразу декодировать значение обратно.\n\n```text\nкодирование\n→ изменение представления данных\n\nшифрование\n→ защита данных с помощью ключа\n```\n\n### Где хранить ключи\n\nКлюч нельзя хранить:\n\n- прямо в исходном коде;\n    \n- в Git-репозитории;\n    \n- в Docker-образе;\n    \n- в логах;\n    \n- рядом с зашифрованными данными без дополнительной защиты.\n    \n\nОбычно используют:\n\n```text\nпеременные окружения\nDocker/Kubernetes Secrets\nHashiCorp Vault\nAWS KMS\nGoogle Cloud KMS\nAzure Key Vault\nаппаратные HSM\n```\n\nНо переменные окружения — лишь способ доставки секрета приложению, а не полноценная система управления ключами.\n\nСистема управления ключами обычно предоставляет:\n\n- генерацию;\n    \n- хранение;\n    \n- разграничение доступа;\n    \n- аудит;\n    \n- ротацию;\n    \n- отзыв;\n    \n- уничтожение ключей.\n    \n\n### Компрометация ключа\n\nЕсли злоумышленник получил ключ, он может расшифровать все данные, защищённые этим ключом.\n\nПоэтому применяют:\n\n```text\nразные ключи для разных окружений\nразные ключи для разных задач\nограничение прав доступа\nротацию\nверсионирование\nаудит использования\n```\n\nНапример:\n\n```text\nkey_version = 3\n```\n\nПри ротации новые данные шифруются новым ключом, а старые ключи некоторое время сохраняются только для расшифрования существующих данных.\n\n### Пример практической структуры\n\nОбычно рядом с шифротекстом хранят:\n\n```json\n{\n  \"ciphertext\": \"...\",\n  \"nonce\": \"...\",\n  \"key_version\": 3,\n  \"algorithm\": \"AES-256-GCM\"\n}\n```\n\nПри этом сам секретный ключ хранится отдельно в KMS или Vault.\n\nПроцесс расшифрования:\n\n```text\n1. Прочитать key_version\n2. Получить нужный ключ из защищённого хранилища\n3. Передать ключ, nonce и шифротекст алгоритму\n4. Проверить аутентификационный тег\n5. Получить исходные данные\n```\n\n### Итог\n\n```text\nШифрование\n→ преобразует читаемые данные в защищённый шифротекст\n\nКлюч шифрования\n→ значение, от которого зависит возможность зашифровать\n  или расшифровать данные\n```\n\nОсновные варианты:\n\n```text\nСимметричное:\nодин секретный ключ\nбыстрое шифрование данных\n\nАсимметричное:\nпубличный и приватный ключи\nобмен секретами и цифровые подписи\n\nГибридное:\nасимметричная защита ключа\n+ симметричное шифрование данных\n```\n\nБезопасность зависит не только от алгоритма, но и от правильной генерации, хранения, применения и ротации ключей."
  popularity = 2.63

