[[questions]]
  id = 4
  question = "Какие меры защиты от DoS- и DDoS-атак обычно применяются в backend-системах?"
  answer = "### Общий принцип\n\nЗащита от DoS/DDoS строится **в несколько уровней**, потому что разные атаки исчерпывают разные ресурсы:\n\n```text\nL3/L4:\nканал связи, пакеты, TCP-соединения\n\nL7:\nHTTP-запросы, CPU, память, worker-ы, БД\n\nБизнес-уровень:\nдорогие отчёты, поиск, SMS, email, внешние API\n```\n\nГлавное различие:\n\n```text\nDoS\n→ атака может идти от одного или нескольких источников\n\nDDoS\n→ атака распределена между множеством источников\n```\n\nПростой rate limiting внутри FastAPI не спасёт от крупной объёмной DDoS-атаки: входящий канал или инфраструктура перед приложением могут быть перегружены ещё до того, как запрос достигнет backend. Поэтому объёмный трафик нужно отбрасывать на стороне провайдера, CDN или специализированной Anti-DDoS-сети. \n\n### 1. CDN и специализированная Anti-DDoS-защита\n\nПубличный сервис обычно помещают за:\n\n```text\nпользователь\n→ Anycast/CDN/Anti-DDoS\n→ WAF\n→ Load Balancer\n→ backend\n```\n\nТакая инфраструктура принимает трафик на распределённой сети, фильтрует вредоносные пакеты и пропускает к origin только разрешённый трафик. Anycast позволяет распределять входящий трафик между географически разными узлами, а специализированные сервисы защищают уровни L3, L4 и L7. \n\nДля крупных систем применяются:\n\n- CDN и reverse proxy;\n    \n- облачная DDoS-защита;\n    \n- scrubbing centers;\n    \n- защита BGP-анонсов и сетевой инфраструктуры;\n    \n- автоматическое обнаружение аномалий;\n    \n- фильтрация UDP-, SYN- и HTTP-flood атак.\n    \n\nНа AWS эту роль выполняют, например, Shield, CloudFront, Global Accelerator и WAF; аналогичные возможности есть у других крупных edge-провайдеров. \n\n### 2. Не раскрывать реальный адрес origin\n\nЕсли backend спрятан за CDN, но его реальный IP доступен напрямую, атакующий может обойти CDN:\n\n```text\nатака\n→ напрямую на origin IP\n→ защита edge не участвует\n```\n\nПоэтому origin обычно принимает входящие подключения только:\n\n- от адресов CDN или reverse proxy;\n    \n- через закрытую сеть;\n    \n- через защищённый load balancer;\n    \n- через VPN или private connectivity.\n    \n\nПублично должны быть доступны только действительно необходимые сервисы и порты. Сокращение интернет-доступной поверхности уменьшает число возможных целей атаки. \n\n### 3. Rate limiting\n\nRate limiting ограничивает количество запросов за период:\n\n```text\nне более 100 запросов в минуту\nна пользователя / токен / IP / endpoint\n```\n\nПример алгоритмов:\n\n```text\nfixed window\nsliding window\ntoken bucket\nleaky bucket\n```\n\nОграничивать можно по:\n\n- IP;\n    \n- API-ключу;\n    \n- пользователю;\n    \n- организации;\n    \n- сессии;\n    \n- endpoint;\n    \n- сочетанию нескольких признаков.\n    \n\nНа превышение API обычно отвечает:\n\n```http\n429 Too Many Requests\nRetry-After: 30\n```\n\nOWASP отдельно относит отсутствие ограничений на потребление ресурсов к рискам API, а NGINX и WAF-системы поддерживают ограничения частоты запросов и числа соединений. \n\nПри этом правило:\n\n```text\n100 запросов в минуту на IP\n```\n\nне всегда достаточно. Тысячи узлов ботнета могут соблюдать такой лимит по отдельности и всё равно создать огромную суммарную нагрузку.\n\nПоэтому применяют несколько уровней:\n\n```text\nобщий лимит сервиса\n+ лимит клиента\n+ лимит endpoint\n+ лимит дорогих операций\n+ адаптивное обнаружение аномалий\n```\n\n### 4. Разные лимиты для разных операций\n\nЗапросы имеют разную стоимость:\n\n```text\nGET /health\n→ почти бесплатный\n\nGET /users/42\n→ дешёвый запрос БД\n\nPOST /reports\n→ тяжёлая агрегация\n\nPOST /images/resize\n→ CPU и память\n\nPOST /sms/send\n→ внешний платный ресурс\n```\n\nПоэтому одинаковый лимит для всех endpoint обычно неэффективен.\n\nПример:\n\n```text\nGET /products       → 300 запросов/мин\nPOST /login         → 10 запросов/мин\nPOST /reports       → 2 запроса/мин\nPOST /sms/send      → 3 запроса/час\n```\n\nКроме частоты, полезно учитывать **стоимость** запроса:\n\n```text\nпростой запрос       → 1 unit\nсложный поиск        → 5 units\nгенерация отчёта     → 50 units\n```\n\nЭто особенно важно для GraphQL, где один HTTP-запрос может содержать очень глубокий и дорогой запрос. OWASP рекомендует ограничивать глубину, количество операций и вычислительную стоимость GraphQL-запросов. \n\n### 5. Ограничение числа одновременных запросов\n\nПомимо запросов в секунду ограничивают concurrency:\n\n```text\nне более 20 одновременных тяжёлых операций\nна пользователя\n```\n\nНапример:\n\n```python\nimport asyncio\n\nreport_semaphore = asyncio.Semaphore(20)\n\n\nasync def generate_report(data):\n    async with report_semaphore:\n        return await perform_expensive_calculation(data)\n```\n\nНо локальный `Semaphore` действует только внутри одного процесса. В многопроцессной или распределённой системе лимит нужно реализовывать на уровне:\n\n- API gateway;\n    \n- ingress;\n    \n- общей очереди;\n    \n- Redis;\n    \n- внешнего rate limiter;\n    \n- базы данных или централизованного coordinator.\n    \n\nНа reverse proxy также ограничивают число одновременных соединений с одного клиента. NGINX предоставляет отдельный механизм `limit_conn` для подобных ограничений. \n\n### 6. Тайм-ауты\n\nАтакующий может не отправлять много запросов, а удерживать соединения открытыми:\n\n```text\nоткрыть соединение\n→ медленно отправлять заголовки\n→ медленно отправлять тело\n→ занять worker или socket\n```\n\nЭто семейство low-and-slow атак.\n\nЗащита:\n\n```text\nconnect timeout\nread timeout\nwrite timeout\nidle timeout\nheader timeout\nrequest body timeout\nupstream timeout\n```\n\nТакже ограничивают:\n\n- максимальную продолжительность запроса;\n    \n- время выполнения SQL;\n    \n- время ответа внешнего API;\n    \n- время удержания транзакции;\n    \n- время обработки background-задачи.\n    \n\nHTTP reverse proxy перед приложением особенно важен для защиты от медленных соединений. \n\n### 7. Ограничение размеров входных данных\n\nBackend должен устанавливать верхние границы:\n\n```text\nмаксимальный размер HTTP body\nмаксимальный размер файла\nмаксимальное число элементов массива\nмаксимальная длина строки\nмаксимальная глубина JSON\nмаксимальное число multipart-частей\n```\n\nНапример:\n\n```text\nаватар       → максимум 10 МБ\nCSV-платежи  → максимум 1000 строк\nbatch API    → максимум 100 объектов\npage_size    → максимум 100\n```\n\nБез этих ограничений один запрос может потребовать огромный объём:\n\n- памяти;\n    \n- CPU;\n    \n- диска;\n    \n- времени сериализации;\n    \n- запросов в БД.\n    \n\nOWASP рекомендует ограничивать размеры загружаемых данных и другие ресурсоёмкие параметры до начала дорогой обработки. \n\n### 8. Защита от вычислительно дорогих входных данных\n\nНекоторые небольшие запросы способны вызвать непропорционально дорогую обработку:\n\n```text\nсложное регулярное выражение\nглубоко вложенный JSON/XML\nархив с огромным содержимым\nдорогой GraphQL-запрос\nизображение с огромным разрешением\nсложный фильтр БД\n```\n\nНужны ограничения на:\n\n- глубину вложенности;\n    \n- сложность выражений;\n    \n- число распакованных файлов;\n    \n- итоговый размер распаковки;\n    \n- разрешение изображения;\n    \n- количество JOIN и фильтров;\n    \n- время исполнения;\n    \n- объём промежуточных данных.\n    \n\nДля XML обычно отключают DTD и внешние сущности: помимо XXE это защищает от атак вроде Billion Laughs, вызывающих чрезмерное потребление памяти и CPU. \n\n### 9. Пагинация и ограничения выборок\n\nНельзя позволять клиенту запросить неограниченный набор:\n\n```http\nGET /payments?page_size=10000000\n```\n\nBackend должен устанавливать предел:\n\n```python\npage_size = min(requested_page_size, 100)\n```\n\nТакже нужны:\n\n- обязательная пагинация;\n    \n- максимальный диапазон дат;\n    \n- ограничение числа экспортируемых строк;\n    \n- асинхронная генерация крупных отчётов;\n    \n- ограничение полей и вложенных связей.\n    \n\nОтсутствие пагинации может привести к чрезмерному потреблению памяти, процессора и ресурсов БД. \n\n### 10. WAF и bot management\n\nWAF анализирует HTTP-запросы и может:\n\n- блокировать известные вредоносные шаблоны;\n    \n- ограничивать запросы к отдельным endpoint;\n    \n- применять managed rules;\n    \n- выполнять challenge;\n    \n- блокировать аномальные User-Agent или сигнатуры;\n    \n- учитывать threat intelligence;\n    \n- отличать автоматизированный трафик от нормального.\n    \n\nДля L7 DDoS обычно используют сочетание:\n\n```text\nWAF\n+ rate limiting\n+ bot management\n+ поведенческий анализ\n+ масштабирование приложения\n```\n\nAWS прямо рекомендует совместно использовать WAF и масштабирование для application-layer DDoS, а edge-провайдеры могут автоматически добавлять правила в ответ на обнаруженную аномалию.\n\n### 11. CAPTCHA и challenge\n\nДля действий, которые обычно выполняет человек, можно включать challenge:\n\n```text\nрегистрация\nвосстановление пароля\nотправка формы\nпоиск билетов\nголосование\nпокупка дефицитного товара\n```\n\nChallenge обычно применяют не ко всем пользователям, а при повышенном риске:\n\n```text\nобычный пользователь\n→ запрос разрешён\n\nподозрительный клиент\n→ JavaScript challenge / CAPTCHA / MFA\n\nявный бот\n→ блокировка\n```\n\nЭто снижает автоматизированную нагрузку, но не защищает сетевой канал от объёмной DDoS-атаки.\n\n### 12. Кеширование\n\nКеш позволяет обслужить запрос без обращения к backend или БД:\n\n```text\nклиент\n→ CDN cache\n→ ответ\n\nвместо:\n\nклиент\n→ backend\n→ PostgreSQL\n→ сериализация\n→ ответ\n```\n\nОсобенно полезно кешировать:\n\n- статические файлы;\n    \n- публичные страницы;\n    \n- справочники;\n    \n- редко изменяемые GET-ответы;\n    \n- результаты дорогих вычислений.\n    \n\nEdge-узлы CDN могут возвращать кешированную копию, не передавая каждый запрос origin-серверу. \n\nПри этом атакующий может намеренно обходить кеш:\n\n```http\nGET /products?random=12345\n```\n\nПоэтому важны нормализация cache key, игнорирование ненужных параметров и rate limiting cache-miss запросов.\n\n### 13. Очереди и backpressure\n\nТяжёлые операции лучше не выполнять неограниченно внутри HTTP-запроса:\n\n```text\nHTTP\n→ поставить задачу в очередь\n→ вернуть 202\n→ worker обработает позже\n```\n\nОчередь даёт контролируемый буфер:\n\n```text\n100 HTTP-запросов\n→ очередь\n→ 10 worker-ов обрабатывают с фиксированной скоростью\n```\n\nНо очередь тоже должна иметь:\n\n- максимальный размер;\n    \n- TTL сообщений;\n    \n- ограничение числа задач от одного пользователя;\n    \n- приоритеты;\n    \n- dead-letter queue;\n    \n- стратегию отказа при заполнении.\n    \n\nБез ограничений очередь просто переносит DoS из HTTP-сервера в брокер или worker-ы.\n\n### 14. Изоляция ресурсов\n\nОдна тяжёлая функция не должна уничтожать весь сервис.\n\nПрименяются:\n\n```text\nотдельные worker pool\nотдельные очереди\nbulkhead pattern\nCPU/memory limits\nлимиты файловых дескрипторов\nограничения числа процессов\nотдельные connection pool\n```\n\nНапример:\n\n```text\nобычные API-запросы\n→ отдельный pool\n\nгенерация PDF\n→ отдельный pool\n\nобработка изображений\n→ отдельные worker-ы\n```\n\nВ контейнерах задают ограничения CPU и памяти, чтобы один компонент не поглотил все ресурсы узла. Kubernetes поддерживает resource requests, limits и namespace quotas. \n\n### 15. Защита базы данных\n\nЧасто HTTP-сервер выдерживает атаку, но падает БД.\n\nМеры:\n\n- ограниченный connection pool;\n    \n- `statement_timeout`;\n    \n- `lock_timeout`;\n    \n- лимит тяжёлых запросов;\n    \n- индексы;\n    \n- запрет неограниченных выборок;\n    \n- read replicas;\n    \n- кеширование;\n    \n- circuit breaker;\n    \n- отдельный пользователь БД с ограниченными ресурсами;\n    \n- закрытие долгих idle-транзакций.\n    \n\nВажно не делать:\n\n```text\nкаждый HTTP-запрос\n→ новое соединение с PostgreSQL\n```\n\nПри атаке это быстро исчерпает `max_connections`.\n\nЛучше:\n\n```text\n1000 входящих запросов\n→ очередь ожидания\n→ pool из 20–50 соединений\n→ PostgreSQL\n```\n\nКогда pool переполнен, сервис должен ограниченно ждать или быстро отклонять запросы, а не создавать неограниченное количество соединений.\n\n### 16. Circuit breaker и отказ от необязательных функций\n\nВо время перегрузки сервис может временно отключить дорогие возможности:\n\n```text\nрекомендации\nпоиск по истории\nполные отчёты\nизображения высокого качества\nвнешние интеграции\n```\n\nИ сохранить критичные:\n\n```text\nавторизация\nплатежи\nпросмотр статуса заказа\nhealth checks\n```\n\nЭто называется graceful degradation.\n\nCircuit breaker временно прекращает вызовы в уже перегруженную зависимость:\n\n```text\nPayment API отвечает ошибками\n→ circuit открывается\n→ новые вызовы быстро отклоняются\n→ backend не накапливает тысячи зависших запросов\n```\n\n### 17. Load balancing и autoscaling\n\nБалансировщик распределяет запросы между экземплярами:\n\n```text\nLoad Balancer\n├── backend 1\n├── backend 2\n├── backend 3\n└── backend 4\n```\n\nAutoscaling добавляет экземпляры при росте нагрузки.\n\nЭто повышает устойчивость, но **не является полной DDoS-защитой**:\n\n- атака может быть больше максимальной мощности;\n    \n- может быть перегружена общая БД;\n    \n- масштабирование происходит не мгновенно;\n    \n- атакующий способен вызвать огромные облачные расходы;\n    \n- L3/L4-атака может не дойти до уровня приложения.\n    \n\nПоэтому масштабирование должно работать вместе с edge-фильтрацией, WAF, лимитами и бюджетными ограничениями. Для L7 AWS рекомендует именно сочетание масштабирования и WAF. \n\n### 18. Не полагаться только на блокировку IP\n\nIP blacklist полезен против отдельных источников, но слаб против DDoS:\n\n```text\n100 000 разных IP\n→ блокировка по одному слишком медленная\n```\n\nКроме того, один IP может представлять:\n\n- корпоративную сеть;\n    \n- мобильного оператора;\n    \n- NAT;\n    \n- прокси;\n    \n- множество легитимных пользователей.\n    \n\nПоэтому IP — только один из сигналов:\n\n```text\nIP\n+ ASN\n+ страна\n+ API key\n+ пользователь\n+ fingerprint\n+ поведение\n+ частота\n+ репутация\n```\n\n### 19. Мониторинг и обнаружение аномалий\n\nДля реакции нужны метрики:\n\n```text\nrequests per second\nновые TCP-соединения\nошибки 429/502/503/504\nCPU и память\nevent loop lag\nчисло занятых worker-ов\nдлина очереди\nconnection pool БД\ncache hit ratio\np95/p99 latency\nсетевой трафик\nстоимость запросов\n```\n\nНеобходимо знать нормальный baseline:\n\n```text\nобычно: 1 000 RPS\nсейчас: 30 000 RPS\n\nобычно: 70% cache hit\nсейчас: 5%\n```\n\nСовременные managed DDoS-сервисы также анализируют исторические профили трафика и ищут отклонения от базовой линии. \n\n### 20. План реагирования\n\nДо атаки должны быть определены:\n\n```text\nкто принимает решение\nкак связаться с провайдером\nкакие endpoint отключать\nкак включить жёсткие WAF-правила\nкак скрыть origin\nкак ограничить трафик по регионам\nкак проверить состояние БД\nкак уведомить пользователей\n```\n\nТакже полезно заранее согласовать возможности Anti-DDoS с хостингом или ISP. OWASP и CISA рекомендуют готовить защиту и процедуру реагирования до инцидента, а не во время уже идущей атаки. \n\n### Практическая схема backend-защиты\n\n```text\nInternet\n   ↓\nAnycast / CDN / Anti-DDoS\n   ↓\nWAF + Bot Management\n   ↓\nRate Limiting\n   ↓\nLoad Balancer / Reverse Proxy\n   ├── connection limits\n   ├── body-size limits\n   ├── timeouts\n   └── concurrency limits\n   ↓\nBackend\n   ├── validation\n   ├── pagination\n   ├── query-cost limits\n   ├── semaphores\n   ├── circuit breakers\n   └── graceful degradation\n   ↓\nRedis / Queue / Database\n   ├── connection pools\n   ├── resource quotas\n   ├── statement timeout\n   └── bounded queues\n```\n\n### Что наиболее важно\n\nДля обычного публичного backend минимальный разумный набор:\n\n```text\nCDN или Anti-DDoS перед origin\nWAF\nrate limiting по пользователю и endpoint\nлимиты соединений и параллельности\nтайм-ауты\nограничение body/file/page size\nпагинация\nограниченный DB connection pool\nкеширование\nметрики и алерты\nскрытый origin\n```\n\nГлавное правило:\n\n```text\nкрупную DDoS нужно отбрасывать далеко от backend;\n\nдорогие L7-запросы нужно ограничивать\nкак можно раньше в цепочке;\n\nкаждый внутренний ресурс должен иметь\nявный верхний предел потребления.\n```"
