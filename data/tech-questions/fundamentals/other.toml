  id = 17
  question = "Какие линтеры для Python вы знаете?"
  answer = "### Основные линтеры Python\n\n#### Ruff\n\nСовременный быстрый линтер, написанный на Rust. Поддерживает сотни правил и заменяет значительную часть функциональности Flake8 и его плагинов, Pyflakes, pycodestyle, isort, pyupgrade, pydocstyle и других инструментов. Умеет автоматически исправлять многие нарушения через `--fix`. \n\n```bash\nruff check .\nruff check . --fix\n```\n\nКонфигурация в `pyproject.toml`:\n\n```toml\n[tool.ruff.lint]\nselect = [\n    \"E\",    # pycodestyle errors\n    \"F\",    # Pyflakes\n    \"I\",    # сортировка импортов\n    \"B\",    # flake8-bugbear\n    \"UP\",   # pyupgrade\n]\n\nignore = [\"E501\"]\n```\n\nДля большинства новых проектов Ruff — разумный основной выбор:\n\n```text\nбыстро работает\nмного правил\nавтоисправления\nодна конфигурация\nможет заменить несколько отдельных инструментов\n```\n\nСам Ruff также имеет отдельный форматтер:\n\n```bash\nruff format .\n```\n\nНо линтинг и форматирование — разные операции. \n\n### Pylint\n\nБолее глубокий и строгий анализатор:\n\n```bash\npylint src/\n```\n\nПроверяет:\n\n- потенциальные ошибки;\n    \n- неправильное использование объектов;\n    \n- соглашения об именовании;\n    \n- слишком сложные функции;\n    \n- слишком большое количество аргументов;\n    \n- недоступные атрибуты;\n    \n- дублирование кода;\n    \n- архитектурные признаки плохой структуры.\n    \n\nPylint обычно выполняет более семантический анализ, чем простой style checker, но может выдавать больше спорных предупреждений и требует тщательной настройки. \n\nПример:\n\n```python\ndef calculate(a, b, c, d, e, f, g, h):\n    ...\n```\n\nPylint может сообщить о слишком большом количестве аргументов.\n\nНастройка:\n\n```toml\n[tool.pylint.main]\npy-version = \"3.13\"\n\n[tool.pylint.design]\nmax-args = 7\nmax-branches = 12\n```\n\n### Flake8\n\nFlake8 — классический расширяемый линтер, объединяющий несколько проверок и поддерживающий систему плагинов. \n\n```bash\nflake8 src tests\n```\n\nТрадиционно он объединяет проверки:\n\n```text\nPyflakes\n→ потенциальные логические ошибки\n\npycodestyle\n→ стиль PEP 8\n\nMcCabe\n→ цикломатическая сложность\n```\n\nЕго часто расширяют плагинами:\n\n```text\nflake8-bugbear\nflake8-builtins\nflake8-comprehensions\nflake8-simplify\nflake8-annotations\npep8-naming\n```\n\nПример конфигурации:\n\n```ini\n[flake8]\nmax-line-length = 88\nmax-complexity = 10\nexclude =\n    .git,\n    .venv,\n    migrations\n```\n\nFlake8 остаётся рабочим вариантом для существующих проектов, особенно если уже используется настроенный набор плагинов. В новых проектах многие выбирают Ruff, поскольку он реализует значительную часть подобных правил в одном инструменте.\n\n### Pyflakes\n\nPyflakes ищет вероятные ошибки, почти не занимаясь оформлением кода:\n\n```python\nimport os  # импорт не используется\n\nresult = unknown_variable + 1\n```\n\nТипичные проверки:\n\n- неиспользуемые импорты;\n    \n- неопределённые переменные;\n    \n- повторное определение имён;\n    \n- неправильное использование `global`;\n    \n- переменные, назначенные, но не использованные.\n    \n\nPyflakes входит в основу Flake8, а его правила также реализованы в Ruff под кодами `F...`.\n\n### pycodestyle\n\nПроверяет часть соглашений PEP 8:\n\n```bash\npycodestyle src/\n```\n\nНапример:\n\n- отступы;\n    \n- пробелы;\n    \n- пустые строки;\n    \n- длину строки;\n    \n- расположение импортов.\n    \n\nОфициальная документация подчёркивает, что pycodestyle проверяет только алгоритмически формализуемую часть рекомендаций PEP 8, а не весь стиль Python-кода. \n\nПример нарушения:\n\n```python\nx=10\n```\n\nПредпочтительный вариант:\n\n```python\nx = 10\n```\n\nКак отдельный инструмент сейчас используется реже, поскольку обычно входит в Flake8 или заменяется Ruff.\n\n### Специализированные анализаторы\n\n#### Bandit\n\nИщет потенциальные проблемы безопасности в Python-коде:\n\n```bash\nbandit -r src/\n```\n\nНапример:\n\n```python\nimport subprocess\n\nsubprocess.run(user_input, shell=True)\n```\n\nМожет обнаруживать:\n\n- `shell=True`;\n    \n- небезопасные вызовы `eval`;\n    \n- слабые криптографические алгоритмы;\n    \n- небезопасное использование `pickle`;\n    \n- захардкоженные пароли;\n    \n- проблемные настройки SSL/TLS.\n    \n\nBandit предназначен именно для security-oriented статического анализа и может подключаться к CI/CD. \n\n#### pydocstyle\n\nПроверяет docstring по соглашениям PEP 257:\n\n```python\ndef create_user():\n    pass\n```\n\nМожет сообщить об отсутствии документации функции или неправильном формате docstring.\n\nМногие его правила доступны в Ruff под префиксом:\n\n```text\nD\n```\n\n#### Vulture\n\nИщет предположительно мёртвый код:\n\n```text\nнеиспользуемые функции\nнеиспользуемые классы\nнеиспользуемые переменные\nнедостижимые участки\n```\n\nНужно учитывать, что динамический Python-код, плагины, декораторы и рефлексия могут создавать ложные срабатывания.\n\n#### McCabe\n\nИзмеряет цикломатическую сложность:\n\n```text\nif\nelif\nfor\nwhile\nexcept\n```\n\nЧасто используется не отдельно, а через Flake8:\n\n```bash\nflake8 --max-complexity 10 src/\n```\n\nИли через Ruff:\n\n```toml\n[tool.ruff.lint.mccabe]\nmax-complexity = 10\n```\n\n### Инструменты, которые часто ошибочно называют линтерами\n\n#### Black\n\nBlack — прежде всего **форматтер**, а не линтер:\n\n```bash\nblack .\n```\n\nОн автоматически изменяет оформление кода, но не занимается полноценным поиском логических ошибок.\n\n#### isort\n\nСортирует импорты:\n\n```bash\nisort .\n```\n\n```python\nimport os\nimport sys\n\nfrom fastapi import FastAPI\n\nfrom app.models import User\n```\n\nСейчас его функциональность также можно получить через Ruff:\n\n```bash\nruff check . --select I --fix\n```\n\n#### mypy и Pyright\n\nЭто прежде всего **статические анализаторы типов**:\n\n```bash\nmypy src/\npyright\n```\n\nОни проверяют:\n\n```python\nuser_id: int = \"42\"\n```\n\nНо не заменяют линтер общих ошибок и стиля.\n\n#### pytest\n\n`pytest` запускает тесты, а не анализирует код как линтер.\n\n### Практические комбинации\n\nДля современного небольшого или среднего проекта:\n\n```text\nRuff\n→ ошибки, стиль, импорты, упрощения\n\nPyright или mypy\n→ типы\n\npytest\n→ поведение\n\nBandit\n→ дополнительные security-проверки\n```\n\nКоманды:\n\n```bash\nruff check .\nruff format --check .\npyright\npytest\nbandit -r src/\n```\n\nДля проекта, где требуется более строгий анализ структуры:\n\n```text\nRuff\n+ Pylint\n+ Pyright/mypy\n+ pytest\n```\n\nПри этом правила Ruff и Pylint частично пересекаются, поэтому их нужно настроить так, чтобы CI не выдавал одинаковые предупреждения дважды.\n\nДля старого проекта:\n\n```text\nFlake8 + плагины\nBlack\nisort\nmypy\n```\n\nПереходить на Ruff необязательно, если текущая цепочка стабильна и уже настроена.\n\n### Пример настройки Ruff\n\n```toml\n[tool.ruff]\ntarget-version = \"py313\"\nline-length = 88\n\n[tool.ruff.lint]\nselect = [\n    \"E\",\n    \"F\",\n    \"W\",\n    \"I\",\n    \"B\",\n    \"UP\",\n    \"SIM\",\n    \"C90\",\n]\n\nignore = [\n    \"E501\",\n]\n\n[tool.ruff.lint.mccabe]\nmax-complexity = 10\n\n[tool.ruff.lint.per-file-ignores]\n\"tests/*\" = [\"S101\"]\n```\n\nЗапуск:\n\n```bash\nruff check .\nruff check . --fix\nruff format .\n```\n\n### Итог\n\n```text\nRuff\n→ основной универсальный современный линтер\n\nPylint\n→ более глубокий и строгий анализ\n\nFlake8\n→ классическая расширяемая экосистема\n\nPyflakes\n→ вероятные ошибки и неиспользуемые имена\n\npycodestyle\n→ соблюдение части PEP 8\n\nBandit\n→ безопасность\n\npydocstyle\n→ docstring\n\nVulture\n→ мёртвый код\n\nMcCabe\n→ цикломатическая сложность\n```\n\nДля нового Python-backend чаще всего достаточно начать со связки:\n\n```text\nRuff + Pyright/mypy + pytest\n```\n\nи добавить Pylint или Bandit, когда их проверки действительно нужны проекту."
