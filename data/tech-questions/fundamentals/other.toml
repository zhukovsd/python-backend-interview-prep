  question = "Что такое reflection (Рефлексия) в программировании?"
  answer = "### Что такое рефлексия\n\n**Рефлексия (reflection)** — это способность программы во время выполнения:\n\n- исследовать собственную структуру;\n    \n- получать информацию о типах, классах, методах и полях;\n    \n- находить элементы по имени;\n    \n- в некоторых языках — динамически вызывать методы, создавать объекты и изменять структуру программы.\n    \n\nУпрощённо:\n\n```text\nобычный код:\nпрограмма работает с данными\n\nрефлексия:\nпрограмма работает с описанием самого кода\n```\n\nНапример, программа может спросить:\n\n```text\nКакого типа этот объект?\nКакие у него есть методы?\nЕсть ли у него атрибут \"username\"?\nКак вызвать метод, имя которого пришло строкой?\nКакие параметры принимает функция?\n```\n\n### Простой пример в Python\n\n```python\nclass User:\n    def __init__(self, username: str) -> None:\n        self.username = username\n\n    def greet(self) -> str:\n        return f\"Hello, {self.username}\"\n\n\nuser = User(\"alex\")\n```\n\nПолучение типа объекта:\n\n```python\nprint(type(user))\n```\n\nРезультат:\n\n```text\n<class '__main__.User'>\n```\n\nПроверка наличия атрибута:\n\n```python\nprint(hasattr(user, \"username\"))\nprint(hasattr(user, \"email\"))\n```\n\nПолучение значения по имени:\n\n```python\nusername = getattr(user, \"username\")\nprint(username)\n```\n\nДинамический вызов метода:\n\n```python\nmethod_name = \"greet\"\n\nmethod = getattr(user, method_name)\nresult = method()\n\nprint(result)\n```\n\nЗдесь имя метода известно только во время выполнения.\n\n### Основные средства рефлексии в Python\n\n#### `type()`\n\nВозвращает тип объекта:\n\n```python\nvalue = 42\n\nprint(type(value))\n```\n\n#### `isinstance()`\n\nПроверяет принадлежность типу:\n\n```python\nif isinstance(value, int):\n    print(\"Это целое число\")\n```\n\n#### `dir()`\n\nВозвращает имена доступных атрибутов:\n\n```python\nprint(dir(user))\n```\n\n#### `getattr()`\n\nПолучает атрибут по строковому имени:\n\n```python\nvalue = getattr(user, \"username\")\n```\n\nМожно указать значение по умолчанию:\n\n```python\nemail = getattr(user, \"email\", None)\n```\n\n#### `setattr()`\n\nУстанавливает атрибут по имени:\n\n```python\nsetattr(user, \"email\", \"alex@example.com\")\n```\n\nЭквивалентно:\n\n```python\nuser.email = \"alex@example.com\"\n```\n\n#### `hasattr()`\n\nПроверяет наличие атрибута:\n\n```python\nif hasattr(user, \"greet\"):\n    ...\n```\n\n#### `delattr()`\n\nУдаляет атрибут:\n\n```python\ndelattr(user, \"email\")\n```\n\n#### `__dict__`\n\nМногие объекты хранят свои атрибуты в словаре:\n\n```python\nprint(user.__dict__)\n```\n\nРезультат:\n\n```python\n{\n    \"username\": \"alex\"\n}\n```\n\nОднако не у всех объектов есть `__dict__`, например при использовании `__slots__`.\n\n### Инспекция функций\n\nМодуль `inspect` позволяет анализировать функции и классы.\n\n```python\nimport inspect\n\n\ndef create_user(\n    username: str,\n    active: bool = True,\n) -> dict:\n    return {\n        \"username\": username,\n        \"active\": active,\n    }\n\n\nsignature = inspect.signature(create_user)\n\nprint(signature)\n```\n\nРезультат:\n\n```text\n(username: str, active: bool = True) -> dict\n```\n\nМожно получить параметры:\n\n```python\nfor name, parameter in signature.parameters.items():\n    print(name, parameter.annotation, parameter.default)\n```\n\nИ аннотацию результата:\n\n```python\nprint(signature.return_annotation)\n```\n\n### Интроспекция и рефлексия\n\nЭти понятия часто используют как синонимы, но иногда различают.\n\n**Интроспекция** — исследование структуры программы:\n\n```text\nполучить тип\nнайти методы\nпрочитать аннотации\nизучить параметры функции\n```\n\n**Рефлексия** в более широком смысле включает ещё и воздействие:\n\n```text\nдинамически вызвать метод\nсоздать объект\nизменить атрибут\nзарегистрировать обработчик\nсгенерировать новый класс\n```\n\nТо есть:\n\n```text\nинтроспекция:\nпосмотреть\n\nрефлексия:\nпосмотреть и использовать полученную информацию\n```\n\nНо строгая граница зависит от языка и терминологии конкретного сообщества.\n\n### Пример динамического диспетчера\n\nДопустим, имя операции приходит из запроса:\n\n```python\nclass Calculator:\n    def add(self, a: int, b: int) -> int:\n        return a + b\n\n    def multiply(self, a: int, b: int) -> int:\n        return a * b\n```\n\nМожно выбрать метод динамически:\n\n```python\ncalculator = Calculator()\n\noperation_name = \"multiply\"\n\noperation = getattr(calculator, operation_name)\nresult = operation(4, 5)\n\nprint(result)\n```\n\nРезультат:\n\n```text\n20\n```\n\nНо напрямую передавать пользовательский ввод в `getattr()` опасно. Следует использовать whitelist:\n\n```python\nallowed_operations = {\n    \"add\": calculator.add,\n    \"multiply\": calculator.multiply,\n}\n\noperation = allowed_operations.get(operation_name)\n\nif operation is None:\n    raise ValueError(\"Unknown operation\")\n\nresult = operation(4, 5)\n```\n\nЭто безопаснее и понятнее.\n\n### Где используется рефлексия\n\n### 1. Dependency Injection\n\nFastAPI анализирует сигнатуру endpoint и зависимостей:\n\n```python\nfrom fastapi import Depends, FastAPI\n\napp = FastAPI()\n\n\ndef get_current_user() -> str:\n    return \"alex\"\n\n\n@app.get(\"/profile\")\ndef get_profile(\n    user: str = Depends(get_current_user),\n) -> dict:\n    return {\"username\": user}\n```\n\nФреймворк исследует:\n\n- параметры функции;\n    \n- аннотации типов;\n    \n- значения `Depends`;\n    \n- вложенные зависимости.\n    \n\nНа основе этого он строит граф зависимостей и вызывает нужные функции.\n\n### 2. Валидация и сериализация\n\nPydantic анализирует аннотации класса:\n\n```python\nfrom pydantic import BaseModel\n\n\nclass UserCreate(BaseModel):\n    username: str\n    age: int\n```\n\nПо этим данным библиотека понимает:\n\n```text\nкакие поля существуют\nкакие у них типы\nкакие значения допустимы\nкак сериализовать объект\n```\n\n### 3. ORM\n\nORM исследует объявление модели:\n\n```python\nclass User(Model):\n    id = fields.IntField(primary_key=True)\n    username = fields.CharField(max_length=100)\n```\n\nОна собирает метаданные:\n\n```text\nимя таблицы\nколонки\nтипы\nограничения\nсвязи\n```\n\nПосле этого строит SQL-запросы.\n\n### 4. Автоматическое тестирование\n\n`pytest` находит тестовые функции по имени и анализирует их параметры:\n\n```python\ndef test_create_user(client, database):\n    ...\n```\n\nПо именам `client` и `database` он находит соответствующие fixtures и передаёт их в функцию.\n\n### 5. Плагины\n\nПрограмма может динамически импортировать модуль и находить классы, соответствующие нужному интерфейсу.\n\n```python\nimport importlib\n\nmodule = importlib.import_module(\"plugins.payment\")\n\nplugin_class = getattr(module, \"PaymentPlugin\")\nplugin = plugin_class()\n```\n\nТак строятся расширяемые системы.\n\n### 6. Сериализация\n\nОбъект можно преобразовать в словарь на основе его полей:\n\n```python\ndef serialize_object(obj: object) -> dict:\n    return dict(vars(obj))\n```\n\n```python\nprint(serialize_object(user))\n```\n\nНо для сложных моделей лучше использовать специализированные библиотеки, потому что нужно учитывать вложенные объекты, даты, enum, циклические ссылки и приватные поля.\n\n### 7. Документация API\n\nFastAPI анализирует:\n\n```text\nмаршруты\nпараметры\nаннотации\nPydantic-модели\nтипы ответов\n```\n\nИ на основе этого генерирует OpenAPI-схему.\n\n### 8. Декораторы и метапрограммирование\n\nДекоратор может изучать функцию и менять её поведение:\n\n```python\nimport inspect\nfrom functools import wraps\n\n\ndef log_call(func):\n    signature = inspect.signature(func)\n\n    @wraps(func)\n    def wrapper(*args, **kwargs):\n        bound = signature.bind(*args, **kwargs)\n        print(f\"Calling {func.__name__}: {bound.arguments}\")\n        return func(*args, **kwargs)\n\n    return wrapper\n```\n\n### Рефлексия в статически типизированных языках\n\nВ Java рефлексия явно представлена API `java.lang.reflect`.\n\nУсловный пример:\n\n```java\nClass<?> clazz = User.class;\n\nMethod method = clazz.getMethod(\"getUsername\");\nObject result = method.invoke(user);\n```\n\nПрограмма может:\n\n- получить класс объекта;\n    \n- перечислить методы;\n    \n- исследовать поля;\n    \n- читать аннотации;\n    \n- вызвать метод;\n    \n- создать объект через конструктор.\n    \n\nВ C# используются:\n\n```text\nSystem.Type\nSystem.Reflection\nAttributes\nActivator\n```\n\nНапример:\n\n```csharp\nType type = typeof(User);\nMethodInfo method = type.GetMethod(\"GetUsername\");\nobject result = method.Invoke(user, null);\n```\n\nВ Rust и C++ полноценная runtime-рефлексия ограничена сильнее. Там чаще используют:\n\n- шаблоны;\n    \n- макросы;\n    \n- traits;\n    \n- кодогенерацию;\n    \n- compile-time reflection;\n    \n- RTTI в ограниченном виде.\n    \n\n### Рефлексия и метапрограммирование\n\n**Метапрограммирование** — более широкое понятие: программа создаёт, анализирует или изменяет другой код либо собственную структуру.\n\nРефлексия — один из способов метапрограммирования.\n\n```text\nМетапрограммирование\n├── runtime reflection\n├── декораторы\n├── метаклассы\n├── макросы\n├── шаблоны\n└── генерация кода\n```\n\nВ Python метакласс может изменять создание класса:\n\n```python\nclass ModelMeta(type):\n    def __new__(mcls, name, bases, namespace):\n        namespace[\"model_name\"] = name.lower()\n        return super().__new__(mcls, name, bases, namespace)\n\n\nclass User(metaclass=ModelMeta):\n    pass\n\n\nprint(User.model_name)\n```\n\n### Преимущества рефлексии\n\nОна позволяет создавать:\n\n- универсальные фреймворки;\n    \n- dependency injection;\n    \n- ORM;\n    \n- сериализаторы;\n    \n- системы плагинов;\n    \n- автоматическую документацию;\n    \n- тестовые фреймворки;\n    \n- динамические адаптеры.\n    \n\nБез неё разработчику пришлось бы вручную описывать множество метаданных:\n\n```python\nfields = {\n    \"username\": str,\n    \"age\": int,\n}\n```\n\nХотя эта информация уже существует в аннотациях класса.\n\n### Недостатки\n\n#### Потеря статической проверяемости\n\nТакой код:\n\n```python\nmethod = getattr(obj, method_name)\nmethod()\n```\n\nтруднее проверить статическим анализатором, потому что имя метода известно только во время исполнения.\n\nОшибка обнаружится поздно:\n\n```text\nAttributeError\n```\n\n#### Усложнение навигации\n\nIDE сложнее определить, где вызывается метод, если вызов выполняется по строке:\n\n```python\ngetattr(service, \"create_user\")()\n```\n\nПоиск usages может не показать этот вызов.\n\n#### Ошибки при переименовании\n\nЕсли метод переименован:\n\n```python\n\"create_user\"\n```\n\nстроковое имя может не обновиться автоматически.\n\n#### Производительность\n\nРефлексивный поиск и динамический вызов обычно дороже прямого вызова:\n\n```python\nobj.method()\n```\n\nпо сравнению с:\n\n```python\ngetattr(obj, \"method\")()\n```\n\nВ обычном backend-коде это редко главный bottleneck, но в горячих циклах может быть заметно.\n\n#### Нарушение инкапсуляции\n\nНекоторые языки позволяют через рефлексию обращаться к приватным полям или методам. Это делает код зависимым от внутренних деталей реализации.\n\n#### Риски безопасности\n\nОсобенно опасно использовать пользовательский ввод для выбора:\n\n- метода;\n    \n- класса;\n    \n- модуля;\n    \n- поля;\n    \n- импортируемого пути.\n    \n\nПлохо:\n\n```python\nmethod_name = request.json()[\"method\"]\nmethod = getattr(admin_service, method_name)\nreturn method()\n```\n\nПользователь может вызвать операцию, которая не предназначена для публичного доступа.\n\nБезопаснее:\n\n```python\nallowed_methods = {\n    \"get_profile\": admin_service.get_profile,\n    \"list_orders\": admin_service.list_orders,\n}\n```\n\n### Когда рефлексия оправдана\n\nОна полезна, когда создаётся инфраструктурный или универсальный механизм:\n\n```text\nфреймворк\nORM\nDI-контейнер\nserializer\nplugin system\ntest runner\ncode generator\n```\n\nВ обычной бизнес-логике часто проще и безопаснее прямой вызов:\n\n```python\nservice.create_user(data)\n```\n\nчем динамический:\n\n```python\ngetattr(service, action_name)(data)\n```\n\n### Итог\n\n```text\nРефлексия\n├── позволяет исследовать структуру программы во время выполнения\n├── получает типы, методы, поля и сигнатуры\n├── позволяет динамически вызывать и изменять элементы\n├── используется во фреймворках, ORM, DI и сериализации\n└── увеличивает динамичность ценой проверяемости и прозрачности\n```\n\nДля Python типичный набор средств рефлексии:\n\n```text\ntype\nisinstance\ndir\ngetattr\nsetattr\nhasattr\nvars\n__dict__\ninspect\nimportlib\n```\n\nПо сути, рефлексия позволяет программе воспринимать классы, методы и аннотации не только как исполняемый код, но и как данные, которые можно исследовать и использовать во время работы."
