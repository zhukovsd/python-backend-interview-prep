[[questions]]
  id = 27
  question = "Где хранятся DAG-и (схемы) в Airflow?"
  answer = "### Где физически хранятся DAG-и\n\nDAG-и в Airflow обычно хранятся как **Python-файлы**:\n\n```text\ndags/\n├── payments_pipeline.py\n├── daily_report.py\n└── cleanup.py\n```\n\nПуть к каталогу задаётся конфигурацией Airflow. В классической установке это параметр `dags_folder`, например:\n\n```ini\n[core]\ndags_folder = /opt/airflow/dags\n```\n\nAirflow периодически читает Python-файлы из этого источника, выполняет их и извлекает созданные объекты `DAG`. \n\n### Что хранится в Metadata Database\n\nПосле разбора Airflow сериализует структуру DAG в JSON-представление и сохраняет её в **Metadata Database**.\n\n```text\nPython-файл DAG\n→ DAG Processor\n→ разбор Python-кода\n→ сериализованная структура DAG\n→ Metadata Database\n```\n\nВ базе хранятся:\n\n- сериализованное представление DAG;\n    \n- версии DAG;\n    \n- состояния задач;\n    \n- `DAG Run`;\n    \n- `Task Instance`;\n    \n- расписания;\n    \n- история запусков;\n    \n- retry и служебные данные.\n    \n\nНо база данных не является основным хранилищем исходного Python-кода DAG. Источником определения остаётся файл или другой настроенный источник DAG. \n\n### Airflow 3: DAG Bundles\n\nВ Airflow 3 используется более общее понятие **DAG Bundle** — набор DAG-файлов и связанных ресурсов.\n\nИсточником bundle может быть:\n\n```text\nлокальная директория\nGit-репозиторий\nвнешняя система\nпользовательский источник\n```\n\nПо умолчанию используется локальная директория, но можно настроить несколько bundle и получать DAG-и, например, из Git.\n\n### В Docker\n\nЧасто каталог с DAG подключают как volume:\n\n```yaml\nservices:\n  airflow-dag-processor:\n    volumes:\n      - ./dags:/opt/airflow/dags\n```\n\nСтруктура проекта:\n\n```text\nproject/\n├── dags/\n│   ├── payments.py\n│   └── reports.py\n├── plugins/\n├── logs/\n└── docker-compose.yml\n```\n\nВ production DAG-и часто доставляются через:\n\n```text\nGit repository\n→ CI/CD\n→ общий volume / контейнерный образ / DAG Bundle\n→ Airflow DAG Processor\n```\n\n### В распределённой установке\n\nКомпоненты, которым необходимо исполнить конкретную версию DAG, должны иметь доступ к соответствующим файлам или bundle:\n\n```text\nDAG Processor\n→ читает и разбирает DAG\n\nMetadata DB\n→ хранит сериализованную структуру и состояние\n\nWorkers\n→ получают доступ к нужной версии DAG-кода для выполнения задачи\n```\n\nПоэтому в Kubernetes или Celery-инсталляции DAG-и доставляют через:\n\n- общий сетевой volume;\n    \n- синхронизацию с Git;\n    \n- включение DAG-файлов в Docker-образ;\n    \n- DAG Bundles.\n    \n\n### Итог\n\n```text\nИсходный DAG:\n→ Python-файл в dags_folder или DAG Bundle\n\nРазобранная структура DAG:\n→ Metadata Database\n\nСостояния и история выполнения:\n→ Metadata Database\n\nЛоги задач:\n→ файлы, object storage или система логирования\n```\n\nТо есть DAG в Airflow одновременно существует в двух формах: **исходный Python-код хранится в каталоге или bundle, а сериализованное представление и состояние выполнения — в Metadata Database**."
  popularity = 2.63

[[questions]]
  id = 28
  question = "Какие шаблонизаторы вы использовали?"
  answer = "### Что такое шаблонизатор\n\nШаблонизатор берёт текстовый шаблон и данные, после чего формирует готовый документ:\n\n```text\nШаблон + контекст → готовый HTML / XML / текст / конфигурация\n```\n\nНапример:\n\n```html\n<h1>Здравствуйте, {{ username }}</h1>\n```\n\nПри контексте:\n\n```python\n{\"username\": \"Alex\"}\n```\n\nполучится:\n\n```html\n<h1>Здравствуйте, Alex</h1>\n```\n\nВ Python чаще всего используются следующие шаблонизаторы.\n\n### Jinja\n\n**Jinja** — наиболее универсальный и часто применяемый Python-шаблонизатор. Он может генерировать не только HTML, но и XML, CSV, LaTeX, конфигурационные файлы и любой другой текстовый формат. Поддерживает наследование шаблонов, включения, макросы, фильтры, автоматическое экранирование HTML и асинхронный рендеринг. \n\nПример:\n\n```html\n<!-- templates/users.html -->\n\n{% extends \"base.html\" %}\n\n{% block content %}\n    <h1>Пользователи</h1>\n\n    <ul>\n        {% for user in users %}\n            <li>{{ user.username }}</li>\n        {% else %}\n            <li>Пользователей нет</li>\n        {% endfor %}\n    </ul>\n{% endblock %}\n```\n\nPython:\n\n```python\nfrom jinja2 import Environment, FileSystemLoader, select_autoescape\n\nenvironment = Environment(\n    loader=FileSystemLoader(\"templates\"),\n    autoescape=select_autoescape([\"html\", \"xml\"]),\n)\n\ntemplate = environment.get_template(\"users.html\")\n\nhtml = template.render(\n    users=[\n        {\"username\": \"alex\"},\n        {\"username\": \"maria\"},\n    ],\n)\n```\n\nИспользуется с:\n\n```text\nFastAPI\nFlask\nStarlette\nDjango при отдельной настройке\nCLI-утилитами\nгенераторами конфигураций\nemail-шаблонами\n```\n\nДля FastAPI и Flask обычно выбирают именно Jinja.\n\n### Django Template Language\n\n**Django Template Language**, или DTL, — встроенный шаблонизатор Django.\n\nОн предоставляет переменные, фильтры, теги, комментарии, наследование шаблонов, автоматическое HTML-экранирование и расширение через собственные теги и фильтры. Его синтаксис специально ограничивает количество сложной программной логики в представлении. \n\nПример:\n\n```html\n{% extends \"base.html\" %}\n\n{% block content %}\n    <h1>{{ title }}</h1>\n\n    {% for user in users %}\n        <p>{{ user.username|upper }}</p>\n    {% empty %}\n        <p>Пользователей нет</p>\n    {% endfor %}\n{% endblock %}\n```\n\nВо view:\n\n```python\nfrom django.shortcuts import render\n\n\ndef users_page(request):\n    return render(\n        request,\n        \"users.html\",\n        {\n            \"title\": \"Пользователи\",\n            \"users\": users,\n        },\n    )\n```\n\nDTL обычно выбирают, когда приложение уже построено на Django, поскольку он тесно интегрирован с:\n\n```text\nDjango views\nформами\nлокализацией\nstatic files\nCSRF\ntemplate context processors\nDjango Admin\n```\n\n### Jinja и Django Templates\n\nСинтаксис похож:\n\n```html\n{{ variable }}\n\n{% if condition %}\n{% endif %}\n\n{% for item in items %}\n{% endfor %}\n```\n\nНо возможности различаются.\n\n|Характеристика|Jinja|Django Templates|\n|---|---|---|\n|Привязка к фреймворку|Независимый|Встроен в Django|\n|Выражения в шаблоне|Более гибкие|Намеренно ограниченные|\n|FastAPI/Flask|Часто используется|Обычно нет|\n|Django|Можно подключить|Используется по умолчанию|\n|Макросы|Есть|Обычно используются inclusion tags|\n|Генерация произвольного текста|Удобна|Главным образом web-представления|\n\nДля нового FastAPI-проекта обычно выбирают Jinja. Для стандартного Django-проекта чаще оставляют DTL.\n\n### Mako\n\n**Mako** — Python-шаблонизатор с более свободным использованием Python-кода непосредственно внутри шаблона. Он может генерировать HTML, XML, email-текст и другие текстовые форматы. \n\nПример:\n\n```html\n<%\n    active_users = [\n        user for user in users\n        if user.active\n    ]\n%>\n\n<ul>\n% for user in active_users:\n    <li>${user.username}</li>\n% endfor\n</ul>\n```\n\nТакже поддерживает блоки и функции шаблонов:\n\n```html\n <%def name=\"render_user(user)\">\n    <li>${user.username}</li>\n </%def>\n\n <ul>\n % for user in users:\n    ${render_user(user)}\n % endfor\n </ul>\n```\n\nПреимущество Mako — гибкость. Недостаток — в шаблон легко перенести слишком много бизнес-логики:\n\n```text\nHTML + сложный Python-код\n→ труднее читать\n→ труднее тестировать\n→ сильнее смешиваются представление и логика\n```\n\nMako можно встретить в проектах на SQLAlchemy/Alembic, Pyramid и в системах генерации кода или конфигураций.\n\n### Chameleon\n\n**Chameleon** — шаблонизатор для HTML и XML, основанный на концепции Zope Page Templates. Управляющие конструкции обычно записываются в атрибутах HTML/XML, а шаблоны компилируются в Python bytecode. ([Chameleon](https://chameleon.readthedocs.io/en/latest/?utm_source=chatgpt.com \"Chameleon — Chameleon 4.4 documentation\"))\n\nПример:\n\n```html\n<ul>\n    <li tal:repeat=\"user users\">\n        ${user.username}\n    </li>\n</ul>\n```\n\nУсловие:\n\n```html\n<p tal:condition=\"user.is_active\">\n    Активный пользователь\n</p>\n```\n\nВ отличие от Jinja, исходный шаблон Chameleon старается оставаться похожим на обычный валидный HTML/XML-документ.\n\nОн чаще встречается в экосистемах:\n\n```text\nPyramid\nZope\nPlone\n```\n\nChameleon также имеет интеграции с другими Python-фреймворками. ([Chameleon](https://chameleon.readthedocs.io/en/latest/integration.html?utm_source=chatgpt.com \"Integration — Chameleon 4.4 documentation\"))\n\n### Mustache-подобные шаблонизаторы\n\nMustache — семейство минималистичных «logic-less» шаблонизаторов.\n\nОбщий синтаксис:\n\n```html\n<h1>{{ title }}</h1>\n\n{{#users}}\n    <p>{{ username }}</p>\n{{/users}}\n\n{{^users}}\n    <p>Пользователей нет</p>\n{{/users}}\n```\n\nИдея состоит в том, что шаблон почти не содержит вычислительной логики. Данные должны быть подготовлены заранее приложением.\n\nВ Python существуют реализации вроде:\n\n```text\nPystache\nChevron\n```\n\nТакой подход полезен, когда одни и те же шаблоны или одинаковый синтаксис должны использоваться в разных языках программирования.\n\n### Шаблонизаторы на frontend\n\nВ JavaScript-экосистеме часто встречаются:\n\n|Инструмент|Основное применение|\n|---|---|\n|Handlebars|HTML-шаблоны с ограниченной логикой|\n|Mustache|Минималистичные межъязыковые шаблоны|\n|EJS|HTML со вставками JavaScript|\n|Pug|HTML через сокращённый синтаксис с отступами|\n|Nunjucks|Синтаксис, похожий на Jinja|\n\nНо в современных React, Vue и Svelte отдельный классический шаблонизатор часто не требуется: шаблонизация встроена в сам frontend-фреймворк.\n\n### Что выбрать в Python\n\n```text\nFastAPI / Starlette / Flask\n→ Jinja\n\nDjango\n→ Django Template Language\n\nГенерация сложного текста или кода\n→ Jinja или Mako\n\nPyramid / Zope / Plone\n→ Chameleon или Jinja\n\nМаксимально простой межъязыковой синтаксис\n→ Mustache-совместимый движок\n```\n\n### Практический выбор\n\nДля большинства Python-backend проектов достаточно знать два основных варианта:\n\n```text\nJinja\n→ универсальный независимый шаблонизатор\n\nDjango Templates\n→ стандартный шаблонизатор экосистемы Django\n```\n\nMako стоит выбирать, когда действительно нужна возможность использовать больше Python-логики в шаблонах. Chameleon в основном актуален для проектов, связанных с Pyramid, Zope или Plone."
  popularity = 2.63

[[questions]]
  id = 29
  question = "Что такое AJAX?"
  answer = "### Что такое AJAX\n\n**AJAX** — подход, при котором браузер обменивается данными с сервером **без полной перезагрузки страницы**.\n\nРасшифровывается как:\n\n```text\nAsynchronous JavaScript and XML\n```\n\nНо сейчас вместо XML чаще передают JSON.\n\n```text\nJavaScript в браузере\n→ отправляет HTTP-запрос\n→ сервер возвращает данные\n→ JavaScript обновляет часть страницы\n```\n\n### Пример без AJAX\n\nПользователь нажимает кнопку «Следующая страница»:\n\n```text\nбраузер отправляет запрос\n→ сервер формирует новую HTML-страницу\n→ браузер полностью перезагружает документ\n```\n\n### Пример с AJAX\n\nПользователь нажимает «Загрузить ещё»:\n\n```text\nJavaScript отправляет запрос\n→ сервер возвращает новые записи в JSON\n→ JavaScript добавляет их в существующую страницу\n```\n\nОстальная часть страницы не перезагружается.\n\n### Как это выглядит\n\nFrontend:\n\n```javascript\nasync function loadUser(userId) {\n    const response = await fetch(`/api/users/${userId}`);\n\n    if (!response.ok) {\n        throw new Error(`HTTP error: ${response.status}`);\n    }\n\n    const user = await response.json();\n\n    document.querySelector(\"#username\").textContent = user.username;\n}\n```\n\nBackend возвращает:\n\n```json\n{\n  \"id\": 42,\n  \"username\": \"alex\"\n}\n```\n\nПосле этого JavaScript изменяет нужный элемент страницы:\n\n```html\n<span id=\"username\">alex</span>\n```\n\n### Чем отправляют AJAX-запросы\n\nИсторически использовался объект:\n\n```javascript\nXMLHttpRequest\n```\n\nСовременный вариант:\n\n```javascript\nfetch()\n```\n\nТакже применяются библиотеки:\n\n```text\nAxios\njQuery.ajax()\n```\n\nПример через `fetch`:\n\n```javascript\nconst response = await fetch(\"/api/payments\", {\n    method: \"POST\",\n    headers: {\n        \"Content-Type\": \"application/json\",\n    },\n    body: JSON.stringify({\n        account_id: 42,\n        amount: 100,\n    }),\n});\n\nconst payment = await response.json();\n```\n\n### Почему AJAX называется асинхронным\n\nЗапрос выполняется не блокируя всю страницу.\n\nПока сервер обрабатывает запрос, пользователь может:\n\n- прокручивать страницу;\n    \n- нажимать другие кнопки;\n    \n- заполнять форму;\n    \n- взаимодействовать с интерфейсом.\n    \n\nКогда ответ приходит, JavaScript обрабатывает его.\n\n```javascript\nconsole.log(\"До запроса\");\n\nfetch(\"/api/users\")\n    .then(response => response.json())\n    .then(users => console.log(users));\n\nconsole.log(\"После запуска запроса\");\n```\n\nСначала обычно будет выведено:\n\n```text\nДо запроса\nПосле запуска запроса\n```\n\nА результат HTTP-запроса появится позже.\n\n### Где применяется AJAX\n\n```text\nПоиск с подсказками\nБесконечная прокрутка\nФильтрация каталога\nОтправка формы без перезагрузки\nЧат\nУведомления\nДобавление товара в корзину\nЛайки и комментарии\nОбновление таблицы\nПагинация\n```\n\nНапример, при вводе текста в поиск:\n\n```text\n\"pyt\"\n→ запрос к серверу\n→ [\"python\", \"pytest\", \"pytorch\"]\n→ отображение подсказок\n```\n\n### AJAX — это не отдельный протокол\n\nAJAX не заменяет HTTP и не является библиотекой.\n\nЭто сочетание технологий:\n\n```text\nJavaScript\nHTTP\nFetch или XMLHttpRequest\nJSON / XML / HTML / text\nDOM\n```\n\nТо есть AJAX описывает способ взаимодействия браузера с backend.\n\n### Какие данные можно получать\n\nСервер может вернуть:\n\n```text\nJSON\nHTML-фрагмент\nXML\nобычный текст\nфайл\nBlob\n```\n\nЧаще всего API возвращает JSON:\n\n```javascript\nconst response = await fetch(\"/api/users\");\nconst users = await response.json();\n```\n\nНо можно получить и HTML:\n\n```javascript\nconst response = await fetch(\"/users/table\");\nconst html = await response.text();\n\ndocument.querySelector(\"#users\").innerHTML = html;\n```\n\n### AJAX и REST API\n\nAJAX — способ отправить запрос из браузера.\n\nREST API — подход к проектированию HTTP-интерфейса.\n\nОни часто используются вместе:\n\n```text\nFrontend\n→ AJAX-запрос\n→ REST API\n→ JSON-ответ\n```\n\nНапример:\n\n```http\nGET /api/users/42\n```\n\nОтвет:\n\n```json\n{\n  \"id\": 42,\n  \"username\": \"alex\"\n}\n```\n\n### AJAX и WebSocket\n\nAJAX работает по модели запрос-ответ:\n\n```text\nклиент отправил запрос\n→ сервер ответил\n```\n\nWebSocket создаёт постоянное двустороннее соединение:\n\n```text\nклиент ⇄ сервер\n```\n\nAJAX подходит для:\n\n- загрузки данных;\n    \n- отправки форм;\n    \n- периодических обновлений.\n    \n\nWebSocket лучше подходит для:\n\n- чатов;\n    \n- игровых событий;\n    \n- биржевых котировок;\n    \n- моментальных уведомлений.\n    \n\n### AJAX и polling\n\nЧтобы регулярно проверять новые данные, браузер может отправлять AJAX-запросы по таймеру:\n\n```javascript\nsetInterval(async () => {\n    const response = await fetch(\"/api/notifications\");\n    const notifications = await response.json();\n\n    renderNotifications(notifications);\n}, 5000);\n```\n\nЭто называется polling:\n\n```text\nкаждые 5 секунд\n→ есть ли новые данные?\n```\n\nНедостаток — запросы отправляются даже тогда, когда новых данных нет.\n\nДля более оперативной доставки могут использоваться:\n\n```text\nWebSocket\nServer-Sent Events\nlong polling\n```\n\n### Обработка ошибок\n\nAJAX-запрос может завершиться:\n\n- HTTP-ошибкой;\n    \n- сетевой ошибкой;\n    \n- таймаутом;\n    \n- некорректным JSON;\n    \n- отменой запроса.\n    \n\n```javascript\nasync function loadPayments() {\n    try {\n        const response = await fetch(\"/api/payments\");\n\n        if (!response.ok) {\n            throw new Error(`Server returned ${response.status}`);\n        }\n\n        return await response.json();\n    } catch (error) {\n        console.error(\"Could not load payments\", error);\n    }\n}\n```\n\nВажно: `fetch()` обычно не выбрасывает исключение только из-за ответа `404` или `500`. Поэтому нужно проверять:\n\n```javascript\nresponse.ok\n```\n\n### Безопасность\n\nAJAX-запросы подчиняются обычным правилам веб-безопасности.\n\nНужно учитывать:\n\n```text\nCORS\nCSRF\nXSS\nаутентификацию\nавторизацию\nвалидацию входных данных\n```\n\nНапример, браузер может автоматически отправлять cookies. Поэтому запрос, изменяющий данные, может требовать CSRF-защиту.\n\nПри токене в заголовке:\n\n```javascript\nfetch(\"/api/profile\", {\n    headers: {\n        Authorization: `Bearer ${accessToken}`,\n    },\n});\n```\n\nBackend всё равно обязан проверять права пользователя. Скрытая кнопка на frontend не является защитой.\n\n### Итог\n\n```text\nAJAX\n→ способ выполнять HTTP-запросы из JavaScript\n  без полной перезагрузки страницы\n```\n\nТипичная схема:\n\n```text\nДействие пользователя\n→ JavaScript\n→ fetch()\n→ backend API\n→ JSON\n→ обновление части DOM\n```\n\nНазвание сохранилось исторически, но современный AJAX чаще означает **асинхронные HTTP-запросы из браузера с использованием JavaScript и JSON**."
  popularity = 2.63

[[questions]]
  id = 30
  question = "Библиотеки httpx vs requests"
  answer = "### Основное различие\n\nОбе библиотеки используются для отправки HTTP-запросов из Python, и их базовый API похож:\n\n```python\nresponse = client.get(url)\nresponse = client.post(url, json=data)\nresponse.raise_for_status()\ndata = response.json()\n```\n\nНо `requests` ориентирован на **синхронную работу**, а HTTPX предоставляет и синхронный `Client`, и асинхронный `AsyncClient`. Кроме того, HTTPX поддерживает HTTP/1.1 и HTTP/2, тогда как основной сценарий Requests — синхронные HTTP/1.1-запросы. \n\n|Характеристика|Requests|HTTPX|\n|---|---|---|\n|Синхронный API|Да|Да|\n|Асинхронный API|Нет|`AsyncClient`|\n|HTTP/2|Нет|Да, включается отдельно|\n|Пул соединений|`requests.Session`|`httpx.Client` / `AsyncClient`|\n|Таймаут по умолчанию|Отсутствует|5 секунд сетевой неактивности|\n|ASGI/WSGI transport|Нет встроенного аналога|Есть|\n|Совместимость API|Исходный привычный API|Во многом похож на Requests|\n|Типичный сценарий|Скрипты и синхронные приложения|Async backend, конкурентные запросы|\n\n### Requests\n\nПример:\n\n```python\nimport requests\n\n\ndef get_user(user_id: int) -> dict:\n    with requests.Session() as client:\n        response = client.get(\n            f\"https://api.example.com/users/{user_id}\",\n            timeout=(3, 10),\n        )\n        response.raise_for_status()\n\n        return response.json()\n```\n\n`Session` сохраняет cookies и общую конфигурацию, а также использует пул соединений: несколько запросов к одному серверу могут повторно использовать существующее TCP-соединение. \n\nRequests удобен, когда:\n\n- приложение полностью синхронное;\n    \n- требуется простой HTTP-клиент;\n    \n- выполняется CLI-скрипт или периодическая задача;\n    \n- проект уже построен вокруг `requests.Session`;\n    \n- асинхронность и HTTP/2 не нужны.\n    \n\nГлавная опасность — отсутствие таймаута по умолчанию:\n\n```python\nrequests.get(\"https://api.example.com/users\")\n```\n\nТакой вызов может ожидать ответ неопределённо долго. Поэтому таймаут нужно указывать явно:\n\n```python\nrequests.get(\n    \"https://api.example.com/users\",\n    timeout=(3, 10),\n)\n```\n\nЗдесь первое число относится к установлению соединения, второе — к чтению ответа. HTTPX, в отличие от Requests, устанавливает таймауты по умолчанию. \n\n### HTTPX в синхронном режиме\n\nHTTPX можно использовать почти так же:\n\n```python\nimport httpx\n\n\ndef get_user(user_id: int) -> dict:\n    timeout = httpx.Timeout(\n        timeout=10,\n        connect=3,\n    )\n\n    with httpx.Client(\n        base_url=\"https://api.example.com\",\n        timeout=timeout,\n    ) as client:\n        response = client.get(f\"/users/{user_id}\")\n        response.raise_for_status()\n\n        return response.json()\n```\n\nАналогом `requests.Session` является `httpx.Client`. Он предоставляет пул соединений, сохранение cookies и общую конфигурацию запросов. Документация HTTPX рекомендует использовать клиент для всего, что сложнее одноразового экспериментального запроса.\n\n### HTTPX в асинхронном режиме\n\nОсновное преимущество HTTPX проявляется в асинхронных приложениях:\n\n```python\nimport httpx\n\n\nasync def get_user(user_id: int) -> dict:\n    async with httpx.AsyncClient(\n        base_url=\"https://api.example.com\",\n        timeout=10,\n    ) as client:\n        response = await client.get(f\"/users/{user_id}\")\n        response.raise_for_status()\n\n        return response.json()\n```\n\n`AsyncClient` поддерживает `asyncio` и Trio. Пока клиент ожидает сетевой ответ, event loop может выполнять другие корутины. \n\nВ FastAPI не следует создавать новый `AsyncClient` внутри каждого запроса:\n\n```python\n@app.get(\"/users/{user_id}\")\nasync def get_user(user_id: int):\n    async with httpx.AsyncClient() as client:\n        ...\n```\n\nПри постоянном создании клиентов соединения не переиспользуются эффективно. Обычно один долгоживущий клиент создают при запуске приложения и закрывают при завершении:\n\n```python\nfrom contextlib import asynccontextmanager\n\nimport httpx\nfrom fastapi import FastAPI\n\n\n@asynccontextmanager\nasync def lifespan(app: FastAPI):\n    app.state.http_client = httpx.AsyncClient(\n        base_url=\"https://api.example.com\",\n        timeout=httpx.Timeout(10, connect=3),\n    )\n\n    try:\n        yield\n    finally:\n        await app.state.http_client.aclose()\n\n\napp = FastAPI(lifespan=lifespan)\n\n\n@app.get(\"/users/{user_id}\")\nasync def get_user(user_id: int):\n    response = await app.state.http_client.get(\n        f\"/users/{user_id}\"\n    )\n    response.raise_for_status()\n\n    return response.json()\n```\n\nПостоянный клиент использует connection pooling и повторно использует TCP-соединения. \n\n### Таймауты\n\nHTTPX по умолчанию выбрасывает исключение после пяти секунд **сетевой неактивности**. Это не обязательно общий лимит продолжительности всего запроса: если данные продолжают поступать, запрос может выполняться дольше. \n\nHTTPX разделяет четыре вида таймаутов:\n\n```python\ntimeout = httpx.Timeout(\n    connect=3,\n    read=10,\n    write=10,\n    pool=2,\n)\n```\n\n```text\nconnect\n→ ожидание установки соединения\n\nread\n→ ожидание очередной части ответа\n\nwrite\n→ ожидание отправки очередной части запроса\n\npool\n→ ожидание свободного соединения из пула\n```\n\nRequests обычно использует `connect` и `read` через одно число или кортеж:\n\n```python\ntimeout=(3, 10)\n```\n\nHTTPX предоставляет более детальную настройку, включая ожидание записи и свободного соединения. \n\n### HTTP/2\n\nHTTPX поддерживает HTTP/2, но он не включён по умолчанию:\n\n```bash\npip install \"httpx[http2]\"\n```\n\n```python\nasync with httpx.AsyncClient(http2=True) as client:\n    response = await client.get(\"https://example.com\")\n```\n\nHTTP/2 позволяет нескольким конкурентным запросам использовать одно TCP-соединение через мультиплексирование. Фактическое соединение перейдёт на HTTP/2 только тогда, когда его поддерживает и сервер. \n\n### Тестирование ASGI-приложений\n\nHTTPX может обращаться непосредственно к ASGI-приложению без запуска реального HTTP-сервера:\n\n```python\nimport httpx\n\n\nasync def test_health(app):\n    transport = httpx.ASGITransport(app=app)\n\n    async with httpx.AsyncClient(\n        transport=transport,\n        base_url=\"http://testserver\",\n    ) as client:\n        response = await client.get(\"/health\")\n\n    assert response.status_code == 200\n```\n\nТакже существует `WSGITransport` для синхронных WSGI-приложений. Эти транспорты полезны для тестирования и подмены внешних сервисов. \n\n### Отличия API, о которых важно помнить\n\nHTTPX стремится быть совместимым с Requests, но полной совместимости нет. \n\n#### Редиректы\n\nRequests обычно следует редиректам автоматически, а HTTPX требует явно включить это поведение:\n\n```python\nclient = httpx.Client(\n    follow_redirects=True,\n)\n```\n\nили:\n\n```python\nresponse = httpx.get(\n    url,\n    follow_redirects=True,\n)\n```\n\n#### Потоковое чтение\n\nRequests:\n\n```python\nwith requests.get(url, stream=True) as response:\n    for chunk in response.iter_content(8192):\n        process(chunk)\n```\n\nHTTPX:\n\n```python\nwith httpx.stream(\"GET\", url) as response:\n    for chunk in response.iter_bytes():\n        process(chunk)\n```\n\nHTTPX выделяет streaming в отдельный контекстный интерфейс, чтобы соединение было явно закрыто. \n\n#### Тело запроса\n\nВ HTTPX разделены:\n\n```python\nhttpx.post(url, json={\"name\": \"Alex\"})   # JSON\nhttpx.post(url, data={\"name\": \"Alex\"})   # HTML-форма\nhttpx.post(url, content=b\"raw bytes\")    # сырые данные\n```\n\nДля сырых данных HTTPX предпочитает `content`, тогда как `data` предназначен для form data. \n\n### Что использовать\n\nДля синхронного скрипта:\n\n```text\nRequests\n```\n\nОн прост, привычен и отлично подходит для нескольких последовательных запросов.\n\nДля синхронного приложения также можно использовать HTTPX:\n\n```text\nhttpx.Client\n```\n\nОсобенно когда хочется единый API с асинхронной частью проекта, более детальные таймауты или возможность HTTP/2.\n\nДля FastAPI и другого асинхронного backend:\n\n```text\nhttpx.AsyncClient\n```\n\nПрямой вызов Requests внутри `async def` будет блокировать поток event loop на время сетевого запроса. Его пришлось бы выносить в thread pool, что обычно менее естественно, чем использование асинхронного HTTP-клиента.\n\n### Итог\n\n```text\nRequests\n→ простой зрелый синхронный HTTP-клиент\n→ подходит для скриптов и sync-приложений\n\nHTTPX\n→ синхронный и асинхронный API\n→ HTTP/2\n→ детальные таймауты\n→ ASGI/WSGI transports\n→ удобнее для FastAPI и конкурентных запросов\n```"
