  question = "Что такое Big On (Сложность) функции"
  answer = "### Что такое Big O\r\n\r\n**Big O** — это обозначение, которое показывает, как растут затраты функции или алгоритма при увеличении размера входных данных.\r\n\r\nОбычно оценивают:\r\n\r\n```text\r\nвремя выполнения\r\n→ временная сложность\r\n\r\nобъём дополнительной памяти\r\n→ пространственная сложность\r\n```\r\n\r\nBig O не показывает точное количество секунд или операций. Оно описывает **темп роста**.\r\n\r\n### Что означает `O(n)`\r\n\r\nЗапись:\r\n\r\n```text\r\nO(n)\r\n```\r\n\r\nчитается как «сложность порядка `n`».\r\n\r\nОна означает, что количество работы растёт примерно пропорционально размеру входа.\r\n\r\n```python\r\ndef calculate_sum(numbers: list[int]) -> int:\r\n    total = 0\r\n\r\n    for number in numbers:\r\n        total += number\r\n\r\n    return total\r\n```\r\n\r\nЗдесь `n` — количество элементов списка.\r\n\r\n```text\r\n10 элементов    → примерно 10 итераций\r\n100 элементов   → примерно 100 итераций\r\n1000 элементов  → примерно 1000 итераций\r\n```\r\n\r\nПоэтому временная сложность функции:\r\n\r\n```text\r\nO(n)\r\n```\r\n\r\n### Big O и `O(n)` — не одно и то же\r\n\r\n**Big O** — это общее название обозначения.\r\n\r\n**`O(n)`** — один конкретный класс сложности.\r\n\r\nДругие классы:\r\n\r\n| Сложность    | Характер роста          | Пример                              |\r\n| ------------ | ----------------------- | ----------------------------------- |\r\n| `O(1)`       | постоянный              | доступ к элементу списка по индексу |\r\n| `O(log n)`   | логарифмический         | бинарный поиск                      |\r\n| `O(n)`       | линейный                | полный обход списка                 |\r\n| `O(n log n)` | линейно-логарифмический | эффективная сортировка              |\r\n| `O(n²)`      | квадратичный            | два вложенных прохода               |\r\n| `O(2ⁿ)`      | экспоненциальный        | перебор всех подмножеств            |\r\n| `O(n!)`      | факториальный           | перебор всех перестановок           |\r\n\r\n### Почему отбрасываются константы\r\n\r\nДопустим, функция выполняет:\r\n\r\n```text\r\n3n + 10\r\n```\r\n\r\nопераций.\r\n\r\nПри больших значениях `n` главным остаётся линейный рост:\r\n\r\n```text\r\nO(3n + 10) = O(n)\r\n```\r\n\r\nАналогично:\r\n\r\n```text\r\nO(5n² + 100n + 20) = O(n²)\r\n```\r\n\r\nОставляют наиболее быстро растущий член, а коэффициенты и константы отбрасывают.\r\n\r\n### Примеры\r\n\r\nПостоянная сложность:\r\n\r\n```python\r\ndef get_first(numbers: list[int]) -> int:\r\n    return numbers[0]\r\n```\r\n\r\n```text\r\nO(1)\r\n```\r\n\r\nЛинейная:\r\n\r\n```python\r\ndef contains(numbers: list[int], target: int) -> bool:\r\n    for number in numbers:\r\n        if number == target:\r\n            return True\r\n\r\n    return False\r\n```\r\n\r\nХудший случай:\r\n\r\n```text\r\nO(n)\r\n```\r\n\r\nКвадратичная:\r\n\r\n```python\r\ndef print_pairs(numbers: list[int]) -> None:\r\n    for first in numbers:\r\n        for second in numbers:\r\n            print(first, second)\r\n```\r\n\r\n```text\r\nO(n × n) = O(n²)\r\n```\r\n\r\n### Что Big O не показывает\r\n\r\nДва алгоритма с `O(n)` могут сильно отличаться по реальной скорости:\r\n\r\n```python\r\nfor item in items:\r\n    total += item\r\n```\r\n\r\nи:\r\n\r\n```python\r\nfor item in items:\r\n    await send_http_request(item)\r\n```\r\n\r\nОба выполняют `n` итераций, но HTTP-запрос намного дороже сложения.\r\n\r\nBig O не учитывает напрямую:\r\n\r\n* скорость процессора;\r\n* сетевые задержки;\r\n* стоимость одной операции;\r\n* константные коэффициенты;\r\n* особенности языка;\r\n* кеш процессора;\r\n* нагрузку системы.\r\n\r\n### Итог\r\n\r\n```text\r\nBig O\r\n→ показывает характер роста затрат алгоритма\r\n\r\nO(n)\r\n→ затраты растут линейно с размером входа\r\n\r\nn\r\n→ размер входных данных\r\n```\r\n\r\nТаким образом, выражение «Big O функции» означает асимптотическую оценку того, как увеличивается время работы или потребление памяти функции при росте входных данных.\r"
  popularity = 5.26

[[questions]]
  id = 14
  question = "Что такое сериализация и десереализация?"
  answer = "### Что такое сериализация\n\n**Сериализация** — преобразование объекта или структуры данных в формат, который можно:\n\n- передать по сети;\n    \n- записать в файл;\n    \n- сохранить в кеш или БД;\n    \n- передать через брокер сообщений;\n    \n- восстановить позже.\n    \n\nНапример, в программе есть Python-словарь:\n\n```python\nuser = {\n    \"\"id\"\": 42,\n    \"\"username\"\": \"\"alex\"\",\n    \"\"active\"\": True,\n}\n```\n\nДля передачи через HTTP его можно сериализовать в JSON:\n\n```json\n{\n  \"\"id\"\": 42,\n  \"\"username\"\": \"\"alex\"\",\n  \"\"active\"\": true\n}\n```\n\nВ памяти программы это объект `dict`, а после сериализации — последовательность байтов или текстовое представление.\n\n```text\nPython-объект\n→ сериализация\n→ JSON / XML / MessagePack / Protobuf / байты\n```\n\n### Что такое десериализация\n\n**Десериализация** — обратное преобразование: из переданного или сохранённого формата создаётся объект, с которым может работать программа.\n\n```text\nJSON / XML / байты\n→ десериализация\n→ объект программы\n```\n\nНапример:\n\n```python\nimport json\n\nraw_data = '{\"\"id\"\": 42, \"\"username\"\": \"\"alex\"\", \"\"active\"\": true}'\n\nuser = json.loads(raw_data)\n\nprint(type(user))\nprint(user[\"\"username\"\"])\n```\n\nРезультат:\n\n```text\n<class 'dict'>\nalex\n```\n\n### Пример в Python\n\nСериализация:\n\n```python\nimport json\n\nuser = {\n    \"\"id\"\": 42,\n    \"\"username\"\": \"\"alex\"\",\n    \"\"active\"\": True,\n}\n\nserialized = json.dumps(user)\n\nprint(serialized)\nprint(type(serialized))\n```\n\nРезультат:\n\n```text\n{\"\"id\"\": 42, \"\"username\"\": \"\"alex\"\", \"\"active\"\": true}\n<class 'str'>\n```\n\nДесериализация:\n\n```python\ndeserialized = json.loads(serialized)\n\nprint(deserialized)\nprint(type(deserialized))\n```\n\nРезультат:\n\n```text\n{'id': 42, 'username': 'alex', 'active': True}\n<class 'dict'>\n```\n\n### `dump` и `load`\n\nДля файлов используются функции `dump()` и `load()`:\n\n```python\nimport json\n\nuser = {\n    \"\"id\"\": 42,\n    \"\"username\"\": \"\"alex\"\",\n}\n```\n\nЗапись:\n\n```python\nwith open(\"\"user.json\"\", \"\"w\"\", encoding=\"\"utf-8\"\") as file:\n    json.dump(user, file)\n```\n\nЧтение:\n\n```python\nwith open(\"\"user.json\"\", encoding=\"\"utf-8\"\") as file:\n    user = json.load(file)\n```\n\nРазница:\n\n```text\ndumps → сериализует в строку\nloads → десериализует из строки\n\ndump  → сериализует в файл\nload  → десериализует из файла\n```\n\n### Зачем это нужно в API\n\nHTTP не передаёт Python-объекты напрямую.\n\nНапример, backend работает с объектом:\n\n```python\nuser = User(\n    id=42,\n    username=\"\"alex\"\",\n)\n```\n\nПеред отправкой ответа объект преобразуется:\n\n```text\nUser\n→ dict\n→ JSON\n→ bytes\n→ HTTP response\n```\n\nНа стороне клиента происходит обратный процесс:\n\n```text\nHTTP response\n→ bytes\n→ JSON\n→ объект или структура данных клиента\n```\n\nПример ответа API:\n\n```http\nHTTP/1.1 200 OK\nContent-Type: application/json\n\n{\n  \"\"id\"\": 42,\n  \"\"username\"\": \"\"alex\"\"\n}\n```\n\n### Сериализация в FastAPI и Pydantic\n\nPydantic-модель:\n\n```python\nfrom pydantic import BaseModel\n\n\nclass UserResponse(BaseModel):\n    id: int\n    username: str\n    active: bool\n```\n\nСоздание объекта:\n\n```python\nuser = UserResponse(\n    id=42,\n    username=\"\"alex\"\",\n    active=True,\n)\n```\n\nПреобразование в словарь:\n\n```python\ndata = user.model_dump()\n```\n\nРезультат:\n\n```python\n{\n    \"\"id\"\": 42,\n    \"\"username\"\": \"\"alex\"\",\n    \"\"active\"\": True,\n}\n```\n\nПреобразование в JSON:\n\n```python\njson_data = user.model_dump_json()\n```\n\nПри получении запроса FastAPI выполняет обратную работу:\n\n```text\nJSON запроса\n→ десериализация\n→ валидация\n→ объект Pydantic\n```\n\nТо есть Pydantic занимается не только десериализацией, но и проверкой типов и ограничений.\n\n### Не все типы поддерживаются JSON\n\nJSON поддерживает ограниченный набор типов:\n\n```text\nобъект\nмассив\nстрока\nчисло\ntrue / false\nnull\n```\n\nНо в Python существуют:\n\n```text\ndatetime\ndate\nUUID\nDecimal\nset\nbytes\nEnum\nпользовательские классы\n```\n\nПоэтому их нужно преобразовывать.\n\nНапример:\n\n```python\nfrom datetime import datetime\n\ndata = {\n    \"\"created_at\"\": datetime.now(),\n}\n```\n\nОбычный `json.dumps()` выдаст ошибку:\n\n```text\nTypeError: Object of type datetime is not JSON serializable\n```\n\nМожно преобразовать дату вручную:\n\n```python\ndata = {\n    \"\"created_at\"\": datetime.now().isoformat(),\n}\n```\n\nЛибо использовать сериализатор, который знает правила для `datetime`, например Pydantic.\n\n### Текстовые и бинарные форматы\n\n#### JSON\n\n```text\nтекстовый\nчитаемый человеком\nшироко используется в HTTP API\n```\n\nПример:\n\n```json\n{\n  \"\"id\"\": 42,\n  \"\"active\"\": true\n}\n```\n\n#### XML\n\n```text\nтекстовый\nподдерживает сложную структуру и схемы\nчасто встречается в SOAP и старых интеграциях\n```\n\n#### CSV\n\n```text\nтекстовый табличный формат\nподходит для строк и колонок\nнеудобен для вложенных структур\n```\n\n#### MessagePack\n\n```text\nбинарный\nкомпактнее JSON\nбыстро сериализуется\n```\n\n#### Protocol Buffers\n\n```text\nбинарный\nиспользует заранее определённую схему\nкомпактный и строго типизированный\nчасто применяется с gRPC\n```\n\n#### Avro\n\nЧасто используется в системах обработки данных и брокерах сообщений, особенно когда важна эволюция схем.\n\n### Сериализация и кодирование\n\nЭти понятия связаны, но не полностью одинаковы.\n\n```text\nСериализация:\nобъект → формат данных\n\nКодирование:\nпредставление данных в определённой форме\n```\n\nНапример:\n\n```text\nPython dict\n→ JSON-сериализация\n→ строка Unicode\n→ UTF-8-кодирование\n→ bytes\n```\n\nКод:\n\n```python\nimport json\n\ndata = {\"\"username\"\": \"\"Алекс\"\"}\n\njson_string = json.dumps(data, ensure_ascii=False)\njson_bytes = json_string.encode(\"\"utf-8\"\")\n```\n\nОбратный процесс:\n\n```python\njson_string = json_bytes.decode(\"\"utf-8\"\")\ndata = json.loads(json_string)\n```\n\n### Сериализация не равна шифрованию\n\nСериализация не скрывает данные.\n\n```json\n{\n  \"\"password\"\": \"\"secret123\"\"\n}\n```\n\nЕсли это сериализовать в JSON, пароль останется читаемым.\n\n```text\nсериализация ≠ шифрование\nсериализация ≠ хеширование\nсериализация ≠ сжатие\n```\n\nЭто разные операции:\n\n```text\nСериализация\n→ преобразование структуры данных\n\nШифрование\n→ защита конфиденциальности\n\nХеширование\n→ получение необратимого отпечатка\n\nСжатие\n→ уменьшение размера\n```\n\nИх можно комбинировать:\n\n```text\nобъект\n→ сериализация\n→ сжатие\n→ шифрование\n→ передача\n```\n\n### Что происходит с классами\n\nДопустим, есть объект:\n\n```python\nclass User:\n    def __init__(self, user_id: int, username: str) -> None:\n        self.id = user_id\n        self.username = username\n```\n\n```python\nuser = User(42, \"\"alex\"\")\n```\n\nJSON не знает, что такое `User`. Поэтому объект сначала преобразуют в поддерживаемую структуру:\n\n```python\ndata = {\n    \"\"id\"\": user.id,\n    \"\"username\"\": user.username,\n}\n```\n\nПосле десериализации JSON получится словарь, а не объект `User`:\n\n```python\ndata = json.loads(serialized)\n\nuser = User(\n    user_id=data[\"\"id\"\"],\n    username=data[\"\"username\"\"],\n)\n```\n\nТо есть десериализация формата и создание доменного объекта могут быть отдельными этапами.\n\n### Безопасность десериализации\n\nДесериализация недоверенных данных может быть опасна.\n\nОсобенно это касается форматов, способных восстанавливать произвольные объекты.\n\nНапример, Python `pickle`:\n\n```python\nimport pickle\n\ndata = pickle.loads(untrusted_bytes)\n```\n\n`pickle` нельзя применять к данным от недоверенного пользователя, потому что при десериализации может выполниться вредоносный код.\n\nДля внешних API безопаснее использовать форматы данных:\n\n```text\nJSON\nMessagePack с контролем типов\nProtocol Buffers\n```\n\nНо даже JSON необходимо валидировать:\n\n- типы;\n    \n- обязательные поля;\n    \n- длины строк;\n    \n- диапазоны чисел;\n    \n- глубину вложенности;\n    \n- размер тела запроса.\n    \n\n### Схема данных\n\nСериализация отвечает на вопрос:\n\n```text\nКак представить данные?\n```\n\nСхема отвечает:\n\n```text\nКакие поля и типы допустимы?\n```\n\nНапример:\n\n```python\nclass PaymentRequest(BaseModel):\n    account_id: int\n    amount: int\n    currency: str\n```\n\nJSON:\n\n```json\n{\n  \"\"account_id\"\": 42,\n  \"\"amount\"\": 100,\n  \"\"currency\"\": \"\"AZN\"\"\n}\n```\n\nPydantic:\n\n1. десериализует JSON;\n    \n2. проверяет наличие полей;\n    \n3. проверяет типы;\n    \n4. создаёт объект `PaymentRequest`.\n    \n\n### Где применяется сериализация\n\n```text\nHTTP API\nWebSocket\nRabbitMQ и Kafka\nRedis\nфайлы конфигурации\nкеширование\nмежпроцессное взаимодействие\nхранение сессий\nлогирование\nRPC и gRPC\n```\n\nНапример, сообщение в RabbitMQ:\n\n```python\nmessage = {\n    \"\"event_id\"\": \"\"evt-1001\"\",\n    \"\"order_id\"\": 42,\n    \"\"status\"\": \"\"paid\"\",\n}\n```\n\nПеред отправкой:\n\n```python\nbody = json.dumps(message).encode(\"\"utf-8\"\")\n```\n\nConsumer получает байты:\n\n```python\nmessage = json.loads(body.decode(\"\"utf-8\"\"))\n```\n\n### Итог\n\n```text\nСериализация:\nобъект программы\n→ переносимый или сохраняемый формат\n\nДесериализация:\nпереносимый формат\n→ объект или структура программы\n```\n\nПример полного пути в API:\n\n```text\nPydantic-модель\n→ словарь\n→ JSON\n→ UTF-8 bytes\n→ HTTP\n→ UTF-8 строка\n→ JSON\n→ объект клиента\n```\n\nСериализация обеспечивает передачу и хранение данных, а десериализация позволяет программе снова восстановить их в удобной для обработки форме."
  popularity = 2.63

