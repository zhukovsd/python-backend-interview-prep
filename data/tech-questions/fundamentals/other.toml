  question = "Что такое API и какую роль он выполняет во взаимодействии между различными программными компонентами или системами?"
  answer = "### Что такое API\n\n**API (Application Programming Interface)** — это программный интерфейс, который определяет, **каким образом один программный компонент может обращаться к другому**.\n\nAPI описывает:\n\n- какие операции доступны;\n    \n- какие параметры нужно передать;\n    \n- в каком формате передаются данные;\n    \n- что будет возвращено;\n    \n- какие ошибки возможны;\n    \n- какие правила взаимодействия нужно соблюдать.\n    \n\nУпрощённо:\n\n```text\nКомпонент A\n    ↓ запрос по правилам API\nКомпонент B\n    ↓ результат или ошибка\nКомпонент A\n```\n\nAPI можно рассматривать как **контракт между поставщиком функциональности и её потребителем**.\n\n### Пример\n\nДопустим, есть сервис пользователей. Он предоставляет API:\n\n```http\nGET /users/42\n```\n\nОтвет:\n\n```json\n{\n  \"id\": 42,\n  \"username\": \"alex\"\n}\n```\n\nКлиенту не нужно знать:\n\n- в какой таблице хранится пользователь;\n    \n- используется PostgreSQL или MongoDB;\n    \n- как устроен код сервиса;\n    \n- применяется ли кеш Redis;\n    \n- на каком языке написан backend.\n    \n\nКлиенту достаточно знать контракт:\n\n```text\nGET /users/{id}\n→ возвращает данные пользователя\n```\n\n### API — это не обязательно HTTP\n\nAPI существует на разных уровнях.\n\n#### API функции\n\n```python\nresult = calculate_total(items)\n```\n\nКонтракт функции:\n\n```text\nвход:\nпоследовательность товаров\n\nвыход:\nобщая стоимость\n```\n\nВнутренняя реализация функции скрыта от вызывающего кода.\n\n#### API класса\n\n```python\nrepository.get_by_id(user_id)\nrepository.save(user)\n```\n\nДругой компонент взаимодействует с репозиторием через его публичные методы.\n\n#### API библиотеки\n\n```python\nimport requests\n\nresponse = requests.get(url)\n```\n\nБиблиотека предоставляет набор функций, классов и правил их использования.\n\n#### API операционной системы\n\nПрограмма обращается к ОС через системные API:\n\n```text\nоткрыть файл\nсоздать процесс\nоткрыть сокет\nвыделить память\n```\n\nНапример:\n\n```python\nfile = open(\"data.txt\")\n```\n\nВ конечном итоге runtime обращается к API операционной системы.\n\n#### Web API\n\nКомпоненты взаимодействуют через сеть:\n\n```text\nFrontend\n→ HTTP API\n→ Backend\n\nBackend\n→ HTTP API\n→ платёжный сервис\n\nМобильное приложение\n→ HTTP API\n→ сервер\n```\n\nИменно этот тип чаще всего подразумевают под словом API в веб-разработке.\n\n### Какую роль выполняет API\n\n### 1. Определяет контракт взаимодействия\n\nAPI задаёт, что может запросить клиент и что обязан вернуть сервер.\n\nНапример:\n\n```http\nPOST /payments\nContent-Type: application/json\n\n{\n  \"account_id\": 42,\n  \"amount\": 100\n}\n```\n\nКонтракт может определять:\n\n```text\nобязательные поля\nтипы данных\nправила валидации\nформат успешного ответа\nкоды ошибок\nтребования авторизации\n```\n\nКлиент и сервер могут разрабатываться независимо, пока оба соблюдают этот контракт.\n\n### 2. Скрывает внутреннюю реализацию\n\nКлиент вызывает:\n\n```python\nuser = await user_service.get_user(42)\n```\n\nНо не знает, что внутри происходит:\n\n```text\nпроверка Redis\n→ запрос PostgreSQL\n→ преобразование ORM-модели\n→ формирование ответа\n```\n\nAPI отделяет:\n\n```text\nчто компонент умеет делать\n```\n\nот:\n\n```text\nкак именно он это делает\n```\n\nБлагодаря этому внутреннюю реализацию можно менять без изменения клиентского кода.\n\nНапример:\n\n```text\nPostgreSQL → другая схема PostgreSQL\nлокальный расчёт → внешний сервис\nодин алгоритм → оптимизированный алгоритм\n```\n\nПубличный API при этом может остаться прежним.\n\n### 3. Уменьшает связанность компонентов\n\nБез API компонент может зависеть от внутренних деталей другого компонента:\n\n```text\nСервис заказов\n→ напрямую читает таблицы сервиса пользователей\n```\n\nТогда изменение схемы БД пользователей ломает сервис заказов.\n\nЧерез API:\n\n```text\nСервис заказов\n→ GET /users/42\n→ сервис пользователей\n```\n\nСервис заказов зависит от стабильного контракта, а не от внутренней структуры чужой системы.\n\nНо сетевой API также создаёт новые сложности:\n\n- сетевые ошибки;\n    \n- задержки;\n    \n- тайм-ауты;\n    \n- частичную недоступность;\n    \n- необходимость версионирования;\n    \n- распределённые транзакции.\n    \n\nПоэтому API уменьшает логическую связанность, но сетевое разделение не является бесплатным.\n\n### 4. Ограничивает доступ\n\nAPI предоставляет только разрешённые операции.\n\nНапример, клиент может:\n\n```text\nполучить профиль\nизменить имя\nзагрузить аватар\n```\n\nНо не может:\n\n```text\nпроизвольно выполнить SQL\nпрочитать пароль\nизменить чужой баланс\nполучить доступ к внутренней памяти сервиса\n```\n\nAPI выступает контролируемой границей, на которой выполняются:\n\n- аутентификация;\n    \n- авторизация;\n    \n- валидация;\n    \n- ограничение частоты запросов;\n    \n- аудит;\n    \n- фильтрация данных.\n    \n\n### 5. Обеспечивает повторное использование\n\nОдно API могут использовать разные клиенты:\n\n```text\nWeb-приложение ─────┐\nМобильное приложение ├→ API → Backend\nАдминистративная панель ┤\nДругой сервис ──────┘\n```\n\nБизнес-логика не дублируется в каждом клиенте.\n\nНапример, операция создания платежа реализуется на сервере один раз, а вызывается:\n\n- браузером;\n    \n- мобильным приложением;\n    \n- внутренним сервисом;\n    \n- административной системой.\n    \n\n### 6. Позволяет независимо развивать системы\n\nFrontend и backend могут разрабатываться разными командами.\n\n```text\nКоманда frontend\n→ реализует клиент API\n\nКоманда backend\n→ реализует сервер API\n```\n\nПока контракт согласован, frontend может использовать mock-сервер, а backend — автоматические тесты контракта.\n\nАналогично в микросервисной системе:\n\n```text\nOrder Service\nPayment Service\nNotification Service\nUser Service\n```\n\nКаждый сервис развивается отдельно и предоставляет API другим компонентам.\n\n### Из чего состоит Web API\n\nОбычно контракт Web API включает несколько элементов.\n\n#### Адрес ресурса\n\n```http\n/users/42\n```\n\n#### HTTP-метод\n\n```text\nGET    → получить\nPOST   → создать или запустить операцию\nPUT    → установить состояние ресурса\nPATCH  → частично изменить\nDELETE → удалить\n```\n\n#### Заголовки\n\n```http\nAuthorization: Bearer <token>\nContent-Type: application/json\nIdempotency-Key: <key>\n```\n\n#### Тело запроса\n\n```json\n{\n  \"username\": \"alex\",\n  \"email\": \"alex@example.com\"\n}\n```\n\n#### Статус ответа\n\n```text\n200 OK\n201 Created\n400 Bad Request\n401 Unauthorized\n403 Forbidden\n404 Not Found\n409 Conflict\n500 Internal Server Error\n```\n\n#### Тело ответа\n\n```json\n{\n  \"id\": 42,\n  \"username\": \"alex\"\n}\n```\n\n### Внутреннее и внешнее API\n\n#### Публичное API\n\nДоступно внешним клиентам или партнёрам:\n\n```text\nAPI платёжного провайдера\nAPI облачного хранилища\nAPI карт\n```\n\nОно требует:\n\n- стабильности;\n    \n- документации;\n    \n- версионирования;\n    \n- строгой безопасности;\n    \n- ограничений запросов.\n    \n\n#### Внутреннее API\n\nИспользуется внутри компании или приложения:\n\n```text\nOrder Service → Payment Service\n```\n\nОно может быть недоступно из интернета, но всё равно нуждается в ясном контракте.\n\n#### Приватное API компонента\n\nНапример, методы класса или функции модуля:\n\n```python\nclass UserService:\n    async def create(self, data: UserCreate) -> User:\n        ...\n```\n\nЭто тоже API, хотя взаимодействие происходит внутри одного процесса.\n\n### API и реализация\n\nРассмотрим интерфейс:\n\n```python\nclass PaymentGateway(Protocol):\n    async def charge(\n        self,\n        payment_id: str,\n        amount: int,\n    ) -> PaymentResult:\n        ...\n```\n\nБизнес-код зависит от API:\n\n```python\nresult = await gateway.charge(\n    payment_id=payment_id,\n    amount=amount,\n)\n```\n\nРеализация может быть разной:\n\n```text\nStripePaymentGateway\nTestPaymentGateway\nInternalBankGateway\n```\n\nПотребителю не требуется знать внутренний HTTP-запрос или протокол конкретного провайдера.\n\n### API и протокол — не одно и то же\n\n**API** определяет доступные операции и правила их использования.\n\n**Протокол** определяет технические правила передачи сообщений.\n\nНапример:\n\n```text\nAPI:\nGET /users/42 возвращает пользователя\n\nПротокол:\nHTTP передаёт запрос и ответ по сети\n```\n\nОдин и тот же API теоретически можно реализовать через разные протоколы, хотя это потребует изменения технического контракта клиента.\n\n### API и пользовательский интерфейс\n\nНе следует путать:\n\n```text\nUI  → интерфейс для человека\nAPI → интерфейс для программы\n```\n\nПример UI:\n\n```text\nкнопка «Создать заказ»\n```\n\nПосле нажатия frontend вызывает API:\n\n```http\nPOST /orders\n```\n\nТо есть:\n\n```text\nПользователь\n→ UI\n→ клиентский код\n→ API\n→ backend\n```\n\n### Основные виды сетевых API\n\n#### REST API\n\nОперирует ресурсами и обычно использует HTTP:\n\n```http\nGET /users/42\nPOST /orders\nDELETE /files/10\n```\n\n#### RPC\n\nКлиент вызывает удалённую операцию:\n\n```text\ncreateUser()\ncalculatePrice()\nsendPayment()\n```\n\nПримеры подходов:\n\n```text\ngRPC\nJSON-RPC\nчасть HTTP API командного типа\n```\n\n#### GraphQL\n\nКлиент описывает, какие данные ему нужны:\n\n```graphql\nquery {\n  user(id: 42) {\n    username\n    orders {\n      id\n      status\n    }\n  }\n}\n```\n\n#### SOAP\n\nИспользует формализованные XML-сообщения и строгие контракты, часто описанные через WSDL.\n\n### Хороший API\n\nКачественный API обычно обладает следующими свойствами:\n\n```text\nпонятный контракт\nпредсказуемое поведение\nстабильные форматы данных\nоднозначная семантика операций\nкорректные коды ошибок\nавторизация\nидемпотентность критичных операций\nверсионирование\nдокументация\nнаблюдаемость\n```\n\nНапример, операция:\n\n```http\nPOST /orders/42/toggle-status\n```\n\nменее предсказуема и неидемпотентна.\n\nБолее явный вариант:\n\n```http\nPUT /orders/42/status\n\n{\n  \"status\": \"cancelled\"\n}\n```\n\nЗдесь клиент передаёт целевое состояние.\n\n### Итог\n\n```text\nAPI\n├── определяет доступные операции\n├── задаёт формат запросов и ответов\n├── выступает контрактом между компонентами\n├── скрывает внутреннюю реализацию\n├── уменьшает прямую связанность\n├── контролирует доступ\n├── позволяет повторно использовать функциональность\n└── обеспечивает независимую разработку систем\n```\n\nТо есть API — это **формально определённая граница взаимодействия**, через которую один компонент пользуется возможностями другого, не зная всех деталей его реализации."
