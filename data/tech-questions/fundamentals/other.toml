  question = "Отличия симметричного и ассиметричного шифрования"
  answer = "### Основное отличие\n\n**Симметричное шифрование** использует один общий секретный ключ для шифрования и расшифрования.\n\n```text\nДанные + секретный ключ\n→ шифротекст\n\nШифротекст + тот же ключ\n→ исходные данные\n```\n\n**Асимметричное шифрование** использует пару математически связанных ключей:\n\n```text\nпубличный ключ\nприватный ключ\n```\n\nДанные, зашифрованные публичным ключом, расшифровываются соответствующим приватным ключом.\n\n### Сравнение\n\n|Характеристика|Симметричное|Асимметричное|\n|---|---|---|\n|Количество ключей|Один общий ключ|Публичный и приватный ключи|\n|Секретность|Общий ключ должен быть секретным|Секретным является только приватный ключ|\n|Скорость|Высокая|Значительно медленнее|\n|Большие объёмы данных|Подходит|Обычно не используется напрямую|\n|Передача ключа|Нужно безопасно передать общий ключ|Публичный ключ можно распространять открыто|\n|Основное применение|Шифрование файлов, дисков, трафика|Обмен ключами, подписи, аутентификация|\n|Примеры|AES, ChaCha20|RSA, криптография на эллиптических кривых|\n\n### Симметричное шифрование\n\nАлиса и Боб заранее имеют общий секретный ключ:\n\n```text\nСекретный ключ: K\n```\n\nАлиса шифрует сообщение:\n\n```text\nencrypt(message, K) → ciphertext\n```\n\nБоб расшифровывает его тем же ключом:\n\n```text\ndecrypt(ciphertext, K) → message\n```\n\nПреимущества:\n\n- высокая скорость;\n    \n- подходит для больших файлов и сетевого трафика;\n    \n- сравнительно небольшая вычислительная нагрузка.\n    \n\nГлавная проблема — **безопасная передача общего ключа**.\n\nЕсли злоумышленник получит этот ключ, он сможет как расшифровывать данные, так и создавать собственные корректно зашифрованные сообщения.\n\n### Асимметричное шифрование\n\nПолучатель создаёт пару ключей:\n\n```text\nPublic key\n→ можно публиковать\n\nPrivate key\n→ должен оставаться секретным\n```\n\nБоб шифрует сообщение публичным ключом Алисы:\n\n```text\nencrypt(message, AlicePublicKey)\n→ ciphertext\n```\n\nРасшифровать его может только Алиса:\n\n```text\ndecrypt(ciphertext, AlicePrivateKey)\n→ message\n```\n\nПубличный ключ не позволяет практически вычислить приватный ключ при корректном современном алгоритме и достаточных параметрах.\n\nПреимущества:\n\n- не требуется заранее передавать общий секрет;\n    \n- публичный ключ можно открыто распространять;\n    \n- поддерживает цифровые подписи и аутентификацию.\n    \n\nНедостатки:\n\n- медленнее симметричного шифрования;\n    \n- требует больше вычислительных ресурсов;\n    \n- не подходит для прямого шифрования больших объёмов данных;\n    \n- подлинность публичного ключа всё равно необходимо проверять.\n    \n\n### Цифровая подпись\n\nАсимметричная криптография используется не только для шифрования.\n\nПри цифровой подписи направление применения ключей другое:\n\n```text\nВладелец подписывает приватным ключом\n→ остальные проверяют публичным ключом\n```\n\nПодпись подтверждает:\n\n- кто создал подпись;\n    \n- что данные не были изменены;\n    \n- что подписывающая сторона владела приватным ключом.\n    \n\n```text\nШифрование\n→ обеспечивает конфиденциальность\n\nЦифровая подпись\n→ обеспечивает подлинность и целостность\n```\n\n### Почему HTTPS использует оба подхода\n\nВ реальных системах применяется **гибридная криптография**:\n\n```text\n1. Асимметричная криптография\n   → аутентификация и согласование общего секрета\n\n2. Симметричная криптография\n   → шифрование основного трафика\n```\n\nУпрощённо для TLS:\n\n```text\nКлиент ↔ сервер\n→ безопасно согласовали сеансовые ключи\n→ дальше шифруют HTTP-трафик быстрым симметричным алгоритмом\n```\n\nАсимметричная часть решает проблему безопасного установления соединения, а симметричная обеспечивает высокую производительность.\n\n### Пример с файлом\n\nПредположим, нужно передать большой архив.\n\nНеэффективный подход:\n\n```text\nЗашифровать весь архив RSA\n```\n\nПрактический подход:\n\n```text\n1. Сгенерировать случайный AES-ключ\n2. Зашифровать архив через AES\n3. Защитить AES-ключ публичным ключом получателя\n4. Передать зашифрованный архив и защищённый ключ\n```\n\nПолучатель:\n\n```text\n1. Расшифровывает AES-ключ приватным ключом\n2. Расшифровывает архив полученным AES-ключом\n```\n\nТак сочетаются безопасность асимметричного подхода и скорость симметричного.\n\n### Что произойдёт при утечке ключей\n\nПри симметричном шифровании утечка общего ключа позволяет расшифровать защищённые им данные.\n\nПри асимметричном:\n\n```text\nУтечка публичного ключа\n→ нормальна, он предназначен для распространения\n\nУтечка приватного ключа\n→ критическая компрометация\n```\n\nКомпрометация приватного ключа может позволить злоумышленнику:\n\n- расшифровывать предназначенные владельцу данные;\n    \n- выдавать себя за владельца;\n    \n- создавать действительные цифровые подписи.\n    \n\nКонкретные последствия зависят от назначения ключа и используемого протокола.\n\n### Важный нюанс про эллиптические кривые\n\nКриптографию на эллиптических кривых часто относят к асимметричной криптографии, но она нередко используется не для непосредственного шифрования данных, а для:\n\n```text\nобмена ключами\n→ ECDH\n\nцифровой подписи\n→ ECDSA, EdDSA\n```\n\nПосле согласования общего секрета данные обычно шифруются симметричным алгоритмом.\n\n### Итог\n\n```text\nСимметричное шифрование:\nодин общий секретный ключ\nбыстрое\nподходит для больших данных\nсложно безопасно передать ключ\n\nАсимметричное шифрование:\nпубличный и приватный ключи\nмедленнее\nпозволяет не передавать приватный ключ\nиспользуется для обмена ключами, подписи и аутентификации\n```\n\nНа практике эти подходы не конкурируют, а дополняют друг друга: **асимметричная криптография устанавливает доверие и защищает обмен ключами, а симметричная шифрует основной объём данных**."
