  question = "Какие библиотеки используют для работы с API"
  answer = "### Сначала нужно разделить две задачи\n\nПод «работой с API» могут иметь в виду:\n\n```text\n1. Вызывать чужое API\n   → HTTP-клиент\n\n2. Создавать собственное API\n   → web-фреймворк\n\n3. Тестировать и документировать API\n   → тестовые клиенты, OpenAPI-инструменты\n```\n\n### Для вызова API из Python\n\n#### `requests`\n\nПопулярная синхронная HTTP-библиотека:\n\n```python\nimport requests\n\nresponse = requests.get(\n    \"https://api.example.com/users/42\",\n    timeout=5,\n)\n\nresponse.raise_for_status()\nuser = response.json()\n```\n\nПодходит для:\n\n- обычных скриптов;\n    \n- синхронных приложений;\n    \n- небольшого числа последовательных запросов;\n    \n- CLI и интеграций.\n    \n\n`requests` предоставляет методы `get`, `post`, `put`, `patch`, `delete`, сессии, cookies, заголовки, авторизацию и работу с тайм-аутами. \n\nНедостаток для async-backend: обычный вызов `requests` блокирует поток.\n\n#### `httpx`\n\nСовременный HTTP-клиент с синхронным и асинхронным API:\n\n```python\nimport httpx\n\n\nasync def get_user(user_id: int) -> dict:\n    async with httpx.AsyncClient(\n        base_url=\"https://api.example.com\",\n        timeout=5,\n    ) as client:\n        response = await client.get(f\"/users/{user_id}\")\n        response.raise_for_status()\n        return response.json()\n```\n\nПодходит для:\n\n- FastAPI и другого асинхронного кода;\n    \n- параллельных HTTP-запросов;\n    \n- HTTP/1.1 и HTTP/2;\n    \n- тестирования ASGI-приложений.\n    \n\nHTTPX официально предоставляет как `Client`, так и `AsyncClient`; для повторного использования соединений клиент рекомендуется держать дольше одного запроса, а не создавать в каждой итерации. ([Httpx](https://www.python-httpx.org/async/?utm_source=chatgpt.com \"Async Support - HTTPX\"))\n\nДля современного FastAPI-backend это обычно основной выбор.\n\n#### `aiohttp`\n\nАсинхронная библиотека, которая содержит и HTTP-клиент, и серверную часть:\n\n```python\nimport aiohttp\n\n\nasync def get_user(user_id: int) -> dict:\n    timeout = aiohttp.ClientTimeout(total=5)\n\n    async with aiohttp.ClientSession(\n        base_url=\"https://api.example.com\",\n        timeout=timeout,\n    ) as session:\n        async with session.get(f\"/users/{user_id}\") as response:\n            response.raise_for_status()\n            return await response.json()\n```\n\nПодходит для:\n\n- большого количества конкурентных соединений;\n    \n- потокового чтения и загрузки данных;\n    \n- WebSocket;\n    \n- проектов, уже построенных вокруг `aiohttp`.\n    \n\n`aiohttp` официально позиционируется как асинхронный HTTP client/server для `asyncio`. \n\n#### `urllib.request`\n\nВходит в стандартную библиотеку Python:\n\n```python\nfrom urllib.request import urlopen\n\nwith urlopen(\n    \"https://api.example.com/users/42\",\n    timeout=5,\n) as response:\n    data = response.read()\n```\n\nНе требует установки пакетов, но API менее удобен для современной прикладной разработки. Обычно его используют в небольших скриптах или там, где запрещены внешние зависимости.\n\n### Быстрое сравнение HTTP-клиентов\n\n|Библиотека|Sync|Async|Когда применять|\n|---|--:|--:|---|\n|`requests`|Да|Нет|Синхронные скрипты и приложения|\n|`httpx`|Да|Да|FastAPI, современные sync/async-проекты|\n|`aiohttp`|Нет|Да|Высокая async-конкурентность, streaming, WebSocket|\n|`urllib`|Да|Нет|Без сторонних зависимостей|\n\n### Для создания API на Python\n\n#### `FastAPI`\n\nФреймворк для построения HTTP API с использованием аннотаций типов:\n\n```python\nfrom fastapi import FastAPI\n\napp = FastAPI()\n\n\n@app.get(\"/users/{user_id}\")\nasync def get_user(user_id: int) -> dict:\n    return {\n        \"id\": user_id,\n        \"username\": \"alex\",\n    }\n```\n\nFastAPI автоматически формирует OpenAPI-схему и интерактивную документацию, а валидация входных и выходных данных строится вокруг типизации и моделей данных. \n\nПодходит для:\n\n- REST API;\n    \n- асинхронных backend-сервисов;\n    \n- микросервисов;\n    \n- хорошо типизированных контрактов;\n    \n- автоматической документации.\n    \n\n#### Django REST Framework\n\nИспользуется для API поверх Django:\n\n```text\nDjango\n+ ORM\n+ authentication\n+ admin\n+ Django REST Framework\n```\n\nПодходит, когда проекту одновременно нужны:\n\n- Django ORM;\n    \n- административная панель;\n    \n- развитая система пользователей;\n    \n- permissions;\n    \n- serializers;\n    \n- ViewSet и router.\n    \n\n#### Flask\n\nМинималистичный web-фреймворк. Часто выбирается для небольших HTTP API, когда разработчик хочет самостоятельно подобрать валидацию, ORM, DI и остальные компоненты.\n\n#### `aiohttp.web`\n\nПомимо клиента, `aiohttp` позволяет создавать HTTP-серверы и приложения. \n\nИспользуется реже FastAPI для типичных REST API, но подходит для низкоуровневых асинхронных сервисов и проектов, уже использующих экосистему `aiohttp`.\n\n### Для WebSocket API\n\nЧасто применяют:\n\n```text\nFastAPI / Starlette WebSocket\naiohttp\nwebsockets\n```\n\nПример FastAPI:\n\n```python\nfrom fastapi import FastAPI, WebSocket\n\napp = FastAPI()\n\n\n@app.websocket(\"/ws\")\nasync def websocket_endpoint(websocket: WebSocket) -> None:\n    await websocket.accept()\n\n    while True:\n        message = await websocket.receive_text()\n        await websocket.send_text(f\"Received: {message}\")\n```\n\n### Для GraphQL API\n\nНа Python используют, например:\n\n```text\nStrawberry\nAriadne\nGraphene\n```\n\nFastAPI не реализует GraphQL самостоятельно, но позволяет подключать сторонние GraphQL-библиотеки.\n\n### Для gRPC\n\nДля взаимодействия через Protocol Buffers и RPC используют:\n\n```text\ngrpcio\ngrpcio-tools\nprotobuf\n```\n\nТакой вариант подходит для внутреннего взаимодействия сервисов, когда важны:\n\n- строгий контракт;\n    \n- генерация клиентов;\n    \n- бинарная сериализация;\n    \n- streaming;\n    \n- высокая производительность.\n    \n\nЭто уже не обычный REST/JSON API.\n\n### Для авторизации\n\nК HTTP-клиентам обычно добавляют инструменты для конкретной схемы:\n\n```text\nOAuth 2.0 / OpenID Connect\nJWT\nBasic Auth\nAPI Key\n```\n\nДля `requests` существуют интеграции вроде `requests-oauthlib`; сам Requests также поддерживает базовые механизмы аутентификации. \n\nНо часто Bearer-токен передают обычным заголовком:\n\n```python\nheaders = {\n    \"Authorization\": f\"Bearer {access_token}\",\n}\n\nresponse = httpx.get(\n    \"https://api.example.com/profile\",\n    headers=headers,\n)\n```\n\n### Для повторных запросов и устойчивости\n\nВ production обычно требуются:\n\n```text\ntimeouts\nretry с backoff\nconnection pooling\nлимиты соединений\nпроверка HTTP-статусов\ncircuit breaker\n```\n\nПример с HTTPX:\n\n```python\nimport httpx\n\ntimeout = httpx.Timeout(\n    connect=2,\n    read=5,\n    write=5,\n    pool=2,\n)\n\nlimits = httpx.Limits(\n    max_connections=100,\n    max_keepalive_connections=20,\n)\n\nclient = httpx.AsyncClient(\n    timeout=timeout,\n    limits=limits,\n)\n```\n\nВажно: библиотеки обычно не должны бездумно повторять любой `POST`. Retry безопаснее для идемпотентных операций либо при использовании `Idempotency-Key`.\n\n### Для тестирования API\n\n#### `httpx`\n\nУдобен для тестов FastAPI и ASGI-приложений:\n\n```python\nfrom httpx import ASGITransport, AsyncClient\n\ntransport = ASGITransport(app=app)\n\nasync with AsyncClient(\n    transport=transport,\n    base_url=\"http://test\",\n) as client:\n    response = await client.get(\"/users/42\")\n```\n\nHTTPX поддерживает специальный ASGI transport, позволяющий вызывать приложение напрямую без реального сетевого сервера. ([Httpx](https://www.python-httpx.org/advanced/transports/?utm_source=chatgpt.com \"Transports - HTTPX\"))\n\n#### `pytest`\n\nИспользуется как тестовый фреймворк:\n\n```python\ndef test_get_user(client):\n    response = client.get(\"/users/42\")\n\n    assert response.status_code == 200\n    assert response.json()[\"id\"] == 42\n```\n\n#### Postman и Insomnia\n\nЭто не Python-библиотеки, а отдельные инструменты для ручного выполнения и сохранения API-запросов.\n\n### Практический выбор для Python-backend\n\n```text\nСинхронный скрипт:\n→ requests или httpx.Client\n\nFastAPI вызывает внешнее API:\n→ httpx.AsyncClient\n\nМного streaming/WebSocket-соединений:\n→ aiohttp\n\nСоздание REST API:\n→ FastAPI\n\nБольшой Django-проект:\n→ Django REST Framework\n\nТестирование FastAPI:\n→ pytest + HTTPX\n\nВнутренний строго типизированный RPC:\n→ grpcio\n```"
