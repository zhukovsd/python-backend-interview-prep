  id = 15
  question = "С помощью каких инструментов проверяются аннотации типов"
  answer = "### Главное\n\nВ Python аннотации типов сами по себе обычно **не проверяются интерпретатором во время выполнения**:\n\n```python\ndef add(a: int, b: int) -> int:\n    return a + b\n\n\nresult = add(\"10\", \"20\")\nprint(result)  # \"1020\"\n```\n\nХотя функция ожидает `int`, Python разрешает передать строки. Проверку выполняют отдельные инструменты.\n\n### Статические анализаторы типов\n\nОни проверяют код **до запуска**, анализируя аннотации.\n\n#### `mypy`\n\nОдин из наиболее распространённых type checker:\n\n```python\ndef add(a: int, b: int) -> int:\n    return a + b\n\n\nresult = add(\"10\", \"20\")\n```\n\nПроверка:\n\n```bash\nmypy app.py\n```\n\nСообщит примерно:\n\n```text\nArgument 1 to \"add\" has incompatible type \"str\"; expected \"int\"\nArgument 2 to \"add\" has incompatible type \"str\"; expected \"int\"\n```\n\n#### `Pyright`\n\nСтатический анализатор типов, используемый также расширением Pylance в VS Code:\n\n```bash\npyright\n```\n\nОбычно отличается высокой скоростью и хорошей поддержкой современной системы типов Python.\n\n#### `BasedPyright`\n\nРасширенный вариант Pyright с более строгими проверками и дополнительными диагностическими правилами.\n\n#### `Pyre`\n\nСтатический анализатор типов для крупных Python-проектов.\n\n#### `pytype`\n\nАнализатор, который умеет не только проверять явно написанные аннотации, но и выводить некоторые типы из кода.\n\n### Проверка в IDE\n\nIDE обычно запускает собственный анализатор или интегрируется с внешним:\n\n```text\nVS Code\n→ Pylance / Pyright\n\nPyCharm\n→ встроенный анализатор типов\n\nNeovim\n→ Pyright через Language Server Protocol\n```\n\nIDE подчёркивает ошибку непосредственно в редакторе:\n\n```python\nuser_id: int = \"42\"\n```\n\nНо проверки IDE могут отличаться от результатов `mypy` или Pyright. Поэтому в проекте обычно выбирают один основной type checker и запускают его в CI.\n\n### Проверка во время выполнения\n\nСтатические анализаторы не влияют на выполнение программы. Для runtime-проверки используются другие инструменты.\n\n#### Pydantic\n\nPydantic проверяет данные при создании модели:\n\n```python\nfrom pydantic import BaseModel\n\n\nclass User(BaseModel):\n    id: int\n    username: str\n\n\nuser = User(\n    id=\"42\",\n    username=\"alex\",\n)\n\nprint(user.id)        # 42\nprint(type(user.id))  # int\n```\n\nPydantic может преобразовать строку `\"42\"` в `int`. В строгом режиме такое преобразование можно запретить.\n\nОн применяется прежде всего для:\n\n- входных данных API;\n    \n- конфигурации;\n    \n- сериализации;\n    \n- валидации структур данных.\n    \n\nPydantic не является полной заменой `mypy` или Pyright: он валидирует конкретные значения во время выполнения, а статический анализатор проверяет связи типов во всём коде.\n\n#### `typeguard`\n\nПроверяет аргументы и возвращаемые значения функций во время выполнения:\n\n```python\nfrom typeguard import typechecked\n\n\n@typechecked\ndef add(a: int, b: int) -> int:\n    return a + b\n\n\nadd(\"10\", \"20\")  # ошибка типов во время выполнения\n```\n\n#### `beartype`\n\nТакже добавляет runtime-проверку аннотаций:\n\n```python\nfrom beartype import beartype\n\n\n@beartype\ndef add(a: int, b: int) -> int:\n    return a + b\n```\n\n### `isinstance()` для ручной проверки\n\nМожно проверять типы вручную:\n\n```python\ndef calculate_total(amount: int) -> int:\n    if not isinstance(amount, int):\n        raise TypeError(\"amount must be int\")\n\n    return amount * 2\n```\n\nНо это не проверка аннотаций как таковых. Это обычная runtime-логика, которую разработчик написал самостоятельно.\n\nКроме того, `isinstance()` не работает напрямую со многими параметризованными типами:\n\n```python\nisinstance([1, 2], list[int])  # TypeError\n```\n\nМожно проверить только сам контейнер:\n\n```python\nisinstance([1, 2], list)\n```\n\nПроверку типов элементов придётся реализовать отдельно или использовать специализированную библиотеку.\n\n### Линтеры и type checker — не одно и то же\n\n`Ruff`, `Flake8` и `Pylint` преимущественно проверяют:\n\n- стиль;\n    \n- потенциальные ошибки;\n    \n- неиспользуемые импорты;\n    \n- подозрительные конструкции;\n    \n- соблюдение правил проекта.\n    \n\nНапример:\n\n```python\nunused_variable = 10\n```\n\nType checker проверяет совместимость типов:\n\n```python\nuser_id: int = \"42\"\n```\n\nНекоторые линтеры имеют отдельные правила, связанные с аннотациями, но обычно они не выполняют полноценный анализ типов вместо `mypy` или Pyright.\n\n### Типичная конфигурация проекта\n\nДля FastAPI-проекта часто используют:\n\n```text\nRuff\n→ стиль, импорты и потенциальные ошибки\n\nmypy или Pyright\n→ статическая проверка типов\n\nPydantic\n→ runtime-валидация входных и выходных данных\n\npytest\n→ проверка фактического поведения\n```\n\nНапример:\n\n```python\nfrom pydantic import BaseModel\n\n\nclass PaymentRequest(BaseModel):\n    account_id: int\n    amount: int\n\n\ndef calculate_commission(payment: PaymentRequest) -> int:\n    return payment.amount // 100\n```\n\nЗдесь:\n\n```text\nPydantic\n→ проверит данные, из которых создаётся PaymentRequest\n\nmypy / Pyright\n→ проверит использование PaymentRequest в коде\n\npytest\n→ проверит, правильно ли рассчитывается комиссия\n```\n\n### Что выбрать\n\n```text\nДля большинства Python-проектов:\n→ mypy или Pyright\n\nДля VS Code:\n→ Pylance, основанный на Pyright\n\nДля проверки API-данных:\n→ Pydantic\n\nДля runtime-проверки обычных функций:\n→ typeguard или beartype\n\nДля стиля и общих ошибок:\n→ Ruff\n```\n\n### Итог\n\n```text\nАннотации Python\n→ сами по себе обычно не запрещают передавать неправильные значения\n\nСтатическая проверка:\n→ mypy, Pyright, Pyre, pytype\n\nRuntime-проверка:\n→ Pydantic, typeguard, beartype, ручной isinstance\n\nПроверка в редакторе:\n→ Pylance, PyCharm и другие IDE\n```\n\nНа практике основной контроль типов обычно обеспечивает связка **Pyright или mypy + IDE + проверка в CI**, а Pydantic используется на границах системы для проверки реальных входных данных."
  popularity = 2.63

[[questions]]
  id = 16
  question = "Какие возможности появились в OpenAPI 3.0?"
  answer = "### Что изменилось в OpenAPI 3.0\n\nOpenAPI 3.0 существенно переработал формат OpenAPI 2.0, ранее называвшийся Swagger 2.0. Основные улучшения связаны с описанием тел запросов, форматов данных, серверов, авторизации и асинхронных callback-вызовов.\n\n### 1. Объект `requestBody`\n\nВ OpenAPI 2.0 тело запроса описывалось как параметр:\n\n```yaml\nparameters:\n  - in: body\n    name: user\n    schema:\n      $ref: \"#/definitions/User\"\n```\n\nВ OpenAPI 3.0 для тела появился отдельный объект `requestBody`:\n\n```yaml\nrequestBody:\n  required: true\n  content:\n    application/json:\n      schema:\n        $ref: \"#/components/schemas/User\"\n```\n\nТело запроса теперь явно отделено от path-, query-, header- и cookie-параметров. `body` и `formData` из OpenAPI 2.0 были заменены на `requestBody`.\n\n### 2. Несколько форматов тела запроса\n\nВ OpenAPI 2.0 использовался общий список:\n\n```yaml\nconsumes:\n  - application/json\n  - application/xml\n```\n\nВ OpenAPI 3.0 форматы указываются через `content`, и каждому формату можно назначить отдельную схему:\n\n```yaml\nrequestBody:\n  content:\n    application/json:\n      schema:\n        $ref: \"#/components/schemas/UserJson\"\n\n    application/xml:\n      schema:\n        $ref: \"#/components/schemas/UserXml\"\n```\n\nТо есть один endpoint может принимать JSON, XML, форму или бинарные данные, причём их структуры могут различаться. \n\n### 3. Аналогичный `content` для ответов\n\nВ OpenAPI 2.0 тип ответа задавался через глобальный или операционный `produces`.\n\nВ OpenAPI 3.0 каждый HTTP-ответ может иметь собственный набор media types:\n\n```yaml\nresponses:\n  \"200\":\n    description: User information\n    content:\n      application/json:\n        schema:\n          $ref: \"#/components/schemas/User\"\n\n      application/xml:\n        schema:\n          $ref: \"#/components/schemas/UserXml\"\n```\n\nЭто позволяет точнее описывать разные представления одного ответа.\n\n### 4. Новый раздел `components`\n\nВ OpenAPI 2.0 переиспользуемые объекты были разбросаны по отдельным разделам:\n\n```text\ndefinitions\nparameters\nresponses\nsecurityDefinitions\n```\n\nВ OpenAPI 3.0 они объединены внутри `components`:\n\n```yaml\ncomponents:\n  schemas:\n  responses:\n  parameters:\n  examples:\n  requestBodies:\n  headers:\n  securitySchemes:\n  links:\n  callbacks:\n```\n\nОбъекты из `components` затем подключаются через `$ref`. \n\nНапример:\n\n```yaml\ncomponents:\n  schemas:\n    User:\n      type: object\n      properties:\n        id:\n          type: integer\n        username:\n          type: string\n```\n\nИспользование:\n\n```yaml\nschema:\n  $ref: \"#/components/schemas/User\"\n```\n\n### 5. Несколько серверов через `servers`\n\nВ OpenAPI 2.0 адрес API собирался из:\n\n```yaml\nschemes:\n  - https\nhost: api.example.com\nbasePath: /v1\n```\n\nВ OpenAPI 3.0 появился массив `servers`:\n\n```yaml\nservers:\n  - url: https://api.example.com/v1\n    description: Production\n\n  - url: https://staging.example.com/v1\n    description: Staging\n```\n\nМожно описывать несколько окружений и использовать переменные:\n\n```yaml\nservers:\n  - url: https://{environment}.example.com/{version}\n    variables:\n      environment:\n        default: api\n        enum:\n          - api\n          - staging\n      version:\n        default: v1\n```\n\nСерверы можно задавать глобально, для отдельного path или даже отдельной операции. \n\n### 6. `oneOf`, `anyOf` и `not`\n\nOpenAPI 3.0 расширил возможности составления схем.\n\n#### `oneOf`\n\nЗначение должно соответствовать ровно одному из вариантов:\n\n```yaml\nPet:\n  oneOf:\n    - $ref: \"#/components/schemas/Cat\"\n    - $ref: \"#/components/schemas/Dog\"\n```\n\n#### `anyOf`\n\nЗначение может соответствовать одному или нескольким вариантам:\n\n```yaml\nPaymentMethod:\n  anyOf:\n    - $ref: \"#/components/schemas/Card\"\n    - $ref: \"#/components/schemas/BankAccount\"\n```\n\n#### `not`\n\nЗначение не должно соответствовать указанной схеме:\n\n```yaml\nnot:\n  type: string\n```\n\nЭто позволило точнее моделировать альтернативные структуры данных и полиморфные модели. \n\n### 7. `nullable`\n\nПоявилась возможность явно разрешить `null`:\n\n```yaml\nmiddle_name:\n  type: string\n  nullable: true\n```\n\nБез `nullable: true` значение должно быть строкой, а не `null`.\n\nВажно: OpenAPI 3.0 использует собственный вариант схем, основанный на подмножестве JSON Schema, поэтому синтаксис отличается от полного JSON Schema. Более полная совместимость с JSON Schema появилась уже в OpenAPI 3.1. \n\n### 8. `readOnly` и `writeOnly`\n\nМожно отделять поля, передаваемые клиентом, от полей, возвращаемых сервером:\n\n```yaml\nUser:\n  type: object\n  properties:\n    id:\n      type: integer\n      readOnly: true\n\n    password:\n      type: string\n      writeOnly: true\n```\n\nСемантика:\n\n```text\nreadOnly\n→ поле присутствует в ответе,\n  но не должно требоваться в запросе\n\nwriteOnly\n→ поле принимается в запросе,\n  но не должно возвращаться в ответе\n```\n\nНапример, `id` формируется сервером, а пароль принимается при регистрации, но не возвращается клиенту.\n\n### 9. Улучшенное описание файлов\n\nВ OpenAPI 2.0 использовался отдельный тип `file`.\n\nВ OpenAPI 3.0 файл описывается как строка с бинарным форматом:\n\n```yaml\nrequestBody:\n  content:\n    application/octet-stream:\n      schema:\n        type: string\n        format: binary\n```\n\nЗагрузка через `multipart/form-data`:\n\n```yaml\nrequestBody:\n  content:\n    multipart/form-data:\n      schema:\n        type: object\n        properties:\n          avatar:\n            type: string\n            format: binary\n```\n\nМожно описать и массив файлов:\n\n```yaml\nfiles:\n  type: array\n  items:\n    type: string\n    format: binary\n```\n\nOpenAPI 3.0 также позволяет описывать сериализацию отдельных частей multipart-запроса через `encoding`. \n\n### 10. Параметры в cookies\n\nOpenAPI 3.0 позволяет описывать cookie-параметры:\n\n```yaml\nparameters:\n  - name: session_id\n    in: cookie\n    required: true\n    schema:\n      type: string\n```\n\nЭто отдельное расположение параметра наряду с:\n\n```text\npath\nquery\nheader\ncookie\n```\n\n### 11. Более гибкая сериализация параметров\n\nПоявились свойства `style` и `explode`, которые описывают преобразование массивов и объектов в URL, query string, headers и cookies.\n\nНапример:\n\n```yaml\nparameters:\n  - name: filters\n    in: query\n    style: deepObject\n    explode: true\n    schema:\n      type: object\n      properties:\n        status:\n          type: string\n        limit:\n          type: integer\n```\n\nТакой параметр может выглядеть примерно так:\n\n```text\n?filters[status]=active&filters[limit]=10\n```\n\nOpenAPI 3.0 поддерживает несколько стилей сериализации, включая `form`, `simple`, `matrix`, `label`, `spaceDelimited`, `pipeDelimited` и `deepObject`. \n\n### 12. Несколько примеров\n\nВ OpenAPI 2.0 обычно задавался один `example`.\n\nВ OpenAPI 3.0 можно описать несколько именованных примеров:\n\n```yaml\ncontent:\n  application/json:\n    schema:\n      $ref: \"#/components/schemas/User\"\n    examples:\n      activeUser:\n        summary: Active user\n        value:\n          id: 1\n          status: active\n\n      blockedUser:\n        summary: Blocked user\n        value:\n          id: 2\n          status: blocked\n```\n\nПримеры можно хранить в `components/examples`, ссылаться на внешние примеры и задавать отдельно для параметров, запросов и ответов.\n\n### 13. Callbacks\n\nOpenAPI 3.0 позволяет описывать запросы, которые сервер позже отправит клиенту.\n\nНапример, клиент создаёт подписку:\n\n```http\nPOST /subscriptions\n```\n\nи передаёт адрес callback:\n\n```json\n{\n  \"callback_url\": \"https://client.example.com/events\"\n}\n```\n\nСпецификация:\n\n```yaml\ncallbacks:\n  eventCallback:\n    \"{$request.body#/callback_url}\":\n      post:\n        requestBody:\n          content:\n            application/json:\n              schema:\n                $ref: \"#/components/schemas/Event\"\n        responses:\n          \"200\":\n            description: Callback accepted\n```\n\nRuntime-выражение:\n\n```text\n$request.body#/callback_url\n```\n\nизвлекает URL из исходного запроса.\n\nCallbacks предназначены для описания связанных с операцией исходящих вызовов API-провайдера — например, webhook-подобных уведомлений.\n\nВажно различать:\n\n```text\nOpenAPI 3.0\n→ callbacks внутри операции\n\nOpenAPI 3.1\n→ дополнительно появился верхнеуровневый webhooks\n```\n\n### 14. Links между операциями\n\nОбъект `links` позволяет описывать связь между ответом одной операции и вызовом другой.\n\nНапример:\n\n```yaml\nresponses:\n  \"201\":\n    description: User created\n    content:\n      application/json:\n        schema:\n          $ref: \"#/components/schemas/User\"\n    links:\n      GetCreatedUser:\n        operationId: getUser\n        parameters:\n          user_id: \"$response.body#/id\"\n```\n\nЗдесь значение `id` из ответа `POST /users` можно использовать для вызова:\n\n```http\nGET /users/{user_id}\n```\n\nLinks описывают не просто гиперссылку, а способ передать данные из одного вызова в следующий. \n\n### 15. Улучшенная авторизация\n\nOpenAPI 3.0 переработал описание security schemes.\n\nРаздел:\n\n```text\nsecurityDefinitions\n```\n\nбыл заменён на:\n\n```text\ncomponents.securitySchemes\n```\n\nПоявились и были улучшены:\n\n- общий тип `http`;\n    \n- Bearer-аутентификация;\n    \n- API key в cookies;\n    \n- OpenID Connect Discovery;\n    \n- несколько OAuth 2.0 flows в одной схеме;\n    \n- более корректные названия OAuth-потоков. \n    \n\nBearer JWT:\n\n```yaml\ncomponents:\n  securitySchemes:\n    bearerAuth:\n      type: http\n      scheme: bearer\n      bearerFormat: JWT\n```\n\nOpenID Connect:\n\n```yaml\ncomponents:\n  securitySchemes:\n    openId:\n      type: openIdConnect\n      openIdConnectUrl: https://example.com/.well-known/openid-configuration\n```\n\n### 16. Диапазоны кодов ответов\n\nМожно описывать сразу диапазон HTTP-статусов:\n\n```yaml\nresponses:\n  \"2XX\":\n    description: Successful response\n\n  \"4XX\":\n    description: Client error\n\n  \"5XX\":\n    description: Server error\n```\n\nКонкретный статус имеет приоритет над диапазоном:\n\n```yaml\nresponses:\n  \"200\":\n    description: Exact successful response\n\n  \"2XX\":\n    description: Other successful responses\n```\n\nТакие диапазоны поддерживаются как `1XX`, `2XX`, `3XX`, `4XX` и `5XX`. \n\n### Основные изменения в одной схеме\n\n```text\nOpenAPI 2.0                 OpenAPI 3.0\n\nhost/basePath/schemes   →   servers\ndefinitions             →   components.schemas\nsecurityDefinitions     →   components.securitySchemes\nbody/formData            →   requestBody\nconsumes/produces        →   content\nодна схема тела          →   схемы для разных media types\nfile                     →   string + binary\nограниченные модели      →   oneOf / anyOf / not\nодин example             →   именованные examples\nнет callbacks            →   callbacks\nнет links                →   links\nограниченная security    →   bearer, OIDC, OAuth flows\n```\n\n### Итог\n\nНаиболее значимые возможности OpenAPI 3.0:\n\n```text\nотдельный requestBody\nнесколько media types и схем для них\nцентрализованный components\nнесколько серверов и server variables\noneOf / anyOf / not\nnullable, readOnly и writeOnly\nулучшенная работа с multipart и файлами\ncookie-параметры\nstyle и explode\nнесколько примеров\ncallbacks\nlinks между операциями\nBearer и OpenID Connect\n```\n\nГлавное архитектурное изменение — OpenAPI 3.0 стал значительно точнее описывать **реальное содержимое HTTP-запросов и ответов**, а также отношения между операциями API."
  popularity = 2.63

