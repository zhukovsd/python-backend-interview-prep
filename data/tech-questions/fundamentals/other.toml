  question = "Какой ключ хранится в TLS/SSL-сертификате?"
  answer = "### Какой ключ находится в TLS-сертификате\n\nВ TLS/SSL-сертификате хранится **публичный ключ** сервера.\n\n```text\nTLS-сертификат:\n→ публичный ключ\n→ доменное имя\n→ данные владельца\n→ срок действия\n→ данные центра сертификации\n→ цифровая подпись CA\n```\n\nСоответствующий **приватный ключ** в сертификат не входит и должен храниться отдельно на сервере.\n\n```text\nСертификат — можно передавать клиентам\nПриватный ключ — нельзя раскрывать\n```\n\n### Как это работает\n\nУ сервера есть пара ключей:\n\n```text\nПубличный ключ\n→ находится в сертификате\n\nПриватный ключ\n→ хранится на сервере\n```\n\nКогда клиент подключается по HTTPS:\n\n1. Сервер отправляет сертификат клиенту.\n    \n2. Клиент извлекает публичный ключ.\n    \n3. Проверяет подпись центра сертификации, домен и срок действия.\n    \n4. Сервер доказывает владение соответствующим приватным ключом.\n    \n5. Стороны согласовывают симметричные сеансовые ключи.\n    \n6. Дальнейший трафик шифруется симметрично.\n    \n\n### Что делает публичный ключ в современном TLS\n\nВ TLS 1.3 публичный ключ сертификата обычно используется для **проверки цифровой подписи сервера**.\n\nСервер подписывает часть TLS-handshake приватным ключом:\n\n```text\nданные handshake\n→ подпись приватным ключом сервера\n```\n\nКлиент проверяет подпись публичным ключом из сертификата:\n\n```text\nподпись + публичный ключ\n→ подтверждение подлинности сервера\n```\n\nСам HTTP-трафик публичным ключом сертификата не шифруется. Для трафика создаются временные симметричные ключи.\n\n### Как было в старых версиях TLS\n\nВ старых наборах шифров с RSA key exchange клиент мог шифровать общий секрет публичным RSA-ключом из сертификата.\n\n```text\npremaster secret\n→ шифрование публичным RSA-ключом\n→ расшифрование приватным ключом сервера\n```\n\nВ TLS 1.3 такой механизм удалён. Современные соединения обычно используют временный обмен ключами ECDHE, обеспечивающий forward secrecy.\n\n### Сертификат и приватный ключ в файлах\n\nТипичная конфигурация сервера:\n\n```text\ncertificate.pem\n→ сертификат с публичным ключом\n\nprivate-key.pem\n→ приватный ключ\n```\n\nНапример, в Nginx:\n\n```nginx\nssl_certificate     /etc/ssl/certificate.pem;\nssl_certificate_key /etc/ssl/private-key.pem;\n```\n\nФайл сертификата можно передавать другим сторонам. Файл приватного ключа должен быть доступен только серверу.\n\n### Итог\n\n```text\nВ TLS/SSL-сертификате:\n→ публичный ключ\n\nОтдельно на сервере:\n→ приватный ключ\n```\n\nСертификат связывает публичный ключ с конкретным доменом, а приватный ключ позволяет серверу доказать, что сертификат действительно принадлежит ему."
  popularity = 2.63

[[questions]]
  id = 25
  question = "Какие метрики обычно собирают в backend-приложении?"
  answer = "### Основные группы метрик\n\nВ backend-приложении обычно собирают метрики нескольких уровней:\n\n```text\nHTTP / API\nбизнес-операции\nбаза данных\nкеш\nочереди и фоновые задачи\nвнешние сервисы\nпроцесс приложения\nинфраструктура\n```\n\nГлавное — собирать не всё подряд, а метрики, которые помогают отвечать на вопросы:\n\n```text\nСервис доступен?\nОн отвечает быстро?\nОшибок стало больше?\nГде возникло узкое место?\nБизнес-операции выполняются?\n```\n\n### HTTP-метрики\n\nДля API чаще всего используют модель RED:\n\n```text\nRate\n→ количество запросов\n\nErrors\n→ количество и доля ошибок\n\nDuration\n→ время обработки\n```\n\n#### Количество запросов\n\n```text\nhttp_requests_total\n```\n\nПолезные метки:\n\n```text\nmethod\nroute\nstatus\n```\n\nПример:\n\n```text\nhttp_requests_total{\n    method=\"POST\",\n    route=\"/payments\",\n    status=\"201\"\n}\n```\n\nВажно использовать шаблон маршрута:\n\n```text\n/payments/{payment_id}\n```\n\nа не фактический URL:\n\n```text\n/payments/817263\n```\n\nИначе появится слишком много временных рядов.\n\n#### Время ответа\n\n```text\nhttp_request_duration_seconds\n```\n\nОбычно используется `Histogram`, чтобы рассчитывать:\n\n```text\np50\np90\np95\np99\n```\n\nСреднее время ответа само по себе недостаточно. Например, среднее может быть 100 мс, хотя 1% запросов выполняются по 10 секунд.\n\n#### Активные запросы\n\n```text\nhttp_requests_in_progress\n```\n\nПоказывает, сколько запросов сейчас обрабатывается.\n\nРезкий рост может означать:\n\n- замедление БД;\n    \n- зависание внешнего API;\n    \n- нехватку worker-ов;\n    \n- исчерпание пула соединений.\n    \n\n#### Размер запросов и ответов\n\n```text\nhttp_request_size_bytes\nhttp_response_size_bytes\n```\n\nПолезно для endpoint-ов загрузки файлов, экспорта данных и больших JSON-ответов.\n\n### Метрики ошибок\n\nОбщий счётчик:\n\n```text\napplication_errors_total\n```\n\nМетки:\n\n```text\nerror_type\noperation\ncomponent\n```\n\nНапример:\n\n```text\napplication_errors_total{\n    error_type=\"TimeoutError\",\n    component=\"payment_provider\"\n}\n```\n\nНо нельзя помещать в метку полный текст исключения:\n\n```text\nerror_message=\"Connection failed for user 18372...\"\n```\n\nТексты ошибок имеют высокую кардинальность. Их лучше хранить в логах.\n\nПолезно отдельно считать:\n\n```text\nhttp_5xx_total\nvalidation_errors_total\ndatabase_errors_total\nexternal_service_errors_total\nunhandled_exceptions_total\n```\n\n### Бизнес-метрики\n\nТехнически сервис может быть здоров, но бизнес-операции перестали выполняться.\n\nНапример:\n\n```text\npayments_total\norders_created_total\nnotifications_sent_total\nregistrations_total\nfiles_uploaded_total\n```\n\nМетки должны описывать ограниченные категории:\n\n```text\nstatus=\"success|failed|rejected\"\nprovider=\"bank_a|bank_b\"\ntype=\"email|sms|push\"\n```\n\nПример:\n\n```text\npayments_total{\n    status=\"success\",\n    currency=\"AZN\"\n}\n```\n\nТакже полезны метрики длительности:\n\n```text\npayment_processing_duration_seconds\norder_processing_duration_seconds\nnotification_delivery_duration_seconds\n```\n\nИ текущего состояния:\n\n```text\npending_payments\nactive_subscriptions\nunprocessed_notifications\n```\n\nБизнес-метрики часто быстрее технических показывают реальную проблему:\n\n```text\nHTTP 200 продолжает возвращаться,\nно количество успешных платежей упало до нуля.\n```\n\n### Метрики базы данных\n\n#### Пул соединений\n\n```text\ndb_pool_connections_active\ndb_pool_connections_idle\ndb_pool_connections_max\ndb_pool_waiting_requests\n```\n\nЕсли активные соединения постоянно близки к максимуму, запросы начинают ждать свободное соединение.\n\n#### Длительность запросов\n\n```text\ndb_query_duration_seconds\n```\n\nПолезные метки:\n\n```text\noperation=\"select|insert|update|delete\"\ntable=\"payments\"\n```\n\nНе стоит помещать в метки полный SQL-запрос.\n\n#### Количество запросов\n\n```text\ndb_queries_total\ndb_query_errors_total\ndb_transactions_total\ndb_transaction_rollbacks_total\n```\n\n#### Прикладные признаки проблем\n\n```text\ndb_connection_timeouts_total\ndb_deadlocks_total\ndb_lock_wait_duration_seconds\n```\n\nЧасть таких метрик собирает приложение, часть — PostgreSQL exporter или сама СУБД.\n\n### Метрики Redis и кеша\n\nОсновные метрики кеша:\n\n```text\ncache_requests_total\ncache_hits_total\ncache_misses_total\ncache_errors_total\ncache_operation_duration_seconds\n```\n\nКлючевой показатель:\n\n```text\ncache_hit_ratio =\ncache_hits / (cache_hits + cache_misses)\n```\n\nДополнительно:\n\n```text\nredis_connections_active\nredis_memory_usage_bytes\nredis_evicted_keys_total\nredis_expired_keys_total\n```\n\nЕсли hit rate резко падает, нагрузка может перейти на базу данных.\n\n### Метрики очередей и брокеров\n\nДля RabbitMQ, Kafka, Celery и других систем важны:\n\n```text\nqueue_size\nmessages_published_total\nmessages_consumed_total\nmessages_failed_total\nmessages_retried_total\ndead_letter_messages_total\n```\n\nОсобенно важен возраст самого старого сообщения:\n\n```text\noldest_message_age_seconds\n```\n\nРазмер очереди может быть большим из-за обычного всплеска. Но если старое сообщение лежит часами, consumer явно не справляется.\n\nТакже собирают:\n\n```text\nmessage_processing_duration_seconds\nconsumer_lag\nactive_consumers\nunacknowledged_messages\n```\n\n### Метрики Celery-задач\n\n```text\ncelery_tasks_started_total\ncelery_tasks_succeeded_total\ncelery_tasks_failed_total\ncelery_tasks_retried_total\ncelery_task_duration_seconds\n```\n\nМетки:\n\n```text\ntask_name\nqueue\nstatus\n```\n\nПолезные Gauge:\n\n```text\ncelery_tasks_active\ncelery_tasks_pending\ncelery_workers_online\n```\n\nНе стоит использовать `task_id` как label — почти каждое значение будет уникальным.\n\n### Метрики внешних сервисов\n\nДля каждого внешнего API полезно собирать:\n\n```text\nexternal_requests_total\nexternal_request_duration_seconds\nexternal_request_errors_total\nexternal_request_timeouts_total\nexternal_request_retries_total\n```\n\nМетки:\n\n```text\nservice=\"payment_gateway\"\noperation=\"charge\"\nstatus=\"success|error|timeout\"\n```\n\nПример:\n\n```text\nexternal_request_duration_seconds{\n    service=\"bank_api\",\n    operation=\"create_payment\"\n}\n```\n\nЭто позволяет быстро понять, медленно работает само приложение или внешний сервис.\n\n### Метрики retry и circuit breaker\n\n```text\nretry_attempts_total\nretry_exhausted_total\ncircuit_breaker_state\ncircuit_breaker_open_total\n```\n\nСостояние circuit breaker можно представить как Gauge:\n\n```text\n0 → closed\n1 → open\n2 → half-open\n```\n\nИли использовать отдельную метку состояния.\n\n### Метрики процесса Python\n\nОбычно собираются автоматически:\n\n```text\nprocess_cpu_seconds_total\nprocess_resident_memory_bytes\nprocess_virtual_memory_bytes\nprocess_open_fds\nprocess_start_time_seconds\n```\n\nПолезно также отслеживать:\n\n```text\nprocess_threads\ngc_collections_total\ngc_collected_objects_total\n```\n\nРост памяти без последующего снижения может указывать на утечку или неконтролируемый кеш.\n\n### Метрики event loop\n\nДля асинхронного приложения важны:\n\n```text\nevent_loop_lag_seconds\nactive_async_tasks\nthread_pool_queue_size\n```\n\n`event_loop_lag` показывает, насколько поздно event loop смог выполнить запланированную операцию.\n\nБольшой lag может означать:\n\n- блокирующий код внутри `async def`;\n    \n- CPU-bound вычисления;\n    \n- синхронный файловый или сетевой I/O;\n    \n- слишком долгую обработку callback;\n    \n- перегрузку процесса.\n    \n\n### Метрики worker-ов\n\nДля Gunicorn/Uvicorn:\n\n```text\nworkers_total\nworkers_alive\nworker_restarts_total\nworker_request_count\nworker_busy\n```\n\nЕсли число активных запросов близко к суммарной вместимости worker-ов, новые запросы начинают ждать.\n\n### Инфраструктурные метрики\n\nЭти метрики обычно собирает не Python-приложение, а exporter или контейнерная платформа:\n\n```text\nCPU utilization\nRAM usage\ndisk usage\ndisk I/O\nnetwork traffic\nnetwork errors\ncontainer restarts\nOOM kills\nfilesystem inode usage\n```\n\nДля контейнеров:\n\n```text\ncontainer_cpu_usage_seconds_total\ncontainer_memory_working_set_bytes\ncontainer_network_receive_bytes_total\ncontainer_network_transmit_bytes_total\n```\n\nДля сервера:\n\n```text\nnode_cpu_seconds_total\nnode_memory_available_bytes\nnode_filesystem_avail_bytes\nnode_load1\n```\n\n### Health-метрики\n\nПроверки доступности можно выражать через:\n\n```text\nservice_up\ndependency_up\n```\n\nПример:\n\n```text\ndependency_up{dependency=\"postgres\"} 1\ndependency_up{dependency=\"redis\"} 0\n```\n\nГде:\n\n```text\n1 → доступно\n0 → недоступно\n```\n\nНо не нужно делать тяжёлый запрос к каждой зависимости на каждом `/metrics` scrape.\n\n### Метрики безопасности\n\nВ зависимости от проекта:\n\n```text\nauthentication_failures_total\nauthorization_denied_total\nrate_limit_rejections_total\nsuspicious_requests_total\ninvalid_tokens_total\n```\n\nМетки должны быть категориальными:\n\n```text\nreason=\"expired|invalid_signature|missing\"\n```\n\nНельзя добавлять:\n\n```text\ntoken\nemail\nuser_id\nIP\n```\n\nесли это создаёт высокую кардинальность или раскрывает чувствительные данные.\n\n### Метрики лимитов и насыщения\n\nНужно наблюдать не только за нагрузкой, но и за приближением к пределу:\n\n```text\ndb_pool_usage_ratio\nworker_utilization\nqueue_capacity_usage\nthread_pool_usage\ndisk_usage_ratio\n```\n\nПример:\n\n```text\ndb_pool_usage_ratio =\nactive_connections / max_connections\n```\n\nТакие метрики помогают обнаружить проблему до полного отказа.\n\n### Counter, Gauge и Histogram\n\n#### Counter\n\nЗначение только увеличивается:\n\n```text\nhttp_requests_total\npayments_failed_total\ntasks_completed_total\n```\n\nПосле перезапуска процесса обнуляется.\n\n#### Gauge\n\nМожет увеличиваться и уменьшаться:\n\n```text\nactive_requests\nqueue_size\nmemory_usage_bytes\ndb_connections_active\n```\n\n#### Histogram\n\nХранит распределение наблюдений:\n\n```text\nhttp_request_duration_seconds\ndb_query_duration_seconds\nresponse_size_bytes\n```\n\nИспользуется для процентилей и анализа распределения.\n\n### Минимальный набор для HTTP-backend\n\nДля начала обычно достаточно:\n\n```text\nhttp_requests_total\nhttp_request_duration_seconds\nhttp_requests_in_progress\nhttp_errors_total\n\nprocess_cpu_seconds_total\nprocess_resident_memory_bytes\n\ndb_pool_connections_active\ndb_pool_waiting_requests\ndb_query_duration_seconds\n\nexternal_request_duration_seconds\nexternal_request_errors_total\n\nbusiness_operations_total\n```\n\nДля Celery или брокера добавляются:\n\n```text\nqueue_size\noldest_message_age_seconds\ntasks_succeeded_total\ntasks_failed_total\ntask_duration_seconds\n```\n\n### Какие метки использовать\n\nДля HTTP:\n\n```text\nmethod\nroute\nstatus\n```\n\nДля бизнес-операций:\n\n```text\noperation\nresult\ntype\nprovider\n```\n\nДля БД:\n\n```text\noperation\ntable\nresult\n```\n\nДля внешнего API:\n\n```text\nservice\noperation\nstatus\n```\n\nНе использовать как labels:\n\n```text\nrequest_id\ntrace_id\nuser_id\npayment_id\norder_id\nemail\nполный URL\nтекст ошибки\ntimestamp\n```\n\nТакие данные должны идти в логи или трассировки.\n\n### Практический итог\n\nДля backend-приложения основные метрики можно свести к пяти вопросам:\n\n```text\n1. Сколько операций выполняется?\n   → counters\n\n2. Сколько операций завершается ошибкой?\n   → error counters и error rate\n\n3. Сколько они выполняются?\n   → histograms и percentiles\n\n4. Сколько работы сейчас ожидает обработки?\n   → queue size, active requests, pool waiting\n\n5. Не заканчиваются ли ресурсы?\n   → CPU, RAM, соединения, worker-ы, диск\n```\n\nХороший базовый набор — **RPS, error rate, p95/p99 latency, активные запросы, состояние пула БД, очереди, внешние зависимости и ключевые бизнес-операции**."
  popularity = 2.63

[[questions]]
  id = 26
  question = "Что такое Apache Airflow"
  answer = "### Что такое Apache Airflow\n\n**Apache Airflow** — платформа для описания, планирования и контроля выполнения связанных задач.\n\nПроще говоря, Airflow позволяет задать workflow:\n\n```text\nполучить данные\n→ проверить их\n→ преобразовать\n→ загрузить в хранилище\n→ сформировать отчёт\n```\n\nПосле этого Airflow:\n\n- запускает задачи по расписанию или вручную;\n    \n- учитывает зависимости между ними;\n    \n- повторяет неудачные задачи;\n    \n- хранит историю запусков;\n    \n- показывает состояние workflow через веб-интерфейс;\n    \n- отправляет уведомления об ошибках.\n    \n\nAirflow особенно часто применяется для ETL/ELT, аналитических pipeline, периодических расчётов и оркестрации инфраструктурных операций.\n\n### DAG\n\nWorkflow в Airflow называется **DAG** — Directed Acyclic Graph, направленный ациклический граф.\n\n```text\nextract\n   │\n   ▼\ntransform\n   │\n   ▼\nload\n```\n\nНаправленный означает, что зависимости имеют направление:\n\n```text\nextract → transform\n```\n\nАциклический означает, что нельзя создать замкнутую зависимость:\n\n```text\nA → B → C → A\n```\n\nИначе невозможно определить, какая задача должна запускаться первой.\n\nПример DAG:\n\n```python\nfrom datetime import datetime\n\nfrom airflow import DAG\nfrom airflow.operators.python import PythonOperator\n\n\ndef extract() -> None:\n    print(\"Extracting data\")\n\n\ndef transform() -> None:\n    print(\"Transforming data\")\n\n\ndef load() -> None:\n    print(\"Loading data\")\n\n\nwith DAG(\n    dag_id=\"example_pipeline\",\n    start_date=datetime(2026, 1, 1),\n    schedule=\"@daily\",\n    catchup=False,\n) as dag:\n    extract_task = PythonOperator(\n        task_id=\"extract\",\n        python_callable=extract,\n    )\n\n    transform_task = PythonOperator(\n        task_id=\"transform\",\n        python_callable=transform,\n    )\n\n    load_task = PythonOperator(\n        task_id=\"load\",\n        python_callable=load,\n    )\n\n    extract_task >> transform_task >> load_task\n```\n\nЗависимость:\n\n```python\nextract_task >> transform_task >> load_task\n```\n\nозначает:\n\n```text\nсначала extract\nпотом transform\nпотом load\n```\n\n### Основные сущности\n\n#### DAG\n\nОписание всего workflow:\n\n```text\nкакие задачи существуют\nкак они связаны\nпо какому расписанию запускаются\n```\n\n#### Task\n\nКонкретный шаг workflow:\n\n```text\nзапустить Python-функцию\nвыполнить SQL\nотправить HTTP-запрос\nзапустить контейнер\nвыполнить Bash-команду\n```\n\n#### Operator\n\nШаблон того, какую работу выполняет задача.\n\nНапример:\n\n```text\nPythonOperator\n→ вызывает Python-функцию\n\nBashOperator\n→ запускает shell-команду\n\nSQL-операторы\n→ выполняют запросы к БД\n\nDockerOperator\n→ запускает контейнер\n```\n\n#### Task instance\n\nКонкретный запуск задачи в рамках определённого запуска DAG.\n\nНапример:\n\n```text\nDAG: daily_report\nдата запуска: 2026-07-31\nзадача: load_data\n```\n\nЭто отдельный task instance со своим состоянием, логами и числом попыток.\n\n#### DAG run\n\nОдин полный запуск DAG.\n\nОдин и тот же DAG может иметь множество запусков:\n\n```text\ndaily_report — 29 июля\ndaily_report — 30 июля\ndaily_report — 31 июля\n```\n\n### Основные компоненты Airflow\n\n```text\nDAG-файлы\n    │\n    ▼\nScheduler\n    │\n    ▼\nExecutor\n    │\n    ▼\nWorkers\n```\n\n#### Scheduler\n\nПроверяет:\n\n- какие DAG нужно запустить;\n    \n- какие зависимости уже выполнены;\n    \n- какие задачи готовы к запуску;\n    \n- какие задачи нужно повторить.\n    \n\nScheduler не обязательно сам выполняет бизнес-код задачи. Он в основном принимает решения о запуске.\n\n#### Executor\n\nОпределяет, каким способом задачи будут выполняться.\n\nНапример:\n\n```text\nлокально\nв отдельных процессах\nна Celery workers\nв Kubernetes pods\n```\n\n#### Worker\n\nНепосредственно выполняет задачу.\n\nНапример:\n\n```text\nworker получил задачу\n→ запустил Python-код\n→ записал результат и статус\n```\n\n#### Metadata Database\n\nAirflow хранит служебное состояние в реляционной БД:\n\n- DAG runs;\n    \n- task instances;\n    \n- статусы задач;\n    \n- расписания;\n    \n- retry;\n    \n- служебные настройки.\n    \n\nЭто не основное хранилище данных вашего pipeline. Большие наборы данных обычно хранятся во внешних системах.\n\n#### Webserver\n\nПредоставляет веб-интерфейс, где можно:\n\n- посмотреть DAG;\n    \n- запустить его вручную;\n    \n- увидеть граф зависимостей;\n    \n- проверить статусы задач;\n    \n- открыть логи;\n    \n- повторно запустить отдельную задачу;\n    \n- посмотреть историю запусков.\n    \n\n### Состояния задачи\n\nЗадача может находиться в состояниях:\n\n```text\nscheduled\nqueued\nrunning\nsuccess\nfailed\nup_for_retry\nskipped\nupstream_failed\n```\n\nНапример:\n\n```text\nextract → success\ntransform → failed\nload → upstream_failed\n```\n\n`load` не запускалась, потому что зависела от неуспешной `transform`.\n\n### Повторные попытки\n\nAirflow умеет автоматически повторять неудачные задачи:\n\n```python\nfrom datetime import timedelta\n\nwith DAG(\n    ...,\n    default_args={\n        \"retries\": 3,\n        \"retry_delay\": timedelta(minutes=5),\n    },\n):\n    ...\n```\n\nЛогика:\n\n```text\nзадача упала\n→ подождать 5 минут\n→ повторить\n→ максимум 3 попытки\n```\n\nЗадачи желательно делать идемпотентными, чтобы повторный запуск не создавал дубликаты и не повреждал данные.\n\n### Расписание\n\nDAG можно запускать:\n\n```text\nкаждый час\nкаждый день\nпо cron-расписанию\nвручную\nчерез API\nпосле появления определённых данных\n```\n\nПримеры:\n\n```python\nschedule=\"@daily\"\n```\n\n```python\nschedule=\"0 3 * * *\"\n```\n\nВторой вариант означает запуск ежедневно около 03:00 в соответствии с настроенной временной зоной.\n\n### Что такое backfill и catchup\n\nПредположим, DAG должен выполняться ежедневно, но был выключен пять дней.\n\nПри включённом `catchup` Airflow может создать пропущенные запуски:\n\n```text\n27 июля\n28 июля\n29 июля\n30 июля\n31 июля\n```\n\nЭто полезно для исторической обработки данных.\n\n```python\ncatchup=False\n```\n\nозначает, что пропущенные интервалы автоматически запускаться не будут.\n\n### Передача данных между задачами\n\nAirflow поддерживает XCom — механизм обмена небольшими значениями между задачами.\n\nНапример:\n\n```text\nextract\n→ передал ID созданного файла\n→ transform получил этот ID\n```\n\nXCom подходит для:\n\n- идентификаторов;\n    \n- путей к файлам;\n    \n- небольших метаданных;\n    \n- статусов;\n    \n- коротких результатов.\n    \n\nНе следует передавать через XCom большие DataFrame, файлы или массивы на сотни мегабайт.\n\nЛучше:\n\n```text\nзадача сохранила данные в S3 / MinIO / БД\n→ через XCom передала только путь или ключ объекта\n```\n\n### TaskFlow API\n\nAirflow позволяет описывать Python-задачи через декораторы:\n\n```python\nfrom airflow.decorators import dag, task\nfrom datetime import datetime\n\n\n@dag(\n    start_date=datetime(2026, 1, 1),\n    schedule=\"@daily\",\n    catchup=False,\n)\ndef payment_report():\n    @task\n    def extract() -> list[int]:\n        return [100, 200, 300]\n\n    @task\n    def calculate_total(values: list[int]) -> int:\n        return sum(values)\n\n    @task\n    def save(total: int) -> None:\n        print(f\"Total: {total}\")\n\n    values = extract()\n    total = calculate_total(values)\n    save(total)\n\n\npayment_report()\n```\n\nЗдесь зависимости формируются из вызовов задач:\n\n```text\nextract\n→ calculate_total\n→ save\n```\n\nЭто удобнее для небольших Python-oriented pipeline.\n\n### Где применяют Airflow\n\n#### ETL/ELT\n\n```text\nPostgreSQL\n→ извлечение\n→ очистка\n→ преобразование\n→ ClickHouse / BigQuery / Data Warehouse\n```\n\n#### Периодические отчёты\n\n```text\nполучить данные\n→ рассчитать показатели\n→ сформировать файл\n→ отправить отчёт\n```\n\n#### Машинное обучение\n\n```text\nполучить датасет\n→ подготовить признаки\n→ обучить модель\n→ проверить метрики\n→ опубликовать модель\n```\n\n#### Data quality\n\n```text\nпроверить наличие данных\n→ проверить количество строк\n→ проверить ограничения\n→ отправить уведомление\n```\n\n#### Оркестрация сервисов\n\n```text\nзапустить job\n→ дождаться завершения\n→ проверить результат\n→ запустить следующий этап\n```\n\n### Airflow и Celery\n\nAirflow и Celery решают пересекающиеся, но разные задачи.\n\n#### Celery\n\nОчередь фоновых задач:\n\n```text\nприложение отправило задачу\n→ broker\n→ worker выполнил её\n```\n\nПодходит для:\n\n- отправки email;\n    \n- генерации файлов;\n    \n- обработки пользовательских запросов;\n    \n- коротких фоновых операций;\n    \n- событийных задач.\n    \n\n#### Airflow\n\nОркестратор workflow:\n\n```text\nзадача A\n→ после успеха задача B и C\n→ после них задача D\n→ по расписанию\n→ с историей и повторными запусками\n```\n\nПодходит для:\n\n- сложных зависимостей;\n    \n- длительных pipeline;\n    \n- расписаний;\n    \n- backfill;\n    \n- контроля каждого этапа.\n    \n\nAirflow может использовать Celery как механизм выполнения задач, но это не делает их одним и тем же инструментом.\n\n### Airflow и брокер сообщений\n\nAirflow не является заменой RabbitMQ или Kafka.\n\n```text\nRabbitMQ / Kafka\n→ транспорт и доставка сообщений\n\nAirflow\n→ управление порядком и расписанием выполнения workflow\n```\n\nAirflow ориентирован прежде всего на конечные задачи и pipeline, а не на постоянную обработку потока сообщений с минимальной задержкой.\n\n### Для чего Airflow подходит плохо\n\nAirflow обычно не используют как основной механизм для:\n\n- обработки каждого HTTP-запроса;\n    \n- real-time pipeline с миллисекундной задержкой;\n    \n- бесконечно работающих consumer-ов;\n    \n- передачи больших данных между задачами;\n    \n- простого запуска одной фоновой функции;\n    \n- хранения бизнес-данных.\n    \n\nПлохой пример:\n\n```text\nпользователь отправил HTTP-запрос\n→ создать отдельный DAG\n→ ждать его завершения\n```\n\nДля этого обычно подходят Celery, брокер сообщений или обычный backend worker.\n\n### Важный принцип\n\nAirflow оркестрирует работу, но тяжёлые вычисления желательно выполнять вне самого Airflow-процесса:\n\n```text\nAirflow task\n→ запускает Spark job\n→ запускает Kubernetes pod\n→ вызывает внешний сервис\n→ выполняет SQL в хранилище\n```\n\nТо есть Airflow отвечает за:\n\n```text\nкогда запускать\nв каком порядке\nчто делать при ошибке\nкак отслеживать состояние\n```\n\nа специализированная система выполняет тяжёлую работу.\n\n### Итог\n\n```text\nApache Airflow\n→ платформа оркестрации workflow\n\nDAG\n→ граф зависимых задач\n\nScheduler\n→ решает, что и когда запускать\n\nExecutor и workers\n→ выполняют задачи\n\nMetadata DB\n→ хранит состояния и историю\n\nWeb UI\n→ показывает и позволяет управлять pipeline\n```\n\nAirflow особенно полезен, когда существует много связанных периодических задач, для которых важны зависимости, повторные попытки, история запусков, backfill и централизованный контроль."
