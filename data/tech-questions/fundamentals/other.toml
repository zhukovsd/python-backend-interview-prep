[[questions]]
  id = 19
  question = "Как организовать сбор и передачу логов приложения?"
  answer = "### Общая архитектура\n\nДля backend-приложения логирование обычно организуют как отдельный pipeline:\n\n```text\nПриложение\n→ формирует структурированные события\n→ пишет их в stdout/stderr\n→ агент собирает логи\n→ парсит, дополняет и буферизует\n→ передаёт в централизованное хранилище\n→ Grafana/Kibana предоставляет поиск и визуализацию\n```\n\nНапример:\n\n```text\nFastAPI\n→ JSON в stdout\n→ Fluent Bit\n→ Loki\n→ Grafana\n```\n\nили:\n\n```text\nFastAPI\n→ logging / OpenTelemetry\n→ OpenTelemetry Collector\n→ Elasticsearch, Loki или облачный backend\n```\n\nOpenTelemetry Collector предназначен именно для приёма, обработки и экспорта логов, метрик и трассировок, а Fluent Bit строит pipeline из входов, фильтров, буферизации и выходов. \n\n### 1. Формирование логов в приложении\n\nВ Python основой обычно служит стандартный `logging`:\n\n```python\nimport logging\n\nlogger = logging.getLogger(__name__)\n\n\ndef create_payment(payment_id: int, user_id: int) -> None:\n    logger.info(\n        \"payment_created\",\n        extra={\n            \"payment_id\": payment_id,\n            \"user_id\": user_id,\n        },\n    )\n```\n\nКаждый модуль получает логгер с именем модуля:\n\n```python\nlogger = logging.getLogger(__name__)\n```\n\nЦентрализованная конфигурация выполняется один раз при запуске приложения, обычно через `logging.config.dictConfig()`.\n\n### 2. Использовать структурированные логи\n\nДля production лучше писать не произвольные строки:\n\n```text\nPayment 145 created by user 42\n```\n\nа JSON:\n\n```json\n{\n  \"timestamp\": \"2026-07-31T17:45:10.128Z\",\n  \"level\": \"INFO\",\n  \"service\": \"payment-service\",\n  \"environment\": \"production\",\n  \"event\": \"payment_created\",\n  \"payment_id\": 145,\n  \"user_id\": 42,\n  \"request_id\": \"req-9f12\",\n  \"trace_id\": \"b9f270...\"\n}\n```\n\nТакой лог проще:\n\n- фильтровать по полям;\n    \n- агрегировать;\n    \n- передавать между системами;\n    \n- использовать для алертов;\n    \n- связывать с трассировкой.\n    \n\nФормировать JSON можно через:\n\n```text\nlogging + python-json-logger\nstructlog\nOpenTelemetry logging integration\n```\n\n### 3. Определить общую схему события\n\nВсе сервисы должны использовать согласованный набор основных полей:\n\n```text\ntimestamp\nlevel\nservice\nservice_version\nenvironment\nevent\nmessage\nrequest_id\ntrace_id\nspan_id\nuser_id\nduration_ms\nhttp_method\nhttp_route\nhttp_status_code\nerror.type\nerror.message\n```\n\nПри этом не каждое поле присутствует в каждом событии.\n\nПример успешного HTTP-запроса:\n\n```json\n{\n  \"event\": \"http_request_completed\",\n  \"service\": \"notification-service\",\n  \"request_id\": \"req-123\",\n  \"method\": \"POST\",\n  \"route\": \"/notifications\",\n  \"status_code\": 201,\n  \"duration_ms\": 34\n}\n```\n\nПример ошибки:\n\n```json\n{\n  \"event\": \"notification_creation_failed\",\n  \"level\": \"ERROR\",\n  \"request_id\": \"req-123\",\n  \"user_id\": 42,\n  \"error_type\": \"DatabaseError\",\n  \"message\": \"Could not create notification\"\n}\n```\n\n### 4. Добавлять контекст запроса\n\nВсе записи, созданные при обработке одного запроса, желательно связывать через:\n\n```text\nrequest_id\ntrace_id\nuser_id\n```\n\n```text\nHTTP-запрос\nrequest_id=req-123\n    │\n    ├── проверка пользователя\n    ├── SQL-запрос\n    ├── публикация события\n    └── HTTP-ответ\n```\n\nВ стандартном `logging` контекст можно добавлять через `LoggerAdapter`, фильтр или фабрику `LogRecord`. Python Logging Cookbook отдельно описывает `LoggerAdapter` как средство добавления контекстных полей к записям.\n\nДля асинхронного FastAPI-приложения удобно хранить контекст запроса в `contextvars`.\n\nУпрощённый middleware:\n\n```python\nfrom contextvars import ContextVar\nfrom uuid import uuid4\n\nfrom fastapi import FastAPI, Request\n\nrequest_id_var: ContextVar[str | None] = ContextVar(\n    \"request_id\",\n    default=None,\n)\n\napp = FastAPI()\n\n\n@app.middleware(\"http\")\nasync def add_request_id(request: Request, call_next):\n    request_id = request.headers.get(\n        \"X-Request-ID\",\n        str(uuid4()),\n    )\n\n    token = request_id_var.set(request_id)\n\n    try:\n        response = await call_next(request)\n        response.headers[\"X-Request-ID\"] = request_id\n        return response\n    finally:\n        request_id_var.reset(token)\n```\n\nДалее formatter или filter автоматически добавляет `request_id` ко всем записям текущего запроса.\n\n### 5. Куда писать логи\n\n#### Приложение в Docker или Kubernetes\n\nПредпочтительная схема:\n\n```text\nприложение\n→ stdout/stderr\n→ контейнерная платформа\n→ агент логирования\n```\n\nDocker автоматически захватывает вывод контейнера в `stdout` и `stderr`; команда `docker logs` читает именно эти потоки. Docker также поддерживает разные logging drivers.\n\nПример handler:\n\n```python\n\"handlers\": {\n    \"console\": {\n        \"class\": \"logging.StreamHandler\",\n        \"formatter\": \"json\",\n        \"stream\": \"ext://sys.stdout\",\n    },\n}\n```\n\nНе стоит внутри контейнера писать каждый сервис в собственный файл без явной причины:\n\n```text\n/app/logs/service.log\n```\n\nЭто усложняет:\n\n- ротацию;\n    \n- доступ из нескольких реплик;\n    \n- сбор после пересоздания контейнера;\n    \n- конфигурацию volume;\n    \n- работу в Kubernetes.\n    \n\n#### Обычный сервер без контейнеров\n\nМожно писать в файл:\n\n```text\n/var/log/my-service/app.log\n```\n\nНо необходимо настроить:\n\n- ротацию;\n    \n- ограничение размера;\n    \n- число резервных файлов;\n    \n- сжатие;\n    \n- права доступа;\n    \n- сбор агентом.\n    \n\nВ Python доступны `RotatingFileHandler` и `TimedRotatingFileHandler`, а для неблокирующей обработки записей — `QueueHandler` и `QueueListener`. \n\n### 6. Не отправлять каждый лог непосредственно из бизнес-кода\n\nПлохая схема:\n\n```python\ndef create_payment():\n    requests.post(\n        \"https://logging.example.com/logs\",\n        json={\"event\": \"payment_created\"},\n    )\n```\n\nПроблемы:\n\n- логирование увеличивает задержку запроса;\n    \n- недоступность хранилища может сломать бизнес-операцию;\n    \n- на каждый лог создаётся сетевой запрос;\n    \n- появляется сильная зависимость приложения от конкретного backend;\n    \n- сложно организовать batch, retries и buffering.\n    \n\nЛучше:\n\n```text\nбизнес-код\n→ локальный logging\n→ stdout или локальная очередь\n→ внешний collector\n→ backend\n```\n\n### 7. Исключить блокирующую запись из рабочего потока\n\nДаже запись в файл или сеть может быть медленной. Для нагруженного приложения можно использовать:\n\n```text\nрабочий поток\n→ QueueHandler\n→ очередь\n→ QueueListener\n→ реальный handler\n```\n\n```python\nimport logging\nimport queue\nfrom logging.handlers import QueueHandler, QueueListener\n\nlog_queue: queue.Queue[logging.LogRecord] = queue.Queue(\n    maxsize=10_000,\n)\n\nconsole_handler = logging.StreamHandler()\n\nqueue_handler = QueueHandler(log_queue)\nlistener = QueueListener(\n    log_queue,\n    console_handler,\n    respect_handler_level=True,\n)\n\nroot_logger = logging.getLogger()\nroot_logger.addHandler(queue_handler)\nroot_logger.setLevel(logging.INFO)\n\nlistener.start()\n```\n\n`QueueHandler` помещает `LogRecord` в очередь, а `QueueListener` обрабатывает записи в отдельном потоке. \n\nПри этом нужно заранее определить политику переполнения очереди:\n\n```text\nждать\nотбрасывать DEBUG/INFO\nсохранять ERROR отдельно\nувеличивать локальный буфер\n```\n\nБесконечная очередь опасна неконтролируемым потреблением памяти.\n\n### 8. Сбор логов агентом\n\nАгент запускается рядом с приложением:\n\n```text\nна каждой VM\nв каждом Kubernetes node\nкак sidecar\nкак DaemonSet\n```\n\nОн выполняет:\n\n```text\ninput\n→ parsing\n→ filtering\n→ enrichment\n→ buffering\n→ routing\n→ output\n```\n\nНапример, Fluent Bit может читать контейнерные логи, разбирать JSON, добавлять метаданные и отправлять результат в Loki, Elasticsearch или другой backend. Его официальная модель pipeline состоит из inputs, filters и outputs, а processors позволяют преобразовывать и дополнять события. \n\nУсловная конфигурация Fluent Bit:\n\n```yaml\nservice:\n  flush: 1\n  log_level: info\n\npipeline:\n  inputs:\n    - name: tail\n      path: /var/lib/docker/containers/*/*.log\n      tag: app.*\n\n  filters:\n    - name: parser\n      match: app.*\n      key_name: log\n      parser: json\n      reserve_data: true\n\n    - name: modify\n      match: app.*\n      add:\n        collector: fluent-bit\n\n  outputs:\n    - name: loki\n      match: app.*\n      host: loki\n      port: 3100\n```\n\nКонкретный input зависит от среды: Docker, systemd, Kubernetes или обычные файлы.\n\n### 9. Буферизация и повторная отправка\n\nЦентральное хранилище может временно быть недоступно:\n\n```text\nприложение работает\nLoki/Elasticsearch недоступен\nсеть нестабильна\n```\n\nПоэтому collector должен поддерживать:\n\n- batching;\n    \n- retries;\n    \n- ограниченную очередь;\n    \n- backpressure;\n    \n- локальный disk buffer;\n    \n- лимиты памяти;\n    \n- dead-letter или отдельный маршрут для проблемных данных.\n    \n\nFluent Bit поддерживает memory- и filesystem-буферизацию; файловый буфер помогает пережить backpressure и ограничить использование оперативной памяти. \n\nПринцип:\n\n```text\nbackend недоступен\n→ события временно сохраняются на диске\n→ collector повторяет отправку\n→ после восстановления связи backlog передаётся\n```\n\nБуфер должен быть ограниченным. Иначе при долгом отказе хранилища collector может заполнить весь диск.\n\n### 10. Agent и gateway\n\nДля небольшой системы достаточно:\n\n```text\nприложения\n→ один collector\n→ backend\n```\n\nДля нескольких серверов и кластеров применяется двухуровневая схема:\n\n```text\nПриложение\n→ локальный agent\n→ центральный gateway\n→ одно или несколько хранилищ\n```\n\n```text\nNode 1: приложения → Agent ┐\nNode 2: приложения → Agent ├→ Gateway → Loki\nNode 3: приложения → Agent ┘          → Elastic\n                                      → S3/archive\n```\n\nВ модели OpenTelemetry локальные agents находятся рядом с приложениями, а gateways централизуют более тяжёлую обработку и могут масштабироваться независимо. \n\nGateway может:\n\n- фильтровать события;\n    \n- удалять чувствительные поля;\n    \n- выполнять batching;\n    \n- маршрутизировать разные сервисы;\n    \n- отправлять копии в несколько систем;\n    \n- централизованно применять правила.\n    \n\n### 11. Выбор хранилища\n\nРаспространённые варианты:\n\n```text\nLoki + Grafana\nElasticsearch + Kibana\nOpenSearch + OpenSearch Dashboards\nоблачные системы логирования\n```\n\nLoki удобен при существующем стеке Grafana/Prometheus. Elasticsearch удобен, когда нужен полнотекстовый поиск и развитая индексация большого числа полей.\n\nНо структуру логов нужно проектировать под выбранное хранилище.\n\n#### Особенность Loki\n\nВ labels стоит помещать только поля с относительно низкой кардинальностью:\n\n```text\nservice\nenvironment\ncluster\nnamespace\n```\n\nНе следует использовать как labels:\n\n```text\nrequest_id\ntrace_id\nuser_id\norder_id\nIP\ntimestamp\n```\n\nКаждое уникальное сочетание labels создаёт отдельный log stream; высокая кардинальность ухудшает ingestion и запросы. Grafana рекомендует оставлять labels низкокардинальными, а идентификаторы запроса, пользователя и trace хранить в теле события или structured metadata. \n\nНапример:\n\n```json\n{\n  \"service\": \"payment-service\",\n  \"environment\": \"production\",\n  \"request_id\": \"req-928134\",\n  \"user_id\": 837261,\n  \"event\": \"payment_created\"\n}\n```\n\nВ Loki labels:\n\n```text\nservice=payment-service\nenvironment=production\n```\n\nА `request_id` и `user_id` остаются полями записи.\n\n### 12. Уровни логирования\n\nНужно определить единые правила:\n\n```text\nDEBUG\n→ детали для диагностики и разработки\n\nINFO\n→ нормальные значимые бизнес- и технические события\n\nWARNING\n→ подозрительная ситуация, но операция продолжается\n\nERROR\n→ операция завершилась ошибкой\n\nCRITICAL\n→ сервис или важная подсистема не может работать\n```\n\nНе стоит писать `ERROR` для ожидаемого ответа:\n\n```text\nпользователь ввёл неправильный пароль\nзапрашиваемый объект не найден\nвалидация запроса вернула 422\n```\n\nИначе алерты и статистика ошибок превратятся в шум.\n\n### 13. Что именно логировать\n\nПолезно логировать:\n\n```text\nзапуск и завершение приложения\nвходящие HTTP-запросы\nстатус и длительность ответа\nнеобработанные исключения\nошибки внешних сервисов\nповторные попытки\nтаймауты\nсостояние фоновых задач\nважные изменения бизнес-состояния\nпубликацию и обработку сообщений\n```\n\nНапример:\n\n```python\nlogger.info(\n    \"payment_status_changed\",\n    extra={\n        \"payment_id\": payment.id,\n        \"old_status\": old_status,\n        \"new_status\": payment.status,\n    },\n)\n```\n\nПри этом лог не должен становиться единственным источником бизнес-истины. Критичные финансовые и пользовательские действия лучше дополнительно сохранять в audit log или специализированной таблице.\n\n### 14. Что нельзя логировать\n\nНельзя записывать в обычные логи:\n\n```text\nпароли\nJWT и refresh tokens\nsession cookies\nAuthorization header\nприватные ключи\nполные данные банковских карт\nсекреты API\nстроки подключения с паролями\nполные тела чувствительных запросов\n```\n\nПоля должны маскироваться до передачи collector:\n\n```json\n{\n  \"email\": \"a***@example.com\",\n  \"card_number\": \"**** **** **** 1234\",\n  \"authorization\": \"[REDACTED]\"\n}\n```\n\nРедактирование лучше выполнять в двух местах:\n\n```text\nприложение\n→ не создаёт опасные поля\n\ncollector\n→ дополнительная защитная фильтрация\n```\n\n### 15. Логи HTTP-запросов\n\nРазумная запись доступа:\n\n```json\n{\n  \"event\": \"http_request_completed\",\n  \"method\": \"POST\",\n  \"route\": \"/payments/{payment_id}\",\n  \"status_code\": 200,\n  \"duration_ms\": 48,\n  \"request_id\": \"req-123\"\n}\n```\n\nЛучше хранить шаблон маршрута:\n\n```text\n/payments/{payment_id}\n```\n\nа не каждый фактический URL:\n\n```text\n/payments/874512\n```\n\nЭто упрощает агрегацию и уменьшает количество уникальных значений.\n\nНе нужно без необходимости логировать полное тело каждого запроса и ответа. Это создаёт:\n\n- большие объёмы данных;\n    \n- риск утечки персональных данных;\n    \n- дополнительную нагрузку;\n    \n- сложность соблюдения retention policy.\n    \n\n### 16. Исключения\n\nДля исключения нужен stack trace:\n\n```python\ntry:\n    await payment_gateway.charge(payment)\nexcept Exception:\n    logger.exception(\n        \"payment_charge_failed\",\n        extra={\"payment_id\": payment.id},\n    )\n    raise\n```\n\n`logger.exception()` автоматически добавляет информацию о текущем исключении.\n\nНе следует дважды записывать одну и ту же ошибку на каждом уровне:\n\n```text\nrepository записал ERROR\nservice записал ERROR\nendpoint записал ERROR\nglobal handler записал ERROR\n```\n\nИначе одно исключение превращается в четыре одинаковых события.\n\nОбычно ошибка логируется там, где:\n\n- она была обработана;\n    \n- к ней добавляется значимый контекст;\n    \n- либо в глобальном обработчике, если осталась необработанной.\n    \n\n### 17. Retention и управление объёмом\n\nДля логов нужно заранее определить:\n\n```text\nсколько дней они хранятся\nкакие уровни сохраняются\nкакие сервисы требуют более долгого хранения\nчто архивируется\nкогда данные удаляются\n```\n\nНапример:\n\n```text\nDEBUG → не собирается в production\nINFO  → 14 дней\nERROR → 90 дней\naudit → 1 год\n```\n\nЭто пример политики, а не универсальные сроки: реальные значения зависят от требований проекта, стоимости хранения и законодательства.\n\nОбъём можно уменьшать через:\n\n- отключение `DEBUG`;\n    \n- sampling частых однотипных событий;\n    \n- агрегацию;\n    \n- исключение health-check запросов;\n    \n- ограничение stack trace;\n    \n- ограничение размера одного события;\n    \n- удаление ненужных полей.\n    \n\n### 18. Мониторинг самого pipeline\n\nНужно наблюдать не только приложение, но и систему доставки логов:\n\n```text\nразмер очереди\nчисло retry\nчисло отброшенных событий\nобъём буфера на диске\nошибки парсинга\nзадержка доставки\nзаполнение диска\nдоступность backend\n```\n\nИначе может возникнуть ситуация:\n\n```text\nприложение работает\nлоги не поступают уже два часа\nникто этого не заметил\n```\n\nДля collector следует создать отдельные алерты:\n\n```text\ndropped_logs > 0\nbuffer_usage > 80%\nexport_errors растут\nнет логов от критичного сервиса\n```\n\n### Практическая схема для FastAPI и Docker Compose\n\n```text\nFastAPI\n  │ JSON stdout\n  ▼\nDocker logging driver\n  │\n  ▼\nFluent Bit\n  │ parsing, metadata, buffering, retries\n  ▼\nLoki\n  │\n  ▼\nGrafana\n```\n\nВ приложении:\n\n```text\nlogging или structlog\nJSON formatter\nrequest_id\ntrace_id\nservice\nenvironment\n```\n\nВ Fluent Bit:\n\n```text\nчтение контейнерных логов\nпарсинг JSON\nдобавление container/service metadata\nфильтрация секретов\nfilesystem buffering\nотправка в Loki\n```\n\nВ Loki:\n\n```text\nlabels:\nservice\nenvironment\nhost\n\nполя внутри JSON:\nrequest_id\ntrace_id\nuser_id\npayment_id\nevent\nduration_ms\n```\n\n### Итоговая рекомендация\n\nДля обычного Python-backend разумно начать с такой архитектуры:\n\n```text\n1. logging или structlog\n2. единый JSON-формат\n3. request_id и trace_id\n4. вывод в stdout\n5. Fluent Bit или OpenTelemetry Collector\n6. локальная буферизация и retries\n7. Loki + Grafana либо Elastic\n8. отдельный Sentry для исключений\n9. маскирование секретов\n10. retention и мониторинг доставки\n```\n\nКлючевой принцип:\n\n```text\nПриложение создаёт качественное структурированное событие,\nно не занимается надёжной сетевой доставкой и хранением.\n\nСбор, буферизацию, повторную передачу и маршрутизацию\nвыполняет отдельный collector.\n```"
