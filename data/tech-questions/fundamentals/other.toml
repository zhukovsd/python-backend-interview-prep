  question = "Как зависит число одновременно выполняемых потоков от количества доступных ядер?"
  answer = "### Основная зависимость\n\nВ каждый конкретный момент времени одно логическое ядро процессора может исполнять инструкции одного программного потока.\n\nПоэтому максимальное число потоков, которые действительно исполняются параллельно, примерно равно количеству **логических процессоров**, доступных операционной системе:\n\n```text\n4 ядра / 4 логических CPU\n→ до 4 потоков одновременно исполняют инструкции\n\n4 ядра / 8 логических CPU с SMT\n→ до 8 аппаратных потоков одновременно\n```\n\nОстальные готовые к выполнению потоки ждут своей очереди, а планировщик ОС быстро переключает их.\n\n### Потоки процесса и аппаратные потоки\n\nНужно различать три понятия:\n\n```text\nПрограммный поток\n→ объект, созданный программой или runtime\n\nФизическое ядро\n→ самостоятельный вычислительный блок CPU\n\nЛогический процессор\n→ аппаратный контекст выполнения,\n  который видит операционная система\n```\n\nНапример, процессор может иметь:\n\n```text\n4 физических ядра\n8 логических процессоров\n```\n\nОС видит восемь логических CPU и теоретически может одновременно назначить на них восемь программных потоков.\n\nНо два логических потока одного физического ядра используют общие ресурсы ядра, поэтому SMT обычно не равен удвоению производительности.\n\n### Если потоков меньше, чем ядер\n\nДопустим, есть восемь логических CPU, но программа создала два CPU-bound потока:\n\n```text\nCPU 0 → поток A\nCPU 1 → поток B\nCPU 2–7 → свободны или выполняют другие процессы\n```\n\nПрограмма использует максимум два логических CPU. Остальные ядра не могут самостоятельно разделить один обычный последовательный поток на несколько частей.\n\n```text\n1 CPU-bound поток\n→ обычно загружает максимум один логический CPU\n```\n\nИсключение — когда вызываемая библиотека сама создаёт потоки, например NumPy, BLAS, видеокодек или библиотека машинного обучения.\n\n### Если потоков столько же, сколько логических CPU\n\nНапример:\n\n```text\n8 runnable CPU-bound потоков\n8 логических CPU\n```\n\nПланировщик может назначить по одному потоку на каждый логический CPU:\n\n```text\nCPU 0 → поток 1\nCPU 1 → поток 2\n...\nCPU 7 → поток 8\n```\n\nЭто позволяет выполнять их действительно параллельно.\n\nНо ускорение редко бывает строго восьмикратным из-за:\n\n- последовательной части алгоритма;\n    \n- конкуренции за память и кеш;\n    \n- синхронизации;\n    \n- блокировок;\n    \n- общего L3-кеша;\n    \n- ограниченной пропускной способности RAM;\n    \n- переключений контекста;\n    \n- SMT вместо отдельных физических ядер.\n    \n\n### Если потоков больше, чем ядер\n\nДопустим:\n\n```text\n4 логических CPU\n100 готовых CPU-bound потоков\n```\n\nВ каждый момент исполняются только примерно четыре:\n\n```text\nCPU 0 → поток A\nCPU 1 → поток B\nCPU 2 → поток C\nCPU 3 → поток D\n\nостальные 96 → runnable, но ждут CPU\n```\n\nПланировщик периодически переключает потоки:\n\n```text\nA выполняется\n→ квант времени закончился\n→ сохраняются регистры A\n→ загружаются регистры E\n→ выполняется E\n```\n\nПользователю кажется, что работают все 100 потоков, но физически они исполняются порциями.\n\n### Конкурентность и параллелизм\n\n```text\nКонкурентность\n→ несколько задач находятся в процессе выполнения,\n  но могут чередоваться на одном ядре\n\nПараллелизм\n→ несколько задач физически выполняются одновременно\n  на разных логических CPU\n```\n\nНа одном ядре:\n\n```text\nпоток A: ███       ███\nпоток B:    ███ ███\n```\n\nОни выполняются конкурентно, но не параллельно.\n\nНа двух ядрах:\n\n```text\nCPU 1: поток A ███████\nCPU 2: поток B ███████\n```\n\nОни выполняются параллельно.\n\n### Почему I/O-потоков может быть намного больше ядер\n\nБольшинство потоков сервера могут не вычислять, а ждать:\n\n```text\nответа БД\nсетевого пакета\nфайла\nблокировки\nтаймера\n```\n\nОжидающий поток не занимает ядро:\n\n```text\nпоток A → ждёт PostgreSQL\nпоток B → ждёт HTTP-ответ\nпоток C → ждёт файл\nпоток D → выполняется на CPU\n```\n\nПоэтому на восьмиядерной машине могут существовать сотни или тысячи потоков, хотя одновременно инструкции исполняют только несколько из них.\n\nДля I/O-bound нагрузки число потоков иногда делают больше числа ядер:\n\n```text\nпока одни потоки ждут I/O,\nдругие используют CPU\n```\n\nНо слишком большое количество потоков создаёт расходы:\n\n- память под стеки;\n    \n- переключения контекста;\n    \n- работу планировщика;\n    \n- конкуренцию за блокировки;\n    \n- ухудшение кеш-локальности.\n    \n\n### CPU-bound задачи\n\nДля чистых вычислений обычно нет смысла создавать намного больше активно работающих потоков, чем доступно логических CPU.\n\nПримерная отправная точка:\n\n```text\nчисло CPU-bound workers\n≈ число доступных физических или логических CPU\n```\n\nКакое именно число лучше — физические или логические ядра — зависит от задачи.\n\n#### Вычисления хорошо используют все блоки ядра\n\nSMT может дать умеренный прирост:\n\n```text\n8 физических / 16 логических CPU\n→ оптимум может оказаться около 12–16 потоков\n```\n\n#### Потоки полностью нагружают ядра и память\n\nДополнительные SMT-потоки могут почти не помогать:\n\n```text\n8 физических / 16 логических CPU\n→ оптимум может оказаться около 8 потоков\n```\n\nПоэтому число CPU-bound workers лучше подбирать измерениями.\n\n### I/O-bound задачи\n\nДля задач, которые большую часть времени ждут, полезна условная оценка:\n\n```text\nколичество потоков\n≈ количество CPU × (1 + время ожидания / время вычисления)\n```\n\nНапример, задача:\n\n```text\n10 мс вычисляется\n90 мс ждёт сеть\n```\n\nОна использует CPU только около 10% времени. Поэтому потоков может быть значительно больше числа ядер.\n\nОднако на практике лимит определяют также:\n\n- connection pool БД;\n    \n- ограничения внешнего API;\n    \n- память;\n    \n- допустимая нагрузка;\n    \n- rate limits;\n    \n- latency;\n    \n- число файловых дескрипторов.\n    \n\n### Что происходит с заблокированным потоком\n\nЕсли поток вызывает блокирующий `read()` и данных нет:\n\n```text\nпоток выполнялся\n→ вошёл в ядро через системный вызов\n→ данных нет\n→ ОС переводит поток в waiting\n→ ядро отдаётся другому runnable-потоку\n```\n\nКогда данные приходят:\n\n```text\nустройство или сеть сообщает ядру\n→ поток становится runnable\n→ планировщик позже назначает его на CPU\n```\n\nПоэтому количество существующих потоков не равно количеству потоков, потребляющих процессор.\n\n### Влияние SMT / Hyper-Threading\n\nПри SMT одно физическое ядро предоставляет несколько логических CPU:\n\n```text\nФизическое ядро\n├── логический CPU 0\n└── логический CPU 1\n```\n\nОни могут одновременно держать состояние двух потоков, но делят:\n\n- исполнительные блоки;\n    \n- кеши;\n    \n- пропускную способность;\n    \n- часть внутренней инфраструктуры ядра.\n    \n\nПоэтому:\n\n```text\n8 физических ядер / 16 потоков\n≠ производительность 16 физических ядер\n```\n\nВ зависимости от нагрузки выигрыш может быть заметным, небольшим или отсутствовать.\n\n### Процессорное сродство\n\nОС может переносить поток между ядрами:\n\n```text\nсначала поток выполнялся на CPU 1\n→ затем на CPU 4\n```\n\nЭто помогает балансировать нагрузку, но может ухудшать кеш-локальность.\n\nМожно задать affinity — ограничить поток или процесс определёнными CPU:\n\n```text\nпроцесс может выполняться только на CPU 0–3\n```\n\nТогда даже при наличии 16 логических CPU он сможет одновременно использовать максимум четыре из них.\n\nОграничения также могут задаваться контейнерами и cgroups.\n\n### Python и GIL\n\nВ обычной сборке CPython наличие множества потоков не означает параллельное выполнение Python-кода.\n\n```python\nfrom threading import Thread\n```\n\nПри наличии GIL только один поток конкретного интерпретатора одновременно исполняет Python-байткод:\n\n```text\n8 ядер\n8 Python CPU-bound threads\n→ обычно Python-байткод выполняет один поток за раз\n```\n\nПотоки периодически получают GIL по очереди, поэтому CPU-bound Python-код обычно не ускоряется и может даже замедлиться.\n\nПри этом потоки полезны для I/O:\n\n```text\nпоток вызывает сетевое или файловое ожидание\n→ CPython освобождает GIL\n→ другой поток может исполнять Python-код\n```\n\nДля настоящего параллелизма CPU-bound Python-кода традиционно используют:\n\n```text\nmultiprocessing\nProcessPoolExecutor\nнативные библиотеки, освобождающие GIL\nNumPy / C / Rust / Cython\n```\n\nУ разных процессов собственные интерпретаторы и собственные GIL:\n\n```text\n8 процессов\n→ могут выполняться на 8 ядрах параллельно\n```\n\n### Asyncio\n\nКорутины `asyncio` не являются потоками ОС:\n\n```text\n1000 корутин\n→ могут выполняться в одном потоке\n→ на одном логическом CPU\n```\n\nВо время `await` одна корутина приостанавливается, и event loop запускает другую:\n\n```text\nкорутина A → ждёт сеть\nкорутина B → выполняется\nкорутина C → ждёт БД\n```\n\nЭто обеспечивает высокую конкурентность для I/O, но не параллелизм CPU-bound вычислений.\n\n### Практический пример\n\nКомпьютер:\n\n```text\n4 физических ядра\n8 логических CPU\n```\n\n#### Один CPU-bound поток\n\n```text\nодновременно выполняется: 1\nзадействовано логических CPU: примерно 1\n```\n\n#### Восемь CPU-bound нативных потоков\n\n```text\nодновременно может выполняться: до 8\n```\n\nНо они делят четыре физических ядра через SMT.\n\n#### Сто CPU-bound потоков\n\n```text\nодновременно: до 8\nостальные: ждут планировщика\n```\n\n#### Сто потоков, большинство ждут сеть\n\n```text\nсуществуют: 100\nодновременно вычисляются: обычно значительно меньше 8\nостальные: waiting\n```\n\n#### Сто корутин asyncio в одном потоке\n\n```text\nконкурентно обрабатываются: 100\nPython-код одновременно исполняется: одной корутиной\nиспользуется: обычно один логический CPU\n```\n\n### Итог\n\n```text\nМаксимальное аппаратное параллельное выполнение\n≈ число доступных логических CPU\n\nПрограммных потоков\nможет быть намного больше\n\nЛишние runnable CPU-bound потоки\n→ делят процессорное время\n→ не увеличивают число одновременно исполняемых инструкций\n→ создают расходы на переключения\n\nI/O-bound потоков\nможет быть больше числа ядер,\nпотому что большинство из них ждёт\n\nВ CPython с GIL\nCPU-bound Python-потоки обычно не выполняют байткод параллельно\n```\n\nТо есть число ядер ограничивает не количество созданных потоков, а **количество потоков, которые могут физически исполняться в один момент времени**."
