  id = 9
  question = "Чем отличаются временная и пространственная сложность?"
  answer = "### Основное различие\n\n**Временная сложность** показывает, как растёт количество работы алгоритма при увеличении входных данных.\n\n**Пространственная сложность** показывает, как растёт объём памяти, необходимой алгоритму.\n\n```text\nВременная сложность\n→ сколько операций выполняется\n\nПространственная сложность\n→ сколько памяти используется\n```\n\nОбе обычно выражаются через размер входа `n`:\n\n```text\nO(1)\nO(log n)\nO(n)\nO(n²)\n...\n```\n\nНо описывают разные ресурсы.\n\n### Пример: сумма элементов\n\n```python\ndef calculate_sum(numbers: list[int]) -> int:\n    total = 0\n\n    for number in numbers:\n        total += number\n\n    return total\n```\n\nДля списка из `n` элементов функция проходит по каждому элементу:\n\n```text\nВремя: O(n)\n```\n\nДополнительно она хранит только переменную `total` и текущий `number`:\n\n```text\nДополнительная память: O(1)\n```\n\nИтого:\n\n```text\nвременная сложность:     O(n)\nпространственная:        O(1)\n```\n\n### Что именно считается памятью\n\nАлгоритм может использовать память для:\n\n- новых списков, словарей и множеств;\n    \n- временных переменных;\n    \n- стека рекурсивных вызовов;\n    \n- кеша и мемоизации;\n    \n- вспомогательных буферов;\n    \n- копий входных данных.\n    \n\nЧасто отдельно оценивают **дополнительную память** — память, созданную алгоритмом сверх уже существующих входных данных.\n\nНапример, сам список `numbers` занимает `O(n)`, но функция выше его не создаёт. Поэтому её дополнительная пространственная сложность — `O(1)`.\n\n### Пример с созданием нового списка\n\n```python\ndef double_values(numbers: list[int]) -> list[int]:\n    result = []\n\n    for number in numbers:\n        result.append(number * 2)\n\n    return result\n```\n\nФункция проходит по всем элементам:\n\n```text\nВремя: O(n)\n```\n\nИ создаёт новый список из `n` элементов:\n\n```text\nДополнительная память: O(n)\n```\n\nИтого:\n\n```text\nвременная сложность:     O(n)\nпространственная:        O(n)\n```\n\n### Генератор вместо списка\n\n```python\nfrom collections.abc import Iterator\n\n\ndef double_values(numbers: list[int]) -> Iterator[int]:\n    for number in numbers:\n        yield number * 2\n```\n\nЕсли результаты обрабатываются постепенно и не собираются затем в список:\n\n```text\nВремя: O(n)\nПамять: O(1)\n```\n\nГенератор не хранит сразу все `n` результатов.\n\nНо это не уменьшает общий объём вычислений: каждый элемент всё равно нужно обработать.\n\n### Пример поиска дубликатов\n\nВариант без дополнительной структуры:\n\n```python\ndef contains_duplicate(numbers: list[int]) -> bool:\n    for i in range(len(numbers)):\n        for j in range(i + 1, len(numbers)):\n            if numbers[i] == numbers[j]:\n                return True\n\n    return False\n```\n\nСравниваются пары элементов:\n\n```text\nВремя: O(n²)\nПамять: O(1)\n```\n\nБыстрый вариант с множеством:\n\n```python\ndef contains_duplicate(numbers: list[int]) -> bool:\n    seen: set[int] = set()\n\n    for number in numbers:\n        if number in seen:\n            return True\n\n        seen.add(number)\n\n    return False\n```\n\nТеперь:\n\n```text\nВремя: O(n) в среднем\nПамять: O(n)\n```\n\nЭто пример компромисса:\n\n```text\nиспользовали больше памяти\n→ получили меньше времени выполнения\n```\n\n### Time-space trade-off\n\nЧасто один ресурс можно сэкономить за счёт другого.\n\n#### Больше памяти, меньше времени\n\n```text\nмножество для быстрого поиска\nсловарь с предварительно рассчитанными значениями\nкеширование\nмемоизация\nиндекс базы данных\n```\n\nНапример:\n\n```python\nuser_by_id = {\n    user.id: user\n    for user in users\n}\n```\n\nПостроение словаря требует `O(n)` памяти, зато последующий поиск пользователя выполняется в среднем за `O(1)`, а не `O(n)`.\n\n#### Меньше памяти, больше времени\n\nМожно не хранить промежуточные результаты, а вычислять их заново:\n\n```text\nнет кеша\n→ меньше памяти\n→ повторные вычисления\n```\n\nИли использовать потоковую обработку вместо загрузки всего файла:\n\n```python\nwith open(\"payments.csv\") as file:\n    for line in file:\n        process(line)\n```\n\nПамять остаётся почти постоянной, хотя весь файл всё равно последовательно обрабатывается.\n\n### Рекурсия и память\n\nРассмотрим рекурсивный факториал:\n\n```python\ndef factorial(n: int) -> int:\n    if n <= 1:\n        return 1\n\n    return n * factorial(n - 1)\n```\n\nКоличество вызовов:\n\n```text\nВремя: O(n)\n```\n\nОдновременно в стеке сохраняется до `n` вызовов:\n\n```text\nПамять: O(n)\n```\n\nИтеративный вариант:\n\n```python\ndef factorial(n: int) -> int:\n    result = 1\n\n    for value in range(2, n + 1):\n        result *= value\n\n    return result\n```\n\nТеперь:\n\n```text\nВремя: O(n)\nПамять: O(1)\n```\n\nАсимптотическое время не изменилось, но потребление дополнительной памяти уменьшилось.\n\n### Сортировка\n\nРазные алгоритмы могут иметь одинаковую временную, но разную пространственную сложность.\n\nНапример:\n\n```text\nMerge sort:\nвремя  → O(n log n)\nпамять → обычно O(n)\n\nHeap sort:\nвремя  → O(n log n)\nпамять → O(1) дополнительной памяти\n```\n\nПри этом на практике важны также константы, кеш-локальность и свойства конкретной реализации.\n\n### Пространственная сложность не равна размеру результата\n\nИногда результат сам по себе требует `O(n)` памяти:\n\n```python\ndef copy_positive(numbers: list[int]) -> list[int]:\n    return [\n        number\n        for number in numbers\n        if number > 0\n    ]\n```\n\nВ худшем случае возвращается список из `n` элементов.\n\nМожно говорить:\n\n```text\nобщая память результата: O(n)\n```\n\nНо некоторые анализы разделяют:\n\n```text\nпамять результата\nи\nвспомогательную память алгоритма\n```\n\nВспомогательная память здесь может считаться `O(1)` сверх создаваемого результата. Поэтому при обсуждении желательно уточнять, учитывается ли выходная структура.\n\n### Сложность и фактические ресурсы\n\n`O(n)` не означает конкретное число секунд или мегабайт.\n\nДва алгоритма с пространственной сложностью `O(n)` могут хранить:\n\n```text\nпервый  → один байт на элемент\nвторой  → большой Python-объект на элемент\n```\n\nА два алгоритма с временной сложностью `O(n)` могут выполнять на каждой итерации:\n\n```text\nпервый  → одно сложение\nвторой  → HTTP-запрос\n```\n\nАсимптотика показывает характер роста, но не точную стоимость.\n\n### Краткое сравнение\n\n|Характеристика|Временная сложность|Пространственная сложность|\n|---|---|---|\n|Что измеряет|Рост количества работы|Рост используемой памяти|\n|Основной ресурс|CPU-время, операции|RAM, stack, структуры данных|\n|Типичный вопрос|Сколько элементов обработаем?|Сколько данных храним одновременно?|\n|Пример|Один проход — `O(n)`|Новый список — `O(n)`|\n|Оптимизация|Меньше вычислений|Меньше копий и промежуточных данных|\n\n### Итог\n\n```text\nВременная сложность:\nкак растёт количество выполняемых операций\n\nПространственная сложность:\nкак растёт объём необходимой памяти\n```\n\nОдин алгоритм может иметь:\n\n```text\nO(n) времени и O(1) памяти\nO(n) времени и O(n) памяти\nO(n²) времени и O(1) памяти\n```\n\nПоэтому временную и пространственную сложность всегда оценивают отдельно. На практике часто приходится выбирать компромисс: **потратить дополнительную память, чтобы сократить вычисления, либо экономить память ценой повторной работы**."
