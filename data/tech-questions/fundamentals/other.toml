  answer = "### Сложность бинарного поиска\r\n\r\nДля массива из `n` элементов:\r\n\r\n```text\r\nЛучший случай:   O(1)\r\nСредний случай:  O(log n)\r\nХудший случай:   O(log n)\r\n```\r\n\r\nНа каждом шаге бинарный поиск уменьшает область поиска примерно вдвое:\r\n\r\n```text\r\nn → n/2 → n/4 → n/8 → ... → 1\r\n```\r\n\r\nКоличество таких делений равно примерно:\r\n\r\n```text\r\nlog₂(n)\r\n```\r\n\r\nНапример:\r\n\r\n```text\r\n1 000 элементов     → около 10 шагов\r\n1 000 000 элементов → около 20 шагов\r\n1 000 000 000       → около 30 шагов\r\n```\r\n\r\nЛучший случай — `O(1)`, когда искомое значение сразу находится посередине.\r\n\r\n### Пространственная сложность\r\n\r\nИтеративная реализация:\r\n\r\n```python\r\ndef binary_search(items: list[int], target: int) -> int | None:\r\n    left = 0\r\n    right = len(items) - 1\r\n\r\n    while left <= right:\r\n        middle = (left + right) // 2\r\n\r\n        if items[middle] == target:\r\n            return middle\r\n\r\n        if items[middle] < target:\r\n            left = middle + 1\r\n        else:\r\n            right = middle - 1\r\n\r\n    return None\r\n```\r\n\r\nИспользует несколько переменных:\r\n\r\n```text\r\nПамять: O(1)\r\n```\r\n\r\nРекурсивная реализация создаёт стек вызовов:\r\n\r\n```text\r\nПамять: O(log n)\r\n```\r\n\r\n### Важное условие\r\n\r\nБинарный поиск требует, чтобы данные были **отсортированы** и поддерживали быстрый доступ к среднему элементу.\r\n\r\nЕсли массив сначала нужно отсортировать:\r\n\r\n```text\r\nсортировка: O(n log n)\r\nпоиск:      O(log n)\r\n\r\nитого:      O(n log n)\r\n```\r\n\r\nДля одного поиска предварительная сортировка может быть невыгодной. Для множества поисков сортировка один раз и последующие бинарные поиски часто оправданы.\r"
  popularity = 2.63

[[questions]]
  id = 11
  question = "Какая асимптотическая сложность тернарного поиска?"
  answer = "### Сложность тернарного поиска\n\nЗависит от того, какой именно вариант тернарного поиска рассматривается, но в обоих основных случаях временная сложность:\n\n```text\nO(log n)\n```\n\n### Поиск элемента в отсортированном массиве\n\nДиапазон делится на три части с помощью двух точек:\n\n```text\n[left ... mid1 ... mid2 ... right]\n```\n\nПосле сравнений поиск продолжается только в одной из трёх частей:\n\n```text\nn → n/3 → n/9 → n/27 → ... → 1\n```\n\nРекуррентная оценка:\n\n```text\nT(n) = T(n / 3) + O(1)\n```\n\nКоличество шагов:\n\n```text\nlog₃(n)\n```\n\nПоэтому:\n\n```text\nлучший случай:  O(1)\nсредний случай: O(log n)\nхудший случай:  O(log n)\n```\n\nОснование логарифма в Big O не имеет значения:\n\n```text\nO(log₃ n) = O(log₂ n) = O(log n)\n```\n\n### Сравнение с бинарным поиском\n\nБинарный поиск:\n\n```text\nn → n/2\n```\n\nТернарный поиск:\n\n```text\nn → n/3\n```\n\nМожет показаться, что тернарный поиск быстрее, но на каждой итерации ему обычно требуется больше сравнений:\n\n```text\nБинарный поиск:\n→ одна средняя точка\n→ обычно одно-два сравнения\n\nТернарный поиск:\n→ две средние точки\n→ больше сравнений\n```\n\nПоэтому при поиске элемента в отсортированном массиве бинарный поиск обычно эффективнее на практике, хотя асимптотика у них одинаковая:\n\n```text\nбинарный поиск:  O(log n)\nтернарный поиск: O(log n)\n```\n\n### Поиск экстремума унимодальной функции\n\nТернарный поиск также используют для поиска максимума или минимума функции, которая сначала монотонно растёт, а потом убывает, либо наоборот.\n\nНа каждой итерации отбрасывается примерно треть диапазона, а остаётся около двух третей:\n\n```text\nn → 2n/3 → 4n/9 → ...\n```\n\nРекуррентная оценка:\n\n```text\nT(n) = T(2n / 3) + O(1)\n```\n\nОна также даёт:\n\n```text\nO(log n)\n```\n\nДля непрерывного диапазона поиск выполняют до достижения точности `ε`:\n\n```text\nO(log((right - left) / ε))\n```\n\n### Пространственная сложность\n\nИтеративная реализация:\n\n```text\nO(1)\n```\n\nРекурсивная реализация:\n\n```text\nO(log n)\n```\n\nиз-за стека рекурсивных вызовов.\n\n### Итог\n\n```text\nТернарный поиск элемента:\nвремя  → O(log n)\nпамять → O(1) итеративно\n\nТернарный поиск экстремума:\nвремя  → O(log n)\nили O(log((r - l) / ε)) для вещественного диапазона\n```\n\nДля обычного поиска в отсортированном массиве бинарный поиск обычно предпочтительнее. Тернарный поиск чаще применяют для нахождения экстремума унимодальной функции."
  popularity = 2.63

