[[questions]]
  id = 18
  question = "Какие библиотеки используют для логирования в Python"
  answer = "### Сначала разделим уровни\n\nПод инструментами логирования могут подразумеваться разные вещи:\n\n```text\nPython-приложение\n→ создаёт log records\n\nФорматтер\n→ превращает их в текст или JSON\n\nКоллектор\n→ забирает логи с серверов и контейнеров\n\nХранилище\n→ сохраняет и индексирует\n\nИнтерфейс\n→ позволяет искать, фильтровать и строить графики\n```\n\nПоэтому `logging`, Fluent Bit и Grafana Loki решают разные части одной задачи.\n\n### `logging` — стандартная библиотека Python\n\nОсновной встроенный инструмент:\n\n```python\nimport logging\n\nlogger = logging.getLogger(__name__)\n\n\ndef create_payment(payment_id: int) -> None:\n    logger.info(\n        \"Payment created\",\n        extra={\"payment_id\": payment_id},\n    )\n```\n\nВ `logging` есть четыре основных компонента:\n\n```text\nLogger\n→ создаёт запись\n\nHandler\n→ отправляет запись в консоль, файл, syslog и т. д.\n\nFormatter\n→ определяет формат вывода\n\nFilter\n→ решает, какие записи пропускать\n```\n\nСтандартный модуль поддерживает иерархические логгеры и хорошо интегрируется с логами сторонних Python-библиотек. Для модулей рекомендуется создавать логгер через `logging.getLogger(__name__)`. \n\nПростая настройка:\n\n```python\nimport logging\n\nlogging.basicConfig(\n    level=logging.INFO,\n    format=(\n        \"%(asctime)s \"\n        \"%(levelname)s \"\n        \"%(name)s \"\n        \"%(message)s\"\n    ),\n)\n\nlogger = logging.getLogger(__name__)\n\nlogger.info(\"Application started\")\n```\n\nДля большого приложения обычно применяют `logging.config.dictConfig()`, а не разбросанные по коду вызовы `basicConfig()`.\n\n### Обработчики `logging.handlers`\n\nСтандартная библиотека содержит готовые способы доставки логов:\n\n```text\nStreamHandler\n→ stdout или stderr\n\nFileHandler\n→ файл\n\nRotatingFileHandler\n→ файл с ротацией по размеру\n\nTimedRotatingFileHandler\n→ ротация по времени\n\nSysLogHandler\n→ локальный или удалённый syslog\n\nHTTPHandler\n→ отправка по HTTP\n\nQueueHandler\n→ запись через очередь\n\nSMTPHandler\n→ отправка критичных записей по email\n```\n\n`RotatingFileHandler` и `TimedRotatingFileHandler` поддерживают ротацию файлов, а `QueueHandler` позволяет вынести непосредственную запись логов из рабочего потока приложения. \n\nПример ротации:\n\n```python\nimport logging\nfrom logging.handlers import RotatingFileHandler\n\nlogger = logging.getLogger(\"app\")\nlogger.setLevel(logging.INFO)\n\nhandler = RotatingFileHandler(\n    \"app.log\",\n    maxBytes=10 * 1024 * 1024,\n    backupCount=5,\n)\n\nlogger.addHandler(handler)\n```\n\n### `structlog`\n\n`structlog` предназначен прежде всего для **структурированного логирования**.\n\nВместо неструктурированной строки:\n\n```text\nUser 42 created order 1001\n```\n\nзаписываются отдельные поля:\n\n```json\n{\n  \"event\": \"order_created\",\n  \"user_id\": 42,\n  \"order_id\": 1001\n}\n```\n\nПример:\n\n```python\nimport structlog\n\nlogger = structlog.get_logger()\n\nlogger.info(\n    \"order_created\",\n    user_id=42,\n    order_id=1001,\n    amount=150,\n)\n```\n\n`structlog` поддерживает JSON, logfmt, удобный консольный вывод, contextual values и может работать поверх стандартного `logging`. ([structlog](https://www.structlog.org/en/stable/index.html?utm_source=chatgpt.com \"structlog — structlog 26.1.0 documentation\"))\n\nОн особенно удобен для:\n\n- FastAPI и микросервисов;\n    \n- JSON-логов;\n    \n- добавления `request_id`, `user_id`, `trace_id`;\n    \n- централизованной обработки событий;\n    \n- приложений с `asyncio` и `contextvars`.\n    \n\nПример контекста:\n\n```python\nlogger = structlog.get_logger().bind(\n    request_id=\"req-123\",\n    user_id=42,\n)\n\nlogger.info(\"request_started\")\nlogger.info(\"payment_created\", payment_id=1001)\n```\n\nВсе записи получат связанный контекст.\n\n### `Loguru`\n\n`Loguru` предоставляет готовый глобальный логгер и упрощает настройку:\n\n```python\nfrom loguru import logger\n\nlogger.info(\"Application started\")\nlogger.warning(\"Low disk space\")\nlogger.exception(\"Request failed\")\n```\n\nДобавление файла:\n\n```python\nfrom loguru import logger\n\nlogger.add(\n    \"logs/app.log\",\n    rotation=\"100 MB\",\n    retention=\"14 days\",\n    compression=\"zip\",\n)\n\nlogger.info(\"Server started\")\n```\n\nLoguru поддерживает sinks, ротацию, retention, сжатие, contextual values, красивый вывод исключений и совместимость со стандартным `logging`. \n\nОн удобен для:\n\n```text\nнебольших приложений\nCLI\nскриптов\nбыстрого старта\nпроектов, где хочется меньше конфигурации\n```\n\nДля библиотек, которые должны встраиваться в чужие приложения, обычно безопаснее использовать стандартный `logging`, поскольку пользователь библиотеки сам управляет его конфигурацией.\n\n### `python-json-logger`\n\nЭто JSON-форматтер для стандартного `logging`.\n\n```python\nimport logging\n\nfrom pythonjsonlogger.json import JsonFormatter\n\nlogger = logging.getLogger(__name__)\nlogger.setLevel(logging.INFO)\n\nhandler = logging.StreamHandler()\nhandler.setFormatter(JsonFormatter())\n\nlogger.addHandler(handler)\n\nlogger.info(\n    \"payment_created\",\n    extra={\n        \"payment_id\": 1001,\n        \"user_id\": 42,\n    },\n)\n```\n\nРезультат:\n\n```json\n{\n  \"message\": \"payment_created\",\n  \"payment_id\": 1001,\n  \"user_id\": 42\n}\n```\n\nБиблиотека позволяет оставить стандартную архитектуру `logging`, но выводить машиночитаемый JSON для последующей обработки коллекторами и системами агрегации. \n\nЭто хороший вариант, когда не нужны все возможности `structlog`:\n\n```text\nlogging\n+ python-json-logger\n→ структурированные JSON-логи\n```\n\n### OpenTelemetry\n\nOpenTelemetry используется, когда логи нужно связать с другими сигналами наблюдаемости:\n\n```text\nlogs\nmetrics\ntraces\n```\n\nВ запись можно добавить:\n\n```text\ntrace_id\nspan_id\nservice.name\nservice.version\ndeployment.environment\n```\n\nТогда ошибка в логе связывается с конкретным распределённым trace:\n\n```text\nHTTP request\n→ Order Service\n→ Payment Service\n→ PostgreSQL\n```\n\nOpenTelemetry Python предоставляет API, SDK, инструментацию и exporters для сбора и передачи логов, метрик и трассировок.\n\nOpenTelemetry не обязательно заменяет `logging` или `structlog`. Частая схема:\n\n```text\nlogging / structlog\n→ OpenTelemetry integration\n→ OTLP\n→ OpenTelemetry Collector\n→ Loki / Elastic / облачная система\n```\n\n### Sentry\n\nSentry используют главным образом для:\n\n- сбора необработанных исключений;\n    \n- группировки одинаковых ошибок;\n    \n- stack trace;\n    \n- контекста пользователя и запроса;\n    \n- уведомлений об ошибках;\n    \n- связи ошибок с производительностью и логами.\n    \n\nSentry SDK может интегрироваться со стандартным `logging` и перехватывать записи заданных уровней. \n\n```python\nimport logging\n\nimport sentry_sdk\n\nsentry_sdk.init(\n    dsn=\"...\",\n    enable_logs=True,\n)\n\nlogger = logging.getLogger(__name__)\n\nlogger.error(\n    \"Payment provider unavailable\",\n    extra={\"provider\": \"bank\"},\n)\n```\n\nSentry полезен не как полная замена централизованного хранилища логов, а как специализированный инструмент поиска и расследования ошибок.\n\n### Коллекторы логов\n\nPython-приложение обычно не должно самостоятельно отправлять каждую запись напрямую в Loki или Elasticsearch.\n\nЧаще применяется:\n\n```text\nPython\n→ stdout или файл\n→ collector\n→ централизованное хранилище\n```\n\n#### Fluent Bit\n\nЛёгкий коллектор и процессор логов:\n\n```text\nчитает stdout, файлы, journald\n→ парсит и обогащает записи\n→ отправляет их в Loki, Elastic, OpenTelemetry и другие системы\n```\n\nFluent Bit может собирать, обрабатывать и перенаправлять логи, включая отправку через OTLP. \n\n#### Filebeat\n\nАгент экосистемы Elastic. Он следит за файлами и другими источниками логов, собирает события и отправляет их в Elasticsearch или Logstash. \n\n#### Logstash\n\nБолее тяжёлый процессор данных с pipeline:\n\n```text\ninput\n→ filters\n→ output\n```\n\nИспользуется, когда нужны сложный парсинг, преобразование, обогащение и маршрутизация логов. \n\n### Хранилища и интерфейсы\n\n#### Grafana Loki + Grafana\n\n```text\nFluent Bit / Alloy / OpenTelemetry Collector\n→ Loki\n→ Grafana\n```\n\nLoki хранит логовые потоки и индексирует главным образом их labels. Для запросов используется LogQL, а Grafana предоставляет поиск, Explore и dashboards. \n\nЧасто выбирается, если уже используется:\n\n```text\nPrometheus\nGrafana\nOpenTelemetry\n```\n\n#### Elastic Stack\n\nТипичная цепочка:\n\n```text\nFilebeat\n→ Logstash\n→ Elasticsearch\n→ Kibana\n```\n\nElasticsearch хранит и индексирует события, а Kibana позволяет искать и анализировать логи. Filebeat может отправлять записи непосредственно в Elasticsearch либо через Logstash. \n\n### Что выбрать для FastAPI\n\nРазумная production-схема:\n\n```text\nFastAPI\n→ logging или structlog\n→ JSON в stdout\n→ Fluent Bit / OpenTelemetry Collector\n→ Loki + Grafana\n```\n\nДополнительно:\n\n```text\nSentry\n→ исключения и error tracking\n\nOpenTelemetry\n→ trace_id и связь логов с трассировкой\n```\n\nПрактический выбор:\n\n|Сценарий|Инструменты|\n|---|---|\n|Небольшой скрипт|`logging` или Loguru|\n|Обычный Python-backend|`logging`|\n|JSON без сложной инфраструктуры|`logging` + `python-json-logger`|\n|Структурированные логи с контекстом|`structlog`|\n|Простая удобная настройка файлов|Loguru|\n|Ошибки и stack traces|Sentry|\n|Связь логов с traces|OpenTelemetry|\n|Сбор контейнерных логов|Fluent Bit|\n|Elastic-инфраструктура|Filebeat + Logstash + Elasticsearch + Kibana|\n|Grafana-инфраструктура|Fluent Bit/Alloy + Loki + Grafana|\n\n### Итог\n\nНа уровне Python чаще всего используют:\n\n```text\nlogging\nstructlog\nLoguru\npython-json-logger\nOpenTelemetry SDK\nSentry SDK\n```\n\nНа уровне инфраструктуры:\n\n```text\nFluent Bit\nFilebeat\nLogstash\nOpenTelemetry Collector\nLoki + Grafana\nElasticsearch + Kibana\n```\n\nДля большинства backend-проектов хорошая начальная архитектура:\n\n```text\nстандартный logging\n+ структурированный JSON\n+ stdout\n+ централизованный collector\n+ Loki или Elastic\n+ Sentry для исключений\n```"
