  id = 12
  question = "Как определить Big On (Сложность) функции?"
  answer = "### Что именно нужно определить\n\nЧтобы определить **Big O функции**, нужно понять, как количество выполняемых операций растёт относительно размера входных данных `n`.\n\nНапример:\n\n```python\ndef calculate_sum(numbers: list[int]) -> int:\n    total = 0\n\n    for number in numbers:\n        total += number\n\n    return total\n```\n\nЗдесь:\n\n```text\nn = количество элементов numbers\n```\n\nЦикл выполняется `n` раз, поэтому временная сложность:\n\n```text\nO(n)\n```\n\n### Общий алгоритм анализа\n\nОбычно действуют так:\n\n```text\n1. Определить размер входа\n2. Найти операции, зависящие от размера входа\n3. Определить число их повторений\n4. Учесть сложность вложенных операций\n5. Сложить последовательные участки\n6. Для ветвлений взять наиболее дорогой путь\n7. Убрать константы и члены меньшего порядка\n```\n\n### 1. Определить, что такое `n`\n\nРазмер входа зависит от функции.\n\n```python\ndef process_users(users: list[User]) -> None:\n    ...\n```\n\nЗдесь:\n\n```text\nn = количество пользователей\n```\n\nДля двух коллекций могут быть разные размеры:\n\n```python\ndef match_users_and_orders(\n    users: list[User],\n    orders: list[Order],\n) -> None:\n    ...\n```\n\nЗдесь:\n\n```text\nn = количество пользователей\nm = количество заказов\n```\n\nНе нужно автоматически называть оба размера `n`.\n\n### 2. Определить стоимость отдельных операций\n\nПростые операции обычно считают `O(1)`:\n\n```python\nvalue = numbers[5]\ntotal += value\nx = a + b\nreturn result\n```\n\nНо вызов функции или операция над коллекцией могут иметь другую сложность:\n\n```python\nvalue in some_list    # O(n)\nvalue in some_set     # O(1) в среднем\nsorted(items)         # O(n log n)\nitems.copy()          # O(n)\n```\n\nПоэтому нельзя анализировать только количество строк.\n\n### Константная сложность\n\n```python\ndef get_first(numbers: list[int]) -> int:\n    return numbers[0]\n```\n\nРазмер списка не влияет на число операций:\n\n```text\nT(n) = 1\nO(1)\n```\n\n### Один цикл\n\n```python\ndef print_numbers(numbers: list[int]) -> None:\n    for number in numbers:\n        print(number)\n```\n\nТело цикла выполняется `n` раз:\n\n```text\nT(n) = n\nO(n)\n```\n\nЕсли внутри цикла выполняется несколько постоянных операций:\n\n```python\ndef process(numbers: list[int]) -> None:\n    for number in numbers:\n        x = number * 2\n        y = x + 10\n        print(y)\n```\n\nПолучается примерно:\n\n```text\nT(n) = 3n\n```\n\nНо коэффициент отбрасывается:\n\n```text\nO(3n) = O(n)\n```\n\n### Последовательные циклы\n\n```python\ndef process(numbers: list[int]) -> None:\n    for number in numbers:\n        print(number)\n\n    for number in numbers:\n        save(number)\n```\n\nПервый цикл — `O(n)`, второй — `O(n)`:\n\n```text\nO(n) + O(n)\n= O(2n)\n= O(n)\n```\n\nПоследовательные участки складываются.\n\n### Вложенные циклы\n\n```python\ndef print_pairs(numbers: list[int]) -> None:\n    for first in numbers:\n        for second in numbers:\n            print(first, second)\n```\n\nВнешний цикл выполняется `n` раз. Для каждой его итерации внутренний также выполняется `n` раз:\n\n```text\nn × n = n²\n```\n\nИтого:\n\n```text\nO(n²)\n```\n\nДля трёх полных вложенных циклов:\n\n```text\nO(n³)\n```\n\n### Вложенные циклы по разным коллекциям\n\n```python\ndef match(\n    users: list[User],\n    orders: list[Order],\n) -> None:\n    for user in users:\n        for order in orders:\n            if user.id == order.user_id:\n                ...\n```\n\nЕсли пользователей `n`, а заказов `m`:\n\n```text\nO(n × m)\n```\n\nЭто не обязательно `O(n²)`.\n\n### Не каждый вложенный цикл означает `O(n²)`\n\n```python\ndef process_groups(groups: list[list[int]]) -> None:\n    for group in groups:\n        for item in group:\n            print(item)\n```\n\nЕсли суммарно во всех группах находится `n` элементов, каждый элемент обрабатывается один раз:\n\n```text\nO(n)\n```\n\nНужно считать фактическое число итераций, а не просто уровни отступов.\n\n### Цикл, уменьшающий данные в несколько раз\n\n```python\ndef divide_until_one(n: int) -> None:\n    while n > 1:\n        n //= 2\n```\n\nЗначение изменяется так:\n\n```text\nn → n/2 → n/4 → n/8 → ... → 1\n```\n\nКоличество итераций:\n\n```text\nlog₂ n\n```\n\nСледовательно:\n\n```text\nO(log n)\n```\n\nПодобная логика используется в бинарном поиске.\n\n### Линейный цикл с логарифмической операцией\n\n```python\ndef process(numbers: list[int]) -> None:\n    for number in numbers:\n        binary_search(sorted_values, number)\n```\n\nЦикл выполняется `n` раз, бинарный поиск — `O(log m)`:\n\n```text\nO(n × log m)\n```\n\nЕсли размер обеих коллекций обозначается одним `n`:\n\n```text\nO(n log n)\n```\n\n### Условия\n\n```python\ndef process(numbers: list[int], full: bool) -> None:\n    if full:\n        for first in numbers:\n            for second in numbers:\n                print(first, second)\n    else:\n        for number in numbers:\n            print(number)\n```\n\nВетки имеют сложности:\n\n```text\nif:   O(n²)\nelse: O(n)\n```\n\nДля худшего случая берётся наиболее дорогая ветка:\n\n```text\nO(n²)\n```\n\nСамо условие `if` обычно стоит `O(1)`, но код внутри веток может иметь любую сложность.\n\n### Ранний `return`\n\n```python\ndef contains(\n    numbers: list[int],\n    target: int,\n) -> bool:\n    for number in numbers:\n        if number == target:\n            return True\n\n    return False\n```\n\nСложность зависит от случая:\n\n```text\nЛучший случай:\nэлемент первый → O(1)\n\nХудший случай:\nэлемент последний или отсутствует → O(n)\n\nСредний случай:\nO(n)\n```\n\nКогда просто спрашивают Big O, обычно называют худший случай:\n\n```text\nO(n)\n```\n\n### Вызовы других функций\n\n```python\ndef process(numbers: list[int]) -> list[int]:\n    result = normalize(numbers)\n    return sorted(result)\n```\n\nНужно знать сложность вызываемых операций.\n\nДопустим:\n\n```text\nnormalize(numbers) → O(n)\nsorted(result)     → O(n log n)\n```\n\nТогда:\n\n```text\nO(n) + O(n log n)\n= O(n log n)\n```\n\nДоминирует более быстро растущий член.\n\n### Встроенные операции Python\n\nПри анализе важно учитывать их стоимость.\n\n|Операция|Средняя сложность|\n|---|--:|\n|`items[index]`|`O(1)`|\n|`items.append(x)`|амортизированно `O(1)`|\n|`items.pop()`|`O(1)`|\n|`items.pop(0)`|`O(n)`|\n|`x in list`|`O(n)`|\n|`x in set`|`O(1)`|\n|`key in dict`|`O(1)`|\n|`list.copy()`|`O(n)`|\n|`items[a:b]`|`O(k)`|\n|`sorted(items)`|`O(n log n)`|\n|`min(items)`|`O(n)`|\n|`sum(items)`|`O(n)`|\n\nЗдесь `k` — размер среза.\n\n### Распространённая ошибка с `in`\n\n```python\ndef common_items(\n    first: list[int],\n    second: list[int],\n) -> list[int]:\n    result = []\n\n    for item in first:\n        if item in second:\n            result.append(item)\n\n    return result\n```\n\nПусть:\n\n```text\nlen(first) = n\nlen(second) = m\n```\n\nЦикл выполняется `n` раз. Поиск в списке `second` стоит `O(m)`:\n\n```text\nO(n × m)\n```\n\nЕсли размеры одинаковые:\n\n```text\nO(n²)\n```\n\nВариант с множеством:\n\n```python\ndef common_items(\n    first: list[int],\n    second: list[int],\n) -> list[int]:\n    second_set = set(second)\n\n    return [\n        item\n        for item in first\n        if item in second_set\n    ]\n```\n\nПостроение множества:\n\n```text\nO(m)\n```\n\nОбход первого списка:\n\n```text\nO(n)\n```\n\nПроверка в множестве:\n\n```text\nO(1) в среднем\n```\n\nИтого:\n\n```text\nO(n + m)\n```\n\n### Срезы тоже создают работу\n\n```python\ndef recursive_process(items: list[int]) -> None:\n    if not items:\n        return\n\n    recursive_process(items[1:])\n```\n\nКоличество рекурсивных вызовов — `n`, но на каждом шаге создаётся новый срез:\n\n```text\nn + (n - 1) + (n - 2) + ... + 1\n```\n\nПолучается:\n\n```text\nO(n²)\n```\n\nХотя визуально функция кажется линейно-рекурсивной.\n\n### Рекурсивные функции\n\nДля рекурсии составляют рекуррентное соотношение.\n\n#### Линейная рекурсия\n\n```python\ndef factorial(n: int) -> int:\n    if n <= 1:\n        return 1\n\n    return n * factorial(n - 1)\n```\n\nНа каждом шаге выполняется один рекурсивный вызов:\n\n```text\nT(n) = T(n - 1) + O(1)\n```\n\nИтого:\n\n```text\nO(n)\n```\n\n#### Наивный Фибоначчи\n\n```python\ndef fibonacci(n: int) -> int:\n    if n <= 1:\n        return n\n\n    return fibonacci(n - 1) + fibonacci(n - 2)\n```\n\nОдин вызов порождает два других:\n\n```text\nT(n) = T(n - 1) + T(n - 2) + O(1)\n```\n\nСложность экспоненциальная:\n\n```text\nO(2ⁿ)\n```\n\nБолее точная оценка связана с золотым сечением, но обычно достаточно `O(2ⁿ)`.\n\n#### Разделение задачи пополам\n\n```text\nT(n) = T(n/2) + O(1)\n```\n\nПолучается:\n\n```text\nO(log n)\n```\n\nЕсли создаются две подзадачи половинного размера:\n\n```text\nT(n) = 2T(n/2) + O(n)\n```\n\nПолучается:\n\n```text\nO(n log n)\n```\n\nТак устроена сортировка слиянием.\n\n### Как упрощать итоговое выражение\n\n#### Отбрасывать константы\n\n```text\nO(5n) → O(n)\nO(100) → O(1)\n```\n\n#### Оставлять самый быстро растущий член\n\n```text\nO(n² + n + 100)\n→ O(n²)\n```\n\n```text\nO(n log n + n)\n→ O(n log n)\n```\n\n#### Не объединять независимые размеры без необходимости\n\n```text\nO(n + m)\n```\n\nне следует превращать в `O(n)`, если `n` и `m` — размеры разных входов.\n\n### Пример полного анализа\n\n```python\ndef analyze(\n    users: list[User],\n    blocked_ids: list[int],\n) -> list[User]:\n    blocked_set = set(blocked_ids)\n    result = []\n\n    for user in users:\n        if user.id not in blocked_set:\n            result.append(user)\n\n    result.sort(key=lambda user: user.name)\n\n    return result\n```\n\nПусть:\n\n```text\nn = количество users\nm = количество blocked_ids\n```\n\nРазбираем:\n\n```text\nset(blocked_ids)  → O(m)\nобход users       → O(n)\nпоиск в set       → O(1) в среднем на итерацию\nappend            → O(1) амортизированно\nсортировка        → O(n log n) в худшем случае по размеру результата\n```\n\nСуммируем:\n\n```text\nO(m) + O(n) + O(n log n)\n```\n\nИтог:\n\n```text\nO(m + n log n)\n```\n\nЕсли `m` имеет тот же порядок, что и `n`:\n\n```text\nO(n log n)\n```\n\nДополнительная память:\n\n```text\nblocked_set → O(m)\nresult      → O(n)\n\nИтого: O(n + m)\n```\n\n### Практическая памятка\n\n```text\nОдна операция                     → O(1)\nОдин полный проход                → O(n)\nДва последовательных прохода     → O(n)\nДва полных вложенных прохода     → O(n²)\nДеление диапазона пополам        → O(log n)\nПроход + деление пополам         → O(n log n)\nВсе подмножества                  → O(2ⁿ)\nВсе перестановки                  → O(n!)\n```\n\n### Главное\n\nЧтобы определить сложность функции, не нужно просто считать строки или циклы. Нужно посчитать, **сколько раз выполняется каждая значимая операция в зависимости от размера входа**:\n\n```text\nпоследовательные участки → складываются\nвложенные операции       → перемножаются\nветвления                 → берётся дорогой путь\nрекурсия                  → составляется рекуррентная формула\nконстанты                 → отбрасываются\nмладшие члены             → отбрасываются\n```\n\nФинальный вопрос всегда один:\n\n```text\nКак растёт количество работы,\nкогда размер входа n становится больше?\n```"
  popularity = 2.63

