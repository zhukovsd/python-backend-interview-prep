  question = "Какие инструменты мониторинга применяют для Python-приложений?"
  answer = "### Основные направления мониторинга\n\nДля Python-приложения обычно собирают несколько типов данных:\n\n```text\nМетрики\n→ сколько запросов, ошибок, задач, подключений\n\nЛоги\n→ что конкретно произошло\n\nТрассировки\n→ через какие сервисы и операции прошёл запрос\n\nОшибки\n→ исключения, stack trace, контекст\n\nПрофилирование\n→ где расходуются CPU и память\n\nИнфраструктурные показатели\n→ CPU, RAM, диск, сеть, контейнеры, БД\n```\n\nОдин инструмент редко закрывает всё. Обычно используют несколько взаимосвязанных компонентов.\n\n### Prometheus\n\n**Prometheus** применяется для сбора и хранения числовых метрик во временных рядах.\n\nPython-приложение инструментируется клиентской библиотекой `prometheus-client` и предоставляет endpoint наподобие:\n\n```text\nGET /metrics\n```\n\nPrometheus периодически опрашивает этот endpoint. Клиентские библиотеки поддерживают основные типы метрик: Counter, Gauge, Histogram и Summary. \n\nПример:\n\n```python\nfrom prometheus_client import Counter, Histogram\n\nREQUEST_COUNT = Counter(\n    \"http_requests_total\",\n    \"Total number of HTTP requests\",\n    [\"method\", \"route\", \"status\"],\n)\n\nREQUEST_DURATION = Histogram(\n    \"http_request_duration_seconds\",\n    \"HTTP request duration\",\n    [\"method\", \"route\"],\n)\n```\n\nИспользование:\n\n```python\nfrom time import perf_counter\n\n\ndef process_request() -> None:\n    started_at = perf_counter()\n\n    try:\n        # Обработка запроса\n        REQUEST_COUNT.labels(\n            method=\"POST\",\n            route=\"/payments\",\n            status=\"201\",\n        ).inc()\n    finally:\n        REQUEST_DURATION.labels(\n            method=\"POST\",\n            route=\"/payments\",\n        ).observe(perf_counter() - started_at)\n```\n\nОбычно отслеживают:\n\n```text\nhttp_requests_total\nhttp_request_duration_seconds\nhttp_requests_in_progress\nhttp_errors_total\n\ndatabase_connections_active\ndatabase_query_duration_seconds\n\ncelery_tasks_total\ncelery_task_duration_seconds\ncelery_queue_size\n\nbusiness_operations_total\npayments_failed_total\n```\n\n### Grafana\n\n**Grafana** используется для визуализации метрик, логов и трассировок. В ней создают dashboards, панели, переменные, графики и таблицы. Grafana Alerting позволяет определять правила оповещения по данным из разных источников. \n\nТипичная схема:\n\n```text\nPython\n→ Prometheus\n→ Grafana\n```\n\nНа dashboard можно вывести:\n\n```text\nRPS\np50 / p95 / p99 latency\nдолю ответов 5xx\nколичество активных запросов\nразмер очереди Celery\nиспользование пула соединений\nCPU и память\n```\n\n### Alertmanager\n\n**Alertmanager** принимает срабатывания правил от Prometheus, группирует их, подавляет дубликаты и направляет уведомления соответствующим получателям. \n\nНапример:\n\n```yaml\ngroups:\n  - name: backend\n    rules:\n      - alert: HighErrorRate\n        expr: |\n          rate(http_requests_total{status=~\"5..\"}[5m])\n          /\n          rate(http_requests_total[5m])\n          > 0.05\n        for: 10m\n        labels:\n          severity: critical\n        annotations:\n          summary: \"High HTTP error rate\"\n```\n\nPipeline:\n\n```text\nPrometheus обнаружил проблему\n→ создал alert\n→ Alertmanager получил alert\n→ сгруппировал уведомления\n→ отправил их ответственному получателю\n```\n\n### OpenTelemetry\n\n**OpenTelemetry** предоставляет API, SDK и инструментацию для формирования:\n\n```text\ntraces\nmetrics\nlogs\n```\n\nPython SDK можно использовать для ручной или автоматической инструментации приложения. Телеметрия обычно отправляется по OTLP в OpenTelemetry Collector, который обрабатывает и экспортирует её в выбранный backend. \n\nАрхитектура:\n\n```text\nFastAPI\nPostgreSQL\nRedis\nHTTPX\nCelery\n    │\n    ▼\nOpenTelemetry instrumentation\n    │ OTLP\n    ▼\nOpenTelemetry Collector\n    ├── Prometheus / Mimir\n    ├── Tempo / Jaeger\n    ├── Loki\n    └── облачный APM\n```\n\nОсобенно полезны распределённые трассировки:\n\n```text\nPOST /orders\n    │\n    ├── Order Service: 20 ms\n    ├── PostgreSQL: 15 ms\n    ├── Payment Service: 450 ms\n    │       └── внешний банк: 420 ms\n    └── RabbitMQ publish: 8 ms\n```\n\nПо такой трассе видно, на каком именно участке возникла задержка. Передача trace-контекста между процессами и сервисами позволяет собрать отдельные операции в одну причинно связанную трассу. \n\n### Jaeger и Grafana Tempo\n\nДля хранения и анализа распределённых трассировок используют:\n\n```text\nJaeger\nGrafana Tempo\nZipkin\n```\n\nOpenTelemetry может экспортировать данные в эти и другие совместимые backends. Grafana Tempo представляет собой специализированный backend распределённой трассировки и интегрируется с Grafana. \n\nТипичная Grafana-система:\n\n```text\nPrometheus или Mimir\n→ метрики\n\nLoki\n→ логи\n\nTempo\n→ трассировки\n\nGrafana\n→ общий интерфейс\n```\n\nСвязь через `trace_id` позволяет перейти из ошибки на графике к трассировке, а затем к связанным логам.\n\n### Sentry\n\n**Sentry** в первую очередь применяется для мониторинга ошибок и производительности приложений.\n\nОн собирает:\n\n```text\nнеобработанные исключения\nstack trace\nтип и текст ошибки\nконтекст запроса\nверсию приложения\nинформацию о пользователе\nbreadcrumbs\nperformance traces\n```\n\nSentry группирует похожие ошибки, чтобы тысяча одинаковых исключений не выглядела как тысяча независимых проблем. Python SDK поддерживает error monitoring и performance monitoring. \n\nПример:\n\n```python\nimport sentry_sdk\n\nsentry_sdk.init(\n    dsn=\"...\",\n    traces_sample_rate=0.1,\n)\n```\n\nSentry не обязательно заменяет Prometheus:\n\n```text\nPrometheus\n→ агрегированные числовые показатели\n\nSentry\n→ конкретные исключения и проблемные транзакции\n```\n\nОни часто используются вместе.\n\n### Готовые APM-системы\n\nAPM — Application Performance Monitoring. Такие системы обычно объединяют:\n\n```text\nметрики\nтрассировки\nошибки\nлоги\nservice map\nалерты\ndashboards\n```\n\nРаспространённые варианты:\n\n#### Elastic APM\n\nPython Agent собирает данные о производительности приложения и ошибках и отправляет их в Elastic APM. Поддерживается автоматическая инструментация распространённых Python-фреймворков и клиентских библиотек. (\n\nСхема:\n\n```text\nPython Agent\n→ APM Server\n→ Elasticsearch\n→ Kibana\n```\n\n#### Datadog APM\n\nДля Python используется пакет `ddtrace`, который создаёт трассы и автоматически инструментирует поддерживаемые фреймворки и библиотеки. \n\n```text\nPython + ddtrace\n→ Datadog Agent\n→ Datadog APM\n```\n\n#### New Relic\n\nPython Agent New Relic отслеживает производительность приложения и поддерживает автоматическую и ручную инструментацию Python-кода и распространённых библиотек. \n\nГотовый APM удобен, когда не хочется самостоятельно собирать стек из Prometheus, Grafana, Tempo, Loki и Alertmanager. Недостатки — стоимость, зависимость от поставщика и меньший контроль над хранением данных.\n\n### Мониторинг логов\n\nДля централизованной работы с логами применяют:\n\n```text\nGrafana Loki + Grafana\nElasticsearch + Kibana\nOpenSearch\n```\n\nВ случае Loki индексируются главным образом метаданные и labels логовых потоков, а сами записи хранятся сжатым потоком. \n\nТипичная схема:\n\n```text\nPython JSON logs\n→ stdout\n→ Fluent Bit / Grafana Alloy / OpenTelemetry Collector\n→ Loki\n→ Grafana\n```\n\nЛоги желательно связывать с остальными сигналами:\n\n```json\n{\n  \"event\": \"payment_failed\",\n  \"service\": \"payment-service\",\n  \"request_id\": \"req-123\",\n  \"trace_id\": \"abc923...\",\n  \"payment_id\": 145\n}\n```\n\n### Мониторинг сервера и инфраструктуры\n\nPython-метрики показывают состояние приложения, но не показывают полностью состояние машины.\n\nДля Linux-сервера обычно используется **Node Exporter**, который предоставляет метрики CPU, памяти, файловых систем, дисков и сети. \n\n```text\nNode Exporter\n→ сервер\n\nPrometheus Python client\n→ приложение\n\nPostgreSQL exporter\n→ PostgreSQL\n\nRedis exporter\n→ Redis\n\nRabbitMQ metrics\n→ RabbitMQ\n```\n\nPrometheus поддерживает модель exporters для систем, которые сами не предоставляют метрики в нужном формате. \n\nДля внешней проверки доступности endpoint применяют Blackbox Exporter:\n\n```text\nможно ли установить TCP-соединение\nотвечает ли HTTPS endpoint\nне истёк ли сертификат\nсколько занимает внешний запрос\n```\n\nBlackbox Exporter работает как отдельный probe-сервис, который проверяет заданные targets.\n\n### Профилирование\n\nМониторинг отвечает:\n\n```text\nКогда сервис стал медленным?\n```\n\nПрофилировщик отвечает:\n\n```text\nНа выполнении каких функций тратится время?\n```\n\n#### `cProfile`\n\nВстроенный детерминированный профилировщик Python:\n\n```bash\npython -m cProfile -o profile.data app.py\n```\n\nОн показывает число вызовов функций и время, затраченное на их выполнение. \n\n#### `py-spy`\n\nSampling-профилировщик, который может подключаться к уже работающему Python-процессу без изменения его кода и строить flame graph. \n\n```bash\npy-spy top --pid 1234\npy-spy record --pid 1234 -o profile.svg\n```\n\n#### Scalene\n\nПрофилировщик CPU, памяти и GPU для Python. Он помогает отличить время, проведённое непосредственно в Python-коде, от работы нативного кода и анализировать выделение памяти. \n\nПрофилировщики не стоит путать с постоянным мониторингом: их обычно применяют для расследования уже обнаруженной проблемы или как часть continuous profiling.\n\n### Health checks\n\nПриложение обычно предоставляет несколько проверок:\n\n```text\n/health/live\n→ процесс запущен и event loop работает\n\n/health/ready\n→ приложение готово принимать запросы\n\n/health/startup\n→ инициализация завершена\n```\n\nВ readiness-проверке могут учитываться критичные зависимости:\n\n```text\nзагружена конфигурация\nсоздан пул БД\nзапущены необходимые фоновые компоненты\n```\n\nПри этом глубокую проверку всех внешних сервисов на каждом запросе health check делать не стоит: она может сама создать дополнительную нагрузку и каскадные отказы.\n\n### Практический стек для FastAPI\n\nДля самостоятельной инфраструктуры:\n\n```text\nFastAPI\n├── prometheus-client\n├── OpenTelemetry SDK\n├── JSON logging\n└── Sentry SDK\n        │\n        ▼\nOpenTelemetry Collector / Fluent Bit\n        │\n        ├── Prometheus → Grafana\n        ├── Tempo → Grafana\n        ├── Loki → Grafana\n        └── Sentry\n```\n\nОтдельно:\n\n```text\nNode Exporter\nPostgreSQL exporter\nRedis exporter\nRabbitMQ metrics\nBlackbox Exporter\nAlertmanager\n```\n\nМинимальный набор для небольшого проекта:\n\n```text\nPrometheus\n+ prometheus-client\n+ Grafana\n+ Alertmanager\n```\n\nДля распределённой системы:\n\n```text\nPrometheus + Grafana\n→ метрики\n\nOpenTelemetry + Tempo/Jaeger\n→ трассировки\n\nLoki\n→ логи\n\nSentry\n→ исключения\n\nNode Exporter и exporters\n→ инфраструктура\n```\n\n### Какие метрики важнее всего\n\nДля HTTP-сервиса полезна модель RED:\n\n```text\nRate\n→ количество запросов\n\nErrors\n→ количество и доля ошибок\n\nDuration\n→ время выполнения\n```\n\nДля ресурсов — модель USE:\n\n```text\nUtilization\n→ насколько ресурс загружен\n\nSaturation\n→ есть ли очередь или нехватка ресурса\n\nErrors\n→ ошибки ресурса\n```\n\nПрактически стоит начать с:\n\n```text\nRPS\np50 / p95 / p99 latency\nдоля 5xx\nчисло запросов в работе\nразмер пула БД\nдлительность SQL-запросов\nразмер очереди задач\nчисло неуспешных задач\nCPU\nRAM\nдиск\nчисло перезапусков процесса\n```\n\nГлавная рабочая связка для Python-backend — **Prometheus для метрик, Grafana для визуализации, Alertmanager для уведомлений и OpenTelemetry для распределённых трассировок**. Sentry добавляется для удобного расследования конкретных исключений, а exporters — для наблюдения за инфраструктурой."
