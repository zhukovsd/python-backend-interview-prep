  question = "Что такое асимптотическая сложность (вычислительная сложность)?"
  answer = "### Что такое асимптотическая сложность\n\n**Асимптотическая сложность** описывает, как растут затраты алгоритма при увеличении размера входных данных.\n\nОбычно оценивают:\n\n```text\nвременную сложность\n→ сколько операций требуется\n\nпространственную сложность\n→ сколько дополнительной памяти требуется\n```\n\nНапример, если алгоритм обрабатывает список из `n` элементов, сложность показывает, как изменится объём работы при росте `n`.\n\n```text\nn = 10\nn = 1 000\nn = 1 000 000\n```\n\nРечь идёт не о точном времени в секундах, а о **характере роста**.\n\n### Простой пример\n\n```python\ndef print_items(items: list[int]) -> None:\n    for item in items:\n        print(item)\n```\n\nЕсли элементов:\n\n```text\n10     → примерно 10 итераций\n100    → примерно 100 итераций\n1000   → примерно 1000 итераций\n```\n\nКоличество работы растёт пропорционально размеру списка:\n\n```text\nO(n)\n```\n\nЭто линейная сложность.\n\n### Что означает `n`\n\n`n` — размер входных данных.\n\nВ зависимости от задачи это может быть:\n\n```text\nколичество элементов списка\nколичество символов строки\nколичество вершин графа\nколичество строк таблицы\nразмер матрицы\nколичество записей в файле\n```\n\nНапример:\n\n```python\ndef contains(items: list[int], target: int) -> bool:\n    for item in items:\n        if item == target:\n            return True\n\n    return False\n```\n\nЗдесь:\n\n```text\nn = количество элементов items\n```\n\nВ худшем случае нужно просмотреть весь список, поэтому сложность — `O(n)`.\n\n### Зачем используется асимптотическая оценка\n\nФактическое время зависит от:\n\n- процессора;\n    \n- языка;\n    \n- компилятора;\n    \n- реализации;\n    \n- кеша процессора;\n    \n- операционной системы;\n    \n- нагрузки машины.\n    \n\nНо рост алгоритма сохраняется.\n\nНапример, один алгоритм выполняет:\n\n```text\n100n\n```\n\nопераций, а другой:\n\n```text\nn²\n```\n\nПри небольшом `n` второй может быть быстрее. Но при больших данных квадратичный рост начинает доминировать.\n\n```text\nn = 10:\n100n = 1000\nn²   = 100\n\nn = 10 000:\n100n = 1 000 000\nn²   = 100 000 000\n```\n\nАсимптотическая сложность позволяет оценить масштабируемость независимо от конкретного оборудования.\n\n### Big O — верхняя оценка\n\nНа практике чаще всего используют обозначение:\n\n```text\nO(...)\n```\n\nОно описывает верхнюю границу роста алгоритма.\n\nНапример:\n\n```text\nO(1)\nO(log n)\nO(n)\nO(n log n)\nO(n²)\nO(2ⁿ)\nO(n!)\n```\n\nВ прикладных обсуждениях `O(...)` часто используют как обозначение общего порядка роста, хотя математически для точной границы существует `Θ(...)`.\n\n### Основные классы сложности\n\n### `O(1)` — постоянная\n\nКоличество операций не зависит от размера коллекции.\n\n```python\ndef get_first(items: list[int]) -> int:\n    return items[0]\n```\n\nДля списка из 10 или миллиона элементов выполняется примерно одинаковый объём работы.\n\n```text\nO(1)\n```\n\nДругие примеры:\n\n```python\nuser = users_by_id[user_id]\nvalue = items[index]\n```\n\nДоступ по индексу списка и средний доступ по ключу словаря обычно рассматривают как `O(1)`.\n\n### `O(log n)` — логарифмическая\n\nНа каждом шаге размер рассматриваемой области значительно сокращается, обычно вдвое.\n\nКлассический пример — бинарный поиск:\n\n```python\ndef binary_search(\n    items: list[int],\n    target: int,\n) -> int | None:\n    left = 0\n    right = len(items) - 1\n\n    while left <= right:\n        middle = (left + right) // 2\n        value = items[middle]\n\n        if value == target:\n            return middle\n\n        if value < target:\n            left = middle + 1\n        else:\n            right = middle - 1\n\n    return None\n```\n\nДля миллиона элементов требуется примерно:\n\n```text\nlog₂(1 000 000) ≈ 20 шагов\n```\n\nВместо просмотра миллиона значений.\n\n### `O(n)` — линейная\n\nАлгоритм выполняет работу для каждого элемента:\n\n```python\ndef calculate_total(prices: list[int]) -> int:\n    total = 0\n\n    for price in prices:\n        total += price\n\n    return total\n```\n\nКоличество операций пропорционально `n`.\n\n### `O(n log n)` — линейно-логарифмическая\n\nЧасто встречается у эффективных алгоритмов сортировки:\n\n```text\nmerge sort\nheap sort\nсредний случай quicksort\n```\n\nПримерно такую сложность имеют многие встроенные сортировки:\n\n```python\nsorted_items = sorted(items)\n```\n\nДля произвольных сравниваемых элементов сортировка обычно требует порядка `n log n` сравнений.\n\n### `O(n²)` — квадратичная\n\nЧасто возникает при вложенных циклах по одной коллекции:\n\n```python\ndef print_pairs(items: list[int]) -> None:\n    for first in items:\n        for second in items:\n            print(first, second)\n```\n\nЕсли элементов `n`, внутренний цикл выполняется `n` раз для каждой из `n` итераций внешнего:\n\n```text\nn × n = n²\n```\n\nПри увеличении входа в 10 раз работа увеличивается примерно в 100 раз.\n\n### `O(2ⁿ)` — экспоненциальная\n\nКоличество операций удваивается при добавлении одного элемента.\n\nТак может работать наивный перебор всех подмножеств:\n\n```text\nдля n элементов существует 2ⁿ подмножеств\n```\n\nЗначения быстро становятся огромными:\n\n```text\nn = 10 → 1 024\nn = 20 → 1 048 576\nn = 40 → более триллиона\n```\n\n### `O(n!)` — факториальная\n\nВозникает при переборе всех перестановок:\n\n```text\nn элементов\n→ n! возможных порядков\n```\n\nНапример:\n\n```text\n10! = 3 628 800\n20! ≈ 2,43 × 10¹⁸\n```\n\nТакие алгоритмы применимы только для очень небольших входов или требуют эвристик и сокращения пространства поиска.\n\n### Сравнение роста\n\nОт более масштабируемого к менее масштабируемому:\n\n```text\nO(1)\nO(log n)\nO(n)\nO(n log n)\nO(n²)\nO(n³)\nO(2ⁿ)\nO(n!)\n```\n\nПри этом `O(n²)` не означает автоматически «плохой алгоритм». Для `n = 20` он может быть совершенно приемлемым.\n\nКонтекст имеет значение:\n\n```text\nразмер входа\nчастота вызова\nстоимость одной операции\nограничения по времени и памяти\n```\n\n### Почему отбрасываются коэффициенты\n\nДопустим, алгоритм выполняет:\n\n```text\n3n + 10\n```\n\nопераций.\n\nПри больших `n` основную роль играет `n`, поэтому:\n\n```text\nO(3n + 10) → O(n)\n```\n\nАналогично:\n\n```text\n5n² + 100n + 200\n→ O(n²)\n```\n\nОтбрасываются:\n\n- постоянные коэффициенты;\n    \n- слагаемые меньшего порядка.\n    \n\nПотому что при больших значениях доминирует наиболее быстро растущая часть.\n\nОднако это не означает, что коэффициенты не важны на практике:\n\n```text\nO(n) с дорогим сетевым запросом на каждой итерации\n```\n\nможет быть намного медленнее:\n\n```text\nO(n²) из простых операций в памяти\n```\n\nна реальных ограниченных объёмах данных.\n\n### Последовательные операции\n\n```python\nfor item in items:\n    process(item)\n\nfor item in items:\n    save(item)\n```\n\nПолучается:\n\n```text\nO(n) + O(n) = O(2n) = O(n)\n```\n\nПоследовательные сложности складываются, после чего остаётся доминирующий член.\n\nНапример:\n\n```text\nO(n²) + O(n)\n→ O(n²)\n```\n\n### Вложенные операции\n\n```python\nfor first in items:\n    for second in items:\n        process(first, second)\n```\n\nСложности перемножаются:\n\n```text\nO(n) × O(n)\n→ O(n²)\n```\n\nНо не каждый вложенный цикл автоматически означает `O(n²)`.\n\nНапример:\n\n```python\nfor group in groups:\n    for item in group:\n        process(item)\n```\n\nЕсли каждый элемент встречается только в одной группе, суммарно все элементы могут быть обработаны один раз:\n\n```text\nO(n)\n```\n\n### Несколько независимых размеров\n\nРассмотрим:\n\n```python\ndef find_matches(\n    users: list[User],\n    orders: list[Order],\n) -> None:\n    for user in users:\n        for order in orders:\n            if order.user_id == user.id:\n                ...\n```\n\nЗдесь два разных размера:\n\n```text\nn = количество пользователей\nm = количество заказов\n```\n\nСложность:\n\n```text\nO(n × m)\n```\n\nНе всегда правильно обозначать её как `O(n²)`, потому что размеры коллекций могут сильно различаться.\n\n### Лучший, средний и худший случаи\n\nРассмотрим линейный поиск:\n\n```python\ndef find(items: list[int], target: int) -> bool:\n    for item in items:\n        if item == target:\n            return True\n\n    return False\n```\n\n#### Лучший случай\n\nЭлемент находится первым:\n\n```text\nO(1)\n```\n\n#### Худший случай\n\nЭлемент находится последним или отсутствует:\n\n```text\nO(n)\n```\n\n#### Средний случай\n\nОбычно требуется просмотреть значительную часть списка:\n\n```text\nO(n)\n```\n\nЕсли случай не уточняется, часто указывают худшую временную сложность.\n\n### Амортизированная сложность\n\nНекоторые операции обычно дешёвые, но иногда требуют дорогого перераспределения.\n\nНапример:\n\n```python\nitems.append(value)\n```\n\nДобавление в Python-список обычно выполняется за `O(1)`. Иногда внутренний массив переполняется, и Python выделяет больший блок памяти и переносит ссылки.\n\nОдна конкретная операция может стоить `O(n)`, но в последовательности большого числа добавлений средняя стоимость одной операции остаётся:\n\n```text\nамортизированно O(1)\n```\n\n### Пространственная сложность\n\nПомимо времени оценивается дополнительная память.\n\nНапример:\n\n```python\ndef double_values(items: list[int]) -> list[int]:\n    return [item * 2 for item in items]\n```\n\nСоздаётся новый список из `n` элементов:\n\n```text\nвремя:  O(n)\nпамять: O(n)\n```\n\nВариант с генератором:\n\n```python\ndef double_values(items: list[int]):\n    for item in items:\n        yield item * 2\n```\n\nДополнительная память обычно:\n\n```text\nO(1)\n```\n\nесли результаты потребляются постепенно и не сохраняются целиком.\n\n### Пример оптимизации сложности\n\nНеэффективный поиск пересечений:\n\n```python\ndef get_common(\n    first: list[int],\n    second: list[int],\n) -> list[int]:\n    result = []\n\n    for item in first:\n        if item in second:\n            result.append(item)\n\n    return result\n```\n\nПроверка `item in second` для списка — `O(m)`.\n\nОбщая сложность:\n\n```text\nO(n × m)\n```\n\nМожно построить множество:\n\n```python\ndef get_common(\n    first: list[int],\n    second: list[int],\n) -> list[int]:\n    second_set = set(second)\n\n    return [\n        item\n        for item in first\n        if item in second_set\n    ]\n```\n\nПостроение множества:\n\n```text\nO(m)\n```\n\nОбход первого списка:\n\n```text\nO(n)\n```\n\nПроверка в множестве в среднем:\n\n```text\nO(1)\n```\n\nИтого:\n\n```text\nO(n + m)\n```\n\nЦена оптимизации — дополнительная память `O(m)`.\n\n### Сложность типичных операций Python\n\nПриблизительно:\n\n|Операция|Средняя сложность|\n|---|--:|\n|`list[index]`|`O(1)`|\n|`list.append()`|амортизированно `O(1)`|\n|`list.pop()` с конца|`O(1)`|\n|`list.pop(0)`|`O(n)`|\n|`value in list`|`O(n)`|\n|`dict[key]`|`O(1)`|\n|`key in dict`|`O(1)`|\n|`value in set`|`O(1)`|\n|`sorted(items)`|`O(n log n)`|\n|Копирование списка|`O(n)`|\n\nДля `dict` и `set` указан средний случай. При неблагоприятных коллизиях теоретическая сложность может ухудшаться.\n\n### Big O, Big Omega и Big Theta\n\n#### `O(f(n))`\n\nВерхняя асимптотическая граница:\n\n```text\nалгоритм растёт не быстрее указанного порядка\n```\n\n#### `Ω(f(n))`\n\nНижняя граница:\n\n```text\nалгоритм растёт не медленнее указанного порядка\n```\n\n#### `Θ(f(n))`\n\nТочная асимптотическая граница:\n\n```text\nрост ограничен одним порядком и сверху, и снизу\n```\n\nНапример, полный обход всех элементов всегда требует линейного количества действий:\n\n```text\nΘ(n)\n```\n\nВ повседневной разработке обычно используют `O(...)`, даже когда формально подразумевают `Θ(...)`.\n\n### Асимптотическая сложность не показывает всё\n\nДва алгоритма с одинаковым `O(n)` могут сильно отличаться из-за:\n\n- коэффициентов;\n    \n- количества аллокаций;\n    \n- обращений к сети;\n    \n- работы с БД;\n    \n- кеш-локальности;\n    \n- системных вызовов;\n    \n- параллелизма;\n    \n- особенностей реализации языка.\n    \n\nНапример:\n\n```python\nfor user_id in user_ids:\n    await database.get_user(user_id)\n```\n\nФормально цикл линейный:\n\n```text\nO(n)\n```\n\nНо он выполняет `n` сетевых запросов к БД.\n\nBatch-вариант:\n\n```python\nusers = await database.get_users(user_ids)\n```\n\nтоже может иметь линейную внутреннюю работу, но использует один сетевой round trip и на практике будет намного быстрее.\n\nПоэтому нужно учитывать и вычислительную сложность, и реальную стоимость операций.\n\n### Итог\n\n```text\nАсимптотическая сложность\n→ показывает, как растут затраты алгоритма\n  при увеличении размера входных данных\n\nВременная сложность\n→ рост количества работы\n\nПространственная сложность\n→ рост потребления дополнительной памяти\n\nОсновные классы:\nO(1), O(log n), O(n), O(n log n),\nO(n²), O(2ⁿ), O(n!)\n```\n\nГлавная ценность асимптотического анализа — возможность заранее понять, будет ли алгоритм нормально работать не только на десяти элементах, но и на миллионах."
