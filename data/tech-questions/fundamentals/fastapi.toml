  question = "Как использовать Depends() для бизнес-логики в FastAPI?"
  answer = "`Depends()` можно использовать для бизнес-логики, но лучше не складывать в него всю бизнес-операцию. Правильнее использовать его для:\n\n```text\n1. Получения текущего пользователя\n2. Проверки прав\n3. Получения DB-сессии / Unit of Work\n4. Создания repository/service\n5. Проверки бизнес-доступа к объекту\n6. Подмены зависимостей в тестах\n```\n\nА сама операция вроде `create_order`, `upload_file`, `delete_resource` обычно должна жить в **service/use-case слое**, который endpoint вызывает явно.\n\nFastAPI сам решает зависимости, включая вложенные зависимости, и может подставлять их результат в endpoint. Также зависимости можно переопределять в тестах через `app.dependency_overrides`. \n\n---\n\n### Нормальная схема\n\n```text\nHTTP request\n↓\nDepends: получить DB\n↓\nDepends: получить текущего пользователя\n↓\nDepends: собрать service\n↓\nendpoint: вызвать бизнес-операцию явно\n↓\nservice: выполнить бизнес-логику\n↓\nresponse\n```\n\nТо есть `Depends()` подготавливает зависимости, а не прячет весь use-case.\n\n---\n\n### Пример: сервис через Depends\n\n```python\nfrom typing import Annotated\n\nfrom fastapi import Depends, FastAPI, HTTPException, status\nfrom pydantic import BaseModel\n\napp = FastAPI()\n\n\nclass CreateFileSchema(BaseModel):\n    name: str\n    size: int\n\n\nclass User:\n    def __init__(self, id: int, username: str, is_active: bool):\n        self.id = id\n        self.username = username\n        self.is_active = is_active\n\n\nclass FileRepository:\n    async def exists_by_name(self, user_id: int, name: str) -> bool:\n        return False\n\n    async def create(self, user_id: int, name: str, size: int) -> dict:\n        return {\n            \"id\": 1,\n            \"user_id\": user_id,\n            \"name\": name,\n            \"size\": size,\n        }\n\n\nclass FileService:\n    def __init__(self, repository: FileRepository):\n        self.repository = repository\n\n    async def create_file(self, user: User, data: CreateFileSchema) -> dict:\n        if not user.is_active:\n            raise HTTPException(\n                status_code=status.HTTP_403_FORBIDDEN,\n                detail=\"Inactive user\",\n            )\n\n        if data.size <= 0:\n            raise HTTPException(\n                status_code=status.HTTP_400_BAD_REQUEST,\n                detail=\"Invalid file size\",\n            )\n\n        exists = await self.repository.exists_by_name(\n            user_id=user.id,\n            name=data.name,\n        )\n\n        if exists:\n            raise HTTPException(\n                status_code=status.HTTP_409_CONFLICT,\n                detail=\"File already exists\",\n            )\n\n        return await self.repository.create(\n            user_id=user.id,\n            name=data.name,\n            size=data.size,\n        )\n\n\nasync def get_current_user() -> User:\n    return User(id=1, username=\"admin\", is_active=True)\n\n\nasync def get_file_repository() -> FileRepository:\n    return FileRepository()\n\n\nasync def get_file_service(\n    repository: Annotated[FileRepository, Depends(get_file_repository)],\n) -> FileService:\n    return FileService(repository)\n\n\n@app.post(\"/files\")\nasync def create_file(\n    data: CreateFileSchema,\n    user: Annotated[User, Depends(get_current_user)],\n    service: Annotated[FileService, Depends(get_file_service)],\n):\n    return await service.create_file(user=user, data=data)\n```\n\nЗдесь:\n\n```text\nget_current_user      -> dependency\nget_file_repository   -> dependency\nget_file_service      -> dependency\ncreate_file endpoint  -> orchestration\nFileService           -> бизнес-логика\n```\n\nЭто хороший вариант, потому что endpoint остаётся тонким, но бизнес-операция видна явно:\n\n```python\nreturn await service.create_file(user=user, data=data)\n```\n\n---\n\n### Где именно тут бизнес-логика\n\nБизнес-логика находится здесь:\n\n```python\nasync def create_file(self, user: User, data: CreateFileSchema) -> dict:\n    if not user.is_active:\n        ...\n\n    if data.size <= 0:\n        ...\n\n    exists = await self.repository.exists_by_name(...)\n    if exists:\n        ...\n\n    return await self.repository.create(...)\n```\n\n`Depends()` только собирает нужные объекты.\n\n---\n\n### Пример: бизнес-проверка через Depends\n\nИногда проверку доступа удобно вынести в dependency.\n\nНапример: endpoint должен работать только для активного пользователя.\n\n```python\nasync def require_active_user(\n    user: Annotated[User, Depends(get_current_user)],\n) -> User:\n    if not user.is_active:\n        raise HTTPException(\n            status_code=status.HTTP_403_FORBIDDEN,\n            detail=\"Inactive user\",\n        )\n\n    return user\n```\n\nИспользование:\n\n```python\n@app.post(\"/files\")\nasync def create_file(\n    data: CreateFileSchema,\n    user: Annotated[User, Depends(require_active_user)],\n    service: Annotated[FileService, Depends(get_file_service)],\n):\n    return await service.create_file(user=user, data=data)\n```\n\nЭто нормально, потому что dependency отвечает за **доступ**, а не за создание файла.\n\n---\n\n### Пример: проверка владельца объекта\n\nДля бизнес-доступа к конкретному объекту:\n\n```python\nclass File:\n    def __init__(self, id: int, owner_id: int, name: str):\n        self.id = id\n        self.owner_id = owner_id\n        self.name = name\n\n\nclass FileRepository:\n    async def get_by_id(self, file_id: int) -> File | None:\n        return File(id=file_id, owner_id=1, name=\"report.txt\")\n\n\nasync def get_file_repository() -> FileRepository:\n    return FileRepository()\n\n\nasync def get_owned_file(\n    file_id: int,\n    user: Annotated[User, Depends(get_current_user)],\n    repository: Annotated[FileRepository, Depends(get_file_repository)],\n) -> File:\n    file = await repository.get_by_id(file_id)\n\n    if file is None:\n        raise HTTPException(status_code=404, detail=\"File not found\")\n\n    if file.owner_id != user.id:\n        raise HTTPException(status_code=403, detail=\"Forbidden\")\n\n    return file\n```\n\nEndpoint:\n\n```python\n@app.get(\"/files/{file_id}\")\nasync def read_file(\n    file: Annotated[File, Depends(get_owned_file)],\n):\n    return {\n        \"id\": file.id,\n        \"name\": file.name,\n    }\n```\n\nЗдесь `Depends()` не просто «выполняет код до endpoint», а гарантирует endpoint-у:\n\n```text\nсюда попадёт только файл, который существует\nи принадлежит текущему пользователю\n```\n\n---\n\n### Пример: Unit of Work / DB-сессия через yield\n\nДля ресурсов с открытием и закрытием используют dependency с `yield`. FastAPI официально поддерживает dependencies с `yield`: код до `yield` отдаёт ресурс, код после `yield` выполняется после завершения обработки. \n\nУпрощённый пример:\n\n```python\nclass UnitOfWork:\n    async def commit(self):\n        print(\"commit\")\n\n    async def rollback(self):\n        print(\"rollback\")\n\n    async def close(self):\n        print(\"close\")\n\n\nasync def get_uow():\n    uow = UnitOfWork()\n\n    try:\n        yield uow\n        await uow.commit()\n    except Exception:\n        await uow.rollback()\n        raise\n    finally:\n        await uow.close()\n```\n\nИспользование:\n\n```python\n@app.post(\"/files\")\nasync def create_file(\n    data: CreateFileSchema,\n    user: Annotated[User, Depends(require_active_user)],\n    service: Annotated[FileService, Depends(get_file_service)],\n    uow: Annotated[UnitOfWork, Depends(get_uow)],\n):\n    result = await service.create_file(user=user, data=data)\n    return result\n```\n\nНа практике `uow` обычно передают в repository/service, а не держат отдельно в endpoint.\n\n---\n\n### Как лучше организовать файлы\n\nНапример:\n\n```text\napp/\n├── main.py\n├── api/\n│   └── files.py\n├── dependencies/\n│   ├── auth.py\n│   ├── database.py\n│   └── services.py\n├── services/\n│   └── file_service.py\n├── repositories/\n│   └── file_repository.py\n└── schemas/\n    └── file.py\n```\n\nПример `dependencies/services.py`:\n\n```python\nfrom typing import Annotated\nfrom fastapi import Depends\n\nfrom app.repositories.file_repository import FileRepository\nfrom app.services.file_service import FileService\n\n\nasync def get_file_repository() -> FileRepository:\n    return FileRepository()\n\n\nasync def get_file_service(\n    repository: Annotated[FileRepository, Depends(get_file_repository)],\n) -> FileService:\n    return FileService(repository)\n```\n\nПример `api/files.py`:\n\n```python\nfrom typing import Annotated\nfrom fastapi import APIRouter, Depends\n\nrouter = APIRouter(prefix=\"/files\", tags=[\"files\"])\n\n\n@router.post(\"\")\nasync def create_file(\n    data: CreateFileSchema,\n    user: Annotated[User, Depends(require_active_user)],\n    service: Annotated[FileService, Depends(get_file_service)],\n):\n    return await service.create_file(user=user, data=data)\n```\n\n---\n\n### Что не стоит делать\n\nПлохой вариант:\n\n```python\nasync def create_file_dependency(\n    data: CreateFileSchema,\n    user: Annotated[User, Depends(get_current_user)],\n    service: Annotated[FileService, Depends(get_file_service)],\n):\n    return await service.create_file(user=user, data=data)\n\n\n@app.post(\"/files\")\nasync def create_file(\n    result: Annotated[dict, Depends(create_file_dependency)],\n):\n    return result\n```\n\nПочему хуже:\n\n```text\n1. Endpoint перестаёт явно показывать бизнес-операцию\n2. Основное действие спрятано внутри Depends\n3. Сложнее читать flow запроса\n4. Сложнее контролировать транзакции\n5. Сложнее отличить подготовку контекста от выполнения команды\n```\n\nТо есть `Depends()` не должен превращаться в скрытый endpoint внутри endpoint-а.\n\n---\n\n### Практическое правило\n\nХорошо:\n\n```text\nDepends получает то, что нужно бизнес-операции:\n- user\n- db session\n- repository\n- service\n- permissions\n- owned resource\n```\n\nПлохо:\n\n```text\nDepends выполняет саму бизнес-команду:\n- создать заказ\n- удалить файл\n- списать деньги\n- отправить письмо\n- изменить состояние объекта\n```\n\nЛучше так:\n\n```python\n@app.post(\"/orders\")\nasync def create_order(\n    data: CreateOrderSchema,\n    user: Annotated[User, Depends(require_active_user)],\n    service: Annotated[OrderService, Depends(get_order_service)],\n):\n    return await service.create_order(user=user, data=data)\n```\n\nА не так:\n\n```python\n@app.post(\"/orders\")\nasync def create_order(\n    order: Annotated[dict, Depends(create_order_inside_dependency)],\n):\n    return order\n```\n\n---\n\n### Итого\n\n`Depends()` для бизнес-логики в FastAPI лучше использовать как **механизм сборки контекста и зависимостей**:\n\n```text\nDepends:\n- достаёт пользователя\n- проверяет авторизацию\n- проверяет доступ к объекту\n- создаёт repository/service\n- открывает и закрывает DB-сессию\n- даёт endpoint-у готовые зависимости\n\nService:\n- выполняет основную бизнес-операцию\n- проверяет бизнес-правила\n- меняет состояние системы\n```\n\nГлавная формула:\n\n```text\nDepends — подготовка и проверка контекста.\nService — бизнес-логика.\nEndpoint — явный вызов use-case.\n```"
  popularity = 2.63

[[questions]]
  id = 9
  question = "Почему в FastAPI используется название Depends"
  answer = "### Почему именно `Depends`\n\nНазвание `Depends` логичнее понимать не как команду **«выполни»**, а как декларацию:\n\n```text\nэтот endpoint зависит от такой-то функции / объекта / проверки\n```\n\nТо есть когда ты пишешь:\n\n```python\nasync def profile(\n    user = Depends(get_current_user),\n):\n    ...\n```\n\nсмысл такой:\n\n```text\nprofile зависит от get_current_user\n```\n\nFastAPI сам должен получить эту зависимость и передать результат в `profile`.\n\nОфициальная документация FastAPI описывает Dependency Injection так: path operation function объявляет вещи, которые требуются ей для работы, а FastAPI предоставляет эти зависимости сам. Поэтому `Depends` — это именно способ объявить зависимость. ([FastAPI](https://fastapi.tiangolo.com/ru/tutorial/dependencies/?utm_source=chatgpt.com \"Зависимости\"))\n\n---\n\n### Почему не `Inject`\n\nТеоретически могли назвать так:\n\n```python\nuser = Inject(get_current_user)\n```\n\nНо это было бы менее точно с точки зрения кода endpoint-а.\n\nEndpoint не говорит:\n\n```text\nинъектируй мне пользователя\n```\n\nОн говорит:\n\n```text\nя завишу от get_current_user\n```\n\nА уже FastAPI решает:\n\n```text\n1. как вызвать get_current_user\n2. какие sub-dependencies нужны\n3. await или threadpool\n4. использовать ли cache\n5. что передать в endpoint\n```\n\nВ reference-документации FastAPI прямо указано, что зависимости в основном обрабатываются специальной функцией `Depends()`, которая принимает callable. \n\n---\n\n### Почему это не просто `Before`\n\nНазвание вроде `Before` тоже было бы неточным.\n\nНапример:\n\n```python\nasync def get_db():\n    yield db\n```\n\nТакая dependency работает не только **до endpoint**, но и **после endpoint** — закрывает ресурс после `yield`. FastAPI поддерживает dependencies с `yield`, где код после `yield` выполняется после завершения обработки. \n\nТо есть `Depends` может описывать не просто «код до endpoint», а полноценную зависимость с жизненным циклом:\n\n```text\nсоздать ресурс\n↓\nпередать endpoint-у\n↓\nзакрыть ресурс\n```\n\n---\n\n### Почему не `Dependency`\n\nМожно было бы назвать:\n\n```python\nuser = Dependency(get_current_user)\n```\n\nНо `Depends` короче и лучше читается в сигнатуре функции:\n\n```python\nuser = Depends(get_current_user)\n```\n\nЧитается почти как обычный английский:\n\n```text\nuser depends on get_current_user\n```\n\nТо есть:\n\n```text\nпараметр user зависит от get_current_user\n```\n\n---\n\n### Главное\n\n`Depends` называется так, потому что он описывает отношение зависимости:\n\n```text\nendpoint зависит от функции/объекта/проверки\n```\n\nА не просто:\n\n```text\nвыполни код перед endpoint\n```\n\nБолее точная формула:\n\n```text\nDepends(get_current_user)\n=\nFastAPI, этот параметр зависит от get_current_user.\nСам вызови, проверь, закэшируй и передай результат сюда.\n```"
  popularity = 2.63

[[questions]]
  id = 10
  question = "Django vs FastAPI"
  answer = "### Django vs FastAPI\n\nГлавное различие:\n\n```text\nDjango  — полноценный web-фреймворк \"batteries included\"\nFastAPI — лёгкий современный фреймворк для API\n```\n\nDjango даёт много встроенного: ORM, миграции, admin-панель, auth, формы, шаблоны, middleware, security-механизмы. Сам Django описывает себя как high-level framework для быстрой разработки и clean pragmatic design. \n\nFastAPI больше сфокусирован на построении API: type hints, Pydantic-валидация, автоматическая OpenAPI-документация, async-first подход и Dependency Injection. В официальной документации FastAPI описан как современный high-performance web framework для API на основе стандартных Python type hints. \n\n---\n\n### Краткое сравнение\n\n|Критерий|Django|FastAPI|\n|---|---|---|\n|Основная идея|Полноценный backend-фреймворк|API-фреймворк|\n|Архитектура|Более монолитная, много встроенного|Более гибкая, многое выбираешь сам|\n|ORM|Встроенная Django ORM|Нет встроенной ORM|\n|Админка|Есть встроенная Django Admin|Нет встроенной админки|\n|API|Обычно через Django REST Framework|Встроенный основной сценарий|\n|Async|Есть поддержка async views и async request stack при ASGI|Изначально хорошо ложится на async/await|\n|Валидация|Forms / serializers в DRF|Pydantic / type hints|\n|OpenAPI/Swagger|Обычно через DRF + доп. инструменты|Встроено из коробки|\n|DI|Нет как центральной концепции|`Depends()` — один из ключевых механизмов|\n|Лучший сценарий|Большой CRUD/backend/админка/сайт|API, микросервисы, async-сервисы|\n\nDjango имеет async-поддержку, включая async views и async request stack при ASGI, но исторически его экосистема сильнее завязана на синхронную модель. FastAPI изначально строится вокруг `async def`, type hints и автоматической работы с API-схемами. \n\n---\n\n### Django сильнее, когда нужен полноценный backend\n\nDjango лучше подходит, когда проекту нужны:\n\n```text\n- пользователи\n- роли и права\n- админка\n- ORM\n- миграции\n- HTML-шаблоны\n- формы\n- CRUD\n- стандартная backend-структура\n- быстрый MVP\n```\n\nНапример:\n\n```text\nинтернет-магазин\nCRM\nличный кабинет\nадмин-панель\nблог\nкорпоративный портал\nSaaS с большим CRUD\n```\n\nDjango хорош тем, что многое уже встроено. Не надо отдельно выбирать ORM, систему миграций, admin-панель, базовую auth-систему и часть security-инструментов. Официальный сайт Django отдельно подчёркивает rapid development, security и то, что фреймворк помогает не изобретать базовые части web-приложения заново. \n\n---\n\n### FastAPI сильнее, когда нужен API-сервис\n\nFastAPI лучше подходит, когда проекту нужны:\n\n```text\n- REST API\n- async I/O\n- микросервис\n- WebSocket\n- внешние интеграции\n- высокая гибкость архитектуры\n- строгая типизация request/response\n- автогенерация Swagger/OpenAPI\n```\n\nНапример:\n\n```text\nnotification service\nauth service\npayment callback service\nML API\ngateway service\nasync API для мобильного приложения\n```\n\nFastAPI не заставляет использовать конкретную базу данных или ORM. В официальной документации прямо сказано, что FastAPI не требует использовать SQL database, но позволяет использовать любую БД; в примерах часто используются SQLModel/SQLAlchemy. \n\n---\n\n### Django REST Framework vs FastAPI\n\nЕсли сравнивать именно API, правильнее сравнивать не просто Django, а:\n\n```text\nDjango + DRF vs FastAPI\n```\n\nDjango REST Framework — это отдельный toolkit для построения Web API поверх Django. Он даёт serializers, authentication, permissions, browsable API и интеграцию с Django ORM. \n\nРазница примерно такая:\n\n```text\nDjango + DRF:\n- больше готовой инфраструктуры\n- удобнее для CRUD вокруг Django ORM\n- сильнее для проектов с админкой\n- больше \"магии\" и слоёв\n\nFastAPI:\n- проще как API-фреймворк\n- лучше читается через type hints\n- удобный Depends\n- проще строить чистую service/repository архитектуру\n- меньше встроенного, больше решений на тебе\n```\n\n---\n\n### По скорости разработки\n\nДля CRUD-проекта с пользователями, админкой и моделями Django часто быстрее:\n\n```text\nсоздал models\n↓\nмиграции\n↓\nadmin\n↓\nDRF serializers/viewsets\n↓\nготовый CRUD API\n```\n\nДля чистого API-сервиса FastAPI часто быстрее:\n\n```text\nPydantic schema\n↓\nendpoint\n↓\nDepends\n↓\nservice\n↓\nresponse_model\n↓\nSwagger уже готов\n```\n\n---\n\n### По архитектуре\n\nВ Django типичная структура:\n\n```text\nproject/\n├── settings.py\n├── urls.py\n├── apps/\n│   ├── models.py\n│   ├── views.py\n│   ├── serializers.py\n│   ├── admin.py\n│   └── migrations/\n```\n\nВ FastAPI чаще делают более явно:\n\n```text\napp/\n├── main.py\n├── api/\n├── schemas/\n├── services/\n├── repositories/\n├── dependencies/\n└── db/\n```\n\nDjango даёт больше готового каркаса. FastAPI даёт больше свободы, но архитектуру надо дисциплинированно строить самому.\n\n---\n\n### По async\n\nFastAPI обычно удобнее, если проект изначально async:\n\n```python\n@app.get(\"/users/{user_id}\")\nasync def get_user(user_id: int):\n    ...\n```\n\nDjango тоже поддерживает async views:\n\n```python\nasync def my_view(request):\n    ...\n```\n\nНо в Django нужно внимательнее смотреть, какие части стека реально async, а какие могут перейти в sync-режим. Официальная документация Django отдельно описывает async support и условия работы async request stack. \n\n---\n\n### По ORM\n\nDjango:\n\n```text\nDjango ORM встроена\nмиграции встроены\nadmin работает поверх моделей\n```\n\nFastAPI:\n\n```text\nORM не встроена\nможно выбрать SQLAlchemy, SQLModel, Tortoise ORM, Prisma и т.д.\nмиграции обычно через Alembic\n```\n\nЭто не недостаток FastAPI, а его философия: он не навязывает инфраструктуру приложения. В документации FastAPI указано, что он не требует конкретную SQL database и позволяет использовать любую БД. \n\n---\n\n### Что выбрать\n\n### Выбирай Django, если:\n\n```text\n- нужен большой монолит\n- нужна админка\n- много CRUD\n- нужна встроенная ORM\n- нужен backend + web-интерфейс\n- проект похож на CRM / LMS / интернет-магазин / портал\n- важна быстрая сборка стандартного продукта\n```\n\n### Выбирай FastAPI, если:\n\n```text\n- нужен чистый REST API\n- нужен микросервис\n- много async I/O\n- хочешь явную service/repository архитектуру\n- важны type hints и Pydantic\n- нужна хорошая OpenAPI-документация из коробки\n- проект API-first\n```\n\n---\n\n### Практический вывод\n\n```text\nDjango — когда нужен полноценный backend-комбайн.\n\nFastAPI — когда нужен быстрый, гибкий и современный API-сервис.\n```\n\nДля твоих проектов:\n\n```text\nCloud storage с пользователями, MinIO, JWT, админкой\n→ Django + DRF подходит хорошо\n\nNotificationService, async Redis/PostgreSQL, микросервисный API\n→ FastAPI подходит лучше\n```\n\nГлавная разница не в том, что один «лучше», а в уровне абстракции:\n\n```text\nDjango даёт готовую систему.\n\nFastAPI даёт удобный инструмент для сборки своей системы.\n```"
  popularity = 2.63

[[questions]]
  id = 11
  question = "Каким образом FastAPI обрабатывает синхронный endpoint внутри асинхронной среды выполнения?"
  answer = "Если endpoint объявлен как обычная синхронная функция через `def`, FastAPI **не вызывает его напрямую в event loop**. Он отправляет его выполнение во внешний thread pool и `await`-ит результат.\n\nОфициальная документация FastAPI прямо говорит: обычный `def` path operation запускается во внешнем threadpool и затем ожидается, потому что прямой вызов заблокировал бы сервер. То же правило применяется к синхронным dependencies.\n\n---\n\n### Пример sync endpoint-а\n\n```python\nfrom fastapi import FastAPI\nimport time\n\napp = FastAPI()\n\n\n@app.get(\"/sync\")\ndef sync_endpoint():\n    time.sleep(3)\n    return {\"status\": \"done\"}\n```\n\nХотя функция обычная:\n\n```python\ndef sync_endpoint():\n    ...\n```\n\nFastAPI внутри обрабатывает её примерно так:\n\n```python\nresult = await run_in_threadpool(sync_endpoint)\n```\n\nТо есть сама функция выполняется **не в event loop-потоке**, а в отдельном worker thread.\n\n---\n\n### Упрощённая схема\n\n```text\nHTTP request\n↓\nASGI server: uvicorn / hypercorn\n↓\nFastAPI route handler\n↓\nFastAPI определяет: endpoint sync или async?\n↓\nесли async def:\n    await endpoint(...)\n↓\nесли def:\n    await run_in_threadpool(endpoint, ...)\n↓\nсериализация response\n↓\nHTTP response\n```\n\nВ исходном коде FastAPI это видно в функции `run_endpoint_function`: если endpoint coroutine — вызывается `await dependant.call(...)`; иначе используется `await run_in_threadpool(dependant.call, **values)`. \n\n---\n\n### Почему нельзя просто вызвать `def` напрямую\n\nПотому что синхронный код может блокировать поток:\n\n```python\ntime.sleep(3)\nrequests.get(...)\nopen(...).read()\nобычный sync SQL-запрос\nтяжёлая обработка файла\n```\n\nЕсли выполнить это прямо внутри event loop, то на время блокировки event loop не сможет нормально обслуживать другие async-задачи.\n\nПлохая модель:\n\n```text\nevent loop\n↓\nsync_endpoint()\n↓\ntime.sleep(3)\n↓\nevent loop заблокирован\n```\n\nПоэтому FastAPI делает иначе:\n\n```text\nevent loop\n↓\nотдать sync_endpoint в threadpool\n↓\nevent loop свободен\n↓\nдождаться результата через await\n```\n\n---\n\n### Что именно используется под капотом\n\nFastAPI импортирует `run_in_threadpool` из Starlette. В исходном коде FastAPI это видно по импорту:\n\n```python\nfrom starlette.concurrency import iterate_in_threadpool, run_in_threadpool\n```\n\nА дальше `run_in_threadpool` используется для синхронных endpoint-ов. \n\nStarlette в своей документации пишет, что использует thread pool, чтобы не блокировать event loop, в том числе для synchronous endpoint-ов, созданных через `def`. Технически Starlette использует `anyio.to_thread.run_sync` для запуска синхронного кода. \n\n---\n\n### Что происходит с async endpoint-ом\n\n```python\n@app.get(\"/async\")\nasync def async_endpoint():\n    return {\"status\": \"done\"}\n```\n\nТакой endpoint вызывается напрямую через `await`:\n\n```python\nresult = await async_endpoint()\n```\n\nТо есть:\n\n```text\nasync def endpoint\n↓\nвыполняется как coroutine\n↓\nуправление отдаётся event loop через await\n```\n\nА sync endpoint:\n\n```text\ndef endpoint\n↓\nуходит в worker thread\n↓\nevent loop ждёт результат асинхронно\n```\n\n---\n\n### Важный момент про sync dependency\n\nТо же самое касается `Depends`.\n\n```python\ndef get_user():\n    return {\"id\": 1}\n\n\n@app.get(\"/profile\")\ndef profile(user = Depends(get_user)):\n    return user\n```\n\nЕсли dependency обычная `def`, FastAPI тоже запускает её во внешнем threadpool. Это указано в документации FastAPI: обычные `def` dependencies выполняются в external threadpool. \n\n---\n\n### Ограничение thread pool\n\nЭто не бесконечное количество потоков.\n\nStarlette указывает, что стандартный лимит thread pool — **40 tokens**, то есть одновременно может выполняться ограниченное число threadpool-задач. Этот лимит общий, и FastAPI тоже использует AnyIO для sync dependencies. \n\nAnyIO документация также описывает стандартный worker thread limiter со значением 40 для `to_thread.run_sync()`. \n\nТо есть если у тебя много sync endpoint-ов, которые долго блокируются, может появиться очередь:\n\n```text\n100 одновременных sync-запросов\n↓\n40 выполняются в threadpool\n↓\nостальные ждут свободный worker\n```\n\n---\n\n### Это не делает CPU-bound код реально параллельным\n\nThreadpool помогает не блокировать event loop, но не превращает Python-код в полноценное CPU-параллельное выполнение.\n\nНапример:\n\n```python\n@app.get(\"/cpu\")\ndef cpu_heavy():\n    total = 0\n    for i in range(100_000_000):\n        total += i\n    return {\"total\": total}\n```\n\nТакой endpoint уйдёт в threadpool, но для чистого Python CPU-bound кода всё ещё есть ограничение GIL. Event loop не будет заблокирован, но CPU может быть забит, а потоки не дадут полноценного параллелизма для Python-вычислений.\n\nДля CPU-heavy задач обычно лучше:\n\n```text\n- отдельный worker-процесс\n- Celery / RQ / Dramatiq\n- multiprocessing\n- отдельный сервис\n```\n\n---\n\n### Когда `def` endpoint нормален\n\nНормально использовать `def`, если внутри синхронные библиотеки:\n\n```python\n@app.get(\"/users/{user_id}\")\ndef get_user(user_id: int):\n    user = sync_db_client.get_user(user_id)\n    return user\n```\n\nНапример:\n\n```text\n- sync SQLAlchemy session\n- requests\n- boto3\n- обычная файловая операция\n- legacy sync SDK\n```\n\nFastAPI сам отправит такой endpoint в threadpool.\n\n---\n\n### Когда лучше `async def`\n\nЛучше использовать `async def`, если внутри async-библиотеки:\n\n```python\n@app.get(\"/users/{user_id}\")\nasync def get_user(user_id: int):\n    user = await async_db_client.get_user(user_id)\n    return user\n```\n\nНапример:\n\n```text\n- asyncpg\n- httpx.AsyncClient\n- redis.asyncio\n- aiofiles\n- SQLAlchemy AsyncSession\n```\n\nТогда endpoint работает напрямую в event loop и отдаёт управление на каждом `await`.\n\n---\n\n### Нельзя делать так\n\nПлохой вариант:\n\n```python\nimport time\n\n@app.get(\"/bad\")\nasync def bad_endpoint():\n    time.sleep(3)\n    return {\"status\": \"done\"}\n```\n\nПроблема:\n\n```text\nasync def endpoint\n↓\nFastAPI считает его coroutine\n↓\nвызывает через await\n↓\nно внутри time.sleep(3)\n↓\nevent loop блокируется\n```\n\nЕсли код блокирующий, лучше так:\n\n```python\n@app.get(\"/better\")\ndef better_endpoint():\n    time.sleep(3)\n    return {\"status\": \"done\"}\n```\n\nИли внутри `async def` явно вынести блокирующий кусок:\n\n```python\nfrom starlette.concurrency import run_in_threadpool\n\n@app.get(\"/better-async\")\nasync def better_async_endpoint():\n    result = await run_in_threadpool(blocking_function)\n    return result\n```\n\n---\n\n### Итог\n\n```text\nasync def endpoint\n→ FastAPI вызывает через await в event loop\n\ndef endpoint\n→ FastAPI запускает через Starlette run_in_threadpool\n→ Starlette использует AnyIO to_thread.run_sync\n→ event loop не блокируется\n→ результат возвращается обратно в async-обработчик\n```\n\nГлавная идея:\n\n```text\nСинхронный endpoint в FastAPI работает внутри async-приложения\nза счёт переноса выполнения в thread pool.\n```\n\nЭто защищает event loop от блокировки, но не отменяет ограничений потоков, GIL и стоимости большого количества blocking-операций."
  popularity = 2.63

[[questions]]
  id = 12
  question = "Как реализовать выполнение предварительной инициализации или подготовительных действий перед запуском приложения?"
  answer = "### Основной способ: `lifespan`\n\nВ современных FastAPI-приложениях подготовительные действия перед запуском лучше делать через `lifespan`.\n\nЭто механизм жизненного цикла приложения:\n\n```text\nкод до yield     → выполняется перед началом приёма запросов\nyield            → приложение работает\nкод после yield  → выполняется при завершении приложения\n```\n\nFastAPI рекомендует использовать именно `lifespan` для startup/shutdown-логики. Старый способ через `@app.on_event(\"startup\")` считается альтернативным/deprecated; при переданном `lifespan` обработчики `startup` и `shutdown` уже не вызываются. \n\n---\n\n### Пример\n\n```python\nfrom contextlib import asynccontextmanager\n\nfrom fastapi import FastAPI\n\n\n@asynccontextmanager\nasync def lifespan(app: FastAPI):\n    # Подготовительные действия перед запуском приложения\n    print(\"Init resources\")\n\n    app.state.cache = {}\n    app.state.settings_loaded = True\n\n    yield\n\n    # Действия при остановке приложения\n    print(\"Cleanup resources\")\n\n    app.state.cache.clear()\n\n\napp = FastAPI(lifespan=lifespan)\n\n\n@app.get(\"/health\")\nasync def health():\n    return {\"status\": \"ok\"}\n```\n\nЧто происходит:\n\n```text\nuvicorn запускает приложение\n↓\nFastAPI вызывает lifespan\n↓\nвыполняется код до yield\n↓\nприложение начинает принимать HTTP-запросы\n↓\nпри остановке выполняется код после yield\n```\n\nStarlette, на которой основан FastAPI, указывает, что приложение не начнёт обслуживать входящие запросы, пока lifespan не выполнит startup-часть. \n\n---\n\n### Пример с подключением Redis\n\n```python\nfrom contextlib import asynccontextmanager\n\nfrom fastapi import FastAPI, Request\nfrom redis.asyncio import Redis\n\n\n@asynccontextmanager\nasync def lifespan(app: FastAPI):\n    app.state.redis = Redis(\n        host=\"localhost\",\n        port=6379,\n        decode_responses=True,\n    )\n\n    yield\n\n    await app.state.redis.aclose()\n\n\napp = FastAPI(lifespan=lifespan)\n\n\n@app.get(\"/ping\")\nasync def ping(request: Request):\n    redis: Redis = request.app.state.redis\n    result = await redis.ping()\n    return {\"redis\": result}\n```\n\nЗдесь Redis-клиент создаётся один раз при старте приложения и закрывается при остановке.\n\n---\n\n### Пример с HTTP-клиентом\n\n```python\nfrom contextlib import asynccontextmanager\n\nimport httpx\nfrom fastapi import FastAPI, Request\n\n\n@asynccontextmanager\nasync def lifespan(app: FastAPI):\n    app.state.http_client = httpx.AsyncClient()\n\n    yield\n\n    await app.state.http_client.aclose()\n\n\napp = FastAPI(lifespan=lifespan)\n\n\n@app.get(\"/external\")\nasync def external(request: Request):\n    client: httpx.AsyncClient = request.app.state.http_client\n    response = await client.get(\"https://example.com\")\n    return {\"status_code\": response.status_code}\n```\n\nОбщий ресурс удобно хранить в `app.state`. Starlette официально поддерживает хранение произвольного состояния на объекте приложения через `app.state`, а также использование lifespan state для передачи объектов в requests. \n\n---\n\n### Что обычно инициализируют через `lifespan`\n\n```text\n- подключение к Redis\n- HTTP-клиент\n- пул подключений к БД\n- ML-модель\n- кэш справочников\n- проверку доступности внешних сервисов\n- создание клиента S3/MinIO\n- запуск внутренних async-задач\n- освобождение ресурсов при shutdown\n```\n\nПример FastAPI в документации показывает загрузку ML-модели до начала обработки запросов и очистку ресурсов после завершения приложения. \n\n---\n\n### Старый способ: `@app.on_event(\"startup\")`\n\nТак тоже можно встретить:\n\n```python\nfrom fastapi import FastAPI\n\napp = FastAPI()\n\n\n@app.on_event(\"startup\")\nasync def startup_event():\n    print(\"Application startup\")\n\n\n@app.on_event(\"shutdown\")\nasync def shutdown_event():\n    print(\"Application shutdown\")\n```\n\nНо для нового кода лучше использовать `lifespan`.\n\nПричина: startup и shutdown часто связаны между собой. Например, ты открыл Redis-клиент при старте и должен закрыть его при остановке. Через `lifespan` это лежит в одном месте:\n\n```python\n@asynccontextmanager\nasync def lifespan(app: FastAPI):\n    app.state.redis = Redis(...)\n    yield\n    await app.state.redis.aclose()\n```\n\nА через старый стиль это было бы разнесено по двум функциям:\n\n```python\n@app.on_event(\"startup\")\nasync def startup():\n    ...\n\n\n@app.on_event(\"shutdown\")\nasync def shutdown():\n    ...\n```\n\nFastAPI прямо указывает, что связанная startup/shutdown-логика удобнее через `lifespan`, поэтому этот способ сейчас рекомендуется. \n\n---\n\n### Важный момент: это не `Depends`\n\n`Depends()` выполняется в контексте конкретного запроса.\n\n```text\nDepends:\n    на каждый request или по request-cache\n\nlifespan:\n    один раз при запуске приложения\n    один раз при остановке приложения\n```\n\nТо есть для подготовки приложения лучше не использовать dependency.\n\nПлохо:\n\n```python\nasync def get_redis():\n    redis = Redis(...)\n    return redis\n```\n\nТак Redis может создаваться на запросах.\n\nЛучше:\n\n```python\n@asynccontextmanager\nasync def lifespan(app: FastAPI):\n    app.state.redis = Redis(...)\n    yield\n    await app.state.redis.aclose()\n```\n\nА dependency можно использовать только для доступа к уже созданному ресурсу:\n\n```python\nfrom typing import Annotated\n\nfrom fastapi import Depends, Request\n\n\ndef get_redis(request: Request):\n    return request.app.state.redis\n\n\n@app.get(\"/data\")\nasync def data(redis: Annotated[Redis, Depends(get_redis)]):\n    return {\"ok\": await redis.ping()}\n```\n\n---\n\n### Для миграций БД\n\nМиграции обычно лучше не запускать внутри FastAPI `lifespan`.\n\nЛучше делать отдельной командой перед стартом приложения:\n\n```bash\nalembic upgrade head\nuvicorn app.main:app\n```\n\nИли в Docker entrypoint:\n\n```bash\n#!/bin/sh\n\nalembic upgrade head\nexec uvicorn app.main:app --host 0.0.0.0 --port 8000\n```\n\nПочему так лучше:\n\n```text\n- миграции должны выполниться один раз\n- при нескольких worker-ах lifespan выполнится в каждом процессе\n- при рестартах контейнеров можно получить конкуренцию\n- ошибки миграций проще контролировать отдельно от web-сервера\n```\n\n`lifespan` подходит для инициализации ресурсов процесса приложения, а не для одноразовых инфраструктурных операций уровня деплоя.\n\n---\n\n### Важный момент про несколько workers\n\nЕсли запустить приложение так:\n\n```bash\nuvicorn app.main:app --workers 4\n```\n\nто у тебя будет 4 процесса приложения.\n\nЗначит startup/lifespan-код выполнится в каждом worker-процессе:\n\n```text\nworker 1 → lifespan\nworker 2 → lifespan\nworker 3 → lifespan\nworker 4 → lifespan\n```\n\nЭто нормально для ресурсов процесса:\n\n```text\n- создать Redis-клиент\n- создать DB pool\n- загрузить локальный кэш\n```\n\nНо опасно для операций, которые должны выполниться один раз глобально:\n\n```text\n- создать администратора\n- применить миграции\n- пересоздать индексы\n- очистить таблицы\n- отправить уведомления\n```\n\nТакие действия лучше выносить в отдельный management command / prestart script.\n\n---\n\n### Практическая схема\n\n```python\nfrom contextlib import asynccontextmanager\nfrom typing import Annotated\n\nimport httpx\nfrom fastapi import Depends, FastAPI, Request\nfrom redis.asyncio import Redis\n\n\n@asynccontextmanager\nasync def lifespan(app: FastAPI):\n    app.state.redis = Redis(\n        host=\"localhost\",\n        port=6379,\n        decode_responses=True,\n    )\n    app.state.http_client = httpx.AsyncClient()\n\n    yield\n\n    await app.state.http_client.aclose()\n    await app.state.redis.aclose()\n\n\napp = FastAPI(lifespan=lifespan)\n\n\ndef get_redis(request: Request) -> Redis:\n    return request.app.state.redis\n\n\ndef get_http_client(request: Request) -> httpx.AsyncClient:\n    return request.app.state.http_client\n\n\n@app.get(\"/health\")\nasync def health(\n    redis: Annotated[Redis, Depends(get_redis)],\n    client: Annotated[httpx.AsyncClient, Depends(get_http_client)],\n):\n    redis_ok = await redis.ping()\n\n    return {\n        \"app\": \"ok\",\n        \"redis\": redis_ok,\n        \"http_client_closed\": client.is_closed,\n    }\n```\n\n### Итог\n\n```text\nДля подготовки приложения в FastAPI:\n    используй lifespan\n\nДля доступа к подготовленным ресурсам:\n    используй Depends\n\nДля одноразовых задач деплоя:\n    используй отдельный prestart script / management command\n```\n\nГлавная формула:\n\n```text\nlifespan — инициализация приложения\nDepends  — зависимости конкретного запроса\nservice  — бизнес-логика\n```"
  popularity = 2.63

[[questions]]
  id = 13
  question = "Как корректно организовать запуск фонового бесконечного процесса или дополнительного цикла внутри асинхронного приложения?"
  answer = "### Правильный способ\n\nВ FastAPI бесконечный фоновый процесс лучше запускать через `lifespan`, а внутри него создавать `asyncio.Task`.\n\n`lifespan` выполняет код до `yield` перед началом обработки запросов, а код после `yield` — при завершении приложения. FastAPI рекомендует этот механизм для startup/shutdown-логики. \n\nОбщая схема:\n\n```text\nstartup:\n    создать фоновую task\n\nruntime:\n    приложение обрабатывает HTTP-запросы\n    фоновый цикл работает параллельно\n\nshutdown:\n    остановить фоновую task\n    дождаться завершения cleanup\n```\n\n---\n\n### Базовый пример\n\n```python\nimport asyncio\nimport logging\nfrom contextlib import asynccontextmanager, suppress\n\nfrom fastapi import FastAPI\n\nlogger = logging.getLogger(__name__)\n\n\nasync def do_background_work() -> None:\n    \"\"\"\n    Одна итерация фоновой работы:\n    - проверить очередь\n    - обновить кэш\n    - отправить отложенные события\n    - почистить старые данные\n    \"\"\"\n    logger.info(\"Background iteration\")\n    await asyncio.sleep(1)\n\n\nasync def background_loop(stop_event: asyncio.Event) -> None:\n    try:\n        while not stop_event.is_set():\n            try:\n                await do_background_work()\n            except Exception:\n                logger.exception(\"Background loop iteration failed\")\n\n            try:\n                await asyncio.wait_for(stop_event.wait(), timeout=10)\n            except asyncio.TimeoutError:\n                pass\n\n    except asyncio.CancelledError:\n        logger.info(\"Background loop cancelled\")\n        raise\n\n    finally:\n        logger.info(\"Background loop cleanup finished\")\n\n\n@asynccontextmanager\nasync def lifespan(app: FastAPI):\n    stop_event = asyncio.Event()\n\n    task = asyncio.create_task(\n        background_loop(stop_event),\n        name=\"background-loop\",\n    )\n\n    app.state.background_task = task\n\n    try:\n        yield\n    finally:\n        stop_event.set()\n        task.cancel()\n\n        with suppress(asyncio.CancelledError):\n            await task\n\n\napp = FastAPI(lifespan=lifespan)\n\n\n@app.get(\"/health\")\nasync def health():\n    return {\"status\": \"ok\"}\n```\n\n`asyncio.create_task()` планирует корутину для конкурентного выполнения, а документация Python отдельно подчёркивает, что ссылку на созданную task нужно сохранять, иначе задача может быть потеряна сборщиком мусора. \n\n---\n\n### Почему не просто `while True` в startup\n\nПлохо:\n\n```python\n@asynccontextmanager\nasync def lifespan(app: FastAPI):\n    while True:\n        await do_background_work()\n\n    yield\n```\n\nПроблема:\n\n```text\nlifespan не дойдёт до yield\n↓\nприложение не начнёт принимать запросы\n```\n\nStarlette, на которой основан FastAPI, прямо указывает: приложение не начинает обслуживать входящие запросы, пока startup-часть lifespan не завершилась. \n\nПоэтому бесконечный цикл нужно не выполнять напрямую, а запускать как отдельную задачу:\n\n```python\ntask = asyncio.create_task(background_loop(stop_event))\n```\n\n---\n\n### Почему не `BackgroundTasks`\n\n`BackgroundTasks` в FastAPI предназначен для задач, которые нужно выполнить **после отправки конкретного HTTP-ответа**. Например: отправить email, записать лог, обработать файл после запроса. \n\nТо есть это не механизм для постоянного фонового цикла.\n\nПлохо:\n\n```python\n@app.post(\"/start\")\nasync def start(background_tasks: BackgroundTasks):\n    background_tasks.add_task(background_loop)\n    return {\"status\": \"started\"}\n```\n\nПочему плохо:\n\n```text\n1. BackgroundTasks привязан к request/response\n2. Он не является lifecycle-механизмом приложения\n3. Сложнее контролировать shutdown\n4. Можно случайно запустить несколько одинаковых циклов\n5. Нет нормальной модели владения задачей\n```\n\nДля постоянного процесса:\n\n```text\nlifespan + asyncio.create_task\n```\n\nДля фоновой задачи после конкретного запроса:\n\n```text\nBackgroundTasks\n```\n\n---\n\n### Как должен быть устроен бесконечный цикл\n\nХороший фоновый цикл должен:\n\n```text\n1. Иметь await внутри цикла\n2. Уметь завершаться\n3. Обрабатывать CancelledError\n4. Не глушить CancelledError полностью\n5. Логировать ошибки итераций\n6. Не падать навсегда из-за одной ошибки\n7. Корректно освобождать ресурсы в finally\n```\n\nПример нормального цикла:\n\n```python\nasync def background_loop(stop_event: asyncio.Event) -> None:\n    try:\n        while not stop_event.is_set():\n            try:\n                await do_background_work()\n            except Exception:\n                logger.exception(\"Background iteration failed\")\n\n            await asyncio.sleep(10)\n\n    except asyncio.CancelledError:\n        logger.info(\"Background task was cancelled\")\n        raise\n\n    finally:\n        logger.info(\"Cleanup background resources\")\n```\n\nВажно: `CancelledError` лучше не проглатывать. Его нужно либо не ловить вообще, либо поймать для cleanup и снова сделать `raise`.\n\n---\n\n### Вариант для consumer-а очереди\n\nНапример, есть `asyncio.Queue`, и отдельный процесс должен постоянно читать задачи:\n\n```python\nimport asyncio\nimport logging\nfrom contextlib import asynccontextmanager, suppress\n\nfrom fastapi import FastAPI, Request\n\nlogger = logging.getLogger(__name__)\n\n\nasync def queue_worker(queue: asyncio.Queue) -> None:\n    try:\n        while True:\n            item = await queue.get()\n\n            try:\n                logger.info(\"Processing item: %s\", item)\n                await asyncio.sleep(1)\n            except Exception:\n                logger.exception(\"Failed to process item\")\n            finally:\n                queue.task_done()\n\n    except asyncio.CancelledError:\n        logger.info(\"Queue worker cancelled\")\n        raise\n\n\n@asynccontextmanager\nasync def lifespan(app: FastAPI):\n    queue: asyncio.Queue = asyncio.Queue()\n    task = asyncio.create_task(queue_worker(queue), name=\"queue-worker\")\n\n    app.state.queue = queue\n    app.state.queue_worker_task = task\n\n    try:\n        yield\n    finally:\n        task.cancel()\n\n        with suppress(asyncio.CancelledError):\n            await task\n\n\napp = FastAPI(lifespan=lifespan)\n\n\n@app.post(\"/tasks\")\nasync def add_task(request: Request):\n    await request.app.state.queue.put({\"type\": \"demo\"})\n    return {\"status\": \"queued\"}\n```\n\nЗдесь:\n\n```text\nHTTP endpoint кладёт задачу в queue\n↓\nqueue_worker обрабатывает её независимо\n↓\nпри shutdown worker отменяется\n```\n\n---\n\n### Несколько фоновых процессов\n\nМожно запустить несколько задач:\n\n```python\n@asynccontextmanager\nasync def lifespan(app: FastAPI):\n    tasks = [\n        asyncio.create_task(background_loop_1(), name=\"loop-1\"),\n        asyncio.create_task(background_loop_2(), name=\"loop-2\"),\n        asyncio.create_task(background_loop_3(), name=\"loop-3\"),\n    ]\n\n    app.state.background_tasks = tasks\n\n    try:\n        yield\n    finally:\n        for task in tasks:\n            task.cancel()\n\n        for task in tasks:\n            with suppress(asyncio.CancelledError):\n                await task\n```\n\nНо если задач становится много, лучше смотреть в сторону `anyio.create_task_group()`. Starlette в документации по lifespan отдельно рекомендует рассматривать `anyio.create_task_group()` для управления асинхронными задачами. \n\nAnyIO task group имеет собственный cancel scope, и всю группу можно отменить через `tg.cancel_scope.cancel()`. \n\n---\n\n### Важный момент про несколько workers\n\nЕсли приложение запущено так:\n\n```bash\nuvicorn app.main:app --workers 4\n```\n\nто будет 4 процесса.\n\nЗначит `lifespan` выполнится 4 раза:\n\n```text\nworker 1 → background_loop\nworker 2 → background_loop\nworker 3 → background_loop\nworker 4 → background_loop\n```\n\nЭто нормально для локальных задач каждого процесса:\n\n```text\n- локальный health-check\n- локальный in-memory cache refresh\n- обслуживание локального состояния worker-а\n```\n\nНо опасно для глобальных задач:\n\n```text\n- списание денег\n- отправка email-рассылки\n- обработка общей очереди без lock-а\n- периодическое создание отчётов\n- изменение общих данных в БД\n```\n\nДля глобального фонового процесса лучше использовать отдельный worker:\n\n```text\nFastAPI process     → принимает HTTP\nWorker process      → выполняет фоновые задачи\nRedis/RabbitMQ      → очередь между ними\n```\n\nFastAPI в документации по `BackgroundTasks` также указывает, что для тяжёлых фоновых вычислений или работы в нескольких процессах/серверах могут быть полезны инструменты вроде Celery с брокером сообщений. \n\n---\n\n### Что нельзя делать\n\n### 1. Нельзя запускать бесконечный цикл без `await`\n\n```python\nasync def bad_loop():\n    while True:\n        do_sync_work()\n```\n\nТакой цикл забьёт event loop.\n\nНужно:\n\n```python\nasync def good_loop():\n    while True:\n        await do_async_work()\n        await asyncio.sleep(10)\n```\n\n---\n\n### 2. Нельзя создавать task и не хранить ссылку\n\nПлохо:\n\n```python\nasyncio.create_task(background_loop())\n```\n\nЛучше:\n\n```python\ntask = asyncio.create_task(background_loop())\napp.state.background_task = task\n```\n\nPython-документация прямо указывает сохранять ссылку на task для надёжного fire-and-forget сценария. \n\n---\n\n### 3. Нельзя использовать `BackgroundTasks` для вечного процесса\n\nПлохо:\n\n```python\nbackground_tasks.add_task(infinite_loop)\n```\n\n`BackgroundTasks` — для задач после конкретного ответа, а не для жизненного цикла приложения. \n\n---\n\n### 4. Нельзя забывать про shutdown\n\nПлохо:\n\n```python\n@asynccontextmanager\nasync def lifespan(app: FastAPI):\n    asyncio.create_task(background_loop())\n    yield\n```\n\nЗдесь задача запускается, но не управляется.\n\nЛучше:\n\n```python\ntask = asyncio.create_task(background_loop())\n\ntry:\n    yield\nfinally:\n    task.cancel()\n    with suppress(asyncio.CancelledError):\n        await task\n```\n\n---\n\n### Практическое правило\n\n```text\nlifespan\n    запуск и остановка долгоживущих фоновых процессов\n\nasyncio.create_task\n    запуск корутины параллельно с приложением\n\ntask.cancel() + await task\n    корректная остановка\n\nBackgroundTasks\n    короткая задача после конкретного HTTP-ответа\n\nCelery / RQ / Dramatiq\n    тяжёлые, надёжные или распределённые фоновые задачи\n```\n\nИтоговая формула:\n\n```text\nДля бесконечного фонового цикла в FastAPI:\n    запускай task в lifespan\n    храни ссылку на task\n    делай await внутри цикла\n    обрабатывай ошибки\n    отменяй task на shutdown\n    не используй BackgroundTasks для вечных процессов\n```"
  popularity = 2.63

