  question = "Может ли Depends принимать асинхронную функцию"
  answer = "Да, `Depends` может принимать асинхронную функцию.\n\n### Пример\n\n```python\nfrom fastapi import Depends, FastAPI\n\napp = FastAPI()\n\n\nasync def get_current_user():\n    # например, асинхронный запрос в БД / Redis / внешний API\n    return {\"id\": 1, \"username\": \"admin\"}\n\n\n@app.get(\"/profile\")\nasync def get_profile(user: dict = Depends(get_current_user)):\n    return user\n```\n\nFastAPI сам вызовет dependency и дождётся результата, если это `async def`.\n\n### Что можно передавать в `Depends`\n\n```python\ndef sync_dependency():\n    return \"sync\"\n\n\nasync def async_dependency():\n    return \"async\"\n```\n\nОба варианта корректны:\n\n```python\n@app.get(\"/sync\")\ndef route_1(value: str = Depends(sync_dependency)):\n    return value\n\n\n@app.get(\"/async\")\nasync def route_2(value: str = Depends(async_dependency)):\n    return value\n```\n\nFastAPI поддерживает обычные `def` и `async def` зависимости. В документации `Depends()` описан как механизм, принимающий callable, а раздел про зависимости показывает, что FastAPI сам решает и вызывает зависимости перед path operation. \n\n### Важный момент\n\nНе нужно писать так:\n\n```python\nDepends(await get_current_user())\n```\n\nЭто ошибка по смыслу. В `Depends` передаётся сама функция, а не результат её вызова:\n\n```python\nDepends(get_current_user)\n```\n\n### Когда делать dependency асинхронной\n\n`async def` dependency нужна, когда внутри есть асинхронные операции:\n\n```python\nasync def get_user_from_db():\n    user = await db.users.get(id=1)\n    return user\n```\n\nНапример:\n\n```python\n@app.get(\"/users/me\")\nasync def read_me(user = Depends(get_user_from_db)):\n    return user\n```\n\n### Коротко\n\n```text\nDepends(sync_func)   — можно\nDepends(async_func)  — можно\nDepends(func())      — обычно нельзя / неправильно\nDepends(await func()) — неправильно\n```\n\nДля FastAPI это штатный сценарий: зависимости могут быть синхронными, асинхронными, а также зависимостями с `yield`; для `yield` документация отдельно указывает поддержку обычных и async-вариантов. "
  popularity = 2.63

[[questions]]
  id = 6
  question = "Как внутри устроен Depends в FastAPI?"
  answer = "Внутри `Depends` — это не «магический вызов функции», а объект-описание зависимости, который FastAPI позже разбирает при построении и обработке route.\n\n### 1. Что реально делает `Depends(...)`\n\nКогда ты пишешь:\n\n```python\nfrom fastapi import Depends\n\nasync def get_user():\n    return {\"id\": 1}\n\n\n@app.get(\"/profile\")\nasync def profile(user = Depends(get_user)):\n    return user\n```\n\n`Depends(get_user)` **не вызывает** `get_user`.\n\nОн просто создаёт объект с настройками:\n\n```text\ndependency = get_user\nuse_cache = True\nscope = None\n```\n\nВ официальной reference-документации FastAPI прямо указано: `Depends` принимает callable, не надо вызывать его напрямую, FastAPI вызовет его сам. В исходном коде `fastapi.Depends(...)` возвращает `params.Depends(dependency=dependency, use_cache=use_cache, scope=scope)`. \n\nТо есть упрощённо:\n\n```python\ndef Depends(dependency=None, *, use_cache=True, scope=None):\n    return params.Depends(\n        dependency=dependency,\n        use_cache=use_cache,\n        scope=scope,\n    )\n```\n\n### 2. Где FastAPI находит `Depends`\n\nFastAPI анализирует сигнатуру endpoint-функции.\n\nНапример:\n\n```python\n@app.get(\"/items/\")\nasync def get_items(\n    q: str | None = None,\n    user = Depends(get_user),\n):\n    ...\n```\n\nFastAPI смотрит параметры функции через `inspect.signature(...)` и для каждого параметра определяет:\n\n```text\nq       -> обычный query parameter\nuser    -> dependency parameter\n```\n\nВ исходниках это делает логика вокруг `get_dependant(...)`: FastAPI получает сигнатуру callable, проходит по параметрам, анализирует каждый параметр через `analyze_param(...)`, а если найден `Depends`, создаёт подзависимость через ещё один `get_dependant(...)`. \n\n### 3. FastAPI строит дерево зависимостей\n\nЗависимости могут зависеть от других зависимостей:\n\n```python\nasync def get_db():\n    return \"db\"\n\n\nasync def get_user(db = Depends(get_db)):\n    return {\"db\": db}\n\n\n@app.get(\"/profile\")\nasync def profile(user = Depends(get_user)):\n    return user\n```\n\nFastAPI строит примерно такое дерево:\n\n```text\nprofile\n└── get_user\n    └── get_db\n```\n\nДокументация FastAPI описывает это как hierarchical dependency injection system: можно определять зависимости, которые сами имеют зависимости, а FastAPI строит дерево и решает его по шагам. \n\n### 4. Перед запросом FastAPI «решает» зависимости\n\nКогда приходит HTTP-запрос, FastAPI не сразу вызывает endpoint. Сначала он вызывает зависимости.\n\nУпрощённая схема:\n\n```text\nHTTP request\n↓\nнайти route\n↓\nразобрать path/query/header/cookie/body параметры\n↓\nвыполнить зависимости\n↓\nпередать результаты зависимостей в endpoint\n↓\nвызвать endpoint\n↓\nвернуть response\n```\n\nНапример:\n\n```python\nasync def get_user():\n    return {\"id\": 1}\n\n\n@app.get(\"/profile\")\nasync def profile(user = Depends(get_user)):\n    return user\n```\n\nВнутренне это похоже на:\n\n```python\nresolved_user = await get_user()\n\nresult = await profile(user=resolved_user)\n```\n\nНо на практике там больше логики: валидация параметров, кэширование, sub-dependencies, `yield` dependencies, security scopes, request/response/background tasks.\n\n### 5. Как FastAPI вызывает sync и async зависимости\n\nFastAPI различает тип callable:\n\n```text\nasync def dependency -> await dependency(...)\ndef dependency       -> запустить через threadpool\nyield dependency     -> обработать как context manager\n```\n\nДокументация указывает, что зависимости могут быть как `async def`, так и обычными `def`; FastAPI сам понимает, что делать. \n\nВ исходниках `solve_dependencies(...)` делает примерно такую развилку:\n\n```python\nif dependency_is_generator:\n    solved = await solve_generator(...)\nelif dependency_is_async:\n    solved = await call(**values)\nelse:\n    solved = await run_in_threadpool(call, **values)\n```\n\nТо есть обычная синхронная dependency не блокирует event loop напрямую: FastAPI запускает её через threadpool. Эта логика находится в `solve_dependencies(...)` в `fastapi/dependencies/utils.py`. \n\n### 6. Что такое `use_cache=True`\n\nПо умолчанию результат одной и той же dependency кэшируется **в рамках одного request**.\n\nПример:\n\n```python\nasync def get_user():\n    print(\"called\")\n    return {\"id\": 1}\n\n\nasync def check_permissions(user = Depends(get_user)):\n    return True\n\n\n@app.get(\"/profile\")\nasync def profile(\n    user = Depends(get_user),\n    allowed = Depends(check_permissions),\n):\n    return user\n```\n\n`get_user` может быть нужен и endpoint-у, и другой dependency. Но FastAPI по умолчанию вызовет его один раз за request и переиспользует результат.\n\nЭто поведение описано в параметре `use_cache`: после первого вызова dependency значение переиспользуется до конца текущего request; `use_cache=False` отключает это поведение. \n\n### 7. `Depends` сам по себе ничего не делает вне FastAPI\n\nВажно:\n\n```python\nuser = Depends(get_user)\n```\n\nЭто не пользователь. Это объект зависимости.\n\nТо есть в обычной функции так не сработает:\n\n```python\nasync def service(user = Depends(get_user)):\n    ...\n```\n\nЕсли эту функцию вызвать вручную, FastAPI не будет рядом, и `user` будет не результатом `get_user`, а объектом `Depends`.\n\nПравильная идея такая:\n\n```text\nDepends работает только там, где FastAPI сам анализирует функцию:\nendpoint, dependency, router-level dependency, app-level dependency.\n```\n\n### 8. Короткая схема\n\n```text\nТы пишешь:\n\nuser = Depends(get_user)\n\nFastAPI делает:\n\n1. Сохраняет get_user в объект Depends\n2. При регистрации route анализирует сигнатуру endpoint\n3. Видит параметр с Depends\n4. Строит Dependant-дерево\n5. При request вызывает sub-dependencies\n6. Валидирует request-параметры\n7. Выполняет sync/async/yield зависимости\n8. Кэширует результат, если use_cache=True\n9. Передаёт результат в endpoint\n```\n\n### Главное\n\n`Depends` — это декларация зависимости, а не вызов зависимости.\n\n```python\nuser = Depends(get_user)\n```\n\nозначает:\n\n```text\nFastAPI, перед вызовом endpoint-а вызови get_user(),\nвозьми результат и подставь его в параметр user.\n```\n\nИменно поэтому нельзя писать:\n\n```python\nDepends(get_user())\n```\n\nПотому что тогда ты передаёшь в `Depends` не функцию, а результат её вызова."
  popularity = 2.63

