  id = 18
  question = "Какой вид Response по умолчанию используется в FastAPI?"
  answer = "### По умолчанию: `JSONResponse`\n\nВ FastAPI по умолчанию используется **JSON-ответ** — обычно это `JSONResponse`.\n\nТо есть если endpoint возвращает обычный `dict`, `list`, Pydantic-модель и т.п., FastAPI превращает это в JSON и отправляет клиенту с media type:\n\n```http\nContent-Type: application/json\n```\n\nДокументация FastAPI прямо указывает: по умолчанию FastAPI возвращает JSON responses; если `response_model` не задан, FastAPI использует `jsonable_encoder` и помещает результат в `JSONResponse`. \n\n---\n\n### Пример\n\n```python\nfrom fastapi import FastAPI\n\napp = FastAPI()\n\n\n@app.get(\"/user\")\nasync def get_user():\n    return {\n        \"id\": 1,\n        \"username\": \"admin\",\n    }\n```\n\nФактически FastAPI сделает примерно так:\n\n```python\nJSONResponse(\n    content={\n        \"id\": 1,\n        \"username\": \"admin\",\n    }\n)\n```\n\nКлиент получит:\n\n```json\n{\n  \"id\": 1,\n  \"username\": \"admin\"\n}\n```\n\n---\n\n### Если указан `response_model`\n\n```python\nfrom pydantic import BaseModel\n\n\nclass UserOut(BaseModel):\n    id: int\n    username: str\n\n\n@app.get(\"/user\", response_model=UserOut)\nasync def get_user():\n    return {\n        \"id\": 1,\n        \"username\": \"admin\",\n        \"password\": \"secret\",\n    }\n```\n\nFastAPI сначала применит `response_model`, отвалидирует и отфильтрует данные, а затем вернёт JSON-ответ. `response_model` используется для документации, валидации, конвертации и фильтрации выходных данных. \n\nОтвет:\n\n```json\n{\n  \"id\": 1,\n  \"username\": \"admin\"\n}\n```\n\n---\n\n### Можно изменить response class\n\nНапример, на конкретном endpoint-е:\n\n```python\nfrom fastapi.responses import HTMLResponse\n\n\n@app.get(\"/page\", response_class=HTMLResponse)\nasync def page():\n    return \"<h1>Hello</h1>\"\n```\n\nИли глобально для приложения:\n\n```python\nfrom fastapi import FastAPI\nfrom fastapi.responses import ORJSONResponse\n\napp = FastAPI(\n    default_response_class=ORJSONResponse,\n)\n```\n\nFastAPI позволяет задавать `default_response_class` на уровне приложения или роутера. \n\n---\n\n### Важное уточнение\n\nЕсли ты возвращаешь готовый `Response`, FastAPI уже не оборачивает его в `JSONResponse`:\n\n```python\nfrom fastapi import Response\n\n\n@app.get(\"/xml\")\nasync def xml():\n    return Response(\n        content=\"<status>ok</status>\",\n        media_type=\"application/xml\",\n    )\n```\n\nЗдесь ответ будет XML, а не JSON.\n\n---\n\n### Итог\n\n```text\nПо умолчанию FastAPI использует JSONResponse.\n\ndict/list/Pydantic model\n↓\njsonable_encoder / response_model\n↓\nJSONResponse\n↓\napplication/json\n```\n\nНо response можно заменить:\n\n```text\nresponse_class=HTMLResponse\nresponse_class=PlainTextResponse\nresponse_class=FileResponse\nresponse_class=StreamingResponse\ndefault_response_class=ORJSONResponse\nreturn Response(...)\n```"
  popularity = 5.26

