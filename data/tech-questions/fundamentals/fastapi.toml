  question = "Что такое BackgroundTasks в FastAPI?"
  answer = "### Что такое `BackgroundTasks`\n\n`BackgroundTasks` в FastAPI — это механизм для запуска функции **после отправки HTTP-ответа клиенту**.\n\nТо есть клиент не ждёт завершения этой операции.\n\nПример сценариев:\n\n```text\n- записать лог\n- отправить email\n- удалить временный файл\n- обновить простую статистику\n- выполнить небольшую пост-обработку после request\n```\n\nFastAPI описывает `BackgroundTasks` как способ определить задачи, которые должны выполниться после возврата ответа. Это полезно для операций, из-за которых клиент не должен ждать завершения обработки. \n\n---\n\n### Простой пример\n\n```python\nfrom fastapi import BackgroundTasks, FastAPI\n\napp = FastAPI()\n\n\ndef write_log(message: str) -> None:\n    with open(\"log.txt\", mode=\"a\", encoding=\"utf-8\") as file:\n        file.write(message + \"\\n\")\n\n\n@app.post(\"/send\")\nasync def send_message(\n    background_tasks: BackgroundTasks,\n):\n    background_tasks.add_task(\n        write_log,\n        \"Message was sent\",\n    )\n\n    return {\"status\": \"accepted\"}\n```\n\nЧто произойдёт:\n\n```text\n1. Клиент отправляет POST /send\n2. Endpoint добавляет задачу через background_tasks.add_task(...)\n3. FastAPI сразу возвращает response\n4. После отправки response выполняется write_log(...)\n```\n\n---\n\n### Как это работает логически\n\n```text\nrequest\n↓\nendpoint\n↓\nbackground_tasks.add_task(...)\n↓\nreturn response\n↓\nresponse отправлен клиенту\n↓\nBackgroundTasks выполняет добавленные задачи\n```\n\nStarlette, на которой основан FastAPI, описывает background task как задачу, прикреплённую к response, которая запускается только после отправки response. \n\n---\n\n### Можно передавать аргументы\n\n```python\ndef send_email(email: str, text: str) -> None:\n    print(f\"Send email to {email}: {text}\")\n\n\n@app.post(\"/register\")\nasync def register_user(\n    background_tasks: BackgroundTasks,\n):\n    background_tasks.add_task(\n        send_email,\n        \"user@example.com\",\n        \"Welcome\",\n    )\n\n    return {\"status\": \"registered\"}\n```\n\n`add_task()` принимает:\n\n```text\n1. функцию\n2. positional args\n3. keyword args\n```\n\n---\n\n### Можно использовать async-функцию\n\n```python\nasync def async_write_log(message: str) -> None:\n    await some_async_logger.write(message)\n\n\n@app.post(\"/event\")\nasync def create_event(\n    background_tasks: BackgroundTasks,\n):\n    background_tasks.add_task(\n        async_write_log,\n        \"event created\",\n    )\n\n    return {\"status\": \"ok\"}\n```\n\nМожно добавлять и обычные `def`, и `async def`.\n\nСинхронный код Starlette запускает через thread pool, чтобы не блокировать event loop. Это касается endpoint-функций и background tasks. \n\n---\n\n### `BackgroundTasks` можно использовать в dependency\n\nНапример, dependency добавляет логирование:\n\n```python\nfrom fastapi import BackgroundTasks, Depends, FastAPI\n\napp = FastAPI()\n\n\ndef write_audit_log(action: str) -> None:\n    print(f\"Audit: {action}\")\n\n\ndef add_audit_log(\n    background_tasks: BackgroundTasks,\n):\n    background_tasks.add_task(\n        write_audit_log,\n        \"endpoint was called\",\n    )\n\n\n@app.post(\"/items\", dependencies=[Depends(add_audit_log)])\nasync def create_item():\n    return {\"status\": \"created\"}\n```\n\nFastAPI умеет объединять `BackgroundTasks`, объявленные в endpoint, dependency и sub-dependency, в один общий объект. \n\n---\n\n### Чем отличается от `asyncio.create_task`\n\n`BackgroundTasks` привязан к конкретному HTTP-запросу и response.\n\n```text\nBackgroundTasks:\n    выполнить задачу после ответа на конкретный request\n\nasyncio.create_task:\n    запустить корутину независимо внутри event loop\n```\n\nДля задачи после ответа:\n\n```python\n@app.post(\"/notify\")\nasync def notify(background_tasks: BackgroundTasks):\n    background_tasks.add_task(send_email, \"user@example.com\")\n    return {\"status\": \"queued\"}\n```\n\nДля долгоживущего процесса лучше использовать `lifespan + asyncio.create_task`, а не `BackgroundTasks`.\n\n---\n\n### Чем отличается от Celery / RQ / Dramatiq\n\n`BackgroundTasks` выполняется **внутри того же процесса FastAPI**.\n\n```text\nFastAPI process\n├── HTTP endpoint\n└── BackgroundTasks\n```\n\nЭто значит:\n\n```text\n- нет отдельной очереди\n- нет гарантированного retry\n- задача может пропасть при падении процесса\n- задача не распределяется между отдельными worker-сервисами\n- не подходит для тяжёлых и критичных операций\n```\n\nДля тяжёлых или надёжных фоновых задач лучше использовать отдельную очередь задач. В документации FastAPI отдельно указано, что для тяжёлых фоновых вычислений или работы в нескольких процессах/серверах можно использовать более мощные инструменты вроде Celery. \n\n---\n\n### Когда использовать `BackgroundTasks`\n\nПодходит:\n\n```text\n- короткие некритичные задачи\n- логирование\n- отправка простого уведомления\n- очистка временного файла\n- действия после успешного ответа\n```\n\nНе подходит:\n\n```text\n- бесконечный цикл\n- периодический scheduler\n- тяжёлая CPU-bound обработка\n- критичная бизнес-операция\n- обработка платежей\n- задачи, которые нельзя потерять\n- долгие задачи на минуты/часы\n```\n\n---\n\n### Важный пример: не делать так\n\nПлохо:\n\n```python\n@app.post(\"/order\")\nasync def create_order(\n    background_tasks: BackgroundTasks,\n):\n    background_tasks.add_task(save_order_to_db)\n\n    return {\"status\": \"created\"}\n```\n\nПочему плохо:\n\n```text\nКлиент уже получил \"created\",\nно заказ ещё может не сохраниться.\n```\n\nКритичную бизнес-логику надо выполнить до ответа:\n\n```python\n@app.post(\"/order\")\nasync def create_order():\n    order = await order_service.create_order()\n    return order\n```\n\nА в `BackgroundTasks` можно положить побочные действия:\n\n```python\n@app.post(\"/order\")\nasync def create_order(\n    background_tasks: BackgroundTasks,\n):\n    order = await order_service.create_order()\n\n    background_tasks.add_task(\n        send_order_email,\n        order.id,\n    )\n\n    return order\n```\n\n---\n\n### Главное\n\n```text\nBackgroundTasks — это не отдельный worker и не очередь задач.\n\nЭто механизм FastAPI/Starlette для выполнения небольших функций\nпосле того, как response уже отправлен клиенту.\n```\n\nФормула:\n\n```text\nНужно сделать что-то после конкретного request\nи потеря этой операции не критична\n→ BackgroundTasks\n\nНужен вечный цикл\n→ lifespan + asyncio.create_task\n\nНужна надёжная очередь, retry, отдельные worker-ы\n→ Celery / RQ / Dramatiq\n```"
  popularity = 2.63

