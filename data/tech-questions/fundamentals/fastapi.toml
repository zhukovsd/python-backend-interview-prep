[[questions]]
  id = 1
  question = "Какая библиотека используется в FastAPI для валидации данных?"
  answer = "В FastAPI для валидации данных используется `Pydantic`.\n\nFastAPI использует Python type hints и Pydantic-модели для проверки входных данных, например тела запроса, query/path-параметров, а также для сериализации и валидации response models. В документации FastAPI прямо используются Pydantic-модели для описания и проверки структуры данных запроса. \n\nПример:\n\n```python\nfrom pydantic import BaseModel\nfrom fastapi import FastAPI\n\napp = FastAPI()\n\n\nclass UserCreate(BaseModel):\n    username: str\n    email: str\n    age: int\n\n\n@app.post(\"/users/\")\nasync def create_user(user: UserCreate):\n    return user\n```\n\nЧто делает `Pydantic`:\n\n```text\nJSON body\n↓\nFastAPI передаёт данные в Pydantic-модель\n↓\nPydantic проверяет типы и ограничения\n↓\nendpoint получает уже валидированный объект\n```\n\nНапример, если передать:\n\n```json\n{\n  \"username\": \"alex\",\n  \"email\": \"alex@example.com\",\n  \"age\": \"not_number\"\n}\n```\n\nFastAPI вернёт ошибку валидации, потому что `age` должен быть `int`.\n\n### Важно\n\nВ современных версиях FastAPI используется `Pydantic v2`, но FastAPI также долго поддерживал `Pydantic v1`. Сам Pydantic описывает себя как библиотеку валидации данных на основе Python type annotations."
  popularity = 5.26

[[questions]]
  id = 2
  question = "Для чего используется pydantic"
  answer = "### Для чего используется Pydantic\n\n`Pydantic` используется для описания, проверки и преобразования данных через Python type hints.\n\nПроще:\n\n```text\nпришли сырые данные\n↓\nPydantic проверил структуру и типы\n↓\nошибочные данные отклонил\n↓\nвалидные данные превратил в удобный Python-объект\n```\n\nОфициально Pydantic описывает себя как библиотеку валидации данных, где валидация и сериализация управляются type annotations. \n\n### 1. Валидация входных данных\n\nНапример, пришёл JSON:\n\n```json\n{\n  \"username\": \"alex\",\n  \"age\": \"18\"\n}\n```\n\nМодель:\n\n```python\nfrom pydantic import BaseModel\n\n\nclass UserCreate(BaseModel):\n    username: str\n    age: int\n\n\nuser = UserCreate(username=\"alex\", age=\"18\")\n\nprint(user)\nprint(type(user.age))\n```\n\nРезультат:\n\n```text\nusername='alex' age=18\n<class 'int'>\n```\n\nPydantic проверил данные и привёл `\"18\"` к `int`.\n\n### 2. Ошибки при неправильных данных\n\n```python\nfrom pydantic import BaseModel, ValidationError\n\n\nclass UserCreate(BaseModel):\n    username: str\n    age: int\n\n\ntry:\n    user = UserCreate(username=\"alex\", age=\"not_number\")\nexcept ValidationError as error:\n    print(error)\n```\n\nСмысл:\n\n```text\nage должен быть int\n↓\n\"not_number\" нельзя привести к int\n↓\nPydantic выбрасывает ValidationError\n```\n\n### 3. Описание схемы данных\n\nPydantic-модель — это контракт данных:\n\n```python\nclass UserCreate(BaseModel):\n    username: str\n    email: str\n    age: int\n```\n\nОна говорит:\n\n```text\nusername должен быть строкой\nemail должен быть строкой\nage должен быть числом\n```\n\nЭто удобно для API, сервисов, DTO, настроек и конфигов.\n\n### 4. Использование в FastAPI\n\nВ FastAPI Pydantic чаще всего используют для request body:\n\n```python\nfrom fastapi import FastAPI\nfrom pydantic import BaseModel\n\napp = FastAPI()\n\n\nclass UserCreate(BaseModel):\n    username: str\n    email: str\n    age: int\n\n\n@app.post(\"/users\")\nasync def create_user(user: UserCreate):\n    return user\n```\n\nЧто происходит:\n\n```text\nклиент отправляет JSON\n↓\nFastAPI передаёт JSON в Pydantic\n↓\nPydantic валидирует данные\n↓\nendpoint получает объект UserCreate\n```\n\nFastAPI использует Pydantic-модели для валидации тела запроса, вложенных моделей и генерации схем для документации API. \n\n### 5. Сериализация данных\n\nPydantic умеет превращать модель обратно в `dict` или JSON:\n\n```python\nfrom pydantic import BaseModel\n\n\nclass User(BaseModel):\n    id: int\n    username: str\n\n\nuser = User(id=1, username=\"alex\")\n\nprint(user.model_dump())\nprint(user.model_dump_json())\n```\n\nРезультат:\n\n```text\n{'id': 1, 'username': 'alex'}\n{\"id\":1,\"username\":\"alex\"}\n```\n\nВ Pydantic v2 основной метод для преобразования модели в словарь — `model_dump()`, а сериализация означает преобразование модели в словарь или JSON-строку. \n\n### 6. Ограничения и дополнительные проверки\n\nМожно задавать ограничения через `Field`:\n\n```python\nfrom pydantic import BaseModel, Field\n\n\nclass UserCreate(BaseModel):\n    username: str = Field(min_length=3, max_length=30)\n    age: int = Field(ge=0, le=120)\n```\n\nТеперь:\n\n```text\nusername минимум 3 символа\nusername максимум 30 символов\nage от 0 до 120\n```\n\nFastAPI также показывает использование `Field` для дополнительных валидаций и метаданных полей. \n\n### 7. Настройки приложения\n\nPydantic часто используют для конфигурации:\n\n```python\nfrom pydantic_settings import BaseSettings\n\n\nclass Settings(BaseSettings):\n    db_url: str\n    redis_host: str = \"localhost\"\n    debug: bool = False\n\n\nsettings = Settings()\n```\n\nСмысл:\n\n```text\n.env / переменные окружения\n↓\nPydantic проверяет типы\n↓\nприложение получает объект настроек\n```\n\nВ FastAPI-документации отдельно описано использование Pydantic-подхода для settings и environment variables. \n\n### Кратко\n\n`Pydantic` нужен для:\n\n```text\nвалидации данных\nприведения типов\nописания схемы данных\nсериализации в dict / JSON\nработы с request / response моделями в FastAPI\nвалидации настроек приложения\nгенерации JSON Schema\n```\n\nГлавная идея:\n\n```text\nPydantic позволяет описывать данные обычными Python-классами\nи type hints, а проверку берёт на себя.\n```"
  popularity = 2.63

[[questions]]
  id = 3
  question = "Как реализован механизм внедрения зависимостей (Dependency Injection)?"
  answer = "В FastAPI механизм `Dependency Injection` реализован через функцию `Depends()`.\n\nТы не создаёшь зависимости вручную внутри endpoint-а. Ты объявляешь, что endpoint зависит от какой-то функции, класса или объекта, а FastAPI сам:\n\n```text\nчитает сигнатуру endpoint-а\n↓\nнаходит параметры с Depends(...)\n↓\nвызывает dependency-функции\n↓\nполучает их результат\n↓\nпередаёт результат в endpoint\n```\n\nОфициальная документация FastAPI описывает DI как систему, где можно указать, что path operation function зависит от чего-то ещё, что должно быть выполнено перед endpoint-ом, а FastAPI выполнит это и внедрит результат. \n\n### Простой пример\n\n```python\nfrom fastapi import Depends, FastAPI\n\napp = FastAPI()\n\n\ndef get_token():\n    return \"some-token\"\n\n\n@app.get(\"/profile\")\nasync def profile(token: str = Depends(get_token)):\n    return {\"token\": token}\n```\n\nЧто происходит:\n\n```text\nGET /profile\n↓\nFastAPI видит Depends(get_token)\n↓\nвызывает get_token()\n↓\nполучает \"some-token\"\n↓\nподставляет это значение в параметр token\n↓\nвызывает profile(token=\"some-token\")\n```\n\nТо есть `Depends(get_token)` говорит FastAPI:\n\n```text\nПеред вызовом endpoint-а вызови get_token()\nи результат передай сюда\n```\n\n### Dependency — это обычный callable\n\nDependency может быть:\n\n```text\nфункцией\nasync-функцией\nклассом\nобъектом с __call__\nгенератором с yield\n```\n\nFastAPI reference указывает, что зависимости в основном обрабатываются через `Depends()`, который принимает callable. \n\nПример с async dependency:\n\n```python\nfrom fastapi import Depends, FastAPI\n\napp = FastAPI()\n\n\nasync def get_current_user():\n    return {\"id\": 1, \"username\": \"alex\"}\n\n\n@app.get(\"/me\")\nasync def me(user: dict = Depends(get_current_user)):\n    return user\n```\n\n### Dependency может сама иметь зависимости\n\nFastAPI строит дерево зависимостей.\n\n```python\nfrom fastapi import Depends, FastAPI\n\napp = FastAPI()\n\n\ndef get_db():\n    return \"db_session\"\n\n\ndef get_user_repository(db=Depends(get_db)):\n    return {\"db\": db}\n\n\n@app.get(\"/users\")\nasync def get_users(repo=Depends(get_user_repository)):\n    return repo\n```\n\nСхема:\n\n```text\nendpoint get_users\n└── get_user_repository\n    └── get_db\n```\n\nFastAPI сначала вызовет `get_db()`, потом передаст результат в `get_user_repository()`, а потом результат репозитория передаст в endpoint.\n\n### Типичный пример с БД\n\n```python\nfrom collections.abc import AsyncGenerator\nfrom fastapi import Depends, FastAPI\nfrom sqlalchemy.ext.asyncio import AsyncSession\n\napp = FastAPI()\n\n\nasync def get_db() -> AsyncGenerator[AsyncSession, None]:\n    async with async_session_maker() as session:\n        yield session\n\n\n@app.get(\"/users/{user_id}\")\nasync def get_user(\n    user_id: int,\n    db: AsyncSession = Depends(get_db),\n):\n    result = await db.execute(...)\n    return result\n```\n\nЗдесь dependency `get_db()` создаёт сессию БД и отдаёт её endpoint-у.\n\nПосле завершения запроса код после `yield`/выход из context manager выполняется для очистки ресурсов. FastAPI официально поддерживает зависимости с `yield` для случаев, когда нужны действия после завершения dependency, например cleanup. \n\n### Как это работает внутри по шагам\n\nУпрощённо:\n\n```text\n1. При регистрации route FastAPI анализирует endpoint\n   ↓\n2. Находит параметры с Depends(...)\n   ↓\n3. Строит dependency graph\n   ↓\n4. На каждый HTTP request вызывает зависимости\n   ↓\n5. Валидирует параметры зависимостей через type hints / Pydantic\n   ↓\n6. Кэширует результат dependency в рамках одного request\n   ↓\n7. Передаёт результаты в endpoint\n   ↓\n8. После ответа закрывает yield-зависимости\n```\n\nПример:\n\n```python\nasync def get_current_user(\n    token: str = Depends(get_token),\n    db: AsyncSession = Depends(get_db),\n):\n    ...\n```\n\nFastAPI понимает:\n\n```text\nget_current_user зависит от:\n├── get_token\n└── get_db\n```\n\nИ вызывает их до `get_current_user`.\n\n### Кэширование dependency внутри одного request\n\nПо умолчанию FastAPI не вызывает одну и ту же dependency несколько раз в рамках одного request, если она уже была вызвана с теми же параметрами.\n\nПример:\n\n```python\ndef get_db():\n    print(\"create db\")\n    return \"db\"\n\n\ndef get_repo(db=Depends(get_db)):\n    return db\n\n\n@app.get(\"/test\")\nasync def test(\n    db=Depends(get_db),\n    repo=Depends(get_repo),\n):\n    return {\"ok\": True}\n```\n\n`get_db()` обычно будет вызвана один раз за request, а результат будет переиспользован.\n\nВ `Depends()` есть параметр `use_cache`; по умолчанию он включён. Это описано в reference-документации FastAPI для dependencies. \n\nОтключить кэш можно так:\n\n```python\nDepends(get_db, use_cache=False)\n```\n\n### DI в FastAPI — не совсем классический DI-container\n\nВ некоторых фреймворках есть отдельный контейнер:\n\n```text\ncontainer.register(UserService)\ncontainer.resolve(UserService)\n```\n\nВ FastAPI обычно проще:\n\n```text\ndependency = обычная функция\nDepends() = декларация зависимости\nFastAPI = resolver зависимостей\n```\n\nТо есть FastAPI DI больше завязан на HTTP request, endpoint-ы, параметры запроса, авторизацию, БД-сессии и request-scoped ресурсы.\n\n### Для чего используют DI в FastAPI\n\nОсновные случаи:\n\n```text\nполучить DB session\nполучить текущего пользователя\nпроверить JWT/access token\nпроверить права доступа\nполучить repository/service\nпереиспользовать общую логику между endpoint-ами\nподменять зависимости в тестах\n```\n\nПример авторизации:\n\n```python\nfrom fastapi import Depends, HTTPException\n\n\nasync def get_current_user(token: str = Depends(get_token)):\n    user = await decode_token(token)\n\n    if user is None:\n        raise HTTPException(status_code=401, detail=\"Unauthorized\")\n\n    return user\n\n\n@app.get(\"/me\")\nasync def me(user=Depends(get_current_user)):\n    return user\n```\n\n### Подмена зависимостей в тестах\n\nОдин из плюсов DI — легко заменить настоящую зависимость на тестовую.\n\n```python\ndef get_db():\n    return real_db\n\n\ndef override_get_db():\n    return test_db\n\n\napp.dependency_overrides[get_db] = override_get_db\n```\n\nТеперь endpoint, который использует:\n\n```python\ndb = Depends(get_db)\n```\n\nв тестах получит `test_db`, а не реальную БД.\n\n### Кратко\n\n```text\nDI в FastAPI реализован через Depends().\n```\n\nМеханизм такой:\n\n```text\nendpoint объявляет зависимости\n↓\nFastAPI анализирует Depends(...)\n↓\nстроит дерево зависимостей\n↓\nвызывает зависимости перед endpoint-ом\n↓\nпередаёт результаты в параметры endpoint-а\n↓\nпосле ответа закрывает yield-зависимости\n```\n\nГлавная идея:\n\n```text\nendpoint не создаёт зависимости сам\nон только объявляет, что ему нужно\nа FastAPI сам создаёт/получает это и передаёт внутрь\n```"
  popularity = 5.26

[[questions]]
  id = 4
  question = "Для чего нужен Depends в FastAPI?"
  answer = "`Depends` в FastAPI нужен, чтобы объявить зависимость для endpoint-а.\n\nТо есть endpoint говорит FastAPI:\n\n```text\nПеред тем как вызвать меня,\nсначала вызови вот эту функцию/класс,\nполучи результат\nи передай его мне в параметр.\n```\n\nОфициально FastAPI описывает это как систему Dependency Injection: ты объявляешь зависимости, а FastAPI сам вызывает их и передаёт результат в path operation function.\n\n### Простой пример\n\n```python\nfrom fastapi import Depends, FastAPI\n\napp = FastAPI()\n\n\ndef get_token():\n    return \"some-token\"\n\n\n@app.get(\"/profile\")\nasync def profile(token: str = Depends(get_token)):\n    return {\"token\": token}\n```\n\nЧто происходит:\n\n```text\nGET /profile\n↓\nFastAPI видит Depends(get_token)\n↓\nвызывает get_token()\n↓\nполучает \"some-token\"\n↓\nпередаёт это значение в token\n↓\nвызывает profile(token=\"some-token\")\n```\n\n`Depends()` принимает callable — функцию, класс или другой вызываемый объект, который FastAPI должен использовать как dependency. \n\n### Для чего реально используют Depends\n\nЧаще всего `Depends` используют для:\n\n```text\nполучения текущего пользователя\nпроверки JWT / access token\nполучения DB-сессии\nпроверки прав доступа\nсоздания repository / service\nпереиспользования общей логики\nподмены зависимостей в тестах\n```\n\nПример с текущим пользователем:\n\n```python\nfrom fastapi import Depends, FastAPI, HTTPException\n\napp = FastAPI()\n\n\nasync def get_current_user():\n    user = {\"id\": 1, \"username\": \"alex\"}\n\n    if user is None:\n        raise HTTPException(status_code=401, detail=\"Unauthorized\")\n\n    return user\n\n\n@app.get(\"/me\")\nasync def me(user: dict = Depends(get_current_user)):\n    return user\n```\n\nEndpoint `/me` сам не занимается получением пользователя. Он просто объявляет:\n\n```text\nМне нужен user.\nВозьми его из get_current_user().\n```\n\n### Пример с БД-сессией\n\n```python\nfrom collections.abc import AsyncGenerator\nfrom fastapi import Depends, FastAPI\nfrom sqlalchemy.ext.asyncio import AsyncSession\n\napp = FastAPI()\n\n\nasync def get_db() -> AsyncGenerator[AsyncSession, None]:\n    async with async_session_maker() as session:\n        yield session\n\n\n@app.get(\"/users/{user_id}\")\nasync def get_user(\n    user_id: int,\n    db: AsyncSession = Depends(get_db),\n):\n    result = await db.execute(...)\n    return result\n```\n\nЗдесь `Depends(get_db)` нужен, чтобы endpoint получил готовую `AsyncSession`.\n\nСхема:\n\n```text\nrequest пришёл\n↓\nFastAPI вызвал get_db()\n↓\nполучил db session\n↓\nпередал db в get_user()\n↓\nпосле завершения request закрыл session\n```\n\nFastAPI поддерживает зависимости с `yield`, чтобы можно было выполнить cleanup после завершения dependency, например закрыть соединение или сессию.\n\n### Зависимость может иметь свои зависимости\n\n```python\nfrom fastapi import Depends, FastAPI\n\napp = FastAPI()\n\n\ndef get_db():\n    return \"db\"\n\n\ndef get_repository(db=Depends(get_db)):\n    return {\"db\": db}\n\n\n@app.get(\"/items\")\nasync def get_items(repo=Depends(get_repository)):\n    return repo\n```\n\nСхема:\n\n```text\nget_items\n└── get_repository\n    └── get_db\n```\n\nFastAPI сам построит цепочку зависимостей и выполнит их в правильном порядке. Документация FastAPI называет это sub-dependencies и указывает, что они могут быть вложены настолько глубоко, насколько нужно. \n\n### Depends может использоваться без передачи значения в endpoint\n\nИногда зависимость нужна только для проверки, а её результат не нужен в функции.\n\nНапример, проверить токен:\n\n```python\nfrom fastapi import Depends, FastAPI\n\napp = FastAPI()\n\n\nasync def verify_token():\n    ...\n\n\n@app.get(\"/admin\", dependencies=[Depends(verify_token)])\nasync def admin_panel():\n    return {\"status\": \"ok\"}\n```\n\nЗдесь `verify_token()` выполнится, но его результат не будет передан в `admin_panel`.\n\nFastAPI поддерживает такой вариант через `dependencies=[Depends(...)]` в path operation decorator. Это удобно, когда зависимость должна выполниться, но её return value не нужен внутри endpoint-а. \n\n\nГлавное назначение `Depends`:\n\n```text\nне создавать зависимости вручную внутри endpoint-а\nвынести общую логику из endpoint-ов\nпереиспользовать авторизацию, БД, сервисы, проверки\nавтоматически управлять цепочкой зависимостей\nупростить тестирование через dependency overrides\n```\n\nПо сути, `Depends` — это способ сказать FastAPI, какие объекты или проверки нужны endpoint-у перед выполнением."
  popularity = 7.89

