  id = 19
  question = "Какие ORM используют с FastAPI?"
  answer = "### Какие ORM используют с FastAPI\n\nFastAPI **не навязывает ORM**. Можно использовать любую БД и любой слой доступа к данным. В официальной документации FastAPI прямо указано, что фреймворк не требует SQL-базу и не привязывает к конкретной ORM; в примерах сейчас часто используется SQLModel. \n\nЧаще всего с FastAPI используют:\n\n```text\n1. SQLAlchemy\n2. SQLModel\n3. Tortoise ORM\n4. Peewee\n5. Ormar / Piccolo / GINO — реже\n6. Без ORM: asyncpg, psycopg, raw SQL\n```\n\n---\n\n### 1. SQLAlchemy\n\nСамый распространённый и взрослый вариант.\n\n```text\nFastAPI + SQLAlchemy + Alembic\n```\n\nОбычно используют:\n\n```text\n- SQLAlchemy ORM\n- SQLAlchemy Core\n- Alembic для миграций\n- asyncpg для PostgreSQL async-подключения\n```\n\nSQLAlchemy официально поддерживает asyncio для Core и ORM через asyncio-compatible dialects. \n\nПример стека:\n\n```text\nFastAPI\n↓\nDepends(get_db)\n↓\nSQLAlchemy AsyncSession\n↓\nRepository / Service\n↓\nPostgreSQL\n```\n\nПример dependency:\n\n```python\nfrom collections.abc import AsyncGenerator\n\nfrom sqlalchemy.ext.asyncio import AsyncSession, async_sessionmaker, create_async_engine\n\nDATABASE_URL = \"postgresql+asyncpg://user:password@localhost:5432/app_db\"\n\nengine = create_async_engine(DATABASE_URL)\n\nasync_session_maker = async_sessionmaker(\n    engine,\n    expire_on_commit=False,\n)\n\n\nasync def get_db() -> AsyncGenerator[AsyncSession, None]:\n    async with async_session_maker() as session:\n        yield session\n```\n\nИспользование:\n\n```python\nfrom typing import Annotated\n\nfrom fastapi import Depends\nfrom sqlalchemy.ext.asyncio import AsyncSession\n\n\n@app.get(\"/users/{user_id}\")\nasync def get_user(\n    user_id: int,\n    db: Annotated[AsyncSession, Depends(get_db)],\n):\n    user = await db.get(User, user_id)\n    return user\n```\n\n---\n\n### 2. SQLModel\n\nSQLModel — это библиотека от автора FastAPI, построенная поверх SQLAlchemy и Pydantic. В документации FastAPI сказано, что SQLModel построен на SQLAlchemy и Pydantic и был сделан как удобное сочетание для FastAPI-приложений с SQL-БД. \n\n```text\nSQLModel = SQLAlchemy + Pydantic-подход\n```\n\nПлюсы:\n\n```text\n- удобно для небольших и средних проектов\n- меньше дублирования между ORM-моделью и Pydantic-схемой\n- хорошо ложится на FastAPI\n```\n\nМинусы:\n\n```text\n- меньше гибкости, чем чистый SQLAlchemy\n- для сложных проектов часто всё равно переходят к полноценному SQLAlchemy\n```\n\n---\n\n### 3. Tortoise ORM\n\nTortoise ORM — async ORM, по стилю похожая на Django ORM.\n\n```text\nFastAPI + Tortoise ORM + Aerich\n```\n\nTortoise имеет официальную интеграцию с FastAPI: регистрирует ORM с setup/teardown внутри lifespan приложения. \n\nПлюсы:\n\n```text\n- изначально async\n- простой синтаксис\n- похожа на Django ORM\n- удобно для CRUD\n```\n\nМинусы:\n\n```text\n- экосистема меньше, чем у SQLAlchemy\n- для сложных SQL-запросов SQLAlchemy обычно сильнее\n```\n\nПримерно так выглядит использование:\n\n```python\nuser = await User.get(id=user_id)\nawait User.create(username=\"admin\")\n```\n\n---\n\n### 4. Raw SQL / asyncpg без ORM\n\nИногда ORM вообще не используют.\n\n```text\nFastAPI + asyncpg\nFastAPI + psycopg\nFastAPI + databases\n```\n\nТакой подход подходит, когда:\n\n```text\n- нужны сложные SQL-запросы\n- важна максимальная прозрачность\n- проект небольшой\n- ORM даёт больше сложности, чем пользы\n```\n\nМинус — больше ручного кода:\n\n```text\n- вручную писать SQL\n- вручную маппить строки БД в DTO/схемы\n- вручную следить за транзакциями\n```\n\n---\n\n### Что чаще выбрать\n\n```text\nSQLAlchemy  — основной production-вариант\nSQLModel    — удобно для простых FastAPI CRUD/API\nTortoise    — удобно, если хочется Django-like async ORM\nRaw SQL     — когда нужен полный контроль над SQL\n```\n\nДля серьёзного backend-проекта я бы чаще выбирал:\n\n```text\nFastAPI + SQLAlchemy 2.x + Alembic + PostgreSQL\n```\n\n### Итог\n\n```text\nFastAPI не имеет встроенной ORM.\n\nНа практике чаще всего используют:\n- SQLAlchemy — основной зрелый вариант\n- SQLModel — удобный вариант под FastAPI\n- Tortoise ORM — async Django-like вариант\n- raw SQL / asyncpg — когда нужен полный контроль\n```"
  popularity = 2.63
