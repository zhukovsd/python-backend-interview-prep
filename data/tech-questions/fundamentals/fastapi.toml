  id = 7
  question = "Что можно делать с Depends() в FastAPI кроме выполнения кода до endpoint?"
  answer = "### Главное\n\n`Depends()` нужен не только для «выполнить функцию перед endpoint». Его основная роль — **описать зависимость**, которую FastAPI должен сам получить, проверить, закэшировать и передать дальше. В документации FastAPI это описано как Dependency Injection-система, где зависимости могут получать параметры запроса, добавлять валидацию и попадать в OpenAPI-схему. \n\n---\n\n### 1. Передавать готовые данные в endpoint\n\nКлассический сценарий — получить объект и передать его в endpoint:\n\n```python\nfrom typing import Annotated\nfrom fastapi import Depends, FastAPI\n\napp = FastAPI()\n\n\nasync def get_current_user():\n    return {\"id\": 1, \"username\": \"admin\"}\n\n\n@app.get(\"/profile\")\nasync def profile(user: Annotated[dict, Depends(get_current_user)]):\n    return user\n```\n\nТо есть endpoint не сам достаёт пользователя, а получает уже готовый `user`.\n\n```text\nrequest\n↓\nget_current_user()\n↓\nprofile(user=...)\n```\n\n---\n\n### 2. Выносить общие query/path/header/cookie параметры\n\nНапример, много endpoint-ов используют `skip`, `limit`, `q`. Их можно вынести в dependency:\n\n```python\nfrom typing import Annotated\nfrom fastapi import Depends, FastAPI\n\napp = FastAPI()\n\n\ndef pagination(skip: int = 0, limit: int = 100):\n    return {\"skip\": skip, \"limit\": limit}\n\n\n@app.get(\"/users\")\nasync def get_users(params: Annotated[dict, Depends(pagination)]):\n    return params\n\n\n@app.get(\"/posts\")\nasync def get_posts(params: Annotated[dict, Depends(pagination)]):\n    return params\n```\n\nПлюс FastAPI добавит эти параметры в OpenAPI/Swagger, потому что зависимости тоже участвуют в описании параметров и валидации. \n\n---\n\n### 3. Делать авторизацию и проверки доступа\n\n`Depends()` часто используют для получения текущего пользователя и проверки прав:\n\n```python\nfrom typing import Annotated\nfrom fastapi import Depends, FastAPI, HTTPException, status\n\napp = FastAPI()\n\n\nasync def get_current_user():\n    return {\"id\": 1, \"is_admin\": False}\n\n\nasync def require_admin(\n    user: Annotated[dict, Depends(get_current_user)]\n):\n    if not user[\"is_admin\"]:\n        raise HTTPException(\n            status_code=status.HTTP_403_FORBIDDEN,\n            detail=\"Admin access required\",\n        )\n    return user\n\n\n@app.delete(\"/users/{user_id}\")\nasync def delete_user(\n    user_id: int,\n    admin: Annotated[dict, Depends(require_admin)],\n):\n    return {\"deleted_user_id\": user_id}\n```\n\nЗдесь `require_admin` — это не просто код перед endpoint, а отдельный слой доступа.\n\n```text\ndelete_user\n└── require_admin\n    └── get_current_user\n```\n\nFastAPI официально поддерживает вложенные зависимости любой глубины: dependency может иметь свои sub-dependencies, а FastAPI сам решает дерево зависимостей.\n\n---\n\n### 4. Подключать ресурсы с lifecycle: БД, сессии, соединения\n\nЧерез dependency с `yield` можно выдать ресурс endpoint-у, а потом корректно закрыть его:\n\n```python\nfrom typing import Annotated\nfrom fastapi import Depends, FastAPI\n\napp = FastAPI()\n\n\nasync def get_db():\n    db = \"db-session\"\n    try:\n        yield db\n    finally:\n        print(\"close db session\")\n\n\n@app.get(\"/items\")\nasync def get_items(db: Annotated[str, Depends(get_db)]):\n    return {\"db\": db}\n```\n\nСмысл:\n\n```text\nдо endpoint:\n    открыть ресурс\n\nendpoint:\n    использовать ресурс\n\nпосле endpoint:\n    закрыть ресурс\n```\n\nFastAPI поддерживает dependencies с `yield`; код после `yield` выполняется после ответа/завершения обработки, что удобно для закрытия DB-сессий и похожих ресурсов. \n\n---\n\n### 5. Делать dependency без возврата значения\n\nИногда результат dependency не нужен. Нужно только проверить условие: токен, заголовок, API-key, доступ.\n\n```python\nfrom fastapi import Depends, FastAPI, Header, HTTPException\n\napp = FastAPI()\n\n\nasync def verify_token(x_token: str = Header()):\n    if x_token != \"secret\":\n        raise HTTPException(status_code=400, detail=\"Invalid token\")\n\n\n@app.get(\"/protected\", dependencies=[Depends(verify_token)])\nasync def protected():\n    return {\"status\": \"ok\"}\n```\n\nТут `verify_token` не передаётся параметром в endpoint. Она просто должна успешно выполниться. FastAPI отдельно документирует такой стиль через `dependencies=[Depends(...)]` в path operation decorator. \n\n---\n\n### 6. Вешать зависимости на router или на всё приложение\n\nМожно применить dependency не к одному endpoint-у, а ко всем endpoint-ам роутера или всего приложения.\n\n```python\nfrom fastapi import APIRouter, Depends, FastAPI\n\napp = FastAPI()\n\n\nasync def verify_auth():\n    return True\n\n\nrouter = APIRouter(\n    prefix=\"/admin\",\n    dependencies=[Depends(verify_auth)],\n)\n\n\n@router.get(\"/stats\")\nasync def stats():\n    return {\"stats\": \"secret\"}\n\n\napp.include_router(router)\n```\n\nЭто удобно для общих проверок:\n\n```text\n/admin/*\n└── всегда выполнить verify_auth\n```\n\nFastAPI поддерживает зависимости на уровне path operation, router и всего приложения. Глобальные зависимости применяются ко всем path operations приложения. \n\n---\n\n### 7. Кэшировать результат dependency внутри одного request\n\nПо умолчанию `Depends(..., use_cache=True)`. Это значит: если одна и та же dependency нужна несколько раз в рамках одного запроса, FastAPI вызовет её один раз и переиспользует результат.\n\n```python\nfrom typing import Annotated\nfrom fastapi import Depends, FastAPI\n\napp = FastAPI()\n\n\nasync def get_user():\n    print(\"called\")\n    return {\"id\": 1}\n\n\nasync def get_permissions(\n    user: Annotated[dict, Depends(get_user)]\n):\n    return [\"read\"]\n\n\n@app.get(\"/me\")\nasync def me(\n    user: Annotated[dict, Depends(get_user)],\n    permissions: Annotated[list[str], Depends(get_permissions)],\n):\n    return {\"user\": user, \"permissions\": permissions}\n```\n\n`get_user()` нужен и endpoint-у, и `get_permissions`, но FastAPI может использовать кэш в рамках одного request. Параметр `use_cache` официально описан в reference-документации `Depends`. \n\nОтключение:\n\n```python\nDepends(get_user, use_cache=False)\n```\n\n---\n\n### 8. Использовать классы как зависимости\n\nDependency не обязана быть только функцией. Можно использовать класс:\n\n```python\nfrom typing import Annotated\nfrom fastapi import Depends, FastAPI\n\napp = FastAPI()\n\n\nclass Pagination:\n    def __init__(self, skip: int = 0, limit: int = 100):\n        self.skip = skip\n        self.limit = limit\n\n\n@app.get(\"/items\")\nasync def get_items(\n    pagination: Annotated[Pagination, Depends(Pagination)]\n):\n    return {\n        \"skip\": pagination.skip,\n        \"limit\": pagination.limit,\n    }\n```\n\nЭто удобно, когда нужно собрать несколько параметров в один объект. В документации FastAPI есть отдельный раздел про classes as dependencies. \n\n---\n\n### 9. Параметризовать зависимости\n\nМожно сделать объект, который хранит настройки, а сам вызывается как dependency через `__call__`.\n\n```python\nfrom typing import Annotated\nfrom fastapi import Depends, FastAPI, HTTPException\n\napp = FastAPI()\n\n\nclass RoleChecker:\n    def __init__(self, required_role: str):\n        self.required_role = required_role\n\n    async def __call__(self):\n        user_role = \"user\"\n\n        if user_role != self.required_role:\n            raise HTTPException(status_code=403, detail=\"Forbidden\")\n\n        return True\n\n\nrequire_admin = RoleChecker(\"admin\")\n\n\n@app.get(\"/admin\")\nasync def admin_panel(_: Annotated[bool, Depends(require_admin)]):\n    return {\"status\": \"admin\"}\n```\n\nFastAPI описывает parameterized dependencies как advanced dependency-сценарий: можно настраивать dependency без создания множества отдельных функций. \n\n---\n\n### 10. Менять response: headers/cookies\n\nDependency может получить `Response` и выставить cookie или header:\n\n```python\nfrom fastapi import Depends, FastAPI, Response\n\napp = FastAPI()\n\n\ndef set_tracking_cookie(response: Response):\n    response.set_cookie(key=\"visited\", value=\"true\")\n\n\n@app.get(\"/page\", dependencies=[Depends(set_tracking_cookie)])\nasync def page():\n    return {\"page\": \"home\"}\n```\n\nFastAPI официально указывает, что `Response` можно объявлять в dependencies и устанавливать там cookies/headers. \n\n---\n\n### 11. Добавлять background tasks из dependency\n\nDependency может получить `BackgroundTasks` и добавить фоновую задачу:\n\n```python\nfrom fastapi import BackgroundTasks, Depends, FastAPI\n\napp = FastAPI()\n\n\ndef write_log(message: str):\n    print(message)\n\n\ndef add_log_task(background_tasks: BackgroundTasks):\n    background_tasks.add_task(write_log, \"Request processed\")\n\n\n@app.post(\"/items\", dependencies=[Depends(add_log_task)])\nasync def create_item():\n    return {\"status\": \"created\"}\n```\n\n`BackgroundTasks` работает с Dependency Injection: его можно объявлять в endpoint, dependency или sub-dependency; FastAPI объединяет задачи и запускает их после ответа. \n\n---\n\n### 12. Подменять зависимости в тестах\n\nОдна из сильных сторон `Depends` — dependency можно заменить в тестах:\n\n```python\nasync def get_current_user():\n    return real_user\n\n\nasync def fake_current_user():\n    return {\"id\": 1, \"username\": \"test\"}\n\n\napp.dependency_overrides[get_current_user] = fake_current_user\n```\n\nПосле этого FastAPI будет вызывать `fake_current_user` вместо `get_current_user`. Это официально описано через `app.dependency_overrides`. \n\n---\n\n### Итого\n\n`Depends()` в FastAPI используют для:\n\n```text\n1. Получения текущего пользователя\n2. Проверки авторизации и прав\n3. Инъекции DB-сессии / Redis / сервисов\n4. Закрытия ресурсов через yield\n5. Выноса общих query/header/cookie параметров\n6. Повторного использования логики между endpoint-ами\n7. Вложенных зависимостей\n8. Глобальных проверок на router/app уровне\n9. Кэширования результата в рамках request\n10. Подмены зависимостей в тестах\n11. Изменения response headers/cookies\n12. Добавления background tasks\n```\n\nГлавная идея:\n\n```text\nDepends — это способ описать, что endpoint-у нужно,\nа FastAPI сам решает, как это получить, проверить,\nзакэшировать, передать и потом корректно завершить.\n```"
  popularity = 2.63

