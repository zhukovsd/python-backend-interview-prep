  question = "Почему FastAPI не поддерживает XML сериализацию из коробки?"
  answer = "FastAPI не поддерживает XML-сериализацию «из коробки», потому что его основной стек построен вокруг:\n\n```text\nPython type hints\n↓\nPydantic-модели\n↓\nJSON-compatible data\n↓\nJSONResponse\n↓\nOpenAPI/Swagger\n```\n\nПо умолчанию FastAPI возвращает JSON-ответы. В документации прямо указано: если вернуть `dict`, `list`, Pydantic-модель и т.п., FastAPI сериализует это в JSON; при необходимости можно вернуть `Response` напрямую и указать свой `media_type`. \n\n---\n\n### Почему JSON поддержан лучше\n\nFastAPI создавался как фреймворк для современных API, где основной формат обмена — JSON. Сам FastAPI описывает себя как web framework для построения API на основе стандартных Python type hints. \n\nДля JSON у FastAPI есть естественная цепочка:\n\n```python\nclass UserOut(BaseModel):\n    id: int\n    username: str\n\n\n@app.get(\"/users/{user_id}\", response_model=UserOut)\nasync def get_user(user_id: int):\n    return {\"id\": user_id, \"username\": \"admin\"}\n```\n\nFastAPI понимает:\n\n```text\nкакая схема данных\nкак валидировать\nкак сериализовать\nкак описать это в OpenAPI\nкак показать это в Swagger\n```\n\nС XML так просто не получается.\n\n---\n\n### Почему XML сложнее сериализовать автоматически\n\nУ JSON структура ближе к Python-объектам:\n\n```text\ndict  -> object\nlist  -> array\nstr   -> string\nint   -> number\nbool  -> boolean\nNone  -> null\n```\n\nА у XML есть дополнительные особенности:\n\n```xml\n<user id=\"1\">\n    <username>admin</username>\n</user>\n```\n\nТут сразу появляются вопросы:\n\n```text\nid — это атрибут или отдельный тег?\nusername — это тег или текст?\nкак хранить namespaces?\nважен ли порядок элементов?\nкак обрабатывать mixed content?\nкак валидировать через XSD?\nкак маппить XML в Pydantic-модель?\n```\n\nТо есть универсального очевидного правила:\n\n```text\nPydantic model -> XML\n```\n\nнет.\n\nДля JSON такое правило естественное. Для XML нужно выбирать конкретную стратегию сериализации.\n\n---\n\n### Почему это не ограничение ASGI/FastAPI как сервера\n\nFastAPI может вернуть XML. Просто он не делает автоматическую XML-сериализацию моделей по умолчанию.\n\nПример:\n\n```python\nfrom fastapi import FastAPI, Response\n\napp = FastAPI()\n\n\n@app.get(\"/users/{user_id}\")\nasync def get_user(user_id: int):\n    xml = f\"\"\"\n    <user>\n        <id>{user_id}</id>\n        <username>admin</username>\n    </user>\n    \"\"\"\n\n    return Response(\n        content=xml,\n        media_type=\"application/xml\",\n    )\n```\n\nТо есть проблема не в том, что FastAPI «не умеет отправить XML». Он умеет отправить любой текстовый/байтовый ответ через `Response`. В документации FastAPI описано, что можно вернуть `Response` напрямую и самостоятельно управлять содержимым, статусом, headers и media type. \n\n---\n\n### XML request тоже можно принять, но вручную\n\nНапример:\n\n```python\nfrom fastapi import FastAPI, Request\nimport xml.etree.ElementTree as ET\n\napp = FastAPI()\n\n\n@app.post(\"/users\")\nasync def create_user(request: Request):\n    raw_body = await request.body()\n\n    root = ET.fromstring(raw_body)\n\n    user_id = int(root.findtext(\"id\"))\n    username = root.findtext(\"username\")\n\n    return {\n        \"id\": user_id,\n        \"username\": username,\n    }\n```\n\nFastAPI позволяет получить сырой `Request` напрямую, без автоматической валидации тела через Pydantic. Это нужно как раз для нестандартных форматов данных. \n\n---\n\n### Почему FastAPI не делает это сам\n\nОсновные причины:\n\n```text\n1. FastAPI ориентирован на JSON API\n2. Pydantic естественно работает с Python-объектами и JSON-подобными структурами\n3. OpenAPI/Swagger-интеграция проще и стандартнее для JSON\n4. XML имеет неоднозначный mapping в объектные модели\n5. Для XML часто нужны отдельные правила: attributes, namespaces, XSD, порядок тегов\n6. XML чаще нужен для legacy/enterprise-интеграций, а не как основной формат новых API\n```\n\nOpenAPI сам по себе поддерживает разные media types, включая JSON и XML, но media type нужно явно описывать в request/response. FastAPI же по умолчанию строит удобный путь именно для JSON.\n\n---\n\n### Как правильно добавить XML в FastAPI\n\nДля response:\n\n```python\nfrom fastapi import Response\n\n\n@app.get(\n    \"/users/{user_id}\",\n    responses={\n        200: {\n            \"content\": {\n                \"application/xml\": {\n                    \"example\": \"\"\"\n                    <user>\n                        <id>1</id>\n                        <username>admin</username>\n                    </user>\n                    \"\"\"\n                }\n            },\n            \"description\": \"XML response\",\n        }\n    },\n)\nasync def get_user_xml(user_id: int):\n    xml = f\"\"\"\n    <user>\n        <id>{user_id}</id>\n        <username>admin</username>\n    </user>\n    \"\"\"\n\n    return Response(\n        content=xml,\n        media_type=\"application/xml\",\n    )\n```\n\nДля request:\n\n```python\nfrom fastapi import Request\nimport xml.etree.ElementTree as ET\n\n\n@app.post(\"/users/xml\")\nasync def create_user_from_xml(request: Request):\n    raw_body = await request.body()\n    root = ET.fromstring(raw_body)\n\n    return {\n        \"id\": int(root.findtext(\"id\")),\n        \"username\": root.findtext(\"username\"),\n    }\n```\n\n---\n\n### Итог\n\nFastAPI не поддерживает XML-сериализацию из коробки не потому, что это технически невозможно, а потому что его стандартная модель такая:\n\n```text\ntype hints + Pydantic + JSON + OpenAPI\n```\n\nXML требует отдельной стратегии:\n\n```text\nкак строить теги\nкак работать с атрибутами\nкак учитывать namespaces\nкак валидировать XML\nкак описывать это в документации\n```\n\nПоэтому в FastAPI XML обычно делают явно:\n\n```text\nResponse(..., media_type=\"application/xml\")\n+\nручный парсинг request.body()\n+\nпри необходимости отдельная XML-библиотека\n```"
  popularity = 2.63

[[questions]]
  id = 15
  question = "Как FastAPI обрабатывает входящий запрос?"
  answer = "### Общая схема\n\nFastAPI обрабатывает входящий HTTP-запрос примерно так:\n\n```text\nclient\n↓\nASGI server: Uvicorn / Hypercorn\n↓\nASGI-приложение FastAPI\n↓\nmiddleware\n↓\nrouting\n↓\nпарсинг path/query/header/cookie/body\n↓\nDepends / security / validation\n↓\nendpoint\n↓\nresponse_model / сериализация\n↓\nmiddleware после ответа\n↓\nASGI send\n↓\nclient\n```\n\nFastAPI работает как ASGI-приложение. ASGI-приложение вызывается как async callable с тремя аргументами: `scope`, `receive`, `send`; Uvicorn использует именно этот ASGI-интерфейс для связи с приложением. \n\n---\n\n### 1. Запрос сначала принимает ASGI-сервер\n\nНапример, ты запускаешь:\n\n```bash\nuvicorn app.main:app\n```\n\nUvicorn принимает HTTP-запрос от клиента и передаёт его FastAPI-приложению через ASGI-интерфейс:\n\n```python\nasync def app(scope, receive, send):\n    ...\n```\n\nГрубо:\n\n```text\nscope   -> информация о соединении: path, method, headers, client, scheme\nreceive -> канал для получения тела запроса\nsend    -> канал для отправки ответа\n```\n\nASGI-документация описывает `scope` как словарь с данными соединения, `receive` как async callable для входящих событий, а `send` как async callable для исходящих событий. \n\n---\n\n### 2. Запрос проходит через middleware\n\nДо попадания в конкретный endpoint запрос проходит через middleware:\n\n```python\n@app.middleware(\"http\")\nasync def add_header(request, call_next):\n    response = await call_next(request)\n    response.headers[\"X-App\"] = \"FastAPI\"\n    return response\n```\n\nMiddleware может выполнить код:\n\n```text\nдо endpoint-а\nпосле endpoint-а\n```\n\nFastAPI-документация описывает middleware как функцию, которая работает с каждым request до конкретной path operation и с каждым response перед возвратом клиенту. \n\n---\n\n### 3. Starlette/FastAPI ищет подходящий route\n\nFastAPI построен поверх Starlette, поэтому routing-слой во многом опирается на Starlette.\n\nНапример:\n\n```python\n@app.get(\"/users/{user_id}\")\nasync def get_user(user_id: int):\n    return {\"user_id\": user_id}\n```\n\nПри запросе:\n\n```text\n/users/123\n```\n\nrouting должен определить:\n\n```text\npath   -> /users/{user_id}\nmethod -> GET\nparams -> {\"user_id\": \"123\"}\n```\n\nStarlette routing поддерживает path-параметры и конвертеры вроде `int`, `float`, `uuid`, `path`; endpoint может быть обычной или async-функцией. \n\n---\n\n### 4. FastAPI создаёт объект `Request`\n\nПосле того как запрос попал в route handler, FastAPI работает уже не с голыми `scope`, `receive`, `send`, а с объектом `Request`.\n\nУпрощённо:\n\n```python\nrequest = Request(scope, receive, send)\n```\n\nВ исходном коде FastAPI видно, что route-обёртка создаёт `Request(scope, receive, send)`, использует `AsyncExitStack` для request-scoped cleanup и затем отправляет сформированный `Response` обратно через ASGI. \n\n---\n\n### 5. FastAPI читает тело запроса\n\nЕсли endpoint ожидает body:\n\n```python\nfrom pydantic import BaseModel\n\nclass UserIn(BaseModel):\n    username: str\n    age: int\n\n\n@app.post(\"/users\")\nasync def create_user(data: UserIn):\n    return data\n```\n\nFastAPI должен:\n\n```text\n1. Прочитать body\n2. Понять content-type\n3. Если это JSON — распарсить JSON\n4. Передать данные в Pydantic-валидацию\n5. При ошибке вернуть 422\n```\n\nВ исходном коде FastAPI `get_request_handler` читает body, отдельно обрабатывает form-data, JSON content type, JSON decode error и ошибку парсинга тела запроса. \n\n---\n\n### 6. FastAPI решает зависимости `Depends`\n\nПеред вызовом endpoint-а FastAPI решает дерево зависимостей.\n\nПример:\n\n```python\nfrom typing import Annotated\nfrom fastapi import Depends, FastAPI\n\napp = FastAPI()\n\n\nasync def get_current_user():\n    return {\"id\": 1}\n\n\n@app.get(\"/profile\")\nasync def profile(\n    user: Annotated[dict, Depends(get_current_user)],\n):\n    return user\n```\n\nПеред вызовом `profile()` FastAPI вызовет `get_current_user()` и подставит результат в параметр `user`.\n\nОфициальная документация FastAPI описывает Dependency Injection как механизм, через который path operation function объявляет то, что ей нужно для работы, а FastAPI сам предоставляет эти зависимости. \n\nВ исходном коде route handler вызывает `solve_dependencies(...)`, передаёт туда `request`, `dependant`, тело запроса и `AsyncExitStack`; после этого получает `solved_result.values`, которые потом попадут в endpoint. \n\n---\n\n### 7. FastAPI валидирует параметры\n\nFastAPI собирает значения из разных частей запроса:\n\n```text\npath params\nquery params\nheaders\ncookies\nbody\ndependencies\n```\n\nНапример:\n\n```python\n@app.get(\"/items/{item_id}\")\nasync def get_item(\n    item_id: int,\n    limit: int = 10,\n):\n    return {\n        \"item_id\": item_id,\n        \"limit\": limit,\n    }\n```\n\nЗапрос:\n\n```text\n/items/abc?limit=test\n```\n\nне пройдёт валидацию, потому что `item_id` и `limit` ожидаются как `int`.\n\nТо есть endpoint обычно вызывается уже с подготовленными Python-значениями:\n\n```python\nget_item(item_id=123, limit=10)\n```\n\nа не с сырыми строками из URL.\n\n---\n\n### 8. FastAPI вызывает endpoint\n\nПосле парсинга, зависимостей и валидации FastAPI вызывает endpoint.\n\nДля `async def`:\n\n```python\n@app.get(\"/async\")\nasync def async_endpoint():\n    return {\"ok\": True}\n```\n\nвызов примерно такой:\n\n```python\nresult = await async_endpoint()\n```\n\nДля обычного `def`:\n\n```python\n@app.get(\"/sync\")\ndef sync_endpoint():\n    return {\"ok\": True}\n```\n\nFastAPI отправляет выполнение в threadpool:\n\n```python\nresult = await run_in_threadpool(sync_endpoint)\n```\n\nВ исходном коде FastAPI функция `run_endpoint_function` проверяет, является ли endpoint coroutine; если да — делает `await dependant.call(**values)`, если нет — вызывает endpoint через `run_in_threadpool`. \n\n---\n\n### 9. Endpoint возвращает результат\n\nEndpoint может вернуть разные типы:\n\n```python\nreturn {\"id\": 1}\n```\n\nили:\n\n```python\nreturn UserOut(id=1, username=\"admin\")\n```\n\nили готовый response:\n\n```python\nfrom fastapi import Response\n\nreturn Response(\n    content=\"<ok>true</ok>\",\n    media_type=\"application/xml\",\n)\n```\n\nЕсли endpoint возвращает обычные Python-данные, FastAPI превращает их в HTTP-response. Если возвращается готовый `Response`, FastAPI использует его напрямую.\n\nStarlette response-классы отвечают за отправку ASGI-сообщений через `send`; `Response` содержит `content`, `status_code`, `headers`, `media_type` и может быть вызван как ASGI-приложение. \n\n---\n\n### 10. FastAPI применяет `response_model`\n\nЕсли указан `response_model`, FastAPI валидирует и фильтрует выходные данные:\n\n```python\nfrom pydantic import BaseModel\n\nclass UserOut(BaseModel):\n    id: int\n    username: str\n\n\n@app.get(\"/users/{user_id}\", response_model=UserOut)\nasync def get_user(user_id: int):\n    return {\n        \"id\": user_id,\n        \"username\": \"admin\",\n        \"password\": \"secret\",\n    }\n```\n\nКлиент получит:\n\n```json\n{\n  \"id\": 1,\n  \"username\": \"admin\"\n}\n```\n\n`password` будет отфильтрован, потому что его нет в `UserOut`.\n\nFastAPI-документация указывает, что `response_model` используется для документации, валидации, конвертации и фильтрации выходных данных. \n\n---\n\n### 11. Response проходит обратно через middleware\n\nПосле endpoint-а и сериализации response возвращается обратно через middleware-цепочку.\n\n```text\nendpoint\n↓\nresponse_model / сериализация\n↓\nmiddleware after-response код\n↓\nASGI send\n↓\nclient\n```\n\nЭто позволяет middleware добавить headers, посчитать время обработки, залогировать response и т.д. FastAPI-документация прямо описывает, что middleware может обработать response перед возвратом клиенту. \n\n---\n\n### 12. Выполняется cleanup\n\nПосле обработки запроса FastAPI должен корректно завершить request-scoped ресурсы:\n\n```python\nasync def get_db():\n    db = Session()\n    try:\n        yield db\n    finally:\n        await db.close()\n```\n\nДля этого FastAPI использует `AsyncExitStack`. В исходном коде FastAPI видно, что при обработке request создаются request/function stacks и кладутся в `scope`; это нужно в том числе для dependency cleanup. \n\n---\n\n### Сжатая схема внутри FastAPI\n\n```text\n1. ASGI server вызывает FastAPI(scope, receive, send)\n\n2. Middleware получает Request\n\n3. Router ищет подходящий path + method\n\n4. FastAPI создаёт route handler\n\n5. Читается body:\n   - JSON\n   - form-data\n   - bytes\n   - либо body отсутствует\n\n6. solve_dependencies():\n   - path params\n   - query params\n   - headers\n   - cookies\n   - body\n   - Depends\n   - security dependencies\n\n7. Если есть ошибки:\n   - RequestValidationError\n   - обычно HTTP 422\n\n8. Если ошибок нет:\n   - async endpoint -> await endpoint(...)\n   - sync endpoint  -> run_in_threadpool(endpoint, ...)\n\n9. Результат endpoint-а:\n   - если Response -> вернуть как есть\n   - если dict/list/model -> сериализовать\n\n10. response_model:\n   - валидировать\n   - преобразовать\n   - отфильтровать поля\n\n11. Response отправляется через ASGI send\n\n12. Закрываются yield-dependencies и request-scoped ресурсы\n```\n\n---\n\n### Мини-пример полного прохода\n\n```python\nfrom typing import Annotated\n\nfrom fastapi import Depends, FastAPI\nfrom pydantic import BaseModel\n\napp = FastAPI()\n\n\nclass UserIn(BaseModel):\n    username: str\n\n\nclass UserOut(BaseModel):\n    id: int\n    username: str\n\n\nasync def get_current_user():\n    return {\"id\": 10, \"role\": \"admin\"}\n\n\n@app.post(\"/users/{user_id}\", response_model=UserOut)\nasync def update_user(\n    user_id: int,\n    data: UserIn,\n    current_user: Annotated[dict, Depends(get_current_user)],\n):\n    return {\n        \"id\": user_id,\n        \"username\": data.username,\n        \"password\": \"hidden\",\n        \"updated_by\": current_user[\"id\"],\n    }\n```\n\nЗапрос:\n\n```http\nPOST /users/5\nContent-Type: application/json\n\n{\n  \"username\": \"alex\"\n}\n```\n\nЧто делает FastAPI:\n\n```text\n1. Находит route POST /users/{user_id}\n2. Достаёт user_id из path\n3. Конвертирует user_id в int\n4. Читает JSON body\n5. Валидирует body через UserIn\n6. Выполняет get_current_user через Depends\n7. Вызывает update_user(user_id=5, data=UserIn(...), current_user=...)\n8. Получает dict\n9. Применяет response_model=UserOut\n10. Убирает password и updated_by\n11. Возвращает JSON\n```\n\nОтвет:\n\n```json\n{\n  \"id\": 5,\n  \"username\": \"alex\"\n}\n```\n\n### Главное\n\nFastAPI — это слой над ASGI/Starlette, который добавляет:\n\n```text\n- type hints based validation\n- Pydantic-схемы\n- Dependency Injection\n- автоматическую сериализацию\n- response_model-фильтрацию\n- OpenAPI-документацию\n```\n\nТо есть FastAPI не просто вызывает endpoint. Он сначала строит и решает весь контекст запроса, а endpoint получает уже подготовленные и провалидированные значения."
  popularity = 2.63

[[questions]]
  id = 16
  question = "Какой web-server встроен в FastAPI?"
  answer = "В сам FastAPI **не встроен полноценный web-server** в смысле сетевого сервера, который сам слушает сокеты.\n\nFastAPI — это **ASGI web framework**, то есть приложение, которое должно запускаться через ASGI-сервер. Обычно для этого используется **Uvicorn**. В документации FastAPI сказано, что для запуска FastAPI-приложения нужен ASGI server program вроде Uvicorn; именно Uvicorn используется по умолчанию командой `fastapi run`. \n\n---\n\n### Правильная схема\n\n```text\nclient\n↓\nUvicorn / Hypercorn / другой ASGI server\n↓\nFastAPI application\n↓\nroutes / Depends / validation / response\n```\n\nТо есть:\n\n```text\nUvicorn — web-server / ASGI-server\nFastAPI — web-framework / ASGI-application\n```\n\nUvicorn официально описывает себя как ASGI web server implementation for Python. \n\n---\n\n### Почему часто говорят «FastAPI использует Uvicorn»\n\nПотому что обычно приложение запускают так:\n\n```bash\nuvicorn app.main:app --reload\n```\n\nили через новую команду:\n\n```bash\nfastapi run app/main.py\n```\n\nНо технически это не значит, что Uvicorn «встроен внутрь FastAPI как часть фреймворка». Более точная формулировка:\n\n```text\nFastAPI-приложение запускается ASGI-сервером.\nЧаще всего этим сервером является Uvicorn.\n```\n\n---\n\n### Можно ли использовать не Uvicorn\n\nДа. FastAPI может запускаться и через другие ASGI-серверы, например Hypercorn. В документации FastAPI указано, что есть несколько альтернатив ASGI-серверов. \n\n---\n\n### Итог\n\n```text\nВстроенный web-server в FastAPI:\n    как отдельный сервер — нет\n\nСтандартный ASGI-сервер для запуска:\n    Uvicorn\n\nЧто делает FastAPI:\n    routing, validation, Depends, OpenAPI, response handling\n\nЧто делает Uvicorn:\n    принимает HTTP-запросы по сети\n    управляет event loop\n    передаёт запросы FastAPI через ASGI\n```"
  popularity = 2.63

