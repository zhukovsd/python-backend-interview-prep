  id = 28
  question = "Что делает chmod 751?"
  answer = "### Что делает `chmod 751`\n\nКоманда:\n\n```bash\nchmod 751 file\n```\n\nвыставляет права доступа:\n\n```text\nrwxr-x--x\n```\n\nРасшифровка:\n\n```text\n7   owner/user    rwx   читать, изменять, выполнять\n5   group         r-x   читать, выполнять, но не изменять\n1   others        --x   только выполнять\n```\n\n`chmod` меняет file mode bits — права доступа файла или директории; числовой режим задаётся octal-числом, где `r=4`, `w=2`, `x=1`. \n\n### Как считается `751`\n\n```text\n7 = 4 + 2 + 1 = rwx\n5 = 4 + 0 + 1 = r-x\n1 = 0 + 0 + 1 = --x\n```\n\nИтог:\n\n```text\nowner:  rwx\ngroup:  r-x\nothers: --x\n```\n\nВ `ls -l` это будет выглядеть примерно так:\n\n```text\n-rwxr-x--x 1 user group 1234 file\n```\n\nДля директории:\n\n```text\ndrwxr-x--x 2 user group 4096 directory\n```\n\n### Что это значит для файла\n\nДля обычного файла `chmod 751 script.sh` означает:\n\n```text\nвладелец      может читать, изменять и запускать файл\nгруппа        может читать и запускать, но не изменять\nостальные     могут только запускать, но не читать и не изменять\n```\n\nПример:\n\n```bash\nchmod 751 script.sh\n```\n\nПосле этого:\n\n```text\nowner   может открыть, изменить и выполнить script.sh\ngroup   может посмотреть содержимое и выполнить\nothers  могут выполнить, но не прочитать содержимое\n```\n\n### Что это значит для директории\n\nДля директории `x` имеет особый смысл: оно позволяет входить в директорию и проходить через неё.\n\n```bash\nchmod 751 /var/www/app\n```\n\nОзначает:\n\n```text\nowner   может заходить, читать список файлов, создавать/удалять файлы\ngroup   может заходить и смотреть список файлов, но не изменять\nothers  могут только проходить через директорию, но не видеть список файлов\n```\n\nДля `others` право `--x` на директории означает: пользователь не может сделать `ls` этой директории, но может обратиться к конкретному файлу внутри, если знает точное имя файла и имеет права на сам файл.\n\nПример:\n\n```text\n/var/www/app/public.txt\n```\n\nЕсли у пользователя есть `x` на `/var/www/app` и права на `public.txt`, он может обратиться к файлу напрямую, но не сможет просмотреть список файлов в `/var/www/app`.\n\n### Коротко\n\n```bash\nchmod 751 file\n```\n\nэто:\n\n```text\nowner   rwx\ngroup   r-x\nothers  --x\n```\n\nТо есть владелец имеет полный доступ, группа может читать и выполнять, остальные могут только выполнять. Для файлов это встречается редко, а для директорий может использоваться, когда нужно разрешить проход к известному пути, но запретить просмотр содержимого директории."
  popularity = 2.63

[[questions]]
  id = 29
  question = "Какие преимущества Docker даёт backend-приложению?"
  answer = "Поставить всё напрямую на Linux-сервер можно. Docker нужен не потому, что без него приложение невозможно запустить, а потому что он делает запуск, перенос, обновление и изоляцию backend-приложения намного управляемее.\n\nDocker позволяет упаковать приложение вместе с зависимостями в образ, а потом запускать этот образ одинаково на разных окружениях: локально, на staging, production или в CI/CD. Docker описывает контейнер как изолированное окружение, содержащее всё необходимое для запуска приложения, без жёсткой зависимости от того, что установлено на host-сервере. \n\n### Без Docker\n\nОбычный деплой на Linux-сервер выглядит примерно так:\n\n```text\nLinux server\n├── system Python\n├── nginx\n├── PostgreSQL client\n├── Redis client\n├── virtualenv\n├── systemd service\n├── env variables\n├── project files\n└── logs\n```\n\nПроблема в том, что со временем сервер превращается в уникальную ручную конфигурацию:\n\n```text\nна одном сервере Python 3.10\nна другом Python 3.12\nгде-то другая версия libpq\nгде-то забыли поставить системный пакет\nгде-то другие env-переменные\nгде-то старый nginx-конфиг\n```\n\nИз-за этого появляется классическая проблема:\n\n```text\n\"У меня локально работает, а на сервере нет\"\n```\n\n### С Docker\n\nС Docker ты описываешь окружение в файлах:\n\n```text\nDockerfile\ndocker-compose.yml\n.env\n```\n\nИ получаешь воспроизводимый запуск:\n\n```text\nDocker image\n├── нужная версия Python\n├── зависимости приложения\n├── системные библиотеки\n├── код приложения\n└── команда запуска\n```\n\nЗапуск:\n\n```bash\ndocker run backend:1.0\n```\n\nИли через Compose:\n\n```bash\ndocker compose up -d\n```\n\nDocker Compose позволяет описать multi-container приложение: backend, PostgreSQL, Redis, volume и сети в одном YAML-файле. \n\n### 1. Изоляция зависимостей\n\nБез Docker разные приложения на одном сервере могут конфликтовать:\n\n```text\nproject A требует Python 3.10\nproject B требует Python 3.12\n\nproject A требует libpq v14\nproject B требует libpq v16\n```\n\nС Docker каждое приложение получает своё окружение:\n\n```text\ncontainer backend_1 → Python 3.10 + свои зависимости\ncontainer backend_2 → Python 3.12 + свои зависимости\ncontainer redis     → Redis\ncontainer postgres  → PostgreSQL\n```\n\nКонтейнер — это не полноценная виртуальная машина, а изолированный процесс с нужными файлами для запуска; несколько контейнеров используют общее ядро host-системы. \n\n### 2. Одинаковое окружение везде\n\nDocker image можно собрать один раз и запустить:\n\n```text\nна ноутбуке разработчика\nв CI/CD\nна staging-сервере\nна production-сервере\n```\n\nЭто снижает риск, что приложение работает только на конкретной машине.\n\nБез Docker:\n\n```text\nнадо вручную повторить установку зависимостей на каждом сервере\n```\n\nС Docker:\n\n```text\nсобрал image → запустил image\n```\n\n### 3. Удобный деплой\n\nБез Docker деплой часто выглядит так:\n\n```bash\ngit pull\nsource venv/bin/activate\npip install -r requirements.txt\npython manage.py migrate\nsystemctl restart backend\n```\n\nС Docker деплой обычно проще:\n\n```bash\ndocker pull registry.example.com/backend:1.2.0\ndocker compose up -d\n```\n\nОбраз уже содержит нужную версию приложения и его зависимости.\n\n### 4. Простые откаты\n\nЕсли новая версия сломалась, без Docker нужно откатывать код, зависимости, конфиги и иногда состояние окружения.\n\nС Docker проще:\n\n```bash\ndocker run backend:1.1.0\n```\n\nили в Compose поменять tag:\n\n```yaml\nservices:\n  backend:\n    image: backend:1.1.0\n```\n\nТо есть каждая версия backend-сервиса может быть отдельным immutable image:\n\n```text\nbackend:1.0.0\nbackend:1.1.0\nbackend:1.2.0\n```\n\n### 5. Удобная работа с микросервисами\n\nBackend-приложение часто состоит не только из одного API:\n\n```text\nbackend\npostgres\nredis\ncelery worker\nrabbitmq\nnginx\nminio\n```\n\nБез Docker это всё нужно ставить и настраивать вручную на сервере.\n\nС Docker Compose можно описать всё окружение:\n\n```yaml\nservices:\n  backend:\n    build: .\n    depends_on:\n      - postgres\n      - redis\n\n  postgres:\n    image: postgres:16\n\n  redis:\n    image: redis:7\n```\n\nCompose управляет сервисами, сетями и volume в одном конфигурационном файле. \n\n### 6. Меньше загрязняется host-сервер\n\nБез Docker на сервер устанавливают много пакетов:\n\n```text\npython\npip\nnode\npostgresql-client\nredis-tools\ngcc\nnginx\nsystem libraries\n```\n\nСо временем становится сложно понять:\n\n```text\nкакой пакет нужен какому приложению;\nчто можно удалить;\nпочему после обновления пакета сломался сервис;\nкакие версии библиотек реально используются.\n```\n\nС Docker большая часть зависимостей живёт внутри image/container, а host остаётся чище.\n\n### 7. Быстрое масштабирование\n\nС Docker проще запустить несколько экземпляров backend:\n\n```bash\ndocker compose up -d --scale backend=3\n```\n\nВ Compose service — это абстрактное описание вычислительного ресурса приложения, который может масштабироваться или заменяться независимо от других компонентов.\n\nСхема:\n\n```text\nnginx\n  ↓\nbackend_1\nbackend_2\nbackend_3\n```\n\nДля обычного Linux-сервера без Docker тоже можно поднять несколько процессов через `systemd`, `supervisor` или `gunicorn workers`, но Docker делает управление экземплярами более унифицированным.\n\n### 8. Удобнее CI/CD\n\nВ CI/CD Docker хорошо ложится на процесс:\n\n```text\n1. Запустить тесты\n2. Собрать Docker image\n3. Присвоить tag\n4. Push в registry\n5. Pull на сервере\n6. Запустить новую версию\n```\n\nЭто лучше, чем каждый раз вручную повторять настройку окружения на сервере.\n\n### 9. Быстрее поднять dev-окружение\n\nНовому разработчику не нужно вручную ставить PostgreSQL, Redis, MinIO и настраивать локальную систему.\n\nДостаточно:\n\n```bash\ndocker compose up -d\n```\n\nИ он получает готовое окружение:\n\n```text\nbackend\ndatabase\ncache\nobject storage\nmessage broker\n```\n\nЭто особенно полезно для backend-команд, где много инфраструктурных зависимостей.\n\n### 10. Изоляция и безопасность\n\nDocker не делает приложение полностью безопасным сам по себе, но даёт дополнительную изоляцию:\n\n```text\nотдельная файловая система\nотдельная сеть\nотдельное дерево процессов\nограничение ресурсов\nотдельные users внутри контейнера\n```\n\nDocker описывает контейнеры как loosely isolated environment, а изоляция позволяет запускать много контейнеров на одном host. \n\n### Но Docker не заменяет Linux\n\nВажно понимать: Docker не отменяет знание Linux.\n\nВсё равно нужно понимать:\n\n```text\nправа файлов\nсети\nпорты\nлоги\nsystemd\nдиски\nпамять\nпроцессы\nnginx\nfirewall\n```\n\nDocker работает поверх host-ОС и использует её ядро. Поэтому при проблемах всё равно приходится диагностировать Linux-сервер.\n\n### Когда Docker особенно полезен\n\nDocker особенно полезен, когда:\n\n```text\nесть несколько сервисов;\nнужны PostgreSQL/Redis/RabbitMQ/MinIO;\nважна одинаковость окружений;\nесть CI/CD;\nнужно быстро деплоить и откатывать версии;\nнужно масштабировать backend;\nнесколько проектов живут на одном сервере;\nкоманда из нескольких разработчиков.\n```\n\n### Когда можно обойтись без Docker\n\nБез Docker можно нормально жить, если:\n\n```text\nпроект маленький;\nодин сервер;\nодин backend;\nнет сложных зависимостей;\nдеплой простой;\nкоманда маленькая;\nокружение редко меняется.\n```\n\nНапример, маленький Django/FastAPI-проект можно запустить напрямую через:\n\n```text\nvenv + gunicorn/uvicorn + systemd + nginx\n```\n\nЭто рабочий подход. Docker просто делает окружение более воспроизводимым и удобным для переноса.\n\n### Коротко\n\nDocker нужен не потому, что backend нельзя запустить напрямую на Linux-сервере, а потому что Docker упаковывает приложение вместе с зависимостями в единый image и позволяет запускать его одинаково в разных окружениях. Это упрощает деплой, снижает конфликты зависимостей, облегчает откаты, масштабирование и работу с микросервисами.\n\nГлавные преимущества Docker для backend-приложения:\n\n```text\nизоляция зависимостей;\nодинаковое окружение local/staging/prod;\nбыстрый деплой;\nпростые откаты версий;\nудобный запуск PostgreSQL/Redis/RabbitMQ рядом с backend;\nменьше ручной настройки сервера;\nудобная интеграция с CI/CD;\nпроще масштабировать приложение.\n```\n\nНо Docker не заменяет Linux и не делает архитектуру автоматически правильной. Он решает проблему упаковки, запуска и управления окружением backend-сервиса."
  popularity = 2.63
