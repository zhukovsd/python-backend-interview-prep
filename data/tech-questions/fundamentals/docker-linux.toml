[[questions]]
  id = 2
  question = "Является ли контейнер полноценной операционной системой?"
  answer = "Нет, контейнер не является полноценной операционной системой.\n\nКонтейнер — это изолированный процесс или группа процессов, которые используют ядро операционной системы хоста.\n\n```text\nКонтейнер ≠ полноценная ОС\nКонтейнер ≠ виртуальная машина\nКонтейнер = изолированное окружение для запуска процесса\n```\n\nDocker в документации по безопасности отдельно указывает, что изоляция контейнеров опирается на возможности ядра: `namespaces` и `cgroups`. \n\n### Что есть внутри контейнера\n\nВ контейнере обычно есть пользовательское окружение:\n\n```text\nфайловая система\nбиблиотеки\nзависимости\nпеременные окружения\nконфиги\nзапускаемый процесс\nчасть системных утилит\n```\n\nНапример, образ `python:3.12-slim` содержит:\n\n```text\nPython\npip\nчасть Linux userland\nбиблиотеки\nфайловую структуру\n```\n\nНо внутри контейнера нет собственного отдельного ядра ОС.\n\n### Чего нет внутри контейнера\n\nВ контейнере обычно нет полноценной ОС в смысле виртуальной машины:\n\n```text\nнет отдельного kernel\nнет отдельной загрузки ОС\nнет своего init/systemd в классическом смысле\nнет полноценного hardware virtualization слоя\n```\n\nКонтейнер использует ядро хостовой системы.\n\nСхема:\n\n```text\nHost OS kernel\n├── container 1: nginx process\n├── container 2: postgres process\n└── container 3: python app process\n```\n\nВсе эти контейнеры работают через одно ядро хоста.\n\n### Чем контейнер отличается от виртуальной машины\n\nВиртуальная машина обычно содержит полноценную гостевую ОС:\n\n```text\nVM\n├── guest kernel\n├── guest OS\n├── system libraries\n└── application\n```\n\nКонтейнер содержит только окружение приложения:\n\n```text\nContainer\n├── libraries\n├── dependencies\n├── filesystem\n└── application process\n```\n\nСравнение:\n\n```text\nКритерий              Контейнер                  Виртуальная машина\n---------------------------------------------------------------------\nЯдро ОС                общее с хостом              своё guest kernel\nЗапуск                 быстро                      медленнее\nВес                    легче                       тяжелее\nИзоляция               на уровне процессов         на уровне VM/hypervisor\nРесурсы                меньше overhead             больше overhead\nПолноценная ОС         нет                         да\n```\n\nDocker прямо описывает контейнеры не как VM-подход, а как механизм доставки и запуска приложений; контейнеры не являются полноценными виртуальными машинами. \n\n### Почему тогда внутри контейнера видна «ОС»\n\nНапример, можно зайти в контейнер:\n\n```bash\ndocker exec -it app bash\n```\n\nИ увидеть:\n\n```bash\ncat /etc/os-release\n```\n\nВывод может быть:\n\n```text\nDebian GNU/Linux\n```\n\nЭто не значит, что внутри запущена полноценная Debian OS с отдельным ядром.\n\nЭто значит, что файловая система контейнера основана на Debian userland:\n\n```text\nпакеты\nутилиты\nдиректории\nбиблиотеки\n/etc/os-release\n```\n\nНо kernel всё равно берётся от хоста.\n\n### За счёт чего контейнер изолируется\n\nКонтейнеры используют механизмы ядра Linux:\n\n```text\nnamespaces → изоляция процессов, сети, mount, PID, users\ncgroups    → ограничения CPU, RAM, IO и других ресурсов\ncapabilities/seccomp/AppArmor/SELinux → дополнительные ограничения безопасности\n```\n\nDocker в документации по security отдельно выделяет поддержку kernel namespaces и cgroups как одну из ключевых областей безопасности контейнеров. \n\nПримерно так:\n\n```text\nnamespace создаёт иллюзию отдельной системы\ncgroup ограничивает ресурсы\nfilesystem image даёт отдельное окружение файлов\n```\n\n### Важный нюанс про Docker Desktop\n\nНа Linux Docker-контейнеры обычно используют ядро Linux-хоста напрямую.\n\nНа Windows/macOS Docker Desktop часто запускает контейнеры внутри специальной Linux VM, потому что Linux-контейнерам нужно Linux-ядро. Docker указывает, что Docker Desktop запускает контейнеры внутри кастомизированной Linux VM, кроме native Windows containers. \n\nНо даже там сам контейнер всё равно не является полноценной ОС. Полноценная ОС/ядро находится в VM, а контейнеры уже работают внутри неё.\n\n### Итог\n\nКонтейнер — это не полноценная операционная система, а изолированное окружение для запуска процесса.\n\nПравильная формулировка:\n\n```text\nКонтейнер содержит пользовательское окружение приложения,\nно не содержит собственного ядра ОС.\nОн использует ядро хостовой системы и изолируется через механизмы ядра.\n```"
  popularity = 2.63

[[questions]]
  id = 3
  question = "Где находится ядро ОС при использовании контейнеров?"
  answer = "При использовании контейнеров ядро ОС находится не внутри контейнера, а на хостовой системе.\n\n```text\nHost OS kernel\n├── container 1\n├── container 2\n└── container 3\n```\n\nВсе контейнеры используют одно и то же ядро хоста.\n\n### На Linux\n\nЕсли Docker запущен на Linux, контейнеры используют ядро Linux-хоста напрямую.\n\n```text\nLinux host\n├── Linux kernel\n│   ├── container: nginx\n│   ├── container: postgres\n│   └── container: python app\n```\n\nКонтейнер содержит:\n\n```text\nфайловую систему\nбиблиотеки\nзависимости\nконфиги\nзапускаемый процесс\n```\n\nНо не содержит собственного ядра.\n\nDocker в документации по безопасности указывает, что контейнерная изоляция опирается на возможности ядра: `namespaces` и `cgroups`. То есть именно ядро хоста создаёт изоляцию процессов и ограничение ресурсов. \n\n### На Windows и macOS\n\nДля Linux-контейнеров на Windows/macOS ситуация чуть сложнее.\n\nТам Linux-контейнеры обычно запускаются не напрямую на ядре Windows/macOS, а внутри Linux VM, которую использует Docker Desktop.\n\n```text\nWindows / macOS\n└── Docker Desktop Linux VM\n    └── Linux kernel\n        ├── container 1\n        ├── container 2\n        └── container 3\n```\n\nТо есть ядро всё равно не внутри контейнера. Оно находится либо:\n\n```text\nна Linux-хосте\n```\n\nлибо:\n\n```text\nв Linux VM, которую запускает Docker Desktop\n```\n\nDocker Desktop в настройках прямо упоминает ресурсы, доступные для `Docker Linux VM`, что отражает эту архитектуру на Desktop-платформах. \n\n### Почему контейнер видит «свою систему»\n\nВ контейнере можно выполнить:\n\n```bash\ncat /etc/os-release\n```\n\nИ увидеть, например:\n\n```text\nDebian GNU/Linux\n```\n\nНо это не значит, что внутри контейнера запущено отдельное ядро Debian.\n\nЭто означает только, что файловая система контейнера основана на Debian userland:\n\n```text\n/etc\n/bin\n/usr\nlibc\nbash\napt\npython\nnginx\n```\n\nА ядро будет хостовое:\n\n```bash\nuname -r\n```\n\nКоманда покажет версию ядра, которое реально обслуживает контейнер. Обычно это ядро хоста или ядро Linux VM в Docker Desktop.\n\n### Сравнение с виртуальной машиной\n\n```text\nКонтейнер:\napp + libs + filesystem\nиспользует kernel хоста\n\nВиртуальная машина:\nguest OS + guest kernel + app\nимеет своё отдельное ядро\n```\n\nПоэтому контейнер легче виртуальной машины: он не загружает отдельную ОС и не держит отдельное ядро.\n\n### Итог\n\nПравильная формулировка:\n\n```text\nЯдро ОС находится на хостовой системе, а не внутри контейнера.\nКонтейнер использует это общее ядро и изолируется с помощью namespaces, cgroups и других механизмов ядра.\n```"
  popularity = 2.63

[[questions]]
  id = 4
  question = "Что такое загрузчик системы (GRUB) и какую роль он выполняет?"
  answer = "### Что такое GRUB\n\nGRUB — это загрузчик системы.\n\nПолное название:\n\n```text\nGRUB = GRand Unified Bootloader\n```\n\nЕго задача — запустить операционную систему после включения компьютера.\n\nОфициальная документация GNU описывает GRUB как гибкий и мощный boot loader, который может загружать разные операционные системы на разных архитектурах. \n\n### Где GRUB находится в цепочке загрузки\n\nУпрощённая схема загрузки компьютера:\n\n```text\n1. Нажали кнопку питания\n2. BIOS/UEFI инициализирует железо\n3. BIOS/UEFI ищет загрузочное устройство\n4. Запускается загрузчик GRUB\n5. GRUB показывает меню загрузки\n6. GRUB загружает ядро ОС\n7. Ядро запускает операционную систему\n```\n\nТо есть GRUB находится между прошивкой компьютера и операционной системой:\n\n```text\nBIOS/UEFI → GRUB → Linux kernel → systemd/init → user space\n```\n\n### Какую роль выполняет GRUB\n\nГлавная роль GRUB — найти и загрузить ядро операционной системы.\n\nДля Linux это обычно:\n\n```text\nvmlinuz       → ядро Linux\ninitramfs     → временная начальная файловая система\ngrub.cfg      → конфигурация меню загрузки\n```\n\nGRUB передаёт управление ядру Linux, а уже ядро запускает остальную систему.\n\n### Что делает GRUB на практике\n\nGRUB может:\n\n```text\nпоказать меню выбора ОС\nзагрузить нужное ядро Linux\nпередать ядру параметры запуска\nзагрузить initramfs\nзапустить систему в обычном режиме\nзапустить recovery mode\nвыбрать другую версию ядра\nзагрузить другую ОС через chainloading\n```\n\nChainloading — это когда GRUB не загружает ОС напрямую, а передаёт управление другому загрузчику. В документации GRUB отдельно указано, что для некоторых ОС используется chain-loading. \n\n### Пример меню GRUB\n\nПри запуске компьютера можно увидеть примерно такое меню:\n\n```text\nUbuntu\nAdvanced options for Ubuntu\nWindows Boot Manager\nUEFI Firmware Settings\n```\n\nЭто значит, что GRUB позволяет выбрать, что именно загружать.\n\nНапример:\n\n```text\nUbuntu                         → обычная загрузка Linux\nAdvanced options for Ubuntu    → выбор старого ядра или recovery mode\nWindows Boot Manager           → передача управления загрузчику Windows\nUEFI Firmware Settings         → вход в настройки UEFI\n```\n\n### Зачем нужен GRUB, если есть BIOS/UEFI\n\nBIOS/UEFI не запускает полноценную ОС напрямую в привычном смысле. Его задача — найти загрузчик и передать ему управление.\n\nBIOS/UEFI знает:\n\n```text\nс какого диска загружаться\nкакой EFI-файл запустить\nкакое устройство первое в boot order\n```\n\nНо GRUB уже знает больше про операционную систему:\n\n```text\nгде лежит ядро Linux\nкакие параметры передать ядру\nкакой initramfs загрузить\nкакие пункты меню показать\nкакие ОС доступны\n```\n\nТо есть:\n\n```text\nBIOS/UEFI запускает загрузчик\nGRUB запускает ОС\n```\n\n### GRUB и ядро Linux\n\nGRUB не является ядром Linux.\n\nЭто разные вещи:\n\n```text\nGRUB         → загрузчик\nLinux kernel → ядро операционной системы\n```\n\nGRUB работает до запуска ядра. После того как ядро загружено и ему передано управление, основная работа GRUB заканчивается.\n\nСхема:\n\n```text\nGRUB загрузил kernel + initramfs\n↓\nпередал управление kernel\n↓\nLinux kernel продолжил запуск системы\n```\n\n### Где обычно находится GRUB\n\nЗависит от режима загрузки.\n\n### BIOS / Legacy\n\nВ старой BIOS-схеме часть GRUB может находиться:\n\n```text\nв MBR диска\nв специальной области после MBR\nв /boot/grub\n```\n\n### UEFI\n\nВ современной UEFI-схеме GRUB обычно находится на EFI System Partition.\n\nПример пути:\n\n```text\n/boot/efi/EFI/ubuntu/grubx64.efi\n```\n\nИли для другого дистрибутива:\n\n```text\n/boot/efi/EFI/fedora/grubx64.efi\n/boot/efi/EFI/debian/grubx64.efi\n```\n\nUEFI запускает `.efi`-файл загрузчика, а дальше GRUB открывает своё меню и загружает выбранную ОС.\n\n### Конфигурация GRUB\n\nОсновной конфигурационный файл обычно:\n\n```text\n/boot/grub/grub.cfg\n```\n\nНо вручную его обычно не редактируют.\n\nЧаще меняют:\n\n```text\n/etc/default/grub\n```\n\nА потом пересобирают конфигурацию командой вроде:\n\n```bash\nsudo update-grub\n```\n\nили:\n\n```bash\nsudo grub-mkconfig -o /boot/grub/grub.cfg\n```\n\nНазвание команды зависит от дистрибутива.\n\n### Примеры параметров ядра\n\nGRUB может передавать ядру Linux параметры запуска.\n\nНапример:\n\n```text\nquiet\nsplash\nnomodeset\nsingle\nroot=/dev/sda2\n```\n\nОни влияют на то, как будет запускаться система.\n\nНапример:\n\n```text\nquiet splash → скрыть подробный вывод загрузки\nnomodeset    → часто используют при проблемах с видеодрайвером\nsingle       → однопользовательский/recovery-подобный режим\n```\n\n### Когда GRUB особенно важен\n\nGRUB полезен, когда:\n\n```text\nна компьютере несколько ОС\nнужно выбрать старую версию ядра\nсломался новый kernel после обновления\nнужно загрузиться в recovery mode\nнужно изменить параметры запуска ядра\nнужно восстановить загрузку Linux\n```\n\nНапример, после неудачного обновления ядра можно выбрать старое ядро через:\n\n```text\nAdvanced options for Linux\n```\n\nи загрузить систему.\n\n### Коротко\n\n```text\nGRUB — это загрузчик операционной системы. Он запускается после BIOS/UEFI, показывает меню загрузки, выбирает нужную ОС или ядро, загружает kernel и initramfs в память, передаёт ядру параметры запуска и затем отдаёт ему управление.\n```\n\nГлавная мысль:\n\n```text\nBIOS/UEFI запускает GRUB,\nGRUB запускает ядро ОС,\nядро запускает остальную систему.\n```"
  popularity = 2.63

[[questions]]
  id = 5
  question = "Какие этапы происходят после того, как GRUB передаёт управление ядру?"
  answer = "После того как GRUB передал управление ядру Linux, GRUB уже почти не участвует в процессе. Дальше загрузкой занимается само ядро, затем `initramfs`, затем первый пользовательский процесс — обычно `systemd`.\n\nОбщая цепочка:\n\n```text\nBIOS/UEFI\n↓\nGRUB\n↓\nLinux kernel\n↓\ninitramfs / initrd\n↓\nreal root filesystem\n↓\nPID 1: systemd / init\n↓\nservices, network, login\n```\n\n### 1. Ядро получает управление\n\nGRUB загружает в память:\n\n```text\nkernel image  → ядро Linux\ninitramfs     → временная начальная файловая система\ncmdline       → параметры запуска ядра\n```\n\nПосле этого GRUB передаёт управление ядру. Ядро начинает собственную инициализацию: распаковку, настройку памяти, CPU, таблиц, прерываний и базовых подсистем. Параметры запуска ядра передаются через kernel command line; документация ядра отдельно описывает параметры командной строки как механизм настройки поведения kernel при boot. \n\n### 2. Инициализация ядра\n\nНа этом этапе ядро подготавливает низкоуровневую часть системы:\n\n```text\nинициализация CPU\nинициализация памяти\nнастройка scheduler\nинициализация interrupt handling\nобнаружение оборудования\nзагрузка встроенных драйверов\nинициализация VFS\nподготовка rootfs\n```\n\nТо есть ядро начинает управлять железом и создаёт базовую среду, в которой дальше смогут запускаться пользовательские процессы.\n\n### 3. Работа с initramfs / initrd\n\nОбычно GRUB вместе с ядром загружает ещё и `initramfs`.\n\n`initramfs` — это временная файловая система в памяти. Она нужна, чтобы подготовить систему к монтированию настоящего корневого раздела.\n\nДокументация Linux kernel описывает `initramfs` как cpio-архив, который распаковывается в `rootfs` во время загрузки ядра. \n\nЗачем нужен `initramfs`:\n\n```text\nзагрузить нужные kernel modules\nнайти диск с root filesystem\nрасшифровать LUKS-раздел\nактивировать LVM\nподключить RAID\nподготовить драйверы файловой системы\nсмонтировать настоящий root\n```\n\nНапример, если корневая система лежит на LVM, encrypted disk или RAID, ядро не всегда может сразу смонтировать её без дополнительной подготовки.\n\n### 4. Запускается ранний userspace\n\nПосле распаковки `initramfs` ядро запускает первый временный userspace-процесс из initramfs.\n\nОбычно это:\n\n```text\n/init\n```\n\nили скрипт/бинарник, который выполняет раннюю подготовку.\n\nСхема:\n\n```text\nkernel\n↓\ninitramfs\n↓\n/init внутри initramfs\n```\n\nЭтот `/init` ещё не является полноценным `systemd` основной системы. Это временная стадия, задача которой — подготовить настоящий root filesystem.\n\nДокументация kernel по `initrd` указывает, что initrd позволяет загрузчику загрузить RAM disk, смонтировать его как root filesystem и запускать из него программы. \n\n### 5. Монтируется настоящий root filesystem\n\nПосле подготовки `initramfs` находит и монтирует настоящий корневой раздел.\n\nНапример:\n\n```text\n/dev/sda2\n/dev/nvme0n1p2\nUUID=...\nLVM volume\nencrypted volume\nnetwork root\n```\n\nПосле этого происходит переключение:\n\n```text\ntemporary root из initramfs\n↓\nreal root filesystem\n```\n\nОбычно этот этап называют:\n\n```text\nswitch_root\n```\n\nили похожим механизмом в зависимости от реализации initramfs.\n\nСмысл:\n\n```text\nсначала система жила во временной ФС в памяти\nпотом перешла на настоящий root-раздел диска\n```\n\n### 6. Запускается PID 1\n\nПосле монтирования настоящего root filesystem ядро запускает первый настоящий пользовательский процесс.\n\nОбычно это:\n\n```text\n/sbin/init\n```\n\nВ современных Linux-дистрибутивах чаще всего это `systemd`.\n\nПервый процесс получает PID 1:\n\n```text\nPID 1 = systemd / init\n```\n\nЭто особый процесс. Он становится родительским процессом для остальных системных сервисов и управляет дальнейшей загрузкой системы.\n\nДокументация systemd описывает его как system and service manager, который запускается как первый userspace-процесс и управляет службами. \n\n### 7. systemd поднимает систему\n\nПосле запуска `systemd` начинается уже привычная инициализация userspace:\n\n```text\nмонтирование файловых систем\nзапуск udev\nнастройка hostname\nзапуск journald\nзапуск dbus\nзапуск network services\nзапуск cron/timers\nзапуск ssh\nзапуск display manager\nзапуск пользовательских сервисов\n```\n\nsystemd использует units:\n\n```text\n.service\n.target\n.mount\n.socket\n.timer\n.device\n```\n\nДокументация `systemd bootup` описывает, что на этапе boot системный менеджер инициализирует файловые системы, сервисы и драйверы, необходимые для работы системы. \n\n### 8. Система выходит на нужный target\n\nВ systemd вместо старых runlevel обычно используются targets.\n\nПримеры:\n\n```text\nbasic.target\nmulti-user.target\ngraphical.target\nrescue.target\nemergency.target\n```\n\nУпрощённо:\n\n```text\nmulti-user.target → серверный режим, сеть, сервисы, без GUI\ngraphical.target  → графический режим с display manager\nrescue.target     → восстановительный режим\n```\n\nЕсли это сервер, система обычно доходит до `multi-user.target`.\n\nЕсли это desktop Linux, система доходит до `graphical.target`, после чего появляется экран входа.\n\n### Полная схема после GRUB\n\n```text\nGRUB передал управление kernel\n↓\nkernel распаковывается и стартует\n↓\nkernel инициализирует CPU, RAM, драйверы, подсистемы\n↓\nkernel использует параметры командной строки\n↓\nkernel распаковывает/initramfs\n↓\nзапускается /init из initramfs\n↓\ninitramfs находит и монтирует настоящий root filesystem\n↓\nпроисходит switch_root\n↓\nkernel запускает /sbin/init\n↓\nстартует PID 1: systemd\n↓\nsystemd запускает units/services/targets\n↓\nсистема готова к работе\n```\n\n### Коротко \n\n```text\nПосле передачи управления от GRUB ядро Linux распаковывается, инициализирует память, процессор, драйверы и базовые подсистемы. Затем оно использует initramfs/initrd для подготовки настоящего корневого раздела, монтирует root filesystem и запускает первый пользовательский процесс — PID 1, обычно systemd. После этого systemd поднимает сервисы, монтирует файловые системы, настраивает окружение и доводит систему до нужного target, например multi-user или graphical.\n```\n\nГлавная мысль:\n\n```text\nGRUB только запускает ядро.\nДальше ядро запускает initramfs,\ninitramfs подготавливает root filesystem,\nа systemd поднимает пользовательскую часть системы.\n```"
  popularity = 2.63

[[questions]]
  id = 6
  question = "Какие особенности работы контейнеров на Windows?"
  answer = "Контейнеры на Windows работают в двух разных режимах:\n\n```text\n1. Linux containers  → через WSL2 / Linux VM\n2. Windows containers → на Windows-ядре или через Hyper-V isolation\n```\n\nГлавная особенность: Windows не запускает Linux-контейнеры напрямую на Windows-ядре. Linux-контейнеру нужно Linux-ядро, поэтому Docker Desktop на Windows обычно использует WSL2 backend. Docker официально указывает, что Docker Desktop может работать на Windows через WSL2, а WSL2 backend включается в настройках Docker Desktop. \n\n### 1. Linux-контейнеры на Windows\n\nЕсли ты запускаешь обычные образы вроде:\n\n```bash\ndocker run python:3.12\ndocker run postgres:16\ndocker run redis:7\ndocker run nginx\n```\n\nто это обычно Linux-контейнеры.\n\nНа Windows они работают так:\n\n```text\nWindows\n└── WSL2 / Docker Linux VM\n    └── Linux kernel\n        ├── container: python\n        ├── container: postgres\n        └── container: redis\n```\n\nТо есть контейнер не использует Windows kernel. Он использует Linux kernel внутри WSL2/Docker VM. Docker Desktop также указывает, что на Windows можно работать «нативно» через WSL2. \n\n### 2. Windows-контейнеры\n\nWindows-контейнеры — это отдельный тип контейнеров, которые запускают Windows-приложения.\n\nПримеры образов:\n\n```text\nmcr.microsoft.com/windows/nanoserver\nmcr.microsoft.com/windows/servercore\n```\n\nОни нужны, если приложение зависит от Windows API, .NET Framework, IIS или другого Windows-окружения.\n\nWindows-контейнеры имеют два режима изоляции:\n\n```text\nprocess isolation\nHyper-V isolation\n```\n\nMicrosoft официально описывает два режима runtime isolation для Windows containers: process isolation и Hyper-V isolation. \n\n### 3. Process isolation\n\nВ режиме process isolation контейнеры используют ядро Windows-хоста.\n\n```text\nWindows host kernel\n├── Windows container 1\n├── Windows container 2\n└── Windows container 3\n```\n\nЭто ближе к классической модели контейнеров: контейнеры изолированы как процессы, но используют общее ядро хоста.\n\nПлюсы:\n\n```text\nбыстрее запуск\nменьше overhead\nвыше плотность контейнеров\n```\n\nМинусы:\n\n```text\nжёстче требования к совместимости версий Windows host/image\nизоляция слабее, чем у Hyper-V isolation\n```\n\nMicrosoft указывает, что при process isolation контейнеры используют общее ядро с хостом, а Hyper-V isolation даёт более сильную изоляцию. \n\n### 4. Hyper-V isolation\n\nВ Hyper-V isolation каждый Windows-контейнер запускается внутри оптимизированной виртуальной машины.\n\n```text\nWindows host\n├── optimized VM → Windows container 1\n├── optimized VM → Windows container 2\n└── optimized VM → Windows container 3\n```\n\nВ этом режиме контейнер фактически получает собственный экземпляр Windows kernel. Microsoft прямо указывает, что Hyper-V isolation создаёт безопасную границу вокруг контейнера с помощью оптимизированной VM, а каждый такой контейнер имеет собственный instance Windows kernel. \n\nПлюсы:\n\n```text\nсильнее изоляция\nлучше совместимость между версиями host и container image\nбезопаснее для недоверенного кода\n```\n\nМинусы:\n\n```text\nбольше overhead\nмедленнее запуск\nбольше потребление ресурсов\nнужен Hyper-V\n```\n\n### 5. Нельзя путать Linux и Windows images\n\nLinux-образ и Windows-образ — это разные вещи.\n\n```text\npython:3.12-slim        → Linux image\npostgres:16             → Linux image\nmcr.microsoft.com/windows/servercore → Windows image\n```\n\nLinux-контейнеру нужно Linux-ядро. Windows-контейнеру нужно Windows-ядро или Hyper-V isolation с Windows kernel.\n\nПоэтому на Windows обычно переключаются между режимами:\n\n```text\nLinux containers\nWindows containers\n```\n\nDocker Desktop для Windows поддерживает переключение между Linux и Windows containers; в документации CLI есть команда `docker desktop engine use`, которая предназначена именно для switch to Windows or Linux containers. \n\n### 6. Особенности файловой системы\n\nНа Windows важно, где лежит проект.\n\nЕсли работаешь с Linux-контейнерами через WSL2, лучше держать проект внутри Linux filesystem WSL, например:\n\n```text\n/home/user/project\n```\n\nа не в:\n\n```text\nC:\\Users\\user\\project\n```\n\nПричина — производительность файловых операций. Docker отдельно даёт рекомендации по WSL2 best practices, включая оптимизацию filesystem performance при bind mounts. \n\nНа практике это особенно заметно в проектах с большим количеством файлов:\n\n```text\nnode_modules\nPython venv\nDjango/FastAPI проект\nмного тестов\nмного миграций\nбольшие vendor/dependency директории\n```\n\n### 7. Особенности путей\n\nНа Windows и Linux разные форматы путей.\n\nWindows:\n\n```text\nC:\\Users\\Alfob\\project\n```\n\nLinux/WSL:\n\n```text\n/home/alfob/project\n/mnt/c/Users/Alfob/project\n```\n\nВ Docker Compose на Windows из-за этого иногда возникают проблемы с volumes:\n\n```yaml\nvolumes:\n  - ./app:/app\n```\n\nили с абсолютными путями:\n\n```yaml\nvolumes:\n  - C:\\Users\\Alfob\\project:/app\n```\n\nЛучше для Linux-контейнеров работать из WSL-терминала и хранить проект в Linux-разделе WSL.\n\n### 8. Особенности сети\n\nКонтейнеры на Docker Desktop работают не совсем так, как на чистом Linux-хосте, потому что между Windows-хостом, VM/WSL2 и контейнерами есть дополнительный сетевой слой.\n\nСхема:\n\n```text\nWindows host\n↕\nDocker Desktop / WSL2 VM\n↕\nDocker network\n↕\ncontainers\n```\n\nDocker Desktop отдельно описывает, что он маршрутизирует network traffic и file I/O между контейнерами, VM и host.\n\nОбычно проброс порта работает привычно:\n\n```bash\ndocker run -p 8000:8000 my-app\n```\n\nПосле этого приложение доступно с Windows-хоста:\n\n```text\nhttp://localhost:8000\n```\n\nНо при сложной сетевой настройке могут быть нюансы с firewall, VPN, proxy, корпоративной сетью и доступом контейнера к сервисам на Windows-хосте.\n\n### 9. Совместимость версий Windows-контейнеров\n\nДля Windows-контейнеров важна версия Windows host и версия container image.\n\nНапример, образ, собранный под одну версию Windows Server, может не запуститься в process isolation на несовместимой версии Windows-хоста.\n\nMicrosoft отдельно ведёт документацию по Windows container version compatibility и указывает, что Hyper-V isolation помогает запускать контейнеры при различиях между версией host и image. \n\nПрактически:\n\n```text\nLinux containers → обычно меньше проблем с версией Windows\nWindows containers → нужно смотреть совместимость host/image\n```\n\n### 10. Docker Desktop требует включённых компонентов Windows\n\nДля Linux-контейнеров обычно нужен WSL2.\n\nDocker указывает, что WSL2 должен быть включён на машине перед запуском Docker Desktop с WSL2 backend. \n\nДля Windows containers с Hyper-V isolation нужен Hyper-V. Microsoft указывает, что Hyper-V role должна быть установлена перед запуском Hyper-V isolation. \n\nТо есть могут понадобиться:\n\n```text\nWSL2\nVirtual Machine Platform\nHyper-V\nWindows Containers feature\nаппаратная виртуализация в BIOS/UEFI\n```\n\n### 11. Образы Windows обычно тяжелее\n\nWindows base images обычно крупнее Linux slim/alpine образов.\n\nНапример:\n\n```text\nLinux image: python:3.12-slim\nWindows image: windows/servercore\n```\n\nWindows-контейнеры часто тяжелее, потому что им нужен Windows userland: системные библиотеки, API и компоненты совместимости.\n\nПоэтому для backend-разработки на Python, Node.js, PostgreSQL, Redis, Nginx чаще используют Linux-контейнеры даже на Windows.\n\n### 12. Что выбирать на практике\n\nДля обычного Python backend-проекта:\n\n```text\nFastAPI\nDjango\nPostgreSQL\nRedis\nCelery\nNginx\n```\n\nлучше использовать:\n\n```text\nDocker Desktop + WSL2 backend + Linux containers\n```\n\nТо есть:\n\n```text\nкод хранить внутри WSL\nкоманды запускать из WSL terminal\ndocker compose использовать оттуда же\nобразы брать Linux-based\n```\n\nWindows containers нужны, если приложение реально Windows-specific:\n\n```text\n.NET Framework\nIIS\nWindows Services\nCOM-компоненты\nWindows API\nlegacy Windows-приложения\n```\n\n### Итог\n\nОсобенности контейнеров на Windows:\n\n```text\nLinux-контейнеры работают через WSL2/Docker Linux VM\nWindows-контейнеры работают на Windows kernel или через Hyper-V isolation\nLinux и Windows images несовместимы между собой\nдля Windows-контейнеров важна версия host и image\nфайлы проекта лучше хранить внутри WSL для Linux-контейнеров\nсеть идёт через дополнительный слой Docker Desktop/WSL2\nдля работы нужны WSL2, Hyper-V или Windows Containers features\n```"
  popularity = 2.63

[[questions]]
  id = 7
  question = "Как выбирается базовый образ для контейнера?"
  answer = "Базовый образ выбирается по тому, что нужно приложению для запуска:\n\n```text\nязык / runtime\nверсия ОС и библиотек\nразмер образа\nбезопасность\nсовместимость зависимостей\nстабильность сборки\nproduction-окружение\n```\n\nГлавное правило:\n\n```text\nбазовый образ должен содержать минимум необходимого,\nно при этом не ломать сборку и runtime приложения\n```\n\nDocker в best practices рекомендует по возможности использовать актуальные official images как основу для своих образов. \n\n### 1. Сначала выбирают runtime\n\nДля Python-проекта обычно берут Python-образ:\n\n```dockerfile\nFROM python:3.12-slim\n```\n\nДля Node.js:\n\n```dockerfile\nFROM node:22-slim\n```\n\nДля Go-приложения часто используют multi-stage build:\n\n```dockerfile\nFROM golang:1.23 AS builder\n```\n\nА потом минимальный runtime-образ:\n\n```dockerfile\nFROM debian:bookworm-slim\n```\n\nИдея:\n\n```text\nесли приложению нужен Python → берем python image\nесли нужен Node.js → берем node image\nесли нужен Java → берем eclipse-temurin/openjdk image\nесли нужен только бинарник → можно взять debian-slim, alpine или distroless\n```\n\n### 2. Лучше брать official image\n\nПредпочтительно использовать official images:\n\n```text\npython\nnode\npostgres\nredis\nnginx\ndebian\nubuntu\nalpine\n```\n\nПричина: они лучше поддерживаются, документированы и чаще обновляются. Docker Hub отдельно выделяет Docker Official Images и trusted content как более надёжную основу для контейнеров. \n\nПлохой вариант:\n\n```dockerfile\nFROM random-user/python-custom:latest\n```\n\nЛучше:\n\n```dockerfile\nFROM python:3.12-slim\n```\n\n### 3. Версию нужно фиксировать\n\nПлохо:\n\n```dockerfile\nFROM python:latest\n```\n\nПочему плохо:\n\n```text\nсегодня latest может быть Python 3.12\nпозже latest станет Python 3.13\nсборка может неожиданно сломаться\n```\n\nЛучше:\n\n```dockerfile\nFROM python:3.12-slim\n```\n\nЕщё строже — фиксировать digest:\n\n```dockerfile\nFROM python:3.12-slim@sha256:...\n```\n\nНо на практике для большинства проектов обычно достаточно фиксированной версии `3.12-slim`, а digest используют там, где нужна максимальная воспроизводимость сборки.\n\n### 4. `slim` часто лучше полного образа\n\nНапример:\n\n```dockerfile\nFROM python:3.12\n```\n\nЭто полный образ. В нём больше системных пакетов.\n\nЧаще для production лучше:\n\n```dockerfile\nFROM python:3.12-slim\n```\n\nПлюсы `slim`:\n\n```text\nменьше размер\nменьше лишних пакетов\nменьше attack surface\nбыстрее pull/push\n```\n\nМинусы:\n\n```text\nможет не хватать build tools\nможет не хватать системных библиотек\nнужно явно ставить зависимости через apt\n```\n\nПример:\n\n```dockerfile\nFROM python:3.12-slim\n\nRUN apt-get update && apt-get install -y --no-install-recommends \\\n    gcc \\\n    libpq-dev \\\n    && rm -rf /var/lib/apt/lists/*\n```\n\n### 5. `alpine` не всегда лучший выбор\n\n`alpine` очень маленький:\n\n```dockerfile\nFROM python:3.12-alpine\n```\n\nDocker указывает, что Alpine-variants обычно меньше `slim`-вариантов и ставят только необходимые пакеты. \n\nНо Alpine использует `musl libc`, а не `glibc`. Из-за этого могут быть проблемы с Python-пакетами, которые имеют нативные зависимости:\n\n```text\npsycopg2\nnumpy\npandas\ncryptography\npillow\nlxml\nuvloop\ngrpcio\n```\n\nВ итоге `alpine` может дать:\n\n```text\nменьший образ\nно более сложную сборку\nдольше установку зависимостей\nпроблемы совместимости\n```\n\nДля Python backend чаще безопаснее:\n\n```dockerfile\nFROM python:3.12-slim\n```\n\nА не:\n\n```dockerfile\nFROM python:3.12-alpine\n```\n\n### 6. Для production лучше не тащить build-зависимости\n\nПлохой вариант:\n\n```dockerfile\nFROM python:3.12-slim\n\nRUN apt-get update && apt-get install -y gcc build-essential\n\nCOPY . /app\nRUN pip install -r requirements.txt\nCMD [\"python\", \"main.py\"]\n```\n\nПроблема: `gcc`, `build-essential` и прочие инструменты остаются в финальном образе.\n\nЛучше использовать multi-stage build:\n\n```dockerfile\nFROM python:3.12-slim AS builder\n\nWORKDIR /app\n\nRUN apt-get update && apt-get install -y --no-install-recommends \\\n    gcc \\\n    libpq-dev \\\n    && rm -rf /var/lib/apt/lists/*\n\nCOPY requirements.txt .\nRUN pip wheel --no-cache-dir --wheel-dir /wheels -r requirements.txt\n\n\nFROM python:3.12-slim\n\nWORKDIR /app\n\nCOPY --from=builder /wheels /wheels\nRUN pip install --no-cache-dir /wheels/* && rm -rf /wheels\n\nCOPY . .\n\nCMD [\"python\", \"main.py\"]\n```\n\nСмысл:\n\n```text\nbuilder image → собирает зависимости\nruntime image → содержит только то, что нужно для запуска\n```\n\nDocker в best practices отдельно рекомендует multi-stage builds для уменьшения размера финального образа и отделения build-зависимостей от runtime. \n\n### 7. Нужно учитывать production-окружение\n\nБазовый образ должен быть близок к тому, где приложение реально будет работать.\n\nНапример, если в production Linux-контейнеры на Debian-based окружении, нормальный выбор:\n\n```dockerfile\nFROM python:3.12-slim\n```\n\nЕсли компания использует Ubuntu-based images:\n\n```dockerfile\nFROM ubuntu:24.04\n```\n\nЕсли нужен минимальный security-focused runtime:\n\n```dockerfile\nFROM gcr.io/distroless/python3-debian12\n```\n\nГлавная идея:\n\n```text\nчем ближе образ к production-окружению,\nтем меньше риск, что локально всё работает, а в deploy ломается\n```\n\n### 8. Нужно смотреть на безопасность\n\nБазовый образ приносит в контейнер свои системные пакеты и уязвимости.\n\nПоэтому перед выбором стоит проверять:\n\n```text\nкак часто образ обновляется\nесть ли known vulnerabilities\nне устарела ли версия ОС\nне используется ли EOL-дистрибутив\nнет ли лишних пакетов\n```\n\nDocker Scout предназначен для анализа состава образов и уязвимостей внутри них. \n\nПример проверки:\n\n```bash\ndocker scout cves python:3.12-slim\n```\n\nили через альтернативы:\n\n```bash\ntrivy image python:3.12-slim\ngrype python:3.12-slim\n```\n\n### 9. Не нужно ставить всё подряд в базовый образ\n\nПлохая практика:\n\n```dockerfile\nFROM ubuntu:24.04\n\nRUN apt-get update && apt-get install -y \\\n    python3 \\\n    python3-pip \\\n    git \\\n    curl \\\n    vim \\\n    nano \\\n    gcc \\\n    make \\\n    build-essential \\\n    postgresql-client \\\n    redis-tools\n```\n\nТак образ становится:\n\n```text\nбольшим\nмедленным\nсложным\nменее безопасным\nтруднее воспроизводимым\n```\n\nЛучше брать готовый runtime-образ:\n\n```dockerfile\nFROM python:3.12-slim\n```\n\nИ ставить только реально нужное:\n\n```dockerfile\nRUN apt-get update && apt-get install -y --no-install-recommends \\\n    libpq5 \\\n    && rm -rf /var/lib/apt/lists/*\n```\n\n### 10. Для разработки и production могут быть разные образы\n\nДля dev можно иметь больше инструментов:\n\n```text\ndebug tools\nwatch reload\ntest dependencies\nlinters\nshell utilities\n```\n\nДля production — минимум:\n\n```text\nruntime\nприложение\nproduction dependencies\n```\n\nПример:\n\n```text\nDockerfile        → production\nDockerfile.dev    → development\n```\n\nИли один Dockerfile с разными stages:\n\n```dockerfile\nFROM python:3.12-slim AS base\n\nFROM base AS dev\nRUN pip install pytest ruff\n\nFROM base AS prod\nCOPY . .\nCMD [\"gunicorn\", \"app.main:app\"]\n```\n\n### 11. Практический выбор для Python backend\n\nДля FastAPI/Django обычно хороший выбор:\n\n```dockerfile\nFROM python:3.12-slim\n```\n\nПочему:\n\n```text\nофициальный Python image\nфиксированная версия Python\nменьше полного python:3.12\nобычно меньше проблем, чем с alpine\nподходит для PostgreSQL/Redis/backend-проектов\n```\n\nДля локальной разработки:\n\n```dockerfile\nFROM python:3.12-slim\n```\n\nДля production:\n\n```dockerfile\nFROM python:3.12-slim\n```\n\nили multi-stage:\n\n```dockerfile\nFROM python:3.12-slim AS builder\n...\nFROM python:3.12-slim AS runtime\n...\n```\n\n### Сравнение вариантов\n\n```text\nОбраз                  Когда использовать\n------------------------------------------------------------\npython:3.12            Когда нужен полный образ, проще debug\npython:3.12-slim       Хороший default для production Python\npython:3.12-alpine     Когда важен минимальный размер и нет проблем с musl\ndebian:bookworm-slim   Когда runtime собираешь сам\nubuntu:24.04           Когда нужна Ubuntu-совместимость\nscratch                Только для статически собранных бинарников\ndistroless             Для минимального production runtime\n```\n\n### Итоговый алгоритм выбора\n\n```text\n1. Определить runtime\n   Python, Node.js, Java, Go, бинарник\n\n2. Выбрать official image\n   python, node, debian, alpine, nginx и т.д.\n\n3. Зафиксировать версию\n   не latest, а конкретный tag\n\n4. Выбрать размер\n   full, slim, alpine, distroless\n\n5. Проверить совместимость зависимостей\n   особенно native packages\n\n6. Проверить безопасность\n   vulnerabilities, обновления, EOL\n\n7. Убрать build tools из финального образа\n   multi-stage build\n\n8. Сделать образ воспроизводимым\n   фиксированные версии, lock-файлы, минимальные зависимости\n```\n\n### Коротко\n\n```text\nБазовый образ выбирают исходя из runtime приложения, совместимости зависимостей, размера, безопасности и близости к production-окружению. Обычно лучше брать официальный образ с фиксированной версией, например python:3.12-slim, а не latest. Для production желательно использовать минимальный образ, не тащить лишние build-зависимости и при необходимости применять multi-stage build.\n```\n\nГлавная мысль:\n\n```text\nлучший базовый образ — не самый маленький,\nа самый минимальный из тех, которые стабильно и безопасно запускают приложение\n```"
  popularity = 2.63

[[questions]]
  id = 8
  question = "Какими способами передаются параметры в контейнер при запуске?"
  answer = "Параметры в контейнер при запуске передаются несколькими основными способами:\n\n```text\n1. Environment variables\n2. Аргументы команды CMD/ENTRYPOINT\n3. Файлы конфигурации через volume\n4. .env / env_file\n5. Docker Compose параметры\n6. Docker secrets / configs\n7. Build args — только на этапе сборки, не запуска\n```\n\nГлавное различие:\n\n```text\nENV / environment → параметры окружения внутри контейнера\nCMD arguments     → аргументы запускаемого процесса\nvolume config     → конфиги как файлы\nports/volumes     → параметры самого контейнера\nARG               → параметры сборки образа\n```\n\n### 1. Через переменные окружения\n\nСамый частый способ — передать переменные окружения через `-e` или `--env`.\n\n```bash\ndocker run -e DEBUG=true -e DB_HOST=postgres my_app\n```\n\nВнутри контейнера приложение сможет прочитать:\n\n```python\nimport os\n\ndebug = os.getenv(\"DEBUG\")\ndb_host = os.getenv(\"DB_HOST\")\n```\n\nDocker CLI официально поддерживает флаги `-e, --env` для установки environment variables и `--env-file` для чтения переменных из файла. \n\nПример для backend-приложения:\n\n```bash\ndocker run \\\n  -e POSTGRES_HOST=postgres \\\n  -e POSTGRES_PORT=5432 \\\n  -e POSTGRES_DB=main_db \\\n  -e POSTGRES_USER=admin \\\n  -e POSTGRES_PASSWORD=secret \\\n  my_app\n```\n\n### 2. Через `.env` / `--env-file`\n\nЕсли переменных много, их обычно выносят в файл:\n\n```env\nDEBUG=true\nPOSTGRES_HOST=postgres\nPOSTGRES_PORT=5432\nPOSTGRES_DB=main_db\nPOSTGRES_USER=admin\nPOSTGRES_PASSWORD=secret\n```\n\nЗапуск:\n\n```bash\ndocker run --env-file .env my_app\n```\n\nЭто удобнее, чем писать много `-e` вручную.\n\nНо важно: `.env` не должен попадать в публичный репозиторий, если там есть пароли, токены или секретные ключи.\n\n### 3. Через аргументы команды после имени образа\n\nМожно передать аргументы команде, которая запускается внутри контейнера.\n\nПример:\n\n```bash\ndocker run python:3.12 python script.py --debug --limit=100\n```\n\nЗдесь:\n\n```text\npython:3.12                 → образ\npython script.py --debug... → команда внутри контейнера\n```\n\nDocker позволяет переопределять default command and options при запуске контейнера.\n\nНапример, если в образе прописано:\n\n```dockerfile\nCMD [\"python\", \"app.py\"]\n```\n\nто можно переопределить запуск:\n\n```bash\ndocker run my_app python app.py --debug\n```\n\n### 4. Через `CMD` и `ENTRYPOINT`\n\nВ Dockerfile можно заранее задать команду запуска:\n\n```dockerfile\nENTRYPOINT [\"python\", \"app.py\"]\nCMD [\"--host\", \"0.0.0.0\", \"--port\", \"8000\"]\n```\n\nТогда при запуске:\n\n```bash\ndocker run my_app\n```\n\nбудет выполнено примерно:\n\n```bash\npython app.py --host 0.0.0.0 --port 8000\n```\n\nА если передать аргументы:\n\n```bash\ndocker run my_app --port 9000\n```\n\nони могут заменить или дополнить `CMD`, в зависимости от того, как настроены `ENTRYPOINT` и `CMD`.\n\nDockerfile reference описывает `CMD`, `ENTRYPOINT`, `ARG` и другие инструкции Dockerfile. \n\n### 5. Через `--entrypoint`\n\nМожно полностью заменить entrypoint контейнера.\n\nНапример, вместо запуска приложения открыть shell:\n\n```bash\ndocker run --entrypoint /bin/bash -it my_app\n```\n\nИли запустить другую команду:\n\n```bash\ndocker run --entrypoint python my_app --version\n```\n\nDocker CLI поддерживает `--entrypoint` как способ переопределить default ENTRYPOINT образа. \n\n### 6. Через Docker Compose `environment`\n\nВ `docker-compose.yml` параметры часто передают так:\n\n```yaml\nservices:\n  app:\n    image: my_app\n    environment:\n      DEBUG: \"true\"\n      POSTGRES_HOST: postgres\n      POSTGRES_PORT: \"5432\"\n      POSTGRES_DB: main_db\n      POSTGRES_USER: admin\n      POSTGRES_PASSWORD: secret\n```\n\nDocker Compose services reference показывает настройку сервисов, портов и environment variables в `compose.yaml`. \n\n### 7. Через Docker Compose `env_file`\n\nМожно подключить файл с переменными:\n\n```yaml\nservices:\n  app:\n    image: my_app\n    env_file:\n      - .env\n```\n\nФайл `.env`:\n\n```env\nDEBUG=true\nPOSTGRES_HOST=postgres\nPOSTGRES_PORT=5432\nPOSTGRES_DB=main_db\n```\n\nDocker Compose поддерживает `env_file`, в том числе несколько `.env`-файлов для одного приложения. \n\n### 8. Через `command` в Docker Compose\n\nМожно передать команду запуска контейнера через `command`.\n\n```yaml\nservices:\n  app:\n    image: my_app\n    command: python app.py --debug --port 8000\n```\n\nИли в exec-форме:\n\n```yaml\nservices:\n  app:\n    image: my_app\n    command: [\"python\", \"app.py\", \"--debug\", \"--port\", \"8000\"]\n```\n\nЭто аналог передачи аргументов после имени образа в `docker run`.\n\n### 9. Через `entrypoint` в Docker Compose\n\nМожно переопределить entrypoint:\n\n```yaml\nservices:\n  app:\n    image: my_app\n    entrypoint: [\"python\", \"manage.py\"]\n    command: [\"runserver\", \"0.0.0.0:8000\"]\n```\n\nИтоговая команда будет примерно:\n\n```bash\npython manage.py runserver 0.0.0.0:8000\n```\n\n### 10. Через volume с конфигурационным файлом\n\nИногда параметры лучше передавать не env-переменными, а файлом конфигурации.\n\nНапример:\n\n```bash\ndocker run \\\n  -v ./config.yml:/app/config.yml \\\n  my_app\n```\n\nВнутри контейнера приложение читает:\n\n```text\n/app/config.yml\n```\n\nПример `config.yml`:\n\n```yaml\ndatabase:\n  host: postgres\n  port: 5432\n  name: main_db\n\napp:\n  debug: true\n  workers: 4\n```\n\nТакой способ удобен для:\n\n```text\nбольших конфигов\nnginx.conf\nprometheus.yml\nredis.conf\nнастроек приложения\nсертификатов\n```\n\n### 11. Через Docker secrets\n\nДля чувствительных данных лучше использовать secrets, особенно в Docker Swarm/Kubernetes-подобных окружениях.\n\nИдея:\n\n```text\nпароль не передаётся как обычный ENV\nсекрет монтируется внутрь контейнера как файл\nприложение читает секрет из файла\n```\n\nПримерно:\n\n```text\n/run/secrets/db_password\n```\n\nПочему это лучше, чем ENV:\n\n```text\nenv-переменные легче случайно вывести в лог\nих можно увидеть через inspect\nсекреты лучше отделены от обычной конфигурации\n```\n\nДля локальной разработки часто используют `.env`, но для production секреты лучше хранить в отдельном secret manager.\n\n### 12. Через build arguments `ARG`\n\n`ARG` — это параметры не запуска контейнера, а сборки образа.\n\nПример:\n\n```dockerfile\nARG APP_VERSION\nENV APP_VERSION=${APP_VERSION}\n```\n\nСборка:\n\n```bash\ndocker build --build-arg APP_VERSION=1.2.3 -t my_app .\n```\n\nDocker документация отдельно различает build arguments `ARG` и environment variables `ENV`: оба могут параметризовать сборку, но `ARG` относится именно к build-time. \n\nВажно:\n\n```text\nARG доступен во время docker build\nENV доступен внутри запущенного контейнера\n```\n\n### 13. Через параметры самого контейнера\n\nНе все параметры передаются приложению напрямую. Некоторые настраивают контейнер как среду запуска.\n\nНапример:\n\n```bash\ndocker run \\\n  -p 8000:8000 \\\n  -v ./data:/app/data \\\n  --name my_app \\\n  --restart unless-stopped \\\n  --memory 512m \\\n  my_app\n```\n\nЗдесь:\n\n```text\n-p       → проброс портов\n-v       → volume\n--name   → имя контейнера\n--restart → политика рестарта\n--memory → ограничение памяти\n```\n\nЭто параметры контейнера, а не аргументы приложения.\n\n### Главное различие\n\n```text\nСпособ                 Для чего используется\n------------------------------------------------------------\n-e / --env             Передать переменную окружения\n--env-file             Передать много env-переменных из файла\ncommand args           Передать аргументы запускаемому процессу\n--entrypoint           Заменить ENTRYPOINT образа\nvolume                 Передать конфигурацию как файл\ncompose environment    Env-переменные в Docker Compose\ncompose env_file       Env-файл в Docker Compose\ncompose command        Команда запуска в Docker Compose\nARG / --build-arg      Параметры сборки образа\nports/volumes/options  Настройки контейнера\nsecrets                Безопасная передача секретов\n```\n\n### Пример для FastAPI\n\n`Dockerfile`:\n\n```dockerfile\nFROM python:3.12-slim\n\nWORKDIR /app\n\nCOPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\n\nCOPY . .\n\nENTRYPOINT [\"uvicorn\", \"main:app\"]\nCMD [\"--host\", \"0.0.0.0\", \"--port\", \"8000\"]\n```\n\nЗапуск с env:\n\n```bash\ndocker run \\\n  -e DATABASE_URL=postgresql://user:pass@postgres:5432/app \\\n  -e REDIS_HOST=redis \\\n  -p 8000:8000 \\\n  my_fastapi_app\n```\n\nПереопределить порт приложения:\n\n```bash\ndocker run my_fastapi_app --host 0.0.0.0 --port 9000\n```\n\nЧерез Compose:\n\n```yaml\nservices:\n  app:\n    build: .\n    ports:\n      - \"8000:8000\"\n    environment:\n      DATABASE_URL: postgresql://user:pass@postgres:5432/app\n      REDIS_HOST: redis\n    command: [\"--host\", \"0.0.0.0\", \"--port\", \"8000\"]\n\n  postgres:\n    image: postgres:16\n    environment:\n      POSTGRES_DB: app\n      POSTGRES_USER: user\n      POSTGRES_PASSWORD: pass\n\n  redis:\n    image: redis:7\n```\n\n### Коротко\n\n```text\nПараметры в контейнер можно передавать через переменные окружения `-e/--env`, через файл `--env-file`, через аргументы команды после имени образа, через переопределение `CMD` или `ENTRYPOINT`, через Docker Compose `environment`, `env_file`, `command`, `entrypoint`, а также через volume с конфигурационным файлом. Для build-time параметров используется `ARG` и `--build-arg`, но это относится к сборке образа, а не к запуску контейнера.\n```\n\nГлавное:\n\n```text\nENV — для конфигурации приложения.\nCMD/command — для аргументов запуска.\nVolume — для конфигов и файлов.\nARG — для сборки образа.\nSecrets — для чувствительных данных.\n```"
  popularity = 2.63

[[questions]]
  id = 9
  question = "Как в контейнерной среде организуют хранение данных вне контейнера?"
  answer = "Данные, которые должны переживать удаление или пересоздание контейнера, выносят за пределы контейнера.\n\nОсновные способы:\n\n```text\n1. Docker volumes\n2. Bind mounts\n3. tmpfs mounts\n4. Внешнее хранилище: S3/MinIO/NFS/сетевые диски\n5. Отдельная внешняя БД вместо БД внутри контейнера\n```\n\nГлавная идея:\n\n```text\nконтейнер можно удалить и пересоздать,\nно данные должны остаться\n```\n\nDocker прямо разделяет варианты хранения данных: volumes, bind mounts и tmpfs mounts. Volumes и bind mounts позволяют хранить данные вне lifecycle контейнера. \n\n### Почему нельзя хранить важные данные только внутри контейнера\n\nУ контейнера есть свой writable layer. Если приложение пишет файл внутрь контейнера, эти данные живут вместе с конкретным контейнером.\n\nНапример:\n\n```text\n/app/uploads/avatar.png\n/var/lib/postgresql/data\n/app/logs/app.log\n```\n\nЕсли контейнер удалить:\n\n```bash\ndocker rm app\n```\n\nданные из его writable layer можно потерять.\n\nПоэтому для stateful-данных используют внешнее хранение:\n\n```text\nБД-данные       → volume\nпользовательские файлы → volume / object storage\nконфиги         → bind mount / config\nлоги            → stdout/stderr или внешний лог-сборщик\n```\n\n### 1. Docker volume\n\nDocker volume — основной способ хранить persistent data.\n\nVolume создаётся и управляется Docker отдельно от контейнера. Docker docs указывают, что volume можно создавать и управлять им вне конкретного контейнера. \n\nСоздание volume:\n\n```bash\ndocker volume create postgres_data\n```\n\nЗапуск PostgreSQL с volume:\n\n```bash\ndocker run \\\n  --name postgres \\\n  -e POSTGRES_PASSWORD=secret \\\n  -v postgres_data:/var/lib/postgresql/data \\\n  postgres:16\n```\n\nСхема:\n\n```text\npostgres_data volume\n↓ mounted to\n/var/lib/postgresql/data внутри контейнера\n```\n\nТеперь контейнер можно удалить:\n\n```bash\ndocker rm -f postgres\n```\n\nи потом создать заново с тем же volume:\n\n```bash\ndocker run \\\n  --name postgres \\\n  -e POSTGRES_PASSWORD=secret \\\n  -v postgres_data:/var/lib/postgresql/data \\\n  postgres:16\n```\n\nДанные останутся.\n\nDocker в отдельном guide показывает такой же принцип на PostgreSQL: данные Postgres пишутся в `/var/lib/postgresql`, а подключённый volume позволяет перезапускать контейнер с сохранением данных. \n\n### 2. Named volume в Docker Compose\n\nВ `docker-compose.yml` обычно делают так:\n\n```yaml\nservices:\n  postgres:\n    image: postgres:16\n    environment:\n      POSTGRES_DB: app\n      POSTGRES_USER: user\n      POSTGRES_PASSWORD: pass\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n\nvolumes:\n  postgres_data:\n```\n\nЗдесь:\n\n```text\npostgres_data → named volume\n/var/lib/postgresql/data → путь внутри контейнера\n```\n\nЭто хороший вариант для БД в локальной разработке.\n\n### 3. Bind mount\n\nBind mount — это когда конкретная папка с хоста подключается внутрь контейнера.\n\nПример:\n\n```bash\ndocker run \\\n  -v ./uploads:/app/uploads \\\n  my_app\n```\n\nСхема:\n\n```text\n./uploads на хосте\n↓\n/app/uploads внутри контейнера\n```\n\nЕсли приложение внутри контейнера запишет файл:\n\n```text\n/app/uploads/avatar.png\n```\n\nна хосте появится:\n\n```text\n./uploads/avatar.png\n```\n\nDocker docs описывает bind mount как прямую связь между путём на хостовой системе и путём внутри контейнера. \n\n### Volume vs bind mount\n\n```text\nКритерий             Volume                         Bind mount\n-----------------------------------------------------------------------\nКто управляет         Docker                         пользователь/ОС хоста\nГде лежит             в Docker storage area          в конкретной папке хоста\nУдобно для            БД, persistent data            исходный код, конфиги, uploads\nПереносимость         выше                           зависит от путей хоста\nКонтроль пути         меньше                         полный контроль\nProduction            чаще volume                    осторожно, зависит от задачи\nDevelopment           volume или bind                часто bind\n```\n\nДля БД обычно лучше named volume.\n\nДля разработки удобно bind mount:\n\n```yaml\nservices:\n  app:\n    build: .\n    volumes:\n      - ./src:/app/src\n```\n\nТак можно менять код на хосте, а контейнер сразу видит изменения.\n\n### 4. tmpfs mount\n\n`tmpfs` хранит данные в памяти, а не на диске.\n\nПример:\n\n```bash\ndocker run \\\n  --tmpfs /tmp \\\n  my_app\n```\n\nДанные в `/tmp` исчезнут после остановки контейнера.\n\nЭто не persistent storage.\n\nИспользуют для:\n\n```text\nвременных файлов\nкэша\nсекретов на время выполнения\nданных, которые не должны сохраняться на диск\n```\n\nDocker docs отдельно указывает, что `tmpfs` mounts хранят данные только в памяти хоста и не сохраняются на диск. \n\n### 5. Внешняя БД вместо БД в контейнере\n\nВ production часто не хранят основную БД внутри Docker volume на том же сервере, а используют отдельную управляемую БД:\n\n```text\nPostgreSQL managed service\nRDS / Cloud SQL / Azure Database\nотдельный DB-сервер\nкластер PostgreSQL\n```\n\nТогда контейнер приложения stateless:\n\n```text\napp container\n↓\nDATABASE_URL\n↓\nexternal PostgreSQL\n```\n\nПример:\n\n```env\nDATABASE_URL=postgresql://user:pass@db.example.com:5432/app\n```\n\nПлюсы:\n\n```text\nконтейнер приложения можно пересоздавать без риска для данных\nпроще масштабировать app\nбэкапы БД отдельно\nрепликация и мониторинг отдельно\n```\n\n### 6. Object storage для файлов\n\nДля пользовательских файлов часто лучше использовать не локальный volume, а object storage:\n\n```text\nS3\nMinIO\nGoogle Cloud Storage\nAzure Blob Storage\n```\n\nНапример:\n\n```text\nаватары\nзагруженные документы\nизображения\nвидео\nэкспорты\n```\n\nСхема:\n\n```text\ncontainer app\n↓\nS3/MinIO client\n↓\nbucket\n```\n\nЭто лучше, чем хранить uploads внутри контейнера, потому что несколько контейнеров приложения смогут работать с одним общим хранилищем.\n\n### 7. Логи лучше не писать в файл внутри контейнера\n\nВ контейнерной среде обычно приложение пишет логи в:\n\n```text\nstdout\nstderr\n```\n\nА дальше их забирает Docker / Kubernetes / logging agent.\n\nПлохо:\n\n```text\n/app/logs/app.log внутри контейнера\n```\n\nЛучше:\n\n```python\nimport logging\n\nlogging.basicConfig(level=logging.INFO)\nlogging.info(\"Application started\")\n```\n\nПотом смотреть:\n\n```bash\ndocker logs app\n```\n\nДля production:\n\n```text\nstdout/stderr\n↓\nDocker logging driver / Fluent Bit / Vector / Logstash\n↓\nElasticsearch / Loki / Cloud logging\n```\n\n### 8. Конфиги как файлы через mount\n\nКонфигурацию можно передавать не только через env, но и как файл:\n\n```bash\ndocker run \\\n  -v ./nginx.conf:/etc/nginx/nginx.conf:ro \\\n  nginx\n```\n\n`:ro` означает read-only.\n\nДля Compose:\n\n```yaml\nservices:\n  nginx:\n    image: nginx\n    volumes:\n      - ./nginx.conf:/etc/nginx/nginx.conf:ro\n```\n\nТак контейнер получает конфиг извне, но не может его менять.\n\n### 9. Бэкапы volume\n\nЕсли данные лежат в volume, нужно отдельно думать о backup.\n\nНапример, PostgreSQL лучше бэкапить не копированием volume «на горячую», а штатными средствами:\n\n```bash\npg_dump\npg_dumpall\n```\n\nДля файлового volume можно делать архив:\n\n```bash\ndocker run --rm \\\n  -v postgres_data:/data \\\n  -v $(pwd):/backup \\\n  alpine \\\n  tar czf /backup/postgres_data.tar.gz /data\n```\n\nНо для БД безопаснее использовать инструменты самой БД, потому что простое копирование файлов может дать неконсистентное состояние.\n\n### Практический пример для Django/FastAPI + PostgreSQL + MinIO\n\n```yaml\nservices:\n  app:\n    build: .\n    env_file:\n      - .env\n    depends_on:\n      - postgres\n      - minio\n    volumes:\n      - ./app:/app\n\n  postgres:\n    image: postgres:16\n    environment:\n      POSTGRES_DB: app\n      POSTGRES_USER: user\n      POSTGRES_PASSWORD: pass\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n\n  minio:\n    image: minio/minio\n    command: server /data --console-address \":9001\"\n    environment:\n      MINIO_ROOT_USER: admin\n      MINIO_ROOT_PASSWORD: password\n    volumes:\n      - minio_data:/data\n\nvolumes:\n  postgres_data:\n  minio_data:\n```\n\nЗдесь:\n\n```text\napp-контейнер    → можно пересоздать без потери данных\npostgres_data   → хранит данные PostgreSQL\nminio_data      → хранит объекты MinIO\n./app:/app       → bind mount для разработки\n```\n\n### Что выбирать\n\n```text\nЗадача                         Лучший вариант\n------------------------------------------------------------\nДанные PostgreSQL/MySQL         named volume или внешняя БД\nRedis persistence               named volume, если включён AOF/RDB\nПользовательские uploads        S3/MinIO или volume\nКод в dev-режиме                bind mount\nКонфиги                         bind mount read-only / configs\nВременные файлы                 tmpfs\nЛоги                            stdout/stderr + log collector\nСекреты                         Docker secrets / secret manager\n```\n\n### Коротко\n\n```text\nВ контейнерной среде данные выносят за пределы контейнера, потому что сам контейнер считается временным и может быть удалён или пересоздан.\n\nДля хранения используют Docker volumes, bind mounts, tmpfs для временных данных, а в production часто внешние сервисы: отдельную БД, S3/MinIO, сетевые хранилища. Для БД обычно используют named volumes или внешнюю managed database, для конфигов — bind mount/configs, для пользовательских файлов — object storage.\n```\n\nГлавная мысль:\n\n```text\nконтейнер должен быть заменяемым,\nа важные данные должны жить отдельно от него.\n```"
  popularity = 2.63

[[questions]]
  id = 10
  question = "Что такое volume?"
  answer = "### Что такое volume\n\n`Volume` в Docker — это отдельное хранилище данных, которое подключается внутрь контейнера как папка.\n\nГлавная задача volume — сохранить данные вне жизненного цикла контейнера.\n\n```text\nконтейнер удалили  → данные в volume остались\nконтейнер пересоздали → подключили тот же volume → данные снова доступны\n```\n\nDocker описывает volumes как persistent data stores для контейнеров, которые создаются и управляются Docker отдельно от конкретного контейнера. \n\n### Зачем нужен volume\n\nКонтейнер считается временным объектом. Его можно остановить, удалить, пересобрать и создать заново.\n\nНо данные, например:\n\n```text\nданные PostgreSQL\nзагруженные файлы\nлоги\nкэш\nданные MinIO\n```\n\nне должны исчезать вместе с контейнером.\n\nБез volume:\n\n```text\nPostgreSQL пишет данные внутрь контейнера\n↓\nконтейнер удалили\n↓\nданные потерялись\n```\n\nС volume:\n\n```text\nPostgreSQL пишет данные в /var/lib/postgresql/data\n↓\nэтот путь подключён к volume\n↓\nконтейнер удалили\n↓\nvolume остался\n```\n\nDocker прямо указывает, что volumes позволяют сохранять данные за пределами lifecycle отдельного контейнера. \n\n### Как это выглядит\n\nНапример, создаём volume:\n\n```bash\ndocker volume create postgres_data\n```\n\nЗапускаем PostgreSQL и подключаем volume:\n\n```bash\ndocker run \\\n  --name postgres \\\n  -e POSTGRES_PASSWORD=secret \\\n  -v postgres_data:/var/lib/postgresql/data \\\n  postgres:16\n```\n\nЗдесь:\n\n```text\npostgres_data              → volume на стороне Docker\n/var/lib/postgresql/data   → путь внутри контейнера\n```\n\nТо есть PostgreSQL думает, что пишет данные в обычную папку внутри контейнера, но фактически данные сохраняются во внешнем Docker volume.\n\n### Схема\n\n```text\nDocker volume: postgres_data\n        ↓\nмонтируется внутрь контейнера\n        ↓\n/var/lib/postgresql/data\n        ↓\nPostgreSQL пишет туда файлы БД\n```\n\nКонтейнер можно удалить:\n\n```bash\ndocker rm -f postgres\n```\n\nА потом создать новый контейнер с тем же volume:\n\n```bash\ndocker run \\\n  --name postgres \\\n  -e POSTGRES_PASSWORD=secret \\\n  -v postgres_data:/var/lib/postgresql/data \\\n  postgres:16\n```\n\nДанные останутся.\n\n### Volume в Docker Compose\n\nВ `docker-compose.yml` это обычно выглядит так:\n\n```yaml\nservices:\n  postgres:\n    image: postgres:16\n    environment:\n      POSTGRES_DB: app\n      POSTGRES_USER: user\n      POSTGRES_PASSWORD: pass\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n\nvolumes:\n  postgres_data:\n```\n\nЗдесь внизу объявлен named volume:\n\n```yaml\nvolumes:\n  postgres_data:\n```\n\nА внутри сервиса он подключается сюда:\n\n```yaml\n- postgres_data:/var/lib/postgresql/data\n```\n\n### Где физически лежит volume\n\nНа Linux Docker volumes обычно хранятся в Docker-managed area, например:\n\n```text\n/var/lib/docker/volumes/\n```\n\nНо напрямую туда обычно не лезут. Правильнее управлять volume через Docker CLI:\n\n```bash\ndocker volume ls\ndocker volume inspect postgres_data\ndocker volume rm postgres_data\n```\n\nDocker подчёркивает, что volume создаётся и управляется Docker, а не вручную как обычная папка проекта. \n\n### Volume и bind mount — разница\n\nVolume часто путают с bind mount.\n\n### Volume\n\n```bash\ndocker run -v postgres_data:/var/lib/postgresql/data postgres:16\n```\n\n```text\npostgres_data → управляется Docker\n```\n\nИспользуется для:\n\n```text\nданных БД\npersistent storage\nданных сервисов\nproduction-like окружения\n```\n\n### Bind mount\n\n```bash\ndocker run -v ./app:/app my_app\n```\n\n```text\n./app → конкретная папка на хосте\n```\n\nИспользуется для:\n\n```text\nисходного кода в dev-режиме\nконфигов\nлокальных файлов\nбыстрой разработки\n```\n\nDocker описывает bind mount как подключение конкретного host path в container path. \n\nКратко:\n\n```text\nvolume     → Docker сам управляет местом хранения\nbind mount → ты сам указываешь папку на хосте\n```\n\n### Volume не равен папке внутри контейнера\n\nВажно:\n\n```text\nvolume — это не просто директория в контейнере\n```\n\nЭто внешнее хранилище, которое монтируется внутрь контейнера по определённому пути.\n\nНапример:\n\n```text\npostgres_data volume\n```\n\nможет быть подключён как:\n\n```text\n/var/lib/postgresql/data\n```\n\nА для другого контейнера — как:\n\n```text\n/backup/postgres\n```\n\nТо есть volume существует отдельно, а контейнер только получает к нему доступ.\n\n### Можно ли подключить один volume к нескольким контейнерам\n\nДа, один volume можно подключить к нескольким контейнерам.\n\nНапример:\n\n```text\napp container\nworker container\n```\n\nмогут читать общие файлы из одного volume.\n\nНо с БД нужно быть осторожным. Нельзя просто подключить один и тот же PostgreSQL data volume к двум PostgreSQL-контейнерам, которые одновременно пишут в него. Это может повредить данные.\n\nНормальный вариант:\n\n```text\nодин PostgreSQL container → один data volume\nнесколько app containers → подключаются к PostgreSQL по сети\n```\n\n### Когда использовать volume\n\nVolume используют, когда данные должны сохраняться:\n\n```text\nPostgreSQL/MySQL data\nRedis persistence\nMinIO data\nзагруженные пользователем файлы\nданные очередей\nлокальное persistent-хранилище сервиса\n```\n\nПример для MinIO:\n\n```yaml\nservices:\n  minio:\n    image: minio/minio\n    command: server /data --console-address \":9001\"\n    volumes:\n      - minio_data:/data\n\nvolumes:\n  minio_data:\n```\n\n### Когда volume не нужен\n\nVolume обычно не нужен для:\n\n```text\nкода, который уже находится в image\nвременных файлов\nданных, которые можно пересоздать\nлогов, если они идут в stdout/stderr\nсекретов, которые лучше передавать через secrets\n```\n\nДля временных данных можно использовать `tmpfs`, который хранит данные в памяти и не сохраняет их после остановки контейнера. Docker отдельно выделяет `tmpfs mounts` как отдельный тип mount, отличный от volumes и bind mounts. \n\n### Коротко\n\n```text\nVolume — это Docker-managed хранилище данных, которое монтируется внутрь контейнера как директория и позволяет сохранять данные независимо от жизненного цикла контейнера.\n\nКонтейнер можно удалить или пересоздать, а данные в volume останутся. Обычно volume используют для баз данных, файловых хранилищ, Redis persistence, MinIO и других stateful-данных.\n```\n\nГлавная мысль:\n\n```text\nконтейнер временный,\nvolume постоянный.\n```"
  popularity = 2.63

[[questions]]
  id = 11
  question = "Какие основные сущности используются в Docker?"
  answer = "Основные сущности Docker:\n\n```text\nimage       → шаблон для запуска контейнера\ncontainer   → запущенный экземпляр image\nDockerfile  → инструкция для сборки image\nvolume      → постоянное хранилище данных\nnetwork     → сеть для связи контейнеров\nregistry    → хранилище images\ndaemon      → Docker-сервер, который управляет объектами\nclient/CLI  → команда docker, через которую мы управляем Docker\nCompose     → описание multi-container приложения в YAML\n```\n\nDocker в официальном overview прямо перечисляет основные Docker objects: `images`, `containers`, `networks`, `volumes`, `plugins` и другие объекты. \n\n### 1. Image\n\n`Image` — это неизменяемый шаблон, из которого создаётся контейнер.\n\nВ образе обычно находятся:\n\n```text\nоперационная userland-база\nruntime: Python / Node / Java\nбиблиотеки\nзависимости\nкод приложения\nкоманда запуска\n```\n\nПример:\n\n```bash\ndocker pull python:3.12-slim\n```\n\nили:\n\n```bash\ndocker build -t my_app .\n```\n\nОбраз сам по себе не является запущенным приложением. Это как «слепок» окружения.\n\n```text\nimage → используется для создания container\n```\n\nDocker указывает, что `docker run` создаёт контейнер на основе image reference, например `ubuntu:24.04`. \n\n### 2. Container\n\n`Container` — это запущенный экземпляр образа.\n\nЕсли `image` — это шаблон, то `container` — это уже работающий процесс или группа процессов.\n\n```text\nimage: python:3.12-slim\n↓\ncontainer: запущенное Python-приложение\n```\n\nПример:\n\n```bash\ndocker run python:3.12-slim python --version\n```\n\nИли для приложения:\n\n```bash\ndocker run -p 8000:8000 my_app\n```\n\nКонтейнер можно:\n\n```bash\ndocker start app\ndocker stop app\ndocker restart app\ndocker rm app\n```\n\nВажно:\n\n```text\nконтейнер можно удалить,\nно image при этом останется\n```\n\n### 3. Dockerfile\n\n`Dockerfile` — это текстовый файл с инструкциями для сборки образа.\n\nПример:\n\n```dockerfile\nFROM python:3.12-slim\n\nWORKDIR /app\n\nCOPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\n\nCOPY . .\n\nCMD [\"python\", \"main.py\"]\n```\n\nDocker описывает Dockerfile как text-based document, который используется для создания container image и содержит инструкции: какие команды выполнить, какие файлы скопировать и какую команду запуска задать. \n\nСхема:\n\n```text\nDockerfile\n↓ docker build\nimage\n↓ docker run\ncontainer\n```\n\n### 4. Layer\n\n`Layer` — это слой образа.\n\nКаждая инструкция в Dockerfile может создавать новый слой:\n\n```dockerfile\nFROM python:3.12-slim     # слой\nWORKDIR /app              # слой\nCOPY requirements.txt .   # слой\nRUN pip install ...       # слой\nCOPY . .                  # слой\n```\n\nDocker использует слои для кэширования и экономии места.\n\nНапример, если `requirements.txt` не изменился, Docker может переиспользовать слой с установленными зависимостями.\n\n```text\nimage = набор read-only layers\ncontainer = image layers + writable layer\n```\n\nDocker storage driver хранит image layers и writable layer контейнера; writable layer подходит для временных runtime-данных, но не сохраняется после удаления контейнера. \n\n### 5. Volume\n\n`Volume` — это постоянное хранилище данных, управляемое Docker.\n\nИспользуется, чтобы данные не исчезали при удалении контейнера.\n\nПример:\n\n```bash\ndocker volume create postgres_data\n```\n\nЗапуск PostgreSQL с volume:\n\n```bash\ndocker run \\\n  -e POSTGRES_PASSWORD=secret \\\n  -v postgres_data:/var/lib/postgresql/data \\\n  postgres:16\n```\n\nЗдесь:\n\n```text\npostgres_data             → Docker volume\n/var/lib/postgresql/data  → путь внутри контейнера\n```\n\nVolumes — это persistent data stores для контейнеров, которые создаются и управляются Docker. \n\n### 6. Network\n\n`Network` — это Docker-сеть, через которую контейнеры общаются друг с другом и с внешним миром.\n\nПример:\n\n```bash\ndocker network create app_network\n```\n\nЗапуск контейнера в сети:\n\n```bash\ndocker run --network app_network --name redis redis:7\ndocker run --network app_network --name app my_app\n```\n\nТеперь контейнер `app` может обращаться к Redis по имени:\n\n```text\nredis:6379\n```\n\nDocker networking отвечает за возможность контейнеров подключаться и общаться друг с другом, а также с внешними non-Docker сервисами. \n\n### 7. Registry\n\n`Registry` — это хранилище Docker-образов.\n\nСамый известный registry:\n\n```text\nDocker Hub\n```\n\nПример:\n\n```bash\ndocker pull nginx\ndocker push my_user/my_app:1.0\n```\n\nТо есть:\n\n```text\nregistry хранит images\ndocker pull скачивает image\ndocker push отправляет image\n```\n\nDocker Hub — это публичный registry service, где пользователи могут хранить, публиковать и управлять container images.\n\n### 8. Repository и tag\n\nВнутри registry образы организованы по repositories и tags.\n\nПример:\n\n```text\npython:3.12-slim\n```\n\nЗдесь:\n\n```text\npython     → repository\n3.12-slim  → tag\n```\n\nДругой пример:\n\n```text\npostgres:16\nredis:7\nnginx:1.27\n```\n\nTag обычно обозначает версию или вариант образа.\n\nПлохо для production:\n\n```dockerfile\nFROM python:latest\n```\n\nЛучше:\n\n```dockerfile\nFROM python:3.12-slim\n```\n\nПотому что `latest` может измениться и сломать воспроизводимость сборки.\n\n### 9. Docker daemon\n\n`Docker daemon` — это фоновый процесс Docker Engine, который реально управляет Docker-объектами.\n\nОн создаёт и управляет:\n\n```text\nimages\ncontainers\nnetworks\nvolumes\n```\n\nDocker Engine docs указывают, что daemon создаёт и управляет Docker objects, включая images, containers, networks и volumes.\n\nСхема:\n\n```text\ndocker CLI\n↓\nDocker API\n↓\nDocker daemon\n↓\ncontainers/images/networks/volumes\n```\n\n### 10. Docker CLI / Client\n\n`Docker CLI` — это команда `docker`, которую запускает пользователь.\n\nПримеры:\n\n```bash\ndocker build -t my_app .\ndocker run my_app\ndocker ps\ndocker logs app\ndocker exec -it app bash\ndocker stop app\n```\n\nCLI сам не запускает контейнеры напрямую. Он отправляет команды Docker daemon через Docker API.\n\n```text\nты пишешь docker run\n↓\nCLI отправляет запрос daemon\n↓\ndaemon создаёт контейнер\n```\n\n### 11. Docker Compose\n\n`Docker Compose` — это инструмент для описания и запуска multi-container приложения через YAML-файл.\n\nПример:\n\n```yaml\nservices:\n  app:\n    build: .\n    ports:\n      - \"8000:8000\"\n    depends_on:\n      - postgres\n      - redis\n\n  postgres:\n    image: postgres:16\n    environment:\n      POSTGRES_PASSWORD: secret\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n\n  redis:\n    image: redis:7\n\nvolumes:\n  postgres_data:\n```\n\nЗапуск:\n\n```bash\ndocker compose up -d\n```\n\nCompose позволяет управлять всем application stack: services, networks и volumes в одном YAML-файле. \n\n### 12. Service в Docker Compose\n\n`Service` в Compose — это описание одного компонента приложения.\n\nНапример:\n\n```yaml\nservices:\n  app:\n    build: .\n\n  postgres:\n    image: postgres:16\n\n  redis:\n    image: redis:7\n```\n\nЗдесь три сервиса:\n\n```text\napp\npostgres\nredis\n```\n\nКаждый service обычно создаёт один или несколько контейнеров.\n\n```text\nservice → описание\ncontainer → конкретный запущенный экземпляр service\n```\n\nCompose file используется для настройки services, networks, volumes и других частей Docker-приложения. \n\n### Общая схема Docker\n\n```text\nDockerfile\n↓ docker build\nImage\n↓ docker run\nContainer\n```\n\nДополнительно:\n\n```text\nVolume  → хранит данные контейнера\nNetwork → связывает контейнеры\nRegistry → хранит images\nDaemon  → управляет Docker-объектами\nCLI     → отправляет команды daemon\nCompose → описывает несколько контейнеров в YAML\n```\n\n### Пример на backend-проекте\n\nДля проекта:\n\n```text\nFastAPI / Django\nPostgreSQL\nRedis\n```\n\nDocker-сущности будут такими:\n\n```text\nDockerfile\n→ описывает сборку app image\n\nimage my_app\n→ образ приложения\n\ncontainer app\n→ запущенное приложение\n\nimage postgres:16\n→ образ PostgreSQL\n\ncontainer postgres\n→ запущенная БД\n\nvolume postgres_data\n→ хранит данные PostgreSQL\n\nnetwork backend_network\n→ сеть между app, postgres и redis\n\ncompose.yml\n→ описывает все сервисы проекта\n```\n\n### Коротко\n\n```text\nОсновные сущности Docker — это image, container, Dockerfile, volume, network, registry, Docker daemon, Docker CLI и Docker Compose.\n\nImage — шаблон для запуска контейнера.\nContainer — запущенный экземпляр image.\nDockerfile — инструкция для сборки image.\nVolume — постоянное хранилище данных.\nNetwork — сеть для связи контейнеров.\nRegistry — хранилище образов.\nDaemon — процесс, который управляет Docker-объектами.\nCLI — клиент для отправки команд Docker daemon.\nCompose — инструмент для описания multi-container приложения.\n```\n\nГлавная цепочка:\n\n```text\nDockerfile → image → container\n```\n\nА вокруг неё:\n\n```text\nvolume → данные\nnetwork → связь\nregistry → хранение образов\ncompose → управление несколькими сервисами\n```"
  popularity = 2.63

[[questions]]
  id = 12
  question = "Как подключиться к запущенному Docker-контейнеру через терминал? (docker excec ...)"
  answer = "### Команда\n\nЧтобы подключиться к уже запущенному контейнеру через терминал, используется:\n\n```bash\ndocker exec -it <container_name_or_id> bash\n```\n\nНапример:\n\n```bash\ndocker exec -it my_app bash\n```\n\n`docker exec` запускает новую команду внутри уже работающего контейнера. В официальной документации Docker указано, что `docker exec` выполняет команду в running container. \n\n### Если `bash` нет\n\nВ минимальных образах `bash` может отсутствовать. Тогда используют `sh`:\n\n```bash\ndocker exec -it <container_name_or_id> sh\n```\n\nНапример:\n\n```bash\ndocker exec -it redis sh\n```\n\nДля Alpine-образов чаще всего:\n\n```bash\ndocker exec -it <container_name_or_id> /bin/sh\n```\n\n### Как узнать имя контейнера\n\nСначала посмотреть запущенные контейнеры:\n\n```bash\ndocker ps\n```\n\nПример вывода:\n\n```text\nCONTAINER ID   IMAGE        NAMES\na1b2c3d4e5f6   postgres:16  postgres\nf7g8h9i0j1k2   my_app       app\n```\n\nПосле этого можно подключиться по имени:\n\n```bash\ndocker exec -it app bash\n```\n\nили по `CONTAINER ID`:\n\n```bash\ndocker exec -it a1b2c3d4e5f6 bash\n```\n\n### Что означают флаги `-it`\n\n```text\n-i → interactive, оставить stdin открытым\n-t → выделить pseudo-TTY, чтобы терминал работал нормально\n```\n\nОбычно для входа в контейнер используют их вместе:\n\n```bash\ndocker exec -it app bash\n```\n\n### Через Docker Compose\n\nЕсли контейнер запущен через Compose, можно использовать:\n\n```bash\ndocker compose exec <service_name> bash\n```\n\nНапример:\n\n```bash\ndocker compose exec app bash\n```\n\nили:\n\n```bash\ndocker compose exec postgres bash\n```\n\nВ Docker Compose `exec` по умолчанию запускается в интерактивном режиме и выделяет TTY, тогда как для обычного `docker exec` нужно явно указывать `-it`. \n\n### Отличие от `docker attach`\n\n`docker exec` создаёт новый процесс внутри контейнера:\n\n```bash\ndocker exec -it app bash\n```\n\nА `docker attach` подключает терминал к уже запущенному основному процессу контейнера. Docker описывает `attach` как подключение stdin/stdout/stderr терминала к running container. \n\nДля обычного входа внутрь контейнера почти всегда лучше использовать:\n\n```bash\ndocker exec -it <container> bash\n```\n\n### Коротко\n\n```bash\ndocker ps\ndocker exec -it <container_name_or_id> bash\n```\n\nЕсли `bash` нет:\n\n```bash\ndocker exec -it <container_name_or_id> sh\n```\n\nДля Compose:\n\n```bash\ndocker compose exec <service_name> bash\n```"
  popularity = 5.26

[[questions]]
  id = 13
  question = "Способы оптимизации Docker-образов и повышения эффективности их использования?"
  answer = "Оптимизация Docker-образов обычно решает 4 задачи:\n\n```text\n1. Уменьшить размер image\n2. Ускорить docker build\n3. Ускорить pull/push/deploy\n4. Уменьшить количество уязвимостей и лишних зависимостей\n```\n\nГлавная идея:\n\n```text\nв финальном образе должно быть только то,\nчто реально нужно приложению для запуска\n```\n\nDocker в best practices отдельно рекомендует использовать multi-stage builds, держать build context небольшим и эффективно использовать cache. \n\n### 1. Использовать минимальный базовый образ\n\nПлохо:\n\n```dockerfile\nFROM ubuntu:latest\n```\n\nДля Python backend чаще лучше:\n\n```dockerfile\nFROM python:3.12-slim\n```\n\nПочему:\n\n```text\nменьше размер\nменьше лишних пакетов\nменьше attack surface\nбыстрее скачивание образа\n```\n\nНо минимальный образ не должен ломать зависимости. Например, `alpine` маленький, но из-за `musl libc` может создавать проблемы с Python-пакетами с нативными расширениями: `cryptography`, `psycopg2`, `numpy`, `pillow`, `lxml`.\n\nПрактический default для Python backend:\n\n```dockerfile\nFROM python:3.12-slim\n```\n\n### 2. Не использовать `latest`\n\nПлохо:\n\n```dockerfile\nFROM python:latest\n```\n\nЛучше:\n\n```dockerfile\nFROM python:3.12-slim\n```\n\n`latest` может измениться, и сборка неожиданно начнёт использовать другую версию runtime.\n\nДля максимальной воспроизводимости можно фиксировать digest:\n\n```dockerfile\nFROM python:3.12-slim@sha256:<digest>\n```\n\nНо в обычной практике чаще фиксируют конкретный tag.\n\n### 3. Использовать multi-stage build\n\nMulti-stage build позволяет собирать зависимости в одном образе, а в финальный образ копировать только результат. Docker прямо указывает, что multi-stage builds помогают уменьшить размер финального image и отделить build-окружение от runtime-окружения. \n\nПлохой вариант:\n\n```dockerfile\nFROM python:3.12-slim\n\nRUN apt-get update && apt-get install -y gcc build-essential\n\nCOPY requirements.txt .\nRUN pip install -r requirements.txt\n\nCOPY . .\nCMD [\"python\", \"main.py\"]\n```\n\nПроблема: `gcc`, `build-essential` и build-зависимости остаются в production-образе.\n\nЛучше:\n\n```dockerfile\nFROM python:3.12-slim AS builder\n\nWORKDIR /app\n\nRUN apt-get update && apt-get install -y --no-install-recommends \\\n    gcc \\\n    libpq-dev \\\n    && rm -rf /var/lib/apt/lists/*\n\nCOPY requirements.txt .\nRUN pip wheel --no-cache-dir --wheel-dir /wheels -r requirements.txt\n\n\nFROM python:3.12-slim AS runtime\n\nWORKDIR /app\n\nRUN apt-get update && apt-get install -y --no-install-recommends \\\n    libpq5 \\\n    && rm -rf /var/lib/apt/lists/*\n\nCOPY --from=builder /wheels /wheels\nRUN pip install --no-cache-dir /wheels/* && rm -rf /wheels\n\nCOPY . .\n\nCMD [\"python\", \"main.py\"]\n```\n\nСмысл:\n\n```text\nbuilder → содержит инструменты сборки\nruntime → содержит только runtime-зависимости и приложение\n```\n\n### 4. Использовать `.dockerignore`\n\nBuild context — это файлы, которые Docker отправляет на сборку. Чем больше context, тем медленнее сборка и хуже cache. Docker отдельно описывает `.dockerignore` как способ исключать файлы из build context. \n\nПример `.dockerignore`:\n\n```dockerignore\n.git\n__pycache__\n*.pyc\n.pytest_cache\n.mypy_cache\n.ruff_cache\n.coverage\nhtmlcov\n.env\n.venv\nvenv\nnode_modules\ndist\nbuild\n*.log\n```\n\nЧто не надо отправлять в image:\n\n```text\n.git\nлокальное venv\nкэш тестов\nлоги\ncoverage-отчёты\nсекретные .env\nnode_modules, если они не нужны для сборки\n```\n\n### 5. Правильно располагать инструкции для cache\n\nDocker кэширует слои. Поэтому сначала нужно копировать редко изменяющиеся файлы, устанавливать зависимости, и только потом копировать весь код.\n\nПлохо:\n\n```dockerfile\nCOPY . .\nRUN pip install -r requirements.txt\n```\n\nЕсли изменится любой файл проекта, слой `COPY . .` изменится, и зависимости будут устанавливаться заново.\n\nЛучше:\n\n```dockerfile\nCOPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\n\nCOPY . .\n```\n\nТак зависимости переустановятся только при изменении `requirements.txt`.\n\nДля Poetry/uv аналогично:\n\n```dockerfile\nCOPY pyproject.toml poetry.lock .\nRUN poetry install --only main --no-root\n\nCOPY . .\n```\n\nили:\n\n```dockerfile\nCOPY pyproject.toml uv.lock .\nRUN uv sync --frozen --no-dev\n\nCOPY . .\n```\n\n### 6. Не хранить package manager cache в image\n\nДля Python:\n\n```dockerfile\nRUN pip install --no-cache-dir -r requirements.txt\n```\n\nДля apt:\n\n```dockerfile\nRUN apt-get update && apt-get install -y --no-install-recommends \\\n    libpq5 \\\n    && rm -rf /var/lib/apt/lists/*\n```\n\nВажно объединять `apt-get update`, `apt-get install` и очистку cache в одном `RUN`, иначе мусор может остаться в предыдущем слое.\n\nПлохо:\n\n```dockerfile\nRUN apt-get update\nRUN apt-get install -y libpq5\nRUN rm -rf /var/lib/apt/lists/*\n```\n\nЛучше:\n\n```dockerfile\nRUN apt-get update && apt-get install -y --no-install-recommends \\\n    libpq5 \\\n    && rm -rf /var/lib/apt/lists/*\n```\n\n### 7. Использовать `--no-install-recommends`\n\nВ Debian/Ubuntu-based образах `apt` может поставить дополнительные рекомендованные пакеты.\n\nЛучше:\n\n```dockerfile\nRUN apt-get update && apt-get install -y --no-install-recommends \\\n    curl \\\n    libpq5 \\\n    && rm -rf /var/lib/apt/lists/*\n```\n\nЭто уменьшает количество лишних пакетов.\n\n### 8. Использовать BuildKit cache mounts\n\nBuildKit позволяет использовать cache mounts, чтобы ускорять повторные сборки без сохранения мусора в финальном image. Docker указывает cache mounts как один из способов оптимизации build cache. \n\nПример для pip:\n\n```dockerfile\n# syntax=docker/dockerfile:1.7\n\nFROM python:3.12-slim\n\nWORKDIR /app\n\nCOPY requirements.txt .\n\nRUN --mount=type=cache,target=/root/.cache/pip \\\n    pip install -r requirements.txt\n\nCOPY . .\n```\n\nЧто это даёт:\n\n```text\npip cache используется между сборками\nно не попадает в финальный слой image\n```\n\n### 9. Не запускать контейнер от root\n\nЭто больше про безопасность, но влияет на качество production-образа.\n\nПлохо:\n\n```dockerfile\nFROM python:3.12-slim\nCOPY . .\nCMD [\"python\", \"main.py\"]\n```\n\nПо умолчанию процесс может запускаться от root.\n\nЛучше:\n\n```dockerfile\nFROM python:3.12-slim\n\nWORKDIR /app\n\nRUN useradd --create-home --shell /usr/sbin/nologin appuser\n\nCOPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\n\nCOPY . .\n\nUSER appuser\n\nCMD [\"python\", \"main.py\"]\n```\n\nЕсли приложению не нужны root-права, их лучше не давать.\n\n### 10. Не класть секреты в image\n\nПлохо:\n\n```dockerfile\nENV DATABASE_PASSWORD=secret\nCOPY .env .env\n```\n\nПроблема: секреты могут попасть в слои image, registry, CI logs, `docker history`.\n\nЛучше:\n\n```text\nпеременные окружения при запуске\nDocker secrets\nKubernetes Secrets\nVault / cloud secret manager\n```\n\nПример запуска:\n\n```bash\ndocker run --env-file .env my_app\n```\n\nНо `.env` не должен попадать в image и публичный репозиторий.\n\n### 11. Разделять dev и production образы\n\nДля разработки нужны:\n\n```text\npytest\nruff\nwatch reload\ndebug tools\nshell utilities\n```\n\nДля production они обычно не нужны.\n\nМожно сделать stages:\n\n```dockerfile\nFROM python:3.12-slim AS base\n\nWORKDIR /app\n\nCOPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\n\nCOPY . .\n\n\nFROM base AS dev\n\nRUN pip install --no-cache-dir pytest ruff\nCMD [\"uvicorn\", \"main:app\", \"--reload\", \"--host\", \"0.0.0.0\"]\n\n\nFROM base AS prod\n\nCMD [\"gunicorn\", \"main:app\"]\n```\n\nСборка dev:\n\n```bash\ndocker build --target dev -t my_app:dev .\n```\n\nСборка prod:\n\n```bash\ndocker build --target prod -t my_app:prod .\n```\n\n### 12. Использовать внешнюю БД и volume для данных\n\nОбраз не должен содержать runtime-данные:\n\n```text\nданные БД\nзагруженные файлы\nлоги\nкэш\n```\n\nДля этого используют:\n\n```text\nDocker volumes\nbind mounts\nS3/MinIO\nвнешнюю PostgreSQL\nstdout/stderr для логов\n```\n\nПлохой подход:\n\n```text\nкопировать uploads в image\nписать важные данные в writable layer контейнера\n```\n\nПравильнее:\n\n```yaml\nservices:\n  postgres:\n    image: postgres:16\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n\nvolumes:\n  postgres_data:\n```\n\n### 13. Минимизировать количество слоёв, но не фанатично\n\nКаждая инструкция Dockerfile создаёт слой. Но современная оптимизация — это не просто «сделать один огромный RUN».\n\nПлохо:\n\n```dockerfile\nRUN apt-get update\nRUN apt-get install -y curl\nRUN apt-get install -y git\nRUN apt-get install -y gcc\n```\n\nЛучше:\n\n```dockerfile\nRUN apt-get update && apt-get install -y --no-install-recommends \\\n    curl \\\n    git \\\n    gcc \\\n    && rm -rf /var/lib/apt/lists/*\n```\n\nНо не надо превращать весь Dockerfile в одну нечитаемую строку. Важнее:\n\n```text\nправильный cache\nотсутствие мусора\nпонятность Dockerfile\n```\n\n### 14. Проверять image на уязвимости\n\nБазовый образ и системные пакеты могут содержать CVE. Docker Scout умеет анализировать состав images и показывать уязвимости. \n\nПримеры:\n\n```bash\ndocker scout cves my_app:latest\n```\n\nРекомендации по обновлению базового образа:\n\n```bash\ndocker scout recommendations my_app:latest\n```\n\nDocker Scout recommendations показывает рекомендации по обновлению base image, включая потенциальное уменьшение количества уязвимостей или размера image. \n\nТакже часто используют:\n\n```bash\ntrivy image my_app:latest\ngrype my_app:latest\n```\n\n### 15. Использовать external cache в CI/CD\n\nВ CI/CD runner часто запускается в чистом окружении, поэтому локальный Docker cache пропадает.\n\nBuildKit поддерживает external cache backends, чтобы cache можно было экспортировать и импортировать между сборками. Docker указывает, что external cache почти необходим в CI/CD-средах, где нет постоянного локального cache между запусками. \n\nИдея:\n\n```text\nbuild cache сохраняется в registry/GitHub Actions cache\nследующий pipeline использует его\nсборка идёт быстрее\n```\n\n### 16. Использовать multi-platform аккуратно\n\nЕсли образ нужен только под одну архитектуру, не нужно без необходимости собирать всё подряд.\n\nНапример:\n\n```bash\ndocker buildx build --platform linux/amd64 -t my_app .\n```\n\nА если реально нужен multi-arch:\n\n```bash\ndocker buildx build --platform linux/amd64,linux/arm64 -t my_app .\n```\n\nMulti-platform сборка полезна, но может быть медленнее.\n\n### 17. Удалять лишние файлы из финального image\n\nНе должны попадать в production image:\n\n```text\ntests/\ndocs/\n.git/\n.env\ncoverage reports\nlocal configs\nIDE files\ncache\n```\n\nЭто решается через:\n\n```text\n.dockerignore\nCOPY только нужных директорий\nmulti-stage build\n```\n\nНапример:\n\n```dockerfile\nCOPY app ./app\nCOPY pyproject.toml uv.lock ./\n```\n\nлучше, чем бездумно:\n\n```dockerfile\nCOPY . .\n```\n\n### 18. Выбирать правильный способ запуска приложения\n\nДля production не стоит запускать dev-сервер.\n\nПлохо для FastAPI production:\n\n```dockerfile\nCMD [\"uvicorn\", \"main:app\", \"--reload\"]\n```\n\n`--reload` нужен для разработки, но не для production.\n\nЛучше:\n\n```dockerfile\nCMD [\"gunicorn\", \"main:app\", \"-k\", \"uvicorn.workers.UvicornWorker\"]\n```\n\nИли обычный `uvicorn` без reload, если архитектура это допускает:\n\n```dockerfile\nCMD [\"uvicorn\", \"main:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]\n```\n\n### 19. Использовать healthcheck осознанно\n\n`HEALTHCHECK` помогает оркестратору понимать, живо ли приложение.\n\nПример:\n\n```dockerfile\nHEALTHCHECK --interval=30s --timeout=3s --retries=3 \\\n  CMD python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\"\n```\n\nНо healthcheck не должен быть тяжёлым:\n\n```text\nне ходить в тяжёлые отчёты\nне делать дорогие DB-запросы\nне создавать нагрузку на приложение\n```\n\n### 20. Практический пример оптимизированного Dockerfile для Python\n\n```dockerfile\n# syntax=docker/dockerfile:1.7\n\nFROM python:3.12-slim AS builder\n\nWORKDIR /build\n\nRUN apt-get update && apt-get install -y --no-install-recommends \\\n    gcc \\\n    libpq-dev \\\n    && rm -rf /var/lib/apt/lists/*\n\nCOPY requirements.txt .\n\nRUN --mount=type=cache,target=/root/.cache/pip \\\n    pip wheel --wheel-dir /wheels -r requirements.txt\n\n\nFROM python:3.12-slim AS runtime\n\nENV PYTHONDONTWRITEBYTECODE=1\nENV PYTHONUNBUFFERED=1\n\nWORKDIR /app\n\nRUN useradd --create-home --shell /usr/sbin/nologin appuser \\\n    && apt-get update \\\n    && apt-get install -y --no-install-recommends libpq5 \\\n    && rm -rf /var/lib/apt/lists/*\n\nCOPY --from=builder /wheels /wheels\n\nRUN pip install --no-cache-dir /wheels/* \\\n    && rm -rf /wheels\n\nCOPY app ./app\n\nUSER appuser\n\nCMD [\"python\", \"-m\", \"app\"]\n```\n\nЧто здесь оптимизировано:\n\n```text\nslim base image\nmulti-stage build\nbuild tools не попали в runtime\npip cache не попал в image\napt cache очищен\nзависимости кэшируются отдельно от кода\nзапуск не от root\nкопируется только нужная папка app\n```\n\n### Чеклист оптимизации\n\n```text\nБазовый образ:\n[ ] не latest\n[ ] official image\n[ ] slim/minimal, но совместимый\n\nDockerfile:\n[ ] зависимости копируются до кода\n[ ] есть .dockerignore\n[ ] используется multi-stage build\n[ ] build tools не остаются в runtime\n[ ] apt cache очищается в том же RUN\n[ ] pip/npm cache не попадает в image\n\nБезопасность:\n[ ] нет секретов в image\n[ ] процесс не запускается от root\n[ ] image сканируется на CVE\n[ ] базовый образ обновляется\n\nRuntime:\n[ ] данные вынесены в volumes/S3/БД\n[ ] логи идут в stdout/stderr\n[ ] dev-зависимости не попали в prod\n[ ] не используется --reload в production\n```\n\n### Коротко\n\n```text\nDocker-образ оптимизируют за счёт выбора минимального и фиксированного базового образа, использования .dockerignore, правильного порядка слоёв для cache, multi-stage build, удаления build-зависимостей из финального образа, очистки package-manager cache, отказа от latest, запуска не от root, вынесения данных в volumes и регулярного сканирования образов на уязвимости.\n```\n\nГлавная мысль:\n\n```text\nэффективный Docker-образ должен быть маленьким, воспроизводимым, безопасным и содержать только то, что нужно приложению для запуска.\n```"
  popularity = 2.63

[[questions]]
  id = 14
  question = "Использование многоэтапной сборки Docker-образов на базе Alpine."
  answer = "Многоэтапная сборка Docker-образа на Alpine — это подход, при котором образ делится минимум на 2 стадии:\n\n```text\nbuilder stage\n  └─ ставим компиляторы, dev-зависимости, собираем приложение\n\nruntime stage\n  └─ кладём только готовое приложение и runtime-зависимости\n```\n\nВ Docker это делается через несколько `FROM`. Каждый `FROM` начинает отдельную стадию, а в финальный образ можно скопировать только нужные файлы через `COPY --from=...`. Это официально рекомендуемый способ уменьшать размер итогового образа и отделять build-зависимости от runtime-зависимостей. \n\n### Зачем это делают\n\nГлавная цель — не тащить в production-образ лишнее:\n\n```text\ngcc\nmake\nbuild-base\nheaders\ndev-библиотеки\nкэш пакетных менеджеров\nисходники сборки\nтестовые файлы\n```\n\nИтоговый образ становится:\n\n- меньше по размеру;\n    \n- быстрее скачивается и разворачивается;\n    \n- содержит меньше лишних пакетов;\n    \n- имеет меньшую поверхность атаки;\n    \n- ближе к production-окружению.\n    \n\nDocker прямо указывает, что multi-stage builds позволяют оставить в финальном образе только то, что нужно для запуска приложения. \n\n### Пример для Python/FastAPI на Alpine\n\n```dockerfile\n# syntax=docker/dockerfile:1\n\nFROM python:3.12-alpine AS builder\n\nWORKDIR /app\n\nRUN apk add --no-cache \\\n    build-base \\\n    libffi-dev \\\n    openssl-dev\n\nCOPY requirements.txt .\n\nRUN python -m venv /venv \\\n    && /venv/bin/pip install --upgrade pip \\\n    && /venv/bin/pip install --no-cache-dir -r requirements.txt\n\n\nFROM python:3.12-alpine AS runtime\n\nENV PATH=\"/venv/bin:$PATH\" \\\n    PYTHONDONTWRITEBYTECODE=1 \\\n    PYTHONUNBUFFERED=1\n\nWORKDIR /app\n\nRUN addgroup -S app && adduser -S app -G app\n\nCOPY --from=builder /venv /venv\nCOPY . .\n\nUSER app\n\nCMD [\"uvicorn\", \"app.main:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]\n```\n\n### Что здесь происходит\n\n```dockerfile\nFROM python:3.12-alpine AS builder\n```\n\nСоздаётся временный образ для сборки. В нём можно ставить тяжёлые зависимости: компиляторы, headers, dev-библиотеки.\n\n```dockerfile\nRUN apk add --no-cache build-base ...\n```\n\n`apk` — пакетный менеджер Alpine. `--no-cache` нужен, чтобы не сохранять индекс пакетов внутри слоя.\n\n```dockerfile\nRUN python -m venv /venv ...\n```\n\nСоздаётся виртуальное окружение и туда устанавливаются Python-зависимости.\n\n```dockerfile\nFROM python:3.12-alpine AS runtime\n```\n\nНачинается чистый финальный образ.\n\n```dockerfile\nCOPY --from=builder /venv /venv\n```\n\nИз build-стадии копируется только готовое виртуальное окружение, а не весь набор компиляторов и dev-пакетов.\n\n### Почему именно Alpine\n\nAlpine часто используют как минимальную базу для контейнеров. Официальный Alpine-образ доступен как Docker Official Image, а Docker Official Images проходят централизованный процесс публикации и сопровождения. \n\nНо Alpine не всегда лучший выбор.\n\nГлавная особенность Alpine — он использует `musl libc`, а не `glibc`. Это может влиять на совместимость некоторых бинарных зависимостей. Alpine Wiki прямо указывает, что Alpine использует `musl` как стандартную C-библиотеку. \n\nДля Python это особенно важно: часть пакетов с C/C++-расширениями может не иметь готовых колёс под `musl`, из-за чего они будут собираться из исходников. PyPA для этого ввела отдельные `musllinux` platform tags, потому что обычные `manylinux`-колёса ориентированы на glibc-based Linux, а Alpine использует musl. \n\n### Когда Alpine подходит\n\nAlpine хорошо подходит, когда:\n\n```text\nприложение лёгкое;\nзависимости простые;\nнет тяжёлых C/C++ Python-пакетов;\nважен маленький размер образа;\nкоманда понимает особенности musl;\n```\n\nНапример:\n\n```text\nGo-приложение\nпростое Python API\nнебольшой FastAPI-сервис\nутилиты\nsidecar-контейнеры\n```\n\n### Когда Alpine может быть плохим выбором\n\nAlpine может создать проблемы, если в проекте есть:\n\n```text\nnumpy\npandas\nopencv\ncryptography\npsycopg2\nlxml\nPillow\ngrpcio\nдругие пакеты с native extensions\n```\n\nПроблемы могут быть такие:\n\n```text\nдолгая сборка зависимостей;\nошибки компиляции;\nнужны дополнительные apk-пакеты;\nфинальный образ неожиданно становится не таким маленьким;\nотличия поведения из-за musl/glibc;\n```\n\nДля Python-проектов с тяжёлыми зависимостями часто практичнее использовать не Alpine, а Debian-based образ:\n\n```dockerfile\nFROM python:3.12-slim\n```\n\nОн обычно больше, но совместимость с Python-библиотеками часто проще, потому что glibc-based окружение лучше совпадает с большинством Linux wheels.\n\n### Более правильный вариант для Python\n\nДля production лучше не копировать весь проект до установки зависимостей, чтобы Docker мог кэшировать слой с зависимостями:\n\n```dockerfile\nFROM python:3.12-alpine AS builder\n\nWORKDIR /app\n\nRUN apk add --no-cache build-base libffi-dev openssl-dev\n\nCOPY requirements.txt .\n\nRUN python -m venv /venv \\\n    && /venv/bin/pip install --upgrade pip \\\n    && /venv/bin/pip install --no-cache-dir -r requirements.txt\n\n\nFROM python:3.12-alpine AS runtime\n\nENV PATH=\"/venv/bin:$PATH\" \\\n    PYTHONDONTWRITEBYTECODE=1 \\\n    PYTHONUNBUFFERED=1\n\nWORKDIR /app\n\nRUN addgroup -S app && adduser -S app -G app\n\nCOPY --from=builder /venv /venv\n\nCOPY app ./app\n\nUSER app\n\nCMD [\"uvicorn\", \"app.main:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]\n```\n\nСтруктура:\n\n```text\n.\n├── Dockerfile\n├── requirements.txt\n└── app\n    ├── main.py\n    └── ...\n```\n"
  popularity = 2.63

[[questions]]
  id = 15
  question = "Где в Linux-системе обычно хранятся глобальные конфигурационные файлы?"
  answer = "### Где хранятся глобальные конфиги\n\nВ Linux глобальные системные конфигурационные файлы обычно хранятся в каталоге:\n\n```text\n/etc\n```\n\nНапример:\n\n```text\n/etc/passwd\n/etc/group\n/etc/hosts\n/etc/fstab\n/etc/ssh/sshd_config\n/etc/nginx/nginx.conf\n/etc/systemd/system/\n```\n\n### Что означает `/etc`\n\n`/etc` — это каталог для конфигурационных файлов, специфичных для конкретной машины. По FHS, там должны лежать статические конфигурационные файлы, а не исполняемые бинарники. \n\nТо есть `/etc` хранит настройки уровня всей системы:\n\n```text\nнастройки пользователей\nнастройки сети\nнастройки сервисов\nнастройки systemd\nконфиги демонов\nконфиги пакетных сервисов\n```\n\n### Важно отличать\n\nПользовательские конфиги обычно лежат не в `/etc`, а в домашнем каталоге пользователя:\n\n```text\n~/.config/\n~/.bashrc\n~/.ssh/config\n```\n\nА глобальные настройки, действующие для всей системы или всех пользователей, обычно находятся именно в:\n\n```text\n/etc\n```\n\nLinux man-pages также описывает `/etc` как каталог, содержащий конфигурационные файлы, локальные для машины. "
  popularity = 2.63

[[questions]]
  id = 16
  question = "Как посмотреть все контейнеры Docker, включая остановленные? (docker ps -a ...)"
  answer = "### Команда\n\nЧтобы посмотреть все Docker-контейнеры, включая остановленные:\n\n```bash\ndocker ps -a\n```\n\nПолная современная форма той же команды:\n\n```bash\ndocker container ls -a\n```\n\n### Что означает `-a`\n\nФлаг `-a` / `--all` показывает не только запущенные контейнеры, но и остановленные. Без него `docker ps` показывает только running-контейнеры. Это указано в справке Docker CLI для `docker container ls`. \n\n### Пример\n\n```bash\ndocker ps -a\n```\n\nВывод будет примерно такой:\n\n```text\nCONTAINER ID   IMAGE      COMMAND        STATUS                    NAMES\na1b2c3d4e5f6   nginx      \"/docker...\"   Up 10 minutes             web\nb7c8d9e0f1a2   postgres   \"docker...\"    Exited (0) 2 hours ago    db\n```\n\nГде:\n\n```text\nUp ...       контейнер запущен\nExited ...   контейнер остановлен\n```\n\nДля короткого вывода только ID:\n\n```bash\ndocker ps -aq\n```\n\nили:\n\n```bash\ndocker container ls -aq\n```"
  popularity = 2.63

[[questions]]
  id = 17
  question = "Что такое Docker network?"
  answer = "### Что такое Docker network\n\n`Docker network` — это сетевой механизм Docker, который позволяет контейнерам общаться:\n\n```text\nконтейнер ↔ контейнер\nконтейнер ↔ host-машина\nконтейнер ↔ внешний интернет\nвнешний клиент ↔ контейнер через опубликованный порт\n```\n\nВ официальной документации Docker networking описывается как возможность контейнеров подключаться и обмениваться данными друг с другом и с внешними, не-Docker сетевыми сервисами. \n\n### Зачем нужен Docker network\n\nКонтейнеры изолированы друг от друга. Docker network задаёт правила:\n\n```text\nкакие контейнеры видят друг друга;\nпо каким IP/именам они доступны;\nкакие порты открыты наружу;\nможет ли контейнер выходить в интернет;\nизолирована ли сеть от других контейнеров.\n```\n\nНапример, можно сделать сеть только для backend и базы данных:\n\n```text\nbackend ───── postgres\n   │\n   └──── доступ есть\n\nfrontend ──── доступа к postgres напрямую нет\n```\n\n### Простой пример\n\nСоздать сеть:\n\n```bash\ndocker network create app-network\n```\n\nЗапустить PostgreSQL в этой сети:\n\n```bash\ndocker run -d \\\n  --name postgres \\\n  --network app-network \\\n  postgres\n```\n\nЗапустить backend в той же сети:\n\n```bash\ndocker run -d \\\n  --name backend \\\n  --network app-network \\\n  my-backend-image\n```\n\nТеперь `backend` может обращаться к PostgreSQL по имени контейнера:\n\n```text\npostgres:5432\n```\n\nТо есть внутри Docker-сети имя контейнера работает как hostname.\n\n### Основные команды\n\nПосмотреть сети:\n\n```bash\ndocker network ls\n```\n\nПосмотреть детали сети:\n\n```bash\ndocker network inspect app-network\n```\n\nПодключить контейнер к сети:\n\n```bash\ndocker network connect app-network backend\n```\n\nОтключить контейнер от сети:\n\n```bash\ndocker network disconnect app-network backend\n```\n\nКоманда `docker network` используется для управления сетями: создание, просмотр, удаление, подключение и отключение контейнеров. \n\n### Основные типы Docker network\n\n#### `bridge`\n\nСамый частый вариант для обычного Docker на одной машине.\n\n```text\ncontainer A ─┐\ncontainer B ─┼── docker bridge ── host ── internet\ncontainer C ─┘\n```\n\n`bridge` — это сеть через программный мост. Контейнеры в одной bridge-сети могут общаться друг с другом, а от контейнеров в других сетях они изолированы.\n\nПример:\n\n```bash\ndocker network create --driver bridge app-network\n```\n\n#### `host`\n\nКонтейнер использует сетевое пространство host-машины напрямую.\n\n```text\ncontainer = сеть host-машины\n```\n\nТо есть контейнер не получает отдельную сетевую изоляцию как при `bridge`.\n\nПример:\n\n```bash\ndocker run --network host nginx\n```\n\nМинус: хуже изоляция, возможны конфликты портов.\n\n#### `none`\n\nКонтейнер запускается без сетевого доступа.\n\n```text\nтолько loopback-интерфейс внутри контейнера\n```\n\nПример:\n\n```bash\ndocker run --network none alpine\n```\n\nDocker указывает, что при `--network none` контейнер получает только loopback-устройство. \n\n#### `overlay`\n\nИспользуется, когда контейнеры должны общаться между разными Docker-хостами, например в Docker Swarm.\n\n```text\nhost 1: container A ─┐\n                     ├── overlay network\nhost 2: container B ─┘\n```\n\nDocker описывает `overlay` как распределённую сеть между несколькими Docker daemon hosts. ([Docker Documentation](https://docs.docker.com/engine/network/drivers/overlay/?utm_source=chatgpt.com \"Overlay network driver\"))\n\n#### `macvlan`\n\nПозволяет контейнеру выглядеть в физической сети как отдельное устройство со своим MAC-адресом.\n\nИспользуется реже, обычно когда контейнер должен быть полноценным участником внешней LAN-сети.\n\n### Docker Compose и сети\n\nВ `docker-compose.yml` Docker обычно сам создаёт сеть для проекта. Сервисы внутри одного Compose-проекта могут обращаться друг к другу по имени сервиса. Docker Compose по умолчанию создаёт одну сеть для приложения, а контейнеры сервисов доступны друг другу по service name. \n\nПример:\n\n```yaml\nservices:\n  backend:\n    build: .\n    depends_on:\n      - postgres\n\n  postgres:\n    image: postgres:16\n    environment:\n      POSTGRES_PASSWORD: password\n```\n\nВнутри `backend` подключение к БД будет не через `localhost`, а так:\n\n```text\npostgres:5432\n```\n\nПотому что `postgres` — это имя сервиса в Docker Compose.\n\n### Важный момент про `localhost`\n\nВнутри контейнера:\n\n```text\nlocalhost\n```\n\nозначает сам контейнер, а не host-машину и не другой контейнер.\n\nТо есть если backend-контейнер пытается подключиться так:\n\n```text\nlocalhost:5432\n```\n\nон ищет PostgreSQL внутри самого backend-контейнера.\n\nПравильно в Docker-сети:\n\n```text\npostgres:5432\n```\n\nили имя нужного контейнера/сервиса.\n\n### Коротко\n\n`Docker network` — это механизм сетевой изоляции и связи контейнеров. Он позволяет объединять контейнеры в отдельные сети, настраивать их взаимодействие, DNS-имена, доступ наружу и публикацию портов. Чаще всего используется `bridge`-сеть: контейнеры в одной сети могут обращаться друг к другу по имени контейнера или сервиса, а от других сетей они изолированы. Для нескольких Docker-хостов используется `overlay`, для полного отключения сети — `none`, а для использования сети host-машины — `host`."
  popularity = 2.63

[[questions]]
  id = 18
  question = "Что такое Docker-Compose и зачем он нужен?"
  answer = "### Что такое Docker Compose\n\n`Docker Compose` — это инструмент для запуска и управления multi-container приложениями через один YAML-файл. Вместо того чтобы вручную запускать каждый контейнер через длинные `docker run`, ты описываешь сервисы в `docker-compose.yml`, а потом поднимаешь всё одной командой. Docker официально описывает Compose как инструмент для определения и запуска multi-container applications. \n\nПример без Compose:\n\n```bash\ndocker network create app-network\n\ndocker run -d --name postgres \\\n  --network app-network \\\n  -e POSTGRES_PASSWORD=password \\\n  postgres:16\n\ndocker run -d --name redis \\\n  --network app-network \\\n  redis:7\n\ndocker run -d --name backend \\\n  --network app-network \\\n  -p 8000:8000 \\\n  my-backend-image\n```\n\nС Compose это превращается в один файл:\n\n```yaml\nservices:\n  backend:\n    build: .\n    ports:\n      - \"8000:8000\"\n    depends_on:\n      - postgres\n      - redis\n\n  postgres:\n    image: postgres:16\n    environment:\n      POSTGRES_PASSWORD: password\n\n  redis:\n    image: redis:7\n```\n\nЗапуск:\n\n```bash\ndocker compose up\n```\n\nЗапуск в фоне:\n\n```bash\ndocker compose up -d\n```\n\nОстановка:\n\n```bash\ndocker compose down\n```\n\n### Зачем нужен Docker Compose\n\nCompose нужен, когда приложение состоит не из одного контейнера, а из нескольких связанных сервисов:\n\n```text\nbackend\nfrontend\npostgres\nredis\ncelery\nrabbitmq\nminio\nnginx\n```\n\nОн позволяет описать:\n\n```text\nкакие контейнеры запускать;\nкакие образы использовать;\nкакие переменные окружения передать;\nкакие порты открыть;\nкакие volume подключить;\nкакие сети создать;\nкакие сервисы зависят друг от друга.\n```\n\nDocker Compose умеет запускать, останавливать, пересобирать сервисы, смотреть их статус, читать логи и выполнять разовые команды внутри сервисов. Это перечислено в официальной документации Docker Compose. \n\n### Типичный `docker-compose.yml`\n\n```yaml\nservices:\n  backend:\n    build: .\n    container_name: backend\n    ports:\n      - \"8000:8000\"\n    environment:\n      DB_HOST: postgres\n      DB_PORT: 5432\n      DB_NAME: app_db\n      DB_USER: app_user\n      DB_PASSWORD: password\n      REDIS_HOST: redis\n    depends_on:\n      - postgres\n      - redis\n\n  postgres:\n    image: postgres:16\n    container_name: postgres\n    environment:\n      POSTGRES_DB: app_db\n      POSTGRES_USER: app_user\n      POSTGRES_PASSWORD: password\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n\n  redis:\n    image: redis:7\n    container_name: redis\n\nvolumes:\n  postgres_data:\n```\n\nВнутри `backend` подключение к базе будет не через `localhost`, а через имя сервиса:\n\n```text\npostgres:5432\n```\n\nПотому что Compose создаёт общую сеть для сервисов, и контейнеры могут обращаться друг к другу по service name. Это поведение описано в документации Docker Compose networking. \n\n### Как масштабировать приложение с помощью Docker\n\nМасштабирование — это запуск нескольких экземпляров одного сервиса.\n\nНапример, вместо одного backend-контейнера:\n\n```text\nbackend_1\n```\n\nможно запустить три:\n\n```text\nbackend_1\nbackend_2\nbackend_3\n```\n\nВ Docker Compose это можно сделать так:\n\n```bash\ndocker compose up -d --scale backend=3\n```\n\nФлаг `--scale` у `docker compose up` масштабирует указанный сервис до нужного количества экземпляров. В документации Docker CLI указано, что `--scale SERVICE=NUM` задаёт количество инстансов сервиса и переопределяет настройку `scale` в Compose-файле. \n\nТакже есть отдельная команда:\n\n```bash\ndocker compose scale backend=3\n```\n\nОна предназначена именно для масштабирования сервисов. \n\n### Важное ограничение при масштабировании\n\nНельзя масштабировать сервис, если каждый его контейнер пытается занять один и тот же host-порт.\n\nПроблемный пример:\n\n```yaml\nservices:\n  backend:\n    build: .\n    ports:\n      - \"8000:8000\"\n```\n\nЕсли сделать:\n\n```bash\ndocker compose up -d --scale backend=3\n```\n\nвозникнет конфликт, потому что три контейнера не могут одновременно слушать один и тот же порт `8000` на host-машине.\n\nПравильнее поставить перед backend балансировщик, например `nginx`, а backend не публиковать наружу напрямую:\n\n```yaml\nservices:\n  nginx:\n    image: nginx:alpine\n    ports:\n      - \"80:80\"\n    depends_on:\n      - backend\n\n  backend:\n    build: .\n    expose:\n      - \"8000\"\n\n  postgres:\n    image: postgres:16\n```\n\nСхема:\n\n```text\nclient\n  ↓\nnginx:80\n  ↓\nbackend_1:8000\nbackend_2:8000\nbackend_3:8000\n```\n\n### Масштабирование через Docker Swarm\n\nДля production-подхода в Docker есть Swarm mode. Там приложение запускается как service, а Docker поддерживает нужное количество replicas.\n\nПример:\n\n```bash\ndocker swarm init\n```\n\nСоздать сервис с 3 репликами:\n\n```bash\ndocker service create \\\n  --name backend \\\n  --replicas 3 \\\n  -p 80:8000 \\\n  my-backend-image\n```\n\nИзменить количество реплик:\n\n```bash\ndocker service scale backend=5\n```\n\nОфициальная документация Docker указывает, что `docker service scale` масштабирует replicated services до нужного количества replicas. \n\nТакже количество реплик можно описать в Compose-файле через `deploy.replicas`:\n\n```yaml\nservices:\n  backend:\n    image: my-backend-image\n    deploy:\n      mode: replicated\n      replicas: 3\n```\n\nВ Compose Deploy Specification `replicas` задаёт количество контейнеров, которое должно быть запущено для replicated service. \n\n### Горизонтальное и вертикальное масштабирование\n\nВ Docker чаще всего говорят о горизонтальном масштабировании:\n\n```text\nбыло:\nbackend x1\n\nстало:\nbackend x3\n```\n\nЭто увеличивает количество экземпляров приложения.\n\nВертикальное масштабирование — это когда одному контейнеру дают больше ресурсов:\n\n```text\nбольше CPU\nбольше RAM\nбольше лимитов\n```\n\nНапример:\n\n```yaml\nservices:\n  backend:\n    image: my-backend-image\n    deploy:\n      resources:\n        limits:\n          cpus: \"1.0\"\n          memory: 512M\n```\n\nНо для обработки большего количества запросов обычно эффективнее горизонтальное масштабирование: несколько backend-контейнеров + балансировщик.\n\n### Коротко\n\n`Docker Compose` — это инструмент для описания и запуска multi-container приложений через `docker-compose.yml`. Он позволяет одной командой поднять backend, базу данных, Redis, брокер сообщений, nginx и другие сервисы, автоматически создать сеть, подключить volume и передать переменные окружения.\n\nМасштабировать приложение с помощью Docker можно через запуск нескольких экземпляров одного сервиса. В Docker Compose для этого используется команда:\n\n```bash\ndocker compose up -d --scale backend=3\n```\n\nДля production-сценариев можно использовать Docker Swarm и задавать количество реплик через:\n\n```bash\ndocker service scale backend=5\n```\n\nили через `deploy.replicas` в Compose-файле. При масштабировании важно не публиковать один и тот же host-порт у каждой реплики, а ставить перед ними балансировщик, например `nginx`, Traefik или встроенный routing-механизм оркестратора."
  popularity = 5.26

[[questions]]
  id = 19
  question = "Что можно описать в docker-compose.yml файле"
  answer = "### Что можно описать в `docker-compose.yml`\n\nВ `docker-compose.yml` можно описать конфигурацию multi-container приложения: сервисы, сети, volume, переменные окружения, зависимости между контейнерами, healthcheck, порты, команды запуска и другие параметры. Официальная Compose Specification определяет Compose-файл как формат для описания multi-container приложений, а Docker Docs отдельно указывает, что Compose используется для настройки `services`, `networks`, `volumes` и других частей приложения. \n\n### 1. Сервисы\n\nГлавная секция — `services`.\n\nСервис — это описание контейнера или группы однотипных контейнеров:\n\n```yaml\nservices:\n  backend:\n    build: .\n    container_name: backend\n    ports:\n      - \"8000:8000\"\n\n  postgres:\n    image: postgres:16\n```\n\nЗдесь описаны два сервиса:\n\n```text\nbackend   контейнер с приложением\npostgres  контейнер с PostgreSQL\n```\n\nВнутри сервиса можно указать образ через `image` или сборку через `build`.\n\n### 2. Образ или сборка\n\nМожно использовать готовый образ:\n\n```yaml\nservices:\n  redis:\n    image: redis:7\n```\n\nИли собрать образ из своего `Dockerfile`:\n\n```yaml\nservices:\n  backend:\n    build:\n      context: .\n      dockerfile: Dockerfile\n```\n\n`context` указывает папку, из которой Docker будет брать файлы для сборки.\n\n### 3. Порты\n\nЧерез `ports` описывается проброс портов:\n\n```yaml\nservices:\n  backend:\n    ports:\n      - \"8000:8000\"\n```\n\nФормат:\n\n```text\nпорт_на_host:порт_внутри_контейнера\n```\n\nТо есть:\n\n```text\nlocalhost:8000 → backend-container:8000\n```\n\n### 4. Переменные окружения\n\nМожно передать переменные окружения:\n\n```yaml\nservices:\n  backend:\n    environment:\n      DB_HOST: postgres\n      DB_PORT: 5432\n      DB_NAME: app_db\n      DB_USER: app_user\n      DB_PASSWORD: password\n```\n\nИли подключить `.env`-файл:\n\n```yaml\nservices:\n  backend:\n    env_file:\n      - .env\n```\n\nПример `.env`:\n\n```env\nDB_HOST=postgres\nDB_PORT=5432\nDB_NAME=app_db\n```\n\n### 5. Зависимости между сервисами\n\nЧерез `depends_on` можно указать порядок запуска сервисов:\n\n```yaml\nservices:\n  backend:\n    depends_on:\n      - postgres\n      - redis\n\n  postgres:\n    image: postgres:16\n\n  redis:\n    image: redis:7\n```\n\nВажно: `depends_on` управляет порядком запуска контейнеров, но сам по себе не гарантирует, что база данных уже полностью готова принимать подключения. Для этого обычно добавляют `healthcheck`.\n\n### 6. Healthcheck\n\n`healthcheck` описывает проверку состояния контейнера:\n\n```yaml\nservices:\n  postgres:\n    image: postgres:16\n    environment:\n      POSTGRES_USER: app_user\n      POSTGRES_PASSWORD: password\n      POSTGRES_DB: app_db\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U app_user -d app_db\"]\n      interval: 5s\n      timeout: 3s\n      retries: 5\n```\n\nДля backend можно завязаться на состояние PostgreSQL:\n\n```yaml\nservices:\n  backend:\n    build: .\n    depends_on:\n      postgres:\n        condition: service_healthy\n\n  postgres:\n    image: postgres:16\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U app_user -d app_db\"]\n      interval: 5s\n      timeout: 3s\n      retries: 5\n```\n\n### 7. Volumes\n\nЧерез `volumes` описывается хранение данных вне жизненного цикла контейнера.\n\nНапример, PostgreSQL должен сохранять данные даже после удаления контейнера:\n\n```yaml\nservices:\n  postgres:\n    image: postgres:16\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n\nvolumes:\n  postgres_data:\n```\n\nЗдесь:\n\n```text\npostgres_data                 named volume на стороне Docker\n/var/lib/postgresql/data       путь внутри контейнера PostgreSQL\n```\n\nDocker Docs указывает, что volume нужно явно подключать к сервисам через `volumes` внутри `services`. \n\nМожно также подключить локальную папку проекта:\n\n```yaml\nservices:\n  backend:\n    volumes:\n      - ./app:/app\n```\n\nЭто называется bind mount.\n\n### 8. Networks\n\nМожно описывать сети:\n\n```yaml\nservices:\n  backend:\n    networks:\n      - app_network\n\n  postgres:\n    networks:\n      - app_network\n\nnetworks:\n  app_network:\n```\n\nКонтейнеры в одной сети могут обращаться друг к другу по имени сервиса:\n\n```text\nbackend → postgres:5432\n```\n\nDocker Compose по умолчанию создаёт одну сеть для приложения; каждый контейнер подключается к ней и доступен другим контейнерам по имени сервиса. \n\n### 9. Команда запуска\n\nМожно переопределить команду запуска контейнера:\n\n```yaml\nservices:\n  backend:\n    build: .\n    command: uvicorn app.main:app --host 0.0.0.0 --port 8000\n```\n\nИли entrypoint:\n\n```yaml\nservices:\n  backend:\n    entrypoint: [\"sh\", \"/app/entrypoint.sh\"]\n```\n\nРазница:\n\n```text\nentrypoint   основная команда контейнера\ncommand      аргументы или команда по умолчанию\n```\n\n### 10. Restart policy\n\nМожно указать, что делать при падении контейнера:\n\n```yaml\nservices:\n  backend:\n    restart: unless-stopped\n```\n\nПопулярные варианты:\n\n```text\nno              не перезапускать\nalways          всегда перезапускать\non-failure      перезапускать только при ошибке\nunless-stopped  перезапускать, кроме случая ручной остановки\n```\n\n### 11. Secrets\n\nМожно описать секреты:\n\n```yaml\nservices:\n  backend:\n    secrets:\n      - db_password\n\nsecrets:\n  db_password:\n    file: ./secrets/db_password.txt\n```\n\nСекреты используются для чувствительных данных: паролей, токенов, ключей. Compose Specification выделяет `secrets` отдельно как механизм для sensitive data.\n\nДля локальной разработки часто используют `.env`, но для production лучше не хранить секреты прямо в `docker-compose.yml`.\n\n### 12. Configs\n\n`configs` похожи на `secrets`, но предназначены для обычных конфигурационных файлов, не обязательно секретных:\n\n```yaml\nservices:\n  nginx:\n    image: nginx:alpine\n    configs:\n      - source: nginx_config\n        target: /etc/nginx/nginx.conf\n\nconfigs:\n  nginx_config:\n    file: ./nginx.conf\n```\n\nНапример, так можно передать конфиг nginx.\n\n### 13. Profiles\n\n`profiles` позволяют запускать не все сервисы, а только нужные для конкретного режима:\n\n```yaml\nservices:\n  backend:\n    build: .\n\n  pgadmin:\n    image: dpage/pgadmin4\n    profiles:\n      - debug\n```\n\nОбычный запуск:\n\n```bash\ndocker compose up\n```\n\n`pgadmin` не запустится.\n\nЗапуск с debug-профилем:\n\n```bash\ndocker compose --profile debug up\n```\n\n### 14. Resource limits\n\nМожно описывать ограничения ресурсов:\n\n```yaml\nservices:\n  backend:\n    deploy:\n      resources:\n        limits:\n          cpus: \"1.0\"\n          memory: 512M\n```\n\nНо важно: часть параметров из `deploy` исторически была ориентирована на orchestrator/Swarm-сценарии. Для обычного локального Compose нужно проверять, какие параметры реально поддерживаются текущей версией Docker Compose.\n\n### Полный пример\n\n```yaml\nservices:\n  backend:\n    build:\n      context: .\n      dockerfile: Dockerfile\n    container_name: backend\n    command: uvicorn app.main:app --host 0.0.0.0 --port 8000\n    ports:\n      - \"8000:8000\"\n    environment:\n      DB_HOST: postgres\n      DB_PORT: 5432\n      DB_NAME: app_db\n      DB_USER: app_user\n      DB_PASSWORD: password\n      REDIS_HOST: redis\n    depends_on:\n      postgres:\n        condition: service_healthy\n      redis:\n        condition: service_started\n    volumes:\n      - ./app:/app\n    networks:\n      - app_network\n    restart: unless-stopped\n\n  postgres:\n    image: postgres:16\n    container_name: postgres\n    environment:\n      POSTGRES_DB: app_db\n      POSTGRES_USER: app_user\n      POSTGRES_PASSWORD: password\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n    networks:\n      - app_network\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U app_user -d app_db\"]\n      interval: 5s\n      timeout: 3s\n      retries: 5\n\n  redis:\n    image: redis:7\n    container_name: redis\n    networks:\n      - app_network\n    restart: unless-stopped\n\nvolumes:\n  postgres_data:\n\nnetworks:\n  app_network:\n```\n\n### Коротко\n\nВ `docker-compose.yml` можно описать всё окружение приложения: какие сервисы запускать, из каких образов их брать или как собирать, какие порты пробрасывать, какие переменные окружения передавать, какие volume подключать для хранения данных, какие сети создавать, какие зависимости есть между сервисами, какие команды запуска использовать, какие healthcheck выполнять и как перезапускать контейнеры при сбоях.\n\nГлавные верхнеуровневые секции:\n\n```yaml\nservices:\nvolumes:\nnetworks:\nconfigs:\nsecrets:\n```\n\nСамая важная секция — `services`, потому что именно в ней описываются контейнеры приложения."
  popularity = 2.63

[[questions]]
  id = 20
  question = "Отличия dokcer run и dokcer excec"
  answer = "### Главное отличие\n\n`docker run` создаёт и запускает новый контейнер из образа.\n\n`docker exec` выполняет команду внутри уже запущенного контейнера.\n\nПравильное написание:\n\n```bash\ndocker run\ndocker exec\n```\n\nНе `dokcer`.\n\n### `docker run`\n\nКоманда `docker run` используется, когда нужно создать новый контейнер из Docker-образа и запустить его. По официальной документации Docker, `docker run` запускает команду в новом контейнере, при необходимости скачивая образ и стартуя контейнер. \n\nПример:\n\n```bash\ndocker run -d --name my-nginx -p 8080:80 nginx\n```\n\nЧто произойдёт:\n\n```text\nDocker возьмёт образ nginx\nсоздаст новый контейнер my-nginx\nзапустит его в фоне\nпробросит порт 8080 host-машины на порт 80 контейнера\n```\n\nДругой пример:\n\n```bash\ndocker run -it ubuntu bash\n```\n\nЭто создаст новый контейнер из образа `ubuntu` и откроет внутри него `bash`.\n\n### `docker exec`\n\nКоманда `docker exec` используется, когда контейнер уже работает, и нужно выполнить внутри него дополнительную команду. Официальная документация Docker описывает `docker exec` как запуск новой команды внутри running container. \n\nПример:\n\n```bash\ndocker exec -it my-nginx sh\n```\n\nЧто произойдёт:\n\n```text\nDocker найдёт уже запущенный контейнер my-nginx\nвыполнит внутри него sh\nоткроет интерактивную shell-сессию\n```\n\nЕщё пример:\n\n```bash\ndocker exec my-nginx nginx -s reload\n```\n\nЭто выполнит команду перезагрузки nginx внутри уже работающего контейнера.\n\n### Сравнение\n\n|Команда|Что делает|Нужен ли образ|Нужен ли уже запущенный контейнер|\n|---|--:|--:|--:|\n|`docker run`|Создаёт и запускает новый контейнер|Да|Нет|\n|`docker exec`|Выполняет команду внутри существующего контейнера|Нет напрямую|Да|\n\n### Важная разница\n\n`docker run` каждый раз создаёт новый контейнер:\n\n```bash\ndocker run ubuntu echo \"hello\"\ndocker run ubuntu echo \"hello\"\ndocker run ubuntu echo \"hello\"\n```\n\nПосле этих команд будет создано три разных контейнера.\n\nА `docker exec` работает внутри уже существующего контейнера:\n\n```bash\ndocker exec -it my-container bash\ndocker exec my-container ls\ndocker exec my-container pwd\n```\n\nВсе эти команды выполняются внутри одного и того же контейнера `my-container`.\n\n### Типичный сценарий\n\nСоздать и запустить контейнер:\n\n```bash\ndocker run -d --name app nginx\n```\n\nПосмотреть запущенные контейнеры:\n\n```bash\ndocker ps\n```\n\nЗайти внутрь работающего контейнера:\n\n```bash\ndocker exec -it app sh\n```\n\nОстановить контейнер:\n\n```bash\ndocker stop app\n```\n\nПосле остановки `docker exec` уже не сработает, потому что `exec` требует работающий контейнер.\n\n### Коротко\n\n`docker run` используется для создания и запуска нового контейнера из образа.  \n`docker exec` используется для выполнения команды внутри уже запущенного контейнера.\n\nПример:\n\n```bash\ndocker run -d --name backend my-backend-image\ndocker exec -it backend sh\n```\n\nПервая команда создаёт и запускает контейнер `backend`, вторая — открывает shell внутри уже работающего контейнера."
  popularity = 2.63

[[questions]]
  id = 21
  question = "Что происходит с ОС при запуске docker run"
  answer = "При запуске:\n\n```bash\ndocker run nginx\n```\n\nоперационная система не запускает новую полноценную ОС внутри контейнера.\n\nDocker запускает обычный процесс на host-системе, но изолирует его с помощью механизмов ядра Linux:\n\n```text\nnamespaces\ncgroups\ncapabilities\nfilesystem layers\nnetwork namespace\nmount namespace\n```\n\nКонтейнер — это не виртуальная машина. У него нет собственного отдельного Linux-ядра. Он использует ядро host-системы.\n\nDocker прямо описывает контейнер как процесс, который запускается на host-машине и изолируется собственным файловым пространством, сетью и деревом процессов. \n\n### Что происходит по шагам\n\n### 1. Docker CLI отправляет команду Docker daemon\n\nКогда ты пишешь:\n\n```bash\ndocker run nginx\n```\n\nкоманда `docker` — это клиент. Он отправляет запрос Docker Engine / Docker daemon.\n\nСхема:\n\n```text\ndocker CLI\n   ↓\nDocker daemon / dockerd\n   ↓\ncontainerd / runtime\n   ↓\nLinux kernel\n```\n\nDocker Engine работает как клиент-серверное приложение: есть CLI-клиент `docker`, daemon-процесс `dockerd` и API для управления Docker. \n\n### 2. Docker проверяет образ\n\nDocker смотрит, есть ли образ локально:\n\n```text\nnginx:latest\n```\n\nЕсли образа нет, Docker скачивает его из registry, обычно Docker Hub.\n\nПосле этого из образа создаётся контейнер.\n\n```text\nimage nginx\n   ↓\ncontainer from nginx\n```\n\nОфициально `docker run` запускает команду в новом контейнере, при необходимости скачивает образ и стартует контейнер. \n\n### 3. Создаётся файловая система контейнера\n\nDocker берёт слои образа и добавляет сверху writable layer — записываемый слой контейнера.\n\nУпрощённо:\n\n```text\nread-only image layers\n  nginx layer\n  debian/alpine layer\n  base layer\n        ↓\nwritable container layer\n        ↓\ncontainer filesystem\n```\n\nПоэтому внутри контейнера кажется, что у него есть своя файловая система:\n\n```text\n/bin\n/etc\n/usr\n/var\n/app\n```\n\nНо физически это не отдельная ОС, а набор слоёв файловой системы, управляемый Docker storage driver.\n\n### 4. Ядро Linux создаёт namespaces\n\nDocker просит ядро создать изолированные пространства имён.\n\nОсновные namespaces:\n\n```text\nPID namespace       своё дерево процессов\nNET namespace       своя сеть\nMNT namespace       свои mount points\nUTS namespace       свой hostname\nIPC namespace       своя межпроцессная коммуникация\nUSER namespace      своя карта пользователей, если включено\n```\n\nDocker Docs прямо указывает: при `docker run` Docker создаёт набор namespaces и control groups для контейнера. \n\nИз-за `PID namespace` процесс внутри контейнера может видеть себя как PID 1:\n\n```bash\nps aux\n```\n\nВнутри контейнера:\n\n```text\nPID 1  nginx\n```\n\nНа host-системе этот же процесс будет обычным процессом с другим PID:\n\n```text\nPID 24891 nginx\n```\n\nТо есть процесс один и тот же, но видимость разная.\n\n### 5. Создаются cgroups\n\n`cgroups` ограничивают и учитывают ресурсы контейнера:\n\n```text\nCPU\nRAM\ndisk I/O\nprocess count\ndevice access\n```\n\nНапример:\n\n```bash\ndocker run --memory=512m --cpus=1 nginx\n```\n\nЭто означает:\n\n```text\nконтейнеру доступно до 512 MB RAM\nконтейнер ограничен примерно 1 CPU\n```\n\nDocker daemon использует OCI-compatible runtime через `containerd` как интерфейс к Linux kernel namespaces, cgroups и SELinux. \n\n### 6. Настраивается сеть\n\nОбычно Docker подключает контейнер к bridge-сети.\n\nСхема:\n\n```text\ncontainer eth0\n   ↓\nveth pair\n   ↓\ndocker bridge\n   ↓\nhost network\n   ↓\ninternet\n```\n\nЕсли указан проброс портов:\n\n```bash\ndocker run -p 8080:80 nginx\n```\n\nто Docker настраивает доступ:\n\n```text\nhost:8080 → container:80\n```\n\nВнутри контейнера `localhost` — это сам контейнер, а не host-система.\n\n### 7. Запускается главный процесс контейнера\n\nDocker запускает команду из `CMD` или `ENTRYPOINT` образа.\n\nНапример у `nginx` главным процессом будет nginx:\n\n```text\ncontainer PID 1 → nginx\n```\n\nУ Python-приложения это может быть:\n\n```bash\nuvicorn app.main:app --host 0.0.0.0 --port 8000\n```\n\nГлавный процесс важен: пока он жив — контейнер считается запущенным. Если главный процесс завершился, контейнер останавливается.\n\nDocker Docs указывает, что главным процессом контейнера является `ENTRYPOINT` и/или `CMD` из Dockerfile. \n\n### Что происходит с самой ОС\n\nС host-ОС происходит следующее:\n\n```text\nновая ОС не загружается;\nновое ядро не запускается;\nGRUB/bootloader не участвует;\nsystemd внутри контейнера обычно не нужен;\nядро host-системы создаёт изолированную среду для процесса;\nDocker добавляет файловую систему, сеть, лимиты и права.\n```\n\nТо есть Docker не делает это:\n\n```text\nBIOS/UEFI\n↓\nGRUB\n↓\nLinux kernel\n↓\nsystemd\n↓\nприложение\n```\n\nDocker делает примерно это:\n\n```text\nуже запущенная Linux host ОС\n↓\ndocker run\n↓\ndockerd/containerd\n↓\nядро Linux создаёт namespaces + cgroups\n↓\nзапускается процесс приложения\n```\n\n### Почему внутри контейнера кажется, что там отдельная ОС\n\nПотому что у контейнера есть свой root filesystem:\n\n```text\n/etc\n/bin\n/lib\n/usr\n/var\n```\n\nНапример, если образ основан на Alpine:\n\n```bash\ndocker run -it alpine sh\n```\n\nвнутри будут Alpine-файлы:\n\n```text\n/etc/alpine-release\n/bin/sh\n/lib/\n```\n\nНо это не значит, что запустилось отдельное ядро Alpine. Это только пользовательское окружение Alpine, то есть user space.\n\nСравнение:\n\n```text\nhost kernel      общий\ncontainer fs     отдельный\ncontainer pid    изолированный\ncontainer net    изолированный\n```\n\n### Контейнер vs виртуальная машина\n\n```text\nDocker container:\nhost kernel\n  └─ isolated process\n\nVirtual machine:\nhypervisor\n  └─ guest OS with its own kernel\n      └─ process\n```\n\nКонтейнер легче, потому что не загружает отдельную ОС.\n\nВиртуальная машина тяжелее, потому что внутри неё действительно запускается отдельная гостевая ОС со своим ядром.\n\n### Пример\n\nКоманда:\n\n```bash\ndocker run -d --name web -p 8080:80 nginx\n```\n\nЧто произойдёт:\n\n```text\n1. Docker CLI отправит запрос dockerd.\n2. Docker проверит наличие образа nginx.\n3. Если образа нет — скачает его.\n4. Docker создаст контейнер из слоёв образа.\n5. Ядро Linux создаст namespaces.\n6. Docker настроит cgroups.\n7. Docker подключит контейнер к сети.\n8. Docker пробросит порт 8080 host → 80 container.\n9. Docker запустит nginx как главный процесс контейнера.\n```\n\nПроверить процесс можно так:\n\n```bash\ndocker ps\n```\n\nЗайти внутрь:\n\n```bash\ndocker exec -it web sh\n```\n\nПосмотреть процессы внутри:\n\n```bash\nps aux\n```\n\n### Коротко\n\nПри `docker run` Docker не запускает новую операционную систему. Он создаёт новый контейнер из образа и запускает внутри него процесс. Этот процесс работает на ядре host-ОС, но изолируется с помощью Linux namespaces, ограничивается через cgroups, получает свою файловую систему из слоёв образа, свою сеть и своё дерево процессов. Поэтому контейнер выглядит как отдельная Linux-среда, но технически это изолированный процесс на уже запущенной ОС."
  popularity = 2.63

[[questions]]
  id = 22
  question = "Какие шаги нужны для контейнеризации backend-сервиса?"
  answer = "Упаковать новый backend-микросервис в Docker — значит подготовить приложение так, чтобы оно запускалось внутри контейнера одинаково на любой машине: локально, на тестовом сервере, в CI/CD или production.\n\nОбычно нужны такие файлы:\n\n```text\nproject/\n├── app/\n│   └── main.py\n├── requirements.txt / pyproject.toml\n├── Dockerfile\n├── .dockerignore\n├── docker-compose.yml\n└── .env\n```\n\nDockerfile описывает, как собрать image: какие файлы скопировать, какие зависимости установить и какую команду запускать при старте контейнера. Docker официально определяет Dockerfile как текстовый файл с инструкциями для сборки образа. \n\n### 1. Подготовить backend-приложение\n\nСначала приложение должно уметь запускаться обычной командой.\n\nНапример для FastAPI:\n\n```bash\nuvicorn app.main:app --host 0.0.0.0 --port 8000\n```\n\nВажно указывать:\n\n```text\n--host 0.0.0.0\n```\n\nА не:\n\n```text\n--host 127.0.0.1\n```\n\nПотому что внутри контейнера `127.0.0.1` означает сам контейнер. Чтобы приложение было доступно снаружи контейнера, оно должно слушать `0.0.0.0`.\n\n### 2. Вынести настройки в переменные окружения\n\nВ коде не нужно жёстко прописывать:\n\n```python\nDB_HOST = \"localhost\"\nDB_PASSWORD = \"password\"\n```\n\nЛучше брать настройки из environment variables:\n\n```python\nDB_HOST = os.getenv(\"DB_HOST\")\nDB_PORT = os.getenv(\"DB_PORT\", \"5432\")\nDB_NAME = os.getenv(\"DB_NAME\")\n```\n\nДля Docker это стандартный подход, потому что один и тот же image можно запускать с разными настройками:\n\n```text\nлокально\nstaging\nproduction\nCI/CD\n```\n\n### 3. Написать `Dockerfile`\n\nПример для Python/FastAPI:\n\n```dockerfile\nFROM python:3.12-slim\n\nWORKDIR /app\n\nENV PYTHONDONTWRITEBYTECODE=1 \\\n    PYTHONUNBUFFERED=1\n\nCOPY requirements.txt .\n\nRUN pip install --no-cache-dir -r requirements.txt\n\nCOPY . .\n\nCMD [\"uvicorn\", \"app.main:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]\n```\n\nЧто здесь происходит:\n\n```text\nFROM       выбираем базовый образ\nWORKDIR    задаём рабочую директорию\nENV        задаём переменные окружения\nCOPY       копируем файлы проекта\nRUN        устанавливаем зависимости\nCMD        команда запуска приложения\n```\n\nDockerfile-инструкции `FROM`, `WORKDIR`, `COPY`, `RUN`, `CMD` описаны в официальной Dockerfile reference. \n\n### 4. Добавить `.dockerignore`\n\n`.dockerignore` нужен, чтобы не отправлять в build context лишние файлы:\n\n```dockerignore\n.git\n.idea\n.vscode\n__pycache__\n*.pyc\n.env\n.venv\nvenv\ntests\nREADME.md\n```\n\nБез `.dockerignore` Docker может тащить в build context лишнее: виртуальное окружение, `.git`, кэш, локальные файлы IDE. Docker рекомендует использовать `.dockerignore`, чтобы исключать файлы, не нужные для сборки. \n\n### 5. Собрать Docker image\n\nСборка образа:\n\n```bash\ndocker build -t my-backend:1.0 .\n```\n\nГде:\n\n```text\nmy-backend   имя image\n1.0          tag/version\n.            build context, то есть текущая директория\n```\n\nDocker build использует Dockerfile и build context — набор файлов, доступных во время сборки. \n\n### 6. Запустить контейнер\n\nПростой запуск:\n\n```bash\ndocker run -d \\\n  --name my-backend \\\n  -p 8000:8000 \\\n  my-backend:1.0\n```\n\nЗдесь:\n\n```text\n-d                 запуск в фоне\n--name             имя контейнера\n-p 8000:8000       host:container порт\nmy-backend:1.0     image\n```\n\nПроверить:\n\n```bash\ndocker ps\n```\n\nПосмотреть логи:\n\n```bash\ndocker logs my-backend\n```\n\nЗайти внутрь контейнера:\n\n```bash\ndocker exec -it my-backend sh\n```\n\n### 7. Подключить базу, Redis и другие сервисы через Docker Compose\n\nДля backend-сервиса почти всегда нужны внешние зависимости:\n\n```text\nPostgreSQL\nRedis\nRabbitMQ\nMinIO\nnginx\n```\n\nИх удобнее описывать в `docker-compose.yml`. Compose-файл используется для настройки сервисов, сетей, volume и других частей multi-container приложения.\n\nПример:\n\n```yaml\nservices:\n  backend:\n    build: .\n    container_name: backend\n    ports:\n      - \"8000:8000\"\n    environment:\n      DB_HOST: postgres\n      DB_PORT: 5432\n      DB_NAME: app_db\n      DB_USER: app_user\n      DB_PASSWORD: password\n      REDIS_HOST: redis\n    depends_on:\n      - postgres\n      - redis\n\n  postgres:\n    image: postgres:16\n    container_name: postgres\n    environment:\n      POSTGRES_DB: app_db\n      POSTGRES_USER: app_user\n      POSTGRES_PASSWORD: password\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n\n  redis:\n    image: redis:7\n    container_name: redis\n\nvolumes:\n  postgres_data:\n```\n\nЗапуск:\n\n```bash\ndocker compose up -d\n```\n\nОстановка:\n\n```bash\ndocker compose down\n```\n\nCompose запускает и управляет несколькими сервисами через один YAML-файл, включая сети и volume. \n\n### 8. Правильно настроить подключение к БД\n\nВнутри Docker Compose backend должен подключаться к PostgreSQL не так:\n\n```text\nlocalhost:5432\n```\n\nА так:\n\n```text\npostgres:5432\n```\n\nПотому что `postgres` — это имя сервиса в Docker Compose. Контейнеры внутри одной Compose-сети могут обращаться друг к другу по имени сервиса. \n\nПример строки подключения:\n\n```env\nDATABASE_URL=postgresql://app_user:password@postgres:5432/app_db\n```\n\n### 9. Добавить healthcheck\n\nДля базы данных полезно добавить `healthcheck`:\n\n```yaml\nservices:\n  postgres:\n    image: postgres:16\n    environment:\n      POSTGRES_DB: app_db\n      POSTGRES_USER: app_user\n      POSTGRES_PASSWORD: password\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U app_user -d app_db\"]\n      interval: 5s\n      timeout: 3s\n      retries: 5\n```\n\nИ завязать backend на готовность базы:\n\n```yaml\nservices:\n  backend:\n    build: .\n    depends_on:\n      postgres:\n        condition: service_healthy\n\n  postgres:\n    image: postgres:16\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U app_user -d app_db\"]\n      interval: 5s\n      timeout: 3s\n      retries: 5\n```\n\nЭто лучше, чем просто `depends_on`, потому что база может быть запущена как процесс, но ещё не готова принимать подключения.\n\n### 10. Для production использовать multi-stage build\n\nДля production-образа лучше отделять стадию сборки от стадии запуска. Docker multi-stage builds позволяют использовать несколько `FROM` и копировать в финальный image только нужные артефакты, оставляя build-зависимости вне итогового образа. \n\nПример:\n\n```dockerfile\nFROM python:3.12-slim AS builder\n\nWORKDIR /app\n\nCOPY requirements.txt .\n\nRUN python -m venv /venv \\\n    && /venv/bin/pip install --no-cache-dir -r requirements.txt\n\n\nFROM python:3.12-slim AS runtime\n\nWORKDIR /app\n\nENV PATH=\"/venv/bin:$PATH\" \\\n    PYTHONDONTWRITEBYTECODE=1 \\\n    PYTHONUNBUFFERED=1\n\nCOPY --from=builder /venv /venv\nCOPY app ./app\n\nRUN useradd -m appuser\n\nUSER appuser\n\nCMD [\"uvicorn\", \"app.main:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]\n```\n\nПлюсы:\n\n```text\nменьше итоговый image;\nменьше лишних build-зависимостей;\nчище production-среда;\nменьше поверхность атаки.\n```\n\n### 11. Не хранить секреты в Dockerfile\n\nПлохо:\n\n```dockerfile\nENV DB_PASSWORD=secret_password\nENV JWT_SECRET=secret_key\n```\n\nЛучше передавать секреты при запуске:\n\n```bash\ndocker run --env-file .env my-backend:1.0\n```\n\nИли через Compose:\n\n```yaml\nservices:\n  backend:\n    env_file:\n      - .env\n```\n\n`.env` обычно не коммитят в Git:\n\n```gitignore\n.env\n```\n\n### 12. Проверить контейнер перед публикацией\n\nМинимальная проверка:\n\n```bash\ndocker build -t my-backend:1.0 .\ndocker run -d --name my-backend -p 8000:8000 my-backend:1.0\ndocker logs my-backend\ndocker ps\ncurl http://localhost:8000/health\n```\n\nДля backend-сервиса полезно иметь endpoint:\n\n```text\nGET /health\n```\n\nНапример:\n\n```json\n{\n  \"status\": \"ok\"\n}\n```\n\n### 13. Загрузить image в registry\n\nПосле проверки image обычно отправляют в registry:\n\n```bash\ndocker tag my-backend:1.0 registry.example.com/my-backend:1.0\ndocker push registry.example.com/my-backend:1.0\n```\n\nПосле этого image можно использовать на сервере, в CI/CD или оркестраторе.\n\n### Общий порядок контейнеризации backend-сервиса\n\n```text\n1. Проверить, что сервис запускается локально обычной командой.\n2. Вынести настройки в environment variables.\n3. Написать Dockerfile.\n4. Добавить .dockerignore.\n5. Собрать Docker image.\n6. Запустить контейнер через docker run.\n7. Проверить логи и health endpoint.\n8. Описать зависимости в docker-compose.yml.\n9. Подключить БД, Redis, брокеры, volumes и networks.\n10. Настроить миграции, healthcheck и restart policy.\n11. Убрать секреты из Dockerfile и кода.\n12. Собрать production-image.\n13. Отправить image в registry.\n14. Развернуть на сервере или в оркестраторе.\n```\n\n### Коротко\n\nЧтобы контейнеризировать backend-микросервис, нужно написать `Dockerfile`, выбрать базовый образ, скопировать код приложения, установить зависимости, задать команду запуска через `CMD` или `ENTRYPOINT`, добавить `.dockerignore`, собрать image через `docker build` и проверить запуск через `docker run`.\n\nЕсли сервис зависит от базы данных, Redis или других компонентов, окружение описывают в `docker-compose.yml`: backend, PostgreSQL, Redis, сети, volumes, переменные окружения и healthcheck. Внутри Compose сервисы обращаются друг к другу по имени сервиса, например `postgres:5432`, а не через `localhost`."
  popularity = 2.63

[[questions]]
  id = 23
  question = "Чем отличаются в Docker CMD и ENTRYPOINT?"
  answer = "### Главное отличие\n\n`CMD` задаёт команду или аргументы по умолчанию для контейнера.\n\n`ENTRYPOINT` задаёт основную неизменяемую команду, которая должна запускаться при старте контейнера.\n\nОбычно правильная логика такая:\n\n```dockerfile\nENTRYPOINT [\"uvicorn\"]\nCMD [\"app.main:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]\n```\n\nТо есть:\n\n```text\nENTRYPOINT  что запускать\nCMD         с какими аргументами запускать по умолчанию\n```\n\nDocker в best practices прямо рекомендует использовать `ENTRYPOINT` как основную команду образа, а `CMD` — как аргументы по умолчанию. \n\n### `CMD`\n\n`CMD` — это команда по умолчанию, которую легко заменить при `docker run`.\n\nПример:\n\n```dockerfile\nFROM python:3.12-slim\n\nWORKDIR /app\nCOPY . .\n\nRUN pip install -r requirements.txt\n\nCMD [\"uvicorn\", \"app.main:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]\n```\n\nЗапуск:\n\n```bash\ndocker run my-backend\n```\n\nDocker выполнит:\n\n```bash\nuvicorn app.main:app --host 0.0.0.0 --port 8000\n```\n\nНо `CMD` можно полностью переопределить:\n\n```bash\ndocker run my-backend python manage.py migrate\n```\n\nВ этом случае вместо `uvicorn ...` выполнится:\n\n```bash\npython manage.py migrate\n```\n\n### `ENTRYPOINT`\n\n`ENTRYPOINT` задаёт основную команду контейнера.\n\nПример:\n\n```dockerfile\nFROM python:3.12-slim\n\nENTRYPOINT [\"uvicorn\"]\nCMD [\"app.main:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]\n```\n\nЗапуск:\n\n```bash\ndocker run my-backend\n```\n\nФактически выполнится:\n\n```bash\nuvicorn app.main:app --host 0.0.0.0 --port 8000\n```\n\nА если передать аргументы:\n\n```bash\ndocker run my-backend app.main:app --host 0.0.0.0 --port 9000\n```\n\nто они заменят `CMD`, но не `ENTRYPOINT`.\n\nФактически будет:\n\n```bash\nuvicorn app.main:app --host 0.0.0.0 --port 9000\n```\n\n### Сравнение\n\n|Параметр|`CMD`|`ENTRYPOINT`|\n|---|---|---|\n|Назначение|Команда/аргументы по умолчанию|Главная команда контейнера|\n|Легко переопределяется через `docker run`|Да|Нет, обычно через `--entrypoint`|\n|Часто используется для|Обычного запуска приложения|CLI-утилит, фиксированной команды|\n|Может работать вместе с другим|Да|Да|\n\n### Как они работают вместе\n\nПример:\n\n```dockerfile\nENTRYPOINT [\"python\"]\nCMD [\"app.py\"]\n```\n\nЗапуск:\n\n```bash\ndocker run my-image\n```\n\nРезультат:\n\n```bash\npython app.py\n```\n\nЗапуск с другим аргументом:\n\n```bash\ndocker run my-image script.py\n```\n\nРезультат:\n\n```bash\npython script.py\n```\n\nТо есть `ENTRYPOINT` остался `python`, а `CMD` заменился на `script.py`.\n\n### Как переопределить `ENTRYPOINT`\n\nЕсли нужно заменить именно `ENTRYPOINT`, используется `--entrypoint`:\n\n```bash\ndocker run --entrypoint sh my-backend\n```\n\nНапример, это полезно для отладки, когда образ по умолчанию запускает приложение, а нужно зайти внутрь shell.\n\n### Exec form и shell form\n\nИ `CMD`, и `ENTRYPOINT` можно писать в двух формах.\n\nЛучше использовать exec form:\n\n```dockerfile\nCMD [\"uvicorn\", \"app.main:app\", \"--host\", \"0.0.0.0\"]\n```\n\nХуже для production — shell form:\n\n```dockerfile\nCMD uvicorn app.main:app --host 0.0.0.0\n```\n\nDocker указывает, что `CMD` и `ENTRYPOINT` поддерживают shell form и exec form, но при shell form процесс запускается как дочерний процесс shell, из-за чего могут некорректно обрабатываться сигналы вроде `SIGTERM`. \n\nДля backend-сервиса лучше так:\n\n```dockerfile\nCMD [\"uvicorn\", \"app.main:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]\n```\n\nА не так:\n\n```dockerfile\nCMD uvicorn app.main:app --host 0.0.0.0 --port 8000\n```\n\n### Важный момент\n\nВ одном Dockerfile может быть несколько `CMD` или несколько `ENTRYPOINT`, но использоваться будет только последняя инструкция. Docker прямо указывает: если в Dockerfile несколько `CMD`, `ENTRYPOINT` или `HEALTHCHECK`, используется только последнее вхождение. \n\nПример:\n\n```dockerfile\nCMD [\"echo\", \"first\"]\nCMD [\"echo\", \"second\"]\n```\n\nСработает только:\n\n```dockerfile\nCMD [\"echo\", \"second\"]\n```\n\n### Когда использовать `CMD`\n\n`CMD` подходит, когда нужно просто задать стандартную команду запуска приложения:\n\n```dockerfile\nCMD [\"uvicorn\", \"app.main:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]\n```\n\nЭто нормальный вариант для backend-сервиса.\n\n### Когда использовать `ENTRYPOINT`\n\n`ENTRYPOINT` подходит, когда образ должен вести себя как конкретная программа.\n\nНапример:\n\n```dockerfile\nENTRYPOINT [\"python\", \"manage.py\"]\nCMD [\"runserver\", \"0.0.0.0:8000\"]\n```\n\nТогда можно запускать:\n\n```bash\ndocker run django-image migrate\n```\n\nФактически получится:\n\n```bash\npython manage.py migrate\n```\n\nИли:\n\n```bash\ndocker run django-image createsuperuser\n```\n\nФактически:\n\n```bash\npython manage.py createsuperuser\n```\n\n### Коротко\n\n`CMD` задаёт команду или аргументы по умолчанию для контейнера и легко переопределяется аргументами в `docker run`.\n\n`ENTRYPOINT` задаёт основную команду контейнера. Аргументы из `CMD` могут дополнять `ENTRYPOINT`.\n\nПрактическое правило:\n\n```text\nCMD         когда нужно просто указать стандартный запуск приложения\nENTRYPOINT  когда образ должен всегда запускать конкретную программу\nENTRYPOINT + CMD  когда нужна фиксированная команда и изменяемые аргументы по умолчанию\n```\n\nПример:\n\n```dockerfile\nENTRYPOINT [\"uvicorn\"]\nCMD [\"app.main:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]\n```\n\nЗдесь `uvicorn` — основная команда, а `CMD` — параметры по умолчанию."
  popularity = 2.63

[[questions]]
  id = 24
  question = "Что такое балансировка нагрузки в Docker?"
  answer = "### Что такое балансировка нагрузки в Docker\n\nБалансировка нагрузки в Docker — это распределение входящих запросов между несколькими контейнерами одного приложения.\n\nНапример, вместо одного backend-контейнера:\n\n```text\nclient → backend_1\n```\n\nзапускают несколько одинаковых экземпляров:\n\n```text\nclient\n  ↓\nload balancer\n  ↓\nbackend_1\nbackend_2\nbackend_3\n```\n\nЦель — чтобы один контейнер не принимал всю нагрузку, а запросы распределялись между несколькими репликами.\n\n### Зачем нужна балансировка\n\nБалансировка нужна, когда:\n\n```text\nодного контейнера уже не хватает;\nнужно обрабатывать больше запросов;\nнужно повысить отказоустойчивость;\nнужно обновлять сервис без полного простоя;\nнужно распределить трафик между несколькими replicas.\n```\n\nНапример, если backend обрабатывает 100 запросов в секунду, можно поднять 3 экземпляра backend и распределять запросы между ними.\n\n```text\nbackend_1 → часть запросов\nbackend_2 → часть запросов\nbackend_3 → часть запросов\n```\n\n### Балансировка в обычном Docker Compose\n\nВ `docker compose` можно масштабировать сервис:\n\n```bash\ndocker compose up -d --scale backend=3\n```\n\nПосле этого Compose поднимет несколько контейнеров одного сервиса. В Compose Specification сервис описывается как вычислительный ресурс, который может быть масштабирован или заменён независимо от других компонентов. \n\nУсловно:\n\n```text\nbackend-1\nbackend-2\nbackend-3\n```\n\nНо важный момент: Docker Compose сам по себе не является полноценным HTTP-балансировщиком для внешнего трафика. Обычно перед несколькими backend-контейнерами ставят reverse proxy/load balancer:\n\n```text\nclient\n  ↓\nnginx / traefik / haproxy\n  ↓\nbackend_1\nbackend_2\nbackend_3\n```\n\n### Почему нельзя просто пробросить один порт на все replicas\n\nПроблемный вариант:\n\n```yaml\nservices:\n  backend:\n    build: .\n    ports:\n      - \"8000:8000\"\n```\n\nЕсли сделать:\n\n```bash\ndocker compose up -d --scale backend=3\n```\n\nто несколько контейнеров будут пытаться занять один и тот же порт `8000` на host-машине.\n\n```text\nbackend_1 → host:8000\nbackend_2 → host:8000  конфликт\nbackend_3 → host:8000  конфликт\n```\n\nПоэтому обычно backend не публикуют наружу напрямую, а используют `expose`:\n\n```yaml\nservices:\n  backend:\n    build: .\n    expose:\n      - \"8000\"\n```\n\nА наружу публикуют только балансировщик:\n\n```yaml\nservices:\n  nginx:\n    image: nginx:alpine\n    ports:\n      - \"80:80\"\n```\n\n### Пример с nginx\n\n```yaml\nservices:\n  nginx:\n    image: nginx:alpine\n    ports:\n      - \"80:80\"\n    volumes:\n      - ./nginx.conf:/etc/nginx/nginx.conf:ro\n    depends_on:\n      - backend\n\n  backend:\n    build: .\n    expose:\n      - \"8000\"\n```\n\nЗапуск нескольких backend-контейнеров:\n\n```bash\ndocker compose up -d --scale backend=3\n```\n\nПример `nginx.conf`:\n\n```nginx\nevents {}\n\nhttp {\n    upstream backend_pool {\n        server backend:8000;\n    }\n\n    server {\n        listen 80;\n\n        location / {\n            proxy_pass http://backend_pool;\n        }\n    }\n}\n```\n\nВ Docker Compose имя сервиса `backend` резолвится внутри общей Docker-сети. Compose по умолчанию создаёт сеть для приложения, а контейнеры могут обращаться друг к другу по имени сервиса. \n\n### Балансировка в Docker Swarm\n\nВ Docker Swarm балансировка встроена лучше, чем в обычном Compose.\n\nМожно создать сервис с несколькими репликами:\n\n```bash\ndocker service create \\\n  --name backend \\\n  --replicas 3 \\\n  -p 80:8000 \\\n  my-backend-image\n```\n\nИли изменить количество реплик:\n\n```bash\ndocker service scale backend=5\n```\n\nКоманда `docker service scale` масштабирует replicated services до нужного количества реплик. \n\nВ Swarm есть `routing mesh`: если сервис публикует порт, все nodes в swarm участвуют в ingress routing mesh. Docker указывает, что запрос к опубликованному порту на любом node может быть направлен к активной задаче сервиса. \n\nСхема:\n\n```text\nclient\n  ↓\nnode_1:80 / node_2:80 / node_3:80\n  ↓\nDocker routing mesh\n  ↓\nbackend replica 1\nbackend replica 2\nbackend replica 3\n```\n\n### Внешний балансировщик\n\nДаже при Docker Swarm часто используют внешний балансировщик:\n\n```text\nclient\n  ↓\nexternal LB\n  ↓\nDocker nodes\n  ↓\nservices / containers\n```\n\nНапример:\n\n```text\nnginx\nHAProxy\nTraefik\ncloud load balancer\n```\n\nDocker документация прямо описывает возможность настроить внешний load balancer, например HAProxy, чтобы направлять запросы к swarm service. \n\n### Виды балансировки\n\nНа практике встречаются два уровня.\n\n### 1. L4-балансировка\n\nРаботает на уровне TCP/UDP:\n\n```text\nIP\nport\nTCP connection\n```\n\nПример:\n\n```text\n:80 → replica_1\n:80 → replica_2\n:80 → replica_3\n```\n\nDocker Swarm routing mesh ближе к такому уровню.\n\n### 2. L7-балансировка\n\nРаботает на уровне HTTP:\n\n```text\n/api/users     → users-service\n/api/orders    → orders-service\nHost header    → нужный сервис\ncookies        → sticky sessions\n```\n\nЭто обычно делают через:\n\n```text\nnginx\nTraefik\nHAProxy\nEnvoy\n```\n\nДля backend-приложений чаще нужен именно L7 reverse proxy, потому что он может учитывать HTTP-маршруты, домены, заголовки, TLS и другие параметры.\n\n### Важное требование к приложению\n\nЧтобы backend нормально масштабировался, контейнеры должны быть stateless.\n\nПлохо:\n\n```text\nсессии хранятся только в памяти одного контейнера;\nзагруженные файлы лежат только внутри контейнера;\nфоновые задачи запускаются в каждом replica без координации;\nкаждый контейнер держит уникальное локальное состояние.\n```\n\nЛучше:\n\n```text\nсессии → Redis / БД\nфайлы → S3 / MinIO / volume\nочереди → RabbitMQ / Redis\nсостояние → PostgreSQL / внешнее хранилище\n```\n\nИначе запрос пользователя может попасть то в `backend_1`, то в `backend_2`, а нужного состояния там не окажется.\n\n### Коротко\n\nБалансировка нагрузки в Docker — это распределение входящих запросов между несколькими контейнерами одного сервиса. Сначала приложение масштабируют, например:\n\n```bash\ndocker compose up -d --scale backend=3\n```\n\nили в Swarm:\n\n```bash\ndocker service scale backend=5\n```\n\nЗатем перед репликами ставят балансировщик: `nginx`, `Traefik`, `HAProxy` или используют встроенный routing mesh в Docker Swarm. В обычном Docker Compose внешний HTTP-трафик обычно балансируют через reverse proxy, потому что несколько контейнеров не могут одновременно занять один и тот же host-порт. Для корректного масштабирования backend должен быть stateless, а общее состояние нужно выносить в БД, Redis, S3/MinIO или другое внешнее хранилище."
  popularity = 2.63

[[questions]]
  id = 25
  question = "Как работает система кэширования слоёв в Dockerfile?"
  answer = "### Что такое кэширование слоёв Docker\n\nПри сборке Docker-образа каждая инструкция Dockerfile создаёт слой или влияет на состояние сборки:\n\n```dockerfile\nFROM python:3.12-slim\nWORKDIR /app\nCOPY requirements.txt .\nRUN pip install -r requirements.txt\nCOPY . .\nCMD [\"python\", \"main.py\"]\n```\n\nУсловно это превращается в цепочку:\n\n```text\nbase image layer\n↓\nWORKDIR layer\n↓\nCOPY requirements.txt layer\n↓\nRUN pip install layer\n↓\nCOPY app source layer\n↓\nfinal image\n```\n\nDocker сохраняет результат выполнения инструкций в build cache. При следующей сборке он проверяет: можно ли переиспользовать уже готовый слой вместо повторного выполнения команды. Это ускоряет сборку, потому что Docker пропускает неизменившиеся шаги. Docker Docs описывает build cache как механизм переиспользования результатов предыдущих сборок для пропуска лишней работы. \n\n### Как Docker понимает, можно ли использовать кэш\n\nDocker идёт по Dockerfile сверху вниз.\n\nДля каждой инструкции он проверяет:\n\n```text\nтакая же ли инструкция;\nне изменились ли файлы, от которых она зависит;\nне был ли сломан кэш на предыдущем шаге.\n```\n\nЕсли слой подходит — Docker пишет примерно:\n\n```text\nCACHED\n```\n\nЕсли слой не подходит — Docker выполняет инструкцию заново, и все следующие слои тоже пересобираются.\n\nОбщее правило из Docker Docs: builder сначала проверяет base image, затем каждая следующая инструкция сравнивается с cached layers; если подходящий слой не найден, cache invalidated. \n\n### Пример неправильного Dockerfile\n\n```dockerfile\nFROM python:3.12-slim\n\nWORKDIR /app\n\nCOPY . .\n\nRUN pip install -r requirements.txt\n\nCMD [\"uvicorn\", \"app.main:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]\n```\n\nПроблема здесь:\n\n```dockerfile\nCOPY . .\n```\n\nЕсли ты изменишь любой файл проекта:\n\n```text\napp/main.py\nREADME.md\ntests/test_api.py\n```\n\nDocker увидит, что `COPY . .` изменился, сбросит кэш для этого слоя, а потом заново выполнит:\n\n```dockerfile\nRUN pip install -r requirements.txt\n```\n\nДаже если зависимости не менялись.\n\n### Правильнее для Python\n\n```dockerfile\nFROM python:3.12-slim\n\nWORKDIR /app\n\nCOPY requirements.txt .\n\nRUN pip install --no-cache-dir -r requirements.txt\n\nCOPY . .\n\nCMD [\"uvicorn\", \"app.main:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]\n```\n\nПочему так лучше:\n\n```text\nrequirements.txt меняется редко\n↓\nслой с pip install часто берётся из кэша\n\nкод приложения меняется часто\n↓\nпересобирается только COPY . . и следующие слои\n```\n\nDocker рекомендует упорядочивать слои так, чтобы редко изменяемые шаги шли раньше часто изменяемых. Это один из способов оптимизации build cache. \n\n### Как это работает по шагам\n\nПервая сборка:\n\n```bash\ndocker build -t backend .\n```\n\nDocker выполняет всё:\n\n```text\nFROM python:3.12-slim             выполнено\nWORKDIR /app                      выполнено\nCOPY requirements.txt .           выполнено\nRUN pip install ...               выполнено\nCOPY . .                          выполнено\nCMD ...                           выполнено\n```\n\nВторая сборка без изменений:\n\n```text\nFROM python:3.12-slim             CACHED\nWORKDIR /app                      CACHED\nCOPY requirements.txt .           CACHED\nRUN pip install ...               CACHED\nCOPY . .                          CACHED\nCMD ...                           CACHED\n```\n\nЕсли изменился только `app/main.py`:\n\n```text\nFROM python:3.12-slim             CACHED\nWORKDIR /app                      CACHED\nCOPY requirements.txt .           CACHED\nRUN pip install ...               CACHED\nCOPY . .                          пересобирается\nCMD ...                           пересобирается\n```\n\nЕсли изменился `requirements.txt`:\n\n```text\nFROM python:3.12-slim             CACHED\nWORKDIR /app                      CACHED\nCOPY requirements.txt .           пересобирается\nRUN pip install ...               пересобирается\nCOPY . .                          пересобирается\nCMD ...                           пересобирается\n```\n\n### Почему изменение раннего слоя пересобирает всё ниже\n\nDockerfile — это последовательная цепочка. Каждый следующий слой зависит от предыдущего.\n\n```text\nlayer 1\n  ↓\nlayer 2\n  ↓\nlayer 3\n  ↓\nlayer 4\n```\n\nЕсли изменился `layer 2`, Docker уже не может безопасно использовать старые `layer 3` и `layer 4`, потому что они были построены поверх старого состояния `layer 2`.\n\nПоэтому важно не ставить часто меняющиеся инструкции в начало Dockerfile.\n\nПлохо:\n\n```dockerfile\nCOPY . .\nRUN pip install -r requirements.txt\n```\n\nЛучше:\n\n```dockerfile\nCOPY requirements.txt .\nRUN pip install -r requirements.txt\nCOPY . .\n```\n\n### Что именно ломает кэш\n\nКэш может сброситься, если:\n\n```text\nизменилась инструкция Dockerfile;\nизменился файл, который участвует в COPY или ADD;\nизменился порядок инструкций;\nизменилась base image;\nизменилась build argument, влияющая на слой;\nпредыдущий слой был пересобран.\n```\n\nНапример, было:\n\n```dockerfile\nRUN pip install -r requirements.txt\n```\n\nСтало:\n\n```dockerfile\nRUN pip install --no-cache-dir -r requirements.txt\n```\n\nДля Docker это уже другая инструкция, значит старый кэш не подходит.\n\n### `.dockerignore` тоже влияет на кэш\n\nBuild context — это набор файлов, доступных Docker во время сборки. Docker Docs определяет build context как набор файлов, к которым сборка может обращаться. \n\nЕсли в build context попадают лишние изменяющиеся файлы, они могут ломать кэш.\n\nНапример, без `.dockerignore` в сборку могут попадать:\n\n```text\n.git\n.idea\n.vscode\n__pycache__\n.pytest_cache\n.venv\nlogs\n.env\n```\n\nХороший `.dockerignore`:\n\n```dockerignore\n.git\n.idea\n.vscode\n__pycache__\n*.pyc\n.pytest_cache\n.venv\nvenv\n.env\nlogs\n```\n\nЭто уменьшает build context и снижает вероятность лишней invalidation.\n\n### `RUN apt-get update` и кэш\n\nЕсть важная ловушка:\n\n```dockerfile\nRUN apt-get update\nRUN apt-get install -y curl\n```\n\nТак делать плохо, потому что `apt-get update` может взяться из старого кэша, а `apt-get install` получит устаревшие package lists.\n\nЛучше объединять:\n\n```dockerfile\nRUN apt-get update && apt-get install -y \\\n    curl \\\n    gcc \\\n    && rm -rf /var/lib/apt/lists/*\n```\n\nТак установка пакетов и обновление индекса находятся в одном слое.\n\n### Как отключить кэш\n\nДля полностью чистой сборки:\n\n```bash\ndocker build --no-cache -t backend .\n```\n\nФлаг `--no-cache` отключает build cache и заставляет Docker пересобрать все слои с нуля. Docker Docs отдельно указывает, что `--no-cache` forcing Docker to rebuild all layers from scratch. ([Docker Documentation](https://docs.docker.com/build/building/best-practices/?utm_source=chatgpt.com \"Building best practices\"))\n\nНо важно: `--no-cache` не обязательно скачивает свежую base image. Для этого используют:\n\n```bash\ndocker build --pull --no-cache -t backend .\n```\n\n### Практическое правило\n\nDockerfile нужно писать так, чтобы сверху были редкие изменения, а снизу частые:\n\n```text\n1. FROM base image\n2. системные зависимости\n3. dependency-файлы: requirements.txt / pyproject.toml / package.json\n4. установка зависимостей\n5. исходный код приложения\n6. команда запуска\n```\n\nПример:\n\n```dockerfile\nFROM python:3.12-slim\n\nWORKDIR /app\n\nRUN apt-get update && apt-get install -y \\\n    gcc \\\n    && rm -rf /var/lib/apt/lists/*\n\nCOPY requirements.txt .\n\nRUN pip install --no-cache-dir -r requirements.txt\n\nCOPY app ./app\n\nCMD [\"uvicorn\", \"app.main:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]\n```\n\n### Коротко \n\nDocker кэширует результат выполнения инструкций Dockerfile. При следующей сборке он идёт сверху вниз и проверяет, можно ли переиспользовать слой. Если инструкция и связанные с ней файлы не изменились, слой берётся из кэша. Если какой-то слой изменился, этот слой и все слои ниже пересобираются.\n\nПоэтому Dockerfile нужно строить так, чтобы редко изменяемые шаги были выше, а часто изменяемые ниже. Например, сначала копируют `requirements.txt` и устанавливают зависимости, а только потом копируют весь исходный код. Это позволяет не переустанавливать зависимости при каждом изменении кода приложения."
  popularity = 2.63

[[questions]]
  id = 26
  question = "Какие Linux-команды чаще всего использует backend-разработчик?"
  answer = "### Базовый набор\n\nBackend-разработчик чаще всего использует Linux-команды для работы с файлами, логами, процессами, сетью, сервисами, правами доступа, Docker и базой данных. Базовые команды вроде `ls`, `cp`, `mv`, `rm`, `cat`, `mkdir`, `chmod`, `chown` относятся к GNU Coreutils — стандартному набору утилит для работы с файлами и текстом в GNU/Linux-системах. \n\n### 1. Навигация по файловой системе\n\n```bash\npwd\nls\nls -la\ncd /path/to/project\ntree\n```\n\nНазначение:\n\n```text\npwd      показать текущую директорию\nls       показать файлы\nls -la   показать все файлы, включая скрытые\ncd       перейти в директорию\ntree     показать структуру каталогов деревом\n```\n\nПример:\n\n```bash\ncd /var/www/backend\nls -la\npwd\n```\n\n### 2. Работа с файлами и папками\n\n```bash\ntouch app.log\nmkdir logs\nmkdir -p app/config/local\ncp settings.py settings.example.py\nmv old_name.py new_name.py\nrm file.txt\nrm -rf __pycache__\n```\n\nНазначение:\n\n```text\ntouch     создать пустой файл или обновить время изменения\nmkdir     создать директорию\ncp        скопировать файл\nmv        переместить или переименовать\nrm        удалить файл\nrm -rf    удалить директорию рекурсивно и без подтверждения\n```\n\n`rm -rf` нужно использовать осторожно: команда удаляет рекурсивно и без интерактивного подтверждения.\n\n### 3. Просмотр содержимого файлов\n\n```bash\ncat .env\nless app.log\nhead -n 50 app.log\ntail -n 100 app.log\ntail -f app.log\n```\n\nНазначение:\n\n```text\ncat       быстро вывести файл\nless      удобно читать большой файл\nhead      показать начало файла\ntail      показать конец файла\ntail -f   смотреть файл в реальном времени\n```\n\nЧастый пример для логов:\n\n```bash\ntail -f /var/log/nginx/error.log\n```\n\n### 4. Поиск по файлам и тексту\n\n```bash\nfind . -name \"*.py\"\nfind . -name \"*.log\"\ngrep \"ERROR\" app.log\ngrep -r \"DATABASE_URL\" .\ngrep -rn \"UserRepository\" .\n```\n\nНазначение:\n\n```text\nfind      искать файлы и директории\ngrep      искать текст\n-r        рекурсивно\n-n        показывать номер строки\n```\n\n`find` проходит по дереву каталогов и ищет файлы по заданному выражению, а `grep` ищет строки по шаблону в файлах или входном потоке. \n\nПрактический пример:\n\n```bash\ngrep -rn \"SECRET_KEY\" .\n```\n\nТак можно найти, где в проекте используется `SECRET_KEY`.\n\n### 5. Права доступа и владельцы\n\n```bash\nchmod +x entrypoint.sh\nchmod 600 .env\nchmod 644 config.yaml\nchown appuser:appuser app.log\nchown -R appuser:appuser /var/www/backend\n```\n\nНазначение:\n\n```text\nchmod     изменить права доступа\nchown     изменить владельца и группу\n```\n\nТипичные права:\n\n```text\n600   файл доступен только владельцу\n644   обычный конфиг или текстовый файл\n755   исполняемый файл или директория\n```\n\nПример для скрипта запуска:\n\n```bash\nchmod +x entrypoint.sh\n```\n\n### 6. Процессы\n\n```bash\nps aux\nps aux | grep uvicorn\ntop\nhtop\nkill 12345\nkill -9 12345\npgrep python\npkill -f uvicorn\n```\n\nНазначение:\n\n```text\nps       показать процессы\ntop      интерактивный монитор процессов\nhtop     более удобный top, если установлен\nkill     отправить сигнал процессу\npgrep    найти PID по имени процесса\npkill    завершить процесс по имени\n```\n\nУтилиты `ps`, `top`, `free`, `pgrep`, `pkill` входят в семейство procps/procps-ng и используются для просмотра процессов, памяти и состояния системы. \n\nПример:\n\n```bash\nps aux | grep gunicorn\n```\n\n### 7. Память, CPU, диск\n\n```bash\nfree -h\ndf -h\ndu -sh .\ndu -sh /var/log/*\nuptime\n```\n\nНазначение:\n\n```text\nfree -h       показать RAM\ndf -h         показать свободное место на дисках\ndu -sh        показать размер директории\nuptime        показать время работы системы и load average\n```\n\nЧастый пример:\n\n```bash\ndf -h\ndu -sh /var/lib/docker\n```\n\nТак можно быстро понять, не забит ли диск логами, Docker-образами или volume.\n\n### 8. Сеть\n\n```bash\nip addr\nip route\nss -tulpen\ncurl http://localhost:8000/health\ncurl -I https://example.com\nping 8.8.8.8\ndig example.com\nnslookup example.com\n```\n\nНазначение:\n\n```text\nip addr       показать сетевые интерфейсы и IP\nip route      показать маршруты\nss -tulpen    показать открытые порты и процессы\ncurl          сделать HTTP-запрос\nping          проверить доступность хоста\ndig/nslookup  проверить DNS\n```\n\n`ss` используется для просмотра socket statistics и может показывать TCP-соединения, listening-порты и связанную сетевую информацию; `curl` — инструмент для передачи данных по URL, включая HTTP/HTTPS-запросы. \n\nПримеры:\n\n```bash\nss -tulpen | grep 8000\ncurl http://localhost:8000/health\ncurl -X POST http://localhost:8000/api/login\n```\n\n### 9. Логи systemd-сервисов\n\n```bash\njournalctl\njournalctl -u nginx\njournalctl -u backend.service\njournalctl -u backend.service -f\njournalctl -u backend.service --since \"1 hour ago\"\n```\n\nНазначение:\n\n```text\njournalctl -u service   посмотреть логи конкретного сервиса\n-f                      смотреть логи в реальном времени\n--since                 фильтр по времени\n```\n\n`journalctl` используется для вывода логов, сохранённых systemd-journald. \n\nПример:\n\n```bash\njournalctl -u gunicorn.service -f\n```\n\n### 10. Управление сервисами через systemd\n\n```bash\nsystemctl status nginx\nsystemctl start nginx\nsystemctl stop nginx\nsystemctl restart nginx\nsystemctl reload nginx\nsystemctl enable nginx\nsystemctl disable nginx\n```\n\nНазначение:\n\n```text\nstatus    статус сервиса\nstart     запустить\nstop      остановить\nrestart   перезапустить\nreload    перечитать конфиг без полного рестарта, если сервис поддерживает\nenable    добавить в автозапуск\ndisable   убрать из автозапуска\n```\n\nЧастый пример после изменения nginx-конфига:\n\n```bash\nsudo nginx -t\nsudo systemctl reload nginx\n```\n\n### 11. SSH и копирование файлов\n\n```bash\nssh user@server\nssh user@server \"docker ps\"\nscp file.txt user@server:/tmp/\nrsync -av ./app user@server:/var/www/app\n```\n\nНазначение:\n\n```text\nssh      подключиться к серверу или выполнить удалённую команду\nscp      скопировать файл по SSH\nrsync    синхронизировать директории\n```\n\nOpenSSH включает `ssh` как клиент для удалённого входа и выполнения команд, а также связанные утилиты вроде `scp`, `ssh-agent`, `ssh-add`. \n\nПример:\n\n```bash\nssh deploy@10.0.0.5\n```\n\n### 12. Архивы\n\n```bash\ntar -czf logs.tar.gz logs/\ntar -xzf logs.tar.gz\ngzip app.log\ngunzip app.log.gz\n```\n\nНазначение:\n\n```text\ntar -czf   создать .tar.gz архив\ntar -xzf   распаковать .tar.gz архив\ngzip       сжать файл\ngunzip     распаковать .gz файл\n```\n\n`tar` используется для создания и распаковки архивов, а `gzip` — для сжатия и распаковки файлов. \n\n### 13. Переменные окружения\n\n```bash\nenv\nprintenv\necho $PATH\nexport DEBUG=1\nexport DATABASE_URL=\"postgresql://user:pass@localhost:5432/db\"\n```\n\nНазначение:\n\n```text\nenv        вывести окружение\nprintenv   вывести переменные окружения\necho $VAR   вывести конкретную переменную\nexport     задать переменную для текущей shell-сессии\n```\n\nЧастый пример:\n\n```bash\necho $DATABASE_URL\n```\n\n### 14. Пакетные менеджеры\n\nДля Debian/Ubuntu:\n\n```bash\nsudo apt update\nsudo apt install nginx\nsudo apt install postgresql-client\n```\n\nДля Alpine:\n\n```bash\napk add curl\napk add postgresql-client\n```\n\nДля RHEL/CentOS/Fedora:\n\n```bash\nsudo dnf install nginx\n```\n\nBackend-разработчик часто ставит:\n\n```text\ncurl\ngit\nnginx\npostgresql-client\nredis-tools\nhtop\nnet-tools\n```\n\n### 15. Git на сервере\n\n```bash\ngit status\ngit pull\ngit log --oneline\ngit branch\ngit checkout main\ngit reset --hard HEAD\n```\n\nНазначение:\n\n```text\ngit status        состояние репозитория\ngit pull          забрать изменения\ngit log           история коммитов\ngit checkout      переключить ветку\ngit reset --hard  жёстко откатить рабочую директорию\n```\n\nНа production-серверах напрямую через `git pull` деплоят не всегда, но на учебных, тестовых и небольших проектах это часто встречается.\n\n### 16. Docker-команды, которые backend-разработчик часто использует в Linux\n\n```bash\ndocker ps\ndocker ps -a\ndocker logs backend\ndocker logs -f backend\ndocker exec -it backend sh\ndocker restart backend\ndocker images\ndocker volume ls\ndocker network ls\ndocker compose up -d\ndocker compose down\ndocker compose logs -f backend\n```\n\nНазначение:\n\n```text\ndocker ps              контейнеры\ndocker logs            логи контейнера\ndocker exec            выполнить команду внутри контейнера\ndocker restart         перезапустить контейнер\ndocker compose up -d   поднять compose-проект\ndocker compose down    остановить compose-проект\n```\n\nDocker CLI имеет отдельную справочную документацию по командам, а `docker logs` используется для получения логов контейнера. \n\n### 17. PostgreSQL через терминал\n\n```bash\npsql -h localhost -U postgres -d app_db\npsql \"$DATABASE_URL\"\npg_dump -h localhost -U postgres app_db > dump.sql\npsql -h localhost -U postgres app_db < dump.sql\n```\n\nНазначение:\n\n```text\npsql      подключение к PostgreSQL\npg_dump   создать SQL-дамп базы\n```\n\n`psql` — терминальный клиент PostgreSQL, через который можно выполнять SQL-запросы интерактивно или из файла. \n\nПример:\n\n```bash\npsql -h localhost -U app_user -d app_db\n```\n\n### 18. Самые важные команды для собеседования\n\nМинимум, который backend-разработчик должен уверенно знать:\n\n```bash\ncd\nls -la\npwd\ncat\nless\ntail -f\ngrep -rn\nfind\nchmod\nchown\nps aux\nkill\ntop\nfree -h\ndf -h\ndu -sh\ncurl\nss -tulpen\nssh\nscp\nsystemctl status\njournalctl -u service -f\ndocker ps\ndocker logs -f\ndocker exec -it\ndocker compose up -d\n```\n\n### Коротко\n\nBackend-разработчик чаще всего использует Linux-команды для навигации по файловой системе, просмотра логов, диагностики процессов, проверки сети, управления сервисами и работы с Docker. Например, `ls`, `cd`, `cat`, `less`, `tail -f`, `grep`, `find`, `ps`, `top`, `kill`, `df`, `du`, `free`, `curl`, `ss`, `ssh`, `systemctl`, `journalctl`, `docker ps`, `docker logs` и `docker exec`. Эти команды нужны, чтобы смотреть состояние сервера, читать логи приложения, проверять порты, перезапускать сервисы, заходить в контейнеры и быстро диагностировать проблемы backend-сервиса."
  popularity = 2.63

[[questions]]
  id = 27
  question = "Как изменить права на файл в Linux?"
  answer = "Права на файл в Linux меняют командой:\n\n```bash\nchmod MODE FILE\n```\n\nПример:\n\n```bash\nchmod 644 config.yaml\nchmod +x entrypoint.sh\nchmod 600 .env\n```\n\n`chmod` изменяет file mode bits — биты режима файла, которые определяют права доступа к файлу или директории. Права можно задавать в символьной форме или в числовой/octal форме. \n\n### Как посмотреть текущие права\n\n```bash\nls -l\n```\n\nПример вывода:\n\n```text\n-rw-r--r-- 1 user user 1200 Jun 27  app.py\n```\n\nРазбор:\n\n```text\n- rw- r-- r--\n│ │   │   │\n│ │   │   └── others: остальные пользователи\n│ │   └────── group: группа\n│ └────────── user/owner: владелец\n└──────────── тип файла\n```\n\nПрава делятся на 3 группы:\n\n```text\nu   user / owner / владелец\ng   group / группа\no   others / остальные\na   all / все\n```\n\n### Что означают `r`, `w`, `x`\n\n```text\nr   read      чтение\nw   write     запись/изменение\nx   execute   выполнение\n```\n\nДля обычного файла:\n\n```text\nr   можно читать файл\nw   можно изменять файл\nx   можно запускать как программу/скрипт\n```\n\nДля директории смысл немного другой:\n\n```text\nr   можно посмотреть список файлов\nw   можно создавать/удалять/переименовывать файлы\nx   можно входить в директорию и проходить через неё\n```\n\n### Числовой режим `chmod`\n\nКаждое право имеет число:\n\n```text\nr = 4\nw = 2\nx = 1\n```\n\nПрава складываются:\n\n```text\n7 = 4 + 2 + 1 = rwx\n6 = 4 + 2     = rw-\n5 = 4 + 1     = r-x\n4 = 4         = r--\n0 = нет прав  = ---\n```\n\nВ man page `chmod` указано, что numeric mode строится из octal digits, где права складываются из значений `4`, `2`, `1`. \n\n### Примеры числовых прав\n\n```bash\nchmod 644 file.txt\n```\n\nОзначает:\n\n```text\nowner:  rw-  = 6\ngroup:  r--  = 4\nothers: r--  = 4\n```\n\nТо есть:\n\n```text\n-rw-r--r--\n```\n\n---\n\n```bash\nchmod 600 .env\n```\n\nОзначает:\n\n```text\nowner:  rw-  = 6\ngroup:  ---  = 0\nothers: ---  = 0\n```\n\nТо есть:\n\n```text\n-rw-------\n```\n\nТак часто ставят права на `.env`, приватные ключи и чувствительные конфиги.\n\n---\n\n```bash\nchmod 755 entrypoint.sh\n```\n\nОзначает:\n\n```text\nowner:  rwx  = 7\ngroup:  r-x  = 5\nothers: r-x  = 5\n```\n\nТо есть:\n\n```text\n-rwxr-xr-x\n```\n\nТак часто делают исполняемые скрипты.\n\n### Символьный режим `chmod`\n\nВместо чисел можно использовать символьную форму:\n\n```bash\nchmod u+x script.sh\n```\n\nОзначает:\n\n```text\nu   user/owner\n+   добавить право\nx   execute\n```\n\nТо есть добавить владельцу право на выполнение.\n\nОсновные операторы:\n\n```text\n+   добавить право\n-   убрать право\n=   выставить ровно такие права\n```\n\nGNU Coreutils описывает symbolic modes как способ менять права через категории пользователей `u`, `g`, `o`, `a`, операторы `+`, `-`, `=` и права `r`, `w`, `x`. \n\n### Примеры символьного режима\n\nДобавить выполнение владельцу:\n\n```bash\nchmod u+x script.sh\n```\n\nДобавить выполнение всем:\n\n```bash\nchmod +x script.sh\n```\n\nУбрать запись у группы и остальных:\n\n```bash\nchmod go-w file.txt\n```\n\nУбрать все права у группы и остальных:\n\n```bash\nchmod go-rwx .env\n```\n\nВыставить владельцу `rw`, группе и остальным только чтение:\n\n```bash\nchmod u=rw,g=r,o=r file.txt\n```\n\nЭто примерно то же самое, что:\n\n```bash\nchmod 644 file.txt\n```\n\n### Рекурсивное изменение прав\n\nДля директории и всех файлов внутри используют `-R`:\n\n```bash\nchmod -R 755 /var/www/app\n```\n\nНо с `-R` нужно быть осторожным. Например, если сделать `chmod -R 777`, ты дашь всем пользователям право читать, изменять и выполнять всё внутри директории.\n\nОбычно для backend-проекта безопаснее так:\n\n```bash\nfind /var/www/app -type d -exec chmod 755 {} \\;\nfind /var/www/app -type f -exec chmod 644 {} \\;\n```\n\nТо есть:\n\n```text\nдиректории: 755\nфайлы:      644\n```\n\nДля исполняемых скриптов отдельно:\n\n```bash\nchmod +x /var/www/app/entrypoint.sh\n```\n\n### Частые значения прав\n\n```text\n600   приватный файл: .env, private key\n644   обычный файл: config, .py, .txt\n700   приватная директория или скрипт только для владельца\n755   директория или исполняемый скрипт\n777   полный доступ всем, обычно плохая практика\n```\n\n### Пример для backend-разработчика\n\nФайл `.env`:\n\n```bash\nchmod 600 .env\n```\n\nСкрипт запуска контейнера:\n\n```bash\nchmod +x entrypoint.sh\n```\n\nФайлы проекта:\n\n```bash\nfind . -type f -exec chmod 644 {} \\;\nfind . -type d -exec chmod 755 {} \\;\n```\n\nЛоги, которые должен писать пользователь `appuser`:\n\n```bash\nsudo chown appuser:appuser app.log\nchmod 644 app.log\n```\n\nВажно: `chmod` меняет права, а `chown` меняет владельца файла.\n\n### Коротко \n\n`chmod` — это команда для изменения прав доступа к файлам и директориям в Linux. Права делятся на три группы: владелец, группа и остальные пользователи. Для каждой группы можно задать чтение `r`, запись `w` и выполнение `x`.\n\nПрава можно задавать численно:\n\n```bash\nchmod 644 file.txt\nchmod 755 script.sh\nchmod 600 .env\n```\n\nИли символически:\n\n```bash\nchmod +x script.sh\nchmod u+x script.sh\nchmod go-rwx .env\n```\n\nЧисла считаются так:\n\n```text\nr = 4\nw = 2\nx = 1\n```\n\nПоэтому `755` означает:\n\n```text\nowner:  rwx\ngroup:  r-x\nothers: r-x\n```"
  popularity = 2.63

