[[questions]]
  id = 2
  question = "Что представляют собой NoSQL-базы данных, какие задачи они решают и чем они принципиально отличаются от реляционных СУБД?"
  answer = "### Что такое NoSQL-базы данных\n\nNoSQL-базы данных — это класс баз данных, которые хранят и обрабатывают данные не только в классической табличной реляционной модели `таблицы → строки → колонки`.\n\nNoSQL означает не обязательно «без SQL», а чаще — `Not Only SQL`, то есть «не только SQL». Это подход к хранению данных вне традиционной структуры реляционных БД. \n\nВместо строгой табличной модели NoSQL-БД могут использовать разные модели данных:\n\n```text\nkey-value       → ключ-значение\ndocument        → документы JSON/BSON\nwide-column     → широкие колонки / column families\ngraph           → графы: вершины и связи\ntime-series     → временные ряды\nsearch/vector   → поиск, векторные данные\n```\n\nAWS в своей документации описывает NoSQL как класс БД с разными моделями данных: key-value, document, graph и column-oriented, оптимизированными под производительность и масштабирование. \n\n### Пример реляционной модели\n\nВ реляционной БД данные обычно нормализованы по таблицам:\n\n```text\nusers\n-----\nid | username | email\n\norders\n------\nid | user_id | total_price\n\norder_items\n-----------\nid | order_id | product_id | count\n```\n\nСвязи строятся через:\n\n```text\nprimary key\nforeign key\nJOIN\nconstraints\ntransactions\n```\n\nНапример:\n\n```sql\nSELECT users.username, orders.total_price\nFROM users\nJOIN orders ON orders.user_id = users.id;\n```\n\nРеляционная БД хорошо подходит, когда данные имеют чёткую структуру и между ними важны строгие связи.\n\n### Пример document NoSQL\n\nВ document database данные могут храниться одним документом:\n\n```json\n{\n  \"id\": 1,\n  \"username\": \"alex\",\n  \"email\": \"alex@example.com\",\n  \"orders\": [\n    {\n      \"id\": 100,\n      \"total_price\": 2500,\n      \"items\": [\n        {\"product_id\": 10, \"count\": 2},\n        {\"product_id\": 15, \"count\": 1}\n      ]\n    }\n  ]\n}\n```\n\nЗдесь данные не разнесены по нескольким таблицам. Вся нужная структура может лежать внутри одного документа.\n\nЭто удобно, когда приложение часто читает объект целиком: например, профиль пользователя, настройки, корзину, карточку товара, контентную страницу.\n\n### Какие задачи решают NoSQL-БД\n\nNoSQL-БД появились как ответ на задачи, где классическая реляционная модель может быть неудобной или тяжёлой.\n\n### 1. Гибкая структура данных\n\nВ реляционной БД обычно заранее задаётся схема:\n\n```text\nтаблица users\nколонка username VARCHAR\nколонка email VARCHAR\nколонка created_at TIMESTAMP\n```\n\nЧтобы добавить новое поле, часто нужна миграция.\n\nВ document NoSQL разные документы могут иметь разную структуру:\n\n```json\n{\n  \"username\": \"alex\",\n  \"email\": \"alex@example.com\"\n}\n```\n\n```json\n{\n  \"username\": \"john\",\n  \"email\": \"john@example.com\",\n  \"avatar_url\": \"https://example.com/avatar.png\",\n  \"settings\": {\n    \"theme\": \"dark\"\n  }\n}\n```\n\nЭто удобно, когда данные часто меняются или заранее неизвестна полная структура объекта.\n\n### 2. Высокая горизонтальная масштабируемость\n\nМногие NoSQL-БД проектировались под распределённое хранение данных на нескольких узлах.\n\nНапример, Apache Cassandra официально описывается как распределённая NoSQL-БД с wide-column моделью и eventual consistency.\n\nТо есть данные можно распределять по нескольким серверам:\n\n```text\nnode 1 → часть данных\nnode 2 → часть данных\nnode 3 → часть данных\nnode 4 → часть данных\n```\n\nЭто полезно для систем с большим объёмом данных и высокой нагрузкой:\n\n```text\nлоги\nсобытия\nметрики\nсоциальные сети\nчат-системы\nIoT\nаналитика\nhigh-load backend\n```\n\n### 3. Быстрый доступ по ключу\n\nKey-value базы хранят данные по принципу:\n\n```text\nключ → значение\n```\n\nПример:\n\n```text\n\"user:100:session\" → \"{token: ..., expires_at: ...}\"\n\"product:50:stock\" → \"142\"\n```\n\nRedis, например, предоставляет разные структуры данных: strings, hashes, lists, sets, sorted sets, streams, time series и другие. \n\nТакие БД часто используют для:\n\n```text\nкэша\nсессий\nrate limiting\nочередей\nвременных токенов\nбыстрых счётчиков\nreal-time данных\n```\n\n### 4. Хранение слабоструктурированных данных\n\nNoSQL хорошо подходит, когда данные не укладываются в строгую табличную модель.\n\nНапример:\n\n```text\nJSON-документы\nлоги\nсобытия\nпользовательские настройки\nкаталоги товаров с разными характеристиками\nконтентные страницы\nанкеты с динамическими полями\n```\n\nВ реляционной БД для таких данных иногда приходится делать много nullable-колонок или использовать отдельные таблицы свойств.\n\nНапример:\n\n```text\nproduct_id | property_name | property_value\n```\n\nЭто может усложнять запросы и поддержку.\n\n### 5. Работа с графовыми связями\n\nGraph-базы удобны, когда важны не только объекты, но и связи между ними.\n\nПример:\n\n```text\nПользователь → подписан на → Пользователь\nПользователь → лайкнул → Пост\nПользователь → купил → Товар\nТовар → похож на → Товар\n```\n\nТакая модель подходит для:\n\n```text\nсоциальных графов\nрекомендательных систем\nантифрод-систем\nграфов зависимостей\nмаршрутов\nсетевых связей\n```\n\n### Основные типы NoSQL-БД\n\n### 1. Key-value\n\nДанные хранятся как ключ и значение.\n\n```text\nsession:abc123 → user_id=10\n```\n\nПримеры задач:\n\n```text\nкэш\nсессии\nтокены\nrate limiting\nбыстрые настройки\n```\n\nПример БД:\n\n```text\nRedis\nDynamoDB в key-value сценариях\n```\n\n### 2. Document database\n\nДанные хранятся как документы, обычно JSON/BSON.\n\n```json\n{\n  \"id\": 1,\n  \"title\": \"Phone\",\n  \"price\": 900,\n  \"attributes\": {\n    \"color\": \"black\",\n    \"memory\": \"256GB\"\n  }\n}\n```\n\nПримеры задач:\n\n```text\nкаталоги товаров\nпрофили пользователей\nCMS\nнастройки\nанкеты\nконтент\n```\n\nПримеры БД:\n\n```text\nMongoDB\nCouchDB\nAmazon DocumentDB\n```\n\n### 3. Wide-column\n\nДанные хранятся в строках и column families, но структура более гибкая, чем в классической реляционной таблице.\n\nAWS описывает wide-column store как NoSQL-БД, где данные организованы в column families, строки имеют уникальный row key, а колонки могут различаться. \n\nПримеры задач:\n\n```text\nбольшие логи\nсобытия\nметрики\nаналитика\nданные с высокой записью\n```\n\nПримеры БД:\n\n```text\nApache Cassandra\nScyllaDB\nHBase\n```\n\n### 4. Graph database\n\nДанные представлены как граф:\n\n```text\nвершины → объекты\nрёбра   → связи между объектами\n```\n\nПримеры задач:\n\n```text\nсоциальные сети\nрекомендации\nантифрод\nпоиск связей\nграфы зависимостей\n```\n\nПримеры БД:\n\n```text\nNeo4j\nAmazon Neptune\nArangoDB\n```\n\n### Чем NoSQL принципиально отличается от реляционных СУБД\n\n### 1. Модель данных\n\nРеляционная БД:\n\n```text\nтаблицы\nстроки\nколонки\nсвязи\nJOIN\nстрогая схема\n```\n\nNoSQL:\n\n```text\nдокументы\nключ-значение\nграфы\nwide-column\nгибкая схема\nчасто денормализация\n```\n\nГлавное отличие: реляционная БД строится вокруг таблиц и связей, а NoSQL-БД обычно выбирает модель хранения под конкретный тип доступа к данным.\n\n### 2. Схема данных\n\nРеляционная БД обычно требует заранее определённую схему:\n\n```sql\nCREATE TABLE users (\n    id SERIAL PRIMARY KEY,\n    email VARCHAR(255) NOT NULL UNIQUE\n);\n```\n\nNoSQL часто допускает более гибкую структуру:\n\n```json\n{\n  \"email\": \"test@example.com\"\n}\n```\n\n```json\n{\n  \"email\": \"test@example.com\",\n  \"phone\": \"+994...\",\n  \"settings\": {\n    \"theme\": \"dark\"\n  }\n}\n```\n\nНо это не значит, что в NoSQL схема вообще не нужна. Просто часто она контролируется не самой БД, а приложением.\n\n### 3. Нормализация против денормализации\n\nВ реляционных БД данные часто нормализуют:\n\n```text\nusers отдельно\norders отдельно\nproducts отдельно\norder_items отдельно\n```\n\nПлюс:\n\n```text\nменьше дублирования\nстрогие связи\nудобные JOIN\n```\n\nВ NoSQL часто данные денормализуют:\n\n```json\n{\n  \"user_id\": 1,\n  \"username\": \"alex\",\n  \"orders\": [\n    {\n      \"id\": 100,\n      \"items\": [\n        {\"name\": \"Keyboard\", \"price\": 100}\n      ]\n    }\n  ]\n}\n```\n\nПлюс:\n\n```text\nбыстро читать объект целиком\nменьше JOIN\nудобно масштабировать чтение\n```\n\nМинус:\n\n```text\nдублирование данных\nсложнее обновлять связанные данные\nбольше ответственности на уровне приложения\n```\n\n### 4. JOIN и связи\n\nРеляционные БД хорошо работают со связями:\n\n```sql\nSELECT *\nFROM users\nJOIN orders ON users.id = orders.user_id\nJOIN order_items ON orders.id = order_items.order_id;\n```\n\nВо многих NoSQL-БД JOIN либо отсутствует, либо ограничен, либо не является основной моделью работы.\n\nПоэтому в NoSQL часто заранее проектируют данные под конкретные запросы:\n\n```text\nкак приложение будет читать данные?\nкакие запросы самые частые?\nкакие данные выгоднее хранить вместе?\n```\n\n### 5. Транзакции и консистентность\n\nРеляционные СУБД традиционно сильны в ACID-транзакциях:\n\n```text\nAtomicity    → всё или ничего\nConsistency → данные остаются валидными\nIsolation   → параллельные транзакции не ломают друг друга\nDurability  → данные сохраняются после commit\n```\n\nNoSQL-БД часто делают другой компромисс:\n\n```text\nбольше масштабируемость\nбольше доступность\nвыше скорость записи\nно иногда слабее строгая консистентность\n```\n\nНапример, Cassandra официально указывает eventual consistency semantics. \n\nEventual consistency означает:\n\n```text\nданные на разных узлах могут стать одинаковыми не мгновенно,\nа через некоторое время\n```\n\nЭто не плохо само по себе. Это компромисс для распределённых систем.\n\n### 6. Масштабирование\n\nРеляционные БД часто масштабируют вертикально:\n\n```text\nбольше CPU\nбольше RAM\nбыстрее диск\nсильнее сервер\n```\n\nХотя современные реляционные БД тоже умеют репликацию, шардинг и кластеры, исторически их сложнее горизонтально масштабировать для некоторых типов нагрузки.\n\nNoSQL-БД часто изначально проектируются под горизонтальное масштабирование:\n\n```text\nдобавили node 4\nдобавили node 5\nданные распределились по кластеру\n```\n\nЭто одна из причин популярности NoSQL в high-load системах.\n\n### Сравнение кратко\n\n```text\nКритерий              SQL / RDBMS                 NoSQL\n---------------------------------------------------------------------\nМодель данных          таблицы                     документы, ключи, графы, колонки\nСхема                  строгая                     часто гибкая\nСвязи                  JOIN, FK                    часто денормализация\nТранзакции             сильная сторона             зависит от конкретной БД\nМасштабирование        чаще вертикальное           часто горизонтальное\nПодходит для           строгих структур            гибких/больших/распределённых данных\nЗапросы                SQL                         API/язык конкретной БД\nКонсистентность        обычно строгая              может быть eventual consistency\n```\n\n### Когда лучше использовать реляционную БД\n\nРеляционная БД обычно лучше, если:\n\n```text\nданные хорошо структурированы\nважны транзакции\nважны связи между сущностями\nнужны JOIN\nнужна строгая целостность данных\nесть финансовые операции\nесть сложная отчётность\n```\n\nПримеры:\n\n```text\nбанковские операции\nзаказы и платежи\nскладской учёт\nCRM\nERP\nадмин-панели\nтипичный backend с users/orders/payments\n```\n\nДля большинства стандартных backend-проектов PostgreSQL часто будет более правильным базовым выбором, чем NoSQL.\n\n### Когда лучше использовать NoSQL\n\nNoSQL подходит, если:\n\n```text\nданные плохо укладываются в таблицы\nсхема часто меняется\nнужно хранить большие объёмы событий\nнужно быстро читать/писать по ключу\nнужно горизонтальное масштабирование\nнужно хранить JSON-подобные документы\nнужно работать с графовыми связями\n```\n\nПримеры:\n\n```text\nкэш и сессии → Redis\nкаталог товаров → MongoDB / DocumentDB\nлоги и события → Cassandra / ClickHouse-like подходы\nсоциальные связи → Graph DB\nметрики и временные ряды → Time-series DB\n```\n\n### Важный момент\n\nNoSQL не является «заменой SQL во всём».\n\nПравильнее так:\n\n```text\nSQL    → когда важны структура, связи, транзакции, целостность\nNoSQL  → когда важны гибкость, масштабирование, быстрый доступ под конкретный сценарий\n```\n\nВ реальных проектах их часто используют вместе:\n\n```text\nPostgreSQL → основные бизнес-данные\nRedis      → кэш, сессии, rate limiting\nMongoDB    → гибкие документы\nElasticsearch/OpenSearch → поиск\nCassandra  → большие потоки событий\n```\n\n### Итог\n\nNoSQL-БД — это нереляционные базы данных, которые используют не только табличную модель, а разные способы хранения данных: ключ-значение, документы, графы, wide-column и другие.\n\nОни решают задачи:\n\n```text\nгибкой структуры данных\nгоризонтального масштабирования\nбыстрого доступа по ключу\nхранения больших объёмов событий\nработы со слабоструктурированными данными\nоптимизации под конкретные запросы приложения\n```\n\nПринципиальное отличие от реляционных СУБД:\n\n```text\nреляционная БД проектируется вокруг таблиц, связей и строгой схемы;\nNoSQL-БД проектируется вокруг конкретной модели доступа к данным и масштабирования.\n```"
  popularity = 2.63

[[questions]]
  id = 3
  question = "Какими свойствами классических реляционных БД жертвуют NoSQL-системы и ради каких преимуществ?"
  answer = "NoSQL-системы часто жертвуют частью свойств классических реляционных БД:\n\n```text\nстрогой схемой\nнормализацией\nJOIN\nforeign key\nсильными ACID-транзакциями\nстрогой консистентностью\nуниверсальностью SQL-запросов\n```\n\nРади чего:\n\n```text\nгоризонтального масштабирования\nвысокой доступности\nбыстрой записи/чтения\nгибкой структуры данных\nудобной работы с большими объёмами данных\nлучшей работы в распределённых системах\n```\n\nГлавный компромисс:\n\n```text\nменьше строгих гарантий и универсальности\n→ больше масштабируемости, гибкости и скорости под конкретный сценарий\n```\n\n### 1. Жертвуют строгой схемой\n\nВ реляционной БД схема обычно заранее задана:\n\n```sql\nCREATE TABLE users (\n    id SERIAL PRIMARY KEY,\n    email VARCHAR(255) NOT NULL UNIQUE,\n    age INTEGER\n);\n```\n\nБД сама контролирует:\n\n```text\nкакие поля есть\nкакие типы у полей\nкакие поля обязательны\nкакие ограничения действуют\n```\n\nВ NoSQL, особенно в document databases, структура часто гибче:\n\n```json\n{\n  \"username\": \"alex\",\n  \"email\": \"alex@example.com\"\n}\n```\n\n```json\n{\n  \"username\": \"john\",\n  \"email\": \"john@example.com\",\n  \"settings\": {\n    \"theme\": \"dark\",\n    \"language\": \"ru\"\n  }\n}\n```\n\nТо есть разные документы могут иметь разный набор полей.\n\nРади чего жертвуют:\n\n```text\nлегче менять структуру данных\nудобнее хранить JSON-подобные объекты\nменьше миграций схемы\nудобнее работать с динамическими полями\n```\n\nМинус:\n\n```text\nвалидация часто переезжает из БД в приложение\nлегче получить грязные или несовместимые данные\nсложнее поддерживать единый формат данных\n```\n\nAWS описывает NoSQL-БД как системы с разными моделями данных — key-value, document, graph, column — оптимизированными под производительность и масштабирование, в отличие от реляционной модели со строгой схемой таблиц и связей.\n\n### 2. Жертвуют нормализацией\n\nВ реляционной БД данные обычно нормализуют:\n\n```text\nusers\norders\norder_items\nproducts\n```\n\nДанные не дублируются без необходимости, а связи строятся через ключи.\n\nВ NoSQL часто используют денормализацию:\n\n```json\n{\n  \"user_id\": 1,\n  \"username\": \"alex\",\n  \"orders\": [\n    {\n      \"id\": 100,\n      \"items\": [\n        {\n          \"product_id\": 10,\n          \"name\": \"Keyboard\",\n          \"price\": 100\n        }\n      ]\n    }\n  ]\n}\n```\n\nЗдесь часть данных может дублироваться, зато объект удобно читать целиком.\n\nРади чего жертвуют:\n\n```text\nбыстрое чтение без JOIN\nменьше запросов к БД\nданные сразу лежат в форме, удобной приложению\nлегче масштабировать чтение\n```\n\nМинус:\n\n```text\nдублирование данных\nсложнее обновлять одни и те же данные в разных местах\nможет появиться рассинхронизация\n```\n\n### 3. Жертвуют JOIN и сложными связями\n\nРеляционные БД хорошо подходят для запросов со связями:\n\n```sql\nSELECT users.email, orders.total_price\nFROM users\nJOIN orders ON orders.user_id = users.id\nJOIN order_items ON order_items.order_id = orders.id;\n```\n\nВо многих NoSQL-БД `JOIN` либо отсутствует, либо не является основной моделью работы.\n\nВместо этого данные проектируют под конкретные запросы:\n\n```text\nкак будем читать данные?\nкакой объект нужен приложению целиком?\nкакие данные выгодно хранить рядом?\n```\n\nРади чего жертвуют:\n\n```text\nбыстрее чтение по заранее известному паттерну\nпроще распределять данные по узлам\nменьше дорогих межтабличных операций\n```\n\nМинус:\n\n```text\nсложнее делать ad-hoc аналитику\nсложнее менять паттерны запросов\nчасть логики связывания данных переходит в приложение\n```\n\n### 4. Жертвуют foreign key и строгой ссылочной целостностью\n\nВ реляционной БД можно сказать:\n\n```sql\nuser_id INTEGER REFERENCES users(id)\n```\n\nБД не даст создать заказ для несуществующего пользователя.\n\nВо многих NoSQL-БД таких строгих `foreign key`-ограничений нет. Приложение само должно следить, чтобы ссылки были валидными.\n\nРади чего жертвуют:\n\n```text\nпроще распределять данные\nбыстрее запись\nменьше координации между узлами\nменьше глобальных блокировок и проверок\n```\n\nМинус:\n\n```text\nможно получить ссылку на несуществующий объект\nсложнее гарантировать целостность данных\nнужны дополнительные проверки в коде\n```\n\n### 5. Жертвуют сильными ACID-транзакциями\n\nКлассическая реляционная БД сильна в транзакциях:\n\n```text\nAtomicity    → всё или ничего\nConsistency → данные остаются валидными\nIsolation   → транзакции не мешают друг другу\nDurability  → commit сохраняется\n```\n\nPostgreSQL, например, описывает транзакцию как набор операций, который выполняется как единая операция «всё или ничего»: промежуточные состояния не видны другим транзакциям, а при сбое незавершённые изменения не применяются. \n\nМногие NoSQL-БД исторически ослабляли транзакционные гарантии, особенно для операций между несколькими документами, партициями или узлами.\n\nРади чего жертвуют:\n\n```text\nвыше скорость записи\nменьше задержки\nлучше масштабирование\nлучше доступность при распределённой архитектуре\n```\n\nМинус:\n\n```text\nсложнее делать операции \"всё или ничего\"\nсложнее поддерживать строгую бизнес-целостность\nчасть компенсационной логики приходится писать вручную\n```\n\nВажная оговорка: современные NoSQL-БД не всегда полностью отказываются от транзакций. Например, MongoDB поддерживает распределённые транзакции между несколькими коллекциями, базами и документами, когда нужна атомарность read/write-операций.  Но в распределённых NoSQL-системах такие гарантии обычно имеют цену в виде задержек, сложности и потери части преимуществ масштабирования.\n\n### 6. Жертвуют строгой консистентностью\n\nВ классической реляционной БД после `COMMIT` обычно ожидается, что следующие чтения увидят актуальное состояние данных.\n\nВ распределённых NoSQL-БД часто возможна eventual consistency:\n\n```text\nзапись уже принята одним узлом\nно другие реплики могут увидеть её не мгновенно\nчерез некоторое время данные синхронизируются\n```\n\nНапример, Cassandra использует настраиваемые уровни консистентности: для каждой операции можно выбирать компромисс между консистентностью и доступностью. \n\nРади чего жертвуют:\n\n```text\nвысокая доступность\nработа при сетевых сбоях\nнизкая задержка\nмасштабирование на много узлов\nгеораспределённость\n```\n\nМинус:\n\n```text\nможно временно прочитать устаревшие данные\nразные пользователи могут увидеть разные версии\nнужно учитывать eventual consistency в бизнес-логике\n```\n\n### 7. Жертвуют универсальностью запросов\n\nSQL даёт мощный универсальный язык:\n\n```text\nJOIN\nGROUP BY\nHAVING\nподзапросы\nагрегации\nоконные функции\nсложные фильтры\n```\n\nВ NoSQL запросы чаще зависят от конкретной БД и модели данных.\n\nНапример:\n\n```text\nRedis       → доступ по ключу и структурам данных\nMongoDB     → запросы по документам\nCassandra   → запросы вокруг partition key\nNeo4j       → графовые запросы\n```\n\nРади чего жертвуют:\n\n```text\nлучше оптимизация под конкретный паттерн доступа\nпроще горизонтальное масштабирование\nбыстрее типовые операции\n```\n\nМинус:\n\n```text\nсложнее делать произвольные запросы\nнужно заранее проектировать модель под чтение\nмиграция между NoSQL-БД сложнее\n```\n\n### 8. Жертвуют частью изоляции и предсказуемости конкурентного доступа\n\nВ реляционных БД есть развитые уровни изоляции транзакций:\n\n```text\nREAD COMMITTED\nREPEATABLE READ\nSERIALIZABLE\n```\n\nВ NoSQL всё зависит от конкретной системы. Где-то есть сильные гарантии на уровне одного документа, но слабее гарантии между несколькими объектами. Где-то консистентность настраивается на уровне операции.\n\nРади чего жертвуют:\n\n```text\nменьше блокировок\nвыше throughput\nбыстрее параллельные записи\nлучше работа в кластере\n```\n\nМинус:\n\n```text\nсложнее рассуждать о гонках данных\nнужны idempotency, versioning, compare-and-set, optimistic locking\n```\n\n### Связь с CAP-теоремой\n\nДля распределённых систем есть фундаментальный компромисс:\n\n```text\nConsistency  → все узлы видят одинаковые актуальные данные\nAvailability → система отвечает на запросы\nPartition tolerance → система переживает сетевые разделения\n```\n\nПри сетевом разделении нельзя одновременно идеально сохранить и строгую консистентность, и доступность. Поэтому разные NoSQL-системы выбирают разные компромиссы:\n\n```text\nCassandra-like подход:\nбольше доступность и масштабирование\nконсистентность может быть eventual/tunable\n\nMongoDB-like подход:\nбольше документная модель и удобство разработки\nчасть транзакционных гарантий доступна, но с ценой\n\nRedis-like подход:\nочень быстрый доступ по ключу\nно это не замена полноценной реляционной модели\n```\n\n### Сравнение\n\n```text\nЧем жертвуют                 Ради чего\n---------------------------------------------------------------------\nСтрогая схема                Гибкость структуры данных\nНормализация                 Быстрое чтение готовых объектов\nJOIN                          Масштабируемость и предсказуемое чтение\nForeign key                  Быстрая запись и слабая связанность данных\nСильные ACID-транзакции      Производительность и распределённость\nСтрогая консистентность      Доступность и низкая задержка\nУниверсальный SQL            Оптимизация под конкретный тип нагрузки\nГлобальная целостность       Горизонтальное масштабирование\n```\n\n### Пример на практике\n\nДля банковского перевода лучше реляционная БД:\n\n```text\nсписать деньги со счёта A\nзачислить деньги на счёт B\nзаписать транзакцию\nвсё должно быть атомарно\n```\n\nЗдесь важнее:\n\n```text\nACID\nстрогая консистентность\nизоляция транзакций\nцелостность данных\n```\n\nДля хранения событий кликов или логов может быть лучше NoSQL/wide-column/event storage:\n\n```text\nмиллионы событий\nбыстрая запись\nгоризонтальное масштабирование\nдопустима небольшая задержка синхронизации\n```\n\nЗдесь важнее:\n\n```text\nthroughput\navailability\nscalability\nнизкая задержка записи\n```\n\n### Итог\n\nNoSQL-системы обычно жертвуют не «надёжностью вообще», а частью классических реляционных гарантий:\n\n```text\nстрогой схемой\nнормализацией\nJOIN\nссылочной целостностью\nсильными транзакциями\nстрогой консистентностью\nуниверсальностью SQL-запросов\n```\n\nРади преимуществ:\n\n```text\nгибкая модель данных\nвысокая скорость\nгоризонтальное масштабирование\nработа на большом объёме данных\nвысокая доступность\nудобство хранения документов, событий, кэша, графов\n```\n\nГлавная мысль:\n\n```text\nSQL-БД чаще выбирают, когда важны связи, транзакции и строгая целостность.\n\nNoSQL чаще выбирают, когда важны масштабирование, гибкость модели данных и скорость под конкретный сценарий доступа.\n```"
