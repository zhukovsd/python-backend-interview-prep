  question = "Как ограничить (блокировать) доступ к базе данных с помощью Redis?"
  answer = "### Главное уточнение\n\nRedis сам по себе не «закрывает» доступ к PostgreSQL/MySQL напрямую. Обычно Redis ставят перед обращением к БД на уровне приложения:\n\n```text\nrequest → приложение → проверка Redis → разрешить/запретить запрос к БД\n```\n\nТо есть Redis используется как быстрый внешний механизм контроля:\n\n```text\nrate limit\ntemporary block\ndistributed lock\ncircuit breaker\ncache\n```\n\nНо настоящую защиту БД всё равно нужно делать отдельно:\n\n```text\nправа пользователя БД\nсетевые ACL/firewall\nзакрытый порт БД\nминимальные privileges\nconnection pool limit\n```\n\nRedis — это не security boundary для самой БД, а прикладной ограничитель перед обращением к ней.\n\n### 1. Временная блокировка пользователя\n\nСамый простой вариант — хранить в Redis ключ блокировки:\n\n```text\ndb:block:user:123 → 1\nTTL: 300 секунд\n```\n\nПока ключ существует — пользователю запрещён доступ к операциям, которые ходят в БД.\n\nRedis `SET` поддерживает `NX`, чтобы установить ключ только если его ещё нет, и `EX/PX`, чтобы сразу задать время жизни ключа. \n\nПример:\n\n```python\nimport redis\n\nredis_client = redis.Redis(\n    host=\"localhost\",\n    port=6379,\n    decode_responses=True,\n)\n\n\ndef block_user_db_access(user_id: int, ttl_seconds: int = 300) -> None:\n    redis_client.set(\n        name=f\"db:block:user:{user_id}\",\n        value=\"1\",\n        ex=ttl_seconds,\n    )\n\n\ndef is_user_blocked(user_id: int) -> bool:\n    return redis_client.exists(f\"db:block:user:{user_id}\") == 1\n\n\ndef get_user_data(user_id: int):\n    if is_user_blocked(user_id):\n        raise PermissionError(\"DB access temporarily blocked\")\n\n    # Здесь уже обращение к реальной БД\n    return user_repository.get_by_id(user_id)\n```\n\nСхема:\n\n```text\n1. Проверяем Redis\n2. Если ключ блокировки есть → не идём в БД\n3. Если ключа нет → выполняем запрос к БД\n```\n\n### 2. Ограничение частоты запросов к БД\n\nЕсли задача — не заблокировать полностью, а ограничить частоту обращений, используют rate limiting.\n\nНапример:\n\n```text\nне больше 100 запросов к БД в минуту на пользователя\n```\n\nВ Redis это часто делают через счётчик:\n\n```text\ndb:rate:user:123:2026-06-26T14:30 → 42\nTTL: 60 секунд\n```\n\nRedis официально описывает pattern rate limiter через `INCR` и `EXPIRE`: счётчик увеличивается при каждом запросе, а ключ автоматически удаляется после истечения окна времени. \n\nПример:\n\n```python\nimport time\n\n\ndef allow_db_request(user_id: int, limit: int = 100, window: int = 60) -> bool:\n    current_window = int(time.time()) // window\n    key = f\"db:rate:user:{user_id}:{current_window}\"\n\n    pipe = redis_client.pipeline()\n    pipe.incr(key)\n    pipe.expire(key, window)\n    current_count, _ = pipe.execute()\n\n    return current_count <= limit\n\n\ndef get_user_notifications(user_id: int):\n    if not allow_db_request(user_id, limit=100, window=60):\n        raise PermissionError(\"Too many DB requests\")\n\n    return notification_repository.list_by_user(user_id)\n```\n\nЛогика:\n\n```text\n1-й запрос  → counter = 1  → разрешить\n...\n100-й запрос → counter = 100 → разрешить\n101-й запрос → counter = 101 → заблокировать\n```\n\nДля атомарности `INCR` и `EXPIRE` обычно выполняют вместе через transaction/pipeline или Lua-скрипт. В документации Redis для rate limiting отдельно указывается использование `INCR` вместе с `EXPIRE` внутри `MULTI/EXEC`, чтобы операции были атомарными. \n\n### 3. Блокировка конкретной операции через distributed lock\n\nИногда нужно не запретить пользователю доступ к БД вообще, а не дать нескольким процессам одновременно выполнить одну критичную операцию.\n\nНапример:\n\n```text\nне запускать два пересчёта баланса одновременно\nне обрабатывать один заказ двумя воркерами\nне делать параллельную миграцию/синхронизацию\nне создавать один и тот же ресурс дважды\n```\n\nТогда используют Redis lock:\n\n```text\nlock:order:1001 → random_token\nTTL: 30 секунд\n```\n\nRedis описывает distributed locks как паттерн для взаимного исключения, когда разные процессы работают с общим ресурсом. \n\nПример:\n\n```python\nimport uuid\n\n\ndef acquire_lock(lock_key: str, ttl_seconds: int = 30) -> str | None:\n    token = str(uuid.uuid4())\n\n    acquired = redis_client.set(\n        name=lock_key,\n        value=token,\n        nx=True,\n        ex=ttl_seconds,\n    )\n\n    if acquired:\n        return token\n\n    return None\n```\n\nИспользование:\n\n```python\ndef recalculate_order(order_id: int):\n    lock_key = f\"lock:order:{order_id}\"\n    token = acquire_lock(lock_key, ttl_seconds=30)\n\n    if token is None:\n        raise RuntimeError(\"Operation is already running\")\n\n    try:\n        return order_service.recalculate(order_id)\n    finally:\n        release_lock(lock_key, token)\n```\n\nНо удалять lock простым `DEL lock_key` опасно. За время выполнения TTL мог истечь, другой процесс мог взять новый lock, а старый процесс случайно удалит чужую блокировку.\n\nПравильнее удалять lock только если значение совпадает с твоим token:\n\n```python\nRELEASE_LOCK_SCRIPT = \"\"\"\nif redis.call(\"get\", KEYS[1]) == ARGV[1] then\n    return redis.call(\"del\", KEYS[1])\nelse\n    return 0\nend\n\"\"\"\n\n\ndef release_lock(lock_key: str, token: str) -> None:\n    redis_client.eval(RELEASE_LOCK_SCRIPT, 1, lock_key, token)\n```\n\n### 4. Блокировка после нескольких неудачных попыток\n\nТиповой сценарий:\n\n```text\n5 неудачных попыток → заблокировать доступ на 15 минут\n```\n\nНапример, для защиты endpoint’а, который активно ходит в БД:\n\n```python\ndef register_failed_attempt(user_id: int) -> None:\n    key = f\"db:fail:user:{user_id}\"\n    attempts = redis_client.incr(key)\n\n    if attempts == 1:\n        redis_client.expire(key, 900)\n\n    if attempts >= 5:\n        redis_client.set(\n            name=f\"db:block:user:{user_id}\",\n            value=\"1\",\n            ex=900,\n        )\n\n\ndef check_db_access(user_id: int) -> None:\n    if redis_client.exists(f\"db:block:user:{user_id}\"):\n        ttl = redis_client.ttl(f\"db:block:user:{user_id}\")\n        raise PermissionError(f\"Blocked for {ttl} seconds\")\n```\n\nКоманда `TTL` позволяет узнать, сколько времени осталось до истечения ключа; Redis возвращает время жизни ключа в секундах. \n\n### 5. Circuit breaker перед БД\n\nRedis можно использовать как флаг: «БД перегружена, временно не пускаем тяжёлые операции».\n\nНапример:\n\n```text\ndb:circuit:heavy_queries → open\nTTL: 60 секунд\n```\n\nКод:\n\n```python\ndef check_heavy_queries_allowed() -> None:\n    if redis_client.exists(\"db:circuit:heavy_queries\"):\n        raise RuntimeError(\"Heavy DB queries are temporarily disabled\")\n\n\ndef run_heavy_report():\n    check_heavy_queries_allowed()\n\n    return report_repository.build_heavy_report()\n```\n\nТак можно временно отключить:\n\n```text\nтяжёлые отчёты\nмассовые выгрузки\nдорогие фильтры\nчастые пересчёты\n```\n\nНо обычные лёгкие запросы оставить доступными.\n\n### 6. Кэширование, чтобы реже ходить в БД\n\nЭто не блокировка, но тоже способ ограничить нагрузку на БД.\n\n```python\nimport json\n\n\ndef get_user_profile(user_id: int):\n    cache_key = f\"user:profile:{user_id}\"\n\n    cached = redis_client.get(cache_key)\n    if cached is not None:\n        return json.loads(cached)\n\n    user = user_repository.get_by_id(user_id)\n\n    redis_client.set(\n        cache_key,\n        json.dumps(user),\n        ex=300,\n    )\n\n    return user\n```\n\nСхема:\n\n```text\n1. Проверяем Redis cache\n2. Если данные есть → БД не трогаем\n3. Если данных нет → идём в БД\n4. Результат кладём в Redis\n```\n\nЭто особенно полезно для:\n\n```text\nпрофилей\nнастроек пользователя\nсправочников\nчасто читаемых данных\nрезультатов тяжёлых запросов\n```\n\n### Где лучше ставить проверку\n\nПроверку Redis лучше ставить не внутри repository, а выше:\n\n```text\nAPI endpoint / middleware / dependency\nservice layer\nuse-case layer\n```\n\nПлохой вариант:\n\n```text\nrepository сам решает, можно ли ходить в БД\n```\n\nЛучше:\n\n```text\nservice проверяет Redis\nservice решает, можно ли выполнять операцию\nrepository только работает с БД\n```\n\nПример:\n\n```python\nclass UserService:\n    def __init__(self, user_repo, redis_client):\n        self.user_repo = user_repo\n        self.redis = redis_client\n\n    def get_user(self, user_id: int):\n        if self.redis.exists(f\"db:block:user:{user_id}\"):\n            raise PermissionError(\"DB access blocked\")\n\n        return self.user_repo.get_by_id(user_id)\n```\n\nТак архитектура чище:\n\n```text\nRedis-политика доступа → service\nSQL-запросы            → repository\n```\n\n### Что важно не забыть\n\n### 1. Всегда ставить TTL\n\nПлохой вариант:\n\n```python\nredis_client.set(\"db:block:user:123\", \"1\")\n```\n\nЕсли забыть удалить ключ, пользователь может остаться заблокированным навсегда.\n\nЛучше:\n\n```python\nredis_client.set(\"db:block:user:123\", \"1\", ex=300)\n```\n\n### 2. Не использовать Redis как единственную защиту БД\n\nRedis-проверка может быть обойдена, если кто-то имеет прямой доступ к БД.\n\nПоэтому для реальной безопасности нужны:\n\n```text\nзакрытый доступ к БД из интернета\nотдельный DB-user для приложения\nминимальные права\nсетевые ограничения\nconnection pool limits\nаудит запросов\n```\n\n### 3. Учитывать отказ Redis\n\nНужно заранее решить поведение:\n\n```text\nRedis недоступен → запрещать запросы к БД?\nRedis недоступен → разрешать запросы к БД?\nRedis недоступен → разрешать только критичные операции?\n```\n\nДля security-sensitive операций обычно выбирают fail-closed:\n\n```text\nRedis не отвечает → доступ запрещён\n```\n\nДля обычного кэша чаще выбирают fail-open:\n\n```text\nRedis не отвечает → идём напрямую в БД\n```\n\n### Итог\n\nRedis можно использовать для ограничения доступа к БД как быстрый управляющий слой перед БД:\n\n```text\ntemporary block → ключ db:block:user:{id} с TTL\nrate limit      → INCR + EXPIRE\ndistributed lock → SET key value NX EX\ncircuit breaker → флаг db:circuit:* с TTL\ncache           → уменьшить число обращений к БД\n```\n\nГлавная схема:\n\n```text\nперед запросом в БД проверяем Redis\nесли Redis говорит \"нельзя\" → запрос к БД не выполняем\nесли Redis говорит \"можно\"  → выполняем запрос к БД\n```\n\nНо Redis не заменяет права доступа самой БД. Он ограничивает обращения на уровне приложения, а не защищает базу от прямого подключения."
