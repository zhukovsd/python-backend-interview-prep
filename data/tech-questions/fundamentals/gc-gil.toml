  id = 12
  question = "Почему GIL не удаляют полностью в новых версиях Python?"
  answer = "### Почему GIL не удаляют полностью сразу\n\nGIL не удаляют резко, потому что это сломало бы слишком много существующей экосистемы CPython.\n\nПравильнее сказать так:\n\n```text\nGIL уже начали делать опциональным,\nно не убирают его полностью из обычной сборки сразу.\n```\n\nНачиная с Python 3.13 появились free-threaded сборки CPython, где GIL может быть отключён, но это не режим по умолчанию. В Python 3.14 этот режим был серьёзно улучшен, но он всё ещё остаётся отдельным вариантом исполнения, а не полной заменой обычного CPython. ([Python documentation](https://docs.python.org/3/howto/free-threading-python.html \"Python support for free threading — Python 3.14.6 documentation\")) ([Python documentation](https://docs.python.org/3/whatsnew/3.14.html \"What’s new in Python 3.14 — Python 3.14.6 documentation\"))\n\n### 1. Огромная совместимость со старым кодом\n\nМного Python-кода и особенно C-расширений исторически писались с расчётом на то, что есть GIL.\n\nНапример, расширение могло не защищать свои внутренние структуры отдельными lock’ами, потому что предполагалось:\n\n```text\nодновременно Python-код выполняет только один поток\n```\n\nЕсли убрать GIL резко, часть расширений может получить:\n\n```text\nrace condition\nповреждение памяти\nнестабильные падения\nстранные баги\n```\n\nПоэтому free-threaded режим вводят постепенно. Документация Python прямо указывает, что некоторые сторонние пакеты, особенно с extension modules, могут быть не готовы к free-threaded сборке и могут снова включать GIL при импорте. \n\n### 2. Удаление GIL требует переделки внутренностей CPython\n\nGIL защищал много внутренних структур интерпретатора.\n\nЧтобы убрать его, нужно заменить одну большую блокировку множеством более точных механизмов:\n\n```text\nатомарные операции\nлокальные блокировки\nпотокобезопасные контейнеры\nизменения в подсчёте ссылок\nизменения в аллокаторе памяти\n```\n\nPEP 703 прямо описывает, что для удаления GIL нужны существенные изменения в CPython: подсчёт ссылок, управление памятью, потокобезопасность контейнеров, locking и atomic API. \n\n### 3. Может просесть производительность однопоточного кода\n\nGIL мешает CPU-bound многопоточности, но он также делает обычный однопоточный CPython проще и быстрее.\n\nКогда GIL убирают, приходится добавлять дополнительные проверки, атомарные операции и блокировки. Это может замедлять код, который вообще не использует потоки.\n\nВ Python 3.14 free-threaded режим улучшили, но документация всё равно указывает примерный штраф для однопоточного кода около `5–10%` в зависимости от платформы и компилятора. \n\n### 4. Не весь код автоматически ускорится\n\nУбрать GIL не значит автоматически ускорить любую Python-программу.\n\nНапример, это не сильно поможет, если программа:\n\n```text\nожидает сеть\nждёт базу данных\nупирается в медленный алгоритм\nиспользует один поток\nиспользует библиотеки, которые сами ограничивают параллелизм\n```\n\nFree-threaded Python полезнее для кода, который реально написан под параллельное выполнение потоков. PEP 779 отдельно подчёркивает, что это не простое drop-in решение: некоторый код нужно проектировать иначе, чтобы получить выгоду и не получить проблемы производительности. \n\n### 5. Удаление GIL повышает риск гонок данных\n\nС GIL многие операции выглядели “достаточно безопасными” на практике, хотя это не полноценная защита бизнес-логики.\n\nБез GIL больше кода должен явно думать о синхронизации:\n\n```python\nfrom threading import Lock\n\n\nlock = Lock()\ncounter = 0\n\n\ndef increment():\n    global counter\n\n    with lock:\n        counter += 1\n```\n\nТо есть программистам чаще придётся использовать:\n\n```text\nLock\nRLock\nQueue\nSemaphore\nthread-safe структуры\nаккуратную архитектуру shared state\n```\n\nЭто делает модель исполнения мощнее, но сложнее.\n\n### 6. Нужен постепенный переход экосистемы\n\nПроблема не только в CPython. Есть ещё:\n\n```text\nNumPy\nPandas\nPyTorch\nPillow\ncryptography\nдрайверы БД\nweb-фреймворки\nCython/pybind11 расширения\nколёса под разные ABI\n```\n\nМногие библиотеки должны быть проверены, адаптированы и собраны под free-threaded режим.\n\nPEP 779 описывает phased rollout: сначала экспериментальная стадия, затем официально поддерживаемая, но опциональная сборка, и только потом возможный переход к default-режиму. \n\n### Главное\n\nGIL не удаляют полностью сразу не потому, что это невозможно, а потому что цена резкого удаления слишком высокая:\n\n```text\nсломалась бы совместимость\nусложнилась бы внутренняя архитектура CPython\nчасть C-расширений стала бы небезопасной\nоднопоточный код мог бы замедлиться\nэкосистема не успела бы адаптироваться\n```\n\nПоэтому выбран постепенный путь:\n\n```text\nобычный CPython\n↓\nGIL включён\n\nfree-threaded CPython\n↓\nGIL можно отключить\n```\n\nИтог:\n\n```text\nGIL не “не удаляют”,\nа переводят в опциональный режим постепенно,\nчтобы не сломать Python-экосистему.\n```"
  popularity = 2.63

[[questions]]
  id = 13
  question = "Зачем (С какой целью) вообще был придуман GiL?"
  answer = "### Зачем вообще придумали GIL\r\n\r\n`GIL` придумали не как “ограничитель потоков”, а как **упрощение и защита внутренней работы CPython**.\r\n\r\nГлавная цель:\r\n\r\n```text\r\nсделать управление памятью и объектами CPython простым, быстрым и безопасным\r\nв условиях многопоточности\r\n```\r\n\r\n### Главная причина — счётчик ссылок\r\n\r\nВ CPython у каждого объекта есть счётчик ссылок:\r\n\r\n```text\r\nob_refcnt\r\n```\r\n\r\nОн показывает, сколько ссылок ведёт на объект.\r\n\r\nПример:\r\n\r\n```python\r\na = []\r\nb = a\r\n```\r\n\r\nСхема:\r\n\r\n```text\r\na ─┐\r\n   ├──> list object\r\nb ─┘\r\n```\r\n\r\nКогда появляется новая ссылка, счётчик увеличивается.\r\n\r\nКогда ссылка исчезает, счётчик уменьшается.\r\n\r\n```python\r\ndel a\r\n```\r\n\r\nПроблема: в многопоточной программе несколько потоков могут одновременно менять ссылки на один и тот же объект.\r\n\r\nНапример:\r\n\r\n```text\r\nThread 1 увеличивает ob_refcnt\r\nThread 2 уменьшает ob_refcnt\r\n```\r\n\r\nЕсли делать это без защиты, можно повредить счётчик ссылок:\r\n\r\n```text\r\nсчётчик стал неправильным\r\n↓\r\nобъект удалился слишком рано\r\nили\r\nобъект никогда не удалился\r\n```\r\n\r\nЭто уже критическая ошибка управления памятью.\r\n\r\n### GIL как простая глобальная защита\r\n\r\nВместо того чтобы ставить отдельные блокировки на каждый объект и каждую внутреннюю структуру, CPython использует одну большую блокировку:\r\n\r\n```text\r\nGIL\r\n```\r\n\r\nСхема:\r\n\r\n```text\r\nThread 1 ─┐\r\nThread 2 ─┼──> GIL ───> работа с объектами CPython\r\nThread 3 ─┘\r\n```\r\n\r\nВ конкретный момент времени только один поток может выполнять Python bytecode и изменять внутреннее состояние интерпретатора.\r\n\r\nЭто защищает:\r\n\r\n```text\r\nсчётчики ссылок объектов\r\nтаблицы объектов\r\nвнутренние структуры интерпретатора\r\nпамять CPython\r\nчасть C API\r\n```\r\n\r\n### Почему не сделали много мелких lock'ов\r\n\r\nМожно было бы не делать GIL, а поставить много мелких блокировок:\r\n\r\n```text\r\nlock на объект\r\nlock на dict\r\nlock на list\r\nlock на allocator\r\nlock на import system\r\nlock на type system\r\n...\r\n```\r\n\r\nНо у этого есть минусы:\r\n\r\n```text\r\nсложнее реализация\r\nбольше накладных расходов\r\nвыше риск deadlock\r\nсложнее писать C-расширения\r\nмедленнее однопоточный код\r\nсложнее отлаживать интерпретатор\r\n```\r\n\r\nДля раннего CPython это было особенно важно: Python должен был быть простым, переносимым и достаточно быстрым в обычном однопоточном сценарии.\r\n\r\n### GIL ускорял однопоточный Python\r\n\r\nПарадоксально, но GIL не только ограничивает многопоточность, он ещё и помогает обычному CPython быть быстрее в однопоточном режиме.\r\n\r\nБез GIL многие операции пришлось бы делать через:\r\n\r\n```text\r\nатомарные операции\r\nмелкие блокировки\r\nпотокобезопасные структуры\r\nдополнительные проверки\r\n```\r\n\r\nА это замедлило бы даже код, который вообще не использует потоки.\r\n\r\nТо есть GIL был компромиссом:\r\n\r\n```text\r\nбыстрее и проще однопоточный Python\r\n↓\r\nно хуже CPU-bound многопоточность\r\n```\r\n\r\n### GIL упростил C-расширения\r\n\r\nЕщё одна важная цель — удобство для C-расширений.\r\n\r\nМногие модули для CPython написаны на C:\r\n\r\n```text\r\nрасширения для БД\r\nчисленные библиотеки\r\nкриптография\r\nпарсеры\r\nсистемные модули\r\n```\r\n\r\nС GIL C-расширение может работать с Python-объектами, не ставя отдельные lock'и на каждый доступ.\r\n\r\nУпрощённо:\r\n\r\n```text\r\nесть GIL\r\n↓\r\nзначит во время работы с Python-объектами\r\nдругой поток не меняет их параллельно\r\n```\r\n\r\nЭто сильно упрощает написание extension modules.\r\n\r\n### Почему это было разумно исторически\r\n\r\nКогда Python создавался и развивался, типичный сценарий был не такой:\r\n\r\n```text\r\nзапустить 16 CPU-bound потоков на 16 ядрах\r\n```\r\n\r\nА скорее такой:\r\n\r\n```text\r\nскрипты\r\nавтоматизация\r\nсерверная логика\r\nработа с файлами\r\nсетевой ввод-вывод\r\nинтеграция с C-библиотеками\r\n```\r\n\r\nДля таких задач GIL был приемлемым компромиссом.\r\n\r\nОн давал:\r\n\r\n```text\r\nпростую модель памяти\r\nстабильный интерпретатор\r\nбыстрое управление объектами\r\nпростую интеграцию с C\r\nнормальную производительность в одном потоке\r\n```\r\n\r\n### Почему GIL не мешает всему подряд\r\n\r\nGIL мешает в основном тогда, когда несколько потоков одновременно хотят выполнять чистый Python CPU-bound код.\r\n\r\nНапример:\r\n\r\n```python\r\ndef calculate():\r\n    total = 0\r\n\r\n    for i in range(100_000_000):\r\n        total += i\r\n\r\n    return total\r\n```\r\n\r\nВ потоках такой код не будет нормально параллелиться.\r\n\r\nНо при I/O-задачах GIL не такая большая проблема:\r\n\r\n```text\r\nзапросы в сеть\r\nожидание БД\r\nчтение файлов\r\nsleep\r\n```\r\n\r\nПока один поток ждёт I/O, другой может получить GIL и работать.\r\n\r\n### Коротко\r\n\r\nGIL придумали для того, чтобы:\r\n\r\n```text\r\n1. Защитить внутренние структуры CPython.\r\n2. Безопасно обновлять счётчики ссылок объектов.\r\n3. Упростить управление памятью.\r\n4. Упростить написание C-расширений.\r\n5. Сохранить хорошую скорость однопоточного Python.\r\n6. Избежать большого количества мелких lock'ов внутри интерпретатора.\r\n```\r\n\r\nГлавная идея:\r\n\r\n```text\r\nGIL — это компромисс между простотой, безопасностью памяти\r\nи производительностью однопоточного CPython.\r\n```\r\n\r\nЦена этого компромисса:\r\n\r\n```text\r\nпотоки внутри одного процесса плохо ускоряют CPU-bound Python-код\r\n```\r"
  popularity = 2.63

[[questions]]
  id = 14
  question = "Можно ли самостоятельно переключить GIL на другой поток?"
  answer = "### Можно ли самостоятельно переключить GIL на другой поток\r\n\r\nНет, из обычного Python-кода нельзя напрямую сказать:\r\n\r\n```text\r\nGIL, перейди с Thread-1 на Thread-2\r\n```\r\n\r\nУ Python нет публичного API вида:\r\n\r\n```python\r\nswitch_gil_to(thread)\r\n```\r\n\r\nGIL управляется самим интерпретатором CPython и планировщиком ОС.\r\n\r\n### Кто реально управляет переключением\r\n\r\nВ обычном CPython переключение между потоками происходит примерно так:\r\n\r\n```text\r\nThread 1 держит GIL\r\n↓\r\nвыполняет Python bytecode\r\n↓\r\nинтерпретатор решает, что пора дать шанс другому потоку\r\n↓\r\nThread 1 отпускает GIL\r\n↓\r\nдругой поток может его получить\r\n```\r\n\r\nТо есть поток не выбирает напрямую, кому передать GIL.\r\n\r\nСхема:\r\n\r\n```text\r\nThread 1 ─┐\r\nThread 2 ─┼──> борьба за GIL\r\nThread 3 ─┘\r\n\r\nGIL получает тот поток, которому это позволит интерпретатор/ОС.\r\n```\r\n\r\n### Можно ли повлиять косвенно\r\n\r\nДа, косвенно повлиять можно, но без гарантии, какой именно поток получит GIL.\r\n\r\nНапример:\r\n\r\n```python\r\nimport time\r\n\r\ntime.sleep(0)\r\n```\r\n\r\nЭто может дать планировщику шанс переключиться на другой поток.\r\n\r\nПример:\r\n\r\n```python\r\nimport time\r\nfrom threading import Thread\r\n\r\n\r\ndef worker(name):\r\n    for i in range(5):\r\n        print(name, i)\r\n        time.sleep(0)\r\n\r\n\r\nt1 = Thread(target=worker, args=(\"Thread-1\",))\r\nt2 = Thread(target=worker, args=(\"Thread-2\",))\r\n\r\nt1.start()\r\nt2.start()\r\n\r\nt1.join()\r\nt2.join()\r\n```\r\n\r\nНо важно:\r\n\r\n```text\r\ntime.sleep(0) не говорит:\r\n\"передай GIL конкретно Thread-2\"\r\n\r\nОн только даёт шанс переключиться.\r\n```\r\n\r\n### Можно настроить интервал переключения\r\n\r\nВ Python есть функция:\r\n\r\n```python\r\nimport sys\r\n\r\nsys.setswitchinterval(0.005)\r\n```\r\n\r\nОна задаёт примерный интервал переключения потоков в секундах.\r\n\r\nПосмотреть текущее значение:\r\n\r\n```python\r\nimport sys\r\n\r\nprint(sys.getswitchinterval())\r\n```\r\n\r\nПример:\r\n\r\n```python\r\nimport sys\r\n\r\nsys.setswitchinterval(0.001)\r\n```\r\n\r\nЭто значит: интерпретатор будет чаще давать шанс другим потокам.\r\n\r\nНо это тоже не ручное управление GIL.\r\n\r\n```text\r\nsys.setswitchinterval()\r\n↓\r\nменяет частоту попыток переключения\r\n↓\r\nно не выбирает конкретный поток\r\n```\r\n\r\n### Когда GIL отпускается автоматически\r\n\r\nGIL может быть отпущен, когда поток:\r\n\r\n```text\r\nждёт I/O\r\nделает sleep\r\nждёт lock/event/condition\r\nвыполняет C-расширение, которое отпускает GIL\r\n```\r\n\r\nНапример:\r\n\r\n```python\r\ntime.sleep(1)\r\n```\r\n\r\nВо время сна поток не выполняет Python bytecode, поэтому другой поток может получить GIL.\r\n\r\nТо же самое часто происходит при:\r\n\r\n```text\r\nсетевых запросах\r\nожидании ответа БД\r\nчтении/записи файлов\r\n```\r\n\r\n### Можно ли управлять порядком потоков\r\n\r\nМожно управлять не GIL напрямую, а логикой выполнения потоков через синхронизацию:\r\n\r\n```python\r\nfrom threading import Thread, Event\r\n\r\n\r\nevent = Event()\r\n\r\n\r\ndef first():\r\n    print(\"first started\")\r\n    event.set()\r\n\r\n\r\ndef second():\r\n    event.wait()\r\n    print(\"second started after first\")\r\n\r\n\r\nt1 = Thread(target=first)\r\nt2 = Thread(target=second)\r\n\r\nt2.start()\r\nt1.start()\r\n\r\nt1.join()\r\nt2.join()\r\n```\r\n\r\nЗдесь мы не переключаем GIL вручную.\r\n\r\nМы просто говорим:\r\n\r\n```text\r\nsecond ждёт,\r\nпока first не разрешит ему продолжить\r\n```\r\n\r\nДля этого используют:\r\n\r\n```text\r\nLock\r\nRLock\r\nEvent\r\nCondition\r\nSemaphore\r\nQueue\r\n```\r\n\r\n### На уровне C-расширений\r\n\r\nВ C-расширениях для CPython можно явно отпустить GIL на время долгой операции.\r\n\r\nУпрощённо:\r\n\r\n```c\r\nPy_BEGIN_ALLOW_THREADS\r\n\r\n/* долгая операция без работы с Python-объектами */\r\n\r\nPy_END_ALLOW_THREADS\r\n```\r\n\r\nНо это не значит “передать GIL конкретному потоку”.\r\n\r\nЭто значит:\r\n\r\n```text\r\nтекущий C-код временно не трогает Python-объекты\r\n↓\r\nможно отпустить GIL\r\n↓\r\nдругие Python-потоки получают шанс работать\r\n```\r\n\r\n### Коротко\r\n\r\nНапрямую переключить GIL на другой поток нельзя.\r\n\r\nМожно только косвенно повлиять:\r\n\r\n```text\r\ntime.sleep(0)              → дать шанс другому потоку\r\nsys.setswitchinterval()    → изменить частоту переключений\r\nI/O-операции               → поток может отпустить GIL\r\nthreading.Event/Lock       → управлять порядком выполнения потоков\r\nC-расширения               → могут временно отпускать GIL\r\n```\r\n\r\nГлавная мысль:\r\n\r\n```text\r\nGIL — это внутренняя блокировка интерпретатора,\r\nа не объект, которым обычный Python-код управляет напрямую.\r\n```\r"
