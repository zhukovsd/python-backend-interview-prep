  question = "Что такое и как устроен механизм сборки мусора?"
  answer = "### Что такое сборка мусора\r\n\r\nСборка мусора — это механизм, который автоматически освобождает память от объектов, которые больше не нужны программе.\r\n\r\nВ Python программист обычно не пишет:\r\n\r\n```python\r\nfree(obj)\r\ndelete obj\r\n```\r\n\r\nВместо этого Python сам отслеживает, можно ли удалить объект.\r\n\r\nГлавная идея:\r\n\r\n```text\r\nобъект можно удалить,\r\nкогда он больше недоступен из программы\r\n```\r\n\r\nНапример:\r\n\r\n```python\r\na = [1, 2, 3]\r\n\r\na = None\r\n```\r\n\r\nПосле `a = None` список `[1, 2, 3]` больше не доступен через имя `a`.\r\n\r\nЕсли других ссылок на него нет, объект можно удалить.\r\n\r\n### В CPython есть два основных механизма\r\n\r\nВ CPython память управляется в основном через:\r\n\r\n```text\r\n1. счётчик ссылок\r\n2. garbage collector для циклических ссылок\r\n```\r\n\r\nТо есть сборка мусора в Python — это не только `gc`, а связка нескольких механизмов.\r\n\r\n### 1. Счётчик ссылок\r\n\r\nУ каждого объекта в CPython есть счётчик ссылок.\r\n\r\nОн показывает, сколько ссылок ведёт на объект.\r\n\r\n```python\r\na = [1, 2, 3]\r\nb = a\r\n```\r\n\r\nСхематично:\r\n\r\n```text\r\na ─┐\r\n   ├──> [1, 2, 3]\r\nb ─┘\r\n```\r\n\r\nНа список ссылаются `a` и `b`.\r\n\r\nЕсли удалить одну ссылку:\r\n\r\n```python\r\ndel a\r\n```\r\n\r\nобъект ещё жив:\r\n\r\n```text\r\nb ───> [1, 2, 3]\r\n```\r\n\r\nЕсли удалить последнюю ссылку:\r\n\r\n```python\r\ndel b\r\n```\r\n\r\nсписок становится недоступным, и CPython обычно сразу освобождает объект.\r\n\r\nУпрощённо:\r\n\r\n```text\r\nreference count > 0\r\n↓\r\nобъект жив\r\n\r\nreference count == 0\r\n↓\r\nобъект можно уничтожить\r\n```\r\n\r\n### Важно: `del` не удаляет объект напрямую\r\n\r\n```python\r\na = [1, 2, 3]\r\n\r\ndel a\r\n```\r\n\r\n`del a` удаляет имя `a`, то есть ссылку на объект.\r\n\r\nСам объект удаляется только тогда, когда ссылок на него больше нет.\r\n\r\nПример:\r\n\r\n```python\r\na = [1, 2, 3]\r\nb = a\r\n\r\ndel a\r\n\r\nprint(b)\r\n```\r\n\r\nРезультат:\r\n\r\n```text\r\n[1, 2, 3]\r\n```\r\n\r\nСписок не удалился, потому что на него всё ещё ссылается `b`.\r\n\r\n### 2. Garbage collector для циклов\r\n\r\nОдин счётчик ссылок не решает проблему циклических ссылок.\r\n\r\nПример:\r\n\r\n```python\r\na = []\r\nb = []\r\n\r\na.append(b)\r\nb.append(a)\r\n```\r\n\r\nПолучается цикл:\r\n\r\n```text\r\na ───> list1 ───> list2\r\n        ↑         ↓\r\n        └─────────┘\r\n```\r\n\r\nТеперь удалим внешние ссылки:\r\n\r\n```python\r\ndel a\r\ndel b\r\n```\r\n\r\nСнаружи программа уже не может добраться до этих списков.\r\n\r\nНо сами списки всё ещё ссылаются друг на друга:\r\n\r\n```text\r\nlist1 <──> list2\r\n```\r\n\r\nПроблема:\r\n\r\n```text\r\nсчётчик ссылок не равен 0,\r\nно объекты уже недоступны из программы\r\n```\r\n\r\nДля этого и нужен отдельный сборщик мусора — `garbage collector`.\r\n\r\nОн ищет такие недоступные циклы и удаляет их.\r\n\r\n### Как garbage collector понимает, что объект мусор\r\n\r\nУпрощённо он делает так:\r\n\r\n```text\r\n1. отслеживает контейнерные объекты\r\n2. ищет группы объектов, которые ссылаются друг на друга\r\n3. проверяет, доступны ли они снаружи\r\n4. если группа недоступна — её можно удалить\r\n```\r\n\r\nКонтейнерные объекты — это объекты, которые могут хранить ссылки на другие объекты:\r\n\r\n```text\r\nlist\r\ndict\r\nset\r\ntuple\r\nclass instance\r\n```\r\n\r\nНапример:\r\n\r\n```python\r\nusers = [\r\n    {\"name\": \"Alex\"},\r\n    {\"name\": \"Bob\"},\r\n]\r\n```\r\n\r\nЗдесь список хранит словари, а словари хранят строки.\r\n\r\nТакие объекты потенциально могут образовывать циклы, поэтому сборщик мусора их отслеживает.\r\n\r\n### Почему не все объекты отслеживаются GC\r\n\r\nПростые объекты обычно не участвуют в циклах:\r\n\r\n```python\r\nx = 10\r\nname = \"Alex\"\r\nflag = True\r\n```\r\n\r\nНапример, число `10` не может хранить ссылку на список или словарь.\r\n\r\nПоэтому garbage collector в основном работает с объектами, которые могут содержать ссылки на другие объекты.\r\n\r\n### Поколения объектов\r\n\r\nВ CPython сборщик мусора работает не постоянно, а периодически.\r\n\r\nИдея такая:\r\n\r\n```text\r\nмногие объекты живут очень недолго\r\nстарые объекты обычно живут дольше\r\n```\r\n\r\nПоэтому объекты условно делятся на поколения.\r\n\r\nМолодые объекты проверяются чаще, старые — реже.\r\n\r\nУпрощённо:\r\n\r\n```text\r\nновые объекты\r\n↓\r\nпроверяются часто\r\n\r\nстарые объекты\r\n↓\r\nпроверяются реже\r\n```\r\n\r\nЭто нужно для производительности.\r\n\r\nЕсли бы Python постоянно проверял всю память целиком, программа работала бы медленнее.\r\n\r\n### Когда запускается сборщик мусора\r\n\r\nСборщик мусора может запускаться автоматически, когда Python видит, что было создано достаточно много новых объектов.\r\n\r\nУпрощённо:\r\n\r\n```text\r\nсоздали много контейнерных объектов\r\n↓\r\nпревысили внутренний порог\r\n↓\r\nзапустился garbage collector\r\n```\r\n\r\nТакже его можно вызвать вручную:\r\n\r\n```python\r\nimport gc\r\n\r\ngc.collect()\r\n```\r\n\r\nНо в обычном коде это почти никогда не нужно.\r\n\r\n### Пример с циклом\r\n\r\n```python\r\nimport gc\r\n\r\n\r\na = []\r\nb = []\r\n\r\na.append(b)\r\nb.append(a)\r\n\r\ndel a\r\ndel b\r\n\r\ncollected = gc.collect()\r\n\r\nprint(collected)\r\n```\r\n\r\n`gc.collect()` принудительно запускает сборщик мусора и возвращает количество найденных недостижимых объектов.\r\n\r\n### Сборка мусора и `__del__`\r\n\r\nУ класса может быть метод `__del__`:\r\n\r\n```python\r\nclass User:\r\n    def __del__(self):\r\n        print(\"Объект удаляется\")\r\n```\r\n\r\nОн вызывается, когда объект уничтожается.\r\n\r\nНо полагаться на `__del__` для важных действий не стоит.\r\n\r\nПлохо:\r\n\r\n```python\r\nclass FileWrapper:\r\n    def __del__(self):\r\n        self.file.close()\r\n```\r\n\r\nЛучше так:\r\n\r\n```python\r\nwith open(\"data.txt\") as file:\r\n    data = file.read()\r\n```\r\n\r\nПричина:\r\n\r\n```text\r\nмомент уничтожения объекта не всегда удобен и предсказуем\r\n```\r\n\r\nОсобенно если есть циклы, исключения, завершение интерпретатора или другая реализация Python.\r\n\r\n### Освобождение объекта не всегда значит возврат памяти ОС\r\n\r\nВажный момент: когда Python удаляет объект, это не всегда значит, что память сразу вернулась операционной системе.\r\n\r\nCPython может оставить освобождённую память внутри своего аллокатора, чтобы потом быстрее переиспользовать её для новых объектов.\r\n\r\nТо есть:\r\n\r\n```text\r\nобъект удалён\r\n↓\r\nпамять свободна для Python\r\n↓\r\nно ОС может не увидеть мгновенного уменьшения RAM\r\n```\r\n\r\nПоэтому иногда процесс Python продолжает занимать много памяти даже после удаления больших объектов.\r\n\r\n### Общая схема\r\n\r\n```text\r\nсоздаётся объект\r\n↓\r\nна него появляются ссылки\r\n↓\r\nсчётчик ссылок увеличивается\r\n\r\nссылки исчезают\r\n↓\r\nсчётчик ссылок уменьшается\r\n\r\nесли счётчик стал 0\r\n↓\r\nобъект обычно сразу уничтожается\r\n\r\nесли есть цикл\r\n↓\r\nсчётчик может быть не 0\r\n↓\r\ngarbage collector ищет недоступные циклы\r\n↓\r\nудаляет их\r\n```\r\n\r\n### Пример полностью\r\n\r\n```python\r\nimport gc\r\n\r\n\r\nclass Node:\r\n    def __init__(self, name):\r\n        self.name = name\r\n        self.link = None\r\n\r\n\r\nnode1 = Node(\"node1\")\r\nnode2 = Node(\"node2\")\r\n\r\nnode1.link = node2\r\nnode2.link = node1\r\n\r\ndel node1\r\ndel node2\r\n\r\ngc.collect()\r\n```\r\n\r\nЧто произошло:\r\n\r\n```text\r\nnode1 и node2 ссылались друг на друга\r\nвнешние имена удалили\r\nобъекты стали недоступны\r\ngc.collect() нашёл цикл\r\nцикл был удалён\r\n```\r\n\r\n### Коротко\r\n\r\nВ CPython сборка мусора устроена так:\r\n\r\n```text\r\n1. Счётчик ссылок\r\n   Удаляет большинство объектов сразу,\r\n   когда на них больше нет ссылок.\r\n\r\n2. Garbage collector\r\n   Дополнительно ищет циклические ссылки,\r\n   которые счётчик ссылок сам удалить не может.\r\n\r\n3. Аллокатор памяти\r\n   Может оставить освобождённую память внутри Python\r\n   для последующего переиспользования.\r\n```\r\n\r\nГлавная мысль:\r\n\r\n```text\r\nобъект удаляется не потому, что вызвали del,\r\nа потому что он стал недоступен и больше не нужен программе\r\n```\r"
