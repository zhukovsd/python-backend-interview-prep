  id = 1
  question = "Как определяется момент освобождения памяти объекта?"
  answer = "### Как определяется момент освобождения памяти объекта\r\n\r\nВ Python момент освобождения памяти объекта определяется тем, **остались ли на объект ссылки**.\r\n\r\nОбъект живёт, пока на него кто-то ссылается:\r\n\r\n```python\r\na = [1, 2, 3]\r\nb = a\r\n```\r\n\r\nЗдесь список `[1, 2, 3]` имеет как минимум две ссылки:\r\n\r\n```text\r\na ─┐\r\n   ├──> [1, 2, 3]\r\nb ─┘\r\n```\r\n\r\nПока существует хотя бы одна ссылка, объект не может быть освобождён.\r\n\r\n### Когда объект становится кандидатом на удаление\r\n\r\nОбъект может быть освобождён, когда он становится **недостижимым**.\r\n\r\nПример:\r\n\r\n```python\r\na = [1, 2, 3]\r\n\r\na = None\r\n```\r\n\r\nПосле этого имя `a` больше не ссылается на список.\r\n\r\n```text\r\na ──> None\r\n\r\n[1, 2, 3]  # больше недоступен\r\n```\r\n\r\nЕсли других ссылок на этот список нет, объект можно удалить.\r\n\r\n### Как это работает в CPython\r\n\r\nВ стандартной реализации Python — CPython — основной механизм такой:\r\n\r\n```text\r\nу каждого объекта есть счётчик ссылок\r\n```\r\n\r\nКогда появляется новая ссылка — счётчик увеличивается.\r\n\r\n```python\r\na = []\r\nb = a\r\n```\r\n\r\nУ списка теперь больше ссылок.\r\n\r\nКогда ссылка исчезает — счётчик уменьшается.\r\n\r\n```python\r\ndel a\r\n```\r\n\r\nКогда счётчик ссылок становится равен `0`, объект обычно освобождается сразу.\r\n\r\nУпрощённо:\r\n\r\n```text\r\nreference count == 0\r\n↓\r\nобъект больше никому не нужен\r\n↓\r\nпамять можно освободить\r\n```\r\n\r\n### Пример\r\n\r\n```python\r\na = [1, 2, 3]\r\nb = a\r\n\r\ndel a\r\n```\r\n\r\nСписок ещё жив, потому что на него ссылается `b`.\r\n\r\n```python\r\ndel b\r\n```\r\n\r\nТеперь ссылок больше нет, и объект может быть удалён.\r\n\r\n### Важно: это не только `del`\r\n\r\n`del` не удаляет объект напрямую. Он удаляет **имя/ссылку**.\r\n\r\n```python\r\na = [1, 2, 3]\r\n\r\ndel a\r\n```\r\n\r\nЭто значит:\r\n\r\n```text\r\nудалить имя a\r\nуменьшить количество ссылок на объект\r\n```\r\n\r\nСам объект удаляется только тогда, когда на него больше нет ссылок.\r\n\r\n### Циклические ссылки\r\n\r\nЕсть ситуация, где одного счётчика ссылок недостаточно.\r\n\r\nПример:\r\n\r\n```python\r\na = []\r\nb = []\r\n\r\na.append(b)\r\nb.append(a)\r\n```\r\n\r\nПолучается цикл:\r\n\r\n```text\r\na -> list1 -> list2\r\n     ↑       ↓\r\n     └───────┘\r\n```\r\n\r\nДаже если удалить внешние имена:\r\n\r\n```python\r\ndel a\r\ndel b\r\n```\r\n\r\nобъекты всё ещё ссылаются друг на друга.\r\n\r\n```text\r\nlist1 <──> list2\r\n```\r\n\r\nУ них счётчик ссылок не равен нулю, но из программы они уже недоступны.\r\n\r\nДля таких случаев в Python есть **garbage collector**, который ищет циклический мусор и удаляет его.\r\n\r\n### `__del__` и момент уничтожения\r\n\r\nУ объекта может быть специальный метод:\r\n\r\n```python\r\nclass FileWrapper:\r\n    def __del__(self):\r\n        print(\"Объект удаляется\")\r\n```\r\n\r\n`__del__` вызывается перед уничтожением объекта, но полагаться на него для важных действий не стоит.\r\n\r\nПлохо:\r\n\r\n```python\r\nclass Resource:\r\n    def __del__(self):\r\n        self.close()\r\n```\r\n\r\nЛучше использовать контекстный менеджер:\r\n\r\n```python\r\nwith open(\"file.txt\") as file:\r\n    data = file.read()\r\n```\r\n\r\nПочему: точный момент вызова `__del__` может зависеть от реализации Python и ситуации с garbage collector.\r\n\r\n### Главное отличие Python от C/C++\r\n\r\nВ Python обычно не нужно вручную освобождать память.\r\n\r\nВ C/C++ можно явно управлять памятью:\r\n\r\n```text\r\nвыделил память\r\nиспользовал\r\nосвободил\r\n```\r\n\r\nВ Python обычно так:\r\n\r\n```text\r\nсоздал объект\r\nиспользуешь объект\r\nобъект стал недоступен\r\nPython сам освобождает память\r\n```\r\n\r\n### Коротко\r\n\r\nМомент освобождения памяти определяется так:\r\n\r\n```text\r\nобъект живёт, пока на него есть ссылки\r\n```\r\n\r\nВ CPython:\r\n\r\n```text\r\nсчётчик ссылок стал 0\r\n↓\r\nобъект обычно удаляется сразу\r\n```\r\n\r\nДля циклических ссылок:\r\n\r\n```text\r\nобъекты ссылаются друг на друга\r\nно недоступны из программы\r\n↓\r\nих удаляет garbage collector\r\n```\r\n\r\nГлавная идея:\r\n\r\n```text\r\nне имя удаляет объект,\r\nа отсутствие всех ссылок делает объект доступным для освобождения\r\n```\r"
  popularity = 2.63

[[questions]]
  id = 2
  question = "Что такое GIL (Global Interpreter Lock)"
  answer = "### Что такое GIL\r\n\r\n`GIL` — это **Global Interpreter Lock**, глобальная блокировка интерпретатора.\r\n\r\nВ обычной сборке **CPython** GIL нужен для того, чтобы **только один поток одновременно выполнял Python bytecode**. То есть потоков может быть много, но в конкретный момент Python-код исполняет только один из них. ([Python documentation][1])\r\n\r\nУпрощённо:\r\n\r\n```text\r\nThread 1 ──┐\r\nThread 2 ──┼──> GIL ───> Python interpreter\r\nThread 3 ──┘\r\n\r\nВ один момент времени внутрь проходит только один поток.\r\n```\r\n\r\n### Зачем нужен GIL\r\n\r\nГлавная причина — упрощение внутренней работы CPython.\r\n\r\nCPython управляет объектами через счётчики ссылок:\r\n\r\n```text\r\nобъект живёт, пока на него есть ссылки\r\n```\r\n\r\nЕсли несколько потоков одновременно будут менять внутренние структуры интерпретатора и счётчики ссылок, можно получить повреждение состояния памяти.\r\n\r\nGIL защищает внутренние структуры CPython от одновременного доступа из нескольких потоков.\r\n\r\n### Что GIL означает на практике\r\n\r\nДопустим, есть CPU-bound задача:\r\n\r\n```python\r\ndef count():\r\n    total = 0\r\n\r\n    for i in range(100_000_000):\r\n        total += i\r\n\r\n    return total\r\n```\r\n\r\nЕсли запустить такую задачу в нескольких потоках:\r\n\r\n```python\r\nfrom threading import Thread\r\n\r\n\r\nthreads = [\r\n    Thread(target=count),\r\n    Thread(target=count),\r\n]\r\n\r\nfor thread in threads:\r\n    thread.start()\r\n\r\nfor thread in threads:\r\n    thread.join()\r\n```\r\n\r\nЭто не даст нормального ускорения на нескольких ядрах в обычном CPython, потому что Python-код всё равно исполняется под GIL.\r\n\r\nТо есть:\r\n\r\n```text\r\nCPU-bound + threading + обычный CPython\r\n↓\r\nобычно нет настоящего параллелизма Python-кода\r\n```\r\n\r\n### Но потоки всё равно полезны\r\n\r\nGIL не делает `threading` бесполезным.\r\n\r\nПотоки хорошо подходят для I/O-bound задач:\r\n\r\n```text\r\nсетевые запросы\r\nработа с файлами\r\nожидание ответа от базы данных\r\nожидание внешнего API\r\n```\r\n\r\nКогда поток ждёт ввод-вывод, другой поток может получить управление.\r\n\r\nПример:\r\n\r\n```python\r\nfrom threading import Thread\r\nimport requests\r\n\r\n\r\ndef load_url(url):\r\n    response = requests.get(url)\r\n    return response.text\r\n\r\n\r\nthreads = [\r\n    Thread(target=load_url, args=(\"https://example.com\",)),\r\n    Thread(target=load_url, args=(\"https://example.org\",)),\r\n]\r\n```\r\n\r\nДля таких задач `threading` может быть полезен, потому что программа много времени не считает на CPU, а ждёт внешние ресурсы.\r\n\r\n### GIL и CPU-bound задачи\r\n\r\nДля тяжёлых вычислений лучше использовать не потоки, а процессы:\r\n\r\n```python\r\nfrom multiprocessing import Pool\r\n\r\n\r\ndef count(n):\r\n    total = 0\r\n\r\n    for i in range(n):\r\n        total += i\r\n\r\n    return total\r\n\r\n\r\nif __name__ == \"__main__\":\r\n    with Pool() as pool:\r\n        result = pool.map(count, [100_000_000, 100_000_000])\r\n```\r\n\r\nПочему `multiprocessing` помогает:\r\n\r\n```text\r\nthreading       → несколько потоков внутри одного процесса\r\nmultiprocessing → несколько отдельных процессов\r\n```\r\n\r\nУ каждого процесса свой интерпретатор и свой GIL. Поэтому процессы могут реально работать параллельно на разных ядрах. Документация Python прямо указывает, что `multiprocessing` обходит GIL за счёт использования подпроцессов. ([Python documentation][2])\r\n\r\n### GIL и async\r\n\r\n`asyncio` не убирает GIL.\r\n\r\n`asyncio` — это про конкурентное выполнение задач в одном потоке:\r\n\r\n```text\r\nодна задача ждёт I/O\r\n↓\r\nevent loop переключается на другую задачу\r\n```\r\n\r\nНо если внутри `async`-кода запустить тяжёлый CPU-bound цикл, он всё равно будет блокировать выполнение.\r\n\r\nПлохо:\r\n\r\n```python\r\nasync def heavy():\r\n    total = 0\r\n\r\n    for i in range(100_000_000):\r\n        total += i\r\n\r\n    return total\r\n```\r\n\r\nТакой код не становится параллельным просто потому, что он написан через `async`.\r\n\r\n### GIL и C-расширения\r\n\r\nНекоторые C-расширения могут отпускать GIL на время тяжёлых вычислений.\r\n\r\nНапример, библиотеки для численных расчётов могут выполнять тяжёлую работу вне обычного Python bytecode. Поэтому в некоторых случаях код с NumPy, криптографией, сжатием и похожими задачами может использовать несколько ядер эффективнее, чем чистый Python-код.\r\n\r\nОбщая идея:\r\n\r\n```text\r\nчистый Python CPU-bound код\r\n↓\r\nограничен GIL\r\n\r\nC-расширение, которое отпускает GIL\r\n↓\r\nможет работать параллельнее\r\n```\r\n\r\n### Free-threaded Python\r\n\r\nНачиная с Python 3.13, в CPython появилась отдельная free-threaded сборка, где GIL может быть отключён. Это позволяет нескольким Python-потокам реально выполнять Python-код параллельно на разных ядрах. Но это не стандартный режим обычной CPython-сборки. ([Python documentation][3])\r\n\r\nТо есть важно различать:\r\n\r\n```text\r\nобычный CPython\r\n↓\r\nGIL включён\r\n\r\nfree-threaded CPython\r\n↓\r\nGIL отключён\r\n```\r\n\r\n### Коротко\r\n\r\n```text\r\nGIL — глобальная блокировка интерпретатора CPython.\r\n```\r\n\r\nОна означает:\r\n\r\n```text\r\nв обычном CPython только один поток одновременно выполняет Python bytecode\r\n```\r\n\r\nПрактический вывод:\r\n\r\n```text\r\nI/O-bound задачи  → threading может быть полезен\r\nCPU-bound задачи  → лучше multiprocessing / ProcessPoolExecutor / C-расширения\r\nasyncio           → не убирает GIL\r\nfree-threaded Python → отдельная сборка CPython без GIL\r\n```\r\n\r\nГлавная мысль:\r\n\r\n```text\r\nGIL не запрещает многопоточность,\r\nно ограничивает параллельное выполнение чистого Python-кода в обычном CPython.\r\n```\r\n\r\n[1]: https://docs.python.org/3/faq/library.html?utm_source=chatgpt.com \"Library and Extension FAQ — Python 3.14.5 documentation\"\r\n[2]: https://docs.python.org/3/library/multiprocessing.html?utm_source=chatgpt.com \"multiprocessing — Process-based parallelism\"\r\n[3]: https://docs.python.org/3/howto/free-threading-python.html?utm_source=chatgpt.com \"Python support for free threading — Python 3.14.5 ...\"\r"
  popularity = 18.42

