  question = "Как GIL ограничивает потоки в одном процессе?"
  answer = "### Как GIL ограничивает потоки в одном процессе\r\n\r\nВ обычном **CPython** у процесса есть глобальная блокировка интерпретатора — `GIL`.\r\n\r\nЕё смысл:\r\n\r\n```text\r\nвнутри одного процесса несколько потоков могут существовать,\r\nно Python bytecode одновременно выполняет только один поток\r\n```\r\n\r\nТо есть потоки есть:\r\n\r\n```text\r\nThread 1\r\nThread 2\r\nThread 3\r\n```\r\n\r\nНо перед выполнением Python-кода каждый поток должен получить GIL:\r\n\r\n```text\r\nThread 1 ─┐\r\nThread 2 ─┼──> GIL ───> выполнение Python bytecode\r\nThread 3 ─┘\r\n```\r\n\r\nВ конкретный момент времени GIL держит только один поток.\r\n\r\n### Что происходит при CPU-bound задаче\r\n\r\nДопустим, есть тяжёлая вычислительная функция:\r\n\r\n```python\r\ndef calculate():\r\n    total = 0\r\n\r\n    for i in range(100_000_000):\r\n        total += i\r\n\r\n    return total\r\n```\r\n\r\nЗапустим её в двух потоках:\r\n\r\n```python\r\nfrom threading import Thread\r\n\r\n\r\nt1 = Thread(target=calculate)\r\nt2 = Thread(target=calculate)\r\n\r\nt1.start()\r\nt2.start()\r\n\r\nt1.join()\r\nt2.join()\r\n```\r\n\r\nНа машине с несколькими ядрами может казаться, что два потока должны считать параллельно.\r\n\r\nНо в обычном CPython будет примерно так:\r\n\r\n```text\r\nThread 1 получил GIL\r\n↓\r\nнемного выполняет Python-код\r\n↓\r\nотдаёт GIL\r\n\r\nThread 2 получил GIL\r\n↓\r\nнемного выполняет Python-код\r\n↓\r\nотдаёт GIL\r\n\r\nThread 1 снова получил GIL\r\n...\r\n```\r\n\r\nТо есть потоки не выполняют Python-код одновременно. Они по очереди получают доступ к интерпретатору.\r\n\r\n### Главное ограничение\r\n\r\nGIL не запрещает создавать много потоков.\r\n\r\nОн ограничивает именно это:\r\n\r\n```text\r\nодновременное выполнение Python bytecode несколькими потоками\r\nвнутри одного процесса\r\n```\r\n\r\nПоэтому для чистого Python CPU-bound кода:\r\n\r\n```text\r\n2 потока ≠ ускорение в 2 раза\r\n4 потока ≠ ускорение в 4 раза\r\n```\r\n\r\nЧасто может быть даже медленнее из-за расходов на переключение потоков.\r\n\r\n### Почему потоки всё равно переключаются\r\n\r\nGIL не выдаётся одному потоку навсегда.\r\n\r\nИнтерпретатор периодически переключает выполнение между потоками:\r\n\r\n```text\r\nThread 1 работает\r\n↓\r\nпауза / переключение\r\n↓\r\nThread 2 работает\r\n↓\r\nпауза / переключение\r\n↓\r\nThread 1 работает дальше\r\n```\r\n\r\nЭто даёт конкурентность, но не настоящий параллелизм Python-кода на CPU.\r\n\r\nРазница:\r\n\r\n```text\r\nконкурентность:\r\nзадачи продвигаются по очереди\r\n\r\nпараллелизм:\r\nзадачи реально выполняются одновременно\r\n```\r\n\r\nВ одном процессе с GIL для Python bytecode обычно есть конкурентность, но нет полноценного CPU-параллелизма.\r\n\r\n### Когда GIL отпускается\r\n\r\nGIL может быть отпущен, когда поток не выполняет Python bytecode, а ждёт внешнюю операцию.\r\n\r\nНапример:\r\n\r\n```text\r\nожидание сетевого ответа\r\nчтение файла\r\nзапрос в базу данных\r\nsleep\r\nнекоторые C-расширения\r\n```\r\n\r\nПример:\r\n\r\n```python\r\nimport time\r\nfrom threading import Thread\r\n\r\n\r\ndef wait():\r\n    time.sleep(2)\r\n    print(\"done\")\r\n\r\n\r\nt1 = Thread(target=wait)\r\nt2 = Thread(target=wait)\r\n\r\nt1.start()\r\nt2.start()\r\n\r\nt1.join()\r\nt2.join()\r\n```\r\n\r\nЗдесь оба потока могут завершиться примерно за 2 секунды, а не за 4, потому что `sleep` — это ожидание, а не активное выполнение Python-кода.\r\n\r\nСхема:\r\n\r\n```text\r\nThread 1 ждёт I/O\r\n↓\r\nGIL может быть отдан другому потоку\r\n↓\r\nThread 2 тоже работает или ждёт\r\n```\r\n\r\n### Почему threading полезен для I/O-bound\r\n\r\nПотоки в Python полезны, когда задача много ждёт:\r\n\r\n```text\r\nHTTP-запросы\r\nработа с БД\r\nфайловые операции\r\nсокеты\r\nочереди\r\n```\r\n\r\nПока один поток ждёт ответ от внешнего ресурса, другой поток может выполнять работу.\r\n\r\nДля I/O-bound задач:\r\n\r\n```text\r\nthreading может дать хороший эффект\r\n```\r\n\r\nДля CPU-bound задач:\r\n\r\n```text\r\nthreading обычно не даёт нормального ускорения\r\n```\r\n\r\n### Почему multiprocessing обходит GIL\r\n\r\nGIL действует внутри одного интерпретатора Python.\r\n\r\nА при `multiprocessing` создаются отдельные процессы:\r\n\r\n```text\r\nProcess 1 → свой интерпретатор → свой GIL\r\nProcess 2 → свой интерпретатор → свой GIL\r\nProcess 3 → свой интерпретатор → свой GIL\r\n```\r\n\r\nПоэтому процессы могут реально выполняться параллельно на разных ядрах.\r\n\r\nДля CPU-bound задач лучше:\r\n\r\n```python\r\nfrom concurrent.futures import ProcessPoolExecutor\r\n\r\n\r\ndef calculate(n):\r\n    total = 0\r\n\r\n    for i in range(n):\r\n        total += i\r\n\r\n    return total\r\n\r\n\r\nif __name__ == \"__main__\":\r\n    with ProcessPoolExecutor() as executor:\r\n        results = executor.map(calculate, [100_000_000, 100_000_000])\r\n```\r\n\r\nЗдесь уже не один GIL на все задачи, а отдельный GIL внутри каждого процесса.\r\n\r\n### Важно: GIL не защищает твой код от race condition\r\n\r\nИногда думают:\r\n\r\n```text\r\nраз есть GIL, значит в потоках не бывает гонок данных\r\n```\r\n\r\nЭто неверно.\r\n\r\nGIL защищает внутреннее состояние интерпретатора, но не делает всю пользовательскую логику автоматически безопасной.\r\n\r\nПример:\r\n\r\n```python\r\ncounter = 0\r\n\r\n\r\ndef increment():\r\n    global counter\r\n\r\n    for _ in range(100_000):\r\n        counter += 1\r\n```\r\n\r\nОперация:\r\n\r\n```python\r\ncounter += 1\r\n```\r\n\r\nне обязана быть одной неделимой операцией на уровне логики.\r\n\r\nУпрощённо она состоит из шагов:\r\n\r\n```text\r\nпрочитать counter\r\nприбавить 1\r\nзаписать новое значение\r\n```\r\n\r\nМежду этими шагами возможны переключения. Поэтому для общей изменяемой памяти всё равно нужны:\r\n\r\n```python\r\nfrom threading import Lock\r\n```\r\n\r\nили другие механизмы синхронизации.\r\n\r\n### Итоговая схема\r\n\r\n```text\r\nОдин процесс CPython\r\n├── Thread 1\r\n├── Thread 2\r\n├── Thread 3\r\n└── один общий GIL\r\n```\r\n\r\nЧто разрешено:\r\n\r\n```text\r\nмного потоков\r\nпереключение между потоками\r\nожидание I/O в одних потоках и работа других\r\n```\r\n\r\nЧто ограничено:\r\n\r\n```text\r\nодновременное выполнение Python bytecode несколькими потоками\r\n```\r\n\r\n### Главное\r\n\r\nGIL ограничивает потоки так:\r\n\r\n```text\r\nв одном процессе обычного CPython\r\nтолько один поток за раз может выполнять Python bytecode\r\n```\r\n\r\nПоэтому:\r\n\r\n```text\r\nI/O-bound задачи  → threading полезен\r\nCPU-bound задачи  → threading почти не ускоряет\r\nCPU-bound задачи  → лучше multiprocessing / ProcessPoolExecutor\r\n```\r\n\r\nGIL не запрещает многопоточность, но превращает выполнение Python-кода в потоках в поочерёдное владение интерпретатором.\r"
  popularity = 2.63

