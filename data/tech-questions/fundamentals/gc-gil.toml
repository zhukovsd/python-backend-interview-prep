  id = 7
  question = "Как называется механизм удаления циклических ссылок?"
  answer = "### Как называется механизм удаления циклических ссылок\r\n\r\nМеханизм удаления циклических ссылок называется:\r\n\r\n```text\r\nциклический сборщик мусора\r\n```\r\n\r\nили по-английски:\r\n\r\n```text\r\ncyclic garbage collector\r\n```\r\n\r\nТакже часто говорят:\r\n\r\n```text\r\ncycle GC\r\n```\r\n\r\nВ Python с ним работает модуль:\r\n\r\n```python\r\nimport gc\r\n```\r\n\r\n### Что он делает\r\n\r\nОн ищет объекты, которые:\r\n\r\n```text\r\n1. ссылаются друг на друга\r\n2. имеют ненулевые счётчики ссылок\r\n3. но уже недоступны из программы\r\n```\r\n\r\nПример:\r\n\r\n```python\r\na = []\r\nb = []\r\n\r\na.append(b)\r\nb.append(a)\r\n\r\ndel a\r\ndel b\r\n```\r\n\r\nПосле `del a` и `del b` получается цикл:\r\n\r\n```text\r\nlist1 <──> list2\r\n```\r\n\r\nОбычный подсчёт ссылок сам не удалит эти объекты, потому что они всё ещё держат ссылки друг на друга.\r\n\r\nТогда подключается:\r\n\r\n```text\r\ncyclic garbage collector\r\n```\r\n\r\n### Как можно вызвать вручную\r\n\r\n```python\r\nimport gc\r\n\r\ngc.collect()\r\n```\r\n\r\n`gc.collect()` вручную запускает сборщик мусора и пытается найти недоступные циклические объекты.\r\n\r\n### Коротко\r\n\r\n```text\r\nМеханизм удаления циклических ссылок в Python называется cyclic garbage collector.\r\n```\r\n\r\nВ CPython он дополняет основной механизм подсчёта ссылок:\r\n\r\n```text\r\nreference counting\r\n+\r\ncyclic garbage collector\r\n```\r"
