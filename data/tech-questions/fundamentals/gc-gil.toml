  question = "Освобождается/Отпускается ли GIL во время выполнения Python-программы?"
  answer = "### Да, GIL периодически освобождается во время выполнения Python-программы\n\nНо важно различать два случая:\n\n```text\n1. GIL отпускается для переключения между потоками\n2. GIL отпускается на время блокирующих операций\n```\n\n### 1. Во время выполнения Python-кода GIL может переходить между потоками\n\nВ обычном CPython с включённым GIL в один момент времени только один поток выполняет Python-код. Но интерпретатор периодически пытается переключаться между потоками между bytecode-инструкциями. Частоту таких переключений можно настраивать через `sys.setswitchinterval()` \n\nУпрощённо:\n\n```text\nThread-1 держит GIL\n↓\nвыполняет часть Python bytecode\n↓\nинтерпретатор даёт шанс другому потоку\n↓\nThread-1 отпускает GIL\n↓\nThread-2 захватывает GIL\n↓\nThread-2 выполняет Python bytecode\n```\n\nНо это не значит, что два Python-потока одновременно выполняют Python-код на разных ядрах. В обычном CPython из-за GIL одновременно Python-код выполняет только один поток \n\n### 2. GIL отпускается во время блокирующего I/O\n\nНапример, когда поток ждёт:\n\n```text\nчтение файла\nзапись файла\nсетевой запрос\nответ от БД\nsocket recv/send\n```\n\nНа время ожидания GIL обычно отпускается, чтобы другие потоки могли продолжить работу. Документация CPython прямо указывает, что GIL освобождается вокруг блокирующих I/O-операций, например чтения или записи файла \n\nПримерно так:\n\n```python\nwith open(\"data.txt\") as f:\n    data = f.read()\n```\n\nВо время реального ожидания чтения с диска поток может отпустить GIL.\n\n### 3. C-расширения тоже могут отпускать GIL\n\nНекоторые C-расширения отпускают GIL, если выполняют долгую работу без обращения к Python-объектам. В документации как примеры указаны `zlib` и `hashlib`: они могут отсоединять thread state при сжатии или хешировании данных \n\nТо есть код вроде:\n\n```python\nimport hashlib\n\nhashlib.sha256(large_data).hexdigest()\n```\n\nможет выполнять тяжёлую нативную работу без удержания GIL всё время.\n\n### 4. Для CPU-bound Python-кода GIL не даёт настоящего параллелизма\n\nНапример:\n\n```python\ndef calc():\n    total = 0\n    for i in range(100_000_000):\n        total += i\n```\n\nЕсли запустить несколько таких функций в разных `threading.Thread`, потоки будут конкурировать за GIL:\n\n```text\nThread-1 считает\nThread-2 ждёт GIL\nThread-1 отпустил GIL\nThread-2 считает\nThread-1 ждёт GIL\n...\n```\n\nЭто конкурентность, но не полноценный параллелизм Python-кода на нескольких ядрах.\n\nДля CPU-bound задач обычно используют:\n\n```python\nmultiprocessing\nconcurrent.futures.ProcessPoolExecutor\n```\n\nПотому что разные процессы имеют разные интерпретаторы и не делят один GIL \n\n### 5. В Python 3.13+ есть исключение: free-threaded build\n\nНачиная с Python 3.13, CPython поддерживает отдельную free-threaded-сборку, где GIL может быть отключён. Но это не обычный режим по умолчанию, а специальная сборка/конфигурация \n\n### Итог\n\nДа, GIL освобождается/отпускается во время выполнения программы:\n\n```text\nДа — при переключении между потоками.\nДа — во время блокирующего I/O.\nДа — в некоторых C-расширениях.\nНет — это не даёт обычным Python-потокам одновременно выполнять Python bytecode на разных ядрах.\n```\n\nГлавная мысль:\n\n```text\nGIL не держится одним потоком навсегда.\nОн периодически передаётся другим потокам,\nно в обычном CPython одновременно Python-код выполняет только один поток.\n```"
