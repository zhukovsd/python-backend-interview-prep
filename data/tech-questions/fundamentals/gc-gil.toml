  id = 9
  question = "В каких случаях память не освобождается после удаления ссылок?"
  answer = "### Когда память не освобождается после удаления ссылок\r\n\r\nВ Python важно различать две ситуации:\r\n\r\n```text\r\n1. Объект не удалился, потому что на него ещё есть ссылки.\r\n2. Объект удалился, но память не вернулась операционной системе.\r\n```\r\n\r\nЭто разные вещи.\r\n\r\n### 1. На объект всё ещё есть другие ссылки\r\n\r\n`del` удаляет только имя, а не сам объект.\r\n\r\n```python\r\nlst = [1, 2, 3]\r\n\r\nother = lst\r\n\r\ndel lst\r\n```\r\n\r\nСписок не удалится, потому что на него всё ещё ссылается `other`.\r\n\r\n```text\r\nlst   ─X\r\n\r\nother ───> [1, 2, 3]\r\n```\r\n\r\nОбъект жив, пока на него есть хотя бы одна сильная ссылка.\r\n\r\n### 2. Объект лежит внутри другого объекта\r\n\r\nИногда ссылка остаётся не в переменной, а внутри контейнера.\r\n\r\n```python\r\ndata = [1, 2, 3]\r\n\r\nstorage = []\r\nstorage.append(data)\r\n\r\ndel data\r\n```\r\n\r\nСписок `[1, 2, 3]` всё ещё жив:\r\n\r\n```text\r\nstorage ───> [[1, 2, 3]]\r\n```\r\n\r\nТо же самое может быть со словарями, множествами, объектами классов, кэшем и так далее.\r\n\r\n### 3. Объект хранится в глобальной переменной\r\n\r\n```python\r\nCACHE = []\r\n\r\n\r\ndef load_data():\r\n    data = [1, 2, 3]\r\n    CACHE.append(data)\r\n\r\n    del data\r\n```\r\n\r\nПосле `del data` объект не удалится, потому что он попал в глобальный `CACHE`.\r\n\r\nЭто частая причина “утечек” памяти в Python-приложениях:\r\n\r\n```text\r\nглобальный dict/list/cache продолжает держать объекты\r\n```\r\n\r\n### 4. Объект находится в замыкании\r\n\r\n```python\r\ndef outer():\r\n    data = [1, 2, 3]\r\n\r\n    def inner():\r\n        return data\r\n\r\n    return inner\r\n\r\n\r\nfunc = outer()\r\n```\r\n\r\nПосле завершения `outer()` список `data` не удаляется, потому что его держит внутренняя функция `inner`.\r\n\r\nСхематично:\r\n\r\n```text\r\nfunc ───> inner\r\n          └──> data\r\n```\r\n\r\nЭто называется замыкание.\r\n\r\n### 5. Объект попал в traceback исключения\r\n\r\nИсключения могут удерживать стек вызовов, локальные переменные и объекты из этих фреймов.\r\n\r\nПример:\r\n\r\n```python\r\ntry:\r\n    big_data = [0] * 10_000_000\r\n    raise ValueError(\"error\")\r\nexcept ValueError as exc:\r\n    saved_exception = exc\r\n```\r\n\r\nЕсли сохранить исключение, оно может удерживать traceback, а traceback — локальные переменные.\r\n\r\nУпрощённо:\r\n\r\n```text\r\nsaved_exception\r\n└── traceback\r\n    └── frame\r\n        └── locals\r\n            └── big_data\r\n```\r\n\r\nПоэтому большие объекты могут жить дольше, чем ожидается.\r\n\r\n### 6. Есть циклические ссылки\r\n\r\nПример:\r\n\r\n```python\r\na = []\r\nb = []\r\n\r\na.append(b)\r\nb.append(a)\r\n\r\ndel a\r\ndel b\r\n```\r\n\r\nВнешних ссылок уже нет, но списки ссылаются друг на друга:\r\n\r\n```text\r\nlist1 <──> list2\r\n```\r\n\r\nПростой подсчёт ссылок не удалит их сразу, потому что счётчики ссылок не равны нулю.\r\n\r\nДля этого нужен cyclic garbage collector.\r\n\r\nОбычно Python сам периодически собирает такие циклы, но память может не освободиться мгновенно.\r\n\r\nМожно запустить вручную:\r\n\r\n```python\r\nimport gc\r\n\r\ngc.collect()\r\n```\r\n\r\nНо в обычном коде постоянно вызывать `gc.collect()` не нужно.\r\n\r\n### 7. Garbage collector отключён\r\n\r\nСборщик циклических ссылок можно отключить:\r\n\r\n```python\r\nimport gc\r\n\r\ngc.disable()\r\n```\r\n\r\nЕсли он отключён, циклический мусор может не удаляться автоматически.\r\n\r\nПроверить:\r\n\r\n```python\r\nimport gc\r\n\r\nprint(gc.isenabled())\r\n```\r\n\r\nВключить обратно:\r\n\r\n```python\r\ngc.enable()\r\n```\r\n\r\n### 8. Объект удалился, но память осталась у Python\r\n\r\nЭто очень важный момент.\r\n\r\nДопустим, объект действительно был удалён:\r\n\r\n```python\r\ndata = [0] * 10_000_000\r\n\r\ndel data\r\n```\r\n\r\nЭто не гарантирует, что потребление RAM в диспетчере задач сразу уменьшится.\r\n\r\nПричина: CPython может оставить освобождённую память внутри своего аллокатора, чтобы потом быстрее использовать её для новых объектов.\r\n\r\nТо есть:\r\n\r\n```text\r\nобъект удалён\r\n↓\r\nпамять свободна для Python\r\n↓\r\nно не обязательно сразу возвращена ОС\r\n```\r\n\r\nПоэтому внешне может казаться, что память “не освободилась”, хотя Python уже может переиспользовать её внутри процесса.\r\n\r\n### 9. Память фрагментирована\r\n\r\nДаже если часть объектов удалена, память может быть занята фрагментированными блоками.\r\n\r\nУсловно:\r\n\r\n```text\r\n[занято][свободно][занято][свободно][занято]\r\n```\r\n\r\nPython может не вернуть такую память ОС, потому что внутри арены всё ещё остаются живые объекты.\r\n\r\nЭто особенно заметно в долгоживущих процессах:\r\n\r\n```text\r\nweb-серверы\r\nботы\r\nворкеры\r\nфоновые сервисы\r\n```\r\n\r\n### 10. Работают внутренние кэши Python\r\n\r\nНекоторые объекты Python может кэшировать или переиспользовать.\r\n\r\nНапример:\r\n\r\n```text\r\nмаленькие числа\r\nнекоторые строки\r\nвнутренние структуры интерпретатора\r\n```\r\n\r\nПоэтому не все объекты ведут себя так, будто они сразу создаются и сразу окончательно уничтожаются.\r\n\r\nЭто нормальная оптимизация.\r\n\r\n### 11. Память держит сторонняя библиотека\r\n\r\nЕсли используются библиотеки на C/C++ или расширения, память может управляться не только Python-объектами.\r\n\r\nНапример:\r\n\r\n```text\r\nNumPy\r\nPandas\r\nPillow\r\nPyTorch\r\nOpenCV\r\nдрайверы БД\r\nсетевые библиотеки\r\n```\r\n\r\nPython-объект может быть удалён, но нативная библиотека может держать собственный буфер, пул памяти или кэш.\r\n\r\n### 12. Объект специально удерживается кэшем\r\n\r\nПример с `lru_cache`:\r\n\r\n```python\r\nfrom functools import lru_cache\r\n\r\n\r\n@lru_cache\r\ndef get_data(n):\r\n    return [0] * n\r\n\r\n\r\ndata = get_data(1_000_000)\r\n\r\ndel data\r\n```\r\n\r\nСписок может остаться в кэше функции.\r\n\r\nОчистить кэш можно так:\r\n\r\n```python\r\nget_data.cache_clear()\r\n```\r\n\r\n### Как проверить, что объект всё ещё жив\r\n\r\nМожно использовать `sys.getrefcount()`:\r\n\r\n```python\r\nimport sys\r\n\r\n\r\nlst = []\r\n\r\nprint(sys.getrefcount(lst))\r\n```\r\n\r\nНо важно: `getrefcount()` сам временно создаёт дополнительную ссылку, поэтому значение обычно на `1` больше ожидаемого.\r\n\r\nДля поиска ссылок можно использовать:\r\n\r\n```python\r\nimport gc\r\n\r\ngc.get_referrers(obj)\r\n```\r\n\r\nНо это инструмент для отладки, не для обычной логики приложения.\r\n\r\n### Коротко\r\n\r\nПамять может не освобождаться после удаления ссылок, если:\r\n\r\n```text\r\n1. На объект всё ещё есть другие ссылки.\r\n2. Объект находится внутри контейнера.\r\n3. Его держит глобальный кэш.\r\n4. Его держит замыкание.\r\n5. Его держит traceback исключения.\r\n6. Есть циклические ссылки.\r\n7. Garbage collector отключён.\r\n8. Объект удалён, но память осталась у аллокатора Python.\r\n9. Есть фрагментация памяти.\r\n10. Память держит сторонняя C/C++ библиотека.\r\n11. Объект сохранён во внутреннем или пользовательском кэше.\r\n```\r\n\r\nГлавная мысль:\r\n\r\n```text\r\ndel удаляет ссылку, а не гарантирует немедленное освобождение памяти ОС.\r\n```\r\n\r\nВ CPython объект обычно уничтожается, когда его счётчик ссылок стал `0`, но освобождённая память может остаться внутри процесса Python для повторного использования.\r"
  popularity = 2.63

[[questions]]
  id = 10
  question = "Как GIL влияет на асинхронность, многопоточность и многопроцессность"
  answer = "`GIL` влияет так:\n\n```text\nasyncio             → GIL почти не мешает, пока задачи I/O-bound\nthreading           → мешает CPU-bound коду выполняться параллельно\nmultiprocessing     → обходит GIL через отдельные процессы\n```\n\nВ обычном **CPython** GIL разрешает только одному потоку одновременно выполнять Python bytecode. Но это не значит, что в Python нет конкурентности вообще. Важно различать: асинхронность, потоки и процессы. Проверено по документации Python: `threading`, `asyncio`, `multiprocessing`, `concurrent.futures`, документация по free-threaded CPython. \n\n### 1. GIL и асинхронность\n\n`asyncio` обычно работает в одном потоке.\n\nПримерно так:\n\n```text\nодин поток\nодин event loop\nмного async-задач\n```\n\nПример:\n\n```python\nimport asyncio\n\n\nasync def load_data():\n    await asyncio.sleep(1)\n    return \"done\"\n\n\nasync def main():\n    result = await asyncio.gather(\n        load_data(),\n        load_data(),\n        load_data(),\n    )\n\n    print(result)\n\n\nasyncio.run(main())\n```\n\nЗдесь задачи не выполняются параллельно на разных ядрах. Они выполняются **конкурентно**:\n\n```text\nзадача 1 ждёт I/O\n↓\nevent loop переключается на задачу 2\n↓\nзадача 2 ждёт I/O\n↓\nevent loop переключается на задачу 3\n```\n\nТо есть `asyncio` хорошо подходит для:\n\n```text\nHTTP-запросов\nработы с БД\nсокетов\nочередей\nфайлового/сетевого ожидания\n```\n\nНо если внутри `async`-функции запустить тяжёлый CPU-bound код, GIL не поможет и `asyncio` не спасёт.\n\nПлохо:\n\n```python\nasync def heavy_calculation():\n    total = 0\n\n    for i in range(100_000_000):\n        total += i\n\n    return total\n```\n\nТакая функция будет блокировать event loop.\n\nГлавная мысль:\n\n```text\nasyncio не убирает GIL\nasyncio просто позволяет эффективно переключаться во время ожидания\n```\n\n### 2. GIL и многопоточность\n\nМногопоточность в Python — это `threading`.\n\nПример:\n\n```python\nfrom threading import Thread\n\n\ndef task():\n    total = 0\n\n    for i in range(50_000_000):\n        total += i\n\n\nt1 = Thread(target=task)\nt2 = Thread(target=task)\n\nt1.start()\nt2.start()\n\nt1.join()\nt2.join()\n```\n\nВ обычном CPython два потока не будут одновременно выполнять Python bytecode на двух ядрах.\n\nСхема:\n\n```text\nThread 1 ─┐\nThread 2 ─┼──> GIL ───> CPython interpreter\nThread 3 ─┘\n\nВ конкретный момент Python-код выполняет только один поток.\n```\n\nПоэтому для чистого Python CPU-bound кода:\n\n```text\nthreading обычно не даёт ускорения\n```\n\nCPU-bound задачи:\n\n```text\nматематические вычисления\nобработка больших массивов чистым Python-кодом\nтяжёлые циклы\nпарсинг больших данных без внешних C-библиотек\n```\n\nНо потоки полезны для I/O-bound задач:\n\n```python\nfrom threading import Thread\nimport requests\n\n\ndef load_url(url):\n    response = requests.get(url)\n    print(len(response.text))\n\n\nthreads = [\n    Thread(target=load_url, args=(\"https://example.com\",)),\n    Thread(target=load_url, args=(\"https://example.org\",)),\n]\n\nfor thread in threads:\n    thread.start()\n\nfor thread in threads:\n    thread.join()\n```\n\nПочему здесь потоки могут быть полезны:\n\n```text\nпоток ждёт сеть\n↓\nв это время другой поток может работать\n```\n\nГлавная мысль:\n\n```text\nthreading хорош для I/O-bound\nthreading плох для ускорения чистого CPU-bound Python-кода\n```\n\n### 3. GIL и многопроцессность\n\nПравильнее говорить **многопроцессность**, а не многопроцессорность.\n\nВ Python для этого используют:\n\n```python\nmultiprocessing\n```\n\nили:\n\n```python\nconcurrent.futures.ProcessPoolExecutor\n```\n\nПример:\n\n```python\nfrom multiprocessing import Pool\n\n\ndef calculate(n):\n    total = 0\n\n    for i in range(n):\n        total += i\n\n    return total\n\n\nif __name__ == \"__main__\":\n    with Pool() as pool:\n        result = pool.map(calculate, [50_000_000, 50_000_000])\n\n    print(result)\n```\n\nЗдесь создаются отдельные процессы.\n\nСхема:\n\n```text\nProcess 1 → свой Python interpreter → свой GIL\nProcess 2 → свой Python interpreter → свой GIL\nProcess 3 → свой Python interpreter → свой GIL\n```\n\nТак как процессы отдельные, они могут реально выполняться параллельно на разных ядрах CPU.\n\nПоэтому для CPU-bound задач лучше:\n\n```text\nmultiprocessing\nProcessPoolExecutor\n```\n\nА не:\n\n```text\nthreading\n```\n\nМинусы многопроцессности:\n\n```text\nпроцессы тяжелее потоков\nу каждого процесса своя память\nданные между процессами нужно передавать\nесть расходы на сериализацию/pickle\nстарт процессов дороже, чем старт потоков\n```\n\n### Сравнение\n\n|Механизм|Параллелизм CPU|Подходит для|Как влияет GIL|\n|---|--:|---|---|\n|`asyncio`|Нет|I/O-bound|Не убирает GIL, но эффективно переключает задачи на ожидании|\n|`threading`|Обычно нет|I/O-bound|Один поток выполняет Python bytecode в момент времени|\n|`multiprocessing`|Да|CPU-bound|Обходит GIL через отдельные процессы|\n\n### CPU-bound vs I/O-bound\n\nCPU-bound:\n\n```text\nзадача упирается в процессор\n```\n\nПример:\n\n```python\ndef cpu_bound():\n    total = 0\n\n    for i in range(100_000_000):\n        total += i\n\n    return total\n```\n\nЛучше использовать:\n\n```text\nmultiprocessing\nProcessPoolExecutor\n```\n\nI/O-bound:\n\n```text\nзадача много ждёт внешние ресурсы\n```\n\nПример:\n\n```text\nHTTP-запрос\nзапрос в БД\nчтение файла\nожидание ответа сервера\n```\n\nЛучше использовать:\n\n```text\nasyncio\nthreading\n```\n\n### Важное уточнение про новые версии Python\n\nВ обычной сборке CPython GIL есть.\n\nНо начиная с Python 3.13 появилась возможность free-threaded сборки CPython, где GIL может быть отключён. В Python 3.14 free-threaded Python уже официально поддерживается, но всё ещё является отдельным опциональным режимом, а не обычным поведением стандартной сборки. \n\nТо есть на практике чаще всего:\n\n```text\nобычный CPython\n↓\nGIL включён\n```\n\nА отдельно:\n\n```text\nfree-threaded CPython\n↓\nGIL может быть отключён\n```\n\n### Коротко по выбору\n\n```text\nМного сетевых запросов?\n↓\nasyncio или threading\n\nМного запросов в БД?\n↓\nasyncio, если драйвер async\nthreading, если код синхронный\n\nТяжёлые вычисления на CPU?\n↓\nmultiprocessing / ProcessPoolExecutor\n\nЧистый Python-код в потоках?\n↓\nGIL не даст нормального CPU-параллелизма\n```\n\nГлавная мысль:\n\n```text\nGIL ограничивает многопоточность для CPU-bound Python-кода,\nно не мешает эффективно использовать async/threading для I/O-bound задач\nи обходится через multiprocessing для CPU-bound задач.\n```"
  popularity = 2.63

