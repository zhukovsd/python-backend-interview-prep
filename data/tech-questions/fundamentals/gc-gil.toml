  question = "Как Python разрывает циклические ссылки?"
  answer = "### Как Python разрывает циклические ссылки\r\n\r\nВ CPython циклические ссылки разрывает **циклический сборщик мусора** — `cyclic garbage collector`.\r\n\r\nОн не просто смотрит на счётчик ссылок. Он ищет группы объектов, которые ссылаются друг на друга, но **недоступны из обычного кода**.\r\n\r\nПример цикла:\r\n\r\n```python id=\"2npzgx\"\r\na = []\r\nb = []\r\n\r\na.append(b)\r\nb.append(a)\r\n\r\ndel a\r\ndel b\r\n```\r\n\r\nПосле `del a` и `del b` внешних ссылок уже нет, но сами списки держат друг друга:\r\n\r\n```text id=\"47o72p\"\r\nlist1 ───> list2\r\n  ↑         ↓\r\n  └─────────┘\r\n```\r\n\r\nДля счётчика ссылок это не мусор, потому что ссылки всё ещё есть.\r\nДля garbage collector это мусор, потому что снаружи до этих объектов уже нельзя добраться.\r\n\r\n### Как CPython это определяет\r\n\r\nУпрощённо алгоритм такой:\r\n\r\n```text id=\"ux3w04\"\r\n1. GC берёт группу отслеживаемых объектов\r\n2. Смотрит их реальные счётчики ссылок\r\n3. Учитывает ссылки внутри этой группы\r\n4. Определяет, есть ли ссылки на группу извне\r\n5. Если внешних ссылок нет — группа считается недостижимой\r\n```\r\n\r\nТо есть GC пытается понять:\r\n\r\n```text id=\"jfey9m\"\r\nобъекты живы только потому,\r\nчто держат друг друга?\r\n```\r\n\r\nЕсли да, это циклический мусор.\r\n\r\n### Что значит “разрывает цикл”\r\n\r\nКогда GC понял, что группа объектов недостижима, он начинает очищать ссылки внутри этих объектов.\r\n\r\nУпрощённо:\r\n\r\n```text id=\"b9kvcx\"\r\nlist1 ссылается на list2\r\nlist2 ссылается на list1\r\n\r\nGC очищает внутренние ссылки\r\n↓\r\nlist1 больше не держит list2\r\nlist2 больше не держит list1\r\n↓\r\nсчётчики ссылок падают\r\n↓\r\nобъекты удаляются\r\n```\r\n\r\nСхематично:\r\n\r\n```text id=\"n6yjvi\"\r\nДо:\r\n\r\nlist1 ───> list2\r\n  ↑         ↓\r\n  └─────────┘\r\n\r\nПосле очистки:\r\n\r\nlist1      list2\r\n```\r\n\r\nПосле разрыва внутренних ссылок счётчики ссылок становятся нулевыми, и объекты можно освободить.\r\n\r\n### На уровне CPython\r\n\r\nНа уровне реализации CPython у контейнерных объектов есть специальные функции очистки.\r\n\r\nНапример, объект может уметь сказать:\r\n\r\n```text id=\"1o9kq8\"\r\nя храню ссылки на другие объекты,\r\nи я могу эти ссылки очистить\r\n```\r\n\r\nДля этого используется внутренняя логика типа объекта. Например, список может очистить ссылки на свои элементы, словарь — ссылки на ключи и значения, экземпляр класса — ссылки на свои атрибуты.\r\n\r\nУпрощённо:\r\n\r\n```text id=\"6fy9al\"\r\nGC нашёл недостижимый цикл\r\n↓\r\nвызывает очистку контейнеров\r\n↓\r\nконтейнеры отпускают ссылки друг на друга\r\n↓\r\nreference counting завершает удаление\r\n```\r\n\r\n### Какие объекты GC отслеживает\r\n\r\nЦиклический GC отслеживает в основном контейнерные объекты:\r\n\r\n```text id=\"ja68hk\"\r\nlist\r\ndict\r\nset\r\ntuple\r\nэкземпляры классов\r\n```\r\n\r\nПотому что именно они могут хранить ссылки на другие объекты и образовывать циклы.\r\n\r\nПростые объекты вроде чисел обычно не образуют циклов:\r\n\r\n```python id=\"37uagh\"\r\nx = 10\r\nname = \"Alex\"\r\nflag = True\r\n```\r\n\r\nПоэтому для них обычно достаточно обычного подсчёта ссылок.\r\n\r\n### Пример с классами\r\n\r\n```python id=\"294piw\"\r\nimport gc\r\n\r\n\r\nclass Node:\r\n    def __init__(self, name):\r\n        self.name = name\r\n        self.link = None\r\n\r\n\r\nnode1 = Node(\"node1\")\r\nnode2 = Node(\"node2\")\r\n\r\nnode1.link = node2\r\nnode2.link = node1\r\n\r\ndel node1\r\ndel node2\r\n\r\ngc.collect()\r\n```\r\n\r\nСначала:\r\n\r\n```text id=\"wo024u\"\r\nnode1 ───> node2\r\n  ↑         ↓\r\n  └─────────┘\r\n```\r\n\r\nПосле удаления внешних имён:\r\n\r\n```text id=\"ordaro\"\r\nNode(\"node1\") <──> Node(\"node2\")\r\n```\r\n\r\nСнаружи до них уже нельзя добраться, но они держат друг друга.\r\n\r\n`gc.collect()` запускает сборщик мусора, он находит этот цикл и очищает внутренние ссылки.\r\n\r\n### Важный момент про `__del__`\r\n\r\nРаньше циклы с объектами, у которых есть `__del__`, были проблемнее. В современных версиях Python такие циклы обрабатываются безопаснее, но всё равно лучше не строить важную логику освобождения ресурсов на `__del__`.\r\n\r\nДля файлов, соединений, сокетов и подобных ресурсов лучше использовать:\r\n\r\n```python id=\"tliw23\"\r\nwith open(\"data.txt\") as file:\r\n    data = file.read()\r\n```\r\n\r\nили явно закрывать ресурс:\r\n\r\n```python id=\"2r7ry5\"\r\nconnection.close()\r\n```\r\n\r\n### Коротко\r\n\r\nPython разрывает циклические ссылки так:\r\n\r\n```text id=\"f6lxla\"\r\n1. Находит группу объектов, которые ссылаются друг на друга.\r\n2. Проверяет, есть ли ссылки на эту группу извне.\r\n3. Если внешних ссылок нет — группа недостижима.\r\n4. GC очищает внутренние ссылки между объектами.\r\n5. Счётчики ссылок падают.\r\n6. Объекты уничтожаются и память освобождается.\r\n```\r\n\r\nГлавная идея:\r\n\r\n```text id=\"edw5o8\"\r\nесли объекты живы только за счёт ссылок друг на друга,\r\nно программа уже не может до них добраться,\r\nто GC считает их мусором и разрывает этот цикл\r\n```\r"
  popularity = 2.63

