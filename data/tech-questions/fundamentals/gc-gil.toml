  question = "Является ли GIL частью языка Python или деталью реализации CPython?"
  answer = "**GIL не является частью языка Python.**  \nЭто **деталь реализации CPython** — основной, канонической реализации Python, которую обычно скачивают с python.org. Документация отдельно различает CPython и другие реализации Python, например Jython или IronPython. \n\n### Что это значит\n\nЯзык Python описывает синтаксис и поведение кода:\n\n```python\nx = 10\ndef func():\n    return x + 1\n```\n\nА **CPython** решает, как именно это выполнить внутри:\n\n```text\nPython-код\n↓\nбайткод\n↓\nвиртуальная машина CPython\n↓\nGIL, refcount, GC, C API и т.д.\n```\n\nGIL находится именно на этом уровне — внутри реализации интерпретатора.\n\n### Почему тогда говорят “GIL в Python”\n\nПотому что под “Python” чаще всего имеют в виду **CPython**. В обычной сборке CPython с включённым GIL только один поток может выполнять Python-байткод в один момент времени. Это ограничивает CPU-bound многопоточность. \n\nНо это не требование самого языка. Например, начиная с Python 3.13 у CPython есть free-threaded сборка, где GIL может быть отключён. Документация прямо описывает это как сборку CPython без GIL. \n\n### Итог\n\nПравильная формулировка:\n\n```text\nGIL — это не часть языка Python,\nа механизм реализации CPython.\n```\n\nЕщё точнее:\n\n```text\nВ стандартной GIL-enabled сборке CPython GIL ограничивает выполнение Python-байткода одним потоком за раз,\nно сам язык Python не требует наличия GIL.\n```"
