  question = "Какой недостаток механизма подсчёта ссылок?"
  answer = "### Главный недостаток подсчёта ссылок\r\n\r\nОсновной недостаток механизма подсчёта ссылок — он **сам по себе не умеет удалять циклические ссылки**.\r\n\r\nТо есть если объекты ссылаются друг на друга, их счётчики ссылок не становятся равными `0`, даже если из программы эти объекты уже недоступны.\r\n\r\n### Пример проблемы\r\n\r\n```python\r\na = []\r\nb = []\r\n\r\na.append(b)\r\nb.append(a)\r\n\r\ndel a\r\ndel b\r\n```\r\n\r\nСхематично:\r\n\r\n```text\r\nlist1 <──> list2\r\n```\r\n\r\nПосле:\r\n\r\n```python\r\ndel a\r\ndel b\r\n```\r\n\r\nвнешних имён больше нет, но списки всё ещё держат друг друга:\r\n\r\n```text\r\nlist1 ссылается на list2\r\nlist2 ссылается на list1\r\n```\r\n\r\nДля подсчёта ссылок это выглядит так:\r\n\r\n```text\r\nу list1 есть ссылка от list2\r\nу list2 есть ссылка от list1\r\n```\r\n\r\nЗначит счётчик ссылок не равен `0`, и простой reference counting не удалит эти объекты.\r\n\r\n### Почему это проблема\r\n\r\nОбъекты уже недоступны из программы:\r\n\r\n```text\r\nпрограмма больше не может обратиться к этим спискам\r\n```\r\n\r\nНо они всё ещё занимают память:\r\n\r\n```text\r\nпамять занята\r\nобъекты логически уже мусор\r\nно счётчик ссылок не равен 0\r\n```\r\n\r\nЭто называется **циклический мусор**.\r\n\r\n### Как CPython решает эту проблему\r\n\r\nВ CPython есть дополнительный механизм — **циклический garbage collector**.\r\n\r\nОн нужен именно для таких случаев:\r\n\r\n```text\r\nобъекты ссылаются друг на друга\r\nно снаружи уже недоступны\r\n```\r\n\r\nТо есть в CPython работают вместе:\r\n\r\n```text\r\nподсчёт ссылок\r\n+\r\ngarbage collector для циклов\r\n```\r\n\r\n### Другие недостатки подсчёта ссылок\r\n\r\nКроме циклов, есть ещё несколько минусов.\r\n\r\n### 1. Накладные расходы\r\n\r\nКаждый раз, когда появляется или исчезает ссылка, счётчик нужно обновлять.\r\n\r\n```python\r\na = obj  # увеличить счётчик ссылок\r\ndel a    # уменьшить счётчик ссылок\r\n```\r\n\r\nТаких операций в программе очень много, поэтому это создаёт постоянную нагрузку.\r\n\r\n### 2. Дополнительная память\r\n\r\nУ каждого объекта в CPython есть служебное поле для счётчика ссылок:\r\n\r\n```text\r\nob_refcnt\r\n```\r\n\r\nЭто увеличивает размер каждого объекта.\r\n\r\n### 3. Сложность в многопоточности\r\n\r\nЕсли несколько потоков одновременно меняют ссылки на объекты, нужно безопасно обновлять счётчики ссылок.\r\n\r\nИначе возможна ситуация:\r\n\r\n```text\r\nодин поток увеличивает счётчик\r\nдругой поток уменьшает счётчик\r\nрезультат повреждается\r\n```\r\n\r\nВ обычном CPython это связано с GIL: глобальная блокировка помогает защищать внутреннее состояние интерпретатора, включая операции со ссылками.\r\n\r\n### 4. Удаление может произойти в неудобный момент\r\n\r\nКогда счётчик ссылок стал `0`, объект может быть уничтожен сразу.\r\n\r\nИногда это вызывает цепочку удалений:\r\n\r\n```text\r\nудалили один объект\r\n↓\r\nон отпустил ссылки на другие объекты\r\n↓\r\nте тоже стали ненужны\r\n↓\r\nначалась цепочка освобождения памяти\r\n```\r\n\r\nОбычно это нормально, но в больших структурах данных может дать заметную задержку.\r\n\r\n### Коротко\r\n\r\nГлавный недостаток:\r\n\r\n```text\r\nподсчёт ссылок не справляется с циклическими ссылками\r\n```\r\n\r\nПример:\r\n\r\n```text\r\nobject A -> object B\r\nobject B -> object A\r\n```\r\n\r\nЕсли снаружи на них больше нет ссылок, они уже мусор, но их счётчики ссылок всё ещё не равны `0`.\r\n\r\nПоэтому в CPython одного подсчёта ссылок недостаточно. Нужен дополнительный сборщик мусора для циклов.\r"
  popularity = 2.63

