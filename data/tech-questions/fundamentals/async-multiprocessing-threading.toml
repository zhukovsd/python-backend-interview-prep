[[questions]]
  id = 30
  question = "На чём основана асинхронность в Python под капотом?"
  answer = "Асинхронность в Python основана на 4 главных вещах:\n\n```text\n1. coroutine-объекты\n2. event loop\n3. cooperative scheduling\n4. неблокирующий I/O через системные механизмы ОС\n```\n\nТо есть `asyncio` — это не магия и не автоматические потоки. Это модель, где задачи сами отдают управление в точках `await`, а `event loop` решает, какую задачу продолжить дальше.\n\n---\n\n### 1. Coroutine: функция, которую можно приостанавливать\n\nКогда ты пишешь:\n\n```python\nasync def fetch_data():\n    await some_io()\n    return \"done\"\n```\n\n`fetch_data()` не выполняется сразу как обычная функция.\n\n```python\ncoro = fetch_data()\n```\n\nЗдесь создаётся coroutine-объект.\n\n```text\nasync def\n↓\nсоздаёт coroutine-функцию\n\nвызов async-функции\n↓\nсоздаёт coroutine-объект\n\nawait / Task / event loop\n↓\nзапускает или продолжает coroutine\n```\n\nPEP 492 ввёл нативные корутины и синтаксис `async` / `await`; `async def` функции являются корутинами. \n\n---\n\n### 2. `await`: точка добровольной остановки\n\n`await` — это место, где coroutine может приостановиться и отдать управление event loop.\n\n```python\nasync def main():\n    print(\"before\")\n    await asyncio.sleep(1)\n    print(\"after\")\n```\n\nНа `await asyncio.sleep(1)` coroutine говорит:\n\n```text\n\"Я сейчас жду.\nПока меня не продолжай.\nМожешь запустить другую задачу.\"\n```\n\nВажно: переключение не происходит в любой случайный момент. Оно происходит кооперативно — когда задача доходит до `await` и ожидаемый объект ещё не готов.\n\n---\n\n### 3. Event loop: диспетчер асинхронных задач\n\n`event loop` хранит и обслуживает:\n\n```text\nготовые задачи\nспящие задачи\nтаймеры\nсетевые события\nFuture-объекты\ncallbacks\n```\n\nУпрощённо:\n\n```text\nevent loop:\n    взять готовую задачу\n    выполнить её до ближайшего await\n    если задача ждёт I/O — поставить её на ожидание\n    если другая задача готова — запустить её\n    когда I/O готово — вернуть задачу в очередь готовых\n```\n\nДокументация Python описывает `asyncio` как библиотеку для конкурентного кода через `async/await`; она включает высокоуровневые API для запуска корутин, управления event loop, сетевого I/O, subprocess и синхронизации. \n\n---\n\n### 4. Cooperative scheduling\n\nВ `asyncio` используется кооперативная многозадачность.\n\n```text\nОС-потоки:\nоперационная система может вытеснить поток почти в любой момент\n\nasyncio-задачи:\nзадача сама отдаёт управление через await\n```\n\nПример:\n\n```python\nimport asyncio\n\n\nasync def task_a():\n    print(\"A start\")\n    await asyncio.sleep(1)\n    print(\"A end\")\n\n\nasync def task_b():\n    print(\"B start\")\n    await asyncio.sleep(1)\n    print(\"B end\")\n\n\nasync def main():\n    await asyncio.gather(task_a(), task_b())\n\n\nasyncio.run(main())\n```\n\nСхема:\n\n```text\ntask_a start\n↓\nawait sleep\n↓\nevent loop переключается на task_b\n↓\ntask_b start\n↓\nawait sleep\n↓\nevent loop ждёт ближайшее событие\n↓\nпродолжает готовые задачи\n```\n\nВ концептуальном обзоре asyncio показано, что coroutine можно обернуть в `Task`, а `Task` планируется на выполнение через event loop. \n\n---\n\n### 5. Future: объект будущего результата\n\nПод капотом многие операции в `asyncio` завязаны на `Future`.\n\n`Future` — это объект, который представляет результат, который появится позже.\n\n```text\nFuture:\n    пока результата нет → pending\n    результат появился → done\n    ошибка появилась → exception\n    отменили → cancelled\n```\n\nCoroutine может ждать `Future`:\n\n```python\nresult = await future\n```\n\nПока `Future` не готов, coroutine приостанавливается. Когда `Future` получает результат, event loop возвращает coroutine в очередь готовых задач.\n\nВ документации Python `asyncio.Future` описан как awaitable-объект, представляющий eventual result асинхронной операции. \n\n---\n\n### 6. Неблокирующий I/O и мультиплексирование\n\nСамое важное под капотом: `asyncio` эффективно работает с I/O не потому, что создаёт поток на каждый запрос, а потому что использует неблокирующий I/O.\n\nУпрощённо:\n\n```text\nобычный socket.recv()\n↓\nпоток зависает, пока данные не придут\n\nnon-blocking socket\n↓\nесли данных нет, поток не зависает\nevent loop ждёт уведомления от ОС\n```\n\nДля ожидания множества I/O-событий Python использует механизмы мультиплексирования I/O. Модуль `selectors` предоставляет высокоуровневое эффективное I/O-мультиплексирование поверх примитивов модуля `select`. \n\nНа уровне ОС это может быть:\n\n```text\nLinux   → epoll\nmacOS   → kqueue\nWindows → IOCP / ProactorEventLoop\n```\n\nИдея такая:\n\n```text\nevent loop спрашивает ОС:\n\"сообщи мне, когда один из этих сокетов будет готов\"\n\nОС сообщает:\n\"сокет #4 готов к чтению\"\n\nevent loop:\n\"значит, задачу, которая ждала сокет #4, можно продолжить\"\n```\n\n---\n\n### 7. Почему это работает без множества потоков\n\nПотому что при сетевом I/O программа большую часть времени не считает, а ждёт:\n\n```text\nждёт ответ от БД\nждёт HTTP-ответ\nждёт данные из socket\nждёт Redis\nждёт Kafka/RabbitMQ\n```\n\n`asyncio` использует это время ожидания:\n\n```text\nзадача A ждёт сеть\n↓\nevent loop запускает задачу B\n\nзадача B ждёт БД\n↓\nevent loop запускает задачу C\n```\n\nПоэтому `asyncio` хорошо подходит для I/O-bound задач, но не делает CPU-bound вычисления автоматически параллельными.\n\n---\n\n### 8. Что происходит при `asyncio.run(main())`\n\n```python\nimport asyncio\n\n\nasync def main():\n    print(\"hello\")\n\n\nasyncio.run(main())\n```\n\nУпрощённо:\n\n```text\nasyncio.run(main())\n↓\nсоздаёт event loop\n↓\nсоздаёт coroutine main()\n↓\nзапускает её в event loop\n↓\nвыполняет задачи до завершения\n↓\nзакрывает event loop\n```\n\n`asyncio.run()` в документации описан как высокоуровневый способ запуска asyncio-кода, построенный поверх event loop. \n\n---\n\n### 9. Общая схема под капотом\n\n```text\nasync def функция\n        ↓\ncoroutine object\n        ↓\nTask\n        ↓\nevent loop\n        ↓\nвыполнение до await\n        ↓\nожидание Future / I/O / таймера\n        ↓\nselector / ОС сообщает о готовности\n        ↓\nFuture становится done\n        ↓\nTask возвращается в очередь готовых\n        ↓\ncoroutine продолжается\n```\n\n---\n\n### Итог\n\nАсинхронность в Python под капотом основана не на параллельном выполнении корутин, а на управляемом приостановлении и возобновлении выполнения.\n\n```text\nasync/await\n→ синтаксис для корутин\n\ncoroutine\n→ объект, который можно приостановить\n\nTask\n→ coroutine, запланированная в event loop\n\nFuture\n→ будущий результат операции\n\nevent loop\n→ планировщик задач\n\nselectors / epoll / kqueue / IOCP\n→ механизм ОС для ожидания I/O без блокировки потока\n```\n\nГлавная формула:\n\n```text\nasyncio = корутины + event loop + cooperative scheduling + non-blocking I/O\n```"
  popularity = 2.63

[[questions]]
  id = 31
  question = "Разница между корутинами и функциями"
  answer = "Обычная функция выполняется сразу и до конца, пока не вернёт результат или не выбросит исключение.\n\nКорутина — это функция, выполнение которой можно приостановить и потом продолжить. В Python корутина обычно создаётся через `async def`, а запускается через `await`, `asyncio.run()` или `asyncio.create_task()`. В документации Python термин “coroutine” используется для двух вещей: coroutine function — функция `async def`, и coroutine object — объект, полученный при вызове этой функции. \n\n---\n\n### Обычная функция\n\n```python\ndef get_data():\n    return \"data\"\n\n\nresult = get_data()\nprint(result)\n```\n\nЧто происходит:\n\n```text\nget_data() вызвана\n↓\nкод внутри функции сразу выполняется\n↓\nreturn возвращает результат\n↓\nresult получает \"data\"\n```\n\nОбычная функция при вызове сразу начинает выполняться.\n\n---\n\n### Корутина\n\n```python\nimport asyncio\n\n\nasync def get_data():\n    await asyncio.sleep(1)\n    return \"data\"\n\n\ncoro = get_data()\nprint(coro)\n```\n\nЗдесь `get_data()` не выполняет тело функции сразу. Она создаёт coroutine object.\n\nЧтобы реально выполнить корутину, нужно:\n\n```python\nresult = await get_data()\n```\n\nили:\n\n```python\nasyncio.run(get_data())\n```\n\nили создать задачу:\n\n```python\ntask = asyncio.create_task(get_data())\n```\n\nДокументация Python отдельно показывает, что простой вызов coroutine function создаёт coroutine object, а выполнение происходит через `await` или запуск в event loop. \n\n---\n\n### Главное отличие\n\n```text\nОбычная функция:\nвызвал → выполнилась → вернула результат\n\nКорутина:\nвызвал → получил coroutine object\nawait → корутина начала/продолжила выполнение\n```\n\nПример:\n\n```python\ndef regular_func():\n    print(\"regular\")\n    return 10\n\n\nasync def coroutine_func():\n    print(\"coroutine\")\n    return 20\n\n\na = regular_func()\nb = coroutine_func()\n\nprint(a)\nprint(b)\n```\n\nРезультат будет примерно такой:\n\n```text\nregular\n10\n<coroutine object coroutine_func at ...>\n```\n\nПочему?\n\n```text\nregular_func()\n→ сразу выполнилась\n\ncoroutine_func()\n→ не выполнилась, а вернула coroutine object\n```\n\n---\n\n### `await` — точка приостановки\n\nКорутина может приостанавливаться на `await`:\n\n```python\nasync def handler():\n    print(\"start\")\n    await asyncio.sleep(1)\n    print(\"end\")\n```\n\nСхема:\n\n```text\nhandler начал выполнение\n↓\nprint(\"start\")\n↓\nawait asyncio.sleep(1)\n↓\nкорутина приостановилась\n↓\nevent loop может выполнять другие задачи\n↓\nчерез 1 секунду handler продолжился\n↓\nprint(\"end\")\n```\n\nОбычная функция так не умеет. Если внутри обычной функции стоит блокирующая операция:\n\n```python\nimport time\n\n\ndef handler():\n    print(\"start\")\n    time.sleep(1)\n    print(\"end\")\n```\n\nто поток просто блокируется на `time.sleep(1)`.\n\n---\n\n### Разница в возвращаемом результате\n\nОбычная функция:\n\n```python\ndef add(a, b):\n    return a + b\n\n\nresult = add(2, 3)\n```\n\n```text\nresult = 5\n```\n\nКорутина:\n\n```python\nasync def add(a, b):\n    return a + b\n\n\nresult = add(2, 3)\n```\n\n```text\nresult = <coroutine object ...>\n```\n\nЧтобы получить `5`, нужно:\n\n```python\nresult = await add(2, 3)\n```\n\nили:\n\n```python\nresult = asyncio.run(add(2, 3))\n```\n\n---\n\n### Таблица различий\n\n|Критерий|Обычная функция|Корутина|\n|---|---|---|\n|Объявление|`def`|`async def`|\n|Что возвращает при вызове|результат выполнения|coroutine object|\n|Выполняется ли сразу при вызове|да|нет|\n|Может использовать `await`|нет|да|\n|Может приостанавливаться|нет|да|\n|Кто управляет выполнением|обычный поток выполнения|event loop|\n|Основная область применения|обычная логика, CPU-код, синхронный код|I/O-bound задачи, сеть, БД, таймеры|\n|Можно ли запустить конкурентно|только через потоки/процессы|через `asyncio.create_task`, `gather`|\n\n---\n\n### Проверка через `inspect`\n\n```python\nimport inspect\n\n\ndef regular_func():\n    pass\n\n\nasync def coroutine_func():\n    pass\n\n\nprint(inspect.iscoroutinefunction(regular_func))\nprint(inspect.iscoroutinefunction(coroutine_func))\n```\n\nРезультат:\n\n```text\nFalse\nTrue\n```\n\n`inspect.iscoroutinefunction()` проверяет, является ли объект coroutine function, то есть функцией, определённой через `async def`. `inspect.iscoroutine()` проверяет уже coroutine object, полученный после вызова coroutine function. \n\n---\n\n### Важный пример\n\n```python\nimport asyncio\n\n\nasync def load_user():\n    print(\"load user start\")\n    await asyncio.sleep(1)\n    print(\"load user end\")\n    return {\"id\": 1}\n\n\nasync def load_orders():\n    print(\"load orders start\")\n    await asyncio.sleep(1)\n    print(\"load orders end\")\n    return [1, 2, 3]\n\n\nasync def main():\n    user_task = asyncio.create_task(load_user())\n    orders_task = asyncio.create_task(load_orders())\n\n    user = await user_task\n    orders = await orders_task\n\n    print(user, orders)\n\n\nasyncio.run(main())\n```\n\nЗдесь `load_user()` и `load_orders()` могут выполняться конкурентно, потому что обе корутины отдают управление event loop на `await asyncio.sleep(1)`.\n\nС обычными функциями без потоков/процессов такого переключения не будет.\n\n---\n\n### Итог\n\n```text\nФункция:\nобычный вызываемый блок кода,\nкоторый выполняется сразу и возвращает результат.\n\nКорутина:\nасинхронная функция,\nкоторая при вызове создаёт coroutine object,\nможет приостанавливаться на await\nи выполняется под управлением event loop.\n```\n\nСамая короткая разница:\n\n```text\ndef func()\n→ вызов сразу выполняет код\n\nasync def func()\n→ вызов создаёт coroutine object\n→ выполнение начинается через await / Task / event loop\n```"
