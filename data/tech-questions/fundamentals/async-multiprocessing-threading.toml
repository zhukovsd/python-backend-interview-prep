  question = "Как выполнить много корутин (asyncio.gather)?"
  answer = "`asyncio.gather()` нужен, чтобы запустить несколько awaitable-объектов конкурентно и дождаться их всех.\n\nБазовый шаблон:\n\n```python\nimport asyncio\n\n\nasync def worker(number: int):\n    await asyncio.sleep(1)\n    return f\"done {number}\"\n\n\nasync def main():\n    results = await asyncio.gather(\n        worker(1),\n        worker(2),\n        worker(3),\n    )\n\n    print(results)\n\n\nasyncio.run(main())\n```\n\nВывод:\n\n```text\n['done 1', 'done 2', 'done 3']\n```\n\n`asyncio.gather(*aws)` запускает awaitable-объекты конкурентно. Если среди них coroutine, она автоматически оборачивается в `Task`. Результаты возвращаются списком в том же порядке, в котором awaitable были переданы в `gather()`. \n\n### Почему это конкурентно\n\nБез `gather()`:\n\n```python\nresult_1 = await worker(1)\nresult_2 = await worker(2)\nresult_3 = await worker(3)\n```\n\nСхема:\n\n```text\nworker(1) → ждём завершения\nworker(2) → ждём завершения\nworker(3) → ждём завершения\n```\n\nС `gather()`:\n\n```python\nresults = await asyncio.gather(\n    worker(1),\n    worker(2),\n    worker(3),\n)\n```\n\nСхема:\n\n```text\nworker(1) ┐\nworker(2) ├─ выполняются конкурентно\nworker(3) ┘\n↓\ngather ждёт завершения всех\n```\n\nВажно: это не значит, что они выполняются параллельно на разных ядрах. В `asyncio` конкурентность достигается за счёт переключения между корутинами в моменты `await`.\n\n### Много корутин из списка\n\nЧасто корутины лежат в списке. Тогда нужен оператор распаковки `*`:\n\n```python\nimport asyncio\n\n\nasync def fetch(user_id: int):\n    await asyncio.sleep(1)\n    return {\"id\": user_id}\n\n\nasync def main():\n    user_ids = [1, 2, 3, 4, 5]\n\n    coroutines = [fetch(user_id) for user_id in user_ids]\n\n    results = await asyncio.gather(*coroutines)\n\n    print(results)\n\n\nasyncio.run(main())\n```\n\nБез `*` будет ошибка, потому что `gather()` ждёт отдельные awaitable-объекты:\n\n```python\nawait asyncio.gather(coro1, coro2, coro3)\n```\n\nа не один список:\n\n```python\nawait asyncio.gather([coro1, coro2, coro3])  # неправильно\n```\n\nПравильно:\n\n```python\nawait asyncio.gather(*[coro1, coro2, coro3])\n```\n\n### Можно передавать уже созданные Task\n\nТак тоже можно:\n\n```python\nimport asyncio\n\n\nasync def worker(number: int):\n    await asyncio.sleep(1)\n    return number * 10\n\n\nasync def main():\n    tasks = [\n        asyncio.create_task(worker(1)),\n        asyncio.create_task(worker(2)),\n        asyncio.create_task(worker(3)),\n    ]\n\n    results = await asyncio.gather(*tasks)\n\n    print(results)\n\n\nasyncio.run(main())\n```\n\nНо для простого случая `create_task()` не обязателен:\n\n```python\nawait asyncio.gather(worker(1), worker(2), worker(3))\n```\n\nПотому что `gather()` сам запланирует coroutine как задачи. \n\n### Что будет при ошибке\n\nПо умолчанию, если одна корутина выбросит исключение, это исключение будет проброшено наружу из `gather()`:\n\n```python\nimport asyncio\n\n\nasync def good():\n    await asyncio.sleep(1)\n    return \"ok\"\n\n\nasync def bad():\n    await asyncio.sleep(0.5)\n    raise ValueError(\"error\")\n\n\nasync def main():\n    try:\n        result = await asyncio.gather(good(), bad())\n        print(result)\n    except ValueError as error:\n        print(f\"Поймали ошибку: {error}\")\n\n\nasyncio.run(main())\n```\n\nПри `return_exceptions=False`, это значение по умолчанию, первое исключение сразу передаётся ожидающему коду. Остальные awaitable не отменяются автоматически и продолжают выполнение. \n\n### Собрать ошибки как результаты\n\nМожно сделать так, чтобы ошибки попали в список результатов:\n\n```python\nimport asyncio\n\n\nasync def good():\n    await asyncio.sleep(1)\n    return \"ok\"\n\n\nasync def bad():\n    await asyncio.sleep(0.5)\n    raise ValueError(\"error\")\n\n\nasync def main():\n    results = await asyncio.gather(\n        good(),\n        bad(),\n        return_exceptions=True,\n    )\n\n    print(results)\n\n\nasyncio.run(main())\n```\n\nПример результата:\n\n```text\n['ok', ValueError('error')]\n```\n\nПри `return_exceptions=True` исключения обрабатываются как обычные результаты и собираются в итоговый список. \n\n### Ограничение количества одновременных задач\n\nЕсли задач много, например 10 000 HTTP-запросов, не стоит запускать все сразу. Обычно используют `asyncio.Semaphore`:\n\n```python\nimport asyncio\n\n\nsem = asyncio.Semaphore(3)\n\n\nasync def fetch(number: int):\n    async with sem:\n        print(f\"start {number}\")\n        await asyncio.sleep(1)\n        print(f\"end {number}\")\n        return number\n\n\nasync def main():\n    tasks = [fetch(i) for i in range(10)]\n\n    results = await asyncio.gather(*tasks)\n\n    print(results)\n\n\nasyncio.run(main())\n```\n\nЗдесь одновременно будут выполняться максимум 3 корутины внутри блока:\n\n```python\nasync with sem:\n    ...\n```\n\n### Timeout на gather\n\nМожно ограничить общее время выполнения:\n\n```python\nimport asyncio\n\n\nasync def worker(number: int):\n    await asyncio.sleep(number)\n    return number\n\n\nasync def main():\n    try:\n        results = await asyncio.wait_for(\n            asyncio.gather(\n                worker(1),\n                worker(2),\n                worker(5),\n            ),\n            timeout=3,\n        )\n        print(results)\n    except TimeoutError:\n        print(\"Не все задачи успели завершиться\")\n\n\nasyncio.run(main())\n```\n\nСхема:\n\n```text\ngather(...) запускает несколько задач\nwait_for(...) ограничивает общее ожидание\n```\n\n### Кратко\n\n```python\nresults = await asyncio.gather(coro1(), coro2(), coro3())\n```\n\nДля списка:\n\n```python\nresults = await asyncio.gather(*coroutines)\n```\n\nПоведение:\n\n```text\ngather запускает awaitable конкурентно\nждёт завершения всех\nвозвращает список результатов\nпорядок результатов соответствует порядку аргументов\nпри ошибке по умолчанию пробрасывает исключение\nreturn_exceptions=True собирает ошибки в список\n```\n\nГлавная ошибка новичков:\n\n```python\nawait asyncio.gather(coroutines)   # неправильно\nawait asyncio.gather(*coroutines)  # правильно\n```"
  popularity = 2.63

