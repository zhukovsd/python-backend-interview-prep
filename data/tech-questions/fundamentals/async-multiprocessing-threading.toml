  question = "Что такое Гринлеты (greenlet) и чем они отличаются от Асинхронности"
  answer = "`greenlet` — это лёгкая корутина, которая умеет вручную переключать выполнение с одного участка кода на другой внутри одного процесса и обычно внутри одного потока.\n\n`asyncio` / асинхронность — это модель, где корутины переключаются через `await`, а их выполнением управляет event loop.\n\n```text\ngreenlet\n= ручное переключение: g1.switch()\n\nasyncio\n= переключение через await под управлением event loop\n```\n\nОфициальная документация `greenlet` описывает greenlets как lightweight coroutines для in-process concurrent programming. Документация `asyncio` описывает `asyncio` как библиотеку для concurrent code через синтаксис `async/await`. \n\n### Что такое greenlet\n\n`greenlet` — это объект, который хранит собственный стек выполнения и может быть приостановлен, а потом продолжен с того же места.\n\nПример:\n\n```python\nfrom greenlet import greenlet\n\ndef task1():\n    print(\"task1: start\")\n    g2.switch()\n    print(\"task1: end\")\n\ndef task2():\n    print(\"task2: start\")\n    g1.switch()\n    print(\"task2: end\")\n\ng1 = greenlet(task1)\ng2 = greenlet(task2)\n\ng1.switch()\n```\n\nРезультат будет примерно такой:\n\n```text\ntask1: start\ntask2: start\ntask1: end\n```\n\nЧто произошло:\n\n```text\ng1 начал выполняться\n↓\ng1 вручную переключился на g2\n↓\ng2 начал выполняться\n↓\ng2 вручную переключился обратно на g1\n↓\ng1 продолжил выполнение\n```\n\nВ `greenlet` переключение происходит через `.switch()`. Документация прямо говорит, что переключение между greenlet-ами происходит при вызове `greenlet.switch()` или `greenlet.throw()`. \n\n### Главное свойство greenlet\n\nGreenlet может переключиться из глубоко вложенного вызова без `await`.\n\nНапример:\n\n```python\nfrom greenlet import greenlet\n\ndef deep_function():\n    print(\"inside deep function\")\n    main.switch()\n    print(\"back inside deep function\")\n\ndef worker():\n    print(\"worker start\")\n    deep_function()\n    print(\"worker end\")\n\nmain = greenlet.getcurrent()\ng = greenlet(worker)\n\ng.switch()\nprint(\"main continues\")\ng.switch()\n```\n\nЗдесь `deep_function()` может отдать управление наружу через `main.switch()`, хотя сама функция не объявлена как `async def` и внутри нет `await`.\n\nЭто важное отличие от `asyncio`.\n\n### Что такое асинхронность в Python\n\nВ современном Python под асинхронностью обычно имеют в виду `asyncio`:\n\n```python\nimport asyncio\n\nasync def task1():\n    print(\"task1: start\")\n    await asyncio.sleep(1)\n    print(\"task1: end\")\n\nasync def task2():\n    print(\"task2: start\")\n    await asyncio.sleep(1)\n    print(\"task2: end\")\n\nasync def main():\n    await asyncio.gather(task1(), task2())\n\nasyncio.run(main())\n```\n\nЗдесь переключение происходит не через `.switch()`, а через `await`.\n\n```text\ntask1 работает до await\n↓\nevent loop запускает task2\n↓\ntask2 работает до await\n↓\nevent loop возвращается к task1\n```\n\nДокументация Python указывает, что event loop выполняет одну `Task` за раз; когда задача ждёт `Future`, event loop запускает другие задачи. \n\n### Основное отличие\n\n|Критерий|`greenlet`|`asyncio`|\n|---|---|---|\n|Как переключается выполнение|Через `.switch()`|Через `await`|\n|Кто управляет задачами|Сам код / библиотека поверх greenlet|Event loop|\n|Нужно ли писать `async def`|Нет|Да|\n|Нужно ли писать `await`|Нет|Да|\n|Уровень абстракции|Ниже|Выше|\n|Основное применение|Основа для библиотек вроде `gevent`, внутренние механизмы|Асинхронные приложения, веб-серверы, клиенты БД, HTTP|\n|Видимость переключений|Менее очевидная|Более явная|\n|Параллелизм на CPU|Нет сам по себе|Нет сам по себе|\n\n### Greenlet — это не поток\n\nGreenlet не равен `thread`.\n\n```text\nThread\n= поток ОС\n\nGreenlet\n= лёгкая корутина внутри процесса/потока\n```\n\nОбычно несколько greenlet-ов выполняются внутри одного OS thread:\n\n```text\nProcess\n └── Thread\n      ├── greenlet 1\n      ├── greenlet 2\n      └── greenlet 3\n```\n\nОни не выполняют Python-код одновременно на разных ядрах. Они просто переключаются между собой.\n\nДокументация `greenlet` отдельно отмечает, что greenlet-ы можно сочетать с Python threads, но у каждого потока своё дерево greenlet-ов, и нельзя переключаться между greenlet-ами разных потоков. \n\n### Greenlet — это низкоуровневая корутина\n\nМожно сказать так:\n\n```text\ngreenlet\n= низкоуровневый механизм переключения контекста\n\nasyncio\n= полноценная асинхронная модель с event loop, Task, Future, await\n```\n\nСам по себе `greenlet` не делает сетевой код асинхронным.\n\nНапример:\n\n```python\nimport requests\nfrom greenlet import greenlet\n\ndef task():\n    requests.get(\"https://example.com\")\n```\n\nЕсли `requests.get()` блокирует поток, то greenlet сам по себе не спасёт. Он не умеет автоматически превращать блокирующий I/O в неблокирующий.\n\nДля этого нужны библиотеки поверх greenlet, например `gevent`. Документация `gevent` описывает его как coroutine-based networking library, которая использует `greenlet` и event loop на базе libev/libuv. \n\n### Зачем тогда greenlet нужен\n\n`greenlet` полезен как строительный блок для библиотек, которые хотят дать “синхронный на вид” код, но внутри выполнять его конкурентно.\n\nНапример, вместо такого async-кода:\n\n```python\nasync def handler():\n    result = await db.fetch(...)\n```\n\nбиблиотека может дать более обычный стиль:\n\n```python\ndef handler():\n    result = db.fetch(...)\n```\n\nА внутри библиотека сама переключает greenlet-ы, когда операция ждёт I/O.\n\nИдея:\n\n```text\nкод выглядит синхронно\n↓\nно библиотека внутри переключает greenlet-ы\n↓\nдругие задачи могут выполняться во время ожидания I/O\n```\n\nТакой подход используют, например, `gevent` и некоторые внутренние механизмы библиотек.\n\n### В чём отличие от `async/await`\n\nВ `asyncio` точки переключения явно видны:\n\n```python\nawait something()\n```\n\nТы сразу видишь: здесь функция может приостановиться.\n\nВ greenlet переключение может быть спрятано внутри обычного вызова:\n\n```python\nresult = db.fetch()\n```\n\nСнаружи это выглядит как обычная синхронная функция, но внутри она может переключить greenlet.\n\nСравнение:\n\n```text\nasyncio:\nявная асинхронность\n\ngreenlet:\nскрытое переключение контекста\n```\n\n### Пример на уровне идеи\n\n`asyncio`:\n\n```python\nasync def get_data():\n    data = await fetch()\n    return data\n```\n\nТочка переключения видна:\n\n```text\nawait fetch()\n```\n\n`greenlet`:\n\n```python\ndef get_data():\n    data = fetch()\n    return data\n```\n\nТочка переключения может быть внутри `fetch()`:\n\n```text\nfetch()\n └── внутри где-то вызван greenlet.switch()\n```\n\n### Связь с кооперативной многозадачностью\n\nИ `greenlet`, и `asyncio` относятся к кооперативной модели.\n\nТо есть задача сама должна уступить управление:\n\n```text\ngreenlet → через switch()\nasyncio   → через await\n```\n\nНо разница в том, что `asyncio` встроен в язык и стандартную библиотеку как понятная модель `async/await`, а `greenlet` — сторонний низкоуровневый механизм переключения стеков.\n\n### Важное ограничение\n\n`greenlet` не решает проблему GIL.\n\n```text\ngreenlet ≠ multiprocessing\ngreenlet ≠ параллельное выполнение на нескольких ядрах\ngreenlet ≠ ускорение CPU-bound задач\n```\n\nЕсли задача CPU-bound:\n\n```python\ndef cpu_heavy():\n    for i in range(100_000_000):\n        ...\n```\n\nто greenlet не сделает её параллельной. Для CPU-bound обычно нужны:\n\n```text\nmultiprocessing\nProcessPoolExecutor\nнативные расширения, которые отпускают GIL\n```\n\n### Итог\n\n```text\ngreenlet\n= низкоуровневая лёгкая корутина\n= ручное переключение через .switch()\n= может прятать переключение внутри обычных функций\n= часто используется библиотеками вроде gevent\n\nasyncio\n= стандартная async-модель Python\n= event loop + Task + Future + async/await\n= переключение явно через await\n= основной современный способ писать асинхронный I/O в Python\n```\n\nГлавная разница:\n\n```text\nasyncio заставляет явно писать async/await\n\ngreenlet позволяет переключать выполнение без async/await,\nно сам по себе не даёт полноценный асинхронный I/O\n```\n\nПрактически: для обычного современного Python-кода чаще выбирают `asyncio`. `greenlet` чаще встречается внутри библиотек или фреймворков, которым нужно дать синхронный API поверх конкурентного выполнения."
