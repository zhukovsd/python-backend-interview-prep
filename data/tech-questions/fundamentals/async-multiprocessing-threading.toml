  question = "Чем отличаются многопоточность и многопроцессность?"
  answer = "### Главное различие\n\n`threading` — несколько потоков внутри одного процесса.  \n`multiprocessing` — несколько отдельных процессов.\n\nТочнее: в Python чаще говорят не “многопроцессорность”, а “многопроцессность”. Многопроцессорность — это скорее про железо: несколько CPU/ядер. `multiprocessing` — про запуск нескольких процессов, которые могут использовать эти ядра.\n\n### Коротко\n\n|Критерий|`threading`|`multiprocessing`|\n|---|---|---|\n|Единица выполнения|Поток|Процесс|\n|Память|Общая память процесса|У каждого процесса своя память|\n|GIL в обычном CPython|Один GIL на процесс|У каждого процесса свой GIL|\n|CPU-bound задачи|Обычно плохо ускоряются|Хорошо подходят|\n|I/O-bound задачи|Хорошо подходят|Обычно избыточно|\n|Обмен данными|Проще, но нужны lock-и|Сложнее: queue, pipe, shared memory|\n|Расход памяти|Меньше|Больше|\n|Создание/переключение|Дешевле|Дороже|\n|Риск race condition|Высокий из-за общей памяти|Ниже, потому что память изолирована|\n\n### `threading`\n\n`threading` создаёт потоки внутри одного процесса:\n\n```text\nProcess\n ├── Thread 1\n ├── Thread 2\n └── Thread 3\n```\n\nПотоки разделяют одну память:\n\n```python\nimport threading\n\ncounter = 0\n\ndef work():\n    global counter\n    for _ in range(100_000):\n        counter += 1\n\nthreads = [threading.Thread(target=work) for _ in range(4)]\n\nfor t in threads:\n    t.start()\n\nfor t in threads:\n    t.join()\n\nprint(counter)\n```\n\nПроблема: потоки работают с общими объектами. Поэтому возможны race condition, и для защиты общих данных нужны `Lock`, `RLock`, `Semaphore`, `Queue` и другие механизмы синхронизации.\n\nВ обычной сборке CPython GIL ограничивает выполнение Python-байткода: в один момент времени только один поток выполняет Python-код. Поэтому `threading` обычно не даёт сильного ускорения для CPU-bound задач. Но он полезен для I/O-bound задач: сеть, файлы, ожидание ответа БД, HTTP-запросы и т.д. Документация Python прямо указывает, что GIL ограничивает выгоду от `threading` для CPU-bound задач, но потоки всё равно полезны для конкурентного выполнения, особенно когда поток часто ждёт I/O. \n\n### `multiprocessing`\n\n`multiprocessing` запускает отдельные процессы:\n\n```text\nMain Process\n ├── Worker Process 1\n ├── Worker Process 2\n └── Worker Process 3\n```\n\nУ каждого процесса своя память и свой интерпретатор Python:\n\n```python\nfrom multiprocessing import Process\n\ndef work():\n    total = 0\n    for i in range(10_000_000):\n        total += i\n    print(total)\n\nprocesses = [Process(target=work) for _ in range(4)]\n\nfor p in processes:\n    p.start()\n\nfor p in processes:\n    p.join()\n```\n\nТак как процессы отдельные, они обходят ограничение одного GIL на процесс. Поэтому `multiprocessing` позволяет реально задействовать несколько CPU-ядер для CPU-bound задач. В документации Python сказано, что `multiprocessing` использует subprocesses вместо threads и таким образом обходит GIL, позволяя использовать несколько процессоров/ядер. \n\nМинус: процессы тяжелее потоков. У них отдельная память, дороже запуск, сложнее обмен данными. Чтобы передать данные между процессами, обычно используют `Queue`, `Pipe`, `Manager`, `shared_memory` или сериализацию через `pickle`.\n\n### CPU-bound vs I/O-bound\n\nCPU-bound — задача упирается в вычисления процессора:\n\n```python\n# CPU-bound\nfor i in range(100_000_000):\n    result += i * i\n```\n\nДля таких задач лучше:\n\n```python\nmultiprocessing\nProcessPoolExecutor\n```\n\nI/O-bound — задача большую часть времени ждёт внешний ресурс:\n\n```python\n# I/O-bound\nresponse = requests.get(\"https://example.com\")\ndata = db.query(...)\nfile.read()\n```\n\nДля таких задач обычно подходят:\n\n```python\nthreading\nThreadPoolExecutor\nasyncio\n```\n\nPython-документация по конкурентному выполнению прямо разделяет выбор инструмента по типу задачи: CPU-bound или I/O-bound. \n\n### Через `concurrent.futures`\n\nНа практике часто используют не `Thread` и `Process` напрямую, а высокоуровневые пулы:\n\n```python\nfrom concurrent.futures import ThreadPoolExecutor, ProcessPoolExecutor\n```\n\nДля I/O-bound:\n\n```python\nfrom concurrent.futures import ThreadPoolExecutor\nimport requests\n\nurls = [\n    \"https://example.com\",\n    \"https://python.org\",\n]\n\ndef fetch(url):\n    return requests.get(url).status_code\n\nwith ThreadPoolExecutor(max_workers=4) as executor:\n    results = list(executor.map(fetch, urls))\n\nprint(results)\n```\n\nДля CPU-bound:\n\n```python\nfrom concurrent.futures import ProcessPoolExecutor\n\ndef calc(n):\n    return sum(i * i for i in range(n))\n\nwith ProcessPoolExecutor(max_workers=4) as executor:\n    results = list(executor.map(calc, [10_000_000] * 4))\n\nprint(results)\n```\n\n`concurrent.futures` даёт единый интерфейс: `ThreadPoolExecutor` для потоков и `ProcessPoolExecutor` для процессов. `ProcessPoolExecutor` использует `multiprocessing`, что позволяет обходить GIL, но требует, чтобы передаваемые функции и данные могли сериализоваться. \n\n### Почему `threading` не ускоряет CPU-bound код в обычном CPython\n\nПример:\n\n```python\ndef cpu_task():\n    total = 0\n    for i in range(50_000_000):\n        total += i\n    return total\n```\n\nЕсли запустить такую функцию в нескольких потоках, потоки будут конкурировать за GIL. Они могут переключаться между собой, но не будут одновременно выполнять Python-байткод на разных ядрах в рамках одного процесса.\n\nТо есть:\n\n```text\nThread 1: работает\nThread 2: ждёт GIL\nThread 3: ждёт GIL\nThread 4: ждёт GIL\n```\n\nА при `multiprocessing`:\n\n```text\nProcess 1: работает на CPU core 1\nProcess 2: работает на CPU core 2\nProcess 3: работает на CPU core 3\nProcess 4: работает на CPU core 4\n```\n\nПоэтому для тяжёлых вычислений чаще выбирают процессы.\n\n### Когда выбирать `threading`\n\n`threading` подходит, когда задача часто ждёт:\n\n```text\nHTTP-запросы\nработа с файлами\nзапросы к БД\nсетевые операции\nожидание внешнего API\n```\n\nПример:\n\n```python\n# Много сетевых запросов\n# Поток ждёт ответ сервера, в это время другой поток может работать\n```\n\nПлюсы:\n\n```text\n+ меньше расход памяти\n+ проще обмениваться объектами\n+ быстрее запуск, чем у процессов\n+ хорошо для I/O-bound\n```\n\nМинусы:\n\n```text\n- GIL мешает CPU-bound ускорению\n- общая память создаёт race condition\n- нужны lock-и\n- сложнее отлаживать ошибки конкуренции\n```\n\n### Когда выбирать `multiprocessing`\n\n`multiprocessing` подходит, когда задача реально грузит CPU:\n\n```text\nматематические вычисления\nобработка изображений\nпарсинг больших файлов\nсжатие/шифрование\nтяжёлая обработка данных\nML/численные расчёты, если код не уходит в C-библиотеки\n```\n\nПлюсы:\n\n```text\n+ реальный параллелизм на нескольких ядрах\n+ обход GIL\n+ изоляция памяти\n+ падение одного процесса меньше портит состояние других\n```\n\nМинусы:\n\n```text\n- больше расход RAM\n- дороже запуск\n- сложнее обмен данными\n- данные часто нужно сериализовать\n- на Windows особенно важно использовать if __name__ == \"__main__\"\n```\n\nПример для Windows и кроссплатформенного кода:\n\n```python\nfrom multiprocessing import Process\n\ndef work():\n    print(\"worker\")\n\nif __name__ == \"__main__\":\n    p = Process(target=work)\n    p.start()\n    p.join()\n```\n\n### Важный нюанс про новые версии Python\n\nНачиная с Python 3.13, в CPython появилась поддержка экспериментальной free-threaded сборки, где GIL может быть отключён. В такой сборке потоки могут использовать несколько CPU-ядер полноценнее. Но это не отменяет стандартное правило для обычного CPython: в типичной сборке GIL всё ещё важен, и для CPU-bound задач чаще используют процессы. \n### Итоговая формула\n\n```text\nМного ожидания I/O?\n    threading / ThreadPoolExecutor / asyncio\n\nМного чистых CPU-вычислений?\n    multiprocessing / ProcessPoolExecutor\n\nНужно простое конкурентное выполнение с общей памятью?\n    threading\n\nНужно реально загрузить несколько ядер CPU?\n    multiprocessing\n```\n\nГлавная мысль:\n\n```text\nthreading = конкурентность внутри одного процесса\nmultiprocessing = параллельность через несколько процессов\n```\n\nВ Python `threading` чаще используют для I/O-bound задач, а `multiprocessing` — для CPU-bound задач."
