  id = 33
  question = "Может ли Python-приложение использовать больше одного ядра CPU?"
  answer = "Да, Python-приложение может использовать больше одного ядра CPU.\n\nНо важно различать:\n\n```text\n1. Один Python-процесс + обычные потоки\n   → чаще всего не дают параллельного выполнения Python-кода на нескольких ядрах из-за GIL\n\n2. Несколько процессов\n   → могут реально использовать несколько ядер\n\n3. Нативные библиотеки\n   → могут использовать несколько ядер внутри C/C++/Rust-кода\n\n4. Free-threaded CPython\n   → новая сборка CPython без GIL, где потоки могут выполняться параллельно\n```\n\n---\n\n### 1. Обычный CPython и потоки\n\nВ стандартном CPython с включённым GIL несколько потоков могут существовать, но только один поток в один момент времени выполняет Python bytecode.\n\n```python\nimport threading\n```\n\nТо есть такая программа может создать несколько потоков:\n\n```text\nThread 1\nThread 2\nThread 3\nThread 4\n```\n\nНо для CPU-bound Python-кода они обычно не будут считать одновременно на 4 ядрах.\n\nДокументация Python прямо указывает: GIL ограничивает выгоду от `threading` для CPU-bound задач, потому что только один поток может выполнять Python bytecode за раз. \n\n---\n\n### 2. Для нескольких ядер обычно используют процессы\n\nКлассический способ задействовать несколько ядер в Python — `multiprocessing`.\n\n```python\nfrom multiprocessing import Pool\n\n\ndef cpu_task(x: int) -> int:\n    return x * x\n\n\nif __name__ == \"__main__\":\n    with Pool() as pool:\n        result = pool.map(cpu_task, range(10))\n\n    print(result)\n```\n\nСхема:\n\n```text\nПроцесс 1 → ядро CPU 1\nПроцесс 2 → ядро CPU 2\nПроцесс 3 → ядро CPU 3\nПроцесс 4 → ядро CPU 4\n```\n\n`multiprocessing` обходит GIL за счёт subprocess вместо потоков и позволяет полноценно использовать несколько процессоров/ядер на машине. \n\n---\n\n### 3. Через `ProcessPoolExecutor`\n\nВ async-проекте или обычном коде часто используют `ProcessPoolExecutor`.\n\n```python\nimport asyncio\nfrom concurrent.futures import ProcessPoolExecutor\n\n\ndef cpu_heavy(n: int) -> int:\n    total = 0\n\n    for i in range(n):\n        total += i * i\n\n    return total\n\n\nasync def main():\n    loop = asyncio.get_running_loop()\n\n    with ProcessPoolExecutor() as pool:\n        result = await loop.run_in_executor(pool, cpu_heavy, 10_000_000)\n\n    print(result)\n\n\nasyncio.run(main())\n```\n\nЭто хороший вариант для CPU-bound задач:\n\n```text\nasyncio event loop\n↓\nотдаёт тяжёлую функцию в ProcessPoolExecutor\n↓\nфункция выполняется в отдельном процессе\n↓\nотдельный процесс может занять другое ядро CPU\n```\n\n`ProcessPoolExecutor` использует `multiprocessing`, что позволяет обходить GIL; при этом выполняемые и возвращаемые объекты должны быть сериализуемыми через pickle. \n\n---\n\n### 4. Asyncio сам по себе несколько ядер не использует\n\nОдин `asyncio` event loop обычно работает в одном потоке.\n\n```text\n1 event loop\n↓\n1 thread\n↓\n1 CPU core в конкретный момент\n```\n\n`asyncio` полезен не для CPU-параллелизма, а для I/O-конкурентности:\n\n```text\nзапрос к БД ждёт ответ\n↓\nevent loop переключается на другую задачу\n\nHTTP-запрос ждёт сеть\n↓\nevent loop переключается на другую задачу\n```\n\nТо есть:\n\n```text\nasyncio хорошо:\nсеть, БД, Redis, WebSocket, HTTP, очереди\n\nasyncio плохо:\nтяжёлые вычисления без выноса в процессы\n```\n\n---\n\n### 5. Веб-приложение может использовать несколько ядер через workers\n\nНапример, FastAPI/Uvicorn/Gunicorn можно запускать несколькими worker-процессами:\n\n```text\nworker 1 → свой процесс → свой event loop → ядро 1\nworker 2 → свой процесс → свой event loop → ядро 2\nworker 3 → свой процесс → свой event loop → ядро 3\nworker 4 → свой процесс → свой event loop → ядро 4\n```\n\nТо есть один worker сам по себе обычно не распараллелит CPU-bound Python-код, но несколько worker-процессов могут загрузить несколько ядер.\n\n---\n\n### 6. Нативные библиотеки могут использовать несколько ядер\n\nДаже в одном Python-процессе несколько ядер могут использоваться, если тяжёлая работа выполняется не самим Python bytecode, а нативной библиотекой.\n\nПримеры:\n\n```text\nNumPy\nOpenCV\nPyTorch\nTensorFlow\nscikit-learn\n```\n\nТакие библиотеки часто выполняют вычисления внутри C/C++/Fortran/Rust-кода и могут отпускать GIL или использовать свои внутренние потоки.\n\n---\n\n### 7. Новый вариант: free-threaded CPython\n\nНачиная с Python 3.13, у CPython появилась поддержка отдельной free-threaded сборки, где GIL отключён. Такая сборка позволяет потокам реально выполняться параллельно на доступных CPU-ядрах. \n\nНо важное уточнение:\n\n```text\nобычная сборка CPython\n→ GIL включён\n\nfree-threaded сборка\n→ GIL отключён\n→ это отдельный режим/сборка, не обычный дефолтный Python\n```\n\nГлоссарий Python описывает free-threaded build как сборку CPython с поддержкой free threading, которая конфигурируется через `--disable-gil`. \n\n---\n\n### Итог\n\nPython-приложение может использовать больше одного ядра CPU, но способ зависит от модели:\n\n|Способ|Использует несколько ядер для Python-кода?|Когда применять|\n|---|--:|---|\n|`asyncio`|обычно нет|I/O-bound задачи|\n|`threading` в обычном CPython|обычно нет для CPU-bound|I/O-bound задачи|\n|`multiprocessing`|да|CPU-bound задачи|\n|`ProcessPoolExecutor`|да|CPU-bound задачи из async/обычного кода|\n|несколько web workers|да|веб-приложения|\n|NumPy/PyTorch/OpenCV|да, если библиотека так реализована|тяжёлые вычисления|\n|free-threaded CPython|да|потоки без GIL, новый отдельный режим|\n\nКороткая формула:\n\n```text\nДля I/O-bound:\nasyncio или threading\n\nДля CPU-bound:\nmultiprocessing / ProcessPoolExecutor / несколько worker-процессов\n\nДля обычного CPython:\nпотоки ≠ полноценное использование нескольких ядер для Python bytecode\n```"
  popularity = 2.63

[[questions]]
  id = 34
  question = "Как организовать обмен данными между процессами, если процессы не разделяют память напрямую?"
  answer = "Если процессы не разделяют память напрямую, обмен данными делают через IPC — Inter-Process Communication.\n\nВ Python основные варианты:\n\n```text\n1. Queue\n2. Pipe\n3. Manager\n4. Shared memory\n5. Сокеты\n6. Файлы / БД / Redis / RabbitMQ / Kafka\n```\n\nДля обычного Python-кода чаще всего используют `multiprocessing.Queue` или `multiprocessing.Pipe`.\n\n---\n\n### 1. `multiprocessing.Queue`\n\n`Queue` — самый удобный способ передавать данные между процессами.\n\n```python\nfrom multiprocessing import Process, Queue\n\n\ndef worker(q: Queue):\n    q.put(\"hello from child process\")\n\n\nif __name__ == \"__main__\":\n    q = Queue()\n\n    p = Process(target=worker, args=(q,))\n    p.start()\n\n    message = q.get()\n    print(message)\n\n    p.join()\n```\n\nСхема:\n\n```text\nparent process\n    ↓ q.get()\n\nQueue\n\nchild process\n    ↑ q.put(...)\n```\n\nВажно: объект, который кладётся в `multiprocessing.Queue`, сериализуется. То есть он превращается в байты, передаётся другому процессу, а там восстанавливается обратно. В документации Python указано, что очереди `multiprocessing` являются thread-safe и process-safe, а объекты, помещённые в очередь, сериализуются. \n\nПодходит для:\n\n```text\nпередачи задач worker-процессам\nполучения результатов\nproducer/consumer схемы\nфоновой обработки\n```\n\n---\n\n### 2. `multiprocessing.Pipe`\n\n`Pipe` — это канал связи между двумя процессами.\n\n```python\nfrom multiprocessing import Process, Pipe\n\n\ndef worker(conn):\n    conn.send(\"hello from child\")\n    conn.close()\n\n\nif __name__ == \"__main__\":\n    parent_conn, child_conn = Pipe()\n\n    p = Process(target=worker, args=(child_conn,))\n    p.start()\n\n    message = parent_conn.recv()\n    print(message)\n\n    p.join()\n```\n\nСхема:\n\n```text\nprocess A ←──────── Pipe ────────→ process B\n```\n\n`Pipe()` возвращает пару соединённых объектов connection. По умолчанию канал двусторонний, то есть оба конца могут отправлять и принимать данные. \n\n`Pipe` удобен, когда:\n\n```text\nпроцессов мало\nнужна связь 1 к 1\nнужен простой запрос-ответ между parent и child\n```\n\n---\n\n### 3. `multiprocessing.Manager`\n\n`Manager` создаёт отдельный серверный процесс, который хранит Python-объекты, а другие процессы работают с ними через proxy-объекты.\n\n```python\nfrom multiprocessing import Process, Manager\n\n\ndef worker(shared_list):\n    shared_list.append(\"item from child\")\n\n\nif __name__ == \"__main__\":\n    with Manager() as manager:\n        shared_list = manager.list()\n\n        p = Process(target=worker, args=(shared_list,))\n        p.start()\n        p.join()\n\n        print(list(shared_list))\n```\n\nСхема:\n\n```text\nprocess A ── proxy ──┐\n                     ↓\n              manager process\n                     ↑\nprocess B ── proxy ──┘\n```\n\nПлюс: удобно работать с `list`, `dict`, `Queue`, `Lock` и другими объектами.\n\nМинус: медленнее, чем `Queue` или `Pipe`, потому что доступ идёт через proxy и отдельный manager-процесс.\n\n---\n\n### 4. Shared memory\n\nФормально процессы не разделяют обычную память Python-объектов, но можно специально создать участок общей памяти.\n\nДля этого есть `multiprocessing.shared_memory`.\n\n```python\nfrom multiprocessing import Process\nfrom multiprocessing import shared_memory\n\n\ndef worker(name):\n    shm = shared_memory.SharedMemory(name=name)\n    shm.buf[0] = 100\n    shm.close()\n\n\nif __name__ == \"__main__\":\n    shm = shared_memory.SharedMemory(create=True, size=10)\n\n    p = Process(target=worker, args=(shm.name,))\n    p.start()\n    p.join()\n\n    print(shm.buf[0])\n\n    shm.close()\n    shm.unlink()\n```\n\nСхема:\n\n```text\nprocess A ─────┐\n               ↓\n        shared memory block\n               ↑\nprocess B ─────┘\n```\n\n`multiprocessing.shared_memory` предоставляет `SharedMemory` для выделения и управления общей памятью, доступной нескольким процессам. \n\nПодходит для:\n\n```text\nбольших массивов данных\nчисловых данных\nизбежания лишнего копирования\nNumPy-массивов между процессами\n```\n\nНо это не обычный Python-объект вроде списка или словаря. Там нужно самостоятельно контролировать формат данных и синхронизацию.\n\n---\n\n### 5. `Value` и `Array`\n\nДля простых общих значений можно использовать `multiprocessing.Value` и `multiprocessing.Array`.\n\n```python\nfrom multiprocessing import Process, Value\n\n\ndef increment(counter):\n    with counter.get_lock():\n        counter.value += 1\n\n\nif __name__ == \"__main__\":\n    counter = Value(\"i\", 0)\n\n    processes = [\n        Process(target=increment, args=(counter,))\n        for _ in range(10)\n    ]\n\n    for p in processes:\n        p.start()\n\n    for p in processes:\n        p.join()\n\n    print(counter.value)\n```\n\nЗдесь `Value(\"i\", 0)` создаёт общее целочисленное значение.\n\nВажно: при изменении общего значения нужна синхронизация через lock, иначе можно получить race condition.\n\n---\n\n### 6. Внешний брокер или хранилище\n\nВ реальных backend-системах процессы часто обмениваются данными не напрямую, а через внешний сервис:\n\n```text\nRedis\nRabbitMQ\nKafka\nPostgreSQL\nфайлы\nHTTP API\nUnix socket / TCP socket\n```\n\nНапример:\n\n```text\nprocess A\n  ↓\nкладёт задачу в Redis / RabbitMQ\n\nprocess B\n  ↓\nзабирает задачу и обрабатывает\n```\n\nЭто особенно полезно, когда процессы находятся:\n\n```text\nв разных Docker-контейнерах\nна разных серверах\nв разных worker-приложениях\n```\n\n---\n\n### 7. Что выбрать\n\n|Задача|Что использовать|\n|---|---|\n|Передать задачи worker-процессам|`multiprocessing.Queue`|\n|Получить результаты от worker’ов|`multiprocessing.Queue`|\n|Связь 1 к 1 между двумя процессами|`multiprocessing.Pipe`|\n|Общий `dict` / `list` между процессами|`multiprocessing.Manager`|\n|Большие массивы без копирования|`multiprocessing.shared_memory`|\n|Простое общее число|`multiprocessing.Value`|\n|Простая общая таблица чисел|`multiprocessing.Array`|\n|Обмен между сервисами / контейнерами|Redis / RabbitMQ / Kafka / БД / HTTP|\n\n---\n\n### Главная разница\n\n```text\nQueue / Pipe\n→ данные передаются сообщениями\n→ обычно сериализация и копирование\n\nManager\n→ общий объект через proxy\n→ удобно, но медленнее\n\nShared memory\n→ общий участок памяти\n→ быстрее для больших данных, но сложнее\n\nRedis / RabbitMQ / Kafka\n→ обмен между независимыми процессами/сервисами\n→ хорошо для backend-архитектуры\n```\n\n---\n\n### Итог\n\nПроцессы не видят обычную память друг друга, поэтому обмен делают через специальные механизмы:\n\n```text\nmessage passing:\nQueue, Pipe, sockets, broker\n\nshared state through proxy:\nManager\n\nexplicit shared memory:\nshared_memory, Value, Array\n\nexternal storage:\nDB, Redis, файлы\n```\n\nДля большинства задач в Python начинай с `multiprocessing.Queue`.\n\nДля CPU-bound worker’ов:\n\n```text\nparent process\n    ↓ кладёт задачи в Queue\nworker processes\n    ↓ считают\nresult Queue\n    ↓ возвращают результат\n```\n\nДля больших числовых данных лучше смотреть в сторону `shared_memory`, чтобы не копировать огромные объекты между процессами."
  popularity = 5.26

[[questions]]
  id = 35
  question = "Можно ли использовать общую память в multiprocessing без внешних хранилищ?"
  answer = "Да, можно. В `multiprocessing` есть встроенные механизмы общей памяти, без Redis, БД, файлов, очередей сообщений и других внешних хранилищ.\n\n### Основные варианты\n\n### 1. `multiprocessing.Value`\n\nДля одного общего значения:\n\n```python\nfrom multiprocessing import Process, Value\n\ndef increment(counter):\n    for _ in range(100_000):\n        with counter.get_lock():\n            counter.value += 1\n\nif __name__ == \"__main__\":\n    counter = Value(\"i\", 0)\n\n    p1 = Process(target=increment, args=(counter,))\n    p2 = Process(target=increment, args=(counter,))\n\n    p1.start()\n    p2.start()\n\n    p1.join()\n    p2.join()\n\n    print(counter.value)\n```\n\n`Value` создаёт `ctypes`-объект в общей памяти. По умолчанию он оборачивается синхронизирующей обёрткой с lock. Но операция `counter.value += 1` не атомарна, поэтому для корректного инкремента нужен `get_lock()`. Это прямо указано в документации Python. \n\n### 2. `multiprocessing.Array`\n\nДля массива фиксированной длины:\n\n```python\nfrom multiprocessing import Process, Array\n\ndef worker(arr):\n    arr[0] = 100\n    arr[1] = 200\n\nif __name__ == \"__main__\":\n    arr = Array(\"i\", [1, 2, 3])\n\n    p = Process(target=worker, args=(arr,))\n    p.start()\n    p.join()\n\n    print(list(arr))  # [100, 200, 3]\n```\n\n`Array` создаёт массив в общей памяти. По умолчанию доступ синхронизируется lock-ом, но если передать `lock=False`, доступ уже не будет автоматически process-safe. \n\n### 3. `multiprocessing.shared_memory.SharedMemory`\n\nЭто более низкоуровневый и гибкий вариант. Он появился в Python 3.8 и позволяет создавать блок общей памяти, к которому могут подключаться разные процессы по имени. ([Python documentation](https://docs.python.org/3/library/multiprocessing.shared_memory.html \"multiprocessing.shared_memory — Shared memory for direct access across processes — Python 3.14.6 documentation\"))\n\n```python\nfrom multiprocessing import Process\nfrom multiprocessing import shared_memory\n\ndef worker(shm_name):\n    shm = shared_memory.SharedMemory(name=shm_name)\n    shm.buf[0] = 99\n    shm.close()\n\nif __name__ == \"__main__\":\n    shm = shared_memory.SharedMemory(create=True, size=10)\n\n    shm.buf[0] = 1\n\n    p = Process(target=worker, args=(shm.name,))\n    p.start()\n    p.join()\n\n    print(shm.buf[0])  # 99\n\n    shm.close()\n    shm.unlink()\n```\n\nЗдесь `shm.buf` — это `memoryview` на общий блок памяти. Один процесс меняет байты, другой видит изменения. После работы важно вызвать `close()`, а когда память больше не нужна — `unlink()`, иначе можно получить утечку ресурса. \n\n### Важное ограничение\n\nОбщая память не означает, что обычные Python-объекты автоматически становятся общими.\n\nНапример, нельзя просто положить в shared memory обычный `dict`, `list` или объект класса и безопасно менять его как общий объект. Общая память хранит байты / `ctypes`-структуры / массивы. Для сложных Python-объектов обычно используют:\n\n```text\nmultiprocessing.Manager()\nQueue / Pipe\nсериализацию\nRedis / БД / другое внешнее хранилище\n```\n\n`Manager` тоже встроен в `multiprocessing`, но это не настоящая общая память. Он запускает отдельный серверный процесс, который хранит объекты, а другие процессы работают с ними через proxy. \n\n### Когда что использовать\n\n```text\nValue\n→ один общий счётчик, флаг, число\n\nArray\n→ небольшой массив фиксированной длины\n\nshared_memory.SharedMemory\n→ большие данные, бинарные буферы, NumPy-массивы, высокая производительность\n\nManager\n→ удобно шарить dict/list, но медленнее и это proxy, а не прямой доступ к памяти\n```\n\n### Короткий вывод\n\nДа, в `multiprocessing` можно использовать общую память без внешних хранилищ.\n\nОсновные инструменты:\n\n```python\nmultiprocessing.Value\nmultiprocessing.Array\nmultiprocessing.shared_memory.SharedMemory\nmultiprocessing.sharedctypes\n```\n\nНо нужно помнить: процессы всё равно имеют разные адресные пространства, поэтому shared memory надо создавать явно, а при конкурентной записи защищать доступ через `Lock`, иначе возможны race condition."
  popularity = 2.63

[[questions]]
  id = 36
  question = "Как решать проблемы race condition в Python без GIL?"
  answer = "Race condition решается не GIL-ом, а правильной синхронизацией доступа к общему состоянию.\n\nВ Python без GIL, например в free-threaded CPython, потоки могут реально выполняться параллельно на разных ядрах. Начиная с Python 3.13 есть сборка CPython с отключаемым GIL, а в Python 3.14 она продолжает развиваться. Встроенные типы вроде `dict`, `list`, `set` имеют внутренние защиты от некоторых конкурентных модификаций, но документация прямо рекомендует использовать `threading.Lock` и другие примитивы синхронизации, а не полагаться на внутренние детали реализации. \n\n### 1. Защищать критическую секцию через Lock\n\nПроблемный код:\n\n```python\ncounter += 1\n```\n\nЭто не одна операция на уровне логики. Это примерно:\n\n```text\nпрочитать counter\nприбавить 1\nзаписать обратно\n```\n\nДва потока могут одновременно прочитать старое значение и перезаписать результат друг друга.\n\nПравильно:\n\n```python\nimport threading\n\ncounter = 0\nlock = threading.Lock()\n\ndef increment():\n    global counter\n\n    for _ in range(100_000):\n        with lock:\n            counter += 1\n```\n\n`threading.Lock` — базовый примитив синхронизации. Когда один поток захватил lock, остальные блокируются до его освобождения. Объекты `Lock`, `RLock`, `Condition`, `Semaphore` можно использовать через `with`, что безопаснее, чем вручную вызывать `acquire()` / `release()`. \n\n### 2. Делать shared state минимальным\n\nПлохой подход:\n\n```python\nusers = {}\n\ndef update_user(user_id, data):\n    users[user_id][\"balance\"] += data[\"amount\"]\n```\n\nЗдесь общий `dict`, вложенные структуры и изменение баланса. Без синхронизации это легко приводит к race condition.\n\nЛучше:\n\n```python\nusers = {}\nusers_lock = threading.Lock()\n\ndef update_user(user_id, amount):\n    with users_lock:\n        user = users[user_id]\n        user[\"balance\"] += amount\n```\n\nЕщё лучше — не давать разным потокам менять одну и ту же структуру напрямую.\n\n### 3. Использовать очереди вместо общей изменяемой памяти\n\nЧасто лучший способ убрать race condition — не делить память, а передавать сообщения.\n\n```python\nfrom queue import Queue\nfrom threading import Thread\n\nqueue = Queue()\n\ndef worker():\n    while True:\n        item = queue.get()\n        try:\n            process(item)\n        finally:\n            queue.task_done()\n\ndef process(item):\n    print(item)\n\nThread(target=worker, daemon=True).start()\n\nqueue.put(\"task-1\")\nqueue.put(\"task-2\")\n\nqueue.join()\n```\n\nИдея:\n\n```text\nне несколько потоков меняют один объект\nа один поток владеет состоянием\nостальные отправляют ему задачи\n```\n\nЭто обычно проще и безопаснее, чем ставить lock вокруг каждой операции.\n\n### 4. Для multiprocessing использовать multiprocessing.Lock\n\nДля процессов GIL вообще не решает race condition, потому что процессы имеют разные интерпретаторы и разные адресные пространства. Если используется shared memory, `Value`, `Array` или `sharedctypes`, синхронизация всё равно нужна.\n\nПример:\n\n```python\nfrom multiprocessing import Process, Value\n\ndef worker(counter):\n    for _ in range(100_000):\n        with counter.get_lock():\n            counter.value += 1\n\nif __name__ == \"__main__\":\n    counter = Value(\"i\", 0)\n\n    p1 = Process(target=worker, args=(counter,))\n    p2 = Process(target=worker, args=(counter,))\n\n    p1.start()\n    p2.start()\n\n    p1.join()\n    p2.join()\n\n    print(counter.value)\n```\n\nДокументация `multiprocessing` прямо указывает, что операции вида `+=` над shared value не атомарны, потому что включают чтение и запись. Для атомарного инкремента нужно использовать lock, например `with counter.get_lock():`. \n\n### 5. Использовать правильный примитив под задачу\n\n```text\nLock\n→ защитить одну критическую секцию\n\nRLock\n→ нужен повторный захват lock тем же потоком\n\nSemaphore\n→ ограничить количество одновременных доступов к ресурсу\n\nCondition\n→ ждать изменения состояния\n\nEvent\n→ один поток сообщает другим, что событие произошло\n\nQueue\n→ передавать задачи/данные без прямого общего состояния\n```\n\n`Condition` всегда связан с lock-ом: поток ждёт изменения состояния, временно отпускает lock, затем снова захватывает его после пробуждения. Это типичный механизм для producer-consumer сценариев. \n\n### 6. Не полагаться на “атомарность” встроенных структур\n\nДаже если отдельная операция с `list` или `dict` сейчас выглядит безопасной, нельзя строить на этом логику.\n\nПлохо:\n\n```python\nif key not in cache:\n    cache[key] = load_value()\n```\n\nМежду проверкой и записью другой поток может уже добавить этот ключ.\n\nПравильно:\n\n```python\ncache = {}\ncache_lock = threading.Lock()\n\ndef get_or_load(key):\n    with cache_lock:\n        if key not in cache:\n            cache[key] = load_value(key)\n        return cache[key]\n```\n\n### Главное правило\n\n```text\nЛюбая операция вида:\nпрочитать → проверить → изменить → записать\n\nдолжна быть защищена синхронизацией,\nесли объект доступен из нескольких потоков или процессов.\n```\n\nGIL мог случайно скрывать часть проблем, но он не был нормальным механизмом защиты бизнес-логики. В коде, который должен корректно работать без GIL, нужно проектировать доступ к данным явно: `Lock`, `Queue`, `Condition`, immutable-данные, ownership-модель или изоляция состояния."
  popularity = 2.63

[[questions]]
  id = 37
  question = "Что такое deadlock и какие есть методы решения этой проблемы?"
  answer = "### Что такое deadlock\n\n`deadlock` — это взаимная блокировка: несколько потоков, процессов или задач ждут друг друга, и никто не может продолжить выполнение.\n\nКлассический пример:\n\n```text\nThread A:\nзахватил lock_1\nждёт lock_2\n\nThread B:\nзахватил lock_2\nждёт lock_1\n```\n\nВ итоге:\n\n```text\nA не отпускает lock_1, потому что ждёт lock_2\nB не отпускает lock_2, потому что ждёт lock_1\n```\n\nОба зависают.\n\n### Условия возникновения deadlock\n\nВ теории ОС обычно выделяют 4 условия Коффмана:\n\n```text\n1. Mutual exclusion\n   Ресурс может быть занят только одним потоком/процессом.\n\n2. Hold and wait\n   Поток уже держит один ресурс и ждёт другой.\n\n3. No preemption\n   Ресурс нельзя насильно отобрать, его должен освободить владелец.\n\n4. Circular wait\n   Есть цикл ожидания: A ждёт B, B ждёт C, C ждёт A.\n```\n\nDeadlock становится возможным, когда эти условия выполняются одновременно. Это стандартная модель объяснения взаимных блокировок в ОС. \n\n### Пример deadlock в Python\n\n```python\nimport threading\nimport time\n\nlock_a = threading.Lock()\nlock_b = threading.Lock()\n\ndef worker_1():\n    with lock_a:\n        time.sleep(0.1)\n        with lock_b:\n            print(\"worker_1 done\")\n\ndef worker_2():\n    with lock_b:\n        time.sleep(0.1)\n        with lock_a:\n            print(\"worker_2 done\")\n\nt1 = threading.Thread(target=worker_1)\nt2 = threading.Thread(target=worker_2)\n\nt1.start()\nt2.start()\n\nt1.join()\nt2.join()\n```\n\nПроблема:\n\n```text\nworker_1 держит lock_a и ждёт lock_b\nworker_2 держит lock_b и ждёт lock_a\n```\n\n`threading.Lock` блокирует поток, если lock уже занят другим потоком. Поэтому такой код может зависнуть навсегда. \n\n### Как решать deadlock\n\n### 1. Всегда брать lock-и в одном порядке\n\nЭто главный практический способ.\n\nПлохо:\n\n```python\n# Поток 1\nwith lock_a:\n    with lock_b:\n        ...\n\n# Поток 2\nwith lock_b:\n    with lock_a:\n        ...\n```\n\nПравильно:\n\n```python\n# Все потоки берут lock-и только так:\nwith lock_a:\n    with lock_b:\n        ...\n```\n\nТо есть в проекте должен быть единый порядок захвата:\n\n```text\nlock_user\n↓\nlock_account\n↓\nlock_transaction\n```\n\nА не где-то наоборот.\n\n### 2. Не держать lock дольше, чем нужно\n\nПлохо:\n\n```python\nwith lock:\n    data = load_from_network()\n    result = heavy_calculation(data)\n    shared_state[\"result\"] = result\n```\n\nЗдесь lock удерживается во время сетевого запроса и тяжёлого вычисления.\n\nЛучше:\n\n```python\ndata = load_from_network()\nresult = heavy_calculation(data)\n\nwith lock:\n    shared_state[\"result\"] = result\n```\n\nПравило:\n\n```text\nВнутри lock — только работа с общим состоянием.\nВсё медленное — вне lock.\n```\n\n### 3. Использовать `with`, а не ручной `acquire()` / `release()`\n\nПлохо:\n\n```python\nlock.acquire()\n\ndo_something()\n\nlock.release()\n```\n\nЕсли внутри `do_something()` будет исключение, `release()` может не выполниться.\n\nЛучше:\n\n```python\nwith lock:\n    do_something()\n```\n\nВ документации Python прямо рекомендуется использовать lock-и как context manager, то есть через `with`, когда это возможно. \n\nАльтернатива вручную:\n\n```python\nlock.acquire()\ntry:\n    do_something()\nfinally:\n    lock.release()\n```\n\n### 4. Использовать timeout при захвате lock\n\nМожно не ждать бесконечно:\n\n```python\nacquired = lock.acquire(timeout=2)\n\nif acquired:\n    try:\n        do_something()\n    finally:\n        lock.release()\nelse:\n    print(\"Не удалось получить lock\")\n```\n\nТакой подход не всегда полностью решает проблему, но помогает не зависать навсегда и даёт шанс обработать ситуацию.\n\n### 5. Использовать `RLock`, если один и тот же поток должен брать lock повторно\n\nОбычный `Lock` не является реентерабельным. Если тот же поток попытается захватить его второй раз, он сам себя заблокирует.\n\nПроблемный пример:\n\n```python\nlock = threading.Lock()\n\ndef outer():\n    with lock:\n        inner()\n\ndef inner():\n    with lock:\n        print(\"inner\")\n```\n\n`outer()` уже захватил `lock`, потом вызывает `inner()`, а `inner()` снова пытается взять тот же `lock`.\n\nДля таких случаев используют `RLock`:\n\n```python\nlock = threading.RLock()\n\ndef outer():\n    with lock:\n        inner()\n\ndef inner():\n    with lock:\n        print(\"inner\")\n```\n\n`RLock` можно захватывать несколько раз из одного и того же потока, но освобождать его нужно столько же раз. Документация Python указывает, что несоответствие количества `acquire()` и `release()` может привести к deadlock. \n\n### 6. Не вызывать `join()` на самом себе\n\nПоток не может ждать завершения самого себя.\n\n```python\nthreading.current_thread().join()\n```\n\nЭто логически невозможно:\n\n```text\nпоток ждёт, пока сам завершится\nно он не может завершиться, потому что ждёт\n```\n\nPython прямо запрещает `join()` текущего потока, потому что это вызвало бы deadlock. \n\nТо же самое относится и к процессам: процесс не может сделать `join()` самого себя. \n\n### 7. Осторожно с `multiprocessing.Queue`\n\nВ `multiprocessing` deadlock может возникнуть, если процесс положил данные в `Queue`, а родительский процесс сделал `join()` до того, как эти данные были прочитаны.\n\nПроблемная схема:\n\n```text\nchild process кладёт много данных в Queue\nparent делает child.join()\nQueue не очищена\nchild не может завершиться\nparent ждёт child\n```\n\nДокументация Python предупреждает: если используется `multiprocessing.Queue`, нужно убедиться, что все элементы из очереди будут извлечены до `join()`. Иначе можно получить deadlock. \n\n### 8. Не ждать результат задачи внутри той же маленькой executor-группы\n\nПример проблемы:\n\n```python\nfrom concurrent.futures import ThreadPoolExecutor\n\ndef task():\n    future = executor.submit(lambda: 123)\n    return future.result()\n\nexecutor = ThreadPoolExecutor(max_workers=1)\nfuture = executor.submit(task)\n\nprint(future.result())\n```\n\nЗдесь один worker занят `task()`, а внутри `task()` ожидается другая задача. Но свободного worker-а нет.\n\n```text\nworker ждёт новую задачу\nновая задача ждёт свободный worker\nсвободного worker нет\n```\n\nВ документации `concurrent.futures` есть предупреждение, что ожидание `Future` внутри задач executor-а может привести к deadlock; для `ProcessPoolExecutor` вызов методов `Executor` или `Future` из выполняемой задачи прямо указан как причина deadlock. \n\n### 9. Использовать очереди и модель владельца состояния\n\nЧасто лучше не делить один объект между потоками, а сделать один поток владельцем состояния.\n\n```text\nПлохо:\nмного потоков напрямую меняют общий dict\n\nЛучше:\nодин поток владеет dict\nостальные отправляют ему команды через Queue\n```\n\nПример:\n\n```python\nfrom queue import Queue\nfrom threading import Thread\n\ncommands = Queue()\nstate = {}\n\ndef state_owner():\n    while True:\n        key, value = commands.get()\n        try:\n            state[key] = value\n        finally:\n            commands.task_done()\n\nThread(target=state_owner, daemon=True).start()\n\ncommands.put((\"user_id\", 123))\ncommands.join()\n```\n\nТак меньше lock-ов — меньше риска deadlock.\n\n### 10. Логировать зависания и диагностировать\n\nПрактические признаки deadlock:\n\n```text\nпрограмма не падает, но зависла\nCPU почти не используется\nпотоки висят в ожидании lock/join/result\nлоги остановились на одном месте\n```\n\nДля диагностики в Python обычно помогают:\n\n```python\nimport faulthandler\n\nfaulthandler.dump_traceback_later(10, repeat=True)\n```\n\nОн будет периодически печатать stack trace потоков. По stack trace часто видно, где поток завис: на `lock.acquire()`, `join()`, `future.result()` или ожидании очереди.\n\n### Главное правило\n\nDeadlock решают не тем, что “добавляют больше lock-ов”, а наоборот — уменьшают количество мест, где код может заблокироваться.\n\nПрактический чеклист:\n\n```text\n1. Все lock-и брать в одном порядке.\n2. Держать lock минимальное время.\n3. Использовать with lock.\n4. Не делать I/O внутри lock.\n5. Использовать timeout там, где зависание критично.\n6. Использовать RLock только когда реально нужна реентерабельность.\n7. Не ждать Future/result внутри того же маленького pool-а.\n8. В multiprocessing сначала читать Queue, потом делать join.\n9. По возможности заменять shared state на Queue/message passing.\n```\n\nСамая частая причина deadlock в реальном коде — нарушение порядка захвата lock-ов. Самый надёжный практический метод — заранее определить и строго соблюдать единый порядок блокировок."
  popularity = 2.63

[[questions]]
  id = 38
  question = "Что такое Семафор"
  answer = "Семафоры служат для управления доступом к общим ресурсам или для ограничения количества одновременно выполняемых задач. Они позволяют избежать перегрузки системы и управлять параллельным выполнением задач, обеспечивая более эффективное использование ресурсов.\n\n**Как работают семафоры в asyncio**:\n\n1. **Создание**: Семафор создается с указанием максимального количества задач, которые могут одновременно выполняться. Например, semaphore = asyncio.Semaphore(2) создаст семафор, который позволяет одновременно работать только двум задачам.\n2. **Блокировка и освобождение**: Перед выполнением асинхронной задачи, требующей доступа к ресурсу или имеющей ограничение по количеству одновременных запусков, необходимо \"захватить\" семафор, используя конструкцию async with semaphore:. Это заблокирует семафор, уменьшив его счетчик, и позволит задаче выполняться.\n3. **Ожидание освобождения**: Если семафор уже занят (счетчик равен нулю), задача будет ожидать, пока другая задача не освободит его (выполнит release(), увеличив счетчик). После освобождения семафора, задача сможет его захватить и продолжить выполнение.\n4. **Освобождение после выполнения**: После завершения выполнения асинхронной задачи, семафор автоматически освобождается (если использовалась конструкция async with), и счетчик семафора увеличивается.\n\nПример использования:\n\n```python\nimport asyncio\n\nasync def worker(name, semaphore):\n   print(f'Задача {name}: ожидает семафор')\n    async with semaphore:\n      print(f'Задача {name}: захватила семафор')\n      await asyncio.sleep(1)\n        print(f'Задача {name}: освобождает семафор')\n\n\nasync def main():\n   semaphore = asyncio.Semaphore(2)\n    tasks = [worker(i, semaphore) for i in range(5)]\n   await asyncio.gather(*tasks)\n\n\nif __name__ == \"__main__\":\n asyncio.run(main())\n```\n\nВ этом примере, несмотря на то, что создано 5 задач, только 2 из них могут выполняться одновременно из-за установленного в семафоре лимита в 2. Остальные задачи будут ожидать, пока одна из двух работающих задач не завершится и не освободит семафор.\n\n**Преимущества использования семафоров**:\n\n**Управление ресурсами**: Семафоры позволяют контролировать доступ к ресурсам, которые могут быть ограничены по количеству одновременно использующих их задач (например, соединения с базой данных, файлы).\n\n**Ограничение параллелизма**: Семафоры позволяют ограничить количество одновременно выполняемых задач, предотвращая перегрузку системы и обеспечивая более стабильную работу.\n\n**Синхронизация задач**: Семафоры могут использоваться для координации выполнения задач, например, для обеспечения того, чтобы определенная задача не начиналась, пока не завершится другая.\n\n**Простота использования**: Semaphore предоставляет удобный и интуитивно понятный способ управления параллелизмом"
  popularity = 5.26

