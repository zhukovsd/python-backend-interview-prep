  question = "Как проверить, что объект является корутиной?"
  answer = "### Основной способ\n\nЧтобы проверить, что объект является именно объектом корутины, используют:\n\n```python\nimport inspect\n\ninspect.iscoroutine(obj)\n```\n\nПример:\n\n```python\nimport inspect\n\nasync def func():\n    return 123\n\ncoro = func()\n\nprint(inspect.iscoroutine(coro))  # True\nprint(inspect.iscoroutine(func))  # False\n\ncoro.close()\n```\n\n`inspect.iscoroutine(obj)` возвращает `True`, если объект является native coroutine object, то есть результатом вызова `async def` функции. \n\n### Важно: функция ≠ корутина\n\n```python\nasync def func():\n    return 123\n```\n\nСама `func` — это не корутина. Это coroutine function.\n\n```python\nimport inspect\n\nasync def func():\n    return 123\n\nprint(inspect.iscoroutinefunction(func))  # True\nprint(inspect.iscoroutine(func))          # False\n```\n\nА вот результат вызова `func()` — уже объект корутины:\n\n```python\ncoro = func()\n\nprint(inspect.iscoroutine(coro))  # True\n\ncoro.close()\n```\n\nСхема:\n\n```text\nasync def func()\n        ↓\ncoroutine function\n\nfunc()\n        ↓\ncoroutine object\n```\n\nДля проверки функции используют `inspect.iscoroutinefunction()`, а для проверки уже созданной корутины — `inspect.iscoroutine()`. \n\n### Проверка на awaitable\n\nИногда нужно проверить не “корутина ли это”, а “можно ли это использовать с `await`”.\n\nТогда используют:\n\n```python\ninspect.isawaitable(obj)\n```\n\nПример:\n\n```python\nimport inspect\nimport asyncio\n\nasync def func():\n    return 123\n\ncoro = func()\ntask = asyncio.create_task(coro)\n\nprint(inspect.isawaitable(task))  # True\nprint(inspect.iscoroutine(task))  # False\n\nawait task\n```\n\nПочему так:\n\n```text\ncoroutine object\n  └─ awaitable\n\nasyncio.Task\n  └─ тоже awaitable\n  └─ но не coroutine object\n```\n\n`inspect.isawaitable(obj)` проверяет, можно ли объект использовать в выражении `await obj`. В PEP 492 также отдельно различаются `inspect.iscoroutine(obj)`, `inspect.iscoroutinefunction(obj)` и `inspect.isawaitable(obj)`. \n\n### Практическое правило\n\n```python\nimport inspect\n\nif inspect.iscoroutine(obj):\n    print(\"Это объект корутины\")\n\nif inspect.iscoroutinefunction(obj):\n    print(\"Это async-функция\")\n\nif inspect.isawaitable(obj):\n    print(\"Это можно await-ить\")\n```\n\nРазница:\n\n```text\ninspect.iscoroutinefunction(func)\n  проверяет async def функцию\n\ninspect.iscoroutine(func())\n  проверяет объект корутины\n\ninspect.isawaitable(obj)\n  проверяет любой объект, который можно await-ить:\n    coroutine\n    Task\n    Future\n    объект с __await__()\n```\n\n### Мини-пример\n\n```python\nimport asyncio\nimport inspect\n\nasync def async_func():\n    return 1\n\ndef sync_func():\n    return 2\n\nasync def main():\n    coro = async_func()\n    task = asyncio.create_task(coro)\n\n    print(inspect.iscoroutinefunction(async_func))  # True\n    print(inspect.iscoroutinefunction(sync_func))   # False\n\n    print(inspect.iscoroutine(coro))                # False, уже обёрнут в Task\n    print(inspect.iscoroutine(task))                # False\n\n    print(inspect.isawaitable(task))                # True\n\n    await task\n\nasyncio.run(main())\n```\n\nНо здесь есть важный момент: после передачи `coro` в `asyncio.create_task(coro)` корутина уже обёрнута в `Task`. Поэтому на практике чаще проверяют объект до обёртки:\n\n```python\ncoro = async_func()\n\nprint(inspect.iscoroutine(coro))  # True\n\ncoro.close()\n```\n\n### Итог\n\nДля точной проверки объекта корутины:\n\n```python\ninspect.iscoroutine(obj)\n```\n\nДля проверки async-функции:\n\n```python\ninspect.iscoroutinefunction(obj)\n```\n\nДля проверки, можно ли объект передать в `await`:\n\n```python\ninspect.isawaitable(obj)\n```"
  popularity = 2.63

[[questions]]
  id = 22
  question = "Сколько процессов может быть у одного приложения?"
  answer = "У одного приложения может быть:\n\n```text\n1 процесс\nили\nмного процессов\n```\n\nФиксированного универсального числа нет. Количество процессов зависит от:\n\n```text\nоперационной системы\nлимитов пользователя\nлимитов контейнера / cgroup\nдоступной RAM\nнастроек приложения\nмодели запуска\n```\n\n### Что значит “у приложения несколько процессов”\n\nНапример, приложение может запустить дочерние процессы:\n\n```text\nmain process\n  ├─ worker process 1\n  ├─ worker process 2\n  ├─ worker process 3\n  └─ worker process 4\n```\n\nВ Python это обычно делается через `multiprocessing`, `ProcessPoolExecutor`, Gunicorn workers, Celery workers и т.д.\n\nВ документации Python `multiprocessing.Process` описан как объект, представляющий активность, выполняемую в отдельном процессе. То есть каждый `Process` — это отдельный OS-level процесс. \n\n### Есть ли жёсткий лимит\n\nНа уровне языка Python — нет.\n\nPython не говорит:\n\n```text\nодно приложение может иметь максимум N процессов\n```\n\nНо лимиты есть на уровне ОС.\n\nНапример, в Linux есть `RLIMIT_NPROC` — лимит на количество существующих процессов, точнее на Linux это процессы/потоки, для конкретного real user ID. Если лимит достигнут, создание нового процесса через `fork()` может завершиться ошибкой `EAGAIN`. \n\nТо есть ограничение чаще выглядит не так:\n\n```text\nу приложения максимум 100 процессов\n```\n\nа так:\n\n```text\nу пользователя / контейнера / системы максимум N процессов или потоков\n```\n\n### На Windows\n\nВ Windows процесс создаётся через API вроде `CreateProcess`, который создаёт новый процесс и его основной поток. \n\nОтдельный лимит может накладываться через Job Object. Например, у Job Object есть `ActiveProcessLimit` — лимит активных процессов внутри job. Если процесс пытаются добавить в job сверх этого лимита, операция может завершиться ошибкой, а процесс будет завершён. \n\nТо есть в Windows тоже нет нормального правила вида:\n\n```text\nодно приложение = максимум N процессов\n```\n\nЛимит зависит от ресурсов и ограничений среды.\n\n### Практически для Python\n\nМожно создать несколько процессов так:\n\n```python\nfrom multiprocessing import Process\nimport os\n\n\ndef worker():\n    print(\"PID:\", os.getpid())\n\n\nif __name__ == \"__main__\":\n    processes = []\n\n    for _ in range(4):\n        p = Process(target=worker)\n        p.start()\n        processes.append(p)\n\n    for p in processes:\n        p.join()\n```\n\nПолучится:\n\n```text\n1 главный процесс\n4 дочерних процесса\n```\n\nИтого приложение фактически использует 5 процессов.\n\n### Для backend-приложений\n\nНапример, если запустить FastAPI через Gunicorn:\n\n```bash\ngunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker\n```\n\nто обычно будет:\n\n```text\nmaster process\n  ├─ worker 1\n  ├─ worker 2\n  ├─ worker 3\n  └─ worker 4\n```\n\nТо есть минимум 5 процессов: один master и четыре worker-процесса.\n\n### Как выбирать количество процессов\n\nОбычно количество worker-процессов подбирают по CPU и типу нагрузки:\n\n```text\nCPU-bound задачи\n  → примерно по количеству CPU cores\n\nI/O-bound задачи\n  → можно больше, но часто лучше async + меньше процессов\n\nWeb backend\n  → несколько worker-процессов + async внутри каждого worker\n```\n\nПример:\n\n```text\n8 CPU cores\n  → 4-8 worker-процессов как стартовая точка\n```\n\nНо слишком много процессов — плохо:\n\n```text\nмного RAM\nмного context switching\nбольше overhead на IPC\nсложнее синхронизация\nбольше нагрузка на БД/Redis\n```\n\n### Главное отличие от потоков\n\n```text\nпроцесс\n  отдельная память\n  отдельный PID\n  дороже создать\n  лучше изоляция\n  обходит GIL для CPU-bound задач\n\nпоток\n  общая память внутри процесса\n  дешевле создать\n  в CPython ограничен GIL для Python-кода\n```\n\n### Итог\n\nУ одного приложения может быть сколько угодно процессов в рамках ограничений ОС и ресурсов.\n\nПравильнее отвечать так:\n\n```text\nМинимум: 1 процесс.\n\nМаксимум: не задан Python или самим понятием \"приложение\".\nОн ограничен ОС, лимитами пользователя/контейнера, памятью, CPU и настройками запуска.\n```\n\nВ Python каждый `multiprocessing.Process` создаёт отдельный процесс, а в production backend несколько процессов часто используют как worker-процессы для параллельной обработки запросов."
  popularity = 2.63

[[questions]]
  id = 23
  question = "Какие инструменты синхронизации потоков существуют в Python и для чего они нужны?"
  answer = "### Зачем нужны инструменты синхронизации\n\nВ Python потоки внутри одного процесса могут обращаться к общим данным:\n\n```python\ncounter += 1\nshared_list.append(item)\ncache[key] = value\n```\n\nПроблема в том, что несколько потоков могут одновременно менять одно и то же состояние. Это приводит к race condition: результат зависит от порядка выполнения потоков. GIL не отменяет необходимость синхронизации, потому что он не делает всю пользовательскую логику атомарной и не защищает твои структуры данных на уровне бизнес-операций. В документации `threading` отдельно описаны примитивы синхронизации: `Lock`, `RLock`, `Semaphore`, `BoundedSemaphore`, `Event`, `Condition`, `Barrier`.\n\n### Основные инструменты\n\n```text\nLock\n  обычная взаимная блокировка\n\nRLock\n  рекурсивная блокировка\n\nSemaphore\n  ограничитель количества одновременных потоков\n\nBoundedSemaphore\n  Semaphore с защитой от лишних release()\n\nEvent\n  флаг-сигнал между потоками\n\nCondition\n  ожидание некоторого состояния под lock\n\nBarrier\n  ожидание группы потоков в одной точке\n```\n\n`Lock`, `RLock`, `Condition`, `Semaphore` и `BoundedSemaphore` можно использовать через `with`, то есть как context manager. Это безопаснее, потому что `release()` будет вызван даже при исключении. \n\n---\n\n### Lock\n\n`Lock` нужен, когда только один поток должен выполнять критическую секцию.\n\n```python\nimport threading\n\nlock = threading.Lock()\ncounter = 0\n\n\ndef increment():\n    global counter\n\n    for _ in range(100_000):\n        with lock:\n            counter += 1\n```\n\nБез `Lock` несколько потоков могут одновременно читать и менять `counter`, из-за чего часть инкрементов потеряется.\n\nСхема:\n\n```text\nThread 1 ── acquire lock ── работает ── release lock\nThread 2 ── ждёт        ─── работает после освобождения\n```\n\nИспользовать, когда нужно защитить:\n\n```text\nобщий счётчик\nобщий dict/list/set\nзапись в общий файл\nобщий cache\nобщий объект с изменяемым состоянием\n```\n\n---\n\n### RLock\n\n`RLock` — reentrant lock, то есть рекурсивная блокировка.\n\nОна нужна, когда один и тот же поток может захватить lock несколько раз.\n\n```python\nimport threading\n\nlock = threading.RLock()\n\n\ndef outer():\n    with lock:\n        inner()\n\n\ndef inner():\n    with lock:\n        print(\"Работает\")\n```\n\nС обычным `Lock` такой код может зависнуть:\n\n```python\nlock = threading.Lock()\n\ndef outer():\n    with lock:\n        inner()\n\ndef inner():\n    with lock:\n        print(\"deadlock\")\n```\n\nПочему:\n\n```text\nouter() захватил Lock\ninner() пытается захватить тот же Lock\nтот же поток ждёт сам себя\n```\n\n`RLock` хранит владельца и счётчик захватов. Один и тот же поток может вызвать `acquire()` несколько раз, но должен столько же раз вызвать `release()`. Это поведение описано в документации Python для `RLock`. \n\nИспользовать, когда:\n\n```text\nметоды одного класса вызывают друг друга\nи каждый метод должен быть thread-safe\n```\n\nПример:\n\n```python\nimport threading\n\n\nclass BankAccount:\n    def __init__(self):\n        self._balance = 0\n        self._lock = threading.RLock()\n\n    def deposit(self, amount):\n        with self._lock:\n            self._balance += amount\n\n    def deposit_bonus(self, amount):\n        with self._lock:\n            self.deposit(amount)\n            self.deposit(10)\n```\n\n---\n\n### Semaphore\n\n`Semaphore` — ограничитель количества одновременных доступов.\n\nОн нужен, когда ресурсом может пользоваться не один поток, а ограниченное количество потоков.\n\nНапример, максимум 3 потока одновременно могут делать сетевой запрос:\n\n```python\nimport threading\nimport time\n\nsemaphore = threading.Semaphore(3)\n\ndef request():\n    with semaphore:\n        print(\"start\")\n        time.sleep(1)\n        print(\"end\")\n\nthreads = [\n    threading.Thread(target=request)\n    for _ in range(10)\n]\n\nfor thread in threads:\n    thread.start()\n\nfor thread in threads:\n    thread.join()\n```\n\nИдея:\n\n```text\nLock        → пускает только 1 поток\nSemaphore   → пускает N потоков\n```\n\nПример использования:\n\n```text\nограничить количество подключений к API\nограничить количество одновременных загрузок файлов\nограничить доступ к пулу ресурсов\n```\n\n---\n\n### BoundedSemaphore\n\n`BoundedSemaphore` похож на `Semaphore`, но защищает от ошибки лишнего `release()`.\n\n```python\nimport threading\n\nsem = threading.BoundedSemaphore(2)\n\nsem.acquire()\nsem.release()\nsem.release()  # ошибка, если release() вызван слишком много раз\n```\n\nОбычный `Semaphore` может увеличить счётчик выше начального значения. `BoundedSemaphore` проверяет, чтобы счётчик не превысил начальное значение. Это полезно для поиска багов в логике синхронизации. \n\n---\n\n### Event\n\n`Event` — это флаг-сигнал между потоками.\n\nОдин поток ждёт:\n\n```python\nevent.wait()\n```\n\nДругой поток сообщает:\n\n```python\nevent.set()\n```\n\nПример:\n\n```python\nimport threading\nimport time\n\nevent = threading.Event()\n\n\ndef worker():\n    print(\"Жду сигнал\")\n    event.wait()\n    print(\"Сигнал получен\")\n\n\nthread = threading.Thread(target=worker)\nthread.start()\n\ntime.sleep(2)\nevent.set()\n\nthread.join()\n```\n\nСхема:\n\n```text\nThread 1: event.wait() ── ждёт\nThread 2: event.set()  ── подаёт сигнал\nThread 1: продолжает работу\n```\n\nУ `Event` есть внутренний флаг. `set()` устанавливает его в `True`, `clear()` сбрасывает в `False`, `wait()` блокирует поток, пока флаг не станет `True`. \n\nИспользовать, когда:\n\n```text\nодин поток должен дождаться старта другого\nнужно сообщить потокам \"можно начинать\"\nнужно сообщить \"пора завершаться\"\nнужно сделать простой сигнал без передачи данных\n```\n\nПример остановки worker-потока:\n\n```python\nimport threading\nimport time\n\nstop_event = threading.Event()\n\n\ndef worker():\n    while not stop_event.is_set():\n        print(\"working\")\n        time.sleep(1)\n\n    print(\"stopped\")\n\n\nthread = threading.Thread(target=worker)\nthread.start()\n\ntime.sleep(3)\nstop_event.set()\n\nthread.join()\n```\n\n---\n\n### Condition\n\n`Condition` нужен, когда поток должен ждать не просто сигнал, а выполнение некоторого условия.\n\nНапример:\n\n```text\nждать, пока очередь не станет непустой\nждать, пока появятся данные\nждать, пока состояние объекта изменится\n```\n\nПример producer/consumer:\n\n```python\nimport threading\nimport time\n\ncondition = threading.Condition()\nitems = []\n\n\ndef consumer():\n    with condition:\n        while not items:\n            condition.wait()\n\n        item = items.pop()\n        print(\"got:\", item)\n\n\ndef producer():\n    time.sleep(2)\n\n    with condition:\n        items.append(\"data\")\n        condition.notify()\n\n\nt1 = threading.Thread(target=consumer)\nt2 = threading.Thread(target=producer)\n\nt1.start()\nt2.start()\n\nt1.join()\nt2.join()\n```\n\nКак это работает:\n\n```text\nconsumer:\n  захватывает condition lock\n  проверяет items\n  если items пустой:\n    condition.wait()\n      отпускает lock\n      засыпает\n\nproducer:\n  захватывает condition lock\n  добавляет item\n  вызывает notify()\n  отпускает lock\n\nconsumer:\n  просыпается\n  снова захватывает lock\n  продолжает работу\n```\n\nВ документации указано важное поведение: `wait()` освобождает lock и блокирует поток, а после пробуждения снова захватывает lock перед возвратом из `wait()`. \n\nОбычно `Condition` используют с циклом `while`, а не с `if`:\n\n```python\nwith condition:\n    while not items:\n        condition.wait()\n\n    item = items.pop()\n```\n\nТак безопаснее, потому что поток может проснуться, но нужное условие всё ещё может быть ложным.\n\n---\n\n### Lock vs RLock vs Semaphore vs Event vs Condition\n\n```text\nLock\n  \"Только один поток может войти в эту секцию\"\n\nRLock\n  \"Только один поток, но этот же поток может войти повторно\"\n\nSemaphore\n  \"Не больше N потоков одновременно\"\n\nEvent\n  \"Ждите, пока кто-то подаст сигнал\"\n\nCondition\n  \"Ждите, пока под lock выполнится конкретное условие\"\n```\n\n---\n\n### Практическая таблица\n\n|Инструмент|Что делает|Когда использовать|\n|---|---|---|\n|`Lock`|Пускает только один поток|Защита общего состояния|\n|`RLock`|То же, но один поток может захватить повторно|Вложенные thread-safe методы|\n|`Semaphore`|Пускает максимум `N` потоков|Лимит подключений/запросов/ресурсов|\n|`BoundedSemaphore`|Как `Semaphore`, но ловит лишний `release()`|Более безопасный semaphore|\n|`Event`|Сигнал-флаг между потоками|Старт/стоп/готовность|\n|`Condition`|Ожидание условия + lock|Producer/consumer, очереди, состояние|\n|`Barrier`|Ждёт, пока соберётся группа потоков|Синхронный старт/этапы обработки|\n\n---\n\n### Главное правило\n\nДля защиты данных:\n\n```python\nwith lock:\n    # работа с общим состоянием\n```\n\nДля ожидания сигнала:\n\n```python\nevent.wait()\n```\n\nДля ограничения параллельного доступа:\n\n```python\nwith semaphore:\n    # работа с ограниченным ресурсом\n```\n\nДля ожидания изменения состояния:\n\n```python\nwith condition:\n    while not condition_is_true:\n        condition.wait()\n```\n\nВ реальном коде часто используют не голые `Condition`, а готовую потокобезопасную очередь `queue.Queue`, потому что она уже внутри использует нужную синхронизацию для producer/consumer-сценариев."
  popularity = 2.63

