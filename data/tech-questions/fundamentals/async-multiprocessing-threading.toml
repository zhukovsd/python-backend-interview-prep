  question = "Что такое event loop в асинхронности?"
  answer = "### Что такое event loop\n\n`event loop` — это центральный механизм асинхронного выполнения в `asyncio`.\n\nОн отвечает за то, чтобы:\n\n```text\nзапускать coroutine-задачи\nпереключаться между ними\nследить за I/O-операциями\nвыполнять callbacks\nвозвращать управление задачам, когда они готовы продолжить работу\n```\n\nВ документации Python event loop описан как ядро каждого `asyncio`-приложения: он запускает асинхронные задачи и callbacks, выполняет сетевые I/O-операции и работает с subprocess. \n\n---\n\n### Простая аналогия\n\nEvent loop — это диспетчер задач.\n\nУ него есть несколько задач:\n\n```text\nTask A: ждёт ответ от базы данных\nTask B: ждёт HTTP-запрос\nTask C: ждёт таймер\nTask D: уже готова продолжить выполнение\n```\n\nEvent loop не сидит без дела, пока одна задача ждёт. Он переключается на другую задачу, которая уже может выполняться.\n\n```text\nTask A дошла до await\n↓\nA временно остановлена\n\nevent loop смотрит:\nесть ли другая готовая задача?\n\n↓\nTask B продолжает выполнение\n```\n\n---\n\n### Как это выглядит в коде\n\n```python\nimport asyncio\n\n\nasync def task(name: str, delay: int):\n    print(f\"{name}: start\")\n    await asyncio.sleep(delay)\n    print(f\"{name}: end\")\n\n\nasync def main():\n    await asyncio.gather(\n        task(\"A\", 2),\n        task(\"B\", 1),\n        task(\"C\", 3),\n    )\n\n\nasyncio.run(main())\n```\n\nЗдесь `asyncio.run(main())` создаёт и запускает event loop для верхнего уровня программы. Документация Python указывает, что `asyncio.run()` используется для запуска top-level async entry point. \n\n---\n\n### Что происходит пошагово\n\n```text\n1. Запускается main()\n2. asyncio.gather() регистрирует три coroutine как задачи\n3. Task A доходит до await asyncio.sleep(2)\n4. Task A отдаёт управление event loop\n5. Event loop запускает Task B\n6. Task B доходит до await asyncio.sleep(1)\n7. Task B отдаёт управление event loop\n8. Event loop запускает Task C\n9. Когда sleep у B закончился — event loop возвращает выполнение B\n10. Потом возвращает A и C, когда они тоже готовы\n```\n\nГлавная мысль:\n\n```text\nawait — это точка, где coroutine может уступить управление event loop.\n```\n\n---\n\n### Event loop не выполняет всё одновременно\n\nВажно: event loop не делает Python-код параллельным сам по себе.\n\nОбычно схема такая:\n\n```text\nодин event loop\n↓\nодин поток\n↓\nодна задача реально выполняется в конкретный момент\n```\n\nНо когда задача ждёт I/O, например сеть или БД, event loop может выполнять другие задачи.\n\n```text\nПараллельность CPU:\nнесколько задач реально считаются одновременно на разных ядрах\n\nКонкурентность asyncio:\nзадачи быстро чередуются, пока часть из них ждёт I/O\n```\n\n`asyncio` в официальной документации описывается как библиотека для конкурентного кода через `async/await`, особенно подходящая для I/O-bound и сетевого кода. \n\n---\n\n### Что event loop отслеживает\n\nEvent loop обычно работает с такими вещами:\n\n```text\nготовые задачи\nожидающие задачи\nтаймеры\nсетевые события\ncallbacks\nFuture-объекты\nsubprocess\nexecutor для потоков/процессов\n```\n\nНапример, когда coroutine делает:\n\n```python\nawait asyncio.sleep(1)\n```\n\nона не блокирует поток на 1 секунду. Она говорит event loop:\n\n```text\n\"Поставь меня на паузу и вернись ко мне примерно через 1 секунду\"\n```\n\n---\n\n### Почему нельзя блокировать event loop\n\nПлохой пример:\n\n```python\nimport asyncio\nimport time\n\n\nasync def bad():\n    time.sleep(5)  # блокирует весь event loop\n    print(\"done\")\n\n\nasyncio.run(bad())\n```\n\nПока работает `time.sleep(5)`, event loop не может переключиться на другие задачи.\n\nПравильно:\n\n```python\nimport asyncio\n\n\nasync def good():\n    await asyncio.sleep(5)\n    print(\"done\")\n\n\nasyncio.run(good())\n```\n\nИли, если нужно запустить обычный синхронный блокирующий код:\n\n```python\nimport asyncio\nimport time\n\n\ndef sync_work():\n    time.sleep(5)\n    return \"done\"\n\n\nasync def main():\n    result = await asyncio.to_thread(sync_work)\n    print(result)\n\n\nasyncio.run(main())\n```\n\n---\n\n### Event loop vs coroutine vs task\n\n```text\ncoroutine\n→ асинхронная функция, созданная через async def\n\ntask\n→ coroutine, запланированная на выполнение в event loop\n\nevent loop\n→ механизм, который запускает task и переключается между ними\n```\n\nПример:\n\n```python\nasync def hello():\n    return \"hello\"\n```\n\nЭто coroutine-функция.\n\n```python\ncoro = hello()\n```\n\nЭто coroutine-объект.\n\n```python\ntask = asyncio.create_task(hello())\n```\n\nЭто уже задача, которую event loop может выполнять. Документация Python отдельно указывает, что простой вызов coroutine не запускает её выполнение; для запуска используются `asyncio.run()`, `await` или создание `Task`. \n\n---\n\n### Короткая схема\n\n```text\nasyncio.run(main())\n        ↓\nсоздаётся event loop\n        ↓\nmain() запускается как coroutine\n        ↓\nсоздаются task\n        ↓\ntask выполняются до await\n        ↓\nна await задача отдаёт управление\n        ↓\nevent loop запускает другую готовую task\n        ↓\nкогда I/O готово — задача продолжается\n```\n\n---\n\n### Итог\n\n`event loop` — это диспетчер асинхронных задач.\n\nОн не делает CPU-вычисления параллельными, но позволяет эффективно использовать время ожидания:\n\n```text\nпока одна coroutine ждёт сеть / БД / файл / таймер,\nevent loop запускает другую coroutine.\n```\n\nПоэтому `asyncio` особенно полезен для I/O-bound задач: сетевые запросы, базы данных, WebSocket, HTTP-серверы, очереди, большое количество одновременных соединений."
