[[questions]]
  id = 13
  question = "Можно ли реализовать асинхронный подход без asyncio?"
  answer = "Да, конкурентность можно реализовать без `async/await`.\n\nОсновные варианты:\n\n```text\nКонкурентность без async/await\n├── threading\n├── concurrent.futures.ThreadPoolExecutor\n├── multiprocessing / ProcessPoolExecutor\n├── InterpreterPoolExecutor\n├── selectors / select / epoll / kqueue\n├── callback-based event loop\n├── generators / yield-based scheduler\n└── greenlet / gevent\n```\n\n`asyncio` — это не единственный способ писать конкурентный код. Это стандартная библиотека для асинхронного I/O с `async/await`, но сама идея конкурентности шире.\n\n---\n\n### 1. Потоки: threading\n\nСамый прямой способ без `async/await` — создать несколько потоков:\n\n```python\nimport threading\nimport requests\n\ndef load_url(url):\n    response = requests.get(url)\n    print(url, response.status_code)\n\nthreads = [\n    threading.Thread(target=load_url, args=(\"https://example.com\",)),\n    threading.Thread(target=load_url, args=(\"https://python.org\",)),\n]\n\nfor thread in threads:\n    thread.start()\n\nfor thread in threads:\n    thread.join()\n```\n\nПотоки хорошо подходят для I/O-bound задач: сетевые запросы, работа с файлами, ожидание БД, API, Redis и т.д. Документация Python прямо указывает, что `threading` полезен для задач, где много ожидания внешних ресурсов. \n\nНо для CPU-bound задач в обычном CPython потоки часто не дают настоящего параллельного выполнения Python-кода из-за GIL.\n\n---\n\n### 2. ThreadPoolExecutor\n\nБолее удобный способ — не создавать потоки вручную, а использовать пул потоков:\n\n```python\nfrom concurrent.futures import ThreadPoolExecutor, as_completed\nimport requests\n\ndef load_url(url):\n    response = requests.get(url)\n    return url, response.status_code\n\nurls = [\n    \"https://example.com\",\n    \"https://python.org\",\n    \"https://docs.python.org\",\n]\n\nwith ThreadPoolExecutor(max_workers=3) as executor:\n    futures = [executor.submit(load_url, url) for url in urls]\n\n    for future in as_completed(futures):\n        print(future.result())\n```\n\nЗдесь нет `async def`, `await`, `asyncio`, но выполнение всё равно асинхронное в широком смысле: ты отправляешь задачи в пул и забираешь результат позже через `Future`. В документации `concurrent.futures` прямо сказано, что модуль предоставляет высокоуровневый интерфейс для асинхронного выполнения callable-объектов через потоки, интерпретаторы или процессы. \n\n---\n\n### 3. multiprocessing / ProcessPoolExecutor\n\nДля CPU-bound задач лучше использовать процессы:\n\n```python\nfrom concurrent.futures import ProcessPoolExecutor\n\ndef heavy_calculation(n):\n    total = 0\n    for i in range(n):\n        total += i * i\n    return total\n\nwith ProcessPoolExecutor() as executor:\n    results = executor.map(heavy_calculation, [10_000_000, 20_000_000, 30_000_000])\n\nprint(list(results))\n```\n\nПроцессы обходят GIL, потому что каждый процесс имеет свой интерпретатор Python и свою память. Документация `multiprocessing` прямо говорит, что модуль обходит GIL за счёт subprocesses и позволяет использовать несколько процессоров. \n\nМинусы процессов:\n\n```text\n+ настоящая параллельность для CPU-bound\n- дороже создание процесса\n- данные нужно сериализовать\n- память не общая, как у потоков\n- обмен данными сложнее\n```\n\n---\n\n### 4. InterpreterPoolExecutor\n\nВ Python 3.14 появился `InterpreterPoolExecutor`: это пул потоков, но каждый worker работает в своём интерпретаторе. У каждого такого интерпретатора свой GIL, поэтому код может выполняться на разных CPU-ядрах параллельно. \n\nУпрощённо:\n\n```text\nThreadPoolExecutor\n├── один процесс\n├── один интерпретатор\n└── один GIL\n\nInterpreterPoolExecutor\n├── один процесс\n├── несколько интерпретаторов\n└── у каждого интерпретатора свой GIL\n```\n\nНо есть ограничение: интерпретаторы изолированы. Нельзя просто так разделять между ними изменяемые объекты. Данные нужно копировать, сериализовать или передавать через специальные механизмы. \n\n---\n\n### 5. selectors / select: свой event loop без asyncio\n\nМожно реализовать асинхронный подход вообще без `asyncio`, используя неблокирующие сокеты и `selectors`.\n\nИдея:\n\n```text\n1. Сокеты переводятся в non-blocking режим\n2. selectors ждёт готовности сокета к чтению/записи\n3. Когда сокет готов — вызывается обработчик\n4. Один поток обслуживает много соединений\n```\n\n`selectors` — это высокоуровневая обёртка над `select`, `poll`, `epoll`, `kqueue` и другими механизмами ожидания I/O-событий. Документация рекомендует использовать `selectors`, если не нужен точный контроль над низкоуровневыми OS-примитивами. \n\nСхематично:\n\n```python\nimport selectors\nimport socket\n\nselector = selectors.DefaultSelector()\n\nserver = socket.socket()\nserver.bind((\"localhost\", 8000))\nserver.listen()\nserver.setblocking(False)\n\nselector.register(server, selectors.EVENT_READ)\n\nwhile True:\n    events = selector.select()\n\n    for key, mask in events:\n        sock = key.fileobj\n\n        if sock is server:\n            conn, addr = server.accept()\n            conn.setblocking(False)\n            selector.register(conn, selectors.EVENT_READ)\n        else:\n            data = sock.recv(1024)\n            if data:\n                sock.sendall(data)\n            else:\n                selector.unregister(sock)\n                sock.close()\n```\n\nЭто уже асинхронный I/O-подход, но без `asyncio` и без `async/await`.\n\n---\n\n### 6. Генераторы и yield-based scheduler\n\nДо появления современного `async/await` корутины в Python можно было строить через генераторы. `yield` приостанавливает выполнение функции и сохраняет её состояние, а потом выполнение можно продолжить. \n\nПростейшая идея:\n\n```python\ndef task(name):\n    for i in range(3):\n        print(name, i)\n        yield\n\ntasks = [task(\"A\"), task(\"B\")]\n\nwhile tasks:\n    current = tasks.pop(0)\n\n    try:\n        next(current)\n        tasks.append(current)\n    except StopIteration:\n        pass\n```\n\nВывод будет чередоваться:\n\n```text\nA 0\nB 0\nA 1\nB 1\nA 2\nB 2\n```\n\nЭто кооперативная конкурентность:\n\n```text\nЗадача сама отдаёт управление через yield.\nПока она не отдаст управление — другая задача не выполняется.\n```\n\nТак можно написать собственный мини-планировщик. Но для реального сетевого I/O нужно связать генераторы с `selectors`, таймерами, очередями событий и обработкой ошибок.\n\n---\n\n### 7. greenlet / gevent\n\n`greenlet` — это легковесные корутины для конкурентного программирования внутри процесса. Они похожи на кооперативные потоки: переключение происходит явно или через библиотеку, а не вытесняется ОС. ([Greenlet](https://greenlet.readthedocs.io/en/stable/ \"greenlet 3.5.2 documentation\"))\n\n`gevent` строится поверх `greenlet` и даёт синхронный на вид API поверх event loop `libev` или `libuv`. \n\nПримерно так:\n\n```python\nimport gevent\nfrom gevent import monkey\n\nmonkey.patch_all()\n\nimport requests\n\ndef load_url(url):\n    response = requests.get(url)\n    print(url, response.status_code)\n\njobs = [\n    gevent.spawn(load_url, \"https://example.com\"),\n    gevent.spawn(load_url, \"https://python.org\"),\n]\n\ngevent.joinall(jobs)\n```\n\nКод выглядит синхронным, но I/O может выполняться конкурентно. Минус: если где-то используется блокирующий код, который не был “пропатчен” или не умеет отдавать управление, он может заблокировать весь поток.\n\n---\n\n### Как на всё это влияет GIL\n\nGIL — это глобальная блокировка интерпретатора CPython. В обычной сборке CPython поток должен владеть GIL, чтобы работать с Python-объектами и выполнять Python C API. \n\nГлавное:\n\n```text\nI/O-bound + threads\n→ обычно нормально\n\nCPU-bound + threads\n→ плохо масштабируется из-за GIL\n\nCPU-bound + processes\n→ хорошо, потому что процессы обходят GIL\n\nCPU-bound + C extensions\n→ может быть хорошо, если расширение отпускает GIL\n\nasyncio / selectors / gevent\n→ GIL не основная проблема, потому что одна задача ждёт I/O, пока другая работает\n```\n\nДокументация Python отдельно указывает, что GIL ограничивает выигрыш от `threading` для CPU-bound задач, потому что только один поток может выполнять Python bytecode одновременно. \n\nПри этом GIL освобождается вокруг блокирующих I/O-операций, например чтения или записи файла. Поэтому потоки всё равно полезны для сетевых запросов, файлов, БД и других операций ожидания. \n\n---\n\n### Важный момент: GIL не отменяет race condition\n\nИногда ошибочно думают:\n\n```text\nЕсть GIL → значит потоки безопасны\n```\n\nЭто неверно.\n\nGIL не делает твою бизнес-логику потокобезопасной. Интерпретатор может переключать потоки между bytecode-инструкциями, поэтому для общего изменяемого состояния всё равно нужны `Lock`, `RLock`, `Queue`, `Condition`, `Semaphore` и другие примитивы синхронизации. Документация Python прямо отмечает, что переключения между bytecode-инструкциями — причина, по которой lock-и всё равно нужны для thread-safety в pure-Python коде. \n\nПример проблемы:\n\n```python\ncounter = 0\n\ndef increment():\n    global counter\n    for _ in range(100_000):\n        counter += 1\n```\n\nОперация `counter += 1` не должна восприниматься как одна неделимая операция на уровне логики.\n\n---\n\n### Можно ли реализовать async-подход без asyncio?\n\nДа.\n\nЕсть несколько вариантов:\n\n```text\n1. concurrent.futures\n   Асинхронно отправлять задачи в пул и получать Future.\n\n2. selectors\n   Написать свой event loop на неблокирующих сокетах.\n\n3. callbacks\n   Строить код вокруг функций-обработчиков событий.\n\n4. generators\n   Сделать кооперативный scheduler через yield.\n\n5. greenlet/gevent\n   Использовать greenlet-based конкурентность.\n\n6. Trio / Curio / AnyIO\n   Это async-библиотеки не на asyncio или не только на asyncio,\n   но обычно они всё равно используют async/await.\n```\n\nТо есть:\n\n```text\nasync/await — синтаксис языка\nasyncio      — стандартная библиотека/event loop\nасинхронность — общий подход\nконкурентность — ещё более широкое понятие\n```\n\n`asyncio` — не единственный способ. В документации `asyncio` event loop описан как ядро asyncio-приложения, которое запускает async tasks, callbacks, сетевой I/O и subprocesses. Но подобный event loop можно построить и самостоятельно на `selectors`, либо использовать сторонний loop вроде `gevent`. \n\n---\n\n### Практический выбор\n\n```text\nМного HTTP/API/БД запросов, код уже синхронный\n→ ThreadPoolExecutor\n\nCPU-bound вычисления\n→ ProcessPoolExecutor / multiprocessing\n\nНужно много соединений в одном потоке\n→ asyncio / selectors / gevent\n\nНужен низкоуровневый контроль\n→ selectors\n\nНужно писать современный async-код\n→ asyncio / Trio / AnyIO\n\nНужна настоящая параллельность внутри одного процесса на новых версиях Python\n→ InterpreterPoolExecutor, но с учётом изоляции интерпретаторов\n```\n\nИтог:\n\n```text\nКонкурентность без async/await — да.\nАсинхронный подход без asyncio — да.\nНастоящий параллелизм CPU-bound в обычных потоках CPython — обычно нет из-за GIL.\nДля CPU-bound лучше процессы, отдельные интерпретаторы или free-threaded Python.\n```\n\nНачиная с Python 3.13, CPython поддерживает отдельную free-threaded сборку, где GIL отключён. Но это не обычный режим по умолчанию для большинства окружений, и часть C-расширений может быть не готова к такому режиму или повторно включать GIL. "
