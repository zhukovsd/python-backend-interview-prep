  id = 18
  question = "Как организовать одновременное выполнение нескольких coroutine-задач?"
  answer = "Одновременное выполнение нескольких coroutine-задач в Python обычно организуют через `asyncio`:\n\n```python\nimport asyncio\n\nasync def fetch_user(user_id: int):\n    await asyncio.sleep(1)\n    return f\"user:{user_id}\"\n\nasync def main():\n    results = await asyncio.gather(\n        fetch_user(1),\n        fetch_user(2),\n        fetch_user(3),\n    )\n\n    print(results)\n\nasyncio.run(main())\n```\n\n`asyncio.run()` запускает корутину как основную точку входа программы, создаёт event loop, выполняет awaitable-объект и закрывает цикл после завершения. \n\n### Важно: просто `await` подряд — не параллельное выполнение\n\nТак задачи выполняются последовательно:\n\n```python\nasync def main():\n    result_1 = await fetch_user(1)\n    result_2 = await fetch_user(2)\n    result_3 = await fetch_user(3)\n```\n\nСначала полностью ожидается `fetch_user(1)`, потом `fetch_user(2)`, потом `fetch_user(3)`.\n\nДля конкурентного выполнения нужно передать корутины в механизм планирования задач: `asyncio.gather()`, `asyncio.TaskGroup` или `asyncio.create_task()`.\n\n### Способ 1: `asyncio.gather()`\n\nИспользуется, когда нужно запустить несколько независимых задач и дождаться всех результатов.\n\n```python\nimport asyncio\n\nasync def task(name: str, delay: int):\n    print(f\"{name}: start\")\n    await asyncio.sleep(delay)\n    print(f\"{name}: end\")\n    return name\n\nasync def main():\n    results = await asyncio.gather(\n        task(\"A\", 3),\n        task(\"B\", 1),\n        task(\"C\", 2),\n    )\n\n    print(results)\n\nasyncio.run(main())\n```\n\nПримерный вывод:\n\n```text\nA: start\nB: start\nC: start\nB: end\nC: end\nA: end\n['A', 'B', 'C']\n```\n\n`asyncio.gather()` запускает awaitable-объекты конкурентно; если переданы корутины, они автоматически планируются как задачи. \n\n### Способ 2: `asyncio.create_task()`\n\nИспользуется, когда задачу нужно запустить сейчас, а дождаться результата позже.\n\n```python\nimport asyncio\n\nasync def load_data():\n    await asyncio.sleep(2)\n    return \"data\"\n\nasync def send_log():\n    await asyncio.sleep(1)\n    return \"log sent\"\n\nasync def main():\n    data_task = asyncio.create_task(load_data())\n    log_task = asyncio.create_task(send_log())\n\n    print(\"Задачи уже запущены\")\n\n    data = await data_task\n    log = await log_task\n\n    print(data)\n    print(log)\n\nasyncio.run(main())\n```\n\nСмысл:\n\n```text\ncreate_task()\n↓\nкорутина оборачивается в Task\n↓\nTask регистрируется в event loop\n↓\nevent loop выполняет задачи конкурентно\n```\n\nЗадача `Task` — это объект, через который event loop может управлять выполнением корутины. Документация Python отдельно выделяет coroutines, awaitables, tasks, cancellation и task groups как основные элементы работы с конкурентными корутинами. \n\n### Способ 3: `asyncio.TaskGroup`\n\nВ современном коде часто предпочтительнее `TaskGroup`, особенно когда задачи логически связаны.\n\n```python\nimport asyncio\n\nasync def worker(name: str, delay: int):\n    await asyncio.sleep(delay)\n    print(f\"{name} done\")\n    return name\n\nasync def main():\n    async with asyncio.TaskGroup() as tg:\n        task_1 = tg.create_task(worker(\"A\", 2))\n        task_2 = tg.create_task(worker(\"B\", 1))\n        task_3 = tg.create_task(worker(\"C\", 3))\n\n    print(task_1.result())\n    print(task_2.result())\n    print(task_3.result())\n\nasyncio.run(main())\n```\n\n`TaskGroup` даёт structured concurrency: задачи создаются внутри блока, а выход из блока означает, что все задачи завершены или корректно обработаны при ошибке. \n\n### Ограничение количества одновременных задач\n\nНапример, нельзя отправлять 1000 HTTP-запросов сразу. Тогда используют `asyncio.Semaphore`.\n\n```python\nimport asyncio\n\nsem = asyncio.Semaphore(3)\n\nasync def limited_task(number: int):\n    async with sem:\n        print(f\"start {number}\")\n        await asyncio.sleep(1)\n        print(f\"end {number}\")\n\nasync def main():\n    tasks = [\n        limited_task(i)\n        for i in range(10)\n    ]\n\n    await asyncio.gather(*tasks)\n\nasyncio.run(main())\n```\n\nЗдесь одновременно выполняется максимум 3 задачи.\n\n### Главное отличие\n\n```python\nawait coro()\n```\n\nозначает: выполнить и дождаться эту корутину в текущем месте.\n\n```python\nasyncio.create_task(coro())\n```\n\nозначает: запланировать корутину как отдельную задачу в event loop.\n\n```python\nawait asyncio.gather(coro1(), coro2(), coro3())\n```\n\nозначает: запустить несколько корутин конкурентно и дождаться всех.\n\n### Когда это реально полезно\n\n`asyncio` хорошо подходит для I/O-bound задач: сетевые запросы, работа с базой данных через async-драйвер, Redis, файловые операции через async-совместимые библиотеки, ожидание внешних сервисов. Официальная документация описывает `asyncio` как библиотеку для конкурентного кода через `async/await`, особенно подходящую для I/O-bound и сетевого кода. \n\nДля CPU-bound задач вроде тяжёлых вычислений `asyncio` сам по себе не даст настоящего параллельного ускорения, потому что event loop выполняет Python-код в одном потоке и переключается только в точках ожидания.\n\n### Итог\n\nОсновные варианты:\n\n```python\n# 1. Просто и часто достаточно\nawait asyncio.gather(coro1(), coro2(), coro3())\n\n# 2. Запустить сейчас, дождаться позже\ntask = asyncio.create_task(coro())\nresult = await task\n\n# 3. Современный структурированный вариант\nasync with asyncio.TaskGroup() as tg:\n    task = tg.create_task(coro())\n```\n\nДля большинства случаев:\n\n```python\nasyncio.gather()\n```\n\n— самый простой вариант.\n\nДля более аккуратного production-кода с группой связанных задач:\n\n```python\nasyncio.TaskGroup\n```\n\n— более безопасный и структурированный вариант."
  popularity = 5.26

[[questions]]
  id = 19
  question = "Как event loop понимает, что можно запустить другую задачу?"
  answer = "`event loop` не “угадывает”, что пора переключиться.\n\nОн запускает задачу, а задача сама отдаёт управление, когда доходит до `await`, который ждёт ещё неготовый результат: I/O, таймер, `Future`, другую `Task` и т.д.\n\nТо есть переключение в `asyncio` — кооперативное.\n\n### Что происходит пошагово\n\nДопустим:\n\n```python\nasync def task1():\n    print(\"A\")\n    await asyncio.sleep(1)\n    print(\"B\")\n\nasync def task2():\n    print(\"C\")\n```\n\nКогда `event loop` запускает `task1`, она выполняется до первого реального ожидания:\n\n```python\nprint(\"A\")\nawait asyncio.sleep(1)\n```\n\n`asyncio.sleep(1)` создаёт ожидание таймера. Результата ещё нет, поэтому `task1` приостанавливается и отдаёт управление обратно в `event loop`.\n\nПосле этого `event loop` смотрит:\n\n```text\nЕсть ли готовые задачи/колбэки?\nЕсть ли завершившиеся Future?\nЕсть ли сработавшие таймеры?\nЕсть ли готовые I/O-события?\n```\n\nЕсли есть готовая `task2`, он запускает её.\n\nОфициальная документация Python описывает event loop как ядро `asyncio`, которое выполняет асинхронные задачи и callbacks, а также обрабатывает сетевой I/O и subprocesses. \n\n### Главная идея\n\nЗадача выполняется до тех пор, пока не произойдёт одно из событий:\n\n```text\n1. задача завершилась\n2. задача выбросила исключение\n3. задача дошла до await и ждёт неготовый результат\n```\n\nВ третьем случае задача говорит event loop примерно следующее:\n\n```text\nЯ пока не могу продолжить.\nРазбуди меня, когда этот Future/Task/I/O/таймер будет готов.\n```\n\n`Future` в `asyncio` как раз представляет будущий результат операции. Корутинa может ждать `Future`, пока тот не получит результат, исключение или отмену. \n\n### Как задача возвращается обратно\n\nКогда ожидаемый объект становится готовым:\n\n```text\nтаймер истёк\nсокет получил данные\nзапрос к БД вернул результат\nдругая task завершилась\nFuture получил set_result()\n```\n\n`Future` помечается как `done`, и его callbacks добавляются обратно в очередь event loop. Документация указывает, что callback у `Future` вызывается после завершения Future, а если Future уже завершён, callback планируется через `loop.call_soon()`. \n\nУпрощённо:\n\n```text\ntask1 дошла до await\n↓\ntask1 приостановлена\n↓\nevent loop запускает другие готовые задачи\n↓\nожидание task1 завершилось\n↓\ntask1 снова попадает в очередь готовых задач\n↓\nevent loop продолжает task1 после await\n```\n\n### Важно: event loop не прерывает обычный код\n\nВот так переключения не будет:\n\n```python\nasync def bad():\n    for i in range(10_000_000_000):\n        pass\n```\n\nНесмотря на `async def`, внутри нет `await`. Значит, задача не отдаёт управление. Event loop будет заблокирован, пока цикл не закончится.\n\nПравильнее:\n\n```python\nasync def better():\n    for i in range(10_000_000):\n        if i % 1000 == 0:\n            await asyncio.sleep(0)\n```\n\n`await asyncio.sleep(0)` — явная точка уступки управления. Она даёт event loop возможность запустить другие готовые задачи.\n\n### Ментальная модель\n\n```text\nevent loop\n ├─ очередь готовых задач\n ├─ таймеры\n ├─ I/O события\n └─ callbacks\n\nTask выполняется\n └─ до ближайшего await, который реально ждёт\n\nawait на неготовом объекте\n └─ задача засыпает\n\nFuture/таймер/I/O завершился\n └─ задача снова становится готовой\n```\n\n### Главное правило\n\n`event loop` понимает, что можно запустить другую задачу, потому что текущая задача дошла до `await` и приостановилась на неготовом awaitable-объекте.\n\nНе `async def` делает переключение, а именно реальная точка ожидания:\n\n```python\nawait something_not_ready\n```"
  popularity = 2.63

