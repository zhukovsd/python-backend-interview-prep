[[questions]]
  id = 1
  question = "Что такое асинхронность и как она устроена?"
  answer = "Асинхронный код - это подход к написанию кода, который позволяет выполнять несколько задач одновременно в рамках одного потока. Это достигается за счет использования асинхронных функций и корутин. В отличие от синхронного кода, который выполняет каждую задачу последовательно, асинхронный код может запустить несколько задач конкурентно.\r\n\r\nКлючевой механизм: когда одна задача выполняет операцию ввода-вывода (например, ожидает ответ от сети, чтение файла или запрос к базе данных) она освобождает управление, позволяя работать другой задаче. Таким образом, сокращается время, которое поток мог бы проводить в ожидании результатов операции ввода-вывода.\r\n\r\nОсновное отличие от многопоточности: хотя в один момент времени выполняется только одна задача (как и при работе с GIL), переключение между задачами происходит не произвольно по решению операционной системы, а предсказуемо — только в местах, помеченных await, то есть в точках ожидания результатов IO операций, специально отмечаемых программистом.\r\n\r\nЭто позволяет одному потоку обрабатывать тысячи одновременных соединений, делая программу чрезвычайно эффективной для I/O-bound операций (задач, связанных с операциями ввода-вывода).\r\n\r\nМеханизм возврата к выполнению задачи:\r\n\r\nЗадача встречает await и приостанавливается, сообщая event loop: \"Я жду I/O-операцию, займись другими задачами\"\r\nEvent loop продолжает выполнять другие готовые задачи\r\nКогда I/O-операция завершается, система оповещает event loop, что результат готов\r\nEvent loop помещает приостановленную задачу обратно в очередь готовых к выполнению\r\nКогда доходит очередь, задача возобновляется именно с того места, где остановилась, получая результат операции\r\nКлючевые особенности:\r\n\r\nЗапомнилось состояние стека и локальные переменные\r\nВозобновление происходит точно после await\r\nНе нужно заново запускать функцию с начала\r\nАналогия: Как закладка в книге — закрыли на интересном месте, потом открыли и продолжили читать с того же момента.\r\n\r\nПримером использования асинхронного кода является библиотека asyncio в Python. Например, вот простой пример кода, который использует asyncio для запуска нескольких задач одновременно и ожидания их завершения: import asyncio\r\n\r\nasync def hello():\r\n    await asyncio.sleep(1)\r\n    print(\"Hello\")\r\n\r\nasync def world():\r\n    await asyncio.sleep(2)\r\n    print(\"World\")\r\n\r\nasync def main():\r\n    await asyncio.gather(hello(), world())\r\n\r\nif __name__ == '__main__':\r\n    asyncio.run(main())\r\nВ этом примере мы определяем 3 асинхронные функции: hello(), world() и main(). Функции hello() и world() печатают соответствующие сообщения и ждут 1 и 2 секунды соответственно. Функция main() запускает эти две функции одновременно с помощью asyncio.gather() и ждет, пока они завершат свою работу. Затем мы запускаем функцию main() с помощью asyncio.run(). В результате мы получим сообщения \"Hello\" и \"World\", каждое через 1 и 2 секунды соответственно, при этом результаты двух задач были получены почти одновременно.\r\n\r\nОсновные преимущества асинхронного программирования:\r\n\r\nУлучшенная отзывчивость: Позволяет обрабатывать множество задач конкурентно без блокировки основного потока исполнения (для I/O-bound операций). Параллелизм — одновременное выполнение нескольких задач (на разных ядрах/процессорах). Конкурентность — управление несколькими задачами, которые выполняются в перекрывающиеся промежутки времени, но не обязательно одновременно (Asyncio).\r\nЭффективное использование ресурсов: Позволяет эффективно использовать процессорное время, так как задачи выполняются в моменты ожидания операций ввода/вывода или других блокирующих операций.\r\nПростота масштабирования: Позволяет легко создавать множество параллельных (конкурентных) задач без создания большого количества потоков или процессов."
  popularity = 18.42

[[questions]]
  id = 2
  question = "Что такое конкурентность и параллельность?"
  answer = "**Конкурентность** — это когда программа умеет вести несколько задач “одновременно” по времени, переключаясь между ними.\n\n**Параллельность** — это когда несколько задач реально выполняются в один и тот же момент, например на разных ядрах CPU.\n\n```text\nКонкурентность:\nодин исполнитель переключается между задачами\n\nЗадача A:  ███ wait ███ wait ███\nЗадача B:      ███ wait ███ wait ███\nCPU:       A → B → A → B → A\n```\n\n```text\nПараллельность:\nнесколько исполнителей работают реально одновременно\n\nCPU 1:     █████ Задача A █████\nCPU 2:     █████ Задача B █████\n```\n\n### Главное различие\n\n|Понятие|Смысл|Реально одновременно?|\n|---|---|---|\n|Конкурентность|Несколько задач продвигаются вперёд, но могут чередоваться|Не обязательно|\n|Параллельность|Несколько задач выполняются физически одновременно|Да|\n\nТо есть:\n\n```text\nпараллельность ⊂ конкурентность\n```\n\nЛюбая параллельность — это конкурентность, но не всякая конкурентность — параллельность.\n\n### Пример из жизни\n\nКонкурентность:\n\n```text\nТы готовишь суп и жаришь мясо один.\nПоставил суп вариться → пока ждёшь, жаришь мясо → вернулся к супу.\n```\n\nТы один, но продвигаешь две задачи.\n\nПараллельность:\n\n```text\nОдин человек готовит суп.\nДругой человек жарит мясо.\nОба работают одновременно.\n```\n\n### В Python\n\nВ Python конкурентность часто делают через:\n\n```python\nasyncio\nthreading\nconcurrent.futures.ThreadPoolExecutor\n```\n\n`asyncio` в официальной документации Python описан как библиотека для написания конкурентного кода через `async/await`; он особенно полезен, когда программа часто ждёт I/O: сеть, базу данных, файлы, HTTP-запросы. ([Python documentation](https://docs.python.org/3/library/asyncio.html?utm_source=chatgpt.com \"asyncio — Asynchronous I/O\"))\n\nПример конкурентности через `asyncio`:\n\n```python\nimport asyncio\n\n\nasync def download_file(name: str):\n    print(f\"start {name}\")\n    await asyncio.sleep(2)  # имитация ожидания сети\n    print(f\"finish {name}\")\n\n\nasync def main():\n    await asyncio.gather(\n        download_file(\"file1\"),\n        download_file(\"file2\"),\n        download_file(\"file3\"),\n    )\n\n\nasyncio.run(main())\n```\n\nЗдесь задачи не обязательно выполняются физически одновременно. Они переключаются в моменты ожидания.\n\n### Параллельность в Python\n\nДля настоящей параллельности в Python часто используют процессы:\n\n```python\nfrom concurrent.futures import ProcessPoolExecutor\n\n\ndef heavy_calculation(n: int):\n    return sum(i * i for i in range(n))\n\n\nif __name__ == \"__main__\":\n    with ProcessPoolExecutor() as executor:\n        results = executor.map(heavy_calculation, [10_000_000, 10_000_000, 10_000_000])\n\n    print(list(results))\n```\n\n`concurrent.futures` поддерживает запуск задач через потоки, процессы и интерпретаторы; `ProcessPoolExecutor` использует отдельные процессы, поэтому CPU-bound задачи могут реально выполняться параллельно на разных ядрах. \n\n### Важный момент про GIL\n\nВ обычном CPython с включённым GIL несколько потоков не выполняют Python-байткод одновременно на разных ядрах. GIL ограничивает одновременное выполнение Python-кода потоками, хотя потоки всё равно полезны для I/O-задач. \n\nПоэтому:\n\n```text\nI/O-bound задачи:\nasyncio / threads часто подходят\n\nCPU-bound задачи:\nprocesses / multiprocessing / ProcessPoolExecutor чаще подходят\n```\n\n### CPU-bound и I/O-bound\n\nCPU-bound — задача грузит процессор:\n\n```text\nматематика\nсжатие данных\nобработка изображений\nпарсинг большого объёма данных\n```\n\nДля них нужна параллельность.\n\nI/O-bound — задача ждёт внешние ресурсы:\n\n```text\nзапрос в БД\nHTTP-запрос\nчтение файла\nответ от API\n```\n\nДля них часто достаточно конкурентности.\n\n### Итог\n\n```text\nКонкурентность = уметь работать с несколькими задачами в один период времени.\n\nПараллельность = реально выполнять несколько задач одновременно.\n```\n\nВ Python:\n\n```text\nasyncio       → конкурентность\nthreading     → конкурентность, хорошо для I/O\nmultiprocessing / ProcessPoolExecutor → параллельность\n```"
  popularity = 5.26

[[questions]]
  id = 3
  question = "Чем отличаются асинхронность, многопоточность и многопроцессность?"
  answer = "**Асинхронность**, **многопоточность** и **многопроцессность** — это разные способы организовать **конкурентность**, то есть выполнение нескольких задач в один период времени.\n\n```text\nКонкурентность\n├── Асинхронность\n├── Многопоточность\n└── Многопроцессность\n```\n\nВажно: правильнее говорить **многопроцессность**, если речь про `multiprocessing`.  \n**Многопроцессорность** — это скорее про железо: несколько процессоров/ядер.\n\n---\n\n### 1. Асинхронность\n\n**Асинхронность** — это когда один поток выполнения переключается между задачами в моменты ожидания.\n\nНапример:\n\n```text\nЗадача A делает HTTP-запрос и ждёт ответ\n↓\nПока A ждёт, программа выполняет задачу B\n↓\nПотом возвращается к A\n```\n\nВ Python это обычно:\n\n```python\nasync def func():\n    await something()\n```\n\n`asyncio` в официальной документации Python описан как библиотека для написания конкурентного кода через `async/await`; он часто используется в сетевых серверах, клиентах, библиотеках для БД и других I/O-задачах. \n\nПример:\n\n```python\nimport asyncio\n\n\nasync def request(name: str):\n    print(f\"start {name}\")\n    await asyncio.sleep(2)  # имитация ожидания сети\n    print(f\"finish {name}\")\n\n\nasync def main():\n    await asyncio.gather(\n        request(\"A\"),\n        request(\"B\"),\n        request(\"C\"),\n    )\n\n\nasyncio.run(main())\n```\n\nЗдесь задачи не выполняют Python-код одновременно. Они **кооперативно уступают управление** через `await`.\n\n```text\nАсинхронность:\nодин поток\nодин event loop\nмного задач\nпереключение в await\n```\n\nХорошо подходит для:\n\n```text\nHTTP-запросов\nзапросов в БД\nWebSocket\nсетевых сервисов\nочередей\nожидания файлов/сокетов\n```\n\nПлохо подходит для тяжёлых CPU-вычислений, потому что одна тяжёлая функция может заблокировать event loop.\n\n---\n\n### 2. Многопоточность\n\n**Многопоточность** — это когда внутри одного процесса создаётся несколько потоков.\n\n```text\nОдин процесс\n├── Thread 1\n├── Thread 2\n└── Thread 3\n```\n\nПотоки имеют общую память процесса:\n\n```python\nimport threading\n\n\ndef worker():\n    print(\"work\")\n\n\nt1 = threading.Thread(target=worker)\nt2 = threading.Thread(target=worker)\n\nt1.start()\nt2.start()\n\nt1.join()\nt2.join()\n```\n\nВ Python модуль `threading` используется для потокового выполнения, но в обычном CPython с GIL только один поток за раз выполняет Python-байткод, поэтому прирост на CPU-bound задачах ограничен. \n\nТо есть потоки полезны, когда задача часто ждёт:\n\n```text\nпоток 1 ждёт ответ от сети\nпоток 2 в это время может работать\nпоток 3 ждёт файл\n```\n\nНо для тяжёлой математики:\n\n```text\nThread 1 считает\nThread 2 считает\nThread 3 считает\n```\n\nв обычном CPython это часто не даёт настоящего ускорения из-за GIL.\n\n```text\nМногопоточность:\nодин процесс\nнесколько потоков\nобщая память\nпереключение потоков делает ОС\nв CPython GIL мешает CPU-параллелизму\n```\n\nХорошо подходит для:\n\n```text\nблокирующего I/O\nработы с библиотеками без async API\nфоновых задач\nпростого параллельного ожидания\n```\n\nПлохо подходит для:\n\n```text\nтяжёлых CPU-вычислений в чистом Python\n```\n\n---\n\n### 3. Многопроцессность\n\n**Многопроцессность** — это когда создаётся несколько отдельных процессов.\n\n```text\nProcess 1\nProcess 2\nProcess 3\n```\n\nУ каждого процесса своя память и свой интерпретатор Python.\n\n```python\nfrom multiprocessing import Process\n\n\ndef worker():\n    print(\"work\")\n\n\nif __name__ == \"__main__\":\n    p1 = Process(target=worker)\n    p2 = Process(target=worker)\n\n    p1.start()\n    p2.start()\n\n    p1.join()\n    p2.join()\n```\n\n`multiprocessing` использует подпроцессы вместо потоков и тем самым обходит GIL, позволяя задействовать несколько процессоров/ядер. \n\nПоэтому для CPU-bound задач обычно лучше:\n\n```python\nfrom concurrent.futures import ProcessPoolExecutor\n\n\ndef heavy(n: int) -> int:\n    return sum(i * i for i in range(n))\n\n\nif __name__ == \"__main__\":\n    with ProcessPoolExecutor() as executor:\n        results = executor.map(heavy, [10_000_000, 10_000_000, 10_000_000])\n\n    print(list(results))\n```\n\n`concurrent.futures` даёт единый интерфейс для асинхронного запуска задач через потоки, процессы или интерпретаторы: `ThreadPoolExecutor`, `ProcessPoolExecutor`, `InterpreterPoolExecutor`. \n\n```text\nМногопроцессность:\nнесколько процессов\nпамять изолирована\nGIL не мешает между процессами\nесть реальный CPU-параллелизм\nобмен данными дороже\n```\n\nХорошо подходит для:\n\n```text\nматематики\nобработки изображений\nсжатия данных\nпарсинга больших объёмов\nML/аналитики\nCPU-bound задач\n```\n\nМинусы:\n\n```text\nпроцессы тяжелее потоков\nданные нужно передавать между процессами\nсложнее общий state\nбольше расход памяти\n```\n\n---\n\n### Главное отличие\n\n|Подход|Что создаётся|Память|Реальный параллелизм в обычном CPython|Лучше для|\n|---|--:|--:|--:|---|\n|Асинхронность|задачи/coroutines|общая|нет, обычно один поток|I/O-bound|\n|Многопоточность|потоки|общая|ограничен GIL для Python-кода|I/O-bound|\n|Многопроцессность|процессы|раздельная|да|CPU-bound|\n\n---\n\n### CPU-bound и I/O-bound\n\n**CPU-bound** — задача упирается в процессор:\n\n```text\nсчитать хэши\nобрабатывать изображения\nсжимать видео\nделать тяжёлые вычисления\nпарсить огромный JSON\n```\n\nДля этого обычно нужна **многопроцессность**.\n\n**I/O-bound** — задача в основном ждёт внешний ресурс:\n\n```text\nзапрос в БД\nHTTP-запрос\nчтение файла\nответ от API\nсообщение из очереди\n```\n\nДля этого обычно хватает **асинхронности** или **потоков**.\n\n---\n\n### Схема выбора\n\n```text\nМного сетевого ожидания?\n↓\nasyncio или threads\n\nТяжёлые вычисления на CPU?\n↓\nmultiprocessing / ProcessPoolExecutor\n\nЕсть async-библиотеки?\n↓\nasyncio\n\nБиблиотека блокирующая и async API нет?\n↓\nThreadPoolExecutor / threading\n\nНужно использовать несколько ядер CPU?\n↓\nmultiprocessing / ProcessPoolExecutor\n```\n\n### Итог\n\n```text\nАсинхронность — много задач в одном потоке, переключение через await.\n\nМногопоточность — много потоков в одном процессе, общая память, удобно для I/O.\n\nМногопроцессность — много процессов, отдельная память, хорошо для CPU и настоящего параллелизма.\n```\n\nВ Python чаще всего:\n\n```text\nasyncio              → конкурентность для I/O\nthreading           → конкурентность для I/O\nmultiprocessing     → параллельность для CPU\nProcessPoolExecutor → удобная обёртка над процессами\nThreadPoolExecutor  → удобная обёртка над потоками\n```"
  popularity = 15.79

