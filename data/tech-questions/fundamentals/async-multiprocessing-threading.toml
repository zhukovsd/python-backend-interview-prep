  question = "Что такое многопроцессорность, процесс и зачем нужен multiprocessing"
  answer = "`multiprocessing` нужен, чтобы запускать код Python в нескольких отдельных процессах, а не в нескольких потоках.\n\nГлавная причина: в обычном CPython есть GIL, из-за которого несколько потоков не могут одновременно выполнять Python-байткод в одном процессе. `multiprocessing` обходит это ограничение, потому что каждый процесс имеет свой интерпретатор Python и свой GIL. Официальная документация Python прямо описывает `multiprocessing` как process-based parallelism и указывает, что он использует subprocesses вместо threads, позволяя задействовать несколько процессоров/ядер. \n\n### Что такое многопроцессорность\n\nСтрого говоря, есть два похожих термина:\n\n```text\nМногопроцессорность / multicore / multiprocessor\n= несколько CPU или ядер могут выполнять работу параллельно\n\nМногопроцессность / multiprocessing\n= программа запускает несколько отдельных процессов\n```\n\nВ Python, когда говорят про `multiprocessing`, обычно имеют в виду именно многопроцессность:\n\n```text\nодна программа\n ├── процесс 1\n ├── процесс 2\n ├── процесс 3\n └── процесс 4\n```\n\nЭти процессы операционная система может распределить по разным ядрам CPU.\n\n### Что такое процесс\n\nПроцесс — это отдельный экземпляр выполняемой программы.\n\nУ процесса есть:\n\n```text\nсвоё адресное пространство памяти\nсвои переменные\nсвой Python-интерпретатор\nсвой GIL\nсвои ресурсы ОС\nодин или несколько потоков внутри\n```\n\nПример:\n\n```text\npython main.py\n```\n\nКогда ты запускаешь этот файл, ОС создаёт процесс Python.\n\nУпрощённо:\n\n```text\nProcess\n ├── память процесса\n ├── глобальные переменные\n ├── открытые файлы/сокеты\n ├── Python-интерпретатор\n └── main thread\n```\n\nПоток — это более мелкая единица выполнения внутри процесса. Документация Python описывает `threading` как способ запускать несколько потоков, то есть smaller units of a process, внутри одного процесса.\n\n### Что делает `multiprocessing`\n\nМодуль `multiprocessing` позволяет из Python-кода создавать и управлять отдельными процессами.\n\nПример:\n\n```python\nfrom multiprocessing import Process\n\ndef work():\n    print(\"Работаю в отдельном процессе\")\n\nif __name__ == \"__main__\":\n    p = Process(target=work)\n    p.start()\n    p.join()\n```\n\nЧто здесь происходит:\n\n```text\nmain process\n └── создаёт child process\n      └── child process выполняет work()\n```\n\n`p.start()` запускает новый процесс.  \n`p.join()` заставляет главный процесс дождаться завершения дочернего процесса.\n\n### Зачем нужен `multiprocessing`\n\nГлавная задача `multiprocessing` — выполнять CPU-bound задачи параллельно.\n\nCPU-bound — это задачи, которые сильно грузят процессор:\n\n```text\nматематические вычисления\nобработка больших файлов\nобработка изображений\nсжатие данных\nкриптографические вычисления\nтяжёлый парсинг\nрасчёты\n```\n\nПример CPU-bound задачи:\n\n```python\ndef calc(n):\n    total = 0\n\n    for i in range(n):\n        total += i * i\n\n    return total\n```\n\nДля такой задачи `threading` в обычном CPython обычно не даст нормального ускорения, потому что потоки будут конкурировать за GIL.\n\n```text\nОдин процесс + несколько потоков:\n\nProcess\n ├── Thread 1 ждёт GIL\n ├── Thread 2 выполняет Python-код\n ├── Thread 3 ждёт GIL\n └── Thread 4 ждёт GIL\n```\n\nА `multiprocessing` создаёт несколько процессов:\n\n```text\nProcess 1 → CPU core 1\nProcess 2 → CPU core 2\nProcess 3 → CPU core 3\nProcess 4 → CPU core 4\n```\n\nПоэтому процессы могут реально выполнять Python-код параллельно на разных ядрах.\n\n### Почему не всегда использовать `multiprocessing`\n\nПотому что процессы тяжелее потоков.\n\nМинусы:\n\n```text\nпроцессы занимают больше RAM\nпроцесс создать дороже, чем поток\nданные между процессами передавать сложнее\nобычные Python-объекты не разделяются напрямую\nчасто нужна сериализация через pickle\n```\n\nДокументация `ProcessPoolExecutor` отдельно указывает, что он использует `multiprocessing`, обходит GIL, но требует, чтобы вызываемые объекты и возвращаемые значения были picklable. \n### Почему у процессов отдельная память\n\nПри `threading` потоки живут внутри одного процесса и видят общие объекты:\n\n```text\nProcess\n ├── Thread 1\n ├── Thread 2\n └── shared memory\n```\n\nПри `multiprocessing` каждый процесс изолирован:\n\n```text\nProcess 1 → memory 1\nProcess 2 → memory 2\nProcess 3 → memory 3\n```\n\nПоэтому такой код не работает так, как может показаться:\n\n```python\nfrom multiprocessing import Process\n\ncounter = 0\n\ndef increment():\n    global counter\n    counter += 1\n\nif __name__ == \"__main__\":\n    p1 = Process(target=increment)\n    p2 = Process(target=increment)\n\n    p1.start()\n    p2.start()\n\n    p1.join()\n    p2.join()\n\n    print(counter)\n```\n\n`counter` в главном процессе останется `0`, потому что дочерние процессы меняли свои копии переменной, а не оригинальную переменную главного процесса.\n\n### Как процессы обмениваются данными\n\nДля обмена данными используют специальные механизмы:\n\n```text\nQueue\nPipe\nManager\nValue / Array\nshared_memory\n```\n\nПример с `Queue`:\n\n```python\nfrom multiprocessing import Process, Queue\n\ndef worker(q):\n    result = 10 + 20\n    q.put(result)\n\nif __name__ == \"__main__\":\n    q = Queue()\n\n    p = Process(target=worker, args=(q,))\n    p.start()\n    p.join()\n\n    result = q.get()\n    print(result)\n```\n\nЗдесь дочерний процесс не меняет переменную главного процесса напрямую. Он кладёт результат в очередь.\n\n### `Pool` и `ProcessPoolExecutor`\n\nОбычно вручную создавать `Process` нужно не всегда. Часто удобнее использовать пул процессов.\n\nЧерез `multiprocessing.Pool`:\n\n```python\nfrom multiprocessing import Pool\n\ndef calc(n):\n    return sum(i * i for i in range(n))\n\nif __name__ == \"__main__\":\n    with Pool(processes=4) as pool:\n        results = pool.map(calc, [10_000_000, 10_000_000, 10_000_000, 10_000_000])\n\n    print(results)\n```\n\nЧерез `concurrent.futures.ProcessPoolExecutor`:\n\n```python\nfrom concurrent.futures import ProcessPoolExecutor\n\ndef calc(n):\n    return sum(i * i for i in range(n))\n\nif __name__ == \"__main__\":\n    with ProcessPoolExecutor(max_workers=4) as executor:\n        results = list(executor.map(calc, [10_000_000] * 4))\n\n    print(results)\n```\n\n`ProcessPoolExecutor` — более высокоуровневый интерфейс для запуска задач в пуле процессов. Документация Python описывает его как executor, который использует пул процессов для асинхронного выполнения вызовов. \n\n### Когда использовать `multiprocessing`\n\nИспользуй `multiprocessing`, когда:\n\n```text\nзадача CPU-bound\nнужно задействовать несколько ядер CPU\nвычисления тяжёлые\nпотоки не дают ускорения из-за GIL\nданные между задачами можно передавать относительно редко\n```\n\nПримеры:\n\n```text\nобработать 10 000 изображений\nпосчитать тяжёлую математику\nраспарсить большой объём данных\nзапустить независимые CPU-задачи\nобработать файлы параллельно\n```\n\n### Когда лучше не использовать `multiprocessing`\n\nНе лучший выбор, когда задача I/O-bound:\n\n```text\nHTTP-запросы\nзапросы в БД\nожидание Redis\nчтение файлов\nсетевые операции\n```\n\nДля такого чаще подходят:\n\n```text\nthreading\nThreadPoolExecutor\nasyncio\n```\n\nОфициальная документация Python по конкурентному выполнению указывает, что выбор инструмента зависит от типа задачи: CPU-bound или I/O-bound. \n\n### Итог\n\n```text\nПроцесс\n= отдельный запущенный экземпляр программы со своей памятью\n\nМногопроцессность\n= запуск нескольких процессов\n\nМногопроцессорность\n= возможность использовать несколько CPU/ядер\n\nmultiprocessing\n= Python-модуль для запуска нескольких процессов\n```\n\nГлавная польза `multiprocessing`:\n\n```text\nобойти GIL\nзагрузить несколько ядер CPU\nускорить CPU-bound задачи\nизолировать выполнение по процессам\n```\n\nГлавная цена:\n\n```text\nбольше памяти\nдороже запуск\nсложнее обмен данными\nнужна сериализация объектов\n```"
  popularity = 5.26

