  question = "Как реализована модель асинхронного выполнения?"
  answer = "Асинхронное выполнение в Python обычно реализуется через `asyncio`: это модель конкурентного выполнения, где один поток может обслуживать много задач, переключаясь между ними в моменты ожидания I/O, например сети, БД, файловых операций через async-библиотеки. `asyncio` описывается в документации как библиотека для конкурентного кода с синтаксисом `async` / `await`. \n\nГлавная идея:\n\n```text\nОдна задача ждёт I/O\n↓\nона отдаёт управление event loop\n↓\nevent loop запускает другую готовую задачу\n↓\nкогда I/O завершилось, первая задача продолжается\n```\n\nЭто не означает, что Python-код внутри одного event loop выполняется параллельно на нескольких ядрах. Это кооперативная многозадачность: задача сама отдаёт управление через `await`.\n\n### Основные компоненты\n\n#### 1. Coroutine\n\nКорутина — это объект, который получается при вызове `async def` функции:\n\n```python\nasync def get_data():\n    return 123\n\ncoro = get_data()\n```\n\nВажный момент: сам вызов `get_data()` ещё не выполняет тело функции. Корутина начнёт выполняться только когда её `await`-нут или запланируют как задачу. В документации Python прямо указано, что корутины и задачи могут выполняться только при работающем event loop. \n\n```python\nresult = await get_data()\n```\n\n#### 2. Event loop\n\n`event loop` — центральный механизм `asyncio`. Он запускает асинхронные задачи, callback-функции, выполняет сетевой I/O и работает с подпроцессами. \n\nУпрощённо:\n\n```text\nevent loop:\n  1. берёт готовую задачу\n  2. выполняет её до ближайшего await\n  3. если задача ждёт I/O — откладывает её\n  4. запускает другую готовую задачу\n  5. возвращается к первой, когда её ожидание завершилось\n```\n\n#### 3. Task\n\n`Task` — это обёртка над корутиной, которая позволяет запланировать её выполнение в event loop. Например, `asyncio.create_task()` запускает корутину конкурентно с другими задачами. \n\n```python\ntask = asyncio.create_task(get_data())\n```\n\nТо есть:\n\n```text\ncoroutine\n↓ оборачивается в Task\nTask попадает в event loop\n↓\nevent loop решает, когда продолжить её выполнение\n```\n\n#### 4. Future\n\n`Future` — объект, который представляет будущий результат асинхронной операции. Корутина может ждать `Future`, пока в нём не появится результат, исключение или отмена. \n\nПримерно:\n\n```text\nFuture = \"результат ещё не готов, но будет позже\"\n```\n\nКогда результат готов, event loop возобновляет задачу, которая ждала этот `Future`.\n\n### Что делает `await`\n\n`await` — это точка добровольной остановки корутины.\n\n```python\nasync def main():\n    data = await fetch_data()\n    print(data)\n```\n\nКогда выполнение доходит до `await fetch_data()`:\n\n```text\nmain() временно приостанавливается\n↓\nуправление возвращается event loop\n↓\nevent loop запускает другие задачи\n↓\nfetch_data() завершилась\n↓\nmain() продолжается с места await\n```\n\nВажно: `await` не создаёт новый поток. Он только говорит:  \n«я сейчас жду, можешь пока выполнять другие задачи».\n\n### Пример\n\n```python\nimport asyncio\n\n\nasync def task(name, delay):\n    print(f\"{name}: start\")\n    await asyncio.sleep(delay)\n    print(f\"{name}: end\")\n\n\nasync def main():\n    t1 = asyncio.create_task(task(\"A\", 2))\n    t2 = asyncio.create_task(task(\"B\", 1))\n\n    await t1\n    await t2\n\n\nasyncio.run(main())\n```\n\nВыполнение будет примерно таким:\n\n```text\nA: start\nB: start\nB: end\nA: end\n```\n\nПочему?\n\n```text\ntask A дошла до await sleep(2)\n↓\nотдала управление event loop\n\ntask B дошла до await sleep(1)\n↓\nотдала управление event loop\n\nчерез 1 секунду B готова\n↓\nevent loop продолжает B\n\nчерез 2 секунды A готова\n↓\nevent loop продолжает A\n```\n\n### Важная деталь: внутри event loop задача выполняется одна за раз\n\nОбычно event loop работает в одном потоке. Документация Python указывает, что event loop выполняет callback-и и Tasks в своём потоке; пока одна Task выполняется, другие Tasks в этом же loop не выполняются. \n\nТо есть асинхронность в Python — это не так:\n\n```text\nTask A реально выполняется на CPU\nTask B реально выполняется на CPU\nTask C реально выполняется на CPU\n```\n\nА так:\n\n```text\nTask A выполняется до await\nTask B выполняется до await\nTask C выполняется до await\nTask A продолжает после I/O\nTask B продолжает после I/O\n```\n\n### Почему это эффективно для I/O-bound задач\n\nАсинхронность полезна, когда программа много ждёт:\n\n```text\nзапрос в БД\nHTTP-запрос\nчтение из сокета\nожидание Redis\nожидание ответа внешнего API\n```\n\nВ синхронной модели поток часто простаивает:\n\n```text\nотправил запрос → ждёт ответ → ничего не делает\n```\n\nВ асинхронной модели:\n\n```text\nотправил запрос → переключился на другую задачу → вернулся, когда ответ готов\n```\n\nПоэтому `asyncio` часто используется как основа для сетевых серверов, асинхронных web-фреймворков, клиентов БД и очередей. Это также указано в официальной документации Python. \n\n### Почему это плохо для CPU-bound задач\n\nЕсли задача долго считает на CPU и не делает `await`, она блокирует event loop:\n\n```python\nasync def bad():\n    while True:\n        pass\n```\n\nПока такой код крутится, другие async-задачи не получают управление.\n\nПлохой вариант:\n\n```python\nasync def handler():\n    result = heavy_calculation()  # долго считает CPU\n    return result\n```\n\nЛучше:\n\n```python\nresult = await asyncio.to_thread(heavy_calculation)\n```\n\nили использовать multiprocessing, если задача реально CPU-bound и нужно задействовать несколько ядер.\n\n### Общая схема\n\n```text\nasync def\n   ↓\ncoroutine object\n   ↓\nawait / create_task()\n   ↓\nTask\n   ↓\nevent loop\n   ↓\nвыполнение до await\n   ↓\nожидание Future / I/O\n   ↓\nдругая Task выполняется\n   ↓\nI/O завершилось\n   ↓\nпервая Task продолжается\n```\n\n### Коротко по сути\n\nАсинхронная модель выполнения в Python устроена так:\n\n```text\n1. async def создаёт корутину\n2. корутина запускается через await или Task\n3. event loop управляет задачами\n4. await приостанавливает текущую задачу\n5. пока одна задача ждёт I/O, выполняются другие\n6. после завершения ожидания задача продолжается\n```\n\nГлавное отличие от потоков: переключение происходит не принудительно ОС, а в контролируемых местах — на `await`. Поэтому это кооперативная конкурентность, а не автоматический параллелизм."
