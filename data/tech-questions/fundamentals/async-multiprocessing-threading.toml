  id = 32
  question = "Что такое Race condition (состояние гонки)?"
  answer = "### Что такое Race condition\n\n`Race condition` — это ошибка конкурентного выполнения, когда результат программы зависит от того, в каком порядке несколько потоков, процессов или async-задач получили доступ к общему ресурсу.\n\nПроще:\n\n```text\nЕсть общий ресурс\n↓\nНесколько исполнителей меняют его одновременно\n↓\nПорядок выполнения непредсказуем\n↓\nРезультат может стать неправильным\n```\n\nКлассическое определение: состояние гонки возникает, когда поведение системы зависит от порядка или времени неконтролируемых событий, и из-за этого возможен неожиданный или неправильный результат. \n\n---\n\n### Простой пример\n\nДопустим, есть общий счётчик:\n\n```python\ncounter = 0\n```\n\nДва потока одновременно делают:\n\n```python\ncounter += 1\n```\n\nКажется, что после двух операций должно быть:\n\n```python\ncounter == 2\n```\n\nНо фактически может получиться:\n\n```python\ncounter == 1\n```\n\nПочему? Потому что `counter += 1` — это не одна атомарная операция.\n\nУпрощённо она состоит из нескольких шагов:\n\n```text\n1. Прочитать counter\n2. Прибавить 1\n3. Записать новое значение обратно\n```\n\n---\n\n### Как возникает ошибка\n\n```text\ncounter = 0\n\nПоток A читает counter → 0\nПоток B читает counter → 0\n\nПоток A считает 0 + 1 → 1\nПоток B считает 0 + 1 → 1\n\nПоток A записывает counter = 1\nПоток B записывает counter = 1\n\nИтог: counter = 1, хотя ожидали 2\n```\n\nЭто и есть состояние гонки.\n\n---\n\n### Почему это называется “гонка”\n\nПотому что несколько исполнителей как будто “соревнуются”, кто первым успеет:\n\n```text\nпервым прочитать данные\nпервым изменить данные\nпервым записать результат\n```\n\nЕсли результат зависит от этого порядка — есть риск race condition.\n\n---\n\n### Где бывает Race condition\n\nRace condition может быть не только в потоках.\n\nОна бывает в:\n\n```text\nмногопоточности\nмногопроцессности\nасинхронном коде\nработе с БД\nфайловой системе\nкэше\nочередях\nраспределённых системах\n```\n\nНапример:\n\n```text\nдва запроса одновременно списывают деньги\nдва worker'а одновременно обрабатывают одну задачу\nдва пользователя одновременно меняют один документ\nдве async-задачи одновременно обновляют общий список\n```\n\n---\n\n### Race condition в asyncio\n\nВ `asyncio` нет настоящего параллельного выполнения Python-кода внутри одного event loop, но race condition всё равно возможна.\n\nПричина — переключение между задачами на `await`.\n\n```python\nimport asyncio\n\ncounter = 0\n\n\nasync def increment():\n    global counter\n\n    value = counter\n    await asyncio.sleep(0)  # здесь задача отдаёт управление\n    counter = value + 1\n\n\nasync def main():\n    await asyncio.gather(\n        increment(),\n        increment(),\n    )\n\n    print(counter)\n\n\nasyncio.run(main())\n```\n\nОжидаем:\n\n```text\n2\n```\n\nНо можно получить:\n\n```text\n1\n```\n\nПочему:\n\n```text\nTask A читает counter = 0\nTask A доходит до await и отдаёт управление\n\nTask B читает counter = 0\nTask B доходит до await и отдаёт управление\n\nTask A записывает counter = 1\nTask B записывает counter = 1\n```\n\nВ документации `asyncio.Lock` прямо указано, что lock используется для гарантии эксклюзивного доступа к общему ресурсу. \n\n---\n\n### Как исправить в asyncio\n\nИспользовать `asyncio.Lock`.\n\n```python\nimport asyncio\n\ncounter = 0\nlock = asyncio.Lock()\n\n\nasync def increment():\n    global counter\n\n    async with lock:\n        value = counter\n        await asyncio.sleep(0)\n        counter = value + 1\n\n\nasync def main():\n    await asyncio.gather(\n        increment(),\n        increment(),\n    )\n\n    print(counter)\n\n\nasyncio.run(main())\n```\n\nТеперь критическая секция защищена:\n\n```text\nasync with lock:\n    только одна task может менять counter\n```\n\n---\n\n### Race condition в threading\n\nДля потоков используется `threading.Lock`.\n\n```python\nimport threading\n\ncounter = 0\nlock = threading.Lock()\n\n\ndef increment():\n    global counter\n\n    with lock:\n        value = counter\n        counter = value + 1\n```\n\n`threading.Lock` имеет состояния `locked` и `unlocked`, а методы `acquire()` и `release()` используются для захвата и освобождения блокировки. \n\n---\n\n### Критическая секция\n\nКритическая секция — это участок кода, где происходит доступ к общему изменяемому состоянию.\n\n```python\nwith lock:\n    counter += 1\n```\n\nЗдесь критическая секция:\n\n```text\nпрочитать counter\nизменить counter\nзаписать counter обратно\n```\n\nГлавное правило:\n\n```text\nОбщий изменяемый ресурс\n+ конкурентный доступ\n+ нет синхронизации\n= риск race condition\n```\n\n---\n\n### Как предотвращают Race condition\n\nОсновные способы:\n\n```text\n1. Lock / mutex\n2. Semaphore\n3. Queue\n4. Транзакции в БД\n5. Атомарные операции\n6. Избегание общего изменяемого состояния\n7. Immutable-структуры\n8. Actor model / message passing\n```\n\nВ Python для потоков есть `Lock`, `RLock`, `Semaphore`, `Event`, `Condition` и другие примитивы синхронизации в модуле `threading`. \n\n---\n\n### Race condition vs Deadlock\n\nЭто разные проблемы.\n\n|Проблема|Суть|\n|---|---|\n|Race condition|Несколько исполнителей одновременно меняют общий ресурс, и результат зависит от порядка выполнения|\n|Deadlock|Исполнители заблокировали друг друга и никто не может продолжить работу|\n\nПример race condition:\n\n```text\nдва потока одновременно увеличили counter\nи потеряли одно обновление\n```\n\nПример deadlock:\n\n```text\nПоток A держит lock_1 и ждёт lock_2\nПоток B держит lock_2 и ждёт lock_1\n```\n\n---\n\n### Итог\n\n`Race condition` — это ситуация, когда несколько потоков, процессов или async-задач работают с одним общим ресурсом, а итог зависит от случайного порядка их выполнения.\n\nКороткая формула:\n\n```text\nRace condition =\nshared mutable state\n+ concurrent access\n+ no proper synchronization\n```\n\nВ Python она может быть и в `threading`, и в `multiprocessing`, и в `asyncio`. GIL не отменяет race condition, потому что логическая операция вроде `counter += 1` всё равно может состоять из нескольких шагов и требовать синхронизации."
  popularity = 2.63

