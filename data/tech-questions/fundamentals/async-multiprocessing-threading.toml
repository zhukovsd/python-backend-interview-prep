  question = "Что такое и чем отличается вытесняющая многозадачность от кооперативной?"
  answer = "Вытесняющая и кооперативная многозадачность отличаются тем, кто решает, когда одна задача должна уступить выполнение другой.\n\n```text\nВытесняющая многозадачность\n= задачу может остановить планировщик ОС/рантайма\n\nКооперативная многозадачность\n= задача сама добровольно отдаёт управление\n```\n\n### Вытесняющая многозадачность\n\nВытесняющая многозадачность — это когда планировщик может прервать выполняющуюся задачу без её согласия.\n\nНапример:\n\n```text\nThread 1 работает\n↓\nОС решает: \"хватит, теперь работает Thread 2\"\n↓\nThread 2 работает\n↓\nОС снова переключает выполнение\n```\n\nТо есть задача не обязана сама писать:\n\n```python\nyield_control()\n```\n\nЕё могут остановить извне.\n\nОбычно так работают потоки ОС:\n\n```text\nProcess\n ├── Thread 1\n ├── Thread 2\n └── Thread 3\n```\n\nОперационная система выдаёт каждому потоку немного CPU-времени. Когда квант времени закончился или появилась более приоритетная задача, планировщик может переключить CPU на другой поток. В документации Linux это описывается как preemption: задача может быть вытеснена, когда планировщик считает, что она уже использовала свою долю CPU-времени. \n\n### Пример вытесняющей многозадачности\n\n```python\nimport threading\n\ndef task(name):\n    for i in range(5):\n        print(name, i)\n\nt1 = threading.Thread(target=task, args=(\"A\",))\nt2 = threading.Thread(target=task, args=(\"B\",))\n\nt1.start()\nt2.start()\n\nt1.join()\nt2.join()\n```\n\nТы не указываешь вручную, где именно поток `A` должен уступить место потоку `B`.\n\nПереключение происходит неявно:\n\n```text\nA 0\nA 1\nB 0\nA 2\nB 1\nB 2\n...\n```\n\nПорядок может быть разным при разных запусках.\n\n### Главный плюс вытесняющей модели\n\nПлюс в том, что одна задача не обязана быть “вежливой”.\n\nДаже если поток выполняет долгий цикл:\n\n```python\nwhile True:\n    do_work()\n```\n\nОС всё равно может переключить CPU на другие потоки или процессы.\n\nТо есть система остаётся более отзывчивой.\n\n### Главный минус вытесняющей модели\n\nМинус — задача может быть прервана почти в любой момент.\n\nНапример:\n\n```python\ncounter += 1\n```\n\nНа уровне реального выполнения это не обязательно одна атомарная операция:\n\n```text\nпрочитать counter\nувеличить значение\nзаписать обратно\n```\n\nЕсли поток прервали между этими шагами, другой поток может изменить те же данные. Поэтому в вытесняющей модели часто нужны блокировки:\n\n```python\nimport threading\n\nlock = threading.Lock()\ncounter = 0\n\ndef increment():\n    global counter\n\n    with lock:\n        counter += 1\n```\n\nИначе возможны race condition.\n\n### Кооперативная многозадачность\n\nКооперативная многозадачность — это когда задача сама решает, когда отдать управление.\n\nНапример:\n\n```text\nTask 1 работает\n↓\nTask 1 дошла до await\n↓\nevent loop запускает Task 2\n↓\nTask 2 дошла до await\n↓\nevent loop возвращается к Task 1\n```\n\nВ Python это типичная модель `asyncio`.\n\nОфициальная документация Python прямо говорит, что event loop использует cooperative scheduling: event loop выполняет одну `Task` за раз, а когда задача делает `await` и ждёт `Future`, event loop запускает другие задачи. \n\n### Пример кооперативной многозадачности\n\n```python\nimport asyncio\n\nasync def task(name):\n    for i in range(3):\n        print(name, i)\n        await asyncio.sleep(1)\n\nasync def main():\n    await asyncio.gather(\n        task(\"A\"),\n        task(\"B\"),\n    )\n\nasyncio.run(main())\n```\n\nЗдесь переключение происходит на `await`:\n\n```text\nA 0\nawait asyncio.sleep(1)\n↓\nB 0\nawait asyncio.sleep(1)\n↓\nA 1\n...\n```\n\n`await` — это место, где корутина добровольно отдаёт управление event loop.\n\n### Важный пример проблемы\n\n```python\nimport asyncio\n\nasync def bad_task():\n    while True:\n        pass\n\nasync def normal_task():\n    while True:\n        print(\"Я тоже хочу работать\")\n        await asyncio.sleep(1)\n\nasync def main():\n    await asyncio.gather(\n        bad_task(),\n        normal_task(),\n    )\n\nasyncio.run(main())\n```\n\n`normal_task()` почти не получит управление, потому что `bad_task()` никогда не делает `await`.\n\nВ кооперативной модели задача обязана сама уступать управление:\n\n```python\nasync def better_task():\n    while True:\n        # какая-то работа\n        await asyncio.sleep(0)\n```\n\n`await asyncio.sleep(0)` здесь означает: “отдай управление event loop, пусть другие задачи тоже выполнятся”.\n\n### Ключевое отличие\n\n```text\nВытесняющая:\nпланировщик может остановить задачу сам\n\nКооперативная:\nзадача должна сама уступить управление\n```\n\nСравнение:\n\n|Критерий|Вытесняющая|Кооперативная|\n|---|---|---|\n|Кто переключает задачи|ОС/планировщик|Сама задача через `await`/`yield`|\n|Можно ли остановить задачу без её согласия|Да|Обычно нет|\n|Пример в Python|`threading`|`asyncio`|\n|Риск race condition|Выше|Ниже внутри одного event loop|\n|Риск зависания всей системы задач|Ниже|Выше, если задача не отдаёт управление|\n|Подходит для|Потоки, процессы, ОС|Асинхронный I/O, корутины|\n|Контроль над точками переключения|Меньше|Больше|\n\n### Как это связано с `threading`\n\n`threading` в Python работает с потоками ОС. Потоки — это единицы выполнения внутри процесса. Документация Python описывает `threading` как модуль для запуска нескольких потоков внутри одного процесса. \n\nСхема:\n\n```text\nProcess\n ├── Thread 1\n ├── Thread 2\n └── Thread 3\n```\n\nПотоки могут быть переключены планировщиком в неожиданный момент:\n\n```text\nThread 1 начал менять общий список\n↓\nего вытеснили\n↓\nThread 2 тоже меняет этот список\n↓\nполучили некорректное состояние\n```\n\nПоэтому для общего состояния нужны синхронизация и осторожность.\n\n### Как это связано с `asyncio`\n\n`asyncio` работает иначе:\n\n```text\nEvent loop\n ├── Task 1\n ├── Task 2\n └── Task 3\n```\n\nНо event loop выполняет только одну задачу в конкретный момент времени:\n\n```text\nTask 1 работает до await\nTask 2 работает до await\nTask 3 работает до await\n```\n\nПоэтому в `asyncio` меньше неожиданных переключений между строками кода. Но есть другое правило: нельзя надолго занимать event loop синхронным кодом.\n\nПлохой вариант:\n\n```python\nasync def handler():\n    heavy_cpu_calculation()\n```\n\nЛучше:\n\n```python\nasync def handler():\n    result = await asyncio.to_thread(heavy_cpu_calculation)\n```\n\nИли для тяжёлых CPU-bound задач — вынести работу в процессы.\n\n### Простая аналогия\n\nВытесняющая модель:\n\n```text\nУчитель сам забирает слово у ученика и передаёт другому.\n```\n\nКооперативная модель:\n\n```text\nУченик сам должен сказать: \"Я закончил, пусть говорит другой\".\n```\n\nЕсли ученик в кооперативной модели никогда не замолчит, остальные не смогут говорить.\n\n### Главное для Python\n\n```text\nthreading\n= ближе к вытесняющей многозадачности\n\nasyncio\n= кооперативная многозадачность\n\nmultiprocessing\n= отдельные процессы, которые ОС тоже планирует вытесняюще\n```\n\n### Итог\n\nВытесняющая многозадачность удобна тем, что планировщик сам распределяет CPU между задачами, но из-за неожиданных переключений появляются race condition и нужны lock-и.\n\nКооперативная многозадачность удобна тем, что переключения происходят в понятных местах — обычно на `await`, но задача может заблокировать весь event loop, если долго работает без отдачи управления."
