  id = 15
  question = "Какая стандартная библиотека отвечает за асинхронность (async/await) и событийный цикл?"
  answer = "### Стандартная библиотека — `asyncio`\n\nЗа асинхронность в стиле `async/await` и событийный цикл в Python отвечает стандартный модуль:\n\n```python\nimport asyncio\n```\n\n`asyncio` предоставляет инфраструктуру для:\n\n```text\n- корутин\n- задач Task\n- Future\n- event loop\n- неблокирующего сетевого I/O\n- таймеров\n- async-примитивов синхронизации\n- запуска subprocess\n```\n\nОфициальная документация описывает `asyncio` как библиотеку для написания конкурентного кода с помощью синтаксиса `async/await`. Также в ней есть низкоуровневые API для создания и управления event loop. \n\n---\n\n### Минимальный пример\n\n```python\nimport asyncio\n\nasync def main():\n    print(\"start\")\n    await asyncio.sleep(1)\n    print(\"end\")\n\nasyncio.run(main())\n```\n\nЧто здесь происходит:\n\n```text\nasync def main()\n→ создаёт coroutine function\n\nmain()\n→ создаёт coroutine object\n\nasyncio.run(main())\n→ создаёт event loop\n→ запускает корутину\n→ закрывает event loop после завершения\n```\n\n`asyncio.run()` — основной высокоуровневый способ запустить async-программу. В документации указано, что он создаёт event loop, запускает корутину и закрывает цикл после выполнения. \n\n---\n\n### Важно разделять\n\n```text\nasync/await\n→ синтаксис языка Python\n\nasyncio\n→ стандартная библиотека для работы с этим синтаксисом\n\nevent loop\n→ механизм, который планирует и выполняет async-задачи\n```\n\nСам `async def` — это часть синтаксиса Python. Функции, объявленные через `async def`, всегда являются coroutine functions. \n\nА `asyncio` — библиотека, которая умеет эти корутины запускать, планировать, превращать в `Task`, ждать `Future`, обслуживать сетевой I/O и управлять событийным циклом."
  popularity = 2.63

[[questions]]
  id = 16
  question = "Какие ключевые особенности asyncio как модели конкурентности (event loop, корутины, задачи)?"
  answer = "### `asyncio` как модель конкурентности\n\n`asyncio` — это модель **кооперативной конкурентности**: несколько задач могут продвигаться “как будто одновременно”, но в рамках одного event loop в один момент времени выполняется только одна задача Python-кода. Переключение происходит не принудительно, как у потоков ОС, а в местах, где корутина сама отдаёт управление через `await`. Официальная документация описывает `asyncio` как библиотеку для конкурентного кода с использованием `async/await`. \n\n```text\nasyncio\n├── event loop\n├── coroutine\n├── Task\n├── Future\n├── await\n└── неблокирующий I/O\n```\n\n---\n\n### 1. Event loop\n\n`event loop` — центральный механизм `asyncio`.\n\nОн:\n\n```text\n- запускает корутины\n- планирует задачи\n- выполняет callbacks\n- следит за сетевым I/O\n- обрабатывает таймеры\n- запускает subprocess\n- возобновляет задачи, когда их ожидание завершилось\n```\n\nДокументация прямо называет event loop ядром каждого `asyncio`-приложения: он выполняет асинхронные задачи и callbacks, сетевые операции и subprocesses. \n\nУпрощённо:\n\n```text\nevent loop\n→ взял готовую задачу\n→ выполняет её до await\n→ задача ждёт I/O/таймер/Future\n→ event loop переключается на другую готовую задачу\n→ когда ожидание завершилось, задача продолжается\n```\n\nПример:\n\n```python\nimport asyncio\n\nasync def main():\n    print(\"start\")\n    await asyncio.sleep(1)\n    print(\"end\")\n\nasyncio.run(main())\n```\n\n`asyncio.run()` запускает awaitable-объект в event loop, управляет циклом, финализирует async generators и закрывает executor после завершения. \n\n---\n\n### 2. Корутины\n\nКорутина — это функция, объявленная через `async def`.\n\n```python\nasync def fetch_data():\n    await asyncio.sleep(1)\n    return \"data\"\n```\n\nВажный момент:\n\n```python\ncoro = fetch_data()\n```\n\nЭтот вызов **не запускает код функции сразу**. Он создаёт coroutine object. Чтобы корутина начала выполняться, её нужно либо `await`-нуть, либо обернуть в `Task`.\n\n```python\nasync def main():\n    result = await fetch_data()\n    print(result)\n```\n\n`await` означает:\n\n```text\nэта корутина сейчас ждёт результат\nevent loop может пока выполнить другие задачи\nпотом выполнение этой корутины продолжится\n```\n\nТо есть `await` — это точка добровольного переключения.\n\n---\n\n### 3. Task\n\n`Task` — это запланированная корутина.\n\nПросто создать coroutine object недостаточно:\n\n```python\ncoro = fetch_data()\n```\n\nА вот так корутина планируется на выполнение:\n\n```python\ntask = asyncio.create_task(fetch_data())\n```\n\nДокументация указывает, что `Task` используется для конкурентного планирования корутин; когда корутина оборачивается в `Task` через `asyncio.create_task()`, она автоматически планируется для выполнения. \n\nПример:\n\n```python\nimport asyncio\n\nasync def load(name, delay):\n    print(f\"{name}: start\")\n    await asyncio.sleep(delay)\n    print(f\"{name}: end\")\n    return name\n\nasync def main():\n    task1 = asyncio.create_task(load(\"A\", 2))\n    task2 = asyncio.create_task(load(\"B\", 1))\n\n    result1 = await task1\n    result2 = await task2\n\n    print(result1, result2)\n\nasyncio.run(main())\n```\n\nЗдесь `A` и `B` выполняются конкурентно:\n\n```text\nA стартует\nB стартует\nB заканчивает ожидание раньше\nA заканчивает позже\n```\n\nНо это не значит, что Python-код `A` и `B` выполнялся параллельно на разных ядрах. Они по очереди выполнялись в одном event loop.\n\n---\n\n### 4. Future\n\n`Future` — низкоуровневый объект, который представляет результат, который появится позже.\n\n```text\nFuture\n├── пока результата нет\n├── потом будет result\n├── или exception\n└── или cancellation\n```\n\nДокументация описывает `asyncio.Future` как awaitable-объект, представляющий eventual result асинхронной операции. Корутины могут ждать Future до появления результата, исключения или отмены. \n\nОбычно напрямую `Future` в пользовательском коде создают редко. Чаще ты работаешь с корутинами и `Task`, а `Future` остаётся внутри библиотек, event loop и низкоуровневого I/O.\n\n---\n\n### 5. Кооперативное переключение\n\nГлавная особенность `asyncio` — задачи переключаются только в точках ожидания.\n\nНапример:\n\n```python\nasync def good():\n    await asyncio.sleep(1)\n```\n\nЗдесь задача отдаёт управление event loop.\n\nА вот так плохо:\n\n```python\nasync def bad():\n    while True:\n        pass\n```\n\nЭта корутина не содержит `await`, поэтому она заблокирует event loop.\n\nПравильная модель мышления:\n\n```text\nasyncio не прерывает задачу насильно\nзадача должна сама дойти до await\nтолько тогда event loop сможет выполнить что-то другое\n```\n\n---\n\n### 6. Неблокирующий I/O\n\n`asyncio` особенно полезен для I/O-bound задач:\n\n```text\n- HTTP-запросы\n- WebSocket\n- работа с БД через async-драйвер\n- сетевые серверы\n- ожидание таймеров\n- большое количество соединений\n```\n\nСмысл:\n\n```text\nпока одна задача ждёт ответ от сети\nevent loop выполняет другую задачу\n```\n\nЭто отличается от синхронного кода:\n\n```python\ntime.sleep(1)\n```\n\n`time.sleep()` блокирует поток.\n\nА это не блокирует event loop:\n\n```python\nawait asyncio.sleep(1)\n```\n\n---\n\n### 7. `asyncio` — не про CPU-bound параллелизм\n\n`asyncio` хорошо работает, когда задачи часто ждут I/O.\n\nНо если задача активно грузит CPU:\n\n```python\nasync def cpu_bound():\n    total = 0\n    for i in range(100_000_000):\n        total += i\n    return total\n```\n\nОна будет занимать event loop и мешать другим задачам.\n\nДля CPU-bound задач обычно используют:\n\n```text\n- multiprocessing\n- ProcessPoolExecutor\n- run_in_executor\n- asyncio.to_thread для выноса блокирующей функции в поток\n```\n\nНо сам `asyncio` не превращает CPU-bound код в параллельный код.\n\n---\n\n### 8. Один event loop — обычно один поток\n\nОбычно event loop работает в одном потоке.\n\n```text\nодин event loop\n→ один поток\n→ много задач\n→ переключение через await\n```\n\nПоэтому в рамках одного loop не нужно думать о race condition так же, как в многопоточном коде, но проблемы общего состояния всё равно возможны, если несколько корутин изменяют одни и те же данные между `await`.\n\nПример потенциальной проблемы:\n\n```python\ncounter = 0\n\nasync def increment():\n    global counter\n\n    value = counter\n    await asyncio.sleep(0)\n    counter = value + 1\n```\n\nЗдесь между чтением и записью есть `await`, значит другая корутина может вмешаться.\n\nДля таких случаев есть async-примитивы:\n\n```python\nlock = asyncio.Lock()\n```\n\n```python\nasync with lock:\n    # критическая секция\n    ...\n```\n\n---\n\n### 9. Task cancellation\n\nЗадачи в `asyncio` можно отменять.\n\n```python\ntask = asyncio.create_task(fetch_data())\ntask.cancel()\n```\n\nОтмена обычно приводит к выбрасыванию `asyncio.CancelledError` внутри корутины. Это важно для таймаутов, graceful shutdown и отмены долгих операций.\n\nТипичный шаблон:\n\n```python\nasync def worker():\n    try:\n        while True:\n            await asyncio.sleep(1)\n    except asyncio.CancelledError:\n        # очистка ресурсов\n        raise\n```\n\n---\n\n### 10. `asyncio.gather()` и конкурентный запуск\n\nДля запуска нескольких awaitable-объектов часто используют `asyncio.gather()`:\n\n```python\nimport asyncio\n\nasync def load_user():\n    await asyncio.sleep(1)\n    return \"user\"\n\nasync def load_orders():\n    await asyncio.sleep(1)\n    return \"orders\"\n\nasync def main():\n    user, orders = await asyncio.gather(\n        load_user(),\n        load_orders(),\n    )\n\n    print(user, orders)\n\nasyncio.run(main())\n```\n\nБез конкурентности это заняло бы примерно 2 секунды:\n\n```text\nload_user    → 1 секунда\nload_orders  → 1 секунда\nитого        → 2 секунды\n```\n\nС `gather()` обе операции ожидания идут конкурентно:\n\n```text\nload_user и load_orders ждут одновременно\nитого примерно 1 секунда\n```\n\n---\n\n### Главная схема\n\n```text\nasync def\n→ создаёт корутинную функцию\n\ncoroutine object\n→ результат вызова async-функции\n\nTask\n→ корутина, запланированная в event loop\n\nawait\n→ точка ожидания и передачи управления event loop\n\nevent loop\n→ планировщик, который переключает задачи\n\nFuture\n→ объект будущего результата\n```\n\n---\n\n### Главное отличие от потоков\n\n```text\nthreading\n→ переключение контролирует ОС\n→ вытесняющая многозадачность\n→ возможны параллельные потоки, но в CPython мешает GIL\n\nasyncio\n→ переключение происходит через await\n→ кооперативная многозадачность\n→ один event loop обычно выполняет одну задачу Python-кода за раз\n```\n\nИтог:\n\n```text\nasyncio — это модель конкурентности для I/O-bound задач.\n\nevent loop — планировщик.\ncoroutine — приостанавливаемая функция.\nTask — корутина, поставленная на выполнение.\nawait — точка, где задача отдаёт управление.\nFuture — низкоуровневый контейнер будущего результата.\n```\n\nИспользовать `asyncio` целесообразно, когда программа много ждёт внешние ресурсы и нужно эффективно обслуживать много таких ожиданий в одном потоке."
  popularity = 2.63

[[questions]]
  id = 17
  question = "В какие моменты event loop переключается между задачами в асинхронном выполнении?"
  answer = "### Когда event loop переключается между задачами\n\nВ `asyncio` переключение задач происходит **не принудительно**, а **кооперативно**: задача сама отдаёт управление event loop, обычно на `await`. Event loop в один момент выполняет только одну задачу; пока одна задача ждёт завершения `Future`/I/O/таймера, loop может выполнять другую задачу. \n\nГлавные моменты переключения:\n\n### 1. На `await`, если ожидаемый объект ещё не готов\n\nНапример:\n\n```python\nasync def task_1():\n    print(\"A\")\n    await some_io()\n    print(\"B\")\n```\n\nКогда выполнение доходит до:\n\n```python\nawait some_io()\n```\n\nесли `some_io()` ещё не завершился, текущая задача **приостанавливается**, а event loop берёт другую готовую задачу.\n\nСхематично:\n\n```text\ntask_1 выполняется\n↓\nдоходит до await some_io()\n↓\nsome_io ещё не готов\n↓\ntask_1 приостанавливается\n↓\nevent loop запускает другую готовую task\n```\n\n### 2. На `await asyncio.sleep(...)`\n\n`asyncio.sleep()` всегда приостанавливает текущую задачу и даёт возможность выполниться другим задачам. Даже `await asyncio.sleep(0)` используется как явная добровольная передача управления event loop. \n\n```python\nimport asyncio\n\nasync def worker(name):\n    for i in range(3):\n        print(name, i)\n        await asyncio.sleep(0)\n\nasyncio.run(asyncio.gather(\n    worker(\"A\"),\n    worker(\"B\"),\n))\n```\n\nЛогика:\n\n```text\nA 0\nawait sleep(0) → отдал управление\nB 0\nawait sleep(0) → отдал управление\nA 1\n...\n```\n\n### 3. Когда задача ждёт сетевой ввод/вывод\n\nТипичный пример:\n\n```python\ndata = await reader.read(1024)\n```\n\nПока данные из сокета не пришли, задача не занимает поток выполнения. Event loop следит за готовностью I/O и в это время выполняет другие задачи. `asyncio` как раз хорошо подходит для I/O-bound задач и сетевого кода. \n\n### 4. Когда задача ждёт другую задачу\n\n```python\nresult = await other_task\n```\n\nЕсли `other_task` ещё не завершилась, текущая задача приостанавливается.\n\n```text\ntask_1 ждёт task_2\n↓\ntask_1 suspended\n↓\nevent loop выполняет task_2 или другие готовые задачи\n↓\ntask_2 завершилась\n↓\ntask_1 продолжает выполнение\n```\n\n### 5. Когда задача ждёт Future\n\nВнутри `asyncio` многие операции сводятся к ожиданию `Future`.\n\n```python\nresult = await future\n```\n\nЕсли `future` ещё не готов, задача отдаёт управление. Когда `future` получает результат или исключение, event loop снова ставит задачу в очередь готовых к продолжению.\n\n### Важный момент: обычный код не переключается\n\nВот здесь переключения не будет:\n\n```python\nasync def bad_task():\n    while True:\n        pass\n```\n\nНесмотря на `async def`, внутри нет `await`. Такая задача заблокирует event loop.\n\nТо же самое с тяжёлым CPU-кодом:\n\n```python\nasync def cpu_task():\n    for i in range(10**9):\n        ...\n```\n\nПока код не дойдёт до `await`, event loop не сможет переключиться на другие задачи.\n\n### Правильная короткая формулировка\n\nEvent loop переключается между задачами **только в точках ожидания**, когда текущая coroutine делает `await` и ожидаемый объект не готов: I/O, sleep, Future, другая Task, блокировка `asyncio.Lock`, очередь `asyncio.Queue` и т.д.\n\n```text\nasyncio = кооперативная многозадачность\n\nне event loop насильно прерывает задачу,\nа задача сама отдаёт управление через await\n```\n\n### Мини-пример\n\n```python\nimport asyncio\n\nasync def task_a():\n    print(\"A1\")\n    await asyncio.sleep(1)\n    print(\"A2\")\n\nasync def task_b():\n    print(\"B1\")\n    await asyncio.sleep(1)\n    print(\"B2\")\n\nasync def main():\n    await asyncio.gather(task_a(), task_b())\n\nasyncio.run(main())\n```\n\nПримерный порядок:\n\n```text\nA1\ntask_a дошла до await sleep(1) → отдала управление\nB1\ntask_b дошла до await sleep(1) → отдала управление\nчерез ~1 секунду обе задачи снова готовы\nA2\nB2\n```\n\nИтог: `asyncio` не делает параллельное выполнение Python-кода в одном потоке. Оно быстро переключает задачи в моменты, когда одна из них ждёт внешнее событие."
  popularity = 5.26

