  id = 20
  question = "Как в asyncio запускать блокирующие операции, чтобы не останавливать event loop? (run_in_excecutor)"
  answer = "Правильное имя метода: `run_in_executor`, не `run_in_excecutor`.\n\nВ `asyncio` блокирующую синхронную функцию нельзя вызывать напрямую внутри `async def`, иначе она остановит event loop. Её нужно вынести в отдельный поток или процесс:\n\n```python\nresult = await loop.run_in_executor(None, blocking_func)\n```\n\nили, в современном коде для I/O-bound задач:\n\n```python\nresult = await asyncio.to_thread(blocking_func)\n```\n\n`asyncio.to_thread()` запускает обычную синхронную функцию в отдельном потоке и возвращает корутину, которую можно `await`-ить. Документация прямо указывает, что это нужно для I/O-bound функций, которые иначе заблокировали бы event loop. \n\n### Проблема\n\nДопустим, есть блокирующая функция:\n\n```python\nimport time\n\ndef blocking_io():\n    time.sleep(3)\n    return \"done\"\n```\n\nЕсли вызвать её напрямую:\n\n```python\nasync def main():\n    result = blocking_io()\n    print(result)\n```\n\nто `time.sleep(3)` заблокирует весь поток, в котором работает event loop. В это время другие корутины не смогут выполняться.\n\n### Вариант 1: asyncio.to_thread\n\nДля обычных блокирующих I/O-операций чаще всего достаточно `asyncio.to_thread`:\n\n```python\nimport asyncio\nimport time\n\ndef blocking_io():\n    time.sleep(3)\n    return \"done\"\n\nasync def background_task():\n    while True:\n        print(\"event loop жив\")\n        await asyncio.sleep(0.5)\n\nasync def main():\n    task = asyncio.create_task(background_task())\n\n    result = await asyncio.to_thread(blocking_io)\n\n    print(result)\n    task.cancel()\n\nasyncio.run(main())\n```\n\nСмысл:\n\n```text\nevent loop\n  ├─ выполняет async-код\n  ├─ отдаёт blocking_io в отдельный thread\n  └─ пока blocking_io работает, продолжает выполнять другие coroutine\n```\n\nТо есть блокирующая функция всё ещё блокирующая, но блокирует не event loop, а отдельный поток.\n\n### Вариант 2: loop.run_in_executor\n\n`run_in_executor` — более низкоуровневый способ. Он позволяет явно выбрать executor: потоковый или процессный. По документации, `loop.run_in_executor(executor, func, *args)` запускает `func` в указанном executor; если передать `None`, используется executor по умолчанию, обычно `ThreadPoolExecutor`. \n\n```python\nimport asyncio\nimport time\n\ndef blocking_io():\n    time.sleep(3)\n    return \"done\"\n\nasync def main():\n    loop = asyncio.get_running_loop()\n\n    result = await loop.run_in_executor(\n        None,\n        blocking_io,\n    )\n\n    print(result)\n\nasyncio.run(main())\n```\n\nЗдесь:\n\n```python\nNone\n```\n\nозначает:\n\n```text\nиспользуй default ThreadPoolExecutor\n```\n\n### С аргументами\n\nЕсли функция принимает аргументы:\n\n```python\ndef read_file(path: str):\n    with open(path, \"r\", encoding=\"utf-8\") as file:\n        return file.read()\n```\n\nто с `to_thread`:\n\n```python\ncontent = await asyncio.to_thread(read_file, \"data.txt\")\n```\n\nс `run_in_executor`:\n\n```python\nloop = asyncio.get_running_loop()\n\ncontent = await loop.run_in_executor(\n    None,\n    read_file,\n    \"data.txt\",\n)\n```\n\nДля keyword-аргументов с `run_in_executor` обычно используют `functools.partial`, потому что `run_in_executor` напрямую передаёт позиционные аргументы. Документация также указывает `functools.partial()` как способ передавать keyword-аргументы.\n\n\n```python\nfrom functools import partial\n\ncontent = await loop.run_in_executor(\n    None,\n    partial(open_file, path=\"data.txt\", encoding=\"utf-8\"),\n)\n```\n\n### ThreadPoolExecutor вручную\n\nМожно создать свой пул потоков:\n\n```python\nimport asyncio\nfrom concurrent.futures import ThreadPoolExecutor\nimport time\n\ndef blocking_io(n: int):\n    time.sleep(2)\n    return n * 2\n\nasync def main():\n    loop = asyncio.get_running_loop()\n\n    with ThreadPoolExecutor(max_workers=5) as pool:\n        tasks = [\n            loop.run_in_executor(pool, blocking_io, i)\n            for i in range(10)\n        ]\n\n        results = await asyncio.gather(*tasks)\n\n    print(results)\n\nasyncio.run(main())\n```\n\nТак удобно контролировать количество потоков:\n\n```text\nmax_workers=5\n```\n\nзначит одновременно будет работать не больше 5 блокирующих функций.\n\n### Для CPU-bound лучше ProcessPoolExecutor\n\nЕсли операция не I/O-bound, а CPU-bound, например тяжёлые вычисления, `ThreadPoolExecutor` обычно не даст нормального параллелизма в CPython из-за GIL. Документация `asyncio.to_thread` отдельно отмечает, что из-за GIL `to_thread` обычно подходит именно для I/O-bound задач, а CPU-bound — только в особых случаях, например если расширение освобождает GIL. \n\nДля CPU-bound:\n\n```python\nimport asyncio\nfrom concurrent.futures import ProcessPoolExecutor\n\ndef cpu_bound():\n    return sum(i * i for i in range(10 ** 7))\n\nasync def main():\n    loop = asyncio.get_running_loop()\n\n    with ProcessPoolExecutor() as pool:\n        result = await loop.run_in_executor(pool, cpu_bound)\n\n    print(result)\n\nif __name__ == \"__main__\":\n    asyncio.run(main())\n```\n\nВажно: для `ProcessPoolExecutor` нужен guard:\n\n```python\nif __name__ == \"__main__\":\n```\n\nОсобенно на Windows. Это также указано в официальной документации Python для примера с process pool. \n\n### Что использовать на практике\n\n```text\nI/O-bound blocking code\n  ├─ requests.get()\n  ├─ time.sleep()\n  ├─ обычное чтение файлов\n  ├─ синхронные SDK\n  └─ синхронные DB/HTTP клиенты\n        ↓\n  asyncio.to_thread() или ThreadPoolExecutor\n\nCPU-bound blocking code\n  ├─ тяжёлые вычисления\n  ├─ обработка изображений\n  ├─ парсинг больших данных\n  └─ криптография / сжатие / расчёты\n        ↓\n  ProcessPoolExecutor\n```\n\n### Главное правило\n\nНельзя так:\n\n```python\nasync def handler():\n    data = requests.get(\"https://example.com\").json()\n    return data\n```\n\nПотому что `requests.get()` блокирует event loop.\n\nЛучше так:\n\n```python\nimport asyncio\nimport requests\n\ndef fetch_sync(url: str):\n    response = requests.get(url)\n    response.raise_for_status()\n    return response.json()\n\nasync def handler():\n    data = await asyncio.to_thread(fetch_sync, \"https://example.com\")\n    return data\n```\n\nНо ещё лучше — использовать настоящую async-библиотеку, например `httpx.AsyncClient` или `aiohttp`, потому что тогда не нужны дополнительные потоки.\n\n### Итог\n\n`run_in_executor` нужен, чтобы встроить обычный синхронный блокирующий код в `asyncio`-приложение:\n\n```python\nloop = asyncio.get_running_loop()\nresult = await loop.run_in_executor(None, blocking_func)\n```\n\nА в современном коде для простого случая чаще пишут:\n\n```python\nresult = await asyncio.to_thread(blocking_func)\n```\n\nРазница по сути такая:\n\n```text\nasyncio.to_thread()\n  удобная обёртка для запуска функции в отдельном потоке\n\nloop.run_in_executor()\n  более гибкий низкоуровневый способ:\n  можно выбрать ThreadPoolExecutor или ProcessPoolExecutor\n```"
  popularity = 2.63

