  id = 46
  question = "Как отслеживать статус асинхронной задачи, если она может зависнуть?"
  answer = "### Основные способы\n\nВ `asyncio` статус задачи обычно отслеживают через объект `Task`:\n\n```python\ntask = asyncio.create_task(some_coro())\n```\n\nУ `Task` есть методы:\n\n```python\ntask.done()       # задача завершилась: успешно, с ошибкой или отменой\ntask.cancelled()  # задача была отменена\ntask.result()     # получить результат, если задача завершилась успешно\ntask.exception()  # получить исключение, если задача упала\n```\n\n`Task` является разновидностью `Future`, поэтому у него есть методы проверки завершения, результата и исключения. Официальная документация также указывает, что coroutine, переданная в `create_task()`, планируется как задача в event loop. \n\n### Вариант 1: ждать задачу с timeout\n\nСамый простой способ защититься от зависания:\n\n```python\nimport asyncio\n\n\nasync def long_operation():\n    await asyncio.sleep(10)\n    return \"done\"\n\n\nasync def main():\n    task = asyncio.create_task(long_operation())\n\n    try:\n        result = await asyncio.wait_for(task, timeout=3)\n        print(\"Результат:\", result)\n\n    except TimeoutError:\n        print(\"Задача выполнялась слишком долго\")\n        print(\"Отменена:\", task.cancelled())\n\n\nasyncio.run(main())\n```\n\n`asyncio.wait_for()` ждёт awaitable ограниченное время. Если timeout истёк, задача отменяется, а наружу выбрасывается `TimeoutError`. Отмена в `asyncio` доставляется в coroutine через `CancelledError` при ближайшей возможности выполнения. \n\n### Вариант 2: проверять статус вручную\n\nМожно периодически смотреть, завершилась ли задача:\n\n```python\nimport asyncio\n\n\nasync def long_operation():\n    await asyncio.sleep(5)\n    return \"ok\"\n\n\nasync def main():\n    task = asyncio.create_task(long_operation())\n\n    while not task.done():\n        print(\"Задача ещё работает...\")\n        await asyncio.sleep(1)\n\n    if task.cancelled():\n        print(\"Задача была отменена\")\n    elif task.exception() is not None:\n        print(\"Задача упала с ошибкой:\", task.exception())\n    else:\n        print(\"Результат:\", task.result())\n\n\nasyncio.run(main())\n```\n\nСхема:\n\n```text\ncreate_task()\n↓\nпериодически проверяем task.done()\n↓\nесли done=True:\n    cancelled()  → была отменена\n    exception()  → завершилась с ошибкой\n    result()     → завершилась успешно\n```\n\n### Вариант 3: timeout без автоматической отмены задачи\n\nИногда нужно ограничить ожидание, но не отменять саму задачу. Тогда используют `asyncio.shield()`:\n\n```python\nimport asyncio\n\n\nasync def long_operation():\n    await asyncio.sleep(5)\n    return \"done\"\n\n\nasync def main():\n    task = asyncio.create_task(long_operation())\n\n    try:\n        await asyncio.wait_for(asyncio.shield(task), timeout=2)\n    except TimeoutError:\n        print(\"Ожидание истекло, но задача продолжает работать\")\n\n    print(\"Статус после timeout:\", task.done())\n\n    result = await task\n    print(\"Итоговый результат:\", result)\n\n\nasyncio.run(main())\n```\n\nБез `shield()` timeout через `wait_for()` отменяет задачу. С `shield()` отменяется ожидание, но исходная задача продолжает выполняться. Документация описывает `shield()` как способ защитить awaitable от внешней отмены. \n\n### Вариант 4: современный timeout-блок Python 3.11+\n\nВ Python 3.11+ можно использовать `asyncio.timeout()`:\n\n```python\nimport asyncio\n\n\nasync def main():\n    try:\n        async with asyncio.timeout(3):\n            await asyncio.sleep(10)\n            print(\"completed\")\n    except TimeoutError:\n        print(\"Блок выполнялся слишком долго\")\n\n\nasyncio.run(main())\n```\n\nЭто удобно, когда нужно ограничить не одну задачу, а целый блок async-кода. `asyncio.timeout()` — асинхронный context manager для ограничения времени выполнения блока. \n\n### Важный нюанс: “зависла” или заблокировала event loop\n\nTimeout сработает нормально, если coroutine зависла на `await`:\n\n```python\nawait asyncio.sleep(999)\nawait session.get(...)\nawait queue.get()\n```\n\nНо если внутри coroutine запущен долгий синхронный код без `await`, event loop будет заблокирован:\n\n```python\nasync def bad_task():\n    while True:\n        pass\n```\n\nВ таком случае event loop не сможет нормально переключаться между задачами, и timeout тоже может не сработать вовремя.\n\nПлохо:\n\n```python\nasync def bad_task():\n    # CPU-bound цикл блокирует event loop\n    while True:\n        pass\n```\n\nЛучше:\n\n```python\nasync def better_task():\n    while True:\n        await asyncio.sleep(0)\n```\n\nНо для настоящей CPU-bound работы лучше использовать:\n\n```text\nasyncio.to_thread()\nProcessPoolExecutor\nThreadPoolExecutor\nотдельный процесс\n```\n\n### Практический шаблон watchdog\n\nЕсли нужно наблюдать за задачей и отменять её при превышении лимита:\n\n```python\nimport asyncio\n\n\nasync def worker():\n    try:\n        await asyncio.sleep(10)\n        return \"done\"\n    except asyncio.CancelledError:\n        print(\"worker: получил отмену\")\n        raise\n\n\nasync def watch_task(task: asyncio.Task, timeout: float):\n    try:\n        return await asyncio.wait_for(task, timeout=timeout)\n\n    except TimeoutError:\n        print(\"watchdog: задача зависла или выполняется слишком долго\")\n\n        if not task.done():\n            task.cancel()\n\n        try:\n            await task\n        except asyncio.CancelledError:\n            print(\"watchdog: задача отменена\")\n\n        return None\n\n\nasync def main():\n    task = asyncio.create_task(worker())\n\n    result = await watch_task(task, timeout=3)\n\n    print(\"result:\", result)\n    print(\"done:\", task.done())\n    print(\"cancelled:\", task.cancelled())\n\n\nasyncio.run(main())\n```\n\nОсновные проверки:\n\n```python\ntask.done()        # завершилась ли задача\ntask.cancelled()   # была ли отменена\ntask.exception()   # какое исключение было\ntask.result()      # результат успешной задачи\n```\n\nГлавное правило:\n\n```text\nЕсли задача может зависнуть на await → используй wait_for() / asyncio.timeout().\nЕсли задача блокирует event loop синхронным кодом → timeout может не помочь вовремя.\n```"
  popularity = 2.63

[[questions]]
  id = 47
  question = "Как управлять асинхронными задачами внутри HTTP request?"
  answer = "Внутри HTTP request асинхронными задачами нужно управлять по-разному в зависимости от того, нужен ли результат задачи прямо для ответа.\n\n```text\nНужен результат в response\n↓\nawait / gather / TaskGroup + timeout\n\nНе нужен результат прямо сейчас\n↓\nBackgroundTasks / очередь задач / отдельный worker\n\nЗадача долгая или важная\n↓\nне держать HTTP request, а отдавать 202 + job_id\n```\n\n### 1. Когда результат нужен для ответа\n\nНапример, endpoint должен сходить в несколько сервисов/БД и вернуть объединённый результат.\n\nДля Python 3.11+ лучше использовать `asyncio.TaskGroup()`:\n\n```python\nimport asyncio\nfrom fastapi import FastAPI\n\napp = FastAPI()\n\n\nasync def get_user(user_id: int):\n    await asyncio.sleep(1)\n    return {\"id\": user_id, \"name\": \"Alex\"}\n\n\nasync def get_notifications(user_id: int):\n    await asyncio.sleep(1)\n    return [{\"id\": 1, \"text\": \"Hello\"}]\n\n\n@app.get(\"/users/{user_id}/dashboard\")\nasync def dashboard(user_id: int):\n    async with asyncio.timeout(3):\n        async with asyncio.TaskGroup() as tg:\n            user_task = tg.create_task(get_user(user_id))\n            notifications_task = tg.create_task(get_notifications(user_id))\n\n    return {\n        \"user\": user_task.result(),\n        \"notifications\": notifications_task.result(),\n    }\n```\n\nЧто здесь происходит:\n\n```text\nHTTP request пришёл\n↓\nсоздали несколько async-задач\n↓\nждём их завершения внутри request\n↓\nсобираем результат\n↓\nвозвращаем response\n```\n\n`TaskGroup` даёт структурированную конкурентность: задачи создаются внутри блока, а выход из блока означает, что связанные задачи завершены или корректно обработаны. `asyncio.timeout()` ограничивает время выполнения блока. Оба механизма описаны в официальной документации `asyncio`. \n\n### 2. Вариант через `asyncio.gather()`\n\nДля простых случаев можно использовать `gather()`:\n\n```python\nimport asyncio\nfrom fastapi import FastAPI\n\napp = FastAPI()\n\n\nasync def fetch_profile(user_id: int):\n    await asyncio.sleep(1)\n    return {\"user_id\": user_id}\n\n\nasync def fetch_stats(user_id: int):\n    await asyncio.sleep(1)\n    return {\"posts\": 10}\n\n\n@app.get(\"/users/{user_id}\")\nasync def get_user_data(user_id: int):\n    try:\n        profile, stats = await asyncio.wait_for(\n            asyncio.gather(\n                fetch_profile(user_id),\n                fetch_stats(user_id),\n            ),\n            timeout=3,\n        )\n    except TimeoutError:\n        return {\"error\": \"request timeout\"}\n\n    return {\n        \"profile\": profile,\n        \"stats\": stats,\n    }\n```\n\n`asyncio.gather()` конкурентно запускает awaitable-объекты и возвращает результаты в порядке переданных аргументов. `asyncio.wait_for()` ограничивает ожидание и при timeout отменяет awaitable. \n\n### 3. Не делать `create_task()` без контроля\n\nПлохой вариант:\n\n```python\n@app.post(\"/bad\")\nasync def bad_endpoint():\n    asyncio.create_task(do_something())\n    return {\"ok\": True}\n```\n\nПроблемы:\n\n```text\nзадача может упасть, а ошибку никто не обработает\nзадача может жить дольше request\nпри перезапуске процесса задача потеряется\nсложно контролировать timeout и отмену\nсложно корректно закрывать ресурсы\n```\n\n`create_task()` внутри request допустим только когда ты сохраняешь ссылку на задачу, контролируешь её жизненный цикл, обрабатываешь ошибки и понимаешь, что задача живёт в памяти текущего процесса. Документация `asyncio` описывает `create_task()` как способ запланировать coroutine как `Task`, но сама задача не становится надёжной фоновой job-очередью. \n\n### 4. Когда задача должна выполниться после ответа\n\nВ FastAPI для коротких фоновых действий есть `BackgroundTasks`:\n\n```python\nfrom fastapi import BackgroundTasks, FastAPI\n\napp = FastAPI()\n\n\ndef write_log(user_id: int):\n    with open(\"log.txt\", \"a\", encoding=\"utf-8\") as file:\n        file.write(f\"user_id={user_id}\\n\")\n\n\n@app.post(\"/users/{user_id}/action\")\nasync def user_action(user_id: int, background_tasks: BackgroundTasks):\n    background_tasks.add_task(write_log, user_id)\n\n    return {\"status\": \"accepted\"}\n```\n\nСхема:\n\n```text\nrequest пришёл\n↓\nendpoint добавил background task\n↓\nresponse отправлен клиенту\n↓\nbackground task выполняется после response\n```\n\nFastAPI использует механизм фоновых задач Starlette. Starlette указывает, что background task прикрепляется к response и запускается только после отправки response. \n\n### 5. Для тяжёлых задач нужен worker, а не HTTP request\n\nДля долгих или важных задач лучше не держать HTTP request открытым.\n\nПравильная схема:\n\n```text\nPOST /reports\n↓\nсоздать job_id\n↓\nположить задачу в Redis/RabbitMQ/Celery/RQ/arq\n↓\nвернуть 202 Accepted + job_id\n\nGET /reports/{job_id}\n↓\nпроверить статус задачи\n↓\nвернуть pending / success / failed\n```\n\nПример ответа:\n\n```json\n{\n  \"job_id\": \"abc123\",\n  \"status\": \"queued\"\n}\n```\n\nFastAPI прямо предупреждает: для тяжёлых фоновых вычислений и задач, которые должны выполняться в нескольких процессах или серверах, лучше использовать более серьёзные инструменты вроде Celery с брокером сообщений, например Redis или RabbitMQ. \n\n### 6. Как контролировать зависание внутри request\n\nИспользуй timeout:\n\n```python\nimport asyncio\nfrom fastapi import HTTPException\n\n\n@app.get(\"/external\")\nasync def external_data():\n    try:\n        async with asyncio.timeout(5):\n            result = await call_external_service()\n            return result\n    except TimeoutError:\n        raise HTTPException(status_code=504, detail=\"External service timeout\")\n```\n\nДля HTTP API обычно логичнее возвращать:\n\n```text\n504 Gateway Timeout → внешний сервис не ответил вовремя\n408 Request Timeout → клиент слишком долго отправлял request\n500 Internal Server Error → внутренняя ошибка сервера\n```\n\n### 7. Как ограничить количество одновременных задач\n\nНапример, нельзя запускать 1000 запросов к внешнему сервису одновременно. Используй `asyncio.Semaphore`:\n\n```python\nimport asyncio\n\nsem = asyncio.Semaphore(10)\n\n\nasync def limited_call(item_id: int):\n    async with sem:\n        return await call_external_service(item_id)\n\n\n@app.post(\"/batch\")\nasync def batch_endpoint(ids: list[int]):\n    async with asyncio.timeout(10):\n        results = await asyncio.gather(\n            *(limited_call(item_id) for item_id in ids)\n        )\n\n    return {\"results\": results}\n```\n\nСхема:\n\n```text\n100 задач создано\n↓\nно одновременно внутрь async with sem проходят только 10\n↓\nостальные ждут\n```\n\nЭто защищает приложение и внешние сервисы от перегрузки.\n\n### 8. Что делать при отключении клиента\n\nДля long-polling или streaming иногда нужно проверять, не отключился ли клиент:\n\n```python\nfrom fastapi import Request\n\n\n@app.get(\"/long\")\nasync def long_request(request: Request):\n    for i in range(100):\n        if await request.is_disconnected():\n            return {\"status\": \"client disconnected\"}\n\n        await asyncio.sleep(1)\n\n    return {\"status\": \"done\"}\n```\n\nStarlette/FastAPI позволяют проверить состояние соединения через `await request.is_disconnected()`, что полезно для long-polling и streaming-сценариев. \n\n### 9. Не использовать ресурсы request в долгой фоновой задаче\n\nПлохая идея:\n\n```python\n@app.post(\"/bad\")\nasync def bad(background_tasks: BackgroundTasks, db: AsyncSession = Depends(get_db)):\n    background_tasks.add_task(do_work, db)\n    return {\"ok\": True}\n```\n\nПроблема: `db`, request context, transaction, dependency scope могут быть закрыты после завершения request.\n\nЛучше передавать простые данные:\n\n```python\n@app.post(\"/good\")\nasync def good(background_tasks: BackgroundTasks, user_id: int):\n    background_tasks.add_task(do_work, user_id)\n    return {\"ok\": True}\n```\n\nА внутри фоновой задачи открыть новое соединение/сессию:\n\n```python\nasync def do_work(user_id: int):\n    async with async_session_maker() as session:\n        ...\n```\n\n### Практическое правило\n\n```text\nawait внутри request\n↓\nкогда результат нужен для response\n\nTaskGroup / gather\n↓\nкогда нужно выполнить несколько async-операций конкурентно\n\nasyncio.timeout / wait_for\n↓\nкогда задача может зависнуть\n\nBackgroundTasks\n↓\nкороткая best-effort задача после response\n\nCelery / RQ / arq / отдельный worker\n↓\nдолгая, тяжёлая или важная задача\n\nSemaphore\n↓\nограничение параллельности\n\njob_id + status endpoint\n↓\nправильная модель для долгих операций\n```\n\nГлавное: HTTP request не должен превращаться в бесконтрольный контейнер для долгоживущих задач. Для задач, от которых зависит ответ, жди их явно. Для задач после ответа используй background-механизм. Для надёжных долгих задач — очередь и отдельный worker."
