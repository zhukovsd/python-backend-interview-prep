[[questions]]
  id = 14
  question = "Какие примитивы синхронизации используются в многопоточном программировании?"
  answer = "### Основные примитивы синхронизации\n\nВ многопоточном программировании примитивы синхронизации нужны, чтобы несколько потоков безопасно работали с общими данными: не портили состояние, не читали данные в промежуточном состоянии и не выполняли критические участки одновременно.\n\nВ Python основные примитивы находятся в модуле `threading`: `Lock`, `RLock`, `Condition`, `Semaphore`, `BoundedSemaphore`, `Event`, `Barrier`. Часть из них можно использовать через `with`, чтобы гарантированно освобождать ресурс после выхода из блока. \n\n---\n\n### 1. Lock\n\n`Lock` — обычная блокировка, или mutex.\n\nИспользуется, когда только один поток должен иметь доступ к критической секции.\n\n```python\nimport threading\n\ncounter = 0\nlock = threading.Lock()\n\ndef increment():\n    global counter\n\n    for _ in range(100_000):\n        with lock:\n            counter += 1\n```\n\nСмысл:\n\n```text\nПоток A вошёл в with lock\n→ остальные потоки ждут\n→ поток A вышел\n→ lock освободился\n→ другой поток может войти\n```\n\nТипичные случаи:\n\n```text\n- изменение общего счётчика\n- запись в общий список/словарь\n- работа с общим файлом\n- изменение общего состояния объекта\n```\n\nВажно: GIL не заменяет `Lock`. В CPython GIL ограничивает одновременное выполнение Python bytecode, но не делает бизнес-операции потокобезопасными. Документация `threading` прямо указывает, что из-за GIL только один поток может выполнять Python-код одновременно, но для корректной синхронизации общего состояния всё равно нужны примитивы синхронизации. \n\n---\n\n### 2. RLock\n\n`RLock` — reentrant lock, то есть повторно-входимая блокировка.\n\nОбычный `Lock` нельзя захватить повторно из того же потока. `RLock` — можно.\n\n```python\nimport threading\n\nlock = threading.RLock()\n\ndef outer():\n    with lock:\n        inner()\n\ndef inner():\n    with lock:\n        print(\"inner\")\n```\n\nС обычным `Lock` такой код мог бы зависнуть:\n\n```text\nouter() захватил lock\n→ вызвал inner()\n→ inner() снова пытается захватить тот же lock\n→ поток ждёт сам себя\n```\n\n`RLock` полезен, когда несколько методов одного объекта используют одну и ту же блокировку и могут вызывать друг друга.\n\n---\n\n### 3. Semaphore\n\n`Semaphore` ограничивает количество потоков, которые одновременно могут пройти в участок кода.\n\nНапример, максимум 3 потока могут одновременно обращаться к внешнему API:\n\n```python\nimport threading\nimport time\n\nsemaphore = threading.Semaphore(3)\n\ndef request_api(user_id):\n    with semaphore:\n        print(f\"start {user_id}\")\n        time.sleep(1)\n        print(f\"end {user_id}\")\n```\n\nСмысл:\n\n```text\nLock       → пускает 1 поток\nSemaphore  → пускает N потоков\n```\n\nТипичные случаи:\n\n```text\n- ограничить количество одновременных запросов\n- ограничить доступ к пулу соединений\n- ограничить работу с тяжёлым ресурсом\n```\n\n---\n\n### 4. BoundedSemaphore\n\n`BoundedSemaphore` похож на `Semaphore`, но дополнительно защищает от ошибки лишнего `release()`.\n\nОбычный `Semaphore` можно случайно “освободить” больше раз, чем захватили. `BoundedSemaphore` обнаруживает такую ошибку.\n\n```python\nimport threading\n\nsem = threading.BoundedSemaphore(2)\n\nsem.acquire()\nsem.release()\n\n# sem.release()  # ошибка: release больше, чем acquire\n```\n\nИспользуется там, где важно не превысить исходный лимит ресурса.\n\n---\n\n### 5. Event\n\n`Event` — флаг-сигнал между потоками.\n\nОдин поток может ждать события, другой — установить его.\n\n```python\nimport threading\nimport time\n\nevent = threading.Event()\n\ndef worker():\n    print(\"worker ждёт сигнал\")\n    event.wait()\n    print(\"worker начал работу\")\n\nthread = threading.Thread(target=worker)\nthread.start()\n\ntime.sleep(2)\nevent.set()\n```\n\nСмысл:\n\n```text\nevent.clear() → события нет\nevent.wait()  → поток ждёт\nevent.set()   → событие произошло, ожидающие потоки продолжают работу\n```\n\nТипичные случаи:\n\n```text\n- сигнал завершения\n- сигнал старта\n- ожидание готовности ресурса\n- остановка фонового потока\n```\n\nПример остановки фонового потока:\n\n```python\nimport threading\nimport time\n\nstop_event = threading.Event()\n\ndef worker():\n    while not stop_event.is_set():\n        print(\"working\")\n        time.sleep(1)\n\nthread = threading.Thread(target=worker)\nthread.start()\n\ntime.sleep(3)\nstop_event.set()\nthread.join()\n```\n\n---\n\n### 6. Condition\n\n`Condition` используется, когда поток должен ждать не просто lock, а конкретное условие.\n\nНапример:\n\n```text\nconsumer ждёт, пока появятся данные\nproducer добавляет данные\nproducer уведомляет consumer\n```\n\nПример:\n\n```python\nimport threading\n\ncondition = threading.Condition()\nitems = []\n\ndef producer():\n    with condition:\n        items.append(\"data\")\n        condition.notify()\n\ndef consumer():\n    with condition:\n        while not items:\n            condition.wait()\n\n        item = items.pop()\n        print(item)\n```\n\nВажный момент:\n\n```python\nwhile not items:\n    condition.wait()\n```\n\nОбычно используют именно `while`, а не `if`, потому что поток после пробуждения должен заново проверить условие.\n\n`Condition` часто лежит внутри более высокоуровневых структур, например очередей.\n\n---\n\n### 7. Barrier\n\n`Barrier` заставляет несколько потоков дождаться друг друга в одной точке.\n\n```python\nimport threading\nimport time\n\nbarrier = threading.Barrier(3)\n\ndef worker(name):\n    print(f\"{name}: подготовка\")\n    time.sleep(1)\n    print(f\"{name}: ждёт остальных\")\n    barrier.wait()\n    print(f\"{name}: продолжает работу\")\n\nfor i in range(3):\n    threading.Thread(target=worker, args=(f\"thread-{i}\",)).start()\n```\n\nСмысл:\n\n```text\nПоток 1 дошёл до barrier.wait() → ждёт\nПоток 2 дошёл до barrier.wait() → ждёт\nПоток 3 дошёл до barrier.wait() → все продолжают\n```\n\nТипичные случаи:\n\n```text\n- синхронный старт нескольких потоков\n- этапная обработка данных\n- тестирование конкурентного кода\n```\n\n---\n\n### 8. Queue\n\n`queue.Queue` — потокобезопасная очередь.\n\nЭто один из самых практичных способов обмена данными между потоками. Модуль `queue` реализует очереди для схемы multi-producer / multi-consumer и уже содержит нужную locking-семантику. \n\nПример producer-consumer:\n\n```python\nimport queue\nimport threading\n\nq = queue.Queue()\n\ndef producer():\n    for i in range(5):\n        q.put(i)\n\ndef consumer():\n    while True:\n        item = q.get()\n\n        try:\n            print(\"process\", item)\n        finally:\n            q.task_done()\n\nthreading.Thread(target=producer).start()\nthreading.Thread(target=consumer, daemon=True).start()\n\nq.join()\n```\n\nСмысл:\n\n```text\nproducer кладёт задачи в очередь\nconsumer забирает задачи из очереди\nQueue сама синхронизирует доступ между потоками\n```\n\nВарианты:\n\n```text\nqueue.Queue         → FIFO\nqueue.LifoQueue     → LIFO, как стек\nqueue.PriorityQueue → очередь с приоритетом\nqueue.SimpleQueue   → простая неограниченная очередь\n```\n\n---\n\n### 9. Future\n\n`Future` — не совсем низкоуровневый примитив синхронизации, но часто используется в многопоточном коде.\n\nОн представляет результат задачи, который появится позже.\n\n```python\nfrom concurrent.futures import ThreadPoolExecutor\n\ndef calculate():\n    return 10 + 20\n\nwith ThreadPoolExecutor() as executor:\n    future = executor.submit(calculate)\n\n    result = future.result()\n    print(result)\n```\n\n`future.result()` блокирует текущий поток до завершения задачи.\n\nМодуль `concurrent.futures` предоставляет высокоуровневый интерфейс для асинхронного выполнения функций через потоки, процессы или отдельные интерпретаторы. \n\n---\n\n### Что использовать чаще всего\n\nНа практике чаще всего нужны:\n\n```text\nLock\n→ защитить общий mutable state\n\nRLock\n→ если один и тот же поток может повторно входить в защищённый код\n\nSemaphore\n→ ограничить количество одновременных операций\n\nEvent\n→ дать сигнал потоку\n\nCondition\n→ ждать конкретного состояния\n\nBarrier\n→ дождаться группы потоков\n\nQueue\n→ безопасно передавать задачи/данные между потоками\n```\n\n---\n\n### Краткая таблица\n\n|Примитив|Для чего нужен|\n|---|---|\n|`Lock`|Один поток в критической секции|\n|`RLock`|Повторный захват lock тем же потоком|\n|`Semaphore`|Ограничение количества одновременных потоков|\n|`BoundedSemaphore`|Semaphore с защитой от лишнего `release()`|\n|`Event`|Сигнал между потоками|\n|`Condition`|Ожидание конкретного условия|\n|`Barrier`|Ожидание группы потоков|\n|`Queue`|Потокобезопасный обмен данными|\n|`Future`|Получение результата задачи позже|\n\n---\n\n### Главное\n\n```text\nGIL ≠ синхронизация бизнес-логики\n```\n\nДаже в CPython с GIL нужно использовать `Lock`, `Queue`, `Event`, `Condition` и другие примитивы, если несколько потоков работают с общим изменяемым состоянием. Самый безопасный подход — минимизировать общее состояние и передавать данные между потоками через `queue.Queue`."
