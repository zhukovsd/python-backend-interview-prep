  question = "Что такое корутины и задачи?"
  answer = "В `asyncio` есть два важных понятия:\n\n```text\nCoroutine\n  объект, который описывает асинхронную операцию\n\nTask\n  обёртка над coroutine, которая ставит её на выполнение в event loop\n```\n\nОфициальная документация Python относит `coroutines`, `Tasks` и `Futures` к awaitable-объектам, то есть объектам, которые можно использовать с `await`. \n\n---\n\n### Coroutine function и coroutine object\n\nКогда ты пишешь:\n\n```python\nasync def get_data():\n    return 123\n```\n\nэто coroutine function, то есть асинхронная функция.\n\nНо сама по себе она ещё не выполняется.\n\nКогда ты вызываешь её:\n\n```python\ncoro = get_data()\n```\n\nсоздаётся coroutine object.\n\nСхема:\n\n```text\nasync def get_data()\n        ↓\ncoroutine function\n\nget_data()\n        ↓\ncoroutine object\n```\n\nДокументация Python прямо разделяет эти два смысла слова “coroutine”: coroutine function — это `async def` функция, а coroutine object — объект, возвращаемый вызовом этой функции. \n\n---\n\n### Корутина не запускается сама\n\nВажный момент:\n\n```python\nasync def get_data():\n    print(\"started\")\n    return 123\n\ncoro = get_data()\n```\n\nПосле строки:\n\n```python\ncoro = get_data()\n```\n\nкод внутри `get_data()` ещё не выполнился.\n\nЧтобы корутина начала выполняться, её нужно:\n\n```text\nawait-ить\nили\nобернуть в Task\n```\n\nПример через `await`:\n\n```python\nimport asyncio\n\n\nasync def get_data():\n    print(\"started\")\n    return 123\n\n\nasync def main():\n    result = await get_data()\n    print(result)\n\n\nasyncio.run(main())\n```\n\nЗдесь `await get_data()` запускает корутину и ждёт её результат.\n\n---\n\n### Что такое Task\n\n`Task` — это объект, который берёт корутину и планирует её выполнение в event loop.\n\n```python\ntask = asyncio.create_task(get_data())\n```\n\n`asyncio.create_task(coro)` оборачивает корутину в `Task`, ставит её на выполнение и возвращает объект задачи. \n\nПример:\n\n```python\nimport asyncio\n\n\nasync def get_data():\n    await asyncio.sleep(1)\n    return 123\n\n\nasync def main():\n    task = asyncio.create_task(get_data())\n\n    print(\"task created\")\n\n    result = await task\n    print(result)\n\n\nasyncio.run(main())\n```\n\nСхема:\n\n```text\nget_data()\n  ↓\ncoroutine object\n  ↓\nasyncio.create_task(...)\n  ↓\nTask\n  ↓\nevent loop выполняет эту задачу\n```\n\n---\n\n### Главное отличие coroutine от Task\n\n```text\nCoroutine\n  просто объект асинхронной операции\n  сам по себе не запланирован в event loop\n  не выполняется, пока его не await-нут или не обернут в Task\n\nTask\n  coroutine, привязанная к event loop\n  автоматически запланирована на выполнение\n  может выполняться конкурентно с другими Task\n```\n\nTask — это Future-like объект, который запускает Python-корутину в event loop. Если корутина внутри Task ждёт `Future`, выполнение корутины приостанавливается, а потом продолжается, когда `Future` завершится. \n\n---\n\n### await coroutine — это не параллельность\n\nПример последовательного выполнения:\n\n```python\nimport asyncio\n\n\nasync def job(name):\n    print(f\"{name} started\")\n    await asyncio.sleep(1)\n    print(f\"{name} finished\")\n\n\nasync def main():\n    await job(\"A\")\n    await job(\"B\")\n\n\nasyncio.run(main())\n```\n\nЗдесь сначала полностью выполняется `A`, потом `B`.\n\nПримерно так:\n\n```text\nA started\nA finished\nB started\nB finished\n```\n\nТо есть простой `await` означает:\n\n```text\nзапусти корутину\nдождись её завершения\nпотом иди дальше\n```\n\n---\n\n### Task даёт конкурентное выполнение\n\nЧтобы задачи выполнялись одновременно с точки зрения event loop, их нужно создать заранее:\n\n```python\nimport asyncio\n\n\nasync def job(name):\n    print(f\"{name} started\")\n    await asyncio.sleep(1)\n    print(f\"{name} finished\")\n\n\nasync def main():\n    task_a = asyncio.create_task(job(\"A\"))\n    task_b = asyncio.create_task(job(\"B\"))\n\n    await task_a\n    await task_b\n\n\nasyncio.run(main())\n```\n\nТеперь обе задачи запланированы в event loop.\n\nПримерная схема:\n\n```text\ntask A starts\ntask A awaits sleep\nevent loop switches to task B\ntask B starts\ntask B awaits sleep\nevent loop continues other work\n```\n\nТо есть `Task` нужна, когда ты хочешь не просто выполнить одну корутину, а запустить несколько корутин конкурентно.\n\n---\n\n### Через gather\n\nЧасто несколько задач запускают через `asyncio.gather()`:\n\n```python\nimport asyncio\n\n\nasync def job(name):\n    await asyncio.sleep(1)\n    return name\n\n\nasync def main():\n    results = await asyncio.gather(\n        job(\"A\"),\n        job(\"B\"),\n        job(\"C\"),\n    )\n\n    print(results)\n\n\nasyncio.run(main())\n```\n\nЕсли в `asyncio.gather()` передать корутины, они автоматически будут запланированы как задачи. \n\n---\n\n### Task — это не поток\n\nВажно:\n\n```text\nTask ≠ Thread\nTask ≠ Process\n```\n\n`asyncio.Task` не создаёт новый системный поток. Все задачи обычно выполняются в одном потоке event loop и переключаются кооперативно: задача отдаёт управление, когда доходит до `await`.\n\n```text\nодин event loop\n  ├─ Task A\n  ├─ Task B\n  ├─ Task C\n  └─ Task D\n```\n\nEvent loop по очереди даёт задачам выполняться, а когда задача приостанавливается на `await`, запускает другую работу. Концептуальный обзор `asyncio` описывает event loop как механизм, который берёт работу из очереди, запускает её, а когда она приостанавливается или завершается, переходит к другой работе. \n\n---\n\n### Что можно делать с Task\n\nУ `Task` есть управление состоянием:\n\n```python\ntask = asyncio.create_task(job())\n\ntask.cancel()      # отменить задачу\ntask.done()        # завершена ли задача\ntask.result()      # получить результат, если задача завершена\ntask.exception()   # получить исключение, если оно было\n```\n\nПример:\n\n```python\nimport asyncio\n\n\nasync def job():\n    await asyncio.sleep(1)\n    return 100\n\n\nasync def main():\n    task = asyncio.create_task(job())\n\n    result = await task\n\n    print(task.done())   # True\n    print(result)        # 100\n\n\nasyncio.run(main())\n```\n\n---\n\n### Практическое сравнение\n\n|Объект|Что это|Запускается сам?|Можно `await`?|\n|---|---|--:|--:|\n|`async def func`|coroutine function|Нет|Нет|\n|`func()`|coroutine object|Нет|Да|\n|`asyncio.create_task(func())`|Task|Да, планируется в event loop|Да|\n\n---\n\n### Итог\n\nКорутина — это асинхронная операция, созданная вызовом `async def` функции:\n\n```python\ncoro = some_async_func()\n```\n\nTask — это корутина, поставленная на выполнение в event loop:\n\n```python\ntask = asyncio.create_task(some_async_func())\n```\n\nГлавная разница:\n\n```text\ncoroutine\n  описывает работу\n\ntask\n  запускает эту работу через event loop и позволяет управлять её выполнением\n```"
  popularity = 5.26

[[questions]]
  id = 25
  question = "Потокобезопасен ли python?"
  answer = "**Нет, Python-код сам по себе не становится потокобезопасным.**  \nНо **CPython** — стандартная реализация Python — имеет **GIL**, который защищает внутренности интерпретатора от одновременного выполнения Python bytecode несколькими потоками. Это не защищает твою бизнес-логику от race condition. \n\n### Что реально защищает GIL\n\nВ обычном CPython с включённым GIL:\n\n```text\nнесколько потоков есть\n↓\nно Python bytecode в один момент времени выполняет только один поток\n↓\nинтерпретатор и базовые объекты не ломаются от параллельного доступа\n```\n\nТо есть GIL помогает CPython безопасно работать с объектами на внутреннем уровне, но **не делает операции над общими данными логически безопасными**. Документация прямо говорит, что блокировки всё равно нужны для thread-safety в pure-Python коде. \n\n### Что не потокобезопасно\n\nНапример:\n\n```python\ncounter = 0\n\ndef inc():\n    global counter\n    counter += 1\n```\n\n`counter += 1` выглядит как одна операция, но логически это несколько шагов:\n\n```text\nпрочитать counter\nприбавить 1\nзаписать обратно\n```\n\nМежду этими шагами поток может быть переключён, поэтому результат может быть неправильным.\n\nПравильно:\n\n```python\nimport threading\n\ncounter = 0\nlock = threading.Lock()\n\ndef inc():\n    global counter\n    with lock:\n        counter += 1\n```\n\n### А встроенные list/dict/set?\n\nНекоторые одиночные операции в CPython атомарны, например:\n\n```python\nlst.append(x)\nd[key] = value\nx = lst.pop()\n```\n\nВ FAQ Python указано, что операции над встроенными типами, которые «выглядят атомарными», в CPython обычно действительно атомарны, потому что переключение потоков происходит между bytecode-инструкциями. Но составные операции уже не безопасны: `i = i + 1`, `D[x] = D[x] + 1`, `L.append(L[-1])`. В документации прямо сказано: когда сомневаешься — используй mutex/lock. \n\n### Важный момент про Python 3.13+\n\nНачиная с Python 3.13, у CPython есть **free-threaded build**, где GIL можно отключить. Это позволяет потокам реально выполняться параллельно на разных ядрах, но это отдельная сборка, а не обычное поведение по умолчанию. \n\nВ free-threaded Python встроенные типы вроде `dict`, `list`, `set` используют внутренние блокировки для защиты от конкурентных модификаций, но это всё равно не означает, что любая логика приложения автоматически потокобезопасна. \n\n### Итог\n\n```text\nPython / CPython безопасен на уровне интерпретатора\n≠\nтвой многопоточный код потокобезопасен\n```\n\nПравило:\n\n```text\nЕсть общее изменяемое состояние между потоками\n→ нужен Lock / RLock / Semaphore / Queue / Condition / Event\n```\n\nДля I/O-bound задач потоки в Python подходят нормально.  \nДля CPU-bound задач обычные потоки в CPython ограничены GIL, поэтому чаще используют `multiprocessing` или `ProcessPoolExecutor`. "
  popularity = 2.63

[[questions]]
  id = 26
  question = "Как запустить синхронный код в асинхронном проекте"
  answer = "Проблема\r\n\r\nПрямой синхронный вызов в асинхронном коде блокирует весь event loop, останавливая выполнение всех других задач.\r\n\r\nРешение: 3 подхода\r\n\r\n1. Использование run_in_executor() с ThreadPoolExecutor\r\n\r\nДля сетевых запросов, работы с файлами, обращений к БД:\r\n\r\nimport asyncio\r\nimport requests\r\n\r\nasync def fetch_data(url):\r\n    loop = asyncio.get_event_loop()\r\n    response = await loop.run_in_executor(\r\n        None,  # Стандартный пул потоков\r\n        requests.get, url\r\n    )\r\n    return response.json()\r\nСуть: Блокирующая операция выполняется в фоновом потоке, не блокируя основной event loop.\r\n\r\n2. Явное управление пулом потоков\r\n\r\nКогда нужно ограничить количество одновременных операций:\r\n\r\nasync def process_requests(urls):\r\n    with ThreadPoolExecutor(max_workers=3) as executor:\r\n        loop = asyncio.get_event_loop()\r\n        tasks = []\r\n        for url in urls:\r\n            task = loop.run_in_executor(executor, requests.get, url)\r\n            tasks.append(task)\r\n        responses = await asyncio.gather(*tasks)\r\n    return [r.json() for r in responses]\r\nСуть: Создаем пул с ограничением потоков для контроля нагрузки.\r\n\r\n3. ProcessPoolExecutor для CPU-bound задач\r\n\r\nДля вычислений, обработки данных, ML:\r\n\r\nimport asyncio\r\nfrom concurrent.futures import ProcessPoolExecutor\r\n\r\ndef heavy_calculation(data):\r\n    return sum(i * i for i in range(data))\r\n\r\nasync def main():\r\n    with ProcessPoolExecutor() as executor:\r\n        loop = asyncio.get_event_loop()\r\n        result = await loop.run_in_executor(\r\n            executor, heavy_calculation, 1000000\r\n        )\r\n    return result\r\nСуть: Вычисления в отдельном процессе, обход GIL для истинной параллельности.\r\n\r\nКлючевые правила\r\n\r\nI/O операции → ThreadPoolExecutor\r\nВычисления → ProcessPoolExecutor\r\nВсегда предпочитайте асинхронные библиотеки когда возможно\r\nНикогда не делайте прямые синхронные вызовы в асинхронном коде\r"
  popularity = 2.63

[[questions]]
  id = 27
  question = "Что такое зелёные потоки?"
  answer = "Зеленые потоки (green threads) являются примитивным уровнем асинхронного программирования.  \nЗеленый поток — это обычный поток, за исключением того, что переключения между потоками производятся в коде приложения, а не в процессоре.  \n`Gevent` — известная Python-библиотека для использования зеленых потоков неблокирующего ввода-вывода `Eventlet`. `Gevent.monkey` изменяет поведение стандартных библиотек Python таким образом, что они позволяют выполнять неблокирующие операции ввода-вывода.  \nВот пример использования `Gevent` для одновременного обращения к нескольким URL-адресам:\n\n```python\nimport gevent.monkey\nfrom urllib.request import urlopen\ngevent.monkey.patch_all()\nurls = ['http://www.google.com', 'http://www.yandex.ru', 'http://www.python.org']\n\ndef print_head(url):\n    print('Starting {}'.format(url))\n    data = urlopen(url).read()\n    print('{}: {} bytes: {}'.format(url, len(data), data))\n\njobs = [gevent.spawn(print_head, _url) for _url in urls]\n\ngevent.wait(jobs)\n```\n\nКак видите, API-интерфейс Gevent выглядит так же, как и потоки.  \nОднако за кадром он использует сопрограммы (coroutines), а не потоки, и запускает их в цикле событий (event loop) для постановки в очередь. Это значит, что вы получаете преимущества потоков, без понимания сопрограмм, но вы не избавляетесь от проблем, связанных с потоками.  \n`Gevent` — хорошая библиотека, но только для тех, кто понимает, как работают потоки."
  popularity = 2.63

[[questions]]
  id = 28
  question = "Сколько ядер CPU использует asyncio в Python?"
  answer = "Обычно `asyncio` использует 1 ядро CPU для выполнения Python-кода event loop.\n\nТочнее:\n\n```text\n1 event loop\n→ работает в 1 потоке\n→ этот поток выполняется на 1 ядре CPU в конкретный момент времени\n```\n\nВ документации Python указано, что event loop выполняется в потоке, обычно в главном, и все callbacks/tasks этого event loop выполняются в этом же потоке. Пока одна `Task` выполняется в event loop, другая задача в этом же loop не выполняется. \n\n---\n\n### Важное уточнение\n\n`asyncio` даёт конкурентность, а не CPU-параллелизм.\n\nТо есть `asyncio` умеет эффективно переключаться между задачами, когда они ждут I/O:\n\n```text\nзадача A ждёт сеть\n→ event loop переключился на задачу B\n\nзадача B ждёт БД\n→ event loop переключился на задачу C\n```\n\nНо это не значит, что несколько Python-корутин одновременно считают на разных ядрах.\n\n```python\nasync def task_1():\n    ...\n\nasync def task_2():\n    ...\n```\n\nЭти задачи в одном event loop не выполняются физически одновременно на разных ядрах. Они выполняются по очереди, просто переключение происходит быстро и в точках `await`.\n\n---\n\n### Пример\n\n```python\nimport asyncio\n\n\nasync def task(name):\n    print(f\"{name}: start\")\n    await asyncio.sleep(1)\n    print(f\"{name}: end\")\n\n\nasync def main():\n    await asyncio.gather(\n        task(\"A\"),\n        task(\"B\"),\n        task(\"C\"),\n    )\n\n\nasyncio.run(main())\n```\n\nЗдесь три задачи выполняются конкурентно:\n\n```text\nA start\nB start\nC start\nожидание sleep\nA end\nB end\nC end\n```\n\nНо это не значит, что Python занял 3 ядра. Один event loop всё равно работает в одном потоке.\n\n---\n\n### Когда asyncio может использовать больше ядер\n\nСам по себе `asyncio` — нет. Но async-приложение может задействовать больше ядер через дополнительные механизмы.\n\n### 1. Через несколько процессов\n\nНапример, в FastAPI/Gunicorn/Uvicorn можно запустить несколько worker-процессов:\n\n```text\nworker 1 → event loop → ядро CPU\nworker 2 → event loop → ядро CPU\nworker 3 → event loop → ядро CPU\nworker 4 → event loop → ядро CPU\n```\n\nКаждый процесс имеет свой Python-интерпретатор, свой event loop и может выполняться на отдельном ядре.\n\n---\n\n### 2. Через `ProcessPoolExecutor`\n\nДля тяжёлых CPU-bound задач:\n\n```python\nimport asyncio\nfrom concurrent.futures import ProcessPoolExecutor\n\n\ndef cpu_heavy(n: int) -> int:\n    total = 0\n    for i in range(n):\n        total += i * i\n    return total\n\n\nasync def main():\n    loop = asyncio.get_running_loop()\n\n    with ProcessPoolExecutor() as pool:\n        result = await loop.run_in_executor(pool, cpu_heavy, 10_000_000)\n\n    print(result)\n\n\nasyncio.run(main())\n```\n\n`run_in_executor()` позволяет запускать блокирующий код в пуле потоков или процессов. Для CPU-bound задач в документации asyncio приводится вариант с `ProcessPoolExecutor`. \n\n---\n\n### 3. Через нативные библиотеки\n\nНекоторые библиотеки могут сами использовать несколько ядер внутри C/C++/Rust-кода:\n\n```text\nNumPy\nOpenCV\nPyTorch\nTensorFlow\n```\n\nНо это уже не сам `asyncio`. Это внутренняя параллельность конкретной библиотеки.\n\n---\n\n### Что с потоками\n\nМожно запустить синхронный код через:\n\n```python\nawait asyncio.to_thread(sync_func)\n```\n\nили:\n\n```python\nawait loop.run_in_executor(None, sync_func)\n```\n\nНо для обычного Python CPU-bound кода потоки не дадут нормального параллелизма из-за GIL. Они полезнее для блокирующего I/O: файлов, сети, синхронных SDK, старых библиотек.\n\n---\n\n### Итог\n\n```text\nОдин asyncio event loop\n→ обычно 1 поток\n→ в конкретный момент выполняется на 1 ядре CPU\n→ много корутин не означают много ядер\n```\n\nДля использования нескольких ядер нужны:\n\n```text\nCPU-bound задачи\n→ multiprocessing / ProcessPoolExecutor / несколько worker-процессов\n\nI/O-bound задачи\n→ asyncio достаточно, даже на одном ядре\n```\n\nГлавная мысль:\n\n```text\nasyncio масштабирует ожидание I/O,\nа не вычисления по ядрам CPU.\n```"
  popularity = 2.63

