  question = "Какой тип многозадачности используют greenlet?"
  answer = "`greenlet` используют кооперативную многозадачность.\n\nТо есть greenlet не вытесняется планировщиком ОС сам по себе. Он продолжает выполняться, пока сам не отдаст управление другому greenlet через `switch()`.\n\nОфициальная документация `greenlet` описывает greenlet-ы как лёгкие корутины для конкурентного выполнения внутри процесса. В разделе про переключение сказано, что переход между greenlet-ами выполняется через `g.switch(...)`. То есть переключение не происходит автоматически, его явно инициирует сам код. \n\n### Почему это кооперативная модель\n\nВ кооперативной многозадачности задача сама уступает управление:\n\n```text\nGreenlet A работает\n↓\nGreenlet A вызывает g2.switch()\n↓\nGreenlet B продолжает выполнение\n↓\nGreenlet B вызывает g1.switch()\n↓\nGreenlet A продолжает выполнение\n```\n\nПример:\n\n```python\nfrom greenlet import greenlet\n\ndef task1():\n    print(\"task1 start\")\n    g2.switch()\n    print(\"task1 end\")\n\ndef task2():\n    print(\"task2 start\")\n    g1.switch()\n    print(\"task2 end\")\n\ng1 = greenlet(task1)\ng2 = greenlet(task2)\n\ng1.switch()\n```\n\nЗдесь `task1` не вытесняется извне. Она сама вызывает:\n\n```python\ng2.switch()\n```\n\nи добровольно передаёт управление `task2`.\n\n### Важный момент\n\nСам `greenlet` — это низкоуровневый механизм переключения контекста. Он не является полноценным планировщиком задач.\n\nТо есть `greenlet` сам по себе не делает так:\n\n```text\nкаждому greenlet дать по 10 мс CPU-времени\nпотом автоматически переключить на следующий\n```\n\nТак работает вытесняющая многозадачность у потоков ОС.\n\nУ `greenlet` иначе:\n\n```text\nнет switch() → нет переключения\n```\n\nДокументация `greenlet` прямо формулирует это так: переходы между greenlet-ами не являются неявными; greenlet должен сам выбрать переход к другому greenlet-у. \n\n### Сравнение с потоками\n\n```text\nthreading\n= вытесняющая многозадачность на уровне потоков ОС\n\ngreenlet\n= кооперативная многозадачность внутри процесса/потока\n```\n\nСхема:\n\n```text\nProcess\n └── OS Thread\n      ├── greenlet 1\n      ├── greenlet 2\n      └── greenlet 3\n```\n\nОбычно greenlet-ы живут внутри одного потока ОС. Поэтому они не выполняют Python-код параллельно на разных ядрах. Они просто переключаются между собой.\n\n### Если использовать gevent\n\n`gevent` построен поверх `greenlet` и добавляет event loop. В документации `gevent` прямо сказано, что greenlet-ы выполняются в одном OS thread и планируются кооперативно: пока конкретный greenlet не отдаст управление, остальные не получают шанс выполниться. \n\nТо есть:\n\n```text\ngreenlet сам по себе\n= ручное кооперативное переключение через switch()\n\ngevent\n= кооперативная многозадачность поверх greenlet + event loop\n```\n\n### Итог\n\n```text\ngreenlet используют кооперативную многозадачность\n```\n\nГлавная причина:\n\n```text\ngreenlet не прерывается автоматически;\nон сам должен передать управление другому greenlet-у\n```\n\nКлючевая формула:\n\n```text\nthreading → вытесняющая модель\nasyncio   → кооперативная модель через await\ngreenlet  → кооперативная модель через switch()\n```"
  popularity = 2.63

[[questions]]
  id = 9
  question = "Для каких типов задач целесообразно использовать асинхронность, многопоточность, мультипроцессность (I/O-bound vs CPU-bound)?"
  answer = "```text\nI/O-bound задача\n= программа в основном ждёт внешний ресурс:\n  сеть, БД, файл, Redis, HTTP API\n\nCPU-bound задача\n= программа в основном грузит процессор:\n  вычисления, парсинг, обработка изображений, сжатие, криптография\n```\n\nВыбор в Python обычно такой:\n\n```text\nI/O-bound:\n    asyncio\n    threading\n    ThreadPoolExecutor\n\nCPU-bound:\n    multiprocessing\n    ProcessPoolExecutor\n```\n\n### Основная таблица\n\n|Тип задачи|Что лучше использовать|Почему|\n|---|---|---|\n|Много HTTP-запросов|`asyncio` или `threading`|Основное время уходит на ожидание сети|\n|Много запросов в БД|`asyncio`, если драйвер async; иначе `threading`|Пока один запрос ждёт БД, можно выполнять другой|\n|Работа с файлами|`threading` или async-обёртки|Часто есть ожидание диска|\n|WebSocket / long polling|`asyncio`|Много долгоживущих соединений|\n|Web API на FastAPI|`asyncio`|Хорошо подходит под сетевой I/O|\n|Тяжёлые вычисления|`multiprocessing`|Можно задействовать несколько CPU-ядер|\n|Обработка изображений|`multiprocessing`, если чистый Python/CPU|Задача грузит CPU|\n|Парсинг большого файла с тяжёлой логикой|`multiprocessing`|Много вычислений|\n|Несколько блокирующих библиотек|`threading`|Можно вынести блокирующие вызовы в потоки|\n\n### Асинхронность\n\nАсинхронность в Python обычно означает `asyncio`: `async def`, `await`, event loop, `Task`, `Future`.\n\n`asyncio` хорошо подходит для I/O-bound и сетевого кода. В официальной документации Python сказано, что `asyncio` используется для конкурентного кода через `async/await` и часто хорошо подходит для I/O-bound и высокоуровневого сетевого кода. \n\nПример задачи:\n\n```python\nimport asyncio\nimport httpx\n\nasync def fetch(url):\n    async with httpx.AsyncClient() as client:\n        response = await client.get(url)\n        return response.status_code\n\nasync def main():\n    results = await asyncio.gather(\n        fetch(\"https://example.com\"),\n        fetch(\"https://python.org\"),\n    )\n    print(results)\n\nasyncio.run(main())\n```\n\nСмысл:\n\n```text\nодна корутина ждёт ответ от сети\n↓\nevent loop переключается на другую корутину\n↓\nCPU не простаивает зря\n```\n\nАсинхронность не ускоряет тяжёлые вычисления сама по себе. Если внутри `async def` написать долгий CPU-bound цикл без `await`, он заблокирует event loop.\n\nПлохой вариант:\n\n```python\nasync def handler():\n    result = heavy_cpu_calculation()\n    return result\n```\n\nЛучше вынести тяжёлую CPU-задачу в процесс, а блокирующую I/O-задачу — в поток.\n\n### Многопоточность\n\n`threading` подходит для I/O-bound задач, особенно когда используешь синхронные блокирующие библиотеки.\n\nНапример:\n\n```text\nrequests\npsycopg2\nобычный boto3\nсинхронный SDK внешнего сервиса\n```\n\nОфициальная документация Python указывает, что `threading` полезен для I/O-bound задач, например файловых операций или сетевых запросов, где большая часть времени уходит на ожидание внешних ресурсов. \nПример:\n\n```python\nfrom concurrent.futures import ThreadPoolExecutor\nimport requests\n\ndef fetch(url):\n    response = requests.get(url)\n    return response.status_code\n\nurls = [\n    \"https://example.com\",\n    \"https://python.org\",\n]\n\nwith ThreadPoolExecutor(max_workers=10) as executor:\n    results = list(executor.map(fetch, urls))\n\nprint(results)\n```\n\nСмысл:\n\n```text\nThread 1 ждёт HTTP-ответ\nThread 2 ждёт HTTP-ответ\nThread 3 ждёт HTTP-ответ\n...\n```\n\nПока один поток ждёт сеть, другой может тоже выполнять полезную работу или ждать свой I/O.\n\nНо для CPU-bound задач обычный `threading` в CPython обычно не помогает: из-за GIL только один поток в процессе выполняет Python-байткод одновременно. Документация Python прямо указывает, что для лучшего использования многоядерных машин стоит использовать `multiprocessing` или `ProcessPoolExecutor`, а `threading` остаётся подходящей моделью для одновременного выполнения I/O-bound задач. \n\n### Мультипроцессность\n\n`multiprocessing` подходит для CPU-bound задач.\n\nПример:\n\n```python\nfrom concurrent.futures import ProcessPoolExecutor\n\ndef calc(n):\n    total = 0\n\n    for i in range(n):\n        total += i * i\n\n    return total\n\nif __name__ == \"__main__\":\n    with ProcessPoolExecutor(max_workers=4) as executor:\n        results = list(executor.map(calc, [10_000_000] * 4))\n\n    print(results)\n```\n\nСмысл:\n\n```text\nProcess 1 → CPU core 1\nProcess 2 → CPU core 2\nProcess 3 → CPU core 3\nProcess 4 → CPU core 4\n```\n\nВ Python с обычным GIL использование нескольких CPU-ядер обычно требует нескольких процессов или нативных расширений, которые отпускают GIL. Это указано в официальном глоссарии Python. \n\n`multiprocessing` даёт реальный параллелизм для Python-кода, но цена выше:\n\n```text\nбольше расход RAM\nдороже запуск процессов\nсложнее обмен данными\nнужна сериализация данных\n```\n\nДокументация Python показывает, что `multiprocessing.Pool` используется для распределения работы по процессам, а `ProcessPoolExecutor` даёт более высокоуровневый интерфейс для выполнения задач в фоновых процессах. \n\n### Как выбирать на практике\n\n```text\nЗадача ждёт сеть/БД/файл?\n    Да → I/O-bound\n        async-библиотеки есть?\n            Да → asyncio\n            Нет → threading / ThreadPoolExecutor\n\nЗадача грузит CPU?\n    Да → CPU-bound\n        multiprocessing / ProcessPoolExecutor\n\nЗадача смешанная?\n    I/O часть → asyncio/threading\n    CPU часть → вынести в процессы\n```\n\n### Пример смешанной задачи\n\nДопустим, надо:\n\n```text\n1. скачать 1000 страниц\n2. распарсить HTML\n3. посчитать тяжёлую статистику\n4. сохранить результат в БД\n```\n\nРазделение:\n\n```text\nскачать страницы        → asyncio\nтяжёлый парсинг/расчёт  → ProcessPoolExecutor\nсохранить в БД          → asyncio, если async-драйвер\n```\n\nУпрощённая схема:\n\n```text\nasyncio event loop\n ├── скачивает данные\n ├── ждёт сеть/БД\n └── отправляет тяжёлую CPU-работу в process pool\n```\n\n### Что выбрать для backend\n\nДля обычного backend на Python:\n\n```text\nFastAPI + async DB driver + httpx.AsyncClient\n    → asyncio\n\nDjango/DRF с синхронными ORM-вызовами\n    → обычный sync-код + workers/threads на уровне сервера\n\nТяжёлая обработка файлов/изображений\n    → отдельный worker/process pool/Celery workers\n\nМного внешних API через синхронные SDK\n    → ThreadPoolExecutor или отдельные workers\n```\n\n### Ключевая формула\n\n```text\nasyncio\n= много ожидания, мало CPU, async-библиотеки\n\nthreading\n= много ожидания, но библиотеки синхронные/блокирующие\n\nmultiprocessing\n= много CPU, нужно использовать несколько ядер\n```\n\nСамая частая ошибка:\n\n```text\nCPU-bound задачу класть в asyncio\n```\n\n`asyncio` не делает вычисления параллельными. Оно эффективно тогда, когда задачи часто отдают управление на `await`, то есть ждут I/O."
  popularity = 10.53

[[questions]]
  id = 10
  question = "Что такое и зачем нужны потоки в Python?"
  answer = "### Что такое поток\n\nПоток в Python — это отдельная линия выполнения внутри одного процесса.\n\nУпрощённо:\n\n```text\nProcess\n ├── Main Thread\n ├── Thread 1\n ├── Thread 2\n └── Thread 3\n```\n\nОдин процесс может иметь несколько потоков. Эти потоки выполняют разные функции, но живут внутри одного процесса и используют общую память.\n\nДокументация Python описывает `threading` как модуль для запуска нескольких потоков внутри одного процесса; потоки особенно полезны для I/O-bound задач — например, сетевых запросов и файловых операций. \n\n### Зачем нужны потоки\n\nПотоки нужны, чтобы программа могла выполнять несколько задач конкурентно.\n\nНапример, без потоков:\n\n```text\nскачать файл 1\n↓\nдождаться завершения\n↓\nскачать файл 2\n↓\nдождаться завершения\n↓\nскачать файл 3\n```\n\nС потоками:\n\n```text\nThread 1 → скачивает файл 1\nThread 2 → скачивает файл 2\nThread 3 → скачивает файл 3\n```\n\nПока один поток ждёт ответ от сети, другой поток тоже может выполнять работу или ждать свой ответ.\n\n### Пример\n\n```python\nimport threading\nimport time\n\ndef task(name):\n    print(f\"{name}: start\")\n    time.sleep(2)\n    print(f\"{name}: end\")\n\nt1 = threading.Thread(target=task, args=(\"Thread 1\",))\nt2 = threading.Thread(target=task, args=(\"Thread 2\",))\n\nt1.start()\nt2.start()\n\nt1.join()\nt2.join()\n\nprint(\"Done\")\n```\n\nЧто происходит:\n\n```text\nt1.start() → запускает первый поток\nt2.start() → запускает второй поток\n\nt1.join()  → ждём завершения первого потока\nt2.join()  → ждём завершения второго потока\n```\n\nОба потока могут “спать” одновременно, поэтому программа завершится примерно за 2 секунды, а не за 4.\n\n### Где потоки полезны\n\nПотоки хорошо подходят для I/O-bound задач:\n\n```text\nHTTP-запросы\nзапросы к БД\nчтение/запись файлов\nработа с сокетами\nожидание внешнего API\nфоновые задачи в приложении\n```\n\nПример с HTTP:\n\n```python\nfrom concurrent.futures import ThreadPoolExecutor\nimport requests\n\ndef fetch(url):\n    response = requests.get(url)\n    return response.status_code\n\nurls = [\n    \"https://example.com\",\n    \"https://python.org\",\n]\n\nwith ThreadPoolExecutor(max_workers=4) as executor:\n    results = list(executor.map(fetch, urls))\n\nprint(results)\n```\n\n`ThreadPoolExecutor` использует пул потоков для асинхронного выполнения вызовов, то есть позволяет отправлять задачи в фоновые потоки через более удобный интерфейс, чем ручное создание `Thread`. \n\n### Почему потоки не всегда ускоряют код\n\nВ обычном CPython есть GIL — Global Interpreter Lock.\n\nИз-за GIL в одном процессе только один поток одновременно выполняет Python-байткод. Поэтому потоки обычно не дают сильного ускорения для CPU-bound задач. Это прямо указано в документации Python: GIL ограничивает выгоду `threading` для CPU-bound задач, хотя потоки остаются полезными для I/O-bound сценариев. \n\nCPU-bound пример:\n\n```python\ndef calc():\n    total = 0\n\n    for i in range(100_000_000):\n        total += i * i\n\n    return total\n```\n\nДля такой задачи `threading` обычно не лучший выбор.\n\nСхема:\n\n```text\nThread 1 хочет выполнять Python-код\nThread 2 хочет выполнять Python-код\nThread 3 хочет выполнять Python-код\n\nНо GIL разрешает выполнять Python-байткод только одному потоку за раз\n```\n\nДля CPU-bound задач чаще используют:\n\n```text\nmultiprocessing\nProcessPoolExecutor\n```\n\n### Важное свойство потоков: общая память\n\nПотоки внутри одного процесса видят одни и те же объекты:\n\n```python\nimport threading\n\ncounter = 0\n\ndef increment():\n    global counter\n\n    for _ in range(100_000):\n        counter += 1\n\nthreads = [\n    threading.Thread(target=increment),\n    threading.Thread(target=increment),\n]\n\nfor thread in threads:\n    thread.start()\n\nfor thread in threads:\n    thread.join()\n\nprint(counter)\n```\n\nНа первый взгляд кажется, что результат всегда должен быть:\n\n```text\n200000\n```\n\nНо при работе с общими изменяемыми данными могут возникать race condition.\n\nПроблема в том, что операция:\n\n```python\ncounter += 1\n```\n\nлогически состоит из нескольких шагов:\n\n```text\nпрочитать counter\nувеличить значение\nзаписать обратно\n```\n\nЕсли потоки вмешаются друг в друга между этими шагами, результат может стать некорректным.\n\n### Для защиты используют Lock\n\n```python\nimport threading\n\ncounter = 0\nlock = threading.Lock()\n\ndef increment():\n    global counter\n\n    for _ in range(100_000):\n        with lock:\n            counter += 1\n\nthreads = [\n    threading.Thread(target=increment),\n    threading.Thread(target=increment),\n]\n\nfor thread in threads:\n    thread.start()\n\nfor thread in threads:\n    thread.join()\n\nprint(counter)\n```\n\n`Lock` защищает критическую секцию:\n\n```text\nодин поток вошёл в with lock\n↓\nдругие ждут\n↓\nпервый поток закончил\n↓\nследующий поток входит\n```\n\n### Потоки vs процессы\n\n```text\nthreading\n= несколько потоков внутри одного процесса\n= общая память\n= хорошо для I/O-bound\n= хуже для CPU-bound из-за GIL\n\nmultiprocessing\n= несколько отдельных процессов\n= отдельная память\n= лучше для CPU-bound\n= дороже по памяти и запуску\n```\n\n### Потоки vs asyncio\n\n```text\nthreading\n= вытесняющая многозадачность потоков ОС\n\nasyncio\n= кооперативная многозадачность через await\n```\n\nВ потоках переключение может произойти неявно:\n\n```text\nThread 1 работает\n↓\nОС/интерпретатор переключил выполнение\n↓\nThread 2 работает\n```\n\nВ `asyncio` переключение обычно видно явно:\n\n```python\nawait something()\n```\n\n### Когда использовать потоки\n\nПотоки стоит использовать, когда:\n\n```text\nзадача часто ждёт внешний ресурс\nиспользуются синхронные библиотеки\nнужно не блокировать основной поток\nнужно выполнить несколько I/O-операций конкурентно\n```\n\nПримеры:\n\n```text\nскачать много URL через requests\nсделать много запросов к синхронной БД\nработать с несколькими файлами\nвынести блокирующую операцию из основного потока\n```\n\n### Когда не стоит использовать потоки\n\nПотоки не лучший выбор, когда:\n\n```text\nзадача тяжёлая по CPU\nмного общего изменяемого состояния\nнужен простой и предсказуемый порядок выполнения\nможно использовать нормальные async-библиотеки\n```\n\nДля CPU-bound:\n\n```text\nProcessPoolExecutor / multiprocessing\n```\n\nДля async I/O:\n\n```text\nasyncio\n```\n\n### Итог\n\nПотоки в Python нужны для конкурентного выполнения задач внутри одного процесса.\n\nГлавная польза:\n\n```text\nне простаивать во время ожидания I/O\nвыполнять блокирующие операции в фоне\nобрабатывать несколько внешних операций одновременно\n```\n\nГлавное ограничение:\n\n```text\nиз-за GIL потоки обычно не ускоряют CPU-bound Python-код\n```\n\nФормула выбора:\n\n```text\nмного ожидания I/O + синхронные библиотеки → threading\n\nмного ожидания I/O + async-библиотеки → asyncio\n\nмного CPU-вычислений → multiprocessing\n```"
  popularity = 5.26

