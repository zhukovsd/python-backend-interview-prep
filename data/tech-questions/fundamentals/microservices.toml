[[questions]]
  id = 6
  question = "Какие есть риски безопасности при выделении микросервиса?"
  answer = "### Главный риск\n\nПри выделении микросервиса внутренняя граница монолита превращается в **сетевую границу**:\n\n```text\nДо:\n\nOrders Module ──вызов функции──> Payments Module\n```\n\n```text\nПосле:\n\nOrder Service ──HTTP / gRPC / broker──> Payment Service\n```\n\nПоявляются новые API, сетевые соединения, сервисные учётные данные, отдельный CI/CD, контейнеры, логи и инфраструктурные настройки. Поэтому поверхность атаки обычно увеличивается, даже если бизнес-логика почти не изменилась.\n\n### 1. Доверие ко «внутренней сети»\n\nОдна из самых опасных ошибок:\n\n```text\nЗапрос пришёл из внутренней сети\n        ↓\nзначит, ему можно доверять\n```\n\nЗлоумышленник, получивший доступ к одному сервису, контейнеру или узлу, сможет обращаться к другим внутренним API.\n\nКаждый запрос между сервисами нужно отдельно:\n\n- аутентифицировать;\n    \n- авторизовать;\n    \n- проверять по конкретному действию и ресурсу;\n    \n- ограничивать на сетевом уровне.\n    \n\nZero Trust исключает автоматическое доверие только на основании сетевого расположения. NIST рекомендует защищать конкретные ресурсы и сервисы, а не считать внутренний сегмент доверенной зоной.\n\nПредпочтительная схема:\n\n```text\nService A\n   │\n   │ mTLS + короткоживущий токен\n   ▼\nService B\n   │\n   ├── проверяет личность Service A\n   ├── проверяет audience токена\n   ├── проверяет scope\n   └── проверяет бизнес-права\n```\n\n### 2. Потеря авторизации при переносе логики\n\nВ монолите проверка могла неявно выполняться выше по стеку:\n\n```python\ndef endpoint(current_user):\n    check_user_permissions(current_user)\n    payment_service.refund(payment_id)\n```\n\nПри выделении сервиса разработчики иногда переносят только нижнюю операцию:\n\n```http\nPOST /payments/42/refund\n```\n\nНо забывают перенести проверку:\n\n```text\nможет ли этот пользователь вернуть данный платёж;\nпринадлежит ли платёж его организации;\nимеет ли вызывающий сервис право запускать возврат;\nразрешён ли возврат в текущем состоянии.\n```\n\nВ результате возникает Broken Object Level Authorization или Broken Function Level Authorization: атакующий меняет идентификатор объекта либо вызывает административную операцию без достаточных прав. Эти категории входят в OWASP API Security Top 10. \n\nПроверка должна выполняться **в конечном сервисе**, а не только в Gateway:\n\n```python\nasync def refund_payment(\n    payment_id: UUID,\n    caller: ServiceIdentity,\n    subject: UserIdentity,\n) -> None:\n    payment = await repository.get(payment_id)\n\n    if \"payments:refund\" not in caller.scopes:\n        raise ForbiddenError()\n\n    if payment.customer_id != subject.id:\n        raise ForbiddenError()\n\n    if not payment.can_be_refunded():\n        raise InvalidPaymentState()\n```\n\n### 3. Неправильная передача пользовательского контекста\n\nЦепочка может выглядеть так:\n\n```text\nUser → Order Service → Payment Service\n```\n\n`Payment Service` должен понимать:\n\n```text\nкто пользователь;\nкакой сервис вызвал операцию;\nдля какого API предназначен токен;\nчто именно разрешено.\n```\n\nОпасный вариант:\n\n```http\nX-User-ID: 42\n```\n\nЕсли `Payment Service` принимает такой заголовок без аутентификации вызывающего сервиса, его можно подделать.\n\nДругой риск — передавать один универсальный JWT всем сервисам с широкими ролями:\n\n```json\n{\n  \"aud\": \"*\",\n  \"roles\": [\"admin\"]\n}\n```\n\nБезопаснее использовать:\n\n- отдельную identity сервиса;\n    \n- токены с конкретным `aud`;\n    \n- минимальные scopes;\n    \n- короткий срок жизни;\n    \n- token exchange для downstream-вызовов;\n    \n- проверку прав в каждом сервисе.\n    \n\nOWASP рекомендует централизовать выдачу идентичностей, но не переносить всё решение об авторизации в одну точку: конечный сервис должен контролировать доступ к собственным ресурсам. \n\n### 4. Слабая аутентификация Service-to-Service\n\nПосле выделения сервису требуются собственные credentials. Частая временная реализация:\n\n```env\nSERVICE_TOKEN=super-secret-static-token\n```\n\nПроблемы:\n\n- один секрет используют несколько сервисов;\n    \n- невозможно определить реального вызывающего;\n    \n- секрет редко ротируется;\n    \n- утечка даёт длительный доступ;\n    \n- права обычно слишком широкие.\n    \n\nБолее безопасные варианты:\n\n```text\nOAuth 2.0 Client Credentials;\nworkload identity;\nкороткоживущие ServiceAccount-токены;\nmTLS;\nSPIFFE/SPIRE;\nprivate_key_jwt.\n```\n\nПри mTLS обе стороны подтверждают свою идентичность, но одного mTLS недостаточно: валидный сертификат идентифицирует сервис, однако не определяет, какие операции ему разрешены. Поэтому mTLS необходимо сочетать с authorization policy или токенами прав. \n\n### 5. Незашифрованный внутренний трафик\n\nПосле декомпозиции данные начинают передаваться по сети:\n\n```text\nOrder Service → Payment Service\n```\n\nВ трафике могут находиться:\n\n- JWT;\n    \n- персональные данные;\n    \n- номера заказов;\n    \n- внутренние идентификаторы;\n    \n- платёжные сведения;\n    \n- служебные команды.\n    \n\nДаже внутренние HTTP-вызовы следует защищать TLS. Для чувствительных или привилегированных взаимодействий применяется mTLS, при котором клиент также предъявляет сертификат. OWASP требует использовать TLS для защищённых веб-сервисов и отдельно указывает на возможность клиентских сертификатов для высокопривилегированных API. \n\n### 6. Слишком широкие сетевые разрешения\n\nПосле выделения нередко получается:\n\n```text\nлюбой Pod → любой Pod → любой порт\n```\n\nТогда компрометация одного небольшого сервиса даёт возможность сканировать и атаковать всю внутреннюю систему.\n\nНужен принцип `default deny`:\n\n```text\nOrder Service:\nможет обращаться к Inventory Service и Payment Service\n\nNotification Service:\nне может обращаться к Payment DB\n\nExternal Gateway:\nне может напрямую обращаться к внутренней БД\n```\n\nВ Kubernetes для этого используются `NetworkPolicy`, если сетевой плагин поддерживает их. Kubernetes относит NetworkPolicy к штатным механизмам ограничения сетевого взаимодействия между Pod. \n\nПример логики:\n\n```text\nПо умолчанию всё запрещено\n        ↓\nявно разрешены только необходимые связи\n```\n\n### 7. Слишком широкие права к базе данных\n\nВо время миграции новый сервис часто временно получает доступ ко всей базе монолита:\n\n```text\nnotification-service\n    └── доступ: SELECT, INSERT, UPDATE, DELETE ко всей main_db\n```\n\nЕсли сервис будет взломан, атакующий получит доступ не только к уведомлениям, но и к пользователям, заказам или платежам.\n\nНужно выдавать отдельную учётную запись БД:\n\n```sql\nGRANT SELECT, INSERT, UPDATE\nON notification_schema.notification_jobs\nTO notification_service;\n```\n\nНе следует выдавать:\n\n```sql\nGRANT ALL PRIVILEGES ON DATABASE main_db;\n```\n\nНа переходном этапе особенно важно определить:\n\n```text\nкакие таблицы принадлежат монолиту;\nкакие — новому сервису;\nкто может читать;\nкто может писать;\nкогда временные права будут отозваны.\n```\n\n### 8. Shared Database сохраняет боковой доступ к данным\n\nИногда сервис отделили на уровне кода, но оставили ему прямой доступ к таблицам монолита:\n\n```text\nPayment Service ──SQL──> users\nPayment Service ──SQL──> orders\nPayment Service ──SQL──> audit_logs\n```\n\nЭто не только архитектурная, но и security-проблема:\n\n- сервис обходит авторизацию владельца данных;\n    \n- можно изменить данные без бизнес-проверок;\n    \n- трудно настроить минимальные привилегии;\n    \n- компрометация одного сервиса затрагивает несколько доменов.\n    \n\nЦелевой вариант:\n\n```text\nPayment Service → собственная БД\nOrder Service   → собственная БД\n\nOrder Service ──API/event──> Payment Service\n```\n\n### 9. Небезопасная миграция и копирование данных\n\nВо время выделения данные часто:\n\n- экспортируются в файлы;\n    \n- копируются через временные скрипты;\n    \n- загружаются в новую БД;\n    \n- дублируются в старой и новой системах;\n    \n- сравниваются через технические логи.\n    \n\nРиски:\n\n```text\nдамп БД остался на сервере;\nвременный bucket открыт;\nмиграционный пользователь имеет избыточные права;\nданные передаются без TLS;\nперсональные данные попали в логи;\nтестовая среда получила production-данные.\n```\n\nДля миграции нужно определить отдельный security-план:\n\n```text\nшифрование при передаче и хранении;\nвременные credentials;\nминимальные права;\nаудит доступа;\nсрок удаления дампов;\nпроверка контрольных сумм;\nмаскирование чувствительных данных;\nпроцедура отзыва доступов после миграции.\n```\n\n### 10. Dual write и подмена состояния\n\nОпасная переходная схема:\n\n```python\nsave_to_monolith(data)\nsave_to_microservice(data)\n```\n\nКроме потери согласованности, она создаёт security-неопределённость:\n\n```text\nгде находится источник истины;\nкакая система принимает решение о правах;\nчто произойдёт при конфликтующих значениях;\nможно ли изменить старую запись и обойти новый сервис.\n```\n\nНапример:\n\n```text\nВ новой системе пользователь заблокирован\nВ старой системе пользователь активен\n```\n\nЕсли часть запросов всё ещё использует старую таблицу, блокировку можно фактически обойти.\n\nВо время сосуществования необходимо явно определить:\n\n```text\nодин источник истины;\nодного владельца записи;\nпорядок переключения чтения и записи;\nзапрет обратной записи после cutover;\nавтоматическую проверку расхождений.\n```\n\n### 11. Небезопасные события и брокер сообщений\n\nПосле выделения синхронный вызов часто заменяют событием:\n\n```json\n{\n  \"type\": \"PaymentSucceeded\",\n  \"user_id\": \"42\",\n  \"amount\": 5000\n}\n```\n\nНужно защищать не только HTTP API, но и брокер:\n\n- аутентифицировать producer и consumer;\n    \n- разделять права публикации и чтения;\n    \n- ограничивать доступ по topic или queue;\n    \n- проверять схему сообщения;\n    \n- не доверять полям события автоматически;\n    \n- защищаться от повторной доставки;\n    \n- применять идемпотентность;\n    \n- шифровать чувствительные данные.\n    \n\nОпасная конфигурация:\n\n```text\nлюбой сервис может публиковать PaymentSucceeded\n```\n\nТогда скомпрометированный сервис сможет отправить поддельное финансовое событие.\n\nПредпочтительно:\n\n```text\nТолько Payment Service:\npublish → payments.succeeded\n\nNotification Service:\nconsume → payments.succeeded\nне может publish\n```\n\n### 12. Повторная доставка и replay-атаки\n\nHTTP-запрос или событие может быть отправлено повторно:\n\n```text\nPaymentRequested\nPaymentRequested\nPaymentRequested\n```\n\nПричиной может быть нормальный retry или намеренная replay-атака.\n\nДля денежных и других критичных операций нужны:\n\n```text\nidempotency_key;\nуникальный event_id;\ntimestamp;\nограниченный срок действия;\nзащита от повторного nonce;\nтаблица обработанных сообщений.\n```\n\nПример:\n\n```sql\nCREATE TABLE processed_messages (\n    message_id UUID PRIMARY KEY,\n    processed_at TIMESTAMPTZ NOT NULL\n);\n```\n\nБез идемпотентности повторная доставка может привести к повторному списанию, отправке или созданию ресурса.\n\n### 13. Отсутствие ограничений ресурсов\n\nВызов функции внутри монолита редко был публичной точкой потребления ресурсов. После выделения появляется API:\n\n```http\nPOST /reports/generate\nPOST /images/process\nPOST /notifications/send\n```\n\nБез ограничений атакующий или неисправный сервис может исчерпать:\n\n- CPU;\n    \n- память;\n    \n- пул подключений;\n    \n- очередь;\n    \n- дисковое пространство;\n    \n- платные внешние API.\n    \n\nOWASP относит unrestricted resource consumption к основным API-рискам. \n\nНеобходимы:\n\n```text\nrate limiting;\nлимиты размера запроса;\nтайм-ауты;\nограничения concurrency;\nквоты;\nлимит количества элементов в batch;\nлимит числа retries;\ncircuit breaker;\nлимиты CPU и памяти контейнера.\n```\n\n### 14. SSRF и неограниченный исходящий трафик\n\nНовый сервис может принимать URL:\n\n```json\n{\n  \"callback_url\": \"http://...\"\n}\n```\n\nили обращаться к внешним ресурсам:\n\n```text\nwebhook;\nобъектное хранилище;\nплатёжный провайдер;\nвнешний REST API.\n```\n\nПри SSRF атакующий заставляет сервис обращаться к внутренним адресам, metadata endpoint облака или административным API.\n\nНужны:\n\n- allowlist допустимых доменов;\n    \n- запрет loopback и внутренних диапазонов;\n    \n- повторная проверка после DNS resolution;\n    \n- ограничение редиректов;\n    \n- egress-фильтрация;\n    \n- отдельные credentials для внешних интеграций.\n    \n\nSSRF входит в OWASP API Security Top 10, наряду с небезопасным потреблением внешних API. \n\n### 15. Утечка секретов\n\nПри выделении появляются новые:\n\n```text\nпароли БД;\nAPI keys;\nOAuth client secrets;\nJWT private keys;\nсертификаты;\nключи брокера;\ncloud credentials.\n```\n\nРиски:\n\n```text\nсекрет записан в Git;\nсекрет находится в Dockerfile;\nсекрет попал в image layer;\nсекрет напечатан в CI-логе;\nвсе Pod читают общий Secret;\nсекрет не ротируется.\n```\n\nДля Kubernetes рекомендуется:\n\n- шифровать Secrets at rest;\n    \n- применять минимальные RBAC-права;\n    \n- ограничивать доступ конкретными ServiceAccount;\n    \n- не выдавать `list` и `watch` без необходимости;\n    \n- использовать внешнее хранилище секретов, когда это оправдано;\n    \n- регулярно ротировать credentials.\n    \n\nKubernetes прямо рекомендует шифрование Secrets at rest и least-privilege-доступ. \n\n### 16. Избыточные Kubernetes-права\n\nТипичная ошибка:\n\n```text\nServiceAccount микросервиса\n        ↓\ncluster-admin\n```\n\nТогда уязвимость в приложении может позволить:\n\n- читать Secrets;\n    \n- создавать привилегированные Pod;\n    \n- изменять RBAC;\n    \n- атаковать другие namespaces;\n    \n- получить контроль над кластером.\n    \n\nКаждому сервису нужен отдельный `ServiceAccount` и минимальный набор разрешений.\n\nKubernetes отдельно предупреждает, что выдача всем ServiceAccount прав `cluster-admin` позволяет приложениям читать секреты и изменять разрешения всего кластера. \n\n### 17. Небезопасная конфигурация контейнера\n\nНовый сервис часто впервые контейнеризируется. Опасные настройки:\n\n```yaml\nsecurityContext:\n  privileged: true\n```\n\nили:\n\n```text\nзапуск от root;\nhostNetwork;\nhostPID;\nmount docker.sock;\nзаписываемая корневая файловая система;\nдобавленные Linux capabilities;\nнеограниченный доступ к hostPath.\n```\n\nДля большинства сервисов предпочтительно:\n\n```text\nrunAsNonRoot;\nreadOnlyRootFilesystem;\nallowPrivilegeEscalation: false;\ndrop всех ненужных capabilities;\nseccomp profile;\nограничения CPU и памяти.\n```\n\nKubernetes Pod Security Standards определяют уровни `Baseline` и `Restricted`, направленные на предотвращение известных способов повышения привилегий и усиление изоляции Pod. \n\n### 18. Уязвимости цепочки поставки\n\nКаждый выделенный сервис получает собственные:\n\n```text\nDockerfile;\nbase image;\nзависимости;\nCI/CD pipeline;\nregistry;\ndeploy manifests.\n```\n\nЧем больше сервисов, тем больше артефактов и зависимостей нужно обновлять и контролировать.\n\nРиски:\n\n- уязвимый base image;\n    \n- dependency confusion;\n    \n- скомпрометированный пакет;\n    \n- подмена контейнерного образа;\n    \n- утечка CI/CD-токена;\n    \n- незафиксированные версии зависимостей;\n    \n- deployment непроверенного артефакта.\n    \n\nOWASP относит к угрозам цепочки поставки компрометацию upstream-инфраструктуры, dependency confusion и атаки на CI/CD. Рекомендуются автоматическое сканирование, SBOM, проверка provenance и подпись артефактов. \n\n### 19. Утечка данных через логи и tracing\n\nВ распределённой системе обычно добавляются централизованные логи и tracing. Разработчики могут случайно записать:\n\n```text\nAuthorization header;\nJWT;\nпароль;\nномер карты;\nemail;\nполное тело запроса;\nперсональные данные;\nconnection string.\n```\n\nТеперь данные копируются в отдельную систему логирования, к которой может иметь доступ больше сотрудников и сервисов.\n\nНужно:\n\n```text\nмаскировать чувствительные поля;\nне логировать access/refresh tokens;\nфильтровать заголовки;\nограничивать доступ к логам;\nопределить срок хранения;\nшифровать лог-хранилище;\nне записывать payload целиком по умолчанию.\n```\n\n### 20. Старый и новый endpoint работают одновременно\n\nПри Strangler Fig некоторое время существуют две реализации:\n\n```text\n/api/payments         → монолит\n/internal/payments    → новый сервис\n```\n\nРиски:\n\n- старая версия имеет слабую авторизацию;\n    \n- один endpoint забыли отключить;\n    \n- правила в старой и новой версиях различаются;\n    \n- внутренний endpoint случайно опубликован наружу;\n    \n- feature flag можно обойти;\n    \n- старый сервис продолжает изменять данные после cutover.\n    \n\nПосле переключения необходимо удалить или заблокировать:\n\n```text\nстарые маршруты;\nстарые credentials;\nвременные DB-права;\nдвойную запись;\nмиграционные учётные записи;\nвременные очереди;\nотладочные endpoint;\nfeature flags.\n```\n\n### Что проверить до выделения\n\nМинимальный security-чек-лист:\n\n```text\n[ ] Определена threat model нового сервиса\n[ ] Все входящие соединения перечислены\n[ ] Все исходящие соединения перечислены\n[ ] У сервиса есть отдельная identity\n[ ] Межсервисный трафик защищён TLS/mTLS\n[ ] Каждый endpoint проверяет authorization\n[ ] Проверяются issuer, audience, expiry и scopes токена\n[ ] Настроен default-deny на сетевом уровне\n[ ] У БД отдельная учётная запись с минимальными правами\n[ ] Определён единственный владелец данных\n[ ] Secrets не находятся в Git и контейнерных образах\n[ ] Сообщения брокера аутентифицированы и авторизованы\n[ ] Критические операции идемпотентны\n[ ] Настроены rate limits и resource limits\n[ ] Контейнер запускается без root и лишних capabilities\n[ ] Зависимости и образы сканируются\n[ ] Артефакты подписываются или проверяется provenance\n[ ] Логи не содержат токены и персональные данные\n[ ] Есть аудит действий и алерты\n[ ] Временные доступы удаляются после миграции\n[ ] Есть безопасный rollback\n```\n\n### Итог\n\nНаиболее критичные риски при выделении микросервиса:\n\n```text\n1. Внутренний API становится новой точкой атаки\n2. Теряется или дублируется авторизация монолита\n3. Сервисы получают чрезмерные права\n4. Появляются новые секреты и credentials\n5. Данные небезопасно мигрируют или дублируются\n6. Брокер принимает поддельные или повторные события\n7. Сетевое доверие позволяет lateral movement\n8. Контейнер и CI/CD создают новую supply-chain поверхность\n9. Логи и tracing начинают раскрывать чувствительные данные\n10. Старая и новая реализации расходятся по правилам безопасности\n```\n\nГлавный принцип:\n\n```text\nВыделение микросервиса должно создавать\nне только новую границу развёртывания,\nно и новую явно защищённую границу доверия.\n```\n\nAPI Gateway, внутренняя сеть или Kubernetes namespace сами по себе не являются достаточной защитой. Каждый сервис должен иметь собственную идентичность, минимальные права и самостоятельно проверять доступ к принадлежащим ему операциям и данным."
