[[questions]]
  id = 1
  question = "Почему shared database считается плохой практикой для микросервисов?"
  answer = "### Что означает Shared Database\n\n`Shared Database` — это подход, при котором несколько микросервисов напрямую работают с одной схемой или с общими таблицами:\n\n```text\nOrder Service ───┐\nPayment Service ─┼──> Общая БД\nUser Service ────┘\n```\n\nПроблема не обязательно в том, что сервисы используют один физический сервер PostgreSQL. Они могут находиться на одном сервере, но владеть разными схемами или базами. Плохой вариант — когда несколько сервисов напрямую читают и изменяют одни и те же таблицы. Microsoft отдельно отмечает, что совместное использование физического сервера допустимо; связь возникает именно при общей схеме и общих таблицах. \n\n### 1. Сервисы перестают быть независимыми\n\nГлавная идея микросервисов — возможность независимо изменять, тестировать, развертывать и масштабировать каждый сервис.\n\nПредставим общую таблицу:\n\n```sql\nCREATE TABLE users (\n    id BIGINT PRIMARY KEY,\n    username VARCHAR(100),\n    email VARCHAR(255)\n);\n```\n\nЕё используют:\n\n```text\nUser Service\nOrder Service\nNotification Service\nPayment Service\n```\n\n`User Service` решает переименовать поле:\n\n```sql\nALTER TABLE users\nRENAME COLUMN username TO login;\n```\n\nТеперь необходимо проверить и одновременно обновить все остальные сервисы, которые обращаются к `users.username`.\n\nПолучается:\n\n```text\nизменение одной таблицы\n        ↓\nизменение нескольких сервисов\n        ↓\nкоординированное развертывание\n```\n\nЭто называется связностью на этапе разработки и развертывания. AWS отмечает, что при общей базе изменения схемы приходится координировать между сервисами, поэтому команды не получают полной независимости.\n\n### 2. База данных превращается в скрытый API\n\nВ нормальной архитектуре взаимодействие выглядит так:\n\n```text\nOrder Service\n      │\n      │ HTTP / gRPC / событие\n      ▼\nUser Service\n      │\n      ▼\nUser Database\n```\n\n`User Service` контролирует:\n\n- правила доступа;\n    \n- валидацию;\n    \n- бизнес-логику;\n    \n- формат данных;\n    \n- совместимость API.\n    \n\nПри общей базе другой сервис может обойти владельца данных:\n\n```text\nOrder Service ──────> таблица users\n```\n\nНапример, вместо вызова:\n\n```http\nGET /users/42\n```\n\n`Order Service` делает:\n\n```sql\nSELECT * FROM users WHERE id = 42;\n```\n\nВ результате таблица фактически становится неформальным публичным интерфейсом. Любое изменение структуры таблицы может сломать потребителей, даже если официальный API сервиса не изменился.\n\nMicrosoft рекомендует считать данные собственностью конкретного сервиса и разрешать другим сервисам получать к ним доступ только через его API. \n\n### 3. Нарушается инкапсуляция бизнес-логики\n\nДопустим, `Payment Service` должен проводить платёж только через метод:\n\n```python\npayment_service.process_payment(...)\n```\n\nВнутри находятся проверки:\n\n```text\nбаланс достаточен\nаккаунт не заблокирован\nвалюта поддерживается\nоперация не является дубликатом\nлимит не превышен\n```\n\nНо другой сервис может напрямую выполнить:\n\n```sql\nUPDATE accounts\nSET balance = balance - 100\nWHERE id = 42;\n```\n\nОн изменит данные в обход:\n\n- доменных правил;\n    \n- аудита;\n    \n- идемпотентности;\n    \n- проверки блокировок;\n    \n- событий;\n    \n- разрешений.\n    \n\nТо есть сервис формально существует, но не контролирует собственное состояние.\n\n### 4. Возникает runtime coupling\n\nСервисы становятся связаны не только кодом, но и во время выполнения.\n\nНапример, `Order Service` запускает долгую транзакцию:\n\n```sql\nBEGIN;\n\nUPDATE customers\nSET status = 'active'\nWHERE id = 42;\n\n-- Длительная обработка\n\nCOMMIT;\n```\n\nВ это время `Customer Service` может ждать освобождения блокировки той же строки или таблицы.\n\n```text\nOrder Service держит блокировку\n               ↓\nCustomer Service ждёт\n               ↓\nувеличивается время ответа\n```\n\nAWS прямо приводит подобный пример: длительная транзакция одного сервиса может заблокировать операции другого сервиса, когда они используют одну базу.\n\n### 5. Общая БД становится общей точкой отказа\n\n```text\n               ┌─ User Service\nОбщая БД ──────┼─ Order Service\n               ├─ Payment Service\n               └─ Notification Service\n```\n\nЕсли база:\n\n- недоступна;\n    \n- перегружена;\n    \n- исчерпала пул подключений;\n    \n- столкнулась с проблемой репликации;\n    \n- выполняет тяжёлую миграцию;\n    \n- достигла предела CPU или I/O,\n    \n\nто одновременно начинают деградировать все сервисы.\n\nAWS указывает, что разделение хранилищ повышает устойчивость и не позволяет одной базе становиться единой точкой отказа всей системы. Azure также рассматривает общую перегруженную базу как потенциальное узкое место.\n\n### 6. Невозможно независимо масштабировать хранение данных\n\nДопустим:\n\n```text\nPayment Service     — 1 000 запросов/с\nCatalog Service     — 20 000 запросов/с\nNotification Service — 200 запросов/с\n```\n\nПри общей базе нагрузка смешивается:\n\n```text\nобщие CPU\nобщие IOPS\nобщий connection pool\nобщий кеш\nобщие блокировки\n```\n\nИнтенсивные запросы `Catalog Service` могут ухудшить работу `Payment Service`, хотя они принадлежат разным бизнес-доменам.\n\nПри раздельных хранилищах можно масштабировать только нужный сервис:\n\n```text\nCatalog Service → отдельные read replicas\nPayment Service → надёжная транзакционная БД\nNotification Service → небольшая БД\n```\n\nAWS относит независимое и более детальное масштабирование к преимуществам подхода `Database per Service`.\n\n### 7. Все сервисы привязываются к одной технологии\n\nОбщая база обычно заставляет всю систему использовать один тип хранилища:\n\n```text\nвсе сервисы → PostgreSQL\n```\n\nНо разные сервисы могут иметь разные требования:\n\n```text\nPayment Service  → PostgreSQL для ACID-транзакций\nCatalog Service  → документная БД\nCache Service    → Redis\nSearch Service   → поисковый движок\nAnalytics        → колоночное хранилище\n```\n\nОдин сервис может нуждаться в связях и ограничениях внешних ключей, другой — в большом количестве простых операций чтения, третий — в полнотекстовом поиске.\n\nИзоляция данных позволяет сервису выбрать модель хранения под конкретную нагрузку. Общая база ограничивает такую оптимизацию. \n\n### 8. Усложняются миграции\n\nПри отдельной базе сервис может самостоятельно выполнить:\n\n```text\nверсия сервиса 1 → миграция → версия сервиса 2\n```\n\nПри общей базе миграция должна учитывать все версии всех сервисов.\n\nНапример, нельзя сразу удалить колонку:\n\n```sql\nALTER TABLE users DROP COLUMN old_email;\n```\n\nПотому что одна из старых версий другого сервиса ещё может её использовать.\n\nПоэтому миграция обычно становится многоэтапной:\n\n```text\n1. Добавить новую колонку\n2. Обновить запись в обе колонки\n3. Обновить всех потребителей\n4. Дождаться завершения старых версий\n5. Перенести данные\n6. Удалить старую колонку\n```\n\nAWS указывает, что изменения общей схемы должны быть обратно совместимыми с текущими и предыдущими версиями всех зависимых микросервисов. \n\n### 9. Усложняется разделение ответственности команд\n\nДопустим:\n\n```text\nTeam A владеет User Service\nTeam B владеет Order Service\n```\n\nОбе команды изменяют таблицу `users`.\n\nВозникают вопросы:\n\n- кто владеет таблицей;\n    \n- кто утверждает миграции;\n    \n- кто отвечает за производительность;\n    \n- кто может добавлять индексы;\n    \n- кто отвечает при повреждении данных;\n    \n- какой сервис определяет бизнес-правила.\n    \n\nФормально сервисы разделены, но команды всё равно должны постоянно согласовывать изменения общей модели данных. AWS отмечает, что shared database не устраняет зависимости между командами.\n\n### 10. Сложнее обеспечить безопасность\n\nПри отдельной базе можно выдать сервису минимальные права:\n\n```text\nPayment Service → только payment_db\nOrder Service   → только order_db\n```\n\nПри общей базе сервис нередко получает доступ к данным, которые ему не принадлежат:\n\n```text\nOrder Service → users, payments, audit_logs, credentials\n```\n\nДаже если права ограничены на уровне таблиц, модель становится сложнее:\n\n```sql\nGRANT SELECT ON users TO order_service;\nGRANT SELECT, UPDATE ON orders TO order_service;\nGRANT INSERT ON audit_log TO order_service;\n```\n\nЧем больше сервисов и таблиц, тем сложнее контролировать принцип минимальных привилегий.\n\n### Почему тогда Shared Database вообще используют\n\nУ подхода есть преимущества:\n\n- проще выполнять SQL JOIN между данными разных доменов;\n    \n- проще обеспечивать ACID-транзакции;\n    \n- меньше инфраструктуры;\n    \n- проще резервное копирование;\n    \n- проще начать декомпозицию монолита;\n    \n- меньше сложностей с eventual consistency;\n    \n- не требуются Saga, Outbox и асинхронные события.\n    \n\nAWS допускает Shared Database как компромисс, например, при постепенном разделении монолита, необходимости сохранить общие ACID-транзакции или нежелании сразу полностью перерабатывать слой данных. \n\nПоэтому Shared Database — не безусловно запрещённый вариант. Он считается плохой практикой, когда система называется микросервисной, но сервисы не могут независимо изменяться и развертываться из-за общей схемы.\n\n### Предпочтительный подход: Database per Service\n\n```text\nUser Service ─────────> User DB\nOrder Service ────────> Order DB\nPayment Service ──────> Payment DB\nNotification Service ─> Notification DB\n```\n\nДругие сервисы не обращаются к этим базам напрямую:\n\n```text\nOrder Service ──API──> User Service\nOrder Service ──event─> Payment Service\n```\n\nПри этом `Database per Service` не обязательно означает отдельный физический сервер для каждого сервиса. Возможны варианты:\n\n```text\nОдин PostgreSQL-сервер\n├── user_db\n├── order_db\n└── payment_db\n```\n\nили:\n\n```text\nОдна база PostgreSQL\n├── user_schema\n├── order_schema\n└── payment_schema\n```\n\nКлючевое требование — исключительное владение данными:\n\n```text\nкаждая таблица имеет одного владельца;\nдругие сервисы не обращаются к ней напрямую.\n```\n\n### Цена Database per Service\n\nРазделение баз создаёт собственные сложности:\n\n- нельзя выполнять обычный `JOIN` между сервисами;\n    \n- распределённые транзакции становятся сложнее;\n    \n- появляется eventual consistency;\n    \n- требуется синхронизация данных;\n    \n- нужны Saga, Transactional Outbox, CQRS или API Composition;\n    \n- усложняется аналитика и отчётность;\n    \n- приходится эксплуатировать несколько хранилищ.\n    \n\nAWS прямо указывает сложность межсервисных транзакций и запросов как недостаток `Database per Service`. Для агрегированных запросов рекомендуются API Composition, CQRS или Event Sourcing. \n\n### Итог\n\nShared Database противоречит главным свойствам микросервисов:\n\n```text\nнезависимое изменение\nнезависимое развертывание\nнезависимое масштабирование\nинкапсуляция бизнес-логики\nизолированные отказы\nвладение данными\n```\n\nГлавная проблема формулируется так:\n\n```text\nСервисы разделены на уровне кода,\nно остаются монолитом на уровне данных.\n```\n\nПрактическое правило:\n\n```text\nОдин физический сервер БД            → допустимо\nОтдельная схема/база на сервис       → допустимо\nОбщие таблицы с прямым доступом       → сильная связанность\nДоступ к чужим данным через API/event → предпочтительно\n```"
  popularity = 2.63

[[questions]]
  id = 2
  question = "Как организуют аутентификацию и авторизацию между микросервисами?"
  answer = "### Основная идея\n\nВ микросервисной системе обычно существуют **две разные личности**:\n\n```text\n1. Пользователь, от имени которого выполняется операция\n2. Сервис, который фактически отправил запрос\n```\n\nПоэтому проверка часто состоит из двух уровней:\n\n```text\nАутентификация:\nкто отправил запрос?\n\nАвторизация:\nимеет ли этот пользователь или сервис право выполнить операцию?\n```\n\nТипичная архитектура использует:\n\n```text\nПользователи       → OpenID Connect\nДоступ к API       → OAuth 2.0 Access Token\nСервис → сервис    → OAuth 2.0 Client Credentials и/или mTLS\nПрава              → scopes, roles, permissions, политики\n```\n\nOpenID Connect добавляет аутентификацию пользователя поверх OAuth 2.0, тогда как OAuth 2.0 управляет делегированным доступом к защищённым ресурсам. \n\n### Общая схема\n\n```text\n                    ┌──────────────────────┐\n                    │ Identity Provider    │\n                    │ Keycloak / Auth0 /   │\n                    │ Entra ID / собственный│\n                    └──────────┬───────────┘\n                               │\n                         выдаёт токены\n                               │\n                               ▼\nПользователь ──> API Gateway ──> Order Service ──> Payment Service\n                     │                │                    │\n                     │                │                    │\n                проверка JWT     проверка JWT        проверка JWT\n                rate limit       бизнес-права        бизнес-права\n```\n\nПри этом API Gateway не должен быть единственным местом проверки. Конечный сервис также должен проверять, что токен предназначен именно ему и разрешает конкретную операцию.\n\n---\n\n### 1. Аутентификация пользователя\n\nПользователь проходит вход через Identity Provider:\n\n```text\nПользователь\n    │\n    ▼\nIdentity Provider\n    │\n    ├── проверяет пароль, MFA и сессию\n    │\n    └── выдаёт токены\n```\n\nОбычно клиент получает:\n\n```text\nID Token      — информация о факте аутентификации пользователя\nAccess Token  — право обращаться к API\nRefresh Token — получение новых Access Token\n```\n\nВ API необходимо передавать именно `Access Token`:\n\n```http\nAuthorization: Bearer <access-token>\n```\n\nИспользование bearer-токена в заголовке `Authorization` стандартизировано RFC 6750. Любой, кто завладеет bearer-токеном, сможет применить его, поэтому токен необходимо защищать при передаче и хранении.\n\n`ID Token` не следует использовать вместо `Access Token`: он предназначен прежде всего для клиента, который выполнял вход пользователя, а не для произвольных микросервисов.\n\n---\n\n### 2. Вызов сервиса от имени пользователя\n\nДопустим, пользователь создаёт заказ:\n\n```text\nПользователь\n    │ Access Token пользователя\n    ▼\nOrder Service\n```\n\nУпрощённое содержимое JWT может выглядеть так:\n\n```json\n{\n  \"iss\": \"https://auth.example.com\",\n  \"sub\": \"user-123\",\n  \"aud\": \"order-api\",\n  \"scope\": \"orders:read orders:create\",\n  \"roles\": [\"customer\"],\n  \"exp\": 1785100000\n}\n```\n\nЗдесь:\n\n```text\niss    — кто выдал токен\nsub    — субъект, обычно пользователь\naud    — для какого API предназначен токен\nscope  — разрешённые операции\nroles  — роли пользователя\nexp    — срок действия\n```\n\n`Order Service` должен проверить:\n\n```text\nподпись;\nissuer;\naudience;\nсрок действия;\nтип токена;\nнеобходимые scopes;\nдоменные ограничения.\n```\n\nНапример, наличие:\n\n```text\nscope = orders:create\n```\n\nещё не означает, что пользователь может изменить любой заказ. Сервис дополнительно проверяет владение ресурсом:\n\n```python\nif order.user_id != current_user.id:\n    raise ForbiddenError()\n```\n\nТо есть токен предоставляет общую возможность, а окончательное решение принимает бизнес-логика сервиса.\n\n---\n\n### 3. Технический вызов Service-to-Service\n\nПредставим фоновую задачу:\n\n```text\nOrder Service ──> Notification Service\n```\n\nПользователя в этом запросе может вообще не быть. `Order Service` действует от собственного имени.\n\nДля этого часто используется OAuth 2.0 `Client Credentials Grant`:\n\n```text\nOrder Service\n    │ client authentication\n    ▼\nAuthorization Server\n    │\n    └── Access Token для Notification Service\n```\n\nЗапрос токена концептуально выглядит так:\n\n```http\nPOST /oauth/token\nContent-Type: application/x-www-form-urlencoded\n\ngrant_type=client_credentials\n&scope=notifications:send\n```\n\nПосле чего:\n\n```http\nPOST /internal/notifications\nAuthorization: Bearer <service-access-token>\n```\n\nПример содержимого токена:\n\n```json\n{\n  \"iss\": \"https://auth.example.com\",\n  \"sub\": \"order-service\",\n  \"client_id\": \"order-service\",\n  \"aud\": \"notification-api\",\n  \"scope\": \"notifications:send\",\n  \"exp\": 1785100000\n}\n```\n\nOAuth 2.0 определяет `Client Credentials` для случаев, когда клиент действует от собственного имени либо получает доступ на основании заранее настроенных разрешений. \n\n### Где хранить credentials сервиса\n\nПростейший вариант:\n\n```text\nclient_id\nclient_secret\n```\n\nНо один долгоживущий секрет сложнее безопасно хранить, ротировать и отзывать.\n\nБолее сильные варианты:\n\n```text\nprivate_key_jwt;\nmTLS-сертификаты;\ncloud workload identity;\nSPIFFE/SPIRE;\nкороткоживущие ServiceAccount-токены Kubernetes.\n```\n\nАктуальная рекомендация OAuth Security BCP — по возможности применять асимметричную аутентификацию клиента, например mTLS или подписанный `private_key_jwt`, вместо обычного общего секрета. \n\nВ Kubernetes ServiceAccount может предоставлять workload identity процессам Pod; современные projected-токены являются короткоживущими и автоматически обновляются. \n\n---\n\n### 4. Вызов от имени пользователя через несколько сервисов\n\nБолее сложный случай:\n\n```text\nПользователь\n    │\n    ▼\nOrder Service\n    │\n    ▼\nPayment Service\n```\n\n`Payment Service` может нуждаться одновременно в информации:\n\n```text\nкакой пользователь инициировал платёж;\nкакой сервис отправил внутренний запрос.\n```\n\nСуществуют три основных подхода.\n\n#### Вариант 1. Передать исходный пользовательский токен\n\n```text\nUser Token\n    │\n    ├──> Order Service\n    └──> Payment Service\n```\n\nЭто допустимо, только когда токен изначально предназначен и для `Payment Service`.\n\nНапример:\n\n```json\n{\n  \"aud\": [\"order-api\", \"payment-api\"]\n}\n```\n\nНо слишком широкая `audience` увеличивает область применения украденного токена и связывает сервисы общей моделью прав.\n\nОбычно лучше выдавать токен для конкретного ресурса. RFC 8707 позволяет клиенту указывать целевой защищённый ресурс, чтобы Authorization Server ограничил audience токена. ([RFC Editor](https://www.rfc-editor.org/rfc/rfc8707.html?utm_source=chatgpt.com \"RFC 8707: Resource Indicators for OAuth 2.0\"))\n\n#### Вариант 2. Token Exchange\n\n`Order Service` обменивает пользовательский токен на новый токен для `Payment Service`:\n\n```text\nUser Access Token\n        │\n        ▼\nAuthorization Server\n        │\n        ▼\nPayment-specific Access Token\n```\n\nПример итогового токена:\n\n```json\n{\n  \"iss\": \"https://auth.example.com\",\n  \"sub\": \"user-123\",\n  \"aud\": \"payment-api\",\n  \"scope\": \"payments:create\",\n  \"act\": {\n    \"sub\": \"order-service\"\n  },\n  \"exp\": 1785100000\n}\n```\n\nЗдесь:\n\n```text\nsub — пользователь, от имени которого выполняется действие\nact — сервис, непосредственно действующий от его имени\n```\n\nOAuth 2.0 Token Exchange стандартизирует обмен одного токена на другой, включая сценарии делегирования и impersonation. \n\nЭто наиболее аккуратный вариант для цепочки:\n\n```text\nUser → Service A → Service B\n```\n\nПотому что `Service B` получает:\n\n```text\nсвою audience;\nограниченный scope;\nкороткий срок жизни;\nинформацию о пользователе;\nинформацию о вызывающем сервисе.\n```\n\n#### Вариант 3. Сервисный токен плюс пользовательский контекст\n\n`Order Service` использует собственный сервисный токен:\n\n```text\nAuthorization: Bearer <order-service-token>\n```\n\nА идентификатор пользователя передаёт отдельно:\n\n```http\nX-User-ID: user-123\n```\n\nТак делать безопасно только при строгих условиях:\n\n```text\nPayment Service доверяет Order Service;\nсоединение аутентифицировано через mTLS;\nпользовательский контекст нельзя принять извне напрямую;\nOrder Service имеет явное право действовать от имени пользователя.\n```\n\nПростой заголовок `X-User-ID` без криптографически подтверждённой личности сервиса нельзя считать надёжным: внешний клиент может подделать его.\n\n---\n\n### 5. mTLS между сервисами\n\nПри обычном TLS сервер показывает сертификат клиенту:\n\n```text\nклиент проверяет сервер\n```\n\nПри mutual TLS сертификаты предъявляют обе стороны:\n\n```text\nService A проверяет Service B\nService B проверяет Service A\n```\n\n```text\nOrder Service\n    │ сертификат Order Service\n    │\n    │ защищённое соединение\n    │\n    ▼\nPayment Service\n    сертификат Payment Service\n```\n\nmTLS обеспечивает:\n\n```text\nшифрование канала;\nцелостность трафика;\nаутентификацию вызывающего workload;\nаутентификацию принимающего workload.\n```\n\nRFC 8705 также определяет применение mTLS для OAuth-аутентификации клиентов и привязки токена к сертификату клиента. Такой токен нельзя полноценно использовать без соответствующего приватного ключа.\n\nНо mTLS сам по себе не отвечает на вопрос:\n\n```text\nможет ли Order Service списать 10 000 рублей\nс конкретного счёта пользователя?\n```\n\nОн подтверждает только:\n\n```text\nзапрос действительно пришёл от Order Service.\n```\n\nПоэтому обычно применяют комбинацию:\n\n```text\nmTLS           → подтверждает сервис и защищает канал\nAccess Token   → передаёт разрешения и пользовательский контекст\nБизнес-логика  → проверяет конкретный ресурс и действие\n```\n\nДокументация Istio также отдельно подчёркивает, что mTLS обеспечивает аутентификацию, но одного mTLS недостаточно для полноценной авторизации. \n\n---\n\n### 6. Workload Identity через SPIFFE/SPIRE\n\nВместо ручной выдачи сертификатов каждому сервису можно использовать workload identity.\n\nПример SPIFFE ID:\n\n```text\nspiffe://example.com/prod/order-service\n```\n\nSPIRE определяет, какой workload запущен, и выдаёт ему короткоживущий документ идентичности — SVID:\n\n```text\nX.509-SVID → для mTLS\nJWT-SVID   → токен-подтверждение личности\n```\n\n```text\nSPIRE Agent\n    │\n    ├── идентифицирует Pod или процесс\n    ├── выдаёт короткоживущий сертификат\n    └── автоматически обновляет его\n```\n\nSPIFFE стандартизирует идентичность workload, SVID и Workload API, через который workload получает свои идентификационные документы. \n\nЭто позволяет не хранить в переменных окружения постоянные секреты вида:\n\n```env\nPAYMENT_SERVICE_CLIENT_SECRET=...\n```\n\n---\n\n### 7. Как выполняется авторизация\n\nАутентификация сервиса ещё не означает разрешение на любое действие.\n\nНапример:\n\n```text\nOrder Service успешно аутентифицирован\n```\n\nНо его права могут быть ограничены:\n\n```text\nразрешено:\npayments:create\npayments:read-status\n\nзапрещено:\npayments:refund\npayments:delete\nadmin:accounts\n```\n\nИспользуют несколько моделей.\n\n#### RBAC\n\nПрава назначаются ролям:\n\n```text\nrole: order-service\n\npermissions:\n- payments:create\n- payments:read\n```\n\n#### Scopes\n\nТокен содержит конкретные возможности:\n\n```json\n{\n  \"scope\": \"payments:create payments:status\"\n}\n```\n\n#### ABAC\n\nРешение зависит от атрибутов:\n\n```text\nservice = order-service\nenvironment = production\ntenant = tenant-42\noperation = payment:create\namount < configured_limit\n```\n\n#### Domain authorization\n\nСам сервис проверяет бизнес-правила:\n\n```python\nallowed = (\n    caller == \"order-service\"\n    and \"payments:create\" in scopes\n    and payment.order_id == requested_order_id\n    and order.user_id == token.subject\n    and not account.is_blocked\n)\n```\n\nНа практике эти модели комбинируют:\n\n```text\nGateway        → грубые ограничения\nService mesh   → разрешённые связи между workload\nOAuth scopes   → права токена\nМикросервис    → бизнес-правила и владение ресурсом\n```\n\n---\n\n### 8. Где проверять токен\n\n#### На API Gateway\n\nGateway может проверять:\n\n```text\nподпись;\nissuer;\nexpiration;\nобщий audience;\nбазовые scopes;\nrate limits.\n```\n\nНо только этого недостаточно. Внутренний сервис не должен считать любой запрос, прошедший через сеть, доверенным.\n\n#### В каждом микросервисе\n\nЦелевой сервис должен проверить токен относительно собственных требований:\n\n```text\naud == идентификатор текущего API;\nесть необходимый scope;\nвызывающий client разрешён;\nпользователь имеет доступ к ресурсу.\n```\n\nНапример, токен для:\n\n```json\n{\n  \"aud\": \"order-api\"\n}\n```\n\nне должен приниматься `Payment Service`.\n\nJWT Best Current Practices рекомендует разделять разные назначения JWT и проверять `aud`, `iss`, допустимые алгоритмы и другие контекстные ограничения, чтобы токен нельзя было использовать не по назначению. \n\n---\n\n### 9. JWT или opaque token\n\n#### JWT\n\n```text\neyJhbGciOiJSUzI1NiIs...\n```\n\nСодержит подписанные claims. Сервис обычно проверяет его локально по публичному ключу Authorization Server:\n\n```text\nбыстрая проверка;\nне нужен сетевой запрос на каждый вызов;\nсложнее немедленно отозвать уже выданный токен.\n```\n\n#### Opaque token\n\n```text\nrN8c7uF3kL2...\n```\n\nСам по себе ничего не сообщает сервису. Сервис вызывает introspection endpoint:\n\n```http\nPOST /oauth/introspect\ntoken=rN8c7uF3kL2\n```\n\nОтвет:\n\n```json\n{\n  \"active\": true,\n  \"client_id\": \"order-service\",\n  \"scope\": \"payments:create\",\n  \"sub\": \"user-123\",\n  \"aud\": \"payment-api\",\n  \"exp\": 1785100000\n}\n```\n\nRFC 7662 определяет introspection endpoint, через который защищённый ресурс получает состояние токена и его метаданные, включая `active`, scopes, client и временные ограничения.\n\n---\n\n### 10. Что именно проверять в JWT\n\nНедостаточно просто декодировать JWT:\n\n```python\npayload = jwt.decode(token, options={\"verify_signature\": False})\n```\n\nЭто не аутентификация.\n\nНеобходимо проверить:\n\n```text\n1. Криптографическую подпись\n2. Разрешённый алгоритм\n3. iss — доверенный issuer\n4. aud — текущий сервис\n5. exp — токен не истёк\n6. nbf — токен уже действует\n7. typ — ожидаемый тип токена\n8. scope / permissions\n9. client_id или azp\n10. tenant и другие доменные claims\n```\n\nУсловный пример:\n\n```python\npayload = jwt.decode(\n    token,\n    public_key,\n    algorithms=[\"RS256\"],\n    issuer=\"https://auth.example.com\",\n    audience=\"payment-api\",\n)\n\nscopes = set(payload.get(\"scope\", \"\").split())\n\nif \"payments:create\" not in scopes:\n    raise ForbiddenError()\n```\n\nПубличный ключ обычно получают через JWKS Authorization Server и кешируют с учётом ротации ключей.\n\n---\n\n### 11. Типовая рекомендуемая архитектура\n\n```text\n                    Identity Provider\n                     /            \\\n                    /              \\\n        User Access Token      Service Access Token\n                 │                    │\n                 ▼                    ▼\n             API Gateway         Internal Service\n                 │                    │\n                 ▼                    │\n           Order Service ─────────────┘\n                 │\n                 │ Token Exchange\n                 ▼\n           Payment Service\n```\n\nДля внешних запросов:\n\n```text\nOIDC login;\nкороткоживущий Access Token;\naudience конкретного API;\nscopes пользователя.\n```\n\nДля внутренних технических запросов:\n\n```text\nClient Credentials;\nworkload identity;\nmTLS;\nотдельные scopes для каждого сервиса.\n```\n\nДля запросов от имени пользователя:\n\n```text\nToken Exchange;\nсохранение user subject;\nуказание вызывающего сервиса;\nновый audience для downstream-сервиса.\n```\n\n### Практические правила\n\n```text\nНе использовать один общий JWT-секрет для всех сервисов.\n\nНе выдавать всем сервисам одинаковые права.\n\nНе доверять запросу только потому, что он пришёл\nиз внутренней сети.\n\nНе передавать ID Token как Access Token.\n\nНе принимать токен с чужим audience.\n\nНе полагаться только на API Gateway.\n\nНе хранить долгоживущие credentials без необходимости.\n\nНе передавать X-User-ID без подтверждённой\nидентичности вызывающего сервиса.\n```\n\nПредпочтительная комбинация:\n\n```text\nOAuth 2.0 / OIDC\n        +\nкороткоживущие Access Token\n        +\nmTLS или workload identity\n        +\nпроверка прав внутри конечного сервиса\n        +\nпринцип минимальных привилегий\n```"
  popularity = 2.63

[[questions]]
  id = 3
  question = "Монолит vs Микросервисы"
  answer = "### Главное отличие\n\n**Монолит** — приложение, в котором функциональные модули собираются и развёртываются как единая система.\n\n```text\nКлиент\n   │\n   ▼\n┌─────────────────────────────┐\n│          Монолит            │\n│                             │\n│  Users                      │\n│  Orders                     │\n│  Payments                   │\n│  Notifications              │\n└──────────────┬──────────────┘\n               │\n               ▼\n           Общая БД\n```\n\n**Микросервисы** — система из независимо развёртываемых сервисов, каждый из которых отвечает за определённую бизнес-возможность и взаимодействует с остальными через API или сообщения.\n\n```text\n                    ┌──────────────┐\nКлиент ──> Gateway ─┤ User Service │──> User DB\n                    ├──────────────┤\n                    │Order Service │──> Order DB\n                    ├──────────────┤\n                    │Payment       │──> Payment DB\n                    ├──────────────┤\n                    │Notification  │──> Notification DB\n                    └──────────────┘\n```\n\nКлючевая разница не в количестве репозиториев или контейнеров, а в **границах развёртывания, владении данными и независимости команд**. Микросервис должен иметь определённый контракт и возможность развиваться независимо от остальных компонентов. \n\n### Сравнение\n\n|Критерий|Монолит|Микросервисы|\n|---|---|---|\n|Развёртывание|Всё приложение целиком|Каждый сервис отдельно|\n|Процессы|Обычно один процесс или один deployable unit|Отдельный процесс на сервис|\n|Вызовы|Обычные вызовы функций|HTTP, gRPC, очереди, события|\n|Данные|Часто одна общая БД|Обычно хранилище на сервис|\n|Транзакции|Обычные ACID-транзакции|Saga, события, eventual consistency|\n|Масштабирование|Масштабируется всё приложение|Можно масштабировать отдельные сервисы|\n|Отказы|Ошибка может затронуть весь процесс|Возможна изоляция отказов|\n|Отладка|Обычно проще|Нужны логи, метрики и tracing|\n|Локальный запуск|Относительно простой|Может требовать много инфраструктуры|\n|Командная независимость|Ограниченная на большом проекте|Высокая при правильных границах|\n|Начальная стоимость|Ниже|Выше|\n|Операционная сложность|Ниже|Значительно выше|\n\n### Развёртывание\n\nВ монолите обычно существует один артефакт:\n\n```text\nbackend:1.7.0\n```\n\nДаже если изменился только модуль уведомлений, развёртывается всё приложение:\n\n```text\nUsers + Orders + Payments + Notifications\n```\n\nВ микросервисной архитектуре можно отдельно выпустить:\n\n```text\nnotification-service:2.1.0\n```\n\nне развёртывая `Order Service` и `Payment Service`.\n\nЭто позволяет сервисам выпускаться независимо, но требует управления версиями API, совместимостью контрактов, конфигурацией, маршрутизацией и инфраструктурой каждого сервиса. Microsoft и AWS относят независимое тестирование и развёртывание к основным преимуществам микросервисов, одновременно подчёркивая рост сложности всей системы. \n\n### Масштабирование\n\nМонолит можно горизонтально масштабировать:\n\n```text\nLoad Balancer\n    ├── Monolith 1\n    ├── Monolith 2\n    └── Monolith 3\n```\n\nПоэтому утверждение «монолит невозможно масштабировать» неверно.\n\nПроблема заключается в том, что обычно масштабируется **всё приложение целиком**. Например, если больше ресурсов требует только каталог, приходится создавать дополнительные экземпляры, содержащие также пользователей, платежи и уведомления.\n\n```text\nНагрузка:\nCatalog       20 000 запросов/с\nPayments         500 запросов/с\nNotifications    100 запросов/с\n\nМонолит:\nмасштабируется весь backend\n```\n\nВ микросервисной системе можно увеличить только количество экземпляров `Catalog Service`:\n\n```text\nCatalog Service\n├── instance 1\n├── instance 2\n├── instance 3\n├── instance 4\n└── instance 5\n\nPayment Service\n└── instance 1\n```\n\nТакая гранулярность полезна при сильно различающихся профилях нагрузки. Но для небольшого приложения она часто не окупает расходы на дополнительную инфраструктуру. Azure указывает, что монолит обычно масштабируется целиком, тогда как микросервисы позволяют выбирать платформу и масштабирование для каждого домена отдельно. \n\n### Производительность\n\nВ монолите модули вызывают друг друга как обычные функции:\n\n```python\nuser = user_service.get_user(user_id)\norder = order_service.create_order(user)\n```\n\nЭто быстро и надёжно по сравнению с сетевым вызовом.\n\nВ микросервисах аналогичная операция может выглядеть так:\n\n```text\nOrder Service\n      │ HTTP/gRPC\n      ▼\nUser Service\n```\n\nТеперь появляются:\n\n- сетевые задержки;\n    \n- тайм-ауты;\n    \n- недоступность сервиса;\n    \n- сериализация данных;\n    \n- повторные запросы;\n    \n- ограничение соединений;\n    \n- частичные ошибки.\n    \n\nПоэтому микросервисы не делают приложение автоматически быстрее. Внутренний вызов функции почти всегда дешевле сетевого запроса. Преимущество микросервисов заключается не в скорости отдельного вызова, а в независимом масштабировании, развёртывании и владении бизнес-доменами.\n\n### Отказоустойчивость\n\nВ монолите ошибка может повлиять на весь процесс:\n\n```text\nОшибка в генерации PDF\n        ↓\nисчерпание памяти\n        ↓\nпадает весь экземпляр приложения\n```\n\nВ микросервисах генерацию PDF можно вынести отдельно:\n\n```text\nOrder Service       — работает\nPayment Service     — работает\nPDF Service         — временно недоступен\n```\n\nНо изоляция отказов не появляется автоматически. Если `Order Service` синхронно зависит от пяти других сервисов, отказ одного из них может нарушить весь запрос:\n\n```text\nOrder Service\n   ├── User Service       OK\n   ├── Inventory Service  OK\n   ├── Pricing Service    TIMEOUT\n   └── Payment Service    не вызван\n```\n\nПоэтому микросервисам нужны:\n\n```text\ntimeouts;\nretries;\ncircuit breakers;\nbulkheads;\nидемпотентность;\nочереди;\nfallback;\nhealth checks.\n```\n\nCircuit Breaker, например, предотвращает бесконечные обращения к сервису, который уже отвечает ошибками или тайм-аутами. \n\n### Работа с данными\n\nВ монолите можно провести одну транзакцию:\n\n```python\nasync with transaction:\n    create_order()\n    reserve_product()\n    create_payment()\n```\n\nЕсли операция не завершилась:\n\n```text\nROLLBACK\n```\n\nВсе изменения отменяются атомарно.\n\nВ микросервисах данные могут быть распределены:\n\n```text\nOrder Service     → Order DB\nInventory Service → Inventory DB\nPayment Service   → Payment DB\n```\n\nОдна обычная транзакция PostgreSQL уже не может охватить все эти базы.\n\nТогда бизнес-процесс разбивается на локальные транзакции:\n\n```text\n1. Создать заказ\n2. Зарезервировать товар\n3. Провести платёж\n4. Подтвердить заказ\n```\n\nЕсли платёж не прошёл:\n\n```text\n1. Отменить резерв\n2. Перевести заказ в cancelled\n```\n\nЭто Saga с компенсирующими операциями. Она сложнее обычной транзакции: шаги должны быть идемпотентными, события могут приходить повторно, а система некоторое время находится в промежуточном состоянии. Microsoft отмечает, что стандартные ACID-гарантии напрямую не распространяются на несколько независимо управляемых хранилищ, поэтому применяются Saga и компенсации. \n\n### Согласованность данных\n\nВ монолите проще получить строго согласованный результат:\n\n```sql\nSELECT users.username,\n       orders.total,\n       payments.status\nFROM users\nJOIN orders ON ...\nJOIN payments ON ...\n```\n\nВ микросервисах выполнить такой `JOIN` напрямую обычно нельзя, потому что данные принадлежат разным сервисам.\n\nИспользуются другие способы:\n\n```text\nAPI Composition;\nCQRS;\nрепликация read-моделей;\nсобытия;\ndata warehouse;\neventual consistency.\n```\n\nНапример, `Order Service` может хранить локальную копию имени покупателя:\n\n```json\n{\n  \"order_id\": 500,\n  \"user_id\": 42,\n  \"customer_name\": \"Alex\"\n}\n```\n\nЕсли пользователь изменит имя, данные обновятся после обработки события:\n\n```text\nUserNameChanged\n```\n\nВ течение небольшого времени копия может быть устаревшей. Такая eventual consistency является нормальной частью многих микросервисных систем, но она усложняет логику и тестирование. \n\n### Разработка и тестирование\n\nМонолит проще запустить локально:\n\n```bash\ndocker compose up postgres redis backend\n```\n\nИнтеграционный тест может обращаться к одному приложению и одной базе.\n\nДля микросервисного сценария могут понадобиться:\n\n```text\nAPI Gateway\nAuth Service\nOrder Service\nPayment Service\nInventory Service\nPostgreSQL × 3\nRedis\nKafka или RabbitMQ\nTracing\nService discovery\n```\n\nПолностью поднять систему на ноутбуке становится сложнее. Приходится использовать:\n\n- contract testing;\n    \n- mocks и stubs;\n    \n- тестовые окружения;\n    \n- контейнеры;\n    \n- consumer-driven contracts;\n    \n- end-to-end тесты;\n    \n- тестовые брокеры сообщений.\n    \n\nОтдельный сервис тестируется проще, но проверка всей распределённой цепочки сложнее. Azure отдельно относит межсервисную коммуникацию, согласованность данных, транзакции и большое количество компонентов к главным сложностям микросервисной архитектуры. \n\n### Наблюдаемость и отладка\n\nВ монолите запрос обычно проходит внутри одного процесса:\n\n```text\nPOST /orders\n    ↓\ncontroller\n    ↓\nservice\n    ↓\nrepository\n    ↓\ndatabase\n```\n\nВ микросервисах цепочка может выглядеть так:\n\n```text\nGateway\n   ↓\nOrder Service\n   ↓\nInventory Service\n   ↓\nKafka\n   ↓\nPayment Service\n   ↓\nNotification Service\n```\n\nОбычного текстового лога уже недостаточно. Нужны:\n\n```text\nцентрализованные логи;\nметрики;\ndistributed tracing;\ntrace_id;\ncorrelation_id;\nалерты;\nдашборды;\nSLO и SLA.\n```\n\nИначе сложно определить, где именно потерялся или замедлился запрос. Операционная сложность и необходимость связывать, защищать и наблюдать сеть сервисов являются типичной ценой микросервисов. \n\n### Безопасность\n\nВ монолите многие взаимодействия являются внутренними вызовами функций.\n\nВ микросервисах каждый сетевой интерфейс становится потенциальной границей безопасности:\n\n```text\nOrder Service ──> Payment Service\n```\n\nНужно решать:\n\n- как сервисы аутентифицируют друг друга;\n    \n- какие scopes имеет каждый сервис;\n    \n- как ротировать credentials;\n    \n- где проверять JWT;\n    \n- нужен ли mTLS;\n    \n- как ограничивать сетевой доступ;\n    \n- как хранить секреты;\n    \n- как вести аудит.\n    \n\nЧем больше сервисов, тем больше API, сертификатов, токенов, политик доступа и конфигураций необходимо контролировать.\n\n### Команды и ответственность\n\nМонолит хорошо подходит одной небольшой или средней команде:\n\n```text\nTeam\n ├── Users\n ├── Orders\n ├── Payments\n └── Notifications\n```\n\nНа большом проекте множество команд начинают менять один репозиторий и один deployable unit:\n\n```text\nTeam A ─┐\nTeam B ─┼──> общий монолит\nTeam C ─┘\n```\n\nРелизы приходится координировать, а изменения одной команды способны заблокировать выпуск остальных.\n\nМикросервисы позволяют разделить ответственность:\n\n```text\nTeam A → Order Service\nTeam B → Payment Service\nTeam C → Catalog Service\n```\n\nКаждая команда владеет кодом, данными, эксплуатацией и API своего сервиса. Такой подход приносит пользу только при реальной организационной независимости. Если все микросервисы изменяет одна небольшая команда и они всегда выпускаются одновременно, архитектура может превратиться в распределённый монолит. AWS рекомендует закреплять сервис за одной командой и строить границы вокруг бизнес-возможностей или поддоменов. \n\n### Преимущества монолита\n\n```text\nпростая разработка;\nпростой локальный запуск;\nпростые транзакции;\nнизкие сетевые накладные расходы;\nпростая отладка;\nменьше инфраструктуры;\nдешевле эксплуатация;\nпроще выполнить рефакторинг между модулями;\nбыстрее создать первую версию продукта.\n```\n\nНебольшое приложение может быть быстрее доставлено как монолит; AWS также отмечает, что монолит часто является естественным первым шагом даже при ожидаемом дальнейшем росте. \n\n### Недостатки монолита\n\nПри росте проекта могут появиться:\n\n```text\nдолгая сборка и тестирование;\nкоординация релизов;\nсильная связанность модулей;\nсложное владение кодом;\nмасштабирование всего приложения;\nобщая область отказа;\nсложность замены технологического стека;\nбольшой объём контекста для разработчика.\n```\n\nНо эти проблемы часто возникают не потому, что приложение является монолитом, а потому что оно стало **плохо структурированным монолитом**.\n\n### Преимущества микросервисов\n\n```text\nнезависимое развёртывание;\nнезависимое масштабирование;\nизоляция частей системы;\nясное владение доменами;\nавтономность команд;\nразные технологии хранения;\nнебольшие границы ответственности;\nвозможность отдельно оптимизировать критические сервисы.\n```\n\nЭти преимущества проявляются при корректно определённых границах и зрелой инфраструктуре. \n\n### Недостатки микросервисов\n\n```text\nсетевые ошибки;\nраспределённые транзакции;\neventual consistency;\nсложная отладка;\nсложное тестирование;\nAPI versioning;\nservice discovery;\nповторная доставка сообщений;\nидемпотентность;\nмониторинг;\nоркестрация;\nуправление секретами;\nвысокие инфраструктурные расходы;\nбольше DevOps-работы.\n```\n\nКаждый отдельный сервис может быть проще монолита, но **система в целом становится сложнее**. Это прямо отмечается в рекомендациях Azure. \n\n### Модульный монолит\n\nНа практике лучший начальный вариант для многих систем — не обычный «большой комок кода», а **модульный монолит**:\n\n```text\n┌────────────────────────────────┐\n│          Backend               │\n│                                │\n│ ┌─────────┐  ┌──────────────┐  │\n│ │ Users   │  │ Orders       │  │\n│ └─────────┘  └──────────────┘  │\n│                                │\n│ ┌─────────┐  ┌──────────────┐  │\n│ │Payment  │  │Notification  │  │\n│ └─────────┘  └──────────────┘  │\n└────────────────────────────────┘\n```\n\nВсе модули развёртываются вместе, но имеют строгие внутренние границы:\n\n```text\nотдельные модели;\nотдельные use cases;\nявные интерфейсы;\nзапрет прямого доступа к внутренностям другого модуля;\nвладение таблицами;\nслабая связанность.\n```\n\nНапример:\n\n```text\norders/\n├── domain/\n├── application/\n├── infrastructure/\n└── api/\n\npayments/\n├── domain/\n├── application/\n├── infrastructure/\n└── api/\n```\n\nЭто даёт большую часть простоты монолита и облегчает последующее выделение отдельных модулей в сервисы. Хорошо спроектированные монолиты также могут иметь bounded contexts и чёткие интерфейсы; разница в том, что вызовы остаются внутрипроцессными, а развёртывание — общим. \n\n### Когда выбирать монолит\n\nМонолит обычно предпочтительнее, когда:\n\n- продукт только создаётся;\n    \n- бизнес-требования ещё часто меняются;\n    \n- команда небольшая;\n    \n- нет зрелой DevOps-инфраструктуры;\n    \n- требуется быстро выпустить MVP;\n    \n- транзакции охватывают много связанных данных;\n    \n- нагрузка умеренная;\n    \n- нет необходимости независимо выпускать отдельные части;\n    \n- границы бизнес-доменов ещё неясны.\n    \n\nВ такой ситуации микросервисы могут преждевременно закрепить неправильные границы и повысить стоимость разработки.\n\n### Когда микросервисы оправданы\n\nМикросервисы полезны, когда одновременно присутствует несколько условий:\n\n- система большая и долгоживущая;\n    \n- работают несколько автономных команд;\n    \n- разные части имеют сильно разную нагрузку;\n    \n- сервисы должны выпускаться независимо;\n    \n- требуется изоляция отдельных критических компонентов;\n    \n- доменные границы хорошо понятны;\n    \n- организация умеет эксплуатировать распределённые системы;\n    \n- есть централизованные логи, метрики, tracing и автоматизированный CI/CD;\n    \n- стоимость монолита уже измеримо тормозит разработку.\n    \n\nMicrosoft рекомендует перед переходом оценить зрелость приложения, инфраструктуры, DevOps-процессов и модели разработки, поскольку сама миграция занимает время и требует организационной готовности.\n\n### Практический выбор\n\nДля нового проекта с одной командой:\n\n```text\nмодульный монолит\n```\n\nДля крупной системы с несколькими независимыми командами и разными профилями нагрузки:\n\n```text\nмикросервисы\n```\n\nДля существующего монолита, в котором проблема возникает только в одном модуле:\n\n```text\nне переписывать всё;\nвыделить проблемный модуль постепенно.\n```\n\nОбычно применяется Strangler Fig:\n\n```text\nСтарый монолит\n      │\n      ├── старые модули\n      │\n      └── вызов нового сервиса\n               │\n               ▼\n          Новый сервис\n```\n\nAWS и Azure рекомендуют постепенную декомпозицию по бизнес-возможностям или поддоменам, а не полное одномоментное переписывание системы. \n\n### Итог\n\n```text\nМонолит:\nпрост в разработке и эксплуатации,\nно со временем может ограничивать независимость команд.\n\nМикросервисы:\nдают независимость развёртывания и масштабирования,\nно превращают приложение в распределённую систему\nсо всеми её проблемами.\n\nМодульный монолит:\nчасто является лучшим стартовым компромиссом.\n```\n\nГлавное практическое правило:\n\n```text\nНе переходить на микросервисы потому,\nчто они считаются современной архитектурой.\n\nПереходить тогда, когда конкретные проблемы монолита\nдороже сложности распределённой системы.\n```"
  popularity = 5.26

[[questions]]
  id = 4
  question = "Что такое Микросервисы?"
  answer = "### Определение\n\n**Микросервисы** — архитектурный подход, при котором приложение состоит из набора слабо связанных сервисов. Каждый сервис отвечает за отдельную бизнес-возможность, самостоятельно выполняется и может развёртываться независимо от остальных. Сервисы взаимодействуют через явно определённые контракты: HTTP API, gRPC или сообщения в брокере. \n\nПример интернет-магазина:\n\n```text\n                    ┌──────────────────────┐\nКлиент ──> Gateway ─┤ User Service         │\n                    ├──────────────────────┤\n                    │ Catalog Service      │\n                    ├──────────────────────┤\n                    │ Order Service        │\n                    ├──────────────────────┤\n                    │ Payment Service      │\n                    └──────────────────────┘\n```\n\nВместо одного большого backend-приложения существуют отдельные сервисы:\n\n```text\nUser Service     — пользователи и профили\nCatalog Service  — товары и категории\nOrder Service    — оформление заказов\nPayment Service  — проведение платежей\nDelivery Service — доставка\n```\n\n### Основные признаки микросервиса\n\n#### 1. Отдельная бизнес-ответственность\n\nСервис создаётся вокруг бизнес-возможности или ограниченного доменного контекста, а не просто вокруг технического слоя.\n\nПравильное разделение:\n\n```text\nOrder Service\nPayment Service\nDelivery Service\n```\n\nСомнительное разделение:\n\n```text\nController Service\nRepository Service\nDatabase Service\n```\n\nГраницы сервисов обычно определяют по бизнес-доменам и bounded contexts. \n\n#### 2. Независимое развёртывание\n\nИзменение `Payment Service` не должно требовать обязательного выпуска `Order Service` и других компонентов:\n\n```text\npayment-service: 2.4.0 → 2.5.0\norder-service:   остаётся 1.8.0\n```\n\nНезависимое развёртывание считается одним из определяющих свойств микросервисной архитектуры. Если все компоненты всегда приходится тестировать и выпускать одновременно, система начинает напоминать распределённый монолит. \n\n#### 3. Владение своими данными\n\nОбычно сервис самостоятельно владеет своей доменной моделью и данными:\n\n```text\nUser Service    → User DB\nOrder Service   → Order DB\nPayment Service → Payment DB\n```\n\n`Order Service` не должен напрямую изменять таблицы `Payment Service`. Он вызывает его API или отправляет сообщение:\n\n```text\nOrder Service ──POST /payments──> Payment Service\n```\n\nКлючевое требование — не обязательно отдельный физический сервер БД, а исключительное владение таблицами и схемой со стороны одного сервиса. \n\n#### 4. Явный контракт взаимодействия\n\nВ монолите модули могут вызывать обычные функции:\n\n```python\npayment_service.create_payment(order)\n```\n\nВ микросервисах вызов пересекает границу процесса:\n\n```http\nPOST /payments\nContent-Type: application/json\n\n{\n  \"order_id\": 125,\n  \"amount\": 1500\n}\n```\n\nЛибо используется сообщение:\n\n```json\n{\n  \"event\": \"OrderCreated\",\n  \"order_id\": 125,\n  \"amount\": 1500\n}\n```\n\nAPI и форматы событий становятся контрактами, которые необходимо версионировать и сохранять совместимыми.\n\n#### 5. Независимое масштабирование\n\nЕсли высокую нагрузку испытывает только каталог, можно увеличить число экземпляров именно этого сервиса:\n\n```text\nCatalog Service\n├── instance 1\n├── instance 2\n├── instance 3\n└── instance 4\n\nPayment Service\n└── instance 1\n```\n\nМикросервисная архитектура позволяет отдельно масштабировать компоненты с разными профилями нагрузки. \n\n### Как проходит один запрос\n\nПользователь оформляет заказ:\n\n```text\n1. Клиент отправляет POST /orders\n2. API Gateway передаёт запрос в Order Service\n3. Order Service обращается к Inventory Service\n4. Inventory Service резервирует товар\n5. Order Service отправляет команду Payment Service\n6. Payment Service проводит оплату\n7. Notification Service отправляет уведомление\n```\n\nСхематично:\n\n```text\nClient\n  │\n  ▼\nAPI Gateway\n  │\n  ▼\nOrder Service ───> Inventory Service\n  │\n  ├──────────────> Payment Service\n  │\n  └── event ─────> Notification Service\n```\n\nВызовы могут быть:\n\n```text\nСинхронными:\nHTTP, REST, gRPC\n\nАсинхронными:\nKafka, RabbitMQ, NATS, SQS\n```\n\n### Микросервис — не обязательно маленький сервис\n\nСлово `micro` не определяет количество строк кода, таблиц или разработчиков.\n\nГлавное:\n\n```text\nчёткая бизнес-ответственность;\nнезависимое развёртывание;\nсобственное владение данными;\nслабая связанность;\nявный контракт.\n```\n\nОдин сервис может содержать значительный объём кода, если он остаётся внутри одного связного бизнес-контекста.\n\n### Что само по себе не делает систему микросервисной\n\nНедостаточно:\n\n```text\nразбить проект на несколько репозиториев;\nзапустить компоненты в разных Docker-контейнерах;\nсоздать отдельные FastAPI-приложения;\nдать каждому компоненту отдельный порт;\nиспользовать Kubernetes;\n```\n\nНапример:\n\n```text\nService A ─┐\nService B ─┼──> одна общая схема БД\nService C ─┘\n```\n\nЕсли сервисы напрямую изменяют общие таблицы, выпускаются только вместе и знают внутреннее устройство друг друга, это скорее **распределённый монолит**, а не полноценная микросервисная архитектура. Владение данными и независимость развёртывания являются более важными признаками, чем контейнеризация. \n\n### Преимущества\n\nМикросервисы позволяют:\n\n```text\nнезависимо выпускать части системы;\nмасштабировать только нагруженные компоненты;\nразделить ответственность между командами;\nизолировать часть технических отказов;\nвыбирать подходящие технологии для разных сервисов;\nпостепенно изменять крупную систему.\n```\n\nКоманда, владеющая сервисом, может самостоятельно разрабатывать, тестировать, развёртывать и масштабировать его, согласовывая с другими командами главным образом API-контракты. \n\n### Недостатки\n\nМикросервисы превращают приложение в распределённую систему. Возникают:\n\n```text\nсетевые ошибки и задержки;\nтайм-ауты и повторные запросы;\nсложная аутентификация между сервисами;\neventual consistency;\nраспределённые бизнес-транзакции;\nверсионирование API;\nцентрализованные логи;\nметрики и distributed tracing;\nсложный локальный запуск;\nболее дорогая инфраструктура.\n```\n\nПоэтому микросервисы не являются автоматически более простой или более производительной архитектурой. Они обменивают простоту одного приложения на независимость его частей.\n\n### Микросервисы и монолит\n\n```text\nМонолит:\nодно приложение;\nобычно одно развёртывание;\nвнутренние вызовы функций;\nпростые локальные транзакции.\n\nМикросервисы:\nнесколько отдельных приложений;\nнезависимые развёртывания;\nсетевое взаимодействие;\nраспределённые данные и процессы.\n```\n\n### Итог\n\nМикросервисы — это не просто множество небольших приложений. Это архитектура, в которой каждый сервис:\n\n```text\nотвечает за отдельную бизнес-возможность;\nвладеет своей логикой и данными;\nобщается через явный контракт;\nможет независимо тестироваться и развёртываться;\nне требует синхронного выпуска всей системы.\n```\n\nДля небольшого нового проекта чаще практичнее начать с хорошо разделённого модульного монолита. Микросервисы оправданы, когда независимость команд, развёртывания и масштабирования действительно компенсирует сложность распределённой системы."
  popularity = 5.26

[[questions]]
  id = 5
  question = "Как DDD помогает выделять микросервисы? | Как выделить микросервис из монолита?"
  answer = "### Как DDD помогает выделять микросервисы\n\nDDD — Domain-Driven Design — помогает делить систему не по техническим слоям и таблицам, а по **бизнес-смыслам, правилам и ответственности**.\n\nDDD не говорит: «создай сервис размером в 5 классов». Он помогает определить, где проходит естественная граница модели, данных и бизнес-логики.\n\n```text\nНеправильное деление:\n\nUser Service\nController Service\nRepository Service\nDatabase Service\n```\n\nЭто технические слои, а не бизнес-возможности.\n\n```text\nДеление по бизнес-домену:\n\nCustomer Service\nOrder Service\nPayment Service\nDelivery Service\n```\n\nAzure рекомендует проектировать сервисы вокруг бизнес-возможностей, добиваясь высокой внутренней связности и слабой связанности между сервисами. \n\n### 1. Сначала определяется домен\n\n**Домен** — предметная область, для которой создаётся система.\n\nДля интернет-магазина это может быть:\n\n```text\nПродажа товаров\n├── Каталог\n├── Корзина\n├── Оформление заказа\n├── Оплата\n├── Доставка\n└── Возвраты\n```\n\nDDD требует сначала понять:\n\n- какие бизнес-процессы существуют;\n    \n- какие правила действуют;\n    \n- какие понятия используют специалисты;\n    \n- какие части системы изменяются по разным причинам;\n    \n- какие данные принадлежат каждой части.\n    \n\nНа этой стадии обычно работают не только разработчики, но и бизнес-эксперты. Для исследования домена могут использоваться схемы процессов, интервью и Event Storming. Главная цель — получить общее понимание предметной области до выбора конкретных технологий. \n\n### 2. Домен разделяется на поддомены\n\nDDD выделяет несколько типов поддоменов.\n\n#### Core Domain\n\nКлючевая часть бизнеса, создающая конкурентное преимущество:\n\n```text\nДля маркетплейса:\nалгоритм подбора предложений;\nуправление заказами;\nдинамическое ценообразование.\n```\n\n#### Supporting Subdomain\n\nПоддерживает основной бизнес, но сам не является главным конкурентным преимуществом:\n\n```text\nвозвраты;\nвнутренняя отчётность;\nуправление доставкой.\n```\n\n#### Generic Subdomain\n\nТиповая функциональность, которая встречается во многих системах:\n\n```text\nаутентификация;\nотправка электронной почты;\nхранение файлов;\nаудит.\n```\n\nРазделение на core, supporting и generic subdomains помогает понять, какие части требуют собственной сложной модели, а какие можно реализовать проще или передать готовому внешнему решению. AWS использует такое деление как один из подходов к декомпозиции монолита. \n\n### 3. Для каждого поддомена ищут Bounded Context\n\n**Bounded Context**, или ограниченный контекст, — граница, внутри которой определённая модель и терминология имеют однозначное значение.\n\nНапример, понятие `Customer` может означать разные вещи.\n\nВ контексте продаж:\n\n```python\nclass Customer:\n    id: int\n    discount_level: int\n    loyalty_points: int\n```\n\nВ контексте доставки:\n\n```python\nclass Recipient:\n    id: int\n    full_name: str\n    phone: str\n    delivery_address: str\n```\n\nВ контексте платежей:\n\n```python\nclass Payer:\n    id: int\n    payment_profile_id: str\n    risk_level: str\n```\n\nФормально это один человек, но разные части бизнеса рассматривают его по-разному. Поэтому не обязательно создавать одну глобальную сущность `User`, которую используют все компоненты.\n\n```text\nSales Context:\nCustomer — покупатель и участник программы лояльности\n\nDelivery Context:\nRecipient — получатель посылки\n\nPayment Context:\nPayer — участник финансовой операции\n```\n\nBounded Context определяет область действия конкретной доменной модели. Функциональность одного микросервиса обычно не должна охватывать несколько несвязанных bounded contexts. \n\n### 4. Bounded Context становится кандидатом в микросервис\n\nУпрощённое соответствие выглядит так:\n\n```text\nBounded Context          Возможный сервис\n\nOrdering                 Order Service\nPayments                 Payment Service\nShipping                 Delivery Service\nNotifications            Notification Service\n```\n\nНо это не жёсткое правило:\n\n```text\nBounded Context ≠ обязательно отдельный микросервис\n```\n\nBounded Context может быть:\n\n- модулем внутри модульного монолита;\n    \n- отдельным микросервисом;\n    \n- группой тесно связанных сервисов;\n    \n- логической границей без отдельного процесса.\n    \n\nDDD определяет границу модели, но не требует обязательно превращать каждую такую границу в отдельное сетевое приложение. \n\n### 5. Внутри Bounded Context определяются агрегаты\n\n**Aggregate** — группа объектов, изменения которой должны контролироваться через один корневой объект и обычно согласовываться в рамках одной локальной транзакции.\n\nНапример:\n\n```text\nOrder Aggregate\n├── Order\n├── OrderItem\n├── DeliveryAddress\n└── OrderStatus\n```\n\nКорнем является `Order`:\n\n```python\nclass Order:\n    def add_item(self, product_id: int, price: Decimal) -> None:\n        ...\n\n    def confirm(self) -> None:\n        ...\n\n    def cancel(self) -> None:\n        ...\n```\n\nВнешний код не должен напрямую менять `OrderItem`, обходя правила `Order`.\n\nАгрегаты помогают понять:\n\n- какие данные должны изменяться атомарно;\n    \n- где располагаются бизнес-инварианты;\n    \n- какие сущности тесно связаны;\n    \n- где нежелательно проводить границу сервиса.\n    \n\nПрактическая рекомендация Azure: микросервис обычно не должен быть меньше агрегата и не должен охватывать больше одного bounded context. При этом отдельный агрегат — только кандидат на сервис, а не обязательный отдельный сервис. \n\n### 6. Context Map показывает связи между контекстами\n\nПосле выделения bounded contexts нужно описать их отношения:\n\n```text\nOrdering\n    │\n    ├── запрашивает цену ──> Catalog\n    ├── создаёт платёж ────> Payments\n    └── публикует событие ─> Delivery\n```\n\nContext Map показывает:\n\n- кто владеет моделью;\n    \n- кто является поставщиком данных;\n    \n- кто зависит от кого;\n    \n- где требуется перевод одной модели в другую;\n    \n- какие связи синхронные, а какие асинхронные.\n    \n\nНапример, `Order Service` не должен использовать внутреннюю модель `Payment Service`:\n\n```python\n# Плохо\nfrom payment_service.models import PaymentTransaction\n```\n\nВместо этого используется публичный контракт:\n\n```http\nPOST /payments\n\n{\n  \"order_id\": \"order-125\",\n  \"amount\": \"1500.00\",\n  \"currency\": \"RUB\"\n}\n```\n\nДля защиты новой модели от особенностей старого монолита может применяться Anti-Corruption Layer — адаптер, переводящий данные и понятия между двумя моделями.\n\n### Когда Bounded Context стоит выделять в сервис\n\nГраница выглядит подходящей, когда у части системы есть несколько признаков:\n\n```text\nсобственная бизнес-терминология;\nсобственные правила и модель;\nявный владелец данных;\nотдельный жизненный цикл изменений;\nвозможность независимого развёртывания;\nотдельные требования к нагрузке и доступности;\nпонятный контракт с остальной системой;\nодна ответственная команда.\n```\n\nAWS рекомендует закреплять микросервис за одной командой, которая отвечает за его разработку, поддержку и выпуск. \n\n### Когда граница выбрана плохо\n\n#### Сервисы постоянно вызывают друг друга\n\n```text\nOrder Service\n    ↓\nCustomer Service\n    ↓\nPricing Service\n    ↓\nOrder Service\n    ↓\nInventory Service\n```\n\nОдин пользовательский запрос превращается в длинную цепочку синхронных вызовов.\n\n#### Один бизнес-процесс требует общей транзакции\n\n```text\nService A изменяет таблицу A\nService B изменяет таблицу B\nService C изменяет таблицу C\n```\n\nЕсли практически каждое изменение должно быть атомарным во всех трёх сервисах, вероятно, границу провели слишком мелко.\n\n#### Все сервисы выпускаются одновременно\n\n```text\nservice-a:2.0\nservice-b:2.0\nservice-c:2.0\n\nВсегда должны развёртываться вместе\n```\n\nЭто признак распределённого монолита.\n\n#### Сервисы используют общие таблицы\n\n```text\nOrder Service ───┐\nPayment Service ─┼──> orders, payments, users\nDelivery Service ┘\n```\n\nОбщая схема создаёт связанность на уровне разработки и миграций: изменение одной таблицы приходится координировать между несколькими сервисами. \n\n---\n\n## Как выделить микросервис из монолита\n\nВыделение микросервиса — это не простое копирование папки в отдельный репозиторий.\n\nНужно отделить:\n\n```text\nкод;\nбизнес-модель;\nданные;\nконтракты;\nтранзакции;\nразвёртывание;\nэксплуатационную ответственность.\n```\n\n### Шаг 1. Сначала определить причину выделения\n\nНельзя начинать с формулировки:\n\n```text\nНам нужны микросервисы.\n```\n\nНужна конкретная проблема:\n\n```text\nмодуль требует независимого масштабирования;\nего релизы блокируют другие команды;\nу него отдельные требования к доступности;\nего разработка тормозится связанностью монолита;\nмодуль часто изменяется независимо;\nошибки модуля влияют на всё приложение;\nдля него требуется отдельный технологический стек.\n```\n\nБез измеримой причины выделение сервиса может только увеличить сложность.\n\n### Шаг 2. Выбрать подходящий первый кандидат\n\nДля первого выделения лучше выбирать модуль:\n\n- с понятной ответственностью;\n    \n- с небольшим количеством зависимостей;\n    \n- с чётким входом и выходом;\n    \n- без множества общих транзакций;\n    \n- с относительно самостоятельными данными;\n    \n- который можно откатить без остановки основного бизнеса.\n    \n\nЧасто хорошими первыми кандидатами бывают:\n\n```text\nуведомления;\nгенерация документов;\nпоиск;\nобработка изображений;\nаудит;\nэкспорт отчётов.\n```\n\nБолее сложные кандидаты:\n\n```text\nплатежи;\nбалансы;\nоформление заказа;\nуправление остатками;\nидентификация пользователей.\n```\n\nУ сложных доменов больше транзакционных и бизнес-зависимостей.\n\n### Шаг 3. Исследовать текущие зависимости\n\nПеред выделением нужно построить карту модуля.\n\nНапример, для уведомлений:\n\n```text\nNotification Module\n├── вызывается после регистрации\n├── вызывается после оплаты\n├── вызывается после отмены заказа\n├── читает users.email\n├── читает notification_templates\n├── записывает notification_history\n├── запускает периодические задачи\n└── использует SMTP\n```\n\nНеобходимо найти:\n\n- все точки вызова;\n    \n- импорты и зависимости кода;\n    \n- таблицы и запросы;\n    \n- фоновые задачи;\n    \n- хранимые процедуры и триггеры;\n    \n- общие транзакции;\n    \n- внешние интеграции;\n    \n- отчёты, читающие эти данные;\n    \n- требования к задержке и надёжности.\n    \n\nБез этого легко вынести только код, оставив скрытые связи с монолитом.\n\n### Шаг 4. Сначала создать модульную границу внутри монолита\n\nДо физического выделения полезно превратить функциональность в изолированный модуль:\n\n```text\nmonolith/\n├── users/\n├── orders/\n├── payments/\n└── notifications/\n    ├── domain/\n    ├── application/\n    ├── infrastructure/\n    └── public_api.py\n```\n\nДругие части монолита должны работать только через публичный интерфейс:\n\n```python\nnotification_api.send_order_confirmation(\n    user_id=user.id,\n    order_id=order.id,\n)\n```\n\nА не обращаться к внутренним классам и таблицам:\n\n```python\n# Плохо\nNotificationModel.objects.create(...)\n```\n\nЭто создаёт **seam** — шов, по которому модуль затем можно физически отделить.\n\n### Шаг 5. Определить контракт нового сервиса\n\nНужно решить, какие операции сервис предоставляет наружу.\n\nСинхронный вариант:\n\n```http\nPOST /notifications\n\n{\n  \"recipient_id\": \"user-42\",\n  \"template\": \"order-confirmed\",\n  \"parameters\": {\n    \"order_id\": \"order-125\"\n  }\n}\n```\n\nАсинхронный вариант:\n\n```json\n{\n  \"event_id\": \"evt-981\",\n  \"event_type\": \"OrderConfirmed\",\n  \"order_id\": \"order-125\",\n  \"user_id\": \"user-42\",\n  \"occurred_at\": \"2026-07-27T00:30:00Z\"\n}\n```\n\nКонтракт должен описывать:\n\n- обязательные поля;\n    \n- семантику операции;\n    \n- формат ошибок;\n    \n- идемпотентность;\n    \n- версионирование;\n    \n- тайм-ауты;\n    \n- правила повторной доставки;\n    \n- аутентификацию и авторизацию.\n    \n\nНовый сервис не должен принимать внутренние ORM-модели монолита как контракт.\n\n### Шаг 6. Определить владельца данных\n\nПосле выделения сервис должен стать владельцем своих данных.\n\n```text\nNotification Service\n├── notification_templates\n├── notification_jobs\n├── notification_attempts\n└── notification_preferences\n```\n\nДругие компоненты не должны напрямую выполнять:\n\n```sql\nINSERT INTO notification_jobs ...\n```\n\nОни должны обращаться через API или публиковать событие.\n\nDatabase per Service означает именно эксклюзивное владение хранилищем. При этом базы могут физически находиться на одном сервере, но права доступа и схемы должны быть разделены. Межсервисные запросы к данным после этого требуют API Composition, событий, read-моделей или других распределённых подходов. \n\n### Шаг 7. Подготовить миграцию данных\n\nДопустим, таблица находится в монолите:\n\n```sql\nnotification_history\n```\n\nМиграция может выполняться так:\n\n```text\n1. Создать таблицы в базе нового сервиса\n2. Перенести исторические данные\n3. Проверить количество и контрольные суммы\n4. Синхронизировать новые изменения\n5. Переключить запись на новый сервис\n6. Переключить чтение\n7. Запретить старой системе изменять таблицу\n8. Удалить старую таблицу после периода наблюдения\n```\n\nНужно заранее определить:\n\n- что является источником истины;\n    \n- кто может писать данные на каждом этапе;\n    \n- как обрабатываются изменения во время миграции;\n    \n- как выполнить откат;\n    \n- как сравнивать старые и новые результаты.\n    \n\n### Не использовать неконтролируемую двойную запись\n\nОпасный вариант:\n\n```python\nsave_to_monolith_db(data)\nsave_to_microservice_db(data)\n```\n\nМежду двумя операциями возможен сбой:\n\n```text\nМонолитная БД обновлена\nНовая БД не обновлена\n```\n\nДля публикации событий после изменения БД обычно применяется Transactional Outbox:\n\n```text\nОдна локальная транзакция\n├── изменить бизнес-данные\n└── записать событие в outbox\n\nОтдельный worker\n└── отправить событие в брокер\n```\n\nOutbox решает проблему dual write, когда нужно одновременно сохранить данные и уведомить другую систему, но эти действия невозможно объединить одной распределённой транзакцией. \n\n### Шаг 8. Добавить Anti-Corruption Layer\n\nМонолит может использовать старую модель:\n\n```python\nsend_email(\n    user_db_id=42,\n    email_kind=3,\n    payload={\"number\": 125},\n)\n```\n\nНовый сервис может иметь более осмысленный контракт:\n\n```python\nSendNotification(\n    recipient_id=\"user-42\",\n    template=\"order-confirmed\",\n    variables={\"order_id\": \"order-125\"},\n)\n```\n\nАдаптер переводит старую модель в новую:\n\n```python\nclass NotificationAdapter:\n    def send_order_confirmation(\n        self,\n        user_id: int,\n        order_id: int,\n    ) -> None:\n        client.send_notification(\n            recipient_id=f\"user-{user_id}\",\n            template=\"order-confirmed\",\n            variables={\"order_id\": f\"order-{order_id}\"},\n        )\n```\n\nЭто не позволяет устаревшей модели монолита проникнуть внутрь нового сервиса. Anti-Corruption Layer используется как фасад или адаптер между системами с разной семантикой.\n\n### Шаг 9. Применить Strangler Fig\n\nНаиболее безопасный способ — постепенно перенаправлять функциональность из монолита в новый сервис.\n\n```text\nЭтап 1:\n\nКлиент ──> Монолит\n```\n\n```text\nЭтап 2:\n\n                    ┌──> Монолит\nКлиент ──> Gateway ─┤\n                    └──> Новый сервис\n```\n\n```text\nЭтап 3:\n\nКлиент ──> Gateway ──> Новый сервис\n```\n\nStrangler Fig состоит из трёх общих фаз:\n\n```text\nTransform — создать новую реализацию\nCoexist   — старая и новая версии работают параллельно\nEliminate — удалить старую реализацию\n```\n\nПостепенный подход снижает риск по сравнению с одномоментным переписыванием и оставляет возможность вернуть трафик в монолит. \n\n### Шаг 10. Переключать трафик постепенно\n\nПример:\n\n```text\n1% запросов  → новый сервис\n10%          → новый сервис\n50%          → новый сервис\n100%         → новый сервис\n```\n\nЛибо переключать по группам:\n\n```text\nвнутренние пользователи;\nтестовые клиенты;\nодин регион;\nодин тип уведомления;\nодин бизнес-сценарий.\n```\n\nНа каждом этапе сравниваются:\n\n- ответы старой и новой системы;\n    \n- количество ошибок;\n    \n- задержки;\n    \n- созданные записи;\n    \n- доставленные события;\n    \n- бизнес-метрики.\n    \n\n### Шаг 11. Обеспечить идемпотентность\n\nВ распределённой системе запрос или сообщение может быть доставлено повторно.\n\n```json\n{\n  \"event_id\": \"evt-981\",\n  \"event_type\": \"OrderConfirmed\"\n}\n```\n\nСервис должен хранить обработанные идентификаторы:\n\n```sql\nCREATE TABLE processed_events (\n    event_id UUID PRIMARY KEY,\n    processed_at TIMESTAMPTZ NOT NULL\n);\n```\n\nЛогика:\n\n```python\nif event_already_processed(event.id):\n    return\n\nprocess_event(event)\nmark_event_as_processed(event.id)\n```\n\nИначе одно повторно доставленное событие может отправить два уведомления или создать две операции.\n\n### Шаг 12. Подготовить эксплуатацию до переключения\n\nДо запуска нового сервиса должны существовать:\n\n```text\nцентрализованные логи;\nметрики;\ndistributed tracing;\nhealth checks;\nтайм-ауты;\nповторные попытки;\ncircuit breaker;\nалерты;\nрезервное копирование;\nуправление секретами;\nпроцедура rollback.\n```\n\nНельзя сначала выделить сервис, а затем начинать думать, как понять, работает ли он.\n\n### Шаг 13. Удалить старую реализацию\n\nПосле окончательного переключения необходимо удалить:\n\n- старые обработчики;\n    \n- прямые SQL-запросы;\n    \n- старые таблицы;\n    \n- фоновые задачи;\n    \n- устаревшие feature flags;\n    \n- временную синхронизацию;\n    \n- неиспользуемые API;\n    \n- обходные адаптеры.\n    \n\nПока старый и новый код остаются активными, миграция фактически не завершена.\n\n---\n\n## Пример выделения Notification Service\n\n### До выделения\n\n```text\nМонолит\n├── Users\n├── Orders\n├── Payments\n├── Notifications\n└── Общая БД\n```\n\nПосле оплаты код напрямую вызывает уведомления:\n\n```python\nwith transaction:\n    payment.mark_succeeded()\n    Notification.objects.create(\n        user_id=payment.user_id,\n        template=\"payment-succeeded\",\n    )\n```\n\n### Промежуточное состояние\n\nВ той же транзакции записывается событие:\n\n```python\nwith transaction:\n    payment.mark_succeeded()\n\n    outbox.add(\n        event_type=\"PaymentSucceeded\",\n        payload={\n            \"payment_id\": str(payment.id),\n            \"user_id\": str(payment.user_id),\n        },\n    )\n```\n\nOutbox worker отправляет событие:\n\n```text\nMonolith DB\n    │\n    ▼\nOutbox Worker\n    │\n    ▼\nMessage Broker\n    │\n    ▼\nNotification Service\n```\n\n### После выделения\n\n```text\nPayment Module\n    │ PaymentSucceeded\n    ▼\nMessage Broker\n    │\n    ▼\nNotification Service\n    │\n    ├── выбирает шаблон\n    ├── получает разрешённые контактные данные\n    ├── отправляет сообщение\n    └── сохраняет историю попыток\n```\n\nМонолит больше не знает, каким SMTP-провайдером пользуется сервис, сколько попыток отправки выполняется и как устроена его база.\n\n---\n\n## Как понять, что выделение завершено\n\nМикросервис действительно выделен, когда:\n\n```text\nего можно развернуть независимо;\nон владеет своими таблицами;\nмонолит не читает его БД напрямую;\nон не читает таблицы монолита напрямую;\nмежду ними существует явный контракт;\nего отказ обрабатывается предсказуемо;\nесть отдельные метрики и логи;\nсуществует процедура отката;\nстарая реализация удалена.\n```\n\nПросто вынести код в отдельный контейнер недостаточно:\n\n```text\nОтдельный контейнер\n        +\nобщая база\n        +\nобщие модели\n        +\nсовместный релиз\n        =\nраспределённый монолит\n```\n\n### Итоговая схема\n\n```text\nDDD:\nдомен\n  ↓\nподдомены\n  ↓\nbounded contexts\n  ↓\nагрегаты и бизнес-инварианты\n  ↓\nкарта взаимодействий\n  ↓\nкандидаты в микросервисы\n```\n\n```text\nВыделение сервиса:\nвыбрать бизнес-границу\n  ↓\nизолировать модуль в монолите\n  ↓\nопределить API и события\n  ↓\nпередать сервису владение данными\n  ↓\nдобавить адаптер и маршрутизацию\n  ↓\nпостепенно переключить трафик\n  ↓\nудалить старую реализацию\n```\n\nГлавный принцип:\n\n```text\nDDD помогает определить правильную бизнес-границу.\n\nStrangler Fig, Anti-Corruption Layer, Outbox\nи миграция данных помогают физически отделить эту границу\nот работающего монолита.\n```\n\n### Основные источники\n\n- Microsoft Learn: определение границ микросервисов через bounded contexts и агрегаты. ([Microsoft Learn](https://learn.microsoft.com/en-us/azure/architecture/microservices/model/microservice-boundaries?utm_source=chatgpt.com \"Identify microservice boundaries - Azure Architecture Center | Microsoft Learn\"))\n- Microsoft Learn: анализ домена и стратегический DDD. ([Microsoft Learn](https://learn.microsoft.com/ru-ru/azure/architecture/microservices/model/domain-analysis?utm_source=chatgpt.com \"Использование анализа домена для моделирования микрослужб - Azure Architecture Center | Microsoft Learn\"))\n- AWS Prescriptive Guidance: декомпозиция по поддоменам и бизнес-возможностям. ([Документация AWS](https://docs.aws.amazon.com/prescriptive-guidance/latest/modernization-decomposing-monoliths/decompose-subdomain.html?utm_source=chatgpt.com \"Decompose by subdomain - AWS Prescriptive Guidance\"))\n- AWS и Microsoft: постепенная миграция по Strangler Fig. ([Документация AWS](https://docs.aws.amazon.com/prescriptive-guidance/latest/modernization-decomposing-monoliths/strangler-fig.html?utm_source=chatgpt.com \"Strangler fig pattern - AWS Prescriptive Guidance\"))\n- AWS: Transactional Outbox для надёжной публикации событий. ([Документация AWS](https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/transactional-outbox.html?utm_source=chatgpt.com \"Transactional outbox pattern - AWS Prescriptive Guidance\"))"
