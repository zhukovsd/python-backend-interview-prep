  id = 7
  question = "Стоит ли жертвовать независимостью БД микросервиса при нехватке ресурсов?"
  answer = "### Основной вывод\n\nПри нехватке ресурсов можно пожертвовать **физической изоляцией БД**, но нежелательно жертвовать **логическим владением данными**.\n\nТо есть допустимо:\n\n```text\nОдин PostgreSQL-сервер или кластер\n├── order_db / order_schema\n├── payment_db / payment_schema\n└── notification_db / notification_schema\n```\n\nНо нежелательно:\n\n```text\nOrder Service ───┐\nPayment Service ─┼──> общие таблицы users, orders, payments\nNotification ────┘\n```\n\nAWS прямо указывает, что при использовании общей реляционной БД данные можно сохранять приватными за счёт отдельных таблиц или схем для каждого микросервиса. Microsoft также формулирует основной принцип как владение сервисом своими доменными данными, а не обязательное наличие отдельного физического сервера. \n\n### Уровни изоляции\n\nОт наиболее сильной к наиболее компромиссной:\n\n|Вариант|Изоляция|Стоимость|Оценка|\n|---|--:|--:|---|\n|Отдельный DB-кластер на сервис|Максимальная|Высокая|Нужен не всегда|\n|Отдельная база в общем кластере|Высокая|Средняя|Хороший компромисс|\n|Отдельная схема в общей базе|Достаточная|Низкая|Часто оптимальный вариант|\n|Отдельные таблицы без схем|Средняя|Низкая|Допустимо при строгих правах|\n|Общие таблицы с прямым доступом|Низкая|Сначала низкая|Обычно плохой вариант|\n\n### Наиболее практичный вариант\n\nПри ограниченных ресурсах:\n\n```text\nОдин PostgreSQL\n├── order_schema\n├── payment_schema\n└── notification_schema\n```\n\nДля каждого сервиса создаётся отдельная роль:\n\n```sql\nCREATE ROLE order_service LOGIN PASSWORD '...';\nCREATE ROLE payment_service LOGIN PASSWORD '...';\n\nGRANT USAGE ON SCHEMA order_schema TO order_service;\nGRANT SELECT, INSERT, UPDATE, DELETE\nON ALL TABLES IN SCHEMA order_schema\nTO order_service;\n```\n\nПри этом `order_service` не получает доступ к `payment_schema`.\n\nMicrosoft описывает аналогичную схему: отдельная схема и отдельная роль для каждого микросервиса позволяют сохранить разделение при использовании общего PostgreSQL-кластера. \n\n### Что должно оставаться независимым\n\nДаже на общей физической БД у каждого сервиса должны быть собственные:\n\n```text\nтаблицы или схема;\nучётная запись БД;\nмиграции;\nрепозитории и ORM-модели;\nправо изменять данные;\nвладелец бизнес-правил;\nжизненный цикл схемы.\n```\n\nНапример:\n\n```text\nOrder Service владеет:\norder_schema.orders\norder_schema.order_items\n\nPayment Service владеет:\npayment_schema.payments\npayment_schema.refunds\n```\n\n`Order Service` не должен выполнять:\n\n```sql\nSELECT *\nFROM payment_schema.payments;\n```\n\nВместо этого:\n\n```text\nOrder Service ──API──> Payment Service\n```\n\nили:\n\n```text\nPayment Service ──PaymentSucceeded──> брокер сообщений\n```\n\nПринцип `Database per Service` означает прежде всего приватность данных и слабую связанность. Он не требует отдельного сервера для каждой базы. \n\n### Чем вы жертвуете при общем кластере\n\nДаже при отдельных схемах сохраняется инфраструктурная связанность.\n\n#### Общая точка отказа\n\n```text\nPostgreSQL недоступен\n        ↓\nOrder Service недоступен\nPayment Service недоступен\nNotification Service недоступен\n```\n\n#### Конкуренция за ресурсы\n\nОдин сервис может перегрузить:\n\n```text\nCPU;\nдиск и IOPS;\nбуферный кеш;\nчисло подключений;\nWAL;\nрепликацию.\n```\n\n#### Общие эксплуатационные операции\n\nОбновление PostgreSQL, резервное копирование или проблема репликации затрагивает сразу несколько сервисов.\n\n#### Ограниченный выбор технологий\n\nНельзя независимо перевести один сервис на MongoDB, Cassandra или другое хранилище без отдельной миграции.\n\nПоэтому общий кластер уменьшает **инфраструктурную независимость**, но при правильной изоляции не обязательно разрушает **архитектурную независимость**.\n\n### Когда отдельная схема является нормальным решением\n\nТакой компромисс разумен, когда:\n\n- проект небольшой или средний;\n    \n- сервисов немного;\n    \n- нагрузка умеренная;\n    \n- одна команда обслуживает инфраструктуру;\n    \n- отдельные managed-базы слишком дороги;\n    \n- нет разных требований по безопасности и compliance;\n    \n- нет необходимости масштабировать базы независимо;\n    \n- отказ общего DB-кластера допустим для всей системы.\n    \n\nAWS рекомендует отдельное хранилище на сервис, когда требуется раздельное масштабирование, повышенная устойчивость либо разные требования безопасности и соответствия. Из этого следует, что при отсутствии таких требований общая инфраструктура с приватными схемами может быть обоснованным компромиссом. \n\n### Когда общий кластер уже опасен\n\nЛучше разделить базы физически, если:\n\n```text\nPayment Service требует повышенной защиты;\nодин сервис создаёт основную нагрузку на I/O;\nсервис должен масштабироваться отдельно;\nдля сервисов нужны разные версии или настройки СУБД;\nнужны независимые backup и restore;\nразные требования к доступности;\nразные команды администрируют данные;\nкомпрометация одной DB-роли не должна затрагивать другие домены.\n```\n\nОсобенно это касается:\n\n- платежей;\n    \n- балансов;\n    \n- персональных и медицинских данных;\n    \n- аудита;\n    \n- систем с разными регуляторными требованиями.\n    \n\n### Чего делать не следует\n\n#### Общие таблицы\n\n```text\nService A и Service B оба изменяют customers\n```\n\nЭто создаёт:\n\n- связанность миграций;\n    \n- обход бизнес-правил владельца данных;\n    \n- конфликты блокировок;\n    \n- невозможность независимого релиза;\n    \n- неясную ответственность;\n    \n- широкие права доступа.\n    \n\nAWS предупреждает, что при shared database нужно избегать таблиц, в которые пишут несколько сервисов, а любые изменения схемы приходится делать совместимыми со всеми версиями зависимых сервисов. \n\n#### Общий пользователь БД\n\nПлохо:\n\n```env\nDATABASE_USER=application\nDATABASE_PASSWORD=common-password\n```\n\nдля всех сервисов.\n\nТогда невозможно:\n\n- ограничить права;\n    \n- установить реального инициатора запросов;\n    \n- отозвать доступ одного сервиса;\n    \n- оценить последствия компрометации.\n    \n\n#### Межсервисные `JOIN`\n\nПлохо:\n\n```sql\nSELECT *\nFROM order_schema.orders o\nJOIN payment_schema.payments p\n  ON p.order_id = o.id;\n```\n\nТакой запрос связывает схемы и жизненные циклы сервисов. Для межсервисных данных применяют API Composition, события, CQRS/read-модели или денормализацию. AWS рекомендует отдельные паттерны для запросов, охватывающих несколько сервисных хранилищ. \n\n### Если ресурсов совсем мало\n\nЕсли невозможно обеспечить даже:\n\n```text\nотдельные схемы;\nотдельные DB-роли;\nнезависимые миграции;\nзапрет прямого доступа к чужим таблицам;\n```\n\nто стоит рассмотреть **модульный монолит**, а не создавать формальные микросервисы с общей моделью данных.\n\n```text\nМодульный монолит:\nодин процесс;\nодна БД;\nявные модули;\nявное владение таблицами;\nпростые локальные транзакции.\n```\n\nЭто обычно безопаснее и проще, чем распределённый монолит:\n\n```text\nмного сервисов\n+\nсетевая сложность\n+\nобщая БД\n+\nобщие таблицы\n+\nсовместные релизы\n```\n\n### Практическая рекомендация\n\nПри ограниченном бюджете:\n\n```text\n1. Использовать один PostgreSQL-кластер.\n2. Создать отдельную схему или базу на сервис.\n3. Создать отдельную DB-роль на сервис.\n4. Запретить доступ к чужим схемам.\n5. Вести миграции отдельно.\n6. Не использовать внешние ключи между схемами сервисов.\n7. Не выполнять межсервисные JOIN.\n8. Общаться через API или события.\n9. Установить лимиты подключений и ресурсов.\n10. Заранее предусмотреть возможность вынести схему\n    на отдельный сервер.\n```\n\nИтоговая граница:\n\n```text\nМожно разделять сервер:\nOrder DB и Payment DB работают в одном PostgreSQL.\n\nНельзя разделять владение:\nOrder Service не изменяет данные Payment Service.\n```\n\n**Физическая база на каждый сервис — оптимизация изоляции. Частное владение данными — фундаментальное требование.** При нехватке ресурсов сокращать следует количество серверов, а не размывать владельцев таблиц и бизнес-правил."
  popularity = 2.63

[[questions]]
  id = 8
  question = "Какие существуют способы решения проблемы распределённых транзакций?"
  answer = "### Главная проблема\n\nРаспределённая транзакция возникает, когда одна бизнес-операция должна изменить данные в нескольких независимых местах:\n\n```text\nсоздать заказ\nсписать деньги\nуменьшить остаток товара\nсоздать доставку\n```\n\nЕсли всё лежит в одной БД, это обычно решается обычной ACID-транзакцией. Если данные находятся в разных сервисах, разных БД или ещё и в брокере сообщений, обычной локальной транзакции уже недостаточно.\n\nГлавный вопрос: что делать, если часть операции уже успешно выполнена, а следующая часть упала.\n\n---\n\n### 1. Не делать распределённую транзакцию\n\nСамый надёжный вариант — спроектировать систему так, чтобы одна строгая транзакция не пересекала границы нескольких сервисов.\n\nНапример, вместо этого:\n\n```text\nOrderService пишет в orders\nPaymentService пишет в payments\nInventoryService пишет в stock\nи всё это должно быть одной ACID-транзакцией\n```\n\nлучше, когда критически связанные данные находятся внутри одного сервиса или одной БД:\n\n```text\nOrderService владеет заказом и его статусом\nPaymentService отдельно проводит платёж\nInventoryService отдельно резервирует товар\n```\n\nТогда каждый сервис делает свою локальную транзакцию, а общая согласованность достигается через статусы, события и компенсации. В микросервисной архитектуре это нормальный подход: каждый сервис владеет своими данными, а согласованность между сервисами становится отдельной архитектурной задачей. AWS описывает Saga как способ обеспечивать целостность в распределённых транзакциях через последовательность локальных транзакций и компенсации. \n\n---\n\n### 2. Two-Phase Commit / 2PC / XA\n\nЭто классический вариант настоящей распределённой ACID-транзакции.\n\nИдея:\n\n```text\nФаза 1: prepare\n  координатор спрашивает все участники:\n  \"Вы готовы зафиксировать изменения?\"\n\nФаза 2: commit / rollback\n  если все ответили \"готов\" — координатор отправляет commit\n  если кто-то не готов — координатор отправляет rollback\n```\n\nПримерно:\n\n```text\nTransaction Coordinator\n        |\n        | prepare\n        v\n   DB1   DB2   DB3\n\nесли все OK:\n\nTransaction Coordinator\n        |\n        | commit\n        v\n   DB1   DB2   DB3\n```\n\nPostgreSQL поддерживает двухфазный commit через `PREPARE TRANSACTION`, `COMMIT PREPARED` и `ROLLBACK PREPARED`; документация отдельно указывает, что 2PC предназначен для внешних transaction manager’ов. ([PostgreSQL](https://www.postgresql.org/docs/current/two-phase.html?utm_source=chatgpt.com \"Documentation: 18: 67.4. Two-Phase Transactions\")) MySQL поддерживает XA-транзакции, где несколько transactional resources могут участвовать в одной global transaction. \n\nПлюсы:\n\n```text\nстрогая атомарность\nпонятная модель \"всё или ничего\"\nподходит для некоторых enterprise-систем\n```\n\nМинусы:\n\n```text\nсложно администрировать\nучастники могут держать блокировки\nпри сбоях возможны подвисшие prepared transactions\nхуже масштабируется\nплохо подходит для долгих бизнес-процессов\nне все хранилища и брокеры нормально поддерживают XA/2PC\n```\n\nНа практике 2PC используют осторожно. В микросервисах его часто избегают, потому что он сильно связывает сервисы и инфраструктуру.\n\n---\n\n### 3. Saga\n\nSaga — самый частый подход для микросервисов.\n\nСмысл: большая распределённая операция разбивается на цепочку локальных транзакций. Каждая локальная транзакция фиксируется в своей БД. Если один из шагов падает, запускаются компенсирующие действия. AWS описывает Saga именно как последовательность локальных транзакций, где при ошибке выполняются compensating transactions для отката уже сделанных изменений. \n\nПример покупки:\n\n```text\n1. Создать заказ          → order_created\n2. Зарезервировать товар  → stock_reserved\n3. Списать оплату         → payment_charged\n4. Подтвердить заказ      → order_confirmed\n```\n\nЕсли оплата не прошла:\n\n```text\npayment_failed\n→ отменить резерв товара\n→ перевести заказ в статус cancelled\n```\n\nВажно: это не rollback в смысле SQL-транзакции. Компенсация — это новая бизнес-операция, которая логически отменяет предыдущий шаг.\n\nНапример:\n\n```text\nне \"откатить INSERT payment\"\nа \"создать refund / отменить платёж / снять резерв\"\n```\n\nЕсть два основных варианта Saga.\n\n---\n\n### 4. Saga Choreography\n\nПри choreography нет центрального координатора. Сервисы реагируют на события друг друга.\n\n```text\nOrderService:\n  создал заказ\n  опубликовал OrderCreated\n\nInventoryService:\n  получил OrderCreated\n  зарезервировал товар\n  опубликовал StockReserved\n\nPaymentService:\n  получил StockReserved\n  списал деньги\n  опубликовал PaymentCompleted\n```\n\nAWS описывает saga choreography как вариант, где участники публикуют и обрабатывают события, а при сбое выполняются compensatory transactions для восстановления согласованности. \n\nПлюсы:\n\n```text\nнет единого координатора\nсервисы слабо связаны\nхорошо подходит для event-driven архитектуры\n```\n\nМинусы:\n\n```text\nсложнее понимать общий процесс\nбизнес-логика размазана по сервисам\nсложнее отлаживать\nпри росте количества событий легко получить хаос\n```\n\nПодходит, когда процесс простой и хорошо ложится на события.\n\n---\n\n### 5. Saga Orchestration\n\nПри orchestration есть центральный координатор — orchestrator. Он явно управляет шагами процесса.\n\n```text\nOrderSagaOrchestrator:\n  1. вызвать InventoryService.reserve()\n  2. вызвать PaymentService.charge()\n  3. вызвать DeliveryService.create()\n  4. если ошибка — вызвать компенсации\n```\n\nСхема:\n\n```text\nOrchestrator\n   ├── reserve stock\n   ├── charge payment\n   ├── create delivery\n   └── compensate on failure\n```\n\nAWS описывает saga orchestration как подход с центральным координатором, который помогает сохранять целостность распределённой транзакции между несколькими сервисами. \n\nПлюсы:\n\n```text\nпроцесс виден в одном месте\nпроще контролировать порядок шагов\nпроще отлаживать сложные сценарии\nудобно хранить состояние процесса\n```\n\nМинусы:\n\n```text\norchestrator становится важным компонентом\nсервисы сильнее завязаны на команды orchestrator'а\nнужно аккуратно проектировать retry, timeout, compensation\n```\n\nДля сложных бизнес-процессов orchestration обычно понятнее, чем choreography.\n\n---\n\n### 6. Transactional Outbox\n\nOutbox решает частую проблему: нужно одновременно изменить данные в БД и отправить событие в брокер.\n\nПлохой вариант:\n\n```text\n1. записали заказ в БД\n2. отправили событие в Kafka/RabbitMQ\n```\n\nПроблема: между шагами может быть сбой.\n\n```text\nБД обновилась, но событие не отправилось\nили событие отправилось, но БД откатилась\n```\n\nTransactional Outbox решает это так:\n\n```text\nв одной локальной транзакции:\n  1. записать бизнес-данные\n  2. записать событие в outbox-таблицу\n\nпосле commit:\n  отдельный процесс читает outbox\n  и публикует событие в брокер\n```\n\nПример:\n\n```sql\nBEGIN;\n\nINSERT INTO orders (id, status)\nVALUES (100, 'created');\n\nINSERT INTO outbox_events (event_type, payload)\nVALUES ('OrderCreated', '{\"order_id\": 100}');\n\nCOMMIT;\n```\n\nAWS описывает transactional outbox как паттерн для решения проблемы dual write, когда одна операция включает запись в БД и отправку сообщения/события, а сбой одной из операций может привести к несогласованности. \n\nПлюсы:\n\n```text\nне нужен 2PC между БД и брокером\nсобытие не теряется после commit в БД\nхорошо сочетается с Saga\n```\n\nМинусы:\n\n```text\nнужен отдельный publisher\nнужно чистить outbox\nвозможны дубли событий\nпотребители должны быть идемпотентными\n```\n\nAWS отдельно указывает, что при outbox возможны дубли событий, поэтому consuming service рекомендуется делать идемпотентным. \n\n---\n\n### 7. Inbox / Idempotent Consumer\n\nВ распределённых системах часто нельзя полагаться на то, что сообщение будет обработано ровно один раз. При retry одно и то же событие может прийти повторно.\n\nПоэтому потребитель должен быть идемпотентным: повторная обработка того же сообщения не должна менять результат сверх первого применения. Microservices.io описывает Idempotent Consumer именно так: при at-least-once delivery потребитель может получить одно сообщение несколько раз, поэтому результат повторной обработки должен быть таким же, как после одной обработки. \n\nПример inbox-таблицы:\n\n```sql\nCREATE TABLE processed_messages (\n    message_id uuid PRIMARY KEY,\n    processed_at timestamp NOT NULL DEFAULT now()\n);\n```\n\nЛогика:\n\n```text\n1. получил сообщение\n2. проверил message_id\n3. если уже обработано — пропустить\n4. если новое — выполнить действие\n5. записать message_id как обработанный\n```\n\nЭто особенно важно вместе с Outbox и Saga, потому что retry и повторная доставка сообщений — нормальная часть такой архитектуры.\n\n---\n\n### 8. TCC: Try / Confirm / Cancel\n\nTCC — это подход, где операция явно делится на три шага:\n\n```text\nTry     — предварительно зарезервировать ресурс\nConfirm — окончательно подтвердить\nCancel  — отменить резерв\n```\n\nПример с оплатой и складом:\n\n```text\nTry:\n  зарезервировать товар\n  заблокировать сумму на карте\n\nConfirm:\n  окончательно списать деньги\n  подтвердить списание товара\n\nCancel:\n  снять резерв товара\n  разблокировать деньги\n```\n\nTCC хорошо подходит, когда бизнес-операция естественно поддерживает резервирование. Например: бронь, лимиты, билеты, складские остатки, платёжная авторизация.\n\nМинус: не каждую операцию можно красиво разложить на `Try/Confirm/Cancel`. Нужно заранее проектировать модель данных под резервы и отмены.\n\n---\n\n### 9. Компенсирующие операции\n\nКомпенсации — это не отдельная технология, а общий принцип.\n\nПримеры:\n\n```text\nденьги списаны ошибочно → сделать refund\nтовар зарезервирован → снять резерв\nзаказ создан → перевести в cancelled\nдоставка создана → отменить доставку\nбаланс начислен → создать обратную операцию списания\n```\n\nКомпенсация нужна потому, что в распределённой системе часто нельзя физически “откатить всё назад”, как в одной SQL-транзакции. Уже отправленное письмо, внешний платёж или событие в другом сервисе нельзя просто откатить через `ROLLBACK`.\n\nПоэтому правильнее хранить состояние процесса:\n\n```text\npending\nreserved\npaid\nconfirmed\ncancelled\ncompensation_failed\n```\n\nА не надеяться, что все шаги всегда завершатся успешно.\n\n---\n\n### 10. Eventual Consistency\n\nВо многих системах вместо строгой мгновенной согласованности используют eventual consistency.\n\nЭто значит:\n\n```text\nсразу после операции разные сервисы могут видеть разные состояния,\nно через некоторое время система должна прийти к согласованному состоянию\n```\n\nНапример:\n\n```text\nOrderService уже создал заказ\nPaymentService ещё не обработал оплату\nInventoryService ещё не обновил резерв\n```\n\nВ этот момент заказ может быть в статусе:\n\n```text\npayment_pending\n```\n\nПотом события доедут, и статус станет:\n\n```text\nconfirmed\n```\n\nили:\n\n```text\ncancelled\n```\n\nSaga, Outbox, Inbox, retry и idempotency обычно работают именно в модели eventual consistency, а не в модели одной глобальной ACID-транзакции.\n\n---\n\n### 11. CDC вместо прямой отправки событий\n\nCDC — Change Data Capture. Идея: приложение пишет только в свою БД, а изменения из БД потом считываются из журнала изменений и публикуются наружу.\n\nУпрощённо:\n\n```text\nService → Database → CDC → Kafka/Event Bus → Other Services\n```\n\nЭто похоже на Outbox, но события могут забираться не ручным polling’ом outbox-таблицы, а через лог изменений БД.\n\nПлюсы:\n\n```text\nприложение не делает dual write\nможно надёжно публиковать события после commit\nменьше риска потерять событие\n```\n\nМинусы:\n\n```text\nусложняется инфраструктура\nнужно следить за схемой событий\nсложнее локальная разработка и отладка\n```\n\n---\n\n### Что выбрать на практике\n\nДля обычной микросервисной архитектуры чаще всего используют такую комбинацию:\n\n```text\n1. Локальная транзакция внутри каждого сервиса.\n2. Transactional Outbox для надёжной публикации событий.\n3. Saga для длинного бизнес-процесса.\n4. Idempotent Consumer / Inbox для защиты от дублей.\n5. Retry + timeout + dead-letter queue.\n6. Компенсирующие операции вместо глобального rollback.\n```\n\n`2PC/XA` имеет смысл, когда действительно нужна строгая атомарность между несколькими transactional resources и вся инфраструктура это поддерживает. Но для микросервисов, очередей, внешних API, платежей и долгих бизнес-процессов чаще выбирают Saga/Outbox/компенсации, потому что они лучше переживают частичные сбои и не требуют удерживать одну глобальную транзакцию."
