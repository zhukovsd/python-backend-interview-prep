  id = 11
  question = "Архитектура Stateful и Stateless — в чём различия и почему стремимся к Stateless"
  answer = "### Stateful и Stateless\n`Stateful` и `Stateless` — это два подхода к тому, хранит ли приложение состояние между запросами.  \n\nHTTP сам по себе является stateless-протоколом: каждый запрос независим, а связь между запросами обычно добавляют через cookies, токены или серверные сессии. \n\n### Stateless\nStateless-сервис не хранит пользовательское состояние внутри конкретного экземпляра приложения.  \nТо есть сервер не должен помнить:\n```\nпользователь X авторизован именно на этом сервере;\nкорзина пользователя лежит в памяти этого процесса;\nследующий запрос этого пользователя должен попасть на тот же инстанс.\n```\nПример stateless API:\n```\nClient -> Request with JWT -> App instance A -> Database\nClient -> Request with JWT -> App instance B -> Database\nClient -> Request with JWT -> App instance C -> Database\n```\nКаждый запрос содержит всё, что нужно для обработки: токен, параметры, body, headers. Данные, которые нужно хранить долго, лежат не в памяти приложения, а во внешнем хранилище: PostgreSQL, Redis, S3, Elasticsearch и т.д.\n\nПример:\n```python\n@app.get(\"/profile\")\nasync def get_profile(user=Depends(get_current_user)):\n    return await user_repository.get_by_id(user.id)\n```\nЗдесь приложение не хранит сессию пользователя в памяти. Оно получает пользователя из токена и достает данные из БД.\n\n### Stateful\nStateful-сервис хранит состояние между запросами внутри конкретного экземпляра приложения.  \n\nНапример:\n```\nApp instance A хранит session_id -> user_id в своей памяти\nApp instance B этого состояния не знает\nApp instance C этого состояния не знает\n```\nПроблема:\n```\n1-й запрос пользователя попал на instance A.\n2-й запрос попал на instance B.\nB не знает состояние пользователя.\nПользователь получает ошибку или теряет сессию.\n```\nЧтобы это работало, часто приходится использовать sticky sessions/session affinity, то есть балансировщик должен направлять одного пользователя на один и тот же сервер.\n\n### Главное различие\n\n|Критерий|Stateless|Stateful|\n|---|---|---|\n|Хранит состояние в приложении|Нет|Да|\n|Запросы независимы|Да|Нет|\n|Можно отправить запрос на любой инстанс|Да|Обычно нет|\n|Масштабирование|Проще|Сложнее|\n|Отказоустойчивость|Выше|Ниже, если состояние только в памяти|\n|Пример|REST API с JWT|Серверные сессии в памяти процесса|\n|Где хранится состояние|В БД, Redis, S3, токене|В конкретном процессе/сервере|\n\n### Почему стремимся к Stateless\nГлавная причина — проще масштабировать и поддерживать систему.  \n\nAWS Well-Architected прямо рекомендует делать приложения stateless, где это возможно, потому что stateless-приложения лучше горизонтально масштабируются и устойчивее к отказу отдельного узла.\n\n#### 1. Проще горизонтальное масштабирование\nStateless:\n```\nБыло 2 инстанса.\nДобавили еще 5.\nЛюбой запрос может попасть на любой инстанс.\n```\nStateful:\n```\nНужно помнить, на каком сервере лежит состояние пользователя.\nНужны sticky sessions.\nНужно думать, что делать при падении конкретного сервера.\n```\nAzure Well-Architected также рекомендует по возможности проектировать приложения stateless, а состояние выносить во внешнее хранилище.\n\n#### 2. Проще балансировка нагрузки\nПри Stateless балансировщик может распределять запросы свободно:\n```\nRequest 1 -> App A\nRequest 2 -> App B\nRequest 3 -> App C\n```\nПри Stateful балансировщик часто вынужден привязывать пользователя к конкретному серверу:\n```\nUser 1 -> всегда App A\nUser 2 -> всегда App B\n```\nЭто хуже, потому что один сервер может быть перегружен, а другой простаивать.\n\n#### 3. Проще переживать падение сервера\nStateless:\n```\nApp A упал.\nСледующий запрос ушел на App B.\nДанные не потеряны, потому что они в БД/Redis/S3.\n```\nStateful:\n```\nApp A упал.\nСостояние, которое было только в памяти App A, потеряно.\n```\nЭто особенно важно в Docker/Kubernetes, где контейнеры могут перезапускаться, переноситься между нодами и масштабироваться автоматически.\n\n#### 4. Проще деплой и обновления\nStateless-инстанс можно спокойно удалить и заменить новым:\n```\nСтарый контейнер остановили.\nНовый контейнер подняли.\nПользовательское состояние не потерялось.\n```\nС Stateful сложнее: нужно мигрировать состояние, аккуратно завершать сессии или обеспечивать репликацию.\n\n#### 5. Лучше подходит для cloud-native архитектуры\nВ облачной архитектуре инстансы приложения часто считаются временными. Поэтому состояние стараются хранить вне приложения: в базе данных, кэше, message broker, object storage. Red Hat также описывает основное различие так: stateful-приложения сохраняют прошлую и текущую информацию, а stateless — нет.\n\n### Важное уточнение\nStateless не означает, что состояния нет вообще.  \nСостояние есть почти всегда:  \n```\nпользователи;\nзаказы;\nкорзины;\nфайлы;\nплатежи;\nуведомления;\nсессии;\nнастройки.\n```\nНо в stateless-архитектуре это состояние не хранится внутри конкретного app-инстанса.\n\n### Когда Stateful нужен\nStateful — не всегда плохо. Он нужен там, где само состояние является частью работы системы.  \n\nПримеры:\n```\n1. WebSocket-соединения.\n2. Онлайн-игры.\n3. Чаты в реальном времени.\n4. Стриминг.\n5. Stateful workers.\n6. Базы данных.\n7. Очереди сообщений.\n8. Сервисы с долгими транзакциями или in-memory processing.\n```\nНапример, WebSocket-сервер держит открытое соединение с клиентом. Это уже stateful-поведение.\n\n### Главная мысль\nМы стремимся не к тому, чтобы «у системы не было состояния», а к тому, чтобы app-сервисы не хранили критичное состояние локально.  \n\nХорошая схема:\n```\nClient\n  |\n  v\nLoad Balancer\n  |\n  v\nApp instance A / B / C   <- stateless\n  |\n  v\nExternal state:\nPostgreSQL / Redis / S3 / Kafka\n```\n\nПлохая схема для масштабирования:\n```\nClient\n  |\n  v\nLoad Balancer\n  |\n  v\nApp instance A хранит session/user/cart в памяти\nApp instance B ничего об этом не знает\nApp instance C ничего об этом не знает\n```"
