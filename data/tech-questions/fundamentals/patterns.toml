[[questions]]
  id = 9
  question = "Паттерн Наблюдатель"
  answer = "**Наблюдатель** — это поведенческий паттерн проектирования, который задает связь «один ко многим»: когда один объект меняет состояние, все подписанные на него объекты получают уведомление. Этот паттерн также часто называют `Observer`, `Listener`, `Event-Subscriber`\n\n### Простая идея\nЕсть объект, за которым следят:\n```\nSubject / Publisher / Observable\n```\nИ есть объекты, которые хотят получать уведомления:\n```\nObservers / Subscribers / Listeners\n```\nКогда `Subject` меняется, он вызывает метод у всех наблюдателей.\n```\nSubject\n  ├── Observer A\n  ├── Observer B\n  └── Observer C\n```\nПример:\n```\nYouTube-канал = Subject\nПодписчики = Observers\n\nКанал выпускает видео -> подписчики получают уведомление\n```\n\n### Проблема без паттерна\nДопустим, после создания заказа нужно:\n1. Отправить email.\n2. Отправить push-уведомление.\n3. Записать событие в лог.\n4. Обновить аналитику.\n\nПлохой вариант:\n```python\nclass OrderService:\n    def create_order(self, user_id: int, product_id: int):\n        order = {\n            \"user_id\": user_id,\n            \"product_id\": product_id,\n            \"status\": \"created\",\n        }\n\n        self.send_email(order)\n        self.send_push(order)\n        self.write_log(order)\n        self.update_analytics(order)\n\n        return order\n\n    def send_email(self, order):\n        print(\"Send email\")\n\n    def send_push(self, order):\n        print(\"Send push\")\n\n    def write_log(self, order):\n        print(\"Write log\")\n\n    def update_analytics(self, order):\n        print(\"Update analytics\")\n```\n**Проблема:**   \n`OrderService` знает слишком много. Он отвечает не только за создание заказа, но и за email, push, логи, аналитику. При добавлении нового действия придется менять сам `OrderService`.\n\n### Решение через Observer\nВыносим реакции на событие в отдельные классы.  \nСначала создаем общий интерфейс наблюдателя:  \n```python\nfrom abc import ABC, abstractmethod\n\n\nclass Observer(ABC):\n    @abstractmethod\n    def update(self, event: dict) -> None:\n        pass\n```\nКонкретные наблюдатели:\n```python\nclass EmailObserver(Observer):\n    def update(self, event: dict) -> None:\n        print(f\"Send email for event: {event}\")\n\n\nclass PushObserver(Observer):\n    def update(self, event: dict) -> None:\n        print(f\"Send push for event: {event}\")\n\n\nclass LogObserver(Observer):\n    def update(self, event: dict) -> None:\n        print(f\"Write log for event: {event}\")\n```\nТеперь объект, за которым наблюдают:  \n```python\nclass Subject:\n    def __init__(self):\n        self._observers: list[Observer] = []\n\n    def attach(self, observer: Observer) -> None:\n        self._observers.append(observer)\n\n    def detach(self, observer: Observer) -> None:\n        self._observers.remove(observer)\n\n    def notify(self, event: dict) -> None:\n        for observer in self._observers:\n            observer.update(event)\n```\nСервис заказов:  \n```python\nclass OrderService(Subject):\n    def create_order(self, user_id: int, product_id: int):\n        order = {\n            \"user_id\": user_id,\n            \"product_id\": product_id,\n            \"status\": \"created\",\n        }\n\n        self.notify({\n            \"type\": \"order_created\",\n            \"payload\": order,\n        })\n\n        return order\n```\nИспользование:  \n```python\norder_service = OrderService()\n\norder_service.attach(EmailObserver())\norder_service.attach(PushObserver())\norder_service.attach(LogObserver())\n\norder_service.create_order(user_id=1, product_id=100)\n```\nРезультат:  \n```python\nSend email for event: {'type': 'order_created', ...}\nSend push for event: {'type': 'order_created', ...}\nWrite log for event: {'type': 'order_created', ...}\n```\n### Структура паттерна\n```\nSubject\n  - хранит список observers\n  - attach(observer)\n  - detach(observer)\n  - notify(event)\n\nObserver\n  - update(event)\n\nConcreteObserver\n  - EmailObserver\n  - PushObserver\n  - LogObserver\n```\nMicrosoft описывает Observer как схему, где подписчик регистрируется у поставщика и получает от него push-уведомления; это подходит для сценариев, где объект должен уведомлять другие компоненты об изменениях.\n\n### Где применяется\nObserver хорошо подходит, когда после одного события должны автоматически запускаться разные независимые реакции.  \n\n**Примеры:**  \n1. Пользователь зарегистрировался:\n   - отправить email\n   - создать профиль\n   - записать аудит\n\n2. Заказ создан:\n   - отправить уведомление\n   - списать товар\n   - обновить статистику\n\n3. Файл загружен:\n   - проверить антивирусом\n   - создать превью\n   - отправить событие в аналитику\n\n4. Изменилось состояние объекта:\n   - обновить UI\n   - пересчитать данные\n   - уведомить подписчиков\n\n### Backend-пример через события\nВ backend чаще используют не названия `Subject` и `Observer`, а `Event` и `Handler`.  \n```python\nfrom dataclasses import dataclass\nfrom typing import Protocol\n\n\n@dataclass\nclass OrderCreatedEvent:\n    order_id: int\n    user_id: int\n\n\nclass EventHandler(Protocol):\n    def handle(self, event: OrderCreatedEvent) -> None:\n        ...\n\n\nclass SendEmailHandler:\n    def handle(self, event: OrderCreatedEvent) -> None:\n        print(f\"Send email for order {event.order_id}\")\n\n\nclass WriteAuditLogHandler:\n    def handle(self, event: OrderCreatedEvent) -> None:\n        print(f\"Write audit log for order {event.order_id}\")\n\n\nclass EventDispatcher:\n    def __init__(self):\n        self._handlers: dict[type, list[EventHandler]] = {}\n\n    def register(self, event_type: type, handler: EventHandler) -> None:\n        self._handlers.setdefault(event_type, []).append(handler)\n\n    def dispatch(self, event) -> None:\n        for handler in self._handlers.get(type(event), []):\n            handler.handle(event)\n```\nИспользование:\n```python\ndispatcher = EventDispatcher()\n\ndispatcher.register(OrderCreatedEvent, SendEmailHandler())\ndispatcher.register(OrderCreatedEvent, WriteAuditLogHandler())\n\nevent = OrderCreatedEvent(order_id=10, user_id=5)\ndispatcher.dispatch(event)\n```\nТакой вариант часто ближе к реальному backend-коду, чем классический учебный пример с `Subject` и `Observer`.\n\n### Отличие от Strategy\n`Strategy` выбирает один алгоритм из нескольких:\n```\nОплатить картой\nили оплатить PayPal\nили оплатить бонусами\n```\n`Observer` уведомляет несколько объектов о событии:\n```\nЗаказ создан\nи нужно выполнить email\nи push\nи логирование\nи аналитику\n```\n\n### Отличие от Pub/Sub\nObserver и Pub/Sub похожи, но не одно и то же.  \nВ классическом Observer объект-источник обычно знает своих наблюдателей напрямую:\n```\nSubject -> Observer A\nSubject -> Observer B\n```\nВ Pub/Sub часто есть посредник: брокер, event bus, message broker.\n```\nPublisher -> Event Bus / Broker -> Subscribers\n```\nПример Pub/Sub:\n```\nService A -> Kafka / RabbitMQ / Redis Pub/Sub -> Service B, Service C\n```\nObserver чаще используется внутри одного приложения или процесса, а Pub/Sub чаще применяют для более слабой связности между частями системы или между сервисами. Microsoft отдельно рассматривает Observer и Publish-Subscribe как близкие, но разные подходы к уведомлению зависимых компонентов.\n\n**Плюсы**  \n1. Уменьшает связанность между объектами.\n2. Позволяет добавлять новые реакции без изменения основного класса.\n3. Удобен для событийной логики.\n4. Хорошо подходит для уведомлений, UI, аудита, аналитики.\n5. Помогает соблюдать Open/Closed Principle.\n\n**Минусы**  \n1. Сложнее отслеживать порядок выполнения observers.\n2. Может быть трудно дебажить цепочку событий.\n3. Один observer может замедлить всю операцию.\n4. Ошибка в одном observer может сломать уведомление остальных.\n5. При неаккуратной реализации можно забыть отписать observer и получить утечки памяти.\n\n### Когда использовать\nПаттерн стоит использовать, когда один объект должен уведомлять несколько других объектов, но не должен жестко зависеть от их конкретных классов.  \n\nХорошие случаи:\n1. После одного действия нужно выполнить несколько независимых реакций.\n2. Нужно подписывать и отписывать обработчики во время выполнения.\n3. Нужно убрать лишние зависимости из основного сервиса.\n4. Нужно сделать событийную модель внутри приложения.\n\nКогда не стоит использовать:  \n1. Есть только одно простое действие после события.\n2. Логика строго последовательная и зависит от результата каждого шага.\n3. Важно явно видеть весь сценарий в одном use case.\n4. Проект маленький, и Observer только усложнит код."
