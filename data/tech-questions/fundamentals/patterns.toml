[[questions]]
  id = 1
  question = "Какие группы паттернов (паттерны) вы можете назвать (порождающие, структурные, поведенческие) и приведите примеры из каждой?"
  answer = "### Группы паттернов проектирования\nКлассическая классификация GoF делит паттерны на 3 основные группы:\n1. Порождающие\n2. Структурные\n3. Поведенческие\n\n### 1. Порождающие паттерны\nОтвечают за создание объектов. Помогают скрыть сложную логику создания и сделать код менее зависимым от конкретных классов.\n**Примеры:**\n\n|Паттерн|Назначение|\n|---|---|\n|Singleton|Гарантирует, что у класса есть только один экземпляр|\n|Factory Method|Создаёт объекты через метод, позволяя подклассам выбирать конкретный класс|\n|Abstract Factory|Создаёт семейства связанных объектов|\n|Builder|Пошагово собирает сложный объект|\n|Prototype|Создаёт новые объекты копированием существующих|\n### 2. Структурные паттерны\nОтвечают за организацию классов и объектов. Помогают удобно связывать объекты между собой, не усложняя архитектуру.\n**Примеры:**\n\n|Паттерн|Назначение|\n|---|---|\n|Adapter|Позволяет объектам с несовместимыми интерфейсами работать вместе|\n|Decorator|Динамически добавляет объекту новое поведение|\n|Facade|Даёт простой интерфейс к сложной системе|\n|Proxy|Контролирует доступ к другому объекту|\n|Composite|Позволяет работать с группой объектов как с одним объектом|\n|Bridge|Разделяет абстракцию и реализацию|\n|Flyweight|Экономит память за счёт переиспользования общих данных|\n\n### 3. Поведенческие паттерны\nОтвечают за взаимодействие объектов и распределение ответственности между ними.\n**Примеры:**\n\n|Паттерн|Назначение|\n|---|---|\n|Strategy|Позволяет менять алгоритм во время выполнения программы|\n|Observer|Уведомляет зависимые объекты об изменениях|\n|Command|Инкапсулирует действие в отдельный объект|\n|Chain of Responsibility|Передаёт запрос по цепочке обработчиков|\n|State|Меняет поведение объекта в зависимости от его состояния|\n|Template Method|Задаёт общий алгоритм, позволяя переопределять отдельные шаги|\n|Iterator|Даёт способ последовательно обходить коллекцию|\n|Mediator|Централизует взаимодействие между объектами|\n|Memento|Сохраняет и восстанавливает состояние объекта|\n|Visitor|Добавляет операции к объектам без изменения их классов|"
  popularity = 10.53

[[questions]]
  id = 2
  question = "Как реализовать паттерн Singleton и какие есть основные способы реализации?"
  answer = "`Singleton` — это паттерн, который гарантирует, что у класса будет только один экземпляр, и даёт глобальную точку доступа к нему.\n\nВ Python Singleton обычно реализуют не так часто, как в Java/C++, потому что во многих случаях достаточно обычного модуля: Python кэширует импортированные модули в `sys.modules`, и повторный импорт обычно возвращает уже загруженный объект модуля.\n\n### 1. Реализация через `__new__`\n\nЭто один из самых прямых способов. Метод `__new__` отвечает за создание объекта до вызова `__init__`. Python-документация прямо указывает, что `__new__()` вызывается для создания нового экземпляра класса.\n```python\nclass Singleton:\n    _instance = None\n\n    def __new__(cls, *args, **kwargs):\n        if cls._instance is None:\n            cls._instance = super().__new__(cls)\n        return cls._instance\n\n\na = Singleton()\nb = Singleton()\n\nprint(a is b)  # True\n```\nПроблема этого варианта: `__init__` будет вызываться каждый раз при `Singleton()`.\nНапример:\n```python\nclass Singleton:\n    _instance = None\n\n    def __new__(cls, value):\n        if cls._instance is None:\n            cls._instance = super().__new__(cls)\n        return cls._instance\n\n    def __init__(self, value):\n        self.value = value\n\n\na = Singleton(10)\nb = Singleton(20)\n\nprint(a.value)  # 20\nprint(b.value)  # 20\n```\nОбъект один, но состояние перезаписалось.  \n\nБолее безопасный вариант:\n```python\nclass Singleton:\n    _instance = None\n    _initialized = False\n\n    def __new__(cls, value):\n        if cls._instance is None:\n            cls._instance = super().__new__(cls)\n        return cls._instance\n\n    def __init__(self, value):\n        if self._initialized:\n            return\n\n        self.value = value\n        self._initialized = True\n\n\na = Singleton(10)\nb = Singleton(20)\n\nprint(a is b)       # True\nprint(a.value)      # 10\nprint(b.value)      # 10\n```\n\n### 2. Потокобезопасный Singleton через `Lock`\nЕсли объект может создаваться из нескольких потоков, простой вариант через `__new__` может быть недостаточным. Для защиты критической секции используют блокировку. В документации Python `threading.Lock` описан как механизм, который блокирует поток до освобождения lock.\n```python\nfrom threading import Lock\n\n\nclass Singleton:\n    _instance = None\n    _lock = Lock()\n\n    def __new__(cls, value):\n        if cls._instance is None:\n            with cls._lock:\n                if cls._instance is None:\n                    cls._instance = super().__new__(cls)\n        return cls._instance\n\n    def __init__(self, value):\n        if hasattr(self, \"_initialized\"):\n            return\n\n        self.value = value\n        self._initialized = True\n\n\na = Singleton(10)\nb = Singleton(20)\n\nprint(a is b)   # True\nprint(a.value)  # 10\n```\nОна нужна, чтобы не заходить в lock после того, как объект уже создан.\n\n### 3. Реализация через метакласс\nМетакласс управляет созданием экземпляров классов. Это более универсальный способ, если Singleton нужно применить к нескольким классам.\n```python\nclass SingletonMeta(type):\n    _instances = {}\n\n    def __call__(cls, *args, **kwargs):\n        if cls not in cls._instances:\n            cls._instances[cls] = super().__call__(*args, **kwargs)\n        return cls._instances[cls]\n\n\nclass Database(metaclass=SingletonMeta):\n    def __init__(self, url):\n        self.url = url\n\n\ndb1 = Database(\"postgres://localhost\")\ndb2 = Database(\"sqlite://local\")\n\nprint(db1 is db2)   # True\nprint(db1.url)      # postgres://localhost\nprint(db2.url)      # postgres://localhost\n```\nПлюс: можно переиспользовать для разных классов.\nМинус: метаклассы усложняют код.\n\n### 4. Реализация через декоратор\nМожно написать декоратор, который будет возвращать уже созданный объект.\n```python\ndef singleton(cls):\n    instances = {}\n\n    def wrapper(*args, **kwargs):\n        if cls not in instances:\n            instances[cls] = cls(*args, **kwargs)\n        return instances[cls]\n\n    return wrapper\n\n\n@singleton\nclass Config:\n    def __init__(self, debug):\n        self.debug = debug\n\n\nc1 = Config(True)\nc2 = Config(False)\n\nprint(c1 is c2)       # True\nprint(c1.debug)       # True\nprint(c2.debug)       # True\n```\nМинус: после декорирования `Config` уже не совсем обычный класс, а функция-обёртка. Это может мешать наследованию, `isinstance`, introspection и типизации.\n\n### 5. Singleton через модуль\nВ Python это часто самый простой и практичный способ.\nФайл `settings.py`:\n```python\nclass Config:\n    def __init__(self):\n        self.debug = True\n        self.db_url = \"postgres://localhost\"\n\n\nconfig = Config()\n```\nИспользование:\n```python\nfrom settings import config\n\nprint(config.debug)\n```\nПлюс: просто, понятно, без метаклассов и переопределения `__new__`.\nМинус: это не классический Singleton-класс, а объект уровня модуля.\n\n### Что лучше использовать на практике\nДля Python чаще всего:\n\n|Способ|Когда использовать|\n|---|---|\n|Модуль|Лучший простой вариант для конфигов, логгеров, клиентов|\n|`__new__`|Когда нужно сохранить обычный синтаксис `Class()`|\n|`__new__` + `Lock`|Когда объект может создаваться из разных потоков|\n|Метакласс|Когда Singleton нужен для нескольких классов|\n|Декоратор|Для простых учебных примеров, но в проде спорный вариант|"
  popularity = 2.63

[[questions]]
  id = 3
  question = "Чем отличается паттерн Декоратор от Адаптера?"
  answer = "|Критерий|Adapter|Decorator|\n|---|---|---|\n|**Цель**|Преобразовать интерфейс одного класса в интерфейс, который ожидает клиент.|Добавить новую функциональность объекту без изменения его структуры.|\n|**Пример использования**|Используется, когда у нас есть несовместимые интерфейсы, которые нужно связать.|Используется, когда нужно динамически добавлять новые возможности объектам.|\n|**Взаимодействие**|Адаптирует существующий класс к новому интерфейсу.|Оборачивает объект, добавляя или изменяя его поведение.|\n|**Структура**|Реализует интерфейс, который ожидает клиент, и делегирует вызовы адаптируемому классу.|Оборачивает объект одного и того же интерфейса, добавляя новую логику.|\n|**Пример в реальной жизни**|Электрический адаптер, который преобразует тип розетки.|Подарочная упаковка на коробке, которая не меняет содержимое, но добавляет украшение.|\n\n---\n***Паттерн Decorator***\n\nДекоратор — это структурный паттерн проектирования, который позволяет добавлять объектам новые обязанности на лету, помещая их в специальные обёртки.\n\nКлючевые особенности:\n\n- Динамическое добавление функциональности: Не изменяя код исходного объекта.\n- Композиция вместо наследования: Декоратор оборачивает объект, вместо того чтобы расширять его через наследование.\n- Прозрачность для клиента: Декоратор использует тот же интерфейс, что и объект, который он оборачивает."
  popularity = 2.63

[[questions]]
  id = 4
  question = "Паттерн Адаптер"
  answer = "### Adapter Pattern\n\n**Адаптер** — это структурный паттерн, который позволяет подружить несовместимые объекты. Адаптер выступает прослойкой между двумя объектами, превращая вызовы одного в вызовы понятные другому.\n\n**Суть паттерна:**\nЕсть класс или объект с определённым интерфейсом, который неудобен или несовместим с остальной системой. Создаётся адаптер — новый класс, реализующий нужный клиенту интерфейс. Адаптер содержит ссылку на оригинальный объект и внутри методов преобразует вызовы клиента в вызовы методов оригинального объекта.\n\nПример реализации:\n```python\nclass OldSystem:\n\tdef old_method(self):\n\t\tprint(\"Старый метод\")\n\nclass Adapter: \n\tdef __init__(self, old_system): \n\t\tself.old_system = old_system \n\t\n\tdef new_method(self): \n\t\tprint(\"Адаптер вызывает:\") \n\t\tself.old_system.old_method()\n\n# Использование \nold = OldSystem() \nadapter = Adapter(old) \nadapter.new_method\n```\nВывод:\n```python\nАдаптер вызывает: \nСтарый метод\n```\n\n**Использование:**  \n- Когда нужно использовать сторонний или legacy класс с несовместимым интерфейсом.\n- Для объединения нескольких интерфейсов в один.\n- Для адаптации классов, которые нельзя модифицировать.\n\nПаттерн помогает создавать гибкие и расширяемые системы, позволяя переиспользовать существующий код без изменения.\n\n**Что меняет паттерн адаптер?**  \nПаттерн Адаптер (Adapter) меняет интерфейс одного класса или объекта так, чтобы он мог работать с другим, несовместимым интерфейсом. Он «подгоняет» один класс под API, который ожидают другие компоненты.\n\n**Меняет ли адаптер поведение?**  \nНет, адаптер не меняет поведение объекта. Он только изменяет интерфейс, через который к этому поведению обращаются. Адаптер просто перенаправляет или преобразует вызовы Пример, как переходник для розетки — сам по себе он ничего не делает, только позволяет подключить устройство."
  popularity = 2.63

[[questions]]
  id = 5
  question = "Паттерн Декоратор"
  answer = "`Decorator` — это структурный паттерн проектирования. Его задача — динамически добавлять объекту новое поведение, не изменяя его исходный класс. Обычно это делается через объект-обёртку, который имеет тот же интерфейс, что и исходный объект, и внутри хранит ссылку на него.  \n\n**Когда нужен Decorator**\nПаттерн полезен, когда:\n\n| Ситуация                                                  | Почему Decorator подходит                      |\n| --------------------------------------------------------- | ---------------------------------------------- |\n| Нужно добавить поведение объекту без изменения его класса | Исходный класс остаётся чистым                 |\n| Нужно комбинировать разные расширения                     | Декораторы можно накладывать друг на друга     |\n| Наследование создаёт слишком много подклассов             | Decorator заменяет разрастание иерархии        |\n| Поведение нужно добавлять только отдельным объектам       | Меняется конкретный экземпляр, а не весь класс |\nНапример, есть обычный сервис отправки уведомлений. Потом нужно добавить логирование, валидацию, кеширование, метрики. Делать отдельные классы вроде `LoggingCachedValidatedNotificationService` — плохая идея. Лучше оборачивать объект отдельными декораторами.  \n\n### Классическая структура\nУ паттерна обычно есть 4 роли:\n\n|Роль|Назначение|\n|---|---|\n|Component|Общий интерфейс|\n|ConcreteComponent|Основной объект|\n|BaseDecorator|Базовый декоратор, хранит ссылку на Component|\n|ConcreteDecorator|Конкретное расширение поведения|\n\n**Пример на Python**  \nДопустим, есть сервис оплаты.  \n```python\nfrom abc import ABC, abstractmethod\n\n\nclass PaymentService(ABC):\n    @abstractmethod\n    def pay(self, amount: int) -> None:\n        pass\n\n\nclass BasicPaymentService(PaymentService):\n    def pay(self, amount: int) -> None:\n        print(f\"Оплата на сумму {amount}\")\n```\nТеперь сделаем базовый декоратор:  \n```python\nclass PaymentDecorator(PaymentService):\n    def __init__(self, payment_service: PaymentService):\n        self._payment_service = payment_service\n\n    def pay(self, amount: int) -> None:\n        self._payment_service.pay(amount)\n```\nДобавим логирование:  \n```python\nclass LoggingPaymentDecorator(PaymentDecorator):\n    def pay(self, amount: int) -> None:\n        print(f\"Лог: попытка оплаты {amount}\")\n        self._payment_service.pay(amount)\n        print(\"Лог: оплата завершена\")\n```\nДобавим проверку суммы:  \n```python\nclass ValidationPaymentDecorator(PaymentDecorator):\n    def pay(self, amount: int) -> None:\n        if amount <= 0:\n            raise ValueError(\"Сумма оплаты должна быть больше 0\")\n\n        self._payment_service.pay(amount)\n```\n**Использование:**  \n```python\npayment_service = BasicPaymentService()\n\npayment_service = ValidationPaymentDecorator(payment_service)\npayment_service = LoggingPaymentDecorator(payment_service)\n\npayment_service.pay(100)\n```\n**Результат:**\n```python\nЛог: попытка оплаты 100\nОплата на сумму 100\nЛог: оплата завершена\n```\n### Что здесь происходит\nИсходный объект:\n```python\nBasicPaymentService()\n```\nоборачивается в декораторы:\n```python\nLoggingPaymentDecorator(\n    ValidationPaymentDecorator(\n        BasicPaymentService()\n    )\n)\n```\nСнаружи это всё ещё `PaymentService`, потому что и основной класс, и декораторы реализуют один интерфейс.\n\n### Главное отличие от наследования\nЧерез наследование можно было бы сделать так:  \n```python\nclass LoggingPaymentService(BasicPaymentService):\n    ...\n```\nНо проблема в том, что при большом количестве комбинаций появится много классов:\n```python\nLoggingPaymentService\nValidationPaymentService\nCachedPaymentService\nLoggingValidationPaymentService\nCachedLoggingPaymentService\nCachedValidationPaymentService\nCachedLoggingValidationPaymentService\n```\nDecorator решает это через композицию: объект не наследуется, а оборачивается.\n### Decorator и Python-декораторы\nВажно не путать:\n```python\n@some_decorator\ndef func():\n    ...\n```\nи GoF-паттерн `Decorator`.\n\nPython-декораторы — это языковой механизм для оборачивания функций, методов или классов. Например, `functools.wraps` используется внутри декораторов, чтобы wrapper сохранял метаданные исходной функции: имя, документацию, аннотации и ссылку `__wrapped__`.  \n\n**Пример Python-декоратора:**\n```python\nfrom functools import wraps\n\n\ndef log_call(func):\n    @wraps(func)\n    def wrapper(*args, **kwargs):\n        print(f\"Вызов функции {func.__name__}\")\n        return func(*args, **kwargs)\n\n    return wrapper\n\n\n@log_call\ndef create_user(username: str) -> None:\n    print(f\"Создан пользователь {username}\")\n\n\ncreate_user(\"alex\")\n```"
  popularity = 2.63

[[questions]]
  id = 6
  question = "Dependency Injection (DI)"
  answer = "`Dependency Injection`, или `DI`, — это подход, при котором объект не создаёт свои зависимости сам, а получает их извне.\n\nЗависимость — это любой объект, который нужен классу для работы: репозиторий, база данных, кеш, HTTP-клиент, логгер, сервис оплаты и так далее.\n\n**Вариант без DI:**\n```python\nclass UserService:\n    def __init__(self):\n        self.repository = PostgresUserRepository()\n\n    def get_user(self, user_id: int):\n        return self.repository.get_user(user_id)\n```\nПроблема: `UserService` жёстко связан с `PostgresUserRepository`.\n\n**Вариант с DI:**  \n```python\nclass UserService:\n    def __init__(self, repository):\n        self.repository = repository\n\n    def get_user(self, user_id: int):\n        return self.repository.get_user(user_id)\n```\nТеперь `UserService` не знает, откуда берутся данные: из PostgreSQL, Redis, памяти, mock-объекта в тестах. Он просто использует переданный ему объект.\n\nMartin Fowler описывает Dependency Injection как способ, при котором внешний объект/контейнер собирает зависимости и передаёт их компонентам, вместо того чтобы компоненты сами искали или создавали нужные объекты.\n\n### Зачем нужен DI\nDI нужен, чтобы уменьшить связанность кода.\n\n|Без DI|С DI|\n|---|---|\n|Класс сам создаёт зависимости|Класс получает зависимости извне|\n|Сложнее тестировать|Легче подставлять mock/fake|\n|Жёсткая связь с конкретными классами|Можно зависеть от интерфейса/абстракции|\n|Сложнее менять реализацию|Реализацию можно заменить без изменения бизнес-логики|\n\n**Пример без DI:**  \n```python\nclass EmailSender:\n    def send(self, email: str, text: str) -> None:\n        print(f\"Send email to {email}: {text}\")\n\n\nclass NotificationService:\n    def __init__(self):\n        self.sender = EmailSender()\n\n    def notify(self, email: str, text: str) -> None:\n        self.sender.send(email, text)\n```\n\n**Проблема:**\n```\nself.sender = EmailSender()\n```\n`NotificationService` сам создаёт `EmailSender`. Значит, он жёстко зависит от конкретного способа отправки.\n\n**Пример с DI:**\n\n```python\nclass EmailSender:\n    def send(self, email: str, text: str) -> None:\n        print(f\"Send email to {email}: {text}\")\n\n\nclass NotificationService:\n    def __init__(self, sender: EmailSender):\n        self.sender = sender\n\n    def notify(self, email: str, text: str) -> None:\n        self.sender.send(email, text)\n\n\nsender = EmailSender()\nservice = NotificationService(sender)\n\nservice.notify(\"user@example.com\", \"Hello\")\n```\nТеперь `NotificationService` получает `sender` извне.\n\n### Лучше через абстракцию\nВ Python можно описать контракт через `ABC`. Модуль `abc` в стандартной библиотеке используется для объявления абстрактных базовых классов.\n```python\nfrom abc import ABC, abstractmethod\n\n\nclass Sender(ABC):\n    @abstractmethod\n    def send(self, address: str, text: str) -> None:\n        pass\n\n\nclass EmailSender(Sender):\n    def send(self, address: str, text: str) -> None:\n        print(f\"Email to {address}: {text}\")\n\n\nclass SmsSender(Sender):\n    def send(self, address: str, text: str) -> None:\n        print(f\"SMS to {address}: {text}\")\n\n\nclass NotificationService:\n    def __init__(self, sender: Sender):\n        self.sender = sender\n\n    def notify(self, address: str, text: str) -> None:\n        self.sender.send(address, text)\n```\n**Использование:**\n```python\nemail_service = NotificationService(EmailSender())\nemail_service.notify(\"user@example.com\", \"Hello\")\n\nsms_service = NotificationService(SmsSender())\nsms_service.notify(\"+994000000000\", \"Hello\")\n```\n`NotificationService` не зависит от `EmailSender` или `SmsSender`. Он зависит от абстракции `Sender`.\n\n### Основные способы Dependency Injection\n**1. Constructor Injection**  \nЗависимость передаётся через конструктор.  \n```python\nclass UserService:\n    def __init__(self, repository):\n        self.repository = repository\n```\nЭто самый частый и обычно самый удобный вариант.  \nПлюсы:  \n- Явные зависимости\n- Удобно тестировать\n\n**2. Method Injection**  \nЗависимость передаётся прямо в метод.  \n```python\nclass ReportService:\n    def generate_report(self, repository):\n        users = repository.get_users()\n        return users\n```\nПодходит, когда зависимость нужна только одному конкретному методу.  \n\n**3. Property / Setter Injection**  \nЗависимость устанавливается через атрибут или setter.\n```python\nclass UserService:\n    def set_repository(self, repository):\n        self.repository = repository\n```\nМинус:  \nобъект можно создать в неполном состоянии. Например, забыли вызвать `set_repository()`, а потом метод упал с ошибкой.\n\n**4. DI-контейнер**  \nDI-контейнер — это объект или фреймворк, который сам знает, какие зависимости нужно создать и куда их передать.  \n\nУсловно:  \n```python\ncontainer.register(UserRepository, PostgresUserRepository)\ncontainer.register(UserService)\n```\nПотом контейнер сам создаёт `UserService` и передаёт ему `PostgresUserRepository`.  \nВ Python DI-контейнеры не всегда нужны. Часто достаточно обычной ручной сборки зависимостей в одном месте приложения.  \n\n**DI в FastAPI**  \nFastAPI имеет встроенную систему зависимостей. В документации FastAPI указано, что можно объявить зависимость, которую нужно выполнить до path operation, а FastAPI выполнит её и внедрит результат.  \n```python\nfrom fastapi import Depends, FastAPI\n\napp = FastAPI()\n\n\nclass UserRepository:\n    def get_user(self, user_id: int):\n        return {\"id\": user_id, \"username\": \"alex\"}\n\n\ndef get_user_repository():\n    return UserRepository()\n\n\n@app.get(\"/users/{user_id}\")\ndef get_user(\n    user_id: int,\n    repository: UserRepository = Depends(get_user_repository),\n):\n    return repository.get_user(user_id)\n```\nЗдесь:\n```python\nrepository: UserRepository = Depends(get_user_repository)\n```\nозначает: FastAPI должен вызвать `get_user_repository()` и передать результат в параметр `repository`. В справке FastAPI также указано, что зависимости в FastAPI в основном обрабатываются через `Depends()`, принимающий callable.\n\n**DI и тестирование**  \nГлавное практическое преимущество DI — тесты.  \nНапример, есть настоящий репозиторий:  \n```python\nclass PostgresUserRepository:\n    def get_user(self, user_id: int):\n        # запрос в PostgreSQL\n        return {\"id\": user_id, \"username\": \"alex\"}\n```\nА для теста можно сделать fake:  \n```python\nclass FakeUserRepository:\n    def get_user(self, user_id: int):\n        return {\"id\": user_id, \"username\": \"test_user\"}\n```\nТестируем сервис без настоящей базы данных:  \n```python\ndef test_get_user():\n    repository = FakeUserRepository()\n    service = UserService(repository)\n\n    user = service.get_user(1)\n\n    assert user[\"username\"] == \"test_user\"\n```\nБез DI пришлось бы лезть внутрь `UserService`, патчить `PostgresUserRepository`, мокать импорты или поднимать реальную БД.  \n\n**Кратко:**\n`Dependency Injection` — это подход, при котором класс не создаёт свои зависимости сам, а получает их извне: через конструктор, метод, setter или DI-контейнер.  \nГлавная цель DI — уменьшить связанность кода, упростить замену реализаций и сделать код удобнее для тестирования.  \n```python\nclass UserService:\n    def __init__(self, repository):\n        self.repository = repository\n```"
