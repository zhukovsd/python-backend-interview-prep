[[questions]]
  id = 7
  question = "Архитектурный паттерн CQRS"
  answer = "### CQRS\n**CQRS — Command Query Responsibility Segregation** — это архитектурный паттерн, который разделяет операции изменения данных и операции чтения данных на разные модели. Команды изменяют состояние системы, а запросы только читают данные и не должны менять состояние.\n\n**Главная идея:**  \n```markdown\nCommand side  -> create/update/delete -> write model\nQuery side    -> read/search/list      -> read model\n```\n\n### Без CQRS\nОбычно один и тот же слой/модель отвечает и за запись, и за чтение:\n```markdown\nController -> Service -> Repository -> Database\n```\nНапример:\n```python\nclass OrderService:\n    def create_order(self, data):\n        ...\n\n    def get_order(self, order_id):\n        ...\n\n    def list_orders(self, filters):\n        ...\n```\nЭто нормально для простого CRUD. Но при росте системы чтение и запись начинают требовать разной логики:\n```markdown\nЗапись:\n- валидация бизнес-правил\n- транзакции\n- проверка прав\n- изменение состояния\n\nЧтение:\n- фильтры\n- сортировки\n- агрегации\n- joins\n- кэширование\n- оптимизация под UI\n```\n\n### С CQRS\nЛогику разделяют:\n```markdown\nCreateOrderCommand  -> CreateOrderHandler  -> write model\nGetOrderQuery       -> GetOrderHandler     -> read model\n```\nПример структуры:\n```markdown\norders/\n  commands/\n    create_order.py\n    cancel_order.py\n\n  queries/\n    get_order.py\n    list_orders.py\n\n  models/\n    order.py\n```\nПример:\n```python\nfrom dataclasses import dataclass\n\n\n@dataclass\nclass CreateOrderCommand:\n    user_id: int\n    product_id: int\n    quantity: int\n\n\nclass CreateOrderHandler:\n    def __init__(self, order_repository):\n        self.order_repository = order_repository\n\n    async def handle(self, command: CreateOrderCommand):\n        # валидация бизнес-правил\n        # создание заказа\n        # сохранение в БД\n        return await self.order_repository.create(\n            user_id=command.user_id,\n            product_id=command.product_id,\n            quantity=command.quantity,\n        )\n```\n```python\n@dataclass\nclass GetOrderQuery:\n    order_id: int\n    user_id: int\n\n\nclass GetOrderHandler:\n    def __init__(self, order_read_repository):\n        self.order_read_repository = order_read_repository\n\n    async def handle(self, query: GetOrderQuery):\n        # только чтение\n        return await self.order_read_repository.get_order_detail(\n            order_id=query.order_id,\n            user_id=query.user_id,\n        )\n```\n\n### Важный момент\nCQRS не обязательно означает две разные базы данных. Разделение может быть только на уровне кода: отдельные handlers, DTO, репозитории и модели для чтения/записи. Microsoft прямо отмечает, что у command/query слоев могут быть разные модели, но не обязательно разные хранилища.  \n\nТо есть можно сделать так:\n```markdown\nОдна БД PostgreSQL\n├── command handlers используют ORM-модели\n└── query handlers используют SQL-запросы / read DTO / views\n```\nИли сложнее:\n```markdown\nWrite DB: PostgreSQL\nRead DB: Elasticsearch / Redis / ClickHouse / отдельные read tables\n```\n\n### Где CQRS полезен\nCQRS особенно полезен, когда чтение и запись сильно отличаются по нагрузке или сложности. Например, запись требует строгих бизнес-правил, а чтение требует тяжелых фильтров, агрегаций и выдачи данных под интерфейс. Azure Architecture Center указывает, что CQRS позволяет независимо оптимизировать read/write модели и может улучшать производительность, масштабируемость и безопасность.  \n\n**Хорошие случаи:**\n1. Сложная бизнес-логика на запись.\n2. Очень много чтения и мало записи.\n3. Тяжелые дашборды, фильтры, отчеты.\n4. Нужно отдельно масштабировать чтение и запись.\n5. Нужно иметь разные модели данных для UI и бизнес-логики.\n6. Микросервисы, где чтение собирается из нескольких источников.\n\n### Где CQRS избыточен\nДля простого CRUD CQRS часто усложняет проект без реальной пользы. Martin Fowler отдельно предупреждает, что CQRS может быть полезен в отдельных ситуациях, но для большинства систем добавляет рискованную сложность.  \n\n**Плохие случаи:**\n1. Маленький CRUD-сервис.\n2. Простая админка.\n3. Нет сложной бизнес-логики.\n4. Нет проблем с производительностью чтения.\n5. Команда не готова поддерживать дополнительную архитектурную сложность.\n\n### CQRS и Event Sourcing\nCQRS часто путают с Event Sourcing, но это разные паттерны.  \n**CQRS:**\n- Разделяет чтение и запись.\n**Event Sourcing:**\n- Хранит не текущее состояние, а цепочку событий.\n\nОни могут использоваться вместе, но CQRS не требует Event Sourcing. Microsoft также отдельно указывает, что при совмещении CQRS и Event Sourcing надо учитывать eventual consistency: read model может обновляться с задержкой.  \n\nПример:\n```markdown\nCommand:\n  PlaceOrder\n\nEvents:\n  OrderPlaced\n  PaymentReserved\n  OrderConfirmed\n\nRead model:\n  order_details_view\n```\nПлюсы:\n1. Чище разделение ответственности.\n2. Проще оптимизировать чтение.\n3. Проще оптимизировать запись.\n4. Можно масштабировать read и write части отдельно.\n5. Можно делать read-модели конкретно под UI.\n6. Команды легче тестировать отдельно от запросов.\n\nМинусы:\n1. Больше классов и файлов.\n2. Сложнее архитектура.\n3. Может появиться eventual consistency.\n4. Нужно синхронизировать read model и write model.\n5. Для простых проектов может быть overengineering.\n\n### Пример из реального backend\nДопустим, есть сервис заказов.  \nКоманды:  \n```python\nCreateOrderCommand\nCancelOrderCommand\nPayOrderCommand\nChangeOrderAddressCommand\n```\nЗапросы:  \n```python\nGetOrderQuery\nListUserOrdersQuery\nGetOrdersStatisticsQuery\nSearchOrdersQuery\n```\nКоманда `CreateOrderCommand` должна проверять бизнес-правила:\n- существует ли пользователь\n- есть ли товар\n- хватает ли остатков\n- можно ли создать заказ\n- нужно ли открыть транзакцию\nА `ListUserOrdersQuery` может просто читать готовую таблицу или view:\n```sql\nSELECT id, status, total_price, created_at\nFROM user_orders_view\nWHERE user_id = $1\nORDER BY created_at DESC\nLIMIT $2 OFFSET $3;\n```\nЗдесь нет смысла использовать одну и ту же модель для создания заказа и для отображения списка заказов.  \n\n### Главное отличие от обычного Service Layer\nОбычный Service Layer:\n```python\nOrderService.create_order()\nOrderService.cancel_order()\nOrderService.get_order()\nOrderService.list_orders()\n```\nCQRS:\n```python\nCreateOrderHandler\nCancelOrderHandler\nGetOrderHandler\nListOrdersHandler\n```\nВ CQRS каждый handler обычно отвечает за один конкретный use case. Это уменьшает разрастание больших сервисов вида `OrderService` на сотни методов.  "
  popularity = 2.63

