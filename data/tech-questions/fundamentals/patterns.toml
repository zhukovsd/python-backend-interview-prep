  question = "Какие архитектурные решения вы знаете?"
  answer = "### Архитектурные решения\n\nАрхитектурные решения — это не только «монолит или микросервисы». Это выборы, которые определяют структуру системы: как разделять код, как хранить данные, как сервисы общаются, как масштабироваться, как обрабатывать ошибки и как обеспечивать надежность.\n\n### 1. Монолитная архитектура\nМонолит — приложение, где основная логика собрана в одном deployable unit.  \n\nПример:\n```text\nDjango / FastAPI app\n  ├── users\n  ├── orders\n  ├── payments\n  └── notifications\n\nDeploy: один сервис\nDatabase: чаще одна БД\n```\n\n**Плюсы:**\n```text\n- проще разработка на старте;\n- проще деплой;\n- проще транзакции;\n- меньше сетевой сложности;\n- легче отлаживать.\n```\n\n**Минусы:**\n```text\n- при росте может стать сложно поддерживать;\n- один большой кодbase;\n- сложнее независимо масштабировать части системы;\n- изменения в одной области могут ломать другие.\n```\nПодходит для большинства стартапов, MVP, CRUD-систем и проектов без огромной нагрузки.\n\n### 2. Модульный монолит\nЭто монолит, но внутри он разделен на четкие модули.  \n```text\napp/\n  users/\n  orders/\n  payments/\n  notifications/\n```\nГлавная идея: деплой один, но границы внутри кода строгие.  \n\nНапример:\n```text\norders не лезет напрямую в таблицы payments\norders вызывает application/service интерфейс payments\n```\nЭто часто лучший вариант до микросервисов: меньше сложности, чем у микросервисов, но архитектура уже не превращается в хаос.  \n\n### 3. Микросервисная архитектура\nМикросервисы — система из нескольких независимых сервисов, каждый отвечает за свою бизнес-область.\n```text\nUser Service\nOrder Service\nPayment Service\nNotification Service\n```\nКаждый сервис может иметь свою БД, свой deploy, свою команду и свой цикл релизов.\n\n**Плюсы:**\n```text\n- независимое масштабирование;\n- независимый деплой;\n- изоляция ответственности;\n- можно использовать разные технологии;\n- проще разделять команды по доменным областям.\n```\n\n**Минусы:**\n```text\n- сложнее инфраструктура;\n- сетевые ошибки;\n- distributed transactions;\n- сложнее логирование и трассировка;\n- нужна зрелая DevOps-культура.\n```\nCNCF связывает cloud-native подход с масштабируемыми приложениями в динамических средах вроде public/private/hybrid cloud, а микросервисы обычно рассматриваются как один из ключевых подходов в такой среде.  \n\nМикросервисы не стоит брать только потому, что это «модно». Для маленькой команды и простой системы они часто создают больше проблем, чем пользы.\n\n### 4. Layered Architecture / N-tier\nКлассическая слоистая архитектура:\n```text\nController / API\nService\nRepository\nDatabase\n```\n\nПример\n```text\nFastAPI Router -> UserService -> UserRepository -> PostgreSQL\n```\n\n**Плюсы:**\n```text\n- понятная структура;\n- легко объяснить команде;\n- хорошо подходит для CRUD;\n- удобно тестировать по слоям.\n```\n\n**Минусы:**\n```text\n- бизнес-логика может размазаться между слоями;\n- сервисы могут стать огромными;\n- при плохом дизайне всё превращается в Controller-Service-Repository без настоящих границ.\n```\nMartin Fowler в Patterns of Enterprise Application Architecture отдельно выделяет темы слоев, доменной логики, связи с реляционной БД и web presentation как ключевые области enterprise-архитектуры.   \n\n### 5. Clean Architecture / Onion Architecture / Hexagonal Architecture\nЭто архитектуры, где бизнес-логика находится в центре, а внешние детали находятся снаружи.\n```text\nInfrastructure -> Application -> Domain\nPresentation   -> Application -> Domain\n```\nГлавное правило:\n```text\nзависимости направлены внутрь\n```\nТо есть домен не должен зависеть от:\n```text\n- FastAPI;\n- Django;\n- SQLAlchemy;\n- PostgreSQL;\n- Redis;\n- Kafka;\n- внешних API.\n```\n\nПример:\n```text\nUseCase зависит от интерфейса UserRepository\nSQLAlchemyUserRepository реализует этот интерфейс во внешнем слое\n```\n\nПодходит, когда:\n```text\n- есть сложная бизнес-логика;\n- важны тесты;\n- проект будет расти;\n- нужно отделить бизнес-правила от фреймворка и БД.\n```\n\nНе подходит, когда:\n```text\n- маленький CRUD;\n- нет сложной логики;\n- абстракции только увеличивают количество файлов.\n```\n\n### 6. Event-driven architecture\nEvent-driven architecture — архитектура, где части системы общаются через события.\n```text\nOrderCreated\nPaymentCompleted\nUserRegistered\nFileUploaded\n```\n\nПример:\n```text\nOrder Service -> OrderCreated event -> Notification Service\n                                  -> Analytics Service\n                                  -> Warehouse Service\n```\nAWS описывает event-driven architecture как подход, состоящий из event sources, event routers и event destinations. \n\n**Плюсы:**\n```text\n- слабая связанность сервисов;\n- удобно добавлять новые реакции на событие;\n- хорошо подходит для асинхронной обработки;\n- повышает масштабируемость.\n```\n\n**Минусы:**\n```text\n- сложнее отладка;\n- eventual consistency;\n- нужно думать об идемпотентности;\n- возможны дубли событий;\n- сложнее понимать полный flow.\n```\n\nИспользуется с:\n```text\nKafka\nRabbitMQ\nRedis Streams\nAWS EventBridge\nNATS\n```\n\n### 7. CQRS\nCQRS — разделение операций чтения и записи.\n```text\nCommand -> меняет состояние\nQuery   -> только читает данные\n```\n\nMicrosoft описывает CQRS как паттерн, который разделяет read и write операции на разные модели, что позволяет независимо оптимизировать производительность, масштабируемость и безопасность.\n\nПример:\n```text\nCreateOrderCommand\nCancelOrderCommand\n\nGetOrderQuery\nListOrdersQuery\nSearchOrdersQuery\n```\n\nПодходит, когда:\n```text\n- чтение и запись сильно отличаются;\n- много сложных фильтров;\n- нужны read models под UI;\n- тяжелые отчеты и дашборды;\n- высокая нагрузка на чтение.\n```\nНо Martin Fowler предупреждает, что CQRS полезен не всегда и для большинства систем может добавить рискованную сложность.   \n\n### 8. SOA\nSOA — Service-Oriented Architecture. Это более старший родственник микросервисов: система строится вокруг сервисов, которые предоставляют бизнес-возможности.\n```text\nBilling Service\nCustomer Service\nInventory Service\n```\nОтличие от микросервисов обычно в том, что SOA часто крупнее по гранулярности и исторически чаще использовала ESB — Enterprise Service Bus.  \n\nСейчас в backend чаще говорят именно про микросервисы, но SOA как подход всё еще встречается в крупных enterprise-системах.  \n\n### 9. Serverless architecture\nServerless — подход, где разработчик пишет функции или сервисы, а управление серверами берет на себя платформа.  \n\nПример:\n```text\nHTTP request -> API Gateway -> Lambda Function -> Database\n```\n\n**Плюсы:**\n```text\n- не нужно управлять серверами;\n- автоматическое масштабирование;\n- оплата часто за использование;\n- удобно для событийных задач.\n```\n\n**Минусы:**\n```text\n- cold start;\n- vendor lock-in;\n- ограничения runtime;\n- сложнее локальная отладка;\n- не всегда подходит для долгих процессов.\n```\n\n### 10. Microkernel / Plugin architecture\n\nАрхитектура ядра и плагинов.\n```text\nCore system\n  ├── plugin A\n  ├── plugin B\n  └── plugin C\n```\n\nПримеры:\n```text\nIDE\nCMS\nигровые движки\nбраузеры\nсистемы с расширениями\n```\n\n**Плюсы:**\n```text\n- легко добавлять расширения;\n- ядро остается стабильным;\n- плагины можно разрабатывать отдельно.\n```\n\n**Минусы:**\n```text\n- нужно продумать API плагинов;\n- сложнее безопасность;\n- сложнее совместимость версий.\n```\n\n### 11. Pipes and Filters\nАрхитектура конвейера обработки данных.\n```text\nInput -> Filter 1 -> Filter 2 -> Filter 3 -> Output\n```\n\nПример:\n```text\nзагрузить файл\n-> проверить формат\n-> распарсить\n-> провалидировать\n-> сохранить\n-> отправить уведомление\n```\n\nХорошо подходит для:\n```text\n- ETL;\n- обработки файлов;\n- data pipelines;\n- медиа-обработки;\n- компиляции;\n- цепочек валидации.\n```\n\n### 12. MVC / MVT\n\nMVC:\n```text\nModel\nView\nController\n```\n\nMVT в Django:\n```text\nModel\nView\nTemplate\n```\nЭто архитектурный подход для разделения UI, данных и логики обработки запроса.  \nВ backend часто выглядит так:\n```text\nURL -> View/Controller -> Model/Service -> Response\n```\nПодходит для web-приложений, админок, сайтов, CRUD-систем.  \n\n### 13. BFF — Backend for Frontend\nBFF — отдельный backend под конкретный frontend.\n```text\nMobile App -> Mobile BFF -> Services\nWeb App    -> Web BFF    -> Services\nAdmin      -> Admin BFF  -> Services\n```\n\nЗачем нужен:\n```text\n- разные клиенты требуют разные DTO;\n- мобильному приложению нужны одни данные;\n- web-интерфейсу другие;\n- не хочется усложнять общий API.\n```\n\nМинус — больше сервисов и больше поддержки.\n\n### 14. API Gateway\nAPI Gateway — единая точка входа перед набором сервисов.\n```text\nClient -> API Gateway -> User Service\n                    -> Order Service\n                    -> Payment Service\n```\n\nОбычно отвечает за:\n```text\n- routing;\n- authentication;\n- rate limiting;\n- aggregation;\n- logging;\n- request/response transformation.\n```\n\nВ микросервисной архитектуре часто используется вместе с BFF.\n\n### 15. Service Mesh\nService Mesh — инфраструктурный слой для управления взаимодействием сервисов.  \n\nCNCF описывает service mesh как слой, который добавляет reliability, observability и security для сервисов в кластере без необходимости реализовывать это в каждом сервисе вручную.   \n\nПримеры задач:\n```text\n- retries;\n- timeouts;\n- mTLS;\n- traffic splitting;\n- circuit breaking;\n- observability.\n```\n\nПримеры технологий:\n```text\nIstio\nLinkerd\nConsul\nEnvoy\n```\nНужен не всем. Для маленькой системы service mesh часто избыточен.\n\n### 16. Stateless architecture\nStateless-подход означает, что app-инстанс не хранит критичное состояние пользователя локально между запросами.\n```text\nClient -> App A\nClient -> App B\nClient -> App C\n```\n\nСостояние выносится во внешние хранилища:\n```text\nPostgreSQL\nRedis\nS3/MinIO\nKafka\nJWT\n```\n\nЗачем:\n```text\n- проще масштабировать;\n- проще балансировать нагрузку;\n- проще перезапускать контейнеры;\n- проще деплоить;\n- выше отказоустойчивость.\n```\n\n### 17. Repository + Unit of Work\nЭто не полноценный архитектурный стиль, но важные архитектурные паттерны внутри приложения.\n\nRepository:\n```text\nскрывает доступ к данным\n```\n\nUnit of Work:\n```text\nуправляет транзакцией\n```\n\nПример:\n```text\nOrderService\n  -> UnitOfWork\n      -> OrderRepository\n      -> ProductRepository\n      -> commit / rollback\n```\nПолезно, когда нужно отделить бизнес-логику от ORM и централизовать транзакции.\n\n### 18. Saga\n\nSaga — решение для бизнес-процессов, которые затрагивают несколько сервисов без одной общей транзакции.\n\nПример:\n```text\nCreate order\n-> Reserve product\n-> Charge payment\n-> Send notification\n```\n\nЕсли платеж не прошел:\n```text\nCancel order\nRelease reserved product\n```\n\nИспользуется в микросервисах, где обычная ACID-транзакция через несколько БД невозможна или нежелательна.\n\n### 19. Outbox Pattern\nOutbox нужен, чтобы надежно сохранить изменение в БД и событие для брокера.\n\nПроблема:\n```text\n1. Сохранили заказ в БД.\n2. Хотели отправить OrderCreated в Kafka.\n3. Сервис упал.\n4. Заказ есть, события нет.\n```\n\nРешение:\n```text\nв той же транзакции:\n- сохранить заказ;\n- сохранить событие в outbox table.\n\nотдельный worker потом отправит событие в брокер.\n```\nЭто частое решение в event-driven и микросервисной архитектуре.\n\n### Главное\nАрхитектурное решение выбирают не по модности, а по проблеме:  \n\n|Проблема|Возможное решение|\n|---|---|\n|Код разрастается|Layered, Modular Monolith, Clean Architecture|\n|Сложная бизнес-логика|DDD, Onion, Hexagonal|\n|Много независимых частей|Microservices|\n|Много асинхронных процессов|Event-driven architecture|\n|Чтение и запись сильно отличаются|CQRS|\n|Нужно надежно публиковать события|Outbox|\n|Транзакция между сервисами невозможна|Saga|\n|Разные клиенты требуют разные API|BFF|\n|Много сервисов и сетевой сложности|API Gateway, Service Mesh|\n|Нужно легко масштабировать API|Stateless architecture|"
