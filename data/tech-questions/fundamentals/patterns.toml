  question = "Что такое луковичная архитектура? (Onion architecture)"
  answer = "Луковичная архитектура, или `Onion Architecture`, — это архитектурный подход, в котором бизнес-логика находится в центре приложения, а технические детали располагаются во внешних слоях.\n\nГлавное правило:\n```\nЗависимости направлены только внутрь.\nВнутренние слои не знают о внешних.\n```\nТо есть доменная логика не должна зависеть от:\n```\n- FastAPI / Django / Flask;\n- PostgreSQL;\n- SQLAlchemy / Django ORM / Tortoise ORM;\n- Redis;\n- Kafka / RabbitMQ;\n- внешних API;\n- файловой системы;\n- UI.\n```\nОригинально Onion Architecture была описана Jeffrey Palermo. Основное правило у него формулируется так: код может зависеть от более центральных слоев, но не от внешних; вся связанность направлена к центру.\n\n### Схема слоев\nУпрощенно:\n```\n[ Infrastructure ]\n[ Presentation / API ]\n[ Application Services / Use Cases ]\n[ Domain Model ]\n```\nИли в виде направления зависимостей:\n```\nInfrastructure  --->  Application  --->  Domain\nAPI             --->  Application  --->  Domain\nDatabase        --->  Application  --->  Domain\n```\nНо не наоборот:\n```\nDomain  -X->  Database\nDomain  -X->  FastAPI\nDomain  -X->  SQLAlchemy\nApplication -X-> конкретная PostgreSQL-реализация\n```\n\n### Центр — Domain\nВ центре находится домен: бизнес-сущности, value objects, доменные правила.  \n\nНапример:\n```python\nclass Order:\n    def __init__(self, user_id: int, items: list):\n        if not items:\n            raise ValueError(\"Order must contain at least one item\")\n\n        self.user_id = user_id\n        self.items = items\n        self.status = \"created\"\n\n    def cancel(self):\n        if self.status == \"paid\":\n            raise ValueError(\"Paid order cannot be cancelled\")\n\n        self.status = \"cancelled\"\n```\nЭтот класс не должен знать, где он хранится: в PostgreSQL, MongoDB, Redis или файле.\nЭто обычная бизнес-логика.\n\n### Следующий слой — Application\nApplication layer содержит use cases, то есть сценарии приложения:\n```\n- создать заказ;\n- отменить заказ;\n- зарегистрировать пользователя;\n- отправить уведомление;\n- загрузить файл;\n- получить список заказов.\n```\nПример:\n```python\nclass CreateOrderUseCase:\n    def __init__(self, order_repository, product_repository):\n        self.order_repository = order_repository\n        self.product_repository = product_repository\n\n    async def execute(self, user_id: int, product_ids: list[int]):\n        products = await self.product_repository.get_by_ids(product_ids)\n\n        if len(products) != len(product_ids):\n            raise ValueError(\"Some products not found\")\n\n        order = Order(user_id=user_id, items=products)\n\n        await self.order_repository.save(order)\n\n        return order\n```\n\nЗдесь use case управляет сценарием, но не знает, как именно `order_repository` работает с базой.\n\n#### Важный момент: интерфейсы внутрь, реализации наружу\nВнутренний слой может объявить интерфейс:\n```python\nfrom typing import Protocol\n\n\nclass OrderRepository(Protocol):\n    async def save(self, order: Order) -> None:\n        ...\n\n    async def get_by_id(self, order_id: int) -> Order | None:\n        ...\n```\nА внешний слой дает реализацию:\n```python\nclass SqlAlchemyOrderRepository:\n    def __init__(self, session):\n        self.session = session\n\n    async def save(self, order: Order) -> None:\n        # SQLAlchemy-specific code\n        ...\n\n    async def get_by_id(self, order_id: int) -> Order | None:\n        # SQLAlchemy-specific code\n        ...\n```\nТо есть Application зависит от абстракции, а Infrastructure реализует эту абстракцию.\n\n### Infrastructure layer\nInfrastructure — это внешний слой. Там находятся технические реализации:\n```\n- SQLAlchemyOrderRepository;\n- DjangoUserRepository;\n- RedisTokenStorage;\n- S3FileStorage;\n- KafkaEventProducer;\n- EmailSender;\n- HTTP-клиенты к внешним сервисам.\n```\nПример:\n```python\nclass RedisTokenStorage:\n    def __init__(self, redis):\n        self.redis = redis\n\n    async def save_refresh_token(self, user_id: int, token: str):\n        await self.redis.set(f\"refresh:{user_id}\", token)\n```\nApplication layer может знать только интерфейс:\n```python\nclass TokenStorage(Protocol):\n    async def save_refresh_token(self, user_id: int, token: str):\n        ...\n```\nА Redis — это уже деталь реализации.\n\n### Presentation layer\nPresentation — это слой входа в приложение:\n```\n- FastAPI routers;\n- Django views;\n- DRF ViewSet;\n- CLI-команды;\n- Celery tasks;\n- GraphQL resolvers.\n```\nПример с FastAPI:\n```python\n@router.post(\"/orders\")\nasync def create_order(\n    data: CreateOrderRequest,\n    use_case: CreateOrderUseCase = Depends(get_create_order_use_case),\n):\n    order = await use_case.execute(\n        user_id=data.user_id,\n        product_ids=data.product_ids,\n    )\n\n    return {\"id\": order.id, \"status\": order.status}\n```\nРоутер не должен содержать бизнес-логику. Его задача:\n```\n- принять HTTP-запрос;\n- провалидировать input DTO;\n- вызвать use case;\n- вернуть response DTO.\n```\n\n### Почему называется «луковичная»\nПотому что приложение представляется как слои вокруг центра:\n```\n          Infrastructure\n       ---------------------\n        Presentation / API\n     -------------------------\n       Application / Use Cases\n    ----------------------------\n              Domain\n```\nЦентр — самый важный и стабильный слой.\n\nВнешние слои можно менять:\n```\nFastAPI заменить на Django;\nPostgreSQL заменить на MongoDB;\nRedis заменить на другой cache;\nREST заменить на GraphQL.\n```\nНо доменная логика должна остаться максимально неизменной.\n\n### Главное преимущество\nГлавное преимущество Onion Architecture — независимость бизнес-логики от технических деталей.\n\nНапример, плохо:\n```python\nclass OrderService:\n    async def create_order(self, user_id: int):\n        order = await OrderModel.create(user_id=user_id)\n        return order\n```\nЗдесь сервис напрямую зависит от ORM-модели.  \n\nЛучше:\n```python\nclass OrderService:\n    def __init__(self, order_repository: OrderRepository):\n        self.order_repository = order_repository\n\n    async def create_order(self, user_id: int):\n        order = Order(user_id=user_id)\n        await self.order_repository.save(order)\n        return order\n```\nТеперь бизнес-сценарий не привязан к ORM.\n\n### Отличие от обычной слоистой архитектуры\nКлассическая layered architecture часто выглядит так:  \n```\nController -> Service -> Repository -> Database\n```\nПроблема: зависимости часто идут сверху вниз, и бизнес-логика зависит от инфраструктуры.\n```\nService зависит от Repository\nRepository зависит от ORM\nORM зависит от Database\n```\nВ Onion Architecture зависимость переворачивается:\n```\nApplication зависит от интерфейса Repository\nInfrastructure реализует этот интерфейс\n```\nТо есть не бизнес-логика подстраивается под базу, а база становится внешней деталью.\n\nMicrosoft также описывает Repository как способ вынести persistence concerns за пределы доменной модели; интерфейсы репозиториев определяются рядом с доменной моделью, а конкретные реализации находятся в инфраструктуре.\n\n**Плюсы**  \n1. Бизнес-логика не зависит от фреймворка.\n2. Проще тестировать use cases без реальной БД.\n3. Можно заменить ORM или базу с меньшими изменениями.\n4. Код лучше разделен по ответственности.\n5. Хорошо сочетается с DDD, Repository, Unit of Work, CQRS.\n6. Проще держать сложную бизнес-логику отдельно от инфраструктуры.\n\n**Минусы**\n1. Больше файлов и абстракций.\n2. Для простого CRUD может быть избыточной.\n3. Нужно дисциплинированно следить за направлением импортов.\n4. Разработчики могут начать делать лишние интерфейсы без пользы.\n5. Порог входа выше, чем у обычного Controller-Service-Repository.\n\n**Когда использовать**  \n- проект не просто CRUD;\n- есть сложная бизнес-логика;\n- приложение будет расти;\n- важны тесты;\n- нужно отделить домен от фреймворка и БД;\n- есть несколько способов входа: API, Celery, CLI;\n- используется DDD или Clean Architecture.\n\n**Когда не использовать**  \n- маленький CRUD-проект;\n- логика почти вся состоит из create/read/update/delete;\n- проект временный;\n- команда не готова поддерживать архитектурные границы;\n- абстракции только усложняют код.\n\n### Onion Architecture, Clean Architecture и Hexagonal Architecture\nЭти подходы очень близки. Все они строятся вокруг одной идеи: бизнес-логика должна быть в центре, а инфраструктура — снаружи.  \n\nMicrosoft в документации по веб-архитектурам прямо отмечает, что архитектуры, следующие Dependency Inversion и DDD, со временем назывались Hexagonal Architecture, Ports and Adapters, Onion Architecture и Clean Architecture.  \n\nРазница больше в терминологии и акцентах:\n\n| Подход                 | Акцент                                              |\n| ---------------------- | --------------------------------------------------- |\n| Onion Architecture     | Слои вокруг домена, зависимости внутрь              |\n| Clean Architecture     | Use cases, entities, interface adapters, frameworks |\n| Hexagonal Architecture | Ports and adapters, входные и выходные адаптеры     |"
  popularity = 2.63

