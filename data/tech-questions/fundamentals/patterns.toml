  id = 8
  question = "Паттерн Стратегия"
  answer = "**Стратегия** — это поведенческий паттерн проектирования, который позволяет вынести разные варианты одного алгоритма в отдельные классы и подставлять нужный алгоритм во время выполнения программы. Идея паттерна: объект не реализует все варианты поведения сам, а делегирует выполнение выбранной стратегии отдельному объекту. Refactoring Guru описывает Strategy как способ изолировать код разных алгоритмов и переключать их во время выполнения; SourceMaking также определяет стратегию как набор взаимозаменяемых алгоритмов.  \n\n### Простая идея\nДопустим, у нас есть разные способы оплаты:\n```markdown\nОплата картой\nОплата через PayPal\nОплата бонусами\n```\nБез паттерна часто пишут так:\n```python\nclass PaymentService:\n    def pay(self, payment_type: str, amount: int):\n        if payment_type == \"card\":\n            print(f\"Pay {amount} by card\")\n        elif payment_type == \"paypal\":\n            print(f\"Pay {amount} by PayPal\")\n        elif payment_type == \"bonus\":\n            print(f\"Pay {amount} by bonuses\")\n        else:\n            raise ValueError(\"Unknown payment type\")\n```\nПроблема: при добавлении нового способа оплаты придется менять `PaymentService`.  \nЭто нарушает идею Open/Closed Principle: код должен быть открыт для расширения, но закрыт для изменения.  \n\n### Решение через Strategy\nСоздаем общий интерфейс стратегии:\n```python\nfrom abc import ABC, abstractmethod\n\n\nclass PaymentStrategy(ABC):\n    @abstractmethod\n    def pay(self, amount: int) -> None:\n        pass\n```\nСоздаем конкретные стратегии:\n```python\nclass CardPayment(PaymentStrategy):\n    def pay(self, amount: int) -> None:\n        print(f\"Pay {amount} by card\")\n\n\nclass PayPalPayment(PaymentStrategy):\n    def pay(self, amount: int) -> None:\n        print(f\"Pay {amount} by PayPal\")\n\n\nclass BonusPayment(PaymentStrategy):\n    def pay(self, amount: int) -> None:\n        print(f\"Pay {amount} by bonuses\")\n```\nКонтекст использует стратегию, но не знает деталей реализации:  \n```python\nclass PaymentService:\n    def __init__(self, strategy: PaymentStrategy):\n        self.strategy = strategy\n\n    def pay(self, amount: int) -> None:\n        self.strategy.pay(amount)\n```\nИспользование:  \n```python\npayment_service = PaymentService(CardPayment())\npayment_service.pay(100)\n\npayment_service = PaymentService(PayPalPayment())\npayment_service.pay(250)\n```\nТеперь `PaymentService` не содержит `if/elif` по типам оплаты. Он просто вызывает выбранную стратегию.  \n\n### Структура паттерна\n```markdown\nClient\n  |\n  v\nContext  --->  Strategy interface\n                  ^\n                  |\n        -------------------------\n        |           |           |\n CardPayment   PayPalPayment   BonusPayment\n```\nГде:\n```markdown\nContext — объект, который использует стратегию.\nStrategy — общий интерфейс алгоритма.\nConcreteStrategy — конкретная реализация алгоритма.\nClient — код, который выбирает нужную стратегию.\n```\n\n### Когда использовать\nStrategy полезна, когда есть несколько вариантов одного поведения и они должны быть взаимозаменяемыми. Например, разные способы оплаты, разные алгоритмы сортировки, разные способы доставки, разные правила расчета скидки, разные способы авторизации. Microsoft в описании паттерна указывает, что Strategy позволяет выбирать поведение алгоритма во время выполнения программы.  \n\n**Хорошие случаи:**  \n1. Есть много if/elif по типу поведения.\n2. Нужно легко добавлять новые варианты алгоритма.\n3. Нужно менять поведение объекта во время выполнения.\n4. Разные алгоритмы имеют одинаковую цель, но разную реализацию.\n5. Нужно вынести сложную логику из большого service-класса.\n\n### Когда не стоит использовать\nStrategy может быть избыточной, если вариантов поведения мало и они почти не меняются.  \n\n**Плохие случаи:**\n1. Всего 2 простых if, и логика вряд ли будет расти.\n2. Алгоритмы слишком маленькие и не несут отдельной ответственности.\n3. Паттерн добавляет больше классов, чем пользы.\n4. Команда не понимает, зачем здесь дополнительная абстракция.\n\n### Пример ближе к backend\nДопустим, есть расчет стоимости доставки.  \n\n**Без Strategy:**\n```python\nclass DeliveryService:\n    def calculate_price(self, delivery_type: str, weight: float) -> float:\n        if delivery_type == \"standard\":\n            return weight * 5\n\n        if delivery_type == \"express\":\n            return weight * 10 + 20\n\n        if delivery_type == \"pickup\":\n            return 0\n\n        raise ValueError(\"Unknown delivery type\")\n```\n**Через Strategy:**\n```python\nfrom abc import ABC, abstractmethod\n\n\nclass DeliveryStrategy(ABC):\n    @abstractmethod\n    def calculate(self, weight: float) -> float:\n        pass\n\n\nclass StandardDelivery(DeliveryStrategy):\n    def calculate(self, weight: float) -> float:\n        return weight * 5\n\n\nclass ExpressDelivery(DeliveryStrategy):\n    def calculate(self, weight: float) -> float:\n        return weight * 10 + 20\n\n\nclass PickupDelivery(DeliveryStrategy):\n    def calculate(self, weight: float) -> float:\n        return 0\n```\nКонтекст:\n```python\nclass DeliveryService:\n    def __init__(self, strategy: DeliveryStrategy):\n        self.strategy = strategy\n\n    def calculate_price(self, weight: float) -> float:\n        return self.strategy.calculate(weight)\n```\nИспользование:\n```python\nservice = DeliveryService(StandardDelivery())\nprint(service.calculate_price(3.5))\n\nservice = DeliveryService(ExpressDelivery())\nprint(service.calculate_price(3.5))\n```\n\n### Более практичный вариант с выбором стратегии\nВ реальном коде часто используют словарь стратегий:  \n```python\nclass DeliveryStrategyFactory:\n    strategies = {\n        \"standard\": StandardDelivery(),\n        \"express\": ExpressDelivery(),\n        \"pickup\": PickupDelivery(),\n    }\n\n    @classmethod\n    def get_strategy(cls, delivery_type: str) -> DeliveryStrategy:\n        try:\n            return cls.strategies[delivery_type]\n        except KeyError:\n            raise ValueError(\"Unknown delivery type\")\n```\nИспользование:\n```python\ndelivery_type = \"express\"\n\nstrategy = DeliveryStrategyFactory.get_strategy(delivery_type)\nservice = DeliveryService(strategy)\n\nprice = service.calculate_price(weight=5)\nprint(price)\n```\nТакой подход лучше, чем большой `if/elif`, потому что добавление новой стратегии не требует переписывать основной сервис.\n\n### Отличие от обычного if/else\n`if/else`:\n- Один класс знает обо всех вариантах поведения.\nStrategy:\n- Каждый вариант поведения живет в отдельном классе.\n- Контекст работает через общий интерфейс.\n\nГлавное отличие не в том, что `if/else` полностью исчезает. Иногда выбор стратегии все равно где-то происходит. Главное — бизнес-алгоритмы разделены и не смешаны в одном большом методе.\n\n**Плюсы**  \n1. Убирает большие if/elif/switch.\n2. Упрощает добавление новых алгоритмов.\n3. Делает код расширяемым.\n4. Упрощает тестирование каждой стратегии отдельно.\n5. Разделяет разные варианты поведения по отдельным классам.\n\n**Минусы**  \n1. Увеличивает количество классов.\n2. Может быть избыточен для простой логики.\n3. Клиентский код должен понимать, какую стратегию выбрать.\n4. Иногда нужен дополнительный factory/registry для выбора стратегии.\n\n### Strategy и Dependency Injection\nStrategy часто используется вместе с DI.  \nНапример:  \n```python\nclass ReportService:\n    def __init__(self, export_strategy):\n        self.export_strategy = export_strategy\n\n    def export(self, data):\n        return self.export_strategy.export(data)\n```\nМожно подставить:  \n```python\nPdfExportStrategy()\nExcelExportStrategy()\nCsvExportStrategy()\n```\nТо есть `ReportService` не зависит от конкретного формата. Он зависит только от интерфейса стратегии."
