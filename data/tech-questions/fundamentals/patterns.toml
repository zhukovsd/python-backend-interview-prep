[[questions]]
  id = 10
  question = "Паттерн Репозиторий"
  answer = "**Репозиторий** — это паттерн, который отделяет бизнес-логику от деталей работы с базой данных. По определению Мартина Фаулера, Repository выступает посредником между доменной логикой и слоем маппинга данных, создавая ощущение, что работа идет с коллекцией объектов в памяти.\n\nИдейно:\n```\nService / Use Case\n        |\n        v\nRepository\n        |\n        v\nDatabase / ORM / SQL / API / File storage\n```\n\n### Какую проблему решает\nБез репозитория бизнес-логика часто начинает напрямую зависеть от ORM или SQL:  \n```python\nclass UserService:\n    async def get_user_profile(self, user_id: int):\n        user = await User.filter(id=user_id).first()\n\n        if not user:\n            raise ValueError(\"User not found\")\n\n        return {\n            \"id\": user.id,\n            \"username\": user.username,\n        }\n```\nПроблема в том, что `UserService` теперь знает, как именно данные достаются из базы:\n- какая ORM используется;\n- как пишутся запросы;\n- какие методы есть у модели;\n- как устроена таблица;\n- как обрабатываются ошибки БД.\nРепозиторий выносит эту логику отдельно.\n\n### Вариант с репозиторием\n```python\nclass UserRepository:\n    async def get_by_id(self, user_id: int):\n        return await User.filter(id=user_id).first()\n```\nСервис:\n```python\nclass UserService:\n    def __init__(self, user_repository: UserRepository):\n        self.user_repository = user_repository\n\n    async def get_user_profile(self, user_id: int):\n        user = await self.user_repository.get_by_id(user_id)\n\n        if not user:\n            raise ValueError(\"User not found\")\n\n        return {\n            \"id\": user.id,\n            \"username\": user.username,\n        }\n```\nТеперь `UserService` не знает, как именно достается пользователь. Он просто просит репозиторий:\n```\nДай мне пользователя по id.\n```\nА репозиторий уже решает, как это сделать.\n\n### Основная идея\nРепозиторий инкапсулирует доступ к данным. Microsoft описывает Repository и Unit of Work как способ создать абстрактный слой между бизнес-логикой и доступом к данным, чтобы изолировать приложение от изменений в хранилище и упростить тестирование.\n\n### Структура паттерна\n```\nService / Use Case\n        |\n        v\nRepository Interface\n        |\n        v\nConcrete Repository\n        |\n        v\nORM / SQL / Database\n```\nПример:\n```python\nfrom typing import Protocol\n\n\nclass UserRepositoryProtocol(Protocol):\n    async def get_by_id(self, user_id: int):\n        ...\n\n    async def get_by_username(self, username: str):\n        ...\n\n    async def create(self, username: str, password_hash: str):\n        ...\n```\nРеализация через ORM:\n```python\nclass TortoiseUserRepository:\n    async def get_by_id(self, user_id: int):\n        return await User.filter(id=user_id).first()\n\n    async def get_by_username(self, username: str):\n        return await User.filter(username=username).first()\n\n    async def create(self, username: str, password_hash: str):\n        return await User.create(\n            username=username,\n            password_hash=password_hash,\n        )\n```\nСервис зависит от интерфейса, а не от конкретной ORM:\n```python\nclass AuthService:\n    def __init__(self, user_repository: UserRepositoryProtocol):\n        self.user_repository = user_repository\n\n    async def register(self, username: str, password_hash: str):\n        existing_user = await self.user_repository.get_by_username(username)\n\n        if existing_user:\n            raise ValueError(\"Username already exists\")\n\n        return await self.user_repository.create(\n            username=username,\n            password_hash=password_hash,\n        )\n```\n\n### Что должно быть в Repository\nВ репозитории обычно лежит логика получения и сохранения данных:\n```\nget_by_id()\nget_by_username()\ncreate()\nupdate()\ndelete()\nlist_by_user()\nexists_by_email()\n```\nНапример:\n```python\nclass NotificationRepository:\n    async def create_notification(self, user_id: int, type_: str, text: str):\n        return await Notification.create(\n            user_id=user_id,\n            type=type_,\n            text=text,\n        )\n\n    async def list_user_notifications(\n        self,\n        user_id: int,\n        limit: int,\n        offset: int,\n    ):\n        return await Notification.filter(user_id=user_id).offset(offset).limit(limit)\n\n    async def delete_user_notification(self, user_id: int, notification_id: int):\n        deleted_count = await Notification.filter(\n            id=notification_id,\n            user_id=user_id,\n        ).delete()\n\n        return deleted_count > 0\n```\n\n### Что не должно быть в Repository\nРепозиторий не должен превращаться в сервис с бизнес-логикой.  \nПлохо:\n```python\nclass UserRepository:\n    async def register_user(self, username: str, password: str):\n        if len(password) < 8:\n            raise ValueError(\"Password too short\")\n\n        password_hash = hash_password(password)\n\n        user = await User.create(\n            username=username,\n            password_hash=password_hash,\n        )\n\n        await send_email(user)\n\n        return user\n```\nЗдесь смешались:\n```\n- валидация;\n- хеширование пароля;\n- создание пользователя;\n- отправка email.\n```\nЛучше:\n```\nService:\n- проверяет бизнес-правила;\n- вызывает нужные репозитории;\n- управляет сценарием.\n\nRepository:\n- читает данные;\n- сохраняет данные;\n- скрывает ORM/SQL.\n```\n\n### Repository и ORM — это не одно и то же\nORM уже дает доступ к БД:\n```python\nUser.objects.get(id=1)\nUser.filter(id=1).first()\n```\nНо ORM — это технический инструмент. Repository — это архитектурная прослойка над доступом к данным.\n```\nORM отвечает: как работать с таблицами и объектами.\nRepository отвечает: какие операции с данными нужны приложению.\n```\nНапример, ORM говорит:\n```python\nfilter, select_related, prefetch_related, annotate\n```\nРепозиторий говорит:\n```python\nget_active_users()\nget_user_with_profile()\nlist_user_notifications()\nexists_by_email()\n```\n\n### Repository и Service Layer\nРазница такая:\n```\nService Layer — бизнес-сценарии.\nRepository — доступ к данным.\n```\nПример:\n```python\nclass OrderService:\n    def __init__(\n        self,\n        order_repository,\n        product_repository,\n    ):\n        self.order_repository = order_repository\n        self.product_repository = product_repository\n\n    async def create_order(self, user_id: int, product_id: int, quantity: int):\n        product = await self.product_repository.get_by_id(product_id)\n\n        if not product:\n            raise ValueError(\"Product not found\")\n\n        if product.stock < quantity:\n            raise ValueError(\"Not enough stock\")\n\n        return await self.order_repository.create(\n            user_id=user_id,\n            product_id=product_id,\n            quantity=quantity,\n        )\n```\nЗдесь:\n- `OrderService` решает бизнес-задачу: создать заказ.\n- `ProductRepository` достает товар.\n- `OrderRepository` сохраняет заказ.\n\n### Repository и Unit of Work\nRepository часто используют вместе с Unit of Work. Repository отвечает за операции с конкретными сущностями, а Unit of Work — за транзакцию и согласованное сохранение изменений. Microsoft описывает Repository и Unit of Work как паттерны, которые помогают инкапсулировать infrastructure persistence layer и отделить его от application/domain слоев.\n\nПример идеи:\n```\nUnitOfWork\n  ├── user_repository\n  ├── order_repository\n  └── commit / rollback\n```\nУсловно:\n```python\nclass UnitOfWork:\n    def __init__(self, session):\n        self.session = session\n        self.users = UserRepository(session)\n        self.orders = OrderRepository(session)\n\n    async def commit(self):\n        await self.session.commit()\n\n    async def rollback(self):\n        await self.session.rollback()\n```\nСервис:\n```python\nclass OrderService:\n    def __init__(self, uow: UnitOfWork):\n        self.uow = uow\n\n    async def create_order(self, user_id: int, product_id: int):\n        try:\n            user = await self.uow.users.get_by_id(user_id)\n\n            if not user:\n                raise ValueError(\"User not found\")\n\n            order = await self.uow.orders.create(user_id, product_id)\n\n            await self.uow.commit()\n\n            return order\n        except Exception:\n            await self.uow.rollback()\n            raise\n```\n\n**Плюсы**\n1. Бизнес-логика не зависит напрямую от ORM.\n2. Код проще тестировать через mock/fake repository.\n3. Легче менять способ хранения данных.\n4. Запросы к данным собраны в одном месте.\n5. Сервисы становятся чище.\n6. Удобно использовать вместе с Clean Architecture, DDD, CQRS.\n\n**Минусы**\n1. Больше классов и файлов.\n2. Может дублировать возможности ORM.\n3. В простом CRUD может быть лишней абстракцией.\n4. При плохом дизайне превращается в набор методов на все случаи жизни.\n5. Слишком общий GenericRepository часто становится бесполезным.\n\n### Плохой Generic Repository\nЧастая ошибка — сделать универсальный репозиторий для всего:\n```python\nclass GenericRepository:\n    async def get(self, model, id):\n        ...\n\n    async def create(self, model, data):\n        ...\n\n    async def update(self, model, id, data):\n        ...\n\n    async def delete(self, model, id):\n        ...\n```\nФормально это репозиторий, но пользы мало. Он просто повторяет ORM.  \nЛучше делать репозитории под конкретную сущность или агрегат:\n```python\nclass UserRepository:\n    async def get_by_email(self, email: str):\n        ...\n\n    async def exists_by_username(self, username: str):\n        ...\n\n\nclass OrderRepository:\n    async def get_user_orders(self, user_id: int):\n        ...\n\n    async def get_unpaid_orders(self):\n        ...\n```\n\n### Когда использовать\nRepository уместен, когда:  \n1. Есть слой сервисов/use cases.\n2. Есть бизнес-логика, которую не хочется смешивать с ORM.\n3. Нужно тестировать сервисы без настоящей БД.\n4. Есть сложные запросы, которые нужно централизовать.\n5. Проект растет и прямые ORM-вызовы размазываются по коду.\n6. Используется DDD, Clean Architecture или CQRS.\n\n### Когда не использовать\nRepository может быть лишним, когда:\n1. Маленький CRUD-проект.\n2. Вся логика — простые create/read/update/delete.\n3. ORM уже достаточно хорошо закрывает задачу.\n4. Репозиторий ничего не добавляет, а только проксирует ORM.\n\nПлохой репозиторий:\n```python\nclass UserRepository:\n    async def get_by_id(self, id: int):\n        return await User.get(id=id)\n\n```\nЕсли в проекте только такие методы, пользы почти нет.  \nБолее полезный репозиторий:\n```python\nclass UserRepository:\n    async def get_active_user_with_profile(self, user_id: int):\n        return await User.filter(\n            id=user_id,\n            is_active=True,\n        ).prefetch_related(\"profile\").first()\n```\nЗдесь репозиторий уже скрывает конкретные детали запроса."
  popularity = 2.63

