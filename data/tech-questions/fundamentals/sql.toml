[[questions]]
  id = 15
  question = "Расскажите про ACID"
  answer = "ACID - это набор свойств, гарантирующих надёжность транзакции:\n- **A**tomicity (атомарность/неделимость операций) - все операции внутри транзакции либо выполняются полностью, либо не выполняются совсем\n- **C**onsistency (согласованность данных) - после транзакции данные соблюдают все правила целостности (правила целостности определяются бизнес-логикой)\n- **I**solation (изоляция) - во время выполнения транзакции параллельные транзакции не должны оказывать влияние на ее результат\n- **D**urability (долговечность/живучесть) - гарантирует, что закоммиченные изменения не могут быть потеряны ни при каких сбоях (поломка сервера, отключение электроэнергии и т.д.)\n"
  popularity = 5.26

[[questions]]
  id = 16
  question = "Какими инструментами вы пользовались для анализа плана выполнения (Профилирования) запроса (EXPLAIN/EXPLAIN ANALYZE)?"
  answer = "- **EXPLAIN** - показывает теоретический план выполнения запроса, что позволяет увидеть, как СУБД **планирует** извлекать данные\n- **EXPLAIN ANALYZE** - выполняет запрос и показывает **реальный план выполнения**, включая затраченные ресурсы (время, память)\n- **Indexes** - индексы ускоряют доступ к данным, особенно при использовании в условиях WHERE\n- **pg_stat_statements** (для PostgreSQL) - модуль для сбора статистики выполнения запросов\n\n**SQL-запрос у тебя в норме, но выполнение всё равно долгое. Твои действия?**\n- **Оптимизация плана выполнения** - воспользоваться EXPLAIN и EXPLAIN ANALYZE для анализа плана выполнения запроса и поиска проблемных мест\n- **Использование индексов** - проверить, правильно ли используются существующие индексы. При необходимости создать или изменить текущие\n- **Рефакторинг запроса** - изменить структуру запроса, если есть более эффективный способ получить те же данные. Например, объединение нескольких подзапросов или использование более простых JOIN\n- **Ресурсные ограничения** - проверить отсутствие ограничений по железу (нехватка CPU, памяти, диска)\n"
  popularity = 10.53

[[questions]]
  id = 17
  question = "Какую информацию о выполнении SQL-запроса позволяет получить EXPLAIN/EXPLAIN ANALYZE?"
  answer = "`EXPLAIN` и `EXPLAIN ANALYZE` показывают, **как СУБД планирует выполнить SQL-запрос** и где могут быть узкие места.\n\n### Главное отличие\n\n`EXPLAIN` показывает **предполагаемый план выполнения**, но сам запрос не выполняет.\n\n`EXPLAIN ANALYZE` **реально выполняет запрос** и показывает не только план, но и фактические метрики: реальное время, реальное количество строк, количество повторов узлов плана и т.д. В PostgreSQL `EXPLAIN ANALYZE` выполняет запрос полностью, поэтому для `INSERT`, `UPDATE`, `DELETE`, `MERGE` изменения действительно произойдут, если не обернуть запрос в транзакцию и не сделать `ROLLBACK`. \n\n### Какой план выполнения выбран\n\nМожно увидеть, какие операции использует база:\n\n```sql\nSeq Scan\nIndex Scan\nIndex Only Scan\nBitmap Index Scan\nBitmap Heap Scan\nNested Loop\nHash Join\nMerge Join\nSort\nAggregate\nLimit\n```\n\nНапример, по плану видно, читает ли PostgreSQL всю таблицу через `Seq Scan` или использует индекс через `Index Scan`. План представлен как дерево узлов: нижние узлы обычно читают данные из таблиц или индексов, а верхние узлы выполняют join, sort, aggregate и другие операции. \n\n### Оценочная стоимость выполнения\n\nВ обычном `EXPLAIN` выводятся оценки планировщика:\n\n```sql\n(cost=0.00..445.00 rows=10000 width=244)\n```\n\nГде:\n\n`cost=0.00..445.00` — примерная стоимость выполнения узла плана. Это не миллисекунды, а внутренние условные единицы PostgreSQL.\n\n`rows=10000` — сколько строк планировщик ожидает получить из этого узла.\n\n`width=244` — средний ожидаемый размер строки в байтах.\n\nВажно: `cost` — это не реальное время. Это оценка, по которой планировщик сравнивает разные варианты выполнения запроса. \n\n### Реальное время выполнения\n\nВ `EXPLAIN ANALYZE` появляются фактические данные:\n\n```sql\n(actual time=0.017..0.051 rows=10 loops=1)\n```\n\nГде:\n\n`actual time=0.017..0.051` — реальное время начала и завершения работы узла, в миллисекундах.\n\n`rows=10` — сколько строк реально вернул этот узел.\n\n`loops=1` — сколько раз этот узел был выполнен.\n\nЕсли `loops` больше 1, например при `Nested Loop`, то `actual time` и `rows` показываются как средние значения за один запуск узла. Чтобы примерно понять общее время узла, нужно умножать на `loops`. ([PostgreSQL](https://www.postgresql.org/docs/current/using-explain.html \"PostgreSQL: Documentation: 18: 14.1. Using EXPLAIN\"))\n\n### Насколько планировщик ошибся\n\nОдна из самых важных вещей — сравнить:\n\n```sql\nrows=100\n```\n\nиз оценки планировщика\n\nс\n\n```sql\nactual rows=10000\n```\n\nиз реального выполнения.\n\nЕсли планировщик ожидал 100 строк, а реально получил 10000, это может означать:\n\nданные плохо проанализированы;\n\nустарела статистика;\n\nнужен `ANALYZE`;\n\nусловие плохо оценивается;\n\nиндекс не помогает так, как ожидалось;\n\nзапрос написан неоптимально.\n\nPostgreSQL прямо указывает, что при `EXPLAIN ANALYZE` особенно важно смотреть, насколько оценочное количество строк близко к реальному. \n\n### Используются ли индексы\n\nПо плану видно:\n\nиспользуется ли индекс;\n\nкакой именно индекс используется;\n\nприменяется ли условие как `Index Cond`;\n\nкакие условия применяются уже после чтения строк через `Filter`;\n\nсколько строк было отброшено фильтром.\n\nПример:\n\n```sql\nIndex Cond: (unique1 < 100)\nFilter: (stringu1 = 'xxx')\nRows Removed by Filter: 3000\n```\n\n`Index Cond` означает, что условие помогло при поиске по индексу.\n\n`Filter` означает, что строки сначала были прочитаны, а потом отфильтрованы.\n\n`Rows Removed by Filter` показывает, сколько строк было отброшено после чтения. \n\n### Затраты на сортировку, хеширование и память\n\nДля некоторых операций PostgreSQL показывает дополнительные детали:\n\n```sql\nSort Method: quicksort  Memory: 74kB\nHash Cond: ...\nBuckets: 1024  Batches: 1  Memory Usage: 35kB\n```\n\nЭто помогает понять:\n\nсортировка была в памяти или ушла на диск;\n\nсколько памяти заняла сортировка;\n\nкак строился hash join;\n\nне было ли слишком большого hash/sort этапа. \n\n### Буферы и I/O\n\nС опцией `BUFFERS`, а в актуальных версиях PostgreSQL при `ANALYZE` она может включаться автоматически, можно увидеть работу с буферами:\n\n```sql\nBuffers: shared hit=36 read=6\n```\n\nЭто показывает:\n\n`hit` — данные были найдены в shared buffers, то есть уже в памяти PostgreSQL;\n\n`read` — данные пришлось читать с диска/ОС;\n\n`dirtied` — страницы были изменены;\n\n`written` — страницы были записаны.\n\nЭто полезно, когда запрос медленный не из-за CPU, а из-за чтения большого объёма данных. \n\n### Время планирования и выполнения\n\nВ конце `EXPLAIN ANALYZE` обычно есть:\n\n```sql\nPlanning Time: 0.485 ms\nExecution Time: 0.073 ms\n```\n\n`Planning Time` — сколько времени ушло на построение плана.\n\n`Execution Time` — сколько времени ушло на выполнение запроса.\n\nИногда сам запрос быстрый, но планирование сложное. Например, при большом количестве join, партиций или сложных условий. \n\n### Что можно диагностировать через EXPLAIN/EXPLAIN ANALYZE\n\nС помощью этих команд можно понять:\n\nпочему запрос медленный;\n\nиспользуется ли индекс;\n\nпочему база выбрала `Seq Scan`;\n\nкакой join используется: `Nested Loop`, `Hash Join`, `Merge Join`;\n\nсколько строк реально проходит через каждый этап;\n\nгде планировщик ошибается в оценках;\n\nесть ли лишняя сортировка;\n\nесть ли тяжелая агрегация;\n\nчитает ли запрос много данных с диска;\n\nкакой узел плана занимает больше всего времени;\n\nнасколько `LIMIT`, `ORDER BY`, `WHERE`, `JOIN`, `GROUP BY` влияют на выполнение.\n\n### Пример чтения\n\n```sql\nEXPLAIN ANALYZE\nSELECT *\nFROM users\nWHERE email = 'test@example.com';\n```\n\nВозможный результат:\n\n```sql\nSeq Scan on users\n  (cost=0.00..1200.00 rows=1 width=80)\n  (actual time=0.030..45.000 rows=1 loops=1)\n  Filter: (email = 'test@example.com')\n  Rows Removed by Filter: 999999\nExecution Time: 45.100 ms\n```\n\nЭто значит: PostgreSQL просканировал таблицу целиком, нашёл 1 строку, но отбросил почти миллион строк. Вероятная проблема — нет индекса по `email`.\n\nЛучше было бы увидеть:\n\n```sql\nIndex Scan using users_email_idx on users\n  Index Cond: (email = 'test@example.com')\n```\n\nТогда база ищет строку через индекс, а не перебирает всю таблицу.\n\n### Итог\n\n`EXPLAIN` показывает **что PostgreSQL собирается сделать**.\n\n`EXPLAIN ANALYZE` показывает **что PostgreSQL реально сделал**.\n\nСамое важное в выводе:\n\n`Seq Scan` / `Index Scan` — как читаются данные;\n\n`cost` — оценка планировщика;\n\n`rows` — ожидаемые строки;\n\n`actual rows` — реальные строки;\n\n`actual time` — реальное время;\n\n`loops` — сколько раз выполнялся узел;\n\n`Filter` / `Index Cond` — где применяются условия;\n\n`Rows Removed by Filter` — сколько строк зря прочитано;\n\n`Buffers` — работа с памятью и диском;\n\n`Planning Time` / `Execution Time` — время планирования и выполнения."
  popularity = 0.0

[[questions]]
  id = 18
  question = "EXPLAIN vs EXPLAIN ANALYZE"
  answer = "EXPLAIN показывает план выполнения запроса до его фактического выполнения. Он выводит, как СУБД собирается получить данные. Это включает:\n- какой тип сканирования будет применяться (Seq Scan, Index Scan)\n- сортировки и объединения (Nested Loop, Hash Join)\n- предполагаемое количество строк и стоимость выполнения на каждом этапе\n\n**Explain analyze. Как устроен? На что обращать внимание?**\nEXPLAIN ANALYZE не только показывает план выполнения, но и выполняет запрос, выводя фактическое время выполнения каждой операции. Полезные моменты:\n- **фактическое время** (Actual Time) - сколько времени заняла операция\n- **ROWS** - реальное количество строк, прошедших через каждый этап\n- **LOOPS** - количество раз, когда этот шаг был выполнен (важно для вложенных циклов)\n```sql\nEXPLAIN ANALYZE SELECT * FROM employees WHERE salary > 100000;\n```\n"
  popularity = 10.53

[[questions]]
  id = 19
  question = "Для чего нужен ANALYZE в PostgreSQL?"
  answer = "### Что такое сбор статистики в PostgreSQL\n\nВ контексте `ANALYZE` сбор статистики — это процесс, при котором PostgreSQL изучает содержимое таблицы и собирает примерные сведения о данных. Эти сведения потом использует планировщик запросов, чтобы выбрать более выгодный план выполнения. `ANALYZE` сохраняет результат в системном каталоге `pg_statistic`; официальная документация PostgreSQL прямо указывает, что эти данные использует query planner. \n\nВажно: это не статистика “сколько запросов было выполнено”. Это статистика о содержимом таблиц и колонок.\n\nНапример, PostgreSQL собирает информацию примерно такого типа:\n\n```text\nсколько строк в таблице\nсколько страниц занимает таблица\nкакие значения встречаются чаще всего\nпримерное распределение значений\nсколько уникальных значений в колонке\nсколько NULL-значений\nкорреляция физического порядка строк и порядка значений\n```\n\nЭти данные нужны не пользователю напрямую, а оптимизатору.\n\n### Для чего нужен ANALYZE\n\n`ANALYZE` нужен, чтобы PostgreSQL понимал, какие данные лежат в таблице, и мог оценивать стоимость разных вариантов выполнения запроса.\n\nНапример, есть запрос:\n\n```sql\nSELECT *\nFROM users\nWHERE city = 'Baku';\n```\n\nPostgreSQL должен решить, что выгоднее:\n\n```text\nпрочитать всю таблицу последовательно\nили использовать индекс по city\n```\n\nДля этого ему нужно примерно понимать:\n\n```text\nсколько всего строк в users\nсколько строк имеют city = 'Baku'\nнасколько избирательное это условие\n```\n\nЕсли `city = 'Baku'` встречается у 1% строк — индекс может быть выгоден.\n\nЕсли `city = 'Baku'` встречается у 80% строк — индекс может быть хуже, потому что придётся сходить по индексу и потом всё равно прочитать большую часть таблицы.\n\n### Пример\n\nЕсть таблица:\n\n```sql\nCREATE TABLE orders (\n    id bigserial PRIMARY KEY,\n    status text,\n    created_at timestamp\n);\n\nCREATE INDEX idx_orders_status ON orders(status);\n```\n\nВ таблице 10 миллионов заказов.\n\nРаспределение такое:\n\n```text\npaid      — 9 000 000 строк\nnew       —   900 000 строк\nfailed    —   100 000 строк\n```\n\nЗапрос:\n\n```sql\nSELECT *\nFROM orders\nWHERE status = 'failed';\n```\n\nДля `failed` индекс может быть полезен, потому что таких строк мало.\n\nА для:\n\n```sql\nSELECT *\nFROM orders\nWHERE status = 'paid';\n```\n\nиндекс может быть невыгоден, потому что таких строк почти вся таблица.\n\nЧтобы принять такое решение, PostgreSQL использует статистику, собранную через `ANALYZE`.\n\n### Что будет, если статистика устарела\n\nЕсли в таблице сильно изменились данные, а статистика старая, PostgreSQL может выбрать плохой план.\n\nНапример, раньше в таблице было мало строк:\n\n```text\norders: 10 000 строк\n```\n\nПотом стало много:\n\n```text\norders: 10 000 000 строк\n```\n\nНо статистика ещё старая. Планировщик может думать, что таблица маленькая, и выбрать план, который уже не подходит.\n\nТипичные последствия устаревшей статистики:\n\n```text\nвыбирается Seq Scan вместо Index Scan\nвыбирается Index Scan вместо Seq Scan\nнеудачный порядок JOIN\nнеподходящий алгоритм JOIN: Nested Loop / Hash Join / Merge Join\nневерная оценка количества строк\n```\n\nГлавная проблема обычно видна в `EXPLAIN ANALYZE`: PostgreSQL ожидал одно количество строк, а реально получил совсем другое.\n\nНапример:\n\n```text\nestimated rows: 100\nactual rows: 500000\n```\n\nЭто признак, что планировщик сильно ошибся в оценке.\n\n### Как запускается ANALYZE\n\nМожно запустить вручную:\n\n```sql\nANALYZE;\n```\n\nЭто обновит статистику по всем таблицам текущей базы данных.\n\nМожно по конкретной таблице:\n\n```sql\nANALYZE users;\n```\n\nМожно по конкретным колонкам:\n\n```sql\nANALYZE users(email, city);\n```\n\nТакже можно совместить с `VACUUM`:\n\n```sql\nVACUUM ANALYZE users;\n```\n\n`VACUUM ANALYZE` выполняет `VACUUM`, а затем `ANALYZE`; PostgreSQL описывает это как обновление статистики, которую планировщик использует для выбора эффективного плана запроса. \n\n### Автоматический ANALYZE\n\nОбычно вручную постоянно запускать `ANALYZE` не нужно. В PostgreSQL этим занимается autovacuum daemon: он не только чистит мёртвые версии строк через `VACUUM`, но и автоматически запускает `ANALYZE` для таблиц, где данные заметно изменились. Документация указывает, что в стандартной конфигурации autovacuum автоматически анализирует таблицы при загрузке данных и при изменениях в процессе работы. \n\nПроверить, когда таблица последний раз анализировалась, можно так:\n\n```sql\nSELECT\n    schemaname,\n    relname,\n    last_analyze,\n    last_autoanalyze\nFROM pg_stat_user_tables\nORDER BY last_autoanalyze DESC NULLS LAST;\n```\n\n### Где посмотреть собранную статистику\n\nУдобное представление:\n\n```sql\nSELECT *\nFROM pg_stats\nWHERE tablename = 'users';\n```\n\nТам можно увидеть статистику по колонкам: долю `NULL`, частые значения, гистограммы и другие данные.\n\nСистемный каталог низкого уровня — `pg_statistic`, но напрямую с ним обычно работают редко. PostgreSQL указывает, что `pg_statistic` хранит статистические данные о содержимом базы, а записи создаются командой `ANALYZE`; при этом статистика является приблизительной. \n\n### ANALYZE не выполняет запрос\n\nВажно не путать:\n\n```sql\nANALYZE users;\n```\n\nи\n\n```sql\nEXPLAIN ANALYZE\nSELECT * FROM users;\n```\n\nЭто разные вещи.\n\n`ANALYZE users;` — собирает статистику по таблице.\n\n`EXPLAIN ANALYZE SELECT ...` — реально выполняет запрос и показывает фактический план выполнения с реальным временем и количеством строк.\n\n### Коротко\n\n`ANALYZE` в PostgreSQL нужен, чтобы обновить статистику о данных в таблицах.\n\nЭта статистика помогает планировщику решать:\n\n```text\nиспользовать индекс или читать таблицу целиком\nв каком порядке соединять таблицы\nкакой тип JOIN выбрать\nкакой план будет дешевле\nсколько строк примерно вернёт условие\n```\n\nБез актуальной статистики PostgreSQL может выбрать плохой план, даже если индексы созданы правильно."
  popularity = 2.63

[[questions]]
  id = 20
  question = "Что делает команда VACUUM в PostgreSQL и зачем она нужна?"
  answer = "### Что делает VACUUM\n\n`VACUUM` в PostgreSQL очищает таблицы от “мёртвых” версий строк, которые появились после `UPDATE` и `DELETE`.\n\nPostgreSQL работает через MVCC: когда строку обновляют, старая версия не удаляется физически сразу. Вместо этого появляется новая версия строки, а старая остаётся в таблице, пока она ещё может быть нужна старым транзакциям. После того как старая версия уже никому не нужна, её можно убрать. Именно этим занимается `VACUUM`: он освобождает место, занятое dead tuples — мёртвыми строковыми версиями. В официальной документации PostgreSQL указано, что удалённые или устаревшие после `UPDATE` строки физически не удаляются из таблицы до выполнения `VACUUM`. \n\nПример:\n\n```sql\nUPDATE users\nSET email = 'new@mail.com'\nWHERE id = 10;\n```\n\nЛогически кажется, что строка просто изменилась. Но внутри PostgreSQL может быть примерно так:\n\n```text\nстарая версия строки: id=10, email='old@mail.com'  ← стала мёртвой\nновая версия строки:  id=10, email='new@mail.com'  ← актуальная\n```\n\n`VACUUM` потом приходит и очищает старую версию, когда она уже не нужна активным транзакциям.\n\n### Зачем он нужен\n\nБез `VACUUM` таблицы и индексы постепенно раздуваются.\n\nЭто называется bloat — лишнее место внутри таблиц и индексов. Запросы начинают читать больше страниц, чем реально нужно, из-за чего падает производительность.\n\n`VACUUM` нужен для нескольких вещей:\n\n```text\n1. Убирать мёртвые версии строк после UPDATE и DELETE.\n2. Освобождать место внутри таблицы для повторного использования.\n3. Чистить мёртвые записи в индексах.\n4. Поддерживать нормальную производительность запросов.\n5. Помогать предотвращать transaction ID wraparound.\n```\n\nОбычный `VACUUM` не всегда возвращает место операционной системе. Чаще он делает это место доступным для повторного использования внутри той же таблицы. PostgreSQL отдельно указывает: обычный `VACUUM` освобождает место для повторного использования, может работать параллельно с обычным чтением и записью, но в большинстве случаев не возвращает лишнее место ОС. \n\nТо есть после обычного `VACUUM` размер файла таблицы на диске может почти не уменьшиться, но новые строки смогут занять уже очищенное место.\n\n### Простая аналогия\n\nТаблица после множества `UPDATE` и `DELETE` похожа на файл с пометками:\n\n```text\nстрока 1 — актуальная\nстрока 2 — удалена, но физически ещё лежит\nстрока 3 — старая версия после UPDATE\nстрока 4 — актуальная\nстрока 5 — удалена, но физически ещё лежит\n```\n\n`VACUUM` проходит и говорит:\n\n```text\nстрока 2 больше никому не нужна → место можно переиспользовать\nстрока 3 больше никому не нужна → место можно переиспользовать\nстрока 5 больше никому не нужна → место можно переиспользовать\n```\n\nНо он не обязательно “сжимает файл” на диске. Он скорее наводит порядок внутри таблицы.\n\n### VACUUM и VACUUM FULL\n\nЕсть обычный `VACUUM`:\n\n```sql\nVACUUM users;\n```\n\nОн очищает мёртвые строки и освобождает место для повторного использования внутри таблицы. Обычно он не блокирует обычные `SELECT`, `INSERT`, `UPDATE`, `DELETE` так жёстко.\n\nЕсть `VACUUM FULL`:\n\n```sql\nVACUUM FULL users;\n```\n\nОн физически переписывает таблицу в новый файл без лишнего свободного места. Поэтому после него размер таблицы на диске может реально уменьшиться. Но он намного тяжелее: PostgreSQL указывает, что `VACUUM FULL` медленнее и требует `ACCESS EXCLUSIVE` lock на таблицу, то есть блокирует нормальную работу с ней на время выполнения. \n\nРазница:\n\n```text\nVACUUM:\n  очищает мёртвые строки\n  место остаётся внутри таблицы для переиспользования\n  обычно не требует полной блокировки таблицы\n\nVACUUM FULL:\n  переписывает таблицу заново\n  реально уменьшает размер файла на диске\n  требует сильную блокировку\n  работает дольше\n```\n\n`VACUUM FULL` не стоит запускать просто “для профилактики” на живой большой таблице. Его используют, когда таблица сильно раздулась и нужно именно вернуть место операционной системе.\n\n### Что такое autovacuum\n\nОбычно вручную постоянно запускать `VACUUM` не нужно. В PostgreSQL есть autovacuum — фоновый механизм, который сам запускает `VACUUM` и `ANALYZE`, когда таблицы достаточно изменились. В документации PostgreSQL указано, что autovacuum daemon в каждом цикле проверяет базу и выполняет `VACUUM` и `ANALYZE` для таблиц, где это нужно. \n\nПроверить, когда autovacuum последний раз работал по таблицам:\n\n```sql\nSELECT\n    schemaname,\n    relname,\n    n_live_tup,\n    n_dead_tup,\n    last_vacuum,\n    last_autovacuum\nFROM pg_stat_user_tables\nORDER BY n_dead_tup DESC;\n```\n\nОсобенно полезно смотреть на `n_dead_tup` — примерное количество мёртвых строк.\n\n### VACUUM и ANALYZE — не одно и то же\n\n`VACUUM` чистит мёртвые строки.\n\n`ANALYZE` собирает статистику для планировщика запросов.\n\nМожно запустить вместе:\n\n```sql\nVACUUM ANALYZE users;\n```\n\nЭто сначала выполняет `VACUUM`, а потом `ANALYZE`. В PostgreSQL документации указано, что `VACUUM ANALYZE` выполняет обе операции для выбранных таблиц, а `ANALYZE` обновляет статистику, которую планировщик использует для выбора эффективного плана запроса. \n\nТо есть:\n\n```text\nVACUUM        → чистит физический мусор после UPDATE/DELETE\nANALYZE       → обновляет статистику о данных\nVACUUM ANALYZE → делает и то, и другое\n```\n\n### Почему VACUUM важен для индексов\n\nПосле `UPDATE` и `DELETE` мёртвые записи могут оставаться не только в таблице, но и в индексах. Если их долго не чистить, индексы тоже раздуваются, становятся тяжелее, и индексные сканы могут работать хуже. PostgreSQL указывает, что если index cleanup не выполняется регулярно, производительность может ухудшаться, потому что индексы накапливают мёртвые записи. \n\nТо есть проблема не только в размере таблицы, но и в размере индексов.\n\n### Когда вручную запускать VACUUM\n\nОбычно autovacuum достаточно. Но вручную `VACUUM` может быть полезен после массовых операций:\n\n```sql\nDELETE FROM logs\nWHERE created_at < now() - interval '1 year';\n```\n\nили:\n\n```sql\nUPDATE orders\nSET status = 'archived'\nWHERE created_at < now() - interval '2 years';\n```\n\nПосле таких операций появляется много мёртвых строк. Тогда можно выполнить:\n\n```sql\nVACUUM logs;\n```\n\nили, если нужно ещё обновить статистику:\n\n```sql\nVACUUM ANALYZE logs;\n```\n\nА если после огромного удаления нужно именно уменьшить размер файла на диске:\n\n```sql\nVACUUM FULL logs;\n```\n\nНо `VACUUM FULL` надо применять осторожно из-за блокировки.\n\n### Коротко\n\n`VACUUM` — это механизм уборки в PostgreSQL.\n\nОн нужен, потому что PostgreSQL не удаляет старые версии строк сразу после `UPDATE` и `DELETE`. Сначала они остаются в таблице из-за MVCC, а потом `VACUUM` освобождает занятое ими место.\n\nГлавное:\n\n```text\nVACUUM чистит мёртвые строки.\nVACUUM уменьшает bloat.\nVACUUM помогает таблицам и индексам не раздуваться.\nОбычный VACUUM обычно не возвращает место ОС, а делает его доступным внутри таблицы.\nVACUUM FULL реально сжимает таблицу на диске, но блокирует её.\nAutovacuum обычно делает эту работу автоматически.\nVACUUM ANALYZE = очистка + обновление статистики.\n```"
  popularity = 10.53

