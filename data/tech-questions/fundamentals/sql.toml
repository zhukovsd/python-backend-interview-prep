[[questions]]
  id = 50
  question = "Что такое и зачем нужно партицирование"
  answer = "### Что такое партицирование\n\nПартицирование — это разделение одной большой логической таблицы на несколько меньших физических частей — партиций.\n\nДля приложения это обычно выглядит как одна таблица:\n\n```sql\nSELECT *\nFROM orders\nWHERE created_at >= '2026-07-01'\n  AND created_at < '2026-08-01';\n```\n\nНо внутри БД данные могут лежать не в одной огромной таблице `orders`, а, например, в отдельных партициях:\n\n```text\norders\n ├── orders_2026_01\n ├── orders_2026_02\n ├── orders_2026_03\n └── orders_2026_07\n```\n\nВ PostgreSQL партиционированная таблица сама по себе является “виртуальной” таблицей без собственного хранения данных; реальные строки хранятся в партициях. При вставке PostgreSQL направляет строку в нужную партицию по ключу партицирования. \n\n### Зачем нужно партицирование\n\nГлавная цель — упростить и ускорить работу с очень большими таблицами.\n\nНапример, есть таблица `logs` на 500 миллионов строк. Большинство запросов смотрит данные только за последние 7 дней:\n\n```sql\nSELECT *\nFROM logs\nWHERE created_at >= now() - interval '7 days';\n```\n\nБез партицирования БД работает с одной огромной таблицей и её большими индексами.\n\nС партицированием по дате можно сделать так:\n\n```text\nlogs_2026_06\nlogs_2026_07\nlogs_2026_08\n```\n\nТогда запрос за июль может читать только июльскую партицию, а не всю таблицу. Это называется partition pruning — отсечение ненужных партиций. PostgreSQL прямо указывает, что правильный выбор ключа партицирования важен, потому что условия `WHERE`, совпадающие с границами партиций, позволяют не читать лишние партиции. \n\n### Основные преимущества\n\nПартицирование полезно, когда таблица очень большая и запросы часто фильтруют данные по одному признаку: дата, регион, tenant_id, категория и так далее.\n\nОсновные плюсы:\n\n1. Быстрее выборки по ключу партицирования\n    \n\nНапример, если таблица заказов разбита по месяцам, а запрос ищет заказы только за июль, БД может не трогать остальные месяцы.\n\n```sql\nSELECT *\nFROM orders\nWHERE created_at >= '2026-07-01'\n  AND created_at < '2026-08-01';\n```\n\n2. Проще удалять старые данные\n    \n\nБез партицирования:\n\n```sql\nDELETE FROM logs\nWHERE created_at < '2025-01-01';\n```\n\nЭто может удалить миллионы строк, создать нагрузку, заблокировать ресурсы и потом потребовать `VACUUM`.\n\nС партицированием можно просто удалить старую партицию:\n\n```sql\nDROP TABLE logs_2024_12;\n```\n\nPostgreSQL отмечает, что удаление или отсоединение отдельной партиции намного быстрее массового `DELETE` и позволяет избежать лишней нагрузки от `VACUUM`. \n\n3. Индексы становятся меньше\n    \n\nВместо одного огромного индекса на всю таблицу каждая партиция может иметь свой отдельный индекс. Маленькие индексы проще держать в памяти, быстрее читать и обслуживать.\n\n4. Удобнее обслуживать данные\n    \n\nМожно отдельно архивировать старые партиции, переносить их на более дешёвое хранилище, перестраивать индексы только на конкретной партиции, загружать данные пачками в новую партицию.\n\nPostgreSQL также указывает, что редко используемые данные можно переносить на более дешёвые и медленные носители. \n\n### Виды партицирования\n\nВ PostgreSQL есть три основных встроенных вида:\n\n### 1. RANGE partitioning\n\nРазделение по диапазонам.\n\nЧаще всего используется для дат:\n\n```sql\nCREATE TABLE orders (\n    id bigint,\n    created_at date,\n    amount numeric\n) PARTITION BY RANGE (created_at);\n```\n\nПример партиции:\n\n```sql\nCREATE TABLE orders_2026_07\nPARTITION OF orders\nFOR VALUES FROM ('2026-07-01') TO ('2026-08-01');\n```\n\nПодходит для:\n\n```text\nлоги\nзаказы\nистория платежей\nсобытия\nаудит\nметрики\n```\n\n### 2. LIST partitioning\n\nРазделение по конкретным значениям.\n\nНапример, по стране:\n\n```sql\nCREATE TABLE users (\n    id bigint,\n    country text,\n    name text\n) PARTITION BY LIST (country);\n```\n\nПартиции:\n\n```sql\nCREATE TABLE users_az\nPARTITION OF users\nFOR VALUES IN ('AZ');\n\nCREATE TABLE users_tr\nPARTITION OF users\nFOR VALUES IN ('TR');\n```\n\nПодходит, когда есть фиксированные группы: страна, регион, тип клиента, категория.\n\n### 3. HASH partitioning\n\nРазделение по хэшу значения.\n\n```sql\nCREATE TABLE users (\n    id bigint,\n    username text\n) PARTITION BY HASH (id);\n```\n\nПример:\n\n```sql\nCREATE TABLE users_p0\nPARTITION OF users\nFOR VALUES WITH (MODULUS 4, REMAINDER 0);\n\nCREATE TABLE users_p1\nPARTITION OF users\nFOR VALUES WITH (MODULUS 4, REMAINDER 1);\n```\n\nПодходит, когда нет хорошего диапазона или списка, но нужно равномерно распределить данные между партициями.\n\nPostgreSQL официально поддерживает `RANGE`, `LIST` и `HASH` partitioning. \n\n### Простой пример\n\nДопустим, есть таблица логов:\n\n```sql\nCREATE TABLE logs (\n    id bigserial,\n    created_at date not null,\n    message text\n) PARTITION BY RANGE (created_at);\n```\n\nСоздаём партиции по месяцам:\n\n```sql\nCREATE TABLE logs_2026_07\nPARTITION OF logs\nFOR VALUES FROM ('2026-07-01') TO ('2026-08-01');\n\nCREATE TABLE logs_2026_08\nPARTITION OF logs\nFOR VALUES FROM ('2026-08-01') TO ('2026-09-01');\n```\n\nТеперь вставка идёт в основную таблицу:\n\n```sql\nINSERT INTO logs (created_at, message)\nVALUES ('2026-07-07', 'User logged in');\n```\n\nНо физически строка попадёт в `logs_2026_07`.\n\nЗапрос:\n\n```sql\nSELECT *\nFROM logs\nWHERE created_at >= '2026-07-01'\n  AND created_at < '2026-08-01';\n```\n\nможет читать только `logs_2026_07`.\n\n### Когда партицирование нужно\n\nПартицирование имеет смысл, когда:\n\n```text\nтаблица очень большая;\nданные естественно делятся на группы;\nзапросы часто фильтруют по этому признаку;\nнужно регулярно удалять или архивировать старые данные;\nиндексы стали слишком большими;\nмассовые DELETE/UPDATE стали дорогими;\nтаблица содержит временные данные: логи, события, платежи, метрики.\n```\n\nТипичный хороший случай:\n\n```text\norders по created_at\nlogs по created_at\nnotifications по created_at\nevents по created_at\npayments по created_at\nuser_activity по user_id или created_at\n```\n\n### Когда партицирование не нужно\n\nПартицирование не является универсальной оптимизацией.\n\nОно может быть бесполезным или даже вредным, если:\n\n```text\nтаблица небольшая;\nзапросы не фильтруют по ключу партицирования;\nпартиций слишком много;\nключ партицирования выбран неправильно;\nбольшинство запросов всё равно читает все партиции;\nобычного индекса достаточно.\n```\n\nНапример, если таблица разбита по `created_at`, но запросы почти всегда ищут по `email`, партицирование по дате особой пользы не даст:\n\n```sql\nSELECT *\nFROM users\nWHERE email = 'test@example.com';\n```\n\nВ таком случае нужен индекс по `email`, а не партицирование по дате.\n\nPostgreSQL отдельно предупреждает, что плохой дизайн партицирования может ухудшить планирование и выполнение запросов, а слишком большое количество партиций увеличивает время планирования и потребление памяти. ([PostgreSQL](https://www.postgresql.org/docs/current/ddl-partitioning.html \"PostgreSQL: Documentation: 18: 5.12. Table Partitioning\"))\n\n### Отличие партицирования от шардирования\n\nПартицирование — это разделение таблицы внутри одной базы данных.\n\nШардирование — это разделение данных между разными серверами или инстансами базы данных.\n\nУсловно:\n\n```text\nПартицирование:\nодин PostgreSQL → одна таблица → много партиций внутри одной БД\n\nШардирование:\nнесколько PostgreSQL-серверов → данные распределены между ними\n```\n\nПартицирование чаще решает проблему слишком большой таблицы внутри одной БД.\n\nШардирование чаще решает проблему, когда один сервер уже не справляется по CPU, RAM, диску или количеству запросов.\n\n### Главное\n\nПартицирование нужно не просто “для ускорения”, а для управляемости больших таблиц.\n\nОно помогает:\n\n```text\nчитать только нужную часть данных;\nбыстрее удалять старые данные;\nуменьшать размер индексов;\nобслуживать большие таблицы частями;\nархивировать данные без тяжёлых DELETE.\n```\n\nНо оно работает хорошо только тогда, когда ключ партицирования совпадает с реальными запросами. Самый частый и понятный пример — большая таблица логов или заказов, разбитая по дате."
  popularity = 2.63

[[questions]]
  id = 51
  question = "Что такое CTE в PostgreSQL?"
  answer = "### Что такое CTE\n\nCTE — Common Table Expression, «общее табличное выражение». В PostgreSQL это временный именованный результат внутри одного SQL-запроса, который объявляется через `WITH` и потом используется в основном запросе как будто это временная таблица. CTE существует только во время выполнения этого одного запроса и не сохраняется в базе. В официальной документации PostgreSQL CTE описываются как вспомогательные выражения, которые можно воспринимать как временные таблицы для одного запроса. \n\nПростейший пример:\n\n```sql\nWITH active_users AS (\n    SELECT id, username\n    FROM users\n    WHERE is_active = true\n)\nSELECT *\nFROM active_users;\n```\n\nЗдесь `active_users` — это CTE. Сначала PostgreSQL логически формирует результат:\n\n```sql\nSELECT id, username\nFROM users\nWHERE is_active = true\n```\n\nА потом основной запрос читает данные из `active_users`.\n\n### Зачем нужны CTE\n\nГлавная польза CTE — сделать сложный SQL-запрос более читаемым. Вместо глубоко вложенных подзапросов можно разбить логику на понятные шаги.\n\nНапример, без CTE запрос может быть тяжело читать:\n\n```sql\nSELECT user_id, total\nFROM (\n    SELECT user_id, SUM(amount) AS total\n    FROM orders\n    GROUP BY user_id\n) AS user_totals\nWHERE total > 1000;\n```\n\nС CTE читается проще:\n\n```sql\nWITH user_totals AS (\n    SELECT user_id, SUM(amount) AS total\n    FROM orders\n    GROUP BY user_id\n)\nSELECT user_id, total\nFROM user_totals\nWHERE total > 1000;\n```\n\nТо есть CTE удобно использовать, когда нужно:\n\nразбить сложный запрос на этапы;\n\nпереиспользовать промежуточный результат;\n\nсделать запрос понятнее;\n\nработать с рекурсивными структурами;\n\nиспользовать `INSERT`, `UPDATE`, `DELETE`, `MERGE` внутри `WITH`.\n\nPostgreSQL поддерживает CTE не только для `SELECT`, но и для `INSERT`, `UPDATE`, `DELETE`, `MERGE`. При этом сам `WITH` тоже может быть привязан к основному `SELECT`, `INSERT`, `UPDATE`, `DELETE` или `MERGE`. \n\n### Общий синтаксис\n\n```sql\nWITH cte_name AS (\n    SELECT ...\n)\nSELECT ...\nFROM cte_name;\n```\n\nМожно объявить несколько CTE:\n\n```sql\nWITH\nuser_totals AS (\n    SELECT user_id, SUM(amount) AS total\n    FROM orders\n    GROUP BY user_id\n),\nrich_users AS (\n    SELECT user_id\n    FROM user_totals\n    WHERE total > 1000\n)\nSELECT *\nFROM rich_users;\n```\n\nВторой CTE может использовать результат первого.\n\n### CTE vs подзапрос\n\nCTE и подзапрос часто могут решать одну и ту же задачу.\n\nПодзапрос:\n\n```sql\nSELECT *\nFROM (\n    SELECT user_id, SUM(amount) AS total\n    FROM orders\n    GROUP BY user_id\n) t\nWHERE total > 1000;\n```\n\nCTE:\n\n```sql\nWITH user_totals AS (\n    SELECT user_id, SUM(amount) AS total\n    FROM orders\n    GROUP BY user_id\n)\nSELECT *\nFROM user_totals\nWHERE total > 1000;\n```\n\nПо смыслу похоже, но CTE обычно лучше читается, особенно когда промежуточных шагов несколько.\n\n### Важный нюанс производительности\n\nВ старых версиях PostgreSQL CTE часто воспринимался как «барьер оптимизации»: PostgreSQL мог сначала полностью вычислить CTE, а потом уже применять внешний фильтр.\n\nВ современных версиях PostgreSQL поведение умнее. Если CTE нерекурсивный, не имеет побочных эффектов и используется один раз, PostgreSQL может встроить его в основной запрос и оптимизировать совместно. Если CTE используется несколько раз, он обычно материализуется, то есть вычисляется отдельно. Это поведение можно явно контролировать через `MATERIALIZED` и `NOT MATERIALIZED`. \n\nПример:\n\n```sql\nWITH w AS NOT MATERIALIZED (\n    SELECT *\n    FROM big_table\n)\nSELECT *\nFROM w\nWHERE key = 123;\n```\n\n`NOT MATERIALIZED` говорит планировщику: не обязательно вычислять CTE отдельно, можно встроить его в основной запрос.\n\nА так можно принудительно материализовать:\n\n```sql\nWITH w AS MATERIALIZED (\n    SELECT *\n    FROM big_table\n)\nSELECT *\nFROM w\nWHERE key = 123;\n```\n\nЭто может быть полезно, если внутри CTE дорогие вычисления, которые не хочется выполнять несколько раз.\n\n### Рекурсивные CTE\n\nCTE могут быть рекурсивными через `WITH RECURSIVE`. Это нужно для иерархий, деревьев, графов, категорий, вложенных комментариев, организационных структур.\n\nПример: получить числа от 1 до 5:\n\n```sql\nWITH RECURSIVE nums(n) AS (\n    SELECT 1\n    UNION ALL\n    SELECT n + 1\n    FROM nums\n    WHERE n < 5\n)\nSELECT *\nFROM nums;\n```\n\nРезультат:\n\n```text\n1\n2\n3\n4\n5\n```\n\nВ PostgreSQL рекурсивный CTE состоит из нерекурсивной части, затем `UNION` или `UNION ALL`, затем рекурсивной части, которая ссылается на сам CTE. Документация отдельно указывает, что такие запросы полезны для иерархических или древовидных данных. \n\n### CTE с изменением данных\n\nCTE может использоваться не только для выборки, но и для изменения данных.\n\nНапример, удалить строки и сразу вставить удалённые данные в лог:\n\n```sql\nWITH moved_rows AS (\n    DELETE FROM products\n    WHERE created_at < now() - interval '1 year'\n    RETURNING *\n)\nINSERT INTO products_log\nSELECT *\nFROM moved_rows;\n```\n\nЗдесь `DELETE` удаляет строки и через `RETURNING` возвращает их. Затем основной `INSERT` вставляет эти строки в таблицу логов. PostgreSQL допускает `INSERT`, `UPDATE`, `DELETE`, `MERGE` внутри `WITH`, но для дальнейшего использования результата обычно нужен `RETURNING`. ([PostgreSQL](https://www.postgresql.org/docs/current/queries-with.html \"PostgreSQL: Documentation: 18: 7.8. WITH Queries (Common Table Expressions)\"))\n\n### Кратко\n\nCTE в PostgreSQL — это именованный временный результат внутри одного SQL-запроса.\n\nИспользуется так:\n\n```sql\nWITH name AS (\n    SELECT ...\n)\nSELECT ...\nFROM name;\n```\n\nГлавное назначение — упростить сложные запросы, разбить их на логические этапы и иногда переиспользовать промежуточный результат.\n\nВажно не считать CTE всегда «бесплатной заменой» подзапроса. В простых случаях он улучшает читаемость, но в тяжёлых запросах нужно проверять план через `EXPLAIN` / `EXPLAIN ANALYZE`, особенно если CTE большой, используется несколько раз или явно материализуется."
  popularity = 2.63

[[questions]]
  id = 52
  question = "Как объявить индекс в SQL?"
  answer = "### Базовый синтаксис\n\nВ SQL индекс обычно объявляют через `CREATE INDEX`.\n\nДля PostgreSQL базовый вариант такой:\n\n```sql\nCREATE INDEX index_name\nON table_name (column_name);\n```\n\nПример:\n\n```sql\nCREATE INDEX idx_users_email\nON users (email);\n```\n\nЭтот запрос создаёт индекс `idx_users_email` на колонке `email` таблицы `users`.\n\nВ PostgreSQL `CREATE INDEX` создаёт индекс по указанной колонке или колонкам таблицы/материализованного представления. Индексы нужны, чтобы база могла быстрее находить строки, но они добавляют накладные расходы при изменении данных. Источник: документация PostgreSQL. \n\n### Индекс по нескольким колонкам\n\n```sql\nCREATE INDEX idx_orders_user_id_status\nON orders (user_id, status);\n```\n\nТакой индекс называется составным, или multicolumn index.\n\nОн может быть полезен для запросов вида:\n\n```sql\nSELECT *\nFROM orders\nWHERE user_id = 10\n  AND status = 'paid';\n```\n\nВ PostgreSQL составные индексы поддерживаются не всеми типами индексов, но поддерживаются, например, B-tree, GiST, GIN и BRIN. \n\n### Уникальный индекс\n\n```sql\nCREATE UNIQUE INDEX idx_users_email_unique\nON users (email);\n```\n\nТакой индекс не только ускоряет поиск, но и запрещает дублирующиеся значения в колонке `email`.\n\nНапример, второй пользователь с таким же email уже не сможет быть добавлен.\n\n### Индекс с указанием типа\n\nВ PostgreSQL по умолчанию создаётся B-tree индекс. Это самый распространённый вариант, который подходит для `=`, `<`, `>`, `BETWEEN`, `ORDER BY` и многих обычных фильтров. \n\nЯвно можно написать так:\n\n```sql\nCREATE INDEX idx_users_email\nON users USING btree (email);\n```\n\nДля других задач можно использовать другие типы:\n\n```sql\nCREATE INDEX idx_products_tags\nON products USING gin (tags);\n```\n\nНапример, `GIN` часто используют для массивов, JSONB, полнотекстового поиска.\n\n### Частичный индекс\n\nЧастичный индекс создаётся не по всей таблице, а только по строкам, которые подходят под условие.\n\n```sql\nCREATE INDEX idx_orders_active\nON orders (user_id)\nWHERE status = 'active';\n```\n\nТакой индекс будет содержать только строки, где:\n\n```sql\nstatus = 'active'\n```\n\nЭто полезно, если часто ищешь только активные записи, а остальные строки в индекс добавлять не нужно. В PostgreSQL частичный индекс определяется через условие-предикат `WHERE`. \n\n### Индекс по выражению\n\nИндекс можно создать не только по колонке, но и по выражению.\n\nНапример, для поиска email без учёта регистра:\n\n```sql\nCREATE INDEX idx_users_lower_email\nON users (lower(email));\n```\n\nТогда такой запрос сможет использовать индекс:\n\n```sql\nSELECT *\nFROM users\nWHERE lower(email) = lower('Test@Mail.com');\n```\n\nВ PostgreSQL для индексов по выражениям используется синтаксис с выражением внутри скобок. \n\n### Индекс без блокировки записи в таблицу\n\nВ PostgreSQL есть вариант:\n\n```sql\nCREATE INDEX CONCURRENTLY idx_users_email\nON users (email);\n```\n\n`CONCURRENTLY` используют на больших таблицах в production, чтобы создание индекса меньше мешало обычной работе приложения. Без `CONCURRENTLY` создание индекса может сильнее блокировать операции записи в таблицу.\n\n### С IF NOT EXISTS\n\nЧтобы не получить ошибку, если индекс уже существует:\n\n```sql\nCREATE INDEX IF NOT EXISTS idx_users_email\nON users (email);\n```\n\n### Как обычно называют индексы\n\nЧасто используют такой стиль:\n\n```sql\nidx_<table>_<column>\n```\n\nПримеры:\n\n```sql\nidx_users_email\nidx_orders_user_id\nidx_orders_user_id_status\nidx_products_created_at\n```\n\n### Удаление индекса\n\n```sql\nDROP INDEX idx_users_email;\n```\n\nВ PostgreSQL индекс удаляется отдельной командой `DROP INDEX`.\n\n### Главное\n\nОбычный индекс:\n\n```sql\nCREATE INDEX idx_table_column\nON table_name (column_name);\n```\n\nУникальный индекс:\n\n```sql\nCREATE UNIQUE INDEX idx_table_column_unique\nON table_name (column_name);\n```\n\nСоставной индекс:\n\n```sql\nCREATE INDEX idx_table_col1_col2\nON table_name (col1, col2);\n```\n\nЧастичный индекс:\n\n```sql\nCREATE INDEX idx_table_column_condition\nON table_name (column_name)\nWHERE condition;\n```\n\nИндекс по выражению:\n\n```sql\nCREATE INDEX idx_table_expression\nON table_name ((expression));\n```\n\nНа практике после создания индекса нужно проверять, используется ли он запросом:\n\n```sql\nEXPLAIN ANALYZE\nSELECT *\nFROM users\nWHERE email = 'test@example.com';\n```\n\nСам факт наличия индекса не гарантирует, что PostgreSQL его выберет. Планировщик использует индекс только тогда, когда считает это выгоднее, чем последовательное чтение таблицы. PostgreSQL сам обновляет индекс при изменении таблицы, но для качественного выбора плана нужны актуальные статистики, обычно через `ANALYZE`/autovacuum. "
  popularity = 2.63

[[questions]]
  id = 53
  question = "Чем отличаются реляционные и нереляционные базы данных?"
  answer = "Реляционная база данных — это БД, где данные хранятся в таблицах: строки, колонки, связи между таблицами, `JOIN`, ограничения, транзакции.\n\nНереляционная база данных, или NoSQL, — это не один конкретный тип БД, а семейство баз данных, которые могут хранить данные не только в таблицах: документами, ключ-значение, графами, широкими колонками и т.д. AWS прямо описывает SQL/relational БД как табличные, а NoSQL как БД с разными моделями данных. \n\n### Реляционные БД / SQL\n\nВ реляционных БД данные обычно организованы так:\n\n```sql\nusers\n-----\nid | username | email\n\norders\n------\nid | user_id | amount | status\n```\n\nСвязь между таблицами делается через ключи:\n\n```sql\nSELECT users.username, orders.amount\nFROM users\nJOIN orders ON orders.user_id = users.id;\n```\n\nТо есть заказ лежит в таблице `orders`, пользователь — в таблице `users`, а связь между ними задаётся через `user_id`.\n\nТипичные реляционные БД:\n\n```text\nPostgreSQL\nMySQL\nMariaDB\nOracle Database\nMicrosoft SQL Server\nSQLite\n```\n\nГлавные признаки реляционных БД:\n\n|Признак|Описание|\n|---|---|\n|Структура|Таблицы, строки, колонки|\n|Схема|Обычно строгая: заранее задаются поля и типы|\n|Связи|`PRIMARY KEY`, `FOREIGN KEY`, `JOIN`|\n|Язык|SQL|\n|Транзакции|Обычно сильная поддержка ACID|\n|Хорошо подходят для|Финансов, заказов, пользователей, складов, платежей, CRM, ERP|\n\nACID — это свойства транзакций: Atomicity, Consistency, Isolation, Durability. PostgreSQL в своей документации определяет ACID как набор свойств, который помогает сохранять корректность данных при конкурентной работе, ошибках и сбоях питания. \n\n### Нереляционные БД / NoSQL\n\nNoSQL-базы не обязаны хранить данные в виде классических таблиц. Они часто выбирают модель хранения под конкретную задачу.\n\nОсновные виды NoSQL:\n\n|Тип NoSQL|Как хранит данные|Примеры|\n|---|---|---|\n|Document DB|Документы, обычно JSON/BSON|MongoDB, CouchDB|\n|Key-value|Ключ → значение|Redis, DynamoDB|\n|Wide-column|Таблицы с гибкими колонками|Cassandra, HBase|\n|Graph DB|Узлы и связи|Neo4j, Amazon Neptune|\n|Search engine|Документы + индекс поиска|Elasticsearch, OpenSearch|\n\nПример документа в MongoDB:\n\n```json\n{\n  \"_id\": 1,\n  \"username\": \"alex\",\n  \"email\": \"alex@example.com\",\n  \"orders\": [\n    {\n      \"id\": 101,\n      \"amount\": 2500,\n      \"status\": \"paid\"\n    }\n  ]\n}\n```\n\nЗдесь пользователь и его заказы могут лежать внутри одного документа. В реляционной БД это чаще были бы две таблицы: `users` и `orders`.\n\nMongoDB в документации описывает проектирование схемы как процесс организации данных под нужды приложения и оптимизацию производительности. То есть NoSQL не означает «схемы вообще нет»; скорее схема часто более гибкая и проектируется иначе. \n\n### Главное отличие в мышлении\n\nВ SQL-подходе ты обычно сначала проектируешь нормализованную структуру:\n\n```text\nusers\norders\nproducts\norder_items\npayments\n```\n\nДанные разделены по таблицам, дублирование уменьшается, связи выражаются через ключи.\n\nВ NoSQL-подходе ты чаще проектируешь данные под конкретные запросы приложения:\n\n```text\nКак я буду читать данные?\nКакие документы мне нужны целиком?\nЧто выгоднее хранить вместе?\nКакие операции должны быть максимально быстрыми?\n```\n\nНапример, если приложение часто открывает профиль пользователя вместе с последними заказами, в document DB часть заказов можно встроить прямо в документ пользователя.\n\n### SQL vs NoSQL по пунктам\n\n|Критерий|SQL / Relational|NoSQL / Non-relational|\n|---|---|---|\n|Хранение|Таблицы|Документы, ключ-значение, графы, широкие колонки|\n|Схема|Обычно строгая|Обычно гибкая|\n|Связи|Через `JOIN`, FK|Часто через вложенность, дублирование или отдельную логику|\n|Запросы|SQL|Зависит от конкретной БД|\n|Транзакции|Обычно сильная сторона|Зависит от конкретной БД|\n|Масштабирование|Часто вертикальное + репликация/шардирование|Часто проще горизонтальное масштабирование|\n|Консистентность|Обычно приоритет на строгую целостность|Часто компромисс между скоростью, доступностью и консистентностью|\n|Типовые задачи|Банкинг, заказы, платежи, учет|Логи, кэш, события, документы, большие распределенные нагрузки|\n\nIBM тоже выделяет среди ключевых различий SQL и NoSQL: реляционность/нереляционность, заранее заданную или динамическую схему, способ масштабирования, тип данных и пригодность для многострочных транзакций или неструктурированных данных. \n\n### Пример на одной задаче\n\nДопустим, есть интернет-магазин.\n\nВ PostgreSQL структура может быть такой:\n\n```sql\nCREATE TABLE users (\n    id SERIAL PRIMARY KEY,\n    username TEXT NOT NULL\n);\n\nCREATE TABLE orders (\n    id SERIAL PRIMARY KEY,\n    user_id INT REFERENCES users(id),\n    amount NUMERIC NOT NULL\n);\n```\n\nЗапрос:\n\n```sql\nSELECT u.username, o.amount\nFROM users u\nJOIN orders o ON o.user_id = u.id\nWHERE u.id = 1;\n```\n\nВ MongoDB похожие данные можно хранить так:\n\n```json\n{\n  \"_id\": 1,\n  \"username\": \"alex\",\n  \"orders\": [\n    { \"id\": 101, \"amount\": 2500 },\n    { \"id\": 102, \"amount\": 1800 }\n  ]\n}\n```\n\nВ SQL данные более нормализованы. В NoSQL данные могут быть собраны так, чтобы быстрее читать их целиком.\n\n### Когда лучше SQL\n\nSQL/реляционная БД обычно лучше, когда:\n\nнужны строгие связи между сущностями;\n\nважна целостность данных;\n\nмного сложных запросов с `JOIN`, агрегациями, фильтрами;\n\nнужны транзакции;\n\nданные хорошо укладываются в таблицы;\n\nесть бизнес-логика типа заказов, платежей, балансов, пользователей, ролей.\n\nДля backend-разработки PostgreSQL часто является базовым и самым универсальным выбором.\n\nПримеры задач:\n\n```text\nпользователи и роли\nзаказы и оплаты\nбанковские операции\nскладской учет\nбронирования\nCRM\nадмин-панели\nфинансовые системы\n```\n\n### Когда лучше NoSQL\n\nNoSQL часто выбирают, когда:\n\nданные плохо укладываются в строгие таблицы;\n\nструктура данных часто меняется;\n\nнужно хранить большие объемы событий, логов, метрик;\n\nнужен быстрый доступ по ключу;\n\nнужна высокая горизонтальная масштабируемость;\n\nданные удобно хранить документами.\n\nПримеры задач:\n\n```text\nкэширование — Redis\nлоги и события — Elasticsearch/OpenSearch\nгибкие JSON-документы — MongoDB\nбольшие распределенные key-value нагрузки — DynamoDB\nграф связей — Neo4j\n```\n\n### Важный момент: NoSQL не значит «лучше SQL»\n\nNoSQL — не замена SQL во всех случаях. Это другой набор инструментов.\n\nОшибка — выбирать MongoDB или Redis только потому, что «они быстрее». Быстрее в чём? В чтении по ключу — возможно. В сложных связях, транзакциях, аналитических выборках с JOIN — реляционная БД часто удобнее и надёжнее.\n\nТакже ошибка — думать, что NoSQL всегда не поддерживает транзакции. Некоторые NoSQL-БД поддерживают транзакции, но модель, ограничения и стоимость таких операций зависят от конкретной системы. Например, MongoDB заявляет поддержку multi-document ACID transactions, но это не делает её полностью такой же по подходу, как PostgreSQL. \n\n### Практическое правило выбора\n\nДля обычного backend-приложения по умолчанию чаще выбирают:\n\n```text\nPostgreSQL как основная БД\nRedis как кэш / хранилище сессий / rate limit / очереди\nElasticsearch или OpenSearch для сложного поиска\nMongoDB — если данные реально документные и гибкая структура важнее строгих связей\n```\n\nТо есть на практике часто используют не «SQL или NoSQL», а комбинацию:\n\n```text\nPostgreSQL — основное надежное хранилище\nRedis — быстрый кэш\nElasticsearch — поиск\nS3/MinIO — файлы\n```\n\n### Итог\n\nРеляционные БД — это таблицы, строгая структура, связи, SQL, транзакции и высокая целостность данных.\n\nNoSQL — это нереляционные модели хранения: документы, ключ-значение, графы, широкие колонки. Они часто дают гибкость схемы, удобное горизонтальное масштабирование и хорошую производительность под конкретные сценарии.\n\nДля большинства backend-систем PostgreSQL остаётся хорошим основным выбором. NoSQL обычно добавляют не вместо PostgreSQL, а рядом с ним, когда появляется конкретная задача: кэш, поиск, логи, документы, графы или сверхбыстрый доступ по ключу."
