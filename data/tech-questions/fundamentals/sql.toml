  question = "Что такое VIEW в SQL?"
  answer = "### Что такое VIEW\n\n`VIEW` в SQL — это **именованное представление запроса**.\n\nПроще говоря, `VIEW` — это объект в базе данных, который выглядит как таблица, но на самом деле хранит не данные, а SQL-запрос.\n\nПример:\n\n```sql\nCREATE VIEW active_users AS\nSELECT\n    id,\n    username,\n    email,\n    created_at\nFROM users\nWHERE is_active = true;\n```\n\nПосле этого можно обращаться к view почти как к таблице:\n\n```sql\nSELECT *\nFROM active_users;\n```\n\nНо физически отдельной таблицы `active_users` с копией данных обычно нет. В PostgreSQL обычный view реализуется как объект без собственного хранения данных: view фактически является «пустой таблицей» с правилом `ON SELECT DO INSTEAD`, то есть при обращении к нему PostgreSQL подставляет определённый запрос. \n\n---\n\n### Простая аналогия\n\nОбычная таблица:\n\n```text\nхранит реальные строки данных\n```\n\n`VIEW`:\n\n```text\nхранит SQL-запрос, который показывает данные из других таблиц\n```\n\nТо есть `VIEW` можно воспринимать как сохранённый `SELECT`.\n\nНапример, вместо того чтобы каждый раз писать:\n\n```sql\nSELECT\n    id,\n    username,\n    email\nFROM users\nWHERE is_active = true\n  AND deleted_at IS NULL;\n```\n\nможно один раз создать view:\n\n```sql\nCREATE VIEW active_users AS\nSELECT\n    id,\n    username,\n    email\nFROM users\nWHERE is_active = true\n  AND deleted_at IS NULL;\n```\n\nИ потом писать проще:\n\n```sql\nSELECT *\nFROM active_users;\n```\n\n---\n\n### Что происходит при SELECT из VIEW\n\nКогда ты выполняешь:\n\n```sql\nSELECT *\nFROM active_users;\n```\n\nБаза фактически использует запрос, который лежит внутри view:\n\n```sql\nSELECT\n    id,\n    username,\n    email\nFROM users\nWHERE is_active = true\n  AND deleted_at IS NULL;\n```\n\nТо есть обычный view не является кэшем результата.\n\nЕсли в таблице `users` изменились данные, то при следующем запросе к `active_users` ты увидишь актуальные данные из `users`.\n\nНапример:\n\n```sql\nUPDATE users\nSET is_active = false\nWHERE id = 10;\n```\n\nПосле этого пользователь `id = 10` уже не попадёт в:\n\n```sql\nSELECT *\nFROM active_users;\n```\n\nПотому что view каждый раз показывает данные согласно своему `SELECT`.\n\n---\n\n### Зачем нужны VIEW\n\nVIEW используют для нескольких задач.\n\nОсновные причины:\n\n```text\nупростить сложные запросы;\nскрыть сложность JOIN и агрегаций;\nограничить доступ к данным;\nдать удобный интерфейс к таблицам;\nпереиспользовать один и тот же SELECT;\nсделать схему более стабильной для приложения;\nподготовить данные для отчётов.\n```\n\n---\n\n### 1. Упрощение сложных запросов\n\nДопустим, есть таблицы:\n\n```text\nusers\norders\npayments\n```\n\nИ часто нужен отчёт по пользователям:\n\n```sql\nSELECT\n    u.id,\n    u.username,\n    COUNT(o.id) AS orders_count,\n    COALESCE(SUM(o.amount), 0) AS total_orders_amount\nFROM users u\nLEFT JOIN orders o ON o.user_id = u.id\nGROUP BY u.id, u.username;\n```\n\nМожно создать view:\n\n```sql\nCREATE VIEW user_order_stats AS\nSELECT\n    u.id AS user_id,\n    u.username,\n    COUNT(o.id) AS orders_count,\n    COALESCE(SUM(o.amount), 0) AS total_orders_amount\nFROM users u\nLEFT JOIN orders o ON o.user_id = u.id\nGROUP BY u.id, u.username;\n```\n\nТеперь вместо большого запроса можно писать:\n\n```sql\nSELECT *\nFROM user_order_stats\nWHERE total_orders_amount > 1000;\n```\n\nЭто делает SQL в приложении проще и понятнее.\n\n---\n\n### 2. Сокрытие лишних колонок\n\nДопустим, есть таблица пользователей:\n\n```sql\nCREATE TABLE users (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    username TEXT NOT NULL,\n    email TEXT NOT NULL,\n    password_hash TEXT NOT NULL,\n    is_active BOOLEAN NOT NULL,\n    created_at TIMESTAMP NOT NULL DEFAULT now()\n);\n```\n\nНельзя давать некоторым частям системы доступ к `password_hash`.\n\nМожно создать view:\n\n```sql\nCREATE VIEW public_users AS\nSELECT\n    id,\n    username,\n    created_at\nFROM users\nWHERE is_active = true;\n```\n\nТеперь можно выдавать доступ не к таблице `users`, а к view `public_users`.\n\nЗапрос:\n\n```sql\nSELECT *\nFROM public_users;\n```\n\nне покажет:\n\n```text\nemail\npassword_hash\nслужебные поля\n```\n\nЭто один из классических сценариев использования view: предоставить ограниченное представление данных.\n\n---\n\n### 3. Сокрытие условий фильтрации\n\nНапример, в проекте используется soft delete:\n\n```sql\ndeleted_at TIMESTAMP\n```\n\nИ почти во всех запросах нужно писать:\n\n```sql\nWHERE deleted_at IS NULL\n```\n\nМожно создать view:\n\n```sql\nCREATE VIEW not_deleted_files AS\nSELECT *\nFROM files\nWHERE deleted_at IS NULL;\n```\n\nТеперь запросы становятся проще:\n\n```sql\nSELECT *\nFROM not_deleted_files\nWHERE user_id = 123;\n```\n\nТак view помогает не забывать важные условия фильтрации.\n\n---\n\n### 4. Удобный интерфейс поверх сложной схемы\n\nИногда структура таблиц нормализована и удобна для хранения, но неудобна для чтения.\n\nНапример:\n\n```text\norders\norder_items\nproducts\nusers\n```\n\nЧтобы получить понятный отчёт, нужно несколько `JOIN`.\n\nМожно создать view:\n\n```sql\nCREATE VIEW order_details AS\nSELECT\n    o.id AS order_id,\n    u.username,\n    p.name AS product_name,\n    oi.quantity,\n    oi.quantity * oi.price AS item_total,\n    o.created_at\nFROM orders o\nJOIN users u ON u.id = o.user_id\nJOIN order_items oi ON oi.order_id = o.id\nJOIN products p ON p.id = oi.product_id;\n```\n\nПосле этого для чтения можно использовать:\n\n```sql\nSELECT *\nFROM order_details\nWHERE order_id = 100;\n```\n\nТо есть view превращает сложную схему в более удобное представление.\n\n---\n\n### VIEW не хранит данные как таблица\n\nЭто важнейшее отличие от обычной таблицы.\n\nОбычная таблица:\n\n```sql\nCREATE TABLE active_users_table AS\nSELECT *\nFROM users\nWHERE is_active = true;\n```\n\nсоздаёт физическую копию данных на момент выполнения.\n\nА view:\n\n```sql\nCREATE VIEW active_users AS\nSELECT *\nFROM users\nWHERE is_active = true;\n```\n\nсоздаёт сохранённый запрос.\n\nЕсли в `users` добавится новый активный пользователь, обычная таблица-копия сама не обновится. А view сразу начнёт показывать нового пользователя, потому что он читает данные из исходной таблицы при выполнении запроса.\n\n---\n\n### VIEW vs TABLE\n\n|Критерий|TABLE|VIEW|\n|---|---|---|\n|Хранит данные физически|Да|Обычно нет|\n|Создаётся через|`CREATE TABLE`|`CREATE VIEW`|\n|Используется в `SELECT`|Да|Да|\n|Данные обновляются при изменении источников|Не автоматически, если это копия|Да, потому что view читает источники|\n|Можно индексировать напрямую|Да|Обычный view — нет|\n|Подходит для хранения данных|Да|Нет|\n|Подходит для упрощения чтения|Иногда|Да|\n\n---\n\n### VIEW vs подзапрос\n\nПодзапрос существует только внутри одного SQL-запроса.\n\nПример:\n\n```sql\nSELECT *\nFROM (\n    SELECT *\n    FROM users\n    WHERE is_active = true\n) AS active_users;\n```\n\nА view можно создать один раз и потом использовать во многих запросах:\n\n```sql\nCREATE VIEW active_users AS\nSELECT *\nFROM users\nWHERE is_active = true;\n```\n\nПотом:\n\n```sql\nSELECT *\nFROM active_users;\n\nSELECT COUNT(*)\nFROM active_users;\n\nSELECT *\nFROM active_users\nWHERE created_at >= now() - interval '30 days';\n```\n\nТо есть view — это переиспользуемый именованный запрос на уровне схемы БД.\n\n---\n\n### VIEW vs WITH / CTE\n\n`WITH` создаёт временное именованное выражение только внутри одного запроса.\n\n```sql\nWITH active_users AS (\n    SELECT *\n    FROM users\n    WHERE is_active = true\n)\nSELECT *\nFROM active_users;\n```\n\nПосле выполнения запроса `active_users` исчезает.\n\n`VIEW` сохраняется в базе:\n\n```sql\nCREATE VIEW active_users AS\nSELECT *\nFROM users\nWHERE is_active = true;\n```\n\nИ потом доступен в других запросах.\n\nPostgreSQL описывает `WITH` как способ написать вспомогательные выражения для использования в более крупном запросе; такие CTE можно воспринимать как временные таблицы, существующие только для одного запроса. \n\nСравнение:\n\n|Критерий|WITH / CTE|VIEW|\n|---|---|---|\n|Существует|Только один запрос|Постоянный объект БД|\n|Создаётся через|`WITH ... AS (...)`|`CREATE VIEW ... AS SELECT ...`|\n|Можно переиспользовать в разных запросах|Нет|Да|\n|Хорош для|Разбить один сложный запрос|Переиспользуемое представление данных|\n|Хранит данные|Нет|Обычный view тоже нет|\n\n---\n\n### VIEW vs MATERIALIZED VIEW\n\nЕсть обычный view и materialized view.\n\nОбычный view:\n\n```sql\nCREATE VIEW user_stats AS\nSELECT ...\n```\n\nобычно не хранит результат. При обращении выполняется запрос к исходным таблицам.\n\nMaterialized view:\n\n```sql\nCREATE MATERIALIZED VIEW user_stats_mv AS\nSELECT ...\n```\n\nфизически хранит результат запроса. В PostgreSQL `CREATE MATERIALIZED VIEW` выполняет запрос при создании и использует его результат для заполнения materialized view; позже данные можно обновлять через `REFRESH MATERIALIZED VIEW`. \n\nСравнение:\n\n|Критерий|VIEW|MATERIALIZED VIEW|\n|---|---|---|\n|Хранит результат запроса|Нет|Да|\n|Данные всегда актуальны относительно таблиц|Да, при каждом чтении|Нет, до следующего refresh|\n|Чтение|Может быть медленным, если запрос сложный|Часто быстрее|\n|Обновление данных|Не требуется|Нужно `REFRESH MATERIALIZED VIEW`|\n|Можно индексировать|Обычный view — нет|Да, как физически сохранённый результат|\n|Подходит для|Упрощение доступа, безопасность|Тяжёлые отчёты, аналитика, кэширование результата|\n\nPostgreSQL также описывает materialized views как похожие на views по rule system, но с сохранением результата в table-like форме. \n\n---\n\n### Пример обычного VIEW\n\nДопустим, есть таблицы:\n\n```sql\nCREATE TABLE users (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    username TEXT NOT NULL,\n    is_active BOOLEAN NOT NULL DEFAULT true\n);\n\nCREATE TABLE orders (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    user_id BIGINT NOT NULL REFERENCES users(id),\n    amount NUMERIC NOT NULL,\n    status TEXT NOT NULL,\n    created_at TIMESTAMP NOT NULL DEFAULT now()\n);\n```\n\nСоздадим view:\n\n```sql\nCREATE VIEW paid_orders_view AS\nSELECT\n    o.id AS order_id,\n    o.amount,\n    o.created_at,\n    u.id AS user_id,\n    u.username\nFROM orders o\nJOIN users u ON u.id = o.user_id\nWHERE o.status = 'paid'\n  AND u.is_active = true;\n```\n\nТеперь можно писать:\n\n```sql\nSELECT *\nFROM paid_orders_view\nWHERE amount > 1000;\n```\n\nВместо того чтобы каждый раз писать `JOIN`, `WHERE o.status = 'paid'` и `u.is_active = true`.\n\n---\n\n### Можно ли делать JOIN с VIEW\n\nДа. View можно использовать в запросах почти как таблицу.\n\nНапример:\n\n```sql\nSELECT\n    pov.order_id,\n    pov.username,\n    p.method\nFROM paid_orders_view pov\nJOIN payments p ON p.order_id = pov.order_id;\n```\n\nЗдесь:\n\n```text\npaid_orders_view используется как источник данных;\npayments присоединяется через JOIN.\n```\n\nЭто нормально. Но важно помнить: внутри `paid_orders_view` уже есть свой запрос, и итоговый запрос может стать сложным. При проблемах с производительностью нужно смотреть `EXPLAIN ANALYZE`.\n\n---\n\n### Можно ли фильтровать VIEW\n\nДа.\n\n```sql\nSELECT *\nFROM paid_orders_view\nWHERE amount > 500\nORDER BY created_at DESC\nLIMIT 20;\n```\n\nЛогически это похоже на то, как если бы фильтр применялся к результату view.\n\nВ реальности оптимизатор СУБД может встроить view в общий запрос и построить единый план выполнения. Поэтому view не обязательно означает, что база сначала полностью вычислит весь view, а потом применит внешний фильтр.\n\n---\n\n### Можно ли обновлять данные через VIEW\n\nИногда можно, но не всегда.\n\nПростой view может быть автоматически обновляемым.\n\nНапример:\n\n```sql\nCREATE VIEW active_users AS\nSELECT\n    id,\n    username,\n    email\nFROM users\nWHERE is_active = true;\n```\n\nВ некоторых случаях можно выполнить:\n\n```sql\nUPDATE active_users\nSET username = 'new_name'\nWHERE id = 10;\n```\n\nИ изменение попадёт в базовую таблицу `users`.\n\nНо сложные views обычно не обновляемые автоматически. Например, если view содержит:\n\n```text\nJOIN;\nGROUP BY;\nDISTINCT;\nагрегаты;\nUNION;\nоконные функции;\nвычисляемые колонки без прямого соответствия базовой таблице.\n```\n\nто базе может быть непонятно, как изменение view должно отразиться в исходных таблицах.\n\nPostgreSQL документация по `CREATE VIEW` описывает updatable views и `CHECK OPTION`; `CHECK OPTION` позволяет запрещать `INSERT`/`UPDATE` через view, если новая строка не удовлетворяет условию view. \n\n---\n\n### Пример CHECK OPTION\n\nДопустим, есть view только для активных пользователей:\n\n```sql\nCREATE VIEW active_users AS\nSELECT *\nFROM users\nWHERE is_active = true\nWITH CHECK OPTION;\n```\n\nТеперь если попытаться через view вставить или обновить строку так, что она не будет соответствовать условию view, база отклонит операцию.\n\nНапример:\n\n```sql\nINSERT INTO active_users (username, email, is_active)\nVALUES ('alex', 'alex@example.com', false);\n```\n\nТакой insert противоречит условию:\n\n```sql\nWHERE is_active = true\n```\n\nПоэтому `WITH CHECK OPTION` защищает view от вставки/обновления строк, которые потом не были бы видны через этот же view.\n\n---\n\n### Для чего VIEW используют в безопасности\n\nView часто используют как слой ограничения доступа.\n\nНапример, есть таблица:\n\n```sql\nCREATE TABLE employees (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    full_name TEXT NOT NULL,\n    department TEXT NOT NULL,\n    salary NUMERIC NOT NULL,\n    passport_number TEXT\n);\n```\n\nНе всем пользователям БД можно видеть зарплаты и паспортные данные.\n\nСоздаём view:\n\n```sql\nCREATE VIEW employee_public_info AS\nSELECT\n    id,\n    full_name,\n    department\nFROM employees;\n```\n\nДалее можно дать доступ к view:\n\n```sql\nGRANT SELECT ON employee_public_info TO reporting_user;\n```\n\nНо не давать доступ к исходной таблице `employees`.\n\nТак пользователь сможет делать:\n\n```sql\nSELECT *\nFROM employee_public_info;\n```\n\nно не увидит:\n\n```text\nsalary\npassport_number\n```\n\nЭто не единственный механизм безопасности, но очень распространённый.\n\n---\n\n### VIEW и права доступа\n\nВ PostgreSQL view — это отдельный объект схемы. У него могут быть свои права доступа. Это позволяет выдать `SELECT` на view, не выдавая прямой доступ к исходной таблице.\n\nНапример:\n\n```sql\nGRANT SELECT ON public_users TO app_readonly;\n```\n\nНо при проектировании безопасности надо учитывать владельца view, `security_invoker`/`security_barrier`, row-level security и другие нюансы PostgreSQL. Для базового понимания достаточно: view может быть удобным слоем ограничения видимых колонок и строк.\n\n---\n\n### VIEW и производительность\n\nОбычный view сам по себе обычно не ускоряет запрос.\n\nЭто важный момент.\n\nЕсли view содержит тяжёлый запрос:\n\n```sql\nCREATE VIEW heavy_report AS\nSELECT\n    ...\nFROM huge_table_a\nJOIN huge_table_b ...\nGROUP BY ...;\n```\n\nто:\n\n```sql\nSELECT *\nFROM heavy_report;\n```\n\nвсё равно должен выполнить тяжёлую логику.\n\nView улучшает:\n\n```text\nчитаемость;\nпереиспользование;\nбезопасность;\nлогическую организацию схемы.\n```\n\nНо не является автоматическим кэшем.\n\nДля ускорения тяжёлых отчётов часто используют:\n\n```text\nиндексы;\nоптимизацию запроса;\nматериализованные представления;\nагрегатные таблицы;\nпартиционирование;\nпредрасчёт данных.\n```\n\nЕсли нужен именно сохранённый результат запроса, тогда смотрят в сторону `MATERIALIZED VIEW`.\n\n---\n\n### Можно ли создать индекс на VIEW\n\nНа обычный view напрямую индекс обычно не создают, потому что он не хранит данные.\n\nНельзя мыслить так:\n\n```text\nсоздам обычный view и индекс на него, чтобы запрос ускорился\n```\n\nДля ускорения нужно индексировать исходные таблицы, которые используются внутри view.\n\nНапример, если view использует:\n\n```sql\nJOIN orders o ON o.user_id = users.id\nWHERE o.status = 'paid'\nORDER BY o.created_at DESC\n```\n\nто могут быть полезны индексы:\n\n```sql\nCREATE INDEX orders_user_id_idx\nON orders (user_id);\n\nCREATE INDEX orders_status_created_idx\nON orders (status, created_at DESC);\n```\n\nА вот materialized view хранит данные физически, поэтому на него можно создавать индексы.\n\n---\n\n### VIEW и изменение структуры таблиц\n\nView зависит от таблиц, на которых построен.\n\nНапример:\n\n```sql\nCREATE VIEW public_users AS\nSELECT\n    id,\n    username,\n    email\nFROM users;\n```\n\nЕсли потом удалить колонку `email` из `users`, view сломается или удаление колонки будет запрещено из-за зависимости, в зависимости от конкретной операции.\n\nНапример:\n\n```sql\nALTER TABLE users DROP COLUMN email;\n```\n\nможет затронуть view, потому что view использует эту колонку.\n\nПоэтому при миграциях нужно учитывать зависимости:\n\n```text\nкакие views используют таблицу;\nкакие колонки используются внутри views;\nнужно ли обновить CREATE VIEW;\nнужно ли сделать CREATE OR REPLACE VIEW.\n```\n\n---\n\n### CREATE OR REPLACE VIEW\n\nЧтобы обновить определение view, часто используют:\n\n```sql\nCREATE OR REPLACE VIEW active_users AS\nSELECT\n    id,\n    username,\n    email,\n    created_at\nFROM users\nWHERE is_active = true;\n```\n\nЭто заменяет определение существующего view.\n\nНо есть ограничения: нельзя произвольно изменить всё, если от view зависят другие объекты. В PostgreSQL `CREATE OR REPLACE VIEW` заменяет view, но новое определение должно быть совместимо по именам, порядку и типам уже существующих колонок; можно добавить новые колонки в конец списка. \n\n---\n\n### DROP VIEW\n\nУдалить view можно так:\n\n```sql\nDROP VIEW active_users;\n```\n\nЕсли от него зависят другие объекты, может понадобиться:\n\n```sql\nDROP VIEW active_users CASCADE;\n```\n\nНо `CASCADE` нужно использовать осторожно: он может удалить зависимые объекты.\n\n---\n\n### Пример VIEW в backend-проекте\n\nДопустим, есть сервис файлового хранилища.\n\nТаблица:\n\n```sql\nCREATE TABLE user_files (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    user_id BIGINT NOT NULL,\n    file_path TEXT NOT NULL,\n    size_bytes BIGINT NOT NULL,\n    is_deleted BOOLEAN NOT NULL DEFAULT false,\n    uploaded_at TIMESTAMP NOT NULL DEFAULT now()\n);\n```\n\nВ приложении почти всегда нужны только неудалённые файлы.\n\nМожно создать view:\n\n```sql\nCREATE VIEW active_user_files AS\nSELECT\n    id,\n    user_id,\n    file_path,\n    size_bytes,\n    uploaded_at\nFROM user_files\nWHERE is_deleted = false;\n```\n\nТеперь запросы приложения:\n\n```sql\nSELECT *\nFROM active_user_files\nWHERE user_id = 123\nORDER BY uploaded_at DESC;\n```\n\nВместо:\n\n```sql\nSELECT\n    id,\n    user_id,\n    file_path,\n    size_bytes,\n    uploaded_at\nFROM user_files\nWHERE user_id = 123\n  AND is_deleted = false\nORDER BY uploaded_at DESC;\n```\n\nПольза:\n\n```text\nменьше повторения условий;\nменьше риск забыть is_deleted = false;\nзапросы в приложении читаются проще;\nможно скрыть служебные поля.\n```\n\n---\n\n### Пример VIEW для отчёта\n\n```sql\nCREATE VIEW monthly_sales_report AS\nSELECT\n    date_trunc('month', created_at) AS month,\n    COUNT(*) AS orders_count,\n    SUM(amount) AS total_amount\nFROM orders\nWHERE status = 'paid'\nGROUP BY date_trunc('month', created_at);\n```\n\nИспользование:\n\n```sql\nSELECT *\nFROM monthly_sales_report\nORDER BY month DESC;\n```\n\nТакой view удобен для отчётности.\n\nНо если таблица `orders` огромная, такой запрос может быть тяжёлым. Тогда обычный view не ускорит его сам по себе. Для ускорения можно рассмотреть materialized view:\n\n```sql\nCREATE MATERIALIZED VIEW monthly_sales_report_mv AS\nSELECT\n    date_trunc('month', created_at) AS month,\n    COUNT(*) AS orders_count,\n    SUM(amount) AS total_amount\nFROM orders\nWHERE status = 'paid'\nGROUP BY date_trunc('month', created_at);\n```\n\nИ потом обновлять:\n\n```sql\nREFRESH MATERIALIZED VIEW monthly_sales_report_mv;\n```\n\n---\n\n### Когда использовать VIEW\n\nView хорошо использовать, когда нужно:\n\n```text\nспрятать сложный SELECT;\nпереиспользовать одинаковую логику чтения;\nограничить набор колонок;\nограничить набор строк;\nдать удобный слой для отчётов;\nсделать стабильный интерфейс к данным;\nскрыть детали нормализованной схемы.\n```\n\nПримеры:\n\n```text\nactive_users;\npublic_users;\npaid_orders_view;\norder_details;\nmonthly_sales_report;\navailable_products;\nnot_deleted_files;\nuser_order_stats.\n```\n\n---\n\n### Когда VIEW не лучший выбор\n\nView не стоит использовать, если:\n\n```text\nнужно физически хранить результат запроса;\nнужно ускорить тяжёлый запрос за счёт кэша;\nданные должны обновляться по расписанию;\nнужно индексировать результат;\nлогика используется только один раз и проще написать обычный SELECT;\nview скрывает слишком сложный запрос и затрудняет отладку.\n```\n\nВ таких случаях варианты:\n\n```text\nобычный SELECT;\nWITH / CTE;\nподзапрос;\nmaterialized view;\nотдельная агрегатная таблица;\nиндексы на исходные таблицы.\n```\n\n---\n\n### Частая ошибка 1: думать, что VIEW — это копия таблицы\n\nНеверно:\n\n```text\nVIEW хранит копию результата\n```\n\nПравильно:\n\n```text\nобычный VIEW хранит запрос, а не данные\n```\n\nКопию результата хранит materialized view или таблица, созданная через `CREATE TABLE AS`.\n\n---\n\n### Частая ошибка 2: ожидать ускорения от обычного VIEW\n\nНеверно:\n\n```text\nзапрос медленный, значит создам VIEW и он станет быстрым\n```\n\nОбычный view сам по себе не обязан ускорять запрос. Он скорее делает SQL удобнее.\n\nДля производительности нужно смотреть:\n\n```sql\nEXPLAIN ANALYZE\n```\n\nи работать с:\n\n```text\nиндексами;\nпланом выполнения;\nструктурой запроса;\nматериализацией;\nразмером таблиц;\nстатистикой.\n```\n\n---\n\n### Частая ошибка 3: делать слишком много вложенных VIEW\n\nНапример:\n\n```text\nview_a использует view_b;\nview_b использует view_c;\nview_c использует view_d;\n```\n\nСнаружи запрос выглядит простым:\n\n```sql\nSELECT *\nFROM view_a;\n```\n\nНо внутри может быть огромный SQL с множеством `JOIN`, фильтров и агрегаций.\n\nЭто усложняет:\n\n```text\nотладку;\nпонимание плана;\nоптимизацию;\nмиграции схемы.\n```\n\nView нужно использовать осознанно, а не превращать в непрозрачный слой, где никто не понимает итоговый запрос.\n\n---\n\n### Частая ошибка 4: использовать VIEW вместо прав на уровне приложения и БД\n\nView может помочь с безопасностью, но его недостаточно само по себе.\n\nЕсли нужно реально ограничивать доступ, надо правильно настроить:\n\n```text\nGRANT / REVOKE;\nвладельца view;\nдоступ к исходным таблицам;\nrow-level security, если используется;\nsecurity definer/invoker нюансы;\nправа роли приложения.\n```\n\nИначе можно случайно оставить прямой доступ к исходной таблице, и view не будет защищать данные.\n\n---\n\n### Итог\n\n`VIEW` в SQL — это сохранённый именованный `SELECT`, к которому можно обращаться как к таблице:\n\n```sql\nCREATE VIEW active_users AS\nSELECT *\nFROM users\nWHERE is_active = true;\n```\n\nИспользование:\n\n```sql\nSELECT *\nFROM active_users;\n```\n\nГлавное:\n\n```text\nобычный VIEW обычно не хранит данные;\nVIEW показывает актуальные данные из исходных таблиц;\nVIEW упрощает сложные запросы;\nVIEW помогает скрывать лишние строки и колонки;\nVIEW можно использовать в SELECT, JOIN, WHERE как источник данных;\nVIEW не является автоматическим способом ускорения запроса;\nдля физического хранения результата используют MATERIALIZED VIEW.\n```\n\nВ backend-разработке view полезен как удобный слой чтения: для отчётов, публичных представлений, soft-delete-фильтров, агрегированных данных и сокрытия сложных `JOIN`."
