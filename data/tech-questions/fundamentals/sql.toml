[[questions]]
  id = 36
  question = "Какие связи между таблицами бывают в реляционных БД? (one to one, one to many, many to many)"
  answer = "### Общая идея\n\nВ реляционных БД связь между таблицами обычно строится через:\n\n```sql\nFOREIGN KEY\n```\n\nТо есть одна таблица хранит ссылку на строку из другой таблицы.\n\nОбычно связь выглядит так:\n\n```sql\nchild_table.parent_id REFERENCES parent_table(id)\n```\n\n`parent_table.id` — это обычно `PRIMARY KEY`, а `child_table.parent_id` — внешний ключ. PostgreSQL описывает foreign key как constraint, который указывает, что значения в одной таблице должны соответствовать значениям в другой таблице. Это и есть механизм ссылочной целостности. \n\nОсновные типы связей:\n\n```text\none-to-one      -> один к одному\none-to-many     -> один ко многим\nmany-to-many    -> многие ко многим\n```\n\n### One-to-one — один к одному\n\nСвязь **one-to-one** означает:\n\n```text\nодна строка в таблице A соответствует максимум одной строке в таблице B;\nодна строка в таблице B соответствует максимум одной строке в таблице A.\n```\n\nПример:\n\n```text\nusers\nuser_profiles\n```\n\nОдин пользователь имеет один профиль. Один профиль принадлежит одному пользователю.\n\nСхема:\n\n```sql\nCREATE TABLE users (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    username TEXT NOT NULL\n);\n\nCREATE TABLE user_profiles (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    user_id BIGINT UNIQUE NOT NULL REFERENCES users(id),\n    first_name TEXT,\n    last_name TEXT,\n    bio TEXT\n);\n```\n\nКлючевой момент:\n\n```sql\nuser_id BIGINT UNIQUE NOT NULL REFERENCES users(id)\n```\n\nЗдесь `REFERENCES users(id)` говорит: профиль связан с пользователем.\n\nА `UNIQUE` говорит: один и тот же `user_id` не может повториться в `user_profiles`.\n\nБез `UNIQUE` это была бы уже не one-to-one, а one-to-many.\n\nПример данных:\n\n```text\nusers\nid | username\n---+---------\n1  | alex\n2  | bob\n```\n\n```text\nuser_profiles\nid | user_id | first_name\n---+---------+-----------\n1  | 1       | Alex\n2  | 2       | Bob\n```\n\nНельзя вставить второй профиль для пользователя `1`:\n\n```sql\nINSERT INTO user_profiles (user_id, first_name)\nVALUES (1, 'Another Alex');\n```\n\nПотому что `user_id` в `user_profiles` уникальный.\n\nPostgreSQL `UNIQUE` constraint гарантирует, что значение в колонке или группе колонок не повторяется среди строк таблицы. \n\n### Когда используют one-to-one\n\nOne-to-one используют, когда часть данных логически относится к основной сущности, но её хотят отделить.\n\nНапример:\n\n```text\nusers -> user_profiles\nusers -> user_settings\nusers -> user_security_settings\nemployees -> employee_passports\nproducts -> product_seo_info\n```\n\nПричины выделения в отдельную таблицу:\n\n```text\nданные необязательные;\nданные редко используются;\nданные имеют отдельные права доступа;\nданные слишком большие;\nнужно разгрузить основную таблицу;\nнужно логически отделить разные части модели.\n```\n\nНапример, `users` может хранить только данные для авторизации:\n\n```text\nid\nusername\nemail\npassword_hash\ncreated_at\n```\n\nА `user_profiles` — публичный профиль:\n\n```text\navatar_url\nbio\nfirst_name\nlast_name\nbirth_date\n```\n\n### Альтернативный вариант one-to-one\n\nИногда в дочерней таблице `user_id` делают одновременно `PRIMARY KEY` и `FOREIGN KEY`:\n\n```sql\nCREATE TABLE user_profiles (\n    user_id BIGINT PRIMARY KEY REFERENCES users(id),\n    first_name TEXT,\n    last_name TEXT,\n    bio TEXT\n);\n```\n\nТогда в `user_profiles` нет отдельного `id`. Первичный ключ профиля — это `user_id`.\n\nЭто тоже one-to-one.\n\nПлюс такого варианта: невозможно создать два профиля на одного пользователя, потому что `user_id` сам является `PRIMARY KEY`.\n\nМинус: иногда в ORM удобнее иметь отдельный `id`.\n\n### One-to-many — один ко многим\n\nСвязь **one-to-many** означает:\n\n```text\nодна строка в таблице A может соответствовать многим строкам в таблице B;\nкаждая строка в таблице B относится к одной строке из таблицы A.\n```\n\nСамый частый тип связи в backend-разработке.\n\nПримеры:\n\n```text\nодин пользователь -> много заказов;\nодин автор -> много постов;\nодна категория -> много товаров;\nодин клиент -> много платежей;\nодна папка -> много файлов;\nодин пользователь -> много уведомлений.\n```\n\nПример:\n\n```sql\nCREATE TABLE users (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    username TEXT NOT NULL\n);\n\nCREATE TABLE orders (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    user_id BIGINT NOT NULL REFERENCES users(id),\n    amount NUMERIC NOT NULL\n);\n```\n\nЗдесь:\n\n```sql\norders.user_id REFERENCES users(id)\n```\n\nОзначает:\n\n```text\nкаждый заказ принадлежит какому-то пользователю.\n```\n\nНо `orders.user_id` не уникальный. Поэтому один пользователь может иметь много заказов.\n\nПример данных:\n\n```text\nusers\nid | username\n---+---------\n1  | alex\n2  | bob\n```\n\n```text\norders\nid | user_id | amount\n---+---------+-------\n10 | 1       | 500\n11 | 1       | 700\n12 | 2       | 300\n```\n\nПользователь `alex` имеет два заказа:\n\n```text\norders.user_id = 1\norders.user_id = 1\n```\n\nЭто нормально для one-to-many.\n\n### Как читать one-to-many\n\nСторона, где стоит `FOREIGN KEY`, обычно является стороной **many**.\n\nВ примере:\n\n```sql\norders.user_id REFERENCES users(id)\n```\n\nЗначит:\n\n```text\nusers  -> one\norders -> many\n```\n\nТо есть:\n\n```text\nодин user может иметь много orders;\nодин order принадлежит одному user.\n```\n\n### Как получить данные через JOIN\n\n```sql\nSELECT\n    users.id AS user_id,\n    users.username,\n    orders.id AS order_id,\n    orders.amount\nFROM users\nJOIN orders ON orders.user_id = users.id;\n```\n\nРезультат:\n\n```text\nuser_id | username | order_id | amount\n--------+----------+----------+-------\n1       | alex     | 10       | 500\n1       | alex     | 11       | 700\n2       | bob      | 12       | 300\n```\n\nЗдесь строка пользователя `alex` повторяется два раза, потому что у него два заказа.\n\nЭто нормальное поведение `JOIN` при one-to-many.\n\n### Many-to-many — многие ко многим\n\nСвязь **many-to-many** означает:\n\n```text\nодна строка в таблице A может быть связана со многими строками в таблице B;\nодна строка в таблице B может быть связана со многими строками в таблице A.\n```\n\nПримеры:\n\n```text\nстуденты -> курсы;\nпользователи -> роли;\nпосты -> теги;\nтовары -> заказы;\nкниги -> авторы;\nфильмы -> актёры.\n```\n\nНапрямую через одну колонку такую связь нормально не сделать.\n\nНужна третья таблица — **связующая таблица**.\n\nЕё ещё называют:\n\n```text\njunction table;\nassociation table;\nlink table;\nthrough table;\nпромежуточная таблица;\nтаблица связей.\n```\n\nПример:\n\n```text\nusers\nroles\nuser_roles\n```\n\nОдин пользователь может иметь много ролей.  \nОдна роль может быть у многих пользователей.\n\nСхема:\n\n```sql\nCREATE TABLE users (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    username TEXT NOT NULL\n);\n\nCREATE TABLE roles (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    name TEXT NOT NULL UNIQUE\n);\n\nCREATE TABLE user_roles (\n    user_id BIGINT NOT NULL REFERENCES users(id),\n    role_id BIGINT NOT NULL REFERENCES roles(id),\n    PRIMARY KEY (user_id, role_id)\n);\n```\n\nТаблица `user_roles` хранит пары:\n\n```text\nuser_id | role_id\n```\n\nПример данных:\n\n```text\nusers\nid | username\n---+---------\n1  | alex\n2  | bob\n```\n\n```text\nroles\nid | name\n---+-------\n1  | admin\n2  | editor\n3  | viewer\n```\n\n```text\nuser_roles\nuser_id | role_id\n--------+--------\n1       | 1\n1       | 2\n2       | 3\n```\n\nСмысл:\n\n```text\nalex имеет роли admin и editor;\nbob имеет роль viewer.\n```\n\n### Почему в many-to-many нужен составной Primary Key\n\nВ таблице `user_roles` обычно делают:\n\n```sql\nPRIMARY KEY (user_id, role_id)\n```\n\nЭто запрещает дубликаты связей.\n\nБез такого ограничения можно было бы случайно вставить:\n\n```text\nuser_id | role_id\n--------+--------\n1       | 2\n1       | 2\n1       | 2\n```\n\nТо есть один и тот же пользователь получил бы одну и ту же роль несколько раз.\n\n`PRIMARY KEY` в PostgreSQL означает, что выбранные колонки должны быть уникальными и не `NULL`; PostgreSQL также автоматически создаёт уникальный B-tree индекс для primary key. \n\n### JOIN для many-to-many\n\nНапример, получить пользователей и их роли:\n\n```sql\nSELECT\n    users.username,\n    roles.name AS role_name\nFROM users\nJOIN user_roles ON user_roles.user_id = users.id\nJOIN roles ON roles.id = user_roles.role_id;\n```\n\nРезультат:\n\n```text\nusername | role_name\n---------+----------\nalex     | admin\nalex     | editor\nbob      | viewer\n```\n\nЗдесь связь проходит через промежуточную таблицу:\n\n```text\nusers -> user_roles -> roles\n```\n\n### Many-to-many с дополнительными полями\n\nИногда связующая таблица хранит не только `user_id` и `role_id`, но и дополнительные данные.\n\nНапример, пользователь записался на курс:\n\n```sql\nCREATE TABLE students (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    name TEXT NOT NULL\n);\n\nCREATE TABLE courses (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    title TEXT NOT NULL\n);\n\nCREATE TABLE student_courses (\n    student_id BIGINT NOT NULL REFERENCES students(id),\n    course_id BIGINT NOT NULL REFERENCES courses(id),\n    enrolled_at TIMESTAMP NOT NULL DEFAULT now(),\n    grade NUMERIC,\n    PRIMARY KEY (student_id, course_id)\n);\n```\n\nЗдесь `student_courses` — не просто техническая таблица. Она хранит сам факт записи студента на курс:\n\n```text\nкогда записался;\nкакую оценку получил;\nстатус обучения;\nкто добавил запись;\nдата завершения.\n```\n\nВ таких случаях связующая таблица становится полноценной бизнес-сущностью.\n\n### Разница между тремя связями\n\n|Тип связи|Как устроена|Где стоит FOREIGN KEY|Нужен UNIQUE|\n|---|---|---|---|\n|One-to-one|1 строка к 1 строке|В одной из таблиц|Да, на FK|\n|One-to-many|1 строка к многим строкам|На стороне many|Нет|\n|Many-to-many|Многие к многим|В промежуточной таблице|Обычно `PRIMARY KEY (fk1, fk2)`|\n\n### Простое правило определения связи\n\nСмотри, может ли значение foreign key повторяться.\n\n### One-to-one\n\n```sql\nuser_profiles.user_id UNIQUE REFERENCES users(id)\n```\n\n`user_id` не может повторяться.\n\nЗначит:\n\n```text\nодин user -> максимум один profile\n```\n\n### One-to-many\n\n```sql\norders.user_id REFERENCES users(id)\n```\n\n`user_id` может повторяться.\n\nЗначит:\n\n```text\nодин user -> много orders\n```\n\n### Many-to-many\n\n```sql\nuser_roles.user_id REFERENCES users(id)\nuser_roles.role_id REFERENCES roles(id)\n```\n\nОбе стороны могут повторяться по отдельности:\n\n```text\nuser_id = 1 может быть много раз;\nrole_id = 2 может быть много раз;\nно пара (user_id, role_id) должна быть уникальной.\n```\n\n### Связь необязательная и обязательная\n\nСвязь может быть обязательной или необязательной.\n\nОбязательная связь:\n\n```sql\nuser_id BIGINT NOT NULL REFERENCES users(id)\n```\n\nЭто значит:\n\n```text\nзаказ не может существовать без пользователя.\n```\n\nНеобязательная связь:\n\n```sql\nuser_id BIGINT REFERENCES users(id)\n```\n\nЗдесь `user_id` может быть `NULL`.\n\nЭто значит:\n\n```text\nстрока может быть не привязана к пользователю.\n```\n\nНапример, комментарий может быть оставлен удалённым пользователем, или файл может временно быть без владельца. Но для большинства бизнес-сущностей связь обычно делают `NOT NULL`.\n\n### Что происходит при удалении связанной строки\n\nForeign key может иметь правило удаления:\n\n```sql\nON DELETE CASCADE\nON DELETE SET NULL\nON DELETE RESTRICT\nON DELETE NO ACTION\n```\n\nПример:\n\n```sql\nCREATE TABLE orders (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    user_id BIGINT NOT NULL REFERENCES users(id) ON DELETE CASCADE,\n    amount NUMERIC NOT NULL\n);\n```\n\n`ON DELETE CASCADE` означает:\n\n```text\nесли удалить пользователя, его заказы тоже удалятся.\n```\n\nДля заказов это часто опасно: исторические заказы обычно не хотят удалять вместе с пользователем.\n\nДля чего-то вроде `user_sessions` или `user_tokens` это нормально:\n\n```text\nудалили пользователя -> удалили его сессии и токены.\n```\n\n`ON DELETE SET NULL`:\n\n```sql\nuser_id BIGINT REFERENCES users(id) ON DELETE SET NULL\n```\n\nОзначает:\n\n```text\nесли пользователь удалён, user_id станет NULL.\n```\n\n`ON DELETE RESTRICT` / `NO ACTION` обычно не дают удалить родительскую строку, пока на неё есть ссылки.\n\nPostgreSQL поддерживает действия foreign key при удалении/обновлении, включая `CASCADE`, `SET NULL`, `RESTRICT`, `NO ACTION` и `SET DEFAULT`. \n\n### Примеры из backend-разработки\n\n### Пользователь и уведомления\n\n```text\nusers -> notifications\n```\n\nТип связи:\n\n```text\none-to-many\n```\n\nОдин пользователь может иметь много уведомлений.\n\n```sql\nCREATE TABLE notifications (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    user_id BIGINT NOT NULL REFERENCES users(id),\n    type TEXT NOT NULL,\n    text TEXT NOT NULL,\n    created_at TIMESTAMP NOT NULL DEFAULT now()\n);\n```\n\n### Пользователь и профиль\n\n```text\nusers -> user_profiles\n```\n\nТип связи:\n\n```text\none-to-one\n```\n\n```sql\nCREATE TABLE user_profiles (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    user_id BIGINT UNIQUE NOT NULL REFERENCES users(id),\n    avatar_url TEXT,\n    bio TEXT\n);\n```\n\n### Пользователь и роли\n\n```text\nusers -> roles\n```\n\nТип связи:\n\n```text\nmany-to-many\n```\n\n```sql\nCREATE TABLE user_roles (\n    user_id BIGINT NOT NULL REFERENCES users(id),\n    role_id BIGINT NOT NULL REFERENCES roles(id),\n    PRIMARY KEY (user_id, role_id)\n);\n```\n\n### Посты и теги\n\n```text\nposts -> tags\n```\n\nТип связи:\n\n```text\nmany-to-many\n```\n\n```sql\nCREATE TABLE posts (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    title TEXT NOT NULL\n);\n\nCREATE TABLE tags (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    name TEXT NOT NULL UNIQUE\n);\n\nCREATE TABLE post_tags (\n    post_id BIGINT NOT NULL REFERENCES posts(id),\n    tag_id BIGINT NOT NULL REFERENCES tags(id),\n    PRIMARY KEY (post_id, tag_id)\n);\n```\n\nОдин пост может иметь много тегов.  \nОдин тег может быть у многих постов.\n\n### Важный практический момент\n\nСвязь между таблицами — это не просто `JOIN` в запросе.\n\nПравильная связь в схеме БД обычно должна быть закреплена constraint-ами:\n\n```text\nPRIMARY KEY;\nFOREIGN KEY;\nUNIQUE;\nNOT NULL;\nON DELETE / ON UPDATE правила.\n```\n\nБез foreign key таблицы можно соединять через `JOIN`, но база сама не будет защищать данные от нарушения ссылочной целостности.\n\nНапример, без `FOREIGN KEY` можно вставить заказ на несуществующего пользователя:\n\n```sql\nINSERT INTO orders (user_id, amount)\nVALUES (999, 1000);\n```\n\nЕсли пользователя `999` нет, это будет «битая ссылка».\n\nС `FOREIGN KEY` база не даст вставить такую строку.\n\n### Итог\n\nВ реляционных БД обычно выделяют три основные связи.\n\n`One-to-one`:\n\n```text\nодна запись связана максимум с одной записью;\nреализуется через FOREIGN KEY + UNIQUE.\n```\n\nПример:\n\n```text\nusers -> user_profiles\n```\n\n`One-to-many`:\n\n```text\nодна запись связана со многими;\nFOREIGN KEY стоит на стороне many.\n```\n\nПример:\n\n```text\nusers -> orders\nusers -> notifications\ncategories -> products\n```\n\n`Many-to-many`:\n\n```text\nмногие записи одной таблицы связаны со многими записями другой;\nреализуется через промежуточную таблицу.\n```\n\nПример:\n\n```text\nusers -> user_roles -> roles\nposts -> post_tags -> tags\nstudents -> student_courses -> courses\n```\n\nСамое важное правило: тип связи определяется не названием таблиц, а ограничениями в схеме — где стоит `FOREIGN KEY`, есть ли `UNIQUE`, и есть ли промежуточная таблица."
