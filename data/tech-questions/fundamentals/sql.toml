  id = 42
  question = "Для чего нужны подзапросы в SQL?"
  answer = "### Что такое подзапрос\r\n\r\n**Подзапрос** — это `SELECT`, вложенный внутрь другого SQL-запроса.\r\n\r\nПример:\r\n\r\n```sql id=\"psg6xi\"\r\nSELECT *\r\nFROM users\r\nWHERE id IN (\r\n    SELECT user_id\r\n    FROM orders\r\n);\r\n```\r\n\r\nЗдесь внутренний запрос:\r\n\r\n```sql id=\"v0g7bi\"\r\nSELECT user_id\r\nFROM orders\r\n```\r\n\r\nвозвращает список пользователей, у которых есть заказы. Внешний запрос использует этот результат, чтобы выбрать пользователей из таблицы `users`.\r\n\r\nPostgreSQL описывает подзапросы как выражения, которые могут использоваться с `EXISTS`, `IN`, `NOT IN`, `ANY/SOME`, `ALL`, а также как скалярные подзапросы. Например, `EXISTS` проверяет, возвращает ли подзапрос хотя бы одну строку. ([PostgreSQL][1])\r\n\r\n---\r\n\r\n### Для чего нужны подзапросы\r\n\r\nПодзапросы нужны, когда результат одного запроса используется внутри другого запроса.\r\n\r\nОбычно они применяются для таких задач:\r\n\r\n```text id=\"jaff57\"\r\nфильтрация строк по результату другого SELECT;\r\nпроверка существования связанных данных;\r\nсравнение значения с агрегатом;\r\nсоздание временного набора данных в FROM;\r\nвычисление значения в SELECT;\r\nобновление или удаление строк по результату выборки;\r\nзамена некоторых JOIN-сценариев;\r\nразбиение сложной логики на части.\r\n```\r\n\r\nГлавная идея:\r\n\r\n```text id=\"v8z2ig\"\r\nсначала получить промежуточный результат,\r\nпотом использовать его в основном запросе.\r\n```\r\n\r\n---\r\n\r\n### Пример 1: найти пользователей, у которых есть заказы\r\n\r\n```sql id=\"iv1ghb\"\r\nSELECT *\r\nFROM users\r\nWHERE id IN (\r\n    SELECT user_id\r\n    FROM orders\r\n);\r\n```\r\n\r\nЛогика:\r\n\r\n```text id=\"tpyiuj\"\r\n1. Внутренний запрос получает user_id из orders.\r\n2. Внешний запрос выбирает users, чей id есть среди этих user_id.\r\n```\r\n\r\nТо есть подзапрос отвечает на вопрос:\r\n\r\n```text id=\"51p4qz\"\r\nкакие пользователи встречаются в таблице заказов?\r\n```\r\n\r\nА внешний запрос уже получает полные данные этих пользователей.\r\n\r\n---\r\n\r\n### Пример 2: найти пользователей без заказов\r\n\r\nДля этого часто используют `NOT EXISTS`:\r\n\r\n```sql id=\"b43ta4\"\r\nSELECT *\r\nFROM users u\r\nWHERE NOT EXISTS (\r\n    SELECT 1\r\n    FROM orders o\r\n    WHERE o.user_id = u.id\r\n);\r\n```\r\n\r\nСмысл:\r\n\r\n```text id=\"m5h3sc\"\r\nвыбрать пользователя,\r\nдля которого не существует ни одного заказа.\r\n```\r\n\r\nВнутренний запрос здесь связан с внешним:\r\n\r\n```sql id=\"jgtmzd\"\r\nWHERE o.user_id = u.id\r\n```\r\n\r\nЭто значит: для каждого пользователя `u` проверяется, есть ли у него строки в `orders`.\r\n\r\n`EXISTS` в PostgreSQL возвращает `true`, если подзапрос возвращает хотя бы одну строку; `NOT EXISTS` — наоборот, если строк нет. ([PostgreSQL][1])\r\n\r\n---\r\n\r\n### Где может находиться подзапрос\r\n\r\nПодзапрос можно использовать в разных частях SQL:\r\n\r\n```text id=\"kq02a3\"\r\nWHERE;\r\nFROM;\r\nSELECT;\r\nHAVING;\r\nINSERT;\r\nUPDATE;\r\nDELETE;\r\n```\r\n\r\nРазберём основные случаи.\r\n\r\n---\r\n\r\n### Подзапрос в WHERE\r\n\r\nЭто самый частый вариант.\r\n\r\nПример:\r\n\r\n```sql id=\"2mmbq6\"\r\nSELECT *\r\nFROM products\r\nWHERE price > (\r\n    SELECT AVG(price)\r\n    FROM products\r\n);\r\n```\r\n\r\nСмысл:\r\n\r\n```text id=\"5vmm33\"\r\nвыбрать товары, цена которых выше средней цены по всем товарам.\r\n```\r\n\r\nВнутренний запрос:\r\n\r\n```sql id=\"n5rfi5\"\r\nSELECT AVG(price)\r\nFROM products\r\n```\r\n\r\nвозвращает одно значение — среднюю цену.\r\n\r\nВнешний запрос сравнивает `price` каждого товара с этим значением.\r\n\r\n---\r\n\r\n### Подзапрос в SELECT\r\n\r\nПодзапрос может вычислять отдельное значение для каждой строки результата.\r\n\r\nПример:\r\n\r\n```sql id=\"vggngv\"\r\nSELECT\r\n    u.id,\r\n    u.username,\r\n    (\r\n        SELECT COUNT(*)\r\n        FROM orders o\r\n        WHERE o.user_id = u.id\r\n    ) AS orders_count\r\nFROM users u;\r\n```\r\n\r\nРезультат:\r\n\r\n```text id=\"8jg44j\"\r\nid | username | orders_count\r\n---+----------+-------------\r\n1  | alex     | 5\r\n2  | bob      | 0\r\n3  | tom      | 2\r\n```\r\n\r\nЛогика:\r\n\r\n```text id=\"51cxa4\"\r\nдля каждого пользователя посчитать количество его заказов.\r\n```\r\n\r\nТакой подзапрос называется **коррелированным**, потому что он использует колонку внешнего запроса:\r\n\r\n```sql id=\"vi24ao\"\r\nu.id\r\n```\r\n\r\n---\r\n\r\n### Подзапрос в FROM\r\n\r\nПодзапрос в `FROM` создаёт временную таблицу результата, с которой дальше можно работать.\r\n\r\nПример:\r\n\r\n```sql id=\"1j4c7z\"\r\nSELECT\r\n    stats.user_id,\r\n    stats.orders_count\r\nFROM (\r\n    SELECT\r\n        user_id,\r\n        COUNT(*) AS orders_count\r\n    FROM orders\r\n    GROUP BY user_id\r\n) AS stats\r\nWHERE stats.orders_count > 5;\r\n```\r\n\r\nЗдесь внутренний запрос:\r\n\r\n```sql id=\"bhy2fl\"\r\nSELECT user_id, COUNT(*) AS orders_count\r\nFROM orders\r\nGROUP BY user_id\r\n```\r\n\r\nсначала создаёт набор:\r\n\r\n```text id=\"qka6nw\"\r\nuser_id | orders_count\r\n--------+-------------\r\n1       | 10\r\n2       | 3\r\n3       | 7\r\n```\r\n\r\nА внешний запрос оставляет только тех, у кого заказов больше 5.\r\n\r\nPostgreSQL описывает `FROM` как часть table expression: там могут использоваться не только обычные таблицы, но и более сложные выражения, включая соединения и подзапросы. ([PostgreSQL][2])\r\n\r\n---\r\n\r\n### Подзапрос в HAVING\r\n\r\n`HAVING` фильтрует уже сгруппированные данные.\r\n\r\nПример:\r\n\r\n```sql id=\"nsqdrk\"\r\nSELECT\r\n    user_id,\r\n    SUM(amount) AS total_amount\r\nFROM orders\r\nGROUP BY user_id\r\nHAVING SUM(amount) > (\r\n    SELECT AVG(amount)\r\n    FROM orders\r\n);\r\n```\r\n\r\nСмысл:\r\n\r\n```text id=\"i8sh4x\"\r\nвыбрать пользователей,\r\nу которых сумма заказов больше средней суммы одного заказа.\r\n```\r\n\r\nНа практике в `HAVING` подзапросы встречаются реже, чем в `WHERE`, но они бывают полезны в аналитических запросах.\r\n\r\n---\r\n\r\n### Скалярный подзапрос\r\n\r\n**Скалярный подзапрос** — это подзапрос, который должен вернуть ровно одно значение: одну строку и одну колонку.\r\n\r\nПример:\r\n\r\n```sql id=\"rw6f26\"\r\nSELECT *\r\nFROM products\r\nWHERE price > (\r\n    SELECT AVG(price)\r\n    FROM products\r\n);\r\n```\r\n\r\nВнутренний запрос возвращает одно значение:\r\n\r\n```text id=\"73r8v0\"\r\nAVG(price)\r\n```\r\n\r\nЭто значение можно использовать как обычное число в сравнении.\r\n\r\nДругой пример:\r\n\r\n```sql id=\"wrxq18\"\r\nSELECT\r\n    id,\r\n    username,\r\n    (\r\n        SELECT MAX(created_at)\r\n        FROM orders\r\n        WHERE orders.user_id = users.id\r\n    ) AS last_order_at\r\nFROM users;\r\n```\r\n\r\nЗдесь подзапрос возвращает дату последнего заказа пользователя.\r\n\r\nВажный момент: если скалярный подзапрос вернёт больше одной строки, база выдаст ошибку.\r\n\r\nПлохой пример:\r\n\r\n```sql id=\"mxcivq\"\r\nSELECT *\r\nFROM users\r\nWHERE id = (\r\n    SELECT user_id\r\n    FROM orders\r\n);\r\n```\r\n\r\nЕсли в `orders` много разных `user_id`, подзапрос вернёт много строк, а оператор `=` ожидает одно значение.\r\n\r\nПравильно использовать `IN`:\r\n\r\n```sql id=\"nuqp5b\"\r\nSELECT *\r\nFROM users\r\nWHERE id IN (\r\n    SELECT user_id\r\n    FROM orders\r\n);\r\n```\r\n\r\n---\r\n\r\n### Подзапрос с IN\r\n\r\n`IN` проверяет, входит ли значение в набор значений, возвращённых подзапросом.\r\n\r\nПример:\r\n\r\n```sql id=\"79xy29\"\r\nSELECT *\r\nFROM users\r\nWHERE id IN (\r\n    SELECT user_id\r\n    FROM orders\r\n    WHERE status = 'paid'\r\n);\r\n```\r\n\r\nСмысл:\r\n\r\n```text id=\"5xqrx4\"\r\nнайти пользователей,\r\nу которых есть оплаченные заказы.\r\n```\r\n\r\nВнутренний запрос может вернуть много `user_id`.\r\n\r\nВнешний запрос проверяет:\r\n\r\n```text id=\"3zxj0d\"\r\nusers.id находится среди этих user_id или нет\r\n```\r\n\r\n---\r\n\r\n### Подзапрос с NOT IN\r\n\r\n`NOT IN` проверяет, что значение не входит в набор.\r\n\r\nПример:\r\n\r\n```sql id=\"3dfvub\"\r\nSELECT *\r\nFROM users\r\nWHERE id NOT IN (\r\n    SELECT user_id\r\n    FROM orders\r\n);\r\n```\r\n\r\nСмысл:\r\n\r\n```text id=\"ssu3hn\"\r\nнайти пользователей, которых нет среди владельцев заказов.\r\n```\r\n\r\nНо с `NOT IN` есть важный нюанс: если подзапрос возвращает `NULL`, результат может стать неожиданным.\r\n\r\nНапример, если `orders.user_id` может быть `NULL`, то:\r\n\r\n```sql id=\"96ygz2\"\r\nWHERE id NOT IN (\r\n    SELECT user_id\r\n    FROM orders\r\n)\r\n```\r\n\r\nможет не вернуть ожидаемые строки из-за SQL-логики `NULL`.\r\n\r\nНа практике для поиска отсутствующих связей часто безопаснее использовать `NOT EXISTS`:\r\n\r\n```sql id=\"2uw1hw\"\r\nSELECT *\r\nFROM users u\r\nWHERE NOT EXISTS (\r\n    SELECT 1\r\n    FROM orders o\r\n    WHERE o.user_id = u.id\r\n);\r\n```\r\n\r\n---\r\n\r\n### Подзапрос с EXISTS\r\n\r\n`EXISTS` проверяет не конкретное значение, а сам факт наличия строк.\r\n\r\nПример:\r\n\r\n```sql id=\"2fruh3\"\r\nSELECT *\r\nFROM users u\r\nWHERE EXISTS (\r\n    SELECT 1\r\n    FROM orders o\r\n    WHERE o.user_id = u.id\r\n);\r\n```\r\n\r\nСмысл:\r\n\r\n```text id=\"0erqo2\"\r\nвыбрать пользователей,\r\nдля которых существует хотя бы один заказ.\r\n```\r\n\r\nЗдесь базе не важно, что именно возвращает внутренний `SELECT`.\r\n\r\nПоэтому часто пишут:\r\n\r\n```sql id=\"nfeg4a\"\r\nSELECT 1\r\n```\r\n\r\nЭто просто общепринятый стиль. Главное — есть строка или нет.\r\n\r\n---\r\n\r\n### IN vs EXISTS\r\n\r\nОба варианта могут решать похожие задачи.\r\n\r\nЧерез `IN`:\r\n\r\n```sql id=\"39qb2i\"\r\nSELECT *\r\nFROM users\r\nWHERE id IN (\r\n    SELECT user_id\r\n    FROM orders\r\n);\r\n```\r\n\r\nЧерез `EXISTS`:\r\n\r\n```sql id=\"6ln5p0\"\r\nSELECT *\r\nFROM users u\r\nWHERE EXISTS (\r\n    SELECT 1\r\n    FROM orders o\r\n    WHERE o.user_id = u.id\r\n);\r\n```\r\n\r\nЛогически оба запроса ищут пользователей, у которых есть заказы.\r\n\r\nРазница:\r\n\r\n```text id=\"5xw864\"\r\nIN сравнивает значение с набором значений;\r\nEXISTS проверяет существование подходящей строки.\r\n```\r\n\r\nВ современных СУБД оптимизатор часто может превратить такие запросы в похожие планы выполнения. Но по смыслу:\r\n\r\n```text id=\"i0ponf\"\r\nIN удобно, когда есть явный набор значений;\r\nEXISTS удобно, когда нужно проверить наличие связанной строки.\r\n```\r\n\r\nДля `NOT`-логики чаще безопаснее `NOT EXISTS`, особенно если в подзапросе возможны `NULL`.\r\n\r\n---\r\n\r\n### Коррелированный подзапрос\r\n\r\n**Коррелированный подзапрос** — это подзапрос, который зависит от строки внешнего запроса.\r\n\r\nПример:\r\n\r\n```sql id=\"6k5m7d\"\r\nSELECT *\r\nFROM users u\r\nWHERE EXISTS (\r\n    SELECT 1\r\n    FROM orders o\r\n    WHERE o.user_id = u.id\r\n);\r\n```\r\n\r\nВнутренний запрос использует:\r\n\r\n```sql id=\"wzpkiu\"\r\nu.id\r\n```\r\n\r\nиз внешнего запроса.\r\n\r\nТо есть для каждого пользователя проверяется:\r\n\r\n```text id=\"p5hky0\"\r\nесть ли заказ, где orders.user_id = id этого пользователя\r\n```\r\n\r\nPostgreSQL указывает, что подзапрос может ссылаться на переменные из окружающего запроса; такие значения действуют как константы во время конкретной оценки подзапроса. ([PostgreSQL][1])\r\n\r\nКоррелированные подзапросы удобны, но с ними нужно быть осторожным на больших таблицах. Если оптимизатор не сможет эффективно переписать запрос, подзапрос может выполняться много раз.\r\n\r\n---\r\n\r\n### Некоррелированный подзапрос\r\n\r\n**Некоррелированный подзапрос** не зависит от внешнего запроса.\r\n\r\nПример:\r\n\r\n```sql id=\"8526f6\"\r\nSELECT *\r\nFROM products\r\nWHERE price > (\r\n    SELECT AVG(price)\r\n    FROM products\r\n);\r\n```\r\n\r\nВнутренний запрос:\r\n\r\n```sql id=\"lajwo3\"\r\nSELECT AVG(price)\r\nFROM products\r\n```\r\n\r\nне использует строки внешнего запроса. Он может быть вычислен отдельно.\r\n\r\nСмысл:\r\n\r\n```text id=\"ahj2kw\"\r\nсначала посчитать среднюю цену;\r\nпотом выбрать товары дороже этой средней цены.\r\n```\r\n\r\n---\r\n\r\n### Подзапросы в UPDATE\r\n\r\nПодзапросы можно использовать не только в `SELECT`, но и в `UPDATE`.\r\n\r\nПример: обновить статус пользователей, у которых нет заказов.\r\n\r\n```sql id=\"9n5j8h\"\r\nUPDATE users u\r\nSET status = 'inactive'\r\nWHERE NOT EXISTS (\r\n    SELECT 1\r\n    FROM orders o\r\n    WHERE o.user_id = u.id\r\n);\r\n```\r\n\r\nСмысл:\r\n\r\n```text id=\"w5cms6\"\r\nесли для пользователя нет ни одного заказа,\r\nпоставить ему status = inactive.\r\n```\r\n\r\nДругой пример: записать пользователю дату последнего заказа.\r\n\r\n```sql id=\"yld56l\"\r\nUPDATE users u\r\nSET last_order_at = (\r\n    SELECT MAX(o.created_at)\r\n    FROM orders o\r\n    WHERE o.user_id = u.id\r\n);\r\n```\r\n\r\nВ PostgreSQL `UPDATE` допускает использование подзапроса, который может ссылаться на старые значения текущей обновляемой строки. ([PostgreSQL][3])\r\n\r\n---\r\n\r\n### Подзапросы в DELETE\r\n\r\nПример: удалить уведомления пользователей, которые заблокированы.\r\n\r\n```sql id=\"9zk78c\"\r\nDELETE FROM notifications\r\nWHERE user_id IN (\r\n    SELECT id\r\n    FROM users\r\n    WHERE status = 'blocked'\r\n);\r\n```\r\n\r\nСмысл:\r\n\r\n```text id=\"u9s01o\"\r\nсначала найти заблокированных пользователей;\r\nпотом удалить их уведомления.\r\n```\r\n\r\nИли через `EXISTS`:\r\n\r\n```sql id=\"1waij0\"\r\nDELETE FROM notifications n\r\nWHERE EXISTS (\r\n    SELECT 1\r\n    FROM users u\r\n    WHERE u.id = n.user_id\r\n      AND u.status = 'blocked'\r\n);\r\n```\r\n\r\n---\r\n\r\n### Подзапросы в INSERT\r\n\r\nПодзапрос может быть источником данных для вставки.\r\n\r\nПример: создать записи в таблице статистики на основе заказов.\r\n\r\n```sql id=\"fz4s2z\"\r\nINSERT INTO user_order_stats (user_id, orders_count, total_amount)\r\nSELECT\r\n    user_id,\r\n    COUNT(*),\r\n    SUM(amount)\r\nFROM orders\r\nGROUP BY user_id;\r\n```\r\n\r\nФормально здесь используется `INSERT ... SELECT`, а не подзапрос в скобках, но идея похожая: результат одного запроса становится входными данными для другой операции.\r\n\r\nМожно использовать и вложенный подзапрос:\r\n\r\n```sql id=\"7chfw8\"\r\nINSERT INTO vip_users (user_id)\r\nSELECT id\r\nFROM users\r\nWHERE id IN (\r\n    SELECT user_id\r\n    FROM orders\r\n    GROUP BY user_id\r\n    HAVING SUM(amount) > 10000\r\n);\r\n```\r\n\r\n---\r\n\r\n### Подзапрос как замена JOIN\r\n\r\nНекоторые задачи можно написать и через подзапрос, и через `JOIN`.\r\n\r\nНапример, пользователи с заказами.\r\n\r\nЧерез подзапрос:\r\n\r\n```sql id=\"am7nyy\"\r\nSELECT *\r\nFROM users\r\nWHERE id IN (\r\n    SELECT user_id\r\n    FROM orders\r\n);\r\n```\r\n\r\nЧерез `JOIN`:\r\n\r\n```sql id=\"et2ap4\"\r\nSELECT DISTINCT u.*\r\nFROM users u\r\nJOIN orders o ON o.user_id = u.id;\r\n```\r\n\r\nОба варианта могут дать похожий результат.\r\n\r\nНо есть нюанс: `JOIN` может размножить строки.\r\n\r\nЕсли у пользователя 5 заказов, то обычный `JOIN` вернёт 5 строк с этим пользователем. Поэтому пришлось добавить:\r\n\r\n```sql id=\"gk2w0r\"\r\nDISTINCT\r\n```\r\n\r\nА вариант с `EXISTS` сразу проверяет факт наличия заказа:\r\n\r\n```sql id=\"ljcvv4\"\r\nSELECT *\r\nFROM users u\r\nWHERE EXISTS (\r\n    SELECT 1\r\n    FROM orders o\r\n    WHERE o.user_id = u.id\r\n);\r\n```\r\n\r\nДля задачи «есть ли связанная запись» `EXISTS` часто читается очень естественно.\r\n\r\n---\r\n\r\n### Подзапрос vs JOIN\r\n\r\nВыбор зависит от задачи.\r\n\r\n`JOIN` лучше, когда нужно получить данные из обеих таблиц:\r\n\r\n```sql id=\"5k6auu\"\r\nSELECT\r\n    u.username,\r\n    o.id AS order_id,\r\n    o.amount\r\nFROM users u\r\nJOIN orders o ON o.user_id = u.id;\r\n```\r\n\r\nСмысл:\r\n\r\n```text id=\"bi6bqk\"\r\nполучить пользователя и конкретные заказы.\r\n```\r\n\r\nПодзапрос лучше читается, когда нужно проверить условие:\r\n\r\n```sql id=\"l6lga8\"\r\nSELECT *\r\nFROM users u\r\nWHERE EXISTS (\r\n    SELECT 1\r\n    FROM orders o\r\n    WHERE o.user_id = u.id\r\n);\r\n```\r\n\r\nСмысл:\r\n\r\n```text id=\"i3dbpo\"\r\nполучить пользователей, у которых есть хотя бы один заказ.\r\n```\r\n\r\nПримерное правило:\r\n\r\n```text id=\"tko5iq\"\r\nнужны колонки из связанной таблицы -> JOIN;\r\nнужно проверить наличие/отсутствие связанных строк -> EXISTS / NOT EXISTS;\r\nнужно сравнить с агрегатом -> скалярный подзапрос;\r\nнужно создать промежуточный набор -> подзапрос в FROM или WITH.\r\n```\r\n\r\n---\r\n\r\n### Подзапрос vs WITH\r\n\r\nПодзапрос:\r\n\r\n```sql id=\"dls8lr\"\r\nSELECT *\r\nFROM (\r\n    SELECT user_id, COUNT(*) AS orders_count\r\n    FROM orders\r\n    GROUP BY user_id\r\n) AS stats\r\nWHERE stats.orders_count > 5;\r\n```\r\n\r\nТо же самое через `WITH`:\r\n\r\n```sql id=\"i0pjza\"\r\nWITH stats AS (\r\n    SELECT user_id, COUNT(*) AS orders_count\r\n    FROM orders\r\n    GROUP BY user_id\r\n)\r\nSELECT *\r\nFROM stats\r\nWHERE stats.orders_count > 5;\r\n```\r\n\r\nПо смыслу они близки.\r\n\r\n`WITH` обычно удобнее, когда:\r\n\r\n```text id=\"f0n3mc\"\r\nлогика большая;\r\nнесколько промежуточных шагов;\r\nодин результат нужно использовать несколько раз;\r\nнужно повысить читаемость.\r\n```\r\n\r\nПодзапрос удобнее, когда логика короткая и локальная.\r\n\r\n---\r\n\r\n### Подзапросы с ANY / SOME / ALL\r\n\r\nЕсть ещё операторы `ANY`, `SOME`, `ALL`.\r\n\r\nПример с `ANY`:\r\n\r\n```sql id=\"3ojdfa\"\r\nSELECT *\r\nFROM products\r\nWHERE price > ANY (\r\n    SELECT price\r\n    FROM products\r\n    WHERE category_id = 10\r\n);\r\n```\r\n\r\nСмысл:\r\n\r\n```text id=\"k9ypzy\"\r\nвыбрать товары,\r\nцена которых больше хотя бы одной цены из категории 10.\r\n```\r\n\r\nПример с `ALL`:\r\n\r\n```sql id=\"k9rh2e\"\r\nSELECT *\r\nFROM products\r\nWHERE price > ALL (\r\n    SELECT price\r\n    FROM products\r\n    WHERE category_id = 10\r\n);\r\n```\r\n\r\nСмысл:\r\n\r\n```text id=\"ndh024\"\r\nвыбрать товары,\r\nцена которых больше всех цен из категории 10.\r\n```\r\n\r\nPostgreSQL поддерживает подзапросные выражения `ANY/SOME` и `ALL`; они сравнивают левое значение с результатами подзапроса по заданному оператору. ([PostgreSQL][1])\r\n\r\nНа практике в backend-разработке `ANY` и `ALL` встречаются реже, чем `IN`, `EXISTS`, `NOT EXISTS` и скалярные подзапросы.\r\n\r\n---\r\n\r\n### Типичные задачи с подзапросами\r\n\r\n### 1. Найти записи выше среднего\r\n\r\n```sql id=\"5j4nlg\"\r\nSELECT *\r\nFROM products\r\nWHERE price > (\r\n    SELECT AVG(price)\r\n    FROM products\r\n);\r\n```\r\n\r\nИспользуется агрегатный подзапрос.\r\n\r\n---\r\n\r\n### 2. Найти пользователей с заказами\r\n\r\n```sql id=\"s6slx6\"\r\nSELECT *\r\nFROM users u\r\nWHERE EXISTS (\r\n    SELECT 1\r\n    FROM orders o\r\n    WHERE o.user_id = u.id\r\n);\r\n```\r\n\r\nИспользуется проверка существования.\r\n\r\n---\r\n\r\n### 3. Найти пользователей без заказов\r\n\r\n```sql id=\"9f3x1g\"\r\nSELECT *\r\nFROM users u\r\nWHERE NOT EXISTS (\r\n    SELECT 1\r\n    FROM orders o\r\n    WHERE o.user_id = u.id\r\n);\r\n```\r\n\r\nИспользуется проверка отсутствия.\r\n\r\n---\r\n\r\n### 4. Найти товары из категорий, которые активны\r\n\r\n```sql id=\"8x90br\"\r\nSELECT *\r\nFROM products\r\nWHERE category_id IN (\r\n    SELECT id\r\n    FROM categories\r\n    WHERE is_active = true\r\n);\r\n```\r\n\r\nИспользуется фильтрация по набору значений.\r\n\r\n---\r\n\r\n### 5. Посчитать количество заказов в SELECT\r\n\r\n```sql id=\"8925sl\"\r\nSELECT\r\n    u.id,\r\n    u.username,\r\n    (\r\n        SELECT COUNT(*)\r\n        FROM orders o\r\n        WHERE o.user_id = u.id\r\n    ) AS orders_count\r\nFROM users u;\r\n```\r\n\r\nИспользуется коррелированный скалярный подзапрос.\r\n\r\n---\r\n\r\n### 6. Удалить строки по условию из другой таблицы\r\n\r\n```sql id=\"gg122k\"\r\nDELETE FROM notifications\r\nWHERE user_id IN (\r\n    SELECT id\r\n    FROM users\r\n    WHERE status = 'deleted'\r\n);\r\n```\r\n\r\nИспользуется подзапрос в `DELETE`.\r\n\r\n---\r\n\r\n### Производительность подзапросов\r\n\r\nПодзапрос сам по себе не плохой и не хороший.\r\n\r\nПроизводительность зависит от:\r\n\r\n```text id=\"4mdq6c\"\r\nтипа подзапроса;\r\nналичия индексов;\r\nразмера таблиц;\r\nплана выполнения;\r\nвозможности оптимизатора переписать запрос;\r\nкоррелированности подзапроса;\r\nоператоров IN / EXISTS / JOIN;\r\nселективности условий.\r\n```\r\n\r\nПроверять нужно через:\r\n\r\n```sql id=\"bn0g15\"\r\nEXPLAIN ANALYZE\r\n```\r\n\r\n---\r\n\r\n### Индексы для подзапросов\r\n\r\nНапример, есть запрос:\r\n\r\n```sql id=\"9wpkz6\"\r\nSELECT *\r\nFROM users u\r\nWHERE EXISTS (\r\n    SELECT 1\r\n    FROM orders o\r\n    WHERE o.user_id = u.id\r\n);\r\n```\r\n\r\nДля него полезен индекс:\r\n\r\n```sql id=\"jcg6hd\"\r\nCREATE INDEX orders_user_id_idx\r\nON orders (user_id);\r\n```\r\n\r\nПочему: внутренний подзапрос ищет заказы по `user_id`.\r\n\r\nЕсли индекса нет, база может делать тяжёлый поиск по `orders`.\r\n\r\nДругой пример:\r\n\r\n```sql id=\"fm8my3\"\r\nSELECT *\r\nFROM orders\r\nWHERE user_id IN (\r\n    SELECT id\r\n    FROM users\r\n    WHERE status = 'active'\r\n);\r\n```\r\n\r\nПолезны индексы:\r\n\r\n```sql id=\"4oswll\"\r\nCREATE INDEX users_status_idx ON users (status);\r\nCREATE INDEX orders_user_id_idx ON orders (user_id);\r\n```\r\n\r\n---\r\n\r\n### Частая ошибка: `NOT IN` и NULL\r\n\r\nОчень важная ошибка.\r\n\r\nДопустим:\r\n\r\n```sql id=\"1rdwy6\"\r\nSELECT *\r\nFROM users\r\nWHERE id NOT IN (\r\n    SELECT user_id\r\n    FROM orders\r\n);\r\n```\r\n\r\nЕсли `orders.user_id` содержит `NULL`, результат может стать не тем, который ожидается.\r\n\r\nПричина: в SQL сравнение с `NULL` даёт не `true` и не `false`, а `unknown`.\r\n\r\nБезопаснее:\r\n\r\n```sql id=\"xhflmh\"\r\nSELECT *\r\nFROM users u\r\nWHERE NOT EXISTS (\r\n    SELECT 1\r\n    FROM orders o\r\n    WHERE o.user_id = u.id\r\n);\r\n```\r\n\r\nИли явно убрать `NULL`:\r\n\r\n```sql id=\"igcsoi\"\r\nSELECT *\r\nFROM users\r\nWHERE id NOT IN (\r\n    SELECT user_id\r\n    FROM orders\r\n    WHERE user_id IS NOT NULL\r\n);\r\n```\r\n\r\nНо для анти-связей обычно лучше `NOT EXISTS`.\r\n\r\n---\r\n\r\n### Частая ошибка: скалярный подзапрос возвращает много строк\r\n\r\nПлохо:\r\n\r\n```sql id=\"4suv9p\"\r\nSELECT *\r\nFROM users\r\nWHERE id = (\r\n    SELECT user_id\r\n    FROM orders\r\n);\r\n```\r\n\r\nЕсли `orders` содержит много строк, будет ошибка.\r\n\r\nНужно либо `IN`:\r\n\r\n```sql id=\"dkft0r\"\r\nSELECT *\r\nFROM users\r\nWHERE id IN (\r\n    SELECT user_id\r\n    FROM orders\r\n);\r\n```\r\n\r\nлибо агрегат, если нужно одно значение:\r\n\r\n```sql id=\"hi3l7p\"\r\nSELECT *\r\nFROM users\r\nWHERE id = (\r\n    SELECT MAX(user_id)\r\n    FROM orders\r\n);\r\n```\r\n\r\n---\r\n\r\n### Частая ошибка: лишний подзапрос без смысла\r\n\r\nПлохо:\r\n\r\n```sql id=\"826q4u\"\r\nSELECT *\r\nFROM (\r\n    SELECT *\r\n    FROM users\r\n) AS u\r\nWHERE u.is_active = true;\r\n```\r\n\r\nПроще:\r\n\r\n```sql id=\"r8p037\"\r\nSELECT *\r\nFROM users\r\nWHERE is_active = true;\r\n```\r\n\r\nПодзапрос не нужен, если он не упрощает логику и не решает отдельную задачу.\r\n\r\n---\r\n\r\n### Частая ошибка: коррелированный подзапрос вместо JOIN/агрегации на больших данных\r\n\r\nНапример:\r\n\r\n```sql id=\"hz7e3m\"\r\nSELECT\r\n    u.id,\r\n    u.username,\r\n    (\r\n        SELECT COUNT(*)\r\n        FROM orders o\r\n        WHERE o.user_id = u.id\r\n    ) AS orders_count\r\nFROM users u;\r\n```\r\n\r\nНа небольших данных это нормально.\r\n\r\nНо на больших таблицах иногда выгоднее заранее агрегировать заказы и сделать `LEFT JOIN`:\r\n\r\n```sql id=\"uqy53i\"\r\nSELECT\r\n    u.id,\r\n    u.username,\r\n    COALESCE(o.orders_count, 0) AS orders_count\r\nFROM users u\r\nLEFT JOIN (\r\n    SELECT\r\n        user_id,\r\n        COUNT(*) AS orders_count\r\n    FROM orders\r\n    GROUP BY user_id\r\n) o ON o.user_id = u.id;\r\n```\r\n\r\nЭто не универсальное правило. В PostgreSQL оптимизатор может строить разные планы, но при проблемах с производительностью такие варианты нужно сравнивать через `EXPLAIN ANALYZE`.\r\n\r\n---\r\n\r\n### Практический пример из backend\r\n\r\nДопустим, есть таблицы:\r\n\r\n```sql id=\"4ka4hf\"\r\nusers\r\norders\r\npayments\r\n```\r\n\r\nНужно получить активных пользователей, у которых:\r\n\r\n```text id=\"zdmbwc\"\r\nесть хотя бы один оплаченный заказ;\r\nнет просроченных платежей;\r\nобщая сумма заказов выше средней.\r\n```\r\n\r\nЗапрос:\r\n\r\n```sql id=\"uho2bb\"\r\nSELECT *\r\nFROM users u\r\nWHERE u.is_active = true\r\n\r\n  AND EXISTS (\r\n      SELECT 1\r\n      FROM orders o\r\n      WHERE o.user_id = u.id\r\n        AND o.status = 'paid'\r\n  )\r\n\r\n  AND NOT EXISTS (\r\n      SELECT 1\r\n      FROM payments p\r\n      WHERE p.user_id = u.id\r\n        AND p.status = 'overdue'\r\n  )\r\n\r\n  AND (\r\n      SELECT COALESCE(SUM(o.amount), 0)\r\n      FROM orders o\r\n      WHERE o.user_id = u.id\r\n        AND o.status = 'paid'\r\n  ) > (\r\n      SELECT AVG(amount)\r\n      FROM orders\r\n      WHERE status = 'paid'\r\n  );\r\n```\r\n\r\nЗдесь подзапросы используются для трёх разных задач:\r\n\r\n```text id=\"fjc1y1\"\r\nEXISTS      -> проверить наличие оплаченных заказов;\r\nNOT EXISTS  -> проверить отсутствие просроченных платежей;\r\nSUM / AVG   -> сравнить сумму пользователя со средним значением.\r\n```\r\n\r\n---\r\n\r\n### Когда лучше использовать подзапрос\r\n\r\nПодзапрос хорошо подходит, когда вопрос формулируется так:\r\n\r\n```text id=\"mcjoui\"\r\nнайди строки, для которых существует связанная запись;\r\nнайди строки, для которых связанной записи нет;\r\nсравни значение со средним/максимальным/минимальным;\r\nотфильтруй по набору значений из другой таблицы;\r\nсначала посчитай агрегат, потом используй его;\r\nполучи вычисляемое значение для каждой строки;\r\nиспользуй результат одного SELECT внутри другого.\r\n```\r\n\r\n---\r\n\r\n### Когда лучше использовать JOIN\r\n\r\n`JOIN` обычно лучше, когда нужно получить данные из нескольких таблиц в одном результате.\r\n\r\nНапример:\r\n\r\n```sql id=\"6wq3co\"\r\nSELECT\r\n    u.username,\r\n    o.id AS order_id,\r\n    o.amount\r\nFROM users u\r\nJOIN orders o ON o.user_id = u.id;\r\n```\r\n\r\nЗдесь нужен не просто факт наличия заказа, а сами данные заказа.\r\n\r\n---\r\n\r\n### Итог\r\n\r\nПодзапросы в SQL нужны для того, чтобы использовать результат одного запроса внутри другого.\r\n\r\nОни применяются для:\r\n\r\n```text id=\"z7sbxb\"\r\nфильтрации через IN / NOT IN;\r\nпроверки существования через EXISTS / NOT EXISTS;\r\nсравнения с агрегатами;\r\nвычисления значений в SELECT;\r\nсоздания временного набора данных в FROM;\r\nобновления и удаления строк по результату другой выборки;\r\nразбиения сложной логики на части.\r\n```\r\n\r\nГлавные виды:\r\n\r\n```text id=\"5b4x6z\"\r\nскалярный подзапрос     -> возвращает одно значение;\r\nтабличный подзапрос     -> возвращает набор строк/колонок;\r\nкоррелированный         -> зависит от внешнего запроса;\r\nнекоррелированный       -> не зависит от внешнего запроса.\r\n```\r\n\r\nГлавное практическое правило:\r\n\r\n```text id=\"hxhr92\"\r\nесли нужно проверить наличие связанных данных — часто удобен EXISTS;\r\nесли нужно проверить отсутствие — чаще безопаснее NOT EXISTS;\r\nесли нужны данные из обеих таблиц — обычно JOIN;\r\nесли нужно сравнить со средним/максимумом/минимумом — скалярный подзапрос;\r\nесли логика стала многошаговой — можно использовать подзапрос в FROM или WITH.\r\n```\r\n\r\nПодзапросы — это нормальный и важный инструмент SQL, но на больших таблицах их нужно проверять через `EXPLAIN ANALYZE` и поддерживать правильными индексами.\r\n\r\n[1]: https://www.postgresql.org/docs/current/functions-subquery.html?utm_source=chatgpt.com \"Documentation: 18: 9.24. Subquery Expressions\"\r\n[2]: https://www.postgresql.org/docs/current/queries-table-expressions.html?utm_source=chatgpt.com \"PostgreSQL: Documentation: 18: 7.2. Table Expressions\"\r\n[3]: https://www.postgresql.org/docs/current/sql-update.html?utm_source=chatgpt.com \"PostgreSQL: Documentation: 18: UPDATE\"\r"
