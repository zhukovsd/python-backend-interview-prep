  question = "Для чего используются LIMIT и OFFSET в SQL?"
  answer = "### Что делают LIMIT и OFFSET\n\n`LIMIT` и `OFFSET` используются, чтобы вернуть **не все строки результата**, а только нужную часть.\n\n```sql\nSELECT *\nFROM users\nORDER BY id\nLIMIT 10 OFFSET 20;\n```\n\nСмысл:\n\n```text\nOFFSET 20 -> пропустить первые 20 строк\nLIMIT 10  -> вернуть следующие 10 строк\n```\n\nТо есть запрос вернёт строки с 21-й по 30-ю, если считать после сортировки.\n\nPostgreSQL описывает `LIMIT` и `OFFSET` как конструкции, которые позволяют получить только часть строк из результата запроса. При этом документация отдельно подчёркивает: чтобы получать предсказуемую часть строк, нужно использовать `ORDER BY`. \n\n---\n\n### LIMIT\n\n`LIMIT` ограничивает количество строк, которые вернёт запрос.\n\nПример:\n\n```sql\nSELECT *\nFROM users\nLIMIT 5;\n```\n\nЭтот запрос вернёт максимум 5 строк.\n\nЕсли в таблице 1000 пользователей, вернутся только 5.  \nЕсли в таблице 3 пользователя, вернутся 3.\n\nТо есть `LIMIT` — это не «номер страницы», а именно ограничение сверху:\n\n```text\nверни не больше N строк\n```\n\n---\n\n### OFFSET\n\n`OFFSET` пропускает указанное количество строк перед началом возврата результата.\n\nПример:\n\n```sql\nSELECT *\nFROM users\nOFFSET 10;\n```\n\nСмысл:\n\n```text\nпропусти первые 10 строк,\nверни остальные.\n```\n\nНо на практике `OFFSET` почти всегда используют вместе с `LIMIT`:\n\n```sql\nSELECT *\nFROM users\nORDER BY id\nLIMIT 10 OFFSET 10;\n```\n\nСмысл:\n\n```text\nпропусти первые 10 строк,\nверни следующие 10.\n```\n\n---\n\n### Использование для пагинации\n\nСамый частый кейс — **пагинация**.\n\nНапример, в API нужно отдавать пользователей страницами по 10 записей.\n\nПервая страница:\n\n```sql\nSELECT *\nFROM users\nORDER BY id\nLIMIT 10 OFFSET 0;\n```\n\nВторая страница:\n\n```sql\nSELECT *\nFROM users\nORDER BY id\nLIMIT 10 OFFSET 10;\n```\n\nТретья страница:\n\n```sql\nSELECT *\nFROM users\nORDER BY id\nLIMIT 10 OFFSET 20;\n```\n\nФормула:\n\n```text\nOFFSET = (page - 1) * page_size\nLIMIT  = page_size\n```\n\nЕсли:\n\n```text\npage = 3\npage_size = 10\n```\n\nто:\n\n```text\nOFFSET = (3 - 1) * 10 = 20\nLIMIT = 10\n```\n\nЗапрос:\n\n```sql\nSELECT *\nFROM users\nORDER BY id\nLIMIT 10 OFFSET 20;\n```\n\n---\n\n### Почему нужен ORDER BY\n\nОчень важный момент: `LIMIT` и `OFFSET` почти всегда должны использоваться вместе с `ORDER BY`.\n\nПлохо:\n\n```sql\nSELECT *\nFROM users\nLIMIT 10 OFFSET 20;\n```\n\nПочему плохо: без `ORDER BY` база не обязана возвращать строки в стабильном порядке.\n\nСегодня она может вернуть одни 10 строк, завтра другие. Это зависит от плана запроса, индексов, физического расположения данных, статистики и других факторов.\n\nPostgreSQL прямо указывает: если не указать `ORDER BY`, строки возвращаются в неопределённом порядке; гарантировать конкретный порядок можно только через явную сортировку. \n\nПравильно:\n\n```sql\nSELECT *\nFROM users\nORDER BY id\nLIMIT 10 OFFSET 20;\n```\n\nТеперь порядок понятен:\n\n```text\nсначала сортируем по id,\nпотом пропускаем 20 строк,\nпотом берём 10 строк.\n```\n\n---\n\n### Как это работает логически\n\nЗапрос:\n\n```sql\nSELECT *\nFROM users\nWHERE is_active = true\nORDER BY created_at DESC\nLIMIT 10 OFFSET 20;\n```\n\nЛогически можно представить так:\n\n```text\n1. Найти всех активных пользователей.\n2. Отсортировать их по created_at DESC.\n3. Пропустить первые 20 строк.\n4. Вернуть следующие 10 строк.\n```\n\nТо есть `LIMIT` и `OFFSET` применяются уже к результату после фильтрации и сортировки.\n\n---\n\n### Пример с таблицей\n\nДопустим, есть пользователи:\n\n```text\nid | username\n---+---------\n1  | alex\n2  | bob\n3  | tom\n4  | kate\n5  | john\n6  | mike\n7  | anna\n8  | sam\n9  | nick\n10 | max\n11 | leo\n12 | rick\n```\n\nЗапрос:\n\n```sql\nSELECT id, username\nFROM users\nORDER BY id\nLIMIT 5 OFFSET 0;\n```\n\nРезультат:\n\n```text\nid | username\n---+---------\n1  | alex\n2  | bob\n3  | tom\n4  | kate\n5  | john\n```\n\nСледующая страница:\n\n```sql\nSELECT id, username\nFROM users\nORDER BY id\nLIMIT 5 OFFSET 5;\n```\n\nРезультат:\n\n```text\nid | username\n---+---------\n6  | mike\n7  | anna\n8  | sam\n9  | nick\n10 | max\n```\n\nТретья страница:\n\n```sql\nSELECT id, username\nFROM users\nORDER BY id\nLIMIT 5 OFFSET 10;\n```\n\nРезультат:\n\n```text\nid | username\n---+---------\n11 | leo\n12 | rick\n```\n\n---\n\n### LIMIT без OFFSET\n\nМожно использовать только `LIMIT`.\n\nНапример, получить последние 10 заказов:\n\n```sql\nSELECT *\nFROM orders\nORDER BY created_at DESC\nLIMIT 10;\n```\n\nЭто нормальный и частый сценарий.\n\nПримеры:\n\n```sql\n-- последние 20 уведомлений пользователя\nSELECT *\nFROM notifications\nWHERE user_id = 123\nORDER BY created_at DESC\nLIMIT 20;\n```\n\n```sql\n-- топ-5 самых дорогих товаров\nSELECT *\nFROM products\nORDER BY price DESC\nLIMIT 5;\n```\n\n```sql\n-- 100 последних логов\nSELECT *\nFROM logs\nORDER BY created_at DESC\nLIMIT 100;\n```\n\n---\n\n### OFFSET без LIMIT\n\nТехнически можно использовать `OFFSET` без `LIMIT`:\n\n```sql\nSELECT *\nFROM users\nORDER BY id\nOFFSET 100;\n```\n\nСмысл:\n\n```text\nпропусти первые 100 строк,\nверни все остальные.\n```\n\nНо на практике так делают редко, потому что обычно нужно вернуть конкретный размер страницы.\n\n---\n\n### Пагинация в backend API\n\nНапример endpoint:\n\n```text\nGET /users?page=3&page_size=20\n```\n\nBackend может превратить это в SQL:\n\n```sql\nSELECT *\nFROM users\nORDER BY id\nLIMIT 20 OFFSET 40;\n```\n\nПотому что:\n\n```text\nOFFSET = (3 - 1) * 20 = 40\n```\n\nИли endpoint может принимать сразу `limit` и `offset`:\n\n```text\nGET /users?limit=20&offset=40\n```\n\nТогда SQL почти напрямую:\n\n```sql\nSELECT *\nFROM users\nORDER BY id\nLIMIT 20 OFFSET 40;\n```\n\nТакой подход часто используют в REST API.\n\n---\n\n### Важная проблема OFFSET: большие смещения\n\n`OFFSET` удобен, но у него есть проблема производительности.\n\nЗапрос:\n\n```sql\nSELECT *\nFROM users\nORDER BY id\nLIMIT 10 OFFSET 1000000;\n```\n\nНе означает, что база «магически прыгнет» сразу к строке номер 1 000 001.\n\nЧасто БД должна пройти много строк, отсортировать или просканировать индекс, пропустить первый миллион строк и только потом вернуть 10.\n\nТо есть большой `OFFSET` может быть дорогим.\n\nPostgreSQL документация прямо указывает: строки, пропущенные `OFFSET`, всё равно должны быть вычислены внутри сервера, поэтому большой `OFFSET` может быть неэффективным. \n\n---\n\n### Проблема стабильности при изменении данных\n\nДопустим, пользователь смотрит список заказов.\n\nПервая страница:\n\n```sql\nSELECT *\nFROM orders\nORDER BY created_at DESC\nLIMIT 10 OFFSET 0;\n```\n\nПотом между запросами кто-то создал новый заказ.\n\nВторая страница:\n\n```sql\nSELECT *\nFROM orders\nORDER BY created_at DESC\nLIMIT 10 OFFSET 10;\n```\n\nИз-за новой строки часть данных может сместиться.\n\nВозможные проблемы:\n\n```text\nодна запись может повториться на двух страницах;\nодна запись может быть пропущена;\nстраницы становятся нестабильными при активных вставках/удалениях.\n```\n\nЭто особенно заметно в лентах, уведомлениях, чатах, логах, заказах.\n\n---\n\n### Почему ORDER BY должен быть детерминированным\n\nДаже если `ORDER BY` есть, он должен задавать стабильный порядок.\n\nНапример:\n\n```sql\nSELECT *\nFROM orders\nORDER BY created_at DESC\nLIMIT 10 OFFSET 20;\n```\n\nЕсли у многих заказов одинаковый `created_at`, порядок между ними может быть нестабильным.\n\nЛучше добавить уникальный tie-breaker:\n\n```sql\nSELECT *\nFROM orders\nORDER BY created_at DESC, id DESC\nLIMIT 10 OFFSET 20;\n```\n\nТеперь порядок стабильнее:\n\n```text\nсначала сортировка по created_at,\nесли created_at одинаковый — по id.\n```\n\nДля пагинации это важно.\n\n---\n\n### Альтернатива: keyset pagination\n\nДля больших таблиц и бесконечных лент часто лучше не `OFFSET`, а **keyset pagination**.\n\nЕё ещё называют:\n\n```text\ncursor pagination;\nseek pagination;\nпагинация по курсору;\nпагинация по последнему значению.\n```\n\nИдея: вместо «пропусти 100000 строк» мы говорим:\n\n```text\nдай следующие строки после последней виденной записи\n```\n\nПример первой страницы:\n\n```sql\nSELECT *\nFROM orders\nORDER BY created_at DESC, id DESC\nLIMIT 20;\n```\n\nДопустим, последняя строка на странице имеет:\n\n```text\ncreated_at = '2026-06-30 12:00:00'\nid = 5000\n```\n\nСледующая страница:\n\n```sql\nSELECT *\nFROM orders\nWHERE (created_at, id) < ('2026-06-30 12:00:00', 5000)\nORDER BY created_at DESC, id DESC\nLIMIT 20;\n```\n\nПлюсы:\n\n```text\nлучше работает на больших таблицах;\nне нужно пропускать огромное количество строк;\nменьше риск дублей и пропусков при новых вставках;\nхорошо подходит для лент, логов, уведомлений, сообщений.\n```\n\nМинусы:\n\n```text\nсложнее перейти сразу на страницу 100;\nнужен cursor/последнее значение;\nнужна стабильная сортировка.\n```\n\nДля обычной админки с небольшими таблицами `LIMIT/OFFSET` нормален. Для больших пользовательских лент чаще лучше keyset pagination.\n\n---\n\n### Индексы для LIMIT/OFFSET\n\nЕсли запрос часто такой:\n\n```sql\nSELECT *\nFROM orders\nWHERE user_id = 123\nORDER BY created_at DESC\nLIMIT 20 OFFSET 40;\n```\n\nполезен индекс:\n\n```sql\nCREATE INDEX orders_user_created_idx\nON orders (user_id, created_at DESC);\n```\n\nЕщё лучше с `id` как tie-breaker:\n\n```sql\nCREATE INDEX orders_user_created_id_idx\nON orders (user_id, created_at DESC, id DESC);\n```\n\nТогда PostgreSQL может быстрее найти заказы конкретного пользователя в нужном порядке.\n\nБез подходящего индекса база может делать:\n\n```text\nфильтрацию;\nсортировку;\nсканирование большого количества строк;\nотбрасывание OFFSET;\nвозврат LIMIT.\n```\n\n---\n\n### LIMIT и OFFSET после JOIN\n\n`LIMIT` ограничивает итоговый результат запроса, а не количество строк в каждой таблице.\n\nПример:\n\n```sql\nSELECT\n    users.id,\n    users.username,\n    orders.id AS order_id\nFROM users\nJOIN orders ON orders.user_id = users.id\nORDER BY users.id\nLIMIT 10;\n```\n\nЕсли у одного пользователя много заказов, он может занять несколько строк результата.\n\nНапример:\n\n```text\nalex | order 1\nalex | order 2\nalex | order 3\n```\n\nПоэтому `LIMIT 10` здесь означает:\n\n```text\nвернуть 10 строк результата JOIN\n```\n\nА не:\n\n```text\nвернуть 10 пользователей\n```\n\nЭто частая ошибка.\n\nЕсли нужно получить 10 пользователей, а потом их заказы, обычно используют подзапрос:\n\n```sql\nSELECT\n    u.id,\n    u.username,\n    o.id AS order_id\nFROM (\n    SELECT *\n    FROM users\n    ORDER BY id\n    LIMIT 10 OFFSET 0\n) AS u\nLEFT JOIN orders o ON o.user_id = u.id\nORDER BY u.id;\n```\n\nСначала выбираются 10 пользователей, потом к ним присоединяются заказы.\n\n---\n\n### LIMIT и агрегаты\n\nЕсли есть агрегатный запрос:\n\n```sql\nSELECT user_id, COUNT(*) AS orders_count\nFROM orders\nGROUP BY user_id\nORDER BY orders_count DESC\nLIMIT 10;\n```\n\nСмысл:\n\n```text\nсначала сгруппировать заказы по пользователям;\nпосчитать количество заказов;\nотсортировать по количеству;\nвернуть топ-10 пользователей.\n```\n\nЗдесь `LIMIT` применяется уже после `GROUP BY` и `ORDER BY`.\n\n---\n\n### LIMIT и DELETE/UPDATE\n\nВ PostgreSQL у `SELECT` есть `LIMIT`, но у `DELETE` и `UPDATE` напрямую `LIMIT` в таком же виде нет.\n\nНапример, в PostgreSQL нельзя стандартно написать:\n\n```sql\nDELETE FROM logs\nLIMIT 1000;\n```\n\nОбычно используют подзапрос:\n\n```sql\nDELETE FROM logs\nWHERE id IN (\n    SELECT id\n    FROM logs\n    WHERE created_at < now() - interval '30 days'\n    ORDER BY id\n    LIMIT 1000\n);\n```\n\nТак удаляют данные батчами, чтобы не держать слишком большую транзакцию.\n\nВ MySQL синтаксис может отличаться: там `DELETE ... LIMIT` поддерживается. Поэтому детали зависят от СУБД.\n\n---\n\n### LIMIT ALL и OFFSET 0\n\nВ PostgreSQL можно встретить:\n\n```sql\nLIMIT ALL\n```\n\nЭто означает:\n\n```text\nне ограничивать количество строк\n```\n\nА:\n\n```sql\nOFFSET 0\n```\n\nозначает:\n\n```text\nничего не пропускать\n```\n\nНа практике это редко пишут вручную, но такие конструкции иногда генерируют ORM или query builders.\n\n---\n\n### Частые ошибки\n\n### 1. LIMIT/OFFSET без ORDER BY\n\nПлохо:\n\n```sql\nSELECT *\nFROM users\nLIMIT 10 OFFSET 20;\n```\n\nПроблема:\n\n```text\nнет гарантированного порядка;\nстраницы могут быть нестабильными;\nодни и те же строки могут появляться неожиданно.\n```\n\nЛучше:\n\n```sql\nSELECT *\nFROM users\nORDER BY id\nLIMIT 10 OFFSET 20;\n```\n\n---\n\n### 2. Сортировка по неуникальному полю\n\nПлохо:\n\n```sql\nSELECT *\nFROM orders\nORDER BY created_at DESC\nLIMIT 20 OFFSET 40;\n```\n\nЕсли много строк с одинаковым `created_at`, лучше:\n\n```sql\nSELECT *\nFROM orders\nORDER BY created_at DESC, id DESC\nLIMIT 20 OFFSET 40;\n```\n\n---\n\n### 3. Большой OFFSET на больших таблицах\n\nПлохо:\n\n```sql\nSELECT *\nFROM events\nORDER BY id\nLIMIT 50 OFFSET 5000000;\n```\n\nПроблема:\n\n```text\nбаза всё равно должна пройти огромный объём строк;\nзапрос может быть медленным;\nнагрузка растёт с номером страницы.\n```\n\nЛучше для ленты:\n\n```sql\nSELECT *\nFROM events\nWHERE id > 5000000\nORDER BY id\nLIMIT 50;\n```\n\nИли для обратной сортировки:\n\n```sql\nSELECT *\nFROM events\nWHERE id < 5000000\nORDER BY id DESC\nLIMIT 50;\n```\n\n---\n\n### 4. Неправильно считать OFFSET\n\nЕсли страница начинается с 1:\n\n```text\nOFFSET = (page - 1) * limit\n```\n\nЕсли страница начинается с 0:\n\n```text\nOFFSET = page * limit\n```\n\nЧастая ошибка — сдвиг на одну страницу.\n\n---\n\n### 5. Путать LIMIT с количеством сущностей после JOIN\n\nЕсли запрос возвращает строки `JOIN`, `LIMIT` ограничивает именно строки результата, а не количество основных сущностей.\n\n---\n\n### Где это используется в реальных проектах\n\n`LIMIT` и `OFFSET` используют для:\n\n```text\nпагинации списков в API;\nадминских таблиц;\nвывода последних записей;\nтоп-N запросов;\nбатчевой обработки данных;\nпостраничной загрузки логов;\nограничения тяжёлых выборок;\nтестовых запросов при анализе данных.\n```\n\nПримеры:\n\n```sql\n-- последние 20 уведомлений пользователя\nSELECT *\nFROM notifications\nWHERE user_id = 123\nORDER BY created_at DESC, id DESC\nLIMIT 20;\n```\n\n```sql\n-- страница товаров\nSELECT *\nFROM products\nWHERE is_active = true\nORDER BY id\nLIMIT 50 OFFSET 100;\n```\n\n```sql\n-- топ-10 пользователей по числу заказов\nSELECT user_id, COUNT(*) AS total_orders\nFROM orders\nGROUP BY user_id\nORDER BY total_orders DESC\nLIMIT 10;\n```\n\n```sql\n-- обработать старые записи батчем\nSELECT *\nFROM events\nWHERE processed = false\nORDER BY id\nLIMIT 1000;\n```\n\n---\n\n### Итог\n\n`LIMIT` и `OFFSET` нужны для получения части результата запроса.\n\n```sql\nSELECT *\nFROM table_name\nORDER BY id\nLIMIT 10 OFFSET 20;\n```\n\nОзначает:\n\n```text\nотсортировать строки по id;\nпропустить первые 20;\nвернуть следующие 10.\n```\n\nГлавные правила:\n\n```text\nLIMIT ограничивает количество возвращаемых строк.\nOFFSET пропускает указанное количество строк.\nДля стабильного результата нужен ORDER BY.\nДля больших OFFSET запросы могут становиться медленными.\nДля больших таблиц и лент часто лучше keyset/cursor pagination.\nПосле JOIN LIMIT ограничивает строки итогового результата, а не количество сущностей.\n```\n\nВ обычной backend-разработке `LIMIT/OFFSET` — простой и удобный способ пагинации, но для больших таблиц и активно меняющихся данных его нужно использовать осторожно."
