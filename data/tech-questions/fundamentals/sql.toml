[[questions]]
  id = 37
  question = "Что такое репликация и шардирование в базах данных?"
  answer = "### Общая идея\n\n**Репликация** и **шардирование** — это два разных способа масштабировать и повышать надёжность базы данных.\n\nОни решают разные задачи:\n\n```text\nрепликация  -> копирует одни и те же данные на несколько серверов;\nшардирование -> делит данные на части и раскладывает их по разным серверам.\n```\n\nТо есть:\n\n```text\nРепликация = копии.\nШардирование = разделение.\n```\n\n### Репликация\n\n**Репликация** — это механизм, при котором данные с одного сервера БД передаются на другой сервер или несколько серверов.\n\nОбычно есть:\n\n```text\nprimary / master  -> основной сервер, принимает записи;\nreplica / standby -> копия, получает изменения с primary.\n```\n\nВ PostgreSQL серверы, которые отслеживают изменения primary, называются standby или secondary servers. Standby может использоваться для высокой доступности, восстановления после сбоя и распределения read-only нагрузки. \n\nПростая схема:\n\n```text\n             ┌──────────────┐\nWRITE ------>│   Primary    │\n             └──────┬───────┘\n                    │ WAL / changes\n        ┌───────────┴───────────┐\n        ↓                       ↓\n ┌──────────────┐        ┌──────────────┐\n │  Replica 1   │        │  Replica 2   │\n └──────────────┘        └──────────────┘\n     READ                    READ\n```\n\n### Что даёт репликация\n\nРепликация нужна для нескольких целей.\n\n### 1. Отказоустойчивость\n\nЕсли primary-сервер упал, одну из реплик можно повысить до нового primary.\n\nНапример:\n\n```text\nPrimary сломался\n↓\nReplica становится новым Primary\n↓\nПриложение продолжает работать\n```\n\nЭто не всегда происходит само по себе. Часто нужен отдельный механизм failover: Patroni, repmgr, pg_auto_failover, Kubernetes-operator, облачный managed PostgreSQL и т.д.\n\nНо сама база предоставляет фундамент: standby-серверы и передачу WAL.\n\n### 2. Масштабирование чтения\n\nМожно отправлять тяжёлые `SELECT`-запросы на реплики, а записи оставлять на primary.\n\nНапример:\n\n```text\nINSERT / UPDATE / DELETE -> primary\nSELECT для API          -> primary или replica\nSELECT для аналитики    -> replica\nотчёты                 -> replica\n```\n\nВ PostgreSQL Hot Standby позволяет подключаться к standby-серверу и выполнять read-only запросы во время recovery/standby-режима. \n\n### 3. Резервная копия почти в реальном времени\n\nРеплика может быть почти актуальной копией primary.\n\nНо важно: **репликация не заменяет backup**.\n\nЕсли на primary случайно удалить таблицу:\n\n```sql\nDROP TABLE users;\n```\n\nэто удаление тоже уйдёт на реплики.\n\nПоэтому нужны отдельно:\n\n```text\nbackup;\npoint-in-time recovery;\nархив WAL;\nзащита от человеческих ошибок.\n```\n\n### Как работает репликация в PostgreSQL\n\nВ PostgreSQL основа физической репликации — **WAL**, Write-Ahead Log.\n\nВсе изменения сначала попадают в WAL, затем реплика получает эти WAL-записи и воспроизводит их у себя.\n\nУпрощённо:\n\n```text\n1. Клиент делает INSERT/UPDATE/DELETE на primary.\n2. PostgreSQL записывает изменение в WAL.\n3. Primary подтверждает COMMIT.\n4. WAL передаётся на standby.\n5. Standby применяет WAL у себя.\n6. Реплика догоняет primary.\n```\n\nPostgreSQL поддерживает standby через file-based log shipping, streaming replication или их комбинацию. \n\n### Асинхронная репликация\n\nВ асинхронном режиме primary не ждёт, пока реплика применит изменения.\n\n```text\nКлиент сделал COMMIT.\nPrimary подтвердил успех.\nReplica получит изменение чуть позже.\n```\n\nПлюсы:\n\n```text\nбыстрее запись;\nменьше задержка для клиента;\nпроще выдерживать высокую нагрузку.\n```\n\nМинусы:\n\n```text\nреплика может отставать;\nпосле COMMIT на primary данные могут ещё не быть видны на replica;\nпри аварии primary можно потерять последние транзакции, которые не успели попасть на replica.\n```\n\nЭто важный практический момент. Если приложение после записи сразу читает с реплики, оно может не увидеть только что созданную запись.\n\nНапример:\n\n```text\nPOST /orders -> запись на primary успешна\nGET /orders/123 -> чтение ушло на replica\nreplica ещё не догнала primary\nприложение получило 404\n```\n\nЭто называется **replication lag**.\n\n### Синхронная репликация\n\nВ синхронном режиме primary ждёт подтверждения от standby.\n\nУпрощённо:\n\n```text\nКлиент делает COMMIT.\nPrimary отправляет WAL на standby.\nStandby подтверждает получение/запись/применение.\nPrimary подтверждает COMMIT клиенту.\n```\n\nВ PostgreSQL синхронная репликация настраивается через `synchronous_standby_names` и `synchronous_commit`. Документация указывает, что синхронная репликация позволяет ждать подтверждения от standby, но увеличивает время commit как минимум на сетевую задержку до standby. \n\nПлюсы:\n\n```text\nменьше риск потери подтверждённых транзакций;\nлучше консистентность между primary и standby;\nподходит для критичных данных.\n```\n\nМинусы:\n\n```text\nзапись медленнее;\nпри проблемах с репликой primary может начать тормозить;\nнужна аккуратная настройка.\n```\n\n### Physical replication и logical replication\n\nВ PostgreSQL есть два важных подхода.\n\n### Physical replication\n\nФизическая репликация копирует изменения на уровне WAL/страниц хранения.\n\nОсобенности:\n\n```text\nреплицируется весь кластер или база на физическом уровне;\nstandby обычно является точной копией primary;\nхорошо подходит для failover и read-only реплик;\nреплика обычно не принимает записи от приложения.\n```\n\nЭто типичный вариант для standby-сервера.\n\n### Logical replication\n\nLogical replication работает на уровне таблиц и изменений строк.\n\nВ PostgreSQL logical replication использует модель publication/subscription: publisher публикует изменения, subscriber подписывается на них. \n\nПример:\n\n```text\nPublisher:\n  таблица users\n  таблица orders\n\nSubscriber:\n  получает изменения этих таблиц\n```\n\nPublication — это набор изменений из одной или нескольких таблиц. \n\nLogical replication используют, когда нужно:\n\n```text\nреплицировать не всё, а только часть таблиц;\nпереносить данные между разными версиями PostgreSQL;\nстроить интеграции;\nпередавать изменения в аналитическую БД;\nделать миграции с минимальным downtime.\n```\n\nНо logical replication сложнее: нужно думать о primary key / replica identity, конфликтах, DDL-изменениях, последовательностях, ограничениях.\n\n### Шардирование\n\n**Шардирование** — это разделение данных на части, где каждая часть хранится на отдельном сервере или узле.\n\nЭти части называются:\n\n```text\nshard;\nшард;\nпартиция на уровне кластера;\nкусок данных.\n```\n\nПростая схема:\n\n```text\n              ┌──────────────┐\n              │  Application │\n              └──────┬───────┘\n                     ↓\n              ┌──────────────┐\n              │ Router/Logic │\n              └──────┬───────┘\n        ┌────────────┼────────────┐\n        ↓            ↓            ↓\n ┌──────────┐  ┌──────────┐  ┌──────────┐\n │ Shard 1  │  │ Shard 2  │  │ Shard 3  │\n │ users 1k │  │ users 2k │  │ users 3k │\n └──────────┘  └──────────┘  └──────────┘\n```\n\nНапример, таблица `users` слишком большая. Её можно разделить:\n\n```text\nShard 1: users с id 1–10_000_000\nShard 2: users с id 10_000_001–20_000_000\nShard 3: users с id 20_000_001–30_000_000\n```\n\nИли по хэшу:\n\n```text\nhash(user_id) % 3 = 0 -> shard 1\nhash(user_id) % 3 = 1 -> shard 2\nhash(user_id) % 3 = 2 -> shard 3\n```\n\n### Что даёт шардирование\n\nШардирование нужно, когда один сервер уже не справляется по:\n\n```text\nобъёму данных;\nколичеству записей;\nCPU;\nRAM;\nI/O;\nразмеру индексов;\nколичеству подключений;\nпропускной способности диска/сети.\n```\n\nРепликация помогает масштабировать чтение, но не решает полностью проблему записи.\n\nЕсли все записи идут на один primary, то он остаётся бутылочным горлышком:\n\n```text\n100 реплик помогают читать;\nно INSERT/UPDATE/DELETE всё равно идут в один primary.\n```\n\nШардирование позволяет распределить записи:\n\n```text\nuser_id 1 пишет в shard 1;\nuser_id 2 пишет в shard 2;\nuser_id 3 пишет в shard 3.\n```\n\nТо есть нагрузка на запись распределяется между несколькими серверами.\n\n### Пример шардирования по user_id\n\nДопустим, есть таблица:\n\n```sql\nCREATE TABLE notifications (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    user_id BIGINT NOT NULL,\n    text TEXT NOT NULL,\n    created_at TIMESTAMP NOT NULL DEFAULT now()\n);\n```\n\nЕсли уведомлений очень много, можно шардировать по `user_id`.\n\nЛогика:\n\n```text\nnotifications пользователя 10 -> shard A\nnotifications пользователя 11 -> shard B\nnotifications пользователя 12 -> shard C\n```\n\nПриложение или роутер вычисляет, куда идти:\n\n```text\nshard = hash(user_id) % shard_count\n```\n\nПлюс такого подхода:\n\n```text\nвсе уведомления конкретного пользователя лежат на одном шарде;\nзапрос \"покажи уведомления пользователя\" идёт только в один shard;\nзаписи распределены между несколькими серверами.\n```\n\nМинус:\n\n```text\nзапрос \"покажи последние 100 уведомлений всех пользователей\" должен идти во все шарды.\n```\n\n### Виды шардирования\n\n### 1. Range-based sharding\n\nДанные делятся по диапазонам.\n\nНапример:\n\n```text\nusers.id 1 - 1_000_000       -> shard 1\nusers.id 1_000_001 - 2_000_000 -> shard 2\nusers.id 2_000_001 - 3_000_000 -> shard 3\n```\n\nПлюсы:\n\n```text\nпросто понять;\nудобно для диапазонных запросов;\nлегче архивировать старые диапазоны.\n```\n\nМинусы:\n\n```text\nможет быть перекос нагрузки;\nновые записи часто попадают в последний shard;\nодин shard может стать горячим.\n```\n\nНапример, если шардировать заказы по дате, то почти все новые заказы будут идти в самый свежий shard.\n\n### 2. Hash-based sharding\n\nДанные распределяются через хэш.\n\n```text\nshard = hash(user_id) % N\n```\n\nПлюсы:\n\n```text\nнагрузка обычно распределяется равномернее;\nменьше риск горячего последнего shard.\n```\n\nМинусы:\n\n```text\nсложнее делать range-запросы;\nсложнее менять количество шардов;\nнужно аккуратно выбирать shard key.\n```\n\n### 3. List-based / tenant-based sharding\n\nДанные делятся по конкретным значениям.\n\nНапример:\n\n```text\ntenant_id = 1, 2, 3     -> shard A\ntenant_id = 4, 5, 6     -> shard B\ntenant_id = 7, 8, 9     -> shard C\n```\n\nЧасто используется в multi-tenant системах:\n\n```text\nодин клиент/организация/tenant хранится на конкретном shard.\n```\n\nПлюс:\n\n```text\nданные одного tenant локализованы;\nпроще изолировать крупных клиентов;\nудобно переносить tenant между shard.\n```\n\nМинус:\n\n```text\nодин крупный tenant может перегрузить свой shard;\nнужен механизм ребалансировки.\n```\n\n### Shard key\n\nСамое важное решение при шардировании — выбор **shard key**.\n\nShard key — это колонка, по которой база или приложение решает, на каком шарде хранить строку.\n\nПримеры:\n\n```text\nuser_id;\ntenant_id;\naccount_id;\norganization_id;\nregion_id;\ncreated_at;\norder_id.\n```\n\nХороший shard key должен:\n\n```text\nравномерно распределять данные;\nсовпадать с частыми запросами;\nминимизировать cross-shard операции;\nбыть стабильным;\nне меняться часто.\n```\n\nНапример, если почти все запросы такие:\n\n```sql\nSELECT *\nFROM notifications\nWHERE user_id = 123\nORDER BY created_at DESC;\n```\n\nто `user_id` — хороший кандидат для shard key.\n\nЕсли же часто нужны глобальные запросы:\n\n```sql\nSELECT *\nFROM notifications\nORDER BY created_at DESC\nLIMIT 100;\n```\n\nто шардирование по `user_id` усложнит жизнь: придётся ходить во все шарды, собирать результаты и сортировать глобально.\n\nВ Citus, расширении для распределённого PostgreSQL, distributed tables раскладываются по шардам на worker-узлах, а distribution column используется для назначения строк таблицы шардам. \n\n### Разница между partitioning и sharding\n\nВажно не путать.\n\n**Partitioning** — это разделение таблицы на части внутри одной логической БД, часто на одном сервере.\n\nНапример в PostgreSQL:\n\n```text\norders_2025\norders_2026\norders_2027\n```\n\nНо все они могут находиться в одном PostgreSQL-инстансе.\n\n**Sharding** — это распределение данных между разными серверами/узлами.\n\n```text\nShard 1 -> server A\nShard 2 -> server B\nShard 3 -> server C\n```\n\nPostgreSQL поддерживает declarative partitioning внутри БД, но это само по себе не равно полноценному автоматическому шардированию между серверами. Для распределения данных по нескольким PostgreSQL-узлам обычно используют дополнительные решения: Citus, application-level sharding, FDW-подходы, cloud distributed databases и т.д.\n\n`postgres_fdw` позволяет обращаться к данным на внешних PostgreSQL-серверах как к foreign tables. Это может использоваться как строительный блок для распределённых схем, но само по себе не превращает обычный PostgreSQL в полностью автоматическую шардированную СУБД. \n\n### Репликация vs шардирование\n\n|Критерий|Репликация|Шардирование|\n|---|---|---|\n|Что делает|Копирует данные|Делит данные|\n|Где лежит одна и та же строка|На primary и репликах|Обычно только на одном shard|\n|Главная цель|Надёжность, read scaling, failover|Горизонтальное масштабирование объёма и записи|\n|Запись|Обычно на primary|На разные shard|\n|Чтение|Можно читать с реплик|Нужно знать, в каком shard данные|\n|Сложность|Средняя|Высокая|\n|Типичная проблема|replication lag|cross-shard queries/transactions|\n|Пример|primary + standby|users разбиты по `user_id`|\n\n### Простое сравнение\n\nРепликация:\n\n```text\nServer A: users 1..100\nServer B: users 1..100\nServer C: users 1..100\n```\n\nШардирование:\n\n```text\nServer A: users 1..33\nServer B: users 34..66\nServer C: users 67..100\n```\n\nРепликация повышает доступность и помогает читать быстрее.\n\nШардирование позволяет хранить и обрабатывать больше данных, чем помещается на один сервер.\n\n### Можно ли использовать вместе\n\nДа. В больших системах репликацию и шардирование часто используют вместе.\n\nНапример:\n\n```text\nShard 1:\n  primary_1\n  replica_1a\n  replica_1b\n\nShard 2:\n  primary_2\n  replica_2a\n  replica_2b\n\nShard 3:\n  primary_3\n  replica_3a\n  replica_3b\n```\n\nТо есть каждый shard может иметь свои реплики.\n\nСхема:\n\n```text\n                Application\n                    │\n              Shard Router\n        ┌───────────┼───────────┐\n        ↓           ↓           ↓\n     Shard 1     Shard 2     Shard 3\n     Primary     Primary     Primary\n       │           │           │\n       ↓           ↓           ↓\n    Replica     Replica     Replica\n```\n\nТак достигают сразу двух целей:\n\n```text\nшардирование распределяет объём данных и запись;\nрепликация повышает отказоустойчивость каждого shard и помогает читать.\n```\n\n### Пример на практике\n\nДопустим, есть сервис уведомлений.\n\nПока проект маленький:\n\n```text\nодин PostgreSQL;\nтаблица users;\nтаблица notifications;\nобычные индексы.\n```\n\nПотом нагрузка выросла.\n\nПервый шаг обычно не шардирование, а оптимизация:\n\n```text\nиндексы;\nEXPLAIN ANALYZE;\nоптимизация запросов;\nпартиционирование по дате;\nархивирование старых данных;\nувеличение ресурсов сервера;\nconnection pooling;\nкэширование;\nread replica для тяжёлых SELECT.\n```\n\nПотом можно добавить реплику:\n\n```text\nprimary принимает записи;\nreplica обслуживает отчёты и read-only запросы.\n```\n\nЕсли и этого мало, и один primary не справляется с объёмом записей, тогда думают о шардировании:\n\n```text\nnotifications шардируются по user_id;\nкаждый shard хранит уведомления своей группы пользователей;\nзапросы по конкретному пользователю идут в один shard.\n```\n\n### Основные проблемы репликации\n\n### Replication lag\n\nРеплика может отставать.\n\nПример:\n\n```text\nна primary пользователь создал заказ;\nна replica заказ появится через 100 мс, 1 секунду или больше;\nесли читать сразу с replica, можно получить старые данные.\n```\n\nРешения:\n\n```text\nпосле записи читать с primary;\nиспользовать sticky reads;\nотслеживать lag;\nдля критичных операций использовать synchronous replication;\nне отправлять read-after-write запросы на отстающие реплики.\n```\n\n### Failover не всегда мгновенный\n\nПри падении primary нужно:\n\n```text\nвыбрать новую primary;\nубедиться, что она самая свежая;\nперенастроить клиентов;\nизбежать split-brain;\nподнять новую реплику.\n```\n\nSplit-brain — ситуация, когда два узла считают себя primary и принимают записи. Это опасно, потому что данные расходятся.\n\n### Репликация не защищает от логических ошибок\n\nЕсли приложение массово испортило данные:\n\n```sql\nUPDATE users SET balance = 0;\n```\n\nэта ошибка тоже уйдёт на реплики.\n\nПоэтому нужны backup и возможность восстановления на момент времени.\n\n### Основные проблемы шардирования\n\n### Cross-shard queries\n\nЕсли запрос затрагивает один shard — всё хорошо.\n\n```sql\nSELECT *\nFROM notifications\nWHERE user_id = 123;\n```\n\nЕсли `user_id` — shard key, запрос идёт в один shard.\n\nНо если запрос глобальный:\n\n```sql\nSELECT *\nFROM notifications\nWHERE created_at > now() - interval '1 day'\nORDER BY created_at DESC\nLIMIT 100;\n```\n\nон может требовать обхода всех shard.\n\nЭто сложнее:\n\n```text\nвыполнить запрос на каждом shard;\nсобрать результаты;\nотсортировать;\nприменить LIMIT;\nвернуть клиенту.\n```\n\n### Cross-shard transactions\n\nТранзакция внутри одного PostgreSQL-сервера относительно проста:\n\n```sql\nBEGIN;\nUPDATE accounts SET balance = balance - 100 WHERE id = 1;\nUPDATE accounts SET balance = balance + 100 WHERE id = 2;\nCOMMIT;\n```\n\nНо если `account_id = 1` находится на shard A, а `account_id = 2` на shard B, нужна распределённая транзакция.\n\nЭто уже сложнее:\n\n```text\nкоординация между shard;\nдвухфазный commit;\nриск частичных сбоев;\nбольше задержка;\nсложнее восстановление.\n```\n\nПоэтому при шардировании стараются проектировать модель так, чтобы большинство операций происходило внутри одного shard.\n\n### Сложность JOIN\n\nОбычный JOIN между таблицами на одном сервере прост:\n\n```sql\nSELECT *\nFROM orders\nJOIN users ON users.id = orders.user_id;\n```\n\nВ шардированной системе может оказаться, что `orders` и `users` лежат на разных shard. Тогда JOIN становится распределённым.\n\nПоэтому часто стараются:\n\n```text\nшардировать связанные таблицы по одному ключу;\nдержать данные одного пользователя/tenant на одном shard;\nреплицировать маленькие справочники на все shard;\nденормализовать часть данных.\n```\n\nCitus, например, использует distributed tables и reference tables: distributed tables шардируются по worker-узлам, а reference tables реплицируются на все узлы для join и foreign key-сценариев. \n\n### Ребалансировка\n\nЕсли shard стал слишком большим, данные нужно переносить.\n\nНапример:\n\n```text\nShard 1: 900 GB\nShard 2: 300 GB\nShard 3: 280 GB\n```\n\nНужно перенести часть данных с shard 1 на другие shard. Это называется rebalance.\n\nПроблемы:\n\n```text\nперенос больших объёмов данных;\nсохранение консистентности;\nминимальный downtime;\nобновление маршрутизации;\nконтроль нагрузки во время миграции.\n```\n\n### Когда нужна репликация\n\nРепликация нужна почти всегда в production, если важна доступность данных.\n\nТипичные причины:\n\n```text\nнужен failover;\nнужно читать с копии;\nнужны отчёты без нагрузки на primary;\nнужно повысить отказоустойчивость;\nнужна географическая копия данных.\n```\n\nДля обычного backend-проекта репликация появляется значительно раньше, чем шардирование.\n\n### Когда нужно шардирование\n\nШардирование нужно не сразу.\n\nОно оправдано, когда:\n\n```text\nодин сервер уже не выдерживает объём данных;\nвертикальное масштабирование стало слишком дорогим;\nиндексы стали слишком большими;\nзапись упёрлась в один primary;\nпартиционирование и оптимизация уже не помогают;\nданные естественно делятся по tenant/user/region.\n```\n\nШардирование — дорогая архитектурная мера. Его не стоит делать заранее «на всякий случай», потому что оно сильно усложняет разработку.\n\n### Частая ошибка\n\nСчитать, что репликация и шардирование — одно и то же.\n\nЭто разные вещи.\n\nРепликация отвечает на вопрос:\n\n```text\nКак сделать копии данных?\n```\n\nШардирование отвечает на вопрос:\n\n```text\nКак разделить данные между несколькими узлами?\n```\n\n### Ещё одна частая ошибка\n\nСчитать, что read replica решает проблему любой нагрузки.\n\nРеплика помогает, если проблема в чтении:\n\n```text\nмного SELECT;\nтяжёлые отчёты;\nаналитические запросы;\nнагрузка на чтение выше нагрузки на запись.\n```\n\nНо если проблема в записи:\n\n```text\nочень много INSERT;\nочень много UPDATE;\nогромный поток событий;\nодин primary не успевает писать WAL;\nиндексы слишком тяжёлые;\n```\n\nто реплики не разгрузят primary по записи. Здесь могут понадобиться:\n\n```text\nоптимизация схемы;\nbatch insert;\nочереди;\nпартиционирование;\nархивирование;\nшардирование;\nвынос части нагрузки в другую систему.\n```\n\n### Итог\n\n**Репликация** — это когда одна и та же база или часть данных копируется на другие серверы.\n\nОна нужна для:\n\n```text\nотказоустойчивости;\nfailover;\nмасштабирования чтения;\nрезервной копии почти в реальном времени;\nгеографического распределения.\n```\n\n**Шардирование** — это когда данные делятся на части и каждая часть хранится на своём сервере.\n\nОно нужно для:\n\n```text\nгоризонтального масштабирования;\nраспределения объёма данных;\nраспределения нагрузки на запись;\nуменьшения размера отдельных таблиц и индексов;\nработы с очень большими объёмами данных.\n```\n\nГлавное различие:\n\n```text\nРепликация: каждый сервер хранит копию одних и тех же данных.\nШардирование: каждый сервер хранит свою часть данных.\n```\n\nВ реальных больших системах их часто комбинируют: данные делят на shard, а каждый shard дополнительно реплицируют для отказоустойчивости."
