  question = "Какие бывают способы репликации в базах данных?"
  answer = "### Общая классификация\n\nСпособы репликации можно классифицировать по нескольким признакам:\n\n```text\n1. По уровню данных:\n   physical replication;\n   logical replication.\n\n2. По моменту подтверждения записи:\n   asynchronous replication;\n   synchronous replication;\n   semi-synchronous replication.\n\n3. По направлению записи:\n   single-primary / primary-replica;\n   multi-primary / multi-master;\n   peer-to-peer.\n\n4. По способу передачи изменений:\n   WAL/binlog/log-based replication;\n   statement-based replication;\n   row-based replication;\n   snapshot replication;\n   trigger-based replication.\n\n5. По топологии:\n   primary -> replica;\n   primary -> many replicas;\n   cascading replication;\n   bidirectional replication;\n```\n\nНа практике чаще всего в backend-разработке встречается схема:\n\n```text\nодин primary принимает запись;\nодна или несколько replica принимают чтение;\nизменения передаются через WAL/binlog;\nрежим чаще асинхронный или синхронный.\n```\n\n---\n\n### 1. Physical replication\n\n**Physical replication** — это репликация на физическом уровне хранения данных.\n\nВ PostgreSQL такой подход обычно связан с WAL — Write-Ahead Log. Primary записывает изменения в WAL, а standby получает и воспроизводит эти WAL-записи. Реплика получается почти точной копией primary на уровне файлов/страниц хранения.\n\nPostgreSQL описывает streaming replication так: primary-серверы отправляют данные, standby-серверы получают их; при cascading replication standby может быть одновременно получателем и отправителем. \n\nСхема:\n\n```text\nClient\n  |\n  v\nPrimary PostgreSQL\n  |\n  | WAL stream\n  v\nStandby PostgreSQL\n```\n\nОсобенности physical replication:\n\n```text\nреплицируется весь кластер/инстанс или большая физическая часть данных;\nреплика обычно read-only;\nхорошо подходит для failover;\nхорошо подходит для read replica;\nреплика должна быть совместимой с primary по версии и формату хранения;\nнельзя удобно выбрать только одну таблицу для репликации.\n```\n\nПример использования:\n\n```text\nproduction primary;\nstandby для аварийного переключения;\nread replica для отчётов;\nрезервная копия почти в реальном времени.\n```\n\nВ PostgreSQL это один из самых типичных вариантов для отказоустойчивости.\n\n---\n\n### 2. Logical replication\n\n**Logical replication** — это репликация не физических страниц, а логических изменений данных.\n\nТо есть передаются не «изменения блоков на диске», а смысловые операции над строками:\n\n```text\nвставлена строка;\nобновлена строка;\nудалена строка.\n```\n\nВ PostgreSQL logical replication строит поток логических изменений из WAL и позволяет реплицировать изменения на уровне отдельных таблиц. Документация PostgreSQL также указывает, что сервер может публиковать свои изменения и одновременно подписываться на изменения другого сервера, что позволяет организовывать поток данных в нескольких направлениях. \n\nСхема:\n\n```text\nPublisher\n  |\n  | logical changes\n  v\nSubscriber\n```\n\nВ PostgreSQL это обычно модель:\n\n```text\npublication -> subscription\n```\n\nПример:\n\n```sql\nCREATE PUBLICATION app_publication\nFOR TABLE users, orders;\n```\n\n```sql\nCREATE SUBSCRIPTION app_subscription\nCONNECTION 'host=primary dbname=app user=repl password=secret'\nPUBLICATION app_publication;\n```\n\nКогда полезна logical replication:\n\n```text\nнужно реплицировать не всю базу, а конкретные таблицы;\nнужно мигрировать данные между версиями PostgreSQL;\nнужно передавать данные в аналитическую БД;\nнужно построить интеграцию между системами;\nнужно делать zero/minimal downtime migration;\nнужно реплицировать данные между разными схемами или частично разными структурами.\n```\n\nМинусы:\n\n```text\nсложнее physical replication;\nDDL не всегда реплицируется так же просто, как DML;\nнужно думать о primary key / replica identity;\nмогут быть конфликты;\nпоследовательности sequence требуют отдельного внимания;\nне всегда подходит как полноценная аварийная копия всего кластера.\n```\n\n---\n\n### 3. Asynchronous replication\n\n**Асинхронная репликация** — это режим, при котором primary подтверждает транзакцию клиенту, не дожидаясь, пока replica получит или применит изменения.\n\nСхема:\n\n```text\n1. Клиент отправляет INSERT.\n2. Primary записывает изменение.\n3. Primary подтверждает COMMIT клиенту.\n4. Replica получает изменение позже.\n```\n\nПлюсы:\n\n```text\nбыстрая запись;\nменьше задержка для клиента;\nреплика может временно отставать без остановки primary;\nпростая и распространённая схема.\n```\n\nМинусы:\n\n```text\nесть replication lag;\nпосле записи чтение с replica может вернуть старые данные;\nпри аварии primary можно потерять последние подтверждённые транзакции, если они не успели попасть на replica.\n```\n\nПример проблемы:\n\n```text\nPOST /orders\n  -> запись ушла на primary\n  -> клиент получил 201 Created\n\nGET /orders/123\n  -> запрос ушёл на replica\n  -> replica ещё не получила WAL/binlog\n  -> клиент получил 404\n```\n\nЭто не ошибка SQL как таковая. Это нормальное следствие асинхронной репликации.\n\nMySQL документация описывает исходную модель репликации как one-way asynchronous replication: один server source, один или несколько replicas. Там же указано, что MySQL дополнительно поддерживает semisynchronous replication. \n\n---\n\n### 4. Synchronous replication\n\n**Синхронная репликация** — это режим, при котором primary подтверждает commit только после подтверждения со стороны replica.\n\nУпрощённо:\n\n```text\n1. Клиент делает COMMIT.\n2. Primary записывает изменение.\n3. Primary отправляет изменение на replica.\n4. Replica подтверждает получение/запись/применение.\n5. Primary подтверждает COMMIT клиенту.\n```\n\nПлюсы:\n\n```text\nменьше риск потери подтверждённых транзакций;\nлучше гарантия консистентности между primary и replica;\nподходит для критичных данных.\n```\n\nМинусы:\n\n```text\nзапись медленнее;\nlatency зависит от сети между primary и replica;\nпроблемы с replica могут тормозить primary;\nнужна аккуратная настройка quorum/standby.\n```\n\nPostgreSQL в разделе High Availability указывает, что некоторые решения являются synchronous: data-modifying transaction не считается committed, пока все серверы не зафиксировали транзакцию. \n\nВ PostgreSQL есть разные уровни ожидания через `synchronous_commit`, например ожидание записи на удалённой стороне или ожидание применения. В практическом смысле это позволяет выбирать баланс между скоростью и надёжностью.\n\n---\n\n### 5. Semi-synchronous replication\n\n**Полусинхронная репликация** — промежуточный вариант между asynchronous и fully synchronous.\n\nИдея:\n\n```text\nprimary ждёт подтверждения хотя бы от одной replica,\nчто та получила и записала события,\nно не обязательно ждёт, что replica полностью применит изменения.\n```\n\nMySQL документация описывает semisynchronous replication именно как промежуточный режим: source ждёт, пока хотя бы одна replica получит и залогирует events, но не ждёт подтверждения от всех replicas и не требует, чтобы события были полностью выполнены и committed на стороне replica. \n\nПлюсы:\n\n```text\nнадёжнее, чем чисто асинхронный режим;\nменьше риск потери данных при падении primary;\nобычно быстрее, чем полностью синхронная схема.\n```\n\nМинусы:\n\n```text\nвсё равно возможен lag применения на replica;\nне всегда даёт строгую консистентность чтения;\nпри проблемах с replica может деградировать или замедлять запись.\n```\n\n---\n\n### 6. Statement-based replication\n\n**Statement-based replication** — репликация SQL-выражений.\n\nИсточник записывает в лог не сами изменённые строки, а SQL-команды:\n\n```sql\nUPDATE products\nSET price = price * 1.1\nWHERE category_id = 5;\n```\n\nReplica потом выполняет этот statement у себя.\n\nMySQL документация выделяет Statement Based Replication, Row Based Replication и Mixed Based Replication как основные форматы репликации. Statement Based Replication реплицирует SQL statements, Row Based Replication — изменённые строки. \n\nПлюсы statement-based:\n\n```text\nлог может быть компактнее;\nпонятнее, какие SQL-команды выполнялись;\nиногда меньше объём передаваемых данных.\n```\n\nМинусы:\n\n```text\nнедетерминированные функции могут дать разный результат;\nзапрос может выполниться иначе из-за отличий окружения;\nсложные UPDATE/DELETE должны быть переисполнены на replica;\nвыше риск расхождений при небезопасных statements.\n```\n\nПример потенциально опасной логики:\n\n```sql\nUPDATE users\nSET token = random()\nWHERE id = 1;\n```\n\nЕсли на replica заново выполнить `random()`, результат может отличаться. Поэтому statement-based replication требует осторожности.\n\n---\n\n### 7. Row-based replication\n\n**Row-based replication** — репликация изменений конкретных строк.\n\nИсточник пишет в лог примерно такую информацию:\n\n```text\nв таблице products строка id=10:\nстарое price = 100;\nновое price = 110.\n```\n\nMySQL документация описывает row-based logging так: source записывает в binary log events, которые показывают, как изменились отдельные строки таблиц; replica копирует эти events. В MySQL row-based logging является default method. \n\nПлюсы:\n\n```text\nболее детерминированно;\nreplica не должна заново вычислять весь SQL;\nлучше для сложных или недетерминированных изменений;\nменьше риск разных результатов между source и replica.\n```\n\nМинусы:\n\n```text\nлог может быть намного больше;\nмассовый UPDATE может породить много row events;\nсложнее читать глазами.\n```\n\nПример:\n\n```sql\nUPDATE users SET is_active = false;\n```\n\nЕсли затронуто 5 миллионов строк, row-based replication может записать изменения по миллионам строк, а не одну SQL-команду.\n\n---\n\n### 8. Mixed replication\n\n**Mixed replication** — гибрид statement-based и row-based.\n\nИдея:\n\n```text\nобычно использовать statement-based;\nдля небезопасных случаев переключаться на row-based.\n```\n\nMySQL документация прямо выделяет Mixed Based Replication как третий формат помимо SBR и RBR. \n\nНа практике это компромисс:\n\n```text\nгде statement безопасен — лог компактнее;\nгде statement опасен — используется row-based.\n```\n\n---\n\n### 9. Snapshot replication\n\n**Snapshot replication** — это репликация снимка данных целиком или выбранной части данных на определённый момент.\n\nИдея:\n\n```text\nсделать снимок таблиц;\nпередать снимок получателю;\nпериодически повторять полное обновление или использовать как начальную загрузку.\n```\n\nSQL Server документация указывает, что snapshot replication используется для предоставления начального набора данных для transactional и merge replication, а также подходит, когда уместны полные обновления данных. \n\nКогда полезно:\n\n```text\nмаленькие справочники;\nредко меняющиеся данные;\nпериодическая синхронизация;\nначальная загрузка перед дальнейшей репликацией изменений.\n```\n\nПример:\n\n```text\nраз в сутки копировать справочник городов;\nраз в час обновлять каталог товаров в read-only хранилище;\nпервично загрузить subscriber перед transactional replication.\n```\n\nМинусы:\n\n```text\nне подходит для частых real-time изменений;\nможет быть тяжёлой при больших таблицах;\nмежду снимками данные устаревают.\n```\n\n---\n\n### 10. Transactional replication\n\n**Transactional replication** — репликация изменений транзакций после начального snapshot.\n\nИдея:\n\n```text\nсначала делается начальная копия;\nзатем изменения транзакций передаются подписчикам.\n```\n\nВ SQL Server это отдельный тип репликации. Документация Microsoft выделяет snapshot, transactional и merge replication как основные типы SQL Server replication. \n\nКогда полезно:\n\n```text\nнужно близкое к реальному времени распространение изменений;\nнужны read-only копии для отчётов;\nнужно передавать изменения из OLTP в reporting database;\nнужно синхронизировать выбранные таблицы.\n```\n\nВ PostgreSQL близкую по идее роль часто играет logical replication, хотя терминология и реализация отличаются.\n\n---\n\n### 11. Merge replication\n\n**Merge replication** — это репликация, при которой изменения могут происходить на нескольких узлах, а потом эти изменения синхронизируются и объединяются.\n\nSQL Server документация описывает merge replication так: она обычно начинается со snapshot, а последующие изменения данных и схемы на Publisher и Subscribers отслеживаются с помощью triggers; Subscriber синхронизируется с Publisher при подключении и обменивается изменёнными строками с момента последней синхронизации. \n\nГде используется:\n\n```text\nмобильные клиенты;\nофлайн-режим;\nфилиалы, которые временно работают без связи;\nраспределённые приложения, где изменения могут появляться в разных местах.\n```\n\nПлюсы:\n\n```text\nузлы могут работать автономно;\nпосле восстановления связи изменения можно объединить;\nподходит для offline-first сценариев.\n```\n\nМинусы:\n\n```text\nсложное разрешение конфликтов;\nсложнее модель консистентности;\nнужно отслеживать изменения;\nмогут быть конфликтующие UPDATE одной строки на разных узлах.\n```\n\nПример конфликта:\n\n```text\nФилиал A изменил phone клиента на 111.\nФилиал B изменил phone того же клиента на 222.\nПри синхронизации нужно решить, какое значение победит.\n```\n\n---\n\n### 12. Single-primary replication\n\n**Single-primary replication** — один основной сервер принимает запись, остальные являются репликами.\n\nЭто самый частый вариант:\n\n```text\nPrimary:\n  INSERT / UPDATE / DELETE\n\nReplicas:\n  SELECT\n  failover candidates\n```\n\nСхема:\n\n```text\n        writes\n          |\n          v\n      Primary\n      /  |   \\\n     v   v    v\nReplica Replica Replica\n```\n\nПлюсы:\n\n```text\nпростая модель записи;\nменьше конфликтов;\nпроще поддерживать консистентность;\nхорошо подходит для большинства backend-сервисов.\n```\n\nМинусы:\n\n```text\nprimary остаётся узким местом для записи;\nпри failover нужна смена primary;\nread-after-write с replica требует осторожности.\n```\n\n---\n\n### 13. Multi-primary / multi-master replication\n\n**Multi-primary** или **multi-master replication** — несколько узлов могут принимать запись.\n\nСхема:\n\n```text\nPrimary A <----> Primary B <----> Primary C\n```\n\nПлюсы:\n\n```text\nможно писать в разные регионы;\nменьше задержка для географически распределённых пользователей;\nвыше доступность записи при отказе одного узла.\n```\n\nМинусы:\n\n```text\nсложные конфликты;\nнужна координация;\nсложнее транзакции;\nсложнее уникальные ключи;\nсложнее гарантировать строгую консистентность.\n```\n\nПример проблемы:\n\n```text\nNode A создал пользователя с email test@example.com.\nNode B почти одновременно создал пользователя с тем же email.\nОба локально считают операцию успешной.\nПри синхронизации возникает конфликт UNIQUE.\n```\n\nПоэтому multi-master обычно применяют осторожно и только когда есть реальная потребность.\n\n---\n\n### 14. Cascading replication\n\n**Cascading replication** — это топология, где replica получает изменения не напрямую от primary, а от другой replica.\n\nСхема:\n\n```text\nPrimary\n  |\n  v\nReplica 1\n  |\n  v\nReplica 2\n  |\n  v\nReplica 3\n```\n\nPostgreSQL документация указывает, что при cascading replication standby-серверы могут быть не только получателями, но и отправителями данных. \n\nЗачем это нужно:\n\n```text\nснизить нагрузку на primary;\nудобно строить реплики в удалённых регионах;\nможно сделать промежуточный узел-распространитель WAL;\nполезно при большом количестве replica.\n```\n\nМинусы:\n\n```text\nувеличивается задержка на дальних replica;\nесли промежуточная replica упала, нижние replica могут перестать получать изменения;\nтопология становится сложнее.\n```\n\n---\n\n### 15. Trigger-based replication\n\n**Trigger-based replication** — изменения отслеживаются через триггеры в БД.\n\nИдея:\n\n```text\nна INSERT/UPDATE/DELETE срабатывает trigger;\ntrigger пишет изменение в служебную таблицу;\nотдельный процесс забирает эти изменения и отправляет в другую БД.\n```\n\nТакой подход встречается в некоторых системах синхронизации, CDC-инструментах, legacy-интеграциях.\n\nПлюсы:\n\n```text\nможно гибко выбирать, что реплицировать;\nможно добавлять бизнес-логику;\nможно использовать там, где нет нормального доступа к WAL/binlog.\n```\n\nМинусы:\n\n```text\nтриггеры замедляют запись;\nможно ошибиться в логике;\nсложнее обслуживание;\nне всегда видны все низкоуровневые изменения;\nнагрузка ложится на основную БД.\n```\n\n---\n\n### 16. Log-based replication / CDC\n\n**Log-based replication** — это репликация через журнал изменений БД:\n\n```text\nPostgreSQL WAL;\nMySQL binary log;\nSQL Server transaction log;\nOracle redo log.\n```\n\nЭто основа многих CDC-подходов — Change Data Capture.\n\nСмысл:\n\n```text\nбаза пишет изменения в свой журнал;\nрепликационный процесс читает этот журнал;\nизменения передаются в другую БД, Kafka, DWH, search engine и т.д.\n```\n\nПлюсы:\n\n```text\nменьше вмешательства в приложение;\nобычно меньше overhead, чем у trigger-based подхода;\nхорошо подходит для потоковой передачи изменений;\nможно строить near real-time интеграции.\n```\n\nМинусы:\n\n```text\nнужно понимать формат логов;\nнужна настройка retention/slots/binlog;\nможно потерять изменения при неправильном хранении логов;\nесть сложности со схемой, DDL и ordering.\n```\n\n---\n\n### Сравнительная таблица\n\n|Способ|Что передаётся|Главная польза|Главный риск|\n|---|---|---|---|\n|Physical|WAL/страницы/физические изменения|Failover, read replica|Реплицируется почти всё, мало гибкости|\n|Logical|Логические изменения строк|Частичная репликация, интеграции|Конфликты, DDL, replica identity|\n|Async|Изменения без ожидания replica|Быстрая запись|Lag, возможная потеря последних транзакций|\n|Sync|Commit ждёт replica|Выше надёжность|Медленнее запись|\n|Semi-sync|Ждёт ACK от части replica|Компромисс|Не всегда строгое чтение с replica|\n|Statement-based|SQL-команды|Компактность|Недетерминированность|\n|Row-based|Изменённые строки|Надёжнее и детерминированнее|Большой лог|\n|Snapshot|Снимок данных|Простая периодическая копия|Данные устаревают между снимками|\n|Merge|Изменения с разных узлов|Offline/multi-site|Конфликты|\n|Cascading|Реплика от реплики|Меньше нагрузка на primary|Больше lag и сложнее топология|\n\n---\n\n### Что чаще встречается в PostgreSQL\n\nВ PostgreSQL чаще всего говорят о таких вариантах:\n\n```text\nphysical streaming replication;\nlogical replication;\nsynchronous replication;\nasynchronous replication;\ncascading replication;\nreplication slots;\nhot standby read-only replica.\n```\n\nДля обычного production backend-проекта типичная схема:\n\n```text\nPostgreSQL primary\n  -> physical streaming replica\n  -> async mode\n  -> read-only SELECT на replica\n  -> failover через Patroni/repmgr/cloud managed service\n```\n\nЕсли нужна передача части таблиц в другую систему:\n\n```text\nPostgreSQL logical replication\nили CDC через WAL\n```\n\n---\n\n### Что чаще встречается в MySQL\n\nВ MySQL часто обсуждают:\n\n```text\nsource-replica replication;\nasynchronous replication;\nsemisynchronous replication;\nstatement-based replication;\nrow-based replication;\nmixed replication;\nbinary log replication;\nGroup Replication.\n```\n\nMySQL replication работает через события в binary log. В зависимости от формата это могут быть statements, row changes или mixed-подход. \n\n---\n\n### Что чаще встречается в SQL Server\n\nВ SQL Server классически выделяют:\n\n```text\nsnapshot replication;\ntransactional replication;\nmerge replication.\n```\n\nMicrosoft документация указывает именно эти типы как основные варианты SQL Server replication. \n\nТакже в SQL Server отдельно есть Always On Availability Groups, log shipping и другие HA/DR-механизмы, но это уже не всегда называют replication в том же смысле, что snapshot/transactional/merge replication.\n\n---\n\n### Что важно понимать на собеседовании или в практике\n\nРепликацию нельзя описывать одним словом, потому что «репликация» может означать разные вещи:\n\n```text\nкопировать весь сервер для failover;\nкопировать отдельные таблицы;\nпередавать SQL-команды;\nпередавать изменённые строки;\nждать подтверждения replica;\nне ждать подтверждения replica;\nразрешать запись только на primary;\nразрешать запись на нескольких узлах.\n```\n\nСамое практичное разделение:\n\n```text\nphysical vs logical\nasync vs sync\nsingle-primary vs multi-primary\nstatement-based vs row-based\nsnapshot vs streaming/log-based\n```\n\n---\n\n### Итог\n\nОсновные способы репликации в базах данных:\n\n```text\nPhysical replication — копирование изменений на уровне хранения/WAL.\n\nLogical replication — передача логических изменений строк/таблиц.\n\nAsynchronous replication — primary не ждёт replica.\n\nSynchronous replication — commit ждёт подтверждения replica.\n\nSemi-synchronous replication — компромисс: ждём подтверждение получения от части replica.\n\nStatement-based replication — передаются SQL-команды.\n\nRow-based replication — передаются изменения конкретных строк.\n\nMixed replication — гибрид statement-based и row-based.\n\nSnapshot replication — периодическая или начальная копия снимка данных.\n\nTransactional replication — передача транзакционных изменений после начального snapshot.\n\nMerge replication — изменения могут быть на разных узлах и потом объединяются.\n\nCascading replication — replica может реплицировать данные дальше другим replica.\n```\n\nДля PostgreSQL в обычной backend-практике самые важные: **physical streaming replication**, **logical replication**, **asynchronous/synchronous replication** и **replication lag**."
  popularity = 2.63

[[questions]]
  id = 39
  question = "Что такое constraints в SQL?"
  answer = "### Что такое constraints в SQL\n\n**Constraints** — это ограничения на данные в таблице.\n\nОни задают правила, которым должны соответствовать строки в БД. Если данные нарушают constraint, база не даст выполнить `INSERT`, `UPDATE` или иногда `DELETE`.\n\nПростыми словами:\n\n```text\nconstraint = правило целостности данных на уровне базы данных\n```\n\nНапример:\n\n```sql\nCREATE TABLE users (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    email TEXT NOT NULL UNIQUE,\n    age INTEGER CHECK (age >= 0)\n);\n```\n\nЗдесь сразу несколько ограничений:\n\n```text\nid      -> PRIMARY KEY\nemail   -> NOT NULL + UNIQUE\nage     -> CHECK\n```\n\nPostgreSQL хранит constraints как объекты схемы; в системном каталоге `pg_constraint` хранятся `CHECK`, `NOT NULL`, `PRIMARY KEY`, `UNIQUE`, `FOREIGN KEY` и `EXCLUSION` constraints. \n\n### Зачем нужны constraints\n\nConstraints нужны не только для «красивой схемы», а для защиты данных от некорректного состояния.\n\nНапример, без ограничений можно случайно получить:\n\n```text\nпользователя без email;\nдва аккаунта с одинаковым username;\nзаказ на несуществующего пользователя;\nтовар с отрицательной ценой;\nплатёж без суммы;\nдве активные подписки там, где должна быть только одна;\n```\n\nВалидация в приложении тоже нужна, но она не заменяет constraints.\n\nПричина простая: к БД могут обращаться разные части системы:\n\n```text\nbackend API;\nадминка;\nмиграции;\nскрипты;\nETL;\nручные SQL-запросы;\nдругие сервисы;\nочереди/воркеры.\n```\n\nЕсли правило важно для целостности данных, его лучше закреплять в самой базе.\n\n---\n\n### Основные виды constraints\n\nВ реляционных БД чаще всего встречаются:\n\n```text\nNOT NULL\nUNIQUE\nPRIMARY KEY\nFOREIGN KEY\nCHECK\nDEFAULT\nEXCLUSION\n```\n\nСтрого говоря, `DEFAULT` обычно не считают constraint в том же смысле, что `PRIMARY KEY` или `FOREIGN KEY`, но на практике его часто обсуждают рядом с ограничениями, потому что он тоже влияет на допустимое/автоматическое значение колонки.\n\nВ PostgreSQL в разделе constraints официально описаны `CHECK`, `NOT NULL`, `UNIQUE`, `PRIMARY KEY`, `FOREIGN KEY` и `EXCLUSION`. \n\n---\n\n### NOT NULL\n\n`NOT NULL` запрещает хранить `NULL` в колонке.\n\nПример:\n\n```sql\nCREATE TABLE users (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    username TEXT NOT NULL,\n    email TEXT NOT NULL\n);\n```\n\nТеперь нельзя вставить пользователя без `username`:\n\n```sql\nINSERT INTO users (email)\nVALUES ('test@example.com');\n```\n\nБаза вернёт ошибку, потому что `username` обязателен.\n\n`NOT NULL` используют для полей, без которых строка не имеет смысла:\n\n```text\nusername;\nemail;\ncreated_at;\norder.amount;\npayment.status;\nnotification.user_id;\n```\n\nПример:\n\n```sql\nCREATE TABLE orders (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    user_id BIGINT NOT NULL,\n    amount NUMERIC NOT NULL,\n    created_at TIMESTAMP NOT NULL DEFAULT now()\n);\n```\n\nЕсли `amount` может быть `NULL`, потом начинаются проблемы:\n\n```sql\nSELECT SUM(amount) FROM orders;\n```\n\n`NULL` — это не ноль. Это отсутствие значения. Поэтому обязательные бизнес-поля лучше явно делать `NOT NULL`.\n\n---\n\n### UNIQUE\n\n`UNIQUE` запрещает дубликаты в колонке или группе колонок.\n\nПример:\n\n```sql\nCREATE TABLE users (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    email TEXT UNIQUE NOT NULL\n);\n```\n\nТеперь нельзя создать двух пользователей с одинаковым email:\n\n```sql\nINSERT INTO users (email) VALUES ('test@example.com');\nINSERT INTO users (email) VALUES ('test@example.com');\n```\n\nВторая вставка упадёт.\n\nPostgreSQL создаёт уникальный B-tree индекс для `UNIQUE` constraint, и именно он обеспечивает проверку уникальности. \n\n### Составной UNIQUE\n\n`UNIQUE` может быть не только на одной колонке, но и на комбинации колонок.\n\nНапример, пользователь не может иметь две папки с одинаковым именем:\n\n```sql\nCREATE TABLE folders (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    user_id BIGINT NOT NULL,\n    name TEXT NOT NULL,\n    UNIQUE (user_id, name)\n);\n```\n\nЭто не запрещает одинаковые имена папок у разных пользователей:\n\n```text\nuser_id = 1, name = 'docs'  -> можно\nuser_id = 2, name = 'docs'  -> можно\n```\n\nНо запрещает дубликат внутри одного пользователя:\n\n```text\nuser_id = 1, name = 'docs'\nuser_id = 1, name = 'docs'  -> нельзя\n```\n\nЭто очень частый кейс в backend-разработке.\n\nПримеры составного `UNIQUE`:\n\n```sql\nUNIQUE (user_id, filename)\nUNIQUE (tenant_id, slug)\nUNIQUE (order_id, product_id)\nUNIQUE (chat_id, user_id)\nUNIQUE (provider, external_id)\n```\n\n---\n\n### PRIMARY KEY\n\n`PRIMARY KEY` — это главный идентификатор строки в таблице.\n\nОбычно это колонка `id`:\n\n```sql\nCREATE TABLE users (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    username TEXT NOT NULL\n);\n```\n\n`PRIMARY KEY` означает:\n\n```text\nзначение не может быть NULL;\nзначение должно быть уникальным;\nпо нему можно однозначно найти строку;\nна него обычно ссылаются FOREIGN KEY из других таблиц.\n```\n\nВ PostgreSQL `PRIMARY KEY` фактически накладывает те же ограничения на данные, что `UNIQUE` + `NOT NULL`, но дополнительно несёт смысл: это основной идентификатор строки, на который могут опираться другие таблицы. \n\nПример:\n\n```sql\nCREATE TABLE users (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    email TEXT UNIQUE NOT NULL\n);\n\nCREATE TABLE orders (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    user_id BIGINT NOT NULL REFERENCES users(id),\n    amount NUMERIC NOT NULL\n);\n```\n\nЗдесь:\n\n```text\nusers.id  -> PRIMARY KEY\norders.user_id -> FOREIGN KEY на users.id\n```\n\n### Составной PRIMARY KEY\n\nPrimary key тоже может состоять из нескольких колонок.\n\nЧастый пример — таблица many-to-many:\n\n```sql\nCREATE TABLE user_roles (\n    user_id BIGINT NOT NULL REFERENCES users(id),\n    role_id BIGINT NOT NULL REFERENCES roles(id),\n    PRIMARY KEY (user_id, role_id)\n);\n```\n\nТакой ключ запрещает дубликаты связей:\n\n```text\nuser_id | role_id\n--------+--------\n1       | 2      -> можно\n1       | 2      -> нельзя, такая пара уже есть\n```\n\n---\n\n### FOREIGN KEY\n\n`FOREIGN KEY` связывает одну таблицу с другой и защищает ссылочную целостность.\n\nПример:\n\n```sql\nCREATE TABLE users (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY\n);\n\nCREATE TABLE orders (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    user_id BIGINT NOT NULL REFERENCES users(id)\n);\n```\n\nТеперь нельзя создать заказ на пользователя, которого нет:\n\n```sql\nINSERT INTO orders (user_id)\nVALUES (999);\n```\n\nЕсли в `users` нет строки с `id = 999`, база вернёт ошибку.\n\nPostgreSQL указывает, что foreign key должен ссылаться на колонки, которые являются primary key, unique constraint или подходящим unique index; это гарантирует, что ссылка ведёт на однозначно идентифицируемую строку. \n\n### Зачем нужен FOREIGN KEY\n\nБез foreign key можно получить «битые ссылки»:\n\n```text\norders.user_id = 123\nно users.id = 123 не существует\n```\n\nВ приложении потом будет непонятно:\n\n```text\nкому принадлежит заказ;\nможно ли его показывать;\nможно ли удалить пользователя;\nпочему JOIN не находит данные.\n```\n\nС foreign key база сама не даст нарушить связь.\n\n### ON DELETE\n\nForeign key может задавать поведение при удалении родительской строки.\n\nНапример:\n\n```sql\nCREATE TABLE notifications (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    user_id BIGINT NOT NULL REFERENCES users(id) ON DELETE CASCADE,\n    text TEXT NOT NULL\n);\n```\n\n`ON DELETE CASCADE` означает:\n\n```text\nесли удалить пользователя,\nего уведомления тоже удалятся.\n```\n\nДругие частые варианты:\n\n```sql\nON DELETE CASCADE\nON DELETE SET NULL\nON DELETE RESTRICT\nON DELETE NO ACTION\n```\n\n### ON DELETE CASCADE\n\n```sql\nuser_id BIGINT NOT NULL REFERENCES users(id) ON DELETE CASCADE\n```\n\nУдалили пользователя — удалились зависимые строки.\n\nХорошо подходит для:\n\n```text\nuser_sessions;\nrefresh_tokens;\ntemporary_codes;\nuser_settings;\nnotification_drafts;\n```\n\nНо опасно для исторических данных:\n\n```text\norders;\npayments;\ninvoices;\naudit_logs;\n```\n\nЗаказы и платежи обычно не хотят физически удалять вместе с пользователем.\n\n### ON DELETE SET NULL\n\n```sql\nauthor_id BIGINT REFERENCES users(id) ON DELETE SET NULL\n```\n\nУдалили пользователя — поле `author_id` стало `NULL`.\n\nТак делают, когда строку нужно сохранить, но связь с удалённой сущностью можно потерять.\n\nПример:\n\n```text\nпост остаётся;\nавтор удалён;\nauthor_id становится NULL.\n```\n\n### ON DELETE RESTRICT / NO ACTION\n\nОбычно означает: нельзя удалить родительскую строку, пока на неё есть ссылки.\n\nНапример:\n\n```sql\nuser_id BIGINT NOT NULL REFERENCES users(id) ON DELETE RESTRICT\n```\n\nСмысл:\n\n```text\nнельзя удалить пользователя, пока у него есть заказы.\n```\n\n---\n\n### CHECK\n\n`CHECK` задаёт произвольное логическое условие для значений строки.\n\nПример:\n\n```sql\nCREATE TABLE products (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    name TEXT NOT NULL,\n    price NUMERIC NOT NULL CHECK (price >= 0)\n);\n```\n\nТеперь нельзя вставить товар с отрицательной ценой:\n\n```sql\nINSERT INTO products (name, price)\nVALUES ('Laptop', -100);\n```\n\nБаза отклонит такую строку.\n\nПримеры `CHECK`:\n\n```sql\nCHECK (age >= 0)\n\nCHECK (price > 0)\n\nCHECK (discount >= 0 AND discount <= 100)\n\nCHECK (status IN ('new', 'paid', 'cancelled'))\n\nCHECK (start_date <= end_date)\n\nCHECK (quantity >= 1)\n```\n\n`CHECK` хорош для простых бизнес-правил, которые можно выразить через значения одной строки.\n\nНапример:\n\n```sql\nCREATE TABLE subscriptions (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    starts_at TIMESTAMP NOT NULL,\n    ends_at TIMESTAMP NOT NULL,\n    CHECK (starts_at < ends_at)\n);\n```\n\nЭто защитит от подписки, которая заканчивается раньше, чем начинается.\n\n### Важный нюанс CHECK\n\n`CHECK` обычно проверяет значения текущей строки.\n\nОн не подходит для правил вида:\n\n```text\nу пользователя не должно быть больше 5 активных заказов;\nсумма всех платежей не должна превышать лимит;\nв таблице должно быть не больше одной активной записи по сложному условию.\n```\n\nДля таких правил часто нужны:\n\n```text\nUNIQUE / partial unique index;\nтриггеры;\nтранзакции;\nблокировки;\nпроверка в приложении + constraint в БД.\n```\n\n---\n\n### DEFAULT\n\n`DEFAULT` задаёт значение по умолчанию, если при вставке оно не передано.\n\nПример:\n\n```sql\nCREATE TABLE notifications (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    text TEXT NOT NULL,\n    is_read BOOLEAN NOT NULL DEFAULT false,\n    created_at TIMESTAMP NOT NULL DEFAULT now()\n);\n```\n\nТеперь можно вставить:\n\n```sql\nINSERT INTO notifications (text)\nVALUES ('New message');\n```\n\nБаза сама поставит:\n\n```text\nis_read = false\ncreated_at = now()\n```\n\n`DEFAULT` не столько запрещает плохие данные, сколько помогает создавать корректные данные без лишнего кода в приложении.\n\nЧастые значения по умолчанию:\n\n```sql\ncreated_at TIMESTAMP NOT NULL DEFAULT now()\nis_active BOOLEAN NOT NULL DEFAULT true\nstatus TEXT NOT NULL DEFAULT 'new'\nattempts INTEGER NOT NULL DEFAULT 0\n```\n\n---\n\n### EXCLUSION constraint\n\n`EXCLUSION` constraint — более специфичное ограничение, особенно полезное в PostgreSQL.\n\nОно запрещает строки, которые конфликтуют по заданному оператору.\n\nКлассический пример: нельзя создать две брони одной комнаты на пересекающиеся интервалы времени.\n\nПример в PostgreSQL:\n\n```sql\nCREATE EXTENSION IF NOT EXISTS btree_gist;\n\nCREATE TABLE room_bookings (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    room_id INTEGER NOT NULL,\n    period TSRANGE NOT NULL,\n    EXCLUDE USING gist (\n        room_id WITH =,\n        period WITH &&\n    )\n);\n```\n\nСмысл:\n\n```text\nдля одной и той же room_id\nнельзя иметь пересекающиеся period\n```\n\nОператор `&&` для range-типов означает пересечение диапазонов.\n\nТо есть можно:\n\n```text\nroom_id = 1, 10:00-11:00\nroom_id = 1, 11:00-12:00\n```\n\nНо нельзя:\n\n```text\nroom_id = 1, 10:00-11:00\nroom_id = 1, 10:30-11:30\n```\n\nPostgreSQL официально выделяет exclusion constraints как отдельный вид ограничений. \n\nВ обычной backend-разработке `EXCLUSION` встречается реже, чем `PRIMARY KEY`, `FOREIGN KEY`, `UNIQUE`, `NOT NULL` и `CHECK`, но это мощный инструмент для задач бронирования, расписаний и пересекающихся диапазонов.\n\n---\n\n### Column constraint и table constraint\n\nConstraint можно записать на уровне колонки или на уровне таблицы.\n\n### Column constraint\n\nОграничение написано прямо возле колонки:\n\n```sql\nCREATE TABLE users (\n    id BIGINT PRIMARY KEY,\n    email TEXT UNIQUE NOT NULL,\n    age INTEGER CHECK (age >= 0)\n);\n```\n\n### Table constraint\n\nОграничение написано отдельно после списка колонок:\n\n```sql\nCREATE TABLE users (\n    id BIGINT,\n    email TEXT,\n    age INTEGER,\n    PRIMARY KEY (id),\n    UNIQUE (email),\n    CHECK (age >= 0)\n);\n```\n\nДля ограничений на одну колонку оба варианта часто равнозначны.\n\nНо для составных ограничений нужен table-level синтаксис:\n\n```sql\nCREATE TABLE folders (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    user_id BIGINT NOT NULL,\n    name TEXT NOT NULL,\n    UNIQUE (user_id, name)\n);\n```\n\nЗдесь нельзя написать `UNIQUE` только у `user_id` или только у `name`, потому что уникальной должна быть именно пара.\n\n---\n\n### Именованные constraints\n\nConstraints лучше явно именовать, особенно в продакшн-схемах и миграциях.\n\nПример:\n\n```sql\nCREATE TABLE users (\n    id BIGINT GENERATED ALWAYS AS IDENTITY,\n    email TEXT NOT NULL,\n    age INTEGER NOT NULL,\n\n    CONSTRAINT users_pk PRIMARY KEY (id),\n    CONSTRAINT users_email_unique UNIQUE (email),\n    CONSTRAINT users_age_non_negative CHECK (age >= 0)\n);\n```\n\nПлюсы именования:\n\n```text\nпонятнее ошибки;\nлегче удалять constraint в миграции;\nлегче читать схему;\nпроще поддерживать проект командой.\n```\n\nНапример:\n\n```sql\nALTER TABLE users\nDROP CONSTRAINT users_email_unique;\n```\n\nЕсли имя сгенерировала сама БД, оно может быть менее удобным.\n\n---\n\n### Constraints и индексы\n\nНе все constraints — это индексы, но некоторые constraints создают индексы автоматически.\n\nВ PostgreSQL:\n\n```text\nPRIMARY KEY -> создаёт уникальный B-tree индекс;\nUNIQUE      -> создаёт уникальный B-tree индекс;\nFOREIGN KEY -> не всегда создаёт индекс на дочерней колонке автоматически;\nCHECK       -> не создаёт индекс;\nNOT NULL    -> не создаёт индекс;\n```\n\nВажный момент: для `FOREIGN KEY` индекс на referenced columns обычно уже есть, потому что ссылка идёт на `PRIMARY KEY` или `UNIQUE`. Но на дочерней колонке индекс часто нужно создать самому.\n\nНапример:\n\n```sql\nCREATE TABLE orders (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    user_id BIGINT NOT NULL REFERENCES users(id)\n);\n```\n\nПолезно добавить:\n\n```sql\nCREATE INDEX orders_user_id_idx ON orders(user_id);\n```\n\nЗачем:\n\n```text\nбыстрее JOIN orders -> users;\nбыстрее поиск заказов пользователя;\nбыстрее проверка при удалении/изменении users.id.\n```\n\nPostgreSQL документация прямо отмечает: foreign key должен ссылаться на primary/unique columns, поэтому на referenced side индекс есть; при этом для referencing columns часто полезно создать индекс отдельно. \n\n---\n\n### Constraints и бизнес-правила\n\nНе каждое бизнес-правило удобно выражать constraint-ом.\n\nХорошие кандидаты для constraints:\n\n```text\nemail должен быть уникальным;\nцена не может быть отрицательной;\nзаказ должен принадлежать существующему пользователю;\ncreated_at обязателен;\nстатус должен быть из допустимого набора;\nу пользователя не может быть двух папок с одинаковым именем.\n```\n\nПлохие или сложные кандидаты:\n\n```text\nскидка зависит от сложной бизнес-логики;\nлимит зависит от текущего тарифа пользователя;\nнельзя создать заказ, если складской остаток меньше суммы всех резервов;\nодновременно можно иметь только N активных задач;\nправило зависит от внешнего сервиса.\n```\n\nДля сложной логики обычно используют комбинацию:\n\n```text\nвалидация в приложении;\nтранзакции;\nблокировки;\nconstraints;\nуникальные индексы;\nтриггеры;\nочереди;\nидемпотентность.\n```\n\n---\n\n### Пример полной таблицы с constraints\n\n```sql\nCREATE TABLE users (\n    id BIGINT GENERATED ALWAYS AS IDENTITY,\n    username TEXT NOT NULL,\n    email TEXT NOT NULL,\n    age INTEGER,\n    status TEXT NOT NULL DEFAULT 'active',\n    created_at TIMESTAMP NOT NULL DEFAULT now(),\n\n    CONSTRAINT users_pk PRIMARY KEY (id),\n    CONSTRAINT users_username_unique UNIQUE (username),\n    CONSTRAINT users_email_unique UNIQUE (email),\n    CONSTRAINT users_age_check CHECK (age IS NULL OR age >= 0),\n    CONSTRAINT users_status_check CHECK (status IN ('active', 'blocked', 'deleted'))\n);\n```\n\nЧто здесь защищается:\n\n```text\nid уникально идентифицирует пользователя;\nusername не может быть пустым и не повторяется;\nemail не может быть пустым и не повторяется;\nage либо NULL, либо >= 0;\nstatus только из разрешённого набора;\ncreated_at автоматически ставится при создании.\n```\n\n---\n\n### Пример связанной схемы\n\n```sql\nCREATE TABLE users (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    email TEXT NOT NULL UNIQUE\n);\n\nCREATE TABLE orders (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    user_id BIGINT NOT NULL,\n    amount NUMERIC NOT NULL,\n    status TEXT NOT NULL DEFAULT 'new',\n    created_at TIMESTAMP NOT NULL DEFAULT now(),\n\n    CONSTRAINT orders_user_fk\n        FOREIGN KEY (user_id)\n        REFERENCES users(id)\n        ON DELETE RESTRICT,\n\n    CONSTRAINT orders_amount_positive\n        CHECK (amount > 0),\n\n    CONSTRAINT orders_status_check\n        CHECK (status IN ('new', 'paid', 'cancelled'))\n);\n```\n\nЭта схема защищает сразу несколько вещей:\n\n```text\nзаказ не может быть без пользователя;\nзаказ не может ссылаться на несуществующего пользователя;\nсумма заказа должна быть положительной;\nстатус заказа должен быть валидным;\nнельзя удалить пользователя, если на него есть заказы.\n```\n\n---\n\n### Constraints vs валидация в приложении\n\nВалидация в приложении нужна для удобства пользователя и понятных ошибок.\n\nНапример backend может вернуть:\n\n```json\n{\n  \"error\": \"Email already exists\"\n}\n```\n\nНо база всё равно должна иметь:\n\n```sql\nemail TEXT NOT NULL UNIQUE\n```\n\nПочему нельзя полагаться только на приложение:\n\n```text\nдва запроса могут прийти одновременно;\nможет быть баг в backend;\nможет быть другой сервис;\nможет быть ручной SQL;\nможет быть импорт данных;\nможет быть миграция.\n```\n\nКлассический пример гонки:\n\n```text\nЗапрос A проверил: email свободен.\nЗапрос B проверил: email свободен.\nЗапрос A вставил пользователя.\nЗапрос B вставил пользователя.\n```\n\nБез `UNIQUE` в БД появятся два одинаковых email.\n\nС `UNIQUE` один insert пройдёт, второй получит ошибку. Это правильная защита на уровне данных.\n\n---\n\n### DEFERRABLE constraints\n\nВ PostgreSQL некоторые constraints можно сделать отложенными — `DEFERRABLE`.\n\nЭто значит, что constraint может проверяться не сразу после каждой команды, а в конце транзакции.\n\nПримерная идея:\n\n```sql\nBEGIN;\n\n-- временно внутри транзакции данные могут быть в промежуточном состоянии\n-- к COMMIT всё должно стать корректным\n\nCOMMIT;\n```\n\nВ PostgreSQL `SET CONSTRAINTS` влияет на `UNIQUE`, `PRIMARY KEY`, `REFERENCES` и `EXCLUDE` constraints, если они объявлены как deferrable; `NOT NULL` и `CHECK` всегда проверяются немедленно. \n\nЭто нужно реже, но полезно в сложных случаях:\n\n```text\nциклические foreign key;\nперестановка уникальных значений;\nсложные batch-операции;\nимпорт взаимосвязанных данных.\n```\n\n---\n\n### Частые ошибки\n\n### 1. Делать поле обязательным только в приложении\n\nПлохо:\n\n```sql\nemail TEXT\n```\n\nИ потом надеяться, что backend всегда проверит email.\n\nЛучше:\n\n```sql\nemail TEXT NOT NULL\n```\n\nЕсли email должен быть уникальным:\n\n```sql\nemail TEXT NOT NULL UNIQUE\n```\n\n---\n\n### 2. Не ставить FOREIGN KEY\n\nПлохо:\n\n```sql\nCREATE TABLE orders (\n    id BIGINT PRIMARY KEY,\n    user_id BIGINT NOT NULL\n);\n```\n\nТак база не знает, что `user_id` должен ссылаться на `users`.\n\nЛучше:\n\n```sql\nCREATE TABLE orders (\n    id BIGINT PRIMARY KEY,\n    user_id BIGINT NOT NULL REFERENCES users(id)\n);\n```\n\n---\n\n### 3. Путать UNIQUE и PRIMARY KEY\n\n`UNIQUE` может быть несколько в таблице:\n\n```sql\nemail TEXT UNIQUE,\nusername TEXT UNIQUE\n```\n\nА `PRIMARY KEY` обычно один:\n\n```sql\nid BIGINT PRIMARY KEY\n```\n\n`PRIMARY KEY` — главный идентификатор строки.\n\n`UNIQUE` — дополнительное правило уникальности.\n\nНапример:\n\n```sql\nCREATE TABLE users (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    email TEXT NOT NULL UNIQUE,\n    username TEXT NOT NULL UNIQUE\n);\n```\n\nЗдесь:\n\n```text\nid       -> технический идентификатор строки;\nemail    -> бизнес-уникальность;\nusername -> бизнес-уникальность.\n```\n\n---\n\n### 4. Использовать CHECK вместо нормальной справочной таблицы\n\nНапример:\n\n```sql\nCHECK (status IN ('new', 'paid', 'cancelled'))\n```\n\nЭто нормально, если статусов мало и они редко меняются.\n\nНо если статусы управляются бизнесом, имеют переводы, порядок, настройки, права переходов, лучше отдельная таблица:\n\n```sql\nCREATE TABLE order_statuses (\n    code TEXT PRIMARY KEY,\n    title TEXT NOT NULL\n);\n```\n\nИ потом:\n\n```sql\nstatus_code TEXT NOT NULL REFERENCES order_statuses(code)\n```\n\n---\n\n### 5. Забывать про составные ограничения\n\nНапример, нужно запретить одинаковые имена файлов внутри одной папки пользователя.\n\nПлохо:\n\n```sql\nfilename TEXT UNIQUE\n```\n\nТак одинаковое имя файла нельзя будет использовать вообще никому.\n\nЛучше:\n\n```sql\nUNIQUE (user_id, folder_id, filename)\n```\n\nТогда уникальность будет в правильной области.\n\n---\n\n### Итог\n\n`Constraints` в SQL — это ограничения, которые база применяет к данным, чтобы они оставались корректными.\n\nОсновные виды:\n\n```text\nNOT NULL    -> значение обязательно;\nUNIQUE      -> значение или комбинация значений не повторяется;\nPRIMARY KEY -> главный уникальный идентификатор строки;\nFOREIGN KEY -> ссылка на строку в другой таблице;\nCHECK       -> произвольное условие для значений строки;\nDEFAULT     -> значение по умолчанию;\nEXCLUSION   -> запрет конфликтующих строк по операторам, например пересечений диапазонов.\n```\n\nДля нормальной схемы БД constraints — это базовый уровень защиты. Они не заменяют бизнес-логику приложения, но фиксируют критически важные правила там, где данные реально хранятся."
