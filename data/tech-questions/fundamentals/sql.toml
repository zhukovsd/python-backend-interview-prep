[[questions]]
  id = 48
  question = "Какие сущности есть в PostgreSQL?"
  answer = "### Общая идея\n\nВ PostgreSQL под «сущностями» обычно имеют в виду **объекты базы данных**: базы, схемы, таблицы, индексы, представления, функции, роли и другие элементы, из которых состоит PostgreSQL-система.\n\nВажно понимать иерархию:\n\n```text\nPostgreSQL cluster\n  ├── database\n  │     ├── schema\n  │     │     ├── table\n  │     │     ├── view\n  │     │     ├── index\n  │     │     ├── sequence\n  │     │     ├── function\n  │     │     ├── procedure\n  │     │     ├── type\n  │     │     ├── trigger\n  │     │     └── ...\n  │     └── ...\n  ├── roles\n  └── tablespaces\n```\n\nВ документации PostgreSQL указано, что **database cluster** содержит одну или несколько баз данных, роли и некоторые другие объекты являются общими для всего кластера, а база содержит схемы; схемы, в свою очередь, содержат таблицы и другие именованные объекты: типы данных, функции, операторы и т.д. \n\n---\n\n### Database cluster\n\n**Кластер PostgreSQL** — это не кластер в смысле «много серверов», а набор баз данных, управляемых одним экземпляром PostgreSQL.\n\nОдин запущенный PostgreSQL-инстанс обычно управляет одним database cluster.\n\nВнутри cluster находятся:\n\n```text\ndatabases;\nroles;\ntablespaces;\nглобальные настройки;\nсистемные каталоги;\nWAL;\nслужебные данные.\n```\n\nПримерно:\n\n```text\nPostgreSQL instance\n  └── database cluster\n        ├── postgres\n        ├── app_db\n        ├── test_db\n        ├── roles\n        └── tablespaces\n```\n\nКлиентское подключение в PostgreSQL работает только с одной конкретной базой данных внутри кластера. То есть если приложение подключилось к `app_db`, оно не может напрямую делать обычный `SELECT` из таблицы другой базы `test_db` в том же запросе. \n\n---\n\n### Database\n\n**Database** — это отдельная база данных внутри PostgreSQL-кластера.\n\nПример создания:\n\n```sql\nCREATE DATABASE shop_db;\n```\n\nВнутри базы данных находятся схемы и объекты этих схем:\n\n```text\nschemas;\ntables;\nviews;\nindexes;\nfunctions;\nprocedures;\ntypes;\nextensions;\npublications;\nsubscriptions;\n```\n\nОбычно в backend-проекте одна база соответствует одному приложению или одному сервису:\n\n```text\nnotification_service_db;\ncloud_storage_db;\nbilling_db;\nanalytics_db;\n```\n\nПри подключении приложение указывает конкретную БД:\n\n```text\nhost=localhost\nport=5432\ndbname=notification_service_db\nuser=app_user\npassword=...\n```\n\n---\n\n### Schema\n\n**Schema** — это пространство имён внутри базы данных.\n\nСхема помогает группировать объекты и избегать конфликтов имён.\n\nПример:\n\n```sql\nCREATE SCHEMA billing;\nCREATE SCHEMA auth;\nCREATE SCHEMA storage;\n```\n\nТогда можно иметь таблицы:\n\n```sql\nbilling.users\nauth.users\nstorage.users\n```\n\nЭто разные таблицы, потому что они лежат в разных схемах.\n\nPostgreSQL описывает schema как namespace, содержащий именованные объекты: таблицы, типы данных, функции, операторы. Имена объектов могут повторяться в разных схемах. \n\nПо умолчанию часто используется схема:\n\n```sql\npublic\n```\n\nНапример:\n\n```sql\npublic.users\npublic.orders\npublic.notifications\n```\n\nЕсли схема не указана явно, PostgreSQL ищет объект через `search_path`.\n\nПример:\n\n```sql\nSELECT * FROM users;\n```\n\nPostgreSQL должен понять, какую именно таблицу `users` искать. Он смотрит в схемы из `search_path`.\n\n---\n\n### Table\n\n**Table** — основная сущность для хранения данных.\n\nПример:\n\n```sql\nCREATE TABLE users (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    username TEXT NOT NULL,\n    email TEXT NOT NULL UNIQUE,\n    created_at TIMESTAMP NOT NULL DEFAULT now()\n);\n```\n\nТаблица состоит из:\n\n```text\nколонок;\nстрок;\nтипов данных;\nconstraints;\nиндексов;\nтриггеров;\nправ доступа;\nстатистики.\n```\n\nPostgreSQL `CREATE TABLE` создаёт новую пустую таблицу в текущей базе данных; если указана схема, таблица создаётся в ней, иначе — в текущей схеме. \n\nПримеры таблиц в backend:\n\n```text\nusers;\norders;\npayments;\nnotifications;\nfiles;\ncomments;\nsessions;\nrefresh_tokens;\n```\n\n---\n\n### Column\n\n**Column** — колонка таблицы.\n\nПример:\n\n```sql\nCREATE TABLE orders (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    user_id BIGINT NOT NULL,\n    amount NUMERIC NOT NULL,\n    status TEXT NOT NULL,\n    created_at TIMESTAMP NOT NULL DEFAULT now()\n);\n```\n\nЗдесь колонки:\n\n```text\nid;\nuser_id;\namount;\nstatus;\ncreated_at.\n```\n\nУ каждой колонки есть тип:\n\n```text\nBIGINT;\nTEXT;\nNUMERIC;\nBOOLEAN;\nTIMESTAMP;\nUUID;\nJSONB;\nINTEGER;\nDATE.\n```\n\nКолонка может иметь ограничения:\n\n```sql\nemail TEXT NOT NULL UNIQUE\n```\n\nИли значение по умолчанию:\n\n```sql\ncreated_at TIMESTAMP NOT NULL DEFAULT now()\n```\n\n---\n\n### Row\n\n**Row** — строка таблицы, конкретная запись.\n\nНапример:\n\n```text\nid | username | email\n---+----------+------------------\n1  | alex     | alex@example.com\n2  | bob      | bob@example.com\n```\n\nКаждая строка — это один объект предметной области:\n\n```text\nодин пользователь;\nодин заказ;\nодин файл;\nодно уведомление;\nодин платёж.\n```\n\nС точки зрения PostgreSQL строка имеет не только пользовательские поля, но и служебную MVCC-информацию, например версии строк, транзакционные id и т.д. Но на прикладном уровне обычно говорят просто: таблица состоит из строк и колонок.\n\n---\n\n### Constraint\n\n**Constraint** — ограничение целостности данных.\n\nПримеры:\n\n```sql\nCREATE TABLE users (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    email TEXT NOT NULL UNIQUE,\n    age INTEGER CHECK (age >= 0)\n);\n```\n\nОсновные constraints:\n\n```text\nNOT NULL;\nUNIQUE;\nPRIMARY KEY;\nFOREIGN KEY;\nCHECK;\nEXCLUDE.\n```\n\nПримеры:\n\n```sql\nPRIMARY KEY (id)\n```\n\n```sql\nUNIQUE (email)\n```\n\n```sql\nCHECK (amount > 0)\n```\n\n```sql\nFOREIGN KEY (user_id) REFERENCES users(id)\n```\n\nPostgreSQL описывает constraint как SQL-объект, который определяет допустимые значения в таблице; constraints проверяются при вставке или обновлении строк. \n\n---\n\n### Primary Key\n\n**Primary Key** — главный уникальный идентификатор строки.\n\nПример:\n\n```sql\nCREATE TABLE users (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    username TEXT NOT NULL\n);\n```\n\nОбычно primary key используется:\n\n```text\nдля однозначного поиска строки;\nдля связей через foreign key;\nдля ORM;\nдля индексации;\nдля ссылочной целостности.\n```\n\nPrimary key фактически означает:\n\n```text\nзначение уникально;\nзначение не NULL;\nэто главный идентификатор строки.\n```\n\n---\n\n### Foreign Key\n\n**Foreign Key** — внешний ключ, связь с другой таблицей.\n\nПример:\n\n```sql\nCREATE TABLE orders (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    user_id BIGINT NOT NULL REFERENCES users(id),\n    amount NUMERIC NOT NULL\n);\n```\n\nЗдесь:\n\n```text\norders.user_id -> users.id\n```\n\nТо есть заказ принадлежит пользователю.\n\nForeign key защищает от битых ссылок. Нельзя создать заказ на пользователя, которого нет:\n\n```sql\nINSERT INTO orders (user_id, amount)\nVALUES (999, 100);\n```\n\nЕсли `users.id = 999` не существует, PostgreSQL отклонит вставку.\n\n---\n\n### Index\n\n**Index** — структура для ускорения поиска, сортировки, соединений и проверки уникальности.\n\nПример:\n\n```sql\nCREATE INDEX orders_user_id_idx\nON orders (user_id);\n```\n\nИндекс помогает запросам вида:\n\n```sql\nSELECT *\nFROM orders\nWHERE user_id = 123;\n```\n\nPostgreSQL указывает, что `CREATE INDEX` создаёт индекс по колонкам указанного relation — таблицы или materialized view; индексы в основном используются для повышения производительности. PostgreSQL поддерживает B-tree, hash, GiST, SP-GiST, GIN и BRIN index methods. \n\nЧастые индексы:\n\n```sql\nCREATE INDEX orders_user_created_idx\nON orders (user_id, created_at DESC);\n```\n\n```sql\nCREATE UNIQUE INDEX users_email_unique_idx\nON users (email);\n```\n\n```sql\nCREATE INDEX products_data_gin_idx\nON products USING GIN (data);\n```\n\nВажный момент: индекс — это отдельный объект БД, но он связан с таблицей.\n\n---\n\n### Sequence\n\n**Sequence** — генератор чисел.\n\nЧасто используется для автоинкрементных id.\n\nПример:\n\n```sql\nCREATE SEQUENCE users_id_seq;\n```\n\nПри использовании identity-колонки PostgreSQL создаёт sequence неявно:\n\n```sql\nCREATE TABLE users (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    username TEXT NOT NULL\n);\n```\n\nPostgreSQL описывает identity column как специальную колонку, значение которой генерируется автоматически из неявной sequence; sequence создаёт генератор чисел. \n\nМожно вручную получить следующее значение:\n\n```sql\nSELECT nextval('users_id_seq');\n```\n\nSequence — отдельная сущность, потому что она живёт независимо от строк таблицы и не откатывает выданные значения при `ROLLBACK`.\n\n---\n\n### View\n\n**View** — сохранённый именованный `SELECT`.\n\nПример:\n\n```sql\nCREATE VIEW active_users AS\nSELECT id, username, email\nFROM users\nWHERE is_active = true;\n```\n\nИспользование:\n\n```sql\nSELECT *\nFROM active_users;\n```\n\nОбычный view не хранит данные физически. PostgreSQL указывает: `CREATE VIEW` определяет view запроса, view не материализуется физически, а запрос выполняется каждый раз при обращении к view. \n\nView используют для:\n\n```text\nупрощения сложных SELECT;\nсокрытия колонок;\nограничения строк;\nотчётов;\nстабильного интерфейса чтения.\n```\n\n---\n\n### Materialized View\n\n**Materialized View** — материализованное представление.\n\nОно похоже на view, но хранит результат запроса физически.\n\nПример:\n\n```sql\nCREATE MATERIALIZED VIEW monthly_sales AS\nSELECT\n    date_trunc('month', created_at) AS month,\n    SUM(amount) AS total_amount\nFROM orders\nWHERE status = 'paid'\nGROUP BY date_trunc('month', created_at);\n```\n\nОбычный `VIEW` каждый раз выполняет запрос заново.\n\n`MATERIALIZED VIEW` хранит результат, но его нужно обновлять:\n\n```sql\nREFRESH MATERIALIZED VIEW monthly_sales;\n```\n\nИспользуют для тяжёлых отчётов и аналитики, когда не нужна абсолютная актуальность в каждую миллисекунду.\n\n---\n\n### Function\n\n**Function** — хранимая функция в базе данных.\n\nПример:\n\n```sql\nCREATE FUNCTION normalize_email(email TEXT)\nRETURNS TEXT\nLANGUAGE sql\nIMMUTABLE\nAS $$\n    SELECT lower(trim(email));\n$$;\n```\n\nВызов:\n\n```sql\nSELECT normalize_email(' TEST@EXAMPLE.COM ');\n```\n\nФункции можно использовать внутри SQL:\n\n```sql\nSELECT *\nFROM users\nWHERE normalize_email(email) = normalize_email('test@example.com');\n```\n\nФункция обычно возвращает значение:\n\n```text\nчисло;\nстроку;\nboolean;\nдату;\nстроку таблицы;\nтабличный результат.\n```\n\n---\n\n### Procedure\n\n**Procedure** — хранимая процедура.\n\nПример:\n\n```sql\nCREATE PROCEDURE deactivate_old_users()\nLANGUAGE plpgsql\nAS $$\nBEGIN\n    UPDATE users\n    SET is_active = false\n    WHERE last_login_at < now() - interval '1 year';\nEND;\n$$;\n```\n\nВызов:\n\n```sql\nCALL deactivate_old_users();\n```\n\nОтличие от функции:\n\n```text\nfunction -> используется как выражение и возвращает значение;\nprocedure -> вызывается через CALL и обычно выполняет действие.\n```\n\n---\n\n### Trigger\n\n**Trigger** — объект, который автоматически срабатывает при событии на таблице или view.\n\nСобытия:\n\n```text\nINSERT;\nUPDATE;\nDELETE;\nTRUNCATE.\n```\n\nПример:\n\n```sql\nCREATE TRIGGER set_updated_at\nBEFORE UPDATE ON users\nFOR EACH ROW\nEXECUTE FUNCTION update_updated_at_column();\n```\n\nТипичный кейс:\n\n```text\nавтоматически обновить updated_at;\nзаписать audit log;\nпроверить сложное правило;\nсинхронизировать служебную таблицу;\nзапретить некоторые операции.\n```\n\nТриггер сам по себе обычно вызывает trigger function.\n\n---\n\n### Rule\n\n**Rule** — правило переписывания запроса.\n\nВ PostgreSQL rules связаны с rewrite system. Например, обычные views в PostgreSQL исторически реализуются через rule system: при обращении к view запрос переписывается на запрос к базовым таблицам. В документации по views указано, что view фактически является relation с правилом `ON SELECT DO INSTEAD`. \n\nНа практике обычный backend-разработчик редко пишет rules вручную. Чаще используются:\n\n```text\nviews;\ntriggers;\nfunctions;\nconstraints.\n```\n\n---\n\n### Type\n\n**Type** — тип данных.\n\nPostgreSQL имеет встроенные типы:\n\n```text\ninteger;\nbigint;\ntext;\nboolean;\nnumeric;\ntimestamp;\ndate;\nuuid;\njsonb;\narray;\ninet.\n```\n\nНо можно создавать пользовательские типы.\n\nНапример enum:\n\n```sql\nCREATE TYPE notification_type AS ENUM ('like', 'comment', 'repost');\n```\n\nИспользование:\n\n```sql\nCREATE TABLE notifications (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    type notification_type NOT NULL,\n    text TEXT NOT NULL\n);\n```\n\nPostgreSQL хранит информацию о типах в `pg_type`; base types и enum types создаются через `CREATE TYPE`, domains — через `CREATE DOMAIN`, а для каждой таблицы автоматически создаётся composite type, представляющий структуру строки таблицы. \n\n---\n\n### Domain\n\n**Domain** — пользовательский тип поверх существующего типа с ограничениями.\n\nПример:\n\n```sql\nCREATE DOMAIN positive_amount AS NUMERIC\nCHECK (VALUE > 0);\n```\n\nИспользование:\n\n```sql\nCREATE TABLE payments (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    amount positive_amount NOT NULL\n);\n```\n\nТеперь `amount` должен быть положительным.\n\nDomain полезен, когда одно и то же ограничение повторяется во многих таблицах.\n\nНапример:\n\n```text\nemail;\npositive_amount;\nnon_empty_text;\npercent_value;\nphone_number.\n```\n\n---\n\n### Enum\n\n**Enum** — перечислимый тип.\n\nПример:\n\n```sql\nCREATE TYPE order_status AS ENUM ('new', 'paid', 'cancelled');\n```\n\nИспользование:\n\n```sql\nCREATE TABLE orders (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    status order_status NOT NULL\n);\n```\n\nEnum удобен, когда набор значений мал и редко меняется.\n\nНапример:\n\n```text\nnotification_type;\norder_status;\nuser_role_type;\npayment_status.\n```\n\nЕсли значения часто меняются и имеют дополнительные атрибуты, лучше отдельная справочная таблица.\n\n---\n\n### Operator\n\n**Operator** — оператор PostgreSQL.\n\nНапример:\n\n```sql\n=\n>\n<\n+\n-\n@\n@>\n&&\n```\n\nPostgreSQL позволяет создавать пользовательские операторы. Это редко нужно в обычной backend-разработке, но важно для расширяемости PostgreSQL.\n\nНапример, многие расширения добавляют свои операторы:\n\n```text\nPostGIS;\npg_trgm;\nltree;\nhstore.\n```\n\n---\n\n### Extension\n\n**Extension** — расширение PostgreSQL.\n\nПример:\n\n```sql\nCREATE EXTENSION IF NOT EXISTS pgcrypto;\n```\n\nИли:\n\n```sql\nCREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";\n```\n\nИли:\n\n```sql\nCREATE EXTENSION IF NOT EXISTS postgis;\n```\n\nРасширение может добавить:\n\n```text\nфункции;\nтипы;\nоператоры;\nиндексы;\nтаблицы;\nviews;\nслужебные объекты.\n```\n\nПримеры популярных extensions:\n\n```text\npgcrypto;\nuuid-ossp;\npostgis;\npg_trgm;\nbtree_gin;\nbtree_gist;\ncitext;\nhstore;\npg_stat_statements.\n```\n\n---\n\n### Role\n\n**Role** — роль PostgreSQL.\n\nВ PostgreSQL роль может быть пользователем, группой или и тем и другим, в зависимости от атрибутов.\n\nПример:\n\n```sql\nCREATE ROLE app_user LOGIN PASSWORD 'secret';\n```\n\nРоль с правом логина:\n\n```sql\nCREATE ROLE readonly_user LOGIN PASSWORD 'secret';\n```\n\nГрупповая роль:\n\n```sql\nCREATE ROLE developers;\n```\n\nВыдача прав:\n\n```sql\nGRANT SELECT ON users TO readonly_user;\n```\n\nВ PostgreSQL права выдаются ролям. Документация `GRANT` показывает, что права могут выдаваться на объекты базы данных: таблицы, колонки, views, sequences, databases, schemas, tablespaces, functions, procedures, types и другие объекты. \n\n---\n\n### Privilege\n\n**Privilege** — право доступа.\n\nПримеры прав:\n\n```text\nSELECT;\nINSERT;\nUPDATE;\nDELETE;\nTRUNCATE;\nREFERENCES;\nTRIGGER;\nUSAGE;\nEXECUTE;\nCREATE;\nCONNECT.\n```\n\nПример:\n\n```sql\nGRANT SELECT, INSERT ON orders TO app_user;\n```\n\n```sql\nGRANT USAGE ON SCHEMA billing TO app_user;\n```\n\n```sql\nGRANT EXECUTE ON FUNCTION normalize_email(TEXT) TO app_user;\n```\n\nПри создании объекта у него появляется владелец. По умолчанию обычно только владелец или superuser может полноценно управлять объектом, а другим ролям права нужно выдавать через `GRANT`. \n\n---\n\n### Tablespace\n\n**Tablespace** — место хранения объектов на файловой системе.\n\nПример:\n\n```sql\nCREATE TABLESPACE fast_storage\nLOCATION '/mnt/fast_disk/postgres';\n```\n\nТаблицу можно создать в tablespace:\n\n```sql\nCREATE TABLE large_events (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    payload JSONB NOT NULL\n) TABLESPACE fast_storage;\n```\n\nTablespace используют, когда нужно физически разнести данные:\n\n```text\nтаблицы на один диск;\nиндексы на другой диск;\nархивные данные на медленное хранилище;\nгорячие данные на быстрое хранилище.\n```\n\nРоли и tablespaces относятся к глобальным объектам кластера. Например, `pg_dumpall` выгружает глобальные объекты, общие для всех баз в кластере: роли, tablespaces и grants для configuration parameters. \n\n---\n\n### Database Object Owner\n\nУ большинства объектов есть владелец.\n\nНапример:\n\n```text\nвладелец таблицы;\nвладелец схемы;\nвладелец функции;\nвладелец view;\nвладелец sequence.\n```\n\nПример смены владельца:\n\n```sql\nALTER TABLE orders OWNER TO app_owner;\n```\n\nВладелец важен для:\n\n```text\nизменения объекта;\nудаления объекта;\nвыдачи прав;\nбезопасности;\nмиграций.\n```\n\n---\n\n### Foreign Table\n\n**Foreign Table** — внешняя таблица, данные которой находятся не в текущей PostgreSQL-базе, а во внешнем источнике.\n\nОбычно используется через FDW — Foreign Data Wrapper.\n\nНапример, `postgres_fdw` позволяет подключаться к другой PostgreSQL-базе.\n\nПримерная схема:\n\n```text\nlocal PostgreSQL\n  └── foreign table\n        └── remote PostgreSQL table\n```\n\nForeign table выглядит как таблица, но данные берутся из внешнего источника.\n\n---\n\n### Foreign Data Wrapper, Foreign Server, User Mapping\n\nДля внешних таблиц есть несколько сущностей:\n\n```text\nforeign data wrapper;\nforeign server;\nuser mapping;\nforeign table.\n```\n\nПримерно:\n\n```sql\nCREATE EXTENSION postgres_fdw;\n\nCREATE SERVER remote_pg\nFOREIGN DATA WRAPPER postgres_fdw\nOPTIONS (host 'remote-host', dbname 'remote_db', port '5432');\n\nCREATE USER MAPPING FOR app_user\nSERVER remote_pg\nOPTIONS (user 'remote_user', password 'secret');\n\nCREATE FOREIGN TABLE remote_users (\n    id BIGINT,\n    username TEXT\n)\nSERVER remote_pg\nOPTIONS (schema_name 'public', table_name 'users');\n```\n\nЭто уже более продвинутый уровень PostgreSQL.\n\n---\n\n### Publication\n\n**Publication** — объект logical replication.\n\nPublication определяет, какие изменения и из каких таблиц публикуются для подписчиков.\n\nПример:\n\n```sql\nCREATE PUBLICATION app_publication\nFOR TABLE users, orders;\n```\n\nИспользуется в logical replication:\n\n```text\npublisher -> publication -> subscriber\n```\n\n---\n\n### Subscription\n\n**Subscription** — подписка на publication другого PostgreSQL-сервера.\n\nПример:\n\n```sql\nCREATE SUBSCRIPTION app_subscription\nCONNECTION 'host=primary dbname=app_db user=repl password=secret'\nPUBLICATION app_publication;\n```\n\nИспользуется для logical replication.\n\nСмысл:\n\n```text\nодин PostgreSQL публикует изменения;\nдругой PostgreSQL подписывается и применяет их.\n```\n\n---\n\n### Policy\n\n**Policy** — политика Row Level Security.\n\nRLS позволяет ограничивать доступ к строкам таблицы.\n\nПример:\n\n```sql\nALTER TABLE documents ENABLE ROW LEVEL SECURITY;\n\nCREATE POLICY user_documents_policy\nON documents\nUSING (user_id = current_setting('app.current_user_id')::bigint);\n```\n\nСмысл:\n\n```text\nпользователь видит только свои документы.\n```\n\nRLS часто применяется в multi-tenant системах, где одна таблица хранит данные многих клиентов или пользователей.\n\n---\n\n### Collation\n\n**Collation** — правила сравнения и сортировки строк.\n\nНапример, сортировка текста может отличаться в зависимости от языка и локали.\n\nПример:\n\n```sql\nORDER BY name COLLATE \"ru_RU\";\n```\n\nCollation влияет на:\n\n```text\nсортировку;\nсравнение строк;\nиндексы по текстовым колонкам;\nповедение ORDER BY.\n```\n\n---\n\n### Cast\n\n**Cast** — преобразование типов.\n\nПример:\n\n```sql\nSELECT '123'::integer;\n```\n\nИли:\n\n```sql\nSELECT CAST('2026-06-30' AS date);\n```\n\nPostgreSQL хранит пути преобразования типов в системном каталоге `pg_cast`; там находятся встроенные и пользовательские conversion paths. \n\n---\n\n### Aggregate\n\n**Aggregate function** — агрегатная функция.\n\nВстроенные:\n\n```sql\nCOUNT(*)\nSUM(amount)\nAVG(price)\nMIN(created_at)\nMAX(created_at)\n```\n\nPostgreSQL позволяет создавать пользовательские агрегатные функции.\n\nНапример, можно создать свой агрегат для специфической бизнес-логики, но это редко нужно в обычной backend-разработке.\n\n---\n\n### Operator Class и Operator Family\n\nЭто сущности, связанные с индексами.\n\nНапример, чтобы PostgreSQL понимал, как индексировать и сравнивать значения определённого типа, используются operator classes.\n\nОбычно backend-разработчик сталкивается с этим косвенно:\n\n```sql\nCREATE INDEX users_email_trgm_idx\nON users USING GIN (email gin_trgm_ops);\n```\n\nЗдесь:\n\n```text\ngin_trgm_ops\n```\n\n— operator class для trigram-поиска через `pg_trgm`.\n\n---\n\n### Language\n\n**Procedural language** — язык для функций и процедур.\n\nПримеры:\n\n```text\nsql;\nplpgsql;\nplpython3u;\nplperl;\n```\n\nОбычно в PostgreSQL чаще всего используют:\n\n```sql\nLANGUAGE sql\n```\n\nили:\n\n```sql\nLANGUAGE plpgsql\n```\n\n`plpgsql` — стандартный процедурный язык PostgreSQL для функций, процедур и триггеров.\n\n---\n\n### Event Trigger\n\n**Event Trigger** — триггер на DDL-события.\n\nОбычный trigger срабатывает на `INSERT`, `UPDATE`, `DELETE` в таблице.\n\nEvent trigger срабатывает на события уровня схемы, например:\n\n```text\nCREATE TABLE;\nALTER TABLE;\nDROP TABLE;\nCREATE FUNCTION;\n```\n\nИспользуется редко, обычно для:\n\n```text\nаудита DDL;\nконтроля изменений схемы;\nзапрета некоторых операций;\nинфраструктурных задач.\n```\n\n---\n\n### System Catalogs\n\n**System catalogs** — системные таблицы PostgreSQL, где хранится metadata о базе.\n\nПримеры:\n\n```text\npg_class;\npg_attribute;\npg_type;\npg_proc;\npg_constraint;\npg_namespace;\npg_roles;\npg_index.\n```\n\nPostgreSQL указывает, что system catalogs — это место, где СУБД хранит schema metadata, например информацию о таблицах и колонках, а также внутреннюю служебную информацию; системные каталоги PostgreSQL являются обычными таблицами, но менять их вручную обычно нельзя и опасно. \n\nНапример:\n\n```sql\nSELECT *\nFROM pg_class;\n```\n\n`pg_class` описывает таблицы и другие relation-like объекты: индексы, sequences, views, materialized views, composite types, TOAST tables. \n\n---\n\n### Information Schema\n\n**information_schema** — стандартный SQL-интерфейс для просмотра метаданных.\n\nНапример, посмотреть таблицы:\n\n```sql\nSELECT table_schema, table_name\nFROM information_schema.tables\nWHERE table_schema = 'public';\n```\n\nПосмотреть колонки:\n\n```sql\nSELECT column_name, data_type\nFROM information_schema.columns\nWHERE table_name = 'users';\n```\n\nВ PostgreSQL часто используют и `information_schema`, и системные каталоги `pg_catalog`.\n\nРазница:\n\n```text\ninformation_schema -> более стандартный SQL-подход;\npg_catalog -> PostgreSQL-specific, обычно подробнее и мощнее.\n```\n\n---\n\n### TOAST table\n\n**TOAST** — служебный механизм PostgreSQL для хранения больших значений.\n\nНапример, если в таблице есть большие `TEXT`, `BYTEA`, `JSONB`, PostgreSQL может вынести большие значения во внутреннюю TOAST-таблицу.\n\nОбычно разработчик не управляет TOAST напрямую, но важно знать, что большие значения могут храниться отдельно.\n\nПримеры данных, которые могут задействовать TOAST:\n\n```text\nбольшой JSONB;\nдлинный TEXT;\nбинарные данные BYTEA;\nбольшие массивы.\n```\n\n---\n\n### Partitioned Table и Partition\n\n**Partitioned table** — партиционированная таблица.\n\nПример:\n\n```sql\nCREATE TABLE events (\n    id BIGINT GENERATED ALWAYS AS IDENTITY,\n    created_at DATE NOT NULL,\n    payload JSONB NOT NULL\n) PARTITION BY RANGE (created_at);\n```\n\nПартиции:\n\n```sql\nCREATE TABLE events_2026_06\nPARTITION OF events\nFOR VALUES FROM ('2026-06-01') TO ('2026-07-01');\n```\n\nСущности:\n\n```text\npartitioned table -> логическая родительская таблица;\npartition -> физическая дочерняя таблица с частью данных.\n```\n\nПартиционирование используют для больших таблиц:\n\n```text\nлоги;\nсобытия;\nаудит;\nтранзакции;\nисторические данные.\n```\n\n---\n\n### Temporary Table\n\n**Temporary table** — временная таблица, существующая в рамках сессии или транзакции.\n\nПример:\n\n```sql\nCREATE TEMP TABLE temp_user_ids (\n    user_id BIGINT\n);\n```\n\nИспользуется для:\n\n```text\nпромежуточных расчётов;\nсложных batch-операций;\nимпорта данных;\nвременных наборов id.\n```\n\nTemporary tables находятся в специальных temporary schemas.\n\n---\n\n### Unlogged Table\n\n**Unlogged table** — таблица, изменения которой не пишутся в WAL обычным образом.\n\nПример:\n\n```sql\nCREATE UNLOGGED TABLE staging_events (\n    id BIGINT,\n    payload JSONB\n);\n```\n\nПлюсы:\n\n```text\nбыстрее запись;\nменьше WAL.\n```\n\nМинусы:\n\n```text\nне crash-safe как обычная таблица;\nне подходит для критичных данных;\nне реплицируется физической репликацией как обычные WAL-logged изменения.\n```\n\nИспользуется для временных/staging-данных.\n\n---\n\n### Large Object\n\n**Large Object** — специальный механизм PostgreSQL для хранения больших бинарных объектов.\n\nНа практике в backend чаще хранят файлы не в PostgreSQL, а в S3/MinIO и кладут в БД только metadata:\n\n```text\nfile_path;\nbucket;\nobject_key;\nsize;\ncontent_type;\nowner_id.\n```\n\nНо large objects как сущность в PostgreSQL существуют.\n\n---\n\n### Configuration Parameter\n\nPostgreSQL имеет параметры конфигурации:\n\n```text\nwork_mem;\nshared_buffers;\nmaintenance_work_mem;\nsearch_path;\nstatement_timeout;\nlock_timeout;\nsynchronous_commit;\nwal_level.\n```\n\nЧасть прав может выдаваться и на configuration parameters через `GRANT`, что отражено в документации `GRANT`. \n\n---\n\n### Relation\n\nВ PostgreSQL часто встречается термин **relation**.\n\nЭто не только обычная таблица.\n\nВ `pg_class` relation-like объектами считаются:\n\n```text\ntables;\nindexes;\nsequences;\nviews;\nmaterialized views;\ncomposite types;\nTOAST tables;\nforeign tables.\n```\n\nPostgreSQL прямо говорит, что `pg_class` описывает таблицы и другие объекты, имеющие колонки или похожие на таблицы; для всех этих типов используется термин “relations”.\n\nТо есть когда в ошибке или документации PostgreSQL пишет `relation`, это может быть:\n\n```text\nтаблица;\nview;\nsequence;\nindex;\nmaterialized view;\nforeign table.\n```\n\nНапример ошибка:\n\n```text\nrelation \"users\" does not exist\n```\n\nобычно означает, что PostgreSQL не нашёл таблицу/view/relation с таким именем в текущем `search_path`.\n\n---\n\n### Namespace\n\n**Namespace** в PostgreSQL практически соответствует schema.\n\nВ системных каталогах schema хранится как namespace.\n\nНапример, `pg_namespace` хранит схемы.\n\nПоэтому внутри PostgreSQL можно встретить термины:\n\n```text\nschema;\nnamespace.\n```\n\nДля прикладной разработки обычно достаточно говорить `schema`.\n\n---\n\n### OID\n\n**OID** — object identifier, внутренний идентификатор объектов PostgreSQL.\n\nPostgreSQL использует OID как внутренние primary keys для разных системных таблиц. Тип `oid` представляет object identifier. \n\nНапример, в системных каталогах объекты имеют OID:\n\n```sql\nSELECT oid, relname\nFROM pg_class\nWHERE relname = 'users';\n```\n\nВ обычных прикладных таблицах OID почти никогда не используют напрямую.\n\n---\n\n### Как посмотреть сущности через psql\n\nВ `psql` есть meta-команды.\n\nПосмотреть базы:\n\n```sql\n\\l\n```\n\nПосмотреть схемы:\n\n```sql\n\\dn\n```\n\nПосмотреть таблицы:\n\n```sql\n\\dt\n```\n\nПосмотреть views:\n\n```sql\n\\dv\n```\n\nПосмотреть materialized views:\n\n```sql\n\\dm\n```\n\nПосмотреть sequences:\n\n```sql\n\\ds\n```\n\nПосмотреть функции:\n\n```sql\n\\df\n```\n\nПосмотреть индексы:\n\n```sql\n\\di\n```\n\nОписать таблицу:\n\n```sql\n\\d users\n```\n\nПодробно:\n\n```sql\n\\d+ users\n```\n\n---\n\n### Как посмотреть сущности через SQL\n\nСписок таблиц:\n\n```sql\nSELECT schemaname, tablename\nFROM pg_tables\nWHERE schemaname NOT IN ('pg_catalog', 'information_schema');\n```\n\nСписок views:\n\n```sql\nSELECT schemaname, viewname\nFROM pg_views\nWHERE schemaname NOT IN ('pg_catalog', 'information_schema');\n```\n\nСписок индексов:\n\n```sql\nSELECT schemaname, tablename, indexname, indexdef\nFROM pg_indexes\nWHERE schemaname = 'public';\n```\n\nСписок функций:\n\n```sql\nSELECT n.nspname AS schema_name,\n       p.proname AS function_name\nFROM pg_proc p\nJOIN pg_namespace n ON n.oid = p.pronamespace\nWHERE n.nspname = 'public';\n```\n\nСписок constraints:\n\n```sql\nSELECT conname, contype\nFROM pg_constraint;\n```\n\nТипы constraints в `pg_constraint.contype` обычно:\n\n```text\np -> primary key;\nf -> foreign key;\nu -> unique;\nc -> check;\nx -> exclusion.\n```\n\n---\n\n### Самые важные сущности для backend-разработчика\n\nДля backend-разработки чаще всего реально нужны:\n\n```text\ndatabase;\nschema;\ntable;\ncolumn;\nrow;\nprimary key;\nforeign key;\nconstraint;\nindex;\nsequence;\nview;\nmaterialized view;\nfunction;\nprocedure;\ntrigger;\nrole;\ngrant/privilege;\nextension;\ntype/enum;\npartition;\npublication/subscription, если есть logical replication.\n```\n\nОстальные сущности важны реже, но знать о них полезно:\n\n```text\noperator class;\ncollation;\ncast;\nforeign data wrapper;\nforeign table;\npolicy;\nevent trigger;\ntablespace;\nsystem catalogs;\nTOAST;\nOID.\n```\n\n---\n\n### Краткая таблица\n\n|Сущность|Для чего нужна|\n|---|---|\n|Cluster|Набор баз данных под одним PostgreSQL-инстансом|\n|Database|Отдельная база данных|\n|Schema|Пространство имён внутри базы|\n|Table|Хранит строки данных|\n|Column|Поле таблицы|\n|Row|Конкретная запись|\n|Constraint|Ограничение целостности|\n|Primary Key|Главный идентификатор строки|\n|Foreign Key|Связь между таблицами|\n|Index|Ускорение поиска/сортировки/проверки уникальности|\n|Sequence|Генератор чисел|\n|View|Сохранённый SELECT без физического хранения результата|\n|Materialized View|Сохранённый физический результат SELECT|\n|Function|Хранимая функция, возвращающая значение|\n|Procedure|Хранимая процедура, вызываемая через CALL|\n|Trigger|Автоматическая реакция на INSERT/UPDATE/DELETE|\n|Type|Тип данных|\n|Domain|Тип с ограничением|\n|Enum|Перечислимый тип|\n|Role|Пользователь/группа прав|\n|Tablespace|Физическое место хранения|\n|Extension|Расширение возможностей PostgreSQL|\n|Publication|Публикация изменений для logical replication|\n|Subscription|Подписка на publication|\n|Policy|Row Level Security|\n|System Catalogs|Метаданные PostgreSQL|\n\n---\n\n### Итог\n\nВ PostgreSQL есть много сущностей, но основная иерархия такая:\n\n```text\ncluster\n  -> database\n     -> schema\n        -> tables / views / indexes / sequences / functions / procedures / types / triggers\n```\n\nДля обычной прикладной разработки главные сущности:\n\n```text\nтаблицы;\nколонки;\nстроки;\nключи;\nconstraints;\nиндексы;\nсвязи;\nsequence;\nviews;\nfunctions/procedures;\nroles и privileges.\n```\n\nPostgreSQL является объектно-реляционной СУБД, поэтому кроме обычных таблиц и индексов в нём много расширяемых объектов: пользовательские типы, операторы, агрегаты, operator classes, extensions, policies и foreign tables. Это делает PostgreSQL не просто хранилищем таблиц, а полноценной системой с большим набором объектов, управляющих структурой, доступом, логикой и производительностью данных."
