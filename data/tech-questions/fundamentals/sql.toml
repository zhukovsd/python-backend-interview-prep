  question = "Что делает оператор WITH в SQL?"
  answer = "### Что такое WITH в SQL\n\n`WITH` в SQL используется для создания **временного именованного результата внутри одного запроса**.\n\nТакой временный результат называется:\n\n```text\nCTE — Common Table Expression\n```\n\nПо-русски часто говорят:\n\n```text\nобщее табличное выражение;\nCTE;\nWITH-запрос;\nвременная именованная выборка.\n```\n\nPostgreSQL описывает `WITH` как способ написать вспомогательные выражения для использования в более крупном запросе. Эти выражения называются Common Table Expressions. \n\nОбщий вид:\n\n```sql\nWITH cte_name AS (\n    SELECT ...\n)\nSELECT ...\nFROM cte_name;\n```\n\nТо есть `WITH` позволяет сначала описать промежуточный набор данных, дать ему имя, а потом использовать это имя в основном запросе.\n\n---\n\n### Простой пример\n\nДопустим, есть таблица заказов:\n\n```sql\norders\nid | user_id | amount | status\n---+---------+--------+--------\n1  | 10      | 500    | paid\n2  | 10      | 300    | paid\n3  | 11      | 200    | new\n4  | 12      | 900    | paid\n```\n\nНужно сначала выбрать только оплаченные заказы, а потом посчитать сумму по пользователям.\n\nБез `WITH`:\n\n```sql\nSELECT\n    user_id,\n    SUM(amount) AS total_amount\nFROM orders\nWHERE status = 'paid'\nGROUP BY user_id;\n```\n\nС `WITH`:\n\n```sql\nWITH paid_orders AS (\n    SELECT *\n    FROM orders\n    WHERE status = 'paid'\n)\nSELECT\n    user_id,\n    SUM(amount) AS total_amount\nFROM paid_orders\nGROUP BY user_id;\n```\n\nЗдесь:\n\n```sql\npaid_orders\n```\n\n— это временный результат, который существует только внутри этого SQL-запроса.\n\nОн не создаёт настоящую таблицу в базе. После выполнения запроса `paid_orders` исчезает.\n\n---\n\n### Зачем нужен WITH\n\nГлавная польза `WITH` — сделать сложный запрос понятнее.\n\nНапример, вместо одного большого вложенного запроса:\n\n```sql\nSELECT\n    users.id,\n    users.username,\n    stats.total_amount\nFROM users\nJOIN (\n    SELECT\n        user_id,\n        SUM(amount) AS total_amount\n    FROM orders\n    WHERE status = 'paid'\n    GROUP BY user_id\n) AS stats ON stats.user_id = users.id\nWHERE stats.total_amount > 1000;\n```\n\nМожно написать так:\n\n```sql\nWITH user_order_stats AS (\n    SELECT\n        user_id,\n        SUM(amount) AS total_amount\n    FROM orders\n    WHERE status = 'paid'\n    GROUP BY user_id\n)\nSELECT\n    users.id,\n    users.username,\n    user_order_stats.total_amount\nFROM users\nJOIN user_order_stats ON user_order_stats.user_id = users.id\nWHERE user_order_stats.total_amount > 1000;\n```\n\nЛогика становится читаемее:\n\n```text\n1. Сначала считаем сумму оплаченных заказов по пользователям.\n2. Потом соединяем этот результат с users.\n3. Потом оставляем только пользователей с суммой больше 1000.\n```\n\n---\n\n### WITH как альтернатива подзапросу\n\n`WITH` часто используют вместо подзапроса в `FROM`.\n\nПодзапрос:\n\n```sql\nSELECT *\nFROM (\n    SELECT user_id, COUNT(*) AS orders_count\n    FROM orders\n    GROUP BY user_id\n) AS order_stats\nWHERE orders_count > 5;\n```\n\nТо же самое через `WITH`:\n\n```sql\nWITH order_stats AS (\n    SELECT user_id, COUNT(*) AS orders_count\n    FROM orders\n    GROUP BY user_id\n)\nSELECT *\nFROM order_stats\nWHERE orders_count > 5;\n```\n\nПо смыслу это близко. Разница в читаемости: `WITH` удобнее, когда промежуточных шагов несколько.\n\n---\n\n### Несколько CTE в одном WITH\n\nВ одном `WITH` можно объявить несколько временных выражений.\n\nПример:\n\n```sql\nWITH paid_orders AS (\n    SELECT *\n    FROM orders\n    WHERE status = 'paid'\n),\nuser_totals AS (\n    SELECT\n        user_id,\n        SUM(amount) AS total_amount\n    FROM paid_orders\n    GROUP BY user_id\n),\nbig_customers AS (\n    SELECT *\n    FROM user_totals\n    WHERE total_amount > 1000\n)\nSELECT\n    users.id,\n    users.username,\n    big_customers.total_amount\nFROM users\nJOIN big_customers ON big_customers.user_id = users.id;\n```\n\nЗдесь запрос разбит на понятные этапы:\n\n```text\npaid_orders   -> только оплаченные заказы;\nuser_totals   -> суммы по пользователям;\nbig_customers -> пользователи с суммой больше 1000;\nосновной SELECT -> соединение с таблицей users.\n```\n\nТакой стиль особенно полезен, когда запрос становится длинным: отчёты, аналитика, сложные фильтры, расчёты, агрегаты.\n\n---\n\n### CTE можно использовать как обычную таблицу\n\nПосле объявления CTE можно обращаться к нему в `FROM`, `JOIN`, подзапросах и других частях основного запроса.\n\nПример:\n\n```sql\nWITH active_users AS (\n    SELECT *\n    FROM users\n    WHERE is_active = true\n)\nSELECT\n    active_users.id,\n    active_users.username,\n    orders.id AS order_id\nFROM active_users\nJOIN orders ON orders.user_id = active_users.id;\n```\n\nЗдесь `active_users` ведёт себя как временная таблица результата.\n\nНо важно: это не физическая таблица, не `TEMP TABLE` и не `VIEW`. Это часть одного SQL-запроса.\n\n---\n\n### WITH не создаёт постоянную таблицу\n\n`WITH` не делает это:\n\n```sql\nCREATE TABLE paid_orders AS ...\n```\n\nИ не делает это:\n\n```sql\nCREATE VIEW paid_orders AS ...\n```\n\nCTE существует только во время выполнения текущего запроса.\n\nНапример:\n\n```sql\nWITH paid_orders AS (\n    SELECT *\n    FROM orders\n    WHERE status = 'paid'\n)\nSELECT *\nFROM paid_orders;\n```\n\nПосле этого нельзя выполнить:\n\n```sql\nSELECT *\nFROM paid_orders;\n```\n\nБаза скажет, что такой таблицы нет.\n\n---\n\n### Где WITH особенно полезен\n\n`WITH` удобно использовать, когда:\n\n```text\nзапрос сложный и его нужно разбить на шаги;\nодин промежуточный результат используется несколько раз;\nнужно сделать рекурсивный запрос;\nнужно выполнить INSERT/UPDATE/DELETE и использовать RETURNING;\nнужно улучшить читаемость отчёта;\nнужно избежать глубоко вложенных подзапросов.\n```\n\n---\n\n### Пример: один результат используется несколько раз\n\nДопустим, нужно взять активных пользователей и отдельно посчитать по ним заказы и платежи.\n\n```sql\nWITH active_users AS (\n    SELECT id, username\n    FROM users\n    WHERE is_active = true\n)\nSELECT\n    active_users.id,\n    active_users.username,\n    COUNT(DISTINCT orders.id) AS orders_count,\n    COUNT(DISTINCT payments.id) AS payments_count\nFROM active_users\nLEFT JOIN orders ON orders.user_id = active_users.id\nLEFT JOIN payments ON payments.user_id = active_users.id\nGROUP BY active_users.id, active_users.username;\n```\n\nБез `WITH` условие активных пользователей пришлось бы держать внутри основного запроса или повторять в нескольких местах.\n\n---\n\n### WITH RECURSIVE\n\nОдна из важных возможностей — рекурсивные запросы.\n\nДля этого используется:\n\n```sql\nWITH RECURSIVE\n```\n\nРекурсивный CTE может ссылаться сам на себя.\n\nЭто нужно для иерархий:\n\n```text\nкатегории и подкатегории;\nдерево комментариев;\nструктура папок;\nорганизационная структура сотрудников;\nграф зависимостей;\nродительские и дочерние записи.\n```\n\nПример таблицы категорий:\n\n```sql\nCREATE TABLE categories (\n    id BIGINT PRIMARY KEY,\n    parent_id BIGINT REFERENCES categories(id),\n    name TEXT NOT NULL\n);\n```\n\nДанные:\n\n```text\nid | parent_id | name\n---+-----------+------------\n1  | NULL      | Electronics\n2  | 1         | Phones\n3  | 2         | Smartphones\n4  | 1         | Laptops\n```\n\nНужно получить категорию `Electronics` и все её подкатегории.\n\n```sql\nWITH RECURSIVE category_tree AS (\n    SELECT\n        id,\n        parent_id,\n        name,\n        1 AS level\n    FROM categories\n    WHERE id = 1\n\n    UNION ALL\n\n    SELECT\n        c.id,\n        c.parent_id,\n        c.name,\n        category_tree.level + 1\n    FROM categories c\n    JOIN category_tree ON c.parent_id = category_tree.id\n)\nSELECT *\nFROM category_tree\nORDER BY level, id;\n```\n\nРезультат:\n\n```text\nid | parent_id | name        | level\n---+-----------+-------------+------\n1  | NULL      | Electronics | 1\n2  | 1         | Phones      | 2\n4  | 1         | Laptops     | 2\n3  | 2         | Smartphones | 3\n```\n\nЛогика рекурсивного CTE:\n\n```text\n1. Нерекурсивная часть выбирает стартовую строку.\n2. Рекурсивная часть ищет дочерние строки.\n3. Результаты добавляются к общему набору.\n4. Процесс повторяется, пока новые строки больше не находятся.\n```\n\nPostgreSQL поддерживает `WITH RECURSIVE` для рекурсивных запросов, где CTE может ссылаться сам на себя. ([PostgreSQL](https://www.postgresql.org/docs/current/queries.html?utm_source=chatgpt.com \"Documentation: 18: Chapter 7. Queries\"))\n\n---\n\n### WITH с INSERT / UPDATE / DELETE\n\nВ PostgreSQL `WITH` можно использовать не только с `SELECT`, но и с data-modifying statements: `INSERT`, `UPDATE`, `DELETE`, `MERGE`, если они находятся в CTE. В документации PostgreSQL это отдельно описано как data-modifying statements in `WITH`. \n\nНапример, можно вставить строку и сразу использовать результат `RETURNING`.\n\n```sql\nWITH new_user AS (\n    INSERT INTO users (username, email)\n    VALUES ('alex', 'alex@example.com')\n    RETURNING id, username\n)\nINSERT INTO user_profiles (user_id, bio)\nSELECT id, 'New user profile'\nFROM new_user;\n```\n\nЧто происходит:\n\n```text\n1. CTE new_user вставляет пользователя.\n2. RETURNING возвращает id нового пользователя.\n3. Основной INSERT создаёт профиль для этого пользователя.\n```\n\nЭто удобно, когда нужно связать несколько операций в одном SQL-запросе.\n\n---\n\n### Пример WITH + DELETE RETURNING\n\nДопустим, нужно удалить старые сессии и записать информацию об удалённых сессиях в audit-таблицу.\n\n```sql\nWITH deleted_sessions AS (\n    DELETE FROM user_sessions\n    WHERE expires_at < now()\n    RETURNING id, user_id, expires_at\n)\nINSERT INTO audit_deleted_sessions (session_id, user_id, expires_at, deleted_at)\nSELECT\n    id,\n    user_id,\n    expires_at,\n    now()\nFROM deleted_sessions;\n```\n\nЛогика:\n\n```text\nDELETE удаляет старые сессии;\nRETURNING возвращает удалённые строки;\nINSERT пишет их в audit.\n```\n\nЭто сильная сторона PostgreSQL: можно использовать результат `INSERT/UPDATE/DELETE ... RETURNING` внутри CTE.\n\n---\n\n### WITH и материализация в PostgreSQL\n\nВажный нюанс PostgreSQL: CTE может быть **материализован** или **встроен** оптимизатором в основной запрос.\n\nМатериализация означает, что PostgreSQL сначала вычисляет CTE как промежуточный результат, а потом основной запрос работает с этим результатом.\n\nРаньше CTE в PostgreSQL часто воспринимали как «optimization fence», то есть границу оптимизации. В современных версиях PostgreSQL оптимизатор может встроить CTE в основной запрос, если это безопасно и выгодно. Документация PostgreSQL отдельно описывает `Common Table Expression Materialization`, включая `MATERIALIZED` и `NOT MATERIALIZED`. \n\nПример явной материализации:\n\n```sql\nWITH expensive_query AS MATERIALIZED (\n    SELECT *\n    FROM large_table\n    WHERE status = 'active'\n)\nSELECT *\nFROM expensive_query\nWHERE created_at >= now() - interval '1 day';\n```\n\nПример запроса, где можно попросить не материализовать:\n\n```sql\nWITH filtered_users AS NOT MATERIALIZED (\n    SELECT *\n    FROM users\n    WHERE is_active = true\n)\nSELECT *\nFROM filtered_users\nWHERE created_at >= now() - interval '30 days';\n```\n\nНа практике это нужно не всегда, но важно понимать: `WITH` — не всегда «создай временную таблицу». Оптимизатор может выбрать другой план выполнения.\n\n---\n\n### WITH vs VIEW\n\n`WITH` и `VIEW` похожи тем, что оба позволяют дать имя запросу.\n\nНо разница такая:\n\n|Критерий|WITH / CTE|VIEW|\n|---|---|---|\n|Срок жизни|Только один запрос|Постоянный объект схемы|\n|Создаётся через|`WITH ... AS (...)`|`CREATE VIEW ... AS SELECT ...`|\n|Где доступен|Только внутри текущего запроса|В других запросах тоже|\n|Использование|Разбить сложный запрос на шаги|Переиспользуемое представление|\n|Хранит данные|Нет|Обычный VIEW тоже не хранит данные|\n\nPostgreSQL описывает обычный `VIEW` как представление запроса: оно не хранит данные физически, а запрос выполняется при обращении к view. \n\nПример CTE:\n\n```sql\nWITH active_users AS (\n    SELECT *\n    FROM users\n    WHERE is_active = true\n)\nSELECT *\nFROM active_users;\n```\n\nПример VIEW:\n\n```sql\nCREATE VIEW active_users AS\nSELECT *\nFROM users\nWHERE is_active = true;\n```\n\nПосле создания view можно делать:\n\n```sql\nSELECT *\nFROM active_users;\n```\n\nА CTE доступен только внутри одного запроса.\n\n---\n\n### WITH vs TEMP TABLE\n\n`WITH` также не равен временной таблице.\n\n|Критерий|WITH / CTE|TEMP TABLE|\n|---|---|---|\n|Существует|Только внутри одного запроса|Обычно в рамках сессии/транзакции|\n|Можно индексировать|Нет напрямую|Да|\n|Можно использовать в нескольких запросах|Нет|Да|\n|Подходит для|Логического разбиения запроса|Больших промежуточных данных|\n|Создание|Лёгкое, внутри SQL|Отдельный объект|\n\nПример temp table:\n\n```sql\nCREATE TEMP TABLE active_users_temp AS\nSELECT *\nFROM users\nWHERE is_active = true;\n```\n\nПотом можно:\n\n```sql\nCREATE INDEX ON active_users_temp (id);\n\nSELECT *\nFROM active_users_temp;\n\nSELECT COUNT(*)\nFROM active_users_temp;\n```\n\nCTE так использовать нельзя: он живёт только в одном запросе.\n\n---\n\n### WITH vs подзапрос\n\nПодзапрос хорош, когда логика короткая:\n\n```sql\nSELECT *\nFROM users\nWHERE id IN (\n    SELECT user_id\n    FROM orders\n    WHERE status = 'paid'\n);\n```\n\n`WITH` лучше, когда логика длинная или многошаговая:\n\n```sql\nWITH paid_users AS (\n    SELECT DISTINCT user_id\n    FROM orders\n    WHERE status = 'paid'\n),\nactive_paid_users AS (\n    SELECT users.*\n    FROM users\n    JOIN paid_users ON paid_users.user_id = users.id\n    WHERE users.is_active = true\n)\nSELECT *\nFROM active_paid_users;\n```\n\nГлавный критерий — читаемость и сложность запроса.\n\n---\n\n### Практический пример для backend\n\nДопустим, нужно получить пользователей:\n\n```text\nтолько активных;\nс количеством заказов;\nс суммой оплаченных заказов;\nс датой последнего заказа;\nтолько тех, у кого сумма заказов больше 1000.\n```\n\nЗапрос через `WITH`:\n\n```sql\nWITH active_users AS (\n    SELECT id, username, email\n    FROM users\n    WHERE is_active = true\n),\npaid_order_stats AS (\n    SELECT\n        user_id,\n        COUNT(*) AS orders_count,\n        SUM(amount) AS total_amount,\n        MAX(created_at) AS last_order_at\n    FROM orders\n    WHERE status = 'paid'\n    GROUP BY user_id\n),\nbig_customers AS (\n    SELECT *\n    FROM paid_order_stats\n    WHERE total_amount > 1000\n)\nSELECT\n    active_users.id,\n    active_users.username,\n    active_users.email,\n    big_customers.orders_count,\n    big_customers.total_amount,\n    big_customers.last_order_at\nFROM active_users\nJOIN big_customers ON big_customers.user_id = active_users.id\nORDER BY big_customers.total_amount DESC;\n```\n\nБез `WITH` это можно было бы написать через вложенные подзапросы, но читать было бы тяжелее.\n\n---\n\n### Частая ошибка: думать, что WITH ускоряет запрос сам по себе\n\n`WITH` не является автоматической оптимизацией.\n\nОн может:\n\n```text\nулучшить читаемость;\nпомочь структурировать запрос;\nизбавить от повторения логики;\nпомочь с рекурсией;\nпомочь связать DML через RETURNING.\n```\n\nНо он не гарантирует ускорение.\n\nИногда CTE может быть быстрее, иногда медленнее, иногда одинаково. Нужно смотреть:\n\n```sql\nEXPLAIN ANALYZE\n```\n\nОсобенно если запрос работает с большими таблицами.\n\n---\n\n### Частая ошибка: использовать WITH там, где достаточно обычного JOIN\n\nИногда пишут лишний CTE:\n\n```sql\nWITH user_orders AS (\n    SELECT *\n    FROM orders\n)\nSELECT *\nFROM users\nJOIN user_orders ON user_orders.user_id = users.id;\n```\n\nЭто не даёт пользы. Проще:\n\n```sql\nSELECT *\nFROM users\nJOIN orders ON orders.user_id = users.id;\n```\n\n`WITH` нужен, когда он реально делает запрос понятнее или решает конкретную задачу.\n\n---\n\n### Частая ошибка: забывать, что порядок CTE не всегда означает порядок выполнения\n\nЕсли объявлены несколько CTE, это не всегда значит, что PostgreSQL физически выполнит их строго сверху вниз.\n\nНапример:\n\n```sql\nWITH a AS (\n    SELECT ...\n),\nb AS (\n    SELECT ...\n)\nSELECT ...\n```\n\nДля обычных `SELECT` CTE оптимизатор может перестраивать план выполнения.\n\nНо логическая зависимость сохраняется: если `b` использует `a`, то `b` зависит от результата `a`.\n\nС data-modifying CTE нужно быть особенно аккуратным. В PostgreSQL data-modifying statements в `WITH` выполняются в рамках одного statement и одного snapshot; их взаимодействие лучше строить через `RETURNING`, а не через ожидание, что один CTE «увидит» изменения другого в таблице напрямую. Документация PostgreSQL отдельно описывает особенности data-modifying statements в `WITH`. \n\n---\n\n### Когда WITH лучше использовать\n\nХорошие случаи:\n\n```text\nсложный отчёт из нескольких этапов;\nагрегации перед JOIN;\nфильтрация перед дальнейшими расчётами;\nрекурсивная выборка дерева;\nINSERT/UPDATE/DELETE с RETURNING;\nодин промежуточный результат нужен несколько раз;\nнужно улучшить читаемость SQL.\n```\n\nПримеры:\n\n```sql\nWITH monthly_sales AS (\n    SELECT\n        date_trunc('month', created_at) AS month,\n        SUM(amount) AS total\n    FROM orders\n    WHERE status = 'paid'\n    GROUP BY date_trunc('month', created_at)\n)\nSELECT *\nFROM monthly_sales\nORDER BY month;\n```\n\n```sql\nWITH duplicate_emails AS (\n    SELECT email\n    FROM users\n    GROUP BY email\n    HAVING COUNT(*) > 1\n)\nSELECT users.*\nFROM users\nJOIN duplicate_emails ON duplicate_emails.email = users.email;\n```\n\n```sql\nWITH recent_orders AS (\n    SELECT *\n    FROM orders\n    WHERE created_at >= now() - interval '7 days'\n)\nSELECT\n    user_id,\n    COUNT(*) AS orders_count\nFROM recent_orders\nGROUP BY user_id;\n```\n\n---\n\n### Когда WITH лучше не использовать\n\nНе стоит использовать CTE просто ради самого факта.\n\nПлохие случаи:\n\n```text\nCTE ничего не упрощает;\nзапрос становится длиннее без причины;\nCTE мешает оптимизатору;\nодин простой JOIN можно написать напрямую;\nнужно переиспользовать результат в нескольких SQL-запросах — тогда лучше VIEW или TEMP TABLE.\n```\n\n---\n\n### Итог\n\n`WITH` в SQL создаёт временное именованное выражение внутри одного запроса.\n\nПример:\n\n```sql\nWITH active_users AS (\n    SELECT *\n    FROM users\n    WHERE is_active = true\n)\nSELECT *\nFROM active_users;\n```\n\nГлавные применения:\n\n```text\nразбить сложный SQL на понятные части;\nзаменить сложные вложенные подзапросы;\nпереиспользовать промежуточный результат;\nделать рекурсивные запросы через WITH RECURSIVE;\nиспользовать INSERT/UPDATE/DELETE ... RETURNING внутри одного запроса;\nулучшить читаемость отчётов и аналитических выборок.\n```\n\nГлавное помнить: `WITH` — это не постоянная таблица и не автоматический способ ускорить запрос. Это инструмент для структурирования SQL и решения задач, где нужен именованный промежуточный результат."
