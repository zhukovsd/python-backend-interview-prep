[[questions]]
  id = 59
  question = "Что такое и как работает CHECK constraint в SQL?"
  answer = "### Что такое CHECK constraint\n\n`CHECK constraint` — это ограничение на уровне таблицы, которое запрещает записывать в колонку или строку данные, не проходящие заданное условие.\n\nПростой пример:\n\n```sql\nCREATE TABLE products (\n    id bigserial PRIMARY KEY,\n    name text NOT NULL,\n    price numeric NOT NULL CHECK (price > 0)\n);\n```\n\nЗдесь правило такое:\n\n```text\nprice должен быть больше 0\n```\n\nТакой запрос пройдёт:\n\n```sql\nINSERT INTO products (name, price)\nVALUES ('Keyboard', 100);\n```\n\nА такой не пройдёт:\n\n```sql\nINSERT INTO products (name, price)\nVALUES ('Mouse', -50);\n```\n\nPostgreSQL описывает `CHECK` как ограничение, которое состоит из ключевого слова `CHECK` и выражения в скобках; выражение должно проверять допустимость значения.\n\n### Для чего нужен CHECK\n\n`CHECK` нужен, чтобы бизнес-правило было закреплено не только в backend-коде, но и в самой базе.\n\nНапример:\n\n```text\nцена не может быть отрицательной\nвозраст должен быть больше 0\nпроцент скидки должен быть от 0 до 100\nдата окончания должна быть позже даты начала\nстатус должен входить в допустимый набор\nколичество товара не может быть меньше 0\n```\n\nПример со скидкой:\n\n```sql\nCREATE TABLE discounts (\n    id bigserial PRIMARY KEY,\n    percent integer NOT NULL CHECK (percent BETWEEN 0 AND 100)\n);\n```\n\nТеперь база сама не позволит записать:\n\n```sql\npercent = -10\npercent = 150\n```\n\nДаже если в коде backend-разработчик случайно забыл валидацию.\n\n### Как CHECK работает при INSERT и UPDATE\n\nПри вставке или обновлении строки БД вычисляет выражение внутри `CHECK`.\n\nНапример:\n\n```sql\nCHECK (price > 0)\n```\n\nПри вставке:\n\n```sql\nINSERT INTO products (name, price)\nVALUES ('Monitor', 300);\n```\n\nБД проверяет:\n\n```text\n300 > 0 → true → строка разрешена\n```\n\nПри вставке:\n\n```sql\nINSERT INTO products (name, price)\nVALUES ('Monitor', -300);\n```\n\nБД проверяет:\n\n```text\n-300 > 0 → false → ошибка constraint violation\n```\n\nMySQL также описывает, что `CHECK` проверяется при `INSERT`, `UPDATE`, `REPLACE`, `LOAD DATA` и других операциях; если выражение даёт `FALSE`, возникает ошибка. \n\n### CHECK на одну колонку\n\nОграничение можно записать прямо возле колонки:\n\n```sql\nCREATE TABLE users (\n    id bigserial PRIMARY KEY,\n    age integer CHECK (age >= 18)\n);\n```\n\nЭто удобно, когда правило относится только к одной колонке.\n\nНапример:\n\n```sql\nCREATE TABLE accounts (\n    id bigserial PRIMARY KEY,\n    balance numeric CHECK (balance >= 0)\n);\n```\n\n### CHECK на несколько колонок\n\n`CHECK` может проверять не одну колонку, а связь между несколькими колонками.\n\nНапример:\n\n```sql\nCREATE TABLE bookings (\n    id bigserial PRIMARY KEY,\n    start_at timestamptz NOT NULL,\n    end_at timestamptz NOT NULL,\n    CHECK (end_at > start_at)\n);\n```\n\nЗдесь правило:\n\n```text\nдата окончания должна быть позже даты начала\n```\n\nЭто уже не проверка отдельного значения, а проверка всей строки.\n\nЕщё пример:\n\n```sql\nCREATE TABLE transfers (\n    id bigserial PRIMARY KEY,\n    from_account_id bigint NOT NULL,\n    to_account_id bigint NOT NULL,\n    amount numeric NOT NULL CHECK (amount > 0),\n    CHECK (from_account_id <> to_account_id)\n);\n```\n\nТут запрещается перевод самому себе.\n\n### Именованный CHECK constraint\n\nЛучше давать ограничениям имена:\n\n```sql\nCREATE TABLE products (\n    id bigserial PRIMARY KEY,\n    price numeric NOT NULL,\n    CONSTRAINT products_price_positive CHECK (price > 0)\n);\n```\n\nПлюс именованного ограничения — понятная ошибка и удобнее менять схему.\n\nНапример, ошибка будет ссылаться на:\n\n```text\nproducts_price_positive\n```\n\nА не на автоматически сгенерированное имя.\n\n### Добавление CHECK в существующую таблицу\n\nМожно добавить ограничение после создания таблицы:\n\n```sql\nALTER TABLE products\nADD CONSTRAINT products_price_positive\nCHECK (price > 0);\n```\n\nНо если в таблице уже есть строки, которые нарушают условие, команда не пройдёт.\n\nНапример, если уже есть:\n\n```text\nprice = -100\n```\n\nто `ALTER TABLE ... ADD CONSTRAINT ... CHECK (price > 0)` завершится ошибкой.\n\nВ PostgreSQL для больших таблиц иногда используют `NOT VALID`, чтобы не проверять старые строки сразу:\n\n```sql\nALTER TABLE products\nADD CONSTRAINT products_price_positive\nCHECK (price > 0) NOT VALID;\n```\n\nА потом отдельно валидируют:\n\n```sql\nALTER TABLE products\nVALIDATE CONSTRAINT products_price_positive;\n```\n\nЭто полезно на больших production-таблицах, чтобы аккуратнее добавлять ограничения.\n\n### Важный момент про NULL\n\n`CHECK` не заменяет `NOT NULL`.\n\nНапример:\n\n```sql\nCREATE TABLE products (\n    id bigserial PRIMARY KEY,\n    price numeric CHECK (price > 0)\n);\n```\n\nТакое значение не пройдёт:\n\n```text\nprice = -10\n```\n\nНо `NULL` может пройти, потому что выражение:\n\n```sql\nNULL > 0\n```\n\nдаёт не `false`, а `unknown`.\n\nВ SQL `CHECK` обычно нарушается именно когда условие возвращает `false`. Если результат `true` или `unknown`, строка может быть допустимой. В MySQL это тоже указано: constraint нарушается, если результат условия `FALSE`; не если `TRUE` или `UNKNOWN`. \n\nПоэтому, если поле обязательно, нужно писать так:\n\n```sql\nCREATE TABLE products (\n    id bigserial PRIMARY KEY,\n    price numeric NOT NULL CHECK (price > 0)\n);\n```\n\nТо есть:\n\n```text\nNOT NULL запрещает NULL\nCHECK запрещает неправильное значение\n```\n\n### CHECK и enum/status\n\nИногда `CHECK` используют для ограничения списка значений:\n\n```sql\nCREATE TABLE orders (\n    id bigserial PRIMARY KEY,\n    status text NOT NULL CHECK (status IN ('new', 'paid', 'cancelled'))\n);\n```\n\nТак база не позволит записать:\n\n```text\nstatus = 'unknown'\nstatus = 'abc'\nstatus = ''\n```\n\nНо если статусы часто меняются или используются во многих таблицах, иногда лучше отдельная таблица-справочник или enum-тип.\n\n### CHECK не должен проверять другие строки\n\n`CHECK` хорошо подходит для проверки одной строки:\n\n```sql\nprice > 0\nend_at > start_at\ndiscount BETWEEN 0 AND 100\n```\n\nНо не подходит для правил вида:\n\n```text\nу пользователя не больше 5 активных заказов\nсумма всех платежей не больше лимита\nнет пересекающихся бронирований\n```\n\nПотому что это уже зависит от других строк. Для таких задач обычно используют:\n\n```text\nUNIQUE constraint\nEXCLUDE constraint\nforeign key\nтриггеры\nтранзакции и блокировки\nприкладную бизнес-логику\n```\n\n### Где CHECK полезен в backend\n\nТипичные примеры:\n\n```sql\nCHECK (amount > 0)\n```\n\n```sql\nCHECK (quantity >= 0)\n```\n\n```sql\nCHECK (rating BETWEEN 1 AND 5)\n```\n\n```sql\nCHECK (discount_percent BETWEEN 0 AND 100)\n```\n\n```sql\nCHECK (end_at > start_at)\n```\n\n```sql\nCHECK (status IN ('draft', 'published', 'archived'))\n```\n\nПрактический смысл: backend может ошибиться, тесты могут не покрыть сценарий, админка может отправить некорректные данные, миграционный скрипт может быть написан неправильно. `CHECK` не даёт плохим данным попасть в таблицу.\n\n### Коротко\n\n`CHECK constraint` — это правило на уровне БД, которое проверяет строку перед вставкой или обновлением.\n\nГлавное:\n\n```text\nCHECK проверяет условие.\nЕсли условие false — INSERT/UPDATE запрещается.\nCHECK хорошо подходит для бизнес-ограничений внутри одной строки.\nCHECK не заменяет NOT NULL.\nCHECK лучше именовать через CONSTRAINT name.\nCHECK защищает данные даже при ошибке в backend-коде.\n```\n\nПростой пример:\n\n```sql\nCREATE TABLE products (\n    id bigserial PRIMARY KEY,\n    price numeric NOT NULL,\n    CONSTRAINT products_price_positive CHECK (price > 0)\n);\n```\n\nЭто означает: в таблице `products` не может быть товара с `price <= 0`."
  popularity = 2.63

[[questions]]
  id = 60
  question = "Что такое и как работает FOREIGN KEY REFERENCES?"
  answer = "Foreign Key (внешний ключ) - это колонка (или набор колонок) таблице, ссылающаяся на первичный ключ (или любую UNIQUE колонку) другой таблицы. Обеспечивает ссылочную целостность.  \n  \n```sql  \nCREATE TABLE users (  \nid INT PRIMARY KEY  \n);  \n  \nCREATE TABLE orders (  \norder_id INT PRIMARY KEY,  \nuser_id INT,  \nFOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE  \n);  \n```  \n  \n**Foreign Key может быть составным?**  \nДа, Foreign Key может быть составным (Composite Foreign Key)  \n  \n| **Характеристика** | **Primary Key (PK)** | **Foreign Key (FK)** |  \n| ------------------ | -------------------------------------- | --------------------------------------------- |  \n| **Назначение** | Гарантирует уникальность строк | Обеспечивает ссылочную целостность |  \n| **Уникальность** | Всегда уникален | Может повторяться |  \n| **NULL?** | Нельзя | Можно |  \n| **Количество** | Один на таблицу (может быть составным) | Может быть несколько |  \n| **Удаление** | Нельзя менять без `CASCADE` | `ON DELETE CASCADE` - удалит зависимые записи |"
  popularity = 2.63
