  question = "В каких случаях целесообразно использовать hash-индекс в базе данных?"
  answer = "### Когда целесообразно использовать hash-индекс\n\nHash-индекс имеет смысл использовать, когда запросы ищут строки только по точному совпадению значения.\n\nТипичный пример:\n\n```sql\nSELECT *\nFROM users\nWHERE email = 'test@example.com';\n```\n\nИли:\n\n```sql\nSELECT *\nFROM sessions\nWHERE token = 'abc123';\n```\n\nВ PostgreSQL hash-индексы хранят хеш-код значения и могут использоваться только для простых сравнений на равенство через оператор `=`. \n\n### Хорошие случаи для hash-индекса\n\nHash-индекс может быть уместен, если:\n\n1. Запросы почти всегда используют `=`\n    \n\n```sql\nWHERE user_id = 100\nWHERE email = 'a@mail.com'\nWHERE token = '...'\nWHERE uuid = '...'\n```\n\n2. Не нужны диапазонные условия\n    \n\nHash-индекс не подходит для:\n\n```sql\nWHERE created_at > '2026-01-01'\nWHERE price BETWEEN 100 AND 500\nWHERE id >= 1000\n```\n\nДля таких запросов обычно нужен B-tree индекс.\n\n3. Не нужна сортировка по этому индексу\n    \n\nHash-индекс не помогает для:\n\n```sql\nORDER BY created_at\n```\n\nПотому что hash-индекс не хранит данные в отсортированном порядке.\n\n4. Колонка имеет высокую селективность\n    \n\nХорошие кандидаты:\n\n```text\nid\nuuid\nemail\nusername\ntoken\nsession_id\napi_key\n```\n\nПлохие кандидаты:\n\n```text\nstatus\nis_active\ngender\ntype\n```\n\nНапример, если в колонке `status` всего 3 значения, hash-индекс может быть бесполезен: база всё равно найдёт слишком много строк.\n\n### Пример в PostgreSQL\n\n```sql\nCREATE INDEX idx_users_email_hash\nON users USING hash (email);\n```\n\nЗапрос:\n\n```sql\nSELECT *\nFROM users\nWHERE email = 'test@example.com';\n```\n\nНо важно: в PostgreSQL обычный B-tree индекс тоже умеет работать с `=`, а также дополнительно поддерживает диапазоны, сортировку и больше сценариев. Поэтому hash-индекс не является универсальной заменой B-tree. PostgreSQL указывает, что B-tree поддерживает операторы `<`, `<=`, `=`, `>=`, `>`, а hash-индекс — только equality-сравнения. \n\n### Когда hash-индекс не подходит\n\nHash-индекс не стоит использовать, если запросы выглядят так:\n\n```sql\nWHERE age > 18\n```\n\n```sql\nWHERE created_at BETWEEN '2026-01-01' AND '2026-01-31'\n```\n\n```sql\nORDER BY created_at DESC\n```\n\n```sql\nWHERE name LIKE 'Alex%'\n```\n\n```sql\nWHERE status IN ('new', 'pending')\n```\n\nДля этих случаев чаще подходит B-tree индекс.\n\n### В MySQL\n\nВ MySQL hash-индексы особенно связаны с `MEMORY` storage engine. Документация MySQL указывает, что hash-индексы используются только для equality-сравнений через `=` или `<=>`, но не подходят для range-поиска. \n\nТо есть хорошо:\n\n```sql\nWHERE id = 10\n```\n\nПлохо:\n\n```sql\nWHERE id > 10\n```\n\n### Кратко\n\nHash-индекс целесообразно использовать для точечного поиска по точному совпадению, когда запросы используют только `=` по высокоселективной колонке: `id`, `uuid`, `email`, `token`, `session_id`. Он не подходит для диапазонов, сортировки, `ORDER BY`, `LIKE 'prefix%'` и условий больше/меньше. На практике чаще сначала используют B-tree индекс, а hash-индекс рассматривают только после проверки через `EXPLAIN ANALYZE`, если workload действительно состоит из equality-запросов."
  popularity = 2.63

[[questions]]
  id = 9
  question = "Как организован B-tree индекс и по какому принципу он работает?"
  answer = "### Что такое B-tree индекс\n\nB-tree индекс — это сбалансированное многопутевое дерево, где ключи хранятся в отсортированном порядке. “Многопутевое” означает, что один узел содержит не один ключ, как в бинарном дереве, а много ключей и много ссылок на дочерние узлы. PostgreSQL прямо описывает B-tree как стандартную структуру “multi-way balanced tree” для данных, которые можно отсортировать в линейный порядок. \n\nУпрощённо структура такая:\n\n```text\n                 [ 30 | 60 ]\n                /     |      \\\n        < 30         30-60        > 60\n\n       [10|20]     [35|45|55]    [70|80|90]\n```\n\nКорневой узел говорит:  \nключи меньше `30` ищи слева, от `30` до `60` — посередине, больше `60` — справа.\n\n### Как он организован\n\nB-tree индекс состоит из нескольких уровней:\n\n```text\nroot node\n  └── internal nodes\n        └── leaf nodes\n```\n\nВнутренние узлы хранят ключи-разделители и ссылки на следующие узлы. Листовые узлы хранят реальные индексные записи: значение ключа и указатель на строку таблицы либо на первичный ключ, в зависимости от СУБД и типа индекса. Например, в InnoDB первичный ключ является clustered index, то есть данные строки хранятся вместе с кластерным индексом; вторичные индексы содержат свои ключи и значения первичного ключа строки. \n\nГлавная идея: индекс не хранит строки “как попало”. Он хранит ключи в отсортированной древовидной структуре, чтобы СУБД не читала всю таблицу подряд.\n\n### Как выполняется поиск\n\nДопустим, есть индекс по колонке `age`, и запрос:\n\n```sql\nSELECT *\nFROM users\nWHERE age = 35;\n```\n\nСУБД идёт сверху вниз:\n\n1. Смотрит в корневой узел.\n    \n2. Определяет, в какой диапазон попадает `35`.\n    \n3. Переходит в нужный дочерний узел.\n    \n4. Повторяет процесс, пока не дойдёт до листа.\n    \n5. В листе находит `35`.\n    \n6. По ссылке из индекса получает нужную строку таблицы.\n    \n\nТо есть вместо полного сканирования таблицы:\n\n```text\nпроверь строку 1\nпроверь строку 2\nпроверь строку 3\n...\nпроверь строку 10 000 000\n```\n\nСУБД делает короткий путь по дереву:\n\n```text\nroot → internal node → leaf node → row\n```\n\nВысота B-tree обычно небольшая, потому что в каждом узле хранится много ключей. Поэтому даже для миллионов строк путь может состоять из нескольких переходов.\n\n### Почему B-tree хорошо подходит для диапазонов\n\nB-tree сохраняет порядок ключей. Поэтому он хорошо работает не только с `=`, но и с диапазонными условиями:\n\n```sql\nWHERE age > 30\nWHERE age BETWEEN 20 AND 40\nWHERE created_at >= '2026-01-01'\nORDER BY created_at\n```\n\nPostgreSQL использует B-tree для сравнений `<`, `<=`, `=`, `>=`, `>`, а также может использовать такой индекс для получения данных в отсортированном порядке. ([PostgreSQL](https://www.postgresql.org/docs/current/indexes-types.html?utm_source=chatgpt.com \"Documentation: 18: 11.2. Index Types\")) MySQL также указывает, что B-tree индекс применим для `=`, `>`, `>=`, `<`, `<=`, `BETWEEN` и некоторых `LIKE 'prefix%'` условий. \n\nНапример:\n\n```sql\nSELECT *\nFROM orders\nWHERE created_at BETWEEN '2026-01-01' AND '2026-01-31';\n```\n\nСУБД сначала быстро находит начало диапазона в дереве, а потом последовательно проходит по соседним ключам, пока диапазон не закончится.\n\n### Как происходит вставка\n\nПри вставке новой строки СУБД должна добавить новый ключ в индекс.\n\nНапример, вставляется `age = 42`.\n\n1. СУБД ищет листовой узел, куда должен попасть ключ `42`.\n    \n2. Если в узле есть место — просто вставляет ключ в правильную позицию.\n    \n3. Если узел переполнен — он делится на два узла.\n    \n4. Средний ключ поднимается выше, чтобы родительский узел знал о новом разделении.\n    \n5. Если переполнен родитель — процесс может подняться выше, вплоть до корня.\n    \n\nЗа счёт этого дерево остаётся сбалансированным: путь от корня до любого листа примерно одинаковый. Это важно, потому что поиск не деградирует в длинный линейный проход.\n\n### Почему индекс ускоряет чтение, но замедляет запись\n\nB-tree ускоряет `SELECT`, потому что позволяет быстро найти нужные строки. Но при `INSERT`, `UPDATE`, `DELETE` СУБД должна обновлять не только таблицу, но и все связанные индексы. PostgreSQL отдельно подчёркивает, что индексы ускоряют поиск, но добавляют накладные расходы, поэтому их нужно использовать разумно. \n\nНапример, если есть таблица:\n\n```sql\nCREATE INDEX idx_users_email ON users(email);\nCREATE INDEX idx_users_age ON users(age);\nCREATE INDEX idx_users_created_at ON users(created_at);\n```\n\nТо при вставке пользователя СУБД обновит:\n\n```text\nтаблицу users\nиндекс по email\nиндекс по age\nиндекс по created_at\n```\n\nЧем больше индексов, тем тяжелее операции записи.\n\n### Главное\n\nB-tree индекс — это отсортированное сбалансированное дерево, которое позволяет быстро сузить область поиска. Он особенно полезен для:\n\n```sql\nWHERE column = value\nWHERE column > value\nWHERE column BETWEEN a AND b\nORDER BY column\nLIKE 'abc%'\n```\n\nНо он хуже помогает, когда условие не использует начало индексируемого значения, например:\n\n```sql\nLIKE '%abc'\n```\n\nВ таком случае порядок B-tree почти бесполезен, потому что неизвестно, с какого места дерева начинать поиск."
  popularity = 5.26

[[questions]]
  id = 10
  question = "Что хранится в узлах B-дерева и как по нему выполняется поиск?"
  answer = "### Что хранится в узлах B-дерева\n\nВ B-tree/B+tree индексе узел — это страница индекса. В PostgreSQL B-tree индекс состоит из внутренних страниц и листовых страниц; листовые страницы находятся на нижнем уровне дерева, а все уровни выше — внутренние. В листовых страницах PostgreSQL хранятся индексные кортежи, которые указывают на строки таблицы. \n\nУпрощённо:\n\n```text\nB-tree индекс\n\n                 [ 30 | 60 ]\n                /     |      \\\n        [10|20]   [35|45|55]   [70|80|90]\n```\n\nВнутренний узел хранит:\n\n```text\nключи-разделители\nссылки на дочерние узлы\n```\n\nНапример:\n\n```text\n[ 30 | 60 ]\n```\n\nозначает:\n\n```text\nменьше 30        → идти в левый дочерний узел\nот 30 до 60      → идти в средний дочерний узел\nбольше 60        → идти в правый дочерний узел\n```\n\nЛистовой узел хранит уже сами индексные записи:\n\n```text\nзначение индексируемого ключа\nуказатель на строку таблицы / идентификатор строки\n```\n\nНапример, для индекса по `email` лист может логически выглядеть так:\n\n```text\n[\"a@mail.com\"] → ссылка на строку #101\n[\"b@mail.com\"] → ссылка на строку #205\n[\"c@mail.com\"] → ссылка на строку #317\n```\n\nВ реальной СУБД детали зависят от движка. Например, в MySQL InnoDB вторичные индексы хранят ключ вторичного индекса и значение первичного ключа, по которому затем можно найти строку в clustered index. \n\n### Как выполняется поиск\n\nДопустим, есть индекс:\n\n```sql\nCREATE INDEX idx_users_age ON users(age);\n```\n\nИ запрос:\n\n```sql\nSELECT *\nFROM users\nWHERE age = 45;\n```\n\nСУБД не перебирает всю таблицу. Она идёт по дереву сверху вниз.\n\n```text\n                 [ 30 | 60 ]\n                /     |      \\\n        [10|20]   [35|45|55]   [70|80|90]\n```\n\nПоиск `45`:\n\n```text\n1. Смотрим корневой узел: [30 | 60]\n2. 45 больше 30, но меньше 60\n3. Значит, идём в средний дочерний узел\n4. Попадаем в лист: [35 | 45 | 55]\n5. Находим ключ 45\n6. По ссылке из индекса получаем строку таблицы\n```\n\nТо есть путь такой:\n\n```text\nroot node → internal node → leaf node → table row\n```\n\nЕсли дерево выше, процесс тот же самый: на каждом уровне СУБД сравнивает искомое значение с ключами-разделителями и выбирает нужную ветку.\n\n### Почему поиск быстрый\n\nB-tree не бинарное дерево. Один узел может содержать много ключей и ссылок, поэтому у дерева маленькая высота.\n\nУсловно, вместо такого поиска:\n\n```text\nпроверить 1-ю строку\nпроверить 2-ю строку\nпроверить 3-ю строку\n...\nпроверить миллионную строку\n```\n\nполучается такой:\n\n```text\nпрочитать корень\nпрочитать нужный внутренний узел\nпрочитать нужный лист\nнайти ссылку на строку\n```\n\nПоэтому B-tree хорошо подходит для точечного поиска:\n\n```sql\nWHERE id = 100\nWHERE email = 'test@mail.com'\n```\n\nи для диапазонов:\n\n```sql\nWHERE age BETWEEN 20 AND 40\nWHERE created_at >= '2026-01-01'\n```\n\nMySQL указывает, что B-tree индекс может использоваться для сравнений `=`, `>`, `>=`, `<`, `<=`, `BETWEEN`, а также для `LIKE`, если шаблон не начинается с wildcard, например `LIKE 'abc%'`. ([MySQL](https://dev.mysql.com/doc/en/index-btree-hash.html?utm_source=chatgpt.com \"10.3.9 Comparison of B-Tree and Hash Indexes\"))\n\n### Как выполняется диапазонный поиск\n\nДля диапазона принцип немного другой.\n\nЗапрос:\n\n```sql\nSELECT *\nFROM users\nWHERE age BETWEEN 30 AND 50;\n```\n\nСУБД:\n\n```text\n1. Через B-tree быстро находит первое значение >= 30\n2. Попадает в нужный листовой узел\n3. Дальше идёт по соседним индексным записям в отсортированном порядке\n4. Останавливается, когда значение стало больше 50\n```\n\nИменно поэтому B-tree полезен для `ORDER BY`, `BETWEEN`, `<`, `>`, `>=`, `<=`: данные внутри индекса упорядочены.\n\n### Коротко\n\nВ узлах B-дерева хранятся не сами “объекты” таблицы, а индексная структура:\n\n```text\nвнутренние узлы:\n  ключи-разделители + ссылки на дочерние страницы\n\nлистовые узлы:\n  индексируемые значения + ссылки на строки таблицы\n```\n\nПоиск выполняется так:\n\n```text\nсравнить ключ в корне\nвыбрать нужную ветку\nспуститься ниже\nдойти до листа\nнайти ключ\nполучить строку таблицы\n```\n\nГлавный смысл B-tree индекса — быстро сузить область поиска за счёт отсортированной и сбалансированной структуры."
  popularity = 2.63

[[questions]]
  id = 11
  question = "Недостатки индексов"
  answer = "- Усложнение работы планировщика - СУБД может не выбрать лучший индекс для запроса, если их слишком много. Некоторые индексы могут быть избыточными, что не только не ускоряет запросы, но и увеличивает нагрузку на систему  \n- Утилизация места на жёстком диске - индексы занимают дополнительное место на диске пропорционально объёму данных и кол-ву выбранных столбцов  \n- Увеличение времени записи - при вставке, обновлении или удалении данных индексы нужно обновлять, что замедляет операции записи  \n- Усложнение управления - управление большим количеством индексов становится сложным, включая их отслеживание и обслуживании"
  popularity = 13.16

[[questions]]
  id = 12
  question = "Что такое SQL-инъекция?"
  answer = "### Что такое SQL-инъекция\n\nSQL-инъекция — это уязвимость, при которой пользовательский ввод попадает внутрь SQL-запроса как часть команды, а не как обычное значение.\n\nИными словами: приложение ожидало данные, но из-за неправильной сборки SQL-запроса пользователь может передать кусок SQL-кода, который база данных выполнит. OWASP относит SQL Injection к распространённым и опасным уязвимостям, потому что база часто содержит чувствительные данные. \n\nПростой пример плохого кода:\n\n```python\nusername = request.GET[\"username\"]\n\nsql = f\"SELECT * FROM users WHERE username = '{username}'\"\n```\n\nОжидался обычный ввод:\n\n```text\nalex\n```\n\nТогда получится запрос:\n\n```sql\nSELECT * FROM users WHERE username = 'alex'\n```\n\nНо атакующий может передать:\n\n```sql\n' OR '1'='1\n```\n\nИ итоговый запрос станет:\n\n```sql\nSELECT * FROM users WHERE username = '' OR '1'='1'\n```\n\nУсловие `'1'='1'` всегда истинно, поэтому база может вернуть не одного пользователя, а все подходящие строки.\n\n### В чём суть проблемы\n\nПроблема не в самой базе данных, а в том, что приложение смешивает:\n\n```text\nданные пользователя\nSQL-команду\n```\n\nТо есть пользовательский ввод становится частью SQL-синтаксиса.\n\nПлохо:\n\n```sql\nSELECT * FROM users WHERE username = '<ввод пользователя>'\n```\n\nПотому что ввод пользователя напрямую встраивается в запрос.\n\nПравильно — передавать значение отдельно от SQL-команды:\n\n```python\ncursor.execute(\n    \"SELECT * FROM users WHERE username = %s\",\n    [username]\n)\n```\n\nВ этом случае база понимает: `username` — это значение, а не SQL-код. OWASP прямо указывает parameterized queries / prepared statements как основной способ защиты от SQL-инъекций. \n\n### Что может сделать SQL-инъекция\n\nВ зависимости от прав приложения и типа запроса SQL-инъекция может позволить:\n\n```text\nпрочитать чужие данные\nобойти авторизацию\nизменить данные\nудалить данные\nполучить структуру таблиц\nв некоторых случаях выполнить более опасные действия через возможности СУБД\n```\n\nPortSwigger описывает SQL injection как уязвимость, позволяющую вмешиваться в запросы приложения к базе; часто это даёт доступ к данным, которые пользователь не должен видеть, а иногда позволяет изменять или удалять данные. \n\n### Пример с авторизацией\n\nПлохой вариант:\n\n```python\nsql = f\"\"\"\nSELECT *\nFROM users\nWHERE username = '{username}'\nAND password = '{password}'\n\"\"\"\n```\n\nОбычный запрос:\n\n```sql\nSELECT *\nFROM users\nWHERE username = 'admin'\nAND password = '12345'\n```\n\nАтакующий может ввести в поле `username`:\n\n```sql\nadmin' --\n```\n\nТогда запрос станет примерно таким:\n\n```sql\nSELECT *\nFROM users\nWHERE username = 'admin' --'\nAND password = 'anything'\n```\n\n`--` в SQL означает комментарий. Всё после него игнорируется. В итоге проверка пароля может быть выключена.\n\n### Почему экранирования недостаточно\n\nИногда пытаются защищаться так: удалить кавычки, заменить спецсимволы, запретить слова `SELECT`, `DROP`, `OR`.\n\nЭто слабый подход, потому что:\n\n```text\nу разных СУБД разные правила синтаксиса\nможно обойти фильтр альтернативной записью\nможно ошибиться в обработке кодировок\nлегко забыть обработать одно из мест\n```\n\nOWASP указывает, что allow-list валидация может быть полезна, но параметризованные SQL-запросы обычно требуют меньше сопровождения и дают более надёжные гарантии безопасности. \n\n### Как выглядит правильная защита\n\nОсновной способ — параметризованные запросы:\n\n```python\ncursor.execute(\n    \"SELECT * FROM users WHERE username = %s AND password_hash = %s\",\n    [username, password_hash]\n)\n```\n\nИли через ORM:\n\n```python\nUser.objects.get(username=username)\n```\n\nORM обычно сам формирует параметризованный запрос, если не использовать опасные ручные вставки SQL.\n\nТакже важно:\n\n```text\nне собирать SQL через f-string / конкатенацию\nиспользовать prepared statements / bind parameters\nограничивать права пользователя БД\nвалидировать входные данные\nне показывать пользователю подробные SQL-ошибки\nлогировать подозрительные запросы\n```\n\n### Коротко\n\nSQL-инъекция — это когда ввод пользователя попадает в SQL-запрос как исполняемый код.\n\nПлохая идея:\n\n```python\nsql = f\"SELECT * FROM users WHERE id = {user_id}\"\n```\n\nНормальная идея:\n\n```python\ncursor.execute(\n    \"SELECT * FROM users WHERE id = %s\",\n    [user_id]\n)\n```\n\nГлавное правило: SQL-команда и пользовательские данные должны передаваться отдельно."
  popularity = 2.63

[[questions]]
  id = 13
  question = "Как защититься от SQL-инъекций?"
  answer = "### Главная защита — параметризованные запросы\n\nНельзя собирать SQL через строки:\n\n```python\nusername = request.GET[\"username\"]\n\nsql = f\"SELECT * FROM users WHERE username = '{username}'\"\n```\n\nТак пользовательский ввод становится частью SQL-кода.\n\nПравильно — передавать SQL и значения отдельно:\n\n```python\ncursor.execute(\n    \"SELECT * FROM users WHERE username = %s\",\n    [username]\n)\n```\n\nВ этом случае база воспринимает `username` как значение, а не как SQL-команду. OWASP называет prepared statements / parameterized queries основным способом защиты: SQL-код задаётся отдельно, а пользовательские параметры передаются позже как данные. \n\n### Что делать на практике\n\n1. Использовать ORM вместо ручного SQL, когда это возможно.\n    \n\nНапример, в Django:\n\n```python\nUser.objects.get(username=username)\n```\n\nВместо:\n\n```python\nUser.objects.raw(\n    f\"SELECT * FROM users WHERE username = '{username}'\"\n)\n```\n\nDjango прямо рекомендует сначала использовать ORM, а при raw SQL обязательно передавать пользовательские значения через `params`, чтобы защищаться от SQL-инъекций. \n\n2. Если нужен raw SQL — использовать параметры.\n    \n\nDjango:\n\n```python\nUser.objects.raw(\n    \"SELECT * FROM users WHERE username = %s\",\n    [username]\n)\n```\n\npsycopg:\n\n```python\ncur.execute(\n    \"SELECT * FROM users WHERE username = %s\",\n    (username,)\n)\n```\n\nВ psycopg параметры передаются вторым аргументом в `execute()`. Документация отдельно предупреждает не склеивать значения с SQL-строкой вручную. \n\nSQLAlchemy:\n\n```python\nfrom sqlalchemy import text\n\nstmt = text(\"SELECT * FROM users WHERE id = :user_id\")\nresult = session.execute(stmt, {\"user_id\": user_id})\n```\n\nВ SQLAlchemy для текстового SQL есть `text()` с bind parameters через `:name`; документация также предупреждает не подставлять недоверенный ввод прямо внутрь SQL-строки.\n\n### Чего нельзя делать\n\nОпасно:\n\n```python\nsql = \"SELECT * FROM users WHERE id = \" + user_id\n```\n\nОпасно:\n\n```python\nsql = f\"SELECT * FROM users WHERE email = '{email}'\"\n```\n\nОпасно:\n\n```python\nsql = \"SELECT * FROM users WHERE name = '%s'\" % name\n```\n\nДаже если кажется, что значение безопасное. Например, `id` пришёл как число, но из HTTP-запроса всё изначально приходит как внешние данные.\n\nПравильно:\n\n```python\ncursor.execute(\n    \"SELECT * FROM users WHERE id = %s\",\n    [user_id]\n)\n```\n\n### Валидация не заменяет параметризацию\n\nВалидация нужна, но она не должна быть основной защитой от SQL-инъекции.\n\nНапример, для `id` можно проверять:\n\n```python\nuser_id = int(user_id)\n```\n\nДля сортировки можно использовать allow-list:\n\n```python\nallowed_sort_fields = {\n    \"created_at\": \"created_at\",\n    \"username\": \"username\",\n    \"email\": \"email\",\n}\n\nsort_by = allowed_sort_fields.get(request.GET.get(\"sort\"))\n```\n\nНо это дополнение. Главное — не вставлять пользовательские значения прямо в SQL.\n\nОсобенно важно: параметры защищают значения, но не подходят для подстановки имён таблиц, колонок, направлений сортировки и SQL-операторов.\n\nНапример, так делать нельзя:\n\n```python\ncursor.execute(\n    \"SELECT * FROM users ORDER BY %s\",\n    [sort_by]\n)\n```\n\nДля таких частей запроса лучше использовать allow-list:\n\n```python\nallowed_sort = {\n    \"name\": \"username\",\n    \"date\": \"created_at\",\n}\n\ncolumn = allowed_sort.get(sort_by, \"created_at\")\n\nsql = f\"SELECT * FROM users ORDER BY {column}\"\n```\n\nЗдесь `column` берётся не напрямую от пользователя, а из заранее заданного списка разрешённых значений.\n\n### Ограничить права пользователя БД\n\nДаже если SQL-инъекция где-то появится, ущерб можно уменьшить правами.\n\nНе стоит подключать приложение к БД под суперпользователем.\n\nДля обычного backend-приложения лучше отдельный пользователь БД с минимальными правами:\n\n```sql\nGRANT SELECT, INSERT, UPDATE, DELETE ON users TO app_user;\n```\n\nА не:\n\n```sql\nGRANT ALL PRIVILEGES ON DATABASE main_db TO app_user;\n```\n\nИ тем более не использовать `postgres`, `root` или владельца всей БД в приложении.\n\n### Не показывать SQL-ошибки наружу\n\nПлохо, когда пользователь видит:\n\n```text\nsyntax error at or near ...\nrelation users does not exist\ncolumn password_hash does not exist\n```\n\nТакие ошибки помогают понять структуру базы.\n\nНормально:\n\n```json\n{\n  \"detail\": \"Invalid request\"\n}\n```\n\nА подробности должны уходить в логи, доступные только разработчикам.\n\n### Проверять опасные места в коде\n\nИскать нужно всё, где SQL собирается вручную:\n\n```python\nf\"SELECT ...\"\n\"SELECT ...\" + value\n\"SELECT ... %s\" % value\n.format(...)\nraw()\nRawSQL()\nextra()\ntext()\nexecute()\n```\n\nORM-запросы обычно безопаснее, но raw SQL, кастомные выражения и динамические `ORDER BY`, `WHERE`, `LIMIT`, имена таблиц и колонок нужно проверять отдельно.\n\n### Коротко\n\nНормальный набор защиты:\n\n```text\n1. Не собирать SQL через f-string, +, %, .format().\n2. Использовать ORM.\n3. Для raw SQL — только параметризованные запросы.\n4. Для имён колонок/таблиц/sort — allow-list.\n5. Валидировать входные данные.\n6. Ограничивать права пользователя БД.\n7. Не показывать SQL-ошибки пользователю.\n8. Логировать подозрительные запросы и ошибки.\n```\n\nГлавное правило: пользовательский ввод никогда не должен становиться частью SQL-синтаксиса. Он должен передаваться отдельно как значение."
  popularity = 2.63

