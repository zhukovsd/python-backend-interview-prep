[[questions]]
  id = 54
  question = "Как выполняется SQL-запрос в PostgreSQL под капотом?"
  answer = "### Общая схема выполнения запроса\n\nПосле отправки SQL-запроса PostgreSQL проходит примерно такой путь:\n\n```text\nКлиент\n  ↓\nPostgreSQL backend process\n  ↓\nParser\n  ↓\nRewriter\n  ↓\nPlanner / Optimizer\n  ↓\nExecutor\n  ↓\nStorage / Buffer Cache / WAL / MVCC\n  ↓\nРезультат клиенту\n```\n\nОфициальная документация PostgreSQL описывает этот путь так: сначала приложение устанавливает соединение и отправляет запрос серверу, затем запрос проходит парсер, систему переписывания, планировщик/оптимизатор и исполнитель. \n\n---\n\n### 1. Клиент отправляет запрос серверу\n\nНапример, приложение отправляет:\n\n```sql\nSELECT id, username\nFROM users\nWHERE email = 'test@example.com';\n```\n\nКлиентом может быть:\n\n```text\npsql\nDjango\nFastAPI + SQLAlchemy\npgAdmin\nDBeaver\nлюбой backend-сервис через драйвер psycopg / asyncpg / JDBC / etc.\n```\n\nВ PostgreSQL есть frontend/backend protocol. В простом режиме клиент отправляет серверу `Query` message, внутри которого находится SQL-строка. Сервер обрабатывает её и возвращает сообщения с результатом, ошибкой или статусом выполнения. \n\nДля prepared statements и параметризованных запросов часто используется extended query protocol:\n\n```text\nParse → Bind → Execute\n```\n\n`Parse` создаёт prepared statement из SQL-строки, `Bind` подставляет параметры и создаёт portal, а `Execute` запускает выполнение. \n\n---\n\n### 2. Parser: PostgreSQL разбирает SQL\n\nНа этапе парсинга PostgreSQL проверяет синтаксис и строит query tree — внутреннее дерево запроса. \n\nНапример, из этого:\n\n```sql\nSELECT id, username\nFROM users\nWHERE email = 'test@example.com';\n```\n\nPostgreSQL понимает:\n\n```text\nоперация: SELECT\nисточник данных: users\nнужные колонки: id, username\nусловие фильтрации: email = 'test@example.com'\n```\n\nНа этом этапе проверяется, что запрос синтаксически корректный. Если написать:\n\n```sql\nSELEC id FROM users;\n```\n\nPostgreSQL остановится уже на парсере и вернёт ошибку синтаксиса.\n\nНо парсер — это не выполнение. Он ещё не читает строки из таблицы. Он только переводит SQL-текст во внутреннее представление.\n\n---\n\n### 3. Semantic analysis: проверка объектов, колонок, типов\n\nПосле разбора PostgreSQL должен понять, существуют ли таблицы, колонки, функции, операторы и совместимы ли типы данных.\n\nНапример:\n\n```sql\nSELECT unknown_column\nFROM users;\n```\n\nТакой запрос не пройдёт, если `unknown_column` нет в таблице `users`.\n\nИли:\n\n```sql\nSELECT *\nFROM users\nWHERE id = 'abc';\n```\n\nЕсли `id` — integer, PostgreSQL должен понять, можно ли привести строку `'abc'` к нужному типу. Если нельзя — будет ошибка.\n\n---\n\n### 4. Rewriter: переписывание запроса\n\nПосле парсинга запрос попадает в rewrite system. Это слой между parser и planner/optimizer. PostgreSQL может переписать query tree перед планированием. ([PostgreSQL](https://www.postgresql.org/docs/current/rule-system.html \"PostgreSQL: Documentation: 18: 51.4. The PostgreSQL Rule System\"))\n\nКлассический пример — `VIEW`.\n\nДопустим, есть view:\n\n```sql\nCREATE VIEW active_users AS\nSELECT id, username\nFROM users\nWHERE is_active = true;\n```\n\nПотом ты пишешь:\n\n```sql\nSELECT *\nFROM active_users\nWHERE username = 'alex';\n```\n\nPostgreSQL не хранит `active_users` как обычную таблицу. View фактически раскрывается в запрос к базовой таблице:\n\n```sql\nSELECT id, username\nFROM users\nWHERE is_active = true\n  AND username = 'alex';\n```\n\nДокументация PostgreSQL прямо указывает, что одним из применений rewrite system является реализация views: запрос к view переписывается в запрос к базовым таблицам из определения view. \n\n---\n\n### 5. Planner / Optimizer: выбор плана выполнения\n\nДальше PostgreSQL должен решить, как именно выполнить запрос.\n\nОдин и тот же SQL можно выполнить разными способами. Например:\n\n```sql\nSELECT *\nFROM users\nWHERE email = 'test@example.com';\n```\n\nВарианты:\n\n```text\n1. Прочитать всю таблицу users последовательно — Seq Scan.\n2. Использовать индекс по email — Index Scan.\n3. Использовать Bitmap Index Scan + Bitmap Heap Scan.\n```\n\nЗадача planner/optimizer — выбрать план, который ожидаемо будет самым быстрым. PostgreSQL генерирует возможные пути выполнения, оценивает их стоимость и выбирает самый дешёвый путь, из которого строит полноценное plan tree для executor. \n\nПример:\n\n```sql\nEXPLAIN\nSELECT *\nFROM users\nWHERE email = 'test@example.com';\n```\n\nВозможный план:\n\n```text\nIndex Scan using idx_users_email on users\n  Index Cond: (email = 'test@example.com')\n```\n\nА если таблица маленькая или условие возвращает большую часть строк, PostgreSQL может выбрать:\n\n```text\nSeq Scan on users\n  Filter: (email = 'test@example.com')\n```\n\nЭто нормально. Наличие индекса не гарантирует, что PostgreSQL его использует. Планировщик выбирает вариант по оценочной стоимости.\n\nДокументация PostgreSQL подчёркивает, что выбор правильного плана критичен для производительности, а `EXPLAIN` показывает план, который создаёт planner. \n\n---\n\n### 6. Откуда planner знает, какой план выгоднее\n\nPlanner использует статистику по таблицам и индексам:\n\n```text\nсколько строк в таблице;\nнасколько колонка уникальна;\nкакие значения встречаются часто;\nсколько строк примерно пройдёт фильтр;\nесть ли подходящие индексы;\nсколько будет стоить чтение страниц;\nкакой join-алгоритм выгоднее.\n```\n\nПоэтому после больших изменений данных важен `ANALYZE`, а в обычной работе — autovacuum/autanalyze.\n\nНапример:\n\n```sql\nANALYZE users;\n```\n\nЕсли статистика устарела, PostgreSQL может ошибиться: например, выбрать `Seq Scan`, когда выгоднее был бы индекс, или выбрать плохой порядок `JOIN`.\n\n---\n\n### 7. Выбор алгоритмов JOIN\n\nДля запроса:\n\n```sql\nSELECT u.username, o.amount\nFROM users u\nJOIN orders o ON o.user_id = u.id\nWHERE u.id = 10;\n```\n\nPostgreSQL может выбрать разные алгоритмы соединения:\n\n```text\nNested Loop Join\nHash Join\nMerge Join\n```\n\nУсловно:\n\n```text\nNested Loop — часто хорош, когда с одной стороны мало строк и есть индекс.\nHash Join — часто хорош для больших неотсортированных наборов.\nMerge Join — часто хорош, когда данные уже отсортированы или их выгодно отсортировать.\n```\n\nPlanner также выбирает порядок соединения таблиц. Для большого количества `JOIN` перебор всех вариантов может стать слишком дорогим, поэтому PostgreSQL может использовать Genetic Query Optimizer, когда число joins превышает заданный порог.\n\n---\n\n### 8. Executor: реальное выполнение плана\n\nПосле выбора плана он передаётся executor.\n\nExecutor не «выполняет SQL-текст». Он выполняет дерево плана.\n\nНапример план может быть таким:\n\n```text\nHash Join\n  -> Seq Scan on orders\n  -> Hash\n       -> Seq Scan on users\n```\n\nИли таким:\n\n```text\nNested Loop\n  -> Index Scan on users\n  -> Index Scan on orders\n```\n\nExecutor рекурсивно обходит plan tree и извлекает строки. PostgreSQL описывает это как demand-pull pipeline: каждый узел плана при вызове должен вернуть следующую строку или сообщить, что строк больше нет. \n\nТо есть верхний узел просит строку у дочернего узла, тот — у своего дочернего, и так далее до узлов чтения таблицы или индекса.\n\nНапример:\n\n```text\nLimit\n  ↓ просит строку\nSort\n  ↓ просит строки\nSeq Scan\n  ↓ читает таблицу\n```\n\n---\n\n### 9. Scan nodes: чтение таблицы или индекса\n\nВнизу плана обычно находятся scan nodes. Это узлы, которые реально получают строки из источников данных.\n\nОсновные варианты:\n\n```text\nSeq Scan — последовательное чтение таблицы.\nIndex Scan — поиск через индекс + чтение строк из heap.\nIndex Only Scan — чтение только из индекса, если хватает данных и видимость подтверждена.\nBitmap Index Scan — сначала строится bitmap подходящих строк, потом читается heap.\n```\n\nДокументация PostgreSQL указывает, что нижние узлы плана — это scan nodes, которые возвращают сырые строки из таблицы; среди них бывают sequential scans, index scans и bitmap index scans. \n\n---\n\n### 10. Buffer cache: PostgreSQL читает страницы данных\n\nPostgreSQL не читает таблицу как «список объектов». Данные физически лежат в страницах, обычно по 8 KB.\n\nКогда executor просит строку, PostgreSQL проверяет:\n\n```text\nстраница уже есть в shared_buffers?\n    да → читаем из памяти\n    нет → читаем страницу с диска/из OS cache в shared_buffers\n```\n\n`shared_buffers` — это часть shared memory PostgreSQL, которая кэширует части файлов данных, организованных в страницы. Когда страница изменена, она считается dirty page, пока не будет записана обратно в файловую систему. \n\nТо есть даже при `Seq Scan` PostgreSQL фактически читает не «строки», а страницы таблицы, а потом уже извлекает из них версии строк.\n\n---\n\n### 11. MVCC: проверка видимости строк\n\nPostgreSQL использует MVCC — multiversion concurrency control. Поэтому строка в таблице — это не просто «текущее значение». Внутри могут существовать разные версии строки.\n\nНапример, одна транзакция обновила пользователя:\n\n```sql\nUPDATE users\nSET username = 'new_name'\nWHERE id = 1;\n```\n\nPostgreSQL не обязательно физически перезаписывает старую строку на месте. Для `UPDATE` создаётся новая версия строки, а старая помечается как удалённая для будущих транзакций. В описании executor PostgreSQL указывает, что для `UPDATE` создаётся новая обновлённая строка, а старая помечается удалённой. \n\nКогда другой запрос читает таблицу, PostgreSQL проверяет: видна ли конкретная версия строки текущей транзакции.\n\nВ уровне изоляции `Read Committed`, который используется по умолчанию, обычный `SELECT` видит только данные, зафиксированные до начала этого запроса, и не видит незакоммиченные данные или изменения, которые были закоммичены параллельными транзакциями уже во время выполнения этого же запроса. \n\n---\n\n### 12. Индекс не всегда избавляет от чтения таблицы\n\nДопустим есть индекс:\n\n```sql\nCREATE INDEX idx_users_email ON users(email);\n```\n\nЗапрос:\n\n```sql\nSELECT *\nFROM users\nWHERE email = 'test@example.com';\n```\n\nПри `Index Scan` PostgreSQL сначала ищет подходящую запись в индексе, но потом обычно идёт в heap-таблицу за самой строкой и проверкой видимости.\n\nПочему? Потому что информация о видимости строки хранится не в обычной индексной записи, а в heap. Документация PostgreSQL отдельно указывает, что visibility information не хранится в index entries, а index-only scan может избежать обращения к heap только если visibility map показывает, что строки на странице видимы всем текущим и будущим транзакциям. \n\nТо есть:\n\n```text\nIndex Scan:\nиндекс → heap → проверка видимости → результат\n\nIndex Only Scan:\nиндекс → visibility map → результат\n```\n\nНо `Index Only Scan` возможен не всегда.\n\n---\n\n### 13. WHERE, сортировка, агрегация, LIMIT\n\nВо время выполнения executor применяет:\n\n```text\nWHERE-фильтры;\nвычисления выражений;\nJOIN;\nGROUP BY;\nHAVING;\nORDER BY;\nLIMIT/OFFSET;\nоконные функции;\nагрегаты.\n```\n\nВажно: логический порядок SQL и физический порядок выполнения не всегда совпадают.\n\nЛогически можно объяснять так:\n\n```text\nFROM\nJOIN\nWHERE\nGROUP BY\nHAVING\nSELECT\nORDER BY\nLIMIT\n```\n\nНо физически PostgreSQL выполняет тот план, который выбрал planner. Например, он может сначала использовать индекс по условию `WHERE`, потом сделать join, потом агрегировать, потом отсортировать.\n\n---\n\n### 14. Для SELECT результат отправляется клиенту\n\nДля `SELECT` сервер обычно отправляет клиенту:\n\n```text\nRowDescription — описание колонок результата;\nDataRow — строки результата;\nCommandComplete — команда завершена;\nReadyForQuery — сервер готов принять следующий запрос.\n```\n\nЭто описано в PostgreSQL frontend/backend protocol: для `SELECT`, `FETCH`, `SHOW`, `EXPLAIN` обычно возвращаются `RowDescription`, затем ноль или больше `DataRow`, затем `CommandComplete`; после завершения всей строки запросов сервер отправляет `ReadyForQuery`. \n\n---\n\n### 15. Для INSERT / UPDATE / DELETE дополнительно работают WAL и блокировки\n\nДля изменяющих запросов путь похожий:\n\n```sql\nUPDATE users\nSET username = 'alex'\nWHERE id = 10;\n```\n\nPostgreSQL также парсит, переписывает, планирует и выполняет запрос. Но во время выполнения появляются дополнительные действия:\n\n```text\nпоиск строк;\nпроверка MVCC-видимости;\nблокировка изменяемых строк;\nсоздание новой версии строки при UPDATE;\nзапись WAL;\nобновление индексов при необходимости;\nфиксация или откат транзакции.\n```\n\nWAL — Write-Ahead Logging. Его центральный принцип: изменения в файлах данных, где лежат таблицы и индексы, должны записываться только после того, как соответствующие WAL-записи были записаны на постоянное хранилище. Это нужно для восстановления после сбоя. \n\nУпрощённо:\n\n```text\nСначала WAL\nПотом изменения страниц данных\n```\n\nИменно поэтому после падения сервера PostgreSQL может восстановить согласованное состояние.\n\n---\n\n### 16. Что происходит при COMMIT\n\nКогда транзакция фиксируется:\n\n```sql\nCOMMIT;\n```\n\nPostgreSQL должен сделать изменения транзакции долговечными согласно настройкам durability и `synchronous_commit`.\n\nУпрощённо:\n\n```text\nизменения уже могли быть в shared_buffers;\nWAL-записи должны быть записаны/сброшены на диск;\nпосле commit изменения становятся видимыми другим транзакциям по правилам изоляции.\n```\n\nWAL позволяет не записывать сразу все изменённые страницы таблиц на диск при каждом commit. Достаточно надёжно записать WAL, а сами dirty pages могут быть сброшены позже.\n\n---\n\n### 17. Что показывает EXPLAIN / EXPLAIN ANALYZE\n\n`EXPLAIN` показывает план, который PostgreSQL собирается использовать:\n\n```sql\nEXPLAIN\nSELECT *\nFROM users\nWHERE email = 'test@example.com';\n```\n\n`EXPLAIN ANALYZE` реально выполняет запрос и показывает фактические метрики:\n\n```sql\nEXPLAIN ANALYZE\nSELECT *\nFROM users\nWHERE email = 'test@example.com';\n```\n\nДокументация PostgreSQL говорит, что `EXPLAIN` показывает execution plan, который planner создаёт для запроса. В плане есть дерево узлов, scan nodes, join/aggregate/sort nodes и оценки стоимости. \n\nПример:\n\n```text\nIndex Scan using idx_users_email on users\n  Index Cond: (email = 'test@example.com')\n```\n\nЭто значит, что PostgreSQL решил искать строки через индекс.\n\nА вот:\n\n```text\nSeq Scan on users\n  Filter: (email = 'test@example.com')\n```\n\nЭто значит, что PostgreSQL решил читать таблицу последовательно и фильтровать строки.\n\n---\n\n### Полная цепочка на примере\n\nЗапрос:\n\n```sql\nSELECT u.id, u.username, COUNT(o.id) AS orders_count\nFROM users u\nLEFT JOIN orders o ON o.user_id = u.id\nWHERE u.is_active = true\nGROUP BY u.id, u.username\nORDER BY orders_count DESC\nLIMIT 10;\n```\n\nПод капотом:\n\n```text\n1. Клиент отправляет SQL в PostgreSQL.\n2. PostgreSQL проверяет синтаксис.\n3. Строится query tree.\n4. Проверяется, что users, orders, id, username, is_active существуют.\n5. Rewriter раскрывает views/rules, если они есть.\n6. Planner оценивает варианты:\n   - как читать users;\n   - как читать orders;\n   - каким JOIN соединять;\n   - как группировать;\n   - как сортировать;\n   - когда применить LIMIT.\n7. Выбирается самый дешёвый план.\n8. Executor начинает выполнять дерево плана.\n9. Scan nodes читают страницы таблиц/индексов через shared_buffers.\n10. Для строк проверяется MVCC-видимость.\n11. Выполняется JOIN.\n12. Выполняется GROUP BY и COUNT.\n13. Выполняется ORDER BY.\n14. Применяется LIMIT 10.\n15. Результат отправляется клиенту.\n```\n\n---\n\n### Главное\n\nSQL-запрос в PostgreSQL не выполняется «сразу как написан». Он проходит несколько внутренних стадий:\n\n```text\nSQL text\n→ parse tree\n→ rewritten query tree\n→ execution plan\n→ executor\n→ чтение таблиц/индексов\n→ MVCC-проверка\n→ результат клиенту\n```\n\nСамые важные компоненты:\n\n```text\nParser — проверяет SQL и строит дерево запроса.\nRewriter — переписывает запрос, например раскрывает VIEW.\nPlanner/Optimizer — выбирает самый выгодный план.\nExecutor — реально выполняет план.\nStorage/Buffer Manager — читает и пишет страницы данных.\nMVCC — решает, какие версии строк видны текущей транзакции.\nWAL — обеспечивает восстановление и надёжность изменений.\n```\n\nДля backend-разработчика главное практическое следствие такое: производительность запроса зависит не только от SQL-текста, но и от выбранного плана, статистики, индексов, объёма данных, актуальности `ANALYZE`, MVCC-состояния таблиц и того, сколько данных реально пришлось прочитать из памяти или диска."
  popularity = 2.63

[[questions]]
  id = 55
  question = "Как работает, для чего используется и что происходит при SELECT FOR UPDATE в PostgreSQL?"
  answer = "**`SELECT FOR UPDATE`** используется для блокировки строк в таблице, участвующих в запросе до окончания транзакции, чтобы предотвратить их изменение другими транзакциями  \n```sql  \nBEGIN;  \n  \n-- Блокировка строки с id = 1  \nSELECT * FROM accounts  \nWHERE id = 1  \nFOR UPDATE;  \n  \n-- Делаем обновление  \nUPDATE accounts  \nSET balance = balance - 100  \nWHERE id = 1;  \n  \nCOMMIT;  \n```  \n- В данном случае, строка с `id = 1` заблокирована для других транзакций, пока текущая не завершится  \n- Если другая транзакция попытается заблокировать ту же строку, она будет ожидать завершения текущей транзакции"
  popularity = 2.63

[[questions]]
  id = 56
  question = "Что такое и для чего нужен buffer cache (Буферный Кэш) в базе данных?"
  answer = "### Что такое buffer cache в БД\n\nBuffer cache — это область оперативной памяти, где база данных держит недавно использованные страницы таблиц и индексов.\n\nБаза данных обычно работает не с отдельными строками напрямую, а со страницами/блоками данных. В PostgreSQL типичный размер блока — 8 KB, если не была изменена сборочная настройка `BLCKSZ`; параметр `shared_buffers`, если указан без единиц, трактуется как количество таких блоков. \n\nУпрощённо:\n\n```text\nЗапросу нужны данные\n        ↓\nPostgreSQL проверяет shared buffer cache\n        ↓\nесли страница уже в памяти → читает из RAM\nесли страницы нет → читает с диска/из OS cache и кладёт в buffer cache\n```\n\nТо есть buffer cache нужен, чтобы не ходить каждый раз на диск за одними и теми же данными.\n\n---\n\n### Что именно там хранится\n\nВ buffer cache хранятся не “результаты SQL-запросов”, а страницы данных:\n\n```text\nстраницы таблиц\nстраницы индексов\nизменённые страницы, которые ещё не записаны на диск\nслужебная информация о буферах\n```\n\nНапример, запрос:\n\n```sql\nSELECT *\nFROM users\nWHERE id = 100;\n```\n\nможет использовать индекс `users_pkey`.\n\nТогда PostgreSQL может загрузить в buffer cache:\n\n```text\nстраницу индекса, где находится ключ id = 100\nстраницу таблицы, где лежит нужная строка\n```\n\nЕсли похожий запрос выполнится снова, эти страницы уже могут быть в памяти, и чтение будет быстрее.\n\n---\n\n### Зачем он нужен\n\nГлавная причина — разница в скорости между RAM и диском. Читать из памяти значительно быстрее, чем каждый раз обращаться к диску.\n\nBuffer cache нужен для:\n\n```text\n1. Ускорения повторных чтений.\n2. Уменьшения количества физических операций чтения с диска.\n3. Кэширования страниц таблиц и индексов.\n4. Снижения нагрузки на storage.\n5. Более быстрой работы JOIN, WHERE, ORDER BY, индексных сканов.\n6. Буферизации изменённых страниц перед записью на диск.\n```\n\nЕсли нужная страница уже есть в кэше, это называется cache hit. PostgreSQL в `EXPLAIN` для `BUFFERS` описывает `hit` как ситуацию, когда чтения удалось избежать, потому что блок уже был найден в кэше. \n\n---\n\n### Пример без buffer cache\n\nДопустим, таблица `users` большая, и приложение часто ищет пользователей по `id`.\n\n```sql\nSELECT *\nFROM users\nWHERE id = 100;\n```\n\nБез кэша каждый такой запрос постоянно обращался бы к диску:\n\n```text\nзапрос 1 → чтение страницы с диска\nзапрос 2 → снова чтение страницы с диска\nзапрос 3 → снова чтение страницы с диска\n```\n\nС buffer cache:\n\n```text\nзапрос 1 → страницы нет в кэше → прочитать с диска → положить в cache\nзапрос 2 → страница уже в cache → прочитать из памяти\nзапрос 3 → страница уже в cache → прочитать из памяти\n```\n\n---\n\n### Как это выглядит в EXPLAIN\n\nМожно посмотреть использование буферов так:\n\n```sql\nEXPLAIN (ANALYZE, BUFFERS)\nSELECT *\nFROM users\nWHERE id = 100;\n```\n\nПример вывода:\n\n```text\nBuffers: shared hit=3 read=1\n```\n\nСмысл:\n\n```text\nshared hit=3 — 3 блока уже были в shared buffer cache\nshared read=1 — 1 блок пришлось прочитать с диска или из кэша ОС\n```\n\nPostgreSQL указывает, что `BUFFERS` показывает количество shared blocks hit/read/dirtied/written; shared blocks относятся к обычным таблицам и индексам. \n\n---\n\n### Shared buffers в PostgreSQL\n\nВ PostgreSQL основной buffer cache называется shared buffers. Его размер задаётся параметром:\n\n```conf\nshared_buffers = 4GB\n```\n\n`shared_buffers` определяет, сколько памяти PostgreSQL использует под shared memory buffers. Этот параметр применяется при старте сервера, то есть для изменения обычно нужен рестарт PostgreSQL. \n\nНазвание “shared” означает, что эта память общая для backend-процессов PostgreSQL:\n\n```text\nодин процесс загрузил страницу в shared_buffers\nдругой процесс может использовать эту же страницу\n```\n\nЭто не отдельный кэш на каждое подключение.\n\n---\n\n### Buffer cache и кэш операционной системы\n\nВажно: у PostgreSQL есть свой `shared_buffers`, но у операционной системы тоже есть файловый кэш.\n\nКогда PostgreSQL читает страницу, она может оказаться:\n\n```text\n1. уже в shared_buffers PostgreSQL\n2. не в shared_buffers, но в page cache операционной системы\n3. вообще не в памяти, тогда нужно физическое чтение с диска\n```\n\nПоэтому `shared read` в `EXPLAIN` не всегда означает реальное физическое чтение с диска. Это означает, что блока не было в shared buffers PostgreSQL, и PostgreSQL запросил его у ОС. ОС могла отдать его из собственного кэша.\n\n---\n\n### Что происходит при UPDATE/INSERT/DELETE\n\nBuffer cache нужен не только для чтения.\n\nНапример:\n\n```sql\nUPDATE users\nSET email = 'new@mail.com'\nWHERE id = 100;\n```\n\nPostgreSQL загружает нужную страницу в shared buffers, изменяет её в памяти и помечает как dirty page — грязную страницу.\n\n```text\nстраница была прочитана\nстраница изменена в памяти\nстраница помечена как dirty\nпозже она будет записана на диск\n```\n\nВ `EXPLAIN (ANALYZE, BUFFERS)` это может отражаться как:\n\n```text\nBuffers: shared hit=5 dirtied=1\n```\n\n`dirtied` означает, что запрос изменил ранее не изменённый блок, а `written` означает, что backend вытеснил из кэша уже грязный блок и записал его. \n\n---\n\n### Что происходит, когда кэш заполнен\n\nBuffer cache ограничен размером `shared_buffers`.\n\nЕсли кэш заполнен, PostgreSQL должен освободить место под новые страницы. Для этого он вытесняет менее полезные страницы из кэша.\n\nУпрощённо:\n\n```text\nнужна новая страница\nсвободного буфера нет\nPostgreSQL выбирает старую/менее используемую страницу\nесли она dirty — сначала записывает на диск\nпотом загружает новую страницу\n```\n\nЭто нормальное поведение. Проблема появляется, когда рабочий набор данных сильно больше доступной памяти, и база постоянно вытесняет одни страницы ради других. Тогда растёт I/O, а запросы замедляются.\n\n---\n\n### Как посмотреть содержимое buffer cache\n\nВ PostgreSQL есть расширение `pg_buffercache`.\n\n```sql\nCREATE EXTENSION pg_buffercache;\n```\n\nОно позволяет смотреть, что происходит в shared buffer cache в реальном времени. Официальная документация описывает `pg_buffercache` как модуль для исследования состояния shared buffer cache. \n\nНапример, можно посмотреть, какие таблицы занимают место в shared buffers:\n\n```sql\nSELECT\n    c.relname,\n    count(*) AS buffers\nFROM pg_buffercache b\nJOIN pg_class c\n    ON b.relfilenode = pg_relation_filenode(c.oid)\nGROUP BY c.relname\nORDER BY buffers DESC;\n```\n\nНа практике это используют для диагностики: какие таблицы и индексы реально сидят в памяти.\n\n---\n\n### Чем buffer cache не является\n\nBuffer cache — это не кэш результатов запросов.\n\nТо есть PostgreSQL обычно не хранит результат:\n\n```sql\nSELECT count(*) FROM orders;\n```\n\nкак готовое значение “count = 1000000”.\n\nОн кэширует страницы, которые понадобились для выполнения запроса:\n\n```text\nстраницы таблицы orders\nстраницы индекса orders_created_at_idx\n```\n\nЕсли повторить запрос, он может выполниться быстрее не потому, что PostgreSQL запомнил результат, а потому что нужные страницы уже лежат в памяти.\n\n---\n\n### Почему после первого запуска запрос быстрее\n\nЧастая ситуация:\n\n```text\nпервый запуск запроса — 2 секунды\nвторой запуск — 100 мс\n```\n\nПричина может быть в прогретом кэше:\n\n```text\nпервый запуск загрузил страницы с диска/из ОС\nвторой запуск использовал страницы из памяти\n```\n\nПоэтому при тестировании производительности важно учитывать состояние кэша. Иначе можно сравнить не два плана запроса, а “холодный кэш” против “тёплого кэша”.\n\n---\n\n### Коротко\n\nBuffer cache в базе данных — это память для кэширования страниц таблиц и индексов.\n\nВ PostgreSQL основной такой кэш — `shared_buffers`.\n\nГлавное:\n\n```text\nBuffer cache хранит страницы данных и индексов.\nОн уменьшает количество обращений к диску.\nCache hit означает, что блок уже был в памяти.\nCache read означает, что PostgreSQL пришлось запросить блок у ОС.\nDirty page — изменённая страница, которую позже нужно записать на диск.\nshared_buffers задаёт размер кэша PostgreSQL.\nBuffer cache не хранит готовые результаты SQL-запросов.\n```\n\nПрактический смысл: чем чаще нужные таблицы и индексы находятся в buffer cache, тем меньше I/O и тем быстрее работают запросы."
  popularity = 2.63

