  question = "Что делает команда TRUNCATE и чем она отличается от DELETE?"
  answer = "- DELETE - оператор DML, удаляет записи из таблицы, которые удовлетворяют условиям WHERE. Ведёт журналирование. Не сбрасывает последовательности. Медленнее. Есть возможность восстановить данные  \n  \n- TRUNCATE - DDL оператор, удаляет все строки из таблицы, быстро высвобождая занятую память. Не ведёт журналирование, не сбрасывает последовательности. Нет возможности восстановить данные"
  popularity = 2.63

[[questions]]
  id = 22
  question = "Какие решения по конфигурации базы данных обычно принимает разработчик на проекте?"
  answer = "### Что обычно решает backend-разработчик\n\nРазработчик обычно не “настраивает всю PostgreSQL как DBA”, но принимает решения, которые напрямую влияют на работу приложения с БД: схема данных, индексы, транзакции, пул соединений, таймауты, миграции и настройки ORM.\n\n### 1. Как приложение подключается к БД\n\nРазработчик задаёт конфигурацию подключения:\n\n```env\nDB_HOST=postgres\nDB_PORT=5432\nDB_NAME=app_db\nDB_USER=app_user\nDB_PASSWORD=...\nDB_SSLMODE=require\n```\n\nОбычно это выносится в `.env`, Kubernetes secrets, Docker Compose env или настройки CI/CD.\n\nТакже решается, будут ли разные подключения для:\n\n```text\nлокальной разработки\nтестов\nstaging\nproduction\nread replica\n```\n\nВ Django это обычно настраивается через `DATABASES`, а время жизни persistent database connection — через `CONN_MAX_AGE`; документация Django описывает его как максимальное время жизни подключения к БД. \n\n### 2. Размер пула соединений\n\nЕсли приложение использует SQLAlchemy/FastAPI, разработчик часто настраивает пул:\n\n```python\nengine = create_engine(\n    DATABASE_URL,\n    pool_size=10,\n    max_overflow=20,\n    pool_pre_ping=True,\n    pool_recycle=1800,\n)\n```\n\nЗдесь решается:\n\n```text\nсколько постоянных соединений держать\nсколько временных соединений можно открыть сверх лимита\nпроверять ли соединение перед использованием\nкогда пересоздавать старые соединения\n```\n\nSQLAlchemy описывает `pool_size` как количество соединений, поддерживаемых в пуле, а `max_overflow` — как дополнительные соединения сверх `pool_size`, которые можно открыть при нехватке свободных подключений. \n\nЭто важно, потому что если каждый backend-инстанс открывает слишком много соединений, можно упереться в лимит PostgreSQL. `max_connections` в PostgreSQL определяет максимальное количество одновременных подключений к серверу. \n\n### 3. Структура таблиц и типы данных\n\nРазработчик решает, как будут выглядеть таблицы:\n\n```sql\nCREATE TABLE users (\n    id bigserial PRIMARY KEY,\n    email text NOT NULL,\n    username text NOT NULL,\n    created_at timestamptz NOT NULL DEFAULT now()\n);\n```\n\nЗдесь принимаются решения:\n\n```text\nкакой primary key использовать: serial/bigserial/uuid\nкакие поля обязательные\nкакие типы данных выбрать\nиспользовать ли jsonb, uuid, numeric, timestamptz\nкак хранить даты и время\nкак нормализовать связи между сущностями\n```\n\nНапример, для времени в backend-проектах чаще безопаснее использовать `timestamptz`, если дата связана с реальным моментом времени, а не просто календарной датой.\n\n### 4. Ограничения целостности\n\nРазработчик определяет ограничения:\n\n```sql\nALTER TABLE users\nADD CONSTRAINT users_email_unique UNIQUE (email);\n```\n\nили:\n\n```sql\nALTER TABLE orders\nADD CONSTRAINT orders_user_id_fk\nFOREIGN KEY (user_id) REFERENCES users(id);\n```\n\nОбычно решаются такие вещи:\n\n```text\nPRIMARY KEY\nUNIQUE\nFOREIGN KEY\nNOT NULL\nCHECK\nON DELETE CASCADE / RESTRICT / SET NULL\n```\n\nЭто не просто “красота схемы”. Это защита данных на уровне БД. Например, если email должен быть уникальным, лучше закрепить это `UNIQUE`-ограничением, а не только проверкой в коде.\n\nPostgreSQL автоматически создаёт уникальный индекс при создании `UNIQUE` constraint или `PRIMARY KEY`. \n\n### 5. Индексы\n\nРазработчик обычно решает, какие индексы нужны под реальные запросы приложения.\n\nНапример:\n\n```sql\nCREATE INDEX idx_orders_user_id ON orders(user_id);\nCREATE INDEX idx_orders_created_at ON orders(created_at);\nCREATE INDEX idx_orders_status_created_at ON orders(status, created_at);\n```\n\nИндекс имеет смысл, если по колонке часто выполняются:\n\n```sql\nWHERE user_id = ?\nWHERE status = ?\nORDER BY created_at DESC\nJOIN orders ON orders.user_id = users.id\n```\n\nPostgreSQL описывает индексы как способ повысить производительность поиска, но также предупреждает, что неправильное использование индексов может ухудшать производительность. \n\nОтдельно важный момент: PostgreSQL не всегда автоматически создаёт индекс на колонке, где объявлен foreign key. Документация указывает, что при `DELETE` или `UPDATE` родительской строки БД должна проверять дочернюю таблицу, поэтому часто имеет смысл индексировать referencing columns — то есть колонки, где лежит внешний ключ. \n\n### 6. Миграции\n\nРазработчик решает, как изменения схемы будут доставляться в БД:\n\n```text\nDjango migrations\nAlembic\nручные SQL-миграции\nмиграции через CI/CD\n```\n\nОбычно нужно решить:\n\n```text\nкак именовать миграции\nкто создаёт миграции\nкак решать конфликты миграций\nможно ли делать destructive changes\nкак откатывать миграции\nкак безопасно менять большие таблицы\n```\n\nНапример, опасная миграция:\n\n```sql\nALTER TABLE users ADD COLUMN age integer NOT NULL;\n```\n\nЕсли таблица уже большая и в ней есть данные, такая миграция может упасть или заблокировать таблицу. Обычно делают осторожнее:\n\n```sql\nALTER TABLE users ADD COLUMN age integer;\n-- заполнить данные\n-- потом добавить NOT NULL\n```\n\n### 7. Границы транзакций\n\nРазработчик решает, какие операции должны выполняться атомарно.\n\nНапример:\n\n```python\nwith transaction.atomic():\n    order = Order.objects.create(user=user)\n    Payment.objects.create(order=order, amount=amount)\n    StockReservation.objects.create(order=order, item=item)\n```\n\nЗдесь важно определить:\n\n```text\nчто должно быть в одной транзакции\nгде транзакция должна начинаться и заканчиваться\nможно ли держать транзакцию во время внешнего HTTP-запроса\nкакой уровень изоляции нужен\nнужны ли SELECT FOR UPDATE / advisory locks\n```\n\nОбычно нельзя держать транзакцию открытой во время долгих действий: внешние API, загрузка файлов, сетевые вызовы. Это увеличивает время удержания блокировок.\n\n### 8. Таймауты\n\nРазработчик часто задаёт таймауты на уровне подключения, роли или сессии:\n\n```sql\nSET statement_timeout = '30s';\nSET lock_timeout = '5s';\nSET idle_in_transaction_session_timeout = '60s';\n```\n\nСмысл:\n\n```text\nstatement_timeout — ограничить длительность запроса\nlock_timeout — не ждать блокировку бесконечно\nidle_in_transaction_session_timeout — прибить зависшую открытую транзакцию\n```\n\nВ PostgreSQL `statement_timeout` ограничивает максимальное время выполнения SQL-команды, а `idle_in_transaction_session_timeout` завершает сессию, которая слишком долго простаивает внутри открытой транзакции. \n\nДля backend-приложения это важно: один зависший запрос или забытая транзакция не должны держать БД в плохом состоянии бесконечно.\n\n### 9. Настройки read/write split и реплик\n\nЕсли есть реплики, разработчик может решать:\n\n```text\nкакие запросы идут в master\nкакие запросы идут в read replica\nможно ли читать устаревшие данные\nчто делать после записи, если нужно сразу прочитать свежие данные\n```\n\nНапример:\n\n```text\nPOST /orders       → primary database\nGET /orders/list   → read replica\n```\n\nНо тут есть проблема replica lag. После записи данные на реплике могут появиться не мгновенно. Поэтому нельзя бездумно отправлять все `SELECT` на реплики.\n\n### 10. Настройки тестовой БД\n\nРазработчик обычно решает:\n\n```text\nиспользовать SQLite или тот же PostgreSQL\nсоздавать отдельную test database\nоткатывать тесты транзакциями или пересоздавать схему\nзапускать ли миграции в тестах\nчем наполнять тестовые данные\n```\n\nДля серьёзного backend-проекта лучше тестировать на той же СУБД, что и production. SQLite и PostgreSQL по-разному работают с типами, блокировками, JSON, индексами, ограничениями и SQL-синтаксисом.\n\n### 11. Расширения PostgreSQL\n\nИногда разработчик решает, какие расширения нужны:\n\n```sql\nCREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";\nCREATE EXTENSION IF NOT EXISTS pg_trgm;\nCREATE EXTENSION IF NOT EXISTS citext;\nCREATE EXTENSION IF NOT EXISTS postgis;\n```\n\nПримеры:\n\n```text\nuuid-ossp / pgcrypto — генерация UUID\npg_trgm — ускорение поиска по похожести / ILIKE\ncitext — case-insensitive text\npostgis — геоданные\n```\n\nЭто уже влияет не только на код, но и на инфраструктуру: расширения должны быть доступны в окружении БД.\n\n### 12. Логирование и диагностика запросов\n\nРазработчик обычно настраивает или просит включить:\n\n```text\nлогирование медленных запросов\nEXPLAIN / EXPLAIN ANALYZE для проблемных запросов\nметрики количества соединений\nметрики длительности запросов\nконтроль deadlocks\n```\n\nНа уровне приложения это может быть логирование SQL-запросов ORM, middleware для slow queries, OpenTelemetry, APM.\n\n### Что чаще не решает обычный разработчик один\n\nОбычно это зона DBA/DevOps/SRE, но разработчик может участвовать:\n\n```text\nshared_buffers\nwork_mem\nmaintenance_work_mem\nwal_level\ncheckpoint_timeout\nmax_wal_size\nautovacuum thresholds\nreplication slots\nbackup policy\nHA/failover\nphysical storage\npartitioning strategy для очень больших таблиц\n```\n\nНапример, `shared_buffers` и другие параметры памяти относятся к resource consumption settings PostgreSQL и обычно требуют понимания нагрузки и ресурсов сервера. \n\n### Коротко\n\nОбычно backend-разработчик принимает решения по таким вещам:\n\n```text\nподключение к БД\nпул соединений\nструктура таблиц\nтипы данных\nconstraints\nиндексы\nмиграции\nграницы транзакций\nтаймауты запросов\nнастройки ORM\nтестовая БД\nread/write routing\nрасширения PostgreSQL\nлогирование медленных запросов\n```\n\nА низкоуровневый тюнинг PostgreSQL, репликация, бэкапы, WAL, память и autovacuum обычно решаются вместе с DBA/DevOps, потому что там ошибка может повлиять на всю БД, а не только на один сервис."
  popularity = 2.63

[[questions]]
  id = 23
  question = "Как в PostgreSQL работает блокировка строки (row-level lock)?"
  answer = "### Что такое row-level lock\n\nRow-level lock — это блокировка конкретной строки, а не всей таблицы.\n\nОна нужна, чтобы две транзакции не могли одновременно конфликтно изменить одну и ту же строку. В PostgreSQL row-level lock не мешает обычному чтению данных: он блокирует только другие операции записи или другие попытки взять конфликтующую блокировку на ту же строку. Официальная документация PostgreSQL прямо указывает: row-level locks не влияют на обычный запрос данных, они блокируют только writers and lockers для той же строки. \n\nТо есть обычный `SELECT` обычно не ждёт row-level lock:\n\n```sql\nSELECT *\nFROM accounts\nWHERE id = 1;\n```\n\nНо `UPDATE`, `DELETE` или `SELECT ... FOR UPDATE` по той же строке могут ждать.\n\n---\n\n### Простой пример\n\nЕсть таблица:\n\n```sql\nCREATE TABLE accounts (\n    id bigint PRIMARY KEY,\n    balance numeric NOT NULL\n);\n```\n\nПервая транзакция:\n\n```sql\nBEGIN;\n\nUPDATE accounts\nSET balance = balance - 100\nWHERE id = 1;\n\n-- транзакция пока не завершена\n```\n\nКогда PostgreSQL выполняет этот `UPDATE`, он берёт блокировку на строку `accounts.id = 1`.\n\nВторая транзакция в это время пытается изменить ту же строку:\n\n```sql\nBEGIN;\n\nUPDATE accounts\nSET balance = balance - 50\nWHERE id = 1;\n```\n\nВторая транзакция не сможет сразу выполнить изменение. Она будет ждать, пока первая сделает:\n\n```sql\nCOMMIT;\n```\n\nили:\n\n```sql\nROLLBACK;\n```\n\nПосле этого PostgreSQL продолжит выполнение второй транзакции.\n\n---\n\n### Что именно блокируется\n\nБлокируется не вся таблица `accounts`, а конкретная строка:\n\n```text\naccounts.id = 1\n```\n\nДругая строка той же таблицы может обновляться параллельно:\n\n```sql\nUPDATE accounts\nSET balance = balance - 50\nWHERE id = 2;\n```\n\nЕсли первая транзакция заблокировала только `id = 1`, то `id = 2` не конфликтует.\n\n---\n\n### Обычный SELECT не блокируется\n\nВ PostgreSQL работает MVCC. Поэтому читающий запрос обычно видит согласованную версию данных, а не ждёт, пока завершится чужой `UPDATE`.\n\nПример:\n\n```sql\n-- Transaction 1\nBEGIN;\n\nUPDATE accounts\nSET balance = balance - 100\nWHERE id = 1;\n```\n\nПока первая транзакция не сделала `COMMIT`, другой запрос:\n\n```sql\n-- Transaction 2\nSELECT balance\nFROM accounts\nWHERE id = 1;\n```\n\nобычно прочитает старую зафиксированную версию строки.\n\nЭто важное отличие PostgreSQL: чтение и запись не обязательно блокируют друг друга. Документация PostgreSQL описывает concurrency control как механизм, который должен позволять нескольким сессиям одновременно работать с одними и теми же данными, сохраняя целостность данных. \n\n---\n\n### SELECT FOR UPDATE\n\n`SELECT ... FOR UPDATE` используется, когда нужно заранее заблокировать строки, которые потом будут изменяться.\n\nПример:\n\n```sql\nBEGIN;\n\nSELECT *\nFROM accounts\nWHERE id = 1\nFOR UPDATE;\n\nUPDATE accounts\nSET balance = balance - 100\nWHERE id = 1;\n\nCOMMIT;\n```\n\n`FOR UPDATE` блокирует выбранные строки так, как будто они будут обновляться. Другие транзакции не смогут изменить, удалить или взять конфликтующую блокировку на эти строки до завершения текущей транзакции. \n\nЭто нужно, например, при работе с балансом:\n\n```text\n1. прочитать текущий баланс\n2. проверить, хватает ли денег\n3. списать деньги\n```\n\nЕсли не взять блокировку, две параллельные транзакции могут обе увидеть один и тот же старый баланс и принять неверное решение.\n\n---\n\n### Что происходит при конфликте\n\nДопустим:\n\n```sql\n-- Transaction 1\nBEGIN;\n\nSELECT *\nFROM accounts\nWHERE id = 1\nFOR UPDATE;\n```\n\nТеперь строка `id = 1` заблокирована.\n\nВторая транзакция:\n\n```sql\n-- Transaction 2\nUPDATE accounts\nSET balance = balance - 100\nWHERE id = 1;\n```\n\nОна будет ждать завершения первой транзакции.\n\nЕсли первая транзакция сделает:\n\n```sql\nCOMMIT;\n```\n\nвторая продолжит работу уже с учётом актуального состояния строки.\n\nЕсли первая сделает:\n\n```sql\nROLLBACK;\n```\n\nблокировка освободится, и вторая транзакция сможет выполнить свой `UPDATE`.\n\n---\n\n### Блокировка держится до конца транзакции\n\nRow-level lock обычно удерживается до завершения транзакции:\n\n```sql\nCOMMIT;\n```\n\nили:\n\n```sql\nROLLBACK;\n```\n\nPostgreSQL указывает, что row-level locks освобождаются в конце транзакции или при rollback к savepoint, если блокировка была взята после этого savepoint. \n\nПоэтому опасно держать транзакцию открытой долго:\n\n```sql\nBEGIN;\n\nSELECT *\nFROM accounts\nWHERE id = 1\nFOR UPDATE;\n\n-- здесь приложение ждёт внешний API, ввод пользователя или долгую операцию\n\nCOMMIT;\n```\n\nПока транзакция открыта, другие операции по этой строке могут стоять в ожидании.\n\n---\n\n### Основные режимы row-level lock\n\nВ PostgreSQL есть несколько режимов строковых блокировок:\n\n```text\nFOR UPDATE\nFOR NO KEY UPDATE\nFOR SHARE\nFOR KEY SHARE\n```\n\n`FOR UPDATE` — самый строгий режим для обычных сценариев. Он нужен, когда строку планируют менять или удалять.\n\n`FOR NO KEY UPDATE` слабее: PostgreSQL обычно использует его для `UPDATE`, который не меняет ключевые колонки, важные для foreign key.\n\n`FOR SHARE` позволяет другим транзакциям тоже брать shared lock, но мешает изменять или удалять строку.\n\n`FOR KEY SHARE` ещё слабее: он защищает ключевые значения строки, например когда нужно не дать удалить родительскую строку, пока на неё ссылается foreign key. PostgreSQL описывает эти режимы и их конфликты в разделе Row-Level Lock Modes. \n\nНа практике чаще всего вручную используют:\n\n```sql\nSELECT ... FOR UPDATE;\n```\n\nОстальные режимы нужны в более точной настройке конкурентного доступа.\n\n---\n\n### NOWAIT и SKIP LOCKED\n\nПо умолчанию, если строка уже заблокирована, PostgreSQL будет ждать.\n\nИногда ждать не нужно. Тогда используют `NOWAIT`:\n\n```sql\nSELECT *\nFROM accounts\nWHERE id = 1\nFOR UPDATE NOWAIT;\n```\n\nЕсли строка уже заблокирована, запрос сразу завершится ошибкой, а не будет висеть в ожидании.\n\nДля очередей задач часто используют `SKIP LOCKED`:\n\n```sql\nSELECT *\nFROM jobs\nWHERE status = 'pending'\nORDER BY id\nLIMIT 10\nFOR UPDATE SKIP LOCKED;\n```\n\nСмысл: взять свободные строки, а уже заблокированные другими воркерами пропустить.\n\nТак несколько воркеров могут параллельно разбирать задачи из одной таблицы:\n\n```text\nworker 1 забрал jobs 1-10\nworker 2 пропустил заблокированные 1-10 и забрал 11-20\nworker 3 забрал 21-30\n```\n\n---\n\n### Как увидеть блокировки\n\nДля диагностики используют `pg_locks`.\n\nПример:\n\n```sql\nSELECT\n    locktype,\n    relation::regclass,\n    page,\n    tuple,\n    transactionid,\n    pid,\n    mode,\n    granted,\n    waitstart\nFROM pg_locks\nWHERE NOT granted;\n```\n\n`pg_locks` показывает активные блокировки и ожидания блокировок. В документации PostgreSQL указано, что одна строка в `pg_locks` соответствует lockable object, режиму блокировки и процессу; поле `granted = false` означает, что процесс ждёт блокировку. \n\nВажный нюанс: row-level locks обычно хранятся на диске, а не в памяти, поэтому сами строковые блокировки не всегда видны в `pg_locks` как `tuple`. Если процесс ждёт строковую блокировку, он часто отображается как ожидание transaction ID владельца этой блокировки. \n\n---\n\n### Deadlock на строках\n\nRow-level locks могут привести к deadlock.\n\nПример:\n\n```sql\n-- Transaction 1\nBEGIN;\nUPDATE accounts SET balance = balance - 100 WHERE id = 1;\nUPDATE accounts SET balance = balance + 100 WHERE id = 2;\n```\n\nПараллельно:\n\n```sql\n-- Transaction 2\nBEGIN;\nUPDATE accounts SET balance = balance - 50 WHERE id = 2;\nUPDATE accounts SET balance = balance + 50 WHERE id = 1;\n```\n\nЧто происходит:\n\n```text\nTransaction 1 заблокировала строку id = 1\nTransaction 2 заблокировала строку id = 2\n\nTransaction 1 ждёт id = 2\nTransaction 2 ждёт id = 1\n```\n\nПолучается deadlock. PostgreSQL умеет автоматически обнаруживать deadlock и завершает одну из транзакций, чтобы вторая могла продолжить. В документации также указано, что deadlock может возникать из-за row-level locks, и лучшая защита — брать блокировки в одинаковом порядке во всех транзакциях. \n\nПравильнее:\n\n```sql\n-- всегда блокировать счета по возрастанию id\nSELECT *\nFROM accounts\nWHERE id IN (1, 2)\nORDER BY id\nFOR UPDATE;\n```\n\n---\n\n### Типичный backend-сценарий\n\nНапример, нужно безопасно списать деньги:\n\n```sql\nBEGIN;\n\nSELECT balance\nFROM accounts\nWHERE id = 1\nFOR UPDATE;\n\n-- приложение проверяет balance\n\nUPDATE accounts\nSET balance = balance - 100\nWHERE id = 1;\n\nCOMMIT;\n```\n\nЭто защищает от ситуации, когда два параллельных запроса одновременно читают один и тот же баланс и оба пытаются его списать.\n\nНо важно не держать транзакцию дольше необходимого. Нельзя внутри такой транзакции делать долгие внешние HTTP-запросы, ждать пользователя или выполнять тяжёлую бизнес-логику.\n\n---\n\n### Коротко\n\nRow-level lock в PostgreSQL — это блокировка конкретной строки.\n\nГлавное:\n\n```text\nUPDATE и DELETE автоматически блокируют изменяемые строки.\nSELECT FOR UPDATE блокирует выбранные строки явно.\nОбычный SELECT обычно не ждёт row-level lock из-за MVCC.\nДругой UPDATE/DELETE по той же строке будет ждать.\nБлокировка держится до COMMIT или ROLLBACK.\nДолгие транзакции усиливают проблему блокировок.\nDeadlock возможен, если разные транзакции блокируют строки в разном порядке.\n```\n\nПрактический смысл: row-level lock нужен, чтобы безопасно выполнять конкурентные изменения одной и той же строки без потери данных и гонок."
  popularity = 2.63

[[questions]]
  id = 24
  question = "Что такое блокировки в базе данных? Как они работают и какие бывают?"
  answer = "Блокировки (или локи) в базе данных - это механизм, управляющий конкурентным доступом к данным, чтобы избежать конфликтов и ошибок. Есть два типа блокировок  \n  \n**Оптимистическая блокировка** - при завершении транзакции сверяется текущая версия данных и версия, полученная в начале транзакции. Если они не совпадают, то транзакция откатывается. Подразумевает, что конфликты будут происходить нечасто  \n```sql  \nSELECT version  \nFROM orders  \nWHERE id = 1;  \n  \n-- Обновляем, если версия не изменилась  \nUPDATE orders  \nSET status = 'processed', version = version + 1  \nWHERE id = 1 AND version = 5;  \n```  \n  \n**Пессимистическая блокировка** - при начале транзакции изменяемые данные блокируются для всех остальных, пока текущая транзакция не закончится  \n```sql  \nSELECT *  \nFROM orders  \nWHERE id = 1  \nFOR UPDATE;  \n```  \n  \n**Сравнение**  \n  \n| **Характеристика**   | **Оптимистичные локи**         | **Пессимистичные локи**   |     |\n| -------------------- | ------------------------------ | ------------------------- | --- |\n| Конфликты            | Редкие                         | Частые                    |     |\n| Механизм             | Проверка версии данных         | Блокировка ресурса        |     |\n| Производительность   | Выше при редких конфликтах     | Ниже из-за блокировок     |     |\n| Обработка конфликтов | Требует доп. кода              | Не требуется              |     |\n| Применимость         | Чтение превалирует над записью | Высококонкурентная запись |     |"
  popularity = 2.63

[[questions]]
  id = 25
  question = "Что обычно используют в качестве Primary Key в реляционной базе данных (Какие типы данных чаще всего выбирают)?"
  answer = "В реляционных БД чаще всего используют **суррогатный Primary Key** — отдельное поле `id`, которое не несёт бизнес-смысла.\n\n### Самые частые варианты\n\n|Тип|Где используют|Пример|\n|---|---|---|\n|`BIGINT` / `BIGSERIAL` / `IDENTITY`|Самый частый вариант для обычных backend-приложений|`id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY`|\n|`INTEGER` / `SERIAL`|Маленькие и средние таблицы, где точно не будет миллиардов записей|`id SERIAL PRIMARY KEY`|\n|`UUID`|Распределённые системы, микросервисы, генерация id на стороне приложения, публичные id|`id UUID PRIMARY KEY`|\n|Составной ключ|Связующие таблицы, например many-to-many|`PRIMARY KEY (user_id, role_id)`|\n|Natural key|Редко, когда бизнес-поле стабильно и реально уникально|`country_code`, `passport_number`, `isbn`|\n\n### Что обычно выбирают на практике\n\nДля большинства проектов:\n\n```sql\nid BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY\n```\n\nЭто хороший дефолт: компактный, быстрый для индексов, хорошо работает с B-tree, автоматически генерируется базой.\n\nВ PostgreSQL `IDENTITY` — современный способ автоинкрементного ключа через неявную sequence; документация прямо показывает пример с `id bigint GENERATED ... AS IDENTITY`. При этом сама `IDENTITY`-колонка не гарантирует уникальность без `PRIMARY KEY` или `UNIQUE`. ([PostgreSQL](https://www.postgresql.org/docs/current/ddl-identity-columns.html \"PostgreSQL: Documentation: 18: 5.3. Identity Columns\"))\n\n### Почему часто берут `BIGINT`, а не `INTEGER`\n\n`INTEGER` занимает 4 байта, `BIGINT` — 8 байт. Но `INTEGER` ограничен примерно 2.1 млрд положительных значений, а для долгоживущих таблиц, логов, заказов, событий, уведомлений и аудита это может стать проблемой. В PostgreSQL `serial` создаёт `integer`, а `bigserial` создаёт `bigint`; документация рекомендует `bigserial`, если ожидается больше `2^31` идентификаторов за жизнь таблицы. \n\n### UUID как Primary Key\n\n`UUID` используют, когда id нужно генерировать независимо от БД или не хочется раскрывать последовательные номера наружу:\n\n```sql\nid UUID PRIMARY KEY\n```\n\nВ PostgreSQL есть нативный тип `uuid`, то есть его не нужно хранить как `varchar` или `text`. \n\nМинус UUID: он больше по размеру, хуже для локальности вставок в B-tree, особенно если используется случайный UUID v4. Поэтому для внутренних таблиц обычный `BIGINT IDENTITY` часто эффективнее.\n\n### AUTO_INCREMENT в MySQL\n\nВ MySQL типичный вариант:\n\n```sql\nid BIGINT AUTO_INCREMENT PRIMARY KEY\n```\n\nMySQL автоматически назначает последовательные значения для `AUTO_INCREMENT`, если значение явно не передано. Документация также рекомендует выбирать минимальный целочисленный тип, которого достаточно для ожидаемого диапазона значений.\n\n### Итог\n\nЛучший стандартный выбор:\n\n```sql\nid BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY\n```\n\nДля PostgreSQL это предпочтительнее старого `SERIAL`, потому что `IDENTITY` явно описывает авто生成ируемую колонку.  \n`UUID` стоит брать, когда нужен распределённый id, внешний публичный id или генерация идентификаторов вне базы.  \nСоставной Primary Key уместен в связующих таблицах.  \nNatural key лучше использовать осторожно, потому что бизнес-значения могут меняться."
  popularity = 2.63

[[questions]]
  id = 26
  question = "Как работает автоинкрементный id через sequence в PostgreSQL?"
  answer = "### Суть\n\nВ PostgreSQL автоинкрементный `id` обычно работает не как специальное свойство самой колонки, а через отдельный объект — **sequence**.\n\nSequence — это генератор чисел. PostgreSQL хранит его отдельно от таблицы и при вставке новой строки берёт следующее значение через функцию `nextval()`.\n\nПример:\n\n```sql\nCREATE TABLE users (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    username TEXT NOT NULL\n);\n```\n\nКогда выполняется:\n\n```sql\nINSERT INTO users (username) VALUES ('alex');\n```\n\nPostgreSQL фактически получает новый `id` из внутренней sequence, связанной с колонкой `users.id`. В документации PostgreSQL identity column прямо описана как колонка, которая автоматически генерируется из неявной sequence. \n\n### Что происходит внутри\n\nУпрощённо:\n\n```sql\nCREATE SEQUENCE users_id_seq;\n\nCREATE TABLE users (\n    id BIGINT NOT NULL DEFAULT nextval('users_id_seq'),\n    username TEXT NOT NULL\n);\n\nALTER SEQUENCE users_id_seq OWNED BY users.id;\n```\n\nТо есть у колонки `id` стоит значение по умолчанию:\n\n```sql\nDEFAULT nextval('users_id_seq')\n```\n\nКогда ты вставляешь строку и не указываешь `id`, PostgreSQL вызывает `nextval()`. Эта функция атомарно увеличивает sequence и возвращает новое значение. Даже если несколько транзакций одновременно делают `INSERT`, каждая получит отдельное значение. \n\n### Пример по шагам\n\n```sql\nINSERT INTO users (username) VALUES ('A');\n-- nextval() вернул 1\n\nINSERT INTO users (username) VALUES ('B');\n-- nextval() вернул 2\n\nINSERT INTO users (username) VALUES ('C');\n-- nextval() вернул 3\n```\n\nВ таблице получится:\n\n```text\nid | username\n---+---------\n1  | A\n2  | B\n3  | C\n```\n\n### Важный момент: sequence не откатывается при rollback\n\nНапример:\n\n```sql\nBEGIN;\n\nINSERT INTO users (username) VALUES ('bad_user');\n-- id = 4\n\nROLLBACK;\n```\n\nСтрока откатится, но значение `4` уже было выдано sequence. Следующая вставка получит уже `5`, а не `4`.\n\nПоэтому пропуски в `id` — это нормально:\n\n```text\n1, 2, 3, 5, 6\n```\n\n`id` через sequence гарантирует не «идеальную нумерацию без дыр», а безопасную выдачу уникальных значений при конкурентных вставках. `nextval()` в PostgreSQL атомарен и безопасен для одновременных вызовов из разных сессий. \n\n### Чем отличаются SERIAL и IDENTITY\n\nСтарый способ:\n\n```sql\nid BIGSERIAL PRIMARY KEY\n```\n\nСовременный способ:\n\n```sql\nid BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY\n```\n\n`SERIAL` / `BIGSERIAL` — это псевдотипы. Они создают sequence и ставят `nextval()` как `DEFAULT` для колонки. А `IDENTITY` — более современный SQL-стандартный синтаксис, где PostgreSQL сам создаёт связанную sequence для identity-колонки. Связанную sequence можно получить через `pg_get_serial_sequence()`, причём функция работает и для `serial`, и для `identity`-колонок. \n\n### Как посмотреть sequence у колонки\n\n```sql\nSELECT pg_get_serial_sequence('users', 'id');\n```\n\nРезультат будет примерно:\n\n```text\npublic.users_id_seq\n```\n\nПотом можно посмотреть текущее состояние:\n\n```sql\nSELECT last_value, is_called\nFROM users_id_seq;\n```\n\nНо `last_value` — это не всегда «следующий id». Это последнее значение, уже выделенное sequence. PostgreSQL отдельно отмечает, что `last_value` может устареть к моменту просмотра, если другие сессии параллельно вызывают `nextval()`. \n\n### Как вручную получить следующий id\n\n```sql\nSELECT nextval('users_id_seq');\n```\n\nЭто сразу сдвинет sequence вперёд.\n\n```sql\nSELECT currval('users_id_seq');\n```\n\n`currval()` вернёт последнее значение sequence, полученное через `nextval()` в текущей сессии. То есть сначала в этой же сессии должен быть вызван `nextval()`.\n\n### Как сбросить или синхронизировать sequence\n\nПосле ручной загрузки данных может возникнуть проблема:\n\n```sql\nINSERT INTO users (id, username) VALUES (100, 'manual');\n```\n\nЕсли sequence всё ещё думает, что последний id был `5`, следующая авто-вставка может попытаться вставить `6`, а не `101`.\n\nОбычно sequence синхронизируют так:\n\n```sql\nSELECT setval(\n    pg_get_serial_sequence('users', 'id'),\n    COALESCE(MAX(id), 1)\n)\nFROM users;\n```\n\nПосле этого следующий `nextval()` пойдёт дальше от текущего максимального `id`.\n\n### Главное\n\nАвтоинкрементный `id` в PostgreSQL — это связка:\n\n```text\nколонка id\n  ↓\nDEFAULT nextval(...)\n  ↓\nsequence\n  ↓\nследующее число\n```\n\nSequence нужна, чтобы быстро и безопасно выдавать уникальные числа при параллельных `INSERT`. Она не предназначена для красивой непрерывной нумерации без пропусков."
  popularity = 2.63

[[questions]]
  id = 27
  question = "Можно ли создать таблицу без Primary Key?"
  answer = "Да, **таблицу можно создать без Primary Key**. В PostgreSQL это разрешено.\n\nПример:\n\n```sql\nCREATE TABLE logs (\n    message TEXT,\n    created_at TIMESTAMP\n);\n```\n\nТакая таблица будет работать: в неё можно делать `INSERT`, `SELECT`, `UPDATE`, `DELETE`.\n\nНо на практике для обычных бизнес-таблиц это почти всегда плохая идея.\n\n### Что теряется без Primary Key\n\nPrimary Key даёт сразу несколько вещей:\n\n1. **Уникальную идентификацию строки**\n    \n\nНапример, в таблице пользователей каждая строка должна иметь однозначный идентификатор:\n\n```sql\nid BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY\n```\n\nБез него сложнее точно обратиться к конкретной записи.\n\n2. **NOT NULL + UNIQUE**\n    \n\nВ PostgreSQL добавление `PRIMARY KEY` автоматически создаёт уникальный B-tree индекс и делает колонку или набор колонок `NOT NULL`. То есть Primary Key не может быть `NULL` и не может повторяться. \n\n3. **Связи через Foreign Key**\n    \n\nОбычно другие таблицы ссылаются именно на Primary Key:\n\n```sql\nCREATE TABLE orders (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    user_id BIGINT REFERENCES users(id)\n);\n```\n\nБез ключа таблицу сложнее нормально использовать в связях.\n\n4. **Удобную работу ORM**\n    \n\nDjango ORM, SQLAlchemy ORM и большинство других ORM ожидают, что у модели есть стабильный уникальный идентификатор. Без Primary Key начинаются ограничения: сложнее обновлять, удалять и однозначно отслеживать объект.\n\n### Когда таблица без Primary Key допустима\n\nТак делают в отдельных случаях:\n\n```text\nлоги,\nвременные staging-таблицы,\nтаблицы для импорта сырых данных,\nодноразовые промежуточные таблицы,\nаналитические таблицы, где строки не обновляются по одной.\n```\n\nНапример:\n\n```sql\nCREATE TABLE raw_import_events (\n    payload JSONB,\n    imported_at TIMESTAMP DEFAULT now()\n);\n```\n\nЕсли это просто временная таблица для загрузки данных, Primary Key может быть не нужен.\n\n### Когда Primary Key лучше обязательно делать\n\nДля обычных таблиц приложения:\n\n```text\nusers,\norders,\nproducts,\nnotifications,\nfiles,\npayments,\ncomments,\nposts\n```\n\nPrimary Key лучше делать всегда.\n\nОбычный вариант:\n\n```sql\nCREATE TABLE users (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    username TEXT NOT NULL\n);\n```\n\n### Важный нюанс про MySQL\n\nВ MySQL InnoDB таблица тоже может быть создана без явного Primary Key, но в новых версиях есть механизм **Generated Invisible Primary Key**: при включённой настройке `sql_generate_invisible_primary_key` MySQL может автоматически добавить скрытый первичный ключ для InnoDB-таблицы без явного PK. \n\nТо есть в некоторых СУБД или конфигурациях отсутствие явного Primary Key может обрабатываться особым образом.\n\n### Итог\n\n**Технически — да, таблицу можно создать без Primary Key.**\n\nНо для нормальной прикладной таблицы лучше почти всегда добавлять:\n\n```sql\nid BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY\n```\n\nБез Primary Key таблица допустима в основном для логов, импорта, временных данных и некоторых аналитических сценариев."
  popularity = 2.63

[[questions]]
  id = 28
  question = "Чем отличается суррогатный ключ от натурального ключа?"
  answer = "**Суррогатный ключ** — искусственный технический идентификатор строки.\n\n```sql\nid BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY\n```\n\n**Натуральный ключ** — реальное бизнес-значение, которое уже существует в предметной области и само по себе уникально.\n\n```sql\nemail TEXT UNIQUE NOT NULL\n```\n\nPostgreSQL определяет `PRIMARY KEY` как колонку или набор колонок, которые уникально идентифицируют строки; значения Primary Key должны быть `UNIQUE` и `NOT NULL`. \n\n### Пример\n\nТаблица пользователей:\n\n```sql\nCREATE TABLE users (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    email TEXT UNIQUE NOT NULL,\n    username TEXT NOT NULL\n);\n```\n\nЗдесь:\n\n```text\nid    -> суррогатный ключ\nemail -> натуральный ключ-кандидат\n```\n\n`id` не имеет смысла вне базы. Это просто технический номер строки.\n\n`email` имеет бизнес-смысл: пользователь реально использует этот адрес, по нему его можно идентифицировать.\n\n### Главное отличие\n\n|Критерий|Суррогатный ключ|Натуральный ключ|\n|---|---|---|\n|Имеет бизнес-смысл|Нет|Да|\n|Пример|`id`, `uuid`|`email`, `phone`, `passport_number`, `sku`, `country_code`|\n|Генерируется системой|Обычно да|Обычно приходит из предметной области|\n|Может измениться|Почти никогда|Может измениться|\n|Удобен для Foreign Key|Да|Не всегда|\n|Размер|Обычно маленький: `BIGINT`|Может быть длинным или составным|\n|Риск изменения бизнес-правил|Низкий|Выше|\n\nIBM описывает натуральные ключи как осмысленные значения, идентифицирующие записи, например номера соцстрахования, календарные даты или SKU товара. Суррогатные ключи, по IBM и Kimball Group, используются как искусственные/замещающие ключи, особенно когда натуральные ключи могут меняться, переиспользоваться или быть неудобными для связей. \n\n### Почему чаще используют суррогатный ключ\n\nПотому что он стабильный.\n\nНапример, если сделать `email` Primary Key:\n\n```sql\nCREATE TABLE users (\n    email TEXT PRIMARY KEY,\n    username TEXT NOT NULL\n);\n```\n\nИ на него ссылается другая таблица:\n\n```sql\nCREATE TABLE orders (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    user_email TEXT REFERENCES users(email)\n);\n```\n\nЕсли пользователь сменит email, придётся обновлять связи. Это можно сделать через `ON UPDATE CASCADE`, но сама модель становится более хрупкой.\n\nС суррогатным ключом проще:\n\n```sql\nCREATE TABLE users (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    email TEXT UNIQUE NOT NULL\n);\n\nCREATE TABLE orders (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    user_id BIGINT REFERENCES users(id)\n);\n```\n\nТеперь email можно менять, а связь остаётся через стабильный `user_id`.\n\n### Натуральный ключ всё равно часто нужен\n\nСуррогатный `id` не отменяет бизнес-уникальность.\n\nПлохой вариант:\n\n```sql\nCREATE TABLE users (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    email TEXT NOT NULL\n);\n```\n\nТак можно случайно создать двух пользователей с одинаковым email.\n\nПравильнее:\n\n```sql\nCREATE TABLE users (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    email TEXT UNIQUE NOT NULL\n);\n```\n\nТо есть:\n\n```text\nid    -> Primary Key для связей\nemail -> UNIQUE constraint для бизнес-уникальности\n```\n\nPostgreSQL автоматически создаёт уникальный индекс для `PRIMARY KEY` и `UNIQUE` constraints, и именно этот индекс обеспечивает проверку уникальности. \n\n### Когда натуральный ключ можно использовать как Primary Key\n\nКогда значение:\n\n```text\nреально уникально,\nкороткое,\nстабильное,\nне меняется по бизнес-правилам,\nне содержит чувствительных данных,\nудобно для внешних ключей.\n```\n\nПримеры:\n\n```sql\nCREATE TABLE countries (\n    code CHAR(2) PRIMARY KEY,\n    name TEXT NOT NULL\n);\n```\n\nЗдесь `code = 'AZ'`, `TR`, `US` может быть нормальным натуральным ключом.\n\nНо для пользователей, заказов, файлов, платежей, комментариев, уведомлений обычно лучше суррогатный `id`.\n\n### Итог\n\nВ прикладной разработке чаще делают так:\n\n```sql\nCREATE TABLE users (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    email TEXT UNIQUE NOT NULL,\n    username TEXT NOT NULL\n);\n```\n\n`id` — суррогатный ключ, стабильный технический идентификатор.  \n`email` — натуральный бизнес-идентификатор, но не основной ключ для связей.\n\nЭто самый практичный подход: связи строятся по стабильному `id`, а бизнес-уникальность защищается отдельным `UNIQUE`."
  popularity = 2.63

[[questions]]
  id = 29
  question = "Что такое GIN index в PostgreSQL?"
  answer = "### Что такое GIN index\n\n**GIN index** в PostgreSQL — это индекс для поиска **внутри составных значений**: массивов, `jsonb`, документов полнотекстового поиска и похожих структур.\n\nGIN расшифровывается как **Generalized Inverted Index** — обобщённый инвертированный индекс. PostgreSQL описывает его как индекс для случаев, когда значение состоит из нескольких элементов, а запрос ищет наличие конкретного элемента внутри этого значения. Например: документ содержит слова, массив содержит элементы, `jsonb` содержит ключи и значения. \n\n### Простая идея\n\nОбычный B-tree индекс хорошо работает с простыми значениями:\n\n```sql\nWHERE id = 10\nWHERE email = 'a@test.com'\nWHERE created_at > '2026-01-01'\n```\n\nА GIN нужен, когда в одной ячейке лежит **много внутренних элементов**.\n\nНапример:\n\n```sql\ntags = ARRAY['python', 'postgresql', 'backend']\n```\n\nGIN индексирует не всю ячейку как одно значение, а отдельные элементы:\n\n```text\npython     -> строки, где есть python\npostgresql -> строки, где есть postgresql\nbackend    -> строки, где есть backend\n```\n\nТо есть это похоже на словарь:\n\n```text\nэлемент -> список строк, где он встречается\n```\n\nПоэтому он и называется **инвертированным индексом**.\n\n### Где используют GIN\n\nЧаще всего GIN используют для:\n\n```text\nмассивов,\njsonb,\nполнотекстового поиска,\nпоиска по trigram через расширение pg_trgm.\n```\n\n### Пример с массивом\n\nТаблица:\n\n```sql\nCREATE TABLE articles (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    title TEXT,\n    tags TEXT[]\n);\n```\n\nИндекс:\n\n```sql\nCREATE INDEX articles_tags_gin_idx\nON articles\nUSING GIN (tags);\n```\n\nЗапрос:\n\n```sql\nSELECT *\nFROM articles\nWHERE tags @> ARRAY['postgresql'];\n```\n\nОператор `@>` означает: массив слева содержит массив справа.\n\nБез GIN PostgreSQL часто должен просматривать много строк. С GIN он может быстро найти строки, где внутри массива есть нужный элемент. В документации PostgreSQL прямо сказано, что GIN подходит для значений с несколькими компонентами, например массивов, и эффективно обрабатывает проверки наличия конкретных компонентов. \n\n### Пример с JSONB\n\n```sql\nCREATE TABLE products (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    data JSONB\n);\n```\n\nПример данных:\n\n```json\n{\n  \"brand\": \"Samsung\",\n  \"color\": \"black\",\n  \"storage\": 256\n}\n```\n\nGIN индекс:\n\n```sql\nCREATE INDEX products_data_gin_idx\nON products\nUSING GIN (data);\n```\n\nЗапрос:\n\n```sql\nSELECT *\nFROM products\nWHERE data @> '{\"brand\": \"Samsung\"}';\n```\n\nЗдесь GIN помогает искать документы `jsonb`, которые содержат нужный ключ или пару ключ-значение.\n\n### Пример с полнотекстовым поиском\n\n```sql\nCREATE TABLE posts (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    body TEXT\n);\n```\n\nИндекс:\n\n```sql\nCREATE INDEX posts_body_fts_idx\nON posts\nUSING GIN (to_tsvector('russian', body));\n```\n\nЗапрос:\n\n```sql\nSELECT *\nFROM posts\nWHERE to_tsvector('russian', body) @@ plainto_tsquery('russian', 'postgresql индекс');\n```\n\nЗдесь PostgreSQL разбивает текст на лексемы и GIN хранит связь:\n\n```text\nслово/лексема -> строки, где оно встречается\n```\n\n### Чем GIN отличается от B-tree\n\n|B-tree|GIN|\n|---|---|\n|Для простых скалярных значений|Для составных значений|\n|`id`, `email`, `created_at`, `price`|`jsonb`, массивы, `tsvector`, trigram|\n|Хорош для `=`, `<`, `>`, `ORDER BY`, диапазонов|Хорош для поиска «содержит элемент»|\n|Индексирует значение целиком|Индексирует внутренние элементы значения|\n\nB-tree подходит для данных, которые можно упорядочить в линейном порядке. PostgreSQL документация описывает B-tree как индекс для типов, которые можно отсортировать. \n\nGIN не про сортировку. Он про быстрый поиск по внутренним компонентам.\n\n### Когда GIN не нужен\n\nGIN обычно не нужен для таких запросов:\n\n```sql\nWHERE id = 100\nWHERE email = 'test@example.com'\nWHERE price > 500\nWHERE created_at BETWEEN '2026-01-01' AND '2026-02-01'\nORDER BY created_at DESC\n```\n\nДля этого обычно используют B-tree.\n\n### Минусы GIN\n\nGIN индекс может быть тяжёлым:\n\n```text\nзанимает больше места,\nмедленнее обновляется при INSERT/UPDATE/DELETE,\nможет быть избыточным на маленьких таблицах,\nплохо подходит для частых массовых изменений.\n```\n\nОбщее правило PostgreSQL: индексы ускоряют чтение, но добавляют накладные расходы на запись и обслуживание, поэтому их нужно использовать осмысленно. \n\n### Итог\n\nGIN index — это индекс для поиска **внутри сложных значений**.\n\nЕго используют, когда запросы выглядят примерно так:\n\n```sql\n-- массив содержит элемент\nWHERE tags @> ARRAY['python']\n\n-- jsonb содержит ключ/значение\nWHERE data @> '{\"status\": \"active\"}'\n\n-- полнотекстовый поиск\nWHERE search_vector @@ to_tsquery('postgresql')\n\n-- поиск по похожести/подстрокам через pg_trgm\nWHERE name ILIKE '%phone%'\n```\n\nДля обычных полей вроде `id`, `email`, `created_at`, `price` чаще нужен не GIN, а обычный B-tree индекс."
  popularity = 2.63

[[questions]]
  id = 30
  question = "LEFT JOIN, RIGHT JOIN"
  answer = "### LEFT JOIN\n\n`LEFT JOIN` возвращает:\n\n1. Все строки из левой таблицы.\n    \n2. Совпавшие строки из правой таблицы.\n    \n3. Если совпадения справа нет — PostgreSQL подставляет `NULL` в поля правой таблицы.\n    \n\n`LEFT JOIN` и `LEFT OUTER JOIN` — одно и то же. Слово `OUTER` можно не писать. PostgreSQL указывает, что `LEFT`, `RIGHT` и `FULL` являются outer join-типами. \n\nПример:\n\n```sql\nSELECT users.id, users.name, orders.id AS order_id\nFROM users\nLEFT JOIN orders ON orders.user_id = users.id;\n```\n\nДопустим, есть таблицы:\n\n```text\nusers\nid | name\n---+------\n1  | Alex\n2  | Bob\n3  | Tom\n```\n\n```text\norders\nid | user_id | amount\n---+---------+-------\n10 | 1       | 500\n11 | 1       | 300\n12 | 2       | 700\n```\n\nРезультат `LEFT JOIN`:\n\n```text\nuser_id | name | order_id\n--------+------+---------\n1       | Alex | 10\n1       | Alex | 11\n2       | Bob  | 12\n3       | Tom  | NULL\n```\n\nПользователь `Tom` попал в результат, хотя у него нет заказов. Поэтому поля из `orders` стали `NULL`.\n\n### RIGHT JOIN\n\n`RIGHT JOIN` работает наоборот:\n\n1. Все строки из правой таблицы.\n    \n2. Совпавшие строки из левой таблицы.\n    \n3. Если совпадения слева нет — поля левой таблицы будут `NULL`.\n    \n\n```sql\nSELECT users.id AS user_id, users.name, orders.id AS order_id\nFROM users\nRIGHT JOIN orders ON orders.user_id = users.id;\n```\n\nРезультат будет содержать все строки из `orders`, даже если для какого-то заказа не найден пользователь.\n\nПример:\n\n```text\nusers\nid | name\n---+------\n1  | Alex\n2  | Bob\n```\n\n```text\norders\nid | user_id | amount\n---+---------+-------\n10 | 1       | 500\n11 | 2       | 700\n12 | 99      | 300\n```\n\nРезультат `RIGHT JOIN`:\n\n```text\nuser_id | name | order_id\n--------+------+---------\n1       | Alex | 10\n2       | Bob  | 11\nNULL    | NULL | 12\n```\n\nЗаказ `12` попал в результат, потому что `orders` стоит справа, а `RIGHT JOIN` сохраняет все строки правой таблицы.\n\n### Главное отличие\n\n```sql\nusers LEFT JOIN orders\n```\n\nозначает:\n\n```text\nПокажи всех пользователей, даже если у них нет заказов.\n```\n\n```sql\nusers RIGHT JOIN orders\n```\n\nозначает:\n\n```text\nПокажи все заказы, даже если для них нет пользователя.\n```\n\n### LEFT JOIN обычно используют чаще\n\n`RIGHT JOIN` почти всегда можно переписать через `LEFT JOIN`, просто поменяв таблицы местами.\n\nВот это:\n\n```sql\nSELECT *\nFROM users\nRIGHT JOIN orders ON orders.user_id = users.id;\n```\n\nэквивалентно этому:\n\n```sql\nSELECT *\nFROM orders\nLEFT JOIN users ON users.id = orders.user_id;\n```\n\nНа практике `LEFT JOIN` читается проще, потому что основная таблица стоит первой. Поэтому в backend-разработке чаще пишут `LEFT JOIN`, а `RIGHT JOIN` используют редко.\n\nВ MySQL прямо указано, что на этапе парсинга `RIGHT OUTER JOIN` преобразуется в эквивалентный `LEFT JOIN`. Это не значит, что в PostgreSQL обязательно происходит точно так же, но хорошо показывает, что логически `RIGHT JOIN` можно выразить через `LEFT JOIN`. \n\n### Частый кейс LEFT JOIN: найти записи без связей\n\nНапример, найти пользователей без заказов:\n\n```sql\nSELECT users.id, users.name\nFROM users\nLEFT JOIN orders ON orders.user_id = users.id\nWHERE orders.id IS NULL;\n```\n\nЛогика:\n\n```text\nБерём всех пользователей.\nПытаемся присоединить заказы.\nОставляем только тех, у кого заказ не найден.\n```\n\nЭто типичный паттерн:\n\n```sql\nLEFT JOIN ... WHERE right_table.id IS NULL\n```\n\n### Важный нюанс с WHERE\n\nОшибка:\n\n```sql\nSELECT users.id, users.name, orders.id AS order_id\nFROM users\nLEFT JOIN orders ON orders.user_id = users.id\nWHERE orders.amount > 500;\n```\n\nНа первый взгляд это `LEFT JOIN`, но условие в `WHERE` отфильтрует строки, где `orders.amount IS NULL`. В результате пользователи без заказов пропадут, и запрос начнёт вести себя ближе к `INNER JOIN`.\n\nПравильнее переносить условие в `ON`, если нужно сохранить строки из левой таблицы:\n\n```sql\nSELECT users.id, users.name, orders.id AS order_id\nFROM users\nLEFT JOIN orders \n    ON orders.user_id = users.id\n   AND orders.amount > 500;\n```\n\nТеперь пользователи без подходящих заказов останутся в результате, а поля `orders` будут `NULL`.\n\n### Итог\n\n`LEFT JOIN`:\n\n```text\nОставляет все строки слева.\n```\n\n`RIGHT JOIN`:\n\n```text\nОставляет все строки справа.\n```\n\nВ реальном коде чаще используют `LEFT JOIN`, потому что его легче читать и почти любой `RIGHT JOIN` можно переписать через `LEFT JOIN`, поменяв порядок таблиц."
  popularity = 2.63

[[questions]]
  id = 31
  question = "Как работает FULL OUTER JOIN?"
  answer = "### Что делает FULL OUTER JOIN\n\n`FULL OUTER JOIN` возвращает **все строки из обеих таблиц**:\n\n1. Если строки совпали по условию `ON` — они объединяются в одну строку результата.\n    \n2. Если строка есть только в левой таблице — поля правой таблицы будут `NULL`.\n    \n3. Если строка есть только в правой таблице — поля левой таблицы будут `NULL`.\n    \n\nВ PostgreSQL `FULL OUTER JOIN` сначала работает как обычный `INNER JOIN` для совпавших строк, а затем добавляет несовпавшие строки с обеих сторон, заполняя отсутствующую сторону `NULL`. `FULL JOIN` и `FULL OUTER JOIN` — одно и то же, слово `OUTER` можно не писать. \n\n### Пример\n\nЕсть таблица пользователей:\n\n```sql\nusers\nid | name\n---+------\n1  | Alex\n2  | Bob\n3  | Tom\n```\n\nИ таблица заказов:\n\n```sql\norders\nid | user_id | amount\n---+---------+-------\n10 | 1       | 500\n11 | 2       | 700\n12 | 99      | 300\n```\n\nЗапрос:\n\n```sql\nSELECT\n    users.id AS user_id,\n    users.name,\n    orders.id AS order_id,\n    orders.user_id AS order_user_id,\n    orders.amount\nFROM users\nFULL OUTER JOIN orders ON orders.user_id = users.id;\n```\n\nРезультат:\n\n```text\nuser_id | name | order_id | order_user_id | amount\n--------+------+----------+---------------+-------\n1       | Alex | 10       | 1             | 500\n2       | Bob  | 11       | 2             | 700\n3       | Tom  | NULL     | NULL          | NULL\nNULL    | NULL | 12       | 99            | 300\n```\n\nЧто здесь произошло:\n\n```text\nAlex и Bob имеют заказы — строки объединились.\nTom есть в users, но заказов нет — поля orders стали NULL.\nЗаказ с user_id = 99 есть в orders, но пользователя нет — поля users стали NULL.\n```\n\n### Отличие от LEFT JOIN и RIGHT JOIN\n\n`LEFT JOIN` сохраняет все строки только из левой таблицы:\n\n```sql\nusers LEFT JOIN orders ON orders.user_id = users.id\n```\n\nСмысл:\n\n```text\nПоказать всех пользователей, даже если у них нет заказов.\n```\n\n`RIGHT JOIN` сохраняет все строки только из правой таблицы:\n\n```sql\nusers RIGHT JOIN orders ON orders.user_id = users.id\n```\n\nСмысл:\n\n```text\nПоказать все заказы, даже если для них нет пользователя.\n```\n\n`FULL OUTER JOIN` сохраняет обе стороны:\n\n```sql\nusers FULL OUTER JOIN orders ON orders.user_id = users.id\n```\n\nСмысл:\n\n```text\nПоказать всех пользователей и все заказы, даже если связи между ними нет.\n```\n\n### Упрощённая формула\n\nЛогически `FULL OUTER JOIN` можно воспринимать как:\n\n```text\nINNER JOIN\n+\nнесовпавшие строки слева\n+\nнесовпавшие строки справа\n```\n\nИли как объединение идеи `LEFT JOIN` и `RIGHT JOIN`.\n\n### Где используют FULL OUTER JOIN\n\nЧаще всего — для сверки данных.\n\nНапример, есть две таблицы:\n\n```text\npayments_from_bank\npayments_from_system\n```\n\nНужно найти:\n\n```text\nплатежи, которые есть и там, и там;\nплатежи, которые есть только в банке;\nплатежи, которые есть только в системе.\n```\n\nЗапрос:\n\n```sql\nSELECT\n    bank.payment_id AS bank_payment_id,\n    system.payment_id AS system_payment_id,\n    bank.amount AS bank_amount,\n    system.amount AS system_amount\nFROM payments_from_bank AS bank\nFULL OUTER JOIN payments_from_system AS system\n    ON system.payment_id = bank.payment_id;\n```\n\nТакой запрос покажет полную картину расхождений.\n\n### Как найти только несовпавшие строки\n\nЕсли нужны только строки, которые есть только с одной стороны:\n\n```sql\nSELECT\n    users.id AS user_id,\n    users.name,\n    orders.id AS order_id,\n    orders.user_id AS order_user_id\nFROM users\nFULL OUTER JOIN orders ON orders.user_id = users.id\nWHERE users.id IS NULL\n   OR orders.id IS NULL;\n```\n\nРезультат будет содержать:\n\n```text\nпользователей без заказов;\nзаказы без существующего пользователя.\n```\n\nТо есть совпавшие строки будут исключены.\n\n### Важный нюанс с WHERE\n\nКак и с `LEFT JOIN`, фильтрация в `WHERE` может случайно убрать строки с `NULL`.\n\nНапример:\n\n```sql\nSELECT *\nFROM users\nFULL OUTER JOIN orders ON orders.user_id = users.id\nWHERE orders.amount > 500;\n```\n\nЭтот запрос уберёт пользователей без заказов, потому что у них `orders.amount = NULL`, а условие `NULL > 500` не считается истинным.\n\nЕсли нужно сохранить строки без заказов, условие лучше писать аккуратно:\n\n```sql\nSELECT *\nFROM users\nFULL OUTER JOIN orders\n    ON orders.user_id = users.id\n   AND orders.amount > 500;\n```\n\nИли явно учитывать `NULL` в `WHERE`, если это нужно по логике запроса.\n\n### Итог\n\n`FULL OUTER JOIN` нужен, когда важно не потерять данные ни с одной стороны.\n\n```sql\nSELECT *\nFROM table_a\nFULL OUTER JOIN table_b ON table_b.a_id = table_a.id;\n```\n\nОн возвращает:\n\n```text\nсовпавшие строки из обеих таблиц;\nстроки только из левой таблицы;\nстроки только из правой таблицы.\n```\n\nВ обычной backend-разработке он используется реже, чем `LEFT JOIN`, но очень полезен для сверки, поиска расхождений, аудита и сравнения двух наборов данных."
  popularity = 2.63

[[questions]]
  id = 32
  question = "Что такое обычный JOIN в SQL?"
  answer = "### Обычный JOIN — это INNER JOIN\n\nКогда пишут просто:\n\n```sql\nSELECT *\nFROM users\nJOIN orders ON orders.user_id = users.id;\n```\n\nэто то же самое, что:\n\n```sql\nSELECT *\nFROM users\nINNER JOIN orders ON orders.user_id = users.id;\n```\n\nТо есть обычный `JOIN` возвращает **только те строки, для которых нашлось совпадение в обеих таблицах**. В PostgreSQL `JOIN`, `INNER JOIN` и `CROSS JOIN` описаны в разделе joined tables; для `INNER JOIN` результат содержит строки, где условие соединения истинно. \n\n### Пример\n\nТаблица `users`:\n\n```text\nid | name\n---+------\n1  | Alex\n2  | Bob\n3  | Tom\n```\n\nТаблица `orders`:\n\n```text\nid | user_id | amount\n---+---------+-------\n10 | 1       | 500\n11 | 1       | 300\n12 | 2       | 700\n```\n\nЗапрос:\n\n```sql\nSELECT\n    users.id AS user_id,\n    users.name,\n    orders.id AS order_id,\n    orders.amount\nFROM users\nJOIN orders ON orders.user_id = users.id;\n```\n\nРезультат:\n\n```text\nuser_id | name | order_id | amount\n--------+------+----------+-------\n1       | Alex | 10       | 500\n1       | Alex | 11       | 300\n2       | Bob  | 12       | 700\n```\n\n`Tom` не попал в результат, потому что у него нет заказа. Обычный `JOIN` не сохраняет строки без совпадений.\n\n### Как он работает логически\n\nУпрощённо:\n\n```text\nБерётся строка из users.\nPostgreSQL ищет строки из orders, где orders.user_id = users.id.\nЕсли совпадение есть — строка попадает в результат.\nЕсли совпадения нет — строка отбрасывается.\n```\n\nТо есть условие:\n\n```sql\nON orders.user_id = users.id\n```\n\nговорит базе, какие строки из двух таблиц считаются связанными. PostgreSQL документация описывает join как объединение строк из двух таблиц по выражению, которое определяет, какие строки должны быть сопоставлены. \n\n### Главное отличие от LEFT JOIN\n\n`JOIN` / `INNER JOIN`:\n\n```text\nПоказывает только совпавшие строки.\n```\n\n`LEFT JOIN`:\n\n```text\nПоказывает все строки слева, даже если справа совпадения нет.\n```\n\nПример:\n\n```sql\n-- Только пользователи с заказами\nSELECT *\nFROM users\nJOIN orders ON orders.user_id = users.id;\n\n-- Все пользователи, даже без заказов\nSELECT *\nFROM users\nLEFT JOIN orders ON orders.user_id = users.id;\n```\n\n### Где используют обычный JOIN\n\nОбычный `JOIN` используют, когда нужны только связанные данные.\n\nНапример:\n\n```text\nпользователи, у которых есть заказы;\nтовары, которые входят в заказ;\nкомментарии вместе с авторами;\nуведомления вместе с пользователем;\nфайлы вместе с владельцем.\n```\n\nПример:\n\n```sql\nSELECT\n    orders.id,\n    users.name,\n    orders.amount\nFROM orders\nJOIN users ON users.id = orders.user_id;\n```\n\nСмысл:\n\n```text\nПоказать заказы вместе с пользователями.\n```\n\nЕсли заказ не связан с существующим пользователем, он не попадёт в результат.\n\n### Важный момент\n\n`JOIN` может размножать строки.\n\nЕсли у одного пользователя несколько заказов:\n\n```text\nAlex -> order 10\nAlex -> order 11\n```\n\nто в результате будет две строки с `Alex`:\n\n```text\nAlex | 10\nAlex | 11\n```\n\nЭто нормально. `JOIN` возвращает не «одну строку на пользователя», а все найденные пары строк, которые удовлетворяют условию `ON`.\n\n### Итог\n\nОбычный `JOIN` в SQL — это `INNER JOIN`.\n\nОн возвращает только строки, которые имеют совпадение в обеих таблицах:\n\n```sql\nSELECT *\nFROM table_a\nJOIN table_b ON table_b.a_id = table_a.id;\n```\n\nЕсли совпадения нет — строка не попадает в результат. Для сохранения строк без совпадений используют `LEFT JOIN`, `RIGHT JOIN` или `FULL OUTER JOIN`."
  popularity = 2.63

[[questions]]
  id = 33
  question = "Что обычно должно быть условием соединения в JOIN?"
  answer = "### Главное правило\n\nВ обычном `JOIN` условием соединения чаще всего должно быть сравнение:\n\n```sql\nдочерняя_таблица.foreign_key = родительская_таблица.primary_key\n```\n\nНапример:\n\n```sql\nSELECT\n    orders.id,\n    users.username,\n    orders.amount\nFROM orders\nJOIN users ON users.id = orders.user_id;\n```\n\nЗдесь условие соединения:\n\n```sql\nusers.id = orders.user_id\n```\n\nТо есть заказ связывается с пользователем через внешний ключ `orders.user_id`, который ссылается на первичный ключ `users.id`.\n\nPostgreSQL описывает `ON` как условие, которое определяет, какие строки из двух таблиц считаются совпавшими. Для `INNER JOIN` в результат попадают пары строк, где это условие истинно. \n\n### Типичный вариант\n\nЕсть таблица пользователей:\n\n```sql\nCREATE TABLE users (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    username TEXT NOT NULL\n);\n```\n\nЕсть таблица заказов:\n\n```sql\nCREATE TABLE orders (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    user_id BIGINT REFERENCES users(id),\n    amount NUMERIC NOT NULL\n);\n```\n\nПравильный `JOIN`:\n\n```sql\nSELECT *\nFROM orders\nJOIN users ON users.id = orders.user_id;\n```\n\nСмысл:\n\n```text\nСоедини заказ с тем пользователем, чей users.id равен orders.user_id.\n```\n\n### Что обычно стоит в ON\n\nЧаще всего:\n\n```sql\nON child_table.parent_id = parent_table.id\n```\n\nПримеры:\n\n```sql\n-- Комментарий + его автор\ncomments.user_id = users.id\n\n-- Заказ + пользователь\norders.user_id = users.id\n\n-- Файл + владелец\nfiles.owner_id = users.id\n\n-- Товар в заказе + сам товар\norder_items.product_id = products.id\n\n-- Уведомление + пользователь\nnotifications.user_id = users.id\n```\n\nТо есть условие должно отражать **реальную связь между сущностями**.\n\n### Если связь составная\n\nИногда внешний ключ состоит из нескольких колонок. Тогда в `JOIN` нужно сравнить все части ключа.\n\nНапример:\n\n```sql\nCREATE TABLE order_items (\n    order_id BIGINT,\n    product_id BIGINT,\n    quantity INTEGER NOT NULL,\n    PRIMARY KEY (order_id, product_id)\n);\n```\n\nЕсли другая таблица ссылается на такую пару, условие будет составным:\n\n```sql\nON a.order_id = b.order_id\nAND a.product_id = b.product_id\n```\n\nPostgreSQL поддерживает foreign key по группе колонок; в таком случае набор колонок ссылается на соответствующий набор колонок другой таблицы. \n\n### Можно ли соединять не по Primary Key\n\nДа, можно. `JOIN` не обязан использовать только `PRIMARY KEY`.\n\nТехнически `ON` может быть любым булевым выражением:\n\n```sql\nON table_a.some_column = table_b.some_column\n```\n\nНо логически это должно быть поле, по которому строки действительно связаны.\n\nНапример, можно соединить по уникальному email:\n\n```sql\nSELECT *\nFROM users\nJOIN profiles ON profiles.email = users.email;\n```\n\nНо в реальных схемах лучше связывать таблицы через стабильный `id`, а `email` оставить как `UNIQUE`, потому что email может измениться.\n\n### Плохие условия соединения\n\nПлохой пример:\n\n```sql\nSELECT *\nFROM orders\nJOIN users ON users.username = orders.comment;\n```\n\nФормально SQL может это выполнить, но связи между `username` и `comment` нет. Такой `JOIN` даст бессмысленные или случайные совпадения.\n\nЕщё частая ошибка:\n\n```sql\nSELECT *\nFROM orders\nJOIN users ON orders.id = users.id;\n```\n\nЭто почти всегда неверно. `orders.id` — id заказа, `users.id` — id пользователя. Они могут случайно совпасть численно, но это не означает, что заказ принадлежит этому пользователю.\n\nПравильно:\n\n```sql\nSELECT *\nFROM orders\nJOIN users ON orders.user_id = users.id;\n```\n\n### JOIN через USING\n\nЕсли в обеих таблицах колонка называется одинаково, можно использовать `USING`.\n\nНапример:\n\n```sql\nSELECT *\nFROM orders\nJOIN users USING (user_id);\n```\n\nНо это сработает только если в обеих таблицах есть колонка `user_id`.\n\nОбычно в нормализованной схеме родительская таблица имеет `id`, а дочерняя — `user_id`, поэтому чаще пишут явно:\n\n```sql\nON users.id = orders.user_id\n```\n\nPostgreSQL указывает, что условие соединения задаётся через `ON`, `USING` или неявно через `NATURAL`; при этом `ON` — самый общий вариант. \n\n### NATURAL JOIN лучше избегать\n\n`NATURAL JOIN` сам соединяет таблицы по колонкам с одинаковыми именами.\n\nНапример:\n\n```sql\nSELECT *\nFROM users\nNATURAL JOIN orders;\n```\n\nПроблема в том, что если позже в обеих таблицах появится новая колонка с одинаковым названием, смысл запроса может неожиданно измениться.\n\nПоэтому в backend-разработке лучше писать условие явно:\n\n```sql\nJOIN orders ON orders.user_id = users.id\n```\n\n### Итог\n\nОбычно условие соединения в `JOIN` должно быть таким:\n\n```sql\nON дочерняя_таблица.foreign_key = родительская_таблица.primary_key\n```\n\nНапример:\n\n```sql\nON orders.user_id = users.id\n```\n\nЭто самое правильное и частое условие: оно соединяет строки не по случайному совпадению значений, а по реальной связи между таблицами."
  popularity = 2.63

[[questions]]
  id = 34
  question = "Можно ли написать JOIN ON 1=1 и что будет результатом такого соединения?"
  answer = "### Да, можно\n\n```sql\nSELECT *\nFROM users\nJOIN orders ON 1 = 1;\n```\n\nТакой `JOIN` будет работать. Условие `1 = 1` всегда истинно, поэтому каждая строка из `users` соединится с каждой строкой из `orders`.\n\nТо есть результатом будет **декартово произведение** таблиц.\n\nВ PostgreSQL `CROSS JOIN` эквивалентен `INNER JOIN ... ON TRUE`, а если одна таблица содержит `N` строк, другая `M` строк, результат содержит `N * M` строк. \n\n### Пример\n\nТаблица `users`:\n\n```text\nid | name\n---+------\n1  | Alex\n2  | Bob\n```\n\nТаблица `orders`:\n\n```text\nid | amount\n---+-------\n10 | 500\n11 | 700\n12 | 300\n```\n\nЗапрос:\n\n```sql\nSELECT\n    users.name,\n    orders.id AS order_id,\n    orders.amount\nFROM users\nJOIN orders ON 1 = 1;\n```\n\nРезультат:\n\n```text\nname | order_id | amount\n-----+----------+-------\nAlex | 10       | 500\nAlex | 11       | 700\nAlex | 12       | 300\nBob  | 10       | 500\nBob  | 11       | 700\nBob  | 12       | 300\n```\n\nБыло:\n\n```text\n2 пользователя\n3 заказа\n```\n\nСтало:\n\n```text\n2 * 3 = 6 строк\n```\n\n### Это то же самое, что CROSS JOIN\n\nЭти запросы логически эквивалентны:\n\n```sql\nSELECT *\nFROM users\nJOIN orders ON 1 = 1;\n```\n\n```sql\nSELECT *\nFROM users\nJOIN orders ON TRUE;\n```\n\n```sql\nSELECT *\nFROM users\nCROSS JOIN orders;\n```\n\nPostgreSQL также указывает, что `CROSS JOIN` эквивалентен `INNER JOIN ON (TRUE)`, то есть строки не отбрасываются условием соединения. \n\n### Почему это обычно опасно\n\nЕсли в одной таблице 100 000 строк, а в другой 50 000 строк:\n\n```text\n100 000 * 50 000 = 5 000 000 000 строк\n```\n\nТакой запрос может быть очень тяжёлым: много памяти, много CPU, большой временный результат, медленное выполнение.\n\n### Когда это может быть нужно\n\n`JOIN ON 1=1` или `CROSS JOIN` используют редко, но осознанно:\n\n```text\nсгенерировать все комбинации товаров и размеров;\nсоставить все пары дат и категорий;\nполучить матрицу вариантов;\nподмешать одну строку с настройками ко всем строкам результата.\n```\n\nПример нормального использования:\n\n```sql\nSELECT\n    products.name,\n    sizes.size\nFROM products\nCROSS JOIN sizes;\n```\n\nЕсли есть 10 товаров и 5 размеров, получится 50 комбинаций.\n\n### Итог\n\n`JOIN ON 1=1` разрешён, но это не обычное соединение по связи между таблицами.\n\n```sql\nJOIN orders ON orders.user_id = users.id\n```\n\nсоединяет связанные строки.\n\n```sql\nJOIN orders ON 1 = 1\n```\n\nсоединяет **каждую строку с каждой**.\n\nПо смыслу это `CROSS JOIN`. В обычных прикладных запросах такое условие почти всегда означает ошибку или забытое условие связи."
  popularity = 2.63

[[questions]]
  id = 35
  question = "Как PostgreSQL обеспечивает консистентность данных при репликации?"
  answer = "PostgreSQL обеспечивает консистентность при репликации через **WAL** — Write-Ahead Log.\n\nВсе изменения сначала записываются в WAL на primary-сервере, затем WAL передаётся на standby/replica, и реплика воспроизводит эти записи в том же порядке. За счёт этого реплика приходит к тому же состоянию данных, что и primary, но с возможной задержкой.\n\nВ PostgreSQL параметр `wal_level = replica` записывает достаточно информации в WAL для архивации, streaming replication и read-only запросов на standby. Для logical replication нужен уровень `logical`. \n\n### Как это работает по шагам\n\n1. Клиент выполняет `INSERT`, `UPDATE`, `DELETE` на primary.\n    \n2. PostgreSQL формирует WAL-записи для этих изменений.\n    \n3. При commit запись о транзакции фиксируется в WAL.\n    \n4. Реплика получает WAL по streaming replication или через архив WAL.\n    \n5. Реплика последовательно применяет WAL-записи.\n    \n6. После replay commit-записи изменения становятся видимыми на standby.\n    \n\nPostgreSQL прямо указывает, что после replay commit record на standby изменения этой транзакции становятся видимыми для новых snapshot на standby. \n### Важный момент: реплика не «сама пересчитывает» данные\n\nПри physical replication standby не выполняет заново SQL-запросы вида:\n\n```sql\nUPDATE users SET balance = balance - 100 WHERE id = 1;\n```\n\nОна получает уже записанные WAL-изменения и воспроизводит их на уровне хранения данных. Поэтому physical replication ближе к копированию изменений файлов/страниц БД, а не к повторному выполнению бизнес-операций.\n\nВ документации PostgreSQL logical replication противопоставляется physical replication: logical работает с объектами данных и их изменениями, а physical использует точные адреса блоков и побайтовую репликацию. \n\n### Асинхронная репликация\n\nПо умолчанию streaming replication обычно асинхронная.\n\nЭто значит:\n\n```text\nprimary подтвердил COMMIT клиенту,\nно реплика ещё может не успеть получить или применить WAL.\n```\n\nИтог:\n\n```text\nна primary данные уже есть;\nна replica эти данные появятся чуть позже.\n```\n\nТакой режим даёт лучшую производительность, но при аварии primary возможна потеря последних транзакций, которые ещё не дошли до реплики.\n\nДля чтения с реплики это означает **eventual consistency**: реплика со временем догоняет primary, но не обязана показывать самый свежий результат прямо сейчас. PostgreSQL прямо пишет, что между primary и standby есть измеримая задержка, поэтому один и тот же запрос почти одновременно на primary и standby может вернуть разные результаты; данные на standby являются eventually consistent относительно primary. \n\n### Синхронная репликация\n\nВ синхронном режиме primary может ждать подтверждения от standby перед тем, как окончательно подтвердить commit клиенту.\n\nДля этого настраивают, например:\n\n```conf\nsynchronous_standby_names = 'standby1'\nsynchronous_commit = on\n```\n\nPostgreSQL указывает, что при такой конфигурации commit ждёт подтверждения, что standby записал commit record в durable storage. Это повышает гарантию, что изменения не будут потеряны при сбое primary, но увеличивает время ответа транзакции минимум на сетевой round-trip до standby. \n\nЕсть более строгий вариант:\n\n```conf\nsynchronous_commit = remote_apply\n```\n\nВ этом случае standby подтверждает не просто получение/запись WAL, а то, что commit record уже воспроизведён, и транзакция стала видимой на реплике. \n\n### Консистентность чтения на реплике\n\nStandby в режиме Hot Standby может принимать подключения и выполнять read-only запросы. Но запись на такой реплике запрещена: `INSERT`, `UPDATE`, `DELETE`, `MERGE`, `TRUNCATE`, `COPY FROM` не разрешены. \n\nЭто важно для консистентности:\n\n```text\nprimary принимает изменения;\nstandby только воспроизводит WAL;\nпользовательские записи на standby не смешиваются с WAL primary.\n```\n\nТо есть реплика не расходится с primary из-за локальных изменений.\n\n### Что происходит при конфликте чтения и применения WAL\n\nНа standby могут выполняться долгие `SELECT`. Одновременно реплика должна применять WAL с primary. Иногда WAL-изменение конфликтует с долгим read-only запросом на standby.\n\nНапример, primary удалил строки или выполнил VACUUM, а standby ещё держит snapshot, которому нужны старые версии строк.\n\nВ таких случаях PostgreSQL должен выбрать:\n\n```text\nили задержать применение WAL;\nили отменить конфликтующий запрос на standby.\n```\n\nЗа это отвечают параметры вроде:\n\n```conf\nmax_standby_streaming_delay\nmax_standby_archive_delay\n```\n\nДокументация указывает, что администратор должен выбирать эти параметры в зависимости от приоритета: высокая доступность и малый replication lag либо более долгие аналитические запросы на standby. \n\n### Роль replication slots\n\nReplication slot помогает не потерять WAL, который ещё нужен реплике.\n\nБез slot primary может удалить старые WAL-сегменты, если реплика сильно отстала. Тогда реплика уже не сможет догнать primary без пересоздания.\n\nС replication slot primary знает, что конкретной реплике ещё нужны определённые WAL-записи, и удерживает их. В настройках PostgreSQL `max_replication_slots` определяет максимальное число replication slots, а `wal_level` должен быть `replica` или выше для их использования.\n\nМинус: если реплика долго не работает, WAL может накапливаться и занять много места на диске.\n\n### Logical replication\n\nПри logical replication PostgreSQL реплицирует не весь кластер поблочно, а изменения выбранных таблиц через модель publication/subscription.\n\nМеханизм консистентности там другой:\n\n```text\nсначала снимается snapshot исходных данных;\nтаблица копируется на subscriber;\nпосле этого изменения с publisher непрерывно отправляются и применяются на subscriber.\n```\n\nPostgreSQL указывает, что subscriber применяет данные в том же порядке, что и publisher, поэтому transactional consistency гарантируется для publications внутри одной subscription. \n\nДля `UPDATE` и `DELETE` в logical replication таблице нужна replica identity — обычно primary key. Она нужна, чтобы subscriber мог понять, какую строку обновлять или удалять. \n\n### Итог\n\nPostgreSQL держит консистентность репликации за счёт нескольких механизмов:\n\n```text\nWAL фиксирует все изменения в строгом порядке;\nреплика применяет WAL последовательно;\nstandby не принимает пользовательские записи;\nsnapshot isolation даёт согласованные read-only запросы;\nsynchronous replication может ждать подтверждения от standby;\nreplication slots защищают нужный WAL от преждевременного удаления;\nlogical replication применяет изменения в порядке publisher внутри subscription.\n```\n\nГлавное различие:\n\n```text\nасинхронная репликация — быстрее, но возможен lag и потеря последних транзакций при аварии primary;\n\nсинхронная репликация — надёжнее по потере данных, но медленнее из-за ожидания подтверждения от standby.\n```"
