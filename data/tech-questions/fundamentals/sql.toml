[[questions]]
  id = 58
  question = "Какие задачи решают с PostgreSQL в backend-разработке?"
  answer = "### Какие задачи PostgreSQL обычно решает в backend-разработке\n\nPostgreSQL в backend-проекте чаще всего используется не просто как “место, куда складывают данные”. Он решает несколько классов задач: хранение бизнес-данных, обеспечение целостности, конкурентный доступ, быстрый поиск, аналитические выборки, фоновые процессы и иногда часть бизнес-логики.\n\n### 1. Хранение основных данных приложения\n\nСамая базовая задача — хранить сущности приложения:\n\n```text\nпользователи\nзаказы\nплатежи\nуведомления\nфайлы\nтовары\nкомментарии\nправа доступа\nистория действий\n```\n\nНапример:\n\n```sql\nCREATE TABLE users (\n    id bigserial PRIMARY KEY,\n    email text NOT NULL UNIQUE,\n    created_at timestamptz NOT NULL DEFAULT now()\n);\n```\n\nPostgreSQL — объектно-реляционная СУБД, поэтому хорошо подходит для классической модели “таблицы + связи + SQL-запросы”. Официальный сайт PostgreSQL описывает его как open source object-relational database system с упором на надёжность, функциональность и производительность. \n\n### 2. Обеспечение целостности данных\n\nBackend не должен держать всю целостность только в коде. Часть правил лучше фиксировать на уровне БД:\n\n```sql\nALTER TABLE users\nADD CONSTRAINT users_email_unique UNIQUE (email);\n```\n\n```sql\nALTER TABLE orders\nADD CONSTRAINT orders_user_id_fk\nFOREIGN KEY (user_id) REFERENCES users(id);\n```\n\nЭто защищает данные даже если ошибка появилась в коде, в миграции, в админке или во внутреннем скрипте.\n\nPostgreSQL поддерживает `PRIMARY KEY`, `UNIQUE`, `FOREIGN KEY`, `CHECK`, `NOT NULL`. Foreign key нужен для ссылочной целостности: значение в дочерней таблице должно соответствовать строке в родительской таблице. \n\nПрактический пример:\n\n```text\nнельзя создать заказ на несуществующего пользователя\nнельзя создать двух пользователей с одним email\nнельзя записать отрицательную цену\nнельзя оставить обязательное поле пустым\n```\n\n### 3. Транзакции\n\nPostgreSQL решает задачу атомарного изменения данных.\n\nНапример, создание заказа:\n\n```sql\nBEGIN;\n\nINSERT INTO orders (user_id, status)\nVALUES (10, 'created');\n\nINSERT INTO order_items (order_id, product_id, quantity)\nVALUES (100, 5, 2);\n\nCOMMIT;\n```\n\nСмысл: либо все изменения применяются, либо ни одно.\n\nВ backend это нужно для операций вроде:\n\n```text\nсоздание заказа\nсписание баланса\nрезерв товара\nперевод денег между счетами\nсоздание пользователя и профиля\nобновление нескольких связанных таблиц\n```\n\nБез транзакций легко получить частично записанное состояние: заказ создан, но товары к нему не добавились.\n\n### 4. Конкурентный доступ\n\nPostgreSQL помогает безопасно работать нескольким запросам одновременно.\n\nНапример, два пользователя одновременно пытаются списать деньги с одного баланса. Для этого можно использовать транзакцию и строковую блокировку:\n\n```sql\nBEGIN;\n\nSELECT balance\nFROM accounts\nWHERE id = 1\nFOR UPDATE;\n\nUPDATE accounts\nSET balance = balance - 100\nWHERE id = 1;\n\nCOMMIT;\n```\n\nЭто не даёт двум операциям одновременно некорректно изменить одну и ту же строку.\n\nВ backend это важно для:\n\n```text\nбалансов\nлимитов\nостатков товара\nбронирований\nочередей задач\nпромокодов\nсчётчиков\n```\n\n### 5. Быстрый поиск через индексы\n\nPostgreSQL решает задачу быстрого поиска данных.\n\nНапример:\n\n```sql\nCREATE INDEX idx_orders_user_id ON orders(user_id);\nCREATE INDEX idx_orders_created_at ON orders(created_at);\n```\n\nПосле этого запросы вида:\n\n```sql\nSELECT *\nFROM orders\nWHERE user_id = 10\nORDER BY created_at DESC;\n```\n\nмогут выполняться быстрее, потому что БД не обязана каждый раз читать всю таблицу.\n\nИндексы используют для:\n\n```text\nпоиска по id/email/username\nфильтрации заказов по пользователю\nсортировки по дате\nJOIN между таблицами\nпоиска по статусу\nдиапазонов дат\n```\n\nОтдельно для массивов, JSONB и полнотекстового поиска PostgreSQL может использовать GIN-индексы. В документации PostgreSQL GIN описывается как индекс, который хранит пары “ключ — список строк”, где этот ключ встречается. \n\n### 6. Связи между сущностями\n\nBackend почти всегда работает со связанными данными:\n\n```text\nпользователь → заказы\nзаказ → позиции заказа\nтовар → категория\nпост → комментарии\nроль → права\n```\n\nВ PostgreSQL это обычно выражается через foreign key:\n\n```sql\nCREATE TABLE orders (\n    id bigserial PRIMARY KEY,\n    user_id bigint NOT NULL REFERENCES users(id),\n    status text NOT NULL\n);\n```\n\nИ потом запрашивается через `JOIN`:\n\n```sql\nSELECT\n    users.email,\n    orders.id,\n    orders.status\nFROM orders\nJOIN users ON users.id = orders.user_id;\n```\n\nТо есть PostgreSQL помогает не просто хранить отдельные документы, а строить связанную модель данных.\n\n### 7. Фильтрация, сортировка, пагинация\n\nТипичная backend-задача — отдать список сущностей в API:\n\n```http\nGET /orders?status=paid&limit=20&offset=40\n```\n\nSQL-запрос:\n\n```sql\nSELECT *\nFROM orders\nWHERE status = 'paid'\nORDER BY created_at DESC\nLIMIT 20 OFFSET 40;\n```\n\nPostgreSQL здесь отвечает за:\n\n```text\nфильтрацию\nсортировку\nлимиты\nпагинацию\nагрегации\nпоиск\n```\n\nДля больших таблиц часто переходят с `OFFSET` на keyset pagination:\n\n```sql\nSELECT *\nFROM orders\nWHERE created_at < :last_seen_created_at\nORDER BY created_at DESC\nLIMIT 20;\n```\n\n### 8. Агрегации и отчёты\n\nPostgreSQL часто используют для расчётов:\n\n```sql\nSELECT\n    status,\n    count(*) AS total\nFROM orders\nGROUP BY status;\n```\n\nИли:\n\n```sql\nSELECT\n    date_trunc('day', created_at) AS day,\n    sum(amount) AS revenue\nFROM payments\nGROUP BY day\nORDER BY day;\n```\n\nВ backend это нужно для:\n\n```text\nстатистики в админке\nотчётов\nдашбордов\nсчётчиков\nфинансовых сумм\nаналитики по пользователям\n```\n\nДля тяжёлых отчётов можно использовать materialized views. PostgreSQL materialized view хранит результат запроса в table-like form, то есть результат физически сохраняется и может переиспользоваться. \n\n### 9. Хранение JSON/JSONB\n\nPostgreSQL может хранить не только строго реляционные данные, но и полуструктурированные данные через `json`/`jsonb`.\n\nНапример:\n\n```sql\nCREATE TABLE events (\n    id bigserial PRIMARY KEY,\n    event_type text NOT NULL,\n    payload jsonb NOT NULL\n);\n```\n\nЭто удобно для:\n\n```text\nлогов событий\nwebhook payload\nгибких настроек\nметаданных файла\nвнешних API-ответов\nредко используемых атрибутов\n```\n\nPostgreSQL поддерживает JSON-типы, SQL/JSON-функции, JSONPath-запросы и генерацию JSON из реляционных данных. \n\nНо JSONB не должен заменять нормальную схему везде. PostgreSQL указывает, что обновление JSON-данных в строке подчиняется обычным правилам конкурентного доступа: обновление берёт row-level lock на всю строку. \n\n### 10. Полнотекстовый поиск\n\nPostgreSQL может решать задачи поиска по тексту:\n\n```text\nпоиск по статьям\nпоиск по товарам\nпоиск по комментариям\nпоиск по документам\n```\n\nПример:\n\n```sql\nSELECT *\nFROM articles\nWHERE to_tsvector('russian', title || ' ' || body)\n      @@ plainto_tsquery('russian', 'postgres индекс');\n```\n\nДля небольших и средних проектов встроенного full-text search часто достаточно без отдельного Elasticsearch/OpenSearch. В документации PostgreSQL есть отдельная глава про Full Text Search, включая таблицы и индексы для такого поиска. \n\n### 11. Разделение доступа и безопасность данных\n\nPostgreSQL может помогать с безопасностью:\n\n```text\nотдельные пользователи БД\nGRANT/REVOKE\nreadonly-пользователь\nограничение прав приложения\nrow-level security\n```\n\nНапример, приложение не должно подключаться под суперпользователем. Лучше отдельная роль с минимальными правами.\n\nPostgreSQL также поддерживает Row-Level Security: политики могут ограничивать, какие строки пользователь может читать, вставлять, обновлять или удалять. \n\nПример задачи:\n\n```text\ntenant A не должен видеть данные tenant B\nобычный пользователь не должен читать чужие строки\nадмин видит больше данных, чем клиент\n```\n\n### 12. Очереди и фоновые задачи\n\nPostgreSQL иногда используют как простую очередь задач.\n\nНапример:\n\n```sql\nSELECT *\nFROM jobs\nWHERE status = 'pending'\nORDER BY id\nLIMIT 10\nFOR UPDATE SKIP LOCKED;\n```\n\nТак несколько воркеров могут параллельно брать задачи, не забирая одни и те же строки.\n\nЭто подходит для умеренной нагрузки. Но если очередь становится центральной частью системы с большим потоком событий, обычно лучше использовать RabbitMQ, Kafka, Redis Streams или другой специализированный брокер.\n\n### 13. Outbox для событий\n\nPostgreSQL часто участвует в реализации transactional outbox.\n\nВ одной транзакции приложение записывает бизнес-данные и событие:\n\n```sql\nBEGIN;\n\nINSERT INTO orders (id, status)\nVALUES (100, 'created');\n\nINSERT INTO outbox_events (event_type, payload)\nVALUES ('OrderCreated', '{\"order_id\": 100}');\n\nCOMMIT;\n```\n\nЭто решает проблему: данные в БД записались, но событие в брокер не отправилось. Потом отдельный publisher читает `outbox_events` и публикует события.\n\nНа backend-проектах это важно для микросервисов, интеграций, уведомлений, аудита и событийной архитектуры.\n\n### 14. Аудит и история изменений\n\nВ PostgreSQL часто хранят историю:\n\n```text\nкто изменил запись\nкогда изменил\nстарое значение\nновое значение\nпричина изменения\nистория статусов заказа\n```\n\nПример:\n\n```sql\nCREATE TABLE order_status_history (\n    id bigserial PRIMARY KEY,\n    order_id bigint NOT NULL REFERENCES orders(id),\n    old_status text,\n    new_status text NOT NULL,\n    changed_at timestamptz NOT NULL DEFAULT now()\n);\n```\n\nЭто нужно для расследования ошибок, финансовых операций, админки и юридически значимых действий.\n\n### 15. Миграции схемы\n\nBackend-разработчик постоянно меняет структуру БД:\n\n```text\nдобавить таблицу\nдобавить колонку\nсоздать индекс\nизменить constraint\nдобавить enum/status\nперенести данные\n```\n\nЭто делается через миграции:\n\n```text\nDjango migrations\nAlembic\nручные SQL-миграции\nLiquibase/Flyway\n```\n\nPostgreSQL здесь является не только хранилищем, но и частью процесса разработки: схема данных эволюционирует вместе с кодом.\n\n### 16. Масштабирование больших таблиц\n\nКогда таблицы становятся большими, PostgreSQL используют для задач вроде:\n\n```text\nпартиционирование по дате\nархивация старых данных\nread replicas\nматериализованные представления\nчастичные индексы\nоптимизация запросов через EXPLAIN\n```\n\nПартиционирование — это разбиение логически одной большой таблицы на меньшие физические части. Документация PostgreSQL описывает partitioning именно как splitting one large table into smaller physical pieces. \n\nПример:\n\n```text\norders_2026_01\norders_2026_02\norders_2026_03\n```\n\nСнаружи приложение может работать с одной таблицей `orders`, а PostgreSQL физически хранит данные по частям.\n\n### Коротко\n\nВ backend-разработке PostgreSQL обычно решает такие задачи:\n\n```text\nхранение бизнес-данных\nсвязи между сущностями\nцелостность данных через constraints\nтранзакции\nконкурентное изменение данных\nиндексы и быстрый поиск\nфильтрация, сортировка, пагинация\nагрегации и отчёты\nJSONB для гибких данных\nполнотекстовый поиск\nправа доступа и безопасность\nочереди умеренной нагрузки\noutbox для событий\nаудит и история изменений\nмиграции схемы\nоптимизация больших таблиц\n```\n\nПрактический смысл: PostgreSQL в backend — это не просто “таблица с данными”, а основной механизм сохранения состояния приложения, контроля целостности и выполнения сложных запросов."
