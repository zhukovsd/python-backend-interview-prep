[[questions]]
  id = 46
  question = "Что такое составной индекс в SQL?"
  answer = "### Что такое составной индекс\n\n**Составной индекс** — это индекс, построенный сразу по нескольким колонкам таблицы.\n\nЕго ещё называют:\n\n```text\nmulti-column index;\ncomposite index;\ncombined index;\nмногоколоночный индекс.\n```\n\nПример:\n\n```sql\nCREATE INDEX orders_user_status_idx\nON orders (user_id, status);\n```\n\nЗдесь индекс построен не только по `user_id`, и не только по `status`, а по их комбинации:\n\n```text\n(user_id, status)\n```\n\nPostgreSQL официально называет такие индексы **multicolumn indexes** и указывает, что индекс может быть определён более чем на одной колонке таблицы. \n\n---\n\n### Простой пример\n\nЕсть таблица заказов:\n\n```sql\nCREATE TABLE orders (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    user_id BIGINT NOT NULL,\n    status TEXT NOT NULL,\n    created_at TIMESTAMP NOT NULL DEFAULT now(),\n    amount NUMERIC NOT NULL\n);\n```\n\nЧастый запрос:\n\n```sql\nSELECT *\nFROM orders\nWHERE user_id = 10\n  AND status = 'paid';\n```\n\nДля такого запроса можно создать составной индекс:\n\n```sql\nCREATE INDEX orders_user_status_idx\nON orders (user_id, status);\n```\n\nТеперь база может быстрее найти заказы конкретного пользователя с конкретным статусом.\n\n---\n\n### Как составной индекс устроен логически\n\nДля B-tree индекса порядок колонок имеет значение.\n\nИндекс:\n\n```sql\nCREATE INDEX orders_user_status_idx\nON orders (user_id, status);\n```\n\nможно представить как отсортированную структуру сначала по `user_id`, а внутри одного `user_id` — по `status`.\n\nУпрощённо:\n\n```text\n(user_id, status)\n\n(1, 'cancelled')\n(1, 'new')\n(1, 'paid')\n(2, 'new')\n(2, 'paid')\n(3, 'paid')\n```\n\nТо есть индекс хранит не два независимых индекса, а один общий индекс по паре значений.\n\nЭто важно: составной индекс `(user_id, status)` — не то же самое, что два отдельных индекса:\n\n```sql\nCREATE INDEX orders_user_id_idx ON orders (user_id);\nCREATE INDEX orders_status_idx ON orders (status);\n```\n\n---\n\n### Главное правило: важен порядок колонок\n\nИндекс:\n\n```sql\nON orders (user_id, status)\n```\n\nи индекс:\n\n```sql\nON orders (status, user_id)\n```\n\n— это разные индексы.\n\nОни могут быть полезны для разных запросов.\n\nИндекс `(user_id, status)` хорошо подходит для запросов:\n\n```sql\nWHERE user_id = 10\n```\n\n```sql\nWHERE user_id = 10\n  AND status = 'paid'\n```\n\nНо он обычно хуже подходит для запроса:\n\n```sql\nWHERE status = 'paid'\n```\n\nПотому что первая колонка индекса — `user_id`, а условие только по второй колонке.\n\nPostgreSQL указывает, что многоколоночный B-tree индекс наиболее эффективен, когда ограничения есть по ведущим, то есть левым, колонкам индекса. Точные правила: равенства по ведущим колонкам и затем диапазонное условие по первой колонке без равенства ограничивают просматриваемую часть индекса. \n\n---\n\n### Правило левого префикса\n\nДля B-tree составного индекса часто используют термин:\n\n```text\nleftmost prefix rule\nправило левого префикса\n```\n\nЕсли индекс создан так:\n\n```sql\nCREATE INDEX idx_orders_user_status_created\nON orders (user_id, status, created_at);\n```\n\nто он хорошо подходит для запросов, где используются левые части индекса:\n\n```sql\n-- используется первая колонка\nWHERE user_id = 10\n```\n\n```sql\n-- используются первая и вторая колонки\nWHERE user_id = 10\n  AND status = 'paid'\n```\n\n```sql\n-- используются первая, вторая и третья колонки\nWHERE user_id = 10\n  AND status = 'paid'\n  AND created_at >= '2026-01-01'\n```\n\nНо хуже подходит для запроса только по `status`:\n\n```sql\nWHERE status = 'paid'\n```\n\nПотому что `status` — не первая колонка индекса.\n\n---\n\n### Почему индекс по `(user_id, status)` не равен индексу по `(status, user_id)`\n\nДопустим, запросы в проекте чаще такие:\n\n```sql\nSELECT *\nFROM orders\nWHERE user_id = 123\n  AND status = 'paid';\n```\n\nТогда хороший индекс:\n\n```sql\nCREATE INDEX orders_user_status_idx\nON orders (user_id, status);\n```\n\nПотому что сначала мы сильно сужаем данные по конкретному пользователю, потом по статусу.\n\nНо если основной запрос такой:\n\n```sql\nSELECT *\nFROM orders\nWHERE status = 'paid'\nORDER BY created_at DESC;\n```\n\nто индекс `(user_id, status)` уже не так полезен. Для такого запроса логичнее думать об индексе:\n\n```sql\nCREATE INDEX orders_status_created_idx\nON orders (status, created_at DESC);\n```\n\nПорядок колонок выбирается под реальные запросы, а не просто по названиям полей.\n\n---\n\n### Составной индекс и ORDER BY\n\nСоставной индекс может помогать не только в `WHERE`, но и в `ORDER BY`.\n\nНапример, частый запрос:\n\n```sql\nSELECT *\nFROM orders\nWHERE user_id = 10\nORDER BY created_at DESC\nLIMIT 20;\n```\n\nХороший индекс:\n\n```sql\nCREATE INDEX orders_user_created_idx\nON orders (user_id, created_at DESC);\n```\n\nПочему:\n\n```text\nuser_id помогает быстро найти заказы конкретного пользователя;\ncreated_at DESC уже хранит их в нужном порядке;\nLIMIT 20 позволяет быстро взять первые 20 строк.\n```\n\nЭто очень частый сценарий для backend API:\n\n```text\nпоследние уведомления пользователя;\nпоследние заказы пользователя;\nпоследние сообщения в чате;\nпоследние файлы в папке;\nпоследние события по объекту.\n```\n\nПример:\n\n```sql\nCREATE INDEX notifications_user_created_idx\nON notifications (user_id, created_at DESC);\n```\n\nДля запроса:\n\n```sql\nSELECT *\nFROM notifications\nWHERE user_id = 123\nORDER BY created_at DESC\nLIMIT 50;\n```\n\n---\n\n### Составной индекс и диапазонные условия\n\nСоставной индекс особенно хорошо работает, когда сначала идут условия равенства, а потом диапазон.\n\nПример:\n\n```sql\nCREATE INDEX orders_user_status_created_idx\nON orders (user_id, status, created_at);\n```\n\nЗапрос:\n\n```sql\nSELECT *\nFROM orders\nWHERE user_id = 10\n  AND status = 'paid'\n  AND created_at >= '2026-01-01';\n```\n\nЗдесь логика хорошая:\n\n```text\nuser_id = 10        -> равенство по первой колонке;\nstatus = 'paid'     -> равенство по второй колонке;\ncreated_at >= дата  -> диапазон по третьей колонке.\n```\n\nОбычно это хороший порядок колонок для B-tree:\n\n```text\nсначала equality-условия;\nпотом range-условие;\nпотом иногда колонка сортировки.\n```\n\nПример:\n\n```sql\nWHERE user_id = ?\n  AND status = ?\n  AND created_at BETWEEN ? AND ?\n```\n\nИндекс:\n\n```sql\nON orders (user_id, status, created_at)\n```\n\n---\n\n### Что будет с запросом только по первой колонке\n\nЕсли есть индекс:\n\n```sql\nCREATE INDEX orders_user_status_idx\nON orders (user_id, status);\n```\n\nто запрос:\n\n```sql\nSELECT *\nFROM orders\nWHERE user_id = 10;\n```\n\nможет использовать этот индекс.\n\nПочему: `user_id` — первая колонка составного индекса.\n\nТо есть составной индекс `(user_id, status)` частично может заменить обычный индекс `(user_id)`.\n\nНо это не всегда значит, что отдельный индекс `(user_id)` точно не нужен. Составной индекс больше по размеру, может быть менее удобен для некоторых планов, и всё зависит от конкретных запросов.\n\n---\n\n### Что будет с запросом только по второй колонке\n\nЕсли есть индекс:\n\n```sql\nCREATE INDEX orders_user_status_idx\nON orders (user_id, status);\n```\n\nзапрос:\n\n```sql\nSELECT *\nFROM orders\nWHERE status = 'paid';\n```\n\nобычно не сможет эффективно использовать этот индекс как обычный поиск по `status`, потому что `status` не является левой колонкой.\n\nДля такого запроса лучше отдельный индекс:\n\n```sql\nCREATE INDEX orders_status_idx\nON orders (status);\n```\n\nили составной индекс под конкретный запрос:\n\n```sql\nCREATE INDEX orders_status_created_idx\nON orders (status, created_at DESC);\n```\n\n---\n\n### Составной UNIQUE индекс\n\nСоставной индекс может быть уникальным.\n\nНапример, пользователь не может иметь две папки с одинаковым именем:\n\n```sql\nCREATE UNIQUE INDEX folders_user_name_unique_idx\nON folders (user_id, name);\n```\n\nИли через constraint:\n\n```sql\nCREATE TABLE folders (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    user_id BIGINT NOT NULL,\n    name TEXT NOT NULL,\n    UNIQUE (user_id, name)\n);\n```\n\nСмысл:\n\n```text\nу одного пользователя имя папки должно быть уникальным;\nу разных пользователей одинаковые имена папок разрешены.\n```\n\nПример:\n\n```text\nuser_id | name\n--------+------\n1       | docs   -> можно\n1       | docs   -> нельзя\n2       | docs   -> можно\n```\n\nPostgreSQL создаёт уникальный индекс для `UNIQUE` constraint; уникальность может задаваться по одной колонке или по группе колонок. \n\n---\n\n### Составной PRIMARY KEY\n\nPrimary key тоже может быть составным.\n\nЧастый пример — связующая таблица many-to-many:\n\n```sql\nCREATE TABLE user_roles (\n    user_id BIGINT NOT NULL REFERENCES users(id),\n    role_id BIGINT NOT NULL REFERENCES roles(id),\n    PRIMARY KEY (user_id, role_id)\n);\n```\n\nЗдесь первичный ключ состоит из двух колонок:\n\n```text\n(user_id, role_id)\n```\n\nЭто запрещает повторить одну и ту же связь:\n\n```text\nuser_id = 10, role_id = 2\nuser_id = 10, role_id = 2  -> нельзя\n```\n\nНо разрешает:\n\n```text\nuser_id = 10, role_id = 3\nuser_id = 11, role_id = 2\n```\n\nТо есть один пользователь может иметь много ролей, и одна роль может быть у многих пользователей, но одна и та же пара не дублируется.\n\n---\n\n### Составной индекс vs несколько одиночных индексов\n\nДопустим, есть запрос:\n\n```sql\nSELECT *\nFROM orders\nWHERE user_id = 10\n  AND status = 'paid';\n```\n\nВариант 1 — два отдельных индекса:\n\n```sql\nCREATE INDEX orders_user_id_idx ON orders (user_id);\nCREATE INDEX orders_status_idx ON orders (status);\n```\n\nВариант 2 — один составной индекс:\n\n```sql\nCREATE INDEX orders_user_status_idx ON orders (user_id, status);\n```\n\nСоставной индекс обычно лучше именно для запроса, где часто используются обе колонки вместе.\n\nНо PostgreSQL также умеет комбинировать несколько отдельных индексов через bitmap scan: система может просканировать нужные индексы, собрать bitmap позиций строк, объединить их через `AND` или `OR`, а затем прочитать строки таблицы. \n\nТо есть два отдельных индекса иногда тоже могут помочь. Но составной индекс чаще эффективнее, когда запрос постоянно фильтрует по одной и той же комбинации колонок.\n\n---\n\n### Когда нужен составной индекс\n\nСоставной индекс полезен, когда в запросах часто встречается комбинация условий.\n\nПримеры:\n\n```sql\nWHERE user_id = ?\n  AND status = ?\n```\n\n```sql\nWHERE tenant_id = ?\n  AND created_at >= ?\n```\n\n```sql\nWHERE chat_id = ?\nORDER BY created_at DESC\nLIMIT 50\n```\n\n```sql\nWHERE user_id = ?\n  AND folder_id = ?\n  AND filename = ?\n```\n\n```sql\nWHERE order_id = ?\n  AND product_id = ?\n```\n\nПод такие запросы можно делать индексы:\n\n```sql\nCREATE INDEX orders_user_status_idx\nON orders (user_id, status);\n```\n\n```sql\nCREATE INDEX events_tenant_created_idx\nON events (tenant_id, created_at);\n```\n\n```sql\nCREATE INDEX messages_chat_created_idx\nON messages (chat_id, created_at DESC);\n```\n\n```sql\nCREATE UNIQUE INDEX files_user_folder_name_idx\nON files (user_id, folder_id, filename);\n```\n\n---\n\n### Как выбирать порядок колонок\n\nНет универсального правила, но есть практические ориентиры.\n\n### 1. Сначала колонки, которые часто используются через `=`\n\nНапример:\n\n```sql\nWHERE user_id = ?\n  AND status = ?\n  AND created_at >= ?\n```\n\nХороший индекс:\n\n```sql\nON orders (user_id, status, created_at)\n```\n\nПотому что `user_id` и `status` — равенство, `created_at` — диапазон.\n\n---\n\n### 2. Учитывать самые частые запросы\n\nЕсли чаще ищешь так:\n\n```sql\nWHERE user_id = ?\nORDER BY created_at DESC\nLIMIT 20\n```\n\nиндекс:\n\n```sql\nON orders (user_id, created_at DESC)\n```\n\nЕсли чаще так:\n\n```sql\nWHERE status = ?\nORDER BY created_at DESC\nLIMIT 20\n```\n\nиндекс:\n\n```sql\nON orders (status, created_at DESC)\n```\n\n---\n\n### 3. Учитывать селективность\n\nСелективность — насколько сильно колонка сужает выборку.\n\nНапример:\n\n```text\nstatus имеет 3 значения: new, paid, cancelled;\nuser_id имеет миллионы разных значений.\n```\n\nУсловие:\n\n```sql\nWHERE user_id = 123\n```\n\nобычно сильно сужает выборку.\n\nУсловие:\n\n```sql\nWHERE status = 'paid'\n```\n\nможет выбрать огромную часть таблицы.\n\nПоэтому в индексе для запроса конкретного пользователя часто логично ставить `user_id` первым:\n\n```sql\nON orders (user_id, status)\n```\n\nНо если главный запрос начинается со статуса и не содержит `user_id`, тогда нужен другой индекс.\n\n---\n\n### 4. Учитывать сортировку\n\nДля запроса:\n\n```sql\nSELECT *\nFROM messages\nWHERE chat_id = 100\nORDER BY created_at DESC\nLIMIT 50;\n```\n\nиндекс:\n\n```sql\nCREATE INDEX messages_chat_created_idx\nON messages (chat_id, created_at DESC);\n```\n\nлучше, чем просто:\n\n```sql\nCREATE INDEX messages_chat_idx\nON messages (chat_id);\n```\n\nПотому что первый индекс помогает и найти строки по `chat_id`, и получить их уже в нужном порядке.\n\n---\n\n### INCLUDE — не совсем составной индекс\n\nВ PostgreSQL есть `INCLUDE`-колонки:\n\n```sql\nCREATE INDEX orders_user_created_include_idx\nON orders (user_id, created_at DESC)\nINCLUDE (amount, status);\n```\n\nЗдесь ключевые колонки индекса:\n\n```text\nuser_id, created_at\n```\n\nА `amount`, `status` добавлены как дополнительные данные в индекс, но не участвуют в сортировке ключа так же, как основные колонки.\n\nЭто может помочь для index-only scan, когда запросу достаточно данных из индекса и не нужно идти в таблицу.\n\nПример запроса:\n\n```sql\nSELECT created_at, amount, status\nFROM orders\nWHERE user_id = 123\nORDER BY created_at DESC\nLIMIT 20;\n```\n\n`INCLUDE` полезен, когда колонка нужна в `SELECT`, но не нужна для поиска или сортировки.\n\n---\n\n### Составной индекс и покрывающий индекс\n\nЕсли индекс содержит все колонки, нужные запросу, база иногда может выполнить запрос без чтения самой таблицы.\n\nНапример:\n\n```sql\nCREATE INDEX orders_user_status_amount_idx\nON orders (user_id, status)\nINCLUDE (amount);\n```\n\nЗапрос:\n\n```sql\nSELECT amount\nFROM orders\nWHERE user_id = 10\n  AND status = 'paid';\n```\n\nТеоретически может быть выполнен через индекс, потому что:\n\n```text\nuser_id и status нужны для поиска;\namount нужен для результата;\nвсе эти данные есть в индексе.\n```\n\nВ PostgreSQL это может привести к `Index Only Scan`, если соблюдены условия видимости строк. PostgreSQL описывает index-only scans как возможность возвращать результат только из индекса, если индекс содержит все нужные данные и visibility map позволяет не обращаться к heap. \n\n---\n\n### Минусы составных индексов\n\nСоставной индекс не бесплатный.\n\nМинусы:\n\n```text\nзанимает место на диске;\nзамедляет INSERT;\nзамедляет UPDATE колонок, входящих в индекс;\nзамедляет DELETE;\nувеличивает стоимость обслуживания таблицы;\nможет быть бесполезным, если порядок колонок выбран неправильно;\nможет дублировать другие индексы.\n```\n\nНапример, если создать много индексов:\n\n```sql\nCREATE INDEX orders_user_idx ON orders (user_id);\nCREATE INDEX orders_user_status_idx ON orders (user_id, status);\nCREATE INDEX orders_user_status_created_idx ON orders (user_id, status, created_at);\nCREATE INDEX orders_status_idx ON orders (status);\nCREATE INDEX orders_created_idx ON orders (created_at);\n```\n\nэто может ускорить некоторые `SELECT`, но сделать записи тяжелее.\n\nОбщее правило PostgreSQL: индексы ускоряют чтение, но добавляют накладные расходы на изменение данных и занимают место. \n\n---\n\n### Частая ошибка: индекс не под тот порядок колонок\n\nЕсть индекс:\n\n```sql\nCREATE INDEX orders_user_status_idx\nON orders (user_id, status);\n```\n\nА запросы в реальности такие:\n\n```sql\nSELECT *\nFROM orders\nWHERE status = 'paid'\nORDER BY created_at DESC;\n```\n\nЭтот индекс не очень подходит.\n\nЛучше:\n\n```sql\nCREATE INDEX orders_status_created_idx\nON orders (status, created_at DESC);\n```\n\nИндекс должен проектироваться под реальные `WHERE`, `JOIN`, `ORDER BY`, а не просто «на всякий случай».\n\n---\n\n### Частая ошибка: думать, что составной индекс заменяет все одиночные\n\nИндекс:\n\n```sql\nON orders (user_id, status)\n```\n\nможет помочь для:\n\n```sql\nWHERE user_id = ?\n```\n\nи:\n\n```sql\nWHERE user_id = ?\n  AND status = ?\n```\n\nНо не обязательно хорошо поможет для:\n\n```sql\nWHERE status = ?\n```\n\nПоэтому он не полностью заменяет индекс:\n\n```sql\nON orders (status)\n```\n\nЕсли такие запросы реально важны, отдельный индекс по `status` или другой составной индекс может быть нужен.\n\n---\n\n### Частая ошибка: индексировать низкоселективную колонку первой\n\nНапример:\n\n```sql\nCREATE INDEX orders_status_user_idx\nON orders (status, user_id);\n```\n\nЕсли `status` имеет всего несколько значений, а основной запрос всегда ищет конкретного пользователя:\n\n```sql\nWHERE user_id = ?\n  AND status = ?\n```\n\nчасто лучше:\n\n```sql\nCREATE INDEX orders_user_status_idx\nON orders (user_id, status);\n```\n\nНо это не абсолютный закон. Нужно смотреть на реальные запросы и планы.\n\n---\n\n### Частая ошибка: не проверять через EXPLAIN ANALYZE\n\nСоздать индекс — не значит, что база обязана его использовать.\n\nPostgreSQL может выбрать `Seq Scan`, если считает, что так дешевле.\n\nНапример:\n\n```sql\nEXPLAIN ANALYZE\nSELECT *\nFROM orders\nWHERE user_id = 10\n  AND status = 'paid';\n```\n\nНужно смотреть:\n\n```text\nиспользуется ли индекс;\nсколько строк реально прочитано;\nесть ли Sort;\nесть ли Bitmap Index Scan;\nсколько времени занимает запрос;\nсовпадает ли оценка строк с реальностью.\n```\n\nЕсли статистика устарела, может понадобиться:\n\n```sql\nANALYZE orders;\n```\n\n---\n\n### Пример из backend: уведомления\n\nЕсть таблица:\n\n```sql\nCREATE TABLE notifications (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    user_id BIGINT NOT NULL,\n    type TEXT NOT NULL,\n    is_read BOOLEAN NOT NULL DEFAULT false,\n    created_at TIMESTAMP NOT NULL DEFAULT now()\n);\n```\n\nЧастый API-запрос:\n\n```sql\nSELECT *\nFROM notifications\nWHERE user_id = 123\n  AND is_read = false\nORDER BY created_at DESC\nLIMIT 20;\n```\n\nХороший индекс:\n\n```sql\nCREATE INDEX notifications_user_read_created_idx\nON notifications (user_id, is_read, created_at DESC);\n```\n\nПочему:\n\n```text\nuser_id = 123           -> берём уведомления конкретного пользователя;\nis_read = false         -> фильтруем непрочитанные;\ncreated_at DESC LIMIT   -> быстро берём самые свежие.\n```\n\nЕсли бы был только индекс:\n\n```sql\nCREATE INDEX notifications_user_idx\nON notifications (user_id);\n```\n\nбаза нашла бы уведомления пользователя, но дальше ей пришлось бы дополнительно фильтровать `is_read` и сортировать по `created_at`.\n\n---\n\n### Пример из backend: файлы пользователя\n\nЕсть таблица:\n\n```sql\nCREATE TABLE files (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    user_id BIGINT NOT NULL,\n    folder_id BIGINT NOT NULL,\n    filename TEXT NOT NULL,\n    created_at TIMESTAMP NOT NULL DEFAULT now()\n);\n```\n\nНужно запретить пользователю иметь два файла с одинаковым именем в одной папке:\n\n```sql\nCREATE UNIQUE INDEX files_user_folder_filename_idx\nON files (user_id, folder_id, filename);\n```\n\nТеперь можно:\n\n```text\nuser_id = 1, folder_id = 10, filename = 'report.pdf'\nuser_id = 1, folder_id = 11, filename = 'report.pdf'\nuser_id = 2, folder_id = 10, filename = 'report.pdf'\n```\n\nНо нельзя:\n\n```text\nuser_id = 1, folder_id = 10, filename = 'report.pdf'\nuser_id = 1, folder_id = 10, filename = 'report.pdf'\n```\n\nТакой индекс одновременно:\n\n```text\nускоряет поиск файла в папке;\nобеспечивает бизнес-уникальность.\n```\n\n---\n\n### Пример из many-to-many\n\nТаблица ролей пользователя:\n\n```sql\nCREATE TABLE user_roles (\n    user_id BIGINT NOT NULL,\n    role_id BIGINT NOT NULL,\n    PRIMARY KEY (user_id, role_id)\n);\n```\n\nPrimary key создаёт уникальный составной индекс по:\n\n```text\n(user_id, role_id)\n```\n\nОн хорошо подходит для запроса:\n\n```sql\nSELECT *\nFROM user_roles\nWHERE user_id = 10;\n```\n\nи:\n\n```sql\nSELECT *\nFROM user_roles\nWHERE user_id = 10\n  AND role_id = 2;\n```\n\nНо если часто нужно искать всех пользователей конкретной роли:\n\n```sql\nSELECT *\nFROM user_roles\nWHERE role_id = 2;\n```\n\nможет понадобиться дополнительный индекс:\n\n```sql\nCREATE INDEX user_roles_role_user_idx\nON user_roles (role_id, user_id);\n```\n\nЭто хороший пример того, почему порядок колонок важен.\n\n---\n\n### Составной индекс и JOIN\n\nСоставной индекс полезен и для соединений, если JOIN использует несколько колонок.\n\nНапример, есть таблица `order_items`:\n\n```sql\nCREATE TABLE order_items (\n    order_id BIGINT NOT NULL,\n    product_id BIGINT NOT NULL,\n    quantity INTEGER NOT NULL,\n    PRIMARY KEY (order_id, product_id)\n);\n```\n\nЗапрос:\n\n```sql\nSELECT *\nFROM order_items\nWHERE order_id = 100\n  AND product_id = 50;\n```\n\nСоставной primary key `(order_id, product_id)` хорошо подходит.\n\nЕсли есть составная связь:\n\n```sql\nON a.tenant_id = b.tenant_id\nAND a.external_id = b.external_id\n```\n\nто индекс:\n\n```sql\nON b (tenant_id, external_id)\n```\n\nможет сильно ускорить такой JOIN.\n\n---\n\n### Как понять, нужен ли составной индекс\n\nСмотри на реальные запросы.\n\nЕсли часто есть:\n\n```sql\nWHERE a = ?\n  AND b = ?\n```\n\nили:\n\n```sql\nWHERE a = ?\nORDER BY b DESC\nLIMIT ?\n```\n\nили:\n\n```sql\nWHERE a = ?\n  AND b BETWEEN ? AND ?\n```\n\nто составной индекс может быть полезен.\n\nЕсли запросы всегда только по отдельным колонкам:\n\n```sql\nWHERE a = ?\n```\n\nи отдельно:\n\n```sql\nWHERE b = ?\n```\n\nто два одиночных индекса могут быть лучше.\n\n---\n\n### Практическое правило\n\nДля запроса:\n\n```sql\nWHERE user_id = ?\n  AND status = ?\nORDER BY created_at DESC\nLIMIT 20\n```\n\nчасто хороший индекс:\n\n```sql\nON table_name (user_id, status, created_at DESC)\n```\n\nДля запроса:\n\n```sql\nWHERE tenant_id = ?\n  AND created_at >= ?\n```\n\nчасто хороший индекс:\n\n```sql\nON table_name (tenant_id, created_at)\n```\n\nДля запроса:\n\n```sql\nWHERE chat_id = ?\nORDER BY created_at DESC\nLIMIT 50\n```\n\nчасто хороший индекс:\n\n```sql\nON messages (chat_id, created_at DESC)\n```\n\n---\n\n### Итог\n\n**Составной индекс** — это индекс по нескольким колонкам:\n\n```sql\nCREATE INDEX idx_name\nON table_name (column1, column2, column3);\n```\n\nОн нужен, когда запросы часто фильтруют, соединяют или сортируют данные по комбинации колонок.\n\nГлавное:\n\n```text\nсоставной индекс хранит комбинацию значений, а не независимые индексы;\nпорядок колонок в индексе важен;\nB-tree индекс наиболее эффективен по ведущим левым колонкам;\nиндекс (a, b) хорошо подходит для WHERE a = ... и WHERE a = ... AND b = ...;\nиндекс (a, b) обычно не лучший вариант для WHERE b = ...;\nсоставной UNIQUE индекс защищает уникальность комбинации;\nсоставной PRIMARY KEY часто используется в many-to-many таблицах;\nлишние составные индексы замедляют запись и занимают место.\n```\n\nХороший составной индекс проектируют не абстрактно, а под конкретные частые запросы и проверяют через:\n\n```sql\nEXPLAIN ANALYZE\n```"
