[[questions]]
  id = 49
  question = "Какие инструменты используют для работы с БД"
  answer = "### Общая идея\n\nДля работы с БД используют не один инструмент, а набор инструментов под разные задачи:\n\n```text\n1. Консольные клиенты\n2. GUI-клиенты\n3. ORM и query builders\n4. Драйверы подключения\n5. Миграционные инструменты\n6. Инструменты администрирования\n7. Инструменты backup/restore\n8. Инструменты мониторинга\n9. Инструменты профилирования запросов\n10. Инструменты контейнеризации и локальной разработки\n```\n\nЕсли говорить про backend-разработчика, то чаще всего нужны:\n\n```text\npsql / pgAdmin / DBeaver;\nSQLAlchemy / Django ORM;\nasyncpg / psycopg;\nAlembic / Django migrations;\nEXPLAIN ANALYZE;\npg_dump / pg_restore;\nDocker / docker-compose;\nPrometheus / Grafana / pg_stat_statements.\n```\n\n---\n\n### 1. Консольные клиенты\n\nКонсольный клиент — это инструмент, через который можно подключиться к БД из терминала и выполнять SQL-запросы.\n\nДля PostgreSQL основной инструмент:\n\n```text\npsql\n```\n\n`psql` — терминальный клиент PostgreSQL. Через него можно интерактивно выполнять SQL-запросы, смотреть результаты, запускать SQL-файлы, проверять схему, выполнять служебные команды. PostgreSQL официально описывает `psql` как terminal-based front-end к PostgreSQL. ([PostgreSQL](https://www.postgresql.org/docs/current/app-psql.html?utm_source=chatgpt.com \"PostgreSQL: Documentation: 18: psql\"))\n\nПример подключения:\n\n```bash\npsql -h localhost -p 5432 -U postgres -d app_db\n```\n\nПример запроса:\n\n```sql\nSELECT *\nFROM users\nLIMIT 10;\n```\n\nПолезные команды `psql`:\n\n```sql\n\\l      -- список баз данных\n\\c db   -- подключиться к базе\n\\dt     -- список таблиц\n\\d users -- описание таблицы users\n\\di     -- список индексов\n\\df     -- список функций\n\\x      -- расширенный вывод\n\\q      -- выход\n```\n\nКонсольные клиенты полезны, потому что они:\n\n```text\nбыстро работают;\nудобны на сервере;\nподходят для диагностики;\nиспользуются в скриптах;\nне требуют графического интерфейса;\nчасто доступны в Docker-контейнере с БД.\n```\n\n---\n\n### 2. GUI-клиенты\n\nGUI-клиенты — это графические программы для работы с БД.\n\nОни удобны, когда нужно:\n\n```text\nпосмотреть таблицы;\nоткрыть данные;\nнаписать SQL-запрос;\nпосмотреть связи;\nэкспортировать результат;\nизменить данные вручную;\nпосмотреть индексы, constraints, views;\nработать с несколькими БД через интерфейс.\n```\n\nЧастые GUI-инструменты:\n\n```text\npgAdmin;\nDBeaver;\nDataGrip;\nTablePlus;\nHeidiSQL;\nNavicat.\n```\n\n---\n\n### pgAdmin\n\n`pgAdmin` — официальный популярный графический инструмент для PostgreSQL. На сайте pgAdmin он описывается как open-source management tool для PostgreSQL. \n\nЧерез pgAdmin можно:\n\n```text\nсоздавать базы и таблицы;\nписать SQL в Query Tool;\nсмотреть схему;\nсмотреть индексы и constraints;\nуправлять ролями;\nсмотреть активность сервера;\nделать backup/restore через GUI;\nработать с функциями, процедурами, views.\n```\n\npgAdmin хорош именно для PostgreSQL, потому что заточен под него.\n\n---\n\n### DBeaver\n\n`DBeaver` — универсальный клиент для разных БД. Официальная документация описывает его как universal database management tool для профессиональной работы с данными. \n\nОн удобен, если в проекте не только PostgreSQL, но и:\n\n```text\nMySQL;\nMariaDB;\nSQLite;\nOracle;\nSQL Server;\nClickHouse;\nRedis;\nMongoDB;\nдругие источники данных.\n```\n\nПлюсы DBeaver:\n\n```text\nмного СУБД в одном интерфейсе;\nудобный SQL editor;\nпросмотр таблиц и данных;\nER-диаграммы;\nэкспорт/импорт;\nподдержка SSH tunnel;\nудобен для повседневной работы разработчика.\n```\n\n---\n\n### DataGrip\n\n`DataGrip` — IDE для баз данных от JetBrains.\n\nЧасто используют, если разработчик уже работает в:\n\n```text\nPyCharm;\nIntelliJ IDEA;\nWebStorm;\nGoLand.\n```\n\nПлюсы:\n\n```text\nсильный SQL autocomplete;\nподсветка ошибок;\nнавигация по схеме;\nрефакторинг SQL;\nинтеграция с JetBrains IDE;\nудобная работа с несколькими подключениями.\n```\n\n---\n\n### 3. Драйверы подключения\n\nДрайвер — это библиотека, через которую приложение подключается к базе данных.\n\nНапример, Python-приложение не общается с PostgreSQL напрямую «магией». Ему нужен драйвер.\n\nДля PostgreSQL в Python часто используют:\n\n```text\npsycopg / psycopg2;\nasyncpg;\npg8000.\n```\n\nДля Java:\n\n```text\nPostgreSQL JDBC Driver.\n```\n\nДля Node.js:\n\n```text\npg;\npostgres.js.\n```\n\nДля Go:\n\n```text\npgx;\nlib/pq.\n```\n\nПример на Python с `psycopg`:\n\n```python\nimport psycopg\n\nconn = psycopg.connect(\n    \"host=localhost port=5432 dbname=app_db user=postgres password=secret\"\n)\n\nwith conn.cursor() as cur:\n    cur.execute(\"SELECT id, username FROM users LIMIT 10\")\n    rows = cur.fetchall()\n\nprint(rows)\n```\n\nДрайвер нужен для:\n\n```text\nподключения к БД;\nотправки SQL-запросов;\nполучения результата;\nработы с транзакциями;\nпараметризации запросов;\nобработки ошибок;\nработы с connection pool.\n```\n\n---\n\n### 4. ORM\n\nORM — Object-Relational Mapping.\n\nORM позволяет работать с таблицами как с объектами языка программирования.\n\nНапример, вместо ручного SQL:\n\n```sql\nSELECT *\nFROM users\nWHERE id = 1;\n```\n\nможно написать в Python через ORM:\n\n```python\nuser = session.get(User, 1)\n```\n\nЧастые ORM:\n\n```text\nSQLAlchemy;\nDjango ORM;\nTortoise ORM;\nPeewee;\nPrisma;\nHibernate;\nEntity Framework.\n```\n\nSQLAlchemy официально описывает себя как Python SQL toolkit and Object Relational Mapper, который даёт разработчикам гибкость и мощность SQL. \n\n---\n\n### SQLAlchemy\n\nSQLAlchemy часто используют с:\n\n```text\nFastAPI;\nFlask;\nчистыми Python-сервисами;\nмикросервисами;\nAlembic для миграций.\n```\n\nПример модели:\n\n```python\nfrom sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column\nfrom sqlalchemy import String, BigInteger\n\n\nclass Base(DeclarativeBase):\n    pass\n\n\nclass User(Base):\n    __tablename__ = \"users\"\n\n    id: Mapped[int] = mapped_column(BigInteger, primary_key=True)\n    username: Mapped[str] = mapped_column(String(100), unique=True, nullable=False)\n```\n\nПример запроса:\n\n```python\nfrom sqlalchemy import select\n\nstmt = select(User).where(User.username == \"alex\")\nuser = session.execute(stmt).scalar_one_or_none()\n```\n\n---\n\n### Django ORM\n\nDjango ORM используют в Django-проектах.\n\nПример модели:\n\n```python\nfrom django.db import models\n\n\nclass UserFile(models.Model):\n    user = models.ForeignKey(\n        \"auth.User\",\n        on_delete=models.CASCADE,\n        related_name=\"files\"\n    )\n    file = models.FileField(upload_to=\"files/\")\n    uploaded_at = models.DateTimeField(auto_now_add=True)\n```\n\nПример запроса:\n\n```python\nfiles = UserFile.objects.filter(user=request.user)\n```\n\nORM полезен, потому что:\n\n```text\nускоряет разработку;\nпомогает описывать модели;\nдаёт миграции;\nупрощает CRUD;\nпомогает строить запросы;\nснижает количество ручного SQL.\n```\n\nНо ORM не отменяет SQL. Для сложных запросов, оптимизации и диагностики всё равно нужно понимать:\n\n```text\nJOIN;\nиндексы;\nEXPLAIN ANALYZE;\nтранзакции;\nизоляцию;\nconstraints;\nN+1 queries.\n```\n\n---\n\n### 5. Query Builder\n\nQuery builder — промежуточный вариант между чистым SQL и ORM.\n\nОн позволяет собирать SQL программно.\n\nНапример, SQLAlchemy Core:\n\n```python\nfrom sqlalchemy import select\n\nstmt = (\n    select(users.c.id, users.c.username)\n    .where(users.c.is_active == True)\n    .limit(10)\n)\n```\n\nПлюсы query builder:\n\n```text\nменьше ручной склейки SQL-строк;\nбезопаснее параметризация;\nудобно строить динамические запросы;\nбольше контроля, чем у ORM;\nSQL-логика ближе к реальному SQL.\n```\n\nИспользуется, когда ORM слишком тяжёлый или когда нужно точнее контролировать SQL.\n\n---\n\n### 6. Инструменты миграций\n\nМиграции нужны, чтобы управлять изменениями схемы БД.\n\nНапример, сегодня есть таблица:\n\n```sql\nusers(id, username)\n```\n\nЗавтра нужно добавить:\n\n```sql\nemail\ncreated_at\n```\n\nНельзя просто руками менять production-базу без истории. Для этого используют миграции.\n\nЧастые инструменты:\n\n```text\nAlembic;\nDjango migrations;\nFlyway;\nLiquibase;\nPrisma Migrate;\nRails migrations.\n```\n\n---\n\n### Alembic\n\nAlembic часто используют вместе с SQLAlchemy. Официальная документация Alembic описывает его как инструмент создания, управления и выполнения change management scripts для реляционной БД с использованием SQLAlchemy. \n\nПример команд:\n\n```bash\nalembic revision -m \"create users table\"\nalembic upgrade head\nalembic downgrade -1\n```\n\nС autogenerate:\n\n```bash\nalembic revision --autogenerate -m \"add email to users\"\n```\n\nAlembic может сравнить текущую схему БД с metadata приложения и сгенерировать «очевидные» изменения в миграции. \n\n---\n\n### Django migrations\n\nВ Django миграции встроены.\n\nТипичный workflow:\n\n```bash\npython manage.py makemigrations\npython manage.py migrate\n```\n\n`makemigrations` создаёт файл миграции по изменениям моделей.  \n`migrate` применяет миграции к БД.\n\nМиграции нужны для:\n\n```text\nсоздания таблиц;\nдобавления колонок;\nизменения типов;\nсоздания индексов;\nсоздания constraints;\nотката изменений;\nсинхронизации схемы в команде;\nразвёртывания изменений на production.\n```\n\n---\n\n### 7. Инструменты backup и restore\n\nДля работы с БД нужны инструменты резервного копирования и восстановления.\n\nДля PostgreSQL основные:\n\n```text\npg_dump;\npg_restore;\npg_dumpall;\npg_basebackup.\n```\n\nПример backup одной базы:\n\n```bash\npg_dump -h localhost -U postgres -d app_db -F c -f app_db.dump\n```\n\nВосстановление:\n\n```bash\npg_restore -h localhost -U postgres -d app_db app_db.dump\n```\n\nSQL-дамп:\n\n```bash\npg_dump -h localhost -U postgres -d app_db > backup.sql\n```\n\nВосстановление SQL-дампа:\n\n```bash\npsql -h localhost -U postgres -d app_db < backup.sql\n```\n\nBackup-инструменты нужны для:\n\n```text\nрезервных копий;\nпереноса БД;\nлокального восстановления;\nсоздания тестовой копии production;\nмиграции между окружениями;\nвосстановления после ошибки.\n```\n\nВажно: репликация не заменяет backup. Если в production случайно выполнить:\n\n```sql\nDROP TABLE users;\n```\n\nэто изменение уйдёт и на реплики. Backup нужен отдельно.\n\n---\n\n### 8. Инструменты анализа запросов\n\nДля оптимизации запросов в PostgreSQL используют:\n\n```text\nEXPLAIN;\nEXPLAIN ANALYZE;\npg_stat_statements;\nauto_explain;\nлоги медленных запросов.\n```\n\nСамое базовое:\n\n```sql\nEXPLAIN\nSELECT *\nFROM orders\nWHERE user_id = 123;\n```\n\nБолее полезное:\n\n```sql\nEXPLAIN ANALYZE\nSELECT *\nFROM orders\nWHERE user_id = 123;\n```\n\n`EXPLAIN` показывает план выполнения запроса, а `EXPLAIN ANALYZE` реально выполняет запрос и показывает фактическое время, количество строк, выбранные методы сканирования и соединения.\n\nЧерез это смотрят:\n\n```text\nиспользуется ли индекс;\nесть ли Seq Scan;\nесть ли Sort;\nкакой JOIN выбран;\nсколько строк ожидалось;\nсколько строк реально получено;\nгде самая дорогая часть запроса.\n```\n\n---\n\n### 9. pg_stat_statements\n\n`pg_stat_statements` — расширение PostgreSQL для сбора статистики по выполняемым SQL-запросам.\n\nОно помогает понять:\n\n```text\nкакие запросы самые частые;\nкакие запросы самые медленные;\nкакие запросы суммарно дают большую нагрузку;\nсреднее время выполнения;\nколичество вызовов;\nколичество прочитанных блоков.\n```\n\nОбычно это один из главных инструментов для поиска проблемных запросов в production.\n\nПример запроса:\n\n```sql\nSELECT\n    query,\n    calls,\n    total_exec_time,\n    mean_exec_time\nFROM pg_stat_statements\nORDER BY total_exec_time DESC\nLIMIT 10;\n```\n\n---\n\n### 10. Инструменты мониторинга\n\nДля production-БД нужны инструменты мониторинга.\n\nЧастые варианты:\n\n```text\nPrometheus;\nGrafana;\npostgres_exporter;\nZabbix;\nDatadog;\nNew Relic;\nPercona Monitoring and Management;\npgwatch.\n```\n\nЧто мониторят:\n\n```text\nCPU;\nRAM;\ndisk usage;\nIOPS;\nconnections;\nlocks;\ndeadlocks;\nreplication lag;\nslow queries;\ncache hit ratio;\ntransactions per second;\nWAL generation;\nautovacuum activity;\ntable/index bloat.\n```\n\nДля PostgreSQL особенно важно следить за:\n\n```text\nдолгими транзакциями;\nблокировками;\nростом WAL;\nсостоянием autovacuum;\nreplication lag;\nколичеством подключений;\nиспользованием диска.\n```\n\n---\n\n### 11. Инструменты администрирования\n\nАдминистрирование БД включает:\n\n```text\nсоздание ролей;\nвыдачу прав;\nнастройку пользователей;\nсоздание баз;\nуправление extensions;\nнастройку репликации;\nанализ блокировок;\nуправление вакуумом;\nпроверку конфигурации.\n```\n\nИнструменты:\n\n```text\npsql;\npgAdmin;\nDBeaver;\npatronictl, если используется Patroni;\nrepmgr, если используется repmgr;\ncloud console, если managed PostgreSQL.\n```\n\nПримеры SQL-команд:\n\n```sql\nCREATE ROLE app_user LOGIN PASSWORD 'secret';\n```\n\n```sql\nGRANT SELECT, INSERT, UPDATE, DELETE\nON ALL TABLES IN SCHEMA public\nTO app_user;\n```\n\n```sql\nCREATE EXTENSION IF NOT EXISTS pgcrypto;\n```\n\n---\n\n### 12. Инструменты для локальной разработки\n\nДля локальной разработки часто используют:\n\n```text\nDocker;\nDocker Compose;\nлокальный PostgreSQL;\ntestcontainers;\nSQLite для простых тестов;\nотдельную test database.\n```\n\nПример `docker-compose.yml` для PostgreSQL:\n\n```yaml\nservices:\n  postgres:\n    image: postgres:17\n    environment:\n      POSTGRES_DB: app_db\n      POSTGRES_USER: app_user\n      POSTGRES_PASSWORD: secret\n    ports:\n      - \"5432:5432\"\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n\nvolumes:\n  postgres_data:\n```\n\nПосле запуска:\n\n```bash\ndocker compose up -d\n```\n\nПодключение:\n\n```bash\npsql -h localhost -p 5432 -U app_user -d app_db\n```\n\nDocker полезен, потому что:\n\n```text\nодинаковая версия БД у всех разработчиков;\nбыстрый запуск окружения;\nлегко пересоздать БД;\nудобно для тестов;\nможно поднять PostgreSQL, Redis, MinIO и backend вместе.\n```\n\n---\n\n### 13. Инструменты тестирования БД\n\nДля тестов используют:\n\n```text\npytest;\npytest-django;\npytest-asyncio;\ntestcontainers;\nfactory_boy;\nFaker;\nтестовую БД PostgreSQL;\nтранзакционные фикстуры.\n```\n\nГлавные задачи:\n\n```text\nсоздать тестовую схему;\nприменить миграции;\nподготовить данные;\nзапустить тест;\nочистить данные;\nпроверить результат.\n```\n\nДля Django часто используют встроенную тестовую БД.\n\nДля FastAPI + SQLAlchemy часто делают:\n\n```text\nотдельный PostgreSQL для тестов;\nAlembic migrations;\nsession fixture;\nrollback после теста;\nочистку таблиц между тестами.\n```\n\n---\n\n### 14. Инструменты для миграции и синхронизации данных\n\nИногда нужно не просто изменить схему, а перенести данные:\n\n```text\nиз старой БД в новую;\nиз MySQL в PostgreSQL;\nиз production в staging;\nиз одной схемы в другую;\nиз монолита в микросервис.\n```\n\nИнструменты:\n\n```text\npg_dump / pg_restore;\nCOPY;\npsql \\copy;\nETL-инструменты;\nAirbyte;\nDebezium;\nKafka Connect;\ncustom scripts;\nlogical replication.\n```\n\nДля массовой загрузки CSV в PostgreSQL часто используют:\n\n```sql\nCOPY users(username, email)\nFROM '/path/users.csv'\nDELIMITER ','\nCSV HEADER;\n```\n\nИли клиентский вариант:\n\n```sql\n\\copy users(username, email) FROM 'users.csv' DELIMITER ',' CSV HEADER\n```\n\n---\n\n### 15. Инструменты CDC и репликации\n\nCDC — Change Data Capture. Это инструменты, которые читают изменения из БД и передают их дальше.\n\nИспользуют для:\n\n```text\nсинхронизации сервисов;\nзагрузки данных в аналитику;\nevent-driven архитектуры;\nрепликации в Kafka;\nобновления search index;\nинтеграций.\n```\n\nЧастые инструменты:\n\n```text\nDebezium;\nKafka Connect;\nPostgreSQL logical replication;\npglogical;\nnative publication/subscription.\n```\n\nВ PostgreSQL есть встроенная logical replication через:\n\n```text\nPUBLICATION;\nSUBSCRIPTION.\n```\n\nПример:\n\n```sql\nCREATE PUBLICATION app_pub FOR TABLE users, orders;\n```\n\n---\n\n### 16. Инструменты для работы с connection pool\n\nБД не любит бесконечное количество подключений. Поэтому часто используют connection pooling.\n\nИнструменты:\n\n```text\nPgBouncer;\nPgpool-II;\npool внутри SQLAlchemy;\npool внутри asyncpg;\npool в Django через сторонние решения или настройки окружения.\n```\n\n`PgBouncer` часто ставят между приложением и PostgreSQL:\n\n```text\nApplication -> PgBouncer -> PostgreSQL\n```\n\nОн помогает:\n\n```text\nуменьшить количество реальных подключений к БД;\nпереиспользовать соединения;\nснизить накладные расходы;\nзащитить БД от всплеска соединений.\n```\n\n---\n\n### 17. Инструменты для документации схемы\n\nДля описания схемы и ER-диаграмм используют:\n\n```text\nDBeaver ER diagrams;\nDataGrip diagrams;\ndbdiagram.io;\nSchemaSpy;\nDraw.io;\nMermaid;\nPlantUML;\npgModeler.\n```\n\nПример Mermaid ER:\n\n```mermaid\nerDiagram\n    USERS ||--o{ ORDERS : has\n    ORDERS ||--o{ ORDER_ITEMS : contains\n    PRODUCTS ||--o{ ORDER_ITEMS : included_in\n```\n\nТакие инструменты помогают понять:\n\n```text\nтаблицы;\nсвязи;\nforeign keys;\nmany-to-many;\nзависимости;\nструктуру проекта.\n```\n\n---\n\n### 18. Инструменты безопасности\n\nДля безопасности БД используют:\n\n```text\nroles;\nGRANT / REVOKE;\nRow Level Security;\nSSL/TLS;\nсекреты в env/secret manager;\naudit extensions;\nлогирование подключений;\npg_hba.conf.\n```\n\nПример выдачи прав:\n\n```sql\nGRANT SELECT ON users TO readonly_user;\n```\n\nПример отзыва прав:\n\n```sql\nREVOKE DELETE ON users FROM app_user;\n```\n\nДля хранения паролей и connection strings используют:\n\n```text\n.env для локальной разработки;\nDocker secrets;\nKubernetes secrets;\nVault;\ncloud secret managers.\n```\n\n---\n\n### Что обычно использует backend-разработчик\n\nДля Python backend + PostgreSQL типичный набор такой:\n\n```text\nPostgreSQL              -> сама БД\npsql                    -> быстрые проверки из терминала\nDBeaver / pgAdmin       -> GUI для просмотра данных\nSQLAlchemy / Django ORM -> работа с БД из кода\npsycopg / asyncpg       -> драйвер подключения\nAlembic / Django migrations -> миграции схемы\nEXPLAIN ANALYZE         -> анализ запросов\npg_dump / pg_restore    -> backup/restore\nDocker Compose          -> локальное окружение\npytest + test DB        -> тестирование\nPrometheus/Grafana      -> мониторинг\npg_stat_statements      -> поиск тяжёлых запросов\nPgBouncer               -> pooling подключений\n```\n\n---\n\n### Пример по стеку Django\n\nДля Django-проекта обычно:\n\n```text\nDjango ORM;\nDjango migrations;\npsycopg;\nPostgreSQL;\npgAdmin или DBeaver;\nmanage.py dbshell;\npytest-django;\npg_dump;\nDocker Compose.\n```\n\nПример команд:\n\n```bash\npython manage.py makemigrations\npython manage.py migrate\npython manage.py dbshell\n```\n\n---\n\n### Пример по стеку FastAPI + SQLAlchemy\n\nДля FastAPI чаще:\n\n```text\nSQLAlchemy ORM/Core;\nAlembic;\npsycopg или asyncpg;\nPostgreSQL;\nDBeaver / pgAdmin;\nDocker Compose;\npytest;\nEXPLAIN ANALYZE;\npg_dump / pg_restore.\n```\n\nПример workflow:\n\n```text\n1. Модель описывается в SQLAlchemy.\n2. Alembic создаёт миграцию.\n3. Миграция применяется к PostgreSQL.\n4. FastAPI работает с БД через Session/AsyncSession.\n5. Запросы проверяются через psql/DBeaver.\n6. Производительность проверяется через EXPLAIN ANALYZE.\n```\n\n---\n\n### Что важно понимать на практике\n\nИнструменты можно разделить по ролям.\n\nДля написания SQL:\n\n```text\npsql;\nDBeaver;\npgAdmin;\nDataGrip.\n```\n\nДля доступа из приложения:\n\n```text\nдрайвер;\nORM;\nquery builder;\nconnection pool.\n```\n\nДля изменения схемы:\n\n```text\nAlembic;\nDjango migrations;\nFlyway;\nLiquibase.\n```\n\nДля администрирования:\n\n```text\npsql;\npgAdmin;\npg_dump;\npg_restore;\npg_stat_activity;\npg_locks;\npg_stat_statements.\n```\n\nДля production:\n\n```text\nмониторинг;\nлогирование;\nbackup;\nreplication;\nconnection pooling;\nalerting.\n```\n\n---\n\n### Итог\n\nДля работы с БД используют разные категории инструментов:\n\n```text\npsql                         -> консольная работа с PostgreSQL;\npgAdmin / DBeaver / DataGrip -> графическая работа с БД;\nORM                          -> работа с таблицами через код;\nдрайверы                     -> подключение приложения к БД;\nAlembic / Django migrations  -> управление изменениями схемы;\npg_dump / pg_restore         -> backup и restore;\nEXPLAIN ANALYZE              -> анализ производительности запросов;\npg_stat_statements           -> статистика запросов;\nPrometheus / Grafana         -> мониторинг;\nDocker Compose               -> локальная разработка;\nPgBouncer                    -> пул подключений;\nDebezium / logical replication -> потоковая передача изменений.\n```\n\nДля backend-разработчика минимально уверенный набор:\n\n```text\nSQL;\npsql;\nDBeaver или pgAdmin;\nORM;\nдрайвер подключения;\nмиграции;\nEXPLAIN ANALYZE;\nbackup/restore;\nосновы мониторинга.\n```\n\nТо есть работа с БД — это не только «писать SELECT». Это полный цикл: спроектировать схему, написать запросы, подключить приложение, применить миграции, проверить производительность, настроить права, сделать backup и понимать, что происходит в production."
