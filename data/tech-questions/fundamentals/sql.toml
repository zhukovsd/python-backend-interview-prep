[[questions]]
  id = 43
  question = "Можно ли использовать JOIN и подзапрос в одном SQL-запросе?"
  answer = "### Да, можно\n\n`JOIN` и подзапрос можно использовать в одном SQL-запросе. Это нормальная и частая практика.\n\nНапример:\n\n```sql\nSELECT\n    u.id,\n    u.username,\n    o.id AS order_id,\n    o.amount\nFROM users u\nJOIN orders o ON o.user_id = u.id\nWHERE u.id IN (\n    SELECT user_id\n    FROM user_roles\n    WHERE role_id = 1\n);\n```\n\nЗдесь одновременно используются:\n\n```text\nJOIN       -> чтобы соединить users и orders;\nподзапрос  -> чтобы отфильтровать только пользователей с нужной ролью.\n```\n\nPostgreSQL рассматривает `JOIN` как часть table expression в `FROM`, а подзапросы могут использоваться в выражениях вроде `IN`, `EXISTS`, `ANY`, `ALL` и других местах запроса. Поэтому они спокойно комбинируются в одном SQL. \n\n---\n\n### Пример 1: JOIN + подзапрос в WHERE\n\nДопустим, есть таблицы:\n\n```text\nusers\norders\npayments\n```\n\nНужно получить заказы пользователей, у которых есть успешные платежи.\n\n```sql\nSELECT\n    u.id AS user_id,\n    u.username,\n    o.id AS order_id,\n    o.amount\nFROM users u\nJOIN orders o ON o.user_id = u.id\nWHERE u.id IN (\n    SELECT p.user_id\n    FROM payments p\n    WHERE p.status = 'success'\n);\n```\n\nЧто здесь происходит:\n\n```text\n1. JOIN соединяет пользователей с их заказами.\n2. Подзапрос выбирает user_id пользователей с успешными платежами.\n3. WHERE оставляет только тех пользователей, чей id есть в результате подзапроса.\n```\n\nТо есть `JOIN` отвечает за получение связанных данных, а подзапрос — за дополнительную фильтрацию.\n\n---\n\n### Пример 2: JOIN + EXISTS\n\nЧасто вместо `IN` используют `EXISTS`.\n\n```sql\nSELECT\n    u.id,\n    u.username,\n    o.id AS order_id,\n    o.amount\nFROM users u\nJOIN orders o ON o.user_id = u.id\nWHERE EXISTS (\n    SELECT 1\n    FROM payments p\n    WHERE p.user_id = u.id\n      AND p.status = 'success'\n);\n```\n\nСмысл:\n\n```text\nвывести заказы только тех пользователей,\nдля которых существует хотя бы один успешный платёж.\n```\n\n`EXISTS` проверяет сам факт наличия строки в подзапросе. PostgreSQL указывает, что `EXISTS` возвращает `true`, если подзапрос возвращает хотя бы одну строку. \n\n---\n\n### Пример 3: JOIN с подзапросом в FROM\n\nПодзапрос можно использовать как временную таблицу в `FROM`, а потом присоединить его через `JOIN`.\n\nНапример, нужно получить пользователей и сумму их оплаченных заказов:\n\n```sql\nSELECT\n    u.id,\n    u.username,\n    stats.total_amount\nFROM users u\nJOIN (\n    SELECT\n        user_id,\n        SUM(amount) AS total_amount\n    FROM orders\n    WHERE status = 'paid'\n    GROUP BY user_id\n) AS stats ON stats.user_id = u.id\nWHERE stats.total_amount > 1000;\n```\n\nЗдесь подзапрос:\n\n```sql\nSELECT\n    user_id,\n    SUM(amount) AS total_amount\nFROM orders\nWHERE status = 'paid'\nGROUP BY user_id\n```\n\nсначала формирует результат:\n\n```text\nuser_id | total_amount\n--------+-------------\n1       | 1500\n2       | 700\n3       | 3200\n```\n\nА основной запрос делает `JOIN` этого результата с `users`.\n\nТо есть подзапрос в `FROM` можно воспринимать как временную таблицу результата, доступную только внутри текущего запроса.\n\n---\n\n### Пример 4: JOIN + скалярный подзапрос в SELECT\n\nПодзапрос может стоять прямо в `SELECT`.\n\nНапример, нужно вывести пользователей, их заказы и дату последнего платежа пользователя:\n\n```sql\nSELECT\n    u.id,\n    u.username,\n    o.id AS order_id,\n    o.amount,\n    (\n        SELECT MAX(p.created_at)\n        FROM payments p\n        WHERE p.user_id = u.id\n    ) AS last_payment_at\nFROM users u\nJOIN orders o ON o.user_id = u.id;\n```\n\nЗдесь:\n\n```text\nJOIN соединяет users и orders;\nподзапрос в SELECT считает last_payment_at для каждого пользователя.\n```\n\nТакой подзапрос называется скалярным, потому что должен вернуть одно значение: одну строку и одну колонку.\n\n---\n\n### Пример 5: JOIN + подзапрос с агрегатом\n\nНужно получить заказы, сумма которых выше средней суммы заказа.\n\n```sql\nSELECT\n    u.username,\n    o.id AS order_id,\n    o.amount\nFROM orders o\nJOIN users u ON u.id = o.user_id\nWHERE o.amount > (\n    SELECT AVG(amount)\n    FROM orders\n);\n```\n\nЗдесь:\n\n```text\nJOIN нужен, чтобы получить username пользователя;\nподзапрос нужен, чтобы посчитать среднюю сумму заказа;\nWHERE сравнивает каждый заказ со средним значением.\n```\n\nПодзапрос:\n\n```sql\nSELECT AVG(amount)\nFROM orders\n```\n\nвозвращает одно значение. Его можно использовать в сравнении:\n\n```sql\no.amount > (...)\n```\n\n---\n\n### Пример 6: JOIN + NOT EXISTS\n\nНужно получить пользователей и их профили, но только тех пользователей, у которых нет заказов.\n\n```sql\nSELECT\n    u.id,\n    u.username,\n    p.bio\nFROM users u\nJOIN user_profiles p ON p.user_id = u.id\nWHERE NOT EXISTS (\n    SELECT 1\n    FROM orders o\n    WHERE o.user_id = u.id\n);\n```\n\nСмысл:\n\n```text\nJOIN соединяет пользователя с профилем;\nNOT EXISTS оставляет только тех пользователей,\nдля которых не существует ни одного заказа.\n```\n\n`NOT EXISTS` часто безопаснее, чем `NOT IN`, если во внутреннем наборе возможны `NULL`.\n\n---\n\n### Пример 7: JOIN + подзапрос в условии соединения\n\nПодзапрос можно использовать даже внутри `ON`, хотя так делают реже.\n\nНапример, нужно присоединить только последний заказ пользователя:\n\n```sql\nSELECT\n    u.id,\n    u.username,\n    o.id AS last_order_id,\n    o.created_at\nFROM users u\nLEFT JOIN orders o\n    ON o.user_id = u.id\n   AND o.created_at = (\n       SELECT MAX(o2.created_at)\n       FROM orders o2\n       WHERE o2.user_id = u.id\n   );\n```\n\nЧто происходит:\n\n```text\n1. Берём пользователя.\n2. Через LEFT JOIN пытаемся присоединить его заказ.\n3. В ON через подзапрос оставляем только заказ с максимальной датой.\n```\n\nНо у такого варианта есть нюанс: если у пользователя два заказа с одинаковым максимальным `created_at`, вернутся оба. Поэтому в реальных проектах часто добавляют `id` как tie-breaker или используют оконные функции.\n\nБолее устойчивый вариант через `ROW_NUMBER()`:\n\n```sql\nSELECT\n    u.id,\n    u.username,\n    o.id AS last_order_id,\n    o.created_at\nFROM users u\nLEFT JOIN (\n    SELECT\n        id,\n        user_id,\n        created_at,\n        ROW_NUMBER() OVER (\n            PARTITION BY user_id\n            ORDER BY created_at DESC, id DESC\n        ) AS rn\n    FROM orders\n) o ON o.user_id = u.id\n   AND o.rn = 1;\n```\n\nЗдесь подзапрос заранее нумерует заказы каждого пользователя, а `JOIN` берёт только `rn = 1`.\n\n---\n\n### JOIN и подзапрос решают разные задачи\n\nОбычно:\n\n```text\nJOIN нужен, чтобы объединить данные из нескольких таблиц;\nподзапрос нужен, чтобы получить промежуточный результат для фильтрации, сравнения или расчёта.\n```\n\nПример:\n\n```sql\nSELECT\n    u.username,\n    o.amount\nFROM users u\nJOIN orders o ON o.user_id = u.id\nWHERE o.amount > (\n    SELECT AVG(amount)\n    FROM orders\n);\n```\n\nЗдесь невозможно сказать, что `JOIN` или подзапрос «лучше». Они выполняют разные роли:\n\n```text\nJOIN       -> получить username из users;\nподзапрос  -> вычислить среднюю сумму заказа.\n```\n\n---\n\n### Можно ли заменить подзапрос на JOIN\n\nИногда да.\n\nНапример:\n\n```sql\nSELECT *\nFROM users\nWHERE id IN (\n    SELECT user_id\n    FROM orders\n);\n```\n\nможно переписать через `JOIN`:\n\n```sql\nSELECT DISTINCT u.*\nFROM users u\nJOIN orders o ON o.user_id = u.id;\n```\n\nНо это не всегда одно и то же по удобству.\n\nПодзапрос с `EXISTS`:\n\n```sql\nSELECT *\nFROM users u\nWHERE EXISTS (\n    SELECT 1\n    FROM orders o\n    WHERE o.user_id = u.id\n);\n```\n\nчасто лучше выражает смысл:\n\n```text\nнайди пользователей, у которых есть хотя бы один заказ\n```\n\nА `JOIN` лучше, когда нужны сами данные заказов:\n\n```sql\nSELECT\n    u.username,\n    o.id,\n    o.amount\nFROM users u\nJOIN orders o ON o.user_id = u.id;\n```\n\n---\n\n### Можно ли заменить JOIN на подзапрос\n\nИногда можно, но не всегда это удобно.\n\nНапример:\n\n```sql\nSELECT\n    o.id,\n    o.amount,\n    (\n        SELECT u.username\n        FROM users u\n        WHERE u.id = o.user_id\n    ) AS username\nFROM orders o;\n```\n\nЭто альтернатива:\n\n```sql\nSELECT\n    o.id,\n    o.amount,\n    u.username\nFROM orders o\nJOIN users u ON u.id = o.user_id;\n```\n\nВторой вариант через `JOIN` обычно читается лучше, потому что связь между `orders` и `users` явно выражена в `FROM`.\n\nПрактическое правило:\n\n```text\nесли нужно подтянуть поля из связанной таблицы — обычно JOIN;\nесли нужно проверить наличие/отсутствие или сравнить с агрегатом — часто подзапрос;\nесли нужно и то и другое — можно использовать оба вместе.\n```\n\n---\n\n### Пример полноценного запроса из backend\n\nДопустим, нужно получить список активных пользователей:\n\n```text\nс их профилем;\nс количеством заказов;\nтолько если у них есть хотя бы один оплаченный заказ;\nтолько если у них нет просроченных платежей;\nи сумма заказов больше средней суммы по системе.\n```\n\nЗапрос:\n\n```sql\nSELECT\n    u.id,\n    u.username,\n    p.bio,\n    order_stats.orders_count,\n    order_stats.total_amount\nFROM users u\nJOIN user_profiles p ON p.user_id = u.id\nJOIN (\n    SELECT\n        user_id,\n        COUNT(*) AS orders_count,\n        SUM(amount) AS total_amount\n    FROM orders\n    GROUP BY user_id\n) AS order_stats ON order_stats.user_id = u.id\nWHERE u.is_active = true\n\n  AND EXISTS (\n      SELECT 1\n      FROM orders o\n      WHERE o.user_id = u.id\n        AND o.status = 'paid'\n  )\n\n  AND NOT EXISTS (\n      SELECT 1\n      FROM payments pay\n      WHERE pay.user_id = u.id\n        AND pay.status = 'overdue'\n  )\n\n  AND order_stats.total_amount > (\n      SELECT AVG(amount)\n      FROM orders\n  );\n```\n\nЗдесь одновременно есть:\n\n```text\nJOIN users -> user_profiles;\nJOIN users -> агрегированный подзапрос order_stats;\nEXISTS для проверки оплаченных заказов;\nNOT EXISTS для проверки отсутствия просроченных платежей;\nскалярный подзапрос для средней суммы заказа.\n```\n\nТакой запрос вполне нормален, если он понятен, корректен и имеет подходящие индексы.\n\n---\n\n### Производительность\n\nСам факт, что в запросе есть и `JOIN`, и подзапрос, не делает его плохим.\n\nПроблемы появляются не от комбинации, а от конкретного плана выполнения:\n\n```text\nнет индексов;\nподзапрос выполняется слишком много раз;\nJOIN размножает строки;\nагрегация делается на огромной таблице;\nнеправильный порядок фильтрации;\nнеудачная селективность условий;\nбольшие промежуточные результаты.\n```\n\nПроверять нужно через:\n\n```sql\nEXPLAIN ANALYZE\n```\n\nPostgreSQL строит план выполнения для всего запроса целиком. Подзапросы и `JOIN` могут быть оптимизированы, переписаны или выполнены разными способами в зависимости от статистики, индексов и условий.\n\n---\n\n### Какие индексы могут понадобиться\n\nДля запроса:\n\n```sql\nSELECT\n    u.id,\n    u.username,\n    o.id AS order_id\nFROM users u\nJOIN orders o ON o.user_id = u.id\nWHERE EXISTS (\n    SELECT 1\n    FROM payments p\n    WHERE p.user_id = u.id\n      AND p.status = 'success'\n);\n```\n\nобычно полезны индексы:\n\n```sql\nCREATE INDEX orders_user_id_idx\nON orders (user_id);\n\nCREATE INDEX payments_user_status_idx\nON payments (user_id, status);\n```\n\nПочему:\n\n```text\norders.user_id нужен для JOIN;\npayments.user_id и payments.status нужны для EXISTS.\n```\n\nЕсли индексов нет, база может сканировать большие таблицы.\n\n---\n\n### Частая ошибка 1: JOIN размножает строки\n\nПример:\n\n```sql\nSELECT\n    u.id,\n    u.username\nFROM users u\nJOIN orders o ON o.user_id = u.id\nWHERE u.id IN (\n    SELECT user_id\n    FROM payments\n    WHERE status = 'success'\n);\n```\n\nЕсли у пользователя 10 заказов, он появится 10 раз.\n\nЭто не ошибка SQL. Это нормальное поведение `JOIN`.\n\nЕсли нужны уникальные пользователи:\n\n```sql\nSELECT DISTINCT\n    u.id,\n    u.username\nFROM users u\nJOIN orders o ON o.user_id = u.id\nWHERE u.id IN (\n    SELECT user_id\n    FROM payments\n    WHERE status = 'success'\n);\n```\n\nНо иногда лучше вообще не делать `JOIN`, если заказы не нужны:\n\n```sql\nSELECT\n    u.id,\n    u.username\nFROM users u\nWHERE EXISTS (\n    SELECT 1\n    FROM orders o\n    WHERE o.user_id = u.id\n)\nAND EXISTS (\n    SELECT 1\n    FROM payments p\n    WHERE p.user_id = u.id\n      AND p.status = 'success'\n);\n```\n\n---\n\n### Частая ошибка 2: подзапрос возвращает много строк, а используется `=`\n\nПлохо:\n\n```sql\nSELECT\n    u.id,\n    u.username,\n    o.id AS order_id\nFROM users u\nJOIN orders o ON o.user_id = u.id\nWHERE u.id = (\n    SELECT user_id\n    FROM payments\n    WHERE status = 'success'\n);\n```\n\nЕсли подзапрос вернёт несколько `user_id`, будет ошибка.\n\nПравильно:\n\n```sql\nWHERE u.id IN (\n    SELECT user_id\n    FROM payments\n    WHERE status = 'success'\n)\n```\n\nИли:\n\n```sql\nWHERE EXISTS (\n    SELECT 1\n    FROM payments p\n    WHERE p.user_id = u.id\n      AND p.status = 'success'\n)\n```\n\n---\n\n### Частая ошибка 3: `NOT IN` и NULL\n\nПлохо:\n\n```sql\nSELECT\n    u.id,\n    u.username\nFROM users u\nJOIN user_profiles p ON p.user_id = u.id\nWHERE u.id NOT IN (\n    SELECT user_id\n    FROM orders\n);\n```\n\nЕсли `orders.user_id` содержит `NULL`, результат может быть неожиданным.\n\nЛучше:\n\n```sql\nSELECT\n    u.id,\n    u.username\nFROM users u\nJOIN user_profiles p ON p.user_id = u.id\nWHERE NOT EXISTS (\n    SELECT 1\n    FROM orders o\n    WHERE o.user_id = u.id\n);\n```\n\n---\n\n### Частая ошибка 4: фильтр по правой таблице ломает LEFT JOIN\n\nПлохо:\n\n```sql\nSELECT\n    u.id,\n    u.username,\n    o.id AS order_id\nFROM users u\nLEFT JOIN orders o ON o.user_id = u.id\nWHERE o.status = 'paid';\n```\n\nХотели оставить всех пользователей, но условие в `WHERE` уберёт строки, где `o.status IS NULL`. В результате `LEFT JOIN` начнёт вести себя ближе к `INNER JOIN`.\n\nПравильнее:\n\n```sql\nSELECT\n    u.id,\n    u.username,\n    o.id AS order_id\nFROM users u\nLEFT JOIN orders o\n    ON o.user_id = u.id\n   AND o.status = 'paid';\n```\n\nА подзапросы можно использовать отдельно, например для фильтрации пользователей:\n\n```sql\nSELECT\n    u.id,\n    u.username,\n    o.id AS paid_order_id\nFROM users u\nLEFT JOIN orders o\n    ON o.user_id = u.id\n   AND o.status = 'paid'\nWHERE EXISTS (\n    SELECT 1\n    FROM user_profiles p\n    WHERE p.user_id = u.id\n);\n```\n\n---\n\n### JOIN + подзапрос или WITH\n\nКогда подзапрос становится большим, часто его переписывают через `WITH`.\n\nНапример так:\n\n```sql\nSELECT\n    u.id,\n    u.username,\n    stats.total_amount\nFROM users u\nJOIN (\n    SELECT\n        user_id,\n        SUM(amount) AS total_amount\n    FROM orders\n    WHERE status = 'paid'\n    GROUP BY user_id\n) stats ON stats.user_id = u.id\nWHERE stats.total_amount > 1000;\n```\n\nМожно переписать:\n\n```sql\nWITH order_stats AS (\n    SELECT\n        user_id,\n        SUM(amount) AS total_amount\n    FROM orders\n    WHERE status = 'paid'\n    GROUP BY user_id\n)\nSELECT\n    u.id,\n    u.username,\n    order_stats.total_amount\nFROM users u\nJOIN order_stats ON order_stats.user_id = u.id\nWHERE order_stats.total_amount > 1000;\n```\n\n`WITH` не обязателен, но часто делает запрос более читаемым. PostgreSQL описывает `WITH` как способ написать вспомогательные выражения для использования в более крупном запросе. \n\n---\n\n### Итог\n\nДа, `JOIN` и подзапрос можно использовать в одном SQL-запросе.\n\nЭто делают, когда нужно одновременно:\n\n```text\nсоединить таблицы через JOIN;\nотфильтровать данные через IN / EXISTS / NOT EXISTS;\nсравнить значения с агрегатом;\nприсоединить результат агрегированного подзапроса;\nвычислить дополнительное значение в SELECT;\nразделить сложную SQL-логику на части.\n```\n\nПростой пример:\n\n```sql\nSELECT\n    u.id,\n    u.username,\n    o.id AS order_id\nFROM users u\nJOIN orders o ON o.user_id = u.id\nWHERE EXISTS (\n    SELECT 1\n    FROM payments p\n    WHERE p.user_id = u.id\n      AND p.status = 'success'\n);\n```\n\nПрактическое правило:\n\n```text\nJOIN используй, когда нужны данные из нескольких таблиц.\nПодзапрос используй, когда нужен промежуточный результат, проверка существования или агрегат.\nОба вместе используй, когда задача требует и соединения таблиц, и дополнительной логики фильтрации/расчёта.\n```\n\nГлавное — не сам факт смешивания `JOIN` и подзапроса, а корректность логики, отсутствие случайного размножения строк и нормальный план выполнения через `EXPLAIN ANALYZE`."
  popularity = 2.63

[[questions]]
  id = 44
  question = "Что такое хранимая процедура в SQL?"
  answer = "**Хранимая процедура** (по сути аналог функции в Java) - это единожды созданный и сохранённый в базе данных набор SQL-инструкций (PL/pgSQL, PL/Python), выполняющий определённую задачу. Служит для повторного использования кода и оптимизации  \n  \n**Ключевые особенности:**  \n- **Входные параметры** - передача данных в процедуру  \n- **Выходные параметры** - возврат результата  \n- **Операторы управления потоком исполнения** - циклы, условные конструкции (`IF`, `WHILE`)  \n  \n**Пример создания и вызова хранимой процедуры:**  \n```sql  \nCREATE PROCEDURE CalculateBonus (IN employee_id INT, OUT bonus_amount DECIMAL(10,2))  \nBEGIN  \nSELECT salary * 0.1 INTO bonus_amount  \nFROM employees  \nWHERE id = employee_id;  \nEND;  \n```  \n  \nВызов:  \n```sql  \nCALL CalculateBonus(101, @bonus);  \nSELECT @bonus;  \n```  \n  \nПреимущества:  \n- снижение трафика между клиентом и сервером  \n- лучшая организация кода"
  popularity = 5.26

[[questions]]
  id = 45
  question = "Чем отличаются хранимые процедуры и хранимые функции?"
  answer = "### Главное отличие\n\n**Хранимая функция** — это объект БД, который обычно **возвращает значение** и может использоваться внутри SQL-выражений.\n\n**Хранимая процедура** — это объект БД, который обычно выполняет **действие/операцию** и вызывается отдельной командой, например `CALL`.\n\nВ PostgreSQL процедура создаётся через `CREATE PROCEDURE`, а функция — через `CREATE FUNCTION`. Документация PostgreSQL прямо разделяет эти объекты: `CREATE FUNCTION` определяет новую функцию, а `CREATE PROCEDURE` определяет новую процедуру. \n\n---\n\n### Функция\n\nФункция предназначена для вычисления и возврата результата.\n\nПример простой функции:\n\n```sql\nCREATE FUNCTION add_numbers(a INTEGER, b INTEGER)\nRETURNS INTEGER\nLANGUAGE sql\nAS $$\n    SELECT a + b;\n$$;\n```\n\nВызов:\n\n```sql\nSELECT add_numbers(2, 3);\n```\n\nРезультат:\n\n```text\n5\n```\n\nФункцию можно использовать как часть обычного SQL-запроса:\n\n```sql\nSELECT\n    id,\n    username,\n    add_numbers(score, bonus) AS total_score\nFROM users;\n```\n\nТо есть функция ведёт себя как выражение:\n\n```text\nLOWER(email)\nCOUNT(*)\nNOW()\ncustom_function(...)\n```\n\nPostgreSQL поддерживает встроенные функции и пользовательские функции; документация указывает, что пользователи могут определять собственные функции. \n\n---\n\n### Процедура\n\nПроцедура предназначена не столько для вычисления значения, сколько для выполнения набора действий.\n\nПример процедуры:\n\n```sql\nCREATE PROCEDURE deactivate_old_users()\nLANGUAGE plpgsql\nAS $$\nBEGIN\n    UPDATE users\n    SET is_active = false\n    WHERE last_login_at < now() - interval '1 year';\nEND;\n$$;\n```\n\nВызов:\n\n```sql\nCALL deactivate_old_users();\n```\n\nЗдесь процедура не используется внутри `SELECT`. Она вызывается отдельной командой `CALL`.\n\nВ PostgreSQL пользовательские процедуры описаны как объект, похожий на функцию, но создаваемый через `CREATE PROCEDURE`, а не `CREATE FUNCTION`; вызываются процедуры через `CALL`. \n\n---\n\n### Ключевая разница в вызове\n\nФункция вызывается как часть выражения:\n\n```sql\nSELECT calculate_discount(1000, 10);\n```\n\nИли внутри запроса:\n\n```sql\nSELECT\n    id,\n    price,\n    calculate_discount(price, 10) AS discounted_price\nFROM products;\n```\n\nПроцедура вызывается отдельной командой:\n\n```sql\nCALL recalculate_user_statistics();\n```\n\nТо есть:\n\n```text\nфункция -> SELECT function_name(...)\nпроцедура -> CALL procedure_name(...)\n```\n\n---\n\n### Возвращаемое значение\n\nФункция обычно должна иметь `RETURNS`.\n\nПример:\n\n```sql\nCREATE FUNCTION get_user_orders_count(p_user_id BIGINT)\nRETURNS INTEGER\nLANGUAGE sql\nAS $$\n    SELECT COUNT(*)\n    FROM orders\n    WHERE user_id = p_user_id;\n$$;\n```\n\nВызов:\n\n```sql\nSELECT get_user_orders_count(10);\n```\n\nФункция возвращает значение:\n\n```text\norders_count\n```\n\nПроцедура в PostgreSQL не вызывается как выражение и не обязана возвращать значение как функция. Она может иметь параметры `IN`, `OUT`, `INOUT`, но её основной смысл — выполнить действия через `CALL`, а не участвовать в выражении `SELECT`. PostgreSQL `CREATE PROCEDURE` поддерживает параметры, включая output-параметры, но вызов всё равно идёт через `CALL`. \n\n---\n\n### Сравнение\n\n|Критерий|Функция|Процедура|\n|---|---|---|\n|Создание|`CREATE FUNCTION`|`CREATE PROCEDURE`|\n|Вызов|`SELECT func(...)`|`CALL proc(...)`|\n|Основной смысл|Вернуть значение|Выполнить действие|\n|Использование в `SELECT`|Да|Нет|\n|Можно использовать в `WHERE`|Да|Нет|\n|Можно использовать в `JOIN`, `FROM`|Да, если возвращает таблицу|Нет как обычную таблицу|\n|Возврат результата|Через `RETURNS`|Через `OUT/INOUT`, но не как выражение|\n|Типичный пример|расчёт скидки, форматирование, агрегация|массовое обновление, обслуживание данных, batch-операция|\n|Управление транзакциями в PostgreSQL|Нельзя делать обычный `COMMIT/ROLLBACK` внутри функции|В процедурах возможно при определённых условиях|\n\n---\n\n### Функция может возвращать таблицу\n\nФункция в PostgreSQL может возвращать не только одно значение, но и набор строк.\n\nПример:\n\n```sql\nCREATE FUNCTION get_user_orders(p_user_id BIGINT)\nRETURNS TABLE (\n    order_id BIGINT,\n    amount NUMERIC,\n    created_at TIMESTAMP\n)\nLANGUAGE sql\nAS $$\n    SELECT\n        id,\n        amount,\n        created_at\n    FROM orders\n    WHERE user_id = p_user_id;\n$$;\n```\n\nВызов:\n\n```sql\nSELECT *\nFROM get_user_orders(10);\n```\n\nРезультат может выглядеть так:\n\n```text\norder_id | amount | created_at\n---------+--------+---------------------\n1        | 500    | 2026-06-01 12:00:00\n2        | 300    | 2026-06-02 14:30:00\n```\n\nТакая функция может использоваться почти как таблица:\n\n```sql\nSELECT *\nFROM get_user_orders(10)\nWHERE amount > 400;\n```\n\nПроцедура для такого сценария обычно не подходит. Если нужно получить табличный результат внутри `SELECT`, используют функцию, представление или обычный запрос.\n\n---\n\n### Функция может использоваться в WHERE\n\nНапример:\n\n```sql\nSELECT *\nFROM products\nWHERE calculate_discount(price, 10) > 100;\n```\n\nИли:\n\n```sql\nSELECT *\nFROM users\nWHERE normalize_email(email) = 'test@example.com';\n```\n\nФункция здесь участвует в фильтрации строк.\n\nПроцедуру так использовать нельзя:\n\n```sql\nSELECT *\nFROM users\nWHERE some_procedure(id);\n```\n\nЭто некорректная идея: процедура не является выражением, возвращающим значение для `WHERE`.\n\n---\n\n### Процедура лучше подходит для операций\n\nПроцедура хорошо подходит, когда нужно выполнить последовательность действий.\n\nНапример:\n\n```sql\nCREATE PROCEDURE close_old_orders()\nLANGUAGE plpgsql\nAS $$\nBEGIN\n    UPDATE orders\n    SET status = 'closed'\n    WHERE status = 'paid'\n      AND created_at < now() - interval '30 days';\n\n    INSERT INTO audit_log (event_type, created_at)\n    VALUES ('old_orders_closed', now());\nEND;\n$$;\n```\n\nВызов:\n\n```sql\nCALL close_old_orders();\n```\n\nЗдесь смысл не в том, чтобы вернуть значение, а в том, чтобы:\n\n```text\nобновить заказы;\nзаписать событие в audit_log;\nвыполнить бизнес-операцию внутри БД.\n```\n\n---\n\n### Главное отличие в транзакциях PostgreSQL\n\nВ PostgreSQL процедуры отличаются от функций тем, что процедуры могут использовать управление транзакциями — например `COMMIT` и `ROLLBACK` — но только при соблюдении условий вызова.\n\nДокументация PostgreSQL показывает пример процедуры, внутри которой выполняются `COMMIT` и `ROLLBACK`, а затем процедура вызывается через `CALL`. \n\nПример из практической логики:\n\n```sql\nCREATE PROCEDURE process_batches()\nLANGUAGE plpgsql\nAS $$\nDECLARE\n    batch_id BIGINT;\nBEGIN\n    FOR batch_id IN\n        SELECT id\n        FROM batches\n        WHERE status = 'new'\n    LOOP\n        UPDATE batches\n        SET status = 'processing'\n        WHERE id = batch_id;\n\n        COMMIT;\n    END LOOP;\nEND;\n$$;\n```\n\nСмысл:\n\n```text\nобработать часть данных;\nзафиксировать изменения;\nперейти к следующей части.\n```\n\nФункция для такого сценария не подходит. Внутри функции нельзя просто управлять транзакциями как внутри процедуры.\n\nНо важный нюанс: даже в процедуре транзакционный контроль зависит от контекста вызова. Например, если процедура вызывается внутри уже открытой транзакции приложения, поведение и допустимость `COMMIT/ROLLBACK` нужно проверять по конкретной СУБД и режиму выполнения.\n\n---\n\n### Функции тоже могут менять данные\n\nИногда думают, что функция «только читает», а процедура «только меняет данные». Это не совсем так.\n\nВ PostgreSQL функция может выполнять `INSERT`, `UPDATE`, `DELETE`, если написана на подходящем языке, например `plpgsql`.\n\nПример:\n\n```sql\nCREATE FUNCTION mark_notification_read(p_notification_id BIGINT)\nRETURNS VOID\nLANGUAGE plpgsql\nAS $$\nBEGIN\n    UPDATE notifications\n    SET is_read = true\n    WHERE id = p_notification_id;\nEND;\n$$;\n```\n\nВызов:\n\n```sql\nSELECT mark_notification_read(100);\n```\n\nФункция изменила данные, хотя это функция.\n\nНо с точки зрения дизайна это часто спорно. Если объект БД выполняет действие и меняет состояние, процедура может быть более понятной по смыслу:\n\n```sql\nCALL mark_notification_read(100);\n```\n\nТо есть отличие не только техническое, но и семантическое:\n\n```text\nфункция лучше подходит для вычислений;\nпроцедура лучше подходит для команд/операций.\n```\n\n---\n\n### Функции бывают IMMUTABLE, STABLE, VOLATILE\n\nВ PostgreSQL для функций можно указывать характеристику изменчивости:\n\n```sql\nIMMUTABLE\nSTABLE\nVOLATILE\n```\n\nПример:\n\n```sql\nCREATE FUNCTION add_numbers(a INTEGER, b INTEGER)\nRETURNS INTEGER\nLANGUAGE sql\nIMMUTABLE\nAS $$\n    SELECT a + b;\n$$;\n```\n\nСмысл:\n\n```text\nпри одинаковых входных данных функция всегда возвращает одинаковый результат\n```\n\nЭто важно для оптимизатора запросов и индексов.\n\nПример функции для нормализации email:\n\n```sql\nCREATE FUNCTION normalize_email(email TEXT)\nRETURNS TEXT\nLANGUAGE sql\nIMMUTABLE\nAS $$\n    SELECT lower(trim(email));\n$$;\n```\n\nТакую функцию можно использовать в expression index:\n\n```sql\nCREATE INDEX users_normalized_email_idx\nON users (normalize_email(email));\n```\n\nПроцедуры обычно не используются таким образом, потому что они не являются выражениями внутри SQL-запроса.\n\n---\n\n### Функция может использоваться в индексах, процедура — нет\n\nНапример:\n\n```sql\nCREATE INDEX users_lower_email_idx\nON users (lower(email));\n```\n\n`lower(email)` — функция.\n\nПользовательскую функцию тоже можно использовать в индексе, если она подходит по свойствам.\n\nНапример:\n\n```sql\nCREATE INDEX users_normalized_email_idx\nON users (normalize_email(email));\n```\n\nЭто полезно, когда часто ищут по преобразованному значению:\n\n```sql\nSELECT *\nFROM users\nWHERE normalize_email(email) = normalize_email(' TEST@EXAMPLE.COM ');\n```\n\nПроцедуру в индексе использовать нельзя, потому что индекс строится по выражению, а процедура не является выражением.\n\n---\n\n### Функции могут использоваться в constraints\n\nФункцию можно использовать в `CHECK`, если она корректно подходит для такой логики.\n\nНапример:\n\n```sql\nCREATE FUNCTION is_valid_discount(value NUMERIC)\nRETURNS BOOLEAN\nLANGUAGE sql\nIMMUTABLE\nAS $$\n    SELECT value >= 0 AND value <= 100;\n$$;\n```\n\nИ затем:\n\n```sql\nCREATE TABLE coupons (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    discount NUMERIC NOT NULL CHECK (is_valid_discount(discount))\n);\n```\n\nПроцедура в `CHECK` не подходит.\n\nОпять же причина та же:\n\n```text\nconstraint ожидает выражение;\nфункция может быть выражением;\nпроцедура — отдельный вызов через CALL.\n```\n\n---\n\n### Функция может быть частью SELECT-пайплайна\n\nПример:\n\n```sql\nSELECT\n    id,\n    email,\n    normalize_email(email) AS normalized_email\nFROM users\nWHERE normalize_email(email) LIKE '%@gmail.com';\n```\n\nЗдесь функция работает как обычный вычисляемый элемент запроса.\n\nПроцедура так не используется:\n\n```text\nпроцедура не встраивается в SELECT;\nпроцедура вызывается отдельно;\nпроцедура выполняет команду.\n```\n\n---\n\n### Процедура может быть удобнее для batch-операций\n\nНапример, нужно обработать старые события пачками:\n\n```sql\nCREATE PROCEDURE archive_old_events()\nLANGUAGE plpgsql\nAS $$\nBEGIN\n    INSERT INTO archived_events (id, payload, created_at)\n    SELECT id, payload, created_at\n    FROM events\n    WHERE created_at < now() - interval '90 days';\n\n    DELETE FROM events\n    WHERE created_at < now() - interval '90 days';\nEND;\n$$;\n```\n\nВызов:\n\n```sql\nCALL archive_old_events();\n```\n\nЭто больше похоже на команду обслуживания БД:\n\n```text\nперенести старые события;\nудалить их из основной таблицы;\nзаписать лог;\nвозможно обработать транзакции пачками.\n```\n\nДля такой задачи процедура читается естественнее, чем функция.\n\n---\n\n### Функция может быть проще для бизнес-расчётов\n\nНапример, расчёт скидки:\n\n```sql\nCREATE FUNCTION calculate_discount_price(\n    price NUMERIC,\n    discount_percent NUMERIC\n)\nRETURNS NUMERIC\nLANGUAGE sql\nIMMUTABLE\nAS $$\n    SELECT price - price * discount_percent / 100;\n$$;\n```\n\nИспользование:\n\n```sql\nSELECT\n    id,\n    price,\n    calculate_discount_price(price, 15) AS final_price\nFROM products;\n```\n\nЭто именно функция: она получает входные значения и возвращает вычисленный результат.\n\n---\n\n### Stored procedure в разных СУБД может означать разное\n\nВ PostgreSQL долгое время до версии 11 не было отдельного `CREATE PROCEDURE`; многие называли «хранимыми процедурами» обычные функции на `plpgsql`. Начиная с PostgreSQL 11 появились полноценные процедуры, вызываемые через `CALL`, с отличиями от функций, включая возможность транзакционного контроля. PostgreSQL JDBC-документация также отмечает: PostgreSQL поддерживает функции, возвращающие результат, и начиная с версии 11 процедуры, которые могут выполнять transaction control. \n\nВ других СУБД различия могут отличаться:\n\n```text\nPostgreSQL -> FUNCTION и PROCEDURE разделены, PROCEDURE вызывается через CALL.\nSQL Server -> stored procedure вызывается EXEC, function используется в выражениях.\nOracle -> есть procedures и functions в PL/SQL.\nMySQL -> есть stored procedures и stored functions.\n```\n\nНо общее правило почти везде одно:\n\n```text\nfunction -> вернуть значение;\nprocedure -> выполнить действие.\n```\n\n---\n\n### Пример рядом: функция и процедура для одной темы\n\nДопустим, есть таблица:\n\n```sql\nCREATE TABLE orders (\n    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    user_id BIGINT NOT NULL,\n    amount NUMERIC NOT NULL,\n    status TEXT NOT NULL,\n    created_at TIMESTAMP NOT NULL DEFAULT now()\n);\n```\n\nФункция: посчитать сумму заказов пользователя.\n\n```sql\nCREATE FUNCTION get_user_total_paid_amount(p_user_id BIGINT)\nRETURNS NUMERIC\nLANGUAGE sql\nAS $$\n    SELECT COALESCE(SUM(amount), 0)\n    FROM orders\n    WHERE user_id = p_user_id\n      AND status = 'paid';\n$$;\n```\n\nВызов:\n\n```sql\nSELECT get_user_total_paid_amount(10);\n```\n\nИспользование в запросе:\n\n```sql\nSELECT\n    id,\n    username,\n    get_user_total_paid_amount(id) AS total_paid\nFROM users;\n```\n\nПроцедура: закрыть старые оплаченные заказы.\n\n```sql\nCREATE PROCEDURE close_old_paid_orders()\nLANGUAGE plpgsql\nAS $$\nBEGIN\n    UPDATE orders\n    SET status = 'closed'\n    WHERE status = 'paid'\n      AND created_at < now() - interval '30 days';\nEND;\n$$;\n```\n\nВызов:\n\n```sql\nCALL close_old_paid_orders();\n```\n\nРазница по смыслу:\n\n```text\nget_user_total_paid_amount -> вычисляет и возвращает сумму;\nclose_old_paid_orders      -> выполняет изменение состояния данных.\n```\n\n---\n\n### Что лучше использовать в backend-проекте\n\nДля обычного backend-разработчика правило такое.\n\nФункция подходит, когда нужно:\n\n```text\nпосчитать значение;\nнормализовать строку;\nпроверить простое условие;\nвернуть табличный результат;\nиспользовать логику внутри SELECT/WHERE/JOIN;\nсоздать expression index;\nиспользовать вычисление в CHECK;\nскрыть повторяющееся SQL-выражение.\n```\n\nПроцедура подходит, когда нужно:\n\n```text\nвыполнить бизнес-операцию в БД;\nсделать batch-обработку;\nобновить много таблиц;\nвыполнить обслуживание данных;\nархивировать/переносить данные;\nиспользовать транзакционный контроль внутри БД;\nсделать команду, вызываемую через CALL.\n```\n\n---\n\n### Почему в приложениях процедуры используют осторожно\n\nХранимые процедуры могут быть полезны, но их не всегда любят переносить в БД.\n\nПлюсы:\n\n```text\nменьше сетевых round-trip между приложением и БД;\nлогика выполняется ближе к данным;\nможно атомарно выполнить сложную операцию;\nможно переиспользовать SQL-логику несколькими приложениями;\nможно скрыть детали таблиц за процедурным API.\n```\n\nМинусы:\n\n```text\nбизнес-логика размазывается между backend и БД;\nсложнее тестировать обычными unit-тестами;\nсложнее версионировать без дисциплины миграций;\nсложнее отлаживать;\nможно получить сильную зависимость от конкретной СУБД;\nчасть команды может хуже читать PL/pgSQL, чем Python/Java/Go-код.\n```\n\nПоэтому в backend-проектах часто делают так:\n\n```text\nпростые вычисления и ограничения -> в БД через функции/constraints;\nосновная бизнес-логика -> в приложении;\nтяжёлые data-processing операции -> иногда в процедурах;\nотчётные/аналитические вычисления -> функции, views, materialized views, CTE.\n```\n\n---\n\n### Важный нюанс: функция не обязана быть чистой\n\nВ математическом смысле функция обычно означает:\n\n```text\nодни входные данные -> один результат;\nбез побочных эффектов.\n```\n\nНо в SQL/PLpgSQL функция технически может иметь побочные эффекты: писать в таблицы, вызывать другие функции, логировать действия.\n\nПоэтому лучше различать:\n\n```text\nтехнически можно;\nархитектурно желательно.\n```\n\nТехнически функция может менять данные.  \nАрхитектурно функцию чаще ожидают как вычисление, а процедуру — как команду.\n\n---\n\n### Короткое сравнение на уровне смысла\n\nФункция отвечает на вопрос:\n\n```text\nЧто вернуть?\n```\n\nПроцедура отвечает на вопрос:\n\n```text\nЧто выполнить?\n```\n\nФункция:\n\n```sql\nSELECT calculate_bonus(user_id);\n```\n\nПроцедура:\n\n```sql\nCALL recalculate_all_bonuses();\n```\n\nФункция больше похожа на выражение.  \nПроцедура больше похожа на команду.\n\n---\n\n### Итог\n\nХранимая функция и хранимая процедура — оба объекта хранятся в БД и позволяют выполнять код на стороне базы, но используются для разных задач.\n\n**Функция**:\n\n```text\nсоздаётся через CREATE FUNCTION;\nобычно возвращает значение через RETURNS;\nвызывается через SELECT или внутри SQL-выражений;\nможет использоваться в SELECT, WHERE, JOIN, FROM;\nподходит для вычислений, преобразований, табличных результатов;\nможет участвовать в индексах и constraints.\n```\n\n**Процедура**:\n\n```text\nсоздаётся через CREATE PROCEDURE;\nвызывается через CALL;\nобычно выполняет действия, а не используется как выражение;\nподходит для batch-операций, обслуживания данных, сложных команд;\nв PostgreSQL может использовать управление транзакциями при определённых условиях.\n```\n\nПрактический ориентир:\n\n```text\nнужно получить значение или использовать логику внутри SELECT -> функция;\nнужно выполнить операцию, изменить состояние, обработать пачку данных -> процедура.\n```"
