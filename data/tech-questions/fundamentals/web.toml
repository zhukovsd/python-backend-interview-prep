[[questions]]
  id = 30
  question = "Жизненный цикл HTTP-запроса от браузера до сервера"
  answer = "### Общая схема\n\nКогда пользователь вводит URL, переходит по ссылке или frontend вызывает API, путь выглядит примерно так:\n\n```text\nДействие пользователя\n        ↓\nБраузер определяет URL и тип операции\n        ↓\nПроверяет кеш и Service Worker\n        ↓\nDNS: домен → IP-адрес\n        ↓\nУстанавливает TCP + TLS\nили QUIC + TLS\n        ↓\nФормирует HTTP-запрос\n        ↓\nCDN / WAF / Load Balancer / Reverse Proxy\n        ↓\nBackend-приложение\n        ↓\nБаза данных / Redis / внешние API\n        ↓\nHTTP-ответ\n        ↓\nБраузер обрабатывает ответ\n        ↓\nРендерит страницу или обновляет интерфейс\n```\n\nПри этом не каждый шаг выполняется для каждого запроса: DNS-запись, соединение или сам ответ могут уже находиться в кеше, а существующее соединение может быть переиспользовано.\n\n### 1. Пользователь инициирует действие\n\nВозможны разные ситуации.\n\n#### Ввод адреса\n\nПользователь вводит:\n\n```text\nhttps://example.com/products?page=2\n```\n\nи нажимает Enter. Браузер начинает навигацию к новому документу.\n\n#### Переход по ссылке\n\n```text\n<a href=\"/products\">Товары</a>\n```\n\nПри клике браузер обычно запускает навигацию:\n\n```text\nGET /products\n```\n\n#### Отправка формы\n\n```text\n<form method=\"post\" action=\"/login\">\n```\n\nБраузер может отправить:\n\n```text\nPOST /login\nContent-Type: application/x-www-form-urlencoded\n\nusername=alfob&password=secret\n```\n\n#### JavaScript-запрос\n\n```javascript\nconst response = await fetch(\"/api/products\");\nconst products = await response.json();\n```\n\nЗдесь новая страница не загружается. Frontend получает данные и самостоятельно обновляет интерфейс.\n\n#### SPA-навигация\n\nВ React, Vue или другом SPA клик может вообще не создавать HTTP-запрос:\n\n```text\nклик\n  ↓\nJavaScript перехватывает событие\n  ↓\nменяет URL через History API\n  ↓\nпоказывает уже загруженный компонент\n```\n\nЗапрос появится только в том случае, если компоненту понадобятся дополнительные данные.\n\nСледовательно:\n\n```text\nклик в браузере\n≠ обязательно HTTP-запрос\n```\n\nНавигация и получение документов описываются HTML Standard и Fetch Standard. \n\n### 2. Браузер разбирает URL\n\nДля адреса:\n\n```text\nhttps://api.example.com:443/users/42?full=true#profile\n```\n\nбраузер выделяет:\n\n```text\nscheme   → https\nhost     → api.example.com\nport     → 443\npath     → /users/42\nquery    → full=true\nfragment → profile\n```\n\nFragment:\n\n```text\n#profile\n```\n\nне отправляется HTTP-серверу. Он обрабатывается браузером на стороне клиента.\n\nЗапрос будет содержать примерно:\n\n```text\n/users/42?full=true\n```\n\nURL проходит стандартизированный разбор и нормализацию, включая обработку не-ASCII-символов и percent-encoding. \n\n### 3. Браузер проверяет локальные источники\n\nДо обращения к сети браузер может проверить:\n\n```text\nmemory cache\ndisk cache\nHTTP cache\nService Worker\nуже открытое соединение\n```\n\nНапример, файл:\n\n```text\n/static/app.js\n```\n\nможет уже находиться в кеше, и сетевой запрос не потребуется.\n\nService Worker также может перехватить запрос:\n\n```javascript\nself.addEventListener(\"fetch\", (event) => {\n    event.respondWith(\n        caches.match(event.request),\n    );\n});\n```\n\nОн может:\n\n- вернуть сохранённый ответ;\n    \n- обратиться к сети;\n    \n- сформировать собственный ответ;\n    \n- использовать стратегию cache-first или network-first.\n    \n\nService Worker встраивается в алгоритм обработки fetch-запросов и способен отвечать из собственного кеша без обращения к origin-серверу. \n\n### 4. DNS преобразует домен в IP-адрес\n\nСетевое соединение устанавливается с IP-адресом, а не непосредственно со строкой:\n\n```text\nexample.com\n```\n\nПоэтому браузеру нужно получить:\n\n```text\nexample.com → 203.0.113.10\n```\n\nили IPv6:\n\n```text\nexample.com → 2001:db8::10\n```\n\nБраузер и операционная система могут проверить:\n\n```text\nкеш браузера\nкеш операционной системы\nhosts-файл\nлокальный или системный DNS resolver\n```\n\nЕсли записи нет, запрос обычно передаётся рекурсивному DNS-резолверу:\n\n```text\nКомпьютер\n    ↓\nRecursive DNS resolver\n    ↓\nRoot DNS\n    ↓\nDNS зоны верхнего уровня\n    ↓\nAuthoritative DNS example.com\n```\n\nРезультатом может стать:\n\n```text\nA     → IPv4\nAAAA  → IPv6\nCNAME → другое доменное имя\n```\n\nРекурсивный резолвер обычно кеширует полученный результат, поэтому полная цепочка DNS выполняется не при каждом открытии сайта. DNS определён как распределённая иерархическая система имён, а современные термины отдельно определяют stub resolver и recursive resolver. \n\n### 5. Устанавливается сетевое соединение\n\nДальнейшие действия зависят от версии HTTP.\n\n### HTTP/1.1 и HTTP/2\n\nОбычно используются:\n\n```text\nHTTP\n  ↓\nTLS — для HTTPS\n  ↓\nTCP\n  ↓\nIP\n```\n\nСначала устанавливается TCP-соединение:\n\n```text\nКлиент                         Сервер\n   │──── SYN ───────────────────>│\n   │<─── SYN + ACK ──────────────│\n   │──── ACK ───────────────────>│\n```\n\nЭто TCP three-way handshake. \n\nЕсли соединение уже открыто, браузер может его переиспользовать, и новое рукопожатие не потребуется.\n\n### HTTP/3\n\nHTTP/3 использует:\n\n```text\nHTTP/3\n  ↓\nQUIC + TLS\n  ↓\nUDP\n  ↓\nIP\n```\n\nQUIC предоставляет защищённое соединение, управляемые потоки, контроль перегрузки и повторную передачу потерянных данных поверх UDP. HTTP/3 переносит HTTP-семантику через QUIC. \n\n### 6. Для HTTPS выполняется TLS-рукопожатие\n\nПри HTTPS браузер и сервер должны:\n\n1. согласовать версию TLS;\n    \n2. выбрать криптографические алгоритмы;\n    \n3. получить сертификат сервера;\n    \n4. проверить сертификат;\n    \n5. создать общие ключи шифрования;\n    \n6. выбрать прикладной протокол через ALPN.\n    \n\nУсловно:\n\n```text\nБраузер                           Сервер\n   │──── ClientHello ───────────────>│\n   │<─── ServerHello + Certificate ──│\n   │──── Finished ──────────────────>│\n   │<─── Finished ───────────────────│\n   │                                  │\n   │══ зашифрованный HTTP-трафик ═════│\n```\n\nБраузер проверяет, что:\n\n```text\nсертификат выдан доверенным центром\nдомен присутствует в сертификате\nсертификат не истёк\nкриптографическая проверка успешна\n```\n\nЧерез ALPN стороны могут согласовать:\n\n```text\nh2       → HTTP/2\nhttp/1.1 → HTTP/1.1\nh3       → HTTP/3 в QUIC\n```\n\nTLS 1.3 позволяет сторонам согласовать параметры, аутентифицировать сервер и получить общий секретный ключ. \n\n### 7. Браузер формирует HTTP-запрос\n\nНапример:\n\n```text\nGET /products?page=2 HTTP/1.1\nHost: example.com\nAccept: text/html\nAccept-Encoding: gzip, br\nCookie: session_id=abc123\nUser-Agent: ...\n```\n\nHTTP-запрос логически содержит:\n\n```text\nметод\ntarget URI\nзаголовки\nнеобязательное тело\n```\n\nДля API:\n\n```text\nPOST /api/orders HTTP/1.1\nHost: example.com\nContent-Type: application/json\nAuthorization: Bearer <access-token>\nContent-Length: 35\n\n{\n  \"product_id\": 42,\n  \"quantity\": 2\n}\n```\n\nЧасть заголовков добавляет frontend, часть — сам браузер:\n\n```text\nCookie\nHost / :authority\nAccept\nAccept-Encoding\nOrigin\nReferer\nSec-Fetch-*\n```\n\nТочная форма передачи зависит от версии HTTP.\n\n#### HTTP/1.1\n\nТекстовый формат:\n\n```text\nGET /products HTTP/1.1\nHost: example.com\n```\n\n#### HTTP/2\n\nЗапрос кодируется бинарными frames и передаётся в отдельном stream:\n\n```text\nHEADERS frame\nDATA frame — при наличии тела\n```\n\nОдно TCP-соединение может одновременно обслуживать несколько HTTP/2-потоков. \n\n#### HTTP/3\n\nЗапрос передаётся в отдельном QUIC stream:\n\n```text\nHEADERS\nDATA\n```\n\nРазные HTTP-запросы могут обрабатываться через независимые QUIC-потоки одного соединения. \n\n### 8. Данные разбиваются на сетевые пакеты\n\nHTTP-сообщение не обязательно отправляется одним пакетом.\n\nНапример:\n\n```text\nHTTP request\n    ↓\nTLS records\n    ↓\nTCP segments или QUIC packets\n    ↓\nIP packets\n    ↓\nEthernet / Wi-Fi frames\n```\n\nБольшое тело:\n\n```json\n{\n  \"payments\": [...]\n}\n```\n\nможет быть разделено на множество TCP-сегментов или QUIC-пакетов.\n\nМаршрутизаторы не понимают бизнес-смысл JSON. В основном они работают с сетевыми адресами и пересылают пакеты к следующему узлу.\n\n### 9. Запрос проходит через промежуточные компоненты\n\nВ реальной инфраструктуре браузер редко соединяется непосредственно с Python-приложением:\n\n```text\nБраузер\n   ↓\nдомашний роутер / NAT\n   ↓\nпровайдер\n   ↓\nCDN\n   ↓\nWAF\n   ↓\nLoad Balancer\n   ↓\nNginx / reverse proxy\n   ↓\nUvicorn / Gunicorn\n   ↓\nFastAPI\n```\n\nНазначение компонентов:\n\n```text\nCDN\n→ кеширует статические и иногда динамические ответы\n\nWAF\n→ фильтрует подозрительные запросы\n\nLoad Balancer\n→ выбирает backend-инстанс\n\nReverse Proxy\n→ принимает соединения, завершает TLS,\n  ограничивает размер запроса, проксирует в приложение\n\nApplication Server\n→ преобразует сетевой запрос в ASGI/WSGI-вызов\n```\n\nЗапрос может завершиться на промежуточном уровне:\n\n```text\nCDN нашёл ответ в кеше\n→ backend не вызывается\n\nWAF заблокировал запрос\n→ backend не вызывается\n\nNginx обнаружил слишком большое тело\n→ возвращает 413\n→ backend не вызывается\n```\n\nHTTP предусматривает цепочки посредников, включая proxy, gateway и cache, между клиентом и origin-сервером. \n\n### 10. Операционная система сервера принимает данные\n\nНа сервере сетевой стек операционной системы:\n\n1. принимает пакеты;\n    \n2. проверяет их;\n    \n3. собирает TCP-поток или QUIC-потоки;\n    \n4. передаёт данные процессу, который слушает порт.\n    \n\nНапример:\n\n```text\n0.0.0.0:443 → Nginx\n127.0.0.1:8000 → Uvicorn\n```\n\nNginx может проксировать запрос:\n\n```text\npublic HTTPS request\n        ↓\nNginx\n        ↓\nHTTP к Uvicorn внутри приватной сети\n```\n\n### 11. Application server создаёт вызов приложения\n\nВ FastAPI обычно используется ASGI-сервер:\n\n```text\nUvicorn\nHypercorn\nDaphne\n```\n\nUvicorn разбирает HTTP-протокол и передаёт приложению ASGI-сообщения.\n\nУпрощённо:\n\n```python\nscope = {\n    \"type\": \"http\",\n    \"method\": \"POST\",\n    \"path\": \"/api/orders\",\n    \"headers\": [...],\n}\n```\n\nЗатем приложение получает события тела:\n\n```python\n{\n    \"type\": \"http.request\",\n    \"body\": b'{\"product_id\":42}',\n    \"more_body\": False,\n}\n```\n\n### 12. Middleware обрабатывает запрос\n\nДо endpoint запрос может пройти через цепочку middleware:\n\n```text\nRequest ID middleware\n        ↓\nCORS middleware\n        ↓\nLogging middleware\n        ↓\nAuthentication middleware\n        ↓\nRate limiting\n        ↓\nException handling\n        ↓\nRouter\n```\n\nMiddleware может:\n\n- изменить запрос;\n    \n- отклонить запрос;\n    \n- добавить пользователя;\n    \n- записать лог;\n    \n- измерить время;\n    \n- добавить заголовки ответа;\n    \n- перехватить исключение.\n    \n\n### 13. Router выбирает endpoint\n\nFastAPI сопоставляет:\n\n```text\nHTTP method + path\n```\n\nс обработчиком.\n\nНапример:\n\n```python\n@app.post(\"/api/orders\")\nasync def create_order(data: OrderCreate):\n    ...\n```\n\nПодойдёт запрос:\n\n```text\nPOST /api/orders\n```\n\nНо не:\n\n```text\nGET /api/orders\n```\n\nЕсли path не найден:\n\n```text\n404 Not Found\n```\n\nЕсли path существует, но метод не поддерживается:\n\n```text\n405 Method Not Allowed\n```\n\n### 14. Выполняются аутентификация и авторизация\n\nBackend извлекает credentials:\n\n```text\nAuthorization: Bearer <token>\n```\n\nили:\n\n```text\nCookie: session_id=abc123\n```\n\nЗатем:\n\n```text\nпроверяет токен или сессию\n        ↓\nопределяет пользователя\n        ↓\nпроверяет permission\n        ↓\nпроверяет доступ к конкретному объекту\n```\n\nНапример:\n\n```python\norder = await order_repository.get(\n    id=order_id,\n    user_id=current_user.id,\n)\n```\n\nFrontend не считается доверенным источником роли или `user_id`.\n\n### 15. Проверяются входные данные\n\nДля запроса:\n\n```json\n{\n  \"product_id\": 42,\n  \"quantity\": 2\n}\n```\n\nbackend проверяет:\n\n```text\nвалидный ли JSON\nесть ли обязательные поля\nсоответствуют ли типы\nдопустимы ли диапазоны\nнет ли неизвестных полей\nвыполняются ли бизнес-правила\n```\n\nВ FastAPI это часто делает Pydantic:\n\n```python\nclass OrderCreate(BaseModel):\n    product_id: int = Field(gt=0)\n    quantity: int = Field(ge=1, le=100)\n```\n\nНекорректные данные приводят к клиентской ошибке, обычно `4xx`.\n\n### 16. Выполняется бизнес-логика\n\nEndpoint или service layer выполняет операцию:\n\n```text\nнайти товар\nпроверить наличие\nрассчитать стоимость\nсоздать заказ\nуменьшить остаток\nзаписать событие\n```\n\nНапример:\n\n```python\nasync def create_order(\n    data: OrderCreate,\n    user: User,\n) -> Order:\n    product = await product_repository.get(data.product_id)\n\n    if product is None:\n        raise ProductNotFoundError()\n\n    if product.stock < data.quantity:\n        raise InsufficientStockError()\n\n    return await order_repository.create(\n        user_id=user.id,\n        product_id=product.id,\n        quantity=data.quantity,\n    )\n```\n\n### 17. Backend обращается к зависимостям\n\nПриложение может обращаться к:\n\n```text\nPostgreSQL\nRedis\nS3 / MinIO\nRabbitMQ\nдругому микросервису\nстороннему API\n```\n\nПример:\n\n```text\nFastAPI\n   ├── PostgreSQL → получить пользователя\n   ├── Redis      → проверить кеш\n   ├── Payment API → провести оплату\n   └── RabbitMQ   → опубликовать событие\n```\n\nКаждый такой вызов имеет собственный жизненный цикл:\n\n```text\nDNS\nсоединение\nзапрос\nответ\nтаймаут\nповтор\n```\n\nПоэтому один пользовательский HTTP-запрос может породить несколько внутренних сетевых запросов.\n\n### 18. База данных выполняет запрос\n\nНапример:\n\n```sql\nSELECT id, name, price\nFROM products\nWHERE id = 42;\n```\n\nPostgreSQL:\n\n```text\nразбирает SQL\n        ↓\nпроверяет права\n        ↓\nстроит или выбирает план\n        ↓\nчитает данные\n        ↓\nвозвращает строки\n```\n\nДля изменения данных backend может открыть транзакцию:\n\n```text\nBEGIN\n    ↓\nINSERT order\n    ↓\nUPDATE stock\n    ↓\nCOMMIT\n```\n\nПри ошибке:\n\n```text\nROLLBACK\n```\n\n### 19. Backend формирует HTTP-ответ\n\nПриложение возвращает данные:\n\n```python\nreturn {\n    \"id\": 1001,\n    \"status\": \"created\",\n}\n```\n\nFastAPI сериализует объект в JSON:\n\n```json\n{\n  \"id\": 1001,\n  \"status\": \"created\"\n}\n```\n\nФормируется HTTP-ответ:\n\n```text\nHTTP/1.1 201 Created\nContent-Type: application/json\nContent-Length: 39\nLocation: /api/orders/1001\n\n{\n  \"id\": 1001,\n  \"status\": \"created\"\n}\n```\n\nОтвет содержит:\n\n```text\nstatus code\nheaders\nнеобязательное body\n```\n\nHTTP является протоколом request/response: клиент передаёт request, сервер интерпретирует его и возвращает один или несколько response messages. \n\n### 20. Middleware и reverse proxy обрабатывают ответ\n\nНа обратном пути middleware может:\n\n```text\nдобавить X-Request-ID\nдобавить CORS-заголовки\nзаписать длительность\nпреобразовать исключение\nустановить cookie\n```\n\nReverse proxy может:\n\n```text\nсжать тело\nдобавить security headers\nзакешировать ответ\nизменить служебные заголовки\nзашифровать через TLS\n```\n\nНапример:\n\n```text\nContent-Encoding: br\nCache-Control: public, max-age=3600\nSet-Cookie: session_id=abc123; HttpOnly; Secure\n```\n\n### 21. Ответ возвращается браузеру\n\nОбратный путь:\n\n```text\nBackend\n   ↓\nUvicorn\n   ↓\nNginx\n   ↓\nLoad Balancer / CDN\n   ↓\nИнтернет\n   ↓\nБраузер\n```\n\nНа транспортном уровне:\n\n```text\nHTTP response\n    ↓\nTLS encryption\n    ↓\nTCP segments / QUIC packets\n    ↓\nIP packets\n```\n\nБраузер принимает пакеты, восстанавливает поток, расшифровывает TLS и получает HTTP-ответ.\n\n### 22. Браузер анализирует статус\n\nНапример:\n\n```text\n200 → обработать содержимое\n201 → ресурс создан\n204 → ответа без тела\n301/302/307/308 → перейти на другой URL\n304 → использовать кеш\n401 → требуется аутентификация\n403 → доступ запрещён\n404 → ресурс не найден\n500 → ошибка backend\n```\n\nПри redirect:\n\n```text\nHTTP/1.1 302 Found\nLocation: /login\n```\n\nбраузер формирует новый запрос:\n\n```text\nGET /login\n```\n\nТо есть redirect запускает ещё один цикл HTTP-запроса.\n\n### 23. Обработка HTML-документа\n\nЕсли ответ содержит:\n\n```text\nContent-Type: text/html\n```\n\nбраузер начинает разбирать HTML и строить DOM:\n\n```html\n<html>\n    <head>\n        <link rel=\"stylesheet\" href=\"/app.css\">\n        <script src=\"/app.js\"></script>\n    </head>\n    <body>\n        <img src=\"/logo.png\">\n    </body>\n</html>\n```\n\nВо время разбора он обнаруживает дополнительные ресурсы:\n\n```text\n/app.css\n/app.js\n/logo.png\n/fonts/main.woff2\n/api/profile\n```\n\nИ для каждого может запустить отдельный HTTP-запрос:\n\n```text\nПервоначальный GET /\n        ↓\nHTML\n        ├── GET /app.css\n        ├── GET /app.js\n        ├── GET /logo.png\n        └── GET /fonts/main.woff2\n```\n\nПоэтому «загрузка одной страницы» обычно означает десятки или сотни HTTP-запросов.\n\nHTML Standard определяет построение и обработку DOM и алгоритм разбора HTML-документов. \n\n### 24. Браузер строит страницу\n\nУпрощённая схема рендеринга:\n\n```text\nHTML\n  ↓\nDOM\n\nCSS\n  ↓\nCSSOM\n\nDOM + CSSOM\n  ↓\nRender tree\n  ↓\nLayout\n  ↓\nPaint\n  ↓\nCompositing\n  ↓\nИзображение на экране\n```\n\nЭтапы:\n\n```text\nDOM\n→ структура элементов\n\nCSSOM\n→ применимые CSS-правила\n\nLayout\n→ размеры и положение элементов\n\nPaint\n→ рисование текста, фонов, границ\n\nCompositing\n→ объединение слоёв\n```\n\nНекоторые стили и скрипты способны блокировать первоначальный рендеринг, пока браузер не получит и не обработает нужный ресурс. HTML Standard содержит правила для render-blocking элементов и возможностей рендеринга документа. \n\n### 25. JavaScript может отправить новые запросы\n\nПосле загрузки:\n\n```javascript\nconst response = await fetch(\"/api/profile\");\nconst profile = await response.json();\n\nrenderProfile(profile);\n```\n\nЗапускается новый жизненный цикл:\n\n```text\nJavaScript fetch()\n        ↓\nпроверка политики браузера и кеша\n        ↓\nHTTP-запрос\n        ↓\nbackend\n        ↓\nJSON-ответ\n        ↓\nresponse.json()\n        ↓\nизменение DOM\n        ↓\nповторный render\n```\n\nПри изменении DOM браузер может повторно выполнить layout, paint или compositing для затронутой части страницы.\n\n### 26. Соединение обычно не закрывается сразу\n\nСовременные браузеры переиспользуют соединения:\n\n```text\nодно соединение\n├── GET /\n├── GET /app.css\n├── GET /app.js\n├── GET /logo.png\n└── GET /api/profile\n```\n\nВ HTTP/1.1 это называется persistent connection.\n\nВ HTTP/2 несколько запросов передаются параллельно через streams одного TCP-соединения. \n\nВ HTTP/3 несколько запросов передаются через QUIC streams одного QUIC-соединения. \n\nЭто позволяет не выполнять DNS, TCP и TLS заново для каждого файла.\n\n### Что может быть пропущено\n\nРеальный быстрый запрос может выглядеть так:\n\n```text\nURL уже разобран\nDNS есть в кеше\nTCP/TLS-соединение открыто\nответ есть в CDN\n        ↓\nbackend вообще не вызван\n```\n\nИли:\n\n```text\nService Worker нашёл ответ\n        ↓\nсеть вообще не использовалась\n```\n\nПоэтому полная цепочка:\n\n```text\nDNS → TCP → TLS → backend → DB\n```\n\n— это возможный полный путь, а не обязательный набор действий для каждого запроса.\n\n### Где запрос может завершиться ошибкой\n\n```text\nURL parsing\n→ некорректный URL\n\nDNS\n→ домен не найден\n\nTCP\n→ connection refused / timeout\n\nTLS\n→ сертификат недействителен\n\nCDN/WAF\n→ запрос заблокирован\n\nReverse proxy\n→ 413, 429, 502, 504\n\nBackend routing\n→ 404 или 405\n\nAuthentication\n→ 401\n\nAuthorization\n→ 403\n\nValidation\n→ 400 или 422\n\nBusiness logic\n→ 409 и другие прикладные ошибки\n\nBackend exception\n→ 500\n\nUpstream failure\n→ 502, 503 или 504\n```\n\n### Важный нюанс CORS\n\nПри CORS сервер может успешно получить запрос и вернуть ответ, но браузер не предоставит JavaScript доступ к ответу из-за политики безопасности:\n\n```text\nFrontend → запрос отправлен\nBackend  → ответил 200\nБраузер  → заблокировал доступ JavaScript к response\n```\n\nПоэтому ошибка CORS не обязательно означает, что запрос не дошёл до backend.\n\nFetch Standard включает обработку CORS, redirect, HTTP cache, credentials и Service Worker в общий алгоритм получения ресурса. \n\n### Пример полного запроса FastAPI\n\n```text\n1. Пользователь нажал «Создать заказ»\n2. JavaScript сформировал JSON\n3. fetch() создал POST-запрос\n4. Браузер добавил cookies или Authorization\n5. DNS определил IP\n6. Было переиспользовано HTTPS-соединение\n7. Запрос пришёл в Nginx\n8. Nginx передал его Uvicorn\n9. Uvicorn вызвал FastAPI через ASGI\n10. Middleware добавил request_id\n11. Router выбрал POST /orders\n12. Dependency проверила access token\n13. Pydantic проверил JSON\n14. Service проверил товар и остаток\n15. Repository выполнил SQL\n16. PostgreSQL сохранил заказ\n17. FastAPI сформировал JSON\n18. Nginx вернул ответ браузеру\n19. fetch() получил Response\n20. JavaScript обновил интерфейс\n```\n\n### Итоговая схема\n\n```text\nПользователь\n    ↓\nBrowser event / JavaScript\n    ↓\nURL parsing\n    ↓\nCache / Service Worker\n    ↓\nDNS\n    ↓\nTCP + TLS или QUIC + TLS\n    ↓\nHTTP request\n    ↓\nCDN / WAF / Load Balancer\n    ↓\nReverse Proxy\n    ↓\nApplication Server\n    ↓\nMiddleware\n    ↓\nRouter\n    ↓\nAuthentication / Authorization\n    ↓\nValidation\n    ↓\nBusiness Logic\n    ↓\nDatabase / Cache / External Services\n    ↓\nHTTP response\n    ↓\nBrowser\n    ↓\nHTML parsing или JSON parsing\n    ↓\nDOM update\n    ↓\nLayout / Paint / Compositing\n    ↓\nРезультат на экране\n```\n\nHTTP-запрос — лишь центральная часть процесса. До него браузер должен определить ресурс и установить или переиспользовать соединение, а после ответа — разобрать данные и обновить отображаемый документ."
  popularity = 7.89

[[questions]]
  id = 31
  question = "Какой HTTP-запрос выполняется при нажатии на кнопку?"
  answer = "### Нажатие на кнопку само по себе не определяет HTTP-метод\n\nУ кнопки нет фиксированного запроса вроде «любая кнопка отправляет `POST`».\n\nПосле клика может произойти:\n\n```text\nGET\nPOST\nPUT\nPATCH\nDELETE\nнесколько запросов\nили вообще ни одного HTTP-запроса\n```\n\nВсё зависит от HTML-разметки и JavaScript-обработчика.\n\n### Обычная кнопка без формы\n\n```html\n<button type=\"button\">Открыть окно</button>\n```\n\nУ такой кнопки нет встроенного сетевого поведения. При нажатии HTTP-запрос не выполняется:\n\n```text\nclick\n  ↓\nникакого HTTP-запроса\n```\n\nОна может, например, открыть модальное окно:\n\n```javascript\nbutton.addEventListener(\"click\", () => {\n    modal.hidden = false;\n});\n```\n\n### Кнопка отправки формы\n\n```html\n<form action=\"/login\" method=\"post\">\n    <input name=\"username\">\n    <input name=\"password\" type=\"password\">\n\n    <button type=\"submit\">Войти</button>\n</form>\n```\n\nПри нажатии браузер отправит:\n\n```text\nPOST /login HTTP/1.1\nContent-Type: application/x-www-form-urlencoded\n\nusername=alfob&password=secret\n```\n\nМетод определяется атрибутом `method` формы:\n\n```html\n<form method=\"post\">\n```\n\nАдрес определяется атрибутом `action`:\n\n```html\n<form action=\"/login\">\n```\n\n### Форма с GET\n\n```html\n<form action=\"/search\" method=\"get\">\n    <input name=\"q\">\n    <button type=\"submit\">Найти</button>\n</form>\n```\n\nПосле ввода `fastapi` будет выполнен запрос:\n\n```text\nGET /search?q=fastapi HTTP/1.1\n```\n\nПри `GET` значения полей добавляются в query string. При `POST` они обычно передаются в теле запроса. Нативная HTML-форма поддерживает для отправки в основном `GET` и `POST`; значение `dialog` закрывает диалог и не отправляет HTTP-запрос. \n\n### Метод формы по умолчанию\n\nЕсли `method` не указан:\n\n```html\n<form action=\"/search\">\n    <input name=\"q\">\n    <button type=\"submit\">Найти</button>\n</form>\n```\n\nиспользуется `GET`:\n\n```text\nGET /search?q=...\n```\n\nДля HTML-форм отсутствующее или недопустимое значение `method` приводит к состоянию `GET`. \n\n### Важная особенность `<button>`\n\nКнопка внутри формы без явного `type` обычно является кнопкой отправки:\n\n```html\n<form action=\"/orders\" method=\"post\">\n    <button>Создать заказ</button>\n</form>\n```\n\nЭто фактически соответствует:\n\n```html\n<button type=\"submit\">Создать заказ</button>\n```\n\nПоэтому кнопкам, которые не должны отправлять форму, лучше всегда явно задавать:\n\n```html\n<button type=\"button\">Показать подробности</button>\n```\n\nИначе обычная интерфейсная кнопка внутри формы может неожиданно вызвать отправку данных. Стандарт HTML различает submit-кнопки и кнопки без поведения отправки; атрибуты `formaction` и `formmethod` применимы именно к submit-кнопкам. \n\n### JavaScript может отправить любой подходящий метод\n\n```html\n<button type=\"button\" id=\"delete-button\">\n    Удалить\n</button>\n```\n\n```javascript\ndocument\n    .getElementById(\"delete-button\")\n    .addEventListener(\"click\", async () => {\n        await fetch(\"/api/files/42\", {\n            method: \"DELETE\",\n        });\n    });\n```\n\nПри клике выполняется:\n\n```text\nDELETE /api/files/42 HTTP/1.1\n```\n\nДругой обработчик может отправить `POST`:\n\n```javascript\nawait fetch(\"/api/orders\", {\n    method: \"POST\",\n    headers: {\n        \"Content-Type\": \"application/json\",\n    },\n    body: JSON.stringify({\n        product_id: 42,\n        quantity: 2,\n    }),\n});\n```\n\n```text\nPOST /api/orders HTTP/1.1\nContent-Type: application/json\n\n{\n  \"product_id\": 42,\n  \"quantity\": 2\n}\n```\n\nУ `fetch()` методом по умолчанию является `GET`, если `method` не указан. \n\n```javascript\nfetch(\"/api/products\");\n```\n\nэквивалентно:\n\n```javascript\nfetch(\"/api/products\", {\n    method: \"GET\",\n});\n```\n\n### JavaScript может отменить стандартную отправку формы\n\n```html\n<form id=\"login-form\" action=\"/login\" method=\"post\">\n    <input name=\"username\">\n    <button type=\"submit\">Войти</button>\n</form>\n```\n\n```javascript\nform.addEventListener(\"submit\", async (event) => {\n    event.preventDefault();\n\n    await fetch(\"/api/login\", {\n        method: \"POST\",\n        body: new FormData(form),\n    });\n});\n```\n\nЗдесь браузер не выполняет обычную навигационную отправку на `/login`, потому что она отменена через:\n\n```javascript\nevent.preventDefault();\n```\n\nВместо неё JavaScript создаёт собственный HTTP-запрос к `/api/login`.\n\n### Ссылка, оформленная как кнопка\n\nВнешне элемент может выглядеть как кнопка, но фактически быть ссылкой:\n\n```html\n<a href=\"/profile\" class=\"button\">Профиль</a>\n```\n\nПри нажатии происходит навигация:\n\n```text\nGET /profile HTTP/1.1\n```\n\nПоэтому внешний вид элемента не определяет HTTP-метод.\n\n```text\nвыглядит как кнопка\n≠ является <button>\n```\n\n### Кнопка в SPA\n\nВ React или Vue кнопка может только изменить состояние приложения:\n\n```javascript\nfunction handleClick() {\n    setSidebarOpen(true);\n}\n```\n\nHTTP-запроса здесь нет.\n\nОна также может:\n\n1. изменить локальный интерфейс;\n    \n2. перейти на другой frontend-route;\n    \n3. загрузить данные через API;\n    \n4. последовательно отправить несколько запросов.\n    \n\nНапример:\n\n```text\nclick «Оформить заказ»\n        ↓\nPOST /api/orders\n        ↓\nGET /api/orders/1001\n        ↓\nGET /api/recommendations\n```\n\nТо есть один пользовательский клик способен породить несколько HTTP-запросов.\n\n### Как точно узнать, какой запрос отправляется\n\nВ браузере нужно открыть:\n\n```text\nDevTools\n→ Network\n→ нажать кнопку\n```\n\nТам будут видны:\n\n- HTTP-метод;\n    \n- URL;\n    \n- query parameters;\n    \n- request headers;\n    \n- request body;\n    \n- response status;\n    \n- response body;\n    \n- инициатор запроса.\n    \n\nНапример:\n\n```text\nMethod:       POST\nRequest URL:  https://example.com/api/orders\nStatus:       201 Created\nInitiator:    app.js\n```\n\n### Итог\n\n```text\n<button type=\"button\">\n→ сам по себе запрос не отправляет\n\n<button type=\"submit\"> внутри <form method=\"get\">\n→ GET\n\n<button type=\"submit\"> внутри <form method=\"post\">\n→ POST\n\nкнопка с JavaScript fetch()\n→ метод указан в fetch(), по умолчанию GET\n\n<a href=\"...\">, оформленная как кнопка\n→ обычно GET-навигация\n```\n\nСледовательно, по одной надписи или внешнему виду кнопки определить HTTP-запрос невозможно. Нужно смотреть форму, `type`, `action`, `method` и JavaScript-обработчики."
  popularity = 2.63

[[questions]]
  id = 32
  question = "Какие бывают HTTP status codes (статус коды)?"
  answer = "### Что такое HTTP status code\n\nHTTP status code — трёхзначный код в **HTTP-ответе**, который сообщает клиенту результат обработки запроса:\n\n```http\nHTTP/1.1 200 OK\nContent-Type: application/json\n\n{\n  \"id\": 42\n}\n```\n\nЗдесь:\n\n```text\n200 → status code\nOK  → текстовое описание\n```\n\nДопустимые HTTP-коды находятся в диапазоне `100–599`. Первая цифра определяет класс ответа, последние две не имеют отдельной общей классификации. Коды расширяемы: клиент может встретить код, которого он не знает, но должен хотя бы понимать его класс. \n\n### Пять классов кодов\n\n```text\n1xx → информационные ответы\n2xx → успешное выполнение\n3xx → перенаправление и работа с кешем\n4xx → проблема со стороны клиентского запроса\n5xx → проблема при обработке на стороне сервера\n```\n\n### 1xx — Informational\n\nЭто промежуточные ответы: сервер получил запрос, но обработка ещё продолжается. После `1xx` обычно приходит окончательный ответ другого класса. \n\n#### `100 Continue`\n\nКлиент может сначала отправить заголовки большого запроса:\n\n```text\nPOST /files HTTP/1.1\nContent-Length: 100000000\nExpect: 100-continue\n```\n\nСервер отвечает:\n\n```text\nHTTP/1.1 100 Continue\n```\n\nПосле этого клиент отправляет тело.\n\nЭто позволяет не передавать большой файл, если сервер заранее собирается отклонить запрос.\n\n#### `101 Switching Protocols`\n\nСервер согласился переключиться на другой протокол:\n\n```text\nHTTP/1.1 101 Switching Protocols\nUpgrade: websocket\nConnection: Upgrade\n```\n\nИсторически применяется при установлении WebSocket через HTTP/1.1.\n\n#### `102 Processing`\n\nСервер получил запрос и продолжает длительную обработку. Код определён WebDAV.\n\n#### `103 Early Hints`\n\nПозволяет заранее передать некоторые заголовки, например ссылки на ресурсы, пока основной ответ ещё формируется:\n\n```text\nHTTP/1.1 103 Early Hints\nLink: </app.css>; rel=preload; as=style\n```\n\n### 2xx — Successful\n\nЗапрос успешно принят и обработан.\n\n#### `200 OK`\n\nОбычный успешный ответ:\n\n```text\nGET /users/42\n```\n\n```text\nHTTP/1.1 200 OK\nContent-Type: application/json\n\n{\n  \"id\": 42,\n  \"username\": \"alfob\"\n}\n```\n\nИспользуется для успешного чтения и многих других успешно выполненных операций.\n\n#### `201 Created`\n\nСоздан новый ресурс:\n\n```text\nPOST /orders\n```\n\n```text\nHTTP/1.1 201 Created\nLocation: /orders/1001\nContent-Type: application/json\n\n{\n  \"id\": 1001,\n  \"status\": \"created\"\n}\n```\n\nЧасто возвращается после `POST`, создавшего объект.\n\n#### `202 Accepted`\n\nЗапрос принят, но операция ещё не завершена:\n\n```text\nPOST /reports\n```\n\n```text\nHTTP/1.1 202 Accepted\n\n{\n  \"task_id\": \"abc123\",\n  \"status\": \"pending\"\n}\n```\n\nПодходит для фоновых задач:\n\n```text\nзапрос принят\n→ задача помещена в очередь\n→ worker выполнит её позже\n```\n\n`202` не означает, что операция успешно завершилась.\n\n#### `204 No Content`\n\nОперация выполнена успешно, но тела ответа нет:\n\n```text\nDELETE /files/42\n```\n\n```text\nHTTP/1.1 204 No Content\n```\n\nПосле `204` не нужно возвращать JSON вроде:\n\n```json\n{\n  \"status\": \"success\"\n}\n```\n\n#### `206 Partial Content`\n\nСервер вернул только часть ресурса:\n\n```text\nGET /video.mp4\nRange: bytes=1000-1999\n```\n\n```text\nHTTP/1.1 206 Partial Content\nContent-Range: bytes 1000-1999/5000000\n```\n\nИспользуется для докачивания файлов и потоковой передачи.\n\n### 3xx — Redirection\n\nКлиенту нужно выполнить дополнительное действие: обратиться по другому адресу или использовать закешированное представление.\n\n#### `301 Moved Permanently`\n\nРесурс постоянно перемещён:\n\n```text\nHTTP/1.1 301 Moved Permanently\nLocation: https://example.com/new-page\n```\n\nБраузеры и поисковые системы могут запомнить перенаправление.\n\n#### `302 Found`\n\nВременное перенаправление:\n\n```text\nHTTP/1.1 302 Found\nLocation: /login\n```\n\nЧасто используется после проверки авторизации или при временном перемещении ресурса.\n\nИз-за исторического поведения клиентов `302` может привести к изменению исходного метода на `GET`. Когда необходимо строго сохранить метод и тело запроса, применяют `307`.\n\n#### `303 See Other`\n\nКлиенту предлагается получить результат отдельным `GET`-запросом:\n\n```text\nPOST /orders\n    ↓\n303 See Other\nLocation: /orders/1001\n    ↓\nGET /orders/1001\n```\n\nЭто удобно в шаблоне Post/Redirect/Get, чтобы обновление страницы не повторяло отправку формы.\n\n#### `304 Not Modified`\n\nРесурс не изменился, клиент может использовать кеш:\n\n```text\nGET /app.js\nIf-None-Match: \"version-15\"\n```\n\n```text\nHTTP/1.1 304 Not Modified\nETag: \"version-15\"\n```\n\n`304` не означает ошибку и обычно не содержит тело ресурса.\n\n#### `307 Temporary Redirect`\n\nВременное перенаправление с сохранением HTTP-метода и тела:\n\n```text\nPOST /old\n→ 307\n→ POST /new\n```\n\n#### `308 Permanent Redirect`\n\nПостоянное перенаправление с сохранением метода и тела:\n\n```text\nPUT /old\n→ 308\n→ PUT /new\n```\n\nПрактическое различие:\n\n```text\n301/302 → старые клиенты могут изменить метод на GET\n307/308 → метод и тело должны сохраняться\n\n301/308 → постоянное перенаправление\n302/307 → временное перенаправление\n```\n\n### 4xx — Client Error\n\nСервер не может выполнить запрос из-за его содержимого, credentials, прав доступа, текущего состояния ресурса или ограничений.\n\nЭто не обязательно означает ошибку frontend-кода. Например, `404` может быть ожидаемым результатом поиска отсутствующего объекта.\n\n#### `400 Bad Request`\n\nЗапрос некорректен на общем уровне:\n\n```text\nHTTP/1.1 400 Bad Request\n\n{\n  \"detail\": \"Malformed JSON\"\n}\n```\n\nНапример:\n\n- сломанный JSON;\n    \n- некорректный синтаксис запроса;\n    \n- недопустимый формат параметра;\n    \n- отсутствует необходимая часть запроса.\n    \n\n#### `401 Unauthorized`\n\nНет подходящих аутентификационных данных:\n\n```text\nHTTP/1.1 401 Unauthorized\nWWW-Authenticate: Bearer\n```\n\nПричины:\n\n```text\nтокен отсутствует\nтокен истёк\nподпись токена неверна\nсессия недействительна\n```\n\nНазвание может вводить в заблуждение: `401` относится прежде всего к аутентификации.\n\n#### `403 Forbidden`\n\nПользователь определён, но действие ему запрещено:\n\n```text\n401 → мы не подтвердили, кто ты\n403 → мы знаем, кто ты, но прав недостаточно\n```\n\nНапример, обычный пользователь пытается удалить чужой файл.\n\n#### `404 Not Found`\n\nРесурс не найден:\n\n```text\nGET /users/999999\n```\n\n```text\nHTTP/1.1 404 Not Found\n```\n\nИногда backend возвращает `404` вместо `403`, чтобы не раскрывать существование защищённого объекта.\n\n#### `405 Method Not Allowed`\n\nПуть существует, но этот HTTP-метод не поддерживается:\n\n```text\nDELETE /profile\n```\n\n```text\nHTTP/1.1 405 Method Not Allowed\nAllow: GET, PATCH\n```\n\n#### `409 Conflict`\n\nЗапрос конфликтует с текущим состоянием системы:\n\n```text\nemail уже зарегистрирован\nверсия документа устарела\nзаказ уже отменён\nоперация нарушает текущий статус объекта\n```\n\nПример:\n\n```text\nHTTP/1.1 409 Conflict\n\n{\n  \"code\": \"email_already_exists\"\n}\n```\n\n#### `410 Gone`\n\nРесурс существовал раньше, но был удалён и не ожидается его восстановление.\n\nОтличие:\n\n```text\n404 → сервер не сообщает, существовал ли ресурс\n410 → ресурс был удалён окончательно\n```\n\n#### `412 Precondition Failed`\n\nНе выполнено условие запроса:\n\n```text\nPUT /documents/42\nIf-Match: \"version-7\"\n```\n\nЕсли документ уже имеет другую версию:\n\n```text\nHTTP/1.1 412 Precondition Failed\n```\n\nИспользуется для защиты от потерянных обновлений.\n\n#### `413 Content Too Large`\n\nТело запроса превышает допустимый размер:\n\n```text\nHTTP/1.1 413 Content Too Large\n```\n\n#### `415 Unsupported Media Type`\n\nBackend не поддерживает указанный формат тела:\n\n```text\nPOST /users\nContent-Type: application/xml\n```\n\nЕсли endpoint принимает только JSON:\n\n```text\nHTTP/1.1 415 Unsupported Media Type\n```\n\n#### `422 Unprocessable Content`\n\nСервер понимает формат тела, но содержимое не проходит проверку:\n\n```json\n{\n  \"email\": \"not-an-email\",\n  \"age\": -10\n}\n```\n\n```text\nHTTP/1.1 422 Unprocessable Content\n```\n\nТипичное разделение:\n\n```text\n400 → запрос невозможно нормально разобрать\n422 → запрос разобран, но данные недопустимы\n```\n\n#### `429 Too Many Requests`\n\nКлиент превысил ограничение частоты:\n\n```text\nHTTP/1.1 429 Too Many Requests\nRetry-After: 30\n```\n\nКлиенту следует уменьшить частоту и повторить запрос позже.\n\n### 5xx — Server Error\n\nЗапрос может быть корректным, но сервер не смог его обработать.\n\n#### `500 Internal Server Error`\n\nНепредвиденная ошибка приложения:\n\n```text\nнеобработанное исключение\nошибка бизнес-логики\nошибка сериализации\nнепредвиденное состояние\n```\n\nКлиенту нельзя возвращать stack trace, SQL-запросы и внутренние секреты.\n\n#### `501 Not Implemented`\n\nСервер не поддерживает функциональность, необходимую для выполнения запроса, например неизвестный HTTP-метод.\n\nНе следует использовать `501` просто потому, что конкретный endpoint ещё не разработан.\n\n#### `502 Bad Gateway`\n\nПрокси или gateway получил некорректный ответ от upstream-сервера:\n\n```text\nБраузер\n   ↓\nNginx\n   ↓\nFastAPI не ответил корректно\n   ↓\n502 Bad Gateway\n```\n\n#### `503 Service Unavailable`\n\nСервис временно недоступен:\n\n```text\nтехническое обслуживание\nперегрузка\nотсутствуют доступные backend-инстансы\nкритическая зависимость недоступна\n```\n\nОтвет может содержать:\n\n```text\nHTTP/1.1 503 Service Unavailable\nRetry-After: 60\n```\n\n#### `504 Gateway Timeout`\n\nProxy или gateway не дождался ответа от upstream:\n\n```text\nБраузер\n   ↓\nNginx\n   ↓\nBackend обрабатывает слишком долго\n   ↓\n504 Gateway Timeout\n```\n\nОтличие:\n\n```text\n502 → upstream ответил некорректно или соединение сорвалось\n504 → upstream не ответил вовремя\n```\n\n### Часто используемые коды в REST API\n\nДля обычного backend чаще всего достаточно уверенно понимать:\n\n```text\n200 OK\n201 Created\n202 Accepted\n204 No Content\n\n301/302 Redirect\n304 Not Modified\n307/308 Redirect with method preservation\n\n400 Bad Request\n401 Unauthorized\n403 Forbidden\n404 Not Found\n405 Method Not Allowed\n409 Conflict\n412 Precondition Failed\n413 Content Too Large\n415 Unsupported Media Type\n422 Unprocessable Content\n429 Too Many Requests\n\n500 Internal Server Error\n502 Bad Gateway\n503 Service Unavailable\n504 Gateway Timeout\n```\n\n### Пример CRUD API\n\n```text\nGET /users/42\n→ 200 — пользователь найден\n→ 404 — пользователь отсутствует\n\nPOST /users\n→ 201 — пользователь создан\n→ 409 — email уже занят\n→ 422 — поля не прошли валидацию\n\nPATCH /users/42\n→ 200 — пользователь изменён\n→ 404 — пользователь отсутствует\n→ 403 — редактирование запрещено\n\nDELETE /users/42\n→ 204 — пользователь удалён\n→ 404 — пользователь отсутствует\n```\n\n### Главное правило\n\nHTTP-код должен описывать общий результат операции, а тело ответа — подробности:\n\n```text\nHTTP/1.1 409 Conflict\nContent-Type: application/problem+json\n\n{\n  \"type\": \"/problems/email-conflict\",\n  \"title\": \"Email is already registered\",\n  \"status\": 409,\n  \"detail\": \"A user with this email already exists\"\n}\n```\n\nПолный актуальный перечень зарегистрированных кодов поддерживается в реестре IANA; стандарт HTTP определяет пять основных классов `1xx–5xx`. "
