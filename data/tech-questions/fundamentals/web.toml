  id = 27
  question = "Как организовать надежное взаимодействие фронтенда и бэкенда?"
  answer = "### Надёжное взаимодействие — это не один механизм\n\nНадёжность между frontend и backend строится на нескольких уровнях:\n\n```text\nКонтракт API\n    ↓\nВалидация данных\n    ↓\nКорректные HTTP-статусы и ошибки\n    ↓\nТаймауты и отмена запросов\n    ↓\nБезопасные повторные запросы\n    ↓\nЗащита от дубликатов\n    ↓\nАвторизация\n    ↓\nЛоги, метрики и трассировка\n```\n\nГлавный принцип:\n\n```text\nfrontend не должен угадывать поведение backend,\nа backend не должен доверять frontend\n```\n\n### 1. Зафиксировать контракт API\n\nFrontend и backend должны заранее согласовать:\n\n- URL и HTTP-методы;\n    \n- параметры path и query;\n    \n- структуру request body;\n    \n- структуру response body;\n    \n- возможные HTTP-статусы;\n    \n- формат ошибок;\n    \n- обязательные и необязательные поля;\n    \n- типы, ограничения и допустимые значения.\n    \n\nНапример:\n\n```text\nPOST /api/orders\nContent-Type: application/json\n\n{\n  \"product_id\": 42,\n  \"quantity\": 2\n}\n```\n\nУспешный ответ:\n\n```text\nHTTP/1.1 201 Created\nContent-Type: application/json\n\n{\n  \"id\": 1001,\n  \"status\": \"created\",\n  \"product_id\": 42,\n  \"quantity\": 2\n}\n```\n\nКонтракт удобно описывать через OpenAPI. Спецификация позволяет машинно описать операции, параметры, request body, ответы, схемы и способы аутентификации; на её основе можно генерировать документацию, клиентский код и проверять совместимость. \n\nПример схемы:\n\n```yaml\npaths:\n  /api/orders:\n    post:\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: \"#/components/schemas/OrderCreate\"\n      responses:\n        \"201\":\n          description: Order created\n        \"422\":\n          description: Validation error\n```\n\n### 2. Использовать единый API-клиент на frontend\n\nНе стоит разбрасывать вызовы `fetch()` по всему приложению:\n\n```javascript\nfetch(\"/api/users\");\nfetch(\"/api/orders\");\nfetch(\"/api/payments\");\n```\n\nЛучше сделать один слой:\n\n```text\nUI-компоненты\n      ↓\nfrontend services\n      ↓\nединый HTTP-клиент\n      ↓\nbackend API\n```\n\nНапример:\n\n```javascript\nclass ApiError extends Error {\n    constructor(status, body) {\n        super(body?.detail ?? `HTTP error ${status}`);\n        this.status = status;\n        this.body = body;\n    }\n}\n\nasync function apiRequest(path, options = {}) {\n    const response = await fetch(`/api${path}`, {\n        ...options,\n        headers: {\n            Accept: \"application/json\",\n            ...options.headers,\n        },\n    });\n\n    const contentType = response.headers.get(\"content-type\") ?? \"\";\n    const body = contentType.includes(\"json\")\n        ? await response.json()\n        : await response.text();\n\n    if (!response.ok) {\n        throw new ApiError(response.status, body);\n    }\n\n    return body;\n}\n```\n\nИспользование:\n\n```javascript\nconst user = await apiRequest(\"/users/42\");\n```\n\nВ одном месте можно централизованно реализовать:\n\n```text\nAuthorization\nтаймауты\nобновление access token\nобработку 401\nповторы\nлогирование\nразбор ошибок\n```\n\n### 3. Backend должен возвращать правильные HTTP-статусы\n\nFrontend не должен определять успех по полю:\n\n```json\n{\n  \"success\": false\n}\n```\n\nпри статусе `200 OK`.\n\nЛучше использовать семантику HTTP:\n\n```text\n200 OK             → запрос успешно обработан\n201 Created        → ресурс создан\n202 Accepted       → задача принята, но ещё не завершена\n204 No Content     → успешно, тела ответа нет\n\n400 Bad Request    → некорректный запрос\n401 Unauthorized   → нет действительных credentials\n403 Forbidden      → credentials есть, но доступ запрещён\n404 Not Found      → ресурс не найден\n409 Conflict       → конфликт текущего состояния\n412 Precondition Failed → условие обновления не выполнено\n413 Content Too Large   → слишком большое тело\n422 Unprocessable Content → ошибка содержимого/валидации\n429 Too Many Requests   → превышен лимит\n\n500 Internal Server Error → внутренняя ошибка\n502 Bad Gateway           → ошибка upstream\n503 Service Unavailable   → сервис временно недоступен\n504 Gateway Timeout       → upstream не ответил вовремя\n```\n\nHTTP-статус должен передавать общий класс результата, а тело — подробности. Семантика методов и кодов ответа определена HTTP-стандартом.\n\n### 4. Сделать единый формат ошибок\n\nПлохо, когда разные endpoint возвращают разные форматы:\n\n```json\n{\"error\": \"Not found\"}\n```\n\n```json\n{\"message\": \"Invalid request\"}\n```\n\n```json\n{\"detail\": [{\"field\": \"email\"}]}\n```\n\nFrontend приходится писать множество отдельных обработчиков.\n\nЛучше использовать единый формат:\n\n```json\n{\n  \"type\": \"https://api.example.com/problems/validation-error\",\n  \"title\": \"Request validation failed\",\n  \"status\": 422,\n  \"detail\": \"Several fields contain invalid values\",\n  \"instance\": \"/api/orders/request-7fbd\",\n  \"errors\": [\n    {\n      \"field\": \"quantity\",\n      \"code\": \"greater_than_zero\",\n      \"message\": \"Quantity must be greater than zero\"\n    }\n  ]\n}\n```\n\nRFC 9457 определяет стандартный формат `application/problem+json` с полями `type`, `title`, `status`, `detail` и `instance`; формат можно расширять прикладными полями, например списком ошибок валидации. \n\nОтвет:\n\n```text\nHTTP/1.1 422 Unprocessable Content\nContent-Type: application/problem+json\n```\n\nFrontend должен ориентироваться преимущественно на стабильные машинные данные:\n\n```text\nstatus\ntype\ncode\nfield\n```\n\nа не сравнивать человеческий текст:\n\n```javascript\n// Ненадёжно\nif (error.message === \"Пользователь не найден\") {\n    // ...\n}\n```\n\nЛучше:\n\n```javascript\nif (error.body?.type === \"/problems/user-not-found\") {\n    // ...\n}\n```\n\n### 5. Валидировать данные с обеих сторон\n\nFrontend-валидация улучшает UX:\n\n```javascript\nif (quantity <= 0) {\n    showError(\"Количество должно быть больше нуля\");\n    return;\n}\n```\n\nНо она не является защитой, потому что клиент может напрямую вызвать API:\n\n```bash\ncurl -X POST /api/orders \\\n  -d '{\"quantity\": -100}'\n```\n\nПоэтому backend обязан повторно проверять:\n\n- типы;\n    \n- обязательные поля;\n    \n- длину строк;\n    \n- диапазоны чисел;\n    \n- форматы дат;\n    \n- размер файлов;\n    \n- допустимое количество элементов;\n    \n- бизнес-ограничения.\n    \n\n```python\nfrom pydantic import BaseModel, Field\n\n\nclass OrderCreate(BaseModel):\n    product_id: int = Field(gt=0)\n    quantity: int = Field(ge=1, le=100)\n```\n\nFrontend-валидация:\n\n```text\nудобство пользователя\n```\n\nBackend-валидация:\n\n```text\nцелостность и безопасность системы\n```\n\n### 6. Устанавливать таймауты\n\nЗапрос не должен ждать бесконечно:\n\n```text\nfrontend → backend → база данных\n                   зависла\n```\n\nНа каждом уровне нужны отдельные ограничения:\n\n```text\nтаймаут подключения\nтаймаут ожидания ответа\nтаймаут чтения\nтаймаут записи\nтаймаут запроса к базе\nтаймаут внешнего API\n```\n\nFrontend с `AbortController`:\n\n```javascript\nasync function fetchWithTimeout(url, options = {}, timeoutMs = 10_000) {\n    const controller = new AbortController();\n\n    const timeoutId = setTimeout(() => {\n        controller.abort();\n    }, timeoutMs);\n\n    try {\n        return await fetch(url, {\n            ...options,\n            signal: controller.signal,\n        });\n    } finally {\n        clearTimeout(timeoutId);\n    }\n}\n```\n\nВажно различать:\n\n```text\nтаймаут frontend\n≠\nbackend обязательно прекратил выполнение\n```\n\nНапример:\n\n```text\nfrontend отправил POST /payments\nbackend создал платёж\nответ потерялся\nfrontend получил timeout\n```\n\nКлиент теперь не знает, была ли операция выполнена. Поэтому таймауты тесно связаны с идемпотентностью.\n\n### 7. Повторять запросы только безопасно\n\nНе следует автоматически повторять любой неуспешный запрос.\n\nОбычно можно повторять:\n\n```text\nGET\nHEAD\nOPTIONS\nPUT\nDELETE\n```\n\nпоскольку эти методы идемпотентны по HTTP-семантике.\n\nОпасный пример:\n\n```text\nPOST /payments\n```\n\nЕсли первый запрос был выполнен, но ответ потерялся, повтор может создать второй платёж.\n\nHTTP прямо рекомендует не повторять автоматически неидемпотентный запрос, пока клиент не знает, что операция фактически идемпотентна или что первый запрос точно не был применён. \n\nПолитика повторов может выглядеть так:\n\n```text\nсетевой разрыв       → возможно повторить\ntimeout              → возможно, но состояние неизвестно\n429                  → повторить позже\n502/503/504          → ограниченный повтор\n400/401/403/404/422  → обычно не повторять без изменения запроса\n```\n\nПри повторе используют задержку:\n\n```text\n1-я попытка → 500 мс\n2-я попытка → 1 с\n3-я попытка → 2 с\n4-я попытка → 4 с\n```\n\nНужно добавлять случайное отклонение, чтобы тысячи клиентов не повторили запрос одновременно.\n\nЕсли сервер возвращает:\n\n```text\nRetry-After: 30\n```\n\nклиент должен учитывать указанную задержку. `Retry-After` определён как рекомендация, сколько подождать перед последующим запросом; в частности, он применяется с `503 Service Unavailable`. \n\n### 8. Защищать POST от повторного выполнения\n\nДля операций вроде оплаты или создания заказа применяют ключ идемпотентности:\n\n```text\nPOST /api/payments\nIdempotency-Key: 7abf90f5-cc30-4bf6-9d7a-e19cd880f100\nContent-Type: application/json\n\n{\n  \"order_id\": 1001,\n  \"amount\": 50\n}\n```\n\nBackend сохраняет:\n\n```text\nuser_id\n+ idempotency key\n+ хеш параметров\n+ результат операции\n```\n\nПри повторе с тем же ключом он возвращает прежний результат:\n\n```text\nPOST №1 → платёж создан\nответ потерялся\n\nPOST №2 с тем же ключом\n→ новый платёж не создаётся\n→ возвращается результат POST №1\n```\n\nПример таблицы:\n\n```text\nidempotency_records\n├── principal_id\n├── key\n├── request_hash\n├── status\n├── response_status\n├── response_body\n└── expires_at\n```\n\nНужно обеспечить уникальность:\n\n```sql\nUNIQUE (principal_id, key)\n```\n\nЗаголовок `Idempotency-Key` широко используется как прикладной механизм для отказоустойчивых `POST` и `PATCH`, но соответствующий документ IETF по состоянию на 2026 год остаётся Internet-Draft, а не завершённым RFC. \n\n### 9. Защищаться от конкурентных обновлений\n\nПредставим:\n\n```text\nFrontend A получил balance = 100\nFrontend B получил balance = 100\n\nA изменил balance на 80\nB изменил balance на 120\n```\n\nБез контроля версия B может затереть изменение A.\n\nМожно использовать версию:\n\n```json\n{\n  \"id\": 42,\n  \"name\": \"Document\",\n  \"version\": 7\n}\n```\n\nОбновление:\n\n```text\nPUT /documents/42\nContent-Type: application/json\n\n{\n  \"name\": \"New document\",\n  \"version\": 7\n}\n```\n\nBackend обновляет запись только при совпадении версии:\n\n```sql\nUPDATE documents\nSET name = :name,\n    version = version + 1\nWHERE id = :id\n  AND version = :expected_version;\n```\n\nЕсли обновлено `0` строк:\n\n```text\nHTTP/1.1 409 Conflict\n```\n\nHTTP-вариант — `ETag` и `If-Match`:\n\n```text\nGET /documents/42\n```\n\n```text\nHTTP/1.1 200 OK\nETag: \"version-7\"\n```\n\nОбновление:\n\n```text\nPUT /documents/42\nIf-Match: \"version-7\"\n```\n\nЕсли ресурс уже изменён:\n\n```text\nHTTP/1.1 412 Precondition Failed\n```\n\nУсловные запросы `ETag`/`If-Match` предназначены в том числе для предотвращения потерянных обновлений. \n\n### 10. Проверять не только аутентификацию, но и авторизацию\n\nНедостаточно проверить, что токен действителен:\n\n```text\nтокен действителен\n≠\nпользователь имеет доступ к объекту\n```\n\nНапример:\n\n```text\nGET /api/orders/1001\nAuthorization: Bearer <user-token>\n```\n\nBackend обязан проверить:\n\n```text\nсуществует ли пользователь\nпринадлежит ли ему заказ 1001\nразрешено ли читать этот заказ\nразрешено ли видеть все возвращаемые поля\n```\n\nНельзя доверять переданному frontend идентификатору:\n\n```python\n# Опасно\norder = await Order.get(id=order_id)\nreturn order\n```\n\nНужно фильтровать по владельцу:\n\n```python\norder = await Order.get(\n    id=order_id,\n    user_id=current_user.id,\n)\n```\n\nOWASP отдельно выделяет проверки доступа к конкретным объектам и функциям API: каждый endpoint, принимающий идентификатор объекта, должен проверять право текущего пользователя на действие с этим объектом. \n\n### 11. Ограничивать нагрузку\n\nНадёжность системы зависит от ограничений:\n\n```text\nмаксимальный размер request body\nмаксимальный размер файла\nмаксимальный limit в пагинации\nмаксимальное число объектов в batch\nrate limit\nограничение параллельных операций\nтаймауты\n```\n\nНапример:\n\n```text\nGET /api/orders?limit=1000000\n```\n\nBackend не должен безусловно выполнять такой запрос:\n\n```python\nlimit = min(requested_limit, 100)\n```\n\nПри превышении частоты запросов:\n\n```text\nHTTP/1.1 429 Too Many Requests\nRetry-After: 30\n```\n\nOWASP относит отсутствие ограничений размера, количества и частоты операций к риску неограниченного потребления ресурсов и рекомендует применять rate limiting в зависимости от бизнес-операции.\n\n### 12. Длительные операции не держать в обычном запросе\n\nПлохо:\n\n```text\nPOST /reports\nfrontend ждёт 5 минут\n```\n\nНадёжнее:\n\n```text\nPOST /reports\n```\n\n```text\nHTTP/1.1 202 Accepted\nLocation: /reports/tasks/abc123\n\n{\n  \"task_id\": \"abc123\",\n  \"status\": \"pending\"\n}\n```\n\nFrontend проверяет статус:\n\n```text\nGET /reports/tasks/abc123\n```\n\n```json\n{\n  \"task_id\": \"abc123\",\n  \"status\": \"completed\",\n  \"download_url\": \"/reports/942\"\n}\n```\n\nСхема:\n\n```text\nFrontend\n   │\n   │ POST /reports\n   ▼\nBackend → очередь → worker\n   │\n   │ 202 + task_id\n   ▼\nFrontend\n   │\n   │ GET /tasks/{id}\n   ▼\nрезультат\n```\n\nДля обновлений можно использовать polling, SSE или WebSocket, но итоговое состояние всё равно полезно хранить на backend, чтобы frontend мог восстановиться после перезагрузки или разрыва соединения.\n\n### 13. Не считать WebSocket источником истины\n\nWebSocket-событие может потеряться из-за:\n\n- разрыва соединения;\n    \n- перезагрузки вкладки;\n    \n- временного отсутствия сети;\n    \n- переподключения;\n    \n- переключения backend-инстанса.\n    \n\nПоэтому хорошая схема:\n\n```text\nWebSocket/SSE → уведомляет, что что-то изменилось\nHTTP GET      → возвращает актуальное состояние\n```\n\nНапример:\n\n```json\n{\n  \"type\": \"order.updated\",\n  \"order_id\": 1001,\n  \"version\": 8\n}\n```\n\nПосле события frontend делает:\n\n```text\nGET /api/orders/1001\n```\n\nЛибо события должны иметь последовательные номера:\n\n```json\n{\n  \"event_id\": 1842,\n  \"type\": \"order.updated\"\n}\n```\n\nТогда после переподключения клиент может запросить пропущенные события.\n\n### 14. Поддерживать обратную совместимость\n\nОпасное изменение:\n\n```json\n// Было\n{\n  \"user_name\": \"alfob\"\n}\n```\n\n```json\n// Стало\n{\n  \"username\": \"alfob\"\n}\n```\n\nСтарый frontend перестанет работать сразу после обновления backend.\n\nОбычно безопаснее:\n\n```text\nдобавлять необязательные поля\nне переименовывать поля без версии\nне менять тип существующего поля\nне менять смысл существующего статуса\nоставлять переходный период\n```\n\nНапример:\n\n```json\n{\n  \"user_name\": \"alfob\",\n  \"username\": \"alfob\"\n}\n```\n\nПосле обновления всех клиентов старое поле можно удалить в следующей несовместимой версии API.\n\nВерсионирование:\n\n```text\n/api/v1/users\n/api/v2/users\n```\n\nили через media type/header, но подход должен быть единым для всего проекта.\n\n### 15. Добавить наблюдаемость\n\nКогда frontend сообщает:\n\n```text\n«запрос не работает»\n```\n\nнужно иметь возможность проследить его через всю систему.\n\nBackend возвращает идентификатор запроса:\n\n```text\nX-Request-ID: 72e5121a-66e2-4a68-b3ad-3a640614a4fe\n```\n\nТот же ID записывается:\n\n```text\nreverse proxy logs\nbackend logs\nworker logs\ndatabase diagnostics\nexternal API logs\n```\n\nЛогировать полезно:\n\n```text\nrequest_id\nroute\nmethod\nstatus\nduration\nuser_id\nошибку\nupstream\n```\n\nНе следует логировать:\n\n```text\nпароли\nAuthorization целиком\nrefresh token\nданные банковских карт\nсекретные cookies\n```\n\n### Пример итогового взаимодействия\n\n```text\n1. Frontend валидирует форму для UX\n2. Создаёт уникальный ключ операции\n3. Отправляет запрос через единый API-клиент\n4. Backend аутентифицирует пользователя\n5. Проверяет доступ к объекту\n6. Валидирует входные данные\n7. Проверяет idempotency key\n8. Выполняет операцию в транзакции\n9. Возвращает корректный HTTP-статус\n10. Возвращает данные или problem+json\n11. Frontend обрабатывает статус и стабильный error code\n12. При временном сбое выполняет ограниченный безопасный retry\n13. Запрос отслеживается через request_id\n```\n\n### Минимальная практичная архитектура\n\n```text\nFrontend\n├── единый HTTP-клиент\n├── timeout и отмена\n├── централизованный разбор ошибок\n├── безопасная retry-политика\n├── обновление авторизации\n└── состояние loading/error/data\n\nBackend\n├── OpenAPI-контракт\n├── входная валидация\n├── аутентификация\n├── объектная и функциональная авторизация\n├── транзакции\n├── идемпотентность важных операций\n├── единый problem+json\n├── rate limits и лимиты размера\n└── логи, метрики и request_id\n```\n\nГлавная формула:\n\n```text\nнадёжное взаимодействие =\nявный контракт\n+ проверка на backend\n+ предсказуемые ошибки\n+ ограниченные повторы\n+ идемпотентность\n+ контроль конкурентных изменений\n+ наблюдаемость\n```"
