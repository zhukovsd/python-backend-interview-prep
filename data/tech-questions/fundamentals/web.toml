[[questions]]
  id = 22
  question = "Какие ограничения есть у строки URL?"
  answer = "### Основные ограничения URL\n\nURL имеет структуру:\n\n```text\nscheme://host:port/path?query#fragment\n```\n\nНапример:\n\n```text\nhttps://api.example.com:443/users/42?active=true#details\n```\n\nОграничения касаются прежде всего длины, допустимых символов, кодирования и назначения отдельных компонентов.\n\n### 1. Нет единого максимального размера URL\n\nСтандарт HTTP не устанавливает универсальный жёсткий предел длины URL. RFC 9110 рекомендует клиентам и серверам поддерживать URI длиной как минимум **8000 октетов**, но это требование совместимости, а не гарантия, что любой URL такой длины пройдёт через конкретную инфраструктуру. \n\nВ HTTP/1.1 URL входит в строку запроса:\n\n```text\nGET /products?category=books HTTP/1.1\n```\n\nОна включает:\n\n```text\nметод + пробел + request-target + пробел + версия HTTP\n```\n\nПоэтому лимит строки запроса не полностью принадлежит самому URL. При слишком длинном request target сервер должен вернуть:\n\n```text\n414 URI Too Long\n```\n\nRFC 9112 рекомендует поддержку строки запроса размером минимум 8000 октетов. \n\n### Практические лимиты\n\nРеальный предел определяется самым строгим компонентом цепочки:\n\n```text\nбраузер или HTTP-клиент\n        ↓\nCDN / WAF\n        ↓\nreverse proxy\n        ↓\nвеб-сервер\n        ↓\nприложение\n```\n\nНапример:\n\n- Apache HTTP Server по умолчанию ограничивает request line значением `8190` байт через `LimitRequestLine`;\n    \n- Nginx по умолчанию использует буфер `8K` для одной длинной строки запроса; при превышении возвращает `414`. \n    \n\nПоэтому утверждение «максимальная длина URL всегда равна 2048 символам» неверно. Универсального лимита в 2048 символов нет.\n\nВажно: ограничения обычно измеряются в **байтах или октетах**, а не в количестве видимых символов.\n\n### 2. Не все символы можно передавать напрямую\n\nБез дополнительного кодирования безопасно используются так называемые `unreserved`-символы:\n\n```text\nA-Z\na-z\n0-9\n- . _ ~\n```\n\nСтандарт также определяет зарезервированные символы:\n\n```text\n: / ? # [ ] @\n! $ & ' ( ) * + , ; =\n```\n\nОни могут выполнять роль разделителей. Когда такой символ должен быть частью значения, а не разделителем, его нужно percent-encode. \nПримеры:\n\n```text\nпробел → %20\n?      → %3F\n&      → %26\n#      → %23\n%      → %25\n```\n\nНапример, значение:\n\n```text\nPython?FastAPI&Django\n```\n\nпередаётся так:\n\n```text\n/search?q=Python%3FFastAPI%26Django\n```\n\nPercent-encoding представляет один байт тремя символами: `%` и двумя шестнадцатеричными цифрами. Поэтому после кодирования URL может стать значительно длиннее. \n\n### 3. Пробелы запрещены в request target\n\nТакой запрос некорректен:\n\n```text\nGET /search?q=python api HTTP/1.1\n```\n\nПробел разделяет части HTTP request line, поэтому его необходимо закодировать:\n\n```text\nGET /search?q=python%20api HTTP/1.1\n```\n\nRFC 9112 прямо запрещает пробельные символы в request target. \n\nНа практике query-параметры следует формировать средствами HTTP-клиента:\n\n```python\nresponse = httpx.get(\n    \"https://api.example.com/search\",\n    params={\n        \"q\": \"python api\",\n        \"filter\": \"price<100\",\n    },\n)\n```\n\nА не конкатенацией строк:\n\n```python\nurl = f\"/search?q={query}\"\n```\n\n### 4. Unicode увеличивает фактическую длину\n\nКириллица и другие не-ASCII-символы в URI обычно преобразуются в UTF-8, после чего отдельные байты кодируются через percent-encoding.\n\nНапример, слово:\n\n```text\nкот\n```\n\nможет быть представлено как:\n\n```text\n%D0%BA%D0%BE%D1%82\n```\n\nТри видимых символа превращаются в 18 ASCII-символов URL. RFC 3986 описывает передачу не-ASCII-символов через UTF-8 и percent-encoding. \n\n### 5. Fragment не передаётся серверу\n\nЧасть после `#` называется fragment:\n\n```text\nhttps://example.com/articles/10?page=2#comments\n                                      └───────\n```\n\nБраузер отправит серверу только:\n\n```text\nGET /articles/10?page=2 HTTP/1.1\n```\n\nЗначение:\n\n```text\n#comments\n```\n\nостаётся на стороне клиента и обычно используется браузером или JavaScript. Fragment отделяется до выполнения HTTP-запроса и не включается в request target. \n\nСледовательно, fragment нельзя использовать как обычный параметр серверного API.\n\n### 6. Path и query могут быть регистрозависимыми\n\nДоменное имя обычно сравнивается без учёта регистра:\n\n```text\nEXAMPLE.COM\nexample.com\n```\n\nНо path и query могут обрабатываться приложением с учётом регистра:\n\n```text\n/users\n/Users\n```\n\n```text\n?status=active\n?status=ACTIVE\n```\n\nСчитать их одинаковыми можно только тогда, когда это явно определено контрактом конкретного API.\n\n### 7. В URL не следует передавать секреты\n\nНежелательно:\n\n```text\n/login?password=secret\n/profile?access_token=eyJ...\n```\n\nURI могут попадать в:\n\n- журналы серверов и прокси;\n    \n- историю браузера;\n    \n- закладки;\n    \n- аналитику;\n    \n- интерфейсы мониторинга;\n    \n- сообщения об ошибках.\n    \n\nRFC 9110 прямо указывает, что URI предназначены для передачи и отображения, а не для безопасного хранения секретной информации. \n\nТокены передают в заголовке:\n\n```text\nAuthorization: Bearer <access-token>\n```\n\nПароли — в теле HTTPS-запроса:\n\n```text\nPOST /auth/login\nContent-Type: application/json\n\n{\n  \"username\": \"alfob\",\n  \"password\": \"secret\"\n}\n```\n\n### 8. Слишком сложные данные не стоит помещать в query string\n\nДля обычной фильтрации URL подходит:\n\n```text\nGET /products?category=books&limit=20&offset=40\n```\n\nДля большого вложенного набора фильтров лучше использовать тело запроса:\n\n```text\nPOST /products/search\nContent-Type: application/json\n\n{\n  \"categories\": [\"books\", \"education\"],\n  \"price\": {\n    \"from\": 10,\n    \"to\": 100\n  },\n  \"authors\": [15, 27, 42]\n}\n```\n\nЭто позволяет не зависеть от ограничений длины request target и не создавать трудно читаемый URL.\n\n### Итог\n\nОсновные ограничения URL:\n\n```text\nНет единого универсального максимума\nФактический лимит задают клиенты, прокси и серверы\nДлина обычно считается в байтах\nСлужебные символы требуют percent-encoding\nПробелы нельзя передавать напрямую\nUnicode может сильно увеличить длину\nFragment после # не отправляется серверу\nСекретные данные нельзя помещать в URL\n```\n\nДля API практично сохранять URL короче нескольких килобайт, использовать query для небольших параметров фильтрации, а большие и сложные структуры передавать в теле запроса."
  popularity = 2.63

