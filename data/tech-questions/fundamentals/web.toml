  id = 23
  question = "Что произойдёт, если клиент отправит слишком большое тело запроса?"
  answer = "### Основной результат\n\nЕсли тело запроса превышает установленный лимит, сервер или промежуточный компонент обычно отклоняет запрос со статусом:\n\n```text\nHTTP/1.1 413 Content Too Large\nContent-Type: application/json\n\n{\n  \"detail\": \"Request body is too large\"\n}\n```\n\n`413 Content Too Large` означает, что сервер не хочет или не способен обработать содержимое такого размера. Сервер также может прекратить приём тела или закрыть соединение. Старые названия этого статуса — `Payload Too Large` и `Request Entity Too Large`; код остаётся тем же — `413`. \n\n### Где может сработать ограничение\n\nЗапрос обычно проходит через несколько компонентов:\n\n```text\nКлиент\n  ↓\nCDN / WAF\n  ↓\nReverse proxy\n  ↓\nВеб-сервер\n  ↓\nASGI/WSGI-сервер\n  ↓\nПриложение\n```\n\nОграничение может быть установлено на любом уровне. Запрос отклонит первый компонент, лимит которого окажется меньше размера тела.\n\nНапример:\n\n```text\nCDN:          100 МБ\nNginx:         10 МБ\nПриложение:     5 МБ\n```\n\nТело размером `8 МБ` пройдёт через Nginx, но будет отклонено приложением. Тело размером `20 МБ` отклонит уже Nginx, и до приложения запрос не дойдёт.\n\nВ Nginx размер тела ограничивается директивой `client_max_body_size`; при превышении лимита сервер возвращает `413`. В Apache аналогичное ограничение может задаваться через `LimitRequestBody`. \n\n### Если присутствует Content-Length\n\nКлиент может заранее сообщить размер тела:\n\n```text\nPOST /files HTTP/1.1\nContent-Type: application/octet-stream\nContent-Length: 52428800\n```\n\nЕсли разрешено только `10 МБ`, сервер может определить превышение по заголовку ещё до чтения всего тела:\n\n```text\nContent-Length: 50 МБ\nЛимит:          10 МБ\n                ↓\n              413\n```\n\nНо полагаться только на `Content-Length` нельзя:\n\n- заголовок может отсутствовать;\n    \n- тело может передаваться потоком;\n    \n- клиентские данные нельзя считать доверенными;\n    \n- фактически принятый объём всё равно необходимо контролировать во время чтения.\n    \n\n### Если размер заранее неизвестен\n\nПри потоковой передаче сервер может узнать реальный размер только по мере чтения:\n\n```text\nполучено 1 МБ\nполучено 5 МБ\nполучено 10 МБ\nполучено 10 МБ + 1 байт\n          ↓\n         413\n```\n\nВ таком случае часть данных уже могла пройти по сети и временно попасть в память или файл, прежде чем сервер обнаружит превышение.\n\n### Что происходит с обработчиком приложения\n\nЕсли лимит проверяет reverse proxy:\n\n```text\nКлиент → Nginx → 413\n                  X\n               FastAPI\n```\n\nEndpoint FastAPI обычно вообще не будет вызван.\n\nЕсли ограничение реализовано внутри приложения:\n\n```text\nКлиент → Nginx → FastAPI middleware → 413\n```\n\nприложение должно остановить чтение и обработку тела сразу после превышения лимита.\n\n### Почему большие тела опасны\n\nЕсли приложение без ограничений полностью загружает тело:\n\n```python\nbody = await request.body()\n```\n\nбольшой запрос может привести к:\n\n- чрезмерному потреблению оперативной памяти;\n    \n- заполнению временного диска;\n    \n- длительному удержанию соединений;\n    \n- загрузке процессора при разборе большого JSON;\n    \n- блокировке обработчиков;\n    \n- отказу в обслуживании при множестве параллельных запросов.\n    \n\nОсобенно опасна схема:\n\n```text\n100 клиентов × 100 МБ\n= до 10 ГБ входящих данных\n```\n\nПоэтому лимит лучше устанавливать до бизнес-логики — на CDN, reverse proxy или middleware.\n\n### Большой JSON и большой файл обрабатываются по-разному\n\n#### JSON\n\nJSON обычно требуется полностью прочитать и разобрать:\n\n```text\nPOST /payments\nContent-Type: application/json\n```\n\n```json\n{\n  \"payments\": [...]\n}\n```\n\nБольшой JSON создаёт нагрузку не только на сеть, но и на:\n\n- память;\n    \n- JSON-десериализацию;\n    \n- валидацию;\n    \n- создание большого количества Python-объектов.\n    \n\nДля массовых операций разумнее ограничивать одновременно:\n\n```text\nмаксимальный размер тела\n+ максимальное количество объектов\n+ глубину вложенности\n+ длину отдельных строк\n```\n\n#### Файлы\n\nФайл лучше читать частями:\n\n```python\nwhile chunk := await file.read(1024 * 1024):\n    total_size += len(chunk)\n\n    if total_size > MAX_SIZE:\n        raise HTTPException(status_code=413)\n```\n\nТак приложение не обязано держать весь файл в памяти.\n\nДля крупных файлов часто используют:\n\n```text\nmultipart upload\nпрямую загрузку в S3/MinIO\nпредподписанный URL\nразбиение файла на части\n```\n\n### Может ли сервер закрыть соединение\n\nДа. RFC разрешает серверу после определения чрезмерного размера прекратить запрос или закрыть соединение, если это требуется используемой версией протокола и реализацией. Поэтому клиент иногда может получить не красивый JSON с ошибкой, а сетевое исключение или сброс соединения. \n### Нужно ли повторять запрос\n\nОбычно простое повторение того же запроса бессмысленно:\n\n```text\nтело 20 МБ\nлимит 10 МБ\nповтор → снова 413\n```\n\nКлиент должен:\n\n- уменьшить объём данных;\n    \n- разбить запрос на части;\n    \n- загрузить файл другим предусмотренным способом;\n    \n- использовать endpoint для пакетной или multipart-загрузки.\n    \n\nЕсли ограничение временное, сервер может вернуть:\n\n```text\nHTTP/1.1 413 Content Too Large\nRetry-After: 3600\n```\n\nRFC рекомендует использовать `Retry-After`, когда невозможность обработать такой размер носит временный характер. \n\n### Не следует возвращать 400 или 422\n\nДля превышения допустимого размера корректный статус:\n\n```text\n413 Content Too Large\n```\n\nДругие статусы обозначают иные проблемы:\n\n```text\n400 → запрос синтаксически некорректен\n415 → неподдерживаемый Content-Type\n422 → формат понятен, но содержимое не прошло обработку\n413 → содержимое слишком большое\n```\n\n### Практичная защита\n\n```text\nCDN/WAF:\n    общий внешний лимит\n\nNginx:\n    client_max_body_size\n\nПриложение:\n    лимит для конкретного endpoint\n    контроль размера во время чтения\n    лимит количества объектов\n    потоковая обработка файлов\n\nХранилище:\n    квоты пользователя\n    лимит общего объёма\n```\n\nИтоговая последовательность:\n\n```text\nКлиент отправляет тело\n        ↓\nКомпонент сравнивает размер с лимитом\n        ↓\nРазмер допустим → запрос обрабатывается\nРазмер превышен → 413 Content Too Large\n                  + при необходимости прекращение передачи\n```"
  popularity = 2.63

[[questions]]
  id = 24
  question = "Что такое идемпотентность и какие HTTP-методы иденпотентны?"
  answer = "### Что такое идемпотентность\n\nHTTP-метод считается **идемпотентным**, если несколько одинаковых запросов оказывают на сервер **тот же предполагаемый эффект**, что и один такой запрос. Ответы при этом могут различаться. \n\nУсловно:\n\n```text\nодин запрос  → состояние S\nдесять таких же запросов → то же состояние S\n```\n\nНапример:\n\n```text\nDELETE /users/42\n```\n\nПервый запрос удаляет пользователя:\n\n```text\n204 No Content\n```\n\nПовторный запрос может вернуть:\n\n```text\n404 Not Found\n```\n\nОтветы разные, но итоговое состояние одинаковое:\n\n```text\nпользователя 42 не существует\n```\n\nСледовательно, `DELETE` идемпотентен.\n\n### Зачем нужна идемпотентность\n\nОна позволяет безопаснее повторить запрос после сетевого сбоя:\n\n```text\nКлиент отправил PUT\n        ↓\nСервер выполнил операцию\n        ↓\nОтвет потерялся из-за разрыва соединения\n        ↓\nКлиент повторяет тот же PUT\n```\n\nПоскольку `PUT` идемпотентен, повтор не должен приводить к дополнительному изменению состояния. Именно возможность автоматического повторения после ошибки связи является одной из основных причин выделения идемпотентных методов. \n\n### Идемпотентные HTTP-методы\n\nСреди основных методов:\n\n|Метод|Идемпотентен|Безопасен|\n|---|--:|--:|\n|`GET`|Да|Да|\n|`HEAD`|Да|Да|\n|`OPTIONS`|Да|Да|\n|`TRACE`|Да|Да|\n|`PUT`|Да|Нет|\n|`DELETE`|Да|Нет|\n|`POST`|Нет|Нет|\n|`PATCH`|Нет по умолчанию|Нет|\n|`CONNECT`|Нет|Нет|\n\nRFC 9110 определяет как идемпотентные `PUT`, `DELETE` и все безопасные методы. Актуальный реестр IANA также указывает свойства каждого зарегистрированного метода. \n\n### GET\n\n```text\nGET /users/42\n```\n\nПовторное чтение не должно изменять состояние ресурса:\n\n```text\nGET × 1   → пользователь прочитан\nGET × 100 → пользователь всё ещё только прочитан\n```\n\nДанные между запросами могут измениться из-за действий других клиентов, поэтому ответы не обязаны быть одинаковыми:\n\n```text\nGET в 12:00 → balance = 100\nGET в 12:05 → balance = 80\n```\n\nЭто не нарушает идемпотентность. Важно, что сам `GET` не запрашивает изменение состояния.\n\n### PUT\n\n`PUT` задаёт желаемое состояние ресурса по известному URI:\n\n```text\nPUT /users/42\nContent-Type: application/json\n\n{\n  \"username\": \"new_name\",\n  \"active\": true\n}\n```\n\nПовторение того же запроса:\n\n```text\nPUT × 1   → username = new_name\nPUT × 10  → username = new_name\n```\n\nПоэтому `PUT` идемпотентен.\n\nНо такая операция через `PUT` идемпотентной не будет:\n\n```text\nPUT /users/42/increment-login-count\n```\n\n```text\nкаждый запрос → login_count + 1\n```\n\nЭто противоречит стандартной семантике `PUT`: проблема находится в проектировании endpoint, а не в самом HTTP.\n\n### DELETE\n\n```text\nDELETE /files/42\n```\n\nПервый запрос удаляет файл, последующие оставляют его удалённым:\n\n```text\nDELETE × 1  → файла нет\nDELETE × 10 → файла нет\n```\n\nПобочные действия вроде новой записи в журнале на каждый запрос не делают метод неидемпотентным. Идемпотентность относится к предполагаемому эффекту, который запросил клиент, а не ко всем внутренним техническим действиям сервера. \n\n### POST\n\n`POST` по стандартной семантике не считается идемпотентным:\n\n```text\nPOST /orders\nContent-Type: application/json\n\n{\n  \"product_id\": 15,\n  \"quantity\": 2\n}\n```\n\nПовторение может создать несколько заказов:\n\n```text\nPOST × 1 → заказ 1001\nPOST × 2 → заказ 1002\nPOST × 3 → заказ 1003\n```\n\nОсобенно опасны автоматические повторы операций:\n\n```text\nPOST /payments\n```\n\nПервый запрос мог создать платёж, но клиент не получил ответ. Повтор может создать второй платёж.\n\n`POST` можно сделать идемпотентным на уровне приложения, например через ключ операции:\n\n```text\nPOST /payments\nIdempotency-Key: 8715f428-6a31-45c1-a752-e2e739c91763\nContent-Type: application/json\n\n{\n  \"amount\": 100\n}\n```\n\nСервер сохраняет ключ и при повторном запросе не создаёт второй платёж:\n\n```text\nодин Idempotency-Key → одна бизнес-операция\n```\n\nНо наличие такого механизма не превращает сам метод `POST` в идемпотентный по стандартной HTTP-семантике.\n\n### PATCH\n\n`PATCH` не считается идемпотентным по умолчанию, поскольку результат зависит от формата изменения.\n\nИдемпотентный вариант:\n\n```text\nPATCH /users/42\nContent-Type: application/merge-patch+json\n\n{\n  \"active\": false\n}\n```\n\nПовторная установка `false` оставляет то же состояние.\n\nНеидемпотентный вариант:\n\n```text\nPATCH /accounts/42\nContent-Type: application/json\n\n{\n  \"operation\": \"increment\",\n  \"amount\": 10\n}\n```\n\n```text\nPATCH × 1 → balance + 10\nPATCH × 2 → balance + 20\n```\n\nПоэтому конкретный `PATCH` можно спроектировать идемпотентным, но клиент не должен считать любой `PATCH` безопасным для автоматического повторения. В реестре IANA `PATCH` обозначен как неидемпотентный метод. \n\n### Безопасность и идемпотентность — не одно и то же\n\n**Безопасный метод** не запрашивает изменение состояния сервера.\n\n```text\nБезопасный → только чтение по смыслу\nИдемпотентный → повтор не меняет конечный эффект\n```\n\nВсе безопасные методы идемпотентны:\n\n```text\nGET\nHEAD\nOPTIONS\nTRACE\n```\n\nНо не все идемпотентные методы безопасны:\n\n```text\nPUT    → изменяет ресурс\nDELETE → удаляет ресурс\n```\n\nТо есть:\n\n```text\nбезопасный ⊂ идемпотентный\n```\n\n### Новый метод QUERY\n\nВ июне 2026 года в реестре IANA появился стандартизированный метод `QUERY`. Он определён как безопасный и идемпотентный, но пока значительно менее распространён в клиентах, прокси и веб-фреймворках, чем `GET` или `POST`. \n\n### Главное\n\n```text\nИдемпотентные:\nGET, HEAD, OPTIONS, TRACE, PUT, DELETE\n```\n\n```text\nНеидемпотентные по стандартной семантике:\nPOST, PATCH, CONNECT\n```\n\nИдемпотентность означает не одинаковый HTTP-ответ, а одинаковый **предполагаемый конечный эффект на сервере** при повторении идентичного запроса."
  popularity = 5.26

[[questions]]
  id = 25
  question = "TCP vs UDP"
  answer = "### Основное различие\n\n**TCP** и **UDP** — транспортные протоколы, работающие поверх IP.\n\n- **TCP** предоставляет надёжный упорядоченный поток байтов с установлением соединения.\n    \n- **UDP** передаёт отдельные сообщения — датаграммы — без установления соединения и без встроенных гарантий доставки, порядка или защиты от дубликатов. \n### Сравнение\n\n|Характеристика|TCP|UDP|\n|---|---|---|\n|Тип взаимодействия|С установлением соединения|Без установления соединения|\n|Модель данных|Непрерывный поток байтов|Отдельные датаграммы|\n|Гарантия доставки|Есть повторная передача потерянных данных|Нет|\n|Порядок данных|Восстанавливает правильный порядок|Пакеты могут прийти в любом порядке|\n|Защита от дубликатов|Есть|Нет|\n|Контроль потока|Есть|Нет на уровне UDP|\n|Контроль перегрузки|Есть|Должен реализовываться приложением или протоколом поверх UDP|\n|Накладные расходы|Выше|Ниже|\n|Границы сообщений|Не сохраняются|Сохраняются|\n|Broadcast и multicast|Не поддерживаются напрямую|Поддерживаются|\n\n### Как работает TCP\n\nПеред передачей данных TCP устанавливает логическое соединение через трёхэтапное рукопожатие:\n\n```text\nКлиент                          Сервер\n   │──── SYN ─────────────────────>│\n   │<─── SYN + ACK ────────────────│\n   │──── ACK ─────────────────────>│\n   │                               │\n   │──── данные ──────────────────>│\n```\n\nПосле этого TCP:\n\n1. нумерует передаваемые байты;\n    \n2. получает подтверждения `ACK`;\n    \n3. повторно отправляет потерянные сегменты;\n    \n4. восстанавливает правильный порядок;\n    \n5. регулирует скорость передачи;\n    \n6. предотвращает переполнение принимающей стороны.\n    \n\nTCP представляет данные приложению как непрерывный упорядоченный поток байтов. \n\nНапример, отправитель выполнил:\n\n```text\nsend(\"Hello\")\nsend(\"World\")\n```\n\nПолучатель не обязан получить два отдельных сообщения. Он может прочитать:\n\n```text\n\"HelloWorld\"\n```\n\nили:\n\n```text\n\"Hel\"\n\"loWorld\"\n```\n\nПоэтому прикладной протокол поверх TCP должен самостоятельно определять границы сообщений — например, через длину, разделитель или структуру HTTP.\n\n### Как работает UDP\n\nUDP не устанавливает соединение перед отправкой:\n\n```text\nКлиент                          Сервер\n   │──── датаграмма 1 ────────────>│\n   │──── датаграмма 2 ────────────>│\n   │──── датаграмма 3 ────────────>│\n```\n\nОтправитель просто передаёт датаграмму на IP-адрес и порт. UDP не гарантирует, что она:\n\n- дойдёт;\n    \n- придёт один раз;\n    \n- придёт раньше следующей;\n    \n- не будет отброшена сетью.\n    \n\nПри этом границы сообщений сохраняются: одна отправленная UDP-датаграмма принимается как одна датаграмма, если она вообще дошла. RFC 768 определяет UDP как минимальный датаграммный механизм без гарантий доставки и защиты от дубликатов. \n\nПример:\n\n```text\nОтправлено:  [1] [2] [3] [4]\nПолучено:    [1] [3] [4]\n```\n\nUDP самостоятельно не запросит повторную отправку `[2]`.\n\n### Почему TCP надёжнее\n\nДопустим, сегмент потерялся:\n\n```text\nОтправитель: 1 2 3 4 5\nПолучатель:  1 2 _ 4 5\n```\n\nВ TCP получатель подтверждает принятые данные, а отправитель повторно передаёт отсутствующий диапазон:\n\n```text\nповторная передача → 3\nрезультат          → 1 2 3 4 5\n```\n\nКроме того, TCP скрывает от приложения перестановку сегментов и предоставляет данные в правильной последовательности. \n\nОднако TCP гарантирует доставку данных транспортному уровню другой стороны, пока соединение остаётся работоспособным. Он не гарантирует, что бизнес-операция была успешно выполнена:\n\n```text\nTCP доставил запрос\n        ≠\nплатёж успешно записан в базу\n```\n\nПодтверждение бизнес-операции должно обеспечивать само приложение.\n\n### Почему UDP считают быстрее\n\nUDP имеет меньше служебной логики:\n\n- нет предварительного TCP-рукопожатия;\n    \n- нет обязательных подтверждений;\n    \n- нет встроенных повторных передач;\n    \n- нет восстановления общего порядка;\n    \n- заголовок UDP компактнее.\n    \n\nПоэтому UDP может иметь меньшую задержку и меньшие накладные расходы. Но формулировка «UDP всегда быстрее TCP» неверна: результат зависит от качества сети, реализации приложения и протокола поверх UDP.\n\nПри потере данных приложение может самостоятельно реализовать:\n\n```text\nподтверждения\nповторные передачи\nнумерацию\nконтроль перегрузки\nшифрование\n```\n\nВ этом случае часть сложности TCP фактически создаётся заново. Рекомендации IETF требуют, чтобы приложения поверх UDP учитывали перегрузку сети и не отправляли данные бесконтрольно. \n\n### Когда используют TCP\n\nTCP подходит, когда данные должны прийти полностью и в правильном порядке:\n\n```text\nHTTP/1.1 и HTTP/2\nHTTPS поверх TCP\nSSH\nSMTP\nIMAP\nFTP\nподключения к базам данных\nпередача файлов\n```\n\nНапример, при скачивании архива потеря нескольких байтов недопустима:\n\n```text\nоригинал:  100 МБ\nполучено:  99,99 МБ\nрезультат: повреждённый файл\n```\n\n### Когда используют UDP\n\nUDP подходит, когда важнее минимальная задержка, а потерю некоторых данных можно принять или обработать на уровне приложения:\n\n```text\nголосовая связь\nвидеозвонки\nонлайн-игры\nDNS\nпотоковое мультимедиа\nтелеметрия\nbroadcast и multicast\n```\n\nНапример, в голосовом звонке пакет со звуком, задержавшийся на несколько секунд, уже не нужен:\n\n```text\nлучше пропустить короткий фрагмент\nчем воспроизвести его слишком поздно\n```\n\nНо конкретные современные протоколы поверх UDP могут самостоятельно обеспечивать надёжность, шифрование и контроль перегрузки.\n\n### QUIC и HTTP/3\n\nUDP не означает обязательное отсутствие надёжности на уровне всей системы.\n\n**QUIC** работает поверх UDP, но самостоятельно реализует:\n\n- соединения;\n    \n- надёжные потоки;\n    \n- подтверждения;\n    \n- повторную передачу;\n    \n- контроль потока;\n    \n- контроль перегрузки;\n    \n- встроенную криптографическую защиту.\n    \n\nHTTP/3 работает поверх QUIC, а QUIC — поверх UDP. \n\n```text\nHTTP/1.1 или HTTP/2\n        ↓\n       TCP\n        ↓\n        IP\n```\n\n```text\nHTTP/3\n   ↓\n QUIC\n   ↓\n  UDP\n   ↓\n   IP\n```\n\nТаким образом, UDP используется как минимальная транспортная основа, а необходимые гарантии реализует QUIC.\n\n### Главное\n\n```text\nTCP\n→ соединение\n→ поток байтов\n→ доставка и порядок\n→ повторная передача\n→ больше служебной логики\n```\n\n```text\nUDP\n→ отдельные датаграммы\n→ нет встроенных гарантий\n→ меньше накладных расходов\n→ контроль над надёжностью остаётся приложению\n```\n\nВыбор определяется не правилом «TCP медленный, UDP быстрый», а требованиями:\n\n```text\nданные должны обязательно и последовательно дойти → TCP\n\nважна минимальная задержка,\nа отдельные потери допустимы\nили надёжность реализуется выше → UDP\n```"
  popularity = 2.63

[[questions]]
  id = 26
  question = "Какие способы доставки сообщения с сервера на клиент вы знаете?"
  answer = "### Базовый вариант: HTTP request → HTTP response\n\nОбычно frontend сам отправляет запрос, а backend возвращает данные в HTTP-ответе:\n\n```text\nFrontend ── HTTP request ──> Backend\nFrontend <─ HTTP response ── Backend\n```\n\nHTTP работает по модели «запрос — ответ»: сервер формирует ответ на конкретный запрос клиента. Ответ содержит статус, заголовки и необязательное тело. \n\nПример:\n\n```text\nGET /api/users/42 HTTP/1.1\nHost: example.com\nAccept: application/json\n```\n\nОтвет backend:\n\n```text\nHTTP/1.1 200 OK\nContent-Type: application/json\n\n{\n  \"id\": 42,\n  \"username\": \"alfob\"\n}\n```\n\nFrontend получает его через `fetch()`:\n\n```javascript\nconst response = await fetch(\"/api/users/42\");\n\nif (!response.ok) {\n    throw new Error(`HTTP error: ${response.status}`);\n}\n\nconst user = await response.json();\n\nconsole.log(user.username);\n```\n\n`fetch()` возвращает объект `Response`, из которого frontend читает статус, заголовки и тело, например через `json()`, `text()`, `blob()` или поток `body`. \n\nВ FastAPI обычный ответ может выглядеть так:\n\n```python\nfrom fastapi import FastAPI\n\napp = FastAPI()\n\n\n@app.get(\"/api/users/{user_id}\")\nasync def get_user(user_id: int) -> dict:\n    return {\n        \"id\": user_id,\n        \"username\": \"alfob\",\n    }\n```\n\nFastAPI сериализует словарь в JSON и формирует HTTP-ответ.\n\n---\n\n### Способы доставки обновлений с сервера\n\nКогда сервер должен сообщать клиенту о событиях, возникших после первоначальной загрузки страницы, применяют несколько подходов:\n\n```text\nОбычный HTTP-ответ\nPolling\nLong polling\nHTTP streaming\nSSE\nWebSocket\nWeb Push\n```\n\n### 1. Обычный HTTP-запрос\n\nFrontend запрашивает данные только тогда, когда они нужны:\n\n```text\nпользователь открыл страницу\n        ↓\nGET /api/orders\n        ↓\nbackend вернул список заказов\n```\n\nПодходит для:\n\n- загрузки страниц;\n    \n- CRUD-операций;\n    \n- получения профиля;\n    \n- отправки форм;\n    \n- обычных REST API.\n    \n\nЭто основной способ взаимодействия frontend и backend.\n\n---\n\n### 2. Polling — периодический опрос\n\nFrontend через определённый интервал повторяет запрос:\n\n```text\nGET /notifications\n        ↓\nчерез 5 секунд\n        ↓\nGET /notifications\n        ↓\nчерез 5 секунд\n        ↓\nGET /notifications\n```\n\nПример:\n\n```javascript\nsetInterval(async () => {\n    const response = await fetch(\"/api/notifications\");\n    const notifications = await response.json();\n\n    renderNotifications(notifications);\n}, 5000);\n```\n\nПреимущества:\n\n- простая реализация;\n    \n- работает через обычный HTTP;\n    \n- легко поддерживается прокси и балансировщиками.\n    \n\nНедостатки:\n\n- много запросов без новых данных;\n    \n- обновление приходит с задержкой до следующего опроса;\n    \n- лишняя нагрузка на backend и сеть.\n    \n\nPolling подходит, когда обновления редкие и небольшая задержка допустима.\n\n---\n\n### 3. Long polling — длинный опрос\n\nКлиент отправляет запрос, но сервер не отвечает сразу. Он удерживает запрос открытым до появления события или истечения timeout:\n\n```text\nClient ── GET /events ──> Server\n                            │\n                         ожидание\n                            │\nClient <── новое событие ───┘\n```\n\nПосле получения ответа клиент сразу создаёт новый запрос:\n\n```text\nзапрос\n→ ожидание\n→ ответ\n→ новый запрос\n→ ожидание\n→ ответ\n```\n\nRFC 6202 описывает long polling как механизм, при котором для каждого клиента удерживаются открытыми HTTP-запрос и сетевое соединение. \nПреимущества:\n\n- событие приходит почти сразу;\n    \n- совместимость с обычной HTTP-инфраструктурой.\n    \n\nНедостатки:\n\n- постоянное создание новых запросов;\n    \n- открытые соединения занимают ресурсы;\n    \n- сложнее масштабировать, чем обычный polling;\n    \n- возможны timeout со стороны прокси.\n    \n\n---\n\n### 4. HTTP streaming\n\nСервер отправляет один HTTP-ответ частями, не закрывая его после первого блока данных:\n\n```text\nClient ── GET /stream ──> Server\nClient <── chunk 1 ────── Server\nClient <── chunk 2 ────── Server\nClient <── chunk 3 ────── Server\n```\n\nFrontend может читать тело по мере поступления:\n\n```javascript\nconst response = await fetch(\"/api/stream\");\nconst reader = response.body.getReader();\nconst decoder = new TextDecoder();\n\nwhile (true) {\n    const { value, done } = await reader.read();\n\n    if (done) {\n        break;\n    }\n\n    console.log(decoder.decode(value));\n}\n```\n\nТело `Response` доступно как `ReadableStream`, поэтому клиент может обрабатывать данные постепенно, не дожидаясь полной загрузки ответа.\n\nИспользуется для:\n\n- потоковой генерации текста;\n    \n- больших файлов;\n    \n- журналов выполнения;\n    \n- прогресса длительной задачи;\n    \n- постепенно формируемых результатов.\n    \n\n---\n\n### 5. SSE — Server-Sent Events\n\nSSE позволяет серверу отправлять клиенту последовательность текстовых событий по одному длительному HTTP-соединению:\n\n```text\nFrontend ── открывает EventSource ──> Backend\nFrontend <── event 1 ─────────────── Backend\nFrontend <── event 2 ─────────────── Backend\nFrontend <── event 3 ─────────────── Backend\n```\n\nFrontend:\n\n```javascript\nconst source = new EventSource(\"/api/events\");\n\nsource.onmessage = (event) => {\n    const data = JSON.parse(event.data);\n    console.log(data);\n};\n```\n\nBackend должен возвращать:\n\n```text\nContent-Type: text/event-stream\n```\n\nФормат события:\n\n```text\nevent: notification\ndata: {\"message\": \"New notification\"}\n\n```\n\nSSE является односторонним каналом: сервер отправляет события клиенту, но клиент не отправляет сообщения серверу через то же соединение. Для клиентских команд используются обычные HTTP-запросы. \n\nПодходит для:\n\n- уведомлений;\n    \n- статуса выполнения задачи;\n    \n- новостных лент;\n    \n- логов;\n    \n- обновления котировок;\n    \n- генерации текста по частям.\n    \n\nПреимущества:\n\n- работает поверх обычного HTTP;\n    \n- браузер автоматически переподключается;\n    \n- проще WebSocket для односторонних обновлений;\n    \n- текстовый формат событий.\n    \n\nНедостатки:\n\n- только сервер → клиент;\n    \n- в основном текстовые данные;\n    \n- длительные соединения необходимо учитывать при масштабировании.\n    \n\n---\n\n### 6. WebSocket\n\nWebSocket создаёт постоянный двусторонний канал:\n\n```text\nFrontend <──────────────> Backend\n         сообщения в обе стороны\n```\n\nFrontend:\n\n```javascript\nconst socket = new WebSocket(\"wss://example.com/ws\");\n\nsocket.addEventListener(\"open\", () => {\n    socket.send(\n        JSON.stringify({\n            type: \"subscribe\",\n            channel: \"notifications\",\n        }),\n    );\n});\n\nsocket.addEventListener(\"message\", (event) => {\n    const message = JSON.parse(event.data);\n    console.log(message);\n});\n```\n\nWebSocket позволяет браузеру и серверу отправлять сообщения друг другу через одно установленное соединение. \n\nПодходит для:\n\n- чатов;\n    \n- многопользовательских игр;\n    \n- совместного редактирования;\n    \n- торговых терминалов;\n    \n- двусторонней телеметрии;\n    \n- интерактивных приложений реального времени.\n    \n\nПреимущества:\n\n- двусторонний обмен;\n    \n- низкая задержка после установления соединения;\n    \n- меньше накладных расходов на повторные HTTP-запросы;\n    \n- поддержка текстовых и бинарных сообщений.\n    \n\nНедостатки:\n\n- сложнее реализация;\n    \n- нужно обрабатывать переподключение;\n    \n- требуются heartbeat или ping/pong;\n    \n- сложнее балансировка и масштабирование;\n    \n- необходимо хранить состояние активных соединений.\n    \n\n---\n\n### 7. Web Push\n\nWeb Push применяется, когда сервер должен доставить уведомление браузеру даже при отсутствии открытой вкладки сайта:\n\n```text\nBackend\n   ↓\nPush service браузера\n   ↓\nService Worker\n   ↓\nСистемное уведомление\n```\n\nСначала пользователь предоставляет разрешение, браузер создаёт подписку, а backend отправляет сообщение через push-сервис. Web Push стандартизирует доставку событий через посредника — push service. \n\nПодходит для:\n\n- уведомлений о новом сообщении;\n    \n- напоминаний;\n    \n- уведомлений о заказах;\n    \n- событий, которые важны при закрытом сайте.\n    \n\nЭто не замена REST API или WebSocket. Push-сообщение часто только уведомляет frontend, после чего приложение запрашивает актуальные данные через обычный HTTP API.\n\n---\n\n### Сравнение\n\n|Способ|Кто инициирует получение|Направление|Постоянное соединение|Типичный сценарий|\n|---|---|---|--:|---|\n|HTTP response|Клиент|Сервер → клиент|Нет|CRUD и загрузка данных|\n|Polling|Клиент периодически|Сервер → клиент|Нет|Редкие обновления|\n|Long polling|Клиент|Сервер → клиент|Временно|Почти real-time без WebSocket|\n|HTTP streaming|Клиент|Сервер → клиент|Да|Потоковые результаты|\n|SSE|Клиент открывает канал|Сервер → клиент|Да|События и уведомления|\n|WebSocket|Клиент устанавливает канал|В обе стороны|Да|Чат и real-time|\n|Web Push|Backend через push service|Сервер → браузер|Не требуется открытая вкладка|Системные уведомления|\n\n### Что обычно выбирают\n\n```text\nОбычный CRUD API\n→ HTTP request/response\n\nОбновление раз в несколько секунд\n→ polling\n\nОдносторонние события в реальном времени\n→ SSE\n\nИнтерактивный обмен в обе стороны\n→ WebSocket\n\nБольшой или постепенно формируемый ответ\n→ HTTP streaming\n\nУведомление при закрытом сайте\n→ Web Push\n```\n\nГлавное различие:\n\n```text\nОбычный HTTP:\nклиент запросил → сервер ответил\n\nSSE / streaming:\nклиент один раз открыл запрос → сервер постепенно отправляет данные\n\nWebSocket:\nклиент установил соединение → обе стороны могут отправлять сообщения\n\nWeb Push:\nсообщение доставляется через инфраструктуру push-сервиса\n```"
  popularity = 5.26

