  id = 29
  question = "Как бы вы валидировали данные, которые пришли от пользователя?"
  answer = "### Основной принцип\n\nВсе данные, пришедшие извне, считаются недоверенными:\n\n```text\nJSON body\nquery parameters\npath parameters\nheaders\ncookies\nфайлы\nданные WebSocket\nсообщения из очереди\nответы сторонних API\n```\n\nFrontend-валидация нужна для удобства пользователя, но backend обязан валидировать данные повторно, потому что клиент может вызвать API напрямую.\n\n```text\nFrontend validation → удобный UX\nBackend validation  → защита и целостность данных\n```\n\n### Уровни валидации\n\nЯ бы разделял проверку на несколько уровней:\n\n```text\nHTTP-запрос\n    ↓\n1. Ограничения транспорта\n    ↓\n2. Проверка структуры и типов\n    ↓\n3. Проверка отдельных значений\n    ↓\n4. Проверка взаимосвязанных полей\n    ↓\n5. Проверка бизнес-правил\n    ↓\n6. Ограничения базы данных\n```\n\n### 1. Проверка самого запроса\n\nДо разбора бизнес-данных нужно проверить:\n\n- допустимый `Content-Type`;\n    \n- размер тела;\n    \n- максимальный размер файла;\n    \n- допустимую кодировку;\n    \n- количество элементов в batch;\n    \n- глубину вложенности JSON;\n    \n- наличие обязательных заголовков.\n    \n\nНапример:\n\n```text\nPOST /payments\nContent-Type: application/json\nContent-Length: 52428800\n```\n\nПри лимите `5 МБ` запрос следует отклонить до полного разбора:\n\n```text\nHTTP/1.1 413 Content Too Large\n```\n\nЕсли endpoint принимает только JSON, неподдерживаемый формат можно отклонить:\n\n```text\nHTTP/1.1 415 Unsupported Media Type\n```\n\n### 2. Проверка структуры и типов\n\nНужно проверить:\n\n- обязательные поля;\n    \n- тип каждого поля;\n    \n- вложенную структуру;\n    \n- структуру массивов;\n    \n- отсутствие неизвестных полей;\n    \n- допустимость `null`.\n    \n\nПример ожидаемого тела:\n\n```json\n{\n  \"product_id\": 42,\n  \"quantity\": 2,\n  \"comment\": \"Доставить вечером\"\n}\n```\n\nНекорректные варианты:\n\n```json\n{\n  \"product_id\": \"abc\",\n  \"quantity\": -5\n}\n```\n\n```json\n{\n  \"product_id\": 42,\n  \"quantity\": 2,\n  \"is_admin\": true\n}\n```\n\nНеизвестные поля лучше запрещать, особенно в командах создания и изменения данных.\n\n### Пример с FastAPI и Pydantic\n\n```python\nfrom typing import Annotated\n\nfrom fastapi import FastAPI\nfrom pydantic import BaseModel, ConfigDict, Field\n\napp = FastAPI()\n\n\nclass OrderCreate(BaseModel):\n    model_config = ConfigDict(\n        extra=\"forbid\",\n        str_strip_whitespace=True,\n    )\n\n    product_id: Annotated[int, Field(gt=0)]\n    quantity: Annotated[int, Field(ge=1, le=100)]\n    comment: Annotated[\n        str | None,\n        Field(max_length=500),\n    ] = None\n\n\n@app.post(\"/orders\", status_code=201)\nasync def create_order(data: OrderCreate):\n    return data\n```\n\nPydantic позволяет задавать ограничения полей через `Field`, писать пользовательские валидаторы и запрещать дополнительные поля через конфигурацию модели. FastAPI использует модели Pydantic для разбора и проверки тела запроса. \n\nЗапрос:\n\n```json\n{\n  \"product_id\": 42,\n  \"quantity\": 101\n}\n```\n\nне пройдёт, потому что `quantity` ограничено значением `100`.\n\n### 3. Проверка конкретных значений\n\nОдного типа недостаточно.\n\nНапример, значение может быть строкой, но всё равно быть недопустимым:\n\n```json\n{\n  \"username\": \"\",\n  \"email\": \"not-email\",\n  \"country\": \"unknown\",\n  \"password\": \"1\"\n}\n```\n\nНужно проверять:\n\n```text\nстроки:\n    минимальную и максимальную длину\n    допустимый формат\n    допустимый набор символов\n\nчисла:\n    минимальное и максимальное значение\n    точность\n    количество знаков после запятой\n\nсписки:\n    минимальное и максимальное количество элементов\n    уникальность элементов\n\nидентификаторы:\n    положительное значение\n    UUID/ULID-формат\n```\n\nПример:\n\n```python\nfrom typing import Annotated, Literal\n\nfrom pydantic import BaseModel, ConfigDict, EmailStr, Field\n\n\nclass UserCreate(BaseModel):\n    model_config = ConfigDict(extra=\"forbid\")\n\n    username: Annotated[\n        str,\n        Field(\n            min_length=3,\n            max_length=50,\n            pattern=r\"^[a-zA-Z0-9_]+$\",\n        ),\n    ]\n\n    email: EmailStr\n\n    password: Annotated[\n        str,\n        Field(min_length=12, max_length=128),\n    ]\n\n    language: Literal[\"ru\", \"en\", \"az\"] = \"ru\"\n```\n\nOWASP рекомендует проверять данные по допустимым типам, длине, диапазонам и форматам и по возможности использовать allowlist — явно разрешённый набор значений. \n\n### Allowlist предпочтительнее blocklist\n\nПлохо:\n\n```python\nif \"<script>\" in username:\n    reject()\n```\n\nПользователь может передать другой опасный вариант.\n\nНадёжнее описать, что разрешено:\n\n```python\npattern=r\"^[a-zA-Z0-9_]+$\"\n```\n\nНо allowlist нельзя применять бездумно. Например, имя человека может содержать:\n\n```text\nпробелы\nдефисы\nапострофы\nUnicode-символы\n```\n\nПоэтому ограничения должны соответствовать предметной области, а не выдумываться исключительно ради безопасности.\n\n### 4. Проверка связанных полей\n\nНекоторые данные нельзя проверить по одному полю.\n\nНапример:\n\n```json\n{\n  \"start_date\": \"2026-08-10\",\n  \"end_date\": \"2026-08-01\"\n}\n```\n\nКаждая дата сама по себе корректна, но их комбинация недопустима.\n\nВ Pydantic используется модельный валидатор:\n\n```python\nfrom datetime import date\nfrom typing import Self\n\nfrom pydantic import BaseModel, model_validator\n\n\nclass Period(BaseModel):\n    start_date: date\n    end_date: date\n\n    @model_validator(mode=\"after\")\n    def validate_period(self) -> Self:\n        if self.end_date < self.start_date:\n            raise ValueError(\n                \"end_date must not be earlier than start_date\",\n            )\n\n        return self\n```\n\nДругие примеры:\n\n```text\npassword == password_confirmation\nmin_price <= max_price\ndelivery_date >= current_date\ndiscount <= total_amount\n```\n\n### 5. Проверка бизнес-правил\n\nPydantic может проверить, что `product_id` — положительное число, но не может самостоятельно определить:\n\n- существует ли товар;\n    \n- доступен ли он для продажи;\n    \n- достаточно ли товара на складе;\n    \n- разрешено ли пользователю его покупать;\n    \n- не превышен ли дневной лимит.\n    \n\nЭто проверяется в service/use case:\n\n```python\nasync def create_order(\n    data: OrderCreate,\n    current_user: User,\n) -> Order:\n    product = await product_repository.get_by_id(\n        data.product_id,\n    )\n\n    if product is None:\n        raise ProductNotFoundError()\n\n    if not product.is_available:\n        raise ProductUnavailableError()\n\n    if product.stock < data.quantity:\n        raise InsufficientStockError()\n\n    if not current_user.can_order(product):\n        raise ForbiddenError()\n\n    return await order_repository.create(\n        user_id=current_user.id,\n        product_id=product.id,\n        quantity=data.quantity,\n    )\n```\n\nТо есть:\n\n```text\nPydantic:\n    данные имеют правильную форму\n\nБизнес-логика:\n    операцию действительно разрешено выполнить\n```\n\n### 6. Авторизация не является валидацией\n\nДопустим, frontend прислал:\n\n```json\n{\n  \"user_id\": 100,\n  \"file_id\": 42\n}\n```\n\nДаже если оба числа корректны, backend не должен доверять `user_id`.\n\nПользователь определяется из проверенной сессии или токена:\n\n```python\nfile = await file_repository.get_by_id_and_owner(\n    file_id=data.file_id,\n    owner_id=current_user.id,\n)\n```\n\nНекорректно:\n\n```python\nfile = await file_repository.get_by_id_and_owner(\n    file_id=data.file_id,\n    owner_id=data.user_id,\n)\n```\n\nПроверка формата идентификатора не заменяет проверку права доступа к объекту.\n\n### 7. Не доверять массовому присваиванию полей\n\nОпасная схема:\n\n```python\nuser.update_from_dict(request_data)\n```\n\nКлиент может добавить:\n\n```json\n{\n  \"username\": \"alfob\",\n  \"is_admin\": true,\n  \"balance\": 1000000\n}\n```\n\nЛучше иметь отдельные входные модели:\n\n```python\nclass UserUpdate(BaseModel):\n    model_config = ConfigDict(extra=\"forbid\")\n\n    username: str | None = None\n    avatar_url: str | None = None\n```\n\nИ явно копировать допустимые поля:\n\n```python\nupdate_data = data.model_dump(exclude_unset=True)\n\nawait user_repository.update(\n    user_id=current_user.id,\n    **update_data,\n)\n```\n\nМодель базы данных и модель входящего запроса не должны быть одной и той же моделью.\n\n### 8. Нормализация данных\n\nПеред проверкой некоторые данные можно нормализовать:\n\n```text\nудалить пробелы по краям\nпривести email к согласованному виду\nнормализовать телефонный номер\nнормализовать Unicode\n```\n\nНапример:\n\n```python\nclass UserCreate(BaseModel):\n    model_config = ConfigDict(\n        str_strip_whitespace=True,\n    )\n\n    username: str\n```\n\nНо нельзя незаметно исправлять всё подряд.\n\nНапример, автоматически преобразовать:\n\n```text\n\"12abc\" → 12\n```\n\nопасно. Клиенту лучше вернуть ошибку.\n\nТакже стоит аккуратно относиться к автоматическому приведению типов:\n\n```json\n{\n  \"quantity\": \"10\"\n}\n```\n\nИногда это допустимо, но для строгого контракта можно включить strict validation, чтобы строка `\"10\"` не считалась числом `10`. Pydantic поддерживает строгую проверку на уровне поля или всей модели. \n\n### 9. Ограничения базы данных\n\nДаже после прикладной валидации база данных должна защищать инварианты:\n\n```sql\nCREATE TABLE users (\n    id BIGSERIAL PRIMARY KEY,\n    email TEXT NOT NULL UNIQUE,\n    age INTEGER CHECK (age >= 0)\n);\n```\n\nПриложение проверяет данные для понятной ошибки пользователю, а база данных остаётся последней линией защиты.\n\nНапример, два параллельных запроса могут одновременно проверить, что email свободен:\n\n```text\nЗапрос A: email свободен\nЗапрос B: email свободен\n```\n\nТолько `UNIQUE` гарантирует, что обе записи не будут сохранены.\n\nПоэтому:\n\n```text\nпроверка в приложении\n+ constraint в базе\n```\n\nа не один из этих вариантов.\n\n### 10. Работа с файлами\n\nДля загружаемых файлов нужно проверять:\n\n- максимальный размер;\n    \n- разрешённый тип файла;\n    \n- расширение;\n    \n- фактическое содержимое;\n    \n- имя файла;\n    \n- количество файлов;\n    \n- наличие вредоносного содержимого при необходимости.\n    \n\nНельзя доверять только:\n\n```text\nContent-Type: image/png\n```\n\nили имени:\n\n```text\navatar.png\n```\n\nКлиент сам управляет этими значениями. OWASP рекомендует использовать allowlist расширений, ограничивать размер, генерировать серверное имя и не полагаться только на `Content-Type`. \n\n### 11. SQL-инъекции не предотвращаются обычной проверкой строк\n\nНедостаточно запретить символы:\n\n```text\n'\n\"\n;\n--\n```\n\nПравильная защита — параметризованные запросы:\n\n```python\nquery = select(User).where(User.username == username)\n```\n\nа не конкатенация:\n\n```python\nquery = f\"\"\"\n    SELECT *\n    FROM users\n    WHERE username = '{username}'\n\"\"\"\n```\n\nВалидация уменьшает количество некорректных данных, но не заменяет параметризованные SQL-запросы, экранирование HTML и другие контекстные механизмы защиты. OWASP прямо отмечает, что input validation не должна быть основным способом предотвращения SQL injection или XSS. \n\n### 12. Возвращать структурированные ошибки\n\nОтвет должен позволять frontend понять, какое поле не прошло проверку:\n\n```text\nHTTP/1.1 422 Unprocessable Content\nContent-Type: application/problem+json\n```\n\n```json\n{\n  \"type\": \"/problems/validation-error\",\n  \"title\": \"Validation failed\",\n  \"status\": 422,\n  \"errors\": [\n    {\n      \"field\": \"quantity\",\n      \"code\": \"less_than_or_equal\",\n      \"message\": \"Quantity must not exceed 100\"\n    }\n  ]\n}\n```\n\nНе стоит возвращать внутренние детали:\n\n```text\nSQL-запрос\nstack trace\nимя таблицы\nпуть к файлу\nсекреты\n```\n\nRFC 9457 определяет стандартный формат `application/problem+json`, который можно расширить списком ошибок конкретных полей. \n\n### Практическая схема\n\n```text\n1. Ограничить размер запроса\n2. Проверить Content-Type\n3. Разобрать JSON\n4. Проверить обязательные поля и типы\n5. Запретить неизвестные поля\n6. Проверить длину, диапазоны и форматы\n7. Проверить взаимосвязь полей\n8. Получить текущего пользователя из session/token\n9. Проверить права доступа\n10. Проверить бизнес-правила и состояние БД\n11. Выполнить операцию в транзакции\n12. Положиться на DB constraints как последнюю защиту\n13. Вернуть структурированный ответ об ошибке\n```\n\n### Итог\n\nЯ бы валидировал пользовательские данные не одним большим `if`, а слоями:\n\n```text\nPydantic/FastAPI\n→ структура, типы и простые ограничения\n\nService layer\n→ бизнес-правила и права доступа\n\nDatabase constraints\n→ окончательная целостность данных\n\nКонтекстная защита\n→ параметры SQL, HTML escaping, безопасное хранение файлов\n```\n\nГлавное правило:\n\n```text\nвалидные по формату данные\nне обязательно являются допустимыми\nс точки зрения бизнеса и безопасности\n```"
