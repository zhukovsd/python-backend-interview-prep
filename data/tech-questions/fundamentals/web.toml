  question = "Какие плюсы и минусы имеет использование JWT в системах авторизации?"
  answer = "### Преимущества JWT\n\n#### 1. Локальная проверка токена\n\nJWT может содержать все данные, необходимые API для проверки запроса:\n\n```json\n{\n  \"sub\": \"42\",\n  \"role\": \"user\",\n  \"aud\": \"orders-api\",\n  \"exp\": 1785456900\n}\n```\n\nСервис проверяет:\n\n- криптографическую подпись;\n    \n- срок действия;\n    \n- издателя `iss`;\n    \n- получателя `aud`;\n    \n- необходимые claims.\n    \n\nДля этого не обязательно обращаться к серверу авторизации или базе данных при каждом запросе. Это удобно в распределённых системах и микросервисной архитектуре.\n\n```text\nКлиент\n  │ JWT\n  ▼\nAPI-сервис ── проверяет подпись публичным ключом\n```\n\n#### 2. Хорошая масштабируемость\n\nКогда access-токены проверяются локально, любой экземпляр API может обработать запрос:\n\n```text\n                 ┌─ API instance 1\nКлиент → балансировщик ├─ API instance 2\n                 └─ API instance 3\n```\n\nНе требуется хранить пользовательскую HTTP-сессию в памяти конкретного сервера. Поэтому проще:\n\n- добавлять новые экземпляры приложения;\n    \n- распределять запросы через балансировщик;\n    \n- не использовать sticky sessions;\n    \n- уменьшать нагрузку на централизованное хранилище сессий.\n    \n\nНо это преимущество сохраняется только при действительно локальной проверке JWT. Если каждый запрос дополнительно проверяет `jti` или сессию в Redis, система уже не полностью stateless.\n\n#### 3. Удобство для нескольких сервисов\n\nСервер авторизации может подписывать JWT приватным ключом, а остальные сервисы — проверять подпись публичным:\n\n```text\nAuth Service\nprivate key\n     │\n     ▼\n   JWT\n     │\n     ├── Users API ─── public key\n     ├── Orders API ── public key\n     └── Files API ─── public key\n```\n\nПроверяющие сервисы не получают приватный ключ и не могут самостоятельно выпускать корректные токены.\n\n#### 4. Стандартизированный формат\n\nJWT имеет стандартизированную структуру и набор зарегистрированных claims:\n\n```text\nheader.payload.signature\n```\n\n```json\n{\n  \"iss\": \"auth.example.com\",\n  \"sub\": \"42\",\n  \"aud\": \"api.example.com\",\n  \"exp\": 1785456900,\n  \"nbf\": 1785456000,\n  \"iat\": 1785456000,\n  \"jti\": \"unique-token-id\"\n}\n```\n\nЭто упрощает интеграцию между системами, написанными на разных языках и технологиях. Сам формат JWT определён RFC 7519, а правила безопасного использования уточнены RFC 8725. \n\n#### 5. Возможность передавать ограниченный контекст\n\nВ access JWT можно поместить данные, необходимые для авторизации:\n\n```json\n{\n  \"sub\": \"42\",\n  \"scope\": \"files:read files:write\",\n  \"tenant_id\": \"company-7\"\n}\n```\n\nAPI может принять решение без дополнительного запроса к сервису пользователей:\n\n```python\nif \"files:write\" not in token.scopes:\n    raise Forbidden()\n```\n\nЭто уменьшает связанность сервисов и количество сетевых запросов.\n\n#### 6. Поддержка короткоживущих токенов\n\nJWT удобно использовать как access token с небольшим сроком жизни:\n\n```text\nAccess JWT:   5–15 минут\nRefresh token: несколько дней\n```\n\nДаже если access-токен украден, период его использования ограничен значением `exp`. Однако короткий срок действия не заменяет защиту токена от утечки.\n\n---\n\n### Недостатки JWT\n\n#### 1. Сложный немедленный отзыв\n\nГлавный недостаток самодостаточного JWT: после выпуска он остаётся криптографически действительным до наступления `exp`.\n\n```text\n12:00 — access JWT выдан до 12:15\n12:05 — пользователь вышел из системы\n12:06 — украденный JWT всё ещё может работать\n12:15 — JWT истёк\n```\n\nСама подпись не сообщает, что пользователь вышел, был заблокирован или его сессия была завершена.\n\nДля немедленного отзыва приходится добавлять серверное состояние:\n\n```text\nJWT\n +\nblacklist по jti\nили\nsession_id в Redis\nили\ntoken_version пользователя\n```\n\nТогда исчезает часть преимущества stateless-подхода.\n\n#### 2. Устаревание данных внутри токена\n\nClaims являются снимком состояния на момент выпуска:\n\n```json\n{\n  \"sub\": \"42\",\n  \"role\": \"admin\",\n  \"exp\": 1785456900\n}\n```\n\nЧерез минуту пользователя могут лишить роли администратора, но старый JWT продолжит содержать:\n\n```json\n{\n  \"role\": \"admin\"\n}\n```\n\nРешения:\n\n- короткий срок жизни access-токена;\n    \n- проверка критичных прав в базе;\n    \n- хранение версии прав или версии токена;\n    \n- отзыв сессии;\n    \n- не помещать часто меняющиеся права непосредственно в JWT.\n    \n\nПоэтому JWT особенно неудобен для систем, где полномочия должны изменяться мгновенно.\n\n#### 3. JWT обычно не шифрует содержимое\n\nОбычный подписанный JWT защищает payload от подмены, но не скрывает его:\n\n```text\nBase64URL ≠ шифрование\n```\n\nЛюбой владелец токена обычно может декодировать payload:\n\n```json\n{\n  \"sub\": \"42\",\n  \"email\": \"user@example.com\",\n  \"role\": \"admin\"\n}\n```\n\nПоэтому в JWT нельзя помещать:\n\n- пароль;\n    \n- приватный ключ;\n    \n- платёжные реквизиты;\n    \n- секреты;\n    \n- лишние персональные данные.\n    \n\nJWT может быть зашифрован с помощью JWE, но это отдельный и более сложный механизм. RFC 8725 отдельно рассматривает риски раскрытия информации и требует не считать обычное кодирование защитой конфиденциальности. \n\n#### 4. Токен может быть довольно большим\n\nОбычный идентификатор сессии:\n\n```text\na3d91f8c2e...\n```\n\nJWT:\n\n```text\neyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6...\n```\n\nJWT содержит:\n\n- заголовок;\n    \n- claims;\n    \n- временные поля;\n    \n- подпись;\n    \n- Base64URL-кодирование.\n    \n\nОн передаётся при каждом запросе:\n\n```http\nAuthorization: Bearer <длинный JWT>\n```\n\nПри большом количестве claims это увеличивает:\n\n- размер HTTP-заголовков;\n    \n- сетевой трафик;\n    \n- объём логов;\n    \n- вероятность превышения ограничений прокси или веб-сервера.\n    \n\nНе следует превращать JWT в контейнер всего профиля пользователя.\n\n#### 5. Ошибки конфигурации могут привести к серьёзным уязвимостям\n\nНебезопасная проверка JWT может включать:\n\n- доверие к алгоритму `alg` из входящего токена;\n    \n- принятие неподписанного токена;\n    \n- смешивание `HS256` и `RS256`;\n    \n- отсутствие проверки `iss`;\n    \n- отсутствие проверки `aud`;\n    \n- принятие refresh token как access token;\n    \n- повторное использование одного токена в разных контекстах;\n    \n- слабый HMAC-секрет;\n    \n- небезопасную загрузку ключей по данным из header.\n    \n\nRFC 8725 требует заранее фиксировать разрешённые алгоритмы, проверять issuer и audience, использовать явные правила валидации и не применять один набор правил для разных типов JWT. \n\nПример правильного ограничения алгоритма:\n\n```python\npayload = jwt.decode(\n    token,\n    public_key,\n    algorithms=[\"RS256\"],\n    audience=\"orders-api\",\n    issuer=\"https://auth.example.com\",\n)\n```\n\n#### 6. JWT не решает проблему безопасного хранения на клиенте\n\nJWT может быть украден:\n\n- через XSS;\n    \n- из `localStorage`;\n    \n- из логов;\n    \n- из истории отладки;\n    \n- через вредоносное расширение;\n    \n- при передаче без TLS;\n    \n- через неправильно настроенные cookies.\n    \n\nBearer-токен обычно может использовать любой, кто им завладел:\n\n```text\nЕсть токен → можно представиться его владельцем\n```\n\nИспользование JWT не делает аутентификацию автоматически безопасной. Безопасность зависит от хранения, передачи, срока действия, ротации refresh-токенов и защиты клиентского приложения. Современные рекомендации OAuth отдельно требуют защищаться от повторного использования и утечки refresh-токенов, например посредством ротации или привязки токена к клиенту. \n\n#### 7. Logout становится сложнее\n\nПри серверной сессии выход выглядит просто:\n\n```text\nУдалить session_id из Redis\n→ все следующие запросы отклоняются\n```\n\nПри stateless JWT:\n\n```text\nУдаление токена на клиенте\n≠\nнемедленное прекращение действия всех его копий\n```\n\nДля полноценного logout со всех устройств требуется инфраструктура:\n\n- серверные сессии;\n    \n- хранение refresh-токенов;\n    \n- blacklist;\n    \n- семейства refresh-токенов;\n    \n- ротация;\n    \n- обнаружение повторного использования;\n    \n- отзыв сессии.\n    \n\n#### 8. Сложнее управлять ключами\n\nПри использовании асимметричной подписи необходимо организовать:\n\n- безопасное хранение приватного ключа;\n    \n- публикацию публичных ключей;\n    \n- идентификаторы `kid`;\n    \n- ротацию ключей;\n    \n- период совместимости старого и нового ключа;\n    \n- удаление скомпрометированных ключей;\n    \n- синхронизацию ключей между сервисами.\n    \n\nJWT упрощает локальную проверку, но переносит часть сложности в управление криптографическими ключами.\n\n#### 9. JWT иногда применяют без необходимости\n\nДля обычного монолитного приложения:\n\n```text\nBrowser → один backend → одна база данных\n```\n\nсерверная сессия часто проще:\n\n```text\nCookie: session_id=abc123\n\nRedis:\nabc123 → user_id=42\n```\n\nОна даёт:\n\n- простой немедленный logout;\n    \n- небольшую cookie;\n    \n- централизованное управление сессиями;\n    \n- отсутствие устаревших ролей внутри токена;\n    \n- более простую реализацию.\n    \n\nJWT не является «современной заменой сессий» для любого приложения.\n\n---\n\n### JWT и серверная сессия\n\n|Критерий|JWT access token|Серверная сессия|\n|---|---|---|\n|Проверка без БД/Redis|Возможна|Обычно нет|\n|Немедленный отзыв|Сложнее|Просто|\n|Масштабирование|Удобно|Требуется общее хранилище|\n|Размер токена|Обычно больше|Обычно маленький ID|\n|Актуальность прав|Может устаревать|Проверяется централизованно|\n|Межсервисное использование|Удобно|Менее удобно|\n|Управление ключами|Требуется|Обычно не требуется|\n|Простота logout|Ниже|Выше|\n\n### Когда JWT оправдан\n\nJWT хорошо подходит, когда:\n\n- есть несколько независимых API;\n    \n- access token проверяют разные сервисы;\n    \n- нужен единый сервер авторизации;\n    \n- требуется локальная проверка без сетевого вызова;\n    \n- используются короткоживущие access-токены;\n    \n- настроены проверка `iss`, `aud`, `exp` и строгий список алгоритмов;\n    \n- реализовано безопасное управление refresh-токенами.\n    \n\nПример:\n\n```text\nMobile App\n    │\n    ▼\nAuthorization Server\n    │ JWT\n    ├── Orders API\n    ├── Payments API\n    └── Files API\n```\n\n### Когда JWT может быть лишним\n\nСерверная сессия часто предпочтительнее, когда:\n\n- приложение является обычным монолитом;\n    \n- API обслуживает только собственный браузерный frontend;\n    \n- нужен немедленный logout;\n    \n- права пользователя часто меняются;\n    \n- требуется централизованное управление устройствами и сессиями;\n    \n- нет реальной необходимости проверять токен несколькими независимыми сервисами.\n    \n\n### Итог\n\nГлавное преимущество JWT:\n\n```text\nСамодостаточный подписанный токен\n→ локальная проверка\n→ удобство для распределённых систем\n```\n\nГлавный недостаток:\n\n```text\nСамодостаточный токен\n→ сервер не контролирует его после выпуска\n→ сложный отзыв и устаревание claims\n```\n\nПоэтому JWT наиболее полезен как **короткоживущий access token** между сервером авторизации и несколькими API. Для простого веб-приложения классическая серверная сессия нередко безопаснее и проще."
