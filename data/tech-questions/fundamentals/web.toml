  id = 40
  question = "Как делать retry в HTTP request-response потоке?"
  answer = "### Главное\n\n**Retry — это повторная отправка нового HTTP-запроса.** Нельзя «продолжить» оборвавшийся request-response с того же места.\n\n```text\nЗапрос №1\n    ↓\ntimeout / connection reset / 503\n    ↓\nпауза\n    ↓\nЗапрос №2\n```\n\nФизически второй запрос иногда может использовать то же постоянное соединение, но логически это отдельный HTTP-запрос.\n\nЕсли первый запрос всё ещё выполняется и соединение открыто, обычно нужно либо продолжать ждать, либо отменить запрос. Отправка второго такого же запроса параллельно может создать две одинаковые операции.\n\n### 1. Какие запросы можно повторять\n\nАвтоматически безопаснее повторять идемпотентные операции:\n\n```text\nGET\nHEAD\nPUT\nDELETE\nOPTIONS\n```\n\n`POST` и `PATCH` нельзя автоматически повторять без дополнительной гарантии идемпотентности. RFC 9110 разрешает автоматическое повторение неидемпотентного метода только тогда, когда клиент знает, что операция фактически идемпотентна, либо знает, что первый запрос точно не был применён. \n\nПример опасной ситуации:\n\n```text\nPOST /payments\n        ↓\nBackend создал платёж\n        ↓\nОтвет потерялся\n        ↓\nКлиент повторил POST\n        ↓\nСоздан второй платёж\n```\n\n### 2. При каких ошибках обычно делают retry\n\n|Ситуация|Повторять|\n|---|---|\n|Ошибка подключения|Обычно да|\n|Connection reset|Обычно да для идемпотентной операции|\n|`408 Request Timeout`|Возможно|\n|`429 Too Many Requests`|Да, с учётом `Retry-After`|\n|`502 Bad Gateway`|Возможно|\n|`503 Service Unavailable`|Обычно да|\n|`504 Gateway Timeout`|Возможно|\n|`400`, `403`, `404`, `422`|Обычно нет|\n|`409 Conflict`|Обычно нужно изменить состояние или запрос|\n|`500 Internal Server Error`|Только если контракт API допускает повтор|\n\nКод ответа `408` позволяет повторить незавершённый запрос. Для `429` сервер может указать время ожидания через `Retry-After`; `503` также может сопровождаться этим заголовком. \n\nВажно: статус `502`, `503` или `504` **не делает `POST` автоматически безопасным**. Upstream мог выполнить операцию, но gateway не получил корректный ответ.\n\n### 3. Backoff и jitter\n\nНельзя повторять запрос сразу в бесконечном цикле:\n\n```text\nпопытка 1 → ошибка\nпопытка 2 → сразу\nпопытка 3 → сразу\nпопытка 4 → сразу\n```\n\nТак клиент усиливает перегрузку сервера.\n\nИспользуют exponential backoff:\n\n```text\nпопытка 1 → подождать 250 мс\nпопытка 2 → подождать 500 мс\nпопытка 3 → подождать 1 секунду\n```\n\nИ добавляют небольшое случайное отклонение — jitter:\n\n```text\n500 мс + случайные 0–100 мс\n```\n\nОбщая формула:\n\n```text\ndelay = min(max_delay, base_delay × 2^attempt) + jitter\n```\n\nНужны ограничения:\n\n```text\nмаксимум 2–3 повтора\n+\nобщий deadline\n+\nмаксимальная задержка\n```\n\nЕсли сервер вернул:\n\n```text\nRetry-After: 30\n```\n\nлучше ждать указанное сервером время, а не применять собственный короткий backoff. Значением `Retry-After` может быть количество секунд или HTTP-дата. \n### 4. Timeout не означает, что операция не выполнилась\n\nПредположим, клиент ждёт ответ пять секунд:\n\n```text\n0 сек  → POST отправлен\n2 сек  → backend записал данные в БД\n5 сек  → клиент получил read timeout\n7 сек  → backend сформировал ответ, но клиент уже отключился\n```\n\nДля клиента результат неопределён:\n\n```text\nоперация могла выполниться\nили\nмогла не выполниться\n```\n\nОсобенно важно различать:\n\n```text\nConnect timeout\n→ соединение обычно не установлено\n\nWrite timeout\n→ запрос мог быть отправлен частично\n\nRead timeout\n→ сервер мог полностью выполнить операцию,\n  но клиент не получил ответ\n```\n\nHTTPX, например, отдельно различает connect, read, write и pool timeout. \n\n### 5. Как повторять `POST`\n\nДля операций создания используют ключ идемпотентности:\n\n```text\nPOST /payments\nIdempotency-Key: 44ff9ee1-9968-40cf-b962-504af51d5445\nContent-Type: application/json\n\n{\n  \"order_id\": 1001,\n  \"amount\": 50\n}\n```\n\nBackend сохраняет:\n\n```text\nuser_id\nidempotency_key\nrequest_hash\nstatus\nresponse_status\nresponse_body\n```\n\nПример таблицы:\n\n```text\nidempotency_records\n├── principal_id\n├── key\n├── request_hash\n├── status\n│   ├── processing\n│   ├── completed\n│   └── failed\n├── response_status\n├── response_body\n└── expires_at\n```\n\nНужна уникальность:\n\n```sql\nUNIQUE (principal_id, key)\n```\n\nПоведение:\n\n```text\nПервый запрос:\nключ новый\n→ начать операцию\n→ сохранить результат\n\nПовторный запрос:\nключ уже завершён\n→ не выполнять операцию повторно\n→ вернуть сохранённый результат\n\nКлюч ещё processing:\n→ вернуть статус выполняющейся операции\n\nТот же ключ, другое тело:\n→ отклонить запрос\n```\n\nОдин и тот же ключ должен использоваться для повторов одной операции. Для новой операции генерируется новый ключ.\n\n`Idempotency-Key` является распространённым прикладным механизмом, но соответствующая спецификация IETF на данный момент остаётся истёкшим Internet-Draft, а не опубликованным RFC. \n\n### 6. Если HTTP-ручка долго держит соединение\n\nРассмотрим обычную долгую ручку:\n\n```text\nFrontend\n    │ POST /reports\n    ▼\nBackend\n    │ выполняет работу 2 минуты\n    │ соединение остаётся открытым\n    ▼\nFrontend получает ответ\n```\n\nПока запрос выполняется, клиент не должен отправлять его повторно только потому, что ответ ещё не пришёл.\n\nНужно согласовать timeout всей цепочки:\n\n```text\nFrontend timeout\n    >\nReverse proxy timeout\n    >\nBackend budget\n    >\nTimeout внутренних запросов\n```\n\nНапример:\n\n```text\nFrontend:          15 секунд\nReverse proxy:     14 секунд\nBackend deadline:  12 секунд\nExternal API:       3 секунды на попытку\nRetries:            максимум 2\n```\n\nПлохая конфигурация:\n\n```text\nFrontend ждёт 10 секунд\nBackend делает 5 попыток по 10 секунд\n```\n\nFrontend давно отключится, а backend продолжит бесполезно занимать ресурсы.\n\n### 7. Retry внутри backend-ручки\n\nДопустим, backend в ходе запроса обращается к стороннему API:\n\n```text\nFrontend\n    ↓\nBackend endpoint\n    ↓\nPayment API\n```\n\nBackend может повторить вызов `Payment API`, пока входящий запрос ещё открыт:\n\n```text\nПопытка 1 → connect timeout\nПауза\nПопытка 2 → 200 OK\nBackend → возвращает ответ frontend\n```\n\nНо retry должен укладываться в оставшийся deadline:\n\n```python\nremaining = request_deadline - current_time\n\nif remaining <= 0:\n    raise GatewayTimeoutError()\n```\n\nНужно ограничивать:\n\n```text\ntimeout каждой попытки\nколичество попыток\nсуммарное время\nпараллельность\n```\n\nВ HTTPX встроенный параметр transport `retries` повторяет только ошибки подключения `ConnectError` и `ConnectTimeout`. Для обработки read/write ошибок и HTTP-статусов вроде `503` нужен отдельный retry-цикл.\n\n### 8. Что делать, если соединение разорвалось\n\nСитуация:\n\n```text\nКлиент                    Backend\n   │──── POST ───────────────>│\n   │                           │ операция выполняется\n   X соединение оборвалось     │\n                               │ операция могла завершиться\n```\n\nBackend не обязан автоматически откатывать уже выполненную транзакцию только потому, что клиент отключился.\n\nКлиент должен:\n\n```text\nGET\n→ повторить запрос\n\nPOST без идемпотентности\n→ сначала проверить состояние операции\n\nPOST с Idempotency-Key\n→ повторить с тем же ключом\n```\n\nПроверка состояния:\n\n```text\nGET /payments/by-operation/44ff9ee1-9968-40cf-b962-504af51d5445\n```\n\nОтвет:\n\n```json\n{\n  \"status\": \"completed\",\n  \"payment_id\": 845\n}\n```\n\n### 9. Для долгих операций лучше не держать соединение\n\nВместо:\n\n```text\nPOST /reports\n→ ждать 5 минут\n```\n\nлучше:\n\n```text\nPOST /reports\nIdempotency-Key: 2b317fd0-7778-4d38-8438-a57d3dd3fbd4\n```\n\nОтветить быстро:\n\n```text\nHTTP/1.1 202 Accepted\nLocation: /operations/abc123\nRetry-After: 2\nContent-Type: application/json\n\n{\n  \"operation_id\": \"abc123\",\n  \"status\": \"pending\"\n}\n```\n\nЗатем клиент проверяет статус:\n\n```text\nGET /operations/abc123\n```\n\n```json\n{\n  \"operation_id\": \"abc123\",\n  \"status\": \"running\"\n}\n```\n\nПосле завершения:\n\n```json\n{\n  \"operation_id\": \"abc123\",\n  \"status\": \"completed\",\n  \"result_url\": \"/reports/845\"\n}\n```\n\n`202 Accepted` означает, что запрос принят, но обработка ещё не завершена. HTTP сам не умеет позже прислать новый финальный status code для уже завершённого ответа, поэтому нужен отдельный status endpoint, polling, SSE или WebSocket. \n\n### 10. Long polling\n\nLong polling специально держит запрос открытым до события или timeout:\n\n```text\nGET /notifications?after=150\n        ↓\nсервер ждёт\n        ↓\nпоявляется событие или наступает timeout\n        ↓\nсервер отвечает\n        ↓\nклиент сразу создаёт новый GET\n```\n\nЭто не повтор бизнес-операции, а новый запрос на получение следующих событий.\n\nНужно передавать позицию:\n\n```text\nGET /notifications?after=150\n```\n\nТогда при переподключении клиент не получит все события заново:\n\n```text\n150 уже обработано\n→ вернуть события начиная с 151\n```\n\nRFC 6202 описывает long polling именно как цикл: сервер удерживает запрос до события или timeout, отвечает, после чего клиент создаёт следующий запрос. Слишком длинные таймауты могут конфликтовать с timeout proxy и приводить к `408` или `504`. \n\n### 11. Streaming и SSE\n\nПри потоковом ответе сервер периодически отправляет данные:\n\n```text\nGET /events\n    ↓\nevent 151\nevent 152\nevent 153\nсоединение оборвалось\n```\n\nПосле переподключения клиент должен передать последний обработанный идентификатор:\n\n```text\nlast_event_id = 153\n```\n\nи запросить продолжение:\n\n```text\nвернуть события после 153\n```\n\nЭто называется не повтором всего запроса с повторной бизнес-операцией, а **возобновлением потока с checkpoint/cursor**.\n\nЕсли поток молчит длительное время, полезны heartbeat-сообщения, чтобы прокси и клиент видели активность соединения.\n\n### 12. Пример retry-клиента\n\nУпрощённая схема для идемпотентного `GET`:\n\n```python\nimport asyncio\nimport random\nimport time\n\nimport httpx\n\n\nRETRYABLE_STATUSES = {\n    408,\n    429,\n    502,\n    503,\n    504,\n}\n\n\nasync def get_with_retry(\n    client: httpx.AsyncClient,\n    url: str,\n    *,\n    max_attempts: int = 3,\n    total_timeout: float = 10.0,\n) -> httpx.Response:\n    deadline = time.monotonic() + total_timeout\n    last_error: Exception | None = None\n\n    for attempt in range(max_attempts):\n        remaining = deadline - time.monotonic()\n\n        if remaining <= 0:\n            raise TimeoutError(\"Total request deadline exceeded\") from last_error\n\n        try:\n            response = await client.get(\n                url,\n                timeout=httpx.Timeout(\n                    timeout=min(3.0, remaining),\n                ),\n            )\n\n            if response.status_code not in RETRYABLE_STATUSES:\n                response.raise_for_status()\n                return response\n\n            if attempt == max_attempts - 1:\n                response.raise_for_status()\n\n            retry_after = response.headers.get(\"Retry-After\")\n\n            if retry_after and retry_after.isdigit():\n                delay = float(retry_after)\n            else:\n                delay = min(0.25 * (2**attempt), 2.0)\n\n        except (\n            httpx.ConnectError,\n            httpx.ConnectTimeout,\n            httpx.ReadError,\n            httpx.ReadTimeout,\n        ) as exc:\n            last_error = exc\n\n            if attempt == max_attempts - 1:\n                raise\n\n            delay = min(0.25 * (2**attempt), 2.0)\n\n        jitter = random.uniform(0, delay * 0.2)\n        sleep_time = min(\n            delay + jitter,\n            max(0.0, deadline - time.monotonic()),\n        )\n\n        await asyncio.sleep(sleep_time)\n\n    raise RuntimeError(\"Unreachable\")\n```\n\nЭтот код предназначен для операции чтения. Для `POST` требуется тот же `Idempotency-Key` на всех попытках.\n\n### Итоговая стратегия\n\n```text\nОбычный GET:\ntimeout\n→ backoff + jitter\n→ ограниченный retry\n\nPOST с изменением состояния:\nIdempotency-Key\n→ timeout\n→ повтор с тем же ключом\n\nДлительная операция:\nPOST\n→ 202 + operation_id\n→ GET status\n\nLong polling:\nсервер отвечает по событию/timeout\n→ клиент создаёт новый GET с cursor\n\nStreaming/SSE:\nпереподключение\n→ продолжение с last_event_id\n\nBackend вызывает внешний API:\nretry внутри ручки\n→ только в пределах общего deadline\n```\n\nКлючевое правило:\n\n```text\nRetry нельзя проектировать отдельно от:\nидемпотентности\nтаймаутов\nдедлайнов\nхранения состояния операции\nи защиты от дубликатов\n```"
