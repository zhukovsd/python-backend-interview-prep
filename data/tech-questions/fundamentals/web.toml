[[questions]]
  id = 1
  question = "GET vs POST"
  answer = "|**Критерий**|**GET**|**POST**|\n|---|---|---|\n|**Назначение**|Получение данных|Создание или изменение данных|\n|**Передача данных**|Данные передаются в URL (в строке запроса)|Данные передаются в теле (body) HTTP-запроса|\n|**Безопасность**|Менее безопасный (данные видны в URL и логах сервера)|Более безопасный (данные не видны в URL)|\n|**Идемпотентность**|Идемпотентен|Не идемпотентен|\n|**Кэширование**|Поддерживается браузерами и прокси-серверами|Не поддерживается кэширование по умолчанию|\n|**Ограничение на длину**|Ограничения на длину строки URL зависят от браузера|Ограничения на длину тела запроса обычно отсутствуют|\n|**Пример использования**|Поиск данных, отображение страниц|Отправка форм, создание ресурсов, изменение данных|\n\n**Почему для конфиденциальных данных рекомендуется использовать POST, а не GET запросы**\n1. **Безопасность** - в GET-запросе данные передаются в URL, который может быть виден в истории браузера, логах сервера и прокси, в POST-запросе данные передаются в теле запроса, что снижает риск случайной утечки\n2. **Ограничения длины** - длина URL в GET ограничена браузерами или серверами, поэтому большие объемы данных (например, конфиденциальные формы) могут не пройти\n3. **Кэширование** - GET-запросы могут быть кэшированы прокси-серверами или браузерами, что нежелательно для конфиденциальной информации\n\n**Можем ли всегда использовать только POST и не работать с GET?**\nТеоретически - да, но это нарушает принципы REST и архитектуру веб-приложений:\n1. **REST-принципы** - GET предназначен для получения данных, POST - для создания. Использование POST для всех операций затрудняет понимание и поддержку API\n2. **Оптимизация и кэширование** - GET запросы могут быть кэшированы, что ускоряет работу. POST запросы не кэшируются по умолчанию\n3. **Поисковые системы и SEO** - GET используется для индексации страниц. Если использовать только POST, страницы не попадут в поисковую выдачу\n\n**Можем ли с помощью GET создать ресурс? Есть ли технические ограничения?**\n1. **Технические ограничения** - с точки зрения HTTP-протокола GET не должен создавать ресурсы. Но технически сервер может обрабатывать GET запросы так, чтобы они изменяли данные (например, создавали ресурс)\n2. **Практика** - создание или изменение ресурсов через GET нарушает идемпотентность и может вызвать проблемы с кэшированием и повторными запросами\n\n**Почему решили из метода GET убрать body?**\n1. **Неопределённое поведение** - семантика GET подразумевает только получение данных. Тело запроса не является обязательной частью этой семантики, поэтому серверы могут игнорировать его\n2. **Совместимость** - многие прокси-серверы, фреймворки и библиотеки не поддерживают body в GET, что могло бы привести к проблемам совместимости.\n3. **Простота и идемпотентность** - GET-запросы считаются идемпотентными и безопасными. Наличие тела могло бы изменить эту концепцию, создавая больше путаницы\n"
  popularity = 7.89

[[questions]]
  id = 2
  question = "Почему в GET-запросе обычно не передают данные в теле запроса?"
  answer = "### Почему так делают\n\nТехнически HTTP-сообщение `GET` может содержать тело, но стандарт **не определяет для него общепринятую семантику**. Тело не должно менять смысл запроса или определять целевой ресурс. Поэтому разные серверы, клиенты и промежуточные узлы могут обработать его по-разному.\n\nОсновные причины:\n\n1. **Ресурс определяется URL**\n    \n\n```text\nGET /users/42\nGET /users?status=active&page=2\n```\n\nДля `GET` путь и query-параметры описывают, какие данные нужно получить. Запрос можно понять, сохранить или повторить, просто имея URL.\n\n2. **Проблемы с прокси и клиентами**\n    \n\nПрокси-сервер, CDN, API Gateway или HTTP-клиент может:\n\n- проигнорировать тело;\n    \n- не передать его дальше;\n    \n- отклонить запрос;\n    \n- интерпретировать запрос иначе, чем сервер.\n    \n\nRFC отдельно указывает, что некоторые реализации могут отклонять `GET` с телом из-за риска HTTP request smuggling. \n\n3. **Кэширование обычно зависит от URL**\n    \n\nСтандартный ключ HTTP-кэша как минимум строится из метода и целевого URI:\n\n```text\nGET + /products?page=1\n```\n\nТело запроса обычно не является частью стандартного ключа. Поэтому такие запросы потенциально проблемны:\n\n```text\nGET /products\nBody: {\"category\": \"books\"}\n```\n\n```text\nGET /products\nBody: {\"category\": \"phones\"}\n```\n\nДля кэша оба запроса могут выглядеть одинаково: `GET /products`.\n\n4. **Плохая совместимость с OpenAPI и Swagger**\n    \n\nOpenAPI разрешает описывать тело у `GET`, но прямо указывает, что его семантика не определена и такого использования следует избегать. FastAPI также поддерживает это только для редких случаев: Swagger UI может не показать тело, а прокси — не поддержать его.\n\n### Как передавать параметры\n\nОбычная фильтрация:\n\n```text\nGET /users?status=active&age_from=18&limit=50\n```\n\nПараметр пути — идентификатор конкретного ресурса:\n\n```text\nGET /users/42\n```\n\nДля сложного поиска с большим вложенным JSON обычно используют `POST`:\n\n```text\nPOST /users/search\nContent-Type: application/json\n\n{\n  \"filters\": {\n    \"status\": [\"active\", \"blocked\"],\n    \"age\": {\n      \"from\": 18,\n      \"to\": 40\n    }\n  },\n  \"sort\": [\n    {\n      \"field\": \"created_at\",\n      \"direction\": \"desc\"\n    }\n  ]\n}\n```\n\nТакой `POST` необязательно изменяет данные: он может просто выполнять сложный поиск. Главная причина его использования — у тела `POST` есть определённая семантика и нормальная поддержка всей HTTP-инфраструктурой.\n\nИтого: **тело в `GET` не строго запрещено протоколом, но его смысл не стандартизирован, поэтому оно ненадёжно и непереносимо.** Для обычных параметров используют URL, для сложных структур — `POST` с телом."
  popularity = 2.63

[[questions]]
  id = 3
  question = "Что такое JWT токен и из чего он состоит?"
  answer = "### Что такое JWT\n\n**JWT (JSON Web Token)** — компактный URL-безопасный формат передачи утверждений — `claims` — между сторонами в виде JSON-данных.\n\nJWT часто применяется для аутентификации:\n\n1. пользователь входит в систему;\n    \n2. сервер выдаёт JWT;\n    \n3. клиент передаёт его при последующих запросах;\n    \n4. сервер проверяет подпись и срок действия токена.\n    \n\nВажно: JWT — это **формат токена**, а не отдельный протокол аутентификации. Он может использоваться внутри OAuth 2.0, OpenID Connect или собственной системы авторизации.\n\n### Из чего состоит JWT\n\nНаиболее распространённый подписанный JWT состоит из трёх частей:\n\n```text\nheader.payload.signature\n```\n\nНапример:\n\n```text\neyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\n.\neyJzdWIiOiIxMjMiLCJyb2xlIjoidXNlciIsImV4cCI6MTc2MDAwMDAwMH0\n.\nqwerty_example_signature\n```\n\nЧасти разделяются точками. Такой формат основан на компактном представлении **JWS — JSON Web Signature**.\n\n### 1. Header — заголовок\n\nЗаголовок содержит метаданные токена:\n\n```json\n{\n  \"alg\": \"HS256\",\n  \"typ\": \"JWT\"\n}\n```\n\nОсновные поля:\n\n- `alg` — алгоритм создания подписи;\n    \n- `typ` — тип объекта, обычно `JWT`;\n    \n- `kid` — идентификатор ключа, когда сервер использует несколько ключей.\n    \n\nЗаголовок сериализуется в JSON, а затем кодируется через `Base64URL`.\n\nПример алгоритмов:\n\n- `HS256` — HMAC с SHA-256 и общим секретом;\n    \n- `RS256` — RSA с SHA-256, приватным и публичным ключами;\n    \n- `ES256` — ECDSA с SHA-256.\n    \n\nАлгоритмы JWT/JWS определены спецификацией JSON Web Algorithms.\n\n### 2. Payload — полезная нагрузка\n\nPayload содержит утверждения — `claims`:\n\n```json\n{\n  \"sub\": \"123\",\n  \"username\": \"alfob\",\n  \"role\": \"user\",\n  \"iat\": 1760000000,\n  \"exp\": 1760000900\n}\n```\n\nЧасто используемые зарегистрированные claims:\n\n|Claim|Значение|\n|---|---|\n|`sub`|Subject — идентификатор субъекта, обычно пользователя|\n|`iss`|Issuer — кто выпустил токен|\n|`aud`|Audience — для кого предназначен токен|\n|`exp`|Expiration time — момент окончания действия|\n|`nbf`|Not before — токен нельзя использовать раньше этого времени|\n|`iat`|Issued at — момент выпуска|\n|`jti`|JWT ID — уникальный идентификатор токена|\n\nКроме стандартных claims, приложение может добавлять собственные:\n\n```json\n{\n  \"user_id\": 42,\n  \"role\": \"admin\",\n  \"permissions\": [\"files:read\", \"files:write\"]\n}\n```\n\nPayload также кодируется через `Base64URL`.\n\n### Base64URL не является шифрованием\n\nHeader и payload обычно можно декодировать без знания секретного ключа.\n\nПоэтому в JWT нельзя помещать:\n\n```json\n{\n  \"password\": \"secret\",\n  \"bank_card\": \"1234...\",\n  \"private_key\": \"...\"\n}\n```\n\nПодпись защищает данные от незаметного изменения, но не скрывает их содержимое.\n\nУсловно:\n\n```text\nBase64URL ≠ шифрование\n```\n\nЗашифрованный вариант JWT существует и называется **JWE — JSON Web Encryption**, но обычные JWT в веб-приложениях чаще являются подписанными JWS.\n\n### 3. Signature — подпись\n\nПодпись подтверждает:\n\n- токен создан доверенной стороной;\n    \n- header и payload не были изменены после выпуска.\n    \n\nДля `HS256` принцип формирования подписи выглядит так:\n\n```text\nHMAC-SHA256(\n    base64url(header) + \".\" + base64url(payload),\n    secret_key\n)\n```\n\nРезультат также кодируется через `Base64URL`.\n\nИтоговый токен:\n\n```text\nbase64url(header).base64url(payload).base64url(signature)\n```\n\nЕсли злоумышленник изменит:\n\n```json\n{\n  \"role\": \"user\"\n}\n```\n\nна:\n\n```json\n{\n  \"role\": \"admin\"\n}\n```\n\npayload изменится, и старая подпись больше не будет соответствовать данным. Сервер должен отклонить такой токен.\n\n### HS256 и RS256\n\nПри `HS256` один секрет используется и для создания, и для проверки подписи:\n\n```text\nСервер выпускает токен  ─┐\n                         ├── secret_key\nСервер проверяет токен  ─┘\n```\n\nТот, кто может проверять подпись, при наличии секрета также может создавать токены.\n\nПри `RS256` используются два ключа:\n\n```text\nПриватный ключ → создание подписи\nПубличный ключ → проверка подписи\n```\n\nПубличный ключ можно передать другим сервисам: они смогут проверять токены, но не смогут выпускать новые.\n\n### Как JWT передаётся в HTTP\n\nОбычно токен передают в заголовке `Authorization`:\n\n```http\nGET /api/profile HTTP/1.1\nHost: example.com\nAuthorization: Bearer eyJhbGciOiJIUzI1NiIs...\n```\n\nСервер должен:\n\n1. извлечь токен;\n    \n2. проверить допустимость алгоритма;\n    \n3. проверить криптографическую подпись;\n    \n4. проверить `exp`, `nbf`, `iss`, `aud`;\n    \n5. определить пользователя по `sub` или другому идентификатору;\n    \n6. проверить права пользователя.\n    \n\nПросто декодировать payload недостаточно — токен обязательно нужно **валидировать**.\n\n### Access и refresh JWT\n\nВ типичной схеме используются два токена:\n\n```text\nAccess token  → короткий срок жизни, доступ к API\nRefresh token → более долгий срок жизни, получение нового access token\n```\n\nНапример:\n\n```text\nAccess token:  10 минут\nRefresh token: 7 дней\n```\n\nRefresh-токен обычно дополнительно отслеживают на сервере: сохраняют его `jti`, состояние отзыва или сессию в базе данных/Redis. Иначе полностью stateless JWT сложно немедленно отозвать до истечения `exp`.\n\n### Главное\n\nJWT в распространённом подписанном виде состоит из:\n\n```text\nHeader.Payload.Signature\n```\n\n- **Header** описывает алгоритм и тип токена.\n    \n- **Payload** содержит claims о пользователе и токене.\n    \n- **Signature** защищает header и payload от подмены.\n    \n- Header и payload обычно только закодированы, а не зашифрованы.\n    \n- Подпись не скрывает данные, а подтверждает их целостность и происхождение."
  popularity = 7.89

[[questions]]
  id = 4
  question = "Жизненный цикл JWT"
  answer = "### Важное уточнение\n\nУ JWT как формата нет обязательного «жизненного цикла». Его определяет приложение или протокол авторизации.\n\nВ типичной системе:\n\n- **access token** может быть JWT;\n    \n- **refresh token** может быть JWT, случайной строкой или другим непрозрачным значением;\n    \n- JWT не обязательно связан с OAuth 2.0.\n    \n\nJWT — это формат представления claims, а access token в OAuth является абстракцией: конкретный формат токена определяет сервер авторизации. \n\n### Общая схема\n\n```text\nАутентификация пользователя\n          ↓\nВыпуск access и refresh token\n          ↓\nИспользование access token\n          ↓\nПроверка токена на каждом запросе\n          ↓\n     ┌────┴──────────┐\n     ↓               ↓\nТокен действителен  Токен истёк\n     ↓               ↓\nДоступ к ресурсу    Обновление через refresh token\n                         ↓\n                 Новый access token\n                         ↓\n              Истечение или отзыв сессии\n```\n\n### 1. Аутентификация пользователя\n\nКлиент отправляет данные для входа:\n\n```text\nPOST /auth/login\nContent-Type: application/json\n\n{\n  \"username\": \"alfob\",\n  \"password\": \"password\"\n}\n```\n\nСервер:\n\n1. находит пользователя;\n    \n2. проверяет пароль;\n    \n3. проверяет состояние учётной записи;\n    \n4. определяет права пользователя;\n    \n5. создаёт токены.\n    \n\nНа этом этапе JWT ещё может не существовать. Сначала сервер должен удостовериться, кому он выдаёт токен.\n\n### 2. Создание JWT\n\nСервер формирует payload:\n\n```json\n{\n  \"sub\": \"42\",\n  \"iss\": \"https://auth.example.com\",\n  \"aud\": \"https://api.example.com\",\n  \"type\": \"access\",\n  \"role\": \"user\",\n  \"iat\": 1785456000,\n  \"nbf\": 1785456000,\n  \"exp\": 1785456900,\n  \"jti\": \"ec8ef5b5-33ef-4d3c-aef5-8e20c16b55bb\"\n}\n```\n\nОсновные claims:\n\n- `sub` — субъект токена, обычно ID пользователя;\n    \n- `iss` — сервер, выпустивший токен;\n    \n- `aud` — сервис, для которого предназначен токен;\n    \n- `iat` — время выпуска;\n    \n- `nbf` — время, раньше которого токен использовать нельзя;\n    \n- `exp` — время окончания действия;\n    \n- `jti` — уникальный идентификатор JWT.\n    \n\nЗатем сервер:\n\n1. создаёт header;\n    \n2. сериализует header и payload;\n    \n3. кодирует их через Base64URL;\n    \n4. создаёт криптографическую подпись.\n    \n\n```text\nheader.payload.signature\n```\n\nСогласно RFC 7519, после наступления `exp` JWT не должен приниматься, до наступления `nbf` — также не должен приниматься. Если присутствует `aud`, сервис должен проверить, что токен предназначен именно для него. \n\n### 3. Выдача токенов клиенту\n\nТипичный ответ:\n\n```text\nHTTP/1.1 200 OK\nContent-Type: application/json\nCache-Control: no-store\n\n{\n  \"access_token\": \"eyJhbGciOiJSUzI1NiIs...\",\n  \"refresh_token\": \"a-long-random-value\",\n  \"token_type\": \"Bearer\",\n  \"expires_in\": 900\n}\n```\n\nНапример:\n\n```text\nAccess token:  15 минут\nRefresh token: 7 дней\n```\n\nAccess token используется для обращения к API. Refresh token предназначен для получения нового access token и должен отправляться только серверу авторизации, а не обычному ресурсному API.\n\n### 4. Использование access token\n\nКлиент прикладывает access token к запросу:\n\n```text\nGET /api/profile\nAuthorization: Bearer eyJhbGciOiJSUzI1NiIs...\n```\n\nBearer означает: тот, кто владеет токеном, обычно может им воспользоваться. Поэтому его необходимо защищать от утечки и передавать через защищённое соединение. Стандартным способом передачи является заголовок `Authorization`.\n\n### 5. Проверка JWT сервером\n\nПри каждом защищённом запросе API выполняет несколько проверок.\n\n#### Формат\n\n```text\nheader.payload.signature\n```\n\nТокен должен корректно декодироваться и иметь ожидаемую структуру.\n\n#### Алгоритм\n\nСервер должен заранее определить разрешённые алгоритмы:\n\n```python\njwt.decode(\n    token,\n    public_key,\n    algorithms=[\"RS256\"],\n)\n```\n\nНельзя безусловно доверять значению `alg`, которое прислал сам клиент в header. Библиотека и приложение должны проверять, что алгоритм входит в заранее разрешённый набор.\n\n#### Подпись\n\nСервер проверяет подпись:\n\n```text\nverify(\n    header.payload,\n    signature,\n    verification_key\n)\n```\n\nПри `HS256` используется общий секрет. При `RS256` или `ES256` подпись обычно проверяется публичным ключом.\n\n#### Issuer\n\n```json\n{\n  \"iss\": \"https://auth.example.com\"\n}\n```\n\nAPI проверяет, что токен выпущен доверенным сервером и что ключ проверки действительно принадлежит этому issuer.\n\n#### Audience\n\n```json\n{\n  \"aud\": \"https://api.example.com\"\n}\n```\n\nТокен, предназначенный для другого API, должен быть отклонён.\n\n#### Время\n\nСервер проверяет:\n\n```text\nnbf <= текущее время < exp\n```\n\nТакже может учитываться небольшая погрешность часов — `clock skew`.\n\n#### Тип токена\n\nПолезно явно разделять токены:\n\n```json\n{\n  \"type\": \"access\"\n}\n```\n\nRefresh token нельзя принимать как access token только потому, что у него корректная подпись.\n\n#### Серверное состояние\n\nПри необходимости сервер дополнительно проверяет:\n\n- находится ли `jti` в списке отозванных;\n    \n- существует ли пользователь;\n    \n- активна ли учётная запись;\n    \n- не изменился ли пароль;\n    \n- не была ли завершена сессия;\n    \n- актуальны ли роли и разрешения.\n    \n\n### 6. Авторизация\n\nПосле проверки JWT сервер определяет, разрешено ли пользователю выполнить конкретное действие.\n\nНапример, токен действителен:\n\n```json\n{\n  \"sub\": \"42\",\n  \"role\": \"user\"\n}\n```\n\nНо запрос требует администратора:\n\n```text\nDELETE /api/users/10\n```\n\nРезультат:\n\n```text\nHTTP/1.1 403 Forbidden\n```\n\nТо есть:\n\n```text\nВалидный JWT ≠ разрешение на любую операцию\n```\n\nАутентификация отвечает на вопрос «кто пользователь», авторизация — «что ему разрешено».\n\n### 7. Истечение access token\n\nПосле наступления `exp` API отклоняет токен:\n\n```text\nHTTP/1.1 401 Unauthorized\nWWW-Authenticate: Bearer error=\"invalid_token\"\n```\n\nКлиент больше не должен использовать этот access token. RFC 6749 требует, чтобы ресурсный сервер проверял срок действия и область доступа токена.\n\n### 8. Обновление через refresh token\n\nКлиент отправляет refresh token серверу авторизации:\n\n```text\nPOST /auth/refresh\nContent-Type: application/json\n\n{\n  \"refresh_token\": \"a-long-random-value\"\n}\n```\n\nСервер проверяет:\n\n- подпись или наличие refresh token в хранилище;\n    \n- срок действия;\n    \n- тип токена;\n    \n- `jti`;\n    \n- владельца токена;\n    \n- состояние сессии;\n    \n- факт отзыва;\n    \n- допустимый client или устройство.\n    \n\nПосле успешной проверки выдаётся новый access token:\n\n```json\n{\n  \"access_token\": \"new-access-token\",\n  \"refresh_token\": \"new-refresh-token\",\n  \"token_type\": \"Bearer\",\n  \"expires_in\": 900\n}\n```\n\n### 9. Ротация refresh token\n\nБез ротации один refresh token используется многократно:\n\n```text\nRefresh A → Access 1\nRefresh A → Access 2\nRefresh A → Access 3\n```\n\nПри ротации каждый refresh token является одноразовым:\n\n```text\nRefresh A → Access 1 + Refresh B\nRefresh B → Access 2 + Refresh C\nRefresh C → Access 3 + Refresh D\n```\n\nПосле использования `Refresh A` становится недействительным.\n\nЕсли позднее кто-то повторно отправляет `Refresh A`, это может означать, что токен был украден. Сервер может отозвать всю связанную цепочку refresh-токенов и потребовать повторную аутентификацию. Актуальные рекомендации OAuth требуют для публичных клиентов применять ротацию refresh token либо криптографическую привязку токена к клиенту.\n\n### 10. Выход из системы\n\nПри logout клиент обычно:\n\n1. удаляет локальные токены;\n    \n2. отправляет refresh token или идентификатор сессии серверу;\n    \n3. сервер отзывает refresh token или всю сессию.\n    \n\n```text\nPOST /auth/logout\nAuthorization: Bearer <access-token>\n```\n\nВозможная серверная операция:\n\n```text\nsession.revoked = true\n```\n\nили:\n\n```text\nRedis:\nrevoked:refresh:<jti> = true\n```\n\n### Проблема отзыва access JWT\n\nСамодостаточный access JWT может оставаться криптографически действительным до наступления `exp`, даже если пользователь нажал logout.\n\nНапример:\n\n```text\n12:00 — выдан access token до 12:15\n12:05 — пользователь вышел\n12:06 — украденный access token всё ещё может пройти проверку\n12:15 — токен окончательно истёк\n```\n\nТак происходит, когда API проверяет только:\n\n```text\nподпись + exp + iss + aud\n```\n\nи не обращается к серверному хранилищу.\n\nДля немедленного отзыва используются:\n\n- blacklist по `jti`;\n    \n- серверная сессия;\n    \n- версия токенов пользователя;\n    \n- время последнего глобального logout;\n    \n- короткоживущие access-токены;\n    \n- introspection для непрозрачных токенов.\n    \n\n### Stateless и stateful варианты\n\n#### Полностью stateless access JWT\n\n```text\nAPI проверяет только JWT\nБаза или Redis не запрашиваются\n```\n\nПреимущества:\n\n- простая горизонтальная масштабируемость;\n    \n- быстрая локальная проверка;\n    \n- нет запроса в центральное хранилище на каждый API-вызов.\n    \n\nНедостаток:\n\n- сложно немедленно отозвать уже выданный токен.\n    \n\n#### JWT с серверным состоянием\n\n```text\nJWT + проверка jti/session/token_version в Redis или БД\n```\n\nПреимущества:\n\n- немедленный logout;\n    \n- блокировка отдельных устройств;\n    \n- отзыв украденных токенов;\n    \n- управление активными сессиями.\n    \n\nНедостаток:\n\n- дополнительный запрос к хранилищу;\n    \n- система уже не является полностью stateless.\n    \n\n### Полный пример жизненного цикла\n\n```text\n1. 12:00 — пользователь проходит аутентификацию\n\n2. Сервер выдаёт:\n   access token  до 12:15\n   refresh token до 19:00 следующей недели\n\n3. 12:05 — клиент вызывает API с access token\n\n4. API проверяет:\n   alg\n   подпись\n   iss\n   aud\n   nbf\n   exp\n   type\n   права пользователя\n\n5. 12:15 — access token истекает\n\n6. Клиент отправляет refresh token серверу авторизации\n\n7. Сервер выдаёт:\n   новый access token\n   новый refresh token\n\n8. Старый refresh token аннулируется\n\n9. Пользователь выходит из системы\n\n10. Сервер отзывает refresh token и сессию\n\n11. Дальнейшее обновление access token невозможно\n```\n\nГлавная идея жизненного цикла:\n\n```text\nАутентификация\n→ выпуск\n→ передача\n→ проверка\n→ использование\n→ истечение\n→ обновление\n→ ротация или отзыв\n→ завершение сессии\n```"
  popularity = 2.63

