  question = "На чём реализовать авторизацию в backend-приложении?"
  answer = "### Сначала разделим два понятия\n\n**Аутентификация** определяет, кто выполняет запрос:\n\n```text\nКто ты?\n→ пользователь 42\n```\n\n**Авторизация** определяет, разрешено ли этому пользователю выполнить действие:\n\n```text\nМожет ли пользователь 42 удалить файл 15?\n→ да / нет\n```\n\nJWT, cookie и OAuth в первую очередь помогают идентифицировать клиента. Сама авторизация реализуется проверками ролей, разрешений, владельца объекта и бизнес-правил на backend.\n\n```text\nSession / access token\n        ↓\nАутентификация пользователя\n        ↓\nПроверка permissions и бизнес-правил\n        ↓\nРазрешить или запретить действие\n```\n\n### Что выбрать для обычного web-приложения\n\nДля монолита или frontend/backend на одном сайте хороший базовый вариант:\n\n```text\nсерверная сессия\n+ HttpOnly cookie\n+ permissions в базе данных\n```\n\nСхема:\n\n```text\nПользователь входит\n        ↓\nBackend создаёт session_id\n        ↓\nsession_id сохраняется в cookie\n        ↓\nДанные сессии хранятся в Redis или БД\n        ↓\nНа каждом запросе backend получает пользователя\n        ↓\nПроверяет его права\n```\n\nCookie:\n\n```text\nSet-Cookie: session_id=abc123;\n            HttpOnly;\n            Secure;\n            SameSite=Lax;\n            Path=/\n```\n\nСледующий запрос:\n\n```text\nGET /api/profile\nCookie: session_id=abc123\n```\n\nПреимущества серверной сессии:\n\n- простое принудительное завершение сессии;\n    \n- легко заблокировать пользователя;\n    \n- легко отозвать конкретную сессию;\n    \n- нет необходимости реализовывать refresh-токены;\n    \n- браузер автоматически отправляет cookie.\n    \n\nДля обычного браузерного приложения это часто проще JWT.\n\nВ Django уже есть встроенная система пользователей, групп, разрешений и cookie-based sessions. \n\n### Когда использовать JWT\n\nJWT удобен, когда backend предоставляет API для нескольких независимых клиентов:\n\n```text\nweb frontend\nmobile application\nдругие сервисы\nпубличные API-клиенты\n```\n\nТипичная схема:\n\n```text\nAccess token\n├── короткий срок жизни\n├── передаётся в Authorization\n└── проверяется backend без обращения к session storage\n\nRefresh token\n├── живёт дольше\n├── используется только для обновления access token\n└── должен поддерживать отзыв и ротацию\n```\n\nЗапрос:\n\n```text\nGET /api/profile\nAuthorization: Bearer <access-token>\n```\n\nJWT — это лишь формат токена. RFC 7519 определяет его как компактный формат передачи claims, а RFC 9068 описывает профиль JWT для OAuth access token.\n\nBackend должен проверять как минимум:\n\n```text\nподпись\nexp — срок действия\niss — кто выпустил токен\naud — для какого API токен предназначен\nsub — субъект\nscope / permissions\n```\n\nJWT не следует использовать как базу данных прав пользователя. Например, роль в токене:\n\n```json\n{\n  \"sub\": \"42\",\n  \"role\": \"admin\",\n  \"exp\": 1785480000\n}\n```\n\nможет оставаться действительной до истечения токена, даже если пользователя уже лишили роли.\n\nПоэтому JWT обычно делают короткоживущим, а критические или динамические права дополнительно проверяют по базе данных или централизованному authorization-сервису.\n\n### OAuth 2.0 и OpenID Connect\n\nКогда требуется:\n\n- вход через Google, Microsoft или другой провайдер;\n    \n- единая учётная запись для нескольких приложений;\n    \n- SSO;\n    \n- несколько frontend и backend-сервисов;\n    \n- внешние API-клиенты;\n    \n- корпоративная система пользователей,\n    \n\nлучше использовать:\n\n```text\nOpenID Connect → аутентификация пользователя\nOAuth 2.0      → выдача access token и делегирование доступа\n```\n\nДля браузерных и мобильных клиентов обычно применяется:\n\n```text\nAuthorization Code Flow\n+ PKCE\n```\n\nАктуальные рекомендации OAuth требуют PKCE для публичных клиентов и рекомендуют его также для confidential clients.\n\nOpenID Connect строится поверх OAuth 2.0 и добавляет механизм аутентификации пользователя и `ID Token`. \n\nВ серьёзном проекте OAuth/OIDC-сервер обычно не пишут самостоятельно, а используют специализированный Identity Provider:\n\n```text\nFrontend\n    ↓\nIdentity Provider\n    ↓\naccess token\n    ↓\nBackend API\n```\n\nBackend проверяет токен и применяет собственные правила доступа.\n\n### Модели авторизации\n\n#### RBAC — роли\n\nПрава назначаются ролям:\n\n```text\nuser\neditor\nmoderator\nadmin\n```\n\nНапример:\n\n```text\nuser:\n    читать собственный профиль\n\neditor:\n    создавать и изменять статьи\n\nadmin:\n    управлять пользователями\n```\n\nТаблицы:\n\n```text\nusers\nroles\npermissions\nuser_roles\nrole_permissions\n```\n\nПроверка:\n\n```python\nif not current_user.has_permission(\"article.delete\"):\n    raise ForbiddenError()\n```\n\nRBAC подходит для большинства обычных приложений.\n\n#### Проверка владельца объекта\n\nОдной роли недостаточно.\n\nПользователь с ролью `user` может редактировать свой файл, но не чужой:\n\n```python\nfile = await File.get(id=file_id)\n\nif file.owner_id != current_user.id:\n    raise ForbiddenError()\n```\n\nПравильнее сразу ограничивать запрос:\n\n```python\nfile = await File.get(\n    id=file_id,\n    owner_id=current_user.id,\n)\n```\n\nЭто объектная авторизация:\n\n```text\nможет ли конкретный пользователь\nвыполнить конкретное действие\nнад конкретным объектом\n```\n\n#### ABAC — атрибуты\n\nРешение зависит от атрибутов:\n\n```text\nроль пользователя\nвладелец объекта\nотдел\nстатус документа\nвремя\nрегион\nуровень конфиденциальности\n```\n\nПример:\n\n```python\ncan_edit = (\n    document.owner_id == user.id\n    and document.status == \"draft\"\n)\n```\n\n#### ReBAC — отношения\n\nИспользуется, когда права зависят от связей:\n\n```text\nпользователь состоит в команде\nкоманда владеет проектом\nпроект содержит документ\n```\n\nЭто полезно в системах наподобие Google Drive, GitHub или корпоративных пространств.\n\n### Что обычно выбирать\n\nДля обычного проекта достаточно:\n\n```text\nRBAC\n+ проверки владельца объекта\n+ отдельные бизнес-правила\n```\n\nНапример:\n\n```text\nРоль разрешает:\n    удалять файлы\n\nПроверка объекта уточняет:\n    только собственные файлы\n\nБизнес-правило уточняет:\n    только файлы в статусе draft\n```\n\n### Пример организации в FastAPI\n\n```python\nfrom dataclasses import dataclass\nfrom typing import Annotated\n\nfrom fastapi import Depends, HTTPException, status\n\n\n@dataclass\nclass Principal:\n    user_id: int\n    permissions: set[str]\n\n\nasync def get_current_user() -> Principal:\n    \"\"\"\n    1. Получить session cookie или bearer token.\n    2. Проверить его.\n    3. Найти пользователя.\n    4. Получить permissions.\n    \"\"\"\n    return Principal(\n        user_id=42,\n        permissions={\"files.read\", \"files.delete\"},\n    )\n\n\nCurrentUser = Annotated[Principal, Depends(get_current_user)]\n\n\ndef require_permission(permission: str):\n    async def dependency(\n        user: CurrentUser,\n    ) -> Principal:\n        if permission not in user.permissions:\n            raise HTTPException(\n                status_code=status.HTTP_403_FORBIDDEN,\n                detail=\"Insufficient permissions\",\n            )\n\n        return user\n\n    return dependency\n```\n\nИспользование:\n\n```python\n@app.delete(\"/files/{file_id}\")\nasync def delete_file(\n    file_id: int,\n    user: Annotated[\n        Principal,\n        Depends(require_permission(\"files.delete\")),\n    ],\n):\n    file = await file_repository.get_by_id_and_owner(\n        file_id=file_id,\n        owner_id=user.user_id,\n    )\n\n    if file is None:\n        raise HTTPException(status_code=404)\n\n    await file_repository.delete(file)\n\n    return {\"status\": \"deleted\"}\n```\n\nЗдесь два уровня:\n\n```text\nrequire_permission(\"files.delete\")\n→ функциональное разрешение\n\nowner_id=user.user_id\n→ доступ к конкретному объекту\n```\n\nFastAPI security dependencies помогают извлекать credentials и описывать security scheme в OpenAPI, но решение о доступе всё равно должно быть реализовано в permissions-зависимостях и бизнес-логике.\n\n### Где хранить роли и permissions\n\nОбычно в базе данных:\n\n```text\nusers\n├── id\n└── status\n\nroles\n├── id\n└── name\n\npermissions\n├── id\n└── code\n\nuser_roles\n├── user_id\n└── role_id\n\nrole_permissions\n├── role_id\n└── permission_id\n```\n\nНапример:\n\n```text\npermission code:\nfiles.read\nfiles.create\nfiles.update\nfiles.delete\nusers.manage\n```\n\nПри большом количестве запросов permissions можно кешировать в Redis:\n\n```text\npermissions:user:42\n→ [\"files.read\", \"files.delete\"]\n```\n\nНо при изменении роли кеш необходимо инвалидировать.\n\n### Авторизация между сервисами\n\nДля взаимодействия сервисов не следует использовать пароль обычного пользователя.\n\nВозможные варианты:\n\n```text\nOAuth 2.0 Client Credentials\nmTLS\nкороткоживущие service tokens\nworkload identity\n```\n\nНапример:\n\n```text\nNotification Service\n        ↓ service credential\nAuthorization Server\n        ↓ access token\nPayment Service\n```\n\nДля особо чувствительных интеграций access token можно связать с клиентским TLS-сертификатом через OAuth mTLS.\n\nAPI key подходит для простого распознавания приложения:\n\n```text\nX-API-Key: <key>\n```\n\nНо один API key плохо подходит для сложной пользовательской авторизации, поскольку обычно не выражает владельца объекта, роли, сессию пользователя и контекст действия.\n\n### Основные правила\n\nАвторизацию нужно проверять:\n\n```text\nна backend\nна каждом запросе\nдля каждого объекта\nдля каждого критического действия\n```\n\nНельзя доверять frontend:\n\n```json\n{\n  \"user_id\": 42,\n  \"role\": \"admin\"\n}\n```\n\nBackend не должен принимать роль или владельца из request body как достоверные данные.\n\nПравильный порядок:\n\n```text\n1. Получить пользователя из проверенной session/token\n2. Загрузить объект\n3. Проверить permission\n4. Проверить владельца и бизнес-правила\n5. Выполнить операцию\n```\n\nДоступ должен быть запрещён по умолчанию, а разрешения должны проверяться на каждом запросе. \n\n### Практическая рекомендация\n\nДля обычного backend-приложения:\n\n```text\nFrontend и backend одного сайта:\n    server-side session\n    + HttpOnly cookie\n    + RBAC\n    + object-level permissions\n\nОтдельный SPA или мобильное приложение:\n    короткоживущий access token\n    + управляемый refresh token\n    + RBAC\n    + object-level permissions\n\nSSO, несколько приложений или внешние клиенты:\n    OAuth 2.0\n    + OpenID Connect\n    + внешний Identity Provider\n```\n\nДля FastAPI API с собственными пользователями практичная схема:\n\n```text\naccess token:\n    короткоживущий JWT\n\nrefresh token:\n    случайная непрозрачная строка\n    хранится в БД/Redis в виде хеша\n    поддерживает ротацию и отзыв\n\nauthorization:\n    permissions в БД\n    dependencies для общих проверок\n    проверка владельца в repository/service\n    deny by default\n```\n\nКлючевой вывод:\n\n```text\nJWT или session отвечает:\n    кто выполняет запрос\n\nRBAC / ABAC / ownership checks отвечают:\n    что именно ему разрешено\n```\n\nПоэтому авторизацию следует реализовывать не «на JWT», а в отдельном слое правил доступа, используя session или токен только как надёжный способ определить текущего пользователя."
