[[questions]]
  id = 16
  question = "В каких частях HTTP-запроса можно передавать полезные данные в API?"
  answer = "### Основные места передачи данных\n\nВ HTTP-запросе полезные данные для API обычно передают в четырёх местах:\n\n```text\n1. Path-параметры\n2. Query-параметры\n3. Заголовки\n4. Тело запроса\n```\n\nДополнительно данные могут передаваться через cookies, которые на уровне HTTP являются значением заголовка `Cookie`.\n\nПолный запрос может выглядеть так:\n\n```text\nPATCH /users/42?notify=true HTTP/1.1\nHost: api.example.com\nAuthorization: Bearer <access-token>\nContent-Type: application/json\nX-Request-ID: 8e735c2d\n\n{\n  \"email\": \"new@example.com\"\n}\n```\n\nЗдесь:\n\n```text\n/users/42              → path\nnotify=true            → query-параметр\nAuthorization и другие → headers\nJSON                    → body\n```\n\nHTTP-запрос содержит метод и целевой URI, а также может содержать заголовки, тело и, значительно реже, завершающие поля — trailers. \n\n### 1. Path-параметры\n\nPath-параметры идентифицируют конкретный ресурс или иерархию ресурсов:\n\n```text\nGET /users/42\nGET /orders/1001/items/15\nDELETE /files/725\n```\n\nВ маршруте:\n\n```text\n/users/{user_id}\n```\n\nзначение `42` является path-параметром:\n\n```text\nuser_id = 42\n```\n\nПример FastAPI:\n\n```python\nfrom fastapi import FastAPI\n\napp = FastAPI()\n\n\n@app.get(\"/users/{user_id}\")\nasync def get_user(user_id: int):\n    return {\"user_id\": user_id}\n```\n\nPath-параметры обычно используют для обязательного идентификатора ресурса:\n\n```text\nGET /users/42\n```\n\nа не для необязательных настроек:\n\n```text\nGET /users/42/true/20/desc\n```\n\n### 2. Query-параметры\n\nQuery-параметры находятся после символа `?`:\n\n```text\nGET /users?status=active&limit=20&offset=40\n```\n\nСтруктура:\n\n```text\n?status=active&limit=20&offset=40\n```\n\nОни обычно используются для:\n\n- фильтрации;\n    \n- сортировки;\n    \n- пагинации;\n    \n- поиска;\n    \n- выбора дополнительных полей;\n    \n- необязательных параметров.\n    \n\nПримеры:\n\n```text\nGET /products?category=books\nGET /products?sort=price&order=asc\nGET /users?limit=20&offset=40\nGET /articles?search=python\n```\n\nFastAPI:\n\n```python\n@app.get(\"/users\")\nasync def get_users(\n    status: str | None = None,\n    limit: int = 20,\n    offset: int = 0,\n):\n    return {\n        \"status\": status,\n        \"limit\": limit,\n        \"offset\": offset,\n    }\n```\n\nPath и query являются частями целевого URI запроса. RFC 9110 определяет запрос как сочетание метода и request target, который определяет целевой ресурс.\n\n### 3. Заголовки\n\nЗаголовки передают метаданные и управляющую информацию:\n\n```text\nAuthorization: Bearer <access-token>\nContent-Type: application/json\nAccept: application/json\nIf-None-Match: \"user-42-v3\"\nX-Request-ID: 624f4125\n```\n\nТипичные назначения:\n\n|Заголовок|Что передаёт|\n|---|---|\n|`Authorization`|данные аутентификации|\n|`Content-Type`|формат тела запроса|\n|`Accept`|желаемый формат ответа|\n|`Cookie`|cookies клиента|\n|`If-None-Match`|условие для кэширования|\n|`Idempotency-Key`|идентификатор операции|\n|`User-Agent`|информацию о клиенте|\n|`Accept-Language`|предпочитаемый язык|\n\nПример:\n\n```text\nPOST /orders HTTP/1.1\nAuthorization: Bearer <token>\nContent-Type: application/json\nAccept: application/json\nIdempotency-Key: order-2026-00015\n```\n\nЗаголовки предназначены прежде всего для метаданных, условий обработки, аутентификации и характеристик представления, а не для передачи большой бизнес-структуры. RFC 9110 прямо описывает request headers как средство передачи модификаторов запроса, сведений о клиенте и метаданных представления.\n\n### 4. Тело запроса\n\nBody используют для передачи основной структуры данных:\n\n```text\nPOST /users HTTP/1.1\nContent-Type: application/json\n\n{\n  \"username\": \"alfob\",\n  \"email\": \"user@example.com\"\n}\n```\n\nТело особенно характерно для:\n\n```text\nPOST\nPUT\nPATCH\n```\n\nHTTP допускает содержимое запроса, смысл которого определяется методом. \n\n#### JSON\n\n```text\nContent-Type: application/json\n```\n\n```json\n{\n  \"product_id\": 15,\n  \"quantity\": 2\n}\n```\n\nFastAPI:\n\n```python\nfrom pydantic import BaseModel\n\n\nclass OrderCreate(BaseModel):\n    product_id: int\n    quantity: int\n\n\n@app.post(\"/orders\")\nasync def create_order(order: OrderCreate):\n    return order\n```\n\n#### Form URL encoded\n\nОбычно используется для простых HTML-форм и некоторых OAuth-endpoint:\n\n```text\nContent-Type: application/x-www-form-urlencoded\n\nusername=alfob&password=secret\n```\n\n#### Multipart form data\n\nПрименяется для загрузки файлов и смешанных данных:\n\n```text\nContent-Type: multipart/form-data; boundary=example\n```\n\nУсловно:\n\n```text\nfile        → document.pdf\ndescription → Annual report\ncategory    → finance\n```\n\n#### Бинарные данные\n\nТело может содержать непосредственно файл:\n\n```text\nPUT /files/42\nContent-Type: application/pdf\n\n<binary PDF data>\n```\n\n### 5. Cookies\n\nКлиент может передавать cookies:\n\n```text\nCookie: session_id=abc123; theme=dark\n```\n\nНа уровне HTTP это обычный заголовок:\n\n```text\nCookie\n```\n\nCookies часто используют для:\n\n- идентификатора серверной сессии;\n    \n- CSRF-данных;\n    \n- пользовательских настроек;\n    \n- refresh token в защищённой `HttpOnly` cookie.\n    \n\nFastAPI:\n\n```python\nfrom fastapi import Cookie\n\n\n@app.get(\"/profile\")\nasync def profile(\n    session_id: str | None = Cookie(default=None),\n):\n    return {\"session_id\": session_id}\n```\n\nДля бизнес-параметров вроде `product_id` или `quantity` cookies обычно не подходят: их основное назначение — состояние браузерного взаимодействия.\n\n### 6. HTTP-метод\n\nСам метод тоже передаёт важную семантическую информацию:\n\n```text\nGET /users/42\nDELETE /users/42\n```\n\nЦелевой URI один и тот же:\n\n```text\n/users/42\n```\n\nНо операция различается:\n\n```text\nGET    → получить представление\nDELETE → удалить ресурс\n```\n\nМетод не является контейнером произвольных данных, но является обязательной частью смысла запроса. HTTP определяет назначение операции именно через метод, применяемый к целевому ресурсу.\n\n### 7. Trailer-поля\n\nHTTP поддерживает trailer-поля, передаваемые после тела сообщения:\n\n```text\nHeaders\nBody\nTrailers\n```\n\nОни могут содержать информацию, которую отправитель вычисляет только после передачи содержимого, например итоговую контрольную сумму. На практике в обычных REST API trailers используются редко. RFC 9110 включает trailer fields в возможную структуру HTTP-запроса. \n\n### Что не передаётся серверу: URL fragment\n\nЧасть URL после `#`:\n\n```text\nhttps://example.com/users?page=2#details\n                                └─────── fragment\n```\n\nFragment обычно обрабатывается клиентом и не является частью HTTP request target:\n\n```text\nGET /users?page=2 HTTP/1.1\n```\n\nСервер не получает:\n\n```text\n#details\n```\n\nПоэтому fragment нельзя использовать для передачи API-параметров.\n\n### Куда какие данные помещать\n\n|Данные|Место|\n|---|---|\n|ID конкретного ресурса|Path|\n|Фильтрация и пагинация|Query|\n|Формат, токен, метаданные|Headers|\n|Создаваемый или изменяемый объект|Body|\n|Браузерная сессия|Cookie|\n|Смысл операции|HTTP-метод|\n\nПример:\n\n```text\nPATCH /users/42?send_confirmation=true HTTP/1.1\nAuthorization: Bearer <token>\nContent-Type: application/json\nAccept: application/json\n\n{\n  \"email\": \"new@example.com\"\n}\n```\n\nРазбор:\n\n```text\nPATCH                    → частичное изменение\n/users/42                → пользователь 42\nsend_confirmation=true   → дополнительная настройка\nAuthorization            → аутентификация\nContent-Type             → формат тела\nJSON body                → новые данные пользователя\n```\n\n### Где не следует передавать секреты\n\nПароли, access token и API key нежелательно помещать в URL:\n\n```text\nGET /login?password=secret\nGET /users?access_token=eyJ...\n```\n\nURL может попасть в:\n\n- историю браузера;\n    \n- журналы сервера и прокси;\n    \n- системы аналитики;\n    \n- мониторинг;\n    \n- сообщения об ошибках;\n    \n- заголовок `Referer` в некоторых сценариях.\n    \n\nТокены обычно передают в заголовке:\n\n```text\nAuthorization: Bearer <access-token>\n```\n\nПароль при входе — в теле защищённого HTTPS-запроса:\n\n```text\nPOST /auth/login\nContent-Type: application/json\n\n{\n  \"username\": \"alfob\",\n  \"password\": \"secret\"\n}\n```\n\n### Итог\n\nПрактически HTTP-запрос к API содержит:\n\n```text\nHTTP request\n├── method\n├── target URI\n│   ├── path\n│   └── query\n├── headers\n│   └── cookies\n├── body — необязательно\n└── trailers — редко\n```\n\nОсновное правило:\n\n```text\nPath    → какой ресурс\nQuery   → как выбрать или обработать\nHeaders → служебные данные и метаданные\nBody    → основная передаваемая структура\nMethod  → какое действие выполнить\n```"
