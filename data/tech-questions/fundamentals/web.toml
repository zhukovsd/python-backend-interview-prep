[[questions]]
  id = 39
  question = "Как вернуть клиенту понятный ответ, не раскрывая инфраструктурные детали?"
  answer = "### Основной принцип\n\nКлиенту возвращают информацию, необходимую для понимания и исправления ошибки, а технические подробности записывают во внутренние логи:\n\n```text\nКлиент:\nчто произошло\nкакой тип ошибки\nчто можно исправить\nидентификатор запроса\n\nЛоги:\nисключение\nstack trace\nSQL/ошибка драйвера\nсостояние зависимостей\nвнутренние идентификаторы\n```\n\nТо есть:\n\n```text\nпонятный публичный ответ\n+\nподробный внутренний лог\n```\n\n### Единый формат ошибок\n\nДля HTTP API удобно использовать `application/problem+json`, определённый RFC 9457:\n\n```text\nHTTP/1.1 422 Unprocessable Content\nContent-Type: application/problem+json\nX-Request-ID: 7fb67c28-864d-4b74-988d-ecdd8ae5df54\n```\n\n```json\n{\n  \"type\": \"/problems/validation-error\",\n  \"title\": \"Ошибка валидации\",\n  \"status\": 422,\n  \"detail\": \"Некоторые поля содержат недопустимые значения\",\n  \"instance\": \"/requests/7fb67c28-864d-4b74-988d-ecdd8ae5df54\",\n  \"code\": \"VALIDATION_ERROR\",\n  \"errors\": [\n    {\n      \"field\": \"quantity\",\n      \"code\": \"out_of_range\",\n      \"message\": \"Количество должно быть от 1 до 100\"\n    }\n  ]\n}\n```\n\nRFC 9457 определяет стандартные поля `type`, `title`, `status`, `detail` и `instance`. Поле `detail` должно помогать клиенту понять конкретную проблему, а не раскрывать отладочную информацию. Для машинной обработки лучше использовать стабильные поля вроде `type` или собственного `code`, а не разбирать текст `detail`. \n\n### Что означают поля\n\n```text\ntype\n→ стабильный идентификатор категории ошибки\n\ntitle\n→ краткое человекочитаемое название\n\nstatus\n→ HTTP status code\n\ndetail\n→ безопасное описание конкретного случая\n\ninstance\n→ идентификатор конкретного возникновения ошибки\n\ncode\n→ прикладной машинный код\n\nerrors\n→ ошибки отдельных полей\n```\n\nFrontend должен ориентироваться на:\n\n```javascript\nif (error.code === \"EMAIL_ALREADY_EXISTS\") {\n    showEmailConflict();\n}\n```\n\nА не на текст:\n\n```javascript\n// Ненадёжно\nif (error.detail === \"Пользователь с таким email уже существует\") {\n    // ...\n}\n```\n\nТекст можно перевести или изменить, а стабильный код должен сохраняться.\n\n### Какие ответы возвращать\n\n#### Ошибка валидации\n\n```text\nHTTP/1.1 422 Unprocessable Content\n```\n\n```json\n{\n  \"type\": \"/problems/validation-error\",\n  \"title\": \"Ошибка валидации\",\n  \"status\": 422,\n  \"detail\": \"Проверьте переданные значения\",\n  \"code\": \"VALIDATION_ERROR\",\n  \"errors\": [\n    {\n      \"field\": \"email\",\n      \"code\": \"invalid_format\",\n      \"message\": \"Укажите корректный email\"\n    }\n  ]\n}\n```\n\n#### Конфликт состояния\n\n```text\nHTTP/1.1 409 Conflict\n```\n\n```json\n{\n  \"type\": \"/problems/email-conflict\",\n  \"title\": \"Email уже используется\",\n  \"status\": 409,\n  \"detail\": \"Укажите другой email\",\n  \"code\": \"EMAIL_ALREADY_EXISTS\"\n}\n```\n\n#### Недостаточно прав\n\n```text\nHTTP/1.1 403 Forbidden\n```\n\n```json\n{\n  \"type\": \"/problems/forbidden\",\n  \"title\": \"Доступ запрещён\",\n  \"status\": 403,\n  \"detail\": \"У вас нет прав для выполнения этой операции\",\n  \"code\": \"ACCESS_DENIED\"\n}\n```\n\nНе нужно раскрывать внутреннюю проверку:\n\n```text\nЗапрещено, потому что:\nrole_id=3 отсутствует в таблице role_permissions,\npermission_id=17, tenant_id=92\n```\n\n#### Непредвиденная ошибка\n\n```text\nHTTP/1.1 500 Internal Server Error\n```\n\n```json\n{\n  \"type\": \"/problems/internal-error\",\n  \"title\": \"Внутренняя ошибка\",\n  \"status\": 500,\n  \"detail\": \"Не удалось обработать запрос\",\n  \"code\": \"INTERNAL_ERROR\",\n  \"request_id\": \"7fb67c28-864d-4b74-988d-ecdd8ae5df54\"\n}\n```\n\nКлиенту не нужно знать, произошла ли ошибка в PostgreSQL, Redis, RabbitMQ или стороннем API.\n\nOWASP рекомендует возвращать клиентам общие сообщения об ошибках, не раскрывая лишние причины сбоя, а подробности сохранять на стороне сервера. \n\n### Что нельзя возвращать клиенту\n\nПлохой ответ:\n\n```json\n{\n  \"detail\": \"asyncpg.exceptions.UniqueViolationError\",\n  \"table\": \"users\",\n  \"constraint\": \"users_email_key\",\n  \"sql\": \"INSERT INTO users ...\",\n  \"database_host\": \"postgres.internal:5432\",\n  \"file\": \"/app/repositories/users.py\",\n  \"line\": 84,\n  \"stack_trace\": \"Traceback ...\"\n}\n```\n\nНе следует раскрывать:\n\n```text\nstack trace\nклассы внутренних исключений\nSQL-запросы\nструктуру таблиц\nимена constraints\nпути файловой системы\nвнутренние IP, hostnames и порты\nверсии серверного ПО\nпеременные окружения\nсекретные ключи\nтокены и cookies\nответы внутренних сервисов целиком\n```\n\nТакие данные помогают исследовать внутреннее устройство приложения и иногда содержат чувствительную информацию.\n\n### Что записывать в лог\n\nДля того же запроса сервер может записать:\n\n```text\nlevel=ERROR\nrequest_id=7fb67c28-864d-4b74-988d-ecdd8ae5df54\nmethod=POST\npath=/api/users\nuser_id=42\nexception=UniqueViolationError\nconstraint=users_email_key\nduration_ms=184\n```\n\nИ полный stack trace:\n\n```text\nTraceback (most recent call last):\n  ...\nasyncpg.exceptions.UniqueViolationError\n```\n\nПолезные поля:\n\n```text\nrequest_id / trace_id\nвремя\nметод и маршрут\nHTTP-статус\nидентификатор пользователя\nдлительность запроса\nтип исключения\nstack trace\nназвание внутренней операции\nсостояние upstream-зависимости\n```\n\nНо в логах также нельзя сохранять пароли, access/refresh-токены, session cookies, ключи API и другие секреты. OWASP рекомендует логировать ошибки и системные события, очищать пользовательские данные от log injection и защищать журналы как чувствительные данные. \n\n### Зачем нужен `request_id`\n\nКлиент получает:\n\n```json\n{\n  \"code\": \"INTERNAL_ERROR\",\n  \"request_id\": \"7fb67c28-864d-4b74-988d-ecdd8ae5df54\"\n}\n```\n\nПользователь сообщает этот идентификатор поддержке, а разработчик находит соответствующие записи:\n\n```text\nFrontend error\n    ↓ request_id\nNginx log\n    ↓\nBackend log\n    ↓\nWorker log\n    ↓\nExternal API trace\n```\n\nСам `request_id` не должен содержать:\n\n```text\nuser_id\nemail\nIP-адрес\nназвание сервера\nпоследовательный номер записи БД\n```\n\nЛучше использовать случайный UUID или идентификатор трассировки.\n\n### Разделяйте ожидаемые и неожиданные ошибки\n\n#### Ожидаемые\n\nЭто часть контракта приложения:\n\n```text\nпользователь не найден\nemail уже занят\nтовара нет на складе\nнедостаточно прав\nневалидные поля\n```\n\nДля них создаются конкретные коды:\n\n```text\nUSER_NOT_FOUND\nEMAIL_ALREADY_EXISTS\nINSUFFICIENT_STOCK\nACCESS_DENIED\nVALIDATION_ERROR\n```\n\n#### Неожиданные\n\nЭто внутренние сбои:\n\n```text\nошибка БД\nнеобработанное исключение\nRedis недоступен\nошибка сериализации\nсторонний API вернул неожиданный ответ\n```\n\nКлиенту возвращается обобщённый ответ:\n\n```json\n{\n  \"code\": \"INTERNAL_ERROR\",\n  \"detail\": \"Не удалось обработать запрос\"\n}\n```\n\nА подробности остаются в логах.\n\n### Пример в FastAPI\n\n```python\nimport logging\nfrom dataclasses import dataclass\nfrom uuid import uuid4\n\nfrom fastapi import FastAPI, Request\nfrom fastapi.responses import JSONResponse\n\nlogger = logging.getLogger(__name__)\n\napp = FastAPI()\n\n\n@dataclass\nclass ApplicationError(Exception):\n    status_code: int\n    code: str\n    title: str\n    detail: str\n\n\n@app.middleware(\"http\")\nasync def request_id_middleware(\n    request: Request,\n    call_next,\n):\n    request_id = str(uuid4())\n    request.state.request_id = request_id\n\n    response = await call_next(request)\n    response.headers[\"X-Request-ID\"] = request_id\n\n    return response\n\n\n@app.exception_handler(ApplicationError)\nasync def handle_application_error(\n    request: Request,\n    exc: ApplicationError,\n) -> JSONResponse:\n    request_id = request.state.request_id\n\n    return JSONResponse(\n        status_code=exc.status_code,\n        media_type=\"application/problem+json\",\n        headers={\"X-Request-ID\": request_id},\n        content={\n            \"type\": f\"/problems/{exc.code.lower()}\",\n            \"title\": exc.title,\n            \"status\": exc.status_code,\n            \"detail\": exc.detail,\n            \"code\": exc.code,\n            \"request_id\": request_id,\n        },\n    )\n\n\n@app.exception_handler(Exception)\nasync def handle_unexpected_error(\n    request: Request,\n    exc: Exception,\n) -> JSONResponse:\n    request_id = request.state.request_id\n\n    logger.exception(\n        \"Unhandled request error\",\n        extra={\n            \"request_id\": request_id,\n            \"method\": request.method,\n            \"path\": request.url.path,\n        },\n    )\n\n    return JSONResponse(\n        status_code=500,\n        media_type=\"application/problem+json\",\n        headers={\"X-Request-ID\": request_id},\n        content={\n            \"type\": \"/problems/internal-error\",\n            \"title\": \"Внутренняя ошибка\",\n            \"status\": 500,\n            \"detail\": \"Не удалось обработать запрос\",\n            \"code\": \"INTERNAL_ERROR\",\n            \"request_id\": request_id,\n        },\n    )\n```\n\nИспользование ожидаемой ошибки:\n\n```python\n@app.get(\"/users/{user_id}\")\nasync def get_user(user_id: int):\n    user = await user_repository.get(user_id)\n\n    if user is None:\n        raise ApplicationError(\n            status_code=404,\n            code=\"USER_NOT_FOUND\",\n            title=\"Пользователь не найден\",\n            detail=\"Пользователь с указанным идентификатором не существует\",\n        )\n\n    return user\n```\n\n### Не раскрывайте внутреннюю зависимость\n\nПлохо:\n\n```json\n{\n  \"detail\": \"Redis at redis-master.internal:6379 is unavailable\"\n}\n```\n\nЛучше:\n\n```text\nHTTP/1.1 503 Service Unavailable\n```\n\n```json\n{\n  \"type\": \"/problems/service-unavailable\",\n  \"title\": \"Сервис временно недоступен\",\n  \"status\": 503,\n  \"detail\": \"Повторите запрос позднее\",\n  \"code\": \"SERVICE_UNAVAILABLE\",\n  \"request_id\": \"...\"\n}\n```\n\nВо внутреннем логе:\n\n```text\nRedisConnectionError:\nhost=redis-master.internal\nport=6379\ntimeout=1.0\n```\n\n### Итоговая схема\n\n```text\nОшибка\n  ↓\nОпределить ожидаемая она или внутренняя\n  ↓\nВыбрать корректный HTTP-статус\n  ↓\nВернуть application/problem+json\n  ↓\nДобавить стабильный code\n  ↓\nДобавить безопасный detail\n  ↓\nДобавить request_id\n  ↓\nТехнические детали записать в защищённый лог\n```\n\nГлавное правило:\n\n```text\nКлиенту:\n«что произошло и что делать»\n\nРазработчику в логах:\n«где, почему и с каким исключением это произошло»\n```"
  popularity = 2.63

