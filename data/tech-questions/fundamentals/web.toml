  id = 15
  question = "Как подключаться к API без официального SDK?"
  answer = "### Основная идея\n\nОфициальный SDK не обязателен. SDK обычно лишь оборачивает обычные HTTP-запросы в методы и классы:\n\n```python\nclient.get_user(user_id=42)\n```\n\nБез SDK вы самостоятельно формируете запрос:\n\n```text\nGET /v1/users/42 HTTP/1.1\nHost: api.example.com\nAuthorization: Bearer <token>\nAccept: application/json\n```\n\nДля подключения нужны:\n\n- базовый URL API;\n    \n- endpoint и HTTP-метод;\n    \n- способ аутентификации;\n    \n- параметры запроса;\n    \n- формат тела;\n    \n- структура ответа;\n    \n- возможные статус-коды и ошибки.\n    \n\n### 1. Изучить документацию API\n\nДокументация должна описывать операцию примерно так:\n\n```text\nGET /v1/users/{user_id}\n\nPath:\n    user_id: integer\n\nHeaders:\n    Authorization: Bearer <token>\n\nResponse:\n    200 — пользователь найден\n    401 — токен недействителен\n    404 — пользователь не найден\n```\n\nЕсли сервис публикует OpenAPI-схему, в ней могут быть формально описаны:\n\n- доступные пути;\n    \n- HTTP-операции;\n    \n- параметры;\n    \n- тела запросов;\n    \n- ответы;\n    \n- схемы данных.\n    \n\nOpenAPI также может использоваться инструментами для автоматической генерации клиентского кода. \n\n### 2. Проверить запрос через curl\n\nПеред написанием кода удобно выполнить запрос вручную:\n\n```bash\ncurl --request GET \\\n  --url \"https://api.example.com/v1/users/42\" \\\n  --header \"Authorization: Bearer ACCESS_TOKEN\" \\\n  --header \"Accept: application/json\"\n```\n\nPOST-запрос с JSON:\n\n```bash\ncurl --request POST \\\n  --url \"https://api.example.com/v1/orders\" \\\n  --header \"Authorization: Bearer ACCESS_TOKEN\" \\\n  --header \"Content-Type: application/json\" \\\n  --data '{\n    \"product_id\": 15,\n    \"quantity\": 2\n  }'\n```\n\nТак можно отдельно проверить URL, авторизацию и формат данных до интеграции API в приложение.\n\n### 3. Использовать обычный HTTP-клиент\n\nВ Python можно использовать:\n\n- `httpx`;\n    \n- `requests`;\n    \n- `aiohttp`;\n    \n- стандартный `urllib`.\n    \n\nДля FastAPI и другого асинхронного кода удобно использовать `httpx.AsyncClient`. HTTPX предоставляет синхронный и асинхронный интерфейсы, а для асинхронных веб-фреймворков рекомендует асинхронный клиент. \n\n### Синхронный пример\n\n```python\nfrom typing import Any\n\nimport httpx\n\n\ndef get_user(\n    user_id: int,\n    access_token: str,\n) -> dict[str, Any]:\n    response = httpx.get(\n        f\"https://api.example.com/v1/users/{user_id}\",\n        headers={\n            \"Authorization\": f\"Bearer {access_token}\",\n            \"Accept\": \"application/json\",\n        },\n        timeout=10.0,\n    )\n\n    response.raise_for_status()\n    return response.json()\n```\n\n`raise_for_status()` создаёт исключение для ошибочного HTTP-статуса, а `response.json()` преобразует JSON-ответ в Python-объект. \n\n### Асинхронный пример\n\n```python\nfrom typing import Any\n\nimport httpx\n\n\nasync def get_user(\n    client: httpx.AsyncClient,\n    user_id: int,\n    access_token: str,\n) -> dict[str, Any]:\n    response = await client.get(\n        f\"/v1/users/{user_id}\",\n        headers={\n            \"Authorization\": f\"Bearer {access_token}\",\n        },\n    )\n\n    response.raise_for_status()\n    return response.json()\n```\n\nСоздание клиента:\n\n```python\nclient = httpx.AsyncClient(\n    base_url=\"https://api.example.com\",\n    timeout=10.0,\n    headers={\n        \"Accept\": \"application/json\",\n    },\n)\n```\n\n### 4. Передавать данные правильным способом\n\n#### Query-параметры\n\n```python\nresponse = await client.get(\n    \"/v1/users\",\n    params={\n        \"status\": \"active\",\n        \"limit\": 20,\n        \"offset\": 0,\n    },\n)\n```\n\nПолучится запрос:\n\n```text\nGET /v1/users?status=active&limit=20&offset=0\n```\n\n#### JSON-тело\n\n```python\nresponse = await client.post(\n    \"/v1/orders\",\n    json={\n        \"product_id\": 15,\n        \"quantity\": 2,\n    },\n)\n```\n\n#### Form data\n\n```python\nresponse = await client.post(\n    \"/oauth/token\",\n    data={\n        \"grant_type\": \"client_credentials\",\n        \"client_id\": client_id,\n        \"client_secret\": client_secret,\n    },\n)\n```\n\nHTTPX поддерживает параметры `params`, `json`, `data`, `files`, `headers`, `cookies` и `auth`. \n\n### 5. Настроить аутентификацию\n\nСпособ зависит от API.\n\n#### Bearer token\n\n```python\nheaders = {\n    \"Authorization\": f\"Bearer {access_token}\",\n}\n```\n\n#### API key\n\n```python\nheaders = {\n    \"X-API-Key\": api_key,\n}\n```\n\n#### Basic Authentication\n\n```python\nresponse = await client.get(\n    \"/v1/resource\",\n    auth=(\"username\", \"password\"),\n)\n```\n\nСекретные ключи не следует хранить в исходном коде:\n\n```python\nAPI_KEY = \"production-secret\"\n```\n\nОбычно их получают из переменных окружения или защищённого хранилища секретов:\n\n```python\nimport os\n\napi_key = os.environ[\"EXTERNAL_API_KEY\"]\n```\n\n### 6. Проверять статус ответа\n\nПолучение HTTP-ответа ещё не означает успешное выполнение операции:\n\n```python\nresponse = await client.get(\"/v1/users/42\")\n\nif response.status_code == 200:\n    return response.json()\n\nif response.status_code == 404:\n    return None\n\nif response.status_code == 401:\n    raise ExternalAuthenticationError()\n\nif response.status_code == 429:\n    raise ExternalRateLimitError()\n\nif response.status_code >= 500:\n    raise ExternalServiceUnavailableError()\n```\n\nМожно использовать `raise_for_status()`, но часто приложению требуется отдельно преобразовать статусы стороннего API в собственные исключения.\n\n### 7. Обрабатывать сетевые ошибки\n\nНужно различать:\n\n- API вернул `400`, `404` или `500`;\n    \n- соединение не установлено;\n    \n- истёк timeout;\n    \n- получен некорректный ответ;\n    \n- ответ не соответствует ожидаемой схеме.\n    \n\n```python\nimport httpx\n\n\nclass ExternalApiError(Exception):\n    pass\n\n\nasync def request_user(\n    client: httpx.AsyncClient,\n    user_id: int,\n) -> dict:\n    try:\n        response = await client.get(f\"/v1/users/{user_id}\")\n        response.raise_for_status()\n        return response.json()\n\n    except httpx.TimeoutException as exc:\n        raise ExternalApiError(\n            \"External API timeout\"\n        ) from exc\n\n    except httpx.HTTPStatusError as exc:\n        raise ExternalApiError(\n            f\"External API returned \"\n            f\"{exc.response.status_code}\"\n        ) from exc\n\n    except httpx.RequestError as exc:\n        raise ExternalApiError(\n            \"External API request failed\"\n        ) from exc\n\n    except ValueError as exc:\n        raise ExternalApiError(\n            \"External API returned invalid JSON\"\n        ) from exc\n```\n\nHTTPX позволяет задавать отдельные ограничения времени на подключение, чтение, запись и ожидание соединения из пула. \n\n### 8. Переиспользовать HTTP-клиент\n\nПлохо создавать новый клиент внутри каждого часто выполняемого вызова:\n\n```python\nasync def get_user():\n    async with httpx.AsyncClient() as client:\n        ...\n```\n\nЛучше создать один `AsyncClient` на время жизни приложения:\n\n```python\nfrom contextlib import asynccontextmanager\n\nimport httpx\nfrom fastapi import FastAPI\n\n\n@asynccontextmanager\nasync def lifespan(app: FastAPI):\n    app.state.external_client = httpx.AsyncClient(\n        base_url=\"https://api.example.com\",\n        timeout=10.0,\n    )\n\n    try:\n        yield\n    finally:\n        await app.state.external_client.aclose()\n\n\napp = FastAPI(lifespan=lifespan)\n```\n\nДолгоживущий `Client` или `AsyncClient` использует пул соединений и может переиспользовать существующие соединения, тогда как отдельные вызовы через верхнеуровневые функции создают новое соединение для каждого запроса. \n\n### 9. Валидировать ответы\n\nБез SDK вы сами отвечаете за проверку структуры ответа.\n\nНапример, через Pydantic:\n\n```python\nfrom pydantic import BaseModel, ValidationError\n\n\nclass ExternalUser(BaseModel):\n    id: int\n    username: str\n    is_active: bool\n\n\nasync def get_external_user(\n    client: httpx.AsyncClient,\n    user_id: int,\n) -> ExternalUser:\n    response = await client.get(f\"/v1/users/{user_id}\")\n    response.raise_for_status()\n\n    try:\n        return ExternalUser.model_validate(response.json())\n    except ValidationError as exc:\n        raise ExternalApiError(\n            \"Unexpected external API response\"\n        ) from exc\n```\n\nЭто защищает приложение от ситуации, когда внешний сервис изменил тип или название поля.\n\n### 10. Написать собственную обёртку\n\nНе следует распределять вызовы HTTPX по всей бизнес-логике:\n\n```python\nresponse = await httpx.get(...)\n```\n\nЛучше создать отдельный клиент:\n\n```python\nfrom typing import Any\n\nimport httpx\n\n\nclass ExternalApiClient:\n    def __init__(\n        self,\n        client: httpx.AsyncClient,\n        api_key: str,\n    ) -> None:\n        self._client = client\n        self._api_key = api_key\n\n    async def get_user(\n        self,\n        user_id: int,\n    ) -> dict[str, Any]:\n        response = await self._client.get(\n            f\"/v1/users/{user_id}\",\n            headers={\n                \"X-API-Key\": self._api_key,\n            },\n        )\n\n        response.raise_for_status()\n        return response.json()\n\n    async def create_order(\n        self,\n        product_id: int,\n        quantity: int,\n    ) -> dict[str, Any]:\n        response = await self._client.post(\n            \"/v1/orders\",\n            headers={\n                \"X-API-Key\": self._api_key,\n            },\n            json={\n                \"product_id\": product_id,\n                \"quantity\": quantity,\n            },\n        )\n\n        response.raise_for_status()\n        return response.json()\n```\n\nАрхитектура:\n\n```text\nEndpoint FastAPI\n       ↓\nBusiness service\n       ↓\nExternalApiClient\n       ↓\nHTTPX\n       ↓\nСторонний API\n```\n\nТак детали URL, заголовков, аутентификации и формата внешнего API остаются внутри адаптера.\n\n### 11. Сгенерировать неофициальный клиент из OpenAPI\n\nЕсли API предоставляет файл:\n\n```text\nopenapi.json\nopenapi.yaml\nswagger.json\n```\n\nможно автоматически сгенерировать клиент для нужного языка.\n\nOpenAPI-схема описывает пути и операции API и предназначена в том числе для инструментов генерации клиентского кода. \n\nОднако сгенерированный клиент всё равно необходимо проверить:\n\n- правильно ли описана авторизация;\n    \n- совпадают ли модели с реальными ответами;\n    \n- корректно ли обрабатываются nullable-поля;\n    \n- описаны ли все коды ошибок;\n    \n- соответствует ли схема фактической версии API.\n    \n\n### SDK и прямое подключение\n\n|Официальный SDK|Обычный HTTP-клиент|\n|---|---|\n|Готовые методы и модели|Методы и модели пишутся самостоятельно|\n|Может обновлять токены|Логику обновления нужно реализовать|\n|Скрывает детали HTTP|Полный контроль над запросами|\n|Зависит от качества SDK|Зависит от документации API|\n|Может отставать от API|Можно сразу использовать новый endpoint|\n|Быстрее начать интеграцию|Проще контролировать зависимости|\n\n### Итог\n\nПодключение без SDK выглядит так:\n\n```text\nДокументация или OpenAPI\n        ↓\nHTTP-клиент\n        ↓\nURL + method + headers + params + body\n        ↓\nПроверка status code\n        ↓\nВалидация ответа\n        ↓\nСобственная обёртка ExternalApiClient\n```\n\nДля Python/FastAPI практичный вариант:\n\n```text\nhttpx.AsyncClient\n+ один клиент на приложение\n+ timeout\n+ обработка ошибок\n+ Pydantic-модели\n+ отдельный класс интеграции\n```"
