  id = 14
  question = "Как вызывать сторонний API напрямую?"
  answer = "### Что означает «вызвать сторонний API напрямую»\n\nЭто значит, что ваше приложение самостоятельно формирует HTTP-запрос к endpoint другого сервиса:\n\n```text\nВаше приложение\n      │ HTTP/HTTPS-запрос\n      ▼\nСторонний API\n      │ HTTP-ответ\n      ▼\nВаше приложение\n```\n\nДля вызова нужно знать:\n\n- URL endpoint;\n    \n- HTTP-метод;\n    \n- способ аутентификации;\n    \n- query-параметры;\n    \n- формат тела;\n    \n- ожидаемые статус-коды и структуру ответа.\n    \n\n### Общая последовательность\n\n```text\n1. Изучить документацию API\n2. Получить API key или access token\n3. Сформировать HTTP-запрос\n4. Установить timeout\n5. Отправить запрос\n6. Проверить status code\n7. Десериализовать ответ\n8. Обработать сетевые ошибки и ограничения API\n```\n\nПример запроса:\n\n```text\nGET /v1/users/42?include=profile HTTP/1.1\nHost: api.example.com\nAccept: application/json\nAuthorization: Bearer <access-token>\n```\n\nОтвет:\n\n```text\nHTTP/1.1 200 OK\nContent-Type: application/json\n\n{\n  \"id\": 42,\n  \"username\": \"alfob\"\n}\n```\n\n### Через curl\n\nДля быстрой ручной проверки API удобно использовать `curl`.\n\nGET-запрос:\n\n```bash\ncurl --request GET \\\n  --url \"https://api.example.com/v1/users/42\" \\\n  --header \"Accept: application/json\" \\\n  --header \"Authorization: Bearer ACCESS_TOKEN\"\n```\n\nPOST с JSON:\n\n```bash\ncurl --request POST \\\n  --url \"https://api.example.com/v1/orders\" \\\n  --header \"Content-Type: application/json\" \\\n  --header \"Authorization: Bearer ACCESS_TOKEN\" \\\n  --data '{\n    \"product_id\": 15,\n    \"quantity\": 2\n  }'\n```\n\nЧтобы увидеть заголовки ответа:\n\n```bash\ncurl --include \"https://api.example.com/v1/users/42\"\n```\n\n`curl` позволяет формировать HTTP-запросы из командной строки, а параметр `--include` выводит заголовки ответа вместе с содержимым. \n\n### Синхронный вызов на Python через HTTPX\n\n```python\nfrom typing import Any\n\nimport httpx\n\n\ndef get_user(user_id: int, access_token: str) -> dict[str, Any]:\n    url = f\"https://api.example.com/v1/users/{user_id}\"\n\n    headers = {\n        \"Accept\": \"application/json\",\n        \"Authorization\": f\"Bearer {access_token}\",\n    }\n\n    try:\n        response = httpx.get(\n            url,\n            headers=headers,\n            timeout=10.0,\n        )\n\n        response.raise_for_status()\n        return response.json()\n\n    except httpx.TimeoutException as exc:\n        raise RuntimeError(\"Сторонний API не ответил вовремя\") from exc\n\n    except httpx.HTTPStatusError as exc:\n        raise RuntimeError(\n            f\"Сторонний API вернул статус \"\n            f\"{exc.response.status_code}\"\n        ) from exc\n\n    except httpx.RequestError as exc:\n        raise RuntimeError(\n            \"Не удалось выполнить запрос к стороннему API\"\n        ) from exc\n```\n\n`raise_for_status()` генерирует исключение для ошибочных HTTP-статусов, а `response.json()` десериализует JSON-ответ. HTTPX также поддерживает query-параметры, заголовки, JSON-тела и настраиваемые тайм-ауты. \n\n### GET с query-параметрами\n\nНе следует собирать query string вручную:\n\n```python\nimport httpx\n\nparams = {\n    \"status\": \"active\",\n    \"limit\": 20,\n    \"offset\": 0,\n}\n\nresponse = httpx.get(\n    \"https://api.example.com/v1/users\",\n    params=params,\n    timeout=10.0,\n)\n\nresponse.raise_for_status()\nusers = response.json()\n```\n\nHTTPX самостоятельно выполнит URL-кодирование:\n\n```text\nhttps://api.example.com/v1/users?status=active&limit=20&offset=0\n```\n\nПередача query-параметров через `params` описана в официальной документации HTTPX. ([HTTPX](https://www.python-httpx.org/quickstart/?utm_source=chatgpt.com \"QuickStart - HTPX\"))\n\n### POST с JSON\n\n```python\nimport httpx\n\npayload = {\n    \"product_id\": 15,\n    \"quantity\": 2,\n}\n\nresponse = httpx.post(\n    \"https://api.example.com/v1/orders\",\n    json=payload,\n    headers={\n        \"Authorization\": \"Bearer ACCESS_TOKEN\",\n        \"Accept\": \"application/json\",\n    },\n    timeout=10.0,\n)\n\nresponse.raise_for_status()\norder = response.json()\n```\n\nПараметр `json=`:\n\n1. сериализует словарь в JSON;\n    \n2. помещает его в тело запроса;\n    \n3. устанавливает соответствующий `Content-Type`.\n    \n\nДля HTML-форм обычно используется `data=`:\n\n```python\nresponse = httpx.post(\n    \"https://api.example.com/oauth/token\",\n    data={\n        \"grant_type\": \"client_credentials\",\n        \"client_id\": \"client-id\",\n        \"client_secret\": \"client-secret\",\n    },\n)\n```\n\nJSON и form-urlencoded — разные форматы тела. Какой из них использовать, определяет документация конкретного API. \n\n### Асинхронный вызов через HTTPX\n\nВ асинхронном приложении, например FastAPI, обычно используется `httpx.AsyncClient`:\n\n```python\nfrom typing import Any\n\nimport httpx\n\n\nasync def get_user(\n    client: httpx.AsyncClient,\n    user_id: int,\n    access_token: str,\n) -> dict[str, Any]:\n    response = await client.get(\n        f\"https://api.example.com/v1/users/{user_id}\",\n        headers={\n            \"Authorization\": f\"Bearer {access_token}\",\n            \"Accept\": \"application/json\",\n        },\n    )\n\n    response.raise_for_status()\n    return response.json()\n```\n\nHTTPX рекомендует использовать асинхронный клиент при работе внутри асинхронного веб-фреймворка. \n\n### Пример в FastAPI\n\nНе следует создавать новый `AsyncClient` на каждый запрос:\n\n```python\n@app.get(\"/users/{user_id}\")\nasync def get_user(user_id: int):\n    async with httpx.AsyncClient() as client:\n        ...\n```\n\nЭто работает, но при высокой нагрузке мешает эффективно переиспользовать соединения.\n\nЛучше создать один клиент на время жизни приложения:\n\n```python\nfrom contextlib import asynccontextmanager\nfrom typing import AsyncIterator\n\nimport httpx\nfrom fastapi import FastAPI, HTTPException\n\n\n@asynccontextmanager\nasync def lifespan(app: FastAPI) -> AsyncIterator[None]:\n    app.state.http_client = httpx.AsyncClient(\n        base_url=\"https://api.example.com\",\n        timeout=httpx.Timeout(10.0),\n        headers={\n            \"Accept\": \"application/json\",\n        },\n    )\n\n    try:\n        yield\n    finally:\n        await app.state.http_client.aclose()\n\n\napp = FastAPI(lifespan=lifespan)\n\n\n@app.get(\"/external-users/{user_id}\")\nasync def get_external_user(user_id: int):\n    client: httpx.AsyncClient = app.state.http_client\n\n    try:\n        response = await client.get(\n            f\"/v1/users/{user_id}\",\n            headers={\n                \"Authorization\": \"Bearer ACCESS_TOKEN\",\n            },\n        )\n\n        response.raise_for_status()\n\n    except httpx.TimeoutException:\n        raise HTTPException(\n            status_code=504,\n            detail=\"External API timeout\",\n        )\n\n    except httpx.HTTPStatusError as exc:\n        if exc.response.status_code == 404:\n            raise HTTPException(\n                status_code=404,\n                detail=\"External user not found\",\n            )\n\n        raise HTTPException(\n            status_code=502,\n            detail=\"External API returned an error\",\n        )\n\n    except httpx.RequestError:\n        raise HTTPException(\n            status_code=502,\n            detail=\"External API is unavailable\",\n        )\n\n    return response.json()\n```\n\n`Client` и `AsyncClient` используют пул соединений и переиспользуют существующие TCP-соединения, что уменьшает задержки и накладные расходы. HTTPX отдельно рекомендует не создавать клиентов внутри часто выполняющегося цикла. \n\n### Аутентификация\n\n#### Bearer token\n\n```python\nheaders = {\n    \"Authorization\": f\"Bearer {access_token}\",\n}\n```\n\n#### API key в заголовке\n\n```python\nheaders = {\n    \"X-API-Key\": api_key,\n}\n```\n\n#### API key в query-параметре\n\n```python\nparams = {\n    \"api_key\": api_key,\n}\n```\n\nПоследний вариант следует использовать только тогда, когда этого требует API: URL может попасть в журналы, историю и системы мониторинга.\n\n#### Basic Authentication\n\n```python\nresponse = httpx.get(\n    \"https://api.example.com/v1/resource\",\n    auth=(\"username\", \"password\"),\n)\n```\n\nHTTPX предоставляет встроенную поддержку Basic и Digest Authentication. \n\n### Как обрабатывать статус-коды\n\nНе следует считать любой полученный ответ успешным:\n\n```python\nresponse = await client.get(\"/v1/users/42\")\n\nif response.status_code == 200:\n    return response.json()\n\nif response.status_code == 404:\n    return None\n\nif response.status_code == 401:\n    raise ExternalAuthenticationError()\n\nif response.status_code == 429:\n    raise ExternalRateLimitError()\n\nif response.status_code >= 500:\n    raise ExternalServiceUnavailableError()\n```\n\nТипичная интерпретация:\n\n|Статус|Действие|\n|---|---|\n|`200`|Прочитать результат|\n|`201`|Ресурс создан|\n|`204`|Успех без тела|\n|`400`|Проверить отправленные данные|\n|`401`|Токен отсутствует или недействителен|\n|`403`|Недостаточно прав|\n|`404`|Ресурс не найден|\n|`409`|Конфликт состояния|\n|`422`|Данные не прошли обработку|\n|`429`|Превышен лимит запросов|\n|`500–599`|Ошибка стороннего сервиса|\n\n### Timeout обязателен\n\nВнешний сервис может:\n\n- долго отвечать;\n    \n- не принять соединение;\n    \n- зависнуть во время передачи данных;\n    \n- стать временно недоступным.\n    \n\nПоэтому запрос должен иметь ограничение времени:\n\n```python\ntimeout = httpx.Timeout(\n    connect=3.0,\n    read=10.0,\n    write=10.0,\n    pool=3.0,\n)\n\nasync with httpx.AsyncClient(timeout=timeout) as client:\n    response = await client.get(\n        \"https://api.example.com/v1/resource\"\n    )\n```\n\nHTTPX поддерживает отдельные тайм-ауты для подключения, чтения, записи и ожидания соединения из пула. У библиотеки также есть стандартный тайм-аут сетевой неактивности, но в рабочем приложении его лучше задавать осознанно. \n\n### Повторные запросы\n\nПовторять запросы можно при временных ошибках:\n\n```text\n408 Request Timeout\n429 Too Many Requests\n502 Bad Gateway\n503 Service Unavailable\n504 Gateway Timeout\n```\n\nНо нельзя бездумно повторять любой `POST`:\n\n```text\nPOST /payments\n```\n\nПервый запрос мог успешно создать платёж, а клиент не получил ответ. Повторная отправка способна создать второй платёж.\n\nДля изменяющих операций применяют:\n\n- idempotency key;\n    \n- уникальный идентификатор операции;\n    \n- ограниченное число повторов;\n    \n- exponential backoff;\n    \n- учёт `Retry-After`.\n    \n\nПример:\n\n```python\nheaders = {\n    \"Authorization\": f\"Bearer {access_token}\",\n    \"Idempotency-Key\": operation_id,\n}\n```\n\nПоддержка `Idempotency-Key` должна быть предусмотрена самим сторонним API.\n\n### Вызов из браузера\n\n```javascript\nasync function loadUser() {\n    const response = await fetch(\n        \"https://api.example.com/v1/users/42\",\n        {\n            method: \"GET\",\n            headers: {\n                \"Accept\": \"application/json\",\n                \"Authorization\": \"Bearer ACCESS_TOKEN\",\n            },\n        },\n    );\n\n    if (!response.ok) {\n        throw new Error(`HTTP error: ${response.status}`);\n    }\n\n    return await response.json();\n}\n```\n\n`fetch()` возвращает `Promise<Response>`, но HTTP-статус `404` или `500` сам по себе не приводит к отклонению Promise. Поэтому необходимо отдельно проверять `response.ok` или `response.status`. \n\n### Ограничение CORS\n\nКогда браузерный frontend обращается к другому origin:\n\n```text\nFrontend:\nhttps://app.example.com\n\nAPI:\nhttps://api.external.com\n```\n\nсторонний сервер должен разрешить такой вызов через CORS-заголовки. В противном случае браузер заблокирует JavaScript-доступ к ответу. CORS применяется к браузерным `fetch()` и `XMLHttpRequest`; серверные Python-запросы этим браузерным ограничением не связаны. \n\nТо есть:\n\n```text\nBrowser → сторонний API\n          зависит от CORS\n\nFastAPI → сторонний API\n          CORS не мешает\n```\n\n### Почему секретный API key нельзя помещать во frontend\n\nТак делать нельзя:\n\n```javascript\nconst API_KEY = \"secret-production-key\";\n```\n\nКод frontend загружается на устройство пользователя. Ключ можно извлечь из:\n\n- JavaScript-кода;\n    \n- DevTools;\n    \n- сетевых запросов;\n    \n- source map;\n    \n- browser storage.\n    \n\nДля секретного ключа запрос должен проходить через ваш backend:\n\n```text\nBrowser\n   │ запрос без стороннего секрета\n   ▼\nВаш backend\n   │ запрос с API key\n   ▼\nСторонний API\n```\n\nBackend при этом может:\n\n- хранить секрет;\n    \n- проверять пользователя;\n    \n- ограничивать доступ;\n    \n- валидировать входные данные;\n    \n- логировать операции;\n    \n- кэшировать ответы;\n    \n- контролировать rate limit.\n    \n\n### Не возвращайте ошибку стороннего API без обработки\n\nПлохо:\n\n```python\nreturn external_response.json()\n```\n\nОсобенно при ошибке стороннего сервиса. Ответ может содержать:\n\n- внутренние идентификаторы;\n    \n- детали инфраструктуры;\n    \n- нестабильную структуру;\n    \n- конфиденциальные сведения;\n    \n- сообщения, не подходящие вашему API-контракту.\n    \n\nЛучше преобразовать внешний ответ в собственную модель:\n\n```python\nfrom pydantic import BaseModel\n\n\nclass UserResponse(BaseModel):\n    id: int\n    username: str\n\n\ndata = external_response.json()\n\nreturn UserResponse(\n    id=data[\"external_user_id\"],\n    username=data[\"display_name\"],\n)\n```\n\nВаш API не должен жёстко зависеть от структуры ответа сторонней системы во всех слоях приложения.\n\n### Практичная архитектура\n\n```text\nEndpoint FastAPI\n      ↓\nBusiness service\n      ↓\nExternalApiClient\n      ↓\nHTTPX\n      ↓\nСторонний API\n```\n\nПример клиента:\n\n```python\nfrom typing import Any\n\nimport httpx\n\n\nclass ExternalApiError(Exception):\n    pass\n\n\nclass ExternalApiClient:\n    def __init__(\n        self,\n        client: httpx.AsyncClient,\n        api_key: str,\n    ) -> None:\n        self._client = client\n        self._api_key = api_key\n\n    async def get_user(self, user_id: int) -> dict[str, Any]:\n        try:\n            response = await self._client.get(\n                f\"/v1/users/{user_id}\",\n                headers={\n                    \"X-API-Key\": self._api_key,\n                },\n            )\n            response.raise_for_status()\n            return response.json()\n\n        except httpx.TimeoutException as exc:\n            raise ExternalApiError(\n                \"External API timeout\"\n            ) from exc\n\n        except httpx.HTTPStatusError as exc:\n            raise ExternalApiError(\n                f\"External API returned \"\n                f\"{exc.response.status_code}\"\n            ) from exc\n\n        except httpx.RequestError as exc:\n            raise ExternalApiError(\n                \"External API request failed\"\n            ) from exc\n```\n\nТак бизнес-сервис не зависит напрямую от HTTPX и деталей стороннего API.\n\n### Итог\n\nЧтобы вызвать сторонний API напрямую, приложение должно отправить обычный HTTP-запрос:\n\n```text\nметод\n+ URL\n+ headers\n+ query-параметры\n+ необязательное body\n+ timeout\n```\n\nДля Python/FastAPI практичная схема:\n\n```text\nhttpx.AsyncClient\n+ один переиспользуемый клиент\n+ timeout\n+ обработка HTTP и сетевых ошибок\n+ проверка структуры ответа\n+ собственный адаптер ExternalApiClient\n```\n\nИз браузера прямой запрос возможен только при корректном CORS, а секретные API-ключи должны оставаться на backend."
