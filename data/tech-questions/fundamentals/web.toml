[[questions]]
  id = 6
  question = "Как выполняется валидация JWT в приложении?"
  answer = "### Что означает валидация JWT\n\nВалидация JWT — это не просто декодирование `payload`. Приложение должно убедиться, что:\n\n```text\nтокен имеет корректный формат\n+ подпись действительна\n+ токен выпущен доверенным сервером\n+ предназначен этому приложению\n+ ещё не истёк\n+ имеет нужный тип\n+ относится к существующему и активному субъекту\n```\n\nЕсли хотя бы одна обязательная проверка не проходит, токен должен быть отклонён. RFC 7519 прямо требует считать JWT недействительным при провале любого этапа его проверки. \n\n### Общий процесс\n\n```text\nHTTP-запрос\n    ↓\nИзвлечение Bearer-токена\n    ↓\nПроверка структуры JWT\n    ↓\nВыбор доверенного ключа\n    ↓\nПроверка алгоритма и подписи\n    ↓\nПроверка стандартных claims\n    ↓\nПроверка прикладных claims\n    ↓\nПроверка пользователя и отзыва токена\n    ↓\nАвторизация операции\n```\n\n### 1. Извлечение токена\n\nОбычно клиент передаёт JWT в заголовке:\n\n```text\nGET /api/profile HTTP/1.1\nAuthorization: Bearer eyJhbGciOiJSUzI1NiIs...\n```\n\nFastAPI может извлечь его через `OAuth2PasswordBearer`:\n\n```python\nfrom fastapi import Depends\nfrom fastapi.security import OAuth2PasswordBearer\n\noauth2_scheme = OAuth2PasswordBearer(tokenUrl=\"/auth/login\")\n\n\nasync def get_current_user(\n    token: str = Depends(oauth2_scheme),\n):\n    ...\n```\n\n`oauth2_scheme` извлекает значение после `Bearer`, но сам по себе не выполняет криптографическую проверку JWT. Проверка выполняется библиотекой JWT внутри зависимости. Официальный пример FastAPI использует именно такую схему. \n\n### 2. Проверка структуры\n\nОбычный подписанный JWT должен состоять из трёх частей:\n\n```text\nheader.payload.signature\n```\n\nБиблиотека проверяет:\n\n- наличие разделителей `.` при compact-представлении;\n    \n- корректность Base64URL;\n    \n- корректность JSON;\n    \n- допустимость полей заголовка;\n    \n- корректность формата claims.\n    \n\nЭти технические действия обычно выполняет JWT-библиотека, а не код приложения вручную.\n\n### 3. Проверка алгоритма\n\nДопустимый алгоритм должен задаваться конфигурацией сервера:\n\n```python\nALGORITHM = \"HS256\"\n\npayload = jwt.decode(\n    token,\n    SECRET_KEY,\n    algorithms=[ALGORITHM],\n)\n```\n\nНельзя делать так:\n\n```python\nheader = jwt.get_unverified_header(token)\n\npayload = jwt.decode(\n    token,\n    SECRET_KEY,\n    algorithms=[header[\"alg\"]],\n)\n```\n\nЗначение `alg` находится во входящем токене и контролируется отправителем. Приложение должно заранее определить разрешённый набор алгоритмов и не смешивать симметричные `HS*` и асимметричные `RS*` алгоритмы для одного ключевого контекста. Это требование содержится и в RFC 8725, и в официальной документации PyJWT. \n\n### 4. Проверка подписи\n\nДля `HS256` подпись проверяется тем же секретом, которым токен был создан:\n\n```text\nAuth-сервис: создаёт подпись secret_key\nAPI:         проверяет подпись secret_key\n```\n\n```python\npayload = jwt.decode(\n    token,\n    SECRET_KEY,\n    algorithms=[\"HS256\"],\n)\n```\n\nДля `RS256`:\n\n```text\nAuth-сервис: подписывает приватным ключом\nAPI:         проверяет публичным ключом\n```\n\n```python\npayload = jwt.decode(\n    token,\n    PUBLIC_KEY,\n    algorithms=[\"RS256\"],\n)\n```\n\nБиблиотека повторно вычисляет криптографическую проверку над:\n\n```text\nbase64url(header) + \".\" + base64url(payload)\n```\n\nи сравнивает результат с подписью токена.\n\nЕсли кто-либо изменит, например:\n\n```json\n{\n  \"role\": \"user\"\n}\n```\n\nна:\n\n```json\n{\n  \"role\": \"admin\"\n}\n```\n\nподпись перестанет соответствовать содержимому, и токен будет отклонён.\n\nВажно: сначала проверяется подпись, и только после этого claims можно считать доверенными. Чтение payload с отключённой проверкой подписи не подтверждает ни его целостность, ни происхождение. \n\n### 5. Выбор ключа через `kid`\n\nКогда сервер использует несколько ключей, JWT может содержать:\n\n```json\n{\n  \"alg\": \"RS256\",\n  \"typ\": \"JWT\",\n  \"kid\": \"key-2026-01\"\n}\n```\n\n`kid` помогает найти нужный публичный ключ:\n\n```text\nkid из JWT\n    ↓\nпоиск ключа в доверенном JWKS\n    ↓\nпроверка подписи\n```\n\nСам `kid` до проверки подписи ещё не является доверенным значением. Его разрешено использовать только как идентификатор для поиска ключа в заранее настроенном доверенном наборе ключей.\n\nPyJWT предоставляет `PyJWKClient` для получения ключей из JWKS endpoint. \n\nПример:\n\n```python\nfrom jwt import PyJWKClient\n\njwks_client = PyJWKClient(\n    \"https://auth.example.com/.well-known/jwks.json\"\n)\n\nsigning_key = jwks_client.get_signing_key_from_jwt(token)\n\npayload = jwt.decode(\n    token,\n    signing_key.key,\n    algorithms=[\"RS256\"],\n    issuer=\"https://auth.example.com\",\n    audience=\"notification-api\",\n)\n```\n\nАдрес JWKS должен задаваться конфигурацией приложения, а не браться из непроверенного JWT.\n\n### 6. Проверка `exp`\n\n`exp` определяет момент, после которого токен нельзя принимать:\n\n```json\n{\n  \"exp\": 1785456900\n}\n```\n\nУсловие:\n\n```text\nтекущее время < exp\n```\n\nЕсли время равно `exp` или превышает его, JWT уже недействителен. RFC допускает небольшой `leeway` для компенсации рассинхронизации системных часов. \n\nВ PyJWT проверка `exp` выполняется при `jwt.decode()`:\n\n```python\npayload = jwt.decode(\n    token,\n    SECRET_KEY,\n    algorithms=[\"HS256\"],\n    leeway=5,\n)\n```\n\n```python\nfrom jwt import ExpiredSignatureError\n\ntry:\n    payload = jwt.decode(\n        token,\n        SECRET_KEY,\n        algorithms=[\"HS256\"],\n    )\nexcept ExpiredSignatureError:\n    print(\"JWT истёк\")\n```\n\nPyJWT автоматически проверяет `exp`, когда claim присутствует. Чтобы гарантировать его обязательное наличие, нужно отдельно добавить его в `require`. \n\n### 7. Проверка `nbf`\n\n`nbf` означает, что токен нельзя принимать раньше определённого времени:\n\n```json\n{\n  \"nbf\": 1785456000\n}\n```\n\nУсловие:\n\n```text\nтекущее время >= nbf\n```\n\nНапример, JWT может быть выпущен заранее, но начать действовать через пять минут. До наступления `nbf` он должен быть отклонён. \n\n### 8. Проверка `iss`\n\n`iss` указывает, кто выпустил JWT:\n\n```json\n{\n  \"iss\": \"https://auth.example.com\"\n}\n```\n\nAPI должен сравнить это значение с ожидаемым издателем:\n\n```python\npayload = jwt.decode(\n    token,\n    PUBLIC_KEY,\n    algorithms=[\"RS256\"],\n    issuer=\"https://auth.example.com\",\n)\n```\n\nБез проверки `iss` приложение может принять JWT, выпущенный другим сервером, особенно когда разные системы используют совместимые алгоритмы или ключевую инфраструктуру.\n\nRFC 8725 рекомендует проверять связь между издателем, субъектом и ключом, которым проверяется подпись. \n\n### 9. Проверка `aud`\n\n`aud` указывает, для какого API предназначен токен:\n\n```json\n{\n  \"aud\": \"notification-api\"\n}\n```\n\nПроверка:\n\n```python\npayload = jwt.decode(\n    token,\n    PUBLIC_KEY,\n    algorithms=[\"RS256\"],\n    audience=\"notification-api\",\n)\n```\n\nНапример:\n\n```text\naud = files-api\n```\n\nТакой токен нельзя принимать в:\n\n```text\npayments-api\n```\n\nдаже если его подпись корректна и он выпущен тем же сервером авторизации. Если приложение не входит в `aud`, токен должен быть отклонён. \n\n### 10. Проверка обязательных claims\n\nRFC 7519 не требует, чтобы каждый JWT обязательно содержал `exp`, `iss`, `aud` или другие claims: обязательный набор определяет конкретное приложение. Поэтому присутствие необходимых claims нужно явно контролировать. \n\nВ PyJWT:\n\n```python\npayload = jwt.decode(\n    token,\n    PUBLIC_KEY,\n    algorithms=[\"RS256\"],\n    issuer=\"https://auth.example.com\",\n    audience=\"notification-api\",\n    options={\n        \"require\": [\n            \"sub\",\n            \"iss\",\n            \"aud\",\n            \"iat\",\n            \"exp\",\n            \"jti\",\n        ]\n    },\n)\n```\n\nБез `require` отсутствие, например, `exp` может не считаться ошибкой: проверка срока действия выполняется, когда claim присутствует.\n\n### 11. Проверка типа токена\n\nAccess и refresh JWT могут быть подписаны одним сервером и иметь одинаковую структуру:\n\n```json\n{\n  \"type\": \"access\"\n}\n```\n\n```json\n{\n  \"type\": \"refresh\"\n}\n```\n\nПосле криптографической проверки приложение должно дополнительно проверить назначение токена:\n\n```python\nif payload.get(\"type\") != \"access\":\n    raise InvalidTokenError(\"Ожидался access token\")\n```\n\nИначе refresh token теоретически может быть передан в API вместо access token.\n\nRFC 8725 отдельно рассматривает атаки, при которых JWT, созданный для одного назначения, используется в другом контексте. Для разных типов токенов должны применяться взаимоисключающие правила валидации. \n\n### 12. Проверка `sub`\n\n`sub` обычно содержит идентификатор пользователя:\n\n```json\n{\n  \"sub\": \"42\"\n}\n```\n\nПосле проверки JWT приложение должно убедиться, что субъект имеет допустимый формат и существует:\n\n```python\nsubject = payload.get(\"sub\")\n\nif subject is None:\n    raise InvalidTokenError(\"Отсутствует sub\")\n\ntry:\n    user_id = int(subject)\nexcept ValueError as exc:\n    raise InvalidTokenError(\"Некорректный sub\") from exc\n\nuser = await user_repository.get_by_id(user_id)\n\nif user is None or not user.is_active:\n    raise InvalidTokenError(\"Пользователь недоступен\")\n```\n\nКорректная подпись подтверждает, что значение `sub` не было изменено после выпуска токена. Но она не гарантирует, что пользователь до сих пор существует, активен или имеет прежние права. RFC 8725 требует проверять допустимость субъекта в контексте приложения. \n\n### 13. Проверка отзыва\n\nЕсли система поддерживает отзыв токенов, проверяется `jti`:\n\n```json\n{\n  \"jti\": \"e9d58273-8750-46c9-86b5-14aa5e28b3a0\"\n}\n```\n\nНапример, Redis:\n\n```text\nrevoked:access:e9d58273-8750-46c9-86b5-14aa5e28b3a0 = 1\n```\n\nПроверка:\n\n```python\njti = payload[\"jti\"]\n\nif await redis.exists(f\"revoked:access:{jti}\"):\n    raise InvalidTokenError(\"Токен отозван\")\n```\n\nЭто уже не криптографическая, а прикладная проверка. Подпись может быть действительной, но приложение всё равно отклонит отозванный JWT.\n\n`jti` является уникальным идентификатором токена и может использоваться для предотвращения повторного использования или управления отзывом. \n\n### Пример для FastAPI и PyJWT\n\n```python\nfrom typing import Any\n\nimport jwt\nfrom fastapi import Depends, HTTPException, status\nfrom fastapi.security import OAuth2PasswordBearer\nfrom jwt.exceptions import ExpiredSignatureError, InvalidTokenError\n\noauth2_scheme = OAuth2PasswordBearer(tokenUrl=\"/auth/login\")\n\nSECRET_KEY = \"use-a-long-random-secret-from-environment\"\nALGORITHM = \"HS256\"\nISSUER = \"notification-service\"\nAUDIENCE = \"notification-api\"\n\n\ndef decode_access_token(token: str) -> dict[str, Any]:\n    try:\n        payload = jwt.decode(\n            token,\n            SECRET_KEY,\n            algorithms=[ALGORITHM],\n            issuer=ISSUER,\n            audience=AUDIENCE,\n            leeway=5,\n            options={\n                \"require\": [\n                    \"sub\",\n                    \"iss\",\n                    \"aud\",\n                    \"iat\",\n                    \"exp\",\n                    \"jti\",\n                ],\n            },\n        )\n    except ExpiredSignatureError as exc:\n        raise HTTPException(\n            status_code=status.HTTP_401_UNAUTHORIZED,\n            detail=\"Access token expired\",\n            headers={\"WWW-Authenticate\": \"Bearer\"},\n        ) from exc\n    except InvalidTokenError as exc:\n        raise HTTPException(\n            status_code=status.HTTP_401_UNAUTHORIZED,\n            detail=\"Invalid access token\",\n            headers={\"WWW-Authenticate\": \"Bearer\"},\n        ) from exc\n\n    if payload.get(\"type\") != \"access\":\n        raise HTTPException(\n            status_code=status.HTTP_401_UNAUTHORIZED,\n            detail=\"Invalid token type\",\n            headers={\"WWW-Authenticate\": \"Bearer\"},\n        )\n\n    return payload\n\n\nasync def get_current_user(\n    token: str = Depends(oauth2_scheme),\n):\n    payload = decode_access_token(token)\n\n    try:\n        user_id = int(payload[\"sub\"])\n    except (TypeError, ValueError) as exc:\n        raise HTTPException(\n            status_code=status.HTTP_401_UNAUTHORIZED,\n            detail=\"Invalid token subject\",\n            headers={\"WWW-Authenticate\": \"Bearer\"},\n        ) from exc\n\n    user = await user_repository.get_by_id(user_id)\n\n    if user is None or not user.is_active:\n        raise HTTPException(\n            status_code=status.HTTP_401_UNAUTHORIZED,\n            detail=\"User is inactive or does not exist\",\n            headers={\"WWW-Authenticate\": \"Bearer\"},\n        )\n\n    if await redis.exists(f\"revoked:access:{payload['jti']}\"):\n        raise HTTPException(\n            status_code=status.HTTP_401_UNAUTHORIZED,\n            detail=\"Access token revoked\",\n            headers={\"WWW-Authenticate\": \"Bearer\"},\n        )\n\n    return user\n```\n\n### Что делает `jwt.decode()`\n\nВ корректной конфигурации вызов:\n\n```python\njwt.decode(\n    token,\n    key,\n    algorithms=[\"HS256\"],\n    issuer=ISSUER,\n    audience=AUDIENCE,\n)\n```\n\nвыполняет основную техническую часть:\n\n- декодирует JWT;\n    \n- проверяет разрешённый алгоритм;\n    \n- проверяет подпись;\n    \n- проверяет `exp`;\n    \n- проверяет `nbf`;\n    \n- проверяет `iat` в рамках возможностей библиотеки;\n    \n- сравнивает `iss`;\n    \n- сравнивает `aud`;\n    \n- возвращает payload только после успешной проверки.\n    \n\nPyJWT предоставляет отдельные параметры для разрешённых алгоритмов, issuer, audience и временного `leeway`. \n\nПриложение самостоятельно проверяет:\n\n- обязательность claims через `require`;\n    \n- тип токена;\n    \n- формат и допустимость `sub`;\n    \n- активность пользователя;\n    \n- актуальность ролей;\n    \n- `jti` и состояние сессии;\n    \n- права на конкретную операцию.\n    \n\n### Валидация и авторизация — разные этапы\n\nДопустим, JWT успешно проверен:\n\n```json\n{\n  \"sub\": \"42\",\n  \"role\": \"user\",\n  \"type\": \"access\"\n}\n```\n\nЭто означает:\n\n```text\nтокен настоящий\n+ не истёк\n+ предназначен этому API\n+ относится к пользователю 42\n```\n\nНо это ещё не означает, что пользователь может выполнить:\n\n```text\nDELETE /api/users/10\n```\n\nПосле валидации выполняется авторизация:\n\n```python\nif current_user.role != \"admin\":\n    raise HTTPException(\n        status_code=403,\n        detail=\"Insufficient permissions\",\n    )\n```\n\nИтоговый порядок:\n\n```text\nизвлечение токена\n→ криптографическая валидация\n→ проверка claims\n→ проверка состояния пользователя и сессии\n→ авторизация конкретного действия\n```"
