[[questions]]
  id = 17
  question = "Что такое и зачем нужен Authorization header в HTTP?"
  answer = "### Что такое `Authorization`\n\n`Authorization` — стандартный HTTP-заголовок запроса, через который клиент передаёт серверу учётные данные для доступа к защищённому ресурсу.\n\nОбщий формат:\n\n```text\nAuthorization: <scheme> <credentials>\n```\n\nНапример:\n\n```text\nAuthorization: Bearer eyJhbGciOiJIUzI1NiIs...\n```\n\nили:\n\n```text\nAuthorization: Basic dXNlcjpwYXNzd29yZA==\n```\n\nСхема определяет, как сервер должен интерпретировать переданные данные. RFC 9110 определяет `Authorization` как заголовок, позволяющий клиенту предъявить учётные данные после получения или предполагаемого получения запроса аутентификации от сервера. \n\n### Зачем он нужен\n\nЗаголовок позволяет серверу определить:\n\n```text\nкто выполняет запрос\nили\nкакими полномочиями обладает клиент\n```\n\nНапример:\n\n```text\nGET /api/profile HTTP/1.1\nHost: example.com\nAuthorization: Bearer <access-token>\n```\n\nБез заголовка сервер может не знать, от имени какого пользователя выполняется запрос:\n\n```text\nHTTP/1.1 401 Unauthorized\nWWW-Authenticate: Bearer\n```\n\nС действительным токеном сервер может идентифицировать пользователя и проверить его права:\n\n```text\nHTTP/1.1 200 OK\nContent-Type: application/json\n\n{\n  \"id\": 42,\n  \"username\": \"alfob\"\n}\n```\n\n### Как сервер его обрабатывает\n\nТипичная последовательность:\n\n```text\nHTTP-запрос\n    ↓\nИзвлечение Authorization\n    ↓\nОпределение схемы\n    ↓\nПроверка credentials\n    ↓\nОпределение пользователя или клиента\n    ↓\nПроверка разрешения на операцию\n    ↓\nОтвет 2xx, 401 или 403\n```\n\nДля Bearer-токена сервер обычно:\n\n1. Проверяет наличие заголовка.\n    \n2. Проверяет префикс `Bearer`.\n    \n3. Извлекает токен.\n    \n4. Проверяет подпись или находит токен в хранилище.\n    \n5. Проверяет срок действия.\n    \n6. Проверяет issuer, audience и scope.\n    \n7. Определяет пользователя.\n    \n8. Проверяет право на конкретную операцию.\n    \n\nПример условного кода:\n\n```python\nauthorization = request.headers.get(\"Authorization\")\n\nif authorization is None:\n    raise UnauthorizedError()\n\nscheme, token = authorization.split(\" \", maxsplit=1)\n\nif scheme.lower() != \"bearer\":\n    raise UnauthorizedError()\n\npayload = validate_access_token(token)\nuser = get_user(payload[\"sub\"])\n```\n\n### Bearer-схема\n\nВ современных API часто используется:\n\n```http\nAuthorization: Bearer <access-token>\n```\n\n`Bearer` означает, что клиент предъявляет токен доступа. Любой, кто получил действительный bearer-токен, обычно может использовать его без дополнительного доказательства владения криптографическим ключом. Поэтому bearer-токен необходимо защищать как секрет. RFC 6750 рекомендует передавать OAuth access token именно через заголовок `Authorization`. \n\nСам токен может быть:\n\n```text\nJWT\nopaque token — случайная непрозрачная строка\n```\n\nСледовательно:\n\n```text\nBearer token ≠ обязательно JWT\nJWT ≠ обязательно Bearer token\n```\n\nJWT — формат токена, а `Bearer` — схема его предъявления в HTTP.\n\n### Basic-схема\n\nПример:\n\n```text\nAuthorization: Basic dXNlcjpwYXNzd29yZA==\n```\n\nЗначение обычно представляет собой:\n\n```text\nBase64(username:password)\n```\n\nBase64 не является шифрованием. Поэтому Basic Authentication можно использовать только через HTTPS: иначе логин и пароль могут быть перехвачены.\n\nСервер декодирует данные:\n\n```text\ndXNlcjpwYXNzd29yZA==\n        ↓\nuser:password\n```\n\nи проверяет их.\n\nДля публичных API обычно предпочтительнее передавать короткоживущий access token, а не логин и пароль при каждом запросе.\n\n### `401` и `403`\n\nЭти статусы имеют разный смысл.\n\n#### `401 Unauthorized`\n\nКлиент не предоставил подходящие credentials либо они недействительны:\n\n```text\nHTTP/1.1 401 Unauthorized\nWWW-Authenticate: Bearer\n```\n\nПричины:\n\n- заголовок отсутствует;\n    \n- токен истёк;\n    \n- подпись токена неверна;\n    \n- токен отозван;\n    \n- схема не поддерживается.\n    \n\nНесмотря на название `Unauthorized`, статус `401` в HTTP прежде всего означает проблему с аутентификационными данными. Сервер обычно использует `WWW-Authenticate`, чтобы сообщить поддерживаемую схему. \n\n#### `403 Forbidden`\n\nCredentials действительны, но прав недостаточно:\n\n```text\nDELETE /api/users/10\nAuthorization: Bearer <valid-user-token>\n```\n\n```text\nHTTP/1.1 403 Forbidden\n```\n\nТо есть:\n\n```text\n401 → не удалось подтвердить доступ по credentials\n403 → пользователь определён, но операция ему запрещена\n```\n\n### `Authorization` и `WWW-Authenticate`\n\nЭто разные заголовки:\n\n```text\nAuthorization   → запрос клиента\nWWW-Authenticate → ответ сервера\n```\n\nПример:\n\n```text\nGET /api/profile\n```\n\nОтвет сервера:\n\n```text\nHTTP/1.1 401 Unauthorized\nWWW-Authenticate: Bearer realm=\"api\"\n```\n\nПовторный запрос клиента:\n\n```text\nGET /api/profile\nAuthorization: Bearer <access-token>\n```\n\n`WWW-Authenticate` описывает схему, которую сервер ожидает, а `Authorization` передаёт credentials согласно этой схеме. \n\n### Почему токен передают в заголовке, а не в URL\n\nПравильно:\n\n```text\nAuthorization: Bearer <token>\n```\n\nНежелательно:\n\n```text\nGET /api/profile?access_token=<token>\n```\n\nURL может оказаться в:\n\n- истории браузера;\n    \n- логах сервера и reverse proxy;\n    \n- системах аналитики;\n    \n- трассировках;\n    \n- заголовке `Referer`.\n    \n\nRFC 6750 рекомендует передачу bearer access token через `Authorization`; другие варианты предусмотрены только для ограниченных случаев. \n\n### Требования безопасности\n\n`Authorization` должен передаваться через HTTPS:\n\n```text\nHTTP + TLS = HTTPS\n```\n\nТакже необходимо:\n\n- не записывать токены и пароли в логи;\n    \n- использовать короткоживущие access-токены;\n    \n- проверять не только структуру токена, но и его подпись и claims;\n    \n- ограничивать права через `scope` или роли;\n    \n- не передавать access token сторонним доменам;\n    \n- не хранить секреты непосредственно в исходном коде;\n    \n- удалять или маскировать `Authorization` в логах и мониторинге.\n    \n\nПрокси, передающий запрос дальше, не должен произвольно изменять поле `Authorization`. \n\n### Пример в FastAPI\n\n```python\nfrom fastapi import Depends, FastAPI, HTTPException, status\nfrom fastapi.security import HTTPAuthorizationCredentials, HTTPBearer\n\napp = FastAPI()\n\nbearer_scheme = HTTPBearer()\n\n\n@app.get(\"/profile\")\nasync def get_profile(\n    credentials: HTTPAuthorizationCredentials = Depends(bearer_scheme),\n):\n    if credentials.scheme.lower() != \"bearer\":\n        raise HTTPException(\n            status_code=status.HTTP_401_UNAUTHORIZED,\n            detail=\"Unsupported authorization scheme\",\n            headers={\"WWW-Authenticate\": \"Bearer\"},\n        )\n\n    token = credentials.credentials\n\n    try:\n        payload = validate_access_token(token)\n    except InvalidTokenError as exc:\n        raise HTTPException(\n            status_code=status.HTTP_401_UNAUTHORIZED,\n            detail=\"Invalid access token\",\n            headers={\"WWW-Authenticate\": \"Bearer\"},\n        ) from exc\n\n    return {\n        \"user_id\": payload[\"sub\"],\n    }\n```\n\nЗдесь:\n\n```text\ncredentials.scheme      → Bearer\ncredentials.credentials → сам access token\n```\n\n### Итог\n\n```text\nAuthorization\n├── находится в HTTP-запросе\n├── содержит схему аутентификации\n├── содержит credentials\n└── позволяет получить доступ к защищённому ресурсу\n```\n\nТипичный вариант для API:\n\n```text\nAuthorization: Bearer <access-token>\n```\n\nСам заголовок не предоставляет доступ автоматически. Сервер обязан проверить credentials, определить субъекта и отдельно проверить, разрешено ли ему выполнять запрошенную операцию."
  popularity = 2.63

[[questions]]
  id = 18
  question = "Где передаются cookies в HTTP-запросе?"
  answer = "Cookies передаются в HTTP-запросе в заголовке `Cookie`:\n\n```text\nGET /profile HTTP/1.1\nHost: example.com\nCookie: session_id=abc123; theme=dark\n```\n\nНесколько cookies передаются в одном заголовке и разделяются точкой с запятой:\n\n```text\nCookie: name1=value1; name2=value2\n```\n\nБраузер обычно добавляет этот заголовок автоматически для cookies, подходящих по домену, пути, сроку действия, флагам `Secure` и `SameSite`.\n\n### Как cookie попадает в браузер\n\nСначала сервер устанавливает cookie через заголовок HTTP-ответа `Set-Cookie`:\n\n```text\nHTTP/1.1 200 OK\nSet-Cookie: session_id=abc123; Path=/; HttpOnly; Secure; SameSite=Lax\n```\n\nЗатем при подходящем следующем запросе браузер возвращает её серверу:\n\n```text\nGET /profile HTTP/1.1\nCookie: session_id=abc123\n```\n\nТо есть:\n\n```text\nСервер → Set-Cookie в response\nБраузер → Cookie в последующих requests\n```\n\n`Set-Cookie` и `Cookie` — разные заголовки: первый устанавливает cookie, второй отправляет сохранённые cookies обратно серверу. \n\n### В FastAPI\n\nПолучение cookie:\n\n```python\nfrom fastapi import Cookie, FastAPI\n\napp = FastAPI()\n\n\n@app.get(\"/profile\")\nasync def get_profile(\n    session_id: str | None = Cookie(default=None),\n):\n    return {\"session_id\": session_id}\n```\n\nУстановка cookie:\n\n```python\nfrom fastapi import Response\n\n\n@app.post(\"/login\")\nasync def login(response: Response):\n    response.set_cookie(\n        key=\"session_id\",\n        value=\"abc123\",\n        httponly=True,\n        secure=True,\n        samesite=\"lax\",\n    )\n\n    return {\"message\": \"Logged in\"}\n```\n\nГлавное:\n\n```text\nHTTP-запрос: Cookie\nHTTP-ответ:  Set-Cookie\n```"
  popularity = 2.63

[[questions]]
  id = 19
  question = "Как передать символы ? и & в query parameters?"
  answer = "### Используйте percent-encoding\n\nВ query string символы `?` и `&` имеют служебное значение:\n\n```text\n?  → начало query string\n&  → разделитель query-параметров\n```\n\nЕсли эти символы являются частью **значения параметра**, их нужно кодировать:\n\n```text\n? → %3F\n& → %26\n```\n\nНапример, нужно передать значение:\n\n```text\nPython?FastAPI&Django\n```\n\nПравильный URL:\n\n```text\nGET /search?q=Python%3FFastAPI%26Django\n```\n\nСервер получит:\n\n```text\nq = \"Python?FastAPI&Django\"\n```\n\nPercent-encoding используется, чтобы отличать символы, являющиеся данными, от символов-разделителей URI.\n\n### Полный пример\n\nИсходные параметры:\n\n```text\nquery = \"price?low&available\"\npage = 2\n```\n\nQuery string:\n\n```text\n?query=price%3Flow%26available&page=2\n```\n\nПолный запрос:\n\n```text\nGET /products?query=price%3Flow%26available&page=2 HTTP/1.1\nHost: example.com\n```\n\nЗдесь:\n\n```text\nпервый ?  → отделяет query string от path\n%3F       → символ ? внутри значения\n%26       → символ & внутри значения\n&         → разделяет параметры query и page\n```\n\n### Python\n\nНе следует вручную заменять символы. Используйте `urlencode`:\n\n```python\nfrom urllib.parse import urlencode\n\nparams = {\n    \"query\": \"price?low&available\",\n    \"page\": 2,\n}\n\nquery_string = urlencode(params)\n\nprint(query_string)\n# query=price%3Flow%26available&page=2\n```\n\n`urllib.parse.urlencode()` преобразует словарь или последовательность пар в корректную query string. \n\nС HTTPX ещё проще:\n\n```python\nimport httpx\n\nresponse = httpx.get(\n    \"https://api.example.com/products\",\n    params={\n        \"query\": \"price?low&available\",\n        \"page\": 2,\n    },\n)\n```\n\nHTTP-клиент самостоятельно выполнит кодирование значений.\n\n### JavaScript\n\n```javascript\nconst params = new URLSearchParams({\n    query: \"price?low&available\",\n    page: \"2\",\n});\n\nconst url = `/products?${params.toString()}`;\n\nconsole.log(url);\n// /products?query=price%3Flow%26available&page=2\n```\n\n### Важное правило\n\nКодировать нужно **значения отдельных параметров**, а не весь готовый URL.\n\nНеправильно:\n\n```text\nencodeURIComponent(\n  \"https://example.com/search?q=test&limit=10\"\n)\n```\n\nПравильно:\n\n```javascript\nconst value = encodeURIComponent(\"test?one&two\");\n\nconst url = `/search?q=${value}&limit=10`;\n```\n\nРезультат:\n\n```text\n/search?q=test%3Fone%26two&limit=10\n```\n\nИтого:\n\n```text\n? внутри значения → %3F\n& внутри значения → %26\n= внутри значения → %3D\n% внутри значения → %25\n```"
  popularity = 2.63

[[questions]]
  id = 20
  question = "Почему в HTTP API данные часто передаются в JSON, а не в XML?"
  answer = "### Почему JSON чаще используют в HTTP API\n\nJSON стал основным форматом для современных HTTP API не потому, что XML хуже, а потому, что для типичных структурированных данных он обычно проще и удобнее.\n\nСравним одно и то же представление пользователя.\n\nJSON:\n\n```json\n{\n  \"id\": 42,\n  \"username\": \"alfob\",\n  \"active\": true,\n  \"roles\": [\"user\", \"editor\"]\n}\n```\n\nXML:\n\n```xml\n<user>\n    <id>42</id>\n    <username>alfob</username>\n    <active>true</active>\n    <roles>\n        <role>user</role>\n        <role>editor</role>\n    </roles>\n</user>\n```\n\n### 1. JSON обычно компактнее\n\nВ XML приходится повторять названия элементов в открывающих и закрывающих тегах:\n\n```xml\n<username>alfob</username>\n```\n\nВ JSON имя поля указывается один раз:\n\n```json\n\"username\": \"alfob\"\n```\n\nПоэтому при передаче обычных объектов и массивов JSON, как правило, содержит меньше служебной разметки:\n\n```text\nJSON:\nключ + значение\n\nXML:\nоткрывающий тег + значение + закрывающий тег\n```\n\nЭто уменьшает размер ответа и делает данные проще для чтения. Однако после HTTP-сжатия, например `gzip` или Brotli, разница может заметно сократиться, поскольку повторяющиеся XML-теги хорошо сжимаются.\n\n### 2. Модель JSON хорошо соответствует структурам приложения\n\nJSON напрямую поддерживает небольшой набор типов:\n\n```text\nobject\narray\nstring\nnumber\nboolean\nnull\n```\n\nНапример:\n\n```json\n{\n  \"id\": 42,\n  \"price\": 19.95,\n  \"active\": true,\n  \"tags\": [\"python\", \"api\"],\n  \"manager\": null\n}\n```\n\nЭто естественно преобразуется в структуры большинства языков:\n\n```text\nJSON object → dict / map / object\nJSON array  → list / array\nJSON number → int / float\n```\n\nRFC 8259 определяет JSON именно как текстовый формат обмена структурированными данными, состоящий из объектов, массивов и примитивных значений. \n\nXML изначально является языком разметки документов. Его модель включает элементы, атрибуты, текстовые узлы, пространства имён и другие конструкции, которые мощнее, но сложнее для обычного API-обмена. \n\n### 3. JSON удобен для браузерного JavaScript\n\nJSON синтаксически близок к объектам и массивам JavaScript:\n\n```javascript\nconst user = await response.json();\n\nconsole.log(user.username);\nconsole.log(user.roles[0]);\n```\n\nПосле разбора API-ответ сразу превращается в объект:\n\n```javascript\n{\n    id: 42,\n    username: \"alfob\"\n}\n```\n\nXML обычно требует отдельного DOM-парсинга и обхода элементов:\n\n```javascript\nconst document = new DOMParser().parseFromString(\n    xmlText,\n    \"application/xml\",\n);\n\nconst username = document\n    .querySelector(\"username\")\n    .textContent;\n```\n\nJSON не является буквально JavaScript-кодом, но его формат был специально определён как простой, независимый от языка формат обмена данными.\n\n### 4. JSON проще читать и создавать\n\nJSON:\n\n```json\n{\n  \"product_id\": 15,\n  \"quantity\": 2\n}\n```\n\nXML:\n\n```xml\n<order>\n    <product_id>15</product_id>\n    <quantity>2</quantity>\n</order>\n```\n\nВ JSON меньше синтаксических конструкций:\n\n- нет закрывающих тегов;\n    \n- нет различия между элементами и атрибутами;\n    \n- обычно не нужны namespaces;\n    \n- проще описывать вложенные списки и объекты.\n    \n\nЭто снижает количество решений, которые должны согласовать разработчики клиента и сервера.\n\nНапример, в XML одно и то же значение можно представить несколькими способами:\n\n```xml\n<user id=\"42\" />\n```\n\nили:\n\n```xml\n<user>\n    <id>42</id>\n</user>\n```\n\nВ JSON обычно используется один очевидный вариант:\n\n```json\n{\n  \"id\": 42\n}\n```\n\n### 5. Меньше сложности при парсинге\n\nДля JSON типичная обработка выглядит так:\n\n```python\ndata = response.json()\n\nuser_id = data[\"id\"]\nusername = data[\"username\"]\n```\n\nДля XML нужно учитывать:\n\n- элементы;\n    \n- атрибуты;\n    \n- текстовые узлы;\n    \n- namespaces;\n    \n- XML entities;\n    \n- схему документа;\n    \n- иногда порядок элементов.\n    \n\nПример XML с namespace:\n\n```xml\n<user xmlns=\"https://example.com/users\">\n    <id>42</id>\n</user>\n```\n\nПри поиске элемента парсеру уже может потребоваться учитывать URI пространства имён.\n\nЭта сложность оправдана для документных и интеграционных форматов, но часто избыточна для простого REST API.\n\n### 6. JSON хорошо поддерживается API-инструментами\n\nСовременные API-фреймворки, валидаторы и средства документирования обычно имеют прямую поддержку JSON:\n\n```http\nContent-Type: application/json\nAccept: application/json\n```\n\nOpenAPI позволяет описывать разные media types, включая JSON и XML, но JSON Schema и JSON-представление являются центральной моделью схем в современных версиях спецификации. OpenAPI также отдельно предусматривает XML-настройки для преобразования схемы в XML-представление, что показывает дополнительную сложность XML-маппинга. \n\nНапример, FastAPI автоматически:\n\n```python\nfrom pydantic import BaseModel\n\n\nclass UserCreate(BaseModel):\n    username: str\n    active: bool\n```\n\nсвязывает с JSON:\n\n```json\n{\n  \"username\": \"alfob\",\n  \"active\": true\n}\n```\n\nДля XML обычно требуется отдельная сериализация и десериализация.\n\n### 7. JSON проще использовать в REST-подобных CRUD API\n\nБольшинство API передаёт структуры вида:\n\n```json\n{\n  \"id\": 42,\n  \"name\": \"Product\",\n  \"price\": 100,\n  \"categories\": [\"books\", \"education\"]\n}\n```\n\nТо есть:\n\n```text\nобъект\n├── простые поля\n├── вложенные объекты\n└── массивы\n```\n\nЭто почти точно соответствует модели JSON.\n\nXML сильнее ориентирован на документы:\n\n```xml\n<article>\n    <title>REST API</title>\n    <paragraph>\n        JSON часто используется для передачи\n        <strong>структурированных данных</strong>.\n    </paragraph>\n</article>\n```\n\nЗдесь внутри текста присутствует разметка. JSON плохо подходит для такого mixed content, а XML — хорошо.\n\n### Где XML лучше JSON\n\nXML всё ещё оправдан, когда нужны следующие возможности.\n\n#### Строгие сложные схемы\n\nXML Schema позволяет подробно описывать:\n\n- структуру документа;\n    \n- типы;\n    \n- обязательность элементов;\n    \n- порядок элементов;\n    \n- ограничения значений;\n    \n- пространства имён.\n    \n\nJSON также поддерживает JSON Schema, но XML-экосистема исторически сильна в сложных корпоративных контрактах.\n\n#### Пространства имён\n\nXML позволяет объединять данные разных стандартов:\n\n```xml\n<order\n    xmlns:payment=\"https://example.com/payment\"\n    xmlns:customer=\"https://example.com/customer\"\n>\n    <payment:status>paid</payment:status>\n    <customer:id>42</customer:id>\n</order>\n```\n\nЭто полезно в больших интеграционных системах.\n\n#### Документы с разметкой внутри текста\n\n```xml\n<paragraph>\n    Это <strong>важный</strong> текст.\n</paragraph>\n```\n\nXML может естественно смешивать текст и вложенные элементы. JSON для этого потребовал бы отдельной прикладной модели.\n\n#### SOAP и старые корпоративные системы\n\nSOAP-сервисы обычно используют XML:\n\n```http\nContent-Type: application/soap+xml\n```\n\nВ банковских, государственных, телекоммуникационных и корпоративных интеграциях XML часто остаётся частью существующих стандартов и контрактов.\n\n#### XML-подписи и специализированные стандарты\n\nДля XML существует большая экосистема:\n\n- XML Schema;\n    \n- XPath;\n    \n- XSLT;\n    \n- XML Signature;\n    \n- XML Encryption;\n    \n- namespaces.\n    \n\nКогда система уже использует эти технологии, переход на JSON может не дать преимуществ.\n\n### Недостатки JSON\n\nJSON тоже имеет ограничения.\n\n#### Нет встроенного типа даты\n\n```json\n{\n  \"created_at\": \"2026-07-31T07:00:00+04:00\"\n}\n```\n\nДля JSON это обычная строка. Её смысл определяется контрактом API.\n\n#### Ограниченная числовая совместимость\n\nБольшие целые числа могут по-разному обрабатываться языками:\n\n```json\n{\n  \"transaction_id\": 9007199254740993\n}\n```\n\nВ JavaScript такое число нельзя точно представить обычным типом `Number`, поэтому идентификаторы иногда передают строками.\n\n#### Нет комментариев\n\nСтандартный JSON не поддерживает комментарии:\n\n```json\n{\n  // Недопустимо в стандартном JSON\n  \"id\": 42\n}\n```\n\n#### Нет пространств имён и атрибутов\n\nВ JSON все особенности приходится моделировать обычными полями.\n\n### JSON не является требованием REST\n\nREST не требует JSON.\n\nREST API может возвращать:\n\n```http\nContent-Type: application/json\n```\n\n```http\nContent-Type: application/xml\n```\n\n```http\nContent-Type: text/html\n```\n\n```http\nContent-Type: text/csv\n```\n\n```http\nContent-Type: application/pdf\n```\n\nФормат представления выбирается контрактом API. OpenAPI также допускает описание разных media types для одной операции. \n\nНапример:\n\n```http\nGET /users/42\nAccept: application/json\n```\n\nили:\n\n```http\nGET /users/42\nAccept: application/xml\n```\n\nСервер теоретически может предоставить оба представления одного ресурса.\n\n### Сравнение\n\n|Критерий|JSON|XML|\n|---|---|---|\n|Размер без сжатия|Обычно меньше|Обычно больше|\n|Простота чтения|Выше для обычных данных|Ниже из-за тегов|\n|Объекты и массивы|Нативная модель|Требуется структура элементов|\n|Типы данных|Есть числа, boolean, null|Текстовые значения требуют интерпретации или схемы|\n|Атрибуты|Нет отдельной модели|Есть|\n|Пространства имён|Нет|Есть|\n|Mixed content|Неудобен|Поддерживается естественно|\n|Браузерный JavaScript|Очень удобно|Требуется XML-парсер|\n|Корпоративные стандарты|Часто новее|Большая зрелая экосистема|\n|REST API|Самый распространённый выбор|Применяется реже|\n\n### Итог\n\nJSON чаще выбирают для HTTP API потому, что он:\n\n```text\nкомпактнее\n+ проще синтаксически\n+ естественно представляет объекты и массивы\n+ удобно преобразуется в структуры языков\n+ хорошо поддерживается браузерами и API-фреймворками\n```\n\nXML остаётся предпочтительным, когда нужны:\n\n```text\nсложные документные структуры\n+ пространства имён\n+ mixed content\n+ строгая XML-экосистема\n+ совместимость с SOAP и корпоративными стандартами\n```\n\nПоэтому корректная формулировка такая: **JSON удобнее для большинства современных API с объектными данными, но XML функционально богаче для сложных документов и специализированных интеграций**."
