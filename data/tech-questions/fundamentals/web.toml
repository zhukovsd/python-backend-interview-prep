[[questions]]
  id = 41
  question = "Отличия Soap от Rest и XML от JSON"
  answer = "### Главное различие\n\nНужно разделять две разные пары понятий:\n\n```text\nSOAP и REST → подходы к взаимодействию систем\n\nXML и JSON → форматы представления данных\n```\n\nСвязь между ними не жёсткая:\n\n```text\nSOAP почти всегда использует XML\n\nREST API может использовать:\nJSON\nXML\nHTML\nCSV\nProtocol Buffers\nили другой формат\n```\n\nSOAP — стандартизированный XML-based messaging framework, а REST — архитектурный стиль для распределённых систем. \n\n---\n\n### SOAP\n\n**SOAP** расшифровывается как:\n\n```text\nSimple Object Access Protocol\n```\n\nSOAP описывает строгий формат сообщения, основанный на XML. Основной элемент сообщения — `Envelope`.\n\nПример:\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\n<soap:Envelope\n    xmlns:soap=\"http://www.w3.org/2003/05/soap-envelope\"\n    xmlns:user=\"https://example.com/users\"\n>\n    <soap:Header>\n        <user:AuthToken>abc123</user:AuthToken>\n    </soap:Header>\n\n    <soap:Body>\n        <user:GetUserRequest>\n            <user:UserId>42</user:UserId>\n        </user:GetUserRequest>\n    </soap:Body>\n</soap:Envelope>\n```\n\nСтруктура:\n\n```text\nEnvelope\n├── Header — необязательная служебная информация\n└── Body   — основное сообщение\n```\n\nSOAP поддерживает разные модели обмена, включая request-response и односторонние сообщения, и теоретически может передаваться через разные транспортные протоколы. На практике чаще используется HTTP или HTTPS. \n\n### REST\n\n**REST** расшифровывается как:\n\n```text\nRepresentational State Transfer\n```\n\nREST — не протокол и не формат сообщения, а архитектурный стиль.\n\nОбычно REST-подобный HTTP API строится вокруг ресурсов:\n\n```text\n/users\n/users/42\n/orders\n/orders/1001\n```\n\nА операции выражаются через семантику HTTP:\n\n```text\nGET /users/42\nPOST /users\nPUT /users/42\nPATCH /users/42\nDELETE /users/42\n```\n\nПример ответа:\n\n```text\nHTTP/1.1 200 OK\nContent-Type: application/json\n\n{\n  \"id\": 42,\n  \"username\": \"alfob\"\n}\n```\n\nREST предполагает такие ограничения, как client-server, stateless, cacheable responses, uniform interface и layered system. \n\n---\n\n### SOAP vs REST\n\n|Критерий|SOAP|REST|\n|---|---|---|\n|Что это|Протокол и messaging framework|Архитектурный стиль|\n|Основная модель|Вызов операций и обмен сообщениями|Работа с представлениями ресурсов|\n|Формат данных|XML|Любой, чаще JSON|\n|Транспорт|HTTP, другие протоколы|Обычно HTTP|\n|Контракт|Обычно строгий, часто WSDL|Часто OpenAPI, но не обязателен|\n|Структура сообщения|`Envelope`, `Header`, `Body`|Обычный HTTP request/response|\n|HTTP-методы|Часто используется `POST`|Обычно используются `GET`, `POST`, `PUT`, `PATCH`, `DELETE`|\n|HTTP-статусы|Могут использоваться вместе с SOAP Fault|Обычно активно используются|\n|Размер сообщений|Обычно больше|С JSON обычно меньше|\n|Простота клиента|Обычно сложнее|Обычно проще|\n|Кеширование HTTP|Менее естественно|Естественно для `GET`|\n|Типичные системы|Enterprise, старые интеграции, SOAP-сервисы|Web API, SPA, мобильные приложения, микросервисы|\n\n### Различие в стиле обращения\n\nSOAP часто описывает **операцию**:\n\n```text\nGetUser\nCreateOrder\nCancelPayment\n```\n\nПример:\n\n```text\nPOST /UserService\nContent-Type: application/soap+xml\n```\n\n```xml\n<soap:Body>\n    <GetUser>\n        <UserId>42</UserId>\n    </GetUser>\n</soap:Body>\n```\n\nREST обычно описывает **ресурс** и применяемое к нему действие через HTTP:\n\n```text\nGET /users/42\n```\n\n```text\nPOST /orders\n```\n\n```text\nDELETE /orders/1001\n```\n\nЭто не означает, что любой API с JSON автоматически является REST. Например:\n\n```text\nPOST /api/getUser\nPOST /api/deleteUser\nPOST /api/updateUser\n```\n\nможет быть обычным RPC-подобным HTTP API, даже если данные передаются в JSON.\n\n---\n\n### Контракт SOAP\n\nSOAP часто используется вместе с формальным описанием сервиса:\n\n```text\nкакие операции существуют\nкакие поля принимает операция\nкакие типы данных используются\nкакой ответ возвращается\nкакие ошибки возможны\n```\n\nЗа счёт строгого контракта можно генерировать клиентские классы и серверные интерфейсы.\n\nУсловно клиент работает так:\n\n```python\nuser = soap_client.service.GetUser(UserId=42)\n```\n\nКлиентская библиотека сама формирует XML-сообщение.\n\nВ REST API контракт тоже может быть строгим, например через OpenAPI, но сам REST не требует конкретного языка описания API.\n\n### Ошибки SOAP\n\nSOAP имеет специальную структуру `Fault`:\n\n```xml\n<soap:Envelope\n    xmlns:soap=\"http://www.w3.org/2003/05/soap-envelope\"\n>\n    <soap:Body>\n        <soap:Fault>\n            <soap:Code>\n                <soap:Value>soap:Sender</soap:Value>\n            </soap:Code>\n\n            <soap:Reason>\n                <soap:Text xml:lang=\"ru\">\n                    Пользователь не найден\n                </soap:Text>\n            </soap:Reason>\n        </soap:Fault>\n    </soap:Body>\n</soap:Envelope>\n```\n\nВ REST-подобном HTTP API обычно используются HTTP-статусы:\n\n```text\nHTTP/1.1 404 Not Found\nContent-Type: application/problem+json\n\n{\n  \"type\": \"/problems/user-not-found\",\n  \"title\": \"Пользователь не найден\",\n  \"status\": 404\n}\n```\n\n---\n\n## XML vs JSON\n\n### XML\n\n**XML** расшифровывается как:\n\n```text\nExtensible Markup Language\n```\n\nЭто расширяемый язык разметки, основанный на элементах, атрибутах и текстовых узлах. XML-документ должен соответствовать правилам well-formed документа. \n\nПример:\n\n```xml\n<user active=\"true\">\n    <id>42</id>\n    <username>alfob</username>\n\n    <roles>\n        <role>user</role>\n        <role>editor</role>\n    </roles>\n</user>\n```\n\nXML поддерживает:\n\n```text\nэлементы\nатрибуты\nпространства имён\nтекстовые узлы\nкомментарии\nсмешанный текст и разметку\nформальные XML-схемы\n```\n\n### JSON\n\n**JSON** расшифровывается как:\n\n```text\nJavaScript Object Notation\n```\n\nЭто текстовый формат обмена структурированными данными. Его модель включает объекты, массивы, строки, числа, логические значения и `null`. \n\nПример:\n\n```json\n{\n  \"id\": 42,\n  \"username\": \"alfob\",\n  \"active\": true,\n  \"roles\": [\n    \"user\",\n    \"editor\"\n  ]\n}\n```\n\nНесмотря на название, JSON не привязан к JavaScript и используется практически во всех современных языках.\n\n---\n\n### XML vs JSON\n\n|Критерий|XML|JSON|\n|---|---|---|\n|Назначение|Разметка и структурированные документы|Обмен структурированными данными|\n|Основная структура|Элементы и атрибуты|Объекты и массивы|\n|Размер|Обычно больше|Обычно компактнее|\n|Типы|В основном текст без схемы|Строки, числа, boolean, null|\n|Массивы|Моделируются повторяющимися элементами|Есть встроенный массив|\n|Атрибуты|Есть|Нет отдельного типа атрибутов|\n|Пространства имён|Есть|Нет|\n|Комментарии|Есть|В стандартном JSON нет|\n|Mixed content|Поддерживается|Неудобен|\n|Парсинг в браузере|Требуется XML-парсер|Нативно поддерживается|\n|Читаемость API-данных|Обычно ниже|Обычно выше|\n|Схемы|XSD и другие технологии|JSON Schema|\n|Типичное применение|SOAP, документы, корпоративные стандарты|REST API, конфигурации, frontend/backend|\n\n### Компактность\n\nXML:\n\n```xml\n<user>\n    <id>42</id>\n    <username>alfob</username>\n    <active>true</active>\n</user>\n```\n\nJSON:\n\n```json\n{\n  \"id\": 42,\n  \"username\": \"alfob\",\n  \"active\": true\n}\n```\n\nXML повторяет имя элемента:\n\n```xml\n<username>alfob</username>\n```\n\nJSON указывает имя поля один раз:\n\n```json\n\"username\": \"alfob\"\n```\n\nПоэтому JSON обычно компактнее без сжатия. После gzip или Brotli разница может уменьшиться, поскольку повторяющиеся XML-теги хорошо сжимаются.\n\n### Типы данных\n\nJSON явно различает:\n\n```json\n{\n  \"count\": 10,\n  \"active\": true,\n  \"description\": null\n}\n```\n\nЗдесь:\n\n```text\n10    → number\ntrue  → boolean\nnull  → null\n```\n\nВ обычном XML содержимое элементов является текстом:\n\n```xml\n<data>\n    <count>10</count>\n    <active>true</active>\n</data>\n```\n\nБез схемы или соглашения парсер видит текстовые значения `\"10\"` и `\"true\"`. Типы могут задаваться внешней XML-схемой.\n\n### Атрибуты XML\n\nXML позволяет выбирать между элементом:\n\n```xml\n<user>\n    <id>42</id>\n</user>\n```\n\nи атрибутом:\n\n```xml\n<user id=\"42\" />\n```\n\nВ JSON отдельного понятия атрибута нет:\n\n```json\n{\n  \"id\": 42\n}\n```\n\nЭто делает JSON проще, но XML предоставляет больше способов моделирования документов.\n\n### Пространства имён XML\n\nXML позволяет объединять элементы нескольких стандартов:\n\n```xml\n<order\n    xmlns:payment=\"https://example.com/payment\"\n    xmlns:customer=\"https://example.com/customer\"\n>\n    <payment:status>paid</payment:status>\n    <customer:id>42</customer:id>\n</order>\n```\n\nJSON не имеет встроенного механизма namespaces. Их приходится моделировать обычными полями или соглашениями.\n\n### Mixed content\n\nXML хорошо подходит для текста со встроенной разметкой:\n\n```xml\n<paragraph>\n    Этот текст содержит\n    <strong>важную часть</strong>.\n</paragraph>\n```\n\nВ JSON такую структуру приходится описывать искусственно:\n\n```json\n{\n  \"type\": \"paragraph\",\n  \"children\": [\n    {\n      \"type\": \"text\",\n      \"value\": \"Этот текст содержит \"\n    },\n    {\n      \"type\": \"strong\",\n      \"value\": \"важную часть\"\n    }\n  ]\n}\n```\n\nПоэтому XML удобнее для документов, а JSON — для объектов API.\n\n---\n\n### SOAP не равен XML\n\nSOAP использует XML, но не любой XML является SOAP.\n\nОбычный XML:\n\n```xml\n<user>\n    <id>42</id>\n</user>\n```\n\nSOAP:\n\n```xml\n<soap:Envelope\n    xmlns:soap=\"http://www.w3.org/2003/05/soap-envelope\"\n>\n    <soap:Body>\n        <GetUser>\n            <UserId>42</UserId>\n        </GetUser>\n    </soap:Body>\n</soap:Envelope>\n```\n\nSOAP требует определённой структуры сообщения и правил его обработки. \n\n### REST не равен JSON\n\nREST API может вернуть XML:\n\n```text\nGET /users/42\nAccept: application/xml\n```\n\n```text\nHTTP/1.1 200 OK\nContent-Type: application/xml\n```\n\n```xml\n<user>\n    <id>42</id>\n    <username>alfob</username>\n</user>\n```\n\nИли JSON:\n\n```text\nGET /users/42\nAccept: application/json\n```\n\n```json\n{\n  \"id\": 42,\n  \"username\": \"alfob\"\n}\n```\n\nREST работает с представлениями ресурсов и не требует конкретного формата данных. \n\n### Когда выбирать REST + JSON\n\nОбычно подходит для:\n\n```text\nweb frontend\nSPA\nмобильного приложения\nпубличного API\nвнутренних микросервисов\nпростого CRUD\n```\n\nПреимущества:\n\n```text\nпроще разрабатывать и отлаживать\nкомпактные сообщения\nудобная работа из JavaScript\nестественное использование HTTP\nхорошая поддержка современных фреймворков\n```\n\n### Когда встречается SOAP + XML\n\nОбычно используется в:\n\n```text\nстарых корпоративных системах\nбанковских интеграциях\nгосударственных системах\nтелекоммуникациях\nсистемах со строгими XML-контрактами\nинфраструктуре, построенной на SOAP и WS-* стандартах\n```\n\nSOAP оправдан, когда существующая система требует именно его контракта и инфраструктуры. Для нового обычного web API чаще выбирают HTTP API с JSON.\n\n### Итог\n\n```text\nSOAP\n→ строгий XML-based протокол обмена сообщениями\n\nREST\n→ архитектурный стиль взаимодействия с ресурсами\n\nXML\n→ расширяемый язык разметки и документов\n\nJSON\n→ компактный формат объектов, массивов и простых значений\n```\n\nТипичные сочетания:\n\n```text\nSOAP + XML\nREST + JSON\nREST + XML\nRPC over HTTP + JSON\n```\n\nПоэтому сравнение нужно делать на двух уровнях:\n\n```text\nархитектура и взаимодействие:\nSOAP vs REST\n\nформат данных:\nXML vs JSON\n```"
