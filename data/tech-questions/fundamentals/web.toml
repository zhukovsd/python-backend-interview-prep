[[questions]]
  id = 21
  question = "Как расшифровывается JSON?"
  answer = "### JSON\r\n\r\n**JSON** расшифровывается как:\r\n\r\n```text\r\nJavaScript Object Notation\r\n```\r\n\r\nПо-русски:\r\n\r\n```text\r\nобъектная нотация JavaScript\r\n```\r\n\r\nЭто текстовый формат обмена структурированными данными.\r\n\r\nПример:\r\n\r\n```json\r\n{\r\n  \"id\": 42,\r\n  \"username\": \"alfob\",\r\n  \"active\": true\r\n}\r\n```\r\n\r\nНесмотря на название, JSON не привязан только к JavaScript. Его поддерживают Python, Java, Go, C#, PHP и большинство других языков.\r"
