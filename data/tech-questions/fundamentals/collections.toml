  question = "Какие есть альтернативы dict в Python?"
  answer = "Альтернативы `dict` зависят от задачи. В большинстве случаев обычный `dict` — лучший вариант, но в стандартной библиотеке Python есть несколько специализированных замен.\n\n### Основные альтернативы из `collections`\n\n|Альтернатива|Когда использовать|\n|---|---|\n|`defaultdict`|Когда нужен словарь со значением по умолчанию|\n|`Counter`|Когда нужно считать количество элементов|\n|`OrderedDict`|Когда важны специальные операции с порядком|\n|`ChainMap`|Когда нужно объединить несколько словарей без копирования|\n|`UserDict`|Когда нужно удобно создать свой словарь-класс|\n\nВ документации `collections` эти классы прямо описаны как `dict`-подобные контейнеры или подклассы `dict`: `Counter`, `OrderedDict`, `defaultdict`, `ChainMap`, `UserDict`.\n\n### `defaultdict`\n\nИспользуется, когда при обращении к отсутствующему ключу нужно автоматически создавать значение.\n\nОбычный `dict`:\n\n```python\ndata = {}\n\nif \"python\" not in data:\n    data[\"python\"] = []\n\ndata[\"python\"].append(\"dict\")\n```\n\nЧерез `defaultdict`:\n\n```python\nfrom collections import defaultdict\n\ndata = defaultdict(list)\n\ndata[\"python\"].append(\"dict\")\n```\n\nПолезно для группировки:\n\n```python\nfrom collections import defaultdict\n\nusers_by_city = defaultdict(list)\n\nusers_by_city[\"Baku\"].append(\"Ali\")\nusers_by_city[\"Baku\"].append(\"Murad\")\n\nprint(users_by_city)\n```\n\n### `Counter`\n\nИспользуется для подсчёта элементов.\n\n```python\nfrom collections import Counter\n\nwords = [\"a\", \"b\", \"a\", \"c\", \"b\", \"a\"]\n\ncounter = Counter(words)\n\nprint(counter)\n```\n\nРезультат:\n\n```python\nCounter({'a': 3, 'b': 2, 'c': 1})\n```\n\nПо документации `Counter` — это подкласс `dict`, где элементы хранятся как ключи, а их количество — как значения. \n\n### `OrderedDict`\n\nРаньше часто использовался, когда нужно было сохранить порядок вставки.\n\nНо в современных версиях Python обычный `dict` уже гарантирует порядок вставки. Это стало гарантией языка с Python 3.7.\n\nПоэтому сейчас `OrderedDict` нужен реже. Его стоит использовать, когда нужны специальные операции с порядком, например:\n\n```python\nfrom collections import OrderedDict\n\ncache = OrderedDict()\n\ncache[\"a\"] = 1\ncache[\"b\"] = 2\n\ncache.move_to_end(\"a\")\n\nprint(cache)\n```\n\nТо есть:\n\n```text\nОбычный dict      -> порядок вставки есть\nOrderedDict       -> порядок + специальные методы управления порядком\n```\n\n### `ChainMap`\n\nИспользуется, когда нужно работать с несколькими словарями как с одним, но без их физического объединения.\n\n```python\nfrom collections import ChainMap\n\ndefaults = {\"theme\": \"light\", \"debug\": False}\nuser_settings = {\"debug\": True}\n\nsettings = ChainMap(user_settings, defaults)\n\nprint(settings[\"theme\"])  # light\nprint(settings[\"debug\"])  # True\n```\n\n`ChainMap` ищет ключи последовательно по нескольким mapping-объектам. При записи изменения идут только в первый mapping. \n\nУпрощённо:\n\n```text\nChainMap(user_settings, defaults)\n\nпоиск:\nuser_settings -> defaults\n```\n\n### `MappingProxyType`\n\nЭто не полноценная замена `dict`, а **read-only view** над словарём.\n\n```python\nfrom types import MappingProxyType\n\nconfig = {\n    \"debug\": False,\n    \"host\": \"localhost\",\n}\n\nreadonly_config = MappingProxyType(config)\n\nprint(readonly_config[\"host\"])\n```\n\nИзменить через proxy нельзя:\n\n```python\nreadonly_config[\"debug\"] = True\n```\n\nБудет ошибка:\n\n```text\nTypeError\n```\n\nДокументация Python указывает, что `types.MappingProxyType` можно использовать для создания read-only view над `dict`. \n\nВажный нюанс:\n\n```python\nconfig[\"debug\"] = True\n\nprint(readonly_config[\"debug\"])  # True\n```\n\n`MappingProxyType` запрещает изменение через proxy, но если исходный словарь изменился, proxy это увидит.\n\n### `UserDict`\n\nИспользуется, когда нужно сделать собственный словарь с переопределённым поведением.\n\n```python\nfrom collections import UserDict\n\nclass LowerKeyDict(UserDict):\n    def __setitem__(self, key, value):\n        super().__setitem__(key.lower(), value)\n\ndata = LowerKeyDict()\n\ndata[\"Name\"] = \"Alex\"\n\nprint(data)\n```\n\nРезультат:\n\n```python\n{'name': 'Alex'}\n```\n\n`UserDict` — это wrapper вокруг словаря, который удобнее использовать для создания своих dict-подобных классов. \n\n### `collections.abc.Mapping` и `MutableMapping`\n\nЭто не конкретные контейнеры, а **интерфейсы**.\n\nИспользуются, когда ты хочешь написать функцию, которая принимает любой dict-подобный объект:\n\n```python\nfrom collections.abc import Mapping\n\ndef read_config(config: Mapping):\n    print(config[\"host\"])\n```\n\nСюда подойдёт:\n\n```text\ndict\ndefaultdict\nOrderedDict\nMappingProxyType\nсвой mapping-класс\n```\n\nВ документации `collections.abc` указано, что эти ABC-классы позволяют проверять, реализует ли объект нужный интерфейс, например `mapping`. \n\n### Не совсем dict, но иногда лучше\n\nИногда `dict` вообще не нужен.\n\n#### `set`\n\nКогда нужны только уникальные ключи без значений:\n\n```python\nusers = {\"alice\", \"bob\", \"john\"}\n\nprint(\"alice\" in users)\n```\n\nВместо:\n\n```python\nusers = {\n    \"alice\": True,\n    \"bob\": True,\n    \"john\": True,\n}\n```\n\n#### `dataclass`\n\nКогда словарь используется как “объект с полями”:\n\n```python\nfrom dataclasses import dataclass\n\n@dataclass\nclass User:\n    id: int\n    username: str\n    email: str\n\nuser = User(1, \"alex\", \"alex@example.com\")\n```\n\nЛучше, чем:\n\n```python\nuser = {\n    \"id\": 1,\n    \"username\": \"alex\",\n    \"email\": \"alex@example.com\",\n}\n```\n\nПлюсы:\n\n```text\nпонятная структура\nтипизация\nавтодополнение в IDE\nменьше ошибок в названиях ключей\n```\n\n#### `list[tuple]`\n\nКогда нужны повторяющиеся ключи или важен полный порядок пар:\n\n```python\nheaders = [\n    (\"Set-Cookie\", \"a=1\"),\n    (\"Set-Cookie\", \"b=2\"),\n]\n```\n\nОбычный `dict` здесь не подходит, потому что ключи должны быть уникальными:\n\n```python\nheaders = {\n    \"Set-Cookie\": \"a=1\",\n    \"Set-Cookie\": \"b=2\",\n}\n```\n\nВ итоге останется только последнее значение.\n\n### Итоговая шпаргалка\n\n```text\nНужно обычное key-value хранилище     -> dict\nНужны значения по умолчанию          -> defaultdict\nНужно считать элементы               -> Counter\nНужно управлять порядком             -> OrderedDict\nНужно объединить несколько словарей  -> ChainMap\nНужен read-only view                 -> MappingProxyType\nНужен свой dict-класс                -> UserDict\nНужны только уникальные элементы     -> set\nНужен объект с фиксированными полями -> dataclass\nНужны повторяющиеся ключи            -> list[tuple]\n```\n\nВ реальном коде чаще всего выбор такой:\n\n```text\ndict        -> по умолчанию\ndefaultdict -> группировка / накопление\nCounter     -> подсчёт\ndataclass   -> структурированные данные\nset         -> только проверка уникальности / принадлежности\n```"
  popularity = 2.63

