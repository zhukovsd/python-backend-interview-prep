  question = "Являются ли bytearray и bytes изменяемыми типами"
  answer = "```text\nbytes      — immutable, неизменяемый тип\nbytearray  — mutable, изменяемый тип\n```\n\nОфициальная документация Python описывает `bytearray` как **mutable sequence of integers** в диапазоне `0 <= x < 256`, то есть изменяемую последовательность байтов. `bytes` относится к неизменяемым бинарным последовательностям. \n\n### bytes — неизменяемый\n\n```python\nb = b\"hello\"\n\nb[0] = 72\n```\n\nБудет ошибка:\n\n```text\nTypeError: 'bytes' object does not support item assignment\n```\n\nТо есть объект `bytes` после создания изменить нельзя.\n\n### bytearray — изменяемый\n\n```python\nba = bytearray(b\"hello\")\n\nba[0] = 72\n\nprint(ba)  # bytearray(b'Hello')\n```\n\nЗдесь первый байт изменился прямо внутри объекта.\n\n### Важно\n\nИ `bytes`, и `bytearray` хранят не символы как `str`, а последовательность чисел-байтов:\n\n```python\nb = b\"ABC\"\n\nprint(b[0])  # 65\nprint(b[1])  # 66\nprint(b[2])  # 67\n```\n\nТо есть при обращении по индексу возвращается `int`, а не отдельный `bytes`.\n\n### Итог\n\n```text\nbytes похож на tuple/str:\nсоздал → изменить нельзя\n\nbytearray похож на list:\nсоздал → можно менять элементы\n```\n\nИз-за этого `bytes` можно использовать как ключ `dict`, а `bytearray` — нельзя, потому что изменяемые объекты обычно нехешируемы."
  popularity = 2.63

[[questions]]
  id = 21
  question = "Какая сложность поиска/вставки в list?"
  answer = "### Поиск в `list`\n\nЗависит от того, какой поиск имеется в виду.\n\n### Доступ по индексу\n\n```python\nitems = [10, 20, 30]\n\nitems[1]\n```\n\nСложность:\n\n```text\nO(1)\n```\n\nПотому что `list` внутри CPython реализован как массив ссылок, и Python может сразу перейти к нужной позиции. В таблице сложности Python Wiki для `list` операция `Get Item` указана как `O(1)`. ([wiki.python.org](https://wiki.python.org/python/TimeComplexity.html \"TimeComplexity\"))\n\n### Поиск значения\n\n```python\nitems = [10, 20, 30, 40]\n\n20 in items\nitems.index(20)\n```\n\nСложность:\n\n```text\nO(n)\n```\n\nPython должен идти по элементам слева направо и сравнивать их, пока не найдёт нужный элемент.\n\n```python\n20 in [10, 20, 30]      # может найти быстро\n999 in [10, 20, 30]     # проверит весь список\n```\n\nВ среднем и в худшем случае поиск значения в списке — `O(n)`. В таблице Python Wiki операция `x in s` для `list` указана как `O(n)`. ([wiki.python.org](https://wiki.python.org/python/TimeComplexity.html \"TimeComplexity\"))\n\n### Вставка в `list`\n\nТут тоже зависит от места вставки.\n\n### append в конец\n\n```python\nitems = [1, 2, 3]\n\nitems.append(4)\n```\n\nСложность:\n\n```text\nO(1) амортизированно\n```\n\nОбычно добавление в конец быстрое, потому что список заранее выделяет немного больше памяти, чем нужно. В CPython при расширении списка используется over-allocation, чтобы длинная серия `append()` работала амортизированно эффективно. ([GitHub](https://github.com/python/cpython/blob/main/Objects/listobject.c \"cpython/Objects/listobject.c at main · python/cpython · GitHub\"))\n\n### insert в начало или середину\n\n```python\nitems = [1, 2, 3, 4]\n\nitems.insert(0, 100)\nitems.insert(2, 200)\n```\n\nСложность:\n\n```text\nO(n)\n```\n\nПричина: элементы справа от позиции вставки нужно сдвинуть.\n\n```text\n[1, 2, 3, 4]\n insert(0, 100)\n[100, 1, 2, 3, 4]\n      ↑  ↑  ↑  ↑\n      элементы сдвигаются\n```\n\nОфициальная документация Python прямо указывает, что вставки и удаления из начала списка медленные, потому что остальные элементы должны быть сдвинуты. \n\n### Итоговая таблица\n\n|Операция|Сложность|\n|---|--:|\n|`lst[i]`|`O(1)`|\n|`x in lst`|`O(n)`|\n|`lst.index(x)`|`O(n)`|\n|`lst.append(x)`|`O(1)` амортизированно|\n|`lst.insert(i, x)`|`O(n)`|\n|`lst.insert(0, x)`|`O(n)`|\n|`lst.pop()`|`O(1)`|\n|`lst.pop(i)`|`O(n)`|\n\n### Главное\n\n```text\nlist хорош для:\n- доступа по индексу: O(1)\n- добавления в конец: O(1) амортизированно\n\nlist плох для:\n- поиска значения: O(n)\n- вставки в начало/середину: O(n)\n```\n\nЕсли нужен быстрый поиск по значению — обычно берут `set` или `dict`, потому что там поиск в среднем `O(1)`."
  popularity = 7.89

[[questions]]
  id = 22
  question = "Когда list.append() в Python не O(1)?"
  answer = "### Когда `list.append()` не `O(1)`\n\n`list.append()` не является строго `O(1)` на каждой отдельной операции.\n\nПравильная формулировка:\n\n```text\nlist.append(x) — O(1) амортизированно\nно иногда отдельный append может быть O(n)\n```\n\nPython Wiki указывает для `list.append()` сложность `O(1)` в среднем/амортизированно. Для текущего CPython это связано с тем, что список хранится как динамический массив и иногда расширяет внутреннее хранилище. \n\n### Обычный случай: есть свободная ёмкость\n\nСписок хранит не только текущую длину, но и внутреннюю ёмкость.\n\n```text\nlen(lst)       = 3\ncapacity       = 6\n\n[1, 2, 3, _, _, _]\n```\n\nЕсли свободное место есть, `append()` просто кладёт ссылку на объект в следующую ячейку:\n\n```python\nlst.append(4)\n```\n\n```text\n[1, 2, 3, 4, _, _]\n```\n\nСложность:\n\n```text\nO(1)\n```\n\n### Необычный случай: ёмкость закончилась\n\nКогда внутренний массив заполнен:\n\n```text\nlen(lst)       = 4\ncapacity       = 4\n\n[1, 2, 3, 4]\n```\n\nи вызывается:\n\n```python\nlst.append(5)\n```\n\nCPython должен увеличить внутреннее хранилище. Для этого он может:\n\n```text\n1. выделить новый массив большего размера\n2. перенести туда ссылки на старые элементы\n3. добавить новый элемент\n```\n\nСхематично:\n\n```text\nстарое хранилище:\n[1, 2, 3, 4]\n\nновое хранилище:\n[1, 2, 3, 4, 5, _, _, ...]\n```\n\nВ этот момент нужно обработать `n` уже существующих элементов, поэтому отдельный `append()` может стать:\n\n```text\nO(n)\n```\n\nВ исходниках CPython функция изменения размера списка прямо описывает over-allocation: список выделяет памяти немного больше текущего размера, чтобы длинная серия `append()` оставалась линейной по времени, то есть `O(1)` амортизированно на одну вставку. ([GitHub](https://github.com/python/cpython/blob/main/Objects/listobject.c?utm_source=chatgpt.com \"cpython/Objects/listobject.c at main\"))\n\n### Почему всё равно говорят `O(1)`\n\nПотому что расширение происходит не при каждом `append()`.\n\nНапример:\n\n```text\nappend 1  → O(1)\nappend 2  → O(1)\nappend 3  → O(1)\nappend 4  → O(1)\nappend 5  → O(n), потому что нужно расширение\nappend 6  → O(1)\nappend 7  → O(1)\n...\n```\n\nЕсли сделать много добавлений подряд:\n\n```python\nlst = []\n\nfor i in range(1_000_000):\n    lst.append(i)\n```\n\nобщая сложность будет:\n\n```text\nO(n)\n```\n\nа не `O(n²)`, потому что расширения происходят редко.\n\nОтсюда:\n\n```text\nодин конкретный append       → может быть O(n)\nдлинная серия append'ов      → O(1) амортизированно на операцию\n```\n\n### Итог\n\n`list.append()` не `O(1)`, когда у списка закончилась внутренняя ёмкость и CPython вынужден расширять внутренний массив.\n\n```text\nЕсть свободное место  → O(1)\nНужно расширение      → O(n)\nВ среднем по серии    → O(1) amortized\n```\n\nВажно: переносит не сами Python-объекты, а ссылки на них. То есть объекты внутри списка не копируются полностью, копируется массив указателей."
  popularity = 5.26

[[questions]]
  id = 23
  question = "Когда list.append() в Python больше O(n)?"
  answer = "В нормальной модели сложности `list.append(x)` в Python **не бывает хуже `O(n)` по размеру списка**.\n\nДля CPython:\n\n```text\nlist.append(x)\n```\n\nимеет:\n\n```text\nамортизированно: O(1)\nв отдельный момент resize: O(n)\nхуже O(n): обычно нет\n```\n\n### Когда `append()` становится `O(n)`\n\nЭто происходит, когда у списка закончилась внутренняя ёмкость.\n\nPython `list` внутри хранит массив ссылок:\n\n```text\n[ref, ref, ref, свободно, свободно]\n```\n\nЕсли свободное место есть:\n\n```python\nlst.append(x)\n```\n\nпросто кладёт ссылку в следующую ячейку:\n\n```text\nO(1)\n```\n\nЕсли свободного места нет, CPython должен увеличить внутренний массив. Для этого он выделяет больше памяти и переносит старые ссылки в новое хранилище:\n\n```text\nстарый массив из n ссылок\n↓\nновый массив большей ёмкости\n↓\nкопирование n ссылок\n```\n\nЭто уже:\n\n```text\nO(n)\n```\n\nВ исходниках CPython `list_resize()` прямо указано, что список делает over-allocation — выделяет память с запасом, чтобы длинная серия `append()` имела линейное амортизированное поведение. Там же показан рост ёмкости: `0, 4, 8, 16, 24, 32, 40, 52, ...` ([GitHub](https://github.com/python/cpython/blob/main/Objects/listobject.c \"cpython/Objects/listobject.c at main · python/cpython · GitHub\"))\n\n### Почему тогда говорят `append()` — O(1)\n\nПотому что это **амортизированная** сложность.\n\nПример:\n\n```python\nlst = []\n\nfor i in range(1_000_000):\n    lst.append(i)\n```\n\nНе каждый `append()` вызывает resize. Большинство вставок просто занимают уже выделенные свободные ячейки.\n\nПоэтому вся серия из `n` добавлений стоит примерно:\n\n```text\nO(n)\n```\n\nа один `append()` в среднем:\n\n```text\nO(1)\n```\n\nPython Wiki по текущему CPython тоже указывает для `list.append` средний случай `O(1)` и амортизированный worst case `O(1)`, но отдельно объясняет, что основные затраты у списка появляются при росте за пределы текущей выделенной ёмкости, потому что элементы должны перемещаться \n\n### Может ли быть больше `O(n)`\n\nФормально по размеру списка — **нет**, если мы говорим именно об алгоритме `append()`.\n\nНо по реальному времени на практике может казаться хуже из-за внешних факторов:\n\n```text\nнехватка памяти\nработа системного realloc\nсвопинг\nфрагментация памяти\nпаузы ОС / аллокатора\nMemoryError\n```\n\nЭто уже не алгоритмическая сложность `append()`, а поведение памяти и операционной системы.\n\nВажно: при resize Python не копирует сами объекты, он копирует **ссылки на объекты**. То есть если в списке лежат огромные объекты, сами они не дублируются при `append()`.\n\n### Итог\n\n```text\nappend без resize      -> O(1)\nappend с resize        -> O(n)\nсерия append           -> O(n) всего\nодин append в среднем  -> O(1)\nхуже O(n) алгоритмически -> нет\n```\n\nТо есть корректнее говорить так:\n\n```text\nlist.append() — амортизированно O(1), но отдельный вызов может быть O(n) при расширении внутреннего массива.\n```"
  popularity = 2.63

[[questions]]
  id = 24
  question = "Какая сложность поиска в set?"
  answer = "Поиск в `set` в Python:\n\n```text\nсредний случай: O(1)\nхудший случай: O(n)\n```\n\nТо есть проверка:\n\n```python\nx in my_set\n```\n\nобычно работает за **константное время**.\n\n### Почему в среднем O(1)\n\n`set` реализован через **хеш-таблицу**.\n\nКогда выполняется:\n\n```python\nx in my_set\n```\n\nPython:\n\n```text\n1. Вычисляет hash(x)\n2. По хешу находит предполагаемую ячейку\n3. Проверяет, лежит ли там нужный элемент\n```\n\nУпрощённо:\n\n```text\nэлемент -> hash -> индекс в таблице -> проверка\n```\n\nПоэтому не нужно проходить все элементы, как в списке.\n\nДля сравнения:\n\n```python\nx in my_list\n```\n\nдля `list` обычно требует последовательного поиска:\n\n```text\nO(n)\n```\n\nА для `set`:\n\n```text\nO(1) в среднем\n```\n\n### Когда может быть O(n)\n\nХудший случай возникает при большом количестве **коллизий**.\n\nКоллизия — это ситуация, когда разные объекты имеют одинаковый или пересекающийся путь поиска в хеш-таблице:\n\n```text\nhash(a) -> ячейка 5\nhash(b) -> ячейка 5\nhash(c) -> ячейка 5\n```\n\nТогда Python приходится искать дальше по таблице и сравнивать элементы.\n\nВ самом плохом случае поиск может деградировать до:\n\n```text\nO(n)\n```\n\nНо на практике для нормальных хешируемых объектов это редкая ситуация.\n\n### Важно про `hash` и `__eq__`\n\nДля поиска в `set` объект должен быть **хешируемым**.\n\nНапример, можно:\n\n```python\ns = {1, 2, 3}\n\nprint(2 in s)  # True\n```\n\nНельзя положить изменяемый `list`:\n\n```python\ns = {[1, 2, 3]}  # TypeError: unhashable type: 'list'\n```\n\nПотому что `list` изменяемый и не имеет стабильного хеша.\n\n### Итог\n\n```text\nx in set\n```\n\nимеет сложность:\n\n```text\naverage case: O(1)\nworst case:   O(n)\n```\n\nГлавная причина эффективности `set` — использование **хеш-таблицы**, а не последовательного перебора элементов."
  popularity = 2.63

[[questions]]
  id = 25
  question = "Что значит неизменяемый объект в Python?"
  answer = "### Что значит неизменяемый объект\n\n**Неизменяемый объект** в Python — это объект, значение которого нельзя изменить после создания. В документации Python такие объекты называются `immutable`: значение объекта фиксировано после создания. \n\nПример:\n\n```python\nx = \"hello\"\n```\n\nСтрока `\"hello\"` — неизменяемый объект.\n\nНельзя изменить саму строку по индексу:\n\n```python\nx[0] = \"H\"\n```\n\nБудет ошибка:\n\n```text\nTypeError: 'str' object does not support item assignment\n```\n\n### Важно: переменная не объект\n\nВ Python переменная — это не контейнер со значением, а **имя, которое ссылается на объект**.\n\n```python\nx = \"hello\"\nx = \"Hello\"\n```\n\nЭто не изменение старой строки `\"hello\"`.\n\nПроисходит вот что:\n\n```text\nx ──> \"hello\"\n\nx = \"Hello\"\n\nx ──> \"Hello\"\n```\n\nИмя `x` просто стало ссылаться на другой объект.\n\nСтарый объект `\"hello\"` не изменился.\n\n### Пример через `id()`\n\n```python\nx = \"hello\"\nprint(id(x))\n\nx = x + \"!\"\nprint(id(x))\n```\n\nСкорее всего, `id` будет разным:\n\n```text\n1400...\n1401...\n```\n\nПотому что выражение:\n\n```python\nx + \"!\"\n```\n\nсоздаёт **новую строку**, а не меняет старую.\n\n### Примеры неизменяемых типов\n\nК неизменяемым встроенным типам относятся:\n\n```python\nint\nfloat\nbool\nstr\ntuple\nbytes\nfrozenset\nNoneType\n```\n\nВ документации Python прямо указано, что числа, строки и кортежи являются неизменяемыми, а списки и словари — изменяемыми. \n\nПример с числом:\n\n```python\na = 10\na += 1\n```\n\nЭто не изменение объекта `10`.\n\nЭто примерно так:\n\n```text\na ──> 10\n\na = a + 1\n\na ──> 11\n```\n\nЧисло `10` не стало числом `11`.\n\n### Сравнение с изменяемым объектом\n\nСписок — изменяемый объект:\n\n```python\nlst = [1, 2, 3]\nlst.append(4)\n```\n\nТот же самый объект списка изменился:\n\n```text\n[1, 2, 3]\n↓\n[1, 2, 3, 4]\n```\n\nА строка так не работает:\n\n```python\ns = \"abc\"\ns += \"d\"\n```\n\nСоздаётся новая строка:\n\n```text\n\"abc\"  -> старый объект\n\"abcd\" -> новый объект\n```\n\n### Нюанс с tuple\n\n`tuple` сам по себе неизменяемый:\n\n```python\nt = (1, 2, 3)\nt[0] = 100  # ошибка\n```\n\nНо tuple может содержать изменяемый объект:\n\n```python\nt = ([1, 2], 3)\n\nt[0].append(99)\n\nprint(t)\n```\n\nРезультат:\n\n```python\n([1, 2, 99], 3)\n```\n\nЗдесь сам `tuple` не изменился: он всё ещё содержит ссылку на тот же список. Но изменился список внутри него.\n\nВ документации Python отдельно отмечается этот нюанс: неизменяемый контейнер может содержать ссылку на изменяемый объект, и тогда внутренний объект может измениться, хотя сам контейнер остаётся неизменяемым. \n\n### Итог\n\n```text\nНеизменяемый объект = объект, состояние которого нельзя изменить после создания.\n```\n\nПри “изменении” immutable-объекта Python обычно создаёт новый объект:\n\n```python\nx = 5\nx += 1\n```\n\nФактически:\n\n```text\nx ──> 5\nx ──> 6\n```\n\nА не:\n\n```text\nобъект 5 превратился в объект 6\n```"
  popularity = 2.63

