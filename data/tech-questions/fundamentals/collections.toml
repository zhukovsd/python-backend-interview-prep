  question = "Когда использовать кортеж (tuple) вместо списка (list)"
  answer = "`tuple` стоит использовать вместо `list`, когда набор элементов должен быть фиксированным и не должен изменяться.\n\n```python\npoint = (10, 20)        # координата: x, y\nuser = (\"Alex\", 25)     # условная запись: имя, возраст\n```\n\n`list` лучше использовать, когда коллекция будет изменяться:\n\n```python\nusers = [\"Alex\", \"John\"]\nusers.append(\"Kate\")\nusers.remove(\"Alex\")\n```\n\nОфициальная документация Python относит `tuple` и `list` к последовательностям, но `tuple` — неизменяемая последовательность, а `list` — изменяемая. \n\n### Когда лучше использовать `tuple`\n\n### 1. Когда данные не должны изменяться\n\n```python\ncoordinates = (40.4093, 49.8671)\n```\n\nКоординаты обычно воспринимаются как цельная фиксированная пара:\n\n```text\n(latitude, longitude)\n```\n\nЗдесь `tuple` лучше, потому что он показывает намерение:  \nэти данные не планируется менять.\n\n```python\ncoordinates[0] = 41.0\n```\n\nРезультат:\n\n```text\nTypeError: 'tuple' object does not support item assignment\n```\n\n### 2. Когда структура имеет фиксированный смысл\n\n`tuple` часто используют не просто как “список без изменений”, а как небольшую запись с фиксированными позициями.\n\n```python\nperson = (\"Alex\", 25, \"Baku\")\n```\n\nЗдесь позиции имеют смысл:\n\n```text\n0 → name\n1 → age\n2 → city\n```\n\nНо если полей много, лучше использовать `dataclass` или `namedtuple`, потому что обычный `tuple` становится плохо читаемым.\n\n```python\nfrom dataclasses import dataclass\n\n@dataclass(frozen=True)\nclass Person:\n    name: str\n    age: int\n    city: str\n\nperson = Person(\"Alex\", 25, \"Baku\")\n```\n\n### 3. Когда нужен ключ для `dict`\n\nСписок нельзя использовать как ключ словаря, потому что он изменяемый и нехешируемый:\n\n```python\nd = {}\n\nd[[1, 2]] = \"value\"\n```\n\nБудет ошибка:\n\n```text\nTypeError: unhashable type: 'list'\n```\n\nА кортеж можно использовать как ключ, если внутри него только хешируемые элементы:\n\n```python\nd = {}\n\nd[(1, 2)] = \"point\"\n\nprint(d[(1, 2)])\n```\n\nРезультат:\n\n```text\npoint\n```\n\nЭто полезно, например, для координат:\n\n```python\nfield = {\n    (0, 0): \"start\",\n    (1, 0): \"wall\",\n    (2, 0): \"finish\",\n}\n```\n\nВажно: если внутри кортежа есть изменяемый объект, такой кортеж тоже нельзя нормально хешировать:\n\n```python\nbad_key = ([1, 2], 3)\n\nd[bad_key] = \"value\"\n```\n\nБудет ошибка:\n\n```text\nTypeError: unhashable type: 'list'\n```\n\n### 4. Когда нужно вернуть несколько значений из функции\n\nВ Python функции часто возвращают несколько значений именно через `tuple`.\n\n```python\ndef get_user():\n    return \"Alex\", 25\n\nname, age = get_user()\n\nprint(name)\nprint(age)\n```\n\nНа самом деле:\n\n```python\nreturn \"Alex\", 25\n```\n\nэто то же самое, что:\n\n```python\nreturn (\"Alex\", 25)\n```\n\nТо есть возвращается кортеж.\n\n### 5. Когда нужно защитить данные от случайного изменения\n\nНапример, есть набор допустимых ролей:\n\n```python\nROLES = (\"admin\", \"moderator\", \"user\")\n```\n\nФормально это не делает данные абсолютно защищёнными от перезаписи переменной:\n\n```python\nROLES = (\"guest\",)\n```\n\nНо сам объект `tuple` изменить нельзя:\n\n```python\nROLES.append(\"guest\")\n```\n\nБудет ошибка:\n\n```text\nAttributeError: 'tuple' object has no attribute 'append'\n```\n\n### Когда лучше использовать `list`\n\n`list` лучше, если коллекция должна изменяться:\n\n```python\ntasks = []\n\ntasks.append(\"write code\")\ntasks.append(\"run tests\")\ntasks.remove(\"write code\")\n```\n\nТакже `list` лучше для однотипных наборов данных переменной длины:\n\n```python\nnumbers = [10, 20, 30, 40, 50]\nusers = [\"Alex\", \"John\", \"Kate\"]\nproducts = [\"laptop\", \"phone\", \"mouse\"]\n```\n\nТо есть:\n\n```text\ntuple → фиксированная структура\nlist  → изменяемая коллекция\n```\n\n### Сравнение\n\n```text\ntuple:\n- неизменяемый\n- можно использовать как ключ dict, если все элементы хешируемые\n- хорошо подходит для фиксированных наборов данных\n- нет методов append, remove, sort\n\nlist:\n- изменяемый\n- нельзя использовать как ключ dict\n- хорошо подходит для коллекций, которые будут расти/уменьшаться\n- есть append, remove, sort, extend и другие методы изменения\n```\n\n### Важный момент про скорость\n\nНе стоит выбирать `tuple` только из-за скорости.\n\nДа, `tuple` обычно немного легче по памяти и может быть чуть быстрее в некоторых операциях, потому что он неизменяемый. Но главный критерий выбора — смысл данных.\n\nПлохой выбор:\n\n```python\nnumbers = (1, 2, 3)\n```\n\nесли потом нужно добавлять элементы:\n\n```python\nnumbers += (4,)\n```\n\nЭто создаёт новый кортеж, а не меняет старый.\n\nЛучше:\n\n```python\nnumbers = [1, 2, 3]\nnumbers.append(4)\n```\n\n### Итог\n\nИспользуй `tuple`, когда:\n\n```text\nданные фиксированы;\nважна неизменяемость;\nнужна структура вроде координаты, пары, RGB-цвета;\nнужно использовать значение как ключ dict;\nфункция возвращает несколько связанных значений.\n```\n\nИспользуй `list`, когда:\n\n```text\nнужно добавлять элементы;\nнужно удалять элементы;\nнужно сортировать на месте;\nразмер коллекции меняется;\nэто обычный набор однотипных объектов.\n```"
  popularity = 2.63

[[questions]]
  id = 34
  question = "Что такое конкатенация и как она влияет на изменяемые и неизменяемые объекты"
  answer = "### Что такое конкатенация\n\nКонкатенация — это соединение двух последовательностей в одну.\n\nВ Python чаще всего это делают через оператор `+`:\n\n```python\na = [1, 2]\nb = [3, 4]\n\nresult = a + b\n\nprint(result)\n```\n\nРезультат:\n\n```python\n[1, 2, 3, 4]\n```\n\nТо же самое со строками:\n\n```python\ns1 = \"Hello\"\ns2 = \"World\"\n\nresult = s1 + \" \" + s2\n\nprint(result)\n```\n\nРезультат:\n\n```python\nHello World\n```\n\nPython-документация относит `+` к общим операциям последовательностей: оно возвращает результат объединения двух последовательностей одного типа. (\n\n### Конкатенация неизменяемых объектов\n\nК неизменяемым объектам относятся, например:\n\n```text\nstr\ntuple\nbytes\nint\nfloat\nbool\nfrozenset\n```\n\nГлавное правило:\n\n```text\nНеизменяемый объект нельзя изменить на месте.\nПри конкатенации создаётся новый объект.\n```\n\nПример со строкой:\n\n```python\ns = \"Hello\"\nprint(id(s))\n\ns = s + \" World\"\nprint(id(s))\n```\n\nЛогически кажется, что строка изменилась, но на самом деле произошло другое:\n\n```text\n1. Был объект \"Hello\"\n2. Создался новый объект \"Hello World\"\n3. Переменная s начала ссылаться на новый объект\n4. Старый объект остался без изменения\n```\n\nТо есть:\n\n```python\ns = s + \" World\"\n```\n\nне изменяет старую строку, а создаёт новую.\n\nТо же самое с `tuple`:\n\n```python\na = (1, 2)\nb = (3, 4)\n\nc = a + b\n\nprint(c)\n```\n\nРезультат:\n\n```python\n(1, 2, 3, 4)\n```\n\nИсходные кортежи не изменились:\n\n```python\nprint(a)  # (1, 2)\nprint(b)  # (3, 4)\n```\n\nДокументация Python прямо определяет immutable-объекты как объекты, значение которых нельзя изменить после создания. \n\n### Конкатенация изменяемых объектов\n\nК изменяемым объектам относятся, например:\n\n```text\nlist\ndict\nset\nbytearray\n```\n\nС `list` важно различать две операции:\n\n```python\na + b\n```\n\nи\n\n```python\na += b\n```\n\n### Оператор `+` для list\n\n```python\na = [1, 2]\nb = [3, 4]\n\nc = a + b\n\nprint(c)\nprint(a)\nprint(b)\n```\n\nРезультат:\n\n```python\n[1, 2, 3, 4]\n[1, 2]\n[3, 4]\n```\n\n`a + b` создаёт новый список. Исходные списки не меняются.\n\nСхематично:\n\n```text\na ──> [1, 2]\nb ──> [3, 4]\n\nc ──> [1, 2, 3, 4]\n```\n\n### Оператор `+=` для list\n\n```python\na = [1, 2]\nb = [3, 4]\n\na += b\n\nprint(a)\n```\n\nРезультат:\n\n```python\n[1, 2, 3, 4]\n```\n\nДля списка `+=` обычно изменяет сам список на месте.\n\nТо есть:\n\n```python\na += b\n```\n\nпримерно похоже на:\n\n```python\na.extend(b)\n```\n\nСхематично:\n\n```text\nдо:\na ──> [1, 2]\n\nпосле:\na ──> [1, 2, 3, 4]\n```\n\nСписок остался тем же объектом, но его содержимое изменилось.\n\n### Проверка через `id`\n\n```python\na = [1, 2]\n\nprint(id(a))\n\na += [3, 4]\n\nprint(id(a))\nprint(a)\n```\n\nОбычно `id(a)` останется тем же, потому что список изменился на месте.\n\nА вот так:\n\n```python\na = [1, 2]\n\nprint(id(a))\n\na = a + [3, 4]\n\nprint(id(a))\nprint(a)\n```\n\nЗдесь `id(a)` изменится, потому что `a + [3, 4]` создаёт новый список.\n\n### Главное отличие\n\n```text\nlist + list    → создаёт новый list\nlist += list   → обычно изменяет существующий list\n\nstr + str      → создаёт новый str\nstr += str     → создаёт новый str\n\ntuple + tuple  → создаёт новый tuple\ntuple += tuple → создаёт новый tuple\n```\n\nПочему так:\n\n```text\nlist изменяемый → его можно расширить на месте\nstr неизменяемый → нельзя изменить на месте\ntuple неизменяемый → нельзя изменить на месте\n```\n\n### Важный пример с двумя ссылками\n\n```python\na = [1, 2]\nb = a\n\na += [3, 4]\n\nprint(a)\nprint(b)\n```\n\nРезультат:\n\n```python\n[1, 2, 3, 4]\n[1, 2, 3, 4]\n```\n\nПочему `b` тоже изменился?\n\nПотому что `a` и `b` ссылались на один и тот же список:\n\n```text\na ─┐\n   ├──> [1, 2]\nb ─┘\n```\n\nПосле `a += [3, 4]` список изменился на месте:\n\n```text\na ─┐\n   ├──> [1, 2, 3, 4]\nb ─┘\n```\n\nТеперь сравним с `a = a + ...`:\n\n```python\na = [1, 2]\nb = a\n\na = a + [3, 4]\n\nprint(a)\nprint(b)\n```\n\nРезультат:\n\n```python\n[1, 2, 3, 4]\n[1, 2]\n```\n\nЗдесь создался новый список, и `a` начала ссылаться на него. `b` осталась ссылаться на старый список.\n\nСхема:\n\n```text\nдо:\na ─┐\n   ├──> [1, 2]\nb ─┘\n\nпосле:\na ──> [1, 2, 3, 4]\nb ──> [1, 2]\n```\n\n### Производительность\n\nДля неизменяемых объектов частая конкатенация в цикле может быть неэффективной:\n\n```python\ns = \"\"\n\nfor part in [\"a\", \"b\", \"c\"]:\n    s += part\n```\n\nПроблема в том, что строка каждый раз создаётся заново.\n\nЛучше:\n\n```python\nparts = [\"a\", \"b\", \"c\"]\ns = \"\".join(parts)\n```\n\nДля строк документация Python рекомендует `str.join()` как эффективный способ объединения нескольких строк. \n\nДля списков лучше использовать `append()` или `extend()`, если нужно менять существующий список:\n\n```python\nitems = [1, 2]\n\nitems.append(3)\nitems.extend([4, 5])\n\nprint(items)\n```\n\nРезультат:\n\n```python\n[1, 2, 3, 4, 5]\n```\n\n### Итог\n\n```text\nКонкатенация — это объединение последовательностей.\n\nДля immutable-объектов:\nstr + str\ntuple + tuple\nbytes + bytes\n→ создаётся новый объект.\n\nДля mutable-объектов:\nlist + list\n→ создаётся новый список.\n\nlist += list\n→ обычно меняет список на месте.\n\nГлавная опасность:\nесли у одного изменяемого объекта есть несколько ссылок,\nизменение через одну ссылку будет видно через другую.\n```"
  popularity = 2.63

[[questions]]
  id = 35
  question = "В чём разница между изменением вложенного в кортеж списка через .append() и через +=?"
  answer = "### Коротко\n\n`append()` меняет сам вложенный список.\n\n`+=` сначала тоже меняет список, но потом Python пытается присвоить результат обратно в элемент кортежа, а это запрещено.\n\n### Пример с `.append()`\n\n```python\nt = ([1, 2],)\n\nt[0].append(3)\n\nprint(t)\n# ([1, 2, 3],)\n```\n\nЧто происходит:\n\n```text\nt[0]              -> получаем ссылку на список [1, 2]\nt[0].append(3)    -> меняем сам список\n```\n\nКортеж не меняется как контейнер: он всё так же хранит ссылку на тот же самый список. Меняется объект списка внутри.\n\nPython-документация прямо указывает: кортежи immutable, но могут содержать mutable-объекты, например списки. Нельзя присваивать новое значение элементу кортежа, но можно менять вложенный изменяемый объект. \n### Пример с `+=`\n\n```python\nt = ([1, 2],)\n\nt[0] += [3]\n```\n\nРезультат:\n\n```python\nTypeError: 'tuple' object does not support item assignment\n```\n\nНо важный момент:\n\n```python\nprint(t)\n# ([1, 2, 3],)\n```\n\nТо есть ошибка была, но список всё равно изменился.\n\n### Почему так\n\nОперация:\n\n```python\nt[0] += [3]\n```\n\nпримерно превращается в такую логику:\n\n```python\nresult = t[0].__iadd__([3])  # список изменился на месте\nt[0] = result                # попытка присвоить обратно в кортеж\n```\n\nДля `list` метод `__iadd__` работает примерно как `extend()`: он изменяет список на месте и возвращает этот же список. Но после этого Python всё равно выполняет фазу присваивания обратно в `t[0]`. А присваивать в элемент кортежа нельзя, потому что кортеж immutable. Именно поэтому список успевает измениться, а затем выбрасывается `TypeError`. Это поведение отдельно разобрано в официальном Python FAQ. \n### Главное различие\n\n```python\nt[0].append(3)\n```\n\nозначает:\n\n```text\nизмени объект, на который ссылается элемент кортежа\n```\n\nА:\n\n```python\nt[0] += [3]\n```\n\nозначает:\n\n```text\nизмени список на месте\nпотом попробуй записать результат обратно в t[0]\n```\n\nВторая часть ломается.\n\n### Итог\n\n```python\nt = ([1, 2],)\n\nt[0].append(3)  # OK\n# t == ([1, 2, 3],)\n\nt[0] += [4]     # TypeError, но список уже изменён\n# t == ([1, 2, 3, 4],)\n```\n\nКортеж защищает свои ячейки от переприсваивания, но не делает вложенные объекты неизменяемыми. Это связано с тем, что неизменяемость контейнера не всегда означает полную неизменяемость всех объектов внутри него. "
  popularity = 2.63

