  question = "(Общий вопрос) Как устроены / из чего состоят списки, кортежи, множества и др под капотом"
  answer = "### Главное\n\nВ CPython почти все стандартные контейнеры хранят не сами объекты напрямую, а ссылки на объекты.\n\nТо есть список:\n\n```python\na = [10, \"hello\", [1, 2]]\n```\n\nпод капотом ближе к такой схеме:\n\n```text\nlist object\n├─ length = 3\n├─ allocated = возможно больше 3\n└─ ob_item -> [ ref, ref, ref ]\n              │    │    │\n              │    │    └── list object [1, 2]\n              │    └────── str object \"hello\"\n              └─────────── int object 10\n```\n\nВ модели Python у каждого объекта есть identity, type и value. Контейнеры вроде `list`, `tuple`, `dict` хранят ссылки на другие объекты; именно поэтому вложенный изменяемый объект можно менять даже внутри неизменяемого контейнера. \n\n### Общая база объекта в CPython\n\nВ CPython любой объект начинается с общего заголовка:\n\n```text\nPyObject\n├─ ob_refcnt  # счётчик ссылок\n└─ ob_type    # указатель на объект-типа\n```\n\nДля объектов переменной длины используется расширенный заголовок:\n\n```text\nPyVarObject\n├─ PyObject\n└─ ob_size    # размер / количество элементов\n```\n\nОфициальная C API-документация CPython описывает, что `PyObject` содержит информацию, нужную интерпретатору для работы с объектом: счётчик ссылок и указатель на тип; `PyVarObject` дополнительно добавляет поле размера. \n\n### list\n\n`list` — это динамический массив ссылок.\n\nУпрощённо:\n\n```text\nPyListObject\n├─ PyObject_VAR_HEAD\n├─ ob_item   -> массив PyObject*\n└─ allocated -> реальная ёмкость массива\n```\n\nТо есть:\n\n```python\nlst = [1, 2, 3]\n```\n\nпримерно:\n\n```text\nlst\n├─ ob_size = 3\n├─ allocated = 4 / 8 / ...\n└─ ob_item -> [ref to 1, ref to 2, ref to 3, свободное место]\n```\n\nВ CPython `PyListObject` содержит `ob_item` — вектор указателей на элементы, и `allocated` — количество реально выделенных ячеек; `len(list)` соответствует `ob_size`. \n\nИз-за этого:\n\n```python\nlst.append(x)\n```\n\nобычно быстрый, потому что часто свободная ёмкость уже есть. Когда места не хватает, CPython перевыделяет внутренний массив с запасом. В исходниках прямо указано, что список делает over-allocation, чтобы длинная серия `append()` имела амортизированно линейное поведение. \n\n### tuple\n\n`tuple` — это почти фиксированный массив ссылок.\n\nУпрощённо:\n\n```text\nPyTupleObject\n├─ PyObject_VAR_HEAD\n└─ ob_item -> массив PyObject*\n```\n\nПример:\n\n```python\nt = (1, \"x\", [])\n```\n\n```text\ntuple object\n├─ ob_size = 3\n└─ ob_item -> [ref to 1, ref to \"x\", ref to list]\n```\n\nГлавное отличие от `list`: после создания кортеж не даёт менять свои ячейки. Но он всё равно хранит ссылки. Поэтому:\n\n```python\nt = ([1, 2],)\nt[0].append(3)\n```\n\nработает, потому что меняется не ячейка кортежа, а объект списка, на который эта ячейка ссылается. Документация Python отдельно показывает, что кортежи immutable, но могут содержать mutable-объекты. \n\nВ CPython `PyTupleObject` содержит массив `ob_item`, рассчитанный на `ob_size` элементов. ([GitHub](https://github.com/python/cpython/blob/main/Include/cpython/tupleobject.h?utm_source=chatgpt.com \"cpython/Include/cpython/tupleobject.h at main\"))\n\n### dict\n\n`dict` — это хеш-таблица для пар `ключ -> значение`.\n\nУпрощённо:\n\n```text\ndict\n├─ ma_used      # количество активных элементов\n├─ ma_keys      # таблица ключей / индексов\n└─ ma_values    # значения, если используется split-table\n```\n\nКонцептуально:\n\n```python\nd = {\"a\": 10, \"b\": 20}\n```\n\n```text\nhash(\"a\") -> позиция в таблице -> key \"a\" -> value 10\nhash(\"b\") -> позиция в таблице -> key \"b\" -> value 20\n```\n\nВ CPython `dict` может быть в двух формах:\n\n```text\ncombined table:\n    ключи и значения лежат вместе\n\nsplit table:\n    ключи отдельно, значения отдельно\n```\n\nЭто видно в исходниках CPython: `ma_keys` хранит ключевую структуру, а `ma_values == NULL` означает combined table; если `ma_values != NULL`, ключи лежат в `ma_keys`, а значения — в `ma_values`. ([GitHub](https://github.com/python/cpython/blob/main/Include/cpython/dictobject.h \"cpython/Include/cpython/dictobject.h at main · python/cpython · GitHub\"))\n\nВнутри `dict` есть массив индексов `dk_indices` и массив записей `dk_entries`. `dk_indices` работает как настоящая хеш-таблица: он хранит индекс записи либо специальные состояния вроде empty/dummy. \n\nПоэтому поиск в словаре обычно быстрый:\n\n```python\nd[\"a\"]\n```\n\nPython:\n\n```text\n1. считает hash(\"a\")\n2. находит предполагаемую позицию\n3. проверяет ключ через hash и __eq__\n4. возвращает значение\n```\n\nКлючи словаря должны быть hashable. Для hash-коллекций важно, чтобы hash ключа не менялся, иначе объект окажется «не в той корзине». \n\n### set\n\n`set` — это тоже хеш-таблица, но без значений.\n\n```python\ns = {\"a\", \"b\", \"c\"}\n```\n\nЭто ближе к:\n\n```text\nhash(\"a\") -> позиция -> \"a\"\nhash(\"b\") -> позиция -> \"b\"\nhash(\"c\") -> позиция -> \"c\"\n```\n\nВ отличие от `dict`, множество хранит только элементы, не пары `ключ -> значение`.\n\nПо смыслу:\n\n```python\nx in s\n```\n\nделает:\n\n```text\n1. посчитать hash(x)\n2. найти возможную позицию\n3. проверить совпадение\n4. вернуть True / False\n```\n\nОфициальная документация описывает `set` как неупорядоченную коллекцию без дубликатов, предназначенную в том числе для быстрой проверки принадлежности. \n\nВ CPython реализация `set` основана на механике, похожей на `dict`: используется probing по хеш-таблице. В комментариях исходников указано, что начальная позиция считается от hash, а затем применяются дальнейшие probe-позиции; также используется комбинация линейного и рандомизированного probing для уменьшения проблем от коллизий. \n\n### frozenset\n\n`frozenset` — неизменяемая версия `set`.\n\n```python\ns = frozenset([1, 2, 3])\n```\n\nОтличие:\n\n```text\nset       -> можно add/remove\nfrozenset -> нельзя менять после создания\n```\n\nИз-за неизменяемости `frozenset` может быть ключом словаря или элементом другого множества, если его элементы сами hashable.\n\n### str\n\n`str` — неизменяемый объект для Unicode-текста.\n\n```python\ns = \"hello\"\n```\n\nСтрока не является «списком символов» в Python-смысле. Нельзя изменить символ на месте:\n\n```python\ns[0] = \"H\"  # TypeError\n```\n\nОперации вроде:\n\n```python\ns = s + \"!\"\n```\n\nсоздают новую строку, а имя `s` начинает ссылаться на новый объект. Это следует из общей модели: строки относятся к immutable-типам, как числа и кортежи. \n\n### bytes и bytearray\n\n`bytes` — неизменяемая последовательность байтов.\n\n`bytearray` — изменяемая последовательность байтов.\n\n```python\nb = b\"abc\"\n# b[0] = 100  # нельзя\n\nba = bytearray(b\"abc\")\nba[0] = 100   # можно\n```\n\nПо смыслу:\n\n```text\nbytes     -> как immutable-массив байтов\nbytearray -> как mutable-массив байтов\n```\n\n### range\n\n`range` не хранит все числа сразу.\n\n```python\nr = range(1_000_000_000)\n```\n\nОн хранит параметры:\n\n```text\nstart\nstop\nstep\n```\n\nи вычисляет элементы по индексу. Поэтому `range(1_000_000_000)` не создаёт миллиард `int`-объектов.\n\n### Итоговая схема\n\n```text\nlist\nдинамический массив ссылок\nбыстрый доступ по индексу\nможно менять размер\n\ntuple\nфиксированный массив ссылок\nбыстрый доступ по индексу\nнельзя менять ячейки после создания\n\ndict\nхеш-таблица key -> value\nбыстрый поиск по ключу\nключ должен быть hashable\n\nset\nхеш-таблица только для ключей\nбыстрая проверка x in set\nбез дубликатов\n\nfrozenset\nimmutable set\nможет быть ключом dict / элементом set\n\nstr\nimmutable Unicode-строка\nизменения создают новый объект\n\nbytes\nimmutable байты\n\nbytearray\nmutable байты\n\nrange\nленивый объект start/stop/step\nне хранит все числа\n```\n\n### Самая важная мысль\n\nPython-контейнеры обычно хранят не «значения внутри себя», а ссылки на объекты.\n\nПоэтому:\n\n```python\na = [1, 2, 3]\nb = a\n```\n\n```text\na ─┐\n   ├──> один и тот же list object\nb ─┘\n```\n\nА для вложенных объектов:\n\n```python\nt = ([1, 2],)\n```\n\n```text\ntuple object\n└─ slot 0 -> list object [1, 2]\n```\n\nКортеж immutable только в смысле своих ячеек: он не даст заменить `slot 0`, но объект, на который эта ячейка ссылается, может быть изменяемым. Это прямо соответствует модели Python: неизменяемость контейнера не означает глубокую неизменяемость всех объектов внутри него. "
