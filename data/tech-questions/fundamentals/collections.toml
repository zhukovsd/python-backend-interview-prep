  question = "Что будет, если обратиться к несуществующему ключу в словаре (dict)?"
  answer = "Если обратиться к несуществующему ключу через квадратные скобки:\n\n```python\ndata = {\"name\": \"Alex\"}\n\nprint(data[\"age\"])\n```\n\nбудет ошибка:\n\n```python\nKeyError: 'age'\n```\n\nТо есть `dict` не возвращает `None` автоматически. Он выбрасывает исключение `KeyError`.\n\n### Пример\n\n```python\nuser = {\n    \"id\": 1,\n    \"username\": \"alex\",\n}\n\nprint(user[\"email\"])\n```\n\nРезультат:\n\n```text\nKeyError: 'email'\n```\n\nПотому что ключа `\"email\"` в словаре нет.\n\n### Как безопасно получить значение\n\n#### 1. Через `get()`\n\n```python\nuser = {\n    \"id\": 1,\n    \"username\": \"alex\",\n}\n\nemail = user.get(\"email\")\n\nprint(email)  # None\n```\n\nЕсли ключа нет, `get()` по умолчанию возвращает `None`.\n\nМожно указать своё значение по умолчанию:\n\n```python\nemail = user.get(\"email\", \"no email\")\n\nprint(email)  # no email\n```\n\nТо есть:\n\n```text\nuser[\"email\"]        -> KeyError, если ключа нет\nuser.get(\"email\")    -> None, если ключа нет\nuser.get(\"email\", x) -> x, если ключа нет\n```\n\n### Проверка через `in`\n\n```python\nuser = {\n    \"id\": 1,\n    \"username\": \"alex\",\n}\n\nif \"email\" in user:\n    print(user[\"email\"])\nelse:\n    print(\"Ключа email нет\")\n```\n\nЭто нормальный вариант, когда нужно явно проверить наличие ключа.\n\n### Через `try/except`\n\n```python\nuser = {\n    \"id\": 1,\n    \"username\": \"alex\",\n}\n\ntry:\n    email = user[\"email\"]\nexcept KeyError:\n    email = \"no email\"\n\nprint(email)\n```\n\nТакой подход часто используют, когда отсутствие ключа — ожидаемая ситуация, но основной сценарий предполагает, что ключ есть.\n\n### `setdefault()`\n\nМетод `setdefault()` возвращает значение по ключу, а если ключа нет — добавляет его в словарь.\n\n```python\nuser = {\n    \"id\": 1,\n    \"username\": \"alex\",\n}\n\nemail = user.setdefault(\"email\", \"no email\")\n\nprint(email)  # no email\nprint(user)\n```\n\nРезультат:\n\n```python\n{'id': 1, 'username': 'alex', 'email': 'no email'}\n```\n\nОтличие от `get()`:\n\n```text\nget()        -> не изменяет словарь\nsetdefault() -> может изменить словарь\n```\n\n### `defaultdict`\n\nДля автоматического создания значений можно использовать `defaultdict`:\n\n```python\nfrom collections import defaultdict\n\ndata = defaultdict(list)\n\ndata[\"python\"].append(\"dict\")\n\nprint(data)\n```\n\nРезультат:\n\n```python\ndefaultdict(<class 'list'>, {'python': ['dict']})\n```\n\nЗдесь при обращении к отсутствующему ключу `\"python\"` автоматически создаётся пустой список.\n\n### Итог\n\n```python\ndata[\"missing_key\"]\n```\n\nдаст:\n\n```python\nKeyError\n```\n\nБезопасные варианты:\n\n```python\ndata.get(\"key\")\ndata.get(\"key\", default)\n\"key\" in data\ntry/except KeyError\ndata.setdefault(\"key\", default)\ndefaultdict(...)\n```\n\nОсновное правило:\n\n```text\ndict[key] — когда ключ обязан существовать.\ndict.get(key) — когда ключ может отсутствовать.\n```"
