[[questions]]
  id = 1
  question = "Как работает set?"
  answer = "### Что такое `set`\n\n`set` — это встроенная коллекция Python для хранения уникальных элементов.\n\n```python\ns = {1, 2, 3, 3, 2}\n\nprint(s)  # {1, 2, 3}\n```\n\nДубликаты автоматически убираются, потому что множество хранит каждый элемент только один раз. В документации Python `set` описан как неупорядоченная коллекция уникальных hashable-объектов. \n\n### Главное отличие от `list`\n\n`list` хранит элементы по позициям:\n\n```python\nlst = [10, 20, 30]\nprint(lst[0])  # 10\n```\n\n`set` не хранит элементы по индексам:\n\n```python\ns = {10, 20, 30}\n\nprint(s[0])  # TypeError\n```\n\nУ `set` нет индексов, срезов и гарантированного порядка элементов, потому что это не последовательность. Python прямо указывает, что множества не записывают позицию элемента или порядок вставки.\n\n### Как `set` ищет элементы\n\nВнутри CPython `set` работает примерно как хеш-таблица.\n\nКогда ты делаешь:\n\n```python\ns = {10, 20, 30}\n\nprint(20 in s)\n```\n\nPython не перебирает все элементы по очереди, как список. Он делает примерно следующее:\n\n```text\n20\n↓\nhash(20)\n↓\nиндекс в таблице\n↓\nпроверка: лежит ли там нужный элемент\n```\n\nИменно поэтому проверка наличия элемента в `set` обычно очень быстрая. В Python Tutorial отдельно указано, что `set` используют для быстрой проверки принадлежности и удаления дубликатов. \n\n### Упрощённая схема\n\n```text\nset = хеш-таблица\n\nэлемент: \"cat\"\nhash(\"cat\") -> число\nчисло -> позиция внутри таблицы\n\nтаблица:\n[ пусто ]\n[ \"dog\" ]\n[ пусто ]\n[ \"cat\" ]\n[ \"bird\" ]\n```\n\nКогда ты пишешь:\n\n```python\n\"cat\" in animals\n```\n\nPython вычисляет хеш `\"cat\"` и почти сразу понимает, где искать.\n\n### Почему элементы должны быть hashable\n\nЭлемент `set` должен иметь стабильный хеш.\n\nМожно:\n\n```python\ns = {1, \"hello\", (1, 2)}\n```\n\nНельзя:\n\n```python\ns = {[1, 2, 3]}\n# TypeError: unhashable type: 'list'\n```\n\n`list` изменяемый, поэтому его нельзя безопасно использовать как элемент множества. Документация Python указывает, что элементы `set`, как и ключи словаря, должны быть hashable. \n\n### Почему дубликаты удаляются\n\nПример:\n\n```python\ns = set([1, 2, 2, 3, 3, 3])\n\nprint(s)  # {1, 2, 3}\n```\n\nКогда Python добавляет элемент, он проверяет:\n\n```text\n1 уже есть? нет  -> добавить\n2 уже есть? нет  -> добавить\n2 уже есть? да   -> не добавлять\n3 уже есть? нет  -> добавить\n3 уже есть? да   -> не добавлять\n```\n\nПоэтому `set` часто используют для удаления повторов:\n\n```python\nnumbers = [1, 2, 2, 3, 3, 4]\n\nunique = set(numbers)\n\nprint(unique)  # {1, 2, 3, 4}\n```\n\n### Основные операции\n\n```python\na = {1, 2, 3}\nb = {3, 4, 5}\n```\n\nОбъединение:\n\n```python\nprint(a | b)  # {1, 2, 3, 4, 5}\n```\n\nПересечение:\n\n```python\nprint(a & b)  # {3}\n```\n\nРазность:\n\n```python\nprint(a - b)  # {1, 2}\n```\n\nСимметрическая разность:\n\n```python\nprint(a ^ b)  # {1, 2, 4, 5}\n```\n\nЭти операции официально указаны в документации Python: union, intersection, difference и symmetric difference. \n\n### Скорость операций\n\nДля CPython в среднем:\n\n```text\nx in set        -> O(1)\nadd(x)          -> O(1)\nremove(x)       -> O(1)\nперебор set     -> O(n)\n```\n\nНо в худшем случае из-за коллизий хешей поиск может деградировать до `O(n)`. Python Wiki по временной сложности указывает для `x in s` у `set`: средний случай `O(1)`, худший случай `O(n)`. \n\n### Что такое коллизия\n\nКоллизия — это когда разные элементы попали в одну или близкую позицию хеш-таблицы.\n\nУсловно:\n\n```text\nhash(\"cat\") -> 5\nhash(\"dog\") -> 5\n```\n\nТогда Python должен дополнительно проверить, какой именно элемент лежит в этой позиции. Поэтому `set` сначала использует `hash()`, а потом при необходимости сравнивает элементы через `==`.\n\n### `set` изменяемый, `frozenset` неизменяемый\n\nОбычный `set` можно менять:\n\n```python\ns = {1, 2}\n\ns.add(3)\ns.remove(1)\n\nprint(s)  # {2, 3}\n```\n\nНо сам `set` нельзя положить внутрь другого `set`:\n\n```python\ns = {{1, 2}}\n# TypeError: unhashable type: 'set'\n```\n\nДля этого есть `frozenset`:\n\n```python\ns = {frozenset({1, 2}), frozenset({3, 4})}\n```\n\nДокументация Python различает `set` и `frozenset`: `set` изменяемый и не имеет хеша, а `frozenset` неизменяемый и hashable. \n\n### Коротко\n\n`set` — это коллекция для уникальных элементов.\n\n```text\nlist -> порядок, индексы, дубликаты\nset  -> уникальность, быстрый поиск, без индексов\n```\n\nИспользуй `set`, когда нужно:\n\n```text\nбыстро проверить наличие элемента\nубрать дубликаты\nсравнивать группы элементов\nделать объединение / пересечение / разность\n```\n\nГлавная идея: `set` жертвует порядком и индексами ради уникальности и быстрого поиска."
  popularity = 2.63

[[questions]]
  id = 2
  question = "Что представляет собой тип данных множество (set)"
  answer = "### Что представляет собой `set`\n\n`set` — это встроенный тип данных Python, который представляет собой множество.\n\nМножество — это коллекция элементов, где:\n\n```text\n1. Каждый элемент хранится только один раз\n2. Порядок элементов не считается важным\n3. Быстро проверяется наличие элемента\n4. Элементы должны быть hashable\n```\n\nОфициальная документация Python определяет `set` как неупорядоченную коллекцию без повторяющихся элементов. Основные применения: проверка принадлежности элемента и удаление дубликатов. \n\n### Пример\n\n```python\nnumbers = {1, 2, 3, 3, 4, 4}\n\nprint(numbers)\n```\n\nРезультат:\n\n```python\n{1, 2, 3, 4}\n```\n\nПовторяющиеся значения `3` и `4` не сохраняются повторно.\n\n### Важные свойства `set`\n\n### 1. Уникальность элементов\n\n```python\ns = {1, 1, 2, 2, 3}\n\nprint(s)\n```\n\n```python\n{1, 2, 3}\n```\n\n`set` автоматически убирает дубликаты.\n\n### 2. Нет доступа по индексу\n\n```python\ns = {10, 20, 30}\n\nprint(s[0])\n```\n\nБудет ошибка:\n\n```python\nTypeError: 'set' object is not subscriptable\n```\n\nПотому что `set` — не последовательность вроде `list` или `tuple`.\n\n### 3. Быстрая проверка наличия элемента\n\n```python\nusers = {\"admin\", \"moderator\", \"guest\"}\n\nprint(\"admin\" in users)  # True\nprint(\"root\" in users)   # False\n```\n\nДля таких проверок `set` обычно подходит лучше, чем `list`, потому что внутри он использует хеширование.\n\n### 4. Элементы должны быть неизменяемыми / hashable\n\nМожно хранить:\n\n```python\ns = {1, \"hello\", (1, 2)}\n```\n\nНельзя хранить:\n\n```python\ns = {[1, 2, 3]}\n```\n\nБудет ошибка:\n\n```python\nTypeError: unhashable type: 'list'\n```\n\n`list` изменяемый, поэтому его нельзя использовать как элемент множества. Документация Python указывает, что элементы множества должны быть hashable, как и ключи словаря. \n\n### Для чего используют `set`\n\n### Удаление дубликатов\n\n```python\nnumbers = [1, 2, 2, 3, 3, 4]\n\nunique_numbers = set(numbers)\n\nprint(unique_numbers)\n```\n\n```python\n{1, 2, 3, 4}\n```\n\n### Проверка принадлежности\n\n```python\nallowed_roles = {\"admin\", \"manager\", \"moderator\"}\n\nrole = \"admin\"\n\nif role in allowed_roles:\n    print(\"Доступ разрешён\")\n```\n\n### Математические операции над множествами\n\n```python\na = {1, 2, 3}\nb = {3, 4, 5}\n```\n\nОбъединение:\n\n```python\nprint(a | b)  # {1, 2, 3, 4, 5}\n```\n\nПересечение:\n\n```python\nprint(a & b)  # {3}\n```\n\nРазность:\n\n```python\nprint(a - b)  # {1, 2}\n```\n\nСимметрическая разность:\n\n```python\nprint(a ^ b)  # {1, 2, 4, 5}\n```\n\nЭти операции поддерживаются встроенными объектами `set` и `frozenset`. \n\n### set vs list\n\n```text\nlist:\n- хранит порядок\n- допускает дубликаты\n- есть индексы\n- поиск элемента обычно медленнее\n\nset:\n- хранит только уникальные элементы\n- не предназначен для доступа по индексу\n- быстро проверяет наличие элемента\n- удобен для операций множеств\n```\n\nПример:\n\n```python\nitems = [\"a\", \"b\", \"a\", \"c\"]\n\nlst = list(items)\nst = set(items)\n\nprint(lst)  # ['a', 'b', 'a', 'c']\nprint(st)   # {'a', 'b', 'c'}\n```\n\n### Коротко\n\n`set` — это тип данных для хранения уникальных элементов без привязки к индексам.\n\nГлавная идея:\n\n```text\nset нужен не для порядка,\nа для уникальности и быстрой проверки наличия.\n```\n\nНа практике `set` чаще всего используют, когда нужно убрать дубликаты, быстро проверить `x in collection` или выполнить операции вроде объединения и пересечения множеств."
  popularity = 2.63

[[questions]]
  id = 3
  question = "Как разрешаются коллизии в hash-таблицах?"
  answer = "### Что такое коллизия\n\nКоллизия в hash-таблице — это ситуация, когда разные ключи после хеширования попадают в один и тот же индекс массива.\n\nУсловно:\n\n```text\nhash(\"cat\") % table_size -> 5\nhash(\"dog\") % table_size -> 5\n```\n\nОба ключа хотят попасть в ячейку `5`, но физически в одной ячейке нельзя просто хранить два разных значения одинаковым образом. Поэтому hash-таблице нужен механизм разрешения коллизий.\n\n### Основные способы разрешения коллизий\n\n### 1. Метод цепочек\n\nИдея: каждая ячейка массива хранит не один элемент, а контейнер элементов.\n\n```text\nиндекс 0 -> пусто\nиндекс 1 -> пусто\nиндекс 2 -> [(\"cat\", 10), (\"dog\", 20), (\"fox\", 30)]\nиндекс 3 -> пусто\n```\n\nКогда возникает коллизия, новый элемент добавляется в цепочку по этому индексу.\n\nПоиск работает так:\n\n```text\n1. Вычисляем hash(key)\n2. Получаем индекс массива\n3. Заходим в цепочку по этому индексу\n4. Ищем нужный ключ через сравнение ==\n```\n\nПример:\n\n```python\nbucket = [\n    (\"cat\", 10),\n    (\"dog\", 20),\n    (\"fox\", 30),\n]\n\nfor key, value in bucket:\n    if key == \"dog\":\n        print(value)\n```\n\nМинус: если много элементов попало в одну цепочку, поиск становится медленнее.\n\nВ Java `HashMap` построен как hash-table-based реализация `Map`; документация указывает, что при нормальном распределении хешей базовые операции `get` и `put` дают constant-time performance, но много ключей с одинаковым `hashCode()` замедляют любую hash-таблицу. Также Java учитывает capacity и load factor, а при превышении порога выполняет rehash. ([Документация Oracle](https://docs.oracle.com/javase/8/docs/api/java/util/HashMap.html \"HashMap (Java Platform SE 8 )\"))\n\n### 2. Открытая адресация\n\nИдея: все элементы хранятся прямо внутри массива hash-таблицы.\n\nЕсли нужная ячейка занята, таблица ищет другую свободную ячейку по определённому правилу.\n\n```text\nхотели положить key в индекс 5\n\nиндекс 5 занят\n↓\nпроверяем индекс 6\n↓\nзанят\n↓\nпроверяем индекс 7\n↓\nсвободен\n↓\nкладём туда\n```\n\nУпрощённо:\n\n```text\nиндекс 0 -> пусто\nиндекс 1 -> (\"apple\", 100)\nиндекс 2 -> (\"cat\", 10)\nиндекс 3 -> (\"dog\", 20)\nиндекс 4 -> пусто\n```\n\nТут `\"cat\"` и `\"dog\"` могли изначально попасть в один индекс, но один из них был смещён в другую ячейку.\n\n### Виды поиска свободной ячейки\n\n### Линейное пробирование\n\nПроверяем следующую ячейку:\n\n```text\ni\ni + 1\ni + 2\ni + 3\n...\n```\n\nПример:\n\n```text\nhash(key) -> 3\n\n3 занято\n4 занято\n5 свободно\n```\n\nПлюс: просто и хорошо работает с кэшем процессора.\n\nМинус: может появляться кластеризация — длинные плотные участки занятых ячеек.\n\n### Квадратичное пробирование\n\nПрыгаем не на `+1`, а по возрастающим смещениям:\n\n```text\ni + 1²\ni + 2²\ni + 3²\n...\n```\n\nТо есть:\n\n```text\ni + 1\ni + 4\ni + 9\ni + 16\n...\n```\n\nЭто уменьшает проблему плотных кластеров, но реализация сложнее.\n\n### Двойное хеширование\n\nИспользуются две хеш-функции:\n\n```text\nindex = hash1(key)\nstep = hash2(key)\n```\n\nЕсли первая ячейка занята, следующая позиция считается через шаг `step`.\n\n```text\nindex\nindex + step\nindex + 2 * step\nindex + 3 * step\n...\n```\n\nПлюс: разные ключи получают разные последовательности поиска.\n\nМинус: нужно аккуратно подбирать вторую хеш-функцию.\n\n### Как это работает в CPython\n\nВ CPython `dict` использует открытую адресацию, а не метод цепочек. При коллизии он строит последовательность проб: сначала берёт начальный индекс, потом переходит к другим индексам по специальной формуле. В комментариях к исходному коду CPython указано, что при коллизиях стратегия разрешения коллизий критически важна; CPython использует рекуррентную формулу `j = ((5*j) + 1) mod 2**i`, а затем добавляет `perturb`, чтобы задействовать больше битов хеша. \n\nУпрощённо:\n\n```text\nkey\n↓\nhash(key)\n↓\nпервый индекс\n↓\nесли занято другим ключом\n↓\nвычислить следующий индекс\n↓\nпроверить его\n↓\nповторять, пока ключ не найден или не встретится пустая ячейка\n```\n\nДля `set` в CPython логика близкая: реализация основана на `dictobject.c`, начальный индекс считается как `hash mod table_size`, а последующие пробы вычисляются похожим образом. В комментарии к `setobject.c` прямо указано, что используется гибрид линейного пробирования и рандомизированного пробирования, чтобы улучшить локальность кэша и разбивать длинные цепочки коллизий. ([GitHub](https://github.com/python/cpython/blob/main/Objects/setobject.c?utm_source=chatgpt.com \"cpython/Objects/setobject.c at main\"))\n\n### Что происходит при поиске в hash-таблице\n\nДопустим, ищем ключ `\"dog\"`.\n\n```text\n1. Считаем hash(\"dog\")\n2. Получаем индекс, например 5\n3. Смотрим ячейку 5\n```\n\nДальше варианты:\n\n```text\nячейка пустая\n-> ключа точно нет\n\nячейка занята ключом \"dog\"\n-> нашли\n\nячейка занята другим ключом\n-> коллизия, идём по следующей позиции\n```\n\nВажно: hash-таблица не полагается только на `hash`.\n\nОна делает две проверки:\n\n```text\n1. hash совпадает?\n2. ключи равны через ==?\n```\n\nПотому что разные объекты могут иметь одинаковый hash.\n\n### Что происходит при добавлении\n\n```text\n1. Считаем hash(key)\n2. Получаем индекс\n3. Если ячейка свободна — кладём туда\n4. Если занята таким же ключом — обновляем значение\n5. Если занята другим ключом — ищем другую позицию\n```\n\nДля `set` значение не хранится отдельно, там важен только сам элемент.\n\n```python\ns = {\"cat\", \"dog\"}\n```\n\nВнутри это ближе к:\n\n```text\nhash(\"cat\") -> позиция\nhash(\"dog\") -> позиция\n```\n\nЕсли позиции совпали, `set` ищет другое место для одного из элементов.\n\n### Что происходит при удалении\n\nВ hash-таблицах с открытой адресацией нельзя всегда просто очистить ячейку.\n\nПочему:\n\n```text\nA попал в индекс 3\nB тоже хотел индекс 3, но из-за коллизии ушёл в индекс 4\n```\n\nТаблица:\n\n```text\n3 -> A\n4 -> B\n```\n\nЕсли удалить `A` и сделать ячейку `3` полностью пустой:\n\n```text\n3 -> пусто\n4 -> B\n```\n\nПри поиске `B` таблица может прийти в индекс `3`, увидеть пустоту и решить:\n\n```text\nB нет в таблице\n```\n\nХотя `B` лежит дальше.\n\nПоэтому часто используется специальная метка, например:\n\n```text\ndeleted / dummy / tombstone\n```\n\nТо есть ячейка считается удалённой, но поиск через неё не останавливается.\n\n### Зачем нужен resize / rehash\n\nЧем сильнее заполнена hash-таблица, тем больше коллизий.\n\nПоэтому hash-таблицы обычно следят за коэффициентом заполнения:\n\n```text\nload factor = количество элементов / размер таблицы\n```\n\nКогда элементов становится слишком много, таблица расширяется, и элементы перераспределяются по новому массиву.\n\nВ Java `HashMap`, например, при превышении порога `load factor * capacity` выполняется rehash, обычно с увеличением числа bucket примерно в 2 раза. Документация также указывает, что стандартный load factor `0.75` даёт компромисс между временем и расходом памяти. ([Документация Oracle](https://docs.oracle.com/javase/8/docs/api/java/util/HashMap.html \"HashMap (Java Platform SE 8 )\"))\n\nВ CPython для `dict` комментарии к исходному коду указывают, что load factor держится ниже `2/3`, чтобы обычно находить нужный ключ с первой попытки. ([GitHub](https://github.com/python/cpython/blob/main/Objects/dictobject.c \"cpython/Objects/dictobject.c at main · python/cpython · GitHub\"))\n\n### Коротко\n\nКоллизии разрешаются двумя основными подходами:\n\n```text\n1. Метод цепочек\n   В одной ячейке хранится список / дерево элементов.\n\n2. Открытая адресация\n   Все элементы лежат прямо в массиве, а при коллизии ищется другая ячейка.\n```\n\nДля Python важно запомнить:\n\n```text\ndict / set в CPython используют открытую адресацию,\nа не списки внутри bucket-ов.\n```\n\nГлавная идея разрешения коллизий:\n\n```text\nhash даёт стартовую позицию,\nа если она занята другим ключом,\nтаблица по специальному правилу ищет следующую подходящую позицию.\n```"
  popularity = 2.63

[[questions]]
  id = 4
  question = "Какие типы данных существуют в python?"
  answer = "### Типы данных Python\n\n- Неизменяемые (немутабельные, immutable) типы данных: числа (int, float), строки (str), булевые (bool), кортежи (tuple) и frozenset. Также - None, complex, bytes.\n- Изменяемые (мутабельные, muttable) типы данных. К изменяемым относятся списки (list), множества (set) и словари (dict). Также байтовый массив bytearray.\n\nИзменяемые типы данных могут быть изменены после их создания, а неизменяемые — нет.\n\n**None** - экземпляр типа объекта NoneType, который используется для обозначения отсутствия значения\n\n**bool** - булевы значения (True, False)\n\n**int** - целые чисел, как положительныхе, так и отрицательные\n\n**float** - числа, которые могут иметь десятичную часть (с плавающей точкой)\n\n**complex** - комплексные числа\n\n**str** - текстовая информация (строка, последовательность символов)\n\n**tuple** - неизменяемые упорядоченные коллекции элементов (кортежи)\n\n**bytes** - байтовые последовательности, которые используются для работы с бинарными файлами\n\n**frozenset** - неизменяемый тип данных, представляющий неупорядоченную коллекцию уникальных элементов\n\n**list** - изменяемые упорядоченные коллекции элементов (списки)\n\n**dict** - ассоциативный массив, пары «ключ-значение», где каждый ключ является уникальным\n\n**set** - неупорядоченная коллекция уникальных элементов (поддерживает операции над множествами - объединения, вхождения, исключения)\n\n**bytearray** - массив заданных байтов"
  popularity = 34.21

[[questions]]
  id = 5
  question = "Зачем в Python есть mutable и immutable типы? Почему не сделать изменяемую строку?"
  answer = "### Зачем нужны mutable и immutable типы\n\nВ Python каждый объект имеет `identity`, `type` и `value`. Изменяемость объекта определяется его типом: например, `list` и `dict` изменяемые, а `int`, `str`, `tuple` — неизменяемые. \n\nГлавная идея такая:\n\n```text\nimmutable object\nзначение после создания не меняется\n\nmutable object\nзначение можно менять внутри того же объекта\n```\n\nПример:\n\n```python\ns = \"abc\"\ns = s + \"d\"\n```\n\nЗдесь строка `\"abc\"` не изменилась. Создалась новая строка `\"abcd\"`, а переменная `s` стала ссылаться на неё.\n\n```python\nlst = [1, 2, 3]\nlst.append(4)\n```\n\nЗдесь список изменился на месте. Объект остался тот же, но его содержимое стало другим.\n\n### Зачем нужны immutable-типы\n\n#### 1. Безопасность от неожиданных изменений\n\nImmutable-объект нельзя случайно изменить через другую ссылку.\n\n```python\na = \"hello\"\nb = a\n\nb = b.upper()\n\nprint(a)  # hello\nprint(b)  # HELLO\n```\n\nСо списком иначе:\n\n```python\na = [1, 2, 3]\nb = a\n\nb.append(4)\n\nprint(a)  # [1, 2, 3, 4]\n```\n\nПотому что `a` и `b` ссылаются на один и тот же изменяемый объект.\n\n### 2. Можно использовать как ключи dict и элементы set\n\nЧтобы объект можно было использовать как ключ словаря или элемент множества, его хеш должен оставаться стабильным. В документации Python указано, что hashable-объект имеет хеш, который не меняется в течение жизни объекта; это нужно для `dict` и `set`. \n\nПоэтому строка может быть ключом:\n\n```python\nusers = {\n    \"admin\": \"root\",\n    \"guest\": \"readonly\",\n}\n```\n\nА список не может:\n\n```python\nd = {}\n\nd[[1, 2, 3]] = \"value\"\n# TypeError: unhashable type: 'list'\n```\n\nЕсли бы список можно было использовать как ключ, возникла бы проблема:\n\n```python\nkey = [1, 2, 3]\nd[key] = \"value\"\n\nkey.append(4)\n```\n\nПосле изменения ключа словарь уже не смог бы надёжно найти значение, потому что хеш и логическое значение ключа могли бы измениться.\n\n### 3. Удобно переиспользовать объекты\n\nДля immutable-объектов интерпретатор может безопасно переиспользовать один и тот же объект с одинаковым значением. В документации прямо указано, что для immutable-типов операции могут возвращать ссылку на уже существующий объект с тем же типом и значением, а для mutable-объектов так делать нельзя. \n\nУпрощённо:\n\n```python\na = \"hello\"\nb = \"hello\"\n```\n\nТак как строка неизменяемая, безопасно, чтобы `a` и `b` ссылались на один и тот же объект.\n\nДля списков так нельзя:\n\n```python\na = []\nb = []\n```\n\nЭто должны быть два разных списка, иначе изменение `a` ломало бы `b`.\n\n### Зачем нужны mutable-типы\n\nMutable-типы нужны там, где объект должен накапливать состояние:\n\n```python\nitems = []\n\nitems.append(\"apple\")\nitems.append(\"banana\")\nitems.append(\"orange\")\n```\n\nСоздавать новый список при каждом добавлении было бы неудобно и часто неэффективно.\n\nMutable-типы подходят для:\n\n```text\nlist  -> динамическая коллекция\ndict  -> изменяемое отображение ключ -> значение\nset   -> изменяемое множество\nbytearray -> изменяемая последовательность байтов\n```\n\nВстроенные коллекции Python специально поддерживают операции изменения на месте; документация отдельно отмечает, что некоторые коллекции изменяемые, а методы, которые добавляют, удаляют или переставляют элементы на месте, обычно возвращают `None`, а не сам объект. \n\n### Почему не сделать изменяемую строку\n\nПотому что строка в Python — это не просто «массив символов». Это базовый тип для текста: имена, ключи словарей, пути, атрибуты, сообщения, JSON-ключи, SQL-фрагменты, URL и так далее. Документация определяет `str` как неизменяемую последовательность Unicode code points. \n\nЕсли бы строка была mutable, появились бы проблемы.\n\n#### 1. Строки нельзя было бы безопасно использовать как ключи dict\n\nСейчас это нормально:\n\n```python\ncache = {\n    \"user:42\": \"cached data\"\n}\n```\n\nЕсли бы строку можно было изменить на месте:\n\n```python\nkey = \"user:42\"\ncache[key] = \"cached data\"\n\n# гипотетически:\nkey.change_to(\"user:99\")\n```\n\nТогда ключ внутри словаря фактически изменился бы после вставки. Это ломает принцип работы hash-таблицы.\n\n#### 2. Любая передача строки стала бы опаснее\n\nСейчас:\n\n```python\ndef log(message: str):\n    print(message)\n\ntext = \"error\"\nlog(text)\n```\n\nМожно быть уверенным, что `log()` не изменит исходную строку.\n\nС mutable-строками пришлось бы постоянно думать:\n\n```text\nА функция изменила мою строку?\nА строка изменилась в другом месте?\nНужно ли делать копию перед передачей?\n```\n\nЭто усложнило бы код.\n\n#### 3. Большинство операций со строками логически создают новый текст\n\n```python\ns = \"hello\"\ns2 = s.replace(\"h\", \"H\")\n\nprint(s)   # hello\nprint(s2)  # Hello\n```\n\n`replace()`, `upper()`, `strip()`, `split()` и похожие операции не портят исходный текст. Это предсказуемое поведение.\n\n### А как тогда эффективно собирать строку?\n\nДля большого количества склеек обычно используют `join()`:\n\n```python\nparts = []\n\nfor word in [\"hello\", \"world\"]:\n    parts.append(word)\n\nresult = \" \".join(parts)\nprint(result)  # hello world\n```\n\nТо есть изменяемым буфером выступает `list`, а итоговая строка создаётся один раз.\n\nДля бинарных данных есть `bytearray` — это изменяемый аналог `bytes`, он поддерживает mutable sequence operations. \n\n```python\ndata = bytearray(b\"abc\")\ndata[0] = ord(\"A\")\n\nprint(data)  # bytearray(b'Abc')\n```\n\nНо `bytearray` — это байты, не полноценный Unicode-текст как `str`.\n\n### Итог\n\nMutable и immutable типы нужны для разных задач:\n\n```text\nimmutable:\n- значение стабильно\n- безопасно передавать\n- можно хешировать\n- удобно использовать как ключ dict / элемент set\n- меньше неожиданных побочных эффектов\n\nmutable:\n- можно менять на месте\n- удобно накапливать данные\n- эффективно для коллекций и буферов\n```\n\nСтрока в Python immutable, потому что текст чаще нужен как стабильное значение, а не как изменяемый контейнер символов. Для изменения текста обычно создаётся новая строка, а для эффективной сборки используют `list + ''.join(...)`."
  popularity = 2.63

[[questions]]
  id = 6
  question = "Чем отличается списки от кортежа? (list vs tuple)"
  answer = "### Отличие списка от кортежа\n\nСписок и кортеж в Python различаются главным образом изменяемостью: список является изменяемым (может быть изменен после создания), тогда как кортеж является неизменяемым (не может быть изменен после создания). Это означает, что элементы списка можно добавлять, удалять или изменять, а элементы кортежа после создания остаются неизменными.\n\nПод список выделяется определенное место в памяти, когда оно заканчивается (после добавления новых элементов) выделяется новое место памяти большего размера, в которое переносится весь список, для кортежа выделяется фиксированное место в памяти и никогда не меняется, так как кортеж неизменяем(поэтому работа с ним быстрее)\n\n**Семантическое различие**\n\n- Список обычно содержит однородные данные (элементы одного типа и назначения).\n- Кортеж часто содержит разнородные данные, где позиция элемента имеет смысловое значение.\n\n**Аннотации типов**\n\nКортежи можно аннотировать как записи с фиксированной структурой, где указывается тип для каждой позиции. Это полезно для представления структур данных с определенной схемой, например, информация о человеке (имя, возраст, активен) или координаты точки (x, y). **`tuple[int, str, bool]`** - кортеж из 3 элементов типов int, str, bool.\n\n**Области применения**\n\n- Список используется для коллекций, которые могут изменяться в процессе работы программы.\n- Кортеж идеален для константных данных, ключей словарей, возврата нескольких значений из функций и случаев, когда важна гарантия неизменяемости данных."
  popularity = 13.16

