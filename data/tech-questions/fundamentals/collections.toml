  id = 12
  question = "Массив vs список"
  answer = "### Главное\n\nВ контексте Python важно понимать:\n\n```text\nPython list — это не классический linked list\nPython list — это динамический массив ссылок\n```\n\nТо есть Python-список по внутреннему устройству ближе к массиву, чем к связному списку. В CPython у `list` есть `ob_item` — массив указателей на элементы, `ob_size` — текущая длина, и `allocated` — выделенная ёмкость. \n\n### Классический массив\n\nМассив обычно означает структуру, где элементы одного типа лежат в памяти подряд:\n\n```text\narray of int:\n\n[ 10 ][ 20 ][ 30 ][ 40 ]\n```\n\nУсловно:\n\n```c\nint arr[4] = {10, 20, 30, 40};\n```\n\nОсобенности:\n\n```text\n1. Элементы обычно одного типа\n2. Память расположена компактно\n3. Быстрый доступ по индексу: O(1)\n4. Размер часто фиксирован или меняется дорого\n5. Хорошо подходит для чисел и плотных данных\n```\n\n### Python list\n\nPython `list` хранит не сами значения, а ссылки на Python-объекты:\n\n```python\nlst = [10, \"abc\", True]\n```\n\nВнутри примерно:\n\n```text\nlist\n ├─ ob_size = 3\n ├─ allocated = 4\n └─ ob_item\n     ├─ [0] -> PyObject int(10)\n     ├─ [1] -> PyObject str(\"abc\")\n     ├─ [2] -> PyObject bool(True)\n     └─ [3] -> free\n```\n\nПоэтому в одном списке можно хранить разные типы:\n\n```python\nlst = [1, \"hello\", True, None]\n```\n\nОфициальная документация Python описывает `list` как изменяемую последовательность, а элементы списка могут быть произвольными Python-объектами. \n\n### Главное различие по памяти\n\nКлассический массив чисел:\n\n```text\n[ 1 ][ 2 ][ 3 ][ 4 ]\n```\n\nPython list:\n\n```text\n[ ptr ][ ptr ][ ptr ][ ptr ]\n   ↓     ↓     ↓     ↓\n  int   int   int   int\n```\n\nТо есть `list` хранит массив ссылок, а не плотный массив самих чисел.\n\nИз-за этого `list` гибче, но обычно требует больше памяти.\n\n### `array.array` в Python\n\nВ Python есть отдельный модуль `array`.\n\n```python\nfrom array import array\n\nnums = array(\"i\", [1, 2, 3, 4])\n```\n\nЭто уже ближе к классическому массиву: элементы одного типа и хранятся компактнее. Документация Python прямо говорит, что `array` компактно хранит базовые значения — символы, целые числа и числа с плавающей точкой; тип задаётся при создании через type code.\n\nПример:\n\n```python\nfrom array import array\n\nnums = array(\"i\", [1, 2, 3])\n\nnums.append(4)\n\nprint(nums[0])  # 1\n```\n\nНо так нельзя:\n\n```python\nfrom array import array\n\nnums = array(\"i\", [1, 2, 3])\n\nnums.append(\"hello\")  # TypeError\n```\n\nПотому что `array(\"i\")` хранит целые числа, а не произвольные объекты.\n\n### Сравнение\n\n|Критерий|Классический массив / `array.array`|Python `list`|\n|---|---|---|\n|Тип элементов|Обычно один тип|Любые Python-объекты|\n|Хранение|Значения компактно|Ссылки на объекты|\n|Размер|Часто фиксированный / менее гибкий|Динамически растёт|\n|Доступ по индексу|`O(1)`|`O(1)`|\n|Добавление в конец|Зависит от реализации|Обычно `O(1)` амортизированно|\n|Вставка в начало/середину|Обычно `O(n)`|`O(n)`|\n|Память|Экономнее|Обычно больше расход памяти|\n|Гибкость|Ниже|Выше|\n|Использование|Числа, бинарные данные, плотные массивы|Обычные коллекции объектов|\n\n### Почему `list` гибче\n\nСписок может хранить всё подряд:\n\n```python\nitems = [\n    1,\n    \"text\",\n    {\"name\": \"Alice\"},\n    [10, 20],\n    None,\n]\n```\n\nПотому что внутри лежат ссылки:\n\n```text\n[ ptr ][ ptr ][ ptr ][ ptr ][ ptr ]\n```\n\nА массив обычно рассчитан на один конкретный тип:\n\n```text\narray of int:\n[ int ][ int ][ int ][ int ]\n```\n\n### Почему массив может быть эффективнее\n\nЕсли нужно хранить миллион чисел, `array.array` или `numpy.ndarray` обычно лучше, чем `list`.\n\nНапример:\n\n```python\nfrom array import array\n\nnums = array(\"i\", range(1_000_000))\n```\n\nТак данные будут храниться компактнее, чем в обычном списке:\n\n```python\nnums = list(range(1_000_000))\n```\n\nПотому что список хранит ссылки на объекты `int`, а `array.array` хранит сами C-значения заданного типа. Документация Python описывает `array` как более компактный вариант для базовых числовых значений. \n\n### Важный момент\n\nВ Python слово «список» может сбивать с толку.\n\nВ структурах данных есть:\n\n```text\narray       -> массив\nlinked list -> связный список\nlist        -> абстрактная последовательность\n```\n\nНо Python `list` — это не `linked list`.\n\nPython `list` — это:\n\n```text\nдинамический массив ссылок\n```\n\nИменно поэтому:\n\n```python\nlst = [10, 20, 30]\n\nprint(lst[1])  # 20\n```\n\nдоступ по индексу быстрый.\n\nЕсли бы это был связный список, для доступа к `lst[1]` пришлось бы идти от первого узла ко второму.\n\n### Когда использовать `list`\n\nИспользуй обычный `list`, когда нужна универсальная коллекция:\n\n```python\nusers = [\"Alice\", \"Bob\", \"John\"]\ntasks = [{\"id\": 1}, {\"id\": 2}]\nvalues = [1, \"abc\", True]\n```\n\nПодходит для:\n\n```text\nобычных списков объектов\nрезультатов запросов\nJSON-подобных структур\nочередей небольшого размера\nдинамического добавления элементов\n```\n\n### Когда использовать массив\n\nИспользуй массив, когда данные однотипные и важна компактность:\n\n```python\nfrom array import array\n\ntemperatures = array(\"f\", [36.6, 37.1, 36.9])\nids = array(\"i\", [1, 2, 3, 4])\n```\n\nПодходит для:\n\n```text\nбольших числовых наборов\nбинарных данных\nработы с C API\nэкономии памяти\nчисленных вычислений\n```\n\nДля серьёзных численных вычислений обычно используют `numpy.ndarray`, потому что NumPy даёт многомерные однородные массивы и эффективные операции над ними.\n\n### Итог\n\n```text\narray:\nкомпактное хранилище однотипных значений\n\nlist:\nдинамический массив ссылок на любые Python-объекты\n```\n\nПрактическое правило:\n\n```text\nНужна обычная коллекция объектов -> list\nНужны миллионы чисел и экономия памяти -> array.array или NumPy\n```\n\nВ Python почти всегда начинают с `list`, а к массивам переходят тогда, когда есть конкретная причина: память, скорость численных операций или работа с бинарными данными."
  popularity = 5.26

[[questions]]
  id = 13
  question = "Почему при создании списка под его внутреннее хранилище выделяется массив фиксированной длины и определённого типа?"
  answer = "### Суть\n\nПотому что внутреннее хранилище `list` в CPython — это обычный C-массив указателей:\n\n```c\nPyObject **ob_item;\n```\n\nТо есть:\n\n```text\nob_item -> массив элементов типа PyObject*\n```\n\nВ исходниках CPython `ob_item` описан как вектор указателей на элементы списка: `list[0]` соответствует `ob_item[0]`. Поле `allocated` хранит количество выделенных ячеек во внутреннем массиве. ([GitHub](https://github.com/python/cpython/blob/main/Include/cpython/listobject.h?utm_source=chatgpt.com \"cpython/Include/cpython/listobject.h at main · python/cpython\"))\n\n### Почему массив фиксированной длины\n\nПотому что в C массив — это непрерывный участок памяти фиксированного размера.\n\nНапример, если CPython выделил место под 8 ссылок:\n\n```text\nallocated = 8\n\n[ ptr ][ ptr ][ ptr ][ ptr ][ free ][ free ][ free ][ free ]\n```\n\nЭтот конкретный участок памяти имеет ёмкость 8 ячеек. Нельзя просто «дописать девятую ячейку рядом», потому что за этим участком памяти может находиться что-то другое.\n\nПоэтому при нехватке места список делает resize:\n\n```text\nстарое хранилище:\n[ ptr ][ ptr ][ ptr ][ ptr ]\n\nновое хранилище:\n[ ptr ][ ptr ][ ptr ][ ptr ][ free ][ free ][ free ][ free ]\n```\n\nВ `list_resize()` CPython проверяет, хватает ли уже выделенной ёмкости. Если хватает, он просто меняет размер списка. Если не хватает, происходит перевыделение внутреннего массива. ([GitHub](https://github.com/python/cpython/blob/main/Objects/listobject.c?utm_source=chatgpt.com \"cpython/Objects/listobject.c at main\"))\n\n### Почему массив определённого типа\n\nПотому что C-массив должен знать размер каждой ячейки.\n\nДля быстрого доступа по индексу нужно уметь вычислить адрес:\n\n```text\nадрес элемента = адрес начала массива + индекс * размер_ячейки\n```\n\nНапример:\n\n```text\nob_item[3]\n```\n\nработает быстро, потому что каждая ячейка имеет одинаковый размер — размер указателя `PyObject*`.\n\nИменно поэтому внутренний массив списка имеет один C-тип:\n\n```c\nPyObject*\n```\n\nНо это не значит, что Python-список хранит элементы одного Python-типа.\n\n### Почему тогда в `list` можно хранить разные типы\n\nПотому что список хранит не сами объекты, а ссылки на объекты.\n\n```python\nlst = [1, \"abc\", True, None]\n```\n\nВнутри:\n\n```text\nob_item\n ├─ [0] -> PyLongObject(1)\n ├─ [1] -> PyUnicodeObject(\"abc\")\n ├─ [2] -> PyBoolObject(True)\n └─ [3] -> Py_None\n```\n\nВсе ячейки внутреннего массива имеют один C-тип:\n\n```text\nPyObject*\n```\n\nА сами объекты могут быть разными:\n\n```text\nint\nstr\nbool\nNoneType\ndict\nlist\ncustom class\n```\n\nДокументация Python прямо указывает, что элементы списка — произвольные Python-объекты. \n\n### Зачем именно так сделали\n\nГлавная причина — быстрый доступ по индексу.\n\n```python\nlst[5]\n```\n\nCPython может сразу взять:\n\n```c\nob_item[5]\n```\n\nБез прохода по предыдущим элементам.\n\nЕсли бы список был связанным списком:\n\n```text\nnode -> node -> node -> node\n```\n\nдля доступа к элементу по индексу пришлось бы идти от узла к узлу.\n\nА у Python `list`:\n\n```text\n[ ptr ][ ptr ][ ptr ][ ptr ][ ptr ]\n```\n\nпоэтому доступ по индексу быстрый.\n\n### Почему не выделять память под каждый элемент отдельно\n\nПотому что тогда список потерял бы преимущества массива.\n\nПлохая схема:\n\n```text\nlist\n ├─ node -> object\n ├─ node -> object\n ├─ node -> object\n └─ node -> object\n```\n\nМинусы:\n\n```text\nбольше памяти на служебные структуры\nхуже кэш CPU\nмедленнее доступ по индексу\nсложнее перемещаться по элементам\n```\n\nСхема CPython:\n\n```text\nlist\n └─ ob_item -> [ ptr ][ ptr ][ ptr ][ ptr ]\n```\n\nОна компактнее для самих ссылок и быстрее для индексного доступа.\n\n### Почему не хранить сами объекты подряд\n\nНапример, почему не так:\n\n```text\n[ int ][ str ][ bool ][ dict ]\n```\n\nПотому что Python-объекты имеют разный размер и разную внутреннюю структуру.\n\n`int`, `str`, `dict`, `list` — это разные C-структуры. Их нельзя удобно положить в один простой массив фиксированных ячеек.\n\nПоэтому используется общий уровень абстракции:\n\n```text\nлюбой Python-объект -> PyObject*\n```\n\nТо есть список хранит одинаковые по размеру указатели, а не разные по размеру объекты.\n\n### Почему ёмкость не равна длине\n\nУ списка есть:\n\n```text\nob_size    -> текущая длина\nallocated  -> выделенная ёмкость\n```\n\nНапример:\n\n```text\nob_size = 5\nallocated = 8\n```\n\nЭто значит:\n\n```text\nв списке 5 элементов,\nно во внутреннем массиве есть место под 8 ссылок\n```\n\nТак сделано, чтобы `append()` не перевыделял память каждый раз.\n\nВ `list_resize()` CPython использует over-allocation — выделение памяти с запасом. В комментарии к исходникам указано, что это нужно для амортизированного линейного поведения при длинной серии `append()`. \n\n### Пример\n\n```python\nlst = []\n```\n\nПустой список:\n\n```text\nob_size = 0\nallocated = 0\nob_item = NULL\n```\n\nДобавляем первый элемент:\n\n```python\nlst.append(\"A\")\n```\n\nCPython выделяет внутренний массив с запасом:\n\n```text\nob_size = 1\nallocated = 4\n\n[ ptr ][ free ][ free ][ free ]\n```\n\nДобавляем ещё:\n\n```python\nlst.append(\"B\")\nlst.append(\"C\")\nlst.append(\"D\")\n```\n\nПока хватает старой ёмкости:\n\n```text\nob_size = 4\nallocated = 4\n\n[ ptr ][ ptr ][ ptr ][ ptr ]\n```\n\nДобавляем пятый элемент:\n\n```python\nlst.append(\"E\")\n```\n\nНужно новое хранилище:\n\n```text\nob_size = 5\nallocated = 8\n\n[ ptr ][ ptr ][ ptr ][ ptr ][ ptr ][ free ][ free ][ free ]\n```\n\n### Итог\n\nВнутреннее хранилище списка — это массив фиксированной длины и определённого типа, потому что:\n\n```text\n1. C-массив требует заранее выделенного непрерывного участка памяти\n2. Все ячейки массива должны иметь одинаковый размер\n3. Тип PyObject* позволяет хранить ссылки на любые Python-объекты\n4. Фиксированная ёмкость даёт быстрый доступ по индексу\n5. При нехватке места список создаёт/перевыделяет массив большей ёмкости\n6. Запас allocated нужен, чтобы append() не делал resize каждый раз\n```\n\nГлавная мысль:\n\n```text\nPython list динамический снаружи,\nно его внутреннее хранилище — фиксированный C-массив ссылок на текущую ёмкость.\n```"
  popularity = 2.63

[[questions]]
  id = 14
  question = "В какой структуре данных поиск выполняется эффективнее — в списке или во множестве?"
  answer = "### Коротко\n\nПоиск выполняется эффективнее во множестве `set`, а не в списке `list`.\n\n```text\nlist -> поиск O(n)\nset  -> поиск O(1) в среднем\n```\n\n### Почему в `list` поиск медленнее\n\nСписок хранит элементы последовательно:\n\n```python\nitems = [10, 20, 30, 40, 50]\n\nprint(40 in items)  # True\n```\n\nЧтобы найти `40`, Python проверяет элементы по очереди:\n\n```text\n10 -> не то\n20 -> не то\n30 -> не то\n40 -> найдено\n```\n\nВ худшем случае нужно пройти весь список:\n\n```text\n[10][20][30][40][50][60][70]\n                       ↑\n                    искомый элемент\n```\n\nПоэтому поиск в списке:\n\n```text\nO(n)\n```\n\nЧем больше список, тем дольше поиск.\n\n### Почему в `set` поиск быстрее\n\nМножество реализовано через хеш-таблицу.\n\n```python\nitems = {10, 20, 30, 40, 50}\n\nprint(40 in items)  # True\n```\n\nPython не перебирает все элементы подряд. Он:\n\n```text\n1. Считает hash(40)\n2. По хешу определяет примерное место в таблице\n3. Проверяет, лежит ли там нужный элемент\n```\n\nУпрощённо:\n\n```text\nset/hash table\n\nhash(40) -> index 3\n\n[ ][ ][ ][40][ ][ ][ ]\n         ↑\n      быстро нашли\n```\n\nПоэтому поиск во множестве в среднем:\n\n```text\nO(1)\n```\n\nPython Wiki указывает среднюю сложность `x in s` для `list` как `O(n)`, а для `set` — `O(1)`.\n\n### Пример\n\n```python\nnums_list = [1, 2, 3, 4, 5]\nnums_set = {1, 2, 3, 4, 5}\n\nprint(5 in nums_list)  # True\nprint(5 in nums_set)   # True\n```\n\nРезультат одинаковый, но механизм разный:\n\n```text\nlist:\nпроверяет элементы последовательно\n\nset:\nищет по хешу\n```\n\n### Важное ограничение `set`\n\nВо множество можно положить только хешируемые объекты.\n\nМожно:\n\n```python\nitems = {1, 2, \"abc\", (10, 20)}\n```\n\nНельзя:\n\n```python\nitems = {[1, 2], [3, 4]}\n```\n\nБудет ошибка:\n\n```text\nTypeError: unhashable type: 'list'\n```\n\nПотому что список изменяемый и не имеет стабильного хеша.\n\nДокументация Python описывает `set` как неупорядоченную коллекцию уникальных хешируемых объектов. \n\n### Когда `list` всё равно лучше\n\n`list` лучше, когда важен порядок или нужны дубликаты:\n\n```python\nitems = [10, 20, 20, 30]\n```\n\nСписок сохраняет порядок и допускает повторяющиеся элементы.\n\n`set` удаляет дубликаты:\n\n```python\nitems = {10, 20, 20, 30}\n\nprint(items)  # {10, 20, 30}\n```\n\n### Когда `set` лучше\n\n`set` лучше, когда задача — быстро проверять наличие элемента:\n\n```python\nbanned_ids = {10, 25, 31, 44}\n\nuser_id = 25\n\nif user_id in banned_ids:\n    print(\"blocked\")\n```\n\nОсобенно если проверок много:\n\n```python\nallowed_ids = {1, 2, 3, 4, 5}\n\nfor user_id in users:\n    if user_id in allowed_ids:\n        ...\n```\n\n### Итог\n\n```text\nДля поиска элемента:\nset быстрее list\n```\n\nНо выбор зависит от задачи:\n\n```text\nНужен порядок и дубликаты -> list\nНужна быстрая проверка наличия -> set\n```\n\nГлавная разница:\n\n```text\nlist ищет перебором\nset ищет через хеш-таблицу\n```"
  popularity = 5.26

