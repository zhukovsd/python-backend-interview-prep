  id = 17
  question = "Может ли кортеж (tuple), использоваться в качестве ключа словаря (dict)?"
  answer = "### Да, но только при одном условии\n\n`tuple` может быть ключом словаря, если сам кортеж хешируемый.\n\nА кортеж хешируемый только тогда, когда все его элементы тоже хешируемые. В документации Python указано, что неизменяемые контейнеры вроде `tuple` и `frozenset` хешируемы только при условии, что их элементы хешируемы. \n\n### Работает\n\n```python\ndata = {\n    (1, 2): \"point A\",\n    (3, 4): \"point B\",\n}\n\nprint(data[(1, 2)])\n# point A\n```\n\nЗдесь `(1, 2)` можно использовать как ключ, потому что `int` — хешируемый тип.\n\nТакже можно:\n\n```python\nusers = {\n    (\"admin\", \"read\"): True,\n    (\"admin\", \"write\"): True,\n    (\"guest\", \"read\"): True,\n}\n\nprint(users[(\"admin\", \"write\")])\n# True\n```\n\n### Не работает\n\n```python\ndata = {\n    ([1, 2], 3): \"value\"\n}\n```\n\nБудет ошибка:\n\n```text\nTypeError: unhashable type: 'list'\n```\n\nПричина: внутри кортежа лежит `list`, а список изменяемый и не хешируемый.\n\n### Почему так\n\n`dict` ищет ключи через хеш-таблицу. Поэтому ключ словаря должен иметь стабильный хеш. Python glossary прямо указывает: хешируемость делает объект пригодным для использования как ключ словаря и элемент множества. \n\nКортеж сам по себе неизменяемый:\n\n```python\nkey = (1, 2, 3)\n```\n\nНо если внутри лежит изменяемый объект:\n\n```python\nkey = ([1, 2], 3)\n```\n\nто содержимое списка можно изменить:\n\n```python\nkey[0].append(99)\n```\n\nИз-за этого такой кортеж не может иметь надёжный стабильный хеш.\n\n### Как проверить\n\n```python\nprint(hash((1, 2, 3)))\n# работает\n\nprint(hash(([1, 2], 3)))\n# TypeError: unhashable type: 'list'\n```\n\n### Практическое применение\n\nКортежи часто используют как составные ключи:\n\n```python\nprices = {\n    (\"BTC\", \"USD\"): 105000,\n    (\"ETH\", \"USD\"): 3500,\n    (\"EUR\", \"AZN\"): 1.9,\n}\n\nprint(prices[(\"BTC\", \"USD\")])\n```\n\nИли координаты:\n\n```python\nboard = {\n    (0, 0): \"empty\",\n    (0, 1): \"wall\",\n    (1, 0): \"player\",\n}\n\nprint(board[(1, 0)])\n# player\n```\n\n### Итог\n\n```text\ntuple может быть ключом dict,\nесли все элементы внутри tuple хешируемые\n```\n\nРаботает:\n\n```python\n{(1, 2): \"ok\"}\n{(\"user\", 123): \"ok\"}\n{((1, 2), \"x\"): \"ok\"}\n```\n\nНе работает:\n\n```python\n{([1, 2], 3): \"error\"}\n{({\"a\": 1}, 2): \"error\"}\n{({1, 2}, 3): \"error\"}\n```\n\nПотому что `list`, `dict`, `set` — изменяемые и не хешируемые."
  popularity = 7.89

[[questions]]
  id = 18
  question = "Может ли кортеж (tuple) содержать изменяемые объекты?"
  answer = "### Да, может\n\n`tuple` может содержать изменяемые объекты:\n\n```python\nt = ([1, 2], {\"name\": \"Alice\"}, {10, 20})\n```\n\nЗдесь сам кортеж неизменяемый, но внутри него лежат изменяемые объекты:\n\n```text\ntuple\n ├─ list\n ├─ dict\n └─ set\n```\n\nДокументация Python описывает `tuple` как неизменяемую последовательность, но неизменяемость относится к самому контейнеру: он не может заменить свои элементы после создания. При этом объект, на который указывает элемент кортежа, может быть изменяемым. \n\n### Что нельзя менять\n\nНельзя заменить элемент кортежа:\n\n```python\nt = ([1, 2], \"abc\")\n\nt[0] = [3, 4]\n```\n\nБудет ошибка:\n\n```text\nTypeError: 'tuple' object does not support item assignment\n```\n\nПотому что ты пытаешься изменить сам кортеж: заменить ссылку в позиции `0`.\n\n### Что можно менять\n\nМожно изменить объект, который лежит внутри кортежа:\n\n```python\nt = ([1, 2], \"abc\")\n\nt[0].append(3)\n\nprint(t)\n# ([1, 2, 3], 'abc')\n```\n\nЗдесь кортеж не изменил свой элемент.\n\nБыло:\n\n```text\nt[0] -> список [1, 2]\n```\n\nСтало:\n\n```text\nt[0] -> тот же самый список [1, 2, 3]\n```\n\nСсылка внутри кортежа осталась прежней. Изменилось содержимое списка.\n\n### Важная разница\n\n```python\nt = ([1, 2],)\n\nt[0].append(3)   # можно\nt[0] = [1, 2, 3] # нельзя\n```\n\nРазница такая:\n\n```text\nt[0].append(3)\n-> меняем объект, на который указывает кортеж\n\nt[0] = [1, 2, 3]\n-> пытаемся заменить элемент самого кортежа\n```\n\n### Пример с `id`\n\n```python\nlst = [1, 2]\nt = (lst,)\n\nprint(id(t[0]))\n\nt[0].append(3)\n\nprint(id(t[0]))\nprint(t)\n```\n\nВывод будет примерно такой:\n\n```text\n140000000000000\n140000000000000\n([1, 2, 3],)\n```\n\n`id(t[0])` не изменился, потому что это тот же список.\n\n### Итог\n\n```text\ntuple может содержать изменяемые объекты\n```\n\nНо:\n\n```text\nнельзя менять сам tuple\nможно менять изменяемые объекты внутри tuple\n```\n\nГлавная мысль:\n\n```text\nнеизменяемость tuple означает, что нельзя заменить его ссылки на элементы,\nно не означает глубокую неизменяемость всех вложенных объектов\n```"
  popularity = 2.63

[[questions]]
  id = 19
  question = "Можно ли использовать объект класса как ключ словаря (dict)?"
  answer = "Да, **можно**, но объект класса должен быть **хешируемым**.\n\n### Главное правило\n\nОбъект может быть ключом `dict`, если:\n\n```text\nу объекта есть __hash__()\nи корректно работает __eq__()\n```\n\nСловарь использует хеш ключа для быстрого поиска, а при совпадении хешей дополнительно сравнивает ключи через равенство. В документации Python указано, что ключами словаря могут быть объекты с методами `__hash__()` и `__eq__()`. \n\n### Обычный объект класса — можно\n\n```python\nclass User:\n    pass\n\n\nu1 = User()\nu2 = User()\n\ndata = {\n    u1: \"first user\",\n    u2: \"second user\",\n}\n\nprint(data[u1])  # first user\n```\n\nПо умолчанию пользовательские объекты хешируются по своей идентичности, то есть фактически по объекту, а не по его содержимому.\n\n### Если переопределить **eq**, нужно быть осторожным\n\n```python\nclass User:\n    def __init__(self, username):\n        self.username = username\n\n    def __eq__(self, other):\n        return isinstance(other, User) and self.username == other.username\n\n\nu = User(\"alex\")\n\ndata = {\n    u: \"admin\"\n}\n```\n\nТакой код даст ошибку:\n\n```text\nTypeError: unhashable type: 'User'\n```\n\nПричина: если класс переопределяет `__eq__`, но не задаёт `__hash__`, Python делает объект нехешируемым, чтобы не нарушить работу `dict`. Это связано с правилом: если два объекта равны, их хеши тоже должны быть равны. \n\n### Правильный вариант\n\n```python\nclass User:\n    def __init__(self, username):\n        self.username = username\n\n    def __eq__(self, other):\n        return isinstance(other, User) and self.username == other.username\n\n    def __hash__(self):\n        return hash(self.username)\n\n\nu1 = User(\"alex\")\nu2 = User(\"alex\")\n\ndata = {\n    u1: \"admin\"\n}\n\nprint(data[u2])  # admin\n```\n\nЗдесь `u1` и `u2` считаются одинаковыми ключами, потому что:\n\n```python\nu1 == u2\nhash(u1) == hash(u2)\n```\n\n### Важный момент\n\nНе стоит делать ключ словаря на основе изменяемого состояния:\n\n```python\nu = User(\"alex\")\n\ndata = {\n    u: \"admin\"\n}\n\nu.username = \"bob\"\n```\n\nПосле изменения `username` изменится и хеш объекта. Словарь может больше не найти этот ключ корректно.\n\n### Итог\n\n```text\nОбъект класса можно использовать как ключ dict,\nесли он hashable.\n\nПо умолчанию обычные объекты классов hashable.\n\nЕсли переопределяешь __eq__,\nобычно нужно явно определить __hash__.\n\nХеш должен строиться только на неизменяемых данных.\n```"
  popularity = 2.63

