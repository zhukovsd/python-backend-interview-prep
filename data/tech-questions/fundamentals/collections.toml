  question = "С какими структурами данных из модуля collections вы работали?"
  answer = "### Примеры структур данных из `collections`\n\nМодуль `collections` даёт дополнительные контейнеры поверх обычных `list`, `dict`, `tuple`, `set`.\n\nОфициально в `collections` есть, например: `deque`, `defaultdict`, `Counter`, `OrderedDict`, `namedtuple`, `ChainMap`, `UserDict`, `UserList`, `UserString`.  \n\n### `deque`\n\nДвусторонняя очередь.\n\n```python\nfrom collections import deque\n\nqueue = deque()\n\nqueue.append(\"task1\")\nqueue.append(\"task2\")\nqueue.appendleft(\"urgent_task\")\n\nprint(queue)\n# deque(['urgent_task', 'task1', 'task2'])\n\nprint(queue.popleft())\n# urgent_task\n\nprint(queue.pop())\n# task2\n```\n\nИспользуется для:\n\n```text\nочередей\nBFS\nsliding window\nбыстрого добавления/удаления с двух концов\n```\n\nГлавное отличие:\n\n```text\nlist.pop(0)      -> O(n)\ndeque.popleft()  -> O(1)\n```\n\n### `defaultdict`\n\nСловарь со значением по умолчанию.\n\n```python\nfrom collections import defaultdict\n\ncounter = defaultdict(int)\n\nwords = [\"python\", \"java\", \"python\", \"go\"]\n\nfor word in words:\n    counter[word] += 1\n\nprint(counter)\n# defaultdict(<class 'int'>, {'python': 2, 'java': 1, 'go': 1})\n```\n\nБез `defaultdict` пришлось бы писать так:\n\n```python\ncounter = {}\n\nfor word in words:\n    if word not in counter:\n        counter[word] = 0\n\n    counter[word] += 1\n```\n\nЧастые варианты:\n\n```python\ndefaultdict(int)   # счётчик\ndefaultdict(list)  # группировка в списки\ndefaultdict(set)   # группировка в множества\n```\n\nПример группировки:\n\n```python\nfrom collections import defaultdict\n\nusers = [\n    (\"Alice\", \"Baku\"),\n    (\"Bob\", \"Baku\"),\n    (\"John\", \"Moscow\"),\n]\n\nusers_by_city = defaultdict(list)\n\nfor name, city in users:\n    users_by_city[city].append(name)\n\nprint(users_by_city[\"Baku\"])\n# ['Alice', 'Bob']\n```\n\n### `Counter`\n\nСчётчик элементов.\n\n```python\nfrom collections import Counter\n\nitems = [\"apple\", \"banana\", \"apple\", \"orange\", \"banana\", \"apple\"]\n\ncounter = Counter(items)\n\nprint(counter)\n# Counter({'apple': 3, 'banana': 2, 'orange': 1})\n\nprint(counter[\"apple\"])\n# 3\n\nprint(counter.most_common(2))\n# [('apple', 3), ('banana', 2)]\n```\n\nИспользуется для:\n\n```text\nподсчёта слов\nчастотного анализа\nподсчёта повторяющихся элементов\nпоиска самых популярных значений\n```\n\n### `OrderedDict`\n\nСловарь с дополнительными операциями над порядком.\n\n```python\nfrom collections import OrderedDict\n\ndata = OrderedDict()\n\ndata[\"a\"] = 1\ndata[\"b\"] = 2\ndata[\"c\"] = 3\n\ndata.move_to_end(\"a\")\n\nprint(data)\n# OrderedDict([('b', 2), ('c', 3), ('a', 1)])\n```\n\nСейчас обычный `dict` тоже сохраняет порядок вставки, но `OrderedDict` полезен, когда нужны специальные операции с порядком:\n\n```python\ndata.move_to_end(\"key\")\ndata.popitem(last=False)\n```\n\nНапример, для реализации LRU-кэша.\n\n### `namedtuple`\n\nКортеж с именованными полями.\n\n```python\nfrom collections import namedtuple\n\nPoint = namedtuple(\"Point\", [\"x\", \"y\"])\n\npoint = Point(10, 20)\n\nprint(point.x)\n# 10\n\nprint(point.y)\n# 20\n```\n\nОбычный tuple:\n\n```python\npoint = (10, 20)\n\nprint(point[0])\nprint(point[1])\n```\n\n`namedtuple` читается понятнее:\n\n```python\nprint(point.x)\nprint(point.y)\n```\n\nНо он остаётся неизменяемым:\n\n```python\npoint.x = 100\n# AttributeError\n```\n\n### `ChainMap`\n\nОбъединяет несколько словарей в одну логическую структуру.\n\n```python\nfrom collections import ChainMap\n\ndefaults = {\n    \"debug\": False,\n    \"timeout\": 30,\n}\n\nenv = {\n    \"timeout\": 10,\n}\n\ncli_args = {\n    \"debug\": True,\n}\n\nconfig = ChainMap(cli_args, env, defaults)\n\nprint(config[\"debug\"])\n# True\n\nprint(config[\"timeout\"])\n# 10\n```\n\nПоиск идёт слева направо:\n\n```text\ncli_args -> env -> defaults\n```\n\nУдобно для конфигураций:\n\n```text\nаргументы командной строки\nпеременные окружения\nдефолтные настройки\n```\n\n### `UserDict`\n\nОбёртка для создания своих словарей.\n\n```python\nfrom collections import UserDict\n\nclass UpperKeyDict(UserDict):\n    def __setitem__(self, key, value):\n        super().__setitem__(key.upper(), value)\n\ndata = UpperKeyDict()\n\ndata[\"name\"] = \"Alice\"\ndata[\"city\"] = \"Baku\"\n\nprint(data)\n# {'NAME': 'Alice', 'CITY': 'Baku'}\n```\n\nИспользуется, когда нужно создать свой контейнер на базе словаря.\n\n### `UserList`\n\nОбёртка для создания своих списков.\n\n```python\nfrom collections import UserList\n\nclass PositiveList(UserList):\n    def append(self, item):\n        if item <= 0:\n            raise ValueError(\"Only positive numbers are allowed\")\n\n        super().append(item)\n\nnumbers = PositiveList()\n\nnumbers.append(10)\nnumbers.append(5)\n\nprint(numbers)\n# [10, 5]\n\nnumbers.append(-1)\n# ValueError\n```\n\n### `UserString`\n\nОбёртка для создания своих строковых классов.\n\n```python\nfrom collections import UserString\n\nclass LowerString(UserString):\n    def __init__(self, value):\n        super().__init__(value.lower())\n\ntext = LowerString(\"HELLO Python\")\n\nprint(text)\n# hello python\n```\n\n### Самые часто используемые\n\nНа практике чаще всего встречаются:\n\n```python\nfrom collections import deque, defaultdict, Counter\n```\n\nОни используются чаще остальных:\n\n```text\ndeque        -> очередь\ndefaultdict  -> группировка и значения по умолчанию\nCounter      -> подсчёт элементов\n```\n\n### Итоговая таблица\n\n|Структура|Что делает|\n|---|---|\n|`deque`|Быстрая очередь с двух концов|\n|`defaultdict`|Словарь со значением по умолчанию|\n|`Counter`|Подсчёт элементов|\n|`OrderedDict`|Словарь с операциями над порядком|\n|`namedtuple`|Кортеж с именованными полями|\n|`ChainMap`|Объединение нескольких словарей|\n|`UserDict`|База для своих словарей|\n|`UserList`|База для своих списков|\n|`UserString`|База для своих строковых классов|"
  popularity = 5.26

