[[questions]]
  id = 9
  question = "Как реализованы список (list) и кортеж (tuple) на уровне внутренней структуры данных?"
  answer = "### Главное\n\nВ CPython:\n\n```text\nlist  -> динамический массив ссылок на PyObject\ntuple -> фиксированный массив ссылок на PyObject\n```\n\nТо есть и `list`, и `tuple` не хранят сами значения напрямую. Они хранят ссылки на Python-объекты.\n\n```python\nitems = [10, \"abc\", True]\n```\n\nУпрощённо внутри:\n\n```text\nlist\n ├─ ob_size = 3\n ├─ allocated = например 4\n └─ ob_item -> [ ptr -> int(10), ptr -> str(\"abc\"), ptr -> bool(True) ]\n```\n\n### Как устроен `list`\n\nВ CPython список представлен структурой `PyListObject`.\n\nУпрощённо:\n\n```c\ntypedef struct {\n    PyObject_VAR_HEAD\n    PyObject **ob_item;\n    Py_ssize_t allocated;\n} PyListObject;\n```\n\nВ исходниках CPython указано, что `ob_item` — это вектор указателей на элементы списка, а `list[0]` соответствует `ob_item[0]`. Также там есть поле `allocated`, которое показывает, сколько ячеек реально выделено под элементы. Количество фактически используемых элементов хранится в `ob_size`. ([GitHub](https://github.com/python/cpython/blob/main/Include/cpython/listobject.h \"cpython/Include/cpython/listobject.h at main · python/cpython · GitHub\"))\n\nТо есть список хранит:\n\n```text\nob_size    -> текущая длина списка\nallocated  -> сколько места выделено с запасом\nob_item    -> указатель на массив ссылок на элементы\n```\n\nПример:\n\n```python\nlst = [1, 2, 3]\n```\n\nВнутренне примерно:\n\n```text\nPyListObject\n ├─ ob_size = 3\n ├─ allocated = 4 или больше\n └─ ob_item\n     ├─ [0] -> PyLongObject(1)\n     ├─ [1] -> PyLongObject(2)\n     ├─ [2] -> PyLongObject(3)\n     └─ [3] -> свободная ячейка\n```\n\n### Почему `list.append()` обычно быстрый\n\nСписок выделяет память с запасом.\n\nКогда ты делаешь:\n\n```python\nlst.append(4)\n```\n\nPython часто не обязан сразу перевыделять память. Он просто кладёт ссылку в уже свободную ячейку.\n\nВ `list_resize()` в CPython прямо указано, что список делает over-allocation — выделяет немного больше памяти, чем нужно сейчас, чтобы длинная серия `append()` работала амортизированно за линейное время. Там же приведён примерный паттерн роста: `0, 4, 8, 16, 24, 32, 40, 52...` ([GitHub](https://github.com/python/cpython/blob/main/Objects/listobject.c \"cpython/Objects/listobject.c at main · python/cpython · GitHub\"))\n\nПоэтому:\n\n```python\nlst.append(x)\n```\n\nобычно работает за:\n\n```text\nO(1) amortized\n```\n\nНо иногда списоку всё-таки приходится перевыделять память и копировать ссылки в новый массив.\n\n### Как работает доступ по индексу в `list`\n\n```python\nlst[2]\n```\n\nТак как внутри есть массив ссылок, Python может сразу перейти к нужной ячейке:\n\n```text\nob_item[2]\n```\n\nПоэтому доступ по индексу быстрый:\n\n```text\nO(1)\n```\n\nОфициальная C API документация для `PyList_GetItem` тоже описывает получение объекта по позиции `index`; при выходе за границы возвращается ошибка `IndexError`. \n\n### Как устроен `tuple`\n\nКортеж в CPython представлен структурой `PyTupleObject`.\n\nВ актуальной ветке CPython она выглядит примерно так:\n\n```c\ntypedef struct {\n    PyObject_VAR_HEAD\n    Py_hash_t ob_hash;\n    PyObject *ob_item[1];\n} PyTupleObject;\n```\n\nВ исходниках указано, что `ob_item` содержит место для `ob_size` элементов. Также в актуальной структуре есть поле `ob_hash` для кэшированного хеша. ([GitHub](https://github.com/python/cpython/blob/main/Include/cpython/tupleobject.h \"cpython/Include/cpython/tupleobject.h at main · python/cpython · GitHub\"))\n\nУпрощённо:\n\n```text\ntuple\n ├─ ob_size = 3\n ├─ ob_hash = cached hash\n └─ ob_item -> [ ptr, ptr, ptr ]\n```\n\nПример:\n\n```python\ntpl = (1, 2, 3)\n```\n\nВнутренне примерно:\n\n```text\nPyTupleObject\n ├─ ob_size = 3\n ├─ ob_hash = -1 или уже посчитанный hash\n └─ ob_item\n     ├─ [0] -> PyLongObject(1)\n     ├─ [1] -> PyLongObject(2)\n     └─ [2] -> PyLongObject(3)\n```\n\n### Главное отличие `tuple` от `list` внутри\n\nУ `tuple` нет поля `allocated`.\n\nУ списка есть:\n\n```text\nob_size\nallocated\nob_item\n```\n\nУ кортежа в целом:\n\n```text\nob_size\nob_item\n```\n\nПотому что кортеж фиксированного размера.\n\nСписок может расти:\n\n```python\nlst = [1, 2]\nlst.append(3)\n```\n\nКортеж не может:\n\n```python\ntpl = (1, 2)\ntpl.append(3)  # AttributeError\n```\n\nКогда ты пишешь:\n\n```python\ntpl = tpl + (3,)\n```\n\nсоздаётся новый кортеж, а старый не расширяется.\n\n### Почему `tuple` обычно компактнее\n\n`tuple` не нужен запас памяти под будущие элементы.\n\nСписок хранит дополнительную ёмкость:\n\n```text\nlen(list) <= allocated\n```\n\nА кортеж создаётся сразу нужного размера:\n\n```text\nlen(tuple) == количество ячеек под элементы\n```\n\nПоэтому кортеж обычно немного экономнее по памяти, особенно если коллекция неизменяемая.\n\n### Важный момент про неизменяемость\n\n`tuple` неизменяемый не потому, что его элементы физически невозможно трогать на уровне C, а потому что Python API не даёт менять ссылки внутри кортежа после создания.\n\n```python\ntpl = (1, 2, 3)\n\ntpl[0] = 100\n```\n\nОшибка:\n\n```text\nTypeError: 'tuple' object does not support item assignment\n```\n\nНо если внутри кортежа лежит изменяемый объект, сам этот объект менять можно:\n\n```python\ntpl = ([1, 2], \"abc\")\n\ntpl[0].append(3)\n\nprint(tpl)  # ([1, 2, 3], 'abc')\n```\n\nКортеж не поменял ссылку `tpl[0]`. Она как указывала на тот же список, так и указывает. Изменился сам список внутри.\n\n### Сравнение на уровне структуры\n\n|Свойство|`list`|`tuple`|\n|---|---|---|\n|Внутренняя структура|Динамический массив ссылок|Фиксированный массив ссылок|\n|Можно менять размер|Да|Нет|\n|Есть запас памяти|Да, через `allocated`|Нет|\n|Доступ по индексу|`O(1)`|`O(1)`|\n|`append`|Есть|Нет|\n|Изменение элемента|Можно|Нельзя|\n|Обычно память|Больше|Меньше|\n|Использование|Когда коллекция меняется|Когда коллекция фиксированная|\n\n### Почему это не linked list\n\nPython `list` — это не связный список.\n\nСвязный список выглядел бы так:\n\n```text\nnode -> node -> node -> node\n```\n\nА Python `list` ближе к массиву:\n\n```text\n[ ptr ][ ptr ][ ptr ][ ptr ]\n```\n\nПоэтому:\n\n```python\nlst[1000]\n```\n\nработает быстро, потому что Python не идёт от первого элемента до тысячного. Он сразу вычисляет адрес нужной ячейки массива.\n\nНо вставка в середину дорогая:\n\n```python\nlst.insert(0, x)\n```\n\nПотому что элементы нужно сдвигать:\n\n```text\n[1][2][3]\n insert 0\n[x][1][2][3]\n```\n\nЭто уже:\n\n```text\nO(n)\n```\n\n### Общая модель объектов\n\nИ `list`, и `tuple` — это объекты переменной длины. В CPython для таких объектов используется `PyObject_VAR_HEAD`, который расширяется до `PyVarObject ob_base`; эта структура содержит размер переменной части объекта. \n\nУпрощённо:\n\n```text\nPyObject\n ├─ refcount\n └─ type pointer\n\nPyVarObject\n ├─ PyObject header\n └─ ob_size\n```\n\nДля `list`:\n\n```text\nPyListObject\n ├─ PyVarObject header\n ├─ ob_item\n └─ allocated\n```\n\nДля `tuple`:\n\n```text\nPyTupleObject\n ├─ PyVarObject header\n ├─ ob_hash\n └─ ob_item\n```\n\n### Итог\n\n```text\nlist:\nдинамический массив ссылок с запасом памяти\n\ntuple:\nфиксированный массив ссылок без возможности менять размер\n```\n\nПрактически:\n\n```python\n# list — когда надо менять\nusers = []\nusers.append(\"Alice\")\nusers.append(\"Bob\")\n\n# tuple — когда набор фиксированный\npoint = (10, 20)\nrgb = (255, 128, 0)\n```\n\n`list` оптимизирован под изменение коллекции.\n\n`tuple` оптимизирован под фиксированную, компактную и неизменяемую последовательность."
  popularity = 7.89

[[questions]]
  id = 10
  question = "Как происходит выделение памяти для списка и его внутреннего хранилища?"
  answer = "### Коротко\n\nВ CPython список состоит из двух частей:\n\n```text\nPyListObject\n ├─ служебная часть объекта\n ├─ ob_size     -> текущая длина списка\n ├─ allocated   -> сколько ячеек выделено во внутреннем массиве\n └─ ob_item     -> указатель на массив ссылок PyObject*\n```\n\nТо есть память выделяется отдельно:\n\n```text\n1. Под сам объект списка\n2. Под внутренний массив ссылок на элементы\n```\n\nВ исходниках CPython `list` описан как `PyListObject`, где `ob_item` — это вектор указателей на элементы, а `allocated` показывает количество выделенных ячеек. Там же указано, что `len(list) == ob_size`, а `ob_item == NULL` означает пустой список с `ob_size == allocated == 0`. ([GitHub](https://github.com/python/cpython/blob/main/Include/cpython/listobject.h \"cpython/Include/cpython/listobject.h at main · python/cpython · GitHub\"))\n\n### Важно: список хранит не сами объекты\n\nНапример:\n\n```python\nlst = [10, \"abc\", True]\n```\n\nВнутри список хранит не сами `10`, `\"abc\"` и `True`, а ссылки на объекты:\n\n```text\nlst\n ├─ ob_size = 3\n ├─ allocated = например 4\n └─ ob_item\n     ├─ [0] -> PyLongObject(10)\n     ├─ [1] -> PyUnicodeObject(\"abc\")\n     ├─ [2] -> PyBoolObject(True)\n     └─ [3] -> свободная ячейка\n```\n\nПоэтому при расширении списка обычно копируются не сами Python-объекты, а указатели на них.\n\n### Создание пустого списка\n\n```python\nlst = []\n```\n\nУпрощённо:\n\n```text\nob_size = 0\nallocated = 0\nob_item = NULL\n```\n\nТо есть под внутреннее хранилище элементов память ещё не выделяется.\n\nВ `PyList_New()` в CPython при размере `size <= 0` поле `ob_item` устанавливается в `NULL`, затем выставляются размер и `allocated`. ([GitHub](https://github.com/python/cpython/blob/main/Objects/listobject.c \"cpython/Objects/listobject.c at main · python/cpython · GitHub\"))\n\n### Создание списка известного размера\n\nНапример, на уровне C API:\n\n```c\nPyList_New(3)\n```\n\nCPython создаёт объект списка и выделяет массив под 3 указателя:\n\n```text\nob_size = 3\nallocated = 3\nob_item -> [NULL, NULL, NULL]\n```\n\nДокументация Python C API прямо указывает: если `len > 0`, элементы нового списка сначала установлены в `NULL`, и такой список нельзя показывать Python-коду до заполнения реальными объектами. \n\nНа Python-уровне ты обычно этого не видишь:\n\n```python\nlst = [1, 2, 3]\n```\n\nПотому что интерпретатор создаёт список и сразу заполняет его ссылками на элементы.\n\n### Что происходит при `append`\n\n```python\nlst = []\nlst.append(10)\n```\n\nСначала список пустой:\n\n```text\nob_size = 0\nallocated = 0\nob_item = NULL\n```\n\nПосле первого `append` нужно место под элемент. CPython вызывает внутреннюю функцию изменения размера списка — `list_resize()`.\n\nОна выделяет не ровно 1 ячейку, а с запасом:\n\n```text\nob_size = 1\nallocated = 4\nob_item -> [ptr, free, free, free]\n```\n\nТо есть список заранее получает несколько свободных ячеек, чтобы следующие `append()` не требовали нового выделения памяти каждый раз.\n\n### Почему список выделяет память с запасом\n\nЕсли бы список каждый раз выделял память ровно под новый размер, то такой код был бы дорогим:\n\n```python\nlst = []\n\nfor i in range(1000):\n    lst.append(i)\n```\n\nПочти каждый `append` требовал бы:\n\n```text\nвыделить новый массив\nскопировать старые ссылки\nосвободить старый массив\n```\n\nПоэтому CPython использует over-allocation — выделение памяти с запасом.\n\nВ `list_resize()` прямо указано, что список выделяет память пропорционально текущему размеру, чтобы длинная последовательность `append()` имела амортизированное линейное поведение. Там же указан примерный паттерн роста: `0, 4, 8, 16, 24, 32, 40, 52, 64, 76...`. ([GitHub](https://github.com/python/cpython/blob/main/Objects/listobject.c \"cpython/Objects/listobject.c at main · python/cpython · GitHub\"))\n\n### Формула роста\n\nВ актуальных исходниках CPython используется такая формула:\n\n```c\nnew_allocated = ((size_t)newsize + (newsize >> 3) + 6) & ~(size_t)3;\n```\n\nТо есть новый размер внутреннего массива примерно:\n\n```text\nnewsize + newsize / 8 + небольшой запас\n```\n\nИ потом результат округляется до кратности 4. Эта логика находится в `list_resize()`. ([GitHub](https://github.com/python/cpython/blob/main/Objects/listobject.c \"cpython/Objects/listobject.c at main · python/cpython · GitHub\"))\n\nПримерно:\n\n```text\nlen:        0  1  5  9   17  25  33\nallocated: 0  4  8  16  24  32  40\n```\n\nТочные значения могут зависеть от конкретной версии CPython, но принцип такой:\n\n```text\nlen(list) <= allocated\n```\n\n### Что происходит, когда свободное место уже есть\n\nДопустим:\n\n```text\nob_size = 3\nallocated = 4\n```\n\nИ ты делаешь:\n\n```python\nlst.append(40)\n```\n\nНовая длина — 4. Место уже есть.\n\n```text\nob_size = 4\nallocated = 4\n```\n\nНовый массив выделять не нужно. CPython просто кладёт ссылку в свободную ячейку.\n\n### Что происходит, когда места не хватает\n\nДопустим:\n\n```text\nob_size = 4\nallocated = 4\n```\n\nИ ты делаешь:\n\n```python\nlst.append(50)\n```\n\nНовая длина — 5, но свободных ячеек нет.\n\nТогда происходит примерно следующее:\n\n```text\n1. CPython считает новую ёмкость\n2. Вызывает PyMem_Realloc для внутреннего массива ob_item\n3. Старые ссылки переносятся в новое хранилище\n4. ob_item начинает указывать на новый массив\n5. allocated обновляется\n6. новый элемент записывается в свободную ячейку\n```\n\nВ обычной сборке CPython `list_resize()` использует `PyMem_Realloc()` для изменения размера внутреннего массива `ob_item`, после чего обновляет `self->ob_item`, `ob_size` и `allocated`. ([GitHub](https://github.com/python/cpython/blob/main/Objects/listobject.c \"cpython/Objects/listobject.c at main · python/cpython · GitHub\"))\n\n### Важный момент про копирование\n\nПри расширении списка не копируются сами объекты:\n\n```python\nlst = [\"abc\", \"def\"]\n```\n\nНе копируются строки `\"abc\"` и `\"def\"`.\n\nКопируется массив ссылок:\n\n```text\nстарый ob_item:\n[ptr1][ptr2]\n\nновый ob_item:\n[ptr1][ptr2][free][free]\n```\n\nОбъекты остаются там же в памяти. Меняется только внутреннее хранилище списка.\n\n### Что происходит при удалении элементов\n\nНапример:\n\n```python\nlst.pop()\n```\n\nСписок уменьшает `ob_size`.\n\nНо CPython не обязан сразу отдавать лишнюю память системе. Если после уменьшения список всё ещё занимает хотя бы половину выделенной ёмкости, `list_resize()` не делает реальное `realloc`, а просто меняет размер. В исходниках это проверяется условием: если `allocated >= newsize` и `newsize >= allocated >> 1`, то меняется только `ob_size`. ([GitHub](https://github.com/python/cpython/blob/main/Objects/listobject.c \"cpython/Objects/listobject.c at main · python/cpython · GitHub\"))\n\nТо есть было:\n\n```text\nob_size = 10\nallocated = 16\n```\n\nПосле удаления может стать:\n\n```text\nob_size = 9\nallocated = 16\n```\n\nПамять под 16 ячеек пока остаётся.\n\n### Когда список может уменьшить внутреннее хранилище\n\nЕсли список стал сильно меньше, CPython может перевыделить внутренний массив уже под меньшую ёмкость.\n\nУпрощённо:\n\n```text\nесли newsize >= allocated / 2:\n    не перевыделять память\n\nесли newsize < allocated / 2:\n    можно уменьшить хранилище\n```\n\nПоэтому список не расширяется и не сжимается при каждом изменении размера. Это снижает количество дорогих операций выделения памяти.\n\n### Общая схема `append`\n\n```text\nlst.append(x)\n\n1. newsize = ob_size + 1\n\n2. Если allocated хватает:\n      просто записать x в ob_item[ob_size]\n      увеличить ob_size\n\n3. Если allocated не хватает:\n      посчитать новую ёмкость\n      перевыделить ob_item\n      обновить allocated\n      записать x\n      увеличить ob_size\n```\n\n### Почему `append` считается быстрым\n\nОдин конкретный `append` иногда может быть дорогим, потому что вызывает перевыделение памяти.\n\nНо большинство `append()` просто кладут элемент в уже выделенную свободную ячейку.\n\nПоэтому:\n\n```text\nappend -> O(1) amortized\n```\n\nТо есть в среднем на длинной серии добавлений операция работает как константная.\n\n### Итог\n\n```text\nlist в CPython — это динамический массив ссылок\n```\n\nОн хранит:\n\n```text\nob_size    -> сколько элементов реально лежит в списке\nallocated  -> сколько ячеек выделено во внутреннем массиве\nob_item    -> указатель на массив PyObject*\n```\n\nГлавная идея:\n\n```text\nlen(list) может быть меньше allocated\n```\n\nИменно поэтому список может эффективно расти:\n\n```python\nlst = []\n\nlst.append(1)\nlst.append(2)\nlst.append(3)\n```\n\nCPython не выделяет память заново на каждый `append`, а держит запас свободных ячеек внутри списка."
  popularity = 2.63

[[questions]]
  id = 11
  question = "Как ведут себя элементы списка в момент увеличения его внутренней ёмкости?"
  answer = "Когда список увеличивает внутреннюю ёмкость, его элементы как Python-объекты не перемещаются и не копируются.\n\nКопируется или перемещается только внутренний массив ссылок:\n\n```text\nстарое хранилище ob_item:\n\n[ ptr1 ][ ptr2 ][ ptr3 ][ ptr4 ]\n\nновое хранилище ob_item:\n\n[ ptr1 ][ ptr2 ][ ptr3 ][ ptr4 ][ free ][ free ][ free ][ free ]\n```\n\n`ptr1`, `ptr2`, `ptr3` — это ссылки на реальные Python-объекты. Сами объекты остаются на своих местах в памяти.\n\n### Что именно происходит\n\nДопустим:\n\n```python\nlst = [a, b, c, d]\nlst.append(e)\n```\n\nЕсли внутренняя ёмкость уже заполнена:\n\n```text\nob_size = 4\nallocated = 4\n```\n\nто при `append(e)` CPython вызывает `list_resize()`.\n\nУпрощённо происходит так:\n\n```text\n1. Считается новая ёмкость, например 8\n2. Выделяется/перевыделяется массив ob_item\n3. Старые указатели копируются в новое хранилище\n4. ob_item начинает указывать на новый массив\n5. allocated обновляется\n6. Новый элемент записывается в свободную ячейку\n```\n\nВ исходниках CPython прямо указано, что `ob_item` — это вектор указателей на элементы списка, а `allocated` показывает, сколько ячеек выделено под эти указатели. \n\n### Объекты не копируются\n\nНапример:\n\n```python\nx = {\"name\": \"Alice\"}\ny = {\"name\": \"Bob\"}\n\nlst = [x, y]\nlst.append({\"name\": \"John\"})\n```\n\nПри расширении списка не создаются копии `x` и `y`.\n\nБыло:\n\n```text\nlst.ob_item\n ├─ [0] -> x\n └─ [1] -> y\n```\n\nПосле расширения:\n\n```text\nlst.ob_item\n ├─ [0] -> x\n ├─ [1] -> y\n ├─ [2] -> new_object\n └─ [3] -> free\n```\n\nСами объекты `x` и `y` остались теми же.\n\n### Может измениться адрес внутреннего массива\n\nВажный момент:\n\n```text\nid(lst) не меняется\nid(lst[0]) не меняется\nадрес внутреннего ob_item может измениться\n```\n\nТо есть сам объект списка остаётся тем же самым, но его внутреннее хранилище ссылок может быть перенесено в другое место памяти.\n\nВ комментарии к `list_resize()` в CPython прямо сказано, что `self->ob_item` может измениться. ([GitHub](https://github.com/python/cpython/blob/main/Objects/listobject.c \"cpython/Objects/listobject.c at main · python/cpython · GitHub\"))\n\n### Почему `id(lst)` не меняется\n\n```python\nlst = [1, 2, 3]\n\nbefore = id(lst)\n\nfor i in range(1000):\n    lst.append(i)\n\nafter = id(lst)\n\nprint(before == after)  # True\n```\n\nОбъект списка тот же.\n\nМеняется не сам `PyListObject`, а его поле `ob_item`, то есть указатель на внутренний массив ссылок:\n\n```text\nPyListObject остался тот же:\n\nlst\n ├─ ob_size\n ├─ allocated\n └─ ob_item -> новый массив ссылок\n```\n\n### Почему `id(lst[0])` тоже не меняется\n\n```python\nobj = {\"value\": 123}\n\nlst = [obj]\n\nbefore = id(lst[0])\n\nfor i in range(1000):\n    lst.append(i)\n\nafter = id(lst[0])\n\nprint(before == after)  # True\n```\n\nПотому что при расширении списка переносится не объект `obj`, а только ссылка на него.\n\nУпрощённо:\n\n```text\nдо resize:\n\nob_item[0] -> obj\n\nпосле resize:\n\nnew_ob_item[0] -> obj\n```\n\nОбъект `obj` тот же.\n\n### Что происходит с порядком элементов\n\nПорядок сохраняется.\n\n```python\nlst = [10, 20, 30, 40]\nlst.append(50)\n```\n\nПосле расширения:\n\n```text\n[10, 20, 30, 40, 50]\n```\n\nСтарые ссылки переносятся в тот же порядок:\n\n```text\nold_ob_item[0] -> new_ob_item[0]\nold_ob_item[1] -> new_ob_item[1]\nold_ob_item[2] -> new_ob_item[2]\nold_ob_item[3] -> new_ob_item[3]\n```\n\n### Что происходит с reference count\n\nДля старых элементов при обычном расширении списка их счётчик ссылок не обязан меняться.\n\nПочему:\n\n```text\nстарый массив ссылок исчезает\nновый массив ссылок содержит те же самые ссылки\n```\n\nЛогически количество ссылок от списка на каждый старый объект остаётся тем же: одна ссылка была, одна ссылка осталась.\n\nА вот для нового элемента, который добавляется через `append`, список начинает хранить новую ссылку на этот объект. В реализации `PyList_Append` используется внутренняя логика добавления элемента после `list_resize()`. В коде `_PyList_AppendTakeRefListResize()` сначала вызывается `list_resize(self, len + 1)`, затем новый элемент записывается в `self->ob_item[len]`. \n\n### Почему операция может быть дорогой\n\nКогда ёмкости хватает:\n\n```text\nappend -> просто записать ссылку в свободную ячейку\n```\n\nЭто быстро.\n\nКогда ёмкости не хватает:\n\n```text\nappend -> resize -> перевыделение памяти -> перенос старых ссылок -> запись нового элемента\n```\n\nЭто дороже, потому что нужно обработать уже существующие ссылки.\n\nПоэтому один конкретный `append()` иногда может быть `O(n)`, если произошёл resize.\n\nНо серия `append()` в среднем эффективна, потому что список заранее выделяет память с запасом. В `list_resize()` указано, что CPython делает over-allocation, чтобы длинная последовательность `append()` имела амортизированное линейное поведение; там же приведён паттерн роста `0, 4, 8, 16, 24, 32, 40, 52...`. \n\n### Итог\n\nПри увеличении внутренней ёмкости списка:\n\n```text\n1. Сами элементы-объекты не копируются\n2. Копируются только ссылки на элементы\n3. id(lst) остаётся тем же\n4. id старых элементов остаётся тем же\n5. Адрес внутреннего массива ob_item может измениться\n6. Порядок элементов сохраняется\n7. Операция resize может стоить O(n)\n```\n\nГлавная формула:\n\n```text\nlist хранит не объекты, а массив ссылок на объекты\n```\n\nПоэтому расширение списка — это перенос массива указателей, а не перенос самих Python-объектов."
