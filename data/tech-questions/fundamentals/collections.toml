  id = 28
  question = "Как получить предпоследний элемент списка (list)?"
  answer = "### Ответ\n\nПредпоследний элемент списка можно получить по индексу `-2`:\n\n```python\nlst = [10, 20, 30, 40]\n\nprint(lst[-2])  # 30\n```\n\n### Почему `-2`\n\nВ Python отрицательные индексы считают элементы с конца списка:\n\n```text\nlst[-1] -> последний элемент\nlst[-2] -> предпоследний элемент\nlst[-3] -> третий с конца\n```\n\nПример:\n\n```python\nlst = [\"a\", \"b\", \"c\", \"d\"]\n\nprint(lst[-1])  # d\nprint(lst[-2])  # c\n```\n\n### Важный момент\n\nЕсли в списке меньше двух элементов, будет ошибка:\n\n```python\nlst = [10]\n\nprint(lst[-2])\n```\n\nОшибка:\n\n```text\nIndexError: list index out of range\n```\n\nПоэтому безопасный вариант:\n\n```python\nlst = [10, 20, 30]\n\nif len(lst) >= 2:\n    print(lst[-2])\nelse:\n    print(\"В списке нет предпоследнего элемента\")\n```\n\n### Итог\n\n```python\nlst[-2]\n```\n\nЭто стандартный способ получить **предпоследний элемент списка** в Python."
  popularity = 2.63

