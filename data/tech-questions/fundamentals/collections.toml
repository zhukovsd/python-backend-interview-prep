  question = "Какие знаете способы сортировки данных в словаре (dict)"
  answer = "`dict` сам по себе не имеет метода `.sort()`. Обычно сортируют не сам словарь, а его:\n\n```text\nключи\nзначения\nпары key-value\n```\n\nВ Python для этого чаще всего используют `sorted()`. Она принимает любой итерируемый объект, возвращает новый отсортированный список и поддерживает параметры `key` и `reverse`. \n\n### 1. Сортировка по ключам\n\n```python\ndata = {\n    \"b\": 2,\n    \"c\": 3,\n    \"a\": 1,\n}\n\nsorted_data = dict(sorted(data.items()))\n\nprint(sorted_data)\n```\n\nРезультат:\n\n```python\n{'a': 1, 'b': 2, 'c': 3}\n```\n\nЗдесь:\n\n```python\ndata.items()\n```\n\nдаёт пары:\n\n```python\n[(\"b\", 2), (\"c\", 3), (\"a\", 1)]\n```\n\n`sorted()` сортирует их по первому элементу пары, то есть по ключу.\n\nВ современных версиях Python порядок элементов в `dict` гарантирован как порядок вставки, поэтому новый словарь сохранит порядок, в котором в него были добавлены отсортированные пары. \n\n### 2. Сортировка по ключам в обратном порядке\n\n```python\ndata = {\n    \"b\": 2,\n    \"c\": 3,\n    \"a\": 1,\n}\n\nsorted_data = dict(sorted(data.items(), reverse=True))\n\nprint(sorted_data)\n```\n\nРезультат:\n\n```python\n{'c': 3, 'b': 2, 'a': 1}\n```\n\nПараметр `reverse=True` делает сортировку в обратном порядке.\n\n### 3. Сортировка по значениям\n\n```python\ndata = {\n    \"apple\": 5,\n    \"banana\": 2,\n    \"orange\": 7,\n}\n\nsorted_data = dict(sorted(data.items(), key=lambda item: item[1]))\n\nprint(sorted_data)\n```\n\nРезультат:\n\n```python\n{'banana': 2, 'apple': 5, 'orange': 7}\n```\n\nЗдесь:\n\n```python\nkey=lambda item: item[1]\n```\n\nозначает:\n\n```text\nсортировать по значению\n```\n\nПотому что `item` — это пара:\n\n```python\n(\"apple\", 5)\n```\n\nгде:\n\n```text\nitem[0] -> ключ\nitem[1] -> значение\n```\n\n### 4. Сортировка по значениям по убыванию\n\n```python\ndata = {\n    \"apple\": 5,\n    \"banana\": 2,\n    \"orange\": 7,\n}\n\nsorted_data = dict(\n    sorted(data.items(), key=lambda item: item[1], reverse=True)\n)\n\nprint(sorted_data)\n```\n\nРезультат:\n\n```python\n{'orange': 7, 'apple': 5, 'banana': 2}\n```\n\n### 5. Сортировка только ключей\n\nИногда новый словарь не нужен. Достаточно получить отсортированный список ключей:\n\n```python\ndata = {\n    \"b\": 2,\n    \"c\": 3,\n    \"a\": 1,\n}\n\nkeys = sorted(data)\n\nprint(keys)\n```\n\nРезультат:\n\n```python\n['a', 'b', 'c']\n```\n\nПри итерации по словарю Python по умолчанию проходит по ключам, поэтому:\n\n```python\nsorted(data)\n```\n\nэквивалентно сортировке ключей.\n\n### 6. Сортировка только значений\n\n```python\ndata = {\n    \"apple\": 5,\n    \"banana\": 2,\n    \"orange\": 7,\n}\n\nvalues = sorted(data.values())\n\nprint(values)\n```\n\nРезультат:\n\n```python\n[2, 5, 7]\n```\n\nНо здесь теряется связь с ключами.\n\n### 7. Сортировка пар `(key, value)`\n\n```python\ndata = {\n    \"b\": 2,\n    \"c\": 3,\n    \"a\": 1,\n}\n\nitems = sorted(data.items())\n\nprint(items)\n```\n\nРезультат:\n\n```python\n[('a', 1), ('b', 2), ('c', 3)]\n```\n\nЭто удобно, когда нужен не новый `dict`, а просто отсортированный список пар.\n\n### 8. Сортировка по нескольким условиям\n\nНапример, сначала по значению, потом по ключу:\n\n```python\ndata = {\n    \"banana\": 2,\n    \"apple\": 2,\n    \"orange\": 7,\n}\n\nsorted_data = dict(\n    sorted(data.items(), key=lambda item: (item[1], item[0]))\n)\n\nprint(sorted_data)\n```\n\nРезультат:\n\n```python\n{'apple': 2, 'banana': 2, 'orange': 7}\n```\n\nЗдесь ключ сортировки:\n\n```python\n(item[1], item[0])\n```\n\nозначает:\n\n```text\n1. сначала сортировать по значению\n2. если значения равны — сортировать по ключу\n```\n\n`sorted()` в Python является стабильной сортировкой: элементы с равными ключами сортировки сохраняют относительный порядок. Это важно при многоэтапной сортировке. \n\n### 9. Сортировка словаря со сложными значениями\n\nНапример, значения — это вложенные словари:\n\n```python\nusers = {\n    \"user_1\": {\"name\": \"Alex\", \"age\": 25},\n    \"user_2\": {\"name\": \"Bob\", \"age\": 19},\n    \"user_3\": {\"name\": \"John\", \"age\": 30},\n}\n\nsorted_users = dict(\n    sorted(users.items(), key=lambda item: item[1][\"age\"])\n)\n\nprint(sorted_users)\n```\n\nРезультат:\n\n```python\n{\n    'user_2': {'name': 'Bob', 'age': 19},\n    'user_1': {'name': 'Alex', 'age': 25},\n    'user_3': {'name': 'John', 'age': 30}\n}\n```\n\nЗдесь:\n\n```python\nitem[1][\"age\"]\n```\n\nозначает:\n\n```text\nвзять значение словаря и отсортировать по полю age\n```\n\n### 10. Через `operator.itemgetter`\n\nВместо `lambda` можно использовать `itemgetter`:\n\n```python\nfrom operator import itemgetter\n\ndata = {\n    \"apple\": 5,\n    \"banana\": 2,\n    \"orange\": 7,\n}\n\nsorted_data = dict(sorted(data.items(), key=itemgetter(1)))\n\nprint(sorted_data)\n```\n\nРезультат:\n\n```python\n{'banana': 2, 'apple': 5, 'orange': 7}\n```\n\nЭто то же самое, что:\n\n```python\nkey=lambda item: item[1]\n```\n\n### Важный момент\n\nКогда пишем:\n\n```python\nsorted_data = dict(sorted(data.items()))\n```\n\nмы не сортируем старый словарь на месте.\n\nМы создаём новый словарь:\n\n```text\nстарый dict\n↓\ndata.items()\n↓\nsorted list of pairs\n↓\nnew dict\n```\n\nУ `dict` нет метода:\n\n```python\ndata.sort()\n```\n\nТакой код даст ошибку:\n\n```python\nAttributeError: 'dict' object has no attribute 'sort'\n```\n\n### Сложность\n\nОбычно сортировка элементов словаря стоит:\n\n```text\nO(n log n)\n```\n\nгде `n` — количество пар в словаре.\n\nПричина: `sorted()` строит новый отсортированный список из элементов. Документация Python указывает, что `sorted()` возвращает новый список, а не изменяет исходный объект. \n\n### Итоговая шпаргалка\n\n```python\n# По ключам\ndict(sorted(data.items()))\n\n# По ключам в обратном порядке\ndict(sorted(data.items(), reverse=True))\n\n# По значениям\ndict(sorted(data.items(), key=lambda item: item[1]))\n\n# По значениям в обратном порядке\ndict(sorted(data.items(), key=lambda item: item[1], reverse=True))\n\n# Только ключи\nsorted(data)\n\n# Только значения\nsorted(data.values())\n\n# Только пары\nsorted(data.items())\n\n# По нескольким условиям\ndict(sorted(data.items(), key=lambda item: (item[1], item[0])))\n```\n\nГлавное правило:\n\n```text\ndict не сортируется на месте.\nОбычно сортируют data.items(), а затем создают новый dict.\n```"
