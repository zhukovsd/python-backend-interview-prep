  id = 29
  question = "Что такое и как работаюь срезы (slicing)"
  answer = "### Что такое slicing\n\n**Срезы** в Python — это способ получить часть последовательности по диапазону индексов.\n\nСинтаксис:\n\n```python\nsequence[start:stop:step]\n```\n\nГде:\n\n```text\nstart -> откуда начать\nstop  -> где остановиться, не включая этот индекс\nstep  -> с каким шагом идти\n```\n\nОфициальная документация описывает slicing как форму обращения к последовательности, где внутри квадратных скобок используются выражения, разделённые двоеточиями. \n\n### Базовый пример\n\n```python\nlst = [10, 20, 30, 40, 50]\n\nprint(lst[1:4])\n```\n\nРезультат:\n\n```python\n[20, 30, 40]\n```\n\nПочему так:\n\n```text\nиндексы:  0   1   2   3   4\nсписок:  10  20  30  40  50\n\nlst[1:4] берёт элементы с индекса 1 до индекса 4, но 4 не включается.\n```\n\nТо есть:\n\n```text\nберём: 20, 30, 40\nне берём: 50\n```\n\n### Почему `stop` не включается\n\nВ Python правая граница среза не входит в результат:\n\n```python\nlst = [10, 20, 30, 40, 50]\n\nprint(lst[0:3])\n```\n\nРезультат:\n\n```python\n[10, 20, 30]\n```\n\nТо есть:\n\n```text\nlst[0:3] -> индексы 0, 1, 2\n```\n\nЭто удобно, потому что длина среза легко считается так:\n\n```text\nstop - start\n```\n\nПример:\n\n```python\nlst[1:4]\n```\n\nДлина:\n\n```text\n4 - 1 = 3 элемента\n```\n\n### Можно опускать `start` и `stop`\n\nЕсли не указать `start`, Python начинает с начала:\n\n```python\nlst = [10, 20, 30, 40, 50]\n\nprint(lst[:3])\n```\n\nРезультат:\n\n```python\n[10, 20, 30]\n```\n\nЕсли не указать `stop`, Python идёт до конца:\n\n```python\nprint(lst[2:])\n```\n\nРезультат:\n\n```python\n[30, 40, 50]\n```\n\nЕсли не указать оба:\n\n```python\nprint(lst[:])\n```\n\nРезультат:\n\n```python\n[10, 20, 30, 40, 50]\n```\n\nДля `list` это создаёт **новый список**, то есть поверхностную копию.\n\n### Шаг среза `step`\n\nТретий параметр отвечает за шаг:\n\n```python\nlst = [10, 20, 30, 40, 50, 60]\n\nprint(lst[0:6:2])\n```\n\nРезультат:\n\n```python\n[10, 30, 50]\n```\n\nТо есть Python берёт каждый второй элемент:\n\n```text\nиндексы: 0, 2, 4\n```\n\nМожно писать короче:\n\n```python\nprint(lst[::2])\n```\n\nРезультат:\n\n```python\n[10, 30, 50]\n```\n\n### Отрицательные индексы\n\nСрезы поддерживают отрицательные индексы.\n\n```python\nlst = [10, 20, 30, 40, 50]\n\nprint(lst[-3:])\n```\n\nРезультат:\n\n```python\n[30, 40, 50]\n```\n\nОбъяснение:\n\n```text\nlst[-1] -> последний элемент\nlst[-2] -> предпоследний\nlst[-3] -> третий с конца\n```\n\nТо есть:\n\n```python\nlst[-3:]\n```\n\nозначает:\n\n```text\nвзять последние 3 элемента\n```\n\n### Разворот списка через срез\n\nЧастый приём:\n\n```python\nlst = [1, 2, 3, 4, 5]\n\nprint(lst[::-1])\n```\n\nРезультат:\n\n```python\n[5, 4, 3, 2, 1]\n```\n\nЗдесь:\n\n```text\nstart не указан -> начать с конца, потому что step отрицательный\nstop не указан  -> идти до начала\nstep = -1       -> двигаться назад\n```\n\n### Примеры популярных срезов\n\n```python\nlst = [10, 20, 30, 40, 50]\n```\n\n```python\nlst[:3]\n```\n\n```text\nпервые 3 элемента\n```\n\n```python\nlst[3:]\n```\n\n```text\nвсё, начиная с индекса 3\n```\n\n```python\nlst[-2:]\n```\n\n```text\nпоследние 2 элемента\n```\n\n```python\nlst[:-1]\n```\n\n```text\nвсё, кроме последнего элемента\n```\n\n```python\nlst[::2]\n```\n\n```text\nкаждый второй элемент\n```\n\n```python\nlst[::-1]\n```\n\n```text\nсписок в обратном порядке\n```\n\n### Срез создаёт новый список\n\nДля `list` срез возвращает новый список:\n\n```python\nlst = [1, 2, 3, 4]\n\npart = lst[1:3]\n\nprint(part)        # [2, 3]\nprint(part is lst) # False\n```\n\nТо есть:\n\n```python\npart = lst[1:3]\n```\n\nне является “видом” на старый список. Это новый объект.\n\nНо копия поверхностная:\n\n```python\nlst = [[1], [2], [3]]\n\npart = lst[:2]\n\npart[0].append(99)\n\nprint(lst)\nprint(part)\n```\n\nРезультат:\n\n```python\n[[1, 99], [2], [3]]\n[[1, 99], [2]]\n```\n\nВнешний список новый, но вложенные объекты те же самые.\n\n### Срезы можно использовать для изменения списка\n\nТак как `list` — изменяемый объект, через срез можно заменить часть списка:\n\n```python\nlst = [1, 2, 3, 4, 5]\n\nlst[1:4] = [20, 30]\n\nprint(lst)\n```\n\nРезультат:\n\n```python\n[1, 20, 30, 5]\n```\n\nЗдесь элементы:\n\n```text\n2, 3, 4\n```\n\nзаменились на:\n\n```text\n20, 30\n```\n\nЧерез срез можно удалить часть списка:\n\n```python\nlst = [1, 2, 3, 4, 5]\n\ndel lst[1:4]\n\nprint(lst)\n```\n\nРезультат:\n\n```python\n[1, 5]\n```\n\nВ документации Python отдельно описано присваивание в slicing: целевой объект должен быть изменяемой последовательностью, например списком, а присваиваемый объект — итерируемым. \n\n### Срезы работают не только со списками\n\nСрезы поддерживают разные последовательности:\n\n```python\ns = \"abcdef\"\n\nprint(s[1:4])\n```\n\nРезультат:\n\n```python\n\"bcd\"\n```\n\nС кортежами:\n\n```python\nt = (10, 20, 30, 40)\n\nprint(t[1:3])\n```\n\nРезультат:\n\n```python\n(20, 30)\n```\n\nДокументация Python относит списки и строки к sequence types и указывает, что они поддерживают индексирование и slicing. \n\n### Сложность срезов\n\nДля списка срез обычно имеет сложность:\n\n```text\nO(k)\n```\n\nгде `k` — количество элементов в результате.\n\nНапример:\n\n```python\nlst[100:200]\n```\n\nсоздаёт новый список из `100` элементов, значит работа зависит от размера среза.\n\n```python\nlst[:]\n```\n\nкопирует весь список, значит:\n\n```text\nO(n)\n```\n\n### Итог\n\n```python\nlst[start:stop:step]\n```\n\nозначает:\n\n```text\nвзять элементы от start до stop, не включая stop, с шагом step\n```\n\nГлавные правила:\n\n```text\nlst[1:4]   -> элементы с индекса 1 до 4, но 4 не включается\nlst[:3]    -> первые 3 элемента\nlst[3:]    -> от индекса 3 до конца\nlst[-2:]   -> последние 2 элемента\nlst[::2]   -> каждый второй элемент\nlst[::-1]  -> развернуть последовательность\nlst[:]     -> поверхностная копия списка\n```\n\nГлавное помнить: для `list` срез **создаёт новый список**, а не просто даёт ссылку на часть старого списка."
