  id = 27
  question = "Какие основные методы есть у структуры list в Python?"
  answer = "### Основные методы `list`\n\nУ `list` есть набор встроенных методов для добавления, удаления, поиска, сортировки и копирования элементов. Официальная документация Python перечисляет методы `append`, `extend`, `insert`, `remove`, `pop`, `clear`, `index`, `count`, `sort`, `reverse`, `copy`. \n\n### Добавление элементов\n\n```python\nlst.append(x)\n```\n\nДобавляет один элемент в конец списка:\n\n```python\nlst = [1, 2, 3]\nlst.append(4)\n\nprint(lst)  # [1, 2, 3, 4]\n```\n\n```python\nlst.extend(iterable)\n```\n\nДобавляет в список все элементы из другого итерируемого объекта:\n\n```python\nlst = [1, 2]\nlst.extend([3, 4])\n\nprint(lst)  # [1, 2, 3, 4]\n```\n\n```python\nlst.insert(index, x)\n```\n\nВставляет элемент по индексу:\n\n```python\nlst = [1, 3, 4]\nlst.insert(1, 2)\n\nprint(lst)  # [1, 2, 3, 4]\n```\n\n### Удаление элементов\n\n```python\nlst.remove(x)\n```\n\nУдаляет первое найденное значение `x`:\n\n```python\nlst = [1, 2, 2, 3]\nlst.remove(2)\n\nprint(lst)  # [1, 2, 3]\n```\n\nЕсли элемента нет, будет ошибка:\n\n```python\nValueError\n```\n\n```python\nlst.pop(index)\n```\n\nУдаляет элемент по индексу и возвращает его:\n\n```python\nlst = [10, 20, 30]\n\nvalue = lst.pop(1)\n\nprint(value)  # 20\nprint(lst)    # [10, 30]\n```\n\nЕсли индекс не передать, удаляется последний элемент:\n\n```python\nlst = [10, 20, 30]\n\nvalue = lst.pop()\n\nprint(value)  # 30\nprint(lst)    # [10, 20]\n```\n\n```python\nlst.clear()\n```\n\nПолностью очищает список:\n\n```python\nlst = [1, 2, 3]\nlst.clear()\n\nprint(lst)  # []\n```\n\n### Поиск и подсчёт\n\n```python\nlst.index(x)\n```\n\nВозвращает индекс первого найденного элемента:\n\n```python\nlst = [\"a\", \"b\", \"c\"]\n\nprint(lst.index(\"b\"))  # 1\n```\n\nЕсли элемента нет, будет ошибка:\n\n```python\nValueError\n```\n\nМожно указать границы поиска:\n\n```python\nlst.index(x, start, stop)\n```\n\n```python\nlst = [10, 20, 30, 20]\n\nprint(lst.index(20, 2))  # 3\n```\n\n```python\nlst.count(x)\n```\n\nСчитает количество вхождений элемента:\n\n```python\nlst = [1, 2, 2, 3, 2]\n\nprint(lst.count(2))  # 3\n```\n\n### Изменение порядка\n\n```python\nlst.sort()\n```\n\nСортирует список на месте:\n\n```python\nlst = [3, 1, 2]\nlst.sort()\n\nprint(lst)  # [1, 2, 3]\n```\n\nСортировка по убыванию:\n\n```python\nlst = [3, 1, 2]\nlst.sort(reverse=True)\n\nprint(lst)  # [3, 2, 1]\n```\n\nСортировка с ключом:\n\n```python\nwords = [\"aaa\", \"b\", \"cc\"]\nwords.sort(key=len)\n\nprint(words)  # ['b', 'cc', 'aaa']\n```\n\n```python\nlst.reverse()\n```\n\nРазворачивает список на месте:\n\n```python\nlst = [1, 2, 3]\nlst.reverse()\n\nprint(lst)  # [3, 2, 1]\n```\n\n### Копирование\n\n```python\nlst.copy()\n```\n\nСоздаёт поверхностную копию списка:\n\n```python\nlst = [1, 2, 3]\nnew_lst = lst.copy()\n\nprint(new_lst)  # [1, 2, 3]\nprint(lst is new_lst)  # False\n```\n\nВажно: `copy()` делает именно **поверхностную копию**.\n\n```python\nlst = [[1, 2], [3, 4]]\nnew_lst = lst.copy()\n\nnew_lst[0].append(99)\n\nprint(lst)      # [[1, 2, 99], [3, 4]]\nprint(new_lst)  # [[1, 2, 99], [3, 4]]\n```\n\nВнешний список новый, но вложенные списки остались теми же объектами.\n\n### Методы, которые меняют список на месте\n\nЭти методы изменяют сам список и обычно возвращают `None`:\n\n```python\nappend()\nextend()\ninsert()\nremove()\nclear()\nsort()\nreverse()\n```\n\nПример:\n\n```python\nlst = [3, 1, 2]\n\nresult = lst.sort()\n\nprint(lst)     # [1, 2, 3]\nprint(result)  # None\n```\n\nЭто сделано специально: методы, изменяющие список на месте, не создают новый список. В документации Python это отдельно подчёркивается для методов вроде `insert`, `remove`, `sort`: они возвращают `None`, потому что изменяют объект на месте. \n\n### Итоговая таблица\n\n|Метод|Что делает|\n|---|---|\n|`append(x)`|Добавляет `x` в конец|\n|`extend(iterable)`|Добавляет элементы из iterable|\n|`insert(i, x)`|Вставляет `x` по индексу `i`|\n|`remove(x)`|Удаляет первое значение `x`|\n|`pop([i])`|Удаляет и возвращает элемент|\n|`clear()`|Очищает список|\n|`index(x)`|Возвращает индекс первого `x`|\n|`count(x)`|Считает количество `x`|\n|`sort()`|Сортирует список на месте|\n|`reverse()`|Разворачивает список на месте|\n|`copy()`|Создаёт поверхностную копию|\n\n### Короткая шпаргалка\n\n```text\nДобавить один элемент     -> append()\nДобавить много элементов  -> extend()\nВставить по индексу       -> insert()\nУдалить по значению       -> remove()\nУдалить по индексу        -> pop()\nОчистить список           -> clear()\nНайти индекс              -> index()\nПосчитать элементы        -> count()\nОтсортировать             -> sort()\nРазвернуть                -> reverse()\nСкопировать               -> copy()\n```"
  popularity = 2.63

