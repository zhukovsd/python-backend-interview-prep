  id = 7
  question = "Чем отличается списки от словаря? (list vs dict)"
  answer = "### Главное отличие\n\n`list` — это упорядоченная коллекция значений.\n\n`dict` — это коллекция пар `ключ: значение`.\n\nОфициальная документация Python относит `list` к последовательностям, а `dict` — к отображениям, то есть структурам, где значения ищутся по ключу. ([Python documentation](https://docs.python.org/3/library/stdtypes.html?utm_source=chatgpt.com \"Built-in Types — Python 3.14.5 documentation\"))\n\n### Пример `list`\n\n```python\nusers = [\"Alice\", \"Bob\", \"John\"]\n\nprint(users[0])  # Alice\nprint(users[1])  # Bob\n```\n\nУ списка элементы лежат по индексам:\n\n```text\nindex:   0        1       2\nvalue: \"Alice\"  \"Bob\"  \"John\"\n```\n\nТо есть доступ идёт по номеру позиции.\n\n### Пример `dict`\n\n```python\nuser = {\n    \"name\": \"Alice\",\n    \"age\": 20,\n    \"city\": \"Baku\"\n}\n\nprint(user[\"name\"])  # Alice\nprint(user[\"age\"])   # 20\n```\n\nУ словаря данные лежат по ключам:\n\n```text\nkey      -> value\n\"name\"   -> \"Alice\"\n\"age\"    -> 20\n\"city\"   -> \"Baku\"\n```\n\nТо есть доступ идёт не по позиции, а по имени ключа. В документации Python словари описываются как структуры, индексируемые ключами, а не диапазоном чисел, как последовательности. \n\n### Сравнение\n\n|Критерий|`list`|`dict`|\n|---|---|---|\n|Что хранит|Просто значения|Пары `ключ: значение`|\n|Доступ|По индексу|По ключу|\n|Синтаксис|`[]`|`{}`|\n|Порядок|Есть порядок элементов|Сохраняет порядок вставки|\n|Поиск значения|Обычно нужно перебирать элементы|Быстрый доступ по ключу|\n|Пример|`[\"A\", \"B\", \"C\"]`|`{\"name\": \"A\", \"age\": 20}`|\n\n### Когда использовать `list`\n\nИспользуй `list`, когда важен порядок и данные однотипные:\n\n```python\nnumbers = [10, 20, 30, 40]\nproducts = [\"milk\", \"bread\", \"cheese\"]\n```\n\nНапример:\n\n```python\nfor product in products:\n    print(product)\n```\n\n`list` хорошо подходит для:\n\n```text\nсписка товаров\nсписка пользователей\nсписка чисел\nочереди элементов\nнабора однотипных объектов\n```\n\n### Когда использовать `dict`\n\nИспользуй `dict`, когда нужно хранить данные с понятными именами:\n\n```python\nuser = {\n    \"id\": 1,\n    \"username\": \"alfob\",\n    \"email\": \"test@example.com\"\n}\n```\n\nНапример:\n\n```python\nprint(user[\"username\"])\n```\n\n`dict` хорошо подходит для:\n\n```text\nданных пользователя\nнастроек приложения\nJSON-структур\nответов API\nкэша\nбыстрого поиска по id/name/key\n```\n\n### Важное отличие по скорости\n\nУ списка доступ по индексу быстрый:\n\n```python\nitems[0]\n```\n\nНо поиск конкретного значения обычно требует прохода по элементам:\n\n```python\n\"name\" in users\n```\n\nУ словаря доступ по ключу в среднем быстрый:\n\n```python\nuser[\"name\"]\n```\n\nPython Wiki указывает, что для `dict` получение элемента, установка элемента и проверка ключа в среднем работают за `O(1)`, если хеш-функция распределяет ключи нормально. \n\n### Пример разницы на практике\n\nПлохо через `list`:\n\n```python\nusers = [\n    [\"Alice\", 20],\n    [\"Bob\", 25],\n    [\"John\", 30]\n]\n\nprint(users[0][0])  # Alice\n```\n\nРаботает, но плохо читается: непонятно, что значит `[0][0]`.\n\nЛучше через `dict`:\n\n```python\nuser = {\n    \"name\": \"Alice\",\n    \"age\": 20\n}\n\nprint(user[\"name\"])  # Alice\n```\n\nТак код читается понятнее.\n\n### Можно комбинировать\n\nЧасто используют `list` из `dict`:\n\n```python\nusers = [\n    {\"id\": 1, \"name\": \"Alice\"},\n    {\"id\": 2, \"name\": \"Bob\"},\n    {\"id\": 3, \"name\": \"John\"},\n]\n```\n\nЭто означает:\n\n```text\nсписок пользователей,\nгде каждый пользователь описан словарём\n```\n\nТак обычно выглядят данные из API или базы данных.\n\n### Коротко\n\n```python\nlist = когда важен порядок\ndict = когда важны имена/ключи\n```\n\nПример:\n\n```python\n# list\nskills = [\"Python\", \"Django\", \"FastAPI\"]\n\n# dict\nuser = {\n    \"name\": \"Alfob\",\n    \"skills\": [\"Python\", \"Django\", \"FastAPI\"]\n}\n```\n\n`list` отвечает на вопрос:\n\n```text\nКакие элементы идут друг за другом?\n```\n\n`dict` отвечает на вопрос:\n\n```text\nКакое значение лежит по этому ключу?\n```"
  popularity = 2.63

