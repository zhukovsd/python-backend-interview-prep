  question = "Как переключиться на конкретный коммит в Git?"
  answer = "### Переключение на конкретный коммит\n\nСначала найдите hash нужного коммита:\n\n```bash\ngit log --oneline\n```\n\nПример:\n\n```text\na1b2c3d Fix payment validation\ne4f5a6b Add payment endpoint\n7c8d9e0 Initial commit\n```\n\nЗатем переключитесь на нужный коммит:\n\n```bash\ngit switch --detach a1b2c3d\n```\n\nПосле этого рабочие файлы будут приведены к состоянию проекта на момент коммита `a1b2c3d`. Git перейдёт в состояние **detached HEAD**, то есть `HEAD` будет указывать непосредственно на коммит, а не на ветку. \n\n### Старый вариант через `checkout`\n\nТа же операция через более старую команду:\n\n```bash\ngit checkout a1b2c3d\n```\n\nДля явного указания detached-режима:\n\n```bash\ngit checkout --detach a1b2c3d\n```\n\n`git checkout` по-прежнему поддерживается, но для переключения между ветками и коммитами обычно понятнее использовать `git switch`. \n\n### Что означает detached HEAD\n\nОбычно `HEAD` указывает на текущую ветку:\n\n```text\nHEAD → main → C\n```\n\nПри переключении на конкретный коммит:\n\n```text\nmain → C\n        \\\n         D---E\n\nHEAD → D\n```\n\nВы находитесь на коммите `D`, но не в ветке.\n\nВ таком состоянии можно:\n\n- просматривать старую версию проекта;\n    \n- запускать и тестировать код;\n    \n- изменять файлы;\n    \n- создавать коммиты.\n    \n\nОднако новые коммиты не будут принадлежать именованной ветке. При последующем переключении их можно потерять из обычного отображения истории, если не создать ветку.\n\n### Создать ветку от выбранного коммита\n\nКогда нужно не просто посмотреть коммит, а начать от него работу:\n\n```bash\ngit switch -c fix-old-version a1b2c3d\n```\n\nРезультат:\n\n```text\na1b2c3d ← fix-old-version ← HEAD\n```\n\nТеперь все новые коммиты будут добавляться в ветку `fix-old-version`. \n\nАналог через `checkout`:\n\n```bash\ngit checkout -b fix-old-version a1b2c3d\n```\n\n### Если уже находитесь в detached HEAD\n\nДопустим, вы переключились на старый коммит:\n\n```bash\ngit switch --detach a1b2c3d\n```\n\nЗатем внесли изменения и создали новый коммит:\n\n```bash\ngit add .\ngit commit -m \"Fix old version\"\n```\n\nЧтобы сохранить этот коммит в ветке:\n\n```bash\ngit switch -c fix-old-version\n```\n\nНовая ветка будет создана от текущего положения `HEAD`.\n\n### Как вернуться обратно\n\nВернуться на `main`:\n\n```bash\ngit switch main\n```\n\nИли на предыдущую ветку:\n\n```bash\ngit switch -\n```\n\nЧерез `checkout`:\n\n```bash\ngit checkout main\n```\n\n### Переключение относительно текущего коммита\n\nНа предыдущий коммит:\n\n```bash\ngit switch --detach HEAD~1\n```\n\nНа три коммита назад:\n\n```bash\ngit switch --detach HEAD~3\n```\n\nОфициальная документация Git также использует `git switch --detach HEAD~3` как пример временного перехода на старый коммит. \n\n### Важное отличие от `git reset`\n\n```bash\ngit switch --detach a1b2c3d\n```\n\nПросто показывает состояние выбранного коммита и не передвигает существующие ветки.\n\n```bash\ngit reset --hard a1b2c3d\n```\n\nПередвигает текущую ветку на выбранный коммит и может удалить изменения из рабочей директории.\n\nПоэтому для просмотра старой версии используйте:\n\n```bash\ngit switch --detach <commit>\n```\n\nА для продолжения работы от старого коммита:\n\n```bash\ngit switch -c <new-branch> <commit>\n```"
