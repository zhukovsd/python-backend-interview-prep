  question = "В чем разница между Git fetch и Git pull?"
  answer = "### Главное отличие\n\n`git fetch` только загружает новые данные из удалённого репозитория.\n\n`git pull` загружает данные и сразу пытается применить их к текущей локальной ветке.\n\n```text\ngit fetch = получить изменения\n\ngit pull = получить изменения + объединить их\n```\n\n### Что делает `git fetch`\n\n```bash\ngit fetch origin\n```\n\nGit загружает:\n\n- новые коммиты;\n    \n- новые ветки;\n    \n- новые теги;\n    \n- информацию об удалённых ветках.\n    \n\nНо текущая локальная ветка и файлы проекта не изменяются.\n\nНапример, было:\n\n```text\norigin/main: A---B---C\nmain:        A---B\n```\n\nПосле:\n\n```bash\ngit fetch origin\n```\n\nПолучится:\n\n```text\norigin/main: A---B---C\nmain:        A---B\n```\n\nGit обновил указатель `origin/main`, но локальная ветка `main` осталась на коммите `B`.\n\nПосмотреть полученные изменения можно так:\n\n```bash\ngit log main..origin/main\n```\n\nИли:\n\n```bash\ngit diff main origin/main\n```\n\nПосле проверки изменения можно объединить вручную:\n\n```bash\ngit merge origin/main\n```\n\nЛибо перенести свои коммиты поверх удалённой ветки:\n\n```bash\ngit rebase origin/main\n```\n\n### Что делает `git pull`\n\n```bash\ngit pull origin main\n```\n\nПо умолчанию это примерно соответствует двум командам:\n\n```bash\ngit fetch origin\ngit merge origin/main\n```\n\nТо есть Git:\n\n1. Загружает изменения.\n    \n2. Сразу объединяет их с текущей веткой.\n    \n\nБыло:\n\n```text\norigin/main: A---B---C\nmain:        A---B\n```\n\nПосле:\n\n```bash\ngit pull\n```\n\nРезультат:\n\n```text\norigin/main: A---B---C\nmain:        A---B---C\n```\n\nЕсли локальная и удалённая ветки развивались параллельно:\n\n```text\n             D  main\n            /\nA---B---C\n        \\\n         E  origin/main\n```\n\nПри обычном `git pull` Git может создать merge-коммит:\n\n```text\n             D---M  main\n            /   /\nA---B---C---E\n```\n\n### `git pull --rebase`\n\nВместо merge можно использовать rebase:\n\n```bash\ngit pull --rebase\n```\n\nЭто примерно соответствует:\n\n```bash\ngit fetch\ngit rebase origin/main\n```\n\nРезультат будет линейным:\n\n```text\nA---B---C---E---D'\n```\n\nЛокальный коммит `D` будет создан заново поверх актуального `origin/main`.\n\n### Сравнение\n\n|Критерий|`git fetch`|`git pull`|\n|---|---|---|\n|Загружает удалённые изменения|Да|Да|\n|Изменяет текущую локальную ветку|Нет|Да|\n|Изменяет рабочие файлы|Нет|Может|\n|Может вызвать конфликты|Обычно нет|Да|\n|Позволяет сначала проверить изменения|Да|Нет, сразу объединяет|\n|Безопасность|Более безопасен|Требует большей осторожности|\n\n### Что такое `origin/main`\n\n`origin/main` — локальное представление состояния удалённой ветки `main`.\n\nЭто не сама удалённая ветка, а указатель, который Git обновляет после:\n\n```bash\ngit fetch\n```\n\nили:\n\n```bash\ngit pull\n```\n\nПример:\n\n```text\nmain         — ваша локальная ветка\norigin/main  — последнее известное состояние удалённой ветки\n```\n\n### Когда использовать `git fetch`\n\n`git fetch` предпочтителен, когда нужно:\n\n- проверить чужие изменения перед объединением;\n    \n- посмотреть новые коммиты;\n    \n- сравнить локальную и удалённую ветки;\n    \n- избежать неожиданного изменения файлов;\n    \n- самостоятельно выбрать между `merge` и `rebase`.\n    \n\nТипичный вариант:\n\n```bash\ngit fetch origin\ngit log main..origin/main\ngit diff main origin/main\ngit merge origin/main\n```\n\n### Когда использовать `git pull`\n\n`git pull` удобен, когда:\n\n- нужно быстро обновить локальную ветку;\n    \n- локальных изменений нет;\n    \n- вы понимаете, каким способом Git объединит историю;\n    \n- вероятность конфликтов небольшая.\n    \n\nНапример:\n\n```bash\ngit switch main\ngit pull\n```\n\n### Важный момент с незакоммиченными изменениями\n\nЕсли в рабочей директории есть незакоммиченные изменения, `git fetch` обычно безопасен:\n\n```bash\ngit fetch\n```\n\nОн не меняет файлы проекта.\n\nА `git pull` может завершиться ошибкой или привести к конфликтам, поскольку пытается изменить текущую ветку и рабочие файлы.\n\nПеред `pull` желательно проверить состояние:\n\n```bash\ngit status\n```\n\nЗатем либо создать коммит:\n\n```bash\ngit add .\ngit commit -m \"Save current work\"\n```\n\nЛибо временно убрать изменения:\n\n```bash\ngit stash\ngit pull\ngit stash pop\n```\n\n### Практическое правило\n\n```text\nНужно только узнать, что изменилось:\ngit fetch\n\nНужно сразу обновить текущую ветку:\ngit pull\n\nНужно обновить ветку с линейной историей:\ngit pull --rebase\n```\n\nДля более контролируемой работы обычно используют:\n\n```bash\ngit fetch\ngit rebase origin/main\n```\n\nили:\n\n```bash\ngit fetch\ngit merge origin/main\n```\n\nТак разработчик сначала получает изменения, а затем самостоятельно решает, как их применить."
  popularity = 5.26

[[questions]]
  id = 5
  question = "Как отменить коммит в Git?"
  answer = "### Способ зависит от ситуации\r\n\r\nВ Git под «отменить коммит» могут подразумеваться разные действия:\r\n\r\n* удалить последний коммит, сохранив изменения;\r\n* удалить коммит вместе с изменениями;\r\n* безопасно отменить уже опубликованный коммит;\r\n* исправить последний коммит.\r\n\r\n### 1. Коммит ещё не отправлен: сохранить изменения\r\n\r\nУдалить последний коммит, но оставить изменения подготовленными в индексе:\r\n\r\n```bash\r\ngit reset --soft HEAD~1\r\n```\r\n\r\nБыло:\r\n\r\n```text\r\nA---B---C  HEAD\r\n```\r\n\r\nСтанет:\r\n\r\n```text\r\nA---B  HEAD\r\n```\r\n\r\nПри этом изменения из `C` останутся в состоянии `staged`, как после `git add`.\r\n\r\nПодходит, когда нужно заново сформировать коммит:\r\n\r\n```bash\r\ngit reset --soft HEAD~1\r\ngit commit -m \"Новое сообщение\"\r\n```\r\n\r\n### 2. Удалить коммит, оставить изменения без `git add`\r\n\r\n```bash\r\ngit reset HEAD~1\r\n```\r\n\r\nЭто аналог:\r\n\r\n```bash\r\ngit reset --mixed HEAD~1\r\n```\r\n\r\nПоследний коммит удалится, а изменения останутся в рабочих файлах, но будут убраны из индекса.\r\n\r\nПосле этого `git status` покажет их как незакоммиченные:\r\n\r\n```text\r\nChanges not staged for commit\r\n```\r\n\r\nЭто наиболее удобный вариант, когда нужно переделать изменения перед повторным коммитом.\r\n\r\n### 3. Удалить коммит вместе с изменениями\r\n\r\n```bash\r\ngit reset --hard HEAD~1\r\n```\r\n\r\nПоследний коммит удалится вместе со всеми его изменениями.\r\n\r\n```text\r\nA---B---C  HEAD\r\n          ↓ reset --hard HEAD~1\r\nA---B      HEAD\r\n```\r\n\r\nКоманда опасная:\r\n\r\n```bash\r\ngit reset --hard HEAD~1\r\n```\r\n\r\nОна удаляет незакоммиченные изменения из рабочих файлов. Перед выполнением нужно проверить:\r\n\r\n```bash\r\ngit status\r\n```\r\n\r\n### 4. Коммит уже отправлен в удалённый репозиторий\r\n\r\nЕсли коммит уже находится в общей ветке, лучше использовать:\r\n\r\n```bash\r\ngit revert <hash-коммита>\r\n```\r\n\r\nНапример:\r\n\r\n```bash\r\ngit revert a1b2c3d\r\n```\r\n\r\n`git revert` не удаляет старый коммит. Он создаёт новый коммит, который выполняет противоположные изменения.\r\n\r\nБыло:\r\n\r\n```text\r\nA---B---C\r\n```\r\n\r\nПосле отмены `C`:\r\n\r\n```text\r\nA---B---C---R\r\n```\r\n\r\nГде `R` отменяет изменения коммита `C`.\r\n\r\nЗатем:\r\n\r\n```bash\r\ngit push\r\n```\r\n\r\nЭто безопасный способ для `main`, `develop` и других общих веток, поскольку существующая история не переписывается.\r\n\r\n### `reset` и `revert`\r\n\r\n| Команда             | Что делает                                   | Переписывает историю | Для опубликованных коммитов |\r\n| ------------------- | -------------------------------------------- | -------------------: | --------------------------: |\r\n| `git reset --soft`  | Удаляет коммит, сохраняет staged-изменения   |                   Да |                  Обычно нет |\r\n| `git reset --mixed` | Удаляет коммит, сохраняет изменения в файлах |                   Да |                  Обычно нет |\r\n| `git reset --hard`  | Удаляет коммит и изменения                   |                   Да |                  Обычно нет |\r\n| `git revert`        | Создаёт новый отменяющий коммит              |                  Нет |                          Да |\r\n\r\nГлавное правило:\r\n\r\n```text\r\nКоммит только локальный → git reset\r\nКоммит уже опубликован  → git revert\r\n```\r\n\r\n### 5. Исправить последний коммит\r\n\r\nКогда удалять коммит не требуется, а нужно изменить его сообщение:\r\n\r\n```bash\r\ngit commit --amend -m \"Новое сообщение\"\r\n```\r\n\r\nДобавить забытый файл в последний коммит:\r\n\r\n```bash\r\ngit add forgotten_file.py\r\ngit commit --amend --no-edit\r\n```\r\n\r\n`--no-edit` оставляет прежнее сообщение коммита.\r\n\r\nПосле `--amend` hash коммита изменяется, поскольку Git создаёт новый коммит вместо старого.\r\n\r\n### 6. Отменить несколько последних коммитов\r\n\r\nСохранить изменения из трёх последних коммитов:\r\n\r\n```bash\r\ngit reset --soft HEAD~3\r\n```\r\n\r\nОставить изменения в рабочих файлах:\r\n\r\n```bash\r\ngit reset HEAD~3\r\n```\r\n\r\nУдалить три коммита вместе с изменениями:\r\n\r\n```bash\r\ngit reset --hard HEAD~3\r\n```\r\n\r\n### 7. Отменить не последний коммит\r\n\r\nДля опубликованной истории:\r\n\r\n```bash\r\ngit revert <hash>\r\n```\r\n\r\nНайти hash:\r\n\r\n```bash\r\ngit log --oneline\r\n```\r\n\r\nПример:\r\n\r\n```text\r\ne83c121 Add payment endpoint\r\na1b2c3d Add broken validation\r\n7c8d9e0 Add user model\r\n```\r\n\r\nОтменить средний коммит:\r\n\r\n```bash\r\ngit revert a1b2c3d\r\n```\r\n\r\nGit попытается отменить только изменения этого коммита. Если последующие коммиты зависят от него, могут возникнуть конфликты.\r\n\r\n### 8. Отменить merge-коммит\r\n\r\nДля merge-коммита нужно указать основного родителя:\r\n\r\n```bash\r\ngit revert -m 1 <hash-merge-коммита>\r\n```\r\n\r\nНапример:\r\n\r\n```bash\r\ngit revert -m 1 abc1234\r\n```\r\n\r\n`-m 1` означает, что первый родитель merge-коммита считается основной линией истории.\r\n\r\n### Если после `reset` нужно обновить удалённую ветку\r\n\r\nКогда коммит уже был отправлен, но ветка личная и историю допустимо переписать:\r\n\r\n```bash\r\ngit reset --hard HEAD~1\r\ngit push --force-with-lease\r\n```\r\n\r\nИспользовать следует именно:\r\n\r\n```bash\r\ngit push --force-with-lease\r\n```\r\n\r\nа не обычный `--force`, поскольку `--force-with-lease` не даст случайно перезаписать новые чужие коммиты.\r\n\r\nДля общей ветки такой подход обычно не применяется — используется `git revert`.\r\n\r\n### Как восстановить случайно удалённый коммит\r\n\r\nПосле `git reset` коммит часто можно найти через:\r\n\r\n```bash\r\ngit reflog\r\n```\r\n\r\nПример:\r\n\r\n```text\r\na1b2c3d HEAD@{0}: reset: moving to HEAD~1\r\ne4f5a6b HEAD@{1}: commit: Add payment validation\r\n```\r\n\r\nВосстановить состояние:\r\n\r\n```bash\r\ngit reset --hard e4f5a6b\r\n```\r\n\r\nЛибо создать отдельную ветку на потерянном коммите:\r\n\r\n```bash\r\ngit branch recovery e4f5a6b\r\n```\r\n\r\n### Практическая памятка\r\n\r\n```bash\r\n# Убрать последний коммит, оставить изменения staged\r\ngit reset --soft HEAD~1\r\n\r\n# Убрать последний коммит, оставить изменения в файлах\r\ngit reset HEAD~1\r\n\r\n# Удалить последний коммит и его изменения\r\ngit reset --hard HEAD~1\r\n\r\n# Безопасно отменить опубликованный коммит\r\ngit revert <commit-hash>\r\n\r\n# Исправить последний коммит\r\ngit commit --amend\r\n```\r"
  popularity = 2.63

[[questions]]
  id = 6
  question = "Как посмотреть историю коммитов в Git?"
  answer = "### Основная команда\n\nИстория коммитов текущей ветки выводится командой:\n\n```bash\ngit log\n```\n\nДля каждого коммита Git показывает hash, автора, дату и сообщение коммита. Выход из режима просмотра — клавиша `q`.\n\n### Краткая история\n\nЧаще всего удобнее использовать сокращённый формат:\n\n```bash\ngit log --oneline\n```\n\nПример:\n\n```text\na1b2c3d Fix payment validation\ne4f5a6b Add payment endpoint\n7c8d9e0 Create user model\n```\n\nКаждая строка содержит сокращённый hash и сообщение коммита.\n\n### История в виде графа\n\nДля просмотра веток и merge-коммитов:\n\n```bash\ngit log --oneline --graph --decorate --all\n```\n\nПараметры:\n\n```text\n--oneline    компактный формат\n--graph      графическое отображение ветвления\n--decorate   названия веток и тегов\n--all        история всех локально известных веток\n```\n\nПример:\n\n```text\n*   83ad931 (HEAD -> main) Merge branch 'feature'\n|\\\n| * c542adb Add validation\n| * 12fa901 Add endpoint\n|/\n* 711c420 Create project\n```\n\n### Последние несколько коммитов\n\nПоказать только последние пять коммитов:\n\n```bash\ngit log -5\n```\n\nИли в кратком формате:\n\n```bash\ngit log -5 --oneline\n```\n\nОпция `-<n>` ограничивает вывод последними `n` коммитами. \n\n### История конкретной ветки\n\n```bash\ngit log main\n```\n\nДля удалённой ветки после `git fetch`:\n\n```bash\ngit log origin/main\n```\n\nСравнить две ветки:\n\n```bash\ngit log main..feature\n```\n\nЭта команда покажет коммиты, которые есть в `feature`, но отсутствуют в `main`.\n\nОбратное сравнение:\n\n```bash\ngit log feature..main\n```\n\n### История конкретного файла\n\n```bash\ngit log -- path/to/file.py\n```\n\nНапример:\n\n```bash\ngit log -- app/services/payment.py\n```\n\nGit покажет коммиты, затрагивавшие указанный файл. Разделитель `--` отделяет параметры команды от пути. \n\nЧтобы одновременно увидеть изменения файла:\n\n```bash\ngit log -p -- app/services/payment.py\n```\n\n### Посмотреть изменения в коммитах\n\n```bash\ngit log -p\n```\n\nПараметр `-p` показывает diff каждого коммита.\n\nДля краткой статистики:\n\n```bash\ngit log --stat\n```\n\nПример:\n\n```text\napp/main.py       | 12 +++++++++---\napp/settings.py   |  4 ++++\n2 files changed, 13 insertions(+), 3 deletions(-)\n```\n\n### Найти коммиты конкретного автора\n\n```bash\ngit log --author=\"Иван\"\n```\n\nМожно использовать имя или часть адреса электронной почты:\n\n```bash\ngit log --author=\"ivan@example.com\"\n```\n\nФильтрация по автору поддерживается параметром `--author`. \n\n### Найти коммит по сообщению\n\n```bash\ngit log --grep=\"payment\"\n```\n\nКоманда покажет коммиты, в сообщениях которых встречается `payment`.\n\nПоиск без учёта регистра:\n\n```bash\ngit log --grep=\"payment\" -i\n```\n\n### История за определённый период\n\nКоммиты за последнюю неделю:\n\n```bash\ngit log --since=\"1 week ago\"\n```\n\nДо определённой даты:\n\n```bash\ngit log --until=\"2026-07-01\"\n```\n\nДиапазон дат:\n\n```bash\ngit log --since=\"2026-07-01\" --until=\"2026-07-27\"\n```\n\nДля ограничения истории используются параметры `--since`, `--after`, `--until` и `--before`. \n\n### Найти изменение конкретного текста\n\nНайти коммиты, которые добавили или удалили строку:\n\n```bash\ngit log -S \"function_name\"\n```\n\nНапример:\n\n```bash\ngit log -S \"validate_payment\"\n```\n\nОпция `-S` ищет коммиты, изменившие количество вхождений указанной строки. \n\nЧтобы сразу увидеть diff:\n\n```bash\ngit log -S \"validate_payment\" -p\n```\n\n### Посмотреть один конкретный коммит\n\n```bash\ngit show <commit-hash>\n```\n\nНапример:\n\n```bash\ngit show a1b2c3d\n```\n\nБудут показаны данные коммита и внесённые им изменения.\n\nТолько информация без diff:\n\n```bash\ngit show --stat a1b2c3d\n```\n\n### История перемещений `HEAD`\n\n`git log` показывает историю коммитов, а `git reflog` — локальную историю перемещений `HEAD`: `reset`, `rebase`, переключения веток и другие операции. Это полезно для поиска случайно потерянного коммита. ([Git](https://git-scm.com/docs/git-reflog.html?utm_source=chatgpt.com \"Git - git-reflog Documentation\"))\n\n```bash\ngit reflog\n```\n\nПример:\n\n```text\na1b2c3d HEAD@{0}: reset: moving to HEAD~1\ne4f5a6b HEAD@{1}: commit: Add validation\n```\n\n### Практический вариант\n\nДля повседневной работы наиболее информативна команда:\n\n```bash\ngit log --oneline --graph --decorate --all\n```\n\nДля истории одного файла:\n\n```bash\ngit log --oneline -- path/to/file.py\n```\n\nДля подробного просмотра последнего коммита:\n\n```bash\ngit show HEAD\n```"
  popularity = 2.63

