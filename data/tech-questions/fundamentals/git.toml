[[questions]]
  id = 1
  question = "Git. Для чего нужен Cherry Pick"
  answer = "### Что такое `git cherry-pick`\n\n`git cherry-pick` переносит **один или несколько конкретных коммитов** из другой ветки в текущую.\n\nПри этом Git не объединяет ветки целиком, как при `merge`, а берёт изменения выбранного коммита и создаёт на их основе **новый коммит с новым hash**.\n\n### Пример\n\nЕсть две ветки:\n\n```text\nmain:     A---B---C\n                  \\\nfeature:           D---E---F\n```\n\nДопустим, коммит `E` исправляет критическую ошибку, и его нужно перенести в `main`, но остальные изменения из `feature` пока не готовы.\n\n```bash\ngit switch main\ngit cherry-pick <hash-коммита-E>\n```\n\nРезультат:\n\n```text\nmain:     A---B---C---E'\n                  \\\nfeature:           D---E---F\n```\n\n`E'` содержит те же изменения, что и `E`, но это другой коммит с другим hash.\n\n### Для чего используется\n\nОсновные сценарии:\n\n1. **Перенос исправления ошибки**\n    \n    Ошибка исправлена в одной ветке, но исправление нужно также добавить в `main`, `develop` или релизную ветку.\n    \n2. **Перенос случайно созданного коммита**\n    \n    Коммит сделали не в той ветке:\n    \n\n```bash\ngit switch correct-branch\ngit cherry-pick <commit-hash>\n```\n\nПосле этого исходный коммит при необходимости удаляют из неправильной ветки.\n\n3. **Выборочное добавление функциональности**\n    \n    В ветке находится много коммитов, но нужен только один конкретный.\n    \n4. **Backport исправлений**\n    \n    Например, исправление из новой версии проекта переносится в старую поддерживаемую версию:\n    \n\n```text\nmain\nrelease/2.0\nrelease/1.0\n```\n\n### Как использовать\n\nСначала переходят в ветку, **куда** нужно перенести коммит:\n\n```bash\ngit switch main\n```\n\nЗатем выполняют:\n\n```bash\ngit cherry-pick a1b2c3d\n```\n\nГде `a1b2c3d` — hash нужного коммита.\n\nПосмотреть историю коммитов:\n\n```bash\ngit log --oneline\n```\n\nПример:\n\n```text\na1b2c3d Fix payment validation\ne4f5a6b Add payment endpoint\n```\n\n### Перенос нескольких коммитов\n\nПоследовательно указать hash:\n\n```bash\ngit cherry-pick a1b2c3d e4f5a6b 123abcd\n```\n\nGit применит их в указанном порядке.\n\nМожно перенести диапазон коммитов:\n\n```bash\ngit cherry-pick A..D\n```\n\nЭто перенесёт коммиты после `A` и до `D` включительно. Сам коммит `A` не войдёт.\n\nЧтобы включить также `A`:\n\n```bash\ngit cherry-pick A^..D\n```\n\n### Что делать при конфликте\n\nЕсли изменения конфликтуют, Cherry Pick остановится:\n\n```text\nCONFLICT (content): Merge conflict in file.py\n```\n\nНужно:\n\n1. Исправить конфликтующие файлы.\n    \n2. Добавить исправленные файлы:\n    \n\n```bash\ngit add .\n```\n\n3. Продолжить:\n    \n\n```bash\ngit cherry-pick --continue\n```\n\nОтменить весь процесс:\n\n```bash\ngit cherry-pick --abort\n```\n\nПропустить проблемный коммит:\n\n```bash\ngit cherry-pick --skip\n```\n\n### Полезные варианты\n\nПрименить изменения без автоматического создания коммита:\n\n```bash\ngit cherry-pick --no-commit <hash>\n```\n\nИли сокращённо:\n\n```bash\ngit cherry-pick -n <hash>\n```\n\nЭто полезно, когда нужно применить несколько коммитов, немного изменить результат и создать один общий коммит:\n\n```bash\ngit cherry-pick -n commit1 commit2\ngit commit -m \"Apply selected fixes\"\n```\n\n### Отличие от `merge`\n\n`merge` объединяет историю двух веток:\n\n```bash\ngit merge feature\n```\n\n`cherry-pick` переносит только выбранные коммиты:\n\n```bash\ngit cherry-pick <hash>\n```\n\nПример:\n\n```text\nВ feature находится 10 коммитов.\n\nmerge:\nперенесёт всю ветку.\n\ncherry-pick:\nможет перенести только 1 нужный коммит.\n```\n\n### Отличие от `rebase`\n\n`rebase` обычно переносит последовательность коммитов одной ветки на новую базу и переписывает историю ветки.\n\n`cherry-pick` берёт конкретно выбранные коммиты и применяет их к текущей ветке.\n\n### Главный недостаток\n\nCherry Pick создаёт копию коммита с новым hash. Если слишком часто переносить одни и те же изменения между ветками, история может стать запутанной:\n\n```text\nfeature: E\nmain:    E'\nrelease: E''\n```\n\nВсе три коммита могут содержать одинаковые изменения, но Git считает их разными коммитами.\n\nПоэтому `cherry-pick` лучше использовать для **точечного переноса изменений**, а для регулярной синхронизации веток обычно применять `merge` или `rebase`."
  popularity = 13.16

[[questions]]
  id = 2
  question = "Для чего нужен Rebase"
  answer = "### Что такое `git rebase`\n\n`git rebase` переносит последовательность коммитов одной ветки на другую базу.\n\nПроще говоря: Git берёт ваши коммиты, временно убирает их, перемещает ветку на новую точку и заново применяет эти коммиты поверх неё.\n\n### Пример\n\nЕсть ветки:\n\n```text\nmain:    A---B---C\n              \\\nfeature:       D---E\n```\n\nВ `main` появился новый коммит `C`, а ветка `feature` была создана от `B`.\n\nВыполняем:\n\n```bash\ngit switch feature\ngit rebase main\n```\n\nРезультат:\n\n```text\nmain:    A---B---C\n                  \\\nfeature:           D'---E'\n```\n\nКоммиты `D` и `E` были созданы заново поверх `C`, поэтому получили новые hash:\n\n```text\nD → D'\nE → E'\n```\n\n### Для чего нужен Rebase\n\n#### 1. Обновить свою ветку изменениями из `main`\n\nПока разработчик работает в `feature`, другие разработчики добавляют коммиты в `main`.\n\nЧтобы перенести свою работу поверх актуального `main`:\n\n```bash\ngit switch feature\ngit fetch origin\ngit rebase origin/main\n```\n\nПосле этого ветка будет выглядеть так, будто она была создана от последней версии `main`.\n\n#### 2. Сделать историю линейной\n\nБез Rebase при объединении веток может появиться merge-коммит:\n\n```text\nA---B---C-------M\n     \\         /\n      D---E---F\n```\n\nПосле Rebase история может выглядеть линейно:\n\n```text\nA---B---C---D'---E'---F'\n```\n\nТакую историю проще читать через:\n\n```bash\ngit log --oneline\n```\n\n#### 3. Подготовить ветку перед Merge Request\n\nОбычный сценарий:\n\n```bash\ngit switch feature\ngit fetch origin\ngit rebase origin/main\n```\n\nПосле успешного Rebase:\n\n```bash\ngit push --force-with-lease\n```\n\nЭто обновляет удалённую ветку с переписанной историей.\n\nЛучше использовать именно:\n\n```bash\ngit push --force-with-lease\n```\n\nА не:\n\n```bash\ngit push --force\n```\n\n`--force-with-lease` проверяет, не появились ли в удалённой ветке чужие изменения.\n\n### Отличие Rebase от Merge\n\n#### Merge\n\n```bash\ngit switch feature\ngit merge main\n```\n\nРезультат:\n\n```text\nmain:    A---B---C\n              \\   \\\nfeature:       D---E---M\n```\n\n`merge` сохраняет реальную структуру истории и обычно создаёт merge-коммит.\n\n#### Rebase\n\n```bash\ngit switch feature\ngit rebase main\n```\n\nРезультат:\n\n```text\nmain:    A---B---C\n                  \\\nfeature:           D'---E'\n```\n\n`rebase` переписывает историю и делает её линейной.\n\n### Главное различие\n\n```text\nmerge  — объединяет две истории;\nrebase — переносит одну историю поверх другой.\n```\n\n### Конфликты при Rebase\n\nЕсли Git обнаружит конфликт, процесс остановится:\n\n```text\nCONFLICT (content): Merge conflict in file.py\n```\n\nНужно исправить конфликт, затем:\n\n```bash\ngit add file.py\ngit rebase --continue\n```\n\nЕсли конфликтующих файлов несколько:\n\n```bash\ngit add .\ngit rebase --continue\n```\n\nОтменить весь Rebase:\n\n```bash\ngit rebase --abort\n```\n\nПропустить текущий коммит:\n\n```bash\ngit rebase --skip\n```\n\nСо `--skip` нужно быть осторожным: изменения пропущенного коммита не попадут в итоговую ветку.\n\n### Интерактивный Rebase\n\nИнтерактивный Rebase позволяет редактировать историю коммитов:\n\n```bash\ngit rebase -i HEAD~4\n```\n\nОткроется список последних четырёх коммитов:\n\n```text\npick a1b2c3d Add user model\npick e4f5a6b Fix typo\npick 123abcd Add validation\npick 456defg Fix validation\n```\n\nДоступные действия:\n\n```text\npick    оставить коммит\nreword  изменить сообщение коммита\nedit    остановиться и изменить коммит\nsquash  объединить с предыдущим коммитом\nfixup   объединить без сохранения сообщения\ndrop    удалить коммит\n```\n\nНапример:\n\n```text\npick a1b2c3d Add user model\nfixup e4f5a6b Fix typo\npick 123abcd Add validation\nfixup 456defg Fix validation\n```\n\nВ результате четыре коммита превратятся в два аккуратных коммита.\n\n### Когда Rebase использовать нельзя\n\nНе следует делать Rebase общей ветки, которой уже пользуются другие разработчики.\n\nОпасный пример:\n\n```bash\ngit switch main\ngit rebase another-branch\ngit push --force\n```\n\nЕсли другие разработчики уже скачали старую историю `main`, после такого Rebase их история разойдётся с удалённой.\n\nОсновное правило:\n\n```text\nНе переписывайте публичную историю.\n```\n\nОбычно безопасно делать Rebase:\n\n- локальной ветки;\n    \n- личной feature-ветки;\n    \n- ветки, с которой работает только один разработчик;\n    \n- коммитов, которые ещё не были опубликованы.\n    \n\n### Rebase текущей ветки на `main`\n\nТипичный рабочий сценарий:\n\n```bash\ngit switch feature/payment-validation\ngit fetch origin\ngit rebase origin/main\n```\n\nЕсли появились конфликты:\n\n```bash\ngit add .\ngit rebase --continue\n```\n\nПосле завершения:\n\n```bash\ngit push --force-with-lease\n```\n\n### Отличие от Cherry Pick\n\n`cherry-pick` переносит отдельные выбранные коммиты:\n\n```bash\ngit cherry-pick a1b2c3d\n```\n\n`rebase` обычно переносит всю последовательность коммитов ветки:\n\n```bash\ngit rebase main\n```\n\n```text\ncherry-pick — выбрать конкретный коммит;\nrebase      — перенести историю ветки на новую основу.\n```\n\n### Итог\n\n`git rebase` нужен для того, чтобы:\n\n- обновить feature-ветку относительно актуального `main`;\n    \n- получить линейную и чистую историю;\n    \n- убрать лишние merge-коммиты;\n    \n- объединить, переименовать или удалить локальные коммиты;\n    \n- подготовить аккуратную историю перед Merge Request.\n    \n\nГлавный риск Rebase — он изменяет hash коммитов и переписывает историю. Поэтому его нужно осторожно применять к уже опубликованным веткам."
  popularity = 2.63

[[questions]]
  id = 3
  question = "В чем разница между Git rebase и Git merge?"
  answer = "### Главное отличие\n\n`git merge` объединяет две ветки, сохраняя их историю.\n\n`git rebase` переносит коммиты одной ветки поверх другой и переписывает историю.\n\n```text\nmerge  — объединить истории;\nrebase — перенести коммиты на новую основу.\n```\n\n### Исходная ситуация\n\nДопустим, ветка `feature` была создана от `main`, после чего обе ветки изменились:\n\n```text\n          C---D  feature\n         /\nA---B---E---F    main\n```\n\nКоммиты `C` и `D` находятся в `feature`, а `E` и `F` появились в `main`.\n\n### Что делает `merge`\n\nНаходясь в `feature`:\n\n```bash\ngit switch feature\ngit merge main\n```\n\nGit объединит обе истории:\n\n```text\n          C---D------M  feature\n         /           /\nA---B---E---F--------   main\n```\n\n`M` — merge-коммит, который имеет двух родителей:\n\n```text\nродитель 1: D\nродитель 2: F\n```\n\nИстория показывает, что ветки развивались параллельно, а затем были объединены.\n\n### Что делает `rebase`\n\nНаходясь в `feature`:\n\n```bash\ngit switch feature\ngit rebase main\n```\n\nGit временно уберёт коммиты `C` и `D`, передвинет `feature` на `F`, а затем заново применит изменения:\n\n```text\nA---B---E---F---C'---D'  feature\n```\n\nКоммиты `C'` и `D'` содержат примерно те же изменения, что `C` и `D`, но это уже новые коммиты с новыми hash.\n\n```text\nC != C'\nD != D'\n```\n\n### Сравнение\n\n|Критерий|`merge`|`rebase`|\n|---|---|---|\n|История|Сохраняет реальную структуру веток|Делает историю линейной|\n|Hash коммитов|Обычно не меняется|Меняется у перенесённых коммитов|\n|Merge-коммит|Может появиться|Не создаётся|\n|Переписывание истории|Нет|Да|\n|Безопасность для общих веток|Обычно безопасен|Может быть опасен|\n|Читаемость `git log`|Может быть сложнее|Обычно проще|\n|Конфликты|Обычно решаются один раз при объединении|Могут возникать отдельно на каждом коммите|\n\n### Merge не всегда создаёт merge-коммит\n\nЕсли текущую ветку можно просто передвинуть вперёд, Git выполнит `fast-forward`.\n\nБыло:\n\n```text\nA---B---C  main\n         \\\n          D---E  feature\n```\n\nПри выполнении:\n\n```bash\ngit switch main\ngit merge feature\n```\n\nРезультат:\n\n```text\nA---B---C---D---E  main\n```\n\nОтдельного merge-коммита не будет.\n\nЧтобы принудительно создать его:\n\n```bash\ngit merge --no-ff feature\n```\n\n### Разница при конфликтах\n\n#### При `merge`\n\n```bash\ngit merge main\n```\n\nGit пытается объединить итоговые состояния веток. Обычно конфликт исправляется один раз.\n\nПосле исправления:\n\n```bash\ngit add .\ngit commit\n```\n\nОтменить merge:\n\n```bash\ngit merge --abort\n```\n\n#### При `rebase`\n\n```bash\ngit rebase main\n```\n\nGit применяет коммиты по одному. Поэтому конфликт может возникнуть несколько раз:\n\n```text\nПрименение C' → конфликт\nПрименение D' → ещё один конфликт\n```\n\nПосле каждого исправления:\n\n```bash\ngit add .\ngit rebase --continue\n```\n\nОтменить rebase:\n\n```bash\ngit rebase --abort\n```\n\n### Когда использовать `merge`\n\n`merge` предпочтителен, когда:\n\n- ветка общая и с ней работают несколько разработчиков;\n    \n- важно сохранить реальную историю разработки;\n    \n- нельзя переписывать опубликованные коммиты;\n    \n- нужно безопасно объединить долгоживущие ветки;\n    \n- команда использует merge-коммиты для отображения завершённых задач.\n    \n\nПример:\n\n```bash\ngit switch main\ngit merge feature/payment\n```\n\n### Когда использовать `rebase`\n\n`rebase` удобен, когда:\n\n- нужно обновить личную feature-ветку относительно `main`;\n    \n- хочется получить линейную историю;\n    \n- нужно убрать промежуточные merge-коммиты;\n    \n- коммиты ещё не используются другими разработчиками;\n    \n- нужно подготовить аккуратную ветку перед Merge Request.\n    \n\nПример:\n\n```bash\ngit switch feature/payment\ngit fetch origin\ngit rebase origin/main\n```\n\nПосле Rebase опубликованную ветку обычно приходится отправлять так:\n\n```bash\ngit push --force-with-lease\n```\n\nОбычный `git push` может быть отклонён, потому что история ветки изменилась.\n\n### Опасный сценарий\n\nНе следует делать Rebase общей ветки, если другие разработчики уже забрали её коммиты:\n\n```bash\ngit switch shared-feature\ngit rebase main\ngit push --force\n```\n\nПосле этого старые коммиты будут заменены новыми, а локальные ветки других разработчиков начнут расходиться с удалённой историей.\n\nОсновное правило:\n\n```text\nНе делайте rebase публичной истории,\nесли не согласовали это с командой.\n```\n\n### Типичный рабочий процесс\n\nРазработчик работает в своей ветке:\n\n```bash\ngit switch feature/payment-validation\n```\n\nОбновляет информацию с сервера:\n\n```bash\ngit fetch origin\n```\n\nПереносит свои коммиты поверх актуального `main`:\n\n```bash\ngit rebase origin/main\n```\n\nПосле успешного Rebase:\n\n```bash\ngit push --force-with-lease\n```\n\nЗатем Merge Request можно объединить через fast-forward или squash.\n\n### Итог\n\n```text\ngit merge:\n- сохраняет историю ветвления;\n- не переписывает существующие коммиты;\n- безопаснее для общих веток;\n- может создать merge-коммит.\n\ngit rebase:\n- переносит коммиты на новую основу;\n- создаёт новые hash;\n- делает историю линейной;\n- лучше подходит для личных feature-веток.\n```\n\nПрактическое правило:\n\n```text\nСвоя ветка      → rebase допустим и часто удобен.\nОбщая ветка     → обычно merge.\nПубличная история → rebase только по договорённости.\n```"
  popularity = 7.89

