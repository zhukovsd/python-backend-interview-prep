  id = 6
  question = "Что такое и зачем нужен parametrize в pytest?"
  answer = "### Что такое `parametrize` в pytest\n\n`parametrize` — это механизм pytest, который позволяет запустить один и тот же тест несколько раз с разными входными данными.\n\nИспользуется декоратор:\n\n```python\n@pytest.mark.parametrize\n```\n\nОфициальная документация pytest описывает `pytest.mark.parametrize` как встроенный декоратор для параметризации аргументов тестовой функции. \n\n### Зачем он нужен\n\nОн нужен, чтобы не писать много одинаковых тестов вручную.\n\nДопустим, есть функция:\n\n```python\ndef is_even(number: int) -> bool:\n    return number % 2 == 0\n```\n\nБез `parametrize`:\n\n```python\ndef test_is_even_with_2():\n    assert is_even(2) is True\n\n\ndef test_is_even_with_3():\n    assert is_even(3) is False\n\n\ndef test_is_even_with_10():\n    assert is_even(10) is True\n```\n\nРаботает, но много дублирования.\n\nС `parametrize`:\n\n```python\nimport pytest\n\n\n@pytest.mark.parametrize(\n    \"number, expected\",\n    [\n        (2, True),\n        (3, False),\n        (10, True),\n    ]\n)\ndef test_is_even(number, expected):\n    assert is_even(number) is expected\n```\n\npytest запустит этот тест 3 раза:\n\n```text\ntest_is_even[2-True]\ntest_is_even[3-False]\ntest_is_even[10-True]\n```\n\nТо есть один тест описывает одну логику, но проверяет несколько наборов данных.\n\n### Как это работает\n\nСтрока:\n\n```python\n@pytest.mark.parametrize(\"number, expected\", [...])\n```\n\nговорит pytest:\n\n```text\nnumber   → первый аргумент теста\nexpected → второй аргумент теста\n```\n\nА список кортежей задаёт значения:\n\n```python\n[\n    (2, True),\n    (3, False),\n    (10, True),\n]\n```\n\nЗначит pytest выполнит:\n\n```text\ntest_is_even(number=2, expected=True)\ntest_is_even(number=3, expected=False)\ntest_is_even(number=10, expected=True)\n```\n\n### Пример с валидацией\n\nДопустим, есть функция проверки username:\n\n```python\ndef is_valid_username(username: str) -> bool:\n    return len(username) >= 3 and username.isalnum()\n```\n\nТест:\n\n```python\nimport pytest\n\n\n@pytest.mark.parametrize(\n    \"username, expected\",\n    [\n        (\"alex\", True),\n        (\"ab\", False),\n        (\"john123\", True),\n        (\"bad-name\", False),\n        (\"\", False),\n    ]\n)\ndef test_is_valid_username(username, expected):\n    assert is_valid_username(username) is expected\n```\n\nПлюс в том, что сразу видно таблицу тестовых случаев:\n\n```text\n\"alex\"     → валидный username\n\"ab\"       → слишком короткий\n\"john123\"  → валидный username\n\"bad-name\" → содержит дефис\n\"\"         → пустая строка\n```\n\n### Пример с ожидаемым исключением\n\n`parametrize` удобен и для проверки ошибок.\n\n```python\nimport pytest\n\n\ndef divide(a, b):\n    return a / b\n\n\n@pytest.mark.parametrize(\n    \"a, b, expected\",\n    [\n        (10, 2, 5),\n        (9, 3, 3),\n        (5, 1, 5),\n    ]\n)\ndef test_divide_success(a, b, expected):\n    assert divide(a, b) == expected\n```\n\nОтдельно лучше проверять ошибочный сценарий:\n\n```python\ndef test_divide_by_zero():\n    with pytest.raises(ZeroDivisionError):\n        divide(10, 0)\n```\n\nМожно параметризовать и ошибки, но для читаемости успешные и ошибочные сценарии часто разделяют.\n\n### `ids` для понятных названий тестов\n\nПо умолчанию pytest сам генерирует имена параметризованных кейсов. Иногда они неудобные.\n\nМожно задать `ids`:\n\n```python\n@pytest.mark.parametrize(\n    \"username, expected\",\n    [\n        (\"alex\", True),\n        (\"ab\", False),\n        (\"bad-name\", False),\n    ],\n    ids=[\n        \"valid_username\",\n        \"too_short\",\n        \"contains_invalid_symbol\",\n    ]\n)\ndef test_is_valid_username(username, expected):\n    assert is_valid_username(username) is expected\n```\n\nТогда в выводе pytest будет понятнее, какой именно кейс упал:\n\n```text\ntest_is_valid_username[valid_username]\ntest_is_valid_username[too_short]\ntest_is_valid_username[contains_invalid_symbol]\n```\n\n### Когда стоит использовать `parametrize`\n\n`parametrize` хорошо подходит, когда:\n\n```text\nодна и та же логика проверяется на разных входных данных\nесть много похожих тестов\nнужно проверить граничные значения\nнужно проверить несколько вариантов результата\nнужно сделать тесты компактнее и понятнее\n```\n\nПримеры:\n\n```text\nвалидация email\nвалидация пароля\nпроверка ролей пользователя\nрасчёт скидки\nпарсинг строк\nпроверка статусов\nпроверка сериализаторов\nпроверка прав доступа\n```\n\n### Когда лучше не использовать\n\nНе стоит использовать `parametrize`, если сценарии сильно отличаются друг от друга.\n\nПлохо:\n\n```python\n@pytest.mark.parametrize(\n    \"data, expected\",\n    [\n        (...),  # регистрация пользователя\n        (...),  # логин пользователя\n        (...),  # удаление пользователя\n    ]\n)\ndef test_user_flow(data, expected):\n    ...\n```\n\nЗдесь разные бизнес-сценарии смешаны в один тест. Лучше сделать отдельные тесты:\n\n```python\ndef test_register_user_success():\n    ...\n\n\ndef test_login_user_success():\n    ...\n\n\ndef test_delete_user_success():\n    ...\n```\n\n### Коротко\n\n`parametrize` в pytest нужен для запуска одного теста с разными наборами данных.\n\nГлавная польза:\n\n```text\nменьше дублирования\nчище тесты\nудобнее проверять много кейсов\nпроще добавлять новые входные данные\nлучше видно таблицу сценариев\n```\n\nМинимальный пример:\n\n```python\nimport pytest\n\n\n@pytest.mark.parametrize(\n    \"value, expected\",\n    [\n        (1, 2),\n        (2, 4),\n        (3, 6),\n    ]\n)\ndef test_double(value, expected):\n    assert value * 2 == expected\n```\n\nИдея:\n\n```text\nодна тестовая логика\nнесколько наборов входных данных\nнесколько отдельных запусков теста\n```"
