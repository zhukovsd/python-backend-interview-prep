  id = 7
  question = "На каком этапе разработки писать unit-тесты?"
  answer = "Unit-тесты лучше писать не в самом конце разработки, а параллельно с реализацией логики.\n\nОптимальный момент:\n\n```text\n1. Понял требование\n2. Спроектировал поведение функции/метода/сервиса\n3. Написал или наметил unit-тесты\n4. Реализовал код\n5. Запустил тесты\n6. Отрефакторил код, не ломая тесты\n```\n\nТо есть unit-тесты должны появляться рядом с кодом, который они проверяют.\n\n### Лучший практический подход\n\nЕсть два нормальных варианта.\n\n### 1. До реализации кода\n\nЭто подход TDD: сначала пишется тест, потом код.\n\nСхема:\n\n```text\nсначала тест → тест падает → пишем код → тест проходит → рефакторинг\n```\n\nПример:\n\n```python\ndef test_calculate_discount_for_vip_user():\n    result = calculate_discount(user_type=\"vip\", amount=1000)\n\n    assert result == 150\n```\n\nПотом пишется функция:\n\n```python\ndef calculate_discount(user_type: str, amount: int) -> int:\n    if user_type == \"vip\":\n        return 150\n\n    return 0\n```\n\nПлюс такого подхода: тест помогает заранее описать ожидаемое поведение.\n\nМинус: не всегда удобно, если требования ещё сырые или интерфейс функции постоянно меняется.\n\n### 2. Сразу после написания небольшой части логики\n\nНа практике это самый частый и удобный вариант.\n\nНапример, написал функцию валидации — сразу написал тесты:\n\n```text\nнаписал validate_email()\nсразу написал test_validate_email_success()\nсразу написал test_validate_email_invalid_format()\nсразу написал test_validate_email_empty_string()\n```\n\nТак код ещё свежий в голове, и проще проверить граничные случаи.\n\n### Когда точно не стоит писать unit-тесты\n\nПлохой вариант — писать unit-тесты только в конце задачи.\n\n```text\nсначала написал весь feature\nпотом начал думать, как это тестировать\n```\n\nПроблемы:\n\n```text\nкод может оказаться плохо разделённым на части\nсложно изолировать бизнес-логику\nмного зависимостей уже смешано вместе\nтесты превращаются в тяжёлые integration-тесты\nприходится переписывать код ради тестируемости\n```\n\nUnit-тесты хорошо работают, когда код изначально написан так, чтобы его можно было вызвать отдельно: без реальной БД, HTTP-запросов, Redis, S3 и других внешних зависимостей.\n\n### На каком этапе задачи\n\nХорошая схема для backend-разработки:\n\n```text\n1. Анализ требования\n   → понять, какие сценарии нужно проверить\n\n2. Проектирование интерфейса\n   → какие функции, сервисы, методы будут отвечать за логику\n\n3. Реализация маленького блока\n   → например, валидатор, сервис, permission, use-case\n\n4. Unit-тесты на этот блок\n   → success case, error case, edge cases\n\n5. Integration/API-тесты\n   → проверить связку endpoint + service + DB\n\n6. Рефакторинг\n   → тесты должны остаться зелёными\n```\n\n### Что тестировать сразу\n\nUnit-тесты стоит писать сразу для логики, где есть условия, ветвления и ошибки:\n\n```text\nвалидация данных\nрасчёты\nпроверка прав доступа\nобработка токенов\nсервисный слой\nпарсинг данных\nмаппинг DTO/schema/entity\nбизнес-правила\nобработка исключений\n```\n\nПример:\n\n```python\ndef can_delete_file(user, file):\n    return file.owner_id == user.id or user.is_admin\n```\n\nТакую функцию удобно тестировать unit-тестами сразу:\n\n```python\ndef test_owner_can_delete_file():\n    user = User(id=1, is_admin=False)\n    file = File(owner_id=1)\n\n    assert can_delete_file(user, file) is True\n\n\ndef test_non_owner_cannot_delete_file():\n    user = User(id=2, is_admin=False)\n    file = File(owner_id=1)\n\n    assert can_delete_file(user, file) is False\n\n\ndef test_admin_can_delete_file():\n    user = User(id=2, is_admin=True)\n    file = File(owner_id=1)\n\n    assert can_delete_file(user, file) is True\n```\n\n### Что не обязательно тестировать unit-тестами сразу\n\nНе всё нужно покрывать именно unit-тестами.\n\nНапример:\n\n```text\nтонкие CRUD-view без логики\nпростые ORM-модели без кастомного поведения\nобычные настройки роутинга\nкод, который только вызывает framework\n```\n\nДля такого часто полезнее integration/API-тесты.\n\nНапример, в Django/DRF или FastAPI endpoint может быть слишком тонким:\n\n```python\n@router.get(\"/users/{user_id}\")\ndef get_user(user_id: int):\n    return user_service.get_user(user_id)\n```\n\nЗдесь сам endpoint почти не содержит логики. Unit-тест лучше писать на `user_service`, а endpoint проверить integration-тестом.\n\n### Как понять, что тест нужен сейчас\n\nUnit-тест нужен сразу, если на вопрос есть ответ «да»:\n\n```text\nесть несколько сценариев поведения?\nесть if/else?\nесть обработка ошибок?\nесть важное бизнес-правило?\nесть риск сломать это при рефакторинге?\nесть граничные значения?\nесть зависимость, которую нужно замокать?\n```\n\nПример:\n\n```python\ndef calculate_upload_path(user_id: int, filename: str) -> str:\n    return f\"users/{user_id}/{filename}\"\n```\n\nДля такой функции можно быстро написать unit-тест, потому что она содержит важное правило формирования пути:\n\n```python\ndef test_calculate_upload_path():\n    result = calculate_upload_path(10, \"avatar.png\")\n\n    assert result == \"users/10/avatar.png\"\n```\n\n### Роль фикстур и mock\n\nКогда unit-тест пишется во время разработки, сразу видно, какие зависимости мешают тестированию.\n\nНапример, плохой вариант:\n\n```python\ndef register_user(data):\n    user = User.objects.create(**data)\n    send_email(user.email)\n    redis.set(f\"user:{user.id}\", \"created\")\n    return user\n```\n\nЗдесь смешаны:\n\n```text\nсоздание пользователя\nemail\nRedis\nпобочные эффекты\n```\n\nЛучше вынести зависимости:\n\n```python\ndef register_user(data, user_repo, email_sender, cache):\n    user = user_repo.create(data)\n    email_sender.send(user.email)\n    cache.set(f\"user:{user.id}\", \"created\")\n    return user\n```\n\nТеперь unit-тест можно написать через mock:\n\n```python\nfrom unittest.mock import Mock\n\n\ndef test_register_user_sends_email_and_updates_cache():\n    user_repo = Mock()\n    email_sender = Mock()\n    cache = Mock()\n\n    user_repo.create.return_value = User(id=1, email=\"test@example.com\")\n\n    user = register_user(\n        {\"email\": \"test@example.com\"},\n        user_repo,\n        email_sender,\n        cache\n    )\n\n    assert user.email == \"test@example.com\"\n    email_sender.send.assert_called_once_with(\"test@example.com\")\n    cache.set.assert_called_once_with(\"user:1\", \"created\")\n```\n\nТо есть unit-тесты помогают не только проверять код, но и проектировать его более тестируемым.\n\npytest-фикстуры дают тестам стабильный и воспроизводимый контекст, например подготовленные данные или окружение. Это полезно, когда одни и те же объекты нужны во многих тестах.\n\n### Итоговая рекомендация\n\nПисать unit-тесты лучше:\n\n```text\nдо кода — если поведение понятно заранее\nсразу после маленького блока кода — если удобнее идти практично\nдо рефакторинга — обязательно, чтобы зафиксировать текущее поведение\nпосле найденного бага — обязательно, чтобы баг не вернулся\n```\n\nНе стоит ждать конца всей задачи.\n\n### Коротко\n\nПравильный ответ для собеседования:\n\n```text\nUnit-тесты лучше писать на раннем этапе разработки: либо до реализации в стиле TDD, либо сразу после написания небольшого участка логики.\n\nИх не стоит откладывать до конца, потому что тесты помогают быстрее находить ошибки, фиксировать ожидаемое поведение, безопасно делать рефакторинг и проектировать код так, чтобы его можно было изолированно проверять.\n```\n\nГлавная идея:\n\n```text\nunit-тесты должны сопровождать разработку,\nа не быть финальной формальностью после готового feature.\n```"
  popularity = 2.63

[[questions]]
  id = 8
  question = "Какие проблемы могут возникнуть из-за отсутствия тестов?"
  answer = "Отсутствие тестов приводит к тому, что качество кода проверяется в основном вручную и случайно. Из-за этого ошибки чаще находят поздно: на ревью, в QA, на staging или уже в production.\n\nГлавная проблема:\n\n```text\nбез тестов нет автоматической проверки, что старое поведение не сломалось после изменений\n```\n\n### 1. Регрессии после изменений\n\nРегрессия — это ситуация, когда раньше код работал правильно, но после нового изменения сломался.\n\nНапример:\n\n```python\ndef calculate_discount(user_type, amount):\n    if user_type == \"vip\":\n        return amount * 0.15\n\n    return 0\n```\n\nПотом разработчик добавил новый тип пользователя и случайно сломал старую логику:\n\n```python\ndef calculate_discount(user_type, amount):\n    if user_type == \"premium\":\n        return amount * 0.10\n\n    return 0\n```\n\nБез теста на `vip` это можно не заметить.\n\nС тестом:\n\n```python\ndef test_calculate_discount_for_vip_user():\n    assert calculate_discount(\"vip\", 1000) == 150\n```\n\nошибка обнаружится сразу при запуске тестов.\n\n### 2. Страшно делать рефакторинг\n\nЕсли тестов нет, любое изменение внутренней структуры кода становится рискованным.\n\nНапример, нужно разнести большой сервис на несколько функций:\n\n```text\nбыло:\nregister_user()\n\nстало:\nvalidate_user_data()\ncreate_user()\nsend_welcome_email()\nsave_user_to_cache()\n```\n\nБез тестов сложно понять, сохранилось ли поведение. Поэтому разработчик часто начинает бояться менять код и оставляет технический долг.\n\nС тестами рефакторинг безопаснее: тесты фиксируют ожидаемое поведение и быстро показывают, что сломалось. pytest как раз ориентирован на написание маленьких читаемых тестов, которые затем можно масштабировать для сложных приложений. \n\n### 3. Больше ручной проверки\n\nБез автоматических тестов каждое изменение приходится проверять руками:\n\n```text\nзапустить сервер\nсоздать пользователя\nполучить токен\nотправить запрос\nпроверить БД\nпроверить ответ API\nпроверить ошибочные сценарии\n```\n\nЭто долго и ненадёжно. Человек может забыть проверить редкий сценарий:\n\n```text\nпустое поле\nневалидный токен\nчужой объект\nдублирующий email\nнедоступный внешний сервис\nошибку Redis/S3/API\n```\n\n### 4. Ошибки находятся поздно\n\nЧем позже найдена ошибка, тем дороже её исправлять.\n\nБез тестов проблема часто всплывает уже после объединения кода:\n\n```text\nлокально всё выглядело нормально\nна ревью ошибку не заметили\nна staging сломался сценарий\nв production пользователь получил ошибку\n```\n\nТесты уменьшают этот риск, потому что автоматическая проверка запускается раньше: локально, в pre-commit, в CI/CD pipeline.\n\n### 5. Сложнее понять ожидаемое поведение\n\nХороший тест — это ещё и документация поведения.\n\nНапример:\n\n```python\ndef test_user_cannot_delete_another_user_file():\n    ...\n```\n\nИз названия уже понятно бизнес-правило:\n\n```text\nпользователь не может удалить чужой файл\n```\n\nЕсли тестов нет, поведение приходится искать в коде, ТЗ, комментариях или спрашивать у других разработчиков.\n\n### 6. Выше риск сломать edge cases\n\nEdge cases — это граничные и редкие случаи.\n\nНапример:\n\n```text\nпустой список\nNone вместо строки\n0 вместо положительного числа\nочень длинное имя файла\nповторная регистрация email\nистёкший JWT\nудаление уже удалённого объекта\nзагрузка файла с таким же именем\n```\n\nБез тестов такие случаи часто проверяются только «по памяти». В итоге основная ветка работает, а редкие сценарии ломаются.\n\n### 7. CI/CD становится менее полезным\n\nCI/CD без тестов проверяет в основном только то, что проект собирается и линтеры проходят.\n\nНо он не отвечает на главный вопрос:\n\n```text\nработает ли логика приложения после изменения?\n```\n\nС тестами pipeline становится полноценным защитным слоем:\n\n```text\nкод собрался\nлинтер прошёл\nunit-тесты прошли\nintegration-тесты прошли\ncoverage не упал ниже порога\n```\n\nCoverage-инструменты, например `coverage.py`, показывают, какие части Python-кода были выполнены во время запуска тестов. Это помогает видеть, какие участки вообще не проверяются автоматически. \n\n### 8. Сложнее ловить ошибки в интеграциях\n\nВ backend-проекте без тестов особенно часто ломаются связки:\n\n```text\nendpoint → serializer/schema → service → repository → database\nendpoint → dependency/middleware → auth → permissions\nservice → Redis\nservice → S3/MinIO\nservice → external API\n```\n\nUnit-тесты помогают проверить отдельную бизнес-логику, а integration-тесты — связку компонентов. Google Testing Blog отдельно указывает, что хороший набор тестов обычно строится как пирамида: больше unit-тестов, меньше крупных end-to-end тестов. \n\n### 9. Код хуже проектируется\n\nКогда тестов нет, код легко становится труднотестируемым:\n\n```python\ndef register_user(data):\n    user = User.objects.create(**data)\n    requests.post(\"https://email-service/send\", json={\"email\": user.email})\n    redis_client.set(f\"user:{user.id}\", \"created\")\n    return user\n```\n\nЗдесь внутри функции сразу смешаны:\n\n```text\nбизнес-логика\nБД\nHTTP-запрос\nRedis\nпобочные эффекты\n```\n\nТакой код сложно изолированно проверить.\n\nКогда тесты пишутся параллельно с кодом, разработчик чаще выносит зависимости наружу:\n\n```python\ndef register_user(data, user_repo, email_sender, cache):\n    user = user_repo.create(data)\n    email_sender.send(user.email)\n    cache.set(f\"user:{user.id}\", \"created\")\n    return user\n```\n\nТакой код проще тестировать, мокать и сопровождать.\n\n### 10. Больше багов после исправления багов\n\nЧастая ситуация:\n\n```text\nнашли баг\nисправили баг\nчерез месяц баг вернулся\n```\n\nЕсли после исправления бага не добавить тест, который воспроизводит этот сценарий, нет защиты от повторного появления той же ошибки.\n\nПравильная практика:\n\n```text\n1. Воспроизвести баг тестом\n2. Убедиться, что тест падает\n3. Исправить код\n4. Убедиться, что тест проходит\n5. Оставить тест в проекте\n```\n\n### Что особенно опасно оставлять без тестов\n\nВ первую очередь нужно покрывать:\n\n```text\nбизнес-правила\nденьги, скидки, лимиты\nавторизацию и права доступа\nвалидацию входных данных\nработу с токенами\nобработку ошибок\nсложные условия if/else\nкод, который уже ломался раньше\nинтеграции с БД, Redis, S3, внешними API\n```\n\nНе весь код требует одинакового уровня покрытия. Простые тонкие view, которые только вызывают сервис, можно проверять integration/API-тестами. Но бизнес-логику лучше покрывать unit-тестами.\n\n### Коротко для собеседования\n\n```text\nИз-за отсутствия тестов повышается риск регрессий, усложняется рефакторинг, появляется зависимость от ручной проверки, ошибки находятся поздно, CI/CD хуже защищает проект, а поведение системы становится менее зафиксированным.\n\nТесты нужны не только для поиска багов, но и как страховка при изменениях кода.\n```\n\nГлавная мысль:\n\n```text\nбез тестов разработчик не знает наверняка,\nсломал он старое поведение или нет\n```"
  popularity = 2.63

[[questions]]
  id = 9
  question = "Какую БД лучше использовать для тестов?"
  answer = "Для тестов лучше использовать такую же СУБД, как в production.\n\nЕсли в production PostgreSQL, то для серьёзных тестов лучше использовать PostgreSQL, а не SQLite.\n\n```text\nproduction PostgreSQL → tests PostgreSQL\nproduction MySQL      → tests MySQL\nproduction SQLite     → tests SQLite\n```\n\nГлавная причина: разные БД могут по-разному работать с типами данных, транзакциями, индексами, ограничениями, SQL-функциями и поведением ORM. Даже Django прямо указывает, что поддерживаемые backend’ы БД не одинаковы, и не все их особенности совпадают. \n\n### Для unit-тестов\n\nДля чистых unit-тестов БД обычно вообще не нужна.\n\nUnit-тест должен проверять маленький участок логики изолированно:\n\n```text\nвалидатор\nсервис\nрасчёт\npermission\nпарсер\nработу с токеном\nбизнес-правило\n```\n\nНапример:\n\n```python\ndef can_delete_file(user, file):\n    return file.owner_id == user.id or user.is_admin\n```\n\nТакой код можно тестировать без базы:\n\n```python\ndef test_owner_can_delete_file():\n    user = User(id=1, is_admin=False)\n    file = File(owner_id=1)\n\n    assert can_delete_file(user, file) is True\n```\n\nДля unit-тестов лучше использовать:\n\n```text\nобычные объекты\ndataclass / pydantic-модели\nmock-объекты\nfake repository\nin-memory структуры\n```\n\nБД подключать только там, где реально тестируется работа с ORM/SQL.\n\n### Для integration-тестов\n\nДля integration-тестов лучше использовать реальную тестовую БД того же типа, что и production.\n\nНапример, если проект на Django/FastAPI + PostgreSQL:\n\n```text\ntests → отдельная PostgreSQL database\n```\n\nПотому что integration-тесты проверяют связку:\n\n```text\nendpoint → service → repository → ORM → database\n```\n\nЗдесь важно, чтобы поведение было максимально близко к production.\n\n### Почему не всегда стоит использовать SQLite\n\nSQLite часто используют для простоты, потому что она быстрая и не требует отдельного сервера. Но это не всегда безопасная замена PostgreSQL/MySQL.\n\nПроблемы могут быть такие:\n\n```text\nдругое поведение типов данных\nотличия в транзакциях\nотличия в блокировках\nотличия в autoincrement\nотличия в JSON/ARRAY/UUID полях\nотличия в индексах\nотличия в constraint-проверках\nотличия в SQL-функциях\n```\n\nНапример, в SQLAlchemy документации отдельно описаны особенности SQLite: свои правила `AUTOINCREMENT`, особенности `DATE/TIME/DATETIME`, отдельное поведение in-memory БД и pooling. \n\nПоэтому SQLite допустима, если:\n\n```text\nпроект реально использует SQLite\nтесты проверяют простую ORM-логику\nнет PostgreSQL-specific возможностей\nнужны очень быстрые локальные тесты\n```\n\nНо если production на PostgreSQL, а тесты на SQLite, можно получить ложную уверенность:\n\n```text\nтесты проходят\nа на PostgreSQL код падает\n```\n\n### Лучший вариант для backend-проекта\n\nДля твоего стека вроде Django/FastAPI + PostgreSQL оптимальный вариант такой:\n\n```text\nunit-тесты:\nБД не использовать, зависимости мокать\n\nintegration-тесты:\nиспользовать отдельную PostgreSQL test database\n\nCI/CD:\nподнимать PostgreSQL сервисом в Docker\n```\n\nПример логики разделения:\n\n```text\ntests/unit/\n→ без БД\n→ быстро\n→ mock/fake объекты\n\ntests/integration/\n→ PostgreSQL\n→ ORM-запросы\n→ API endpoint\n→ транзакции\n→ миграции/схемы\n```\n\n### Django\n\nВ Django тестовый runner сам создаёт отдельную тестовую базу данных. Обычно она создаётся на основе настроек `DATABASES`, но с именем вида `test_<имя_основной_базы>`. Django также выполняет тесты так, чтобы изолировать их друг от друга. В `django.test.TestCase` каждый тест выполняется внутри транзакции для изоляции. ([Django Project](https://docs.djangoproject.com/en/6.0/topics/testing/overview/ \"Writing and running tests | Django documentation | Django\"))\n\nЕсли используется `pytest-django`, доступ к БД по умолчанию запрещён. Его нужно явно включать через `@pytest.mark.django_db`. Это сделано специально, чтобы было видно, какие тесты действительно зависят от базы. \n\nПример:\n\n```python\nimport pytest\n\n\n@pytest.mark.django_db\ndef test_user_created():\n    user = User.objects.create(username=\"alex\")\n\n    assert user.username == \"alex\"\n```\n\nДля ускорения можно использовать:\n\n```bash\npytest --reuse-db\n```\n\n`pytest-django` позволяет переиспользовать тестовую БД между запусками, что ускоряет старт тестов, но при изменениях схемы её нужно пересоздавать. \n\n### FastAPI / SQLAlchemy\n\nДля FastAPI + SQLAlchemy лучше разделять:\n\n```text\nunit-тесты сервисов:\nmock repository / fake repository\n\nintegration-тесты repository/API:\nтестовый PostgreSQL\n```\n\nПример идеи:\n\n```python\ndef test_create_user_service():\n    user_repo = Mock()\n    user_repo.create.return_value = User(id=1, email=\"test@example.com\")\n\n    result = create_user_service(\n        email=\"test@example.com\",\n        user_repo=user_repo\n    )\n\n    assert result.id == 1\n    user_repo.create.assert_called_once()\n```\n\nА repository уже проверять на настоящей тестовой БД:\n\n```text\nUserRepository.create()\nUserRepository.get_by_id()\nNotificationRepository.list_by_user()\n```\n\n### Testcontainers / Docker\n\nХороший вариант для integration-тестов — поднимать БД в Docker-контейнере.\n\nНапример, через `testcontainers-python` можно поднять PostgreSQL-контейнер прямо для тестов. В официальной документации показан пример с `PostgresContainer(\"postgres:16\")`, который создаёт PostgreSQL в контейнере и возвращает connection URL для подключения. \n\nПлюсы:\n\n```text\nблизко к production\nчистое окружение\nудобно для CI\nне нужно вручную держать локальную test-БД\n```\n\nМинусы:\n\n```text\nмедленнее SQLite\nнужен Docker\nсложнее настройка\n```\n\n### Практическая рекомендация\n\nДля нормального backend-проекта:\n\n```text\n1. Unit-тесты\n   → без БД\n   → mock/fake зависимости\n\n2. Repository-тесты\n   → реальная тестовая PostgreSQL\n\n3. API/integration-тесты\n   → реальная тестовая PostgreSQL\n\n4. E2E-тесты\n   → окружение максимально близкое к production\n```\n\n### Что выбрать\n\n```text\nSQLite in-memory\n→ только для простых тестов или если production тоже SQLite\n\nОтдельная PostgreSQL test database\n→ лучший вариант, если production PostgreSQL\n\nDocker Compose PostgreSQL\n→ хороший вариант для локальной разработки и CI\n\nTestcontainers PostgreSQL\n→ хороший вариант для изолированных integration-тестов\n\nMock/Fake repository\n→ лучший вариант для чистых unit-тестов\n```\n\n### Итог\n\nЛучший ответ:\n\n```text\nДля unit-тестов БД лучше не использовать вообще: зависимости стоит мокать или заменять fake-репозиториями.\n\nДля integration-тестов лучше использовать такую же БД, как в production. Если production на PostgreSQL, то и тесты лучше запускать на отдельной PostgreSQL test database, а не на SQLite.\n```\n\nГлавное правило:\n\n```text\nчем ближе тест к бизнес-логике → тем меньше нужна реальная БД\nчем ближе тест к ORM/API/integration → тем важнее использовать production-like БД\n```"
  popularity = 2.63
