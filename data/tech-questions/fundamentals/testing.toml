  id = 4
  question = "Чем вы измеряли покрытие кода тестами?"
  answer = "### Что такое test coverage\n\n`test coverage` — это показатель, какая часть кода была выполнена во время запуска тестов.\n\nНапример:\n\n```text\nTOTAL coverage: 82%\n```\n\nЭто значит, что тесты во время выполнения прошли примерно по 82% измеряемых строк кода.\n\nВажно: высокий coverage не гарантирует, что тесты хорошие. Он показывает только, какие строки были выполнены, а не насколько корректно проверена логика.\n\n### Основной инструмент: `coverage.py`\n\nОбычно используют пакет `coverage`.\n\nУстановка:\n\n```bash\npip install coverage\n```\n\nЗапуск тестов под coverage:\n\n```bash\ncoverage run -m pytest\n```\n\nПосле этого посмотреть отчёт:\n\n```bash\ncoverage report -m\n```\n\nКлюч `-m` показывает строки, которые не были покрыты тестами.\n\nПример вывода:\n\n```text\nName                 Stmts   Miss  Cover   Missing\n--------------------------------------------------\napp/services.py         50      8    84%   12-15, 31, 44-46\napp/repositories.py     70     10    86%   20-25, 61-64\n--------------------------------------------------\nTOTAL                  120     18    85%\n```\n\n`coverage.py` официально используется для измерения покрытия Python-кода: он отслеживает, какие части программы были выполнены, а затем показывает, какие могли быть выполнены, но не были. \n\n### HTML-отчёт\n\nДля удобного просмотра можно сгенерировать HTML:\n\n```bash\ncoverage html\n```\n\nПосле этого появится папка:\n\n```text\nhtmlcov/\n```\n\nОткрывать нужно файл:\n\n```text\nhtmlcov/index.html\n```\n\nВ HTML-отчёте удобно смотреть, какие конкретно строки не были покрыты тестами. В документации `coverage.py` отдельно указаны команды `coverage report -m` и `coverage html` для текстового и HTML-отчёта. \n\n### Вариант для pytest: `pytest-cov`\n\nНа практике чаще используют плагин `pytest-cov`.\n\nУстановка:\n\n```bash\npip install pytest-cov\n```\n\nЗапуск:\n\n```bash\npytest --cov=app\n```\n\nГде `app` — это папка или пакет, покрытие которого нужно проверить.\n\nНапример:\n\n```bash\npytest --cov=src\n```\n\nили:\n\n```bash\npytest --cov=users\n```\n\n### Показать непокрытые строки\n\nСамая полезная команда:\n\n```bash\npytest --cov=app --cov-report=term-missing\n```\n\nОна покажет не только общий процент, но и строки, которые тестами не были пройдены.\n\nПример:\n\n```text\nName                 Stmts   Miss  Cover   Missing\n--------------------------------------------------\napp/auth.py             40      5    88%   18-20, 35-36\napp/services.py         80     20    75%   10-15, 44-58\n--------------------------------------------------\nTOTAL                  120     25    79%\n```\n\nВ документации `pytest-cov` указано, что можно генерировать разные типы отчётов: terminal, terminal with missing lines, HTML, XML, JSON, Markdown, LCOV и другие. \n\n### HTML через pytest-cov\n\n```bash\npytest --cov=app --cov-report=html\n```\n\nПосле запуска появится HTML-отчёт.\n\nМожно указать папку явно:\n\n```bash\npytest --cov=app --cov-report=html:coverage_html\n```\n\nДокументация `pytest-cov` показывает, что путь для HTML-отчёта можно задать через формат `--cov-report html:cov_html`. \n\n### Coverage с минимальным порогом\n\nМожно сделать так, чтобы тесты падали, если coverage ниже нужного процента.\n\nНапример, минимум 80%:\n\n```bash\npytest --cov=app --cov-report=term-missing --cov-fail-under=80\n```\n\nЭто удобно для CI/CD:\n\n```text\ncoverage >= 80% → pipeline проходит\ncoverage < 80%  → pipeline падает\n```\n\n### Пример для FastAPI / Django проекта\n\nДопустим структура такая:\n\n```text\nproject/\n├── app/\n│   ├── main.py\n│   ├── services.py\n│   └── repositories.py\n└── tests/\n    ├── test_services.py\n    └── test_api.py\n```\n\nТогда команда:\n\n```bash\npytest --cov=app --cov-report=term-missing\n```\n\nПроверит покрытие кода внутри `app`.\n\nДля Django-проекта:\n\n```bash\npytest --cov=accounts --cov=storage --cov-report=term-missing\n```\n\nИли несколько приложений сразу:\n\n```bash\npytest --cov=. --cov-report=term-missing\n```\n\nНо `--cov=.` может захватить лишнее, поэтому обычно лучше явно указывать нужные приложения.\n\n### Что обычно смотрят в отчёте\n\n```text\nStmts    → сколько строк считается исполняемыми\nMiss     → сколько строк не было выполнено тестами\nCover    → процент покрытия\nMissing  → номера непокрытых строк\n```\n\nПример:\n\n```text\napp/services.py   100   15   85%   22-28, 45, 70-76\n```\n\nЭто значит:\n\n```text\n100 исполняемых строк\n15 строк не покрыто\n85% coverage\nстроки 22-28, 45, 70-76 не были выполнены тестами\n```\n\n### Коротко\n\nДля обычного проекта на `pytest`:\n\n```bash\npip install pytest-cov\npytest --cov=app --cov-report=term-missing\n```\n\nДля HTML-отчёта:\n\n```bash\npytest --cov=app --cov-report=html\n```\n\nДля проверки минимального порога:\n\n```bash\npytest --cov=app --cov-report=term-missing --cov-fail-under=80\n```\n\nГлавная идея:\n\n```text\ncoverage показывает не \"качество тестов\",\nа то, какие участки кода реально выполнялись во время тестирования.\n```"
  popularity = 2.63

[[questions]]
  id = 5
  question = "Как лучше организовать unit-тесты в Python-проекте?"
  answer = "### Общий принцип\n\nUnit-тесты лучше организовывать так, чтобы они проверяли маленькие изолированные части кода: функцию, метод, сервис, валидатор, репозиторий, use-case. Внешние зависимости лучше подменять фикстурами или mock-объектами.\n\nДля Python-проектов чаще всего используют `pytest`, потому что он позволяет писать короткие тесты, удобно работать с фикстурами и хорошо масштабируется на большие проекты. В документации pytest отдельно подчёркивается, что фреймворк подходит и для маленьких тестов, и для сложных функциональных наборов тестов. \n\n### Рекомендуемая структура\n\nОбычно делают отдельную папку `tests/` рядом с кодом проекта:\n\n```text\nproject/\n├── app/\n│   ├── services/\n│   │   └── user_service.py\n│   ├── repositories/\n│   │   └── user_repository.py\n│   └── utils/\n│       └── tokens.py\n│\n├── tests/\n│   ├── unit/\n│   │   ├── services/\n│   │   │   └── test_user_service.py\n│   │   ├── repositories/\n│   │   │   └── test_user_repository.py\n│   │   └── utils/\n│   │       └── test_tokens.py\n│   │\n│   ├── integration/\n│   │   └── test_user_api.py\n│   │\n│   └── conftest.py\n│\n├── pytest.ini\n└── pyproject.toml\n```\n\nРазделение полезное:\n\n```text\ntests/unit/        → быстрые изолированные тесты\ntests/integration/ → тесты с БД, API, Redis, S3, внешними компонентами\nconftest.py        → общие фикстуры pytest\n```\n\npytest умеет автоматически находить тесты по соглашениям об именовании файлов и функций, а также позволяет настраивать правила discovery через конфигурацию. \n\n### Именование тестов\n\nЛучше придерживаться понятной схемы:\n\n```text\ntest_<что_тестируем>.py\ntest_<ожидаемое_поведение>\n```\n\nПример:\n\n```python\ndef test_create_user_success():\n    ...\n\n\ndef test_create_user_raises_error_when_email_exists():\n    ...\n\n\ndef test_decode_token_returns_payload():\n    ...\n```\n\nПлохой вариант:\n\n```python\ndef test_1():\n    ...\n\n\ndef test_user():\n    ...\n\n\ndef test_func():\n    ...\n```\n\nНазвание теста должно объяснять, какое поведение проверяется.\n\n### Один тест — одна проверяемая идея\n\nХороший unit-тест проверяет один сценарий.\n\nНапример:\n\n```python\ndef test_calculate_discount_for_regular_user():\n    result = calculate_discount(user_type=\"regular\", amount=1000)\n\n    assert result == 50\n```\n\nОтдельно тестируется другой сценарий:\n\n```python\ndef test_calculate_discount_for_vip_user():\n    result = calculate_discount(user_type=\"vip\", amount=1000)\n\n    assert result == 150\n```\n\nНе стоит в один тест складывать много разных случаев:\n\n```python\ndef test_calculate_discount():\n    assert calculate_discount(\"regular\", 1000) == 50\n    assert calculate_discount(\"vip\", 1000) == 150\n    assert calculate_discount(\"guest\", 1000) == 0\n```\n\nТакой тест сложнее читать и отлаживать. Если он упадёт, нужно дополнительно разбираться, какой именно сценарий сломался.\n\n### Использовать Arrange / Act / Assert\n\nУдобная структура теста:\n\n```text\nArrange → подготовка данных\nAct     → выполнение действия\nAssert  → проверка результата\n```\n\nПример:\n\n```python\ndef test_user_can_be_activated():\n    # Arrange\n    user = User(is_active=False)\n\n    # Act\n    user.activate()\n\n    # Assert\n    assert user.is_active is True\n```\n\nТак тест читается последовательно:\n\n```text\nчто подготовили\nчто вызвали\nчто ожидаем получить\n```\n\n### Фикстуры выносить в `conftest.py`\n\nЕсли фикстура нужна во многих тестах, её можно вынести в `conftest.py`.\n\n```python\n# tests/conftest.py\n\nimport pytest\n\n\n@pytest.fixture\ndef user_data():\n    return {\n        \"username\": \"test_user\",\n        \"email\": \"test@example.com\",\n        \"password\": \"strong-password\"\n    }\n```\n\nПотом использовать в тестах:\n\n```python\ndef test_create_user(user_data):\n    user = create_user(user_data)\n\n    assert user.email == \"test@example.com\"\n```\n\nФикстуры pytest дают тестам заранее подготовленный и стабильный контекст: например, данные, окружение или настроенные ресурсы.\n\n### Не перегружать фикстуры\n\nПлохая фикстура:\n\n```python\n@pytest.fixture\ndef full_app_state():\n    user = create_user()\n    token = create_token(user)\n    order = create_order(user)\n    payment = create_payment(order)\n    notification = create_notification(user)\n\n    return user, token, order, payment, notification\n```\n\nПроблема: тесты начинают зависеть от лишнего состояния.\n\nЛучше разделить:\n\n```python\n@pytest.fixture\ndef user():\n    return create_user()\n\n\n@pytest.fixture\ndef token(user):\n    return create_token(user)\n\n\n@pytest.fixture\ndef order(user):\n    return create_order(user)\n```\n\nТогда каждый тест берёт только то, что ему реально нужно:\n\n```python\ndef test_order_belongs_to_user(user, order):\n    assert order.user_id == user.id\n```\n\n### Внешние зависимости подменять mock-объектами\n\nUnit-тест не должен реально ходить во внешний API, Redis, S3, email-сервис или платёжный сервис.\n\nПример:\n\n```python\nfrom unittest.mock import Mock\n\n\ndef test_send_welcome_email():\n    email_sender = Mock()\n\n    register_user(\n        email=\"test@example.com\",\n        email_sender=email_sender\n    )\n\n    email_sender.send.assert_called_once_with(\"test@example.com\")\n```\n\nЗдесь тест не отправляет настоящее письмо. Он проверяет, что код правильно вызвал зависимость.\n\nВ Python для этого обычно используют `unittest.mock`. Официальная документация описывает `Mock` и `patch()` как инструменты для создания mock-объектов и временной подмены объектов во время теста. \n\n### Не тестировать реализацию вместо поведения\n\nПлохой тест:\n\n```python\ndef test_create_user_calls_hash_password():\n    password_hasher = Mock()\n\n    create_user(\"test@example.com\", \"123456\", password_hasher)\n\n    password_hasher.hash.assert_called_once()\n```\n\nТакой тест слишком привязан к внутренней реализации.\n\nЛучше проверять наблюдаемое поведение:\n\n```python\ndef test_create_user_saves_hashed_password():\n    user = create_user(\"test@example.com\", \"123456\")\n\n    assert user.password != \"123456\"\n    assert user.check_password(\"123456\") is True\n```\n\nИсключение: когда смысл функции именно во взаимодействии с зависимостью. Например, отправка email, публикация события в очередь, вызов S3-клиента.\n\n### Разделять unit и integration тесты\n\nUnit-тест:\n\n```text\nбыстрый\nизолированный\nбез реальной БД\nбез настоящего HTTP-запроса\nбез настоящего Redis/S3\nпроверяет маленький участок логики\n```\n\nIntegration-тест:\n\n```text\nможет использовать тестовую БД\nможет поднимать API-клиент\nможет проверять связку нескольких компонентов\nмедленнее, но ближе к реальному поведению системы\n```\n\nПример разделения:\n\n```text\ntests/unit/test_password_service.py\ntests/unit/test_token_service.py\ntests/unit/test_user_validator.py\n\ntests/integration/test_auth_api.py\ntests/integration/test_user_repository.py\ntests/integration/test_notifications_api.py\n```\n\n### Конфигурация pytest\n\nМинимальный `pytest.ini`:\n\n```ini\n[pytest]\ntestpaths = tests\npython_files = test_*.py\npython_functions = test_*\naddopts = -ra\n```\n\nМожно добавить markers:\n\n```ini\n[pytest]\ntestpaths = tests\npython_files = test_*.py\npython_functions = test_*\naddopts = -ra\n\nmarkers =\n    unit: isolated unit tests\n    integration: tests with external dependencies\n```\n\nТогда тесты можно помечать:\n\n```python\nimport pytest\n\n\n@pytest.mark.unit\ndef test_calculate_discount():\n    assert calculate_discount(1000) == 50\n```\n\nЗапуск только unit-тестов:\n\n```bash\npytest -m unit\n```\n\nЗапуск только integration-тестов:\n\n```bash\npytest -m integration\n```\n\n### Покрытие тестами\n\nДля контроля покрытия удобно использовать `pytest-cov`:\n\n```bash\npytest --cov=app --cov-report=term-missing\n```\n\nДля минимального порога:\n\n```bash\npytest --cov=app --cov-report=term-missing --cov-fail-under=80\n```\n\n`coverage.py` измеряет, какие части Python-кода были выполнены во время запуска тестов, а `pytest-cov` добавляет интеграцию coverage с pytest. \n\n### Практическое правило для backend-проекта\n\nДля FastAPI/Django/DRF проекта хорошая схема такая:\n\n```text\ntests/\n├── unit/\n│   ├── test_services.py\n│   ├── test_validators.py\n│   ├── test_permissions.py\n│   └── test_utils.py\n│\n├── integration/\n│   ├── test_auth_api.py\n│   ├── test_user_repository.py\n│   └── test_file_upload_api.py\n│\n└── conftest.py\n```\n\nЧто тестировать unit-тестами:\n\n```text\nвалидацию данных\nсервисный слой\nрасчёты\nпарсинг\nработу с токенами\nправа доступа\nобработку ошибок\nмаппинг DTO/schema/entity\n```\n\nЧто лучше оставить integration-тестам:\n\n```text\nреальные запросы к тестовой БД\nработу ORM-запросов\nAPI endpoint целиком\nмиграции\nавторизацию через middleware/dependencies\nсвязку API + DB + serializer/schema\n```\n\n### Коротко\n\nХорошая организация unit-тестов в Python:\n\n```text\ntests/ отдельно от app/\nunit и integration разделены\nимена тестов описывают поведение\nодин тест проверяет один сценарий\nобщая подготовка вынесена в фикстуры\nвнешние зависимости заменяются mock-объектами\nтесты не зависят от порядка запуска\ncoverage проверяется отдельно\n```\n\nМинимальная рабочая схема:\n\n```text\nproject/\n├── app/\n├── tests/\n│   ├── unit/\n│   ├── integration/\n│   └── conftest.py\n└── pytest.ini\n```\n\nГлавная идея:\n\n```text\nunit-тест должен быстро и изолированно отвечать на вопрос:\n\"Правильно ли работает конкретный маленький участок логики?\"\n```"
