[[questions]]
  id = 1
  question = "Что такое фикстуры в тестировании и какую задачу они решают при подготовке окружения и данных для тестов?"
  answer = "**Фикстура** — это заранее подготовленное, известное состояние среды тестирования (данные, объекты, настройки), которое необходимо для корректного выполнения тестов и гарантирует их повторяемость. Фикстуры позволяют избежать дублирования кода настройки и очистки, делая тесты чище и проще для чтения. Для их создания используется специальный синтаксис в тестовых фреймворках, например, декоратор @pytest.fixture в Python.\n\nФикстуры (fixtures) в pytest - это функции, которые предоставляют тестовые данные, устанавливают предварительные условия и выполняют очистку после тестов.\n\nФикстуры - это способ инжекции зависимостей в тесты. Они выполняются до (и после) тестовых функций и предоставляют им необходимые ресурсы.\n\nСоздание фикстуры\n\n```python\nimport pytest\n\n@pytest.fixture\ndef database_connection():\n    # Setup - выполняется ДО теста\n    connection = connect_to_database()\n    print(\"Setting up database connection\")\n\n    yield connection  # передача контроля тесту\n\n    # Teardown - выполняется ПОСЛЕ теста\n    connection.close()\n    print(\"Closing database connection\")\n\ndef test_database_operations(database_connection):\n    result = database_connection.query(\"SELECT * FROM users\")\n    assert len(result) > 0\n```\n\n### Какую задачу они решают\n\nФикстуры решают проблему повторяющейся подготовки перед тестами.\n\nБез фикстур:\n\n```python\ndef test_user_can_login():\n    user = User.objects.create_user(\n        username=\"test\",\n        password=\"password\"\n    )\n\n    client = APIClient()\n    response = client.post(\"/login/\", {\n        \"username\": \"test\",\n        \"password\": \"password\"\n    })\n\n    assert response.status_code == 200\n```\n\nЕсли таких тестов 20, то создание пользователя, клиента, токена, начальных данных будет повторяться в каждом тесте.\n\nС фикстурой:\n\n```python\n@pytest.fixture\ndef user():\n    return User.objects.create_user(\n        username=\"test\",\n        password=\"password\"\n    )\n\n\n@pytest.fixture\ndef api_client():\n    return APIClient()\n\n\ndef test_user_can_login(api_client, user):\n    response = api_client.post(\"/login/\", {\n        \"username\": \"test\",\n        \"password\": \"password\"\n    })\n\n    assert response.status_code == 200\n```\n\nТест становится чище: он проверяет саму бизнес-логику, а не смешивает её с подготовкой данных.\n\n### Что делает фикстура перед тестом\n\nФикстура обычно выполняет три задачи:\n\n```text\n1. Подготавливает окружение\n2. Передаёт готовый объект в тест\n3. После теста очищает ресурсы, если это нужно\n```\n\nНапример:\n\n```python\n@pytest.fixture\ndef temp_file():\n    file = open(\"test.txt\", \"w\")\n    file.write(\"data\")\n    file.close()\n\n    yield \"test.txt\"\n\n    os.remove(\"test.txt\")\n```\n\nЗдесь:\n\n```text\nдо yield   → подготовка\nyield      → передача значения в тест\nпосле yield → очистка\n```\n\npytest позволяет тестовой функции запрашивать фикстуру просто через аргумент функции; pytest сам найдёт и выполнит нужную фикстуру перед запуском теста. \n\n### Пример с базой данных\n\nДопустим, нужно протестировать получение уведомлений пользователя.\n\nБез фикстуры тест может быть перегружен:\n\n```python\ndef test_get_notifications():\n    user = User.objects.create(username=\"alex\")\n    Notification.objects.create(user=user, text=\"Hello\")\n\n    response = client.get(f\"/users/{user.id}/notifications/\")\n\n    assert response.status_code == 200\n    assert len(response.data) == 1\n```\n\nС фикстурами:\n\n```python\n@pytest.fixture\ndef user():\n    return User.objects.create(username=\"alex\")\n\n\n@pytest.fixture\ndef notification(user):\n    return Notification.objects.create(\n        user=user,\n        text=\"Hello\"\n    )\n\n\ndef test_get_notifications(client, user, notification):\n    response = client.get(f\"/users/{user.id}/notifications/\")\n\n    assert response.status_code == 200\n    assert len(response.data) == 1\n```\n\nЗдесь фикстуры формируют тестовое состояние:\n\n```text\nuser         → создаёт пользователя\nnotification → создаёт уведомление для этого пользователя\nclient       → даёт тестовый HTTP-клиент\n```\n\n### Фикстуры в Django\n\nВ Django слово fixture часто означает файл с заранее сериализованными данными для базы. Например JSON-файл, который можно загрузить в тестовую БД. В официальной документации Django фикстура описывается как набор файлов с сериализованным содержимым базы данных. \n\nПример условной Django fixture:\n\n```json\n[\n  {\n    \"model\": \"accounts.user\",\n    \"pk\": 1,\n    \"fields\": {\n      \"username\": \"test_user\",\n      \"email\": \"test@example.com\"\n    }\n  }\n]\n```\n\nТакой файл можно загрузить перед тестами, чтобы база уже содержала нужные записи.\n\n### Главная польза фикстур\n\nФикстуры нужны, чтобы тесты были:\n\n```text\nповторяемыми  → каждый запуск получает одинаковые данные\nчистыми       → тест не забит подготовительным кодом\nизолированными → один тест меньше влияет на другой\nудобными      → общая подготовка переиспользуется\nнадёжными     → меньше случайных ошибок из-за разного состояния окружения\n```\n\n### Коротко\n\nФикстура — это механизм подготовки тестового окружения и данных.\n\nОна отвечает не за саму проверку, а за состояние, в котором эта проверка выполняется.\n\n```text\nФикстура отвечает на вопрос:\n\"Что нужно подготовить, чтобы тест мог нормально выполниться?\"\n```\n\nА сам тест отвечает на вопрос:\n\n```text\n\"Правильно ли работает проверяемая логика?\"\n```"
  popularity = 5.26

[[questions]]
  id = 2
  question = "Для каких задач применяется unittest.mock?"
  answer = "### Для чего применяется `unittest.mock`\n\n`unittest.mock` применяется для подмены реальных объектов в тестах: функций, методов, классов, внешних сервисов, файловой системы, API-клиентов, времени, переменных окружения и других зависимостей.\n\nГлавная задача — проверить логику своего кода изолированно, не вызывая реальные внешние зависимости. В официальной документации `unittest.mock` описан как библиотека для создания mock-объектов и временной подмены частей системы во время теста. \n\n### Основные задачи `unittest.mock`\n\n#### 1. Подмена внешних зависимостей\n\nНапример, код отправляет запрос во внешний API:\n\n```python\ndef get_user_name(api_client, user_id):\n    user = api_client.get_user(user_id)\n    return user[\"name\"]\n```\n\nВ тесте не нужно реально ходить во внешний сервис. Можно подменить `api_client`:\n\n```python\nfrom unittest.mock import Mock\n\n\ndef test_get_user_name():\n    api_client = Mock()\n    api_client.get_user.return_value = {\"name\": \"Alex\"}\n\n    result = get_user_name(api_client, 1)\n\n    assert result == \"Alex\"\n```\n\nЗдесь тест проверяет только функцию `get_user_name`, а не работу настоящего API.\n\n### 2. Проверка вызовов\n\n`mock` позволяет проверить, был ли метод вызван, сколько раз и с какими аргументами. Это полезно, когда результат функции — не только возвращаемое значение, но и действие.\n\n```python\nfrom unittest.mock import Mock\n\n\ndef send_notification(sender, user_id, text):\n    sender.send(user_id=user_id, message=text)\n\n\ndef test_send_notification():\n    sender = Mock()\n\n    send_notification(sender, 10, \"Hello\")\n\n    sender.send.assert_called_once_with(\n        user_id=10,\n        message=\"Hello\"\n    )\n```\n\nТо есть тест проверяет:\n\n```text\nметод send был вызван\nвызван ровно один раз\nполучил правильные аргументы\n```\n\nВ документации Python отдельно показано, что mock-объекты умеют записывать вызовы и позволяют делать assertions по тому, как они были использованы. \n\n### 3. Подмена функций через `patch`\n\n`patch()` временно заменяет объект на mock только на время теста. После теста оригинальный объект возвращается обратно.\n\nНапример, есть функция:\n\n```python\n# service.py\n\nimport requests\n\n\ndef get_status():\n    response = requests.get(\"https://example.com/status\")\n    return response.status_code\n```\n\nТест:\n\n```python\nfrom unittest.mock import patch\nfrom service import get_status\n\n\n@patch(\"service.requests.get\")\ndef test_get_status(mock_get):\n    mock_get.return_value.status_code = 200\n\n    result = get_status()\n\n    assert result == 200\n    mock_get.assert_called_once_with(\"https://example.com/status\")\n```\n\nЗдесь реальный HTTP-запрос не выполняется. `requests.get` временно заменён mock-объектом.\n\n`patch()` в `unittest.mock` используется именно для временной подмены объектов в нужном модуле; по умолчанию он создаёт `MagicMock`. \n\n### 4. Симуляция разных сценариев\n\nMock можно настроить так, чтобы он возвращал разные значения или выбрасывал исключения.\n\n```python\nfrom unittest.mock import Mock\n\n\ndef test_api_error():\n    api_client = Mock()\n    api_client.get_user.side_effect = ConnectionError(\"API unavailable\")\n\n    try:\n        api_client.get_user(1)\n    except ConnectionError as error:\n        assert str(error) == \"API unavailable\"\n```\n\nЭто нужно, чтобы проверять ошибки:\n\n```text\nAPI недоступен\nБД вернула ошибку\nфайл не найден\nRedis не отвечает\nтокен истёк\nплатёжный сервис отклонил запрос\n```\n\nБез mock такие ситуации сложно стабильно воспроизводить в тестах.\n\n### 5. Изоляция unit-тестов\n\nUnit-тест должен проверять маленький участок логики.\n\nНапример:\n\n```text\nплохо:\nтест сервиса регистрации реально пишет в БД,\nотправляет email,\nходит в Redis,\nсоздаёт JWT,\nобращается к внешнему API\n\nлучше:\nБД можно заменить тестовой БД,\nemail-сервис — mock-объектом,\nRedis — mock-объектом,\nвнешний API — mock-объектом\n```\n\nТак тест становится:\n\n```text\nбыстрее\nстабильнее\nизолированнее\nпроще для отладки\n```\n\n### 6. Тестирование кода с побочными эффектами\n\nПобочные эффекты — это действия вне самой функции:\n\n```text\nотправка email\nзапись файла\nHTTP-запрос\nзапись в лог\nпубликация сообщения в очередь\nобращение к S3/MinIO\nобращение к Redis\n```\n\nНапример:\n\n```python\ndef register_user(user_data, email_sender):\n    user = create_user(user_data)\n    email_sender.send_welcome_email(user.email)\n    return user\n```\n\nТест:\n\n```python\nfrom unittest.mock import Mock\n\n\ndef test_register_user_sends_email():\n    email_sender = Mock()\n\n    user = register_user(\n        {\"email\": \"test@example.com\"},\n        email_sender\n    )\n\n    email_sender.send_welcome_email.assert_called_once_with(\n        \"test@example.com\"\n    )\n```\n\nТест не отправляет настоящий email, но проверяет, что код попытался его отправить.\n\n### 7. Подмена классов\n\nИногда нужно подменить целый класс, который создаётся внутри функции.\n\n```python\n# service.py\n\nfrom payments import PaymentClient\n\n\ndef pay(order_id):\n    client = PaymentClient()\n    return client.charge(order_id)\n```\n\nТест:\n\n```python\nfrom unittest.mock import patch\nfrom service import pay\n\n\n@patch(\"service.PaymentClient\")\ndef test_pay(mock_payment_client):\n    instance = mock_payment_client.return_value\n    instance.charge.return_value = \"success\"\n\n    result = pay(100)\n\n    assert result == \"success\"\n    instance.charge.assert_called_once_with(100)\n```\n\nЗдесь `PaymentClient()` не создаёт реальный клиент. Вместо него используется mock.\n\n### 8. Подмена переменных окружения\n\nЧерез `patch.dict` можно временно заменить `os.environ`.\n\n```python\nimport os\nfrom unittest.mock import patch\n\n\ndef get_debug_mode():\n    return os.environ.get(\"DEBUG\") == \"1\"\n\n\ndef test_get_debug_mode():\n    with patch.dict(os.environ, {\"DEBUG\": \"1\"}):\n        assert get_debug_mode() is True\n```\n\nПосле выхода из `with` окружение возвращается в прежнее состояние.\n\n### Коротко\n\n`unittest.mock` нужен для того, чтобы:\n\n```text\nподменять зависимости\nне вызывать реальные внешние сервисы\nпроверять вызовы методов\nзадавать фейковые return_value\nсимулировать ошибки через side_effect\nизолировать unit-тесты\nделать тесты быстрее и стабильнее\n```\n\nГлавная идея:\n\n```text\nmock не тестирует настоящую зависимость,\nmock помогает проверить, как ваш код с этой зависимостью взаимодействует.\n```\n\nНапример:\n\n```text\nне проверяем, реально ли email ушёл\nпроверяем, что наш код вызвал email_sender.send(...) с правильными аргументами\n```"
  popularity = 2.63

[[questions]]
  id = 3
  question = "Что такое mock-объекты (моки) в тестировании?"
  answer = "### Что такое mock-объекты\n\nMock-объект, или мок, — это поддельный объект, который в тесте заменяет реальную зависимость.\n\nОн имитирует поведение настоящего объекта, но при этом не выполняет настоящую работу.\n\nНапример, вместо реального:\n\n```text\nHTTP-запроса\nзаписи в базу данных\nотправки email\nобращения к Redis\nзагрузки файла в S3/MinIO\nвызова платёжного сервиса\n```\n\nв тесте используется mock-объект.\n\nОфициальный модуль Python `unittest.mock` предназначен именно для замены частей тестируемой системы mock-объектами и проверки того, как эти mock-объекты были использованы. \n\n### Простая идея\n\nДопустим, есть функция:\n\n```python\ndef notify_user(email_sender, email):\n    email_sender.send(email)\n```\n\nВ реальном коде `email_sender.send()` может отправлять настоящее письмо.\n\nВ тесте это делать не нужно. Поэтому вместо реального `email_sender` передают mock:\n\n```python\nfrom unittest.mock import Mock\n\n\ndef test_notify_user():\n    email_sender = Mock()\n\n    notify_user(email_sender, \"test@example.com\")\n\n    email_sender.send.assert_called_once_with(\"test@example.com\")\n```\n\nЗдесь тест проверяет не отправку письма, а то, что наш код правильно вызвал зависимость.\n\n### Что умеет mock\n\nMock-объект обычно нужен для трёх задач.\n\n### 1. Возвращать заранее заданный результат\n\n```python\nfrom unittest.mock import Mock\n\n\napi_client = Mock()\napi_client.get_user.return_value = {\n    \"id\": 1,\n    \"name\": \"Alex\"\n}\n\nresult = api_client.get_user(1)\n\nassert result == {\n    \"id\": 1,\n    \"name\": \"Alex\"\n}\n```\n\nТо есть вместо настоящего API мы заранее задаём ответ.\n\n### 2. Проверять вызовы\n\nMock запоминает, какие методы у него вызывали, сколько раз и с какими аргументами. В документации Python это указано как один из типичных сценариев использования mock-объектов: запись вызовов и последующая проверка этих вызовов. \n\n```python\nsender = Mock()\n\nsender.send(\"Hello\")\n\nsender.send.assert_called_once_with(\"Hello\")\n```\n\nТак можно проверить:\n\n```text\nметод был вызван\nметод был вызван один раз\nметод получил правильные аргументы\n```\n\n### 3. Симулировать ошибку\n\n```python\nfrom unittest.mock import Mock\n\n\napi_client = Mock()\napi_client.get_user.side_effect = ConnectionError(\"API unavailable\")\n```\n\nТеперь при вызове:\n\n```python\napi_client.get_user(1)\n```\n\nбудет выброшено исключение `ConnectionError`.\n\nЭто полезно, когда нужно проверить обработку ошибок:\n\n```text\nсервис недоступен\nБД не отвечает\nRedis упал\nфайл не найден\nтокен невалиден\nвнешний API вернул ошибку\n```\n\n### Чем mock отличается от реального объекта\n\nРеальный объект выполняет настоящую работу:\n\n```text\nEmailSender.send() реально отправляет письмо\nS3Client.upload() реально загружает файл\nPaymentClient.charge() реально списывает деньги\nrequests.get() реально делает HTTP-запрос\n```\n\nMock-объект только имитирует это поведение:\n\n```text\nничего реально не отправляет\nничего реально не загружает\nникуда реально не обращается\nно позволяет проверить взаимодействие\n```\n\n### Пример с внешним API\n\nКод:\n\n```python\n# service.py\n\nimport requests\n\n\ndef get_status():\n    response = requests.get(\"https://example.com/status\")\n    return response.status_code\n```\n\nТест:\n\n```python\nfrom unittest.mock import patch\nfrom service import get_status\n\n\n@patch(\"service.requests.get\")\ndef test_get_status(mock_get):\n    mock_get.return_value.status_code = 200\n\n    result = get_status()\n\n    assert result == 200\n    mock_get.assert_called_once_with(\"https://example.com/status\")\n```\n\nЗдесь `requests.get` временно заменяется mock-объектом. В Python для такой временной подмены используется `patch()`, который заменяет объект на время теста и затем возвращает оригинал обратно. \n\n### Где mock особенно полезен\n\nMock-объекты применяются, когда тестируемый код зависит от чего-то внешнего:\n\n```text\nHTTP API\nбаза данных\nRedis\nRabbitMQ / Kafka\nemail-сервис\nфайловая система\nS3 / MinIO\nтекущее время\nпеременные окружения\nсторонние SDK\n```\n\nНапример, в backend-проекте mock часто используют для подмены:\n\n```text\nemail_sender\npayment_client\ns3_client\nredis_client\nexternal_api_client\njwt_service\nnotification_service\n```\n\n### Что именно проверяет тест с mock\n\nТест с mock обычно проверяет не реальную зависимость, а поведение вашего кода относительно этой зависимости.\n\nНапример:\n\n```text\nне проверяем, что письмо реально ушло\nпроверяем, что код вызвал send_email() с правильным email\n\nне проверяем, что S3 реально сохранил файл\nпроверяем, что upload_file() был вызван с правильным bucket/key\n\nне проверяем, что платёжный сервис реально списал деньги\nпроверяем, что charge() вызван с правильной суммой\n```\n\n### Главное отличие mock от обычной фикстуры\n\nФикстура подготавливает окружение или данные:\n\n```text\nсоздать пользователя\nподготовить тестовую БД\nсоздать тестовый файл\nвыдать авторизованный client\n```\n\nMock заменяет зависимость:\n\n```text\nзаменить внешний API\nзаменить email-сервис\nзаменить Redis\nзаменить S3-клиент\n```\n\nТо есть:\n\n```text\nfixture → готовит состояние\nmock    → имитирует зависимость\n```\n\n### Коротко\n\nMock-объект — это управляемая подделка реального объекта в тесте.\n\nОн нужен, чтобы:\n\n```text\nизолировать тестируемый код\nне обращаться к реальным внешним сервисам\nзадавать нужные return_value\nсимулировать ошибки через side_effect\nпроверять вызовы методов и аргументы\nделать unit-тесты быстрыми и стабильными\n```\n\nГлавная идея:\n\n```text\nmock не проверяет реальный сервис;\nmock проверяет, как ваш код с этим сервисом взаимодействует.\n```"
  popularity = 7.89

