  id = 13
  question = "Как версионируют сообщения и поддерживают несколько версий схемы в RabbitMQ?"
  answer = "### Кто отвечает за версионирование\n\nRabbitMQ сам не версионирует и не проверяет схемы сообщений. Для брокера тело сообщения и большая часть метаданных непрозрачны: RabbitMQ маршрутизирует байты, но не проверяет, соответствует ли JSON, Protobuf или Avro определённой версии схемы. Свойства `type`, `content_type` и пользовательские headers устанавливаются producer’ом и интерпретируются приложениями. \nПоэтому версионирование реализуется на уровне контракта между producer и consumer:\n\n```text\nProducer\n   |\n   | payment.completed, schema_version=2\n   v\nRabbitMQ\n   |\n   v\nConsumer\n   |\n   +--> обработчик v1\n   +--> обработчик v2\n   +--> неизвестная версия -> DLQ\n```\n\n### Формат сообщения с версией\n\nОбычно используют общий envelope:\n\n```json\n{\n  \"message_id\": \"01J4C9M7DP1BCQ6N5G6EXAMPLE\",\n  \"event_type\": \"payment.completed\",\n  \"event_version\": 2,\n  \"occurred_at\": \"2026-07-27T18:40:00Z\",\n  \"producer\": \"payment-service\",\n  \"data\": {\n    \"payment_id\": 451,\n    \"amount\": \"35.00\",\n    \"currency\": \"AZN\",\n    \"provider\": \"stripe\"\n  }\n}\n```\n\nВ свойствах AMQP:\n\n```text\ntype: payment.completed\ncontent_type: application/json\n\nheaders:\n    schema-version: 2\n    trace-id: trace-721\n```\n\nЛучше не полагаться только на RabbitMQ header. Версию полезно хранить внутри envelope, потому что тогда она остаётся частью самого сообщения при:\n\n- сохранении сообщения в БД;\n    \n- повторной публикации;\n    \n- записи в логи;\n    \n- тестировании без RabbitMQ;\n    \n- переносе в другой брокер;\n    \n- ручном анализе сообщений из DLQ.\n    \n\nHeader можно продублировать для фильтрации, мониторинга или маршрутизации.\n\n### Версия события и версия сериализации\n\nЭто разные понятия.\n\n```json\n{\n  \"event_type\": \"payment.completed\",\n  \"event_version\": 2\n}\n```\n\n`event_version` описывает бизнес-контракт события.\n\n```text\ncontent_type: application/json\ncontent_encoding: gzip\n```\n\n`content_type` и `content_encoding` описывают способ представления payload. RabbitMQ рекомендует использовать эти свойства, чтобы consumer понимал, как декодировать сообщение, но сам брокер их не валидирует. \n\nНапример:\n\n```text\nevent_type:      payment.completed\nevent_version:   2\ncontent_type:    application/x-protobuf\n```\n\nВерсия Protobuf-файла и версия бизнес-события также могут не совпадать.\n\n### Основная стратегия: обратно совместимые изменения\n\nЛучший вариант — не создавать новую версию при каждом добавлении поля.\n\nДопустим, первая версия была такой:\n\n```json\n{\n  \"payment_id\": 451,\n  \"amount\": \"35.00\"\n}\n```\n\nНовая версия producer’а добавила поле:\n\n```json\n{\n  \"payment_id\": 451,\n  \"amount\": \"35.00\",\n  \"currency\": \"AZN\"\n}\n```\n\nИзменение можно считать обратно совместимым, если старый consumer:\n\n- игнорирует неизвестные поля;\n    \n- не требует строгого совпадения набора полей;\n    \n- продолжает правильно понимать старые поля.\n    \n\nВ этом случае отдельный `event_version=2` может даже не понадобиться, если семантика события не изменилась.\n\nДля JSON consumer можно сделать допускающим дополнительные поля:\n\n```python\nfrom decimal import Decimal\n\nfrom pydantic import BaseModel, ConfigDict\n\n\nclass PaymentCompleted(BaseModel):\n    model_config = ConfigDict(extra=\"ignore\")\n\n    payment_id: int\n    amount: Decimal\n    currency: str = \"AZN\"\n```\n\nТакой consumer прочитает и старое сообщение без `currency`, и новое сообщение с дополнительными полями.\n\n### Какие изменения обычно безопасны\n\nКак правило, совместимыми можно сделать:\n\n- добавление необязательного поля;\n    \n- добавление поля со значением по умолчанию;\n    \n- добавление нового значения enum, если consumers умеют обрабатывать неизвестные значения;\n    \n- добавление новой необязательной вложенной структуры;\n    \n- расширение метаданных сообщения.\n    \n\nПример:\n\n```json\n{\n  \"event_type\": \"payment.completed\",\n  \"event_version\": 1,\n  \"data\": {\n    \"payment_id\": 451,\n    \"amount\": \"35.00\",\n    \"currency\": \"AZN\",\n    \"metadata\": {\n      \"provider\": \"stripe\"\n    }\n  }\n}\n```\n\nПри этом consumer не должен падать только потому, что появился `metadata`.\n\n### Какие изменения являются ломающими\n\nЛомающими обычно являются:\n\n- удаление обязательного поля;\n    \n- переименование поля;\n    \n- изменение типа поля;\n    \n- изменение единиц измерения;\n    \n- изменение смысла существующего поля;\n    \n- перемещение поля в другую структуру;\n    \n- изменение формата даты;\n    \n- изменение значения enum с сохранением старого имени;\n    \n- изменение события с факта на команду.\n    \n\nНапример, это опасное изменение:\n\n```json\n{\n  \"amount\": 3500\n}\n```\n\nРаньше:\n\n```text\namount = сумма в манатах\n```\n\nТеперь:\n\n```text\namount = сумма в гяпиках\n```\n\nJSON-тип не изменился, но семантика стала другой. Такое изменение должно получить новую версию или новое название поля:\n\n```json\n{\n  \"amount_minor\": 3500,\n  \"currency\": \"AZN\"\n}\n```\n\n### Когда повышать версию\n\nНовую major-версию стоит создавать, когда старый consumer не может правильно обработать новое сообщение.\n\nНапример:\n\n#### Версия 1\n\n```json\n{\n  \"event_type\": \"payment.completed\",\n  \"event_version\": 1,\n  \"data\": {\n    \"payment_id\": 451,\n    \"amount\": \"35.00\"\n  }\n}\n```\n\n#### Версия 2\n\n```json\n{\n  \"event_type\": \"payment.completed\",\n  \"event_version\": 2,\n  \"data\": {\n    \"payment\": {\n      \"id\": 451,\n      \"amount_minor\": 3500,\n      \"currency\": \"AZN\"\n    },\n    \"provider\": {\n      \"name\": \"stripe\",\n      \"transaction_id\": \"txn-281\"\n    }\n  }\n}\n```\n\nConsumer должен явно выбрать подходящий обработчик:\n\n```python\nfrom collections.abc import Callable\nfrom typing import Any\n\n\nclass UnsupportedEventVersion(Exception):\n    pass\n\n\ndef handle_payment_completed_v1(data: dict[str, Any]) -> None:\n    ...\n\n\ndef handle_payment_completed_v2(data: dict[str, Any]) -> None:\n    ...\n\n\nHANDLERS: dict[int, Callable[[dict[str, Any]], None]] = {\n    1: handle_payment_completed_v1,\n    2: handle_payment_completed_v2,\n}\n\n\ndef consume(message: dict[str, Any]) -> None:\n    version = message[\"event_version\"]\n\n    handler = HANDLERS.get(version)\n    if handler is None:\n        raise UnsupportedEventVersion(\n            f\"Unsupported payment.completed version: {version}\"\n        )\n\n    handler(message[\"data\"])\n```\n\n### Upcasting: приведение старых версий к текущей\n\nЧасто бизнес-логика работает только с одной внутренней моделью. Старые сообщения сначала преобразуются в текущий формат.\n\n```text\nСообщение v1\n     |\n     v\nupcast v1 -> v2\n     |\n     v\nТекущая модель v2\n     |\n     v\nОбщий обработчик\n```\n\nПример:\n\n```python\nfrom decimal import Decimal\nfrom typing import Any\n\n\nCURRENT_VERSION = 2\n\n\ndef upcast_v1_to_v2(message: dict[str, Any]) -> dict[str, Any]:\n    old_data = message[\"data\"]\n\n    return {\n        **message,\n        \"event_version\": 2,\n        \"data\": {\n            \"payment\": {\n                \"id\": old_data[\"payment_id\"],\n                \"amount\": Decimal(old_data[\"amount\"]),\n                \"currency\": old_data.get(\"currency\", \"AZN\"),\n            },\n            \"provider\": None,\n        },\n    }\n\n\ndef normalize_message(message: dict[str, Any]) -> dict[str, Any]:\n    version = message[\"event_version\"]\n\n    if version == 1:\n        return upcast_v1_to_v2(message)\n\n    if version == CURRENT_VERSION:\n        return message\n\n    raise UnsupportedEventVersion(\n        f\"Unsupported version: {version}\"\n    )\n```\n\nПосле нормализации бизнес-обработчик не содержит ветвлений:\n\n```python\ndef process_payment_completed(message: dict[str, Any]) -> None:\n    normalized = normalize_message(message)\n\n    payment = normalized[\"data\"][\"payment\"]\n\n    update_payment_status(\n        payment_id=payment[\"id\"],\n        amount=payment[\"amount\"],\n        currency=payment[\"currency\"],\n    )\n```\n\nПреимущество upcasting — старая совместимость сосредоточена в одном месте, а не распространяется по всей бизнес-логике.\n\n### Где указывать версию\n\nЕсть несколько вариантов.\n\n#### Версия внутри payload\n\n```json\n{\n  \"event_type\": \"order.created\",\n  \"event_version\": 2,\n  \"data\": {}\n}\n```\n\nЭто наиболее универсальный вариант.\n\n#### Версия в AMQP header\n\n```text\nheaders:\n    event-version: 2\n```\n\nУдобно для технической обработки, но лучше дублировать её в payload.\n\n#### Версия в свойстве `type`\n\n```text\ntype: order.created.v2\n```\n\nRabbitMQ разрешает приложениям использовать произвольные значения `type`, но брокер сам их не проверяет. \n\nНедостаток: логическое имя события и версия смешиваются:\n\n```text\norder.created.v1\norder.created.v2\norder.created.v3\n```\n\nОбычно чище хранить:\n\n```text\ntype: order.created\nheader event-version: 2\n```\n\n#### Версия в routing key\n\n```text\norder.created.v1\norder.created.v2\n```\n\nЭто имеет смысл, когда разные версии должны маршрутизироваться в разные очереди:\n\n```text\norders exchange\n    |\n    +-- order.created.v1 --> legacy_order_queue\n    |\n    +-- order.created.v2 --> current_order_queue\n```\n\nНо при такой схеме новая версия может случайно не попасть в существующие очереди, если bindings не были обновлены.\n\n### Один routing key или разные\n\n#### Один routing key\n\n```text\nrouting_key: payment.completed\n```\n\nВерсия находится в сообщении:\n\n```json\n{\n  \"event_version\": 2\n}\n```\n\nПреимущества:\n\n- стабильная топология RabbitMQ;\n    \n- проще добавлять совместимые версии;\n    \n- consumer сам выбирает обработчик;\n    \n- меньше exchanges, queues и bindings.\n    \n\nЭто хороший вариант по умолчанию.\n\n#### Версия в routing key\n\n```text\npayment.completed.v1\npayment.completed.v2\n```\n\nПреимущества:\n\n- версии можно направлять разным consumers;\n    \n- проще полностью изолировать старую реализацию;\n    \n- consumer не получает неподдерживаемую версию.\n    \n\nНедостатки:\n\n- усложняются bindings;\n    \n- каждую новую версию нужно подключать явно;\n    \n- возможно дублирование очередей;\n    \n- сложнее миграции нескольких consumers.\n    \n\nТакой подход полезен при действительно несовместимых поколениях системы.\n\n### Разные очереди для разных версий\n\nИногда используют отдельные очереди:\n\n```text\npayment.completed.v1.queue\npayment.completed.v2.queue\n```\n\nЭто оправдано, когда:\n\n- старая версия будет поддерживаться долго;\n    \n- разные версии обрабатываются разными приложениями;\n    \n- требуется независимое масштабирование;\n    \n- миграция выполняется постепенно;\n    \n- у версий разные SLA или политики retry.\n    \n\nДля небольшого изменения схемы создание новой очереди обычно избыточно. Очередь решает задачу доставки и изоляции, но не заменяет нормальную совместимость контрактов.\n\n### Dual publishing\n\nПри крупной миграции producer временно публикует две версии:\n\n```text\nProducer\n   |\n   +--> payment.completed.v1\n   |\n   +--> payment.completed.v2\n```\n\nПорядок миграции:\n\n```text\n1. Развернуть consumers, понимающие v2.\n2. Начать публиковать v1 и v2 одновременно.\n3. Перевести всех consumers на v2.\n4. Проверить, что старые сообщения и очереди обработаны.\n5. Прекратить публикацию v1.\n6. Через установленный срок удалить поддержку v1.\n```\n\nУ dual publishing есть важный риск: две публикации могут разойтись.\n\n```text\nv1 успешно опубликована\nv2 не опубликована\n```\n\nПоэтому для надёжной публикации обычно применяют transactional outbox и publisher confirms, а consumers делают идемпотентными.\n\nТакже нельзя позволять одному consumer обработать обе версии одного и того же бизнес-события как две независимые операции. Обе версии должны иметь одинаковый логический идентификатор:\n\n```json\n{\n  \"message_id\": \"payment-451-completed\",\n  \"event_version\": 2\n}\n```\n\n### Новая версия или новое событие\n\nВерсию повышают, когда сохраняется тот же бизнес-факт:\n\n```text\npayment.completed v1\npayment.completed v2\n```\n\nНовое событие создают, когда изменился сам смысл:\n\n```text\npayment.completed\npayment.settled\npayment.refunded\npayment.chargeback.opened\n```\n\nНе стоит превращать одно событие в универсальный контейнер:\n\n```json\n{\n  \"event_type\": \"payment.changed\",\n  \"status\": \"something\"\n}\n```\n\nРазные бизнес-факты лучше выражать разными названиями событий.\n\n### JSON, Protobuf и Avro\n\n#### JSON\n\nДля JSON обычно используют:\n\n- JSON Schema;\n    \n- версию в envelope;\n    \n- проверку схемы producer’ом и consumer’ом;\n    \n- хранение схем в отдельном репозитории или registry;\n    \n- правила обратной совместимости в CI.\n    \n\nRabbitMQ не выполняет JSON Schema validation автоматически.\n\nПример структуры репозитория:\n\n```text\nschemas/\n└── payment/\n    └── completed/\n        ├── v1.json\n        └── v2.json\n```\n\n#### Protobuf\n\nProtobuf предоставляет собственные правила эволюции бинарной схемы. Например, нельзя изменять номер существующего поля: для wire format это эквивалентно удалению старого поля и добавлению нового. Совместимые изменения должны следовать правилам обновления message type. \n\n```protobuf\nmessage PaymentCompleted {\n  int64 payment_id = 1;\n  string amount = 2;\n  string currency = 3;\n}\n```\n\nУдалённый номер нельзя использовать повторно:\n\n```protobuf\nmessage PaymentCompleted {\n  reserved 2;\n  reserved \"amount\";\n\n  int64 payment_id = 1;\n  int64 amount_minor = 4;\n  string currency = 3;\n}\n```\n\nПри этом полезно всё равно иметь бизнес-версию события:\n\n```protobuf\nmessage EventEnvelope {\n  string event_id = 1;\n  string event_type = 2;\n  uint32 event_version = 3;\n  bytes payload = 4;\n}\n```\n\nСовместимость wire format не гарантирует совместимость бизнес-смысла.\n\n#### Avro\n\nAvro поддерживает разделение writer schema и reader schema. Consumer читает сообщение, зная схему producer’а, и сопоставляет её со своей схемой по правилам schema resolution. Это позволяет, например, добавлять поля со значениями по умолчанию. \n\nДля RabbitMQ при использовании Avro в сообщении обычно передают идентификатор схемы:\n\n```text\nheaders:\n    schema-id: 842\n```\n\nConsumer получает соответствующую writer schema из schema registry и декодирует payload своей reader schema.\n\n### Что делать с неизвестной версией\n\nConsumer не должен:\n\n```text\nполучить неизвестную версию\n        |\n        v\nnack(requeue=True)\n        |\n        v\nснова получить то же сообщение\n        |\n        v\nбесконечный цикл\n```\n\nНеизвестная версия обычно является постоянной, а не временной ошибкой.\n\nКорректнее:\n\n1. записать ошибку с `message_id`, `event_type` и версией;\n    \n2. отправить `basic.nack(requeue=False)`;\n    \n3. направить сообщение в DLQ;\n    \n4. поднять метрику или alert;\n    \n5. после обновления consumer повторно опубликовать сообщение.\n    \n\nПри `basic.reject` или `basic.nack` с `requeue=false` RabbitMQ направляет сообщение в Dead Letter Exchange, если он настроен. \n\n```python\ntry:\n    process_message(message)\n\nexcept UnsupportedEventVersion:\n    logger.exception(\n        \"Unsupported message version\",\n        extra={\n            \"message_id\": message.get(\"message_id\"),\n            \"event_type\": message.get(\"event_type\"),\n            \"event_version\": message.get(\"event_version\"),\n        },\n    )\n\n    channel.basic_nack(\n        delivery_tag=method.delivery_tag,\n        requeue=False,\n    )\n```\n\n### Безопасный порядок развёртывания\n\nПри переходе с v1 на v2 порядок должен быть таким:\n\n```text\n1. Consumer начинает понимать v1 и v2.\n2. Развёртываются все обновлённые consumers.\n3. Producer начинает отправлять v2.\n4. Контролируются DLQ, ошибки и количество сообщений v1/v2.\n5. Producer прекращает отправлять v1.\n6. Ожидается обработка старых сообщений из очередей.\n7. Удаляется поддержка v1.\n```\n\nОпасный порядок:\n\n```text\n1. Producer начал отправлять v2.\n2. Старые consumers ещё понимают только v1.\n3. Сообщения уходят в ошибки или DLQ.\n```\n\nConsumer желательно обновлять раньше producer’а.\n\n### Практическая схема\n\nДля большинства систем достаточно следующего подхода:\n\n```json\n{\n  \"message_id\": \"01J4C9M7DP1BCQ6N5G6EXAMPLE\",\n  \"event_type\": \"payment.completed\",\n  \"event_version\": 2,\n  \"occurred_at\": \"2026-07-27T18:40:00Z\",\n  \"producer\": \"payment-service\",\n  \"data\": {}\n}\n```\n\nПравила:\n\n```text\n1. event_type остаётся стабильным.\n2. event_version повышается только при ломающем изменении.\n3. Новые необязательные поля добавляются без новой major-версии.\n4. Consumer некоторое время поддерживает текущую и предыдущую версии.\n5. Старые версии преобразуются через upcaster.\n6. Неизвестные версии отправляются в DLQ.\n7. Схемы хранятся централизованно и проверяются в CI.\n8. Producer обновляется после consumers.\n9. Изменение бизнес-смысла оформляется новым event_type.\n10. Старые версии удаляются только после гарантированного истечения backlog и retention.\n```\n\nГлавное правило: версия нужна не потому, что изменилась структура JSON, а потому, что старый consumer больше не может корректно понять новое сообщение."
  popularity = 2.63

