  question = "Гарантии доставки сообщений в брокерах"
  answer = "### Что означают гарантии доставки\n\nГарантия доставки описывает, сколько раз сообщение может быть передано и обработано при сбоях:\n\n```text\nProducer → Broker → Consumer → БД / внешний сервис\n```\n\nОбычно выделяют три семантики:\n\n|Семантика|Потеря сообщения|Повторная обработка|\n|---|--:|--:|\n|`at-most-once`|Возможна|Нет|\n|`at-least-once`|Минимизируется|Возможна|\n|`exactly-once`|Нет|Нет видимого повторного эффекта|\n\nВажно различать:\n\n```text\nдоставка сообщения\n≠\nвыполнение бизнес-операции\n```\n\nБрокер может гарантировать передачу сообщения Consumer-у, но не способен автоматически гарантировать, что запись в PostgreSQL, платёж или HTTP-запрос во внешнюю систему произошли ровно один раз.\n\n---\n\n### At-most-once — не более одного раза\n\nСообщение обрабатывается максимум один раз:\n\n```text\nсообщение потеряно\nили\nобработано один раз\n```\n\nПовторная доставка не выполняется.\n\nПример:\n\n```text\nBroker передал сообщение\n        ↓\nсразу считает его обработанным\n        ↓\nConsumer упал до выполнения операции\n        ↓\nсообщение потеряно\n```\n\nВ RabbitMQ это близко к автоматическому подтверждению:\n\n```text\nauto_ack=True\n```\n\nПри automatic acknowledgement RabbitMQ считает сообщение успешно доставленным после отправки его Consumer-у, не ожидая подтверждения успешной обработки. Это обеспечивает высокую скорость, но при обрыве соединения или падении Consumer-а сообщение может быть потеряно. \n\nТакая модель подходит для некритичных данных:\n\n```text\nметрики;\nчасть логов;\nвременные обновления интерфейса;\nтелеметрия, потеря которой допустима.\n```\n\nОна не подходит для платежей, заказов, изменения баланса и других критичных операций.\n\n---\n\n### At-least-once — хотя бы один раз\n\nСистема стремится не потерять сообщение, но допускает повторную доставку:\n\n```text\nсообщение обработано один раз\nили\nсообщение обработано несколько раз\n```\n\nТипичный сценарий:\n\n```text\n1. Consumer получил сообщение\n2. Consumer изменил данные в БД\n3. Consumer упал до отправки ACK\n4. Broker не получил подтверждение\n5. Broker доставил сообщение повторно\n6. Операция выполняется второй раз\n```\n\nRabbitMQ автоматически возвращает неподтверждённые сообщения в очередь при закрытии канала или соединения. Поэтому ручные acknowledgements обеспечивают повторную доставку, но создают возможность дубликатов.\n\nЭто наиболее распространённая модель для очередей задач:\n\n```text\nлучше получить дубликат,\nчем полностью потерять задачу\n```\n\nAmazon SQS Standard также официально предоставляет `at-least-once`: копия сообщения иногда может быть получена повторно, поэтому AWS требует проектировать Consumer-ы идемпотентными. \n\n---\n\n### Exactly-once — ровно один раз\n\nНа практике термин `exactly-once` часто понимают неправильно.\n\nНедостаточно сделать так, чтобы Broker отправил сообщение Consumer-у один раз. Нужно гарантировать, что **весь наблюдаемый бизнес-эффект** произошёл ровно один раз:\n\n```text\nполучить сообщение\n        +\nизменить БД\n        +\nотправить следующее событие\n        +\nподтвердить сообщение\n```\n\nВсе эти действия должны быть согласованы.\n\nПроблема возникает в критическом промежутке:\n\n```text\nConsumer изменил PostgreSQL\n        ↓\nConsumer должен отправить ACK\n```\n\nЕсли Consumer упал между этими действиями, Broker не знает, завершилась ли бизнес-операция:\n\n```text\nБД обновлена\nACK не получен\n        ↓\nповторная доставка\n```\n\nЕсли изменить порядок:\n\n```text\nсначала ACK\nпотом обновить БД\n```\n\nто возникает противоположная проблема:\n\n```text\nACK отправлен\nConsumer упал\nБД не обновлена\n        ↓\nсообщение потеряно\n```\n\nПоэтому обычная очередь плюс обычная БД не дают настоящей сквозной `exactly-once` семантики автоматически.\n\nApache Kafka поддерживает транзакционную `exactly-once` обработку для сценария, где приложение читает из Kafka, обрабатывает данные и записывает результат обратно в Kafka. Но сама документация Kafka подчёркивает, что подобные гарантии имеют конкретные границы и не автоматически распространяются на произвольные внешние базы и системы. \n\nНа уровне бизнес-приложения обычно реализуют не физическое «доставить один раз», а:\n\n```text\nдоставлять at-least-once\n+\nобрабатывать идемпотентно\n=\nэффект exactly-once\n```\n\n---\n\n### Гарантия состоит из нескольких участков\n\nНельзя настроить только одну опцию Broker-а и получить надёжную доставку.\n\nПолный путь:\n\n```text\n1. Producer создал сообщение\n2. Сообщение дошло до Broker-а\n3. Broker сохранил сообщение\n4. Broker передал его Consumer-у\n5. Consumer выполнил бизнес-операцию\n6. Consumer подтвердил обработку\n```\n\nДля каждого участка нужны отдельные механизмы.\n\n---\n\n### Producer → Broker: publisher confirms\n\nОбычный вызов публикации ещё не означает, что Broker принял сообщение.\n\n```text\nProducer отправил сообщение\n        ↓\nсоединение оборвалось\n        ↓\nнеизвестно:\nBroker получил сообщение или нет\n```\n\nВ RabbitMQ для этого используются `publisher confirms`:\n\n```text\nProducer → RabbitMQ: сообщение\nRabbitMQ → Producer: confirm\n```\n\nConfirm означает, что RabbitMQ принял ответственность за сообщение. Для persistent-сообщения в durable-очереди подтверждение отправляется после сохранения сообщения; для quorum queue — после принятия сообщения кворумом реплик. \n\nОднако потеря самого подтверждения всё равно возможна:\n\n```text\nRabbitMQ сохранил сообщение\nRabbitMQ отправил confirm\nсоединение разорвалось\nProducer confirm не получил\n        ↓\nProducer публикует сообщение повторно\n```\n\nRabbitMQ прямо указывает, что повторная публикация неподтверждённых сообщений может приводить к дубликатам.\n\nПоэтому Producer тоже должен использовать:\n\n```text\nmessage_id;\nevent_id;\nidempotency key;\nтаблицу outbox.\n```\n\n---\n\n### Сохранность внутри Broker-а\n\nЧтобы сообщение переживало перезапуск RabbitMQ, обычно нужны одновременно:\n\n```text\ndurable queue;\npersistent message;\npublisher confirms.\n```\n\nОдна durable-очередь недостаточна: она сохраняет определение очереди, но сообщения также должны публиковаться как persistent. Publisher confirms позволяют Producer-у узнать, когда RabbitMQ принял ответственность за сообщение. \n\nДля повышенной отказоустойчивости RabbitMQ предоставляет quorum queues. Confirm для такой очереди отправляется после репликации сообщения на кворум узлов. \n\nСхема:\n\n```text\nProducer\n   │ persistent message\n   ▼\nQuorum Queue\n├── replica 1\n├── replica 2\n└── replica 3\n   │\n   ▼\npublisher confirm\n```\n\nЭто защищает от некоторых отказов Broker-а, но не устраняет дубликаты на уровне Consumer-а.\n\n---\n\n### Broker → Consumer: acknowledgements\n\nConsumer acknowledgements сообщают RabbitMQ, когда сообщение можно удалить.\n\n#### ACK после успешной операции\n\n```python\ndef handle(message):\n    process(message)\n    channel.basic_ack(message.delivery_tag)\n```\n\nЭто приближает систему к `at-least-once`:\n\n```text\nуспех → ACK → сообщение удаляется\nсбой до ACK → сообщение доставляется повторно\n```\n\nRabbitMQ рекомендует manual acknowledgements, когда необработанные сообщения должны возвращаться в очередь и повторно обрабатываться другим Consumer-ом. \n\n#### NACK или reject\n\nПри ошибке Consumer может:\n\n```text\nACK                  → удалить сообщение;\nNACK + requeue       → вернуть в очередь;\nNACK без requeue     → удалить или направить в DLQ.\n```\n\nБесконечно возвращать неисправное сообщение в ту же очередь опасно:\n\n```text\nполучение → ошибка → requeue → получение → ошибка → ...\n```\n\nПоэтому обычно применяют:\n\n```text\nretry queue;\nограниченное число повторов;\nexponential backoff;\nDead Letter Queue.\n```\n\n---\n\n### Идемпотентный Consumer\n\nДля `at-least-once` Consumer должен выдерживать повторную доставку.\n\nПример таблицы дедупликации:\n\n```sql\nCREATE TABLE processed_messages (\n    consumer_name TEXT NOT NULL,\n    message_id UUID NOT NULL,\n    processed_at TIMESTAMPTZ NOT NULL DEFAULT now(),\n\n    PRIMARY KEY (consumer_name, message_id)\n);\n```\n\nОбработка выполняется в одной локальной транзакции:\n\n```python\ndef handle_message(message: Message) -> None:\n    with database.transaction():\n        inserted = processed_messages.try_insert(\n            consumer_name=\"payment_consumer\",\n            message_id=message.id,\n        )\n\n        if not inserted:\n            return\n\n        payment_service.apply_result(\n            payment_id=message.payment_id,\n            status=message.status,\n        )\n```\n\n```text\nпервая доставка:\nmessage_id отсутствует → операция выполняется\n\nповторная доставка:\nmessage_id уже существует → операция пропускается\n```\n\nКлючевой момент: запись о дедупликации и бизнес-изменение должны находиться в одной транзакции.\n\nПлохо:\n\n```python\nmark_as_processed(message.id)\nupdate_payment(message)\n```\n\nЕсли процесс упадёт между вызовами, сообщение будет считаться обработанным, хотя бизнес-операция не завершилась.\n\n---\n\n### Transactional Outbox на стороне Producer-а\n\nПроблема Producer-а:\n\n```python\nsave_order(order)\npublish_event(\"OrderCreated\", order.id)\n```\n\nВозможен сбой:\n\n```text\nзаказ сохранён\nсобытие не опубликовано\n```\n\nЛибо обратный порядок:\n\n```text\nсобытие опубликовано\nзаказ не сохранён\n```\n\nTransactional Outbox решает это через одну транзакцию БД:\n\n```python\nwith database.transaction():\n    save_order(order)\n\n    outbox_repository.add(\n        event_id=uuid4(),\n        event_type=\"OrderCreated\",\n        payload={\"order_id\": str(order.id)},\n    )\n```\n\nОтдельный Publisher читает outbox и отправляет события в Broker:\n\n```text\nБизнес-транзакция\n├── orders\n└── outbox\n\nOutbox Worker\n      ↓\nRabbitMQ\n```\n\nPublisher может отправить одно событие повторно, например если RabbitMQ принял сообщение, но confirm потерялся. Поэтому `event_id` остаётся необходимым для дедупликации Consumer-а.\n\n---\n\n### Celery и гарантии доставки\n\nПо умолчанию Celery обычно подтверждает задачу до её фактического выполнения. Это снижает риск повторного выполнения, но задача может быть потеряна, если Worker упадёт после ACK и до завершения работы.\n\nДля идемпотентных задач можно включить позднее подтверждение:\n\n```python\n@app.task(\n    acks_late=True,\n)\ndef process_order(order_id: int) -> None:\n    ...\n```\n\nТогда задача подтверждается после возврата из task, что приближает обработку к `at-least-once`. Документация Celery прямо требует идемпотентности для задач с `acks_late`.\n\nНо есть важная особенность: даже при `acks_late=True` Celery по умолчанию может подтвердить задачу, если дочерний процесс Worker-а аварийно завершился или был принудительно остановлен. Для возврата такой задачи в очередь существует:\n\n```python\ntask_reject_on_worker_lost = True\n```\n\nCelery предупреждает, что эта настройка может вызвать бесконечные циклы повторной доставки. \n\nПрактическая конфигурация для критичных идемпотентных задач:\n\n```python\napp.conf.update(\n    task_acks_late=True,\n    task_reject_on_worker_lost=True,\n)\n```\n\nНо конфигурация сама по себе не заменяет:\n\n```text\nидемпотентность;\nограничение retries;\nтайм-ауты;\nDLQ;\npublisher confirms;\nнадёжный Broker;\nTransactional Outbox.\n```\n\n---\n\n### Практическое сравнение\n\n#### At-most-once\n\n```text\nACK до обработки\n```\n\nПлюсы:\n\n```text\nнет повторного выполнения;\nпростая обработка;\nменьше накладных расходов.\n```\n\nМинус:\n\n```text\nпри сбое возможна потеря сообщения.\n```\n\n#### At-least-once\n\n```text\nобработка → commit → ACK\n```\n\nПлюсы:\n\n```text\nсообщение не теряется при обычном падении Consumer-а;\nможно повторить временно неуспешную операцию.\n```\n\nМинусы:\n\n```text\nвозможны дубликаты;\nнужна идемпотентность;\nнужна дедупликация.\n```\n\n#### Exactly-once effect\n\n```text\nat-least-once delivery\n+\ntransactional inbox / idempotency\n+\ntransactional outbox\n```\n\nПлюс:\n\n```text\nповторная доставка не создаёт повторного бизнес-эффекта.\n```\n\nМинус:\n\n```text\nсущественно сложнее;\nтребует хранения идентификаторов;\nтребует транзакционной дисциплины;\nне всегда возможно для внешних систем.\n```\n\n---\n\n### Что выбирать\n\nДля большинства бизнес-систем разумная цель:\n\n```text\nat-least-once доставка\n+\nидемпотентные Consumer-ы\n+\nOutbox у Producer-а\n+\nInbox/deduplication у Consumer-а\n```\n\nИтоговая схема:\n\n```text\nProducer DB transaction\n├── business data\n└── outbox event\n        ↓\nOutbox Publisher\n        ↓ publisher confirm\nRabbitMQ durable/quorum queue\n        ↓ manual delivery\nConsumer transaction\n├── processed_messages\n└── business changes\n        ↓\nACK\n```\n\nЭто не означает, что пакет физически никогда не будет отправлен повторно. Это означает, что повторная доставка не изменит бизнес-результат второй раз.\n\n### Главное правило\n\n```text\nAt-most-once:\nможно потерять, нельзя повторить.\n\nAt-least-once:\nнельзя терять, можно повторить.\n\nExactly-once:\nобычно достигается не брокером,\nа идемпотентной и транзакционной обработкой\nповерх at-least-once доставки.\n```"
