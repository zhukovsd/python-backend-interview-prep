  question = "Что такое Celery app и зачем он нужен?"
  answer = "### Что такое Celery app\n\n`Celery app` — это экземпляр класса `Celery`, который является центральным объектом конфигурации и управления Celery в приложении.\n\n```python\nfrom celery import Celery\n\ncelery_app = Celery(\n    \"my_project\",\n    broker=\"amqp://guest:guest@localhost:5672//\",\n    backend=\"redis://localhost:6379/0\",\n)\n```\n\nCelery необходимо создать такой экземпляр перед использованием. В официальной документации он называется Celery application, или сокращённо app. Через него создаются задачи, загружается конфигурация и запускаются компоненты Celery. \n\nУпрощённо Celery app можно представить как центральный контейнер:\n\n```text\nCelery app\n├── конфигурация\n├── реестр задач\n├── настройки брокера\n├── настройки result backend\n├── сериализация\n├── маршрутизация\n├── управление workers\n└── служебные компоненты Celery\n```\n\n### Celery app — не broker и не worker\n\nНужно различать три сущности:\n\n```text\nCelery app\n    Конфигурация и программный интерфейс Celery.\n\nBroker\n    RabbitMQ, Redis или другой транспорт сообщений.\n\nWorker\n    Отдельный процесс, получающий и выполняющий задачи.\n```\n\nСхема взаимодействия:\n\n```text\nWeb-приложение\n      |\n      | использует Celery app\n      v\nRabbitMQ\n      |\n      | сообщение о задаче\n      v\nCelery worker\n      |\n      | загружает тот же Celery app\n      v\nВыполняет зарегистрированную задачу\n```\n\nCelery app хранит информацию о том, через какой broker отправлять задачи и где, при необходимости, хранить их результаты. Сам экземпляр `Celery` не является очередью и самостоятельно не выполняет фоновые задачи. \n\n### Зачем нужен Celery app\n\n### 1. Хранит конфигурацию\n\nНастройки доступны через:\n\n```python\ncelery_app.conf\n```\n\nНапример:\n\n```python\ncelery_app.conf.update(\n    task_serializer=\"json\",\n    result_serializer=\"json\",\n    accept_content=[\"json\"],\n    timezone=\"Asia/Baku\",\n    enable_utc=True,\n    task_track_started=True,\n)\n```\n\nЧерез конфигурацию задаются:\n\n- адрес broker;\n    \n- result backend;\n    \n- сериализаторы;\n    \n- очереди и маршрутизация;\n    \n- подтверждение задач;\n    \n- prefetch;\n    \n- time limits;\n    \n- retry;\n    \n- timezone;\n    \n- параметры Celery Beat;\n    \n- параметры результатов.\n    \n\nКонфигурацию можно устанавливать непосредственно на app или загружать из отдельного модуля через `config_from_object()`. Celery рекомендует централизовать настройки, особенно маршрутизацию и периодические задачи. \n\nПример:\n\n```python\n# celery_app.py\n\nfrom celery import Celery\n\ncelery_app = Celery(\"my_project\")\ncelery_app.config_from_object(\"app.config.celery\")\n```\n\n```python\n# app/config/celery.py\n\nbroker_url = \"amqp://guest:guest@rabbitmq:5672//\"\nresult_backend = \"redis://redis:6379/0\"\n\ntask_serializer = \"json\"\nresult_serializer = \"json\"\naccept_content = [\"json\"]\n\ntimezone = \"Asia/Baku\"\nenable_utc = True\n```\n\n### 2. Хранит реестр задач\n\nКаждая Celery-задача регистрируется в конкретном Celery app:\n\n```python\n@celery_app.task\ndef add(x: int, y: int) -> int:\n    return x + y\n```\n\nПосле регистрации:\n\n```python\nprint(add.name)\n# app.tasks.add\n\nprint(celery_app.tasks[\"app.tasks.add\"])\n# <@task: app.tasks.add>\n```\n\nПри отправке в RabbitMQ передаётся не исходный Python-код функции, а имя задачи и её аргументы:\n\n```json\n{\n  \"task\": \"app.tasks.add\",\n  \"id\": \"71959f5b-...\",\n  \"args\": [2, 3],\n  \"kwargs\": {}\n}\n```\n\nWorker загружает Celery app, обращается к его registry и по имени находит соответствующий объект `Task`. Поэтому producer и worker должны согласованно импортировать задачи и использовать корректные имена. \n\nУпрощённо:\n\n```text\nСообщение:\n    task = \"app.tasks.add\"\n\nCelery app registry:\n    \"app.tasks.add\" -> объект Task -> функция add()\n```\n\n### 3. Превращает функцию в Celery Task\n\nДекоратор:\n\n```python\n@celery_app.task\ndef generate_report(report_id: int) -> None:\n    ...\n```\n\nсоздаёт не просто функцию, а объект Celery `Task`, связанный с конкретным app.\n\nУ него появляются методы:\n\n```python\ngenerate_report.delay(...)\ngenerate_report.apply_async(...)\ngenerate_report.s(...)\ngenerate_report.signature(...)\n```\n\nИ параметры:\n\n```python\ngenerate_report.name\ngenerate_report.app\ngenerate_report.request\ngenerate_report.max_retries\n```\n\nЗадача привязывается к app, чтобы получать из него значения конфигурации и настройки по умолчанию. В частности, задачи, созданные через `app.task()`, наследуются от базового класса `Task`, принадлежащего этому приложению.\n\n### 4. Отправляет задачи в broker\n\nКогда вызывается:\n\n```python\ngenerate_report.delay(42)\n```\n\nфактически используется app, к которому привязана задача:\n\n```text\nTask\n  |\n  v\nCelery app\n  |\n  | читает broker_url, serializer, routing\n  v\nRabbitMQ\n```\n\n`delay()` является сокращённой формой `apply_async()`. App определяет:\n\n- куда подключаться;\n    \n- как сериализовать аргументы;\n    \n- какой exchange и routing key использовать;\n    \n- в какую очередь направить задачу;\n    \n- нужно ли повторять публикацию;\n    \n- какой идентификатор задачи использовать.\n    \n\nЗадачу можно отправить и без импорта объекта `Task`, используя app:\n\n```python\ncelery_app.send_task(\n    \"app.tasks.generate_report\",\n    args=[42],\n    queue=\"reports\",\n)\n```\n\nОднако вызов через зарегистрированный объект задачи обычно безопаснее, поскольку меньше вероятность ошибиться в имени и сигнатуре.\n\n### 5. Сообщает worker, какие настройки использовать\n\nWorker запускается с указанием Celery app:\n\n```bash\ncelery -A app.celery_app:celery_app worker --loglevel=INFO\n```\n\nЗдесь:\n\n```text\napp.celery_app\n    Python-модуль.\n\n:celery_app\n    объект Celery внутри модуля.\n```\n\nWorker импортирует этот объект и получает из него:\n\n```text\nbroker URL\nresult backend\nреестр задач\nочереди\nмаршрутизацию\nсериализаторы\nack-настройки\nconcurrency-настройки\ntask limits\n```\n\nВ простом случае команда может выглядеть так:\n\n```bash\ncelery -A app.celery_app worker -l INFO\n```\n\nCelery app должен находиться в импортируемом модуле, поскольку он является точкой входа для worker и других компонентов Celery.\n\n### 6. Подключает result backend\n\nЕсли настроено:\n\n```python\ncelery_app = Celery(\n    \"my_project\",\n    broker=\"amqp://rabbitmq//\",\n    backend=\"redis://redis:6379/0\",\n)\n```\n\napp знает, где сохранять:\n\n- состояние задачи;\n    \n- результат;\n    \n- исключение;\n    \n- traceback;\n    \n- метаданные выполнения.\n    \n\n```python\nresult = generate_report.delay(42)\n\nprint(result.id)\nprint(result.state)\n```\n\nResult backend необязателен. Без него задачи всё равно могут выполняться, но отслеживание состояния и получение результата через `AsyncResult` будут ограничены. \n\n### 7. Управляет маршрутизацией\n\nЧерез app можно централизованно указать, куда отправлять разные типы задач:\n\n```python\ncelery_app.conf.task_routes = {\n    \"app.tasks.generate_report\": {\n        \"queue\": \"reports\",\n        \"routing_key\": \"reports.generate\",\n    },\n    \"app.tasks.send_email\": {\n        \"queue\": \"emails\",\n        \"routing_key\": \"emails.send\",\n    },\n}\n```\n\nСхема:\n\n```text\ngenerate_report\n      |\n      v\nreports queue\n      |\n      v\nReport workers\n\n\nsend_email\n      |\n      v\nemails queue\n      |\n      v\nEmail workers\n```\n\nБизнес-коду тогда не нужно указывать имя очереди в каждом вызове:\n\n```python\ngenerate_report.delay(report_id)\n```\n\nМаршрутизация остаётся в конфигурации Celery app.\n\n### 8. Используется Celery Beat\n\nCelery Beat также загружает app:\n\n```bash\ncelery -A app.celery_app:celery_app beat -l INFO\n```\n\nРасписание может храниться в его конфигурации:\n\n```python\nfrom datetime import timedelta\n\ncelery_app.conf.beat_schedule = {\n    \"cleanup-expired-files\": {\n        \"task\": \"app.tasks.cleanup_expired_files\",\n        \"schedule\": timedelta(hours=1),\n    },\n}\n```\n\nBeat использует app, чтобы определить:\n\n- какие задачи существуют;\n    \n- куда их публиковать;\n    \n- какой broker использовать;\n    \n- когда запускать каждую задачу.\n    \n\n### Типичная структура проекта\n\n```text\napp/\n├── celery_app.py\n├── config/\n│   └── celery.py\n├── tasks/\n│   ├── __init__.py\n│   ├── reports.py\n│   └── emails.py\n├── services/\n│   ├── reports.py\n│   └── emails.py\n└── main.py\n```\n\n```python\n# app/celery_app.py\n\nfrom celery import Celery\n\ncelery_app = Celery(\"my_project\")\n\ncelery_app.config_from_object(\"app.config.celery\")\n\ncelery_app.autodiscover_tasks(\n    [\n        \"app.tasks\",\n    ]\n)\n```\n\n```python\n# app/tasks/reports.py\n\nfrom app.celery_app import celery_app\nfrom app.services.reports import build_report_service\n\n\n@celery_app.task(\n    bind=True,\n    autoretry_for=(ConnectionError,),\n    retry_backoff=True,\n    retry_jitter=True,\n    max_retries=5,\n)\ndef generate_report(\n    self,\n    report_id: int,\n) -> None:\n    service = build_report_service()\n    service.generate(report_id)\n```\n\nЗапуск worker:\n\n```bash\ncelery -A app.celery_app:celery_app worker -Q reports -l INFO\n```\n\n### Что означает имя в `Celery(\"my_project\")`\n\n```python\ncelery_app = Celery(\"my_project\")\n```\n\nСтрока `\"my_project\"` — основное имя приложения. Она помогает Celery генерировать имена задач, когда невозможно надёжно определить модуль функции, например при запуске кода как `__main__`. ([Документация Celery](https://docs.celeryq.dev/en/stable/userguide/application.html \"Application — Celery 5.6.3 documentation\"))\n\nНапример:\n\n```python\ncelery_app = Celery(\"my_project\")\n\n\n@celery_app.task\ndef add(x: int, y: int) -> int:\n    return x + y\n```\n\nВ некоторых контекстах имя задачи может быть построено как:\n\n```text\nmy_project.add\n```\n\nВ обычных импортируемых модулях Celery чаще использует полный путь модуля:\n\n```text\napp.tasks.math.add\n```\n\nДля важных контрактов имя можно задать явно:\n\n```python\n@celery_app.task(name=\"reports.generate\")\ndef generate_report(report_id: int) -> None:\n    ...\n```\n\n### Можно ли иметь несколько Celery app\n\nДа. В одном Python-процессе могут существовать несколько экземпляров Celery с разными:\n\n- настройками;\n    \n- задачами;\n    \n- brokers;\n    \n- result backends;\n    \n- компонентами.\n    \n\nCelery app является thread-safe, и официальная документация допускает сосуществование нескольких приложений в одном процессе.\n\n```python\nreports_app = Celery(\n    \"reports\",\n    broker=\"amqp://reports-rabbitmq//\",\n)\n\nanalytics_app = Celery(\n    \"analytics\",\n    broker=\"redis://analytics-redis/0\",\n)\n```\n\nНа практике в одном сервисе обычно используют один явно созданный app, поскольку несколько apps усложняют регистрацию задач и понимание того, к какому экземпляру привязана задача.\n\n### `current_app`\n\nCelery предоставляет proxy:\n\n```python\nfrom celery import current_app\n```\n\nОн указывает на текущий Celery app. Но официальный подход — явно передавать экземпляр app компонентам, которым он нужен, вместо скрытой зависимости от `current_app`. Документация называет явную передачу app лучшей практикой. \n\nПредпочтительнее:\n\n```python\nclass TaskInspector:\n    def __init__(self, app: Celery) -> None:\n        self._app = app\n```\n\nчем:\n\n```python\nfrom celery import current_app\n\n\nclass TaskInspector:\n    def inspect(self):\n        return current_app.control.inspect()\n```\n\nДля прикладного бизнес-кода лучше вообще не зависеть напрямую ни от `current_app`, ни от `Celery app`, а использовать собственный интерфейс запуска фоновых операций.\n\n### Жизненный цикл\n\n```text\n1. Создаётся Celery app.\n\n2. Загружается конфигурация:\n       broker\n       backend\n       serializer\n       routing\n       retries\n\n3. Импортируются модули задач.\n\n4. Декораторы @app.task регистрируют задачи.\n\n5. Producer использует app для публикации сообщения.\n\n6. Worker запускается с тем же app.\n\n7. Worker находит задачу в app.tasks.\n\n8. Worker выполняет Task.run().\n\n9. App использует result backend для сохранения состояния,\n   если backend настроен.\n```\n\nCelery создаёт приложение лениво: при создании экземпляра формируются базовые внутренние объекты, включая registry, а окончательная обработка отложенных декораторов и привязка задач происходят при финализации app или при обращении к реестру задач.\n\n### Итог\n\n```text\nCelery app — центральный объект Celery,\nкоторый связывает вместе:\n\nзадачи\nконфигурацию\nbroker\nresult backend\nмаршрутизацию\nworkers\nCelery Beat\nуправление и мониторинг\n```\n\nБез него Celery не знает:\n\n```text\nкакие задачи зарегистрированы;\nкуда отправлять сообщения;\nкак их сериализовать;\nгде хранить результаты;\nкакие настройки применять при выполнении.\n```\n\nПри этом Celery app следует держать в инфраструктурном слое. Бизнес-сервису лучше зависеть от собственного интерфейса вроде `ReportJobDispatcher`, а уже его Celery-реализация должна использовать `celery_app` и `task.apply_async()`."
