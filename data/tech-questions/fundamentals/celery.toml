  answer = "### Гарантии доставки в RabbitMQ\n\nRabbitMQ не предоставляет одну глобальную настройку вида «гарантировать доставку». Надёжность складывается из трёх отдельных участков:\n\n```text\nProducer\n   │ 1. публикация\n   ▼\nRabbitMQ\n   │ 2. хранение и маршрутизация\n   ▼\nConsumer\n   │ 3. обработка и подтверждение\n   ▼\nБД / внешний сервис\n```\n\nДля каждого участка применяются собственные механизмы:\n\n```text\nProducer → RabbitMQ:\npublisher confirms\n\nХранение в RabbitMQ:\ndurable/quorum queue + persistence\n\nRabbitMQ → Consumer:\nmanual acknowledgements\n\nБизнес-обработка:\nидемпотентность и дедупликация\n```\n\n### At-most-once\n\n`At-most-once` означает:\n\n```text\nСообщение будет обработано:\n0 или 1 раз\n```\n\nПотеря возможна, повторная доставка не предполагается.\n\nНапример, Consumer использует автоматическое подтверждение:\n\n```text\nRabbitMQ отправил сообщение\n        ↓\nсчитает его подтверждённым\n        ↓\nConsumer упал до обработки\n        ↓\nсообщение потеряно\n```\n\nВ RabbitMQ отсутствие ручных подтверждений приближает доставку к `at-most-once`: после передачи сообщения Consumer-у Broker не знает, действительно ли бизнес-операция завершилась. Официальное руководство RabbitMQ отмечает, что без acknowledgements возможна потеря сообщений. \n\nТакой режим подходит только там, где потеря допустима:\n\n```text\nнекритичная телеметрия;\nчасть метрик;\nвременные события интерфейса;\nобновления, которые скоро будут заменены новыми.\n```\n\n### At-least-once\n\n`At-least-once` означает:\n\n```text\nСообщение будет обработано:\n1 или несколько раз\n```\n\nRabbitMQ стремится не потерять сообщение, но повторная доставка возможна.\n\nТипичный случай:\n\n```text\n1. Consumer получил сообщение\n2. Изменил данные в PostgreSQL\n3. Упал до отправки ACK\n4. RabbitMQ не получил подтверждение\n5. Сообщение вернулось в очередь\n6. Другой Consumer получил его повторно\n```\n\nПри закрытии канала или соединения неподтверждённые сообщения автоматически возвращаются в очередь. Поэтому ручные acknowledgements обеспечивают `at-least-once`, но требуют готовности к повторной обработке.\n\nСхема Consumer-а:\n\n```python\ndef handle(message) -> None:\n    try:\n        process_message(message)\n    except TemporaryError:\n        channel.basic_nack(\n            delivery_tag=message.delivery_tag,\n            requeue=True,\n        )\n    else:\n        channel.basic_ack(\n            delivery_tag=message.delivery_tag,\n        )\n```\n\nПодтверждать сообщение следует только после завершения необходимой работы:\n\n```text\nполучить сообщение\n        ↓\nизменить БД\n        ↓\nзафиксировать транзакцию\n        ↓\nотправить ACK\n```\n\nПосле `ACK` RabbitMQ получает право удалить сообщение из очереди. \n\n### Exactly-once RabbitMQ не гарантирует\n\nRabbitMQ не обеспечивает сквозное выполнение бизнес-операции строго один раз.\n\nРассмотрим Consumer:\n\n```text\nConsumer обновил БД\n        ↓\nConsumer должен отправить ACK\n```\n\nЕсли Consumer упадёт между этими действиями:\n\n```text\nБД уже изменена\nACK не дошёл\nRabbitMQ повторно доставляет сообщение\n```\n\nЕсли отправлять ACK до транзакции:\n\n```text\nACK отправлен\nConsumer упал\nБД не обновлена\nсообщение уже удалено\n```\n\nRabbitMQ не может атомарно объединить:\n\n```text\nCOMMIT в PostgreSQL\n+\nACK сообщения\n```\n\nПоэтому обычно строят:\n\n```text\nat-least-once delivery\n+\nидемпотентный Consumer\n=\nбизнес-эффект, близкий к exactly-once\n```\n\n### Publisher confirms\n\nPublisher должен убедиться, что RabbitMQ действительно принял сообщение.\n\nБез подтверждений:\n\n```text\nProducer отправил сообщение\n        ↓\nсоединение оборвалось\n        ↓\nнеизвестно, дошло ли сообщение\n```\n\nДля этого RabbitMQ предоставляет `publisher confirms`:\n\n```text\nProducer ──publish──> RabbitMQ\nProducer <──confirm── RabbitMQ\n```\n\nПосле включения confirm mode каждое опубликованное сообщение будет либо подтверждено, либо отклонено Broker-ом. Для persistent-сообщений, направленных в durable-очереди, confirm отправляется после сохранения; для quorum queue — после принятия сообщения кворумом реплик. \n\nУсловный пример с `pika`:\n\n```python\nimport pika\n\nconnection = pika.BlockingConnection(\n    pika.ConnectionParameters(\"localhost\")\n)\nchannel = connection.channel()\n\nchannel.confirm_delivery()\n\nchannel.queue_declare(\n    queue=\"orders\",\n    durable=True,\n)\n\nconfirmed = channel.basic_publish(\n    exchange=\"\",\n    routing_key=\"orders\",\n    body=b'{\"order_id\": 42}',\n    properties=pika.BasicProperties(\n        delivery_mode=pika.DeliveryMode.Persistent,\n        message_id=\"event-123\",\n    ),\n    mandatory=True,\n)\n\nif not confirmed:\n    raise RuntimeError(\"RabbitMQ did not confirm the message\")\n```\n\nPublisher confirm означает, что RabbitMQ принял ответственность за сообщение. Он не означает, что Consumer уже обработал его.\n\n```text\npublisher confirm:\nRabbitMQ принял сообщение\n\nconsumer ACK:\nConsumer завершил обработку\n```\n\nЭто независимые механизмы. \n\n### Потерянный confirm и дубликаты\n\nВозможна ситуация:\n\n```text\n1. RabbitMQ принял сообщение\n2. Отправил confirm\n3. Соединение оборвалось\n4. Producer confirm не получил\n5. Producer публикует сообщение повторно\n```\n\nВ RabbitMQ уже может находиться первая копия, поэтому повторная публикация создаст дубликат. Официальное руководство RabbitMQ прямо предупреждает, что повторная отправка неподтверждённых публикаций может приводить к дубликатам. \n\nСледовательно, `publisher confirms` не отменяют необходимость использовать:\n\n```text\nmessage_id;\nevent_id;\nidempotency_key;\nдедупликацию на стороне Consumer-а.\n```\n\n### Durable queue и persistent message\n\nДля переживания перезапуска Broker-а нужно различать очередь и сообщение.\n\n#### Durable queue\n\n```python\nchannel.queue_declare(\n    queue=\"orders\",\n    durable=True,\n)\n```\n\n`durable=True` означает, что определение очереди восстанавливается после перезапуска RabbitMQ.\n\n#### Persistent message\n\n```python\nproperties=pika.BasicProperties(\n    delivery_mode=pika.DeliveryMode.Persistent,\n)\n```\n\nPersistent-сообщение предназначено для сохранения при перезапуске Broker-а.\n\nДля надёжного варианта нужны вместе:\n\n```text\ndurable queue\n+\npersistent message\n+\npublisher confirms\n```\n\nОдного `durable=True` недостаточно: transient-сообщение не становится persistent только потому, что попало в durable-очередь. RabbitMQ рассматривает долговечность очереди и режим сохранения сообщения как отдельные свойства. \n\n### Quorum queues\n\nОбычная durable classic queue может пережить перезапуск своего узла, но не предоставляет такую же репликацию данных между узлами, как quorum queue.\n\nQuorum queue:\n\n```text\n          ┌── replica 1\nProducer ─┼── replica 2\n          └── replica 3\n```\n\nОна использует Raft и хранит реплицированное состояние очереди. RabbitMQ рекомендует quorum queues для долгоживущих критичных очередей, где важны сохранность данных и высокая доступность. \n\nПубликация считается подтверждённой, когда сообщение принято кворумом реплик:\n\n```text\n3 реплики\n   ↓\nминимум 2 приняли сообщение\n   ↓\nProducer получает confirm\n```\n\nУспешно подтверждённое сообщение не должно быть потеряно, пока большинство узлов quorum queue не стало постоянно недоступно. При этом для неподтверждённых публикаций гарантий сохранности нет. \n\nПрактическая комбинация для критичной очереди:\n\n```text\nquorum queue\n+\npublisher confirms\n+\nmanual consumer acknowledgements\n+\nидемпотентный Consumer\n```\n\n### Unroutable messages\n\nДаже подтверждённая публикация не всегда означает, что сообщение попало в очередь.\n\nНапример:\n\n```text\nProducer → Exchange\n              │\n              └── нет подходящего binding\n```\n\nRabbitMQ может подтвердить сообщение после того, как Exchange определил, что оно не маршрутизируется ни в одну очередь. Чтобы Producer узнал об этом, при публикации используется флаг `mandatory`; Broker вернёт сообщение через `basic.return`. \n\n```python\nchannel.basic_publish(\n    exchange=\"orders\",\n    routing_key=\"unknown.key\",\n    body=payload,\n    mandatory=True,\n)\n```\n\nПоэтому надёжный Producer должен обрабатывать:\n\n```text\npublisher confirm;\npublisher nack;\nbasic.return для unroutable message;\nобрыв соединения;\nтайм-аут ожидания confirm.\n```\n\n### ACK, NACK и reject\n\nПосле получения сообщения Consumer может выбрать одно из действий.\n\n#### ACK\n\n```text\nОперация выполнена успешно\n→ удалить сообщение\n```\n\n```python\nchannel.basic_ack(delivery_tag)\n```\n\n#### NACK с requeue\n\n```text\nОшибка временная\n→ вернуть сообщение в очередь\n```\n\n```python\nchannel.basic_nack(\n    delivery_tag,\n    requeue=True,\n)\n```\n\n#### NACK без requeue\n\n```text\nСообщение невозможно обработать\n→ удалить или направить в DLX\n```\n\n```python\nchannel.basic_nack(\n    delivery_tag,\n    requeue=False,\n)\n```\n\nRabbitMQ поддерживает `basic.reject` и `basic.nack`; последний также позволяет отрицательно подтвердить несколько сообщений. Сообщение с `requeue=false` может быть направлено в Dead Letter Exchange, если он настроен. \n\n### Почему нельзя бесконечно делать requeue\n\nОпасная схема:\n\n```text\nConsumer получил сообщение\n        ↓\nошибка\n        ↓\nNACK requeue=True\n        ↓\nConsumer снова получил сообщение\n        ↓\nошибка\n        ↓\n...\n```\n\nЭто создаёт бесконечный цикл, загружая Broker и Consumer-ы.\n\nОбычно используют:\n\n```text\nосновная очередь\n      ↓ временная ошибка\nretry queue\n      ↓ задержка\nосновная очередь\n      ↓ превышен лимит\nDLQ\n```\n\nСообщение может быть dead-lettered после `reject/nack` с `requeue=false`, истечения TTL, превышения длины очереди либо превышения delivery limit для quorum queue. \n\n### DLX тоже имеет собственные гарантии\n\nОбычная dead-lettering-передача не обязательно является надёжной `at-least-once` операцией.\n\nДля quorum queue RabbitMQ поддерживает специальный режим `at-least-once` dead-lettering:\n\n```text\nSource quorum queue\n        ↓ internal consumer\n        ↓ publish + publisher confirms\nTarget queue\n        ↓\nACK исходному сообщению\n```\n\nПри этом исходное сообщение удаляется только после подтверждения публикации в целевую очередь. Однако повторные попытки всё равно могут создать дубликаты в целевой очереди. По умолчанию стратегия dead-lettering для quorum queues остаётся `at-most-once`. \n\n### Идемпотентный Consumer\n\nПоскольку `at-least-once` допускает дубликаты, Consumer должен уметь распознавать уже обработанные сообщения.\n\nНапример:\n\n```sql\nCREATE TABLE processed_messages (\n    consumer_name TEXT NOT NULL,\n    message_id UUID NOT NULL,\n    processed_at TIMESTAMPTZ NOT NULL DEFAULT now(),\n\n    PRIMARY KEY (consumer_name, message_id)\n);\n```\n\nОбработка в одной транзакции:\n\n```python\ndef handle_message(message: Message) -> None:\n    with database.transaction():\n        inserted = processed_messages.try_insert(\n            consumer_name=\"order_consumer\",\n            message_id=message.id,\n        )\n\n        if not inserted:\n            return\n\n        order_service.apply_event(message)\n```\n\nВажно, чтобы запись о дедупликации и бизнес-операция фиксировались атомарно:\n\n```text\nодна транзакция\n├── INSERT processed_messages\n└── UPDATE business_data\n```\n\nПосле успешного `COMMIT` Consumer отправляет ACK.\n\n```text\nCOMMIT\n  ↓\nACK\n```\n\nПри падении до ACK сообщение придёт повторно, но уникальный `message_id` не позволит повторить бизнес-эффект.\n\n### Transactional Outbox для Producer-а\n\nPublisher confirms защищают участок:\n\n```text\nприложение → RabbitMQ\n```\n\nНо не решают проблему:\n\n```python\nsave_order(order)\npublish_event(order)\n```\n\nЕсли приложение упадёт после сохранения заказа, но до публикации события:\n\n```text\nOrder сохранён\nOrderCreated не отправлен\n```\n\nОбычно применяют Transactional Outbox:\n\n```text\nОдна транзакция PostgreSQL\n├── orders\n└── outbox_events\n```\n\nОтдельный Publisher читает outbox и отправляет события в RabbitMQ с publisher confirms.\n\n```text\nBusiness transaction\n        ↓\nOutbox table\n        ↓\nOutbox Publisher\n        ↓\nRabbitMQ\n```\n\nOutbox Publisher может отправить событие повторно при потере confirm, поэтому Consumer всё равно должен выполнять дедупликацию.\n\n### Практические уровни RabbitMQ\n\n#### Минимальная надёжность\n\n```text\nauto acknowledgement\ntransient queue/message\nбез publisher confirms\n```\n\nСемантика близка к:\n\n```text\nat-most-once\n```\n\nПотеря сообщений допустима.\n\n#### Обычная надёжная обработка\n\n```text\ndurable queue\npersistent messages\npublisher confirms\nmanual acknowledgements\nидемпотентный Consumer\n```\n\nСемантика:\n\n```text\nat-least-once\n```\n\nСообщение может прийти повторно.\n\n#### Критичная кластерная очередь\n\n```text\nquorum queue\npublisher confirms\nmanual acknowledgements\nидемпотентный Consumer\nTransactional Outbox\nInbox / таблица дедупликации\nDLQ и ограниченные retries\n```\n\nРезультат:\n\n```text\nat-least-once доставка\n+\nзащита от повторного бизнес-эффекта\n```\n\n### Итог\n\nRabbitMQ практически поддерживает две основные модели:\n\n```text\nБез acknowledgements:\nat-most-once\nсообщение может потеряться\n\nС acknowledgements и повторной доставкой:\nat-least-once\nсообщение может быть обработано повторно\n```\n\n`Exactly-once` RabbitMQ сам по себе не предоставляет. Для критичных операций обычно применяют:\n\n```text\nPublisher:\nTransactional Outbox\n+ publisher confirms\n\nRabbitMQ:\nquorum queue\n+ репликация\n\nConsumer:\nmanual ACK\n+ идемпотентность\n+ Inbox/deduplication\n```\n\nГлавная схема:\n\n```text\nProducer DB transaction\n├── бизнес-данные\n└── outbox\n        ↓\npublisher confirms\n        ↓\nRabbitMQ quorum queue\n        ↓\nmanual delivery\n        ↓\nConsumer DB transaction\n├── processed_messages\n└── бизнес-изменение\n        ↓\nACK\n```\n\nТакое построение не исключает физические дубликаты сообщений, но предотвращает повторный бизнес-эффект."
