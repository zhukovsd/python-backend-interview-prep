  question = "Что отдавать клиенту, если задача должна быть поставлена в RabbitMQ?"
  answer = "### Основной вариант — `202 Accepted`\n\nКогда HTTP-запрос только ставит фоновую задачу в RabbitMQ, клиенту обычно возвращают:\n\n```http\nHTTP/1.1 202 Accepted\nLocation: /api/tasks/01K1ABCDEF123\nContent-Type: application/json\n```\n\n```json\n{\n  \"task_id\": \"01K1ABCDEF123\",\n  \"status\": \"queued\",\n  \"status_url\": \"/api/tasks/01K1ABCDEF123\"\n}\n```\n\n`202 Accepted` означает, что запрос принят для последующей обработки, но обработка ещё не завершена и может завершиться ошибкой. Поэтому нельзя возвращать клиенту `completed` или бизнес-результат только потому, что сообщение опубликовано в RabbitMQ. \n\n```text\nHTTP request\n     |\n     v\nСоздание задачи\n     |\n     v\nПубликация в RabbitMQ\n     |\n     v\n202 Accepted + task_id\n     |\n     v\nConsumer выполняет задачу позже\n```\n\n### Что означает статус `queued`\n\nСтатус должен отражать реальное состояние:\n\n```text\naccepted — запрос принят системой\nqueued   — сообщение поставлено в очередь\nrunning  — consumer начал обработку\nsuccess  — задача успешно выполнена\nfailed   — задача завершилась ошибкой\n```\n\nПубликация сообщения не означает, что consumer уже начал работу:\n\n```text\nPublisher confirm\n    = RabbitMQ принял ответственность за сообщение\n\nConsumer ack\n    = consumer успешно обработал сообщение\n```\n\nЭто два независимых механизма RabbitMQ. \n\n### Endpoint проверки статуса\n\nКлиенту следует вернуть идентификатор задачи, по которому можно запросить состояние:\n\n```http\nGET /api/tasks/01K1ABCDEF123\n```\n\nПока задача ожидает:\n\n```json\n{\n  \"task_id\": \"01K1ABCDEF123\",\n  \"status\": \"queued\",\n  \"created_at\": \"2026-07-28T01:30:00+04:00\",\n  \"started_at\": null,\n  \"finished_at\": null,\n  \"result\": null,\n  \"error\": null\n}\n```\n\nВо время выполнения:\n\n```json\n{\n  \"task_id\": \"01K1ABCDEF123\",\n  \"status\": \"running\",\n  \"started_at\": \"2026-07-28T01:30:02+04:00\"\n}\n```\n\nПосле выполнения:\n\n```json\n{\n  \"task_id\": \"01K1ABCDEF123\",\n  \"status\": \"succeeded\",\n  \"finished_at\": \"2026-07-28T01:30:08+04:00\",\n  \"result\": {\n    \"report_url\": \"/api/reports/842\"\n  }\n}\n```\n\nПри ошибке:\n\n```json\n{\n  \"task_id\": \"01K1ABCDEF123\",\n  \"status\": \"failed\",\n  \"error\": {\n    \"code\": \"REPORT_GENERATION_FAILED\",\n    \"message\": \"Не удалось сформировать отчёт\"\n  }\n}\n```\n\n### Когда можно возвращать `202`\n\nВозвращать успех клиенту нужно только после того, как приложение надёжно приняло ответственность за задачу.\n\nЕсть два основных варианта.\n\n### Вариант 1: дождаться publisher confirm\n\n```text\nAPI\n |\n | publish\n v\nRabbitMQ\n |\n | publisher confirm\n v\nAPI возвращает 202\n```\n\nRabbitMQ предупреждает, что сам факт записи данных в TCP-сокет не доказывает, что сообщение дошло до брокера и было обработано. Для надёжной публикации применяются publisher confirms.\n\nТакже желательно использовать `mandatory=true`, чтобы обнаруживать ситуацию, когда exchange существует, но сообщение не попало ни в одну очередь:\n\n```text\nPublisher confirm ack\n    не всегда означает,\n    что сообщение попало в очередь\n```\n\nДля unroutable-сообщения RabbitMQ может сначала выполнить `basic.return`, а затем отправить publisher confirm. Поэтому проверяют одновременно:\n\n```text\npublisher confirm\n+\nmandatory=true\n+\nобработку basic.return\n```\n\n\nЛогика endpoint:\n\n```python\n@app.post(\"/reports\", status_code=202)\nasync def create_report(data: ReportRequest) -> TaskResponse:\n    task_id = generate_task_id()\n\n    message = {\n        \"task_id\": task_id,\n        \"report_type\": data.report_type,\n        \"user_id\": data.user_id,\n    }\n\n    try:\n        await rabbitmq.publish(\n            message,\n            routing_key=\"report.generate\",\n            mandatory=True,\n            wait_for_confirm=True,\n        )\n    except UnroutableMessageError:\n        raise HTTPException(\n            status_code=503,\n            detail={\n                \"code\": \"TASK_QUEUE_UNAVAILABLE\",\n                \"message\": \"Задача не была направлена в очередь\",\n            },\n        )\n    except PublishError:\n        raise HTTPException(\n            status_code=503,\n            detail={\n                \"code\": \"RABBITMQ_UNAVAILABLE\",\n                \"message\": \"Задача не была принята системой\",\n            },\n        )\n\n    return TaskResponse(\n        task_id=task_id,\n        status=\"queued\",\n        status_url=f\"/api/tasks/{task_id}\",\n    )\n```\n\n### Вариант 2: transactional outbox\n\nЕсли endpoint одновременно изменяет PostgreSQL и отправляет событие, надёжнее сначала сохранить задачу и outbox-запись в одной транзакции:\n\n```text\nBEGIN\n\nINSERT INTO tasks (..., status='accepted');\n\nINSERT INTO outbox (\n    message_id,\n    routing_key,\n    payload,\n    published_at\n);\n\nCOMMIT\n```\n\nПосле успешного commit можно вернуть клиенту:\n\n```http\nHTTP/1.1 202 Accepted\n```\n\nДаже если RabbitMQ в данный момент недоступен, задача уже надёжно сохранена в вашей базе и будет опубликована outbox-worker’ом позже:\n\n```text\nHTTP API\n   |\n   v\nPostgreSQL transaction\n   |\n   +--> tasks\n   +--> outbox\n   |\n   v\n202 Accepted\n\nOutbox worker\n   |\n   v\nRabbitMQ\n```\n\nВ таком варианте первоначальный статус лучше назвать `accepted` или `pending_publish`, а не `queued`:\n\n```json\n{\n  \"task_id\": \"01K1ABCDEF123\",\n  \"status\": \"accepted\",\n  \"status_url\": \"/api/tasks/01K1ABCDEF123\"\n}\n```\n\nПосле publisher confirm worker обновляет статус:\n\n```text\naccepted -> queued\n```\n\n### Что вернуть, если RabbitMQ недоступен\n\nЕсли outbox отсутствует и сообщение не удалось подтвердить, нельзя возвращать `202`.\n\nПодходящий ответ:\n\n```http\nHTTP/1.1 503 Service Unavailable\nRetry-After: 5\nContent-Type: application/json\n```\n\n```json\n{\n  \"error\": {\n    \"code\": \"TASK_QUEUE_UNAVAILABLE\",\n    \"message\": \"Сервис временно не может принять задачу\"\n  }\n}\n```\n\n`Retry-After` может сообщить клиенту, через сколько секунд допустимо повторить запрос. RFC определяет его использование с `503 Service Unavailable`. \n\nRabbitMQ также указывает, что при разрыве соединения публикации не сохраняются автоматически клиентской библиотекой для будущей отправки. Неподтверждённые сообщения нужно считать недоставленными и самостоятельно повторно публиковать, когда это безопасно.\n\n### Неопределённый результат публикации\n\nВозможна ситуация:\n\n```text\n1. RabbitMQ принял сообщение.\n2. Соединение оборвалось.\n3. Publisher не получил confirm.\n4. Приложение не знает результат.\n```\n\nПовторная публикация может создать дубликат. RabbitMQ рекомендует повторять неподтверждённые сообщения после восстановления соединения, но при этом consumer должен поддерживать дедупликацию или идемпотентную обработку.\n\nПоэтому каждому заданию нужен стабильный идентификатор:\n\n```json\n{\n  \"message_id\": \"01K1ABCDEF123\",\n  \"task_id\": \"01K1ABCDEF123\",\n  \"type\": \"report.generate\"\n}\n```\n\nConsumer сохраняет обработанные `message_id` либо использует уникальное ограничение:\n\n```sql\nCREATE TABLE processed_messages (\n    message_id UUID PRIMARY KEY,\n    processed_at TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n```\n\n### Защита от повторных HTTP-запросов\n\nКлиент может не получить `202` из-за сетевого timeout и повторить тот же запрос. Поэтому полезен `Idempotency-Key`:\n\n```http\nPOST /api/reports\nIdempotency-Key: report-user-42-2026-07\n```\n\nПри повторном запросе сервер возвращает прежний `task_id`, а не создаёт ещё одну задачу:\n\n```json\n{\n  \"task_id\": \"01K1ABCDEF123\",\n  \"status\": \"queued\",\n  \"status_url\": \"/api/tasks/01K1ABCDEF123\"\n}\n```\n\n### Когда возвращать `201 Created`\n\nЕсли HTTP-запрос немедленно создаёт основной бизнес-ресурс, а RabbitMQ используется только для последующей обработки, обычно возвращают `201 Created`.\n\nНапример:\n\n```text\nPOST /files\n    |\n    +--> файл сохранён\n    +--> запись File создана\n    +--> задача антивирусной проверки поставлена в очередь\n```\n\nОтвет:\n\n```http\nHTTP/1.1 201 Created\nLocation: /api/files/842\n```\n\n```json\n{\n  \"id\": 842,\n  \"status\": \"processing\",\n  \"scan_status\": \"queued\"\n}\n```\n\nРазличие:\n\n```text\n202 Accepted\n    Основная операция ещё не выполнена.\n\n201 Created\n    Основной ресурс уже создан,\n    но дополнительные действия выполняются асинхронно.\n```\n\nRFC определяет `201` как успешное создание нового ресурса, а `202` — как принятие запроса для незавершённой обработки. \n\n### Рекомендуемая схема\n\n```text\nPOST /api/reports\n        |\n        v\nПроверка входных данных\n        |\n        v\nСоздание task_id\n        |\n        v\nСохранение task + outbox\n        |\n        v\nCOMMIT\n        |\n        v\n202 Accepted\n{\n    task_id,\n    status,\n    status_url\n}\n```\n\nПосле этого:\n\n```text\nGET /api/tasks/{task_id}\n```\n\n### Итог\n\nДля фоновой задачи стандартный ответ:\n\n```http\nHTTP/1.1 202 Accepted\nLocation: /api/tasks/{task_id}\n```\n\n```json\n{\n  \"task_id\": \"01K1ABCDEF123\",\n  \"status\": \"queued\",\n  \"status_url\": \"/api/tasks/01K1ABCDEF123\"\n}\n```\n\nНо `202` допустим только когда задача действительно принята системой:\n\n```text\nполучен publisher confirm и проверена маршрутизация\n\nили\n\nзадача надёжно сохранена в transactional outbox\n```\n\nЕсли сообщение не удалось опубликовать и оно нигде надёжно не сохранено, корректнее вернуть `503 Service Unavailable`, а не создавать у клиента ложное впечатление, что задача поставлена."
