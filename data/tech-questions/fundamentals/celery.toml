  question = "Как разделить большую Celery task на несколько маленьких?"
  answer = "### Основной принцип\n\nБольшую Celery-задачу следует делить на **самостоятельные идемпотентные этапы**, каждый из которых можно выполнить отдельно, повторить после ошибки и распределить между Worker-ами.\n\nCelery рекомендует использовать достаточно мелкие задачи для параллелизма, но предупреждает, что слишком мелкая гранулярность увеличивает расходы на отправку сообщений, сериализацию и получение данных. Поэтому размер задачи подбирают нагрузочным тестированием. \n\n```text\nБольшая операция\n      ↓\nразбиение данных на батчи\n      ↓\nмаленькие Celery tasks\n      ↓\nпараллельная или последовательная обработка\n      ↓\nфинализация результата\n```\n\n### Canvas-примитивы\n\n|Примитив|Назначение|\n|---|---|\n|`chain`|Последовательное выполнение|\n|`group`|Параллельное выполнение независимых задач|\n|`chord`|Параллельная группа с итоговой задачей|\n|`chunks`|Разбиение большого списка аргументов на части|\n\nЭти примитивы являются частью Celery Canvas и могут комбинироваться между собой. \n\n---\n\n### `chain`: последовательные задачи\n\n`chain` применяют, когда следующий этап зависит от результата предыдущего:\n\n```text\nзагрузить файл\n      ↓\nпроверить файл\n      ↓\nобработать данные\n      ↓\nсохранить результат\n```\n\n```python\nfrom celery import chain\n\nworkflow = chain(\n    download_file.s(file_id),\n    validate_file.s(),\n    process_file.s(),\n    save_result.s(),\n)\n\nworkflow.apply_async()\n```\n\nПо умолчанию результат предыдущей задачи передаётся первым аргументом следующей:\n\n```python\n@app.task\ndef download_file(file_id: int) -> str:\n    return f\"/tmp/{file_id}.csv\"\n\n\n@app.task\ndef validate_file(file_path: str) -> str:\n    validate(file_path)\n    return file_path\n\n\n@app.task\ndef process_file(file_path: str) -> dict:\n    return parse_file(file_path)\n\n\n@app.task\ndef save_result(parsed_data: dict) -> int:\n    return repository.save(parsed_data)\n```\n\n```text\ndownload_file → \"/tmp/42.csv\"\n                     ↓\nvalidate_file(\"/tmp/42.csv\")\n                     ↓\nprocess_file(\"/tmp/42.csv\")\n```\n\nCelery определяет `chain` как последовательность signatures, где каждая задача вызывается после предыдущей. \n\n### Immutable signatures\n\nИногда результат предыдущей задачи передавать не нужно. Тогда используется `.si()` вместо `.s()`:\n\n```python\nworkflow = chain(\n    create_order.s(order_id),\n    send_notification.si(order_id),\n)\n```\n\nВ этом примере `send_notification` получит только `order_id`, а не результат `create_order`.\n\n```python\n@app.task\ndef send_notification(order_id: int) -> None:\n    ...\n```\n\nImmutable signature не принимает дополнительные аргументы, передаваемые предыдущей задачей Canvas. \n\n---\n\n### `group`: параллельные задачи\n\n`group` применяют, когда задачи независимы друг от друга:\n\n```text\n             ┌── batch 1\n             ├── batch 2\nОбработка ───┼── batch 3\n             └── batch N\n```\n\n```python\nfrom celery import group\n\nworkflow = group(\n    process_batch.s(batch_id)\n    for batch_id in batch_ids\n)\n\nresult = workflow.apply_async()\n```\n\nВсе задачи группы могут выполняться параллельно разными Worker-процессами:\n\n```python\n@app.task\ndef process_batch(batch_id: int) -> dict:\n    batch = batch_repository.get(batch_id)\n\n    processed = 0\n    failed = 0\n\n    for record_id in batch.record_ids:\n        try:\n            process_record(record_id)\n            processed += 1\n        except ProcessingError:\n            failed += 1\n\n    return {\n        \"batch_id\": batch_id,\n        \"processed\": processed,\n        \"failed\": failed,\n    }\n```\n\nCelery определяет `group` как набор задач, которые должны применяться параллельно. \n\n### Пример разбиения списка на батчи\n\n```python\nfrom collections.abc import Iterator, Sequence\nfrom typing import TypeVar\n\nT = TypeVar(\"T\")\n\n\ndef split_into_batches(\n    values: Sequence[T],\n    batch_size: int,\n) -> Iterator[list[T]]:\n    if batch_size <= 0:\n        raise ValueError(\"batch_size must be greater than zero\")\n\n    for offset in range(0, len(values), batch_size):\n        yield list(values[offset : offset + batch_size])\n```\n\nЗапуск:\n\n```python\nbatches = split_into_batches(record_ids, batch_size=1_000)\n\nworkflow = group(\n    process_records.s(batch)\n    for batch in batches\n)\n\nworkflow.apply_async()\n```\n\n```python\n@app.task\ndef process_records(record_ids: list[int]) -> int:\n    processed = 0\n\n    for record_id in record_ids:\n        process_record(record_id)\n        processed += 1\n\n    return processed\n```\n\nОднако передавать большие массивы идентификаторов через брокер не всегда эффективно. Для крупных объёмов лучше предварительно сохранить батчи в БД или объектном хранилище и передавать только `batch_id`.\n\n```python\nworkflow = group(\n    process_batch.s(batch_id)\n    for batch_id in batch_ids\n)\n```\n\nCelery рекомендует передавать идентификаторы объектов, а актуальные данные повторно загружать внутри задачи: переданные ранее объекты или данные могут устареть до момента выполнения. \n\n---\n\n### `chord`: параллельная обработка с финализацией\n\n`chord` состоит из:\n\n```text\nheader — группа параллельных задач\nbody   — callback после завершения всей группы\n```\n\n```text\nprocess_batch 1 ─┐\nprocess_batch 2 ─┤\nprocess_batch 3 ─┼──> aggregate_results\nprocess_batch N ─┘\n```\n\n```python\nfrom celery import chord\n\nworkflow = chord(\n    process_batch.s(batch_id)\n    for batch_id in batch_ids\n)(\n    aggregate_results.s(job_id)\n)\n```\n\nРезультаты всех задач группы передаются в callback первым аргументом:\n\n```python\n@app.task\ndef aggregate_results(\n    batch_results: list[dict],\n    job_id: int,\n) -> dict:\n    processed = sum(\n        result[\"processed\"]\n        for result in batch_results\n    )\n    failed = sum(\n        result[\"failed\"]\n        for result in batch_results\n    )\n\n    job_repository.complete(\n        job_id=job_id,\n        processed=processed,\n        failed=failed,\n    )\n\n    return {\n        \"job_id\": job_id,\n        \"processed\": processed,\n        \"failed\": failed,\n    }\n```\n\n`chord` запускает callback только после завершения всех задач header-группы. Для chord требуется result backend, а задачи header и callback не должны игнорировать результаты. RPC result backend для chord не поддерживается. \n\n### Недостаток `chord`\n\nСинхронизация chord имеет стоимость. Официальная документация рекомендует избегать chord там, где итоговая барьерная синхронизация не нужна. \n\nОсобенно осторожно следует применять chord, когда:\n\n```text\nсотни тысяч задач;\nкаждая задача возвращает большой результат;\ncallback получает огромный список результатов;\nresult backend испытывает значительную нагрузку.\n```\n\nНе следует возвращать из каждой задачи целые обработанные объекты:\n\n```python\n# Плохо\nreturn processed_records\n```\n\nЛучше возвращать компактную статистику:\n\n```python\nreturn {\n    \"processed\": 950,\n    \"failed\": 50,\n}\n```\n\nЛибо сохранять частичные результаты в БД и возвращать только идентификатор:\n\n```python\nreturn batch_result_id\n```\n\n---\n\n### `chunks`: автоматическое разбиение аргументов\n\n`chunks` удобен, когда одна и та же задача должна применяться к большому количеству однотипных аргументов.\n\n```python\n@app.task\ndef process_record(record_id: int) -> bool:\n    process(record_id)\n    return True\n```\n\nСоздание чанков по 100 записей:\n\n```python\narguments = (\n    (record_id,)\n    for record_id in record_ids\n)\n\nworkflow = process_record.chunks(\n    arguments,\n    100,\n)\n\nworkflow.apply_async()\n```\n\nЕсли имеется 10 000 элементов и размер чанка равен 100, Celery создаст 100 задач. Внутри каждой задачи 100 вызовов будут выполнены последовательно. `chunks` уменьшает количество сообщений брокера и накладные расходы по сравнению с отдельным сообщением на каждый элемент. \n\nВажно понимать отличие:\n\n```text\ngroup:\nкаждая signature становится отдельной задачей.\n\nchunks:\nодна задача последовательно обрабатывает\nнесколько наборов аргументов.\n```\n\n### `group` или `chunks`\n\nДля 100 000 записей:\n\n```python\n# 100 000 сообщений\ngroup(\n    process_record.s(record_id)\n    for record_id in record_ids\n)\n```\n\n```python\n# 100 сообщений при chunk_size=1000\nprocess_record.chunks(\n    ((record_id,) for record_id in record_ids),\n    1_000,\n)\n```\n\n`chunks` подходит для простой однородной обработки. Собственный `process_batch` удобнее, когда внутри батча нужны:\n\n- одна транзакция;\n    \n- один SQL-запрос на группу ID;\n    \n- `bulk_create` или `bulk_update`;\n    \n- собственная статистика;\n    \n- особая обработка ошибок;\n    \n- контроль состояния батча.\n    \n\n---\n\n### Комбинирование `chain`, `group` и `chord`\n\nРаспространённая схема: каждый батч проходит несколько последовательных этапов, а батчи выполняются параллельно.\n\n```text\nbatch 1: validate → process → persist ─┐\nbatch 2: validate → process → persist ─┼──> finalize\nbatch 3: validate → process → persist ─┘\n```\n\n```python\nfrom celery import chain, chord\n\nbatch_workflows = [\n    chain(\n        validate_batch.s(batch_id),\n        process_batch.s(),\n        persist_batch.s(),\n    )\n    for batch_id in batch_ids\n]\n\nworkflow = chord(batch_workflows)(\n    finalize_job.s(job_id)\n)\n\nworkflow.apply_async()\n```\n\nЗадачи:\n\n```python\n@app.task\ndef validate_batch(batch_id: int) -> int:\n    validate_batch_data(batch_id)\n    return batch_id\n\n\n@app.task\ndef process_batch(batch_id: int) -> int:\n    process_batch_data(batch_id)\n    return batch_id\n\n\n@app.task\ndef persist_batch(batch_id: int) -> dict:\n    result = persist_batch_result(batch_id)\n\n    return {\n        \"batch_id\": batch_id,\n        \"processed\": result.processed,\n        \"failed\": result.failed,\n    }\n\n\n@app.task\ndef finalize_job(\n    batch_results: list[dict],\n    job_id: int,\n) -> None:\n    ...\n```\n\nCanvas-примитивы являются signatures и могут вкладываться и объединяться в составные workflow. \n\n---\n\n### Практическая архитектура большой обработки\n\nДля операции с миллионом записей лучше не передавать миллион ID непосредственно в Celery Canvas.\n\n```text\n1. API создаёт Job\n2. Приложение записывает Batch-строки в БД\n3. В Celery передаются только batch_id\n4. Worker загружает данные батча\n5. Worker сохраняет результат батча\n6. Финальная задача обновляет Job\n```\n\nСтруктура данных:\n\n```text\nprocessing_jobs\n├── id\n├── status\n├── total_batches\n├── completed_batches\n├── failed_batches\n└── created_at\n\nprocessing_batches\n├── id\n├── job_id\n├── status\n├── records_from\n├── records_to\n├── processed_count\n└── failed_count\n```\n\nЗапуск:\n\n```python\n@app.task\ndef start_job(job_id: int) -> None:\n    batch_ids = batch_repository.list_ids(job_id)\n\n    chord(\n        process_batch.s(batch_id)\n        for batch_id in batch_ids\n    )(\n        finalize_job.s(job_id)\n    )\n```\n\nОбработка:\n\n```python\n@app.task(\n    bind=True,\n    autoretry_for=(TemporaryProcessingError,),\n    retry_backoff=True,\n    retry_jitter=True,\n    max_retries=5,\n    acks_late=True,\n)\ndef process_batch(\n    self,\n    batch_id: int,\n) -> dict:\n    batch = batch_repository.lock_for_processing(batch_id)\n\n    if batch.status == \"completed\":\n        return {\n            \"batch_id\": batch.id,\n            \"processed\": batch.processed_count,\n            \"failed\": batch.failed_count,\n        }\n\n    result = batch_processor.process(batch)\n\n    batch_repository.mark_completed(\n        batch_id=batch.id,\n        processed=result.processed,\n        failed=result.failed,\n    )\n\n    return {\n        \"batch_id\": batch.id,\n        \"processed\": result.processed,\n        \"failed\": result.failed,\n    }\n```\n\nПри `acks_late=True` сообщение подтверждается после выполнения задачи, поэтому после сбоя возможен повторный запуск. Задача должна быть идемпотентной. \n\n---\n\n### Как обрабатывать ошибки\n\n#### Ошибка одной задачи в `chain`\n\nПоследующие задачи цепочки не выполняются:\n\n```text\nvalidate → process FAILED → persist не запускается\n```\n\nМожно назначить errback:\n\n```python\nworkflow = chain(\n    validate_batch.s(batch_id),\n    process_batch.s(),\n    persist_batch.s(),\n)\n\nworkflow.apply_async(\n    link_error=mark_batch_failed.s(batch_id),\n)\n```\n\n#### Ошибка задачи внутри `group`\n\nОстальные задачи группы продолжают выполняться независимо.\n\n```text\nbatch 1 SUCCESS\nbatch 2 FAILURE\nbatch 3 SUCCESS\n```\n\n#### Ошибка внутри `chord`\n\nЕсли одна из header-задач завершилась ошибкой, callback chord обычно не выполняется как успешная финализация. Ошибку необходимо учитывать через errback и состояние общей операции.\n\n```python\nworkflow = chord(header, finalize_job.s(job_id))\n\nworkflow.apply_async(\n    link_error=mark_job_failed.s(job_id),\n)\n```\n\nДля бизнес-процесса лучше хранить состояние `Job` в собственной БД, а не полагаться исключительно на Celery result backend.\n\n---\n\n### Выбор размера батча\n\nУниверсального размера нет.\n\nСлишком маленький батч:\n\n```text\nмного сообщений;\nнагрузка на broker;\nнагрузка на result backend;\nрасходы на сериализацию;\nбольшое количество task metadata.\n```\n\nСлишком большой батч:\n\n```text\nдолгое выполнение;\nплохая балансировка Worker-ов;\nдорогой повтор после ошибки;\nдолгое удержание транзакций;\nблокировка очереди тяжёлыми задачами.\n```\n\nCelery рекомендует делить работу на небольшие задачи, но учитывать накладные расходы слишком мелкой гранулярности. \n\nПрактически размер подбирают по метрикам:\n\n```text\nвремя обработки батча;\nразмер сообщения;\nдлина очереди;\nCPU и память Worker-а;\nнагрузка на БД;\nстоимость повторного выполнения;\nскорость Producer-а и Consumer-ов.\n```\n\nОбычно стремятся к задаче, которая выполняется не миллисекунды и не часы, а имеет предсказуемое ограниченное время.\n\n### Основные ошибки\n\n```python\n# Плохо: одна task обрабатывает миллион записей\n@app.task\ndef process_all(ids: list[int]) -> None:\n    for record_id in ids:\n        process(record_id)\n```\n\nПроблемы:\n\n```text\nогромное сообщение;\nодин Worker занят надолго;\nнет нормального параллелизма;\nпри ошибке повторяется вся обработка;\nсложно отслеживать прогресс.\n```\n\nТакже не следует:\n\n```text\nпередавать ORM-объекты в task;\nвозвращать огромные результаты;\nвызывать result.get() внутри Worker-а;\nсоздавать задачу на каждую микроскопическую операцию;\nсчитать повторную доставку невозможной;\nиспользовать chord без result backend;\nзапускать неидемпотентные задачи с acks_late.\n```\n\n### Какой примитив выбирать\n\n```text\nЭтапы зависят друг от друга\n→ chain\n\nЗадачи независимы и выполняются параллельно\n→ group\n\nПараллельные задачи требуют общей финализации\n→ chord\n\nОдинаковая задача применяется к большому списку аргументов\n→ chunks\n\nНесколько последовательных этапов для каждого батча,\nзатем общая финализация\n→ chord из chain\n```\n\n### Итоговая схема\n\n```python\nworkflow = chord(\n    chain(\n        validate_batch.s(batch_id),\n        process_batch.s(),\n        save_batch.s(),\n    )\n    for batch_id in batch_ids\n)(\n    finalize_job.s(job_id)\n)\n\nworkflow.apply_async()\n```\n\nЭто даёт:\n\n```text\nпараллельность между батчами;\nпоследовательность этапов внутри батча;\nнезависимые retry;\nограниченный объём повторной работы;\nфинализацию после завершения всех батчей;\nвозможность горизонтально масштабировать Worker-ы.\n```"
