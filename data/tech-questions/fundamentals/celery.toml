  question = "Что делать, если очередь сообщений не гарантирует порядок?"
  answer = "### Сначала определить, какой порядок действительно нужен\n\nГлобальный порядок всех сообщений обычно не требуется. Чаще нужен порядок **в рамках одной бизнес-сущности**:\n\n```text\norder_id=42:\n\nOrderCreated\n    ↓\nOrderPaid\n    ↓\nOrderShipped\n```\n\nПри этом события разных заказов могут обрабатываться параллельно:\n\n```text\norder_id=42: Created → Paid → Shipped\norder_id=91: Created → Cancelled\n```\n\nЭто позволяет сохранить корректность без полной остановки параллелизма.\n\n### Почему порядок может нарушаться\n\nRabbitMQ хранит сообщения очереди упорядоченно, но наблюдаемый порядок обработки может измениться из-за:\n\n- нескольких конкурирующих Consumer-ов;\n    \n- параллельной обработки внутри Consumer-а;\n    \n- разных скоростей выполнения;\n    \n- `NACK` и повторной постановки в очередь;\n    \n- падения Consumer-а и redelivery;\n    \n- нескольких каналов публикации;\n    \n- приоритетных очередей.\n    \n\nНачальные доставки одному Consumer-у выполняются в порядке постановки в очередь, но конкурентные Consumer-ы и повторная доставка меняют фактический порядок завершения обработки. \n\n```text\nQueue:\nA → B → C\n\nConsumer 1 получает A — обрабатывает 10 секунд\nConsumer 2 получает B — обрабатывает 1 секунду\nConsumer 3 получает C — обрабатывает 2 секунды\n\nПорядок завершения:\nB → C → A\n```\n\n### 1. Использовать Single Active Consumer\n\nКогда необходим строгий порядок обработки одной очереди, можно включить `Single Active Consumer`, или SAC:\n\n```text\nQueue\n   ├── Consumer 1 — ACTIVE\n   ├── Consumer 2 — standby\n   └── Consumer 3 — standby\n```\n\nТолько один Consumer получает сообщения. Если он отключится, RabbitMQ автоматически выберет другого зарегистрированного Consumer-а. RabbitMQ рекомендует SAC для очередей, сообщения которых должны обрабатываться в порядке поступления. \n\nПри объявлении очереди:\n\n```python\nchannel.queue_declare(\n    queue=\"order_events\",\n    durable=True,\n    arguments={\n        \"x-single-active-consumer\": True,\n    },\n)\n```\n\nПри этом нужно учитывать внутреннюю параллельность приложения. Даже если RabbitMQ использует одного Consumer-а, тот может передавать сообщения нескольким потокам или процессам:\n\n```text\nRabbitMQ SAC\n      ↓\nодин Consumer\n      ↓\nthread/process pool\n├── task A\n├── task B\n└── task C\n```\n\nТогда порядок завершения снова нарушится. Для строгой последовательности обработка должна быть однопоточной:\n\n```text\nодна очередь\n+\nодин активный Consumer\n+\nодна выполняемая операция одновременно\n```\n\nНапример, для отдельного Celery Worker:\n\n```bash\ncelery -A app worker \\\n    -Q ordered_orders \\\n    --concurrency=1\n```\n\nНедостаток очевиден: одна очередь обрабатывается последовательно, поэтому пропускная способность ограничена скоростью одного обработчика.\n\n### 2. Разделить сообщения по ключу\n\nОбычно лучший вариант — не создавать одну глобально последовательную очередь, а партиционировать сообщения по ключу сущности:\n\n```text\nhash(order_id) % 4\n```\n\n```text\norder_id=42 → Queue 2\norder_id=91 → Queue 3\norder_id=17 → Queue 1\norder_id=66 → Queue 2\n```\n\nВсе события одного заказа всегда попадают в одну очередь:\n\n```text\nQueue 2:\nOrderCreated(42)\nOrderPaid(42)\nOrderShipped(42)\n```\n\nКаждая очередь имеет одного активного Consumer-а:\n\n```text\n             ┌── Queue 0 → SAC Consumer\nProducer ────┼── Queue 1 → SAC Consumer\n             ├── Queue 2 → SAC Consumer\n             └── Queue 3 → SAC Consumer\n```\n\nRabbitMQ предоставляет `x-modulus-hash` exchange, который стабильно маршрутизирует одинаковый routing key в одну очередь. В документации этот механизм прямо предлагается сочетать с SAC для сохранения порядка по конкретному ключу при параллельной обработке разных ключей. \n\n```text\nrouting_key = order_id\n```\n\nПреимущества:\n\n- события одной сущности последовательны;\n    \n- разные сущности обрабатываются параллельно;\n    \n- можно масштабироваться числом партиций;\n    \n- нет глобальной блокировки системы.\n    \n\nОграничение: число партиций и перераспределение ключей нужно продумывать заранее. Изменение схемы маршрутизации может направить новые события сущности в другую очередь, пока старые ещё не обработаны.\n\n### 3. Добавлять номер версии или последовательности\n\nКаждое сообщение должно содержать монотонно увеличивающийся номер:\n\n```json\n{\n  \"event_id\": \"9548309c-2162-4d1c-999f-fc15cedb0807\",\n  \"aggregate_id\": \"order-42\",\n  \"aggregate_version\": 7,\n  \"event_type\": \"OrderPaid\"\n}\n```\n\nСледующее событие:\n\n```json\n{\n  \"aggregate_id\": \"order-42\",\n  \"aggregate_version\": 8,\n  \"event_type\": \"OrderShipped\"\n}\n```\n\nConsumer хранит последнюю обработанную версию:\n\n```text\norder-42:\nlast_processed_version = 7\n```\n\nПравила обработки:\n\n```text\nversion == last_version + 1\n→ обработать\n\nversion <= last_version\n→ дубликат или устаревшее сообщение, пропустить\n\nversion > last_version + 1\n→ обнаружен пропуск\n```\n\nПример:\n\n```python\ndef handle_event(event: OrderEvent) -> None:\n    with database.transaction():\n        state = repository.lock(event.aggregate_id)\n\n        if event.version <= state.last_event_version:\n            return\n\n        if event.version != state.last_event_version + 1:\n            raise EventSequenceGap(\n                expected=state.last_event_version + 1,\n                received=event.version,\n            )\n\n        apply_event(state, event)\n        state.last_event_version = event.version\n\n        repository.save(state)\n```\n\nЭто не заставляет брокер доставлять сообщения правильно, но позволяет Consumer-у:\n\n- обнаруживать нарушение порядка;\n    \n- не применять устаревшее событие;\n    \n- распознавать дубликаты;\n    \n- не повреждать состояние.\n    \n\n### 4. Сделать операции устойчивыми к устаревшим сообщениям\n\nИногда последовательность можно защитить условным обновлением:\n\n```sql\nUPDATE orders\nSET\n    status = 'shipped',\n    version = 8\nWHERE id = 42\n  AND version = 7;\n```\n\nЕсли обновлена одна строка, событие применено:\n\n```text\nversion 7 → version 8\n```\n\nЕсли обновлено ноль строк:\n\n```text\nсостояние уже новее;\nпредыдущее событие отсутствует;\nсобытие доставлено повторно.\n```\n\nТакой optimistic concurrency control защищает от применения события к неправильной версии агрегата.\n\nДля простого обновления снимка можно принимать только более новую версию:\n\n```sql\nUPDATE product_read_model\nSET\n    name = :name,\n    price = :price,\n    source_version = :version\nWHERE product_id = :product_id\n  AND source_version < :version;\n```\n\nТогда поздно пришедшее старое сообщение не перезапишет новые данные.\n\n### 5. Использовать буфер переупорядочивания\n\nЕсли сообщения могут ненадолго приходить не по порядку, Consumer может временно сохранять будущие события:\n\n```text\nПолучено:\nversion 5\n\nОжидалось:\nversion 4\n```\n\nConsumer помещает `version=5` в буфер:\n\n```text\npending_events:\norder-42:\n    version 5\n```\n\nПосле получения `version=4`:\n\n```text\nобработать 4\nобработать сохранённое 5\n```\n\nУпрощённая логика:\n\n```python\ndef handle(event: Event) -> None:\n    expected = get_expected_version(event.aggregate_id)\n\n    if event.version < expected:\n        return\n\n    if event.version > expected:\n        save_to_reorder_buffer(event)\n        schedule_gap_check(event.aggregate_id)\n        return\n\n    process_in_sequence(event)\n    process_buffered_contiguous_events(event.aggregate_id)\n```\n\nОбязательно нужны:\n\n- ограниченный размер буфера;\n    \n- TTL;\n    \n- тайм-аут ожидания пропущенного события;\n    \n- DLQ или reconciliation при незакрытом разрыве;\n    \n- метрики количества gaps.\n    \n\nИначе одно потерянное событие может навсегда заблокировать обработку сущности.\n\n### 6. Не возвращать сообщение бесконечно в основную очередь\n\nПри строгом порядке возникает проблема:\n\n```text\nA → B → C\n```\n\n`A` завершилось ошибкой:\n\n```text\nA → NACK requeue\nB → успешно\nC → успешно\nA → повторная доставка\n```\n\nТеперь порядок нарушен.\n\nRabbitMQ предупреждает, что requeue и redelivery способны менять наблюдаемый порядок. Для сохранения порядка документация рекомендует контролировать возврат сообщений и использовать одну активную последовательность обработки. \n\nЕсли порядок критичен, есть несколько вариантов.\n\n#### Остановить обработку очереди до исправления A\n\n```text\nA failed\n   ↓\nConsumer прекращает брать новые сообщения\n   ↓\nA retry\n   ↓\nпосле успеха продолжаются B и C\n```\n\nЭто сохраняет строгий порядок, но одно проблемное сообщение блокирует очередь.\n\n#### Заблокировать только конкретный ключ\n\n```text\norder-42 заблокирован из-за ошибки\norder-91 продолжает обрабатываться\norder-15 продолжает обрабатываться\n```\n\nДля этого нужна партиционированная обработка или диспетчеризация по `aggregate_id`.\n\n#### Переместить проблемное сообщение в DLQ\n\n```text\nA failed → DLQ\nB и C продолжаются\n```\n\nЭто повышает доступность, но строгий порядок уже потерян. Подходит только если B и C умеют обнаружить отсутствующую версию и не применять её автоматически.\n\n### 7. Проектировать события так, чтобы порядок был менее важен\n\nПлохое событие:\n\n```json\n{\n  \"product_id\": 42,\n  \"operation\": \"increase_price\",\n  \"amount\": 100\n}\n```\n\nДва таких события зависят от порядка.\n\nИногда лучше отправлять новое состояние и его версию:\n\n```json\n{\n  \"product_id\": 42,\n  \"price\": 1500,\n  \"version\": 12\n}\n```\n\nConsumer применяет только более новую версию:\n\n```text\nversion 12 пришла раньше version 11\n\nприменить 12\nигнорировать 11\n```\n\nНо snapshot-события подходят не всегда. Например, финансовые проводки нельзя произвольно заменить последним состоянием без сохранения истории операций.\n\n### 8. Не использовать timestamp как единственный порядок\n\nВремя создания сообщения не является надёжным номером последовательности:\n\n```json\n{\n  \"created_at\": \"2026-07-27T12:00:00.123Z\"\n}\n```\n\nПроблемы:\n\n- часы разных серверов могут расходиться;\n    \n- два события могут иметь одинаковое время;\n    \n- повторная публикация получает другое время;\n    \n- сетевые задержки не связаны с временем создания.\n    \n\nДля порядка лучше использовать:\n\n```text\naggregate_version;\nsequence_number;\noffset;\nмонотонный номер из одного источника.\n```\n\nTimestamp можно оставить для аудита, но не как единственный механизм согласования.\n\n### 9. Рассмотреть RabbitMQ Streams\n\nКогда нужен журнал событий с устойчивой позицией, replay и последовательным чтением, RabbitMQ предлагает Streams.\n\nStream — append-only log, где каждому сообщению назначается неизменяемый offset. RabbitMQ называет Streams одним из двух основных способов сохранения порядка; второй — очередь с Single Active Consumer. \n\n```text\noffset 100: OrderCreated\noffset 101: OrderPaid\noffset 102: OrderShipped\n```\n\nConsumer хранит позицию:\n\n```text\nlast processed offset = 101\n```\n\nПосле перезапуска продолжает с `102`.\n\nStreams лучше подходят, когда нужны:\n\n- повторное чтение истории;\n    \n- несколько независимых Consumer-групп;\n    \n- длительное хранение событий;\n    \n- offsets;\n    \n- высокая пропускная способность;\n    \n- партиционированный журнал.\n    \n\nОбычные очереди подходят лучше для модели «сообщение обработано и удалено».\n\n### Практическая схема для Celery и RabbitMQ\n\nДопустим, задачи должны выполняться последовательно для каждого пользователя.\n\n```python\ndef queue_for_user(user_id: int, partitions: int = 8) -> str:\n    partition = user_id % partitions\n    return f\"user_tasks_{partition}\"\n```\n\nМаршрутизация:\n\n```python\ntask.apply_async(\n    args=[user_id, operation],\n    queue=queue_for_user(user_id),\n)\n```\n\nОчереди:\n\n```text\nuser_tasks_0\nuser_tasks_1\n...\nuser_tasks_7\n```\n\nДля каждой партиции запускается последовательный Worker:\n\n```bash\ncelery -A app worker \\\n    -Q user_tasks_0 \\\n    --concurrency=1\n```\n\nСообщение дополнительно содержит версию:\n\n```python\n@app.task\ndef process_user_operation(\n    user_id: int,\n    operation_id: str,\n    version: int,\n) -> None:\n    ...\n```\n\nТаким образом:\n\n```text\nпартиционирование\n→ одинаковый user_id всегда идёт в одну очередь\n\nconcurrency=1\n→ внутри партиции нет параллельного выполнения\n\nversion\n→ Consumer обнаруживает дубликаты и нарушение порядка\n```\n\n### Какой способ выбирать\n\n```text\nНужен строгий глобальный порядок\n→ одна очередь + Single Active Consumer\n  + последовательная обработка\n\nНужен порядок по order_id/user_id\n→ партиционирование по ключу\n  + один активный Consumer на партицию\n\nНужно обнаруживать неправильный порядок\n→ aggregate_version / sequence_number\n\nСобытия могут ненадолго перемешиваться\n→ reorder buffer + timeout\n\nНужны replay и offsets\n→ RabbitMQ Streams\n\nПорядок не должен влиять на результат\n→ идемпотентные операции\n  + применение только новой версии\n```\n\n### Рекомендуемый подход\n\nДля большинства бизнес-систем:\n\n```text\n1. Не требовать глобального порядка.\n2. Определить ключ упорядочивания: order_id, user_id, account_id.\n3. Направлять одинаковый ключ в одну партицию.\n4. Обрабатывать партицию последовательно.\n5. Добавлять aggregate_version.\n6. Делать обработчик идемпотентным.\n7. Не применять устаревшие версии.\n8. Обнаруживать пропуски последовательности.\n9. Ограничивать retries и использовать DLQ.\n10. Иметь reconciliation-процесс для восстановления состояния.\n```\n\nГлавный принцип:\n\n```text\nПорядок следует обеспечивать не глобально,\nа в пределах бизнес-сущности.\n\nBroker помогает направить сообщения последовательно,\nно окончательную корректность должны обеспечивать\nversioning, идемпотентность и проверки состояния\nна стороне Consumer-а.\n```"
