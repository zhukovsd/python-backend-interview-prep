[[questions]]
  id = 3
  question = "Для каких целей применяется RabbitMQ?"
  answer = "### Что такое RabbitMQ\n\n**RabbitMQ** — брокер сообщений. Он принимает сообщения от отправителей, маршрутизирует их через `exchange`, помещает в очереди и передаёт приложениям-получателям.\n\n```text\nProducer\n   │ публикует сообщение\n   ▼\nExchange\n   │ маршрутизирует\n   ▼\nQueue\n   │ хранит до обработки\n   ▼\nConsumer\n```\n\nRabbitMQ не выполняет бизнес-задачу самостоятельно. Он хранит и доставляет сообщения, а обработку выполняют Consumer-ы: Celery Worker, микросервис или отдельное приложение. RabbitMQ поддерживает очереди задач, публикацию событий нескольким получателям, маршрутизацию и модель request/reply. \n\n### 1. Асинхронная обработка\n\nRabbitMQ позволяет отправителю не ждать завершения операции:\n\n```text\nAPI\n │ создаёт сообщение\n ▼\nRabbitMQ\n │\n ▼\nWorker обрабатывает позднее\n```\n\nНапример:\n\n```text\nHTTP-запрос\n    ↓\nсоздание задания\n    ↓\nпубликация сообщения\n    ↓\nответ клиенту: 202 Accepted\n    ↓\nфоновая обработка Worker-ом\n```\n\nЭто применяется для:\n\n- отправки писем и уведомлений;\n    \n- генерации отчётов;\n    \n- обработки файлов;\n    \n- импорта данных;\n    \n- обращения к медленным внешним системам;\n    \n- массовой обработки записей.\n    \n\nRabbitMQ в таком сценарии отделяет создание задания от его выполнения.\n\n### 2. Очередь фоновых задач\n\nНесколько Worker-ов могут читать одну очередь:\n\n```text\n                   ┌── Worker 1\nProducer → Queue ──┼── Worker 2\n                   └── Worker 3\n```\n\nКаждое сообщение из рабочей очереди передаётся одному Consumer-у. Это позволяет распределять длительные задачи между несколькими Worker-ами — паттерн `competing consumers`. \n\nНапример:\n\n```text\n10 000 батчей\n      ↓\nbatch_processing_queue\n      ↓\n20 Worker-ов обрабатывают батчи параллельно\n```\n\n### 3. Буферизация всплесков нагрузки\n\nДопустим, API за минуту создаёт 10 000 задач, но Worker-ы способны обрабатывать только 2 000 задач в минуту.\n\nБез очереди приложение может перегрузить обработчики или зависимые системы:\n\n```text\nProducer ─────────────> Worker\n10 000 сообщений        перегрузка\n```\n\nС RabbitMQ:\n\n```text\nProducer\n   │ быстро публикует\n   ▼\nQueue: 10 000 сообщений\n   │ выдаёт постепенно\n   ▼\nWorker-ы\n```\n\nОчередь временно накапливает сообщения, а Consumer-ы забирают их в доступном темпе. При ручных подтверждениях параметр `prefetch` ограничивает количество сообщений, одновременно находящихся у Consumer-а без подтверждения, что помогает не перегружать обработчик. \n\nRabbitMQ при этом не отменяет необходимость контролировать длину очередей, скорость Producer-ов, TTL и ресурсные лимиты.\n\n### 4. Ослабление связанности компонентов\n\nБез брокера один сервис напрямую зависит от другого:\n\n```text\nOrder Service ──HTTP──> Notification Service\n```\n\nЕсли `Notification Service` недоступен, запрос может завершиться ошибкой или ожиданием тайм-аута.\n\nЧерез RabbitMQ:\n\n```text\nOrder Service\n      │ OrderCreated\n      ▼\nRabbitMQ\n      │\n      ▼\nNotification Service\n```\n\n`Order Service` публикует сообщение и не обязан знать:\n\n- где запущен получатель;\n    \n- сколько экземпляров Consumer-а работает;\n    \n- когда именно сообщение будет обработано;\n    \n- каким внутренним способом отправляется уведомление.\n    \n\nЭто снижает временную связанность: отправитель и получатель необязательно должны быть доступны одновременно.\n\n### 5. Передача событий нескольким системам\n\nОдно событие может понадобиться сразу нескольким сервисам:\n\n```text\n                ┌──> Notification Queue\nOrderCreated ───┼──> Analytics Queue\n                ├──> Delivery Queue\n                └──> Audit Queue\n```\n\nКаждая очередь получает свою копию сообщения, а сервисы обрабатывают событие независимо.\n\nЭто паттерн `publish/subscribe`. В отличие от рабочей очереди, где одно сообщение получает один Worker, при publish/subscribe одно опубликованное событие может быть доставлено нескольким независимым Consumer-ам через разные очереди. \n\n### 6. Маршрутизация сообщений\n\nProducer обычно публикует сообщение не напрямую в очередь, а в `exchange`:\n\n```text\nProducer\n   │ routing_key = payment.succeeded\n   ▼\nExchange\n   ├──> notification_queue\n   ├──> accounting_queue\n   └──> audit_queue\n```\n\nExchange определяет, в какие очереди направить сообщение, исходя из своих привязок и routing key.\n\nОсновные варианты маршрутизации:\n\n```text\ndirect  — точное совпадение routing key;\ntopic   — совпадение с шаблоном;\nfanout  — отправка во все связанные очереди;\nheaders — маршрутизация по заголовкам.\n```\n\nОфициальные руководства RabbitMQ отдельно рассматривают routing, topic routing и publish/subscribe как базовые модели взаимодействия. \n\nПример topic-маршрутизации:\n\n```text\npayment.succeeded\npayment.failed\norder.created\norder.cancelled\n```\n\nПодписка:\n\n```text\npayment.*\n```\n\nполучит события, связанные с платежами.\n\n### 7. Подтверждение обработки сообщений\n\nПри ручном подтверждении Consumer отправляет `ack` после успешной обработки:\n\n```text\nRabbitMQ → Consumer: сообщение\nConsumer выполняет операцию\nConsumer → RabbitMQ: ACK\nRabbitMQ удаляет сообщение из очереди\n```\n\nЕсли соединение или Consumer завершатся до подтверждения, неподтверждённое сообщение может быть повторно доставлено. Подтверждение означает, что Consumer принял ответственность за доставку. \n\nИз этого следует важное требование:\n\n```text\nConsumer должен быть идемпотентным.\n```\n\nНапример:\n\n```python\ndef handle_payment(message: PaymentMessage) -> None:\n    if processed_messages.exists(message.id):\n        return\n\n    process_payment(message)\n    processed_messages.save(message.id)\n```\n\nRabbitMQ не следует воспринимать как механизм гарантированного выполнения «ровно один раз». При сбоях и повторной доставке сообщение может быть обработано повторно.\n\n### 8. Подтверждение публикации\n\nConsumer acknowledgements подтверждают обработку со стороны получателя.\n\nДля Producer существует отдельный механизм — `publisher confirms`:\n\n```text\nProducer → RabbitMQ: сообщение\nRabbitMQ → Producer: сообщение принято\n```\n\nОн позволяет отправителю понять, принял ли RabbitMQ публикацию. Для надёжной доставки обычно комбинируют:\n\n```text\npublisher confirms;\ndurable queue;\npersistent messages;\nconsumer acknowledgements;\nидемпотентную обработку.\n```\n\nRabbitMQ подчёркивает, что долговечность очереди и сообщений настраивается отдельно: durable-очередь восстанавливается после перезапуска, а сохраняемые сообщения должны быть опубликованы как persistent. \n\nПри этом даже такая конфигурация требует корректной обработки ошибок и повторов на уровне приложения.\n\n### 9. Повторные попытки и проблемные сообщения\n\nЕсли сообщение временно невозможно обработать, применяют:\n\n```text\nосновная очередь\n      ↓ ошибка\nretry queue\n      ↓ задержка\nосновная очередь\n```\n\nЕсли сообщение окончательно не обрабатывается, его можно направить в Dead Letter Exchange:\n\n```text\nprocessing_queue\n      │ reject / TTL / delivery limit\n      ▼\nDead Letter Exchange\n      ▼\ndead_letter_queue\n```\n\nСообщение может попасть в DLX, например, после отрицательного подтверждения без повторной постановки, истечения TTL, превышения длины очереди или лимита доставок quorum queue. \n\nDead-letter queue позволяет:\n\n- не блокировать основную очередь;\n    \n- сохранить сведения об ошибке;\n    \n- исследовать проблемное сообщение;\n    \n- повторно обработать его после исправления причины.\n    \n\n### 10. Отложенная обработка и TTL\n\nRabbitMQ поддерживает TTL для сообщений и очередей. После истечения TTL сообщение может быть удалено или отправлено в DLX при соответствующей настройке. \n\nЭто используют для:\n\n```text\nотложенных повторных попыток;\nвременных сообщений;\nограничения срока актуальности команды;\nавтоматической очистки временных очередей.\n```\n\nRabbitMQ не является полноценным бизнес-планировщиком. Для сложного расписания обычно используют Celery Beat, cron, отдельный scheduler или таблицу запланированных операций.\n\n### 11. Межсервисное взаимодействие\n\nВ микросервисной архитектуре RabbitMQ применяют для асинхронных команд и событий:\n\n```text\nКоманда:\nSendNotification\nReserveProduct\nGenerateReport\n\nСобытие:\nOrderCreated\nPaymentSucceeded\nUserRegistered\n```\n\nРазличие по смыслу:\n\n```text\nКоманда:\nконкретному получателю предлагается выполнить действие.\n\nСобытие:\nфиксируется уже произошедший факт;\nполучателей может быть несколько.\n```\n\nНапример:\n\n```text\nPayment Service\n      │ PaymentSucceeded\n      ▼\nRabbitMQ\n      ├──> Order Service\n      ├──> Notification Service\n      └──> Analytics Service\n```\n\n### 12. Работа RabbitMQ с Celery\n\nПри использовании Celery RabbitMQ обычно выступает в роли `broker`:\n\n```text\nFastAPI / Django\n      │ task.delay(...)\n      ▼\nRabbitMQ\n      │ сообщение о задаче\n      ▼\nCelery Worker\n      │\n      ▼\nвыполнение функции\n```\n\nРазделение ответственности:\n\n```text\nCelery:\nопределяет задачи;\nзапускает Worker-ы;\nподдерживает retries, Canvas и расписание;\nуправляет выполнением задач.\n\nRabbitMQ:\nпринимает сообщения;\nмаршрутизирует их;\nхранит в очередях;\nдоставляет Worker-ам;\nобрабатывает acknowledgements.\n```\n\nRabbitMQ не заменяет Celery, а Celery не является брокером сообщений.\n\n### 13. Высокая доступность очередей\n\nДля очередей, которым требуется репликация и высокая доступность, RabbitMQ предлагает quorum queues. Они используют Raft и предназначены для надёжного хранения и быстрого выбора лидера при отказах. Официальная документация рекомендует рассматривать quorum queue как основной выбор, когда необходима реплицируемая высокодоступная очередь. \n\nНо репликация увеличивает:\n\n- использование диска;\n    \n- сетевой трафик;\n    \n- задержку подтверждения;\n    \n- инфраструктурную сложность.\n    \n\nПоэтому тип очереди выбирают исходя из требований к сохранности сообщений и доступности.\n\n### Где RabbitMQ не нужен\n\nRabbitMQ может быть избыточен, когда:\n\n- операция должна завершиться до ответа клиенту;\n    \n- достаточно обычного вызова функции;\n    \n- компоненты находятся внутри одного процесса;\n    \n- нет потребности в буферизации или повторной доставке;\n    \n- требуется простой синхронный запрос-ответ;\n    \n- объём системы не оправдывает эксплуатацию брокера.\n    \n\nRabbitMQ поддерживает паттерн RPC, но для обычных синхронных межсервисных запросов HTTP или gRPC часто проще: RabbitMQ RPC требует correlation ID, reply queue, тайм-аутов, дедупликации и обработки потерянных ответов. Сам RabbitMQ приводит RPC как отдельный request/reply-паттерн, а не как основной режим работы брокера. \n\n### Итог\n\nRabbitMQ применяется для:\n\n```text\nасинхронного выполнения работы;\nочередей фоновых задач;\nбуферизации всплесков нагрузки;\nраспределения задач между Worker-ами;\nослабления связанности сервисов;\nпубликации событий нескольким системам;\nмаршрутизации сообщений;\nповторной доставки после сбоев;\ndead-letter и retry-механизмов;\nгоризонтального масштабирования Consumer-ов.\n```\n\nОсновная роль RabbitMQ:\n\n```text\nНадёжно передать сообщение\nот Producer к одному или нескольким Consumer-ам,\nне заставляя их работать синхронно и напрямую зависеть друг от друга.\n```"
