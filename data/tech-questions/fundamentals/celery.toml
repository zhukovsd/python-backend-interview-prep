  question = "Механизм доставки сообщений в RabbitMQ"
  answer = "### Общая схема доставки\n\nВ RabbitMQ сообщение проходит следующий путь:\n\n```text\nProducer\n   │ publish(message, exchange, routing_key)\n   ▼\nExchange\n   │ проверяет bindings\n   ▼\nQueue\n   │ хранит сообщение\n   ▼\nConsumer\n   │ обрабатывает\n   ▼\nACK / NACK\n```\n\nProducer обычно публикует сообщение в `exchange`. Exchange маршрутизирует его в одну или несколько очередей, после чего RabbitMQ доставляет сообщение подписанному Consumer-у. \n\n### 1. Подключение Producer-а\n\nProducer устанавливает TCP-соединение с RabbitMQ и открывает внутри него AMQP-channel:\n\n```text\nProducer\n   │\n   └── TCP connection\n          └── Channel\n```\n\nЧерез channel выполняются:\n\n```text\nобъявление exchange и очередей;\nсоздание bindings;\nпубликация сообщений;\nполучение publisher confirms.\n```\n\nChannels позволяют выполнять несколько логических операций поверх одного соединения.\n\n### 2. Публикация сообщения\n\nProducer указывает:\n\n```text\nexchange;\nrouting_key;\npayload;\nproperties;\nheaders.\n```\n\nНапример:\n\n```python\nchannel.basic_publish(\n    exchange=\"domain_events\",\n    routing_key=\"order.created\",\n    body=b'{\"order_id\": 42}',\n    properties=properties,\n)\n```\n\nСообщение может содержать свойства:\n\n```text\nmessage_id;\ncontent_type;\ndelivery_mode;\ntimestamp;\ntype;\nheaders.\n```\n\n`delivery_mode=2` обозначает persistent-сообщение, а `delivery_mode=1` — transient.\n\n### 3. Publisher confirm\n\nЗапись данных в сетевой сокет ещё не означает, что RabbitMQ получил и принял сообщение. Поэтому для надёжной публикации применяется `publisher confirms`:\n\n```text\nProducer ── message ──> RabbitMQ\nProducer <── confirm ── RabbitMQ\n```\n\nПосле перевода channel в confirm mode RabbitMQ подтверждает каждую публикацию через `basic.ack` либо отклоняет её через `basic.nack`. Publisher confirms относятся только к участку **Producer → RabbitMQ** и не означают, что Consumer уже обработал сообщение. \n\nДля persistent-сообщения, направленного в durable-очередь, подтверждение обычно отправляется после сохранения сообщения. Для quorum queue — после принятия сообщения кворумом реплик.\n\n### 4. Маршрутизация через Exchange\n\nExchange не хранит сообщения как обычная очередь. Он определяет, куда их направить.\n\n```text\nProducer\n   │ routing_key = order.created\n   ▼\nExchange: domain_events\n   ├──> notification_queue\n   ├──> analytics_queue\n   └──> audit_queue\n```\n\nРешение принимается на основе:\n\n```text\nтипа exchange;\nrouting key сообщения;\nbindings;\nbinding keys;\nзаголовков.\n```\n\nBinding связывает exchange с очередью:\n\n```text\nExchange ── binding ──> Queue\n```\n\nВ RabbitMQ сообщение может быть направлено сразу в несколько очередей, если оно подходит под несколько bindings. \n\n### Типы Exchange\n\n#### Direct\n\nТребует точного совпадения `routing_key` и `binding_key`:\n\n```text\nrouting_key: payment.succeeded\nbinding_key: payment.succeeded\n```\n\n#### Topic\n\nПоддерживает шаблоны:\n\n```text\norder.created\norder.cancelled\norder.completed\n```\n\nBinding:\n\n```text\norder.*\n```\n\n#### Fanout\n\nОтправляет сообщение во все связанные очереди, игнорируя routing key:\n\n```text\n                  ┌──> queue_a\nProducer → fanout ┼──> queue_b\n                  └──> queue_c\n```\n\n#### Headers\n\nМаршрутизирует по заголовкам сообщения.\n\n### 5. Что происходит с немаршрутизируемым сообщением\n\nЕсли ни один binding не подходит, сообщение не попадает ни в одну очередь.\n\n```text\nProducer\n   ↓\nExchange\n   ↓\nподходящих bindings нет\n   ↓\nсообщение не маршрутизировано\n```\n\nPublisher confirm при этом сам по себе не гарантирует попадание в очередь: RabbitMQ может подтвердить, что exchange обработал публикацию, даже если подходящая очередь не найдена.\n\nДля обнаружения такого случая используется `mandatory=True`. Тогда RabbitMQ возвращает сообщение Producer-у через `basic.return` до отправки publisher confirm. \n\n```python\nchannel.basic_publish(\n    exchange=\"domain_events\",\n    routing_key=\"unknown.event\",\n    body=payload,\n    mandatory=True,\n)\n```\n\n### 6. Попадание сообщения в очередь\n\nПосле маршрутизации сообщение помещается в подходящие очереди:\n\n```text\nQueue\n├── message 1\n├── message 2\n├── message 3\n└── message 4\n```\n\nОчередь хранит сообщение, пока:\n\n```text\nConsumer не подтвердит обработку;\nне истечёт TTL;\nсообщение не будет удалено политикой;\nоно не попадёт в Dead Letter Exchange;\nочередь не будет удалена.\n```\n\nДля переживания перезапуска RabbitMQ обычно сочетают:\n\n```text\ndurable queue;\npersistent message;\npublisher confirms.\n```\n\nДля реплицируемых критичных очередей могут использоваться quorum queues; RabbitMQ рекомендует сочетать их с publisher confirms и ручными Consumer acknowledgements. \n\n### 7. Подписка Consumer-а\n\nConsumer регистрируется на определённой очереди:\n\n```text\nConsumer ── basic.consume ──> Queue\n```\n\nПосле подписки RabbitMQ обычно **push-ит** сообщения Consumer-у асинхронно.\n\n```text\nQueue ── basic.deliver ──> Consumer\n```\n\nAMQP 0-9-1 также поддерживает одиночное получение через `basic.get`, но обычная длительная обработка строится через Consumer subscription. \n\nПри доставке RabbitMQ передаёт:\n\n```text\npayload;\nproperties;\nrouting key;\nexchange;\ndelivery tag;\nredelivered flag.\n```\n\n`delivery_tag` идентифицирует конкретную доставку внутри channel. Подтвердить сообщение необходимо на том же channel, на котором оно было получено. \n\n### 8. Распределение между несколькими Consumer-ами\n\nЕсли одну очередь читают несколько Consumer-ов:\n\n```text\n              ┌──> Consumer 1\nQueue ────────┼──> Consumer 2\n              └──> Consumer 3\n```\n\nодно сообщение передаётся одному подходящему Consumer-у. RabbitMQ распределяет сообщения между Consumer-ами с учётом их доступности и количества уже выданных, но ещё не подтверждённых сообщений.\n\n```text\nmessage 1 → Consumer 1\nmessage 2 → Consumer 2\nmessage 3 → Consumer 3\n```\n\nПри нескольких Consumer-ах, повторной доставке и разном времени обработки фактический порядок завершения сообщений уже не обязан соответствовать исходному порядку очереди.\n\n### 9. Prefetch\n\nRabbitMQ может отправить Consumer-у несколько сообщений, не дожидаясь подтверждения каждого:\n\n```text\nConsumer\n├── message 1 — processing\n├── message 2 — waiting\n├── message 3 — waiting\n└── message 4 — waiting\n```\n\nКоличество неподтверждённых сообщений ограничивается через `prefetch`:\n\n```python\nchannel.basic_qos(prefetch_count=10)\n```\n\nПри `prefetch_count=10` RabbitMQ перестаёт отправлять новые сообщения этому Consumer-у после накопления десяти неподтверждённых доставок. Доставка продолжится после получения хотя бы одного ACK. Значение `0` означает отсутствие такого ограничения.\n\nPrefetch нужен для:\n\n```text\nзащиты Consumer-а от перегрузки;\nсправедливого распределения задач;\nограничения потребления памяти;\nуправления количеством параллельной работы.\n```\n\n### 10. Обработка и ACK\n\nПри ручных подтверждениях нормальная последовательность выглядит так:\n\n```text\nRabbitMQ доставляет сообщение\n        ↓\nConsumer проверяет сообщение\n        ↓\nConsumer выполняет операцию\n        ↓\nCOMMIT в БД\n        ↓\nConsumer отправляет ACK\n        ↓\nRabbitMQ удаляет сообщение\n```\n\n```python\ndef handle(channel, method, properties, body):\n    process_message(body)\n\n    channel.basic_ack(\n        delivery_tag=method.delivery_tag,\n    )\n```\n\nRabbitMQ рекомендует отправлять ACK только после выполнения всех действий, за которые отвечает Consumer. После ACK брокер может удалить доставку. \n\n### 11. Автоматическое подтверждение\n\nВ автоматическом режиме RabbitMQ считает сообщение доставленным сразу после записи в сетевой сокет Consumer-а:\n\n```text\nRabbitMQ отправил сообщение\n        ↓\nсчитает его обработанным\n        ↓\nConsumer упал\n        ↓\nсообщение может быть потеряно\n```\n\nAutomatic acknowledgement даёт меньшие накладные расходы, но предоставляет наименьшие гарантии при сбоях. Официальная документация рекомендует в общем случае сначала рассматривать manual acknowledgement. \n\n### 12. Ошибка обработки: NACK и Reject\n\nПри ошибке Consumer может отрицательно подтвердить доставку.\n\n#### Вернуть сообщение в очередь\n\n```python\nchannel.basic_nack(\n    delivery_tag=method.delivery_tag,\n    requeue=True,\n)\n```\n\n```text\nвременная ошибка\n      ↓\nNACK + requeue\n      ↓\nсообщение снова доступно Consumer-ам\n```\n\n#### Не возвращать в очередь\n\n```python\nchannel.basic_nack(\n    delivery_tag=method.delivery_tag,\n    requeue=False,\n)\n```\n\nТогда сообщение:\n\n```text\nудаляется;\nили направляется в Dead Letter Exchange,\nесли DLX настроен.\n```\n\nБесконечный `requeue=True` опасен:\n\n```text\nполучение → ошибка → requeue\n    ↑                     │\n    └─────────────────────┘\n```\n\nДля временных ошибок обычно создают ограниченный retry-механизм, а окончательно неисправные сообщения отправляют в DLQ.\n\n### 13. Падение Consumer-а\n\nПри manual acknowledgement, если Consumer, channel или соединение закрывается до ACK, RabbitMQ автоматически возвращает неподтверждённое сообщение в очередь:\n\n```text\nConsumer получил сообщение\n        ↓\nConsumer упал до ACK\n        ↓\nRabbitMQ выполняет requeue\n        ↓\nсообщение получает другой Consumer\n```\n\nПри повторной доставке поле `redelivered` устанавливается в `true`. Consumer должен быть готов к дубликатам и проектироваться идемпотентно. \n\n### 14. Почему возможны дубликаты\n\nРассмотрим обработку:\n\n```text\n1. Consumer обновил БД\n2. Consumer должен отправить ACK\n3. Consumer упал до ACK\n4. RabbitMQ доставил сообщение повторно\n```\n\nRabbitMQ не знает, был ли выполнен `COMMIT`, поэтому дубликат является нормальной частью `at-least-once` доставки.\n\nConsumer должен проверять `message_id`:\n\n```sql\nCREATE TABLE processed_messages (\n    consumer_name TEXT NOT NULL,\n    message_id UUID NOT NULL,\n    processed_at TIMESTAMPTZ NOT NULL DEFAULT now(),\n\n    PRIMARY KEY (consumer_name, message_id)\n);\n```\n\n```text\nПервая доставка:\nmessage_id отсутствует\n→ выполнить операцию\n\nПовторная доставка:\nmessage_id уже существует\n→ не повторять операцию\n```\n\nRabbitMQ прямо указывает, что acknowledgements обеспечивают модель `at-least-once`, а без них возможна потеря сообщений и семантика становится близкой к `at-most-once`. \n\n### Полный механизм доставки\n\n```text\n1. Producer открывает connection и channel\n\n2. Producer публикует:\n   exchange + routing_key + payload\n\n3. Exchange проверяет bindings\n\n4. Сообщение направляется\n   в одну или несколько очередей\n\n5. Очередь сохраняет сообщение\n\n6. RabbitMQ выбирает подходящего Consumer-а\n\n7. RabbitMQ отправляет сообщение\n   вместе с delivery_tag\n\n8. Consumer выполняет бизнес-операцию\n\n9. Consumer отправляет:\n   ACK\n   или NACK/reject\n\n10. RabbitMQ:\n    ACK            → удаляет сообщение\n    NACK + requeue → возвращает в очередь\n    NACK без requeue → удаляет или отправляет в DLQ\n```\n\n### Два независимых подтверждения\n\nВажно не путать:\n\n```text\nPublisher confirm\nProducer <── RabbitMQ\n```\n\nи:\n\n```text\nConsumer ACK\nRabbitMQ <── Consumer\n```\n\n|Механизм|Что подтверждает|\n|---|---|\n|Publisher confirm|RabbitMQ принял публикацию|\n|Consumer ACK|Consumer завершил обработку|\n|Consumer NACK|Consumer не смог обработать сообщение|\n|`mandatory` + `basic.return`|Сообщение не удалось направить в очередь|\n\nPublisher confirms и Consumer acknowledgements решают разные задачи и не связаны напрямую.\n\n### Итог\n\nМеханизм RabbitMQ строится вокруг пяти операций:\n\n```text\nПубликация\n    ↓\nМаршрутизация\n    ↓\nХранение в очереди\n    ↓\nДоставка Consumer-у\n    ↓\nПодтверждение или повторная доставка\n```\n\nДля надёжной схемы обычно используют:\n\n```text\nProducer:\npublisher confirms\n+ mandatory publishing\n\nRabbitMQ:\ndurable или quorum queue\n+ persistent messages\n\nConsumer:\nmanual ACK\n+ prefetch\n+ ограниченные retries\n+ DLQ\n+ идемпотентность\n```\n\nЭто даёт практическую семантику `at-least-once`: сообщение стараются не потерять, но оно может быть доставлено и обработано повторно."
