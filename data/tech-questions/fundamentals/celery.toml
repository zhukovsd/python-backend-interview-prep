  id = 8
  question = "Из каких основных компонентов состоит брокер сообщений?"
  answer = "### Основные компоненты брокера сообщений\n\nВ типовой системе обмена сообщениями участвуют:\n\n```text\nProducer\n   │ публикует Message\n   ▼\nBroker\n   │ маршрутизирует и хранит\n   ▼\nQueue / Topic\n   │\n   ▼\nConsumer\n```\n\nСам брокер находится между отправителями и получателями: принимает сообщения от Producer-ов, определяет место назначения, сохраняет их и доставляет Consumer-ам. В RabbitMQ приложения обычно публикуют сообщения в `exchange`, после чего они маршрутизируются в очереди по правилам `binding`. \n\n### 1. Producer\n\n**Producer**, или Publisher, — приложение, которое создаёт и отправляет сообщение.\n\nНапример:\n\n```text\nOrder Service\n    │\n    │ OrderCreated\n    ▼\nRabbitMQ\n```\n\nProducer обычно определяет:\n\n- тело сообщения;\n    \n- тип события или команды;\n    \n- идентификатор сообщения;\n    \n- routing key;\n    \n- заголовки;\n    \n- параметры сохранения;\n    \n- срок жизни сообщения.\n    \n\nПример сообщения:\n\n```json\n{\n  \"message_id\": \"evt-125\",\n  \"event_type\": \"OrderCreated\",\n  \"order_id\": 42,\n  \"created_at\": \"2026-07-27T10:00:00Z\"\n}\n```\n\n### 2. Message\n\n**Message** — единица передаваемых данных.\n\nОбычно оно состоит из двух частей:\n\n```text\nMessage\n├── Headers / Properties\n└── Payload\n```\n\nПример:\n\n```text\nHeaders:\nmessage_id = evt-125\ncontent_type = application/json\nrouting_key = order.created\n\nPayload:\n{\n  \"order_id\": 42\n}\n```\n\nBroker обычно не обязан понимать бизнес-смысл содержимого сообщения. Для него важнее адрес, routing key, заголовки и параметры доставки.\n\n### 3. Exchange или маршрутизатор\n\nВ RabbitMQ Producer обычно отправляет сообщение в **exchange**, а не напрямую Consumer-у.\n\n```text\nProducer\n   │ routing_key=payment.succeeded\n   ▼\nExchange\n   ├──> accounting_queue\n   ├──> notification_queue\n   └──> audit_queue\n```\n\nExchange принимает сообщение и определяет, в какие очереди его направить. Алгоритм маршрутизации зависит от типа exchange и настроенных bindings. RabbitMQ поддерживает основные типы `direct`, `fanout`, `topic` и `headers`. \n\n#### Direct exchange\n\nМаршрутизация по точному совпадению ключа:\n\n```text\nrouting_key = payment.succeeded\n        ↓\nbinding_key = payment.succeeded\n```\n\n#### Fanout exchange\n\nОтправляет копию сообщения во все связанные очереди:\n\n```text\n                 ┌──> analytics\nEvent → fanout ──┼──> notifications\n                 └──> audit\n```\n\n#### Topic exchange\n\nМаршрутизирует по шаблону:\n\n```text\nСобытия:\norder.created\norder.cancelled\npayment.succeeded\n\nBinding:\norder.*\n```\n\n#### Headers exchange\n\nИспользует значения заголовков вместо routing key.\n\nExchange — особенность модели AMQP/RabbitMQ. В других брокерах аналогичную роль могут выполнять topics, subscriptions или другие механизмы маршрутизации.\n\n### 4. Binding\n\n**Binding** — правило связи между exchange и очередью.\n\n```text\nExchange ── binding ──> Queue\n```\n\nНапример:\n\n```text\nExchange: domain_events\nQueue: notification_queue\nBinding key: order.*\n```\n\nЭто означает, что подходящие события заказов будут направляться в очередь уведомлений.\n\nBinding может содержать `binding key`, который служит фильтром для определённых типов exchange. У одного exchange может быть несколько bindings, а одна очередь может быть связана с несколькими exchange. \n\n### 5. Queue\n\n**Queue** — хранилище сообщений, ожидающих обработки.\n\n```text\nQueue\n├── Message 1\n├── Message 2\n├── Message 3\n└── Message 4\n```\n\nОчередь разделяет скорость Producer-а и Consumer-а:\n\n```text\nProducer: создаёт 1000 сообщений/с\nConsumer: обрабатывает 300 сообщений/с\n                    ↓\n         остаток временно хранится\n              в очереди\n```\n\nВ RabbitMQ очередь представляет собой упорядоченную коллекцию сообщений, но фактический порядок обработки может изменяться при нескольких конкурирующих Consumer-ах, повторной доставке и приоритетах. \n\nДля очереди обычно настраивают:\n\n- имя;\n    \n- долговечность;\n    \n- максимальную длину;\n    \n- TTL;\n    \n- тип очереди;\n    \n- Dead Letter Exchange;\n    \n- количество Consumer-ов;\n    \n- политику репликации.\n    \n\n### 6. Consumer\n\n**Consumer** — приложение, которое подписывается на очередь и обрабатывает сообщения.\n\n```text\nQueue\n   ├──> Consumer 1\n   ├──> Consumer 2\n   └──> Consumer 3\n```\n\nНапример:\n\n```python\ndef handle_order_created(message: dict) -> None:\n    send_confirmation_email(\n        order_id=message[\"order_id\"],\n    )\n```\n\nЕсли несколько Consumer-ов читают одну очередь, они обычно конкурируют за сообщения:\n\n```text\nMessage 1 → Consumer 1\nMessage 2 → Consumer 2\nMessage 3 → Consumer 1\n```\n\nОдно сообщение рабочей очереди обычно передаётся одному Consumer-у, а не всем сразу. Для доставки одного события нескольким системам создают несколько очередей, связанных с одним exchange.\n\n### 7. Acknowledgement\n\n**Acknowledgement**, или `ACK`, — подтверждение от Consumer-а, что сообщение успешно обработано.\n\n```text\nBroker → Consumer: Message\nConsumer → БД: COMMIT\nConsumer → Broker: ACK\n```\n\nПосле ACK брокер может удалить сообщение из очереди.\n\nПри ошибке Consumer может отправить отрицательное подтверждение:\n\n```text\nNACK + requeue=true\n→ вернуть сообщение в очередь\n\nNACK + requeue=false\n→ удалить или направить в DLQ\n```\n\nRabbitMQ использует Consumer acknowledgements отдельно от Publisher confirms: первые относятся к обработке сообщения Consumer-ом, вторые — к принятию публикации Broker-ом.\n\n### 8. Publisher confirm\n\nPublisher confirm — подтверждение Producer-у, что Broker принял публикацию.\n\n```text\nProducer ── Message ──> Broker\nProducer <── Confirm ── Broker\n```\n\nЭто не означает, что Consumer уже выполнил задачу:\n\n```text\nPublisher confirm:\nсообщение принято RabbitMQ\n\nConsumer ACK:\nсообщение обработано Consumer-ом\n```\n\nЭти подтверждения защищают разные участки доставки.\n\n### 9. Dead Letter Queue\n\n**Dead Letter Queue**, или DLQ, хранит сообщения, которые не удалось нормально обработать.\n\n```text\nMain Queue\n    │ ошибка после нескольких retries\n    ▼\nDead Letter Exchange\n    ▼\nDead Letter Queue\n```\n\nТуда могут попадать сообщения:\n\n- отклонённые без `requeue`;\n    \n- с истёкшим TTL;\n    \n- превысившие лимит доставок;\n    \n- вытесненные из-за ограничения длины очереди.\n    \n\nDLQ позволяет не создавать бесконечный цикл обработки неисправного сообщения и сохраняет его для анализа или ручного повторного запуска.\n\n### 10. Retry queue\n\nRetry queue используется для отложенной повторной обработки:\n\n```text\nMain Queue\n    │ временная ошибка\n    ▼\nRetry Queue\n    │ TTL: 30 секунд\n    ▼\nMain Queue\n```\n\nRetry и DLQ не всегда являются отдельными встроенными сущностями брокера. Часто это обычные очереди, которым задают специальные TTL, bindings и dead-letter policies.\n\n### 11. Connection\n\nКлиентские приложения подключаются к брокеру через сетевое соединение:\n\n```text\nApplication ── TCP/TLS connection ──> RabbitMQ\n```\n\nСоединение обычно является долгоживущим. Создавать новое TCP-соединение для каждого сообщения слишком дорого. RabbitMQ поддерживает несколько протоколов, а AMQP-соединения обычно сохраняются и переиспользуются приложением.\n\n### 12. Channel\n\nВ AMQP 0-9-1 внутри одного TCP-соединения могут существовать несколько логических **channels**:\n\n```text\nTCP Connection\n├── Channel 1 → publishing\n├── Channel 2 → consuming\n└── Channel 3 → topology operations\n```\n\nChannel — облегчённая логическая связь, разделяющая одно физическое TCP-соединение. Через channels приложение объявляет exchange и очереди, публикует сообщения и запускает Consumer-ов. \n\n### 13. Virtual host\n\nВ RabbitMQ `virtual host` логически изолирует ресурсы:\n\n```text\nRabbitMQ cluster\n├── vhost: production\n│   ├── exchanges\n│   ├── queues\n│   └── bindings\n│\n└── vhost: testing\n    ├── exchanges\n    ├── queues\n    └── bindings\n```\n\nВнутри vhost находятся:\n\n- exchanges;\n    \n- queues;\n    \n- bindings;\n    \n- permissions;\n    \n- policies.\n    \n\nVirtual hosts обеспечивают логическое разделение, но не являются физически независимыми RabbitMQ-кластерами. Права пользователей также назначаются в контексте конкретного vhost. \n\n### 14. Управление доступом\n\nБрокер также включает инфраструктуру безопасности:\n\n```text\nAuthentication:\nкто подключается\n\nAuthorization:\nчто этому клиенту разрешено\n\nTLS:\nзащита сетевого трафика\n```\n\nДля Producer-а можно разрешить только публикацию:\n\n```text\nwrite → domain_events\n```\n\nДля Consumer-а — только чтение конкретной очереди:\n\n```text\nread → notification_queue\n```\n\nЭто ограничивает последствия компрометации одного приложения.\n\n### Полная схема RabbitMQ\n\n```text\nProducer\n   │\n   │ Message + routing_key\n   ▼\nConnection / Channel\n   │\n   ▼\nExchange\n   │\n   │ Binding\n   ▼\nQueue\n   │\n   ├── retry / DLQ\n   │\n   ▼\nConsumer\n   │\n   │ ACK / NACK\n   ▼\nBusiness operation\n```\n\n### Обязательные и дополнительные компоненты\n\nМинимальная концептуальная схема любого брокера:\n\n```text\nProducer\nMessage\nBroker\nQueue или Topic\nConsumer\n```\n\nВ RabbitMQ она расширяется:\n\n```text\nProducer\n   ↓\nExchange\n   ↓\nBinding\n   ↓\nQueue\n   ↓\nConsumer\n```\n\nИнфраструктурные компоненты:\n\n```text\nConnections и channels\nAcknowledgements и confirms\nRetry и DLQ\nVirtual hosts\nAuthentication и permissions\nPersistence и replication\nMonitoring\n```\n\n### Итог\n\nГлавные роли компонентов:\n\n|Компонент|Ответственность|\n|---|---|\n|Producer|Создаёт и публикует сообщение|\n|Message|Содержит данные и метаданные|\n|Exchange|Маршрутизирует сообщения|\n|Binding|Связывает exchange с очередью|\n|Queue|Хранит сообщения до обработки|\n|Consumer|Получает и обрабатывает сообщения|\n|ACK/NACK|Подтверждает или отклоняет обработку|\n|Publisher confirm|Подтверждает приём публикации|\n|Retry/DLQ|Обрабатывает временные и окончательные ошибки|\n|Connection/channel|Обеспечивает сетевое взаимодействие|\n|Virtual host|Логически изолирует ресурсы|\n\nВ упрощённом виде:\n\n```text\nProducer создаёт сообщение.\nExchange решает, куда его направить.\nQueue хранит сообщение.\nConsumer обрабатывает его.\nACK подтверждает успешную обработку.\n```"
