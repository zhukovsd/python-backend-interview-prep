  id = 24
  question = "Что делать, если в проекте нужно заменить брокер сообщений?"
  answer = "### Главное\n\nЗамену брокера нельзя рассматривать как простую замену библиотеки:\n\n```python\naio_pika -> kafka-python\n```\n\nУ разных брокеров отличаются:\n\n- модель хранения;\n    \n- маршрутизация;\n    \n- подтверждение обработки;\n    \n- повторная доставка;\n    \n- порядок сообщений;\n    \n- retry и DLQ;\n    \n- масштабирование consumers;\n    \n- транзакционные возможности.\n    \n\nНапример, RabbitMQ отслеживает подтверждение конкретной доставки через `ack/nack`, а Kafka хранит позицию consumer group через offsets и позволяет повторно читать записи журнала. \n\n### 1. Сначала определить причину замены\n\nНужно зафиксировать, какую проблему должен решить новый брокер:\n\n```text\nНедостаточная пропускная способность\nНужно длительное хранение событий\nНужен replay\nСложная эксплуатация\nВысокая стоимость\nНедостаточная отказоустойчивость\nНет подходящих client libraries\nНужна интеграция с data platform\n```\n\nБез этого легко заменить RabbitMQ на Kafka, а затем пытаться построить в Kafka:\n\n- приоритетные task queues;\n    \n- `nack(requeue=True)`;\n    \n- per-message TTL;\n    \n- RPC;\n    \n- сложную exchange-маршрутизацию.\n    \n\nИли, наоборот, заменить Kafka на RabbitMQ и потерять удобное повторное чтение истории по offsets.\n\n### 2. Провести инвентаризацию текущей семантики\n\nПеред изменением нужно описать каждую очередь или topic.\n\nПример:\n\n```yaml\nname: report.generate\nmessage_type: command\nproducer: api-service\nconsumers:\n  - report-worker\n\ndelivery:\n  guarantee: at-least-once\n  ordering: not-required\n  retries: 5\n  retry_delay: exponential\n  dlq: report.generate.dlq\n\nmessage:\n  format: json\n  version: 2\n  max_size: 64KB\n\nprocessing:\n  average_time: 2s\n  maximum_time: 60s\n  idempotent: true\n```\n\nОсобенно важно определить:\n\n```text\nКто публикует?\nКто читает?\nЭто команда или событие?\nНужен один обработчик или несколько?\nДопустимы ли дубликаты?\nНужен ли строгий порядок?\nКак долго должны храниться данные?\nМожно ли повторно прочитать историю?\nЧто происходит при ошибке?\n```\n\n### 3. Отделить бизнес-код от API брокера\n\nПлохой вариант:\n\n```python\nasync def create_payment(data: PaymentData) -> None:\n    payment = await repository.create(data)\n\n    await rabbit_channel.default_exchange.publish(\n        aio_pika.Message(\n            body=json.dumps({\n                \"payment_id\": payment.id,\n            }).encode(),\n            delivery_mode=aio_pika.DeliveryMode.PERSISTENT,\n        ),\n        routing_key=\"payment.created\",\n    )\n```\n\nБизнес-логика напрямую зависит от RabbitMQ:\n\n- `aio_pika.Message`;\n    \n- `exchange`;\n    \n- `routing_key`;\n    \n- `delivery_mode`.\n    \n\nЛучше определить собственный интерфейс:\n\n```python\nfrom dataclasses import dataclass\nfrom typing import Any, Protocol\n\n\n@dataclass(frozen=True)\nclass OutgoingMessage:\n    message_id: str\n    message_type: str\n    payload: dict[str, Any]\n    headers: dict[str, str]\n\n\nclass MessagePublisher(Protocol):\n    async def publish(self, message: OutgoingMessage) -> None:\n        ...\n```\n\nБизнес-сервис:\n\n```python\nclass PaymentService:\n    def __init__(\n        self,\n        repository: PaymentRepository,\n        publisher: MessagePublisher,\n    ) -> None:\n        self.repository = repository\n        self.publisher = publisher\n\n    async def create(self, data: PaymentData) -> Payment:\n        payment = await self.repository.create(data)\n\n        await self.publisher.publish(\n            OutgoingMessage(\n                message_id=str(uuid4()),\n                message_type=\"payment.created\",\n                payload={\n                    \"payment_id\": payment.id,\n                },\n                headers={\n                    \"schema_version\": \"1\",\n                },\n            )\n        )\n\n        return payment\n```\n\nРеализации:\n\n```text\nMessagePublisher\n├── RabbitMQPublisher\n├── KafkaPublisher\n└── DualPublisher\n```\n\nТак бизнес-код не знает, используется `routing_key`, Kafka topic или другой механизм.\n\n### 4. Не пытаться создать слишком универсальную абстракцию\n\nНе следует скрывать все возможности брокеров за интерфейсом вроде:\n\n```python\npublish(\n    exchange=None,\n    topic=None,\n    routing_key=None,\n    partition=None,\n    ttl=None,\n    priority=None,\n    consumer_group=None,\n)\n```\n\nЭто не абстракция, а объединение API всех брокеров.\n\nИнтерфейс лучше строить вокруг потребности приложения:\n\n```python\nawait event_bus.publish(event)\nawait task_queue.enqueue(command)\n```\n\nНапример, события и фоновые задачи можно разделить:\n\n```python\nclass EventPublisher(Protocol):\n    async def publish(self, event: DomainEvent) -> None:\n        ...\n\n\nclass TaskQueue(Protocol):\n    async def enqueue(self, task: BackgroundTask) -> None:\n        ...\n```\n\nТогда можно оставить RabbitMQ для задач, а события перенести в Kafka.\n\n### 5. Зафиксировать независимый контракт сообщений\n\nСообщение не должно зависеть от внутренних классов брокера.\n\n```json\n{\n  \"message_id\": \"01K1S8Y1J2TX3M4H5K6N7P8Q9R\",\n  \"message_type\": \"payment.completed\",\n  \"message_version\": 2,\n  \"occurred_at\": \"2026-07-28T02:00:00Z\",\n  \"producer\": \"payment-service\",\n  \"data\": {\n    \"payment_id\": 451,\n    \"amount\": \"35.00\",\n    \"currency\": \"AZN\"\n  }\n}\n```\n\nНеобходимо сохранить стабильными:\n\n```text\nmessage_id\nmessage_type\nmessage_version\nbusiness key\noccurred_at\ncorrelation_id\ntrace_id\npayload\n```\n\nДля унификации envelope можно использовать собственный контракт либо CloudEvents — открытую спецификацию общего формата описания событий.\n\n### 6. Сопоставить семантику старого и нового брокера\n\nНапример, при переходе RabbitMQ → Kafka:\n\n```text\nRabbitMQ                         Kafka\n\nExchange                         Topic или логика producer\nQueue                            Topic + consumer group\nRouting key                      Topic / record key / headers\nConsumer ACK                     Commit offset\nNACK + requeue                   Не commit offset / retry topic\nDLQ                              Отдельный dead-letter topic\nCompeting consumers              Одна consumer group\nНесколько независимых очередей   Несколько consumer groups\nPrefetch                         poll/batch и consumer settings\nMessage TTL                      Retention или прикладная проверка\n```\n\nЭто приблизительное, а не точное соответствие.\n\nKafka consumer group распределяет partitions между consumers, а её прогресс хранится в offsets. Consumer может вернуться к предыдущему offset и повторно обработать записи. \n\nRabbitMQ использует отдельные consumer acknowledgements и publisher confirms; неподтверждённые доставки могут быть повторно переданы consumer’у. \n\n### 7. Обеспечить идемпотентность consumers\n\nВо время миграции дубликаты практически неизбежны:\n\n```text\nСообщение пришло из старого брокера\n+\nСообщение пришло из нового брокера\n```\n\nКаждое сообщение должно иметь стабильный `message_id`:\n\n```json\n{\n  \"message_id\": \"evt-payment-451-completed\",\n  \"message_type\": \"payment.completed\"\n}\n```\n\nConsumer может использовать таблицу дедупликации:\n\n```sql\nCREATE TABLE processed_messages (\n    consumer_name TEXT NOT NULL,\n    message_id UUID NOT NULL,\n    processed_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),\n\n    PRIMARY KEY (consumer_name, message_id)\n);\n```\n\nОбработка:\n\n```text\nBEGIN\n\nINSERT processed_messages\nON CONFLICT DO NOTHING\n\nЕсли запись уже существует:\n    пропустить бизнес-операцию\n\nИначе:\n    выполнить бизнес-операцию\n\nCOMMIT\n```\n\nНельзя рассчитывать на абсолютное отсутствие повторов ни при сбоях подтверждения RabbitMQ, ни при повторной обработке Kafka offsets. Обе модели обычно требуют идемпотентных обработчиков для надёжной семантики at-least-once.\n\n### 8. Использовать outbox вместо прямой двойной публикации\n\nОпасная схема:\n\n```text\nBEGIN\nИзменить PostgreSQL\nCOMMIT\n\nОпубликовать в старый broker\nОпубликовать в новый broker\n```\n\nВозможны состояния:\n\n```text\nСтарый broker получил, новый не получил\nНовый получил, старый не получил\nБД изменилась, оба broker не получили\n```\n\nНадёжнее сохранить событие в outbox в одной транзакции с бизнес-данными:\n\n```sql\nBEGIN;\n\nINSERT INTO payments (...);\n\nINSERT INTO outbox (\n    message_id,\n    message_type,\n    payload,\n    status\n) VALUES (\n    :message_id,\n    'payment.completed',\n    :payload,\n    'pending'\n);\n\nCOMMIT;\n```\n\nПосле этого relay публикует сообщение:\n\n```text\nPostgreSQL outbox\n       |\n       +--> RabbitMQ\n       |\n       +--> Kafka\n```\n\nСостояние публикации можно хранить отдельно:\n\n```text\nrabbitmq_published_at\nkafka_published_at\n```\n\n```sql\nUPDATE outbox\nSET kafka_published_at = NOW()\nWHERE message_id = :message_id;\n```\n\n### 9. Выполнять миграцию постепенно\n\nНе следует одномоментно переключать все producers и consumers.\n\nБезопасный порядок:\n\n```text\n1. Создать новый broker и topology.\n2. Добавить adapters для нового broker.\n3. Запустить тестового consumer.\n4. Начать двойную публикацию.\n5. Сравнивать сообщения и результаты обработки.\n6. Перевести один некритичный consumer.\n7. Постепенно перевести остальные consumers.\n8. Переключить producers.\n9. Дождаться обработки старого backlog.\n10. Остановить старый broker.\n```\n\nЭто соответствует принципу постепенного вытеснения старой системы вместо рискованного big-bang-перехода. \n\n### Возможные схемы миграции\n\n#### Dual publish\n\nProducer публикует в оба брокера:\n\n```text\n                       +--> RabbitMQ\nApplication Publisher -|\n                       +--> Kafka\n```\n\nПреимущества:\n\n- просто понять;\n    \n- можно сравнить доставку;\n    \n- быстрый rollback.\n    \n\nНедостатки:\n\n- публикации не атомарны;\n    \n- возможны дубликаты;\n    \n- усложняется publisher;\n    \n- нужен outbox.\n    \n\n#### Bridge\n\nОтдельный сервис переносит сообщения:\n\n```text\nProducer\n   |\n   v\nRabbitMQ\n   |\n   v\nBridge\n   |\n   v\nKafka\n```\n\nПреимущества:\n\n- producers временно не меняются;\n    \n- миграция сосредоточена в одном компоненте.\n    \n\nНедостатки:\n\n- bridge становится критичным;\n    \n- нужно преобразование семантики;\n    \n- возможны задержки и дубликаты;\n    \n- нужно надёжно подтверждать сообщение только после публикации в новый broker.\n    \n\n#### Dual consume\n\nConsumer временно читает оба источника:\n\n```text\nRabbitMQ ----+\n             +--> Idempotent Consumer\nKafka -------+\n```\n\nПодходит для постепенного переключения publishers, но требует обязательной дедупликации.\n\n### 10. Проверить retry и DLQ\n\nRetry нельзя переносить механически.\n\nRabbitMQ часто использует:\n\n```text\nmain.queue\n    |\n    | ошибка\n    v\nretry.queue с TTL\n    |\n    v\nmain.queue\n```\n\nKafka обычно использует отдельные topics:\n\n```text\nmain-topic\n    |\n    | ошибка\n    v\nretry-1m-topic\n    |\n    v\nretry-10m-topic\n    |\n    v\ndead-letter-topic\n```\n\nНужно сохранить:\n\n```text\nмаксимальное количество попыток\nзадержку между попытками\nклассификацию временных и постоянных ошибок\nисходный message_id\nпричину ошибки\nисторию retry\n```\n\nПример headers:\n\n```json\n{\n  \"original_message_id\": \"evt-451\",\n  \"retry_count\": 3,\n  \"first_failed_at\": \"2026-07-28T02:10:00Z\",\n  \"last_error_code\": \"PROVIDER_TIMEOUT\"\n}\n```\n\n### 11. Провести тестирование семантики, а не только подключения\n\nНужно проверить:\n\n```text\nПадение consumer до подтверждения\nПадение consumer после commit БД\nРазрыв соединения publisher\nПовторная публикация\nНедоступность части кластера\nНеверный routing key или topic\nНеизвестную версию сообщения\nПереполнение retry/DLQ\nНарушение порядка\nДолгую обработку\nConsumer lag\n```\n\nContract-тест должен запускаться для обоих adapters:\n\n```python\n@pytest.mark.parametrize(\n    \"publisher_factory\",\n    [\n        rabbitmq_publisher_factory,\n        kafka_publisher_factory,\n    ],\n)\nasync def test_message_is_delivered(publisher_factory):\n    ...\n```\n\nНо отдельно нужны интеграционные тесты специфичных возможностей брокера: абстракция не должна скрыть реальные различия.\n\n### 12. Добавить наблюдаемость\n\nВо время миграции сравнивают:\n\n```text\nКоличество опубликованных сообщений\nКоличество подтверждённых публикаций\nКоличество обработанных сообщений\nКоличество дубликатов\nКоличество ошибок\nRetry rate\nDLQ size\nConsumer lag\nВремя от публикации до обработки\n```\n\nПолезные идентификаторы:\n\n```text\nmessage_id\ncorrelation_id\ncausation_id\ntrace_id\nbroker\ntopic / queue\npartition / routing_key\nconsumer\n```\n\nПример лога:\n\n```json\n{\n  \"message_id\": \"evt-451\",\n  \"message_type\": \"payment.completed\",\n  \"broker\": \"kafka\",\n  \"topic\": \"payment-events\",\n  \"consumer\": \"notification-service\",\n  \"status\": \"processed\"\n}\n```\n\n### 13. Подготовить rollback\n\nВо время перехода должен существовать способ:\n\n```text\nОстановить публикацию в новый broker\nВернуть consumers на старый broker\nПовторно обработать сообщения\nВосстановить неподтверждённые публикации из outbox\nСравнить расхождения\n```\n\nНельзя удалять старые queues/topics сразу после переключения.\n\nНужно дождаться:\n\n```text\nнулевого или допустимого backlog;\nзавершения retry;\nистечения максимального времени обработки;\nпроверки DLQ;\nподтверждения всех критичных consumers.\n```\n\n### Практическая архитектура\n\n```text\nBusiness Service\n       |\n       v\nMessagePublisher interface\n       |\n       v\nTransactional Outbox\n       |\n       v\nOutbox Relay\n       |\n       +--> RabbitMQ Adapter\n       |\n       +--> Kafka Adapter\n```\n\nConsumers:\n\n```text\nRabbitMQ Consumer Adapter --+\n                            |\n                            v\n                    Message Handler\n                            |\n                            v\n                     Business Logic\n                            ^\n                            |\nKafka Consumer Adapter -----+\n```\n\nВнутренний обработчик получает не `aio_pika.IncomingMessage` и не `ConsumerRecord`, а собственную модель:\n\n```python\n@dataclass(frozen=True)\nclass IncomingMessage:\n    message_id: str\n    message_type: str\n    version: int\n    payload: dict[str, Any]\n    headers: dict[str, str]\n```\n\n### Итоговый порядок\n\n```text\n1. Зафиксировать требования и текущую семантику.\n2. Не переносить модель одного брокера в другой буквально.\n3. Вынести публикацию и получение за adapters.\n4. Стабилизировать контракт сообщений.\n5. Добавить message_id и идемпотентность.\n6. Использовать transactional outbox.\n7. Запустить новый брокер параллельно.\n8. Переводить consumers по одному.\n9. Сравнивать результаты и метрики.\n10. Сохранить возможность rollback.\n11. Отключить старый брокер только после обработки backlog.\n```\n\nСамая частая ошибка — сначала заменить клиентскую библиотеку, а затем обнаружить, что приложение было связано не только с API RabbitMQ или Kafka, но и с конкретной моделью доставки, подтверждений, повторов и маршрутизации."
