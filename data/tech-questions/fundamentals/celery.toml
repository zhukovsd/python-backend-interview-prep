[[questions]]
  id = 26
  question = "Можно ли инкапсулировать запуск Celery-задач за собственным интерфейсом?"
  answer = "### Да, запуск Celery-задач стоит инкапсулировать\n\nВместо прямой зависимости:\n\n```python\nfrom app.tasks import generate_report\n\nclass ReportService:\n    def create_report(self, user_id: int) -> None:\n        ...\n        generate_report.delay(user_id)\n```\n\nбизнес- или application-сервису лучше зависеть от собственного интерфейса:\n\n```text\nReportService\n     |\n     v\nReportTaskDispatcher\n     |\n     v\nCeleryReportTaskDispatcher\n     |\n     v\nCelery / RabbitMQ\n```\n\nCelery определяет `delay()` как сокращение для `apply_async()`. При этом `delay()` не позволяет задавать дополнительные параметры выполнения вроде очереди, `countdown`, `eta`, `expires` и собственного `task_id`. \n\n### Почему прямой вызов `task.delay()` создаёт проблему\n\n#### Бизнес-код начинает зависеть от Celery\n\n```python\ngenerate_report.delay(report_id)\n```\n\nТеперь сервис знает:\n\n- что используется Celery;\n    \n- где объявлена Celery task;\n    \n- как она запускается;\n    \n- что у task существует метод `delay`;\n    \n- какие аргументы принимает транспортная задача.\n    \n\nТо есть бизнес-сервис зависит не от бизнес-возможности «запустить формирование отчёта», а от конкретного инфраструктурного фреймворка.\n\n```text\nНужная зависимость:\n\nReportService -> интерфейс фоновой обработки\n\n\nФактическая зависимость:\n\nReportService -> Celery Task -> Celery -> broker\n```\n\nПри переходе на RabbitMQ без Celery, Kafka, Temporal, PostgreSQL job queue или синхронное выполнение придётся изменять бизнес-сервис.\n\n#### Инфраструктурные настройки распространяются по коду\n\nСначала появляется:\n\n```python\ngenerate_report.delay(report_id)\n```\n\nПозже требуется отдельная очередь:\n\n```python\ngenerate_report.apply_async(\n    args=[report_id],\n    queue=\"reports\",\n)\n```\n\nЗатем появляются:\n\n```python\ngenerate_report.apply_async(\n    args=[report_id],\n    queue=\"reports\",\n    priority=5,\n    expires=300,\n    retry=True,\n    retry_policy={\n        \"max_retries\": 3,\n    },\n)\n```\n\nCelery действительно предоставляет через `apply_async()` параметры маршрутизации, времени выполнения, expiration и повторных попыток публикации. Поведение retry отправки также можно конфигурировать. \n\nЕсли такие вызовы находятся в десятках сервисов, изменить имя очереди, retry policy или формат аргументов становится сложно.\n\n#### Усложняются модульные тесты\n\nПри прямой зависимости тест должен подменять Celery task:\n\n```python\n@patch(\"app.services.reports.generate_report.delay\")\ndef test_create_report(delay_mock):\n    service.create_report(user_id=10)\n\n    delay_mock.assert_called_once()\n```\n\nТакой тест зависит от:\n\n- пути импорта;\n    \n- имени task;\n    \n- метода `delay`;\n    \n- устройства конкретного модуля.\n    \n\nПри собственном интерфейсе используется обычный fake:\n\n```python\nclass FakeReportDispatcher:\n    def __init__(self) -> None:\n        self.report_ids: list[int] = []\n\n    def enqueue(self, report_id: int) -> None:\n        self.report_ids.append(report_id)\n```\n\n```python\ndef test_create_report() -> None:\n    dispatcher = FakeReportDispatcher()\n\n    service = ReportService(\n        repository=FakeReportRepository(),\n        dispatcher=dispatcher,\n    )\n\n    report = service.create_report(user_id=10)\n\n    assert dispatcher.report_ids == [report.id]\n```\n\nТест проверяет намерение бизнес-сервиса, а не внутреннее API Celery.\n\n### Интерфейс должен выражать бизнес-операцию\n\nСлишком общий интерфейс:\n\n```python\nclass TaskDispatcher(Protocol):\n    def send(\n        self,\n        task_name: str,\n        args: list,\n        queue: str,\n        countdown: int | None = None,\n    ) -> str:\n        ...\n```\n\nФормально Celery скрыт, но бизнес-сервис всё ещё оперирует:\n\n- именами задач;\n    \n- очередями;\n    \n- сериализованными аргументами;\n    \n- инфраструктурными параметрами.\n    \n\nЛучше сделать предметный интерфейс:\n\n```python\nfrom typing import Protocol\nfrom uuid import UUID\n\n\nclass ReportJobDispatcher(Protocol):\n    def enqueue_generation(self, report_id: UUID) -> str:\n        ...\n```\n\nБизнес-сервис:\n\n```python\nfrom dataclasses import dataclass\nfrom uuid import UUID\n\n\n@dataclass(frozen=True)\nclass CreateReportCommand:\n    user_id: UUID\n    report_type: str\n\n\nclass ReportService:\n    def __init__(\n        self,\n        repository: \"ReportRepository\",\n        jobs: ReportJobDispatcher,\n    ) -> None:\n        self._repository = repository\n        self._jobs = jobs\n\n    def create(self, command: CreateReportCommand) -> \"Report\":\n        report = self._repository.create(\n            user_id=command.user_id,\n            report_type=command.report_type,\n            status=\"pending\",\n        )\n\n        self._jobs.enqueue_generation(report.id)\n\n        return report\n```\n\nСервис говорит:\n\n```text\n«Поставить формирование отчёта в фоновую обработку»\n```\n\nа не:\n\n```text\n«Вызвать Celery task через delay».\n```\n\n### Celery-адаптер\n\n```python\nfrom uuid import UUID\n\nfrom app.tasks.reports import generate_report_task\n\n\nclass CeleryReportJobDispatcher:\n    def enqueue_generation(self, report_id: UUID) -> str:\n        result = generate_report_task.apply_async(\n            kwargs={\n                \"report_id\": str(report_id),\n            },\n            queue=\"reports\",\n            expires=3600,\n            retry=True,\n            retry_policy={\n                \"max_retries\": 3,\n                \"interval_start\": 0,\n                \"interval_step\": 1,\n                \"interval_max\": 5,\n            },\n        )\n\n        return result.id\n```\n\nВ этом классе допустимы все детали Celery:\n\n- `apply_async`;\n    \n- очередь;\n    \n- маршрутизация;\n    \n- expiration;\n    \n- retry публикации;\n    \n- сериализация UUID;\n    \n- работа с `AsyncResult`.\n    \n\nОни локализованы в инфраструктурном слое.\n\n### Сама Celery task должна быть тонкой\n\nCelery task желательно рассматривать как входной адаптер:\n\n```python\nfrom uuid import UUID\n\nfrom app.celery_app import celery_app\nfrom app.container import container\n\n\n@celery_app.task(\n    bind=True,\n    autoretry_for=(TemporaryReportError,),\n    retry_backoff=True,\n    retry_jitter=True,\n    max_retries=5,\n)\ndef generate_report_task(\n    self,\n    report_id: str,\n) -> None:\n    service = container.report_generation_service()\n\n    service.generate(\n        report_id=UUID(report_id),\n    )\n```\n\nОсновная бизнес-логика находится не внутри task:\n\n```python\nclass ReportGenerationService:\n    def __init__(\n        self,\n        reports: \"ReportRepository\",\n        storage: \"ReportStorage\",\n    ) -> None:\n        self._reports = reports\n        self._storage = storage\n\n    def generate(self, report_id: UUID) -> None:\n        report = self._reports.get(report_id)\n\n        content = build_report(report)\n\n        object_key = self._storage.save(\n            report_id=report_id,\n            content=content,\n        )\n\n        self._reports.mark_completed(\n            report_id=report_id,\n            object_key=object_key,\n        )\n```\n\nCelery поддерживает `Task.retry()` и автоматический retry через `autoretry_for`, `retry_backoff` и другие параметры. Эти настройки относятся к выполнению фоновой задачи и поэтому логично остаются в Celery-адаптере, а не внутри независимой бизнес-логики. \n\nПолучается направление зависимостей:\n\n```text\nCelery task\n    |\n    v\nApplication service\n    |\n    v\nDomain / repositories\n```\n\nа не наоборот:\n\n```text\nBusiness service\n    |\n    v\nCelery task.delay()\n```\n\n### Не возвращать `AsyncResult` из бизнес-интерфейса\n\nПлохой интерфейс:\n\n```python\nfrom celery.result import AsyncResult\n\n\nclass ReportJobDispatcher(Protocol):\n    def enqueue_generation(\n        self,\n        report_id: UUID,\n    ) -> AsyncResult:\n        ...\n```\n\nCelery снова проникает в вызывающий код.\n\nЛучше вернуть собственную модель:\n\n```python\nfrom dataclasses import dataclass\n\n\n@dataclass(frozen=True)\nclass JobReference:\n    job_id: str\n```\n\n```python\nclass ReportJobDispatcher(Protocol):\n    def enqueue_generation(\n        self,\n        report_id: UUID,\n    ) -> JobReference:\n        ...\n```\n\nАдаптер:\n\n```python\nclass CeleryReportJobDispatcher:\n    def enqueue_generation(\n        self,\n        report_id: UUID,\n    ) -> JobReference:\n        result = generate_report_task.apply_async(\n            kwargs={\"report_id\": str(report_id)},\n            queue=\"reports\",\n        )\n\n        return JobReference(job_id=result.id)\n```\n\nТеперь остальной проект не импортирует `celery.result.AsyncResult`.\n\n### Где создавать зависимость\n\nНапример, через dependency injection:\n\n```python\ndef build_report_service() -> ReportService:\n    repository = SqlAlchemyReportRepository(session_factory)\n    dispatcher = CeleryReportJobDispatcher()\n\n    return ReportService(\n        repository=repository,\n        jobs=dispatcher,\n    )\n```\n\nВ тестах:\n\n```python\nservice = ReportService(\n    repository=FakeReportRepository(),\n    jobs=FakeReportDispatcher(),\n)\n```\n\nПри замене Celery:\n\n```python\nservice = ReportService(\n    repository=SqlAlchemyReportRepository(session_factory),\n    jobs=KafkaReportJobDispatcher(),\n)\n```\n\nСам `ReportService` не меняется.\n\n### Интерфейс не решает проблему транзакционности\n\nРассмотрим код:\n\n```python\nreport = repository.create(...)\njobs.enqueue_generation(report.id)\n```\n\nВозможен сбой:\n\n```text\n1. Отчёт записан в PostgreSQL.\n2. Транзакция закоммичена.\n3. Публикация Celery-задачи не удалась.\n4. Отчёт навсегда остался в pending.\n```\n\nСобственный интерфейс уменьшает связанность, но не делает запись в PostgreSQL и публикацию в RabbitMQ атомарными.\n\nДля критичных задач нужен transactional outbox:\n\n```text\nBEGIN\n\nINSERT INTO reports (...);\n\nINSERT INTO outbox (\n    message_id,\n    message_type,\n    payload\n);\n\nCOMMIT\n```\n\nПосле этого отдельный relay вызывает Celery-адаптер:\n\n```text\nPostgreSQL outbox\n        |\n        v\nCeleryReportJobDispatcher\n        |\n        v\nCelery / RabbitMQ\n```\n\nВ таком варианте бизнес-сервис может зависеть не от Celery dispatcher, а от интерфейса outbox:\n\n```python\nclass Outbox(Protocol):\n    def add(self, message: OutboxMessage) -> None:\n        ...\n```\n\nИ сохранять отчёт и outbox-запись в одной транзакции.\n\n### Когда прямой `delay()` допустим\n\nПрямой вызов не является технической ошибкой сам по себе:\n\n```python\nsend_email_task.delay(user.id)\n```\n\nОн допустим, когда:\n\n- проект небольшой;\n    \n- Celery считается постоянной частью архитектуры;\n    \n- задача вызывается из контроллера или инфраструктурного обработчика;\n    \n- не требуется сложная тестируемость;\n    \n- нет бизнес-транзакции, связанной с публикацией;\n    \n- количество вызовов невелико.\n    \n\nНо даже в небольшом проекте лучше не помещать его глубоко в доменные сущности:\n\n```python\nclass Order:\n    def pay(self):\n        ...\n        send_receipt.delay(self.id)  # плохо\n```\n\nДопустимее держать вызов на границе приложения:\n\n```python\n@app.post(\"/orders/{order_id}/pay\")\ndef pay_order(order_id: UUID):\n    order_service.pay(order_id)\n    send_receipt_task.delay(str(order_id))\n```\n\nЕщё лучше — вынести в application service с интерфейсом или использовать outbox.\n\n### Итоговая структура\n\n```text\napplication/\n    services/\n        report_service.py\n\n    ports/\n        report_jobs.py\n\ninfrastructure/\n    celery/\n        dispatchers.py\n        tasks.py\n\ndomain/\n    reports.py\n```\n\n```text\nReportService\n    |\n    | зависит от Protocol\n    v\nReportJobDispatcher\n    ^\n    |\nCeleryReportJobDispatcher\n    |\n    v\ngenerate_report_task.apply_async()\n```\n\nОсновная идея:\n\n```text\nБизнес-сервис должен зависеть от намерения:\n\n«запланировать формирование отчёта»\n\nа не от способа доставки:\n\n«вызвать Celery task через delay».\n```\n\nИнкапсуляция даёт локализованные настройки Celery, простые unit-тесты, возможность заменить транспорт и не позволяет инфраструктурным объектам вроде `Task` и `AsyncResult` распространяться по бизнес-коду. При этом для атомарности с базой данных дополнительно требуется outbox — один интерфейс эту проблему не решает."
  popularity = 2.63

[[questions]]
  id = 27
  question = "Когда Celery-задача считается запущенной?"
  answer = "### Когда задача действительно считается запущенной\n\nCelery-задача считается **фактически запущенной**, когда worker передал её в исполнительный процесс или поток и начал выполнение тела задачи — фактически дошёл до вызова `Task.run()`.\n\nВызов:\n\n```python\nresult = generate_report.delay(report_id)\n```\n\nсам по себе задачу не запускает. Он только формирует сообщение и публикует его через брокер. `delay()` является сокращением для `apply_async()`.\n\n### Этапы выполнения\n\n```text\ndelay() / apply_async()\n        |\n        v\nСообщение опубликовано в брокер\n        |\n        v\nОжидает в очереди\n        |\n        v\nWorker получил сообщение\n        |\n        v\nWorker зарезервировал задачу\n        |\n        v\nЗадача передана в execution pool\n        |\n        v\nНачалось выполнение Task.run()\n        |\n        v\nSUCCESS / FAILURE / RETRY\n```\n\n#### 1. Задача отправлена\n\n```python\ntask.delay(...)\n```\n\nНа этом этапе задача только опубликована:\n\n```text\nСостояние по смыслу: sent / queued\n```\n\nОна может ещё находиться в RabbitMQ, а свободного worker’а может не быть.\n\nСигнал `after_task_publish` означает, что задача отправлена брокеру, но не означает, что worker уже начал её выполнять.\n\n#### 2. Worker получил задачу\n\nВ логах появляется:\n\n```text\nTask app.tasks.generate_report[task-id] received\n```\n\nЭто ещё не обязательно означает запуск бизнес-кода. Worker мог получить задачу заранее из-за prefetch и оставить её в списке `reserved`. Celery определяет reserved tasks как полученные worker’ом, но всё ещё ожидающие выполнения. \n\n```text\nreceived ≠ started\nreserved ≠ started\n```\n\nНапример:\n\n```text\nWorker concurrency: 1\nPrefetch: 4\n\nTask A -> active\nTask B -> reserved\nTask C -> reserved\nTask D -> reserved\n```\n\nЗадачи B–D уже находятся у worker’а, но выполняется только A.\n\n#### 3. Задача стала active\n\nКогда задача передана исполнительному процессу и начинается вызов её кода, она считается запущенной:\n\n```text\nreserved -> active\n```\n\nКоманда:\n\n```bash\ncelery -A app inspect active\n```\n\nпоказывает задачи, которые в данный момент выполняются. `inspect reserved` показывает полученные, но ещё не выполняющиеся задачи. \n\nНепосредственно перед выполнением задачи Celery отправляет сигнал `task_prerun`; согласно документации, он возникает перед вызовом тела задачи. \n\n### Состояние `STARTED`\n\nПо умолчанию Celery обычно **не сохраняет промежуточное состояние `STARTED`**. Поэтому задача может выглядеть так:\n\n```text\nPENDING -> SUCCESS\n```\n\nили:\n\n```text\nPENDING -> FAILURE\n```\n\nХотя фактически некоторое время она выполнялась. Отслеживание `STARTED` отключено по умолчанию и включается через `task_track_started` или параметр конкретной задачи.\n\nГлобально:\n\n```python\napp.conf.task_track_started = True\n```\n\nДля отдельной задачи:\n\n```python\n@app.task(track_started=True)\ndef generate_report(report_id: int) -> None:\n    ...\n```\n\nТогда при наличии result backend:\n\n```python\nresult = generate_report.delay(42)\n\nprint(result.state)\n```\n\nможно увидеть последовательность:\n\n```text\nPENDING\nSTARTED\nSUCCESS\n```\n\nСостояние `STARTED` означает, что задача была запущена worker’ом. В metadata также может находиться информация о worker-процессе, выполняющем задачу.\n\n### `PENDING` не доказывает, что задача находится в очереди\n\nCelery не записывает состояние в result backend в момент обычной отправки задачи. Поэтому `PENDING` может означать несколько ситуаций:\n\n```text\nзадача ожидает выполнения;\nзадача уже выполняется, но track_started выключен;\nзадача ещё не была опубликована;\nуказан неизвестный task_id;\nresult backend недоступен;\nрезультат задачи не сохраняется.\n```\n\nCelery трактует task ID без сохранённой истории как `PENDING`, поэтому это состояние нельзя использовать как точное доказательство нахождения сообщения в RabbitMQ. \n\n### Подтверждение сообщения не равно запуску\n\nRabbitMQ acknowledgement и запуск Celery-задачи — разные события.\n\nПо умолчанию Celery использует раннее подтверждение: сообщение подтверждается непосредственно перед выполнением задачи. При `task_acks_late=True` сообщение подтверждается после выполнения.\n\n```text\nacks_late=False:\n\nполучение -> резервирование -> ACK -> выполнение\n\n\nacks_late=True:\n\nполучение -> резервирование -> выполнение -> ACK\n```\n\nПоэтому наличие `ack` не является универсальным способом определить, выполняется ли задача сейчас.\n\n### Задачи с `countdown` или `eta`\n\n```python\ntask.apply_async(\n    args=[report_id],\n    countdown=300,\n)\n```\n\nWorker может заранее получить такую задачу и поместить её в список scheduled:\n\n```text\nполучена worker’ом\n    |\n    v\nscheduled / ожидание ETA\n    |\n    v\nactive / выполнение\n```\n\nОна считается запущенной только после наступления времени выполнения и передачи в execution pool. Celery отдельно различает scheduled, reserved и active tasks. \n### Практический вывод\n\n```text\ndelay() успешно завершился\n    = задача отправлена или поставлена на публикацию;\n\nсообщение находится в RabbitMQ\n    = задача ожидает доставки;\n\nworker написал received\n    = задача получена, но может ещё ожидать;\n\nзадача находится в inspect active\n    = задача выполняется;\n\nAsyncResult.state == STARTED\n    = worker сообщил о начале выполнения,\n      если включён task_track_started.\n```\n\nДля собственного статуса задачи обычно используют:\n\n```text\naccepted -> queued -> running -> succeeded\n                              -> failed\n```\n\nГде `running` устанавливается worker’ом непосредственно перед началом бизнес-операции, а не HTTP-приложением после вызова `delay()`."
  popularity = 2.63

[[questions]]
  id = 28
  question = "Что запускается, когда Celery worker берёт задачу из очереди?"
  answer = "Когда Celery worker берёт сообщение из очереди, он **не запускает функцию из сообщения напрямую** и обычно не создаёт новый процесс специально для этой задачи.\n\nWorker:\n\n```text\n1. Получает сообщение из брокера.\n2. Находит зарегистрированный объект Task по имени.\n3. Создаёт объект Request с аргументами и метаданными.\n4. Передаёт задачу в execution pool.\n5. Запускает Celery-обёртку выполнения.\n6. Обёртка вызывает Task.run().\n7. Task.run() выполняет исходную Python-функцию.\n```\n\nУ класса `Task` метод `run()` является телом задачи, выполняемым worker’ом.\n\n### Что находится в сообщении\n\nПредположим, объявлена задача:\n\n```python\n@app.task\ndef generate_report(report_id: int) -> str:\n    return f\"report-{report_id}.pdf\"\n```\n\nВызов:\n\n```python\ngenerate_report.delay(42)\n```\n\nотправляет в брокер не Python-функцию и не исполняемый код, а сообщение примерно такого содержания:\n\n```json\n{\n  \"task\": \"app.tasks.generate_report\",\n  \"id\": \"762e7474-7fa7-4c44-8782-b57c5d133ad7\",\n  \"args\": [42],\n  \"kwargs\": {},\n  \"retries\": 0\n}\n```\n\nWorker уже должен иметь эту задачу импортированной и зарегистрированной под именем `app.tasks.generate_report`. Посмотреть зарегистрированные задачи можно через `celery inspect registered`. \n\n### Что происходит внутри worker\n\n```text\nRabbitMQ\n   |\n   | сообщение с именем задачи и аргументами\n   v\nCelery Consumer\n   |\n   | поиск в registry\n   v\nTask instance\n   |\n   | создание Request\n   v\nExecution Pool\n   |\n   | tracer\n   v\nTask.run(*args, **kwargs)\n```\n\n### 1. Consumer получает сообщение\n\nГлавный процесс worker’а содержит consumer, подписанный на одну или несколько очередей:\n\n```bash\ncelery -A app worker -Q reports,emails\n```\n\nКогда RabbitMQ доставляет сообщение, Celery десериализует его и извлекает:\n\n```text\ntask name\ntask id\nargs\nkwargs\nheaders\nETA\nexpires\nretries\nrouting information\n```\n\nПри получении формируется `Request` — внутреннее представление конкретного запуска задачи. В нём находятся идентификатор, аргументы, количество повторов, hostname worker’а, информация о доставке, callbacks, time limits и другие параметры. \n\n### 2. Worker ищет задачу в registry\n\nУпрощённо:\n\n```python\ntask = app.tasks[message[\"task\"]]\n```\n\nНапример:\n\n```python\ntask = app.tasks[\"app.tasks.generate_report\"]\n```\n\nЭто объект, являющийся экземпляром подкласса `celery.app.task.Task`.\n\nЕсли worker не импортировал модуль задачи и имя отсутствует в registry, задача не выполняется. Celery считает её неизвестной и отправляет сигнал `task_unknown`. \n\nТипичная ошибка:\n\n```text\nReceived unregistered task of type\n'app.tasks.generate_report'\n```\n\n### 3. Создаётся Task Request\n\nRequest представляет не сам тип задачи, а конкретную попытку её выполнения:\n\n```text\nTask:\n    app.tasks.generate_report\n\nRequest:\n    task_id = 762e7474-...\n    args = (42,)\n    kwargs = {}\n    retries = 0\n    hostname = celery@worker-1\n```\n\nОдин зарегистрированный объект `Task` может последовательно обработать множество разных requests.\n\nВнутри задачи request доступен через:\n\n```python\n@app.task(bind=True)\ndef generate_report(self, report_id: int) -> None:\n    print(self.request.id)\n    print(self.request.retries)\n    print(self.request.delivery_info)\n```\n\n`Task.request` содержит состояние именно текущего выполнения. \n\n### 4. Задача передаётся в execution pool\n\nГлавный процесс worker’а обычно не выполняет бизнес-код самостоятельно. Он отправляет задачу в настроенный пул.\n\nПо умолчанию используется `prefork`:\n\n```text\nCelery worker — главный процесс\n├── child process 1\n├── child process 2\n├── child process 3\n└── child process 4\n```\n\n```bash\ncelery -A app worker --concurrency=4\n```\n\nПри `prefork` конкретная задача выполняется в одном из уже существующих дочерних процессов. Новый процесс для каждой задачи не создаётся. Celery также поддерживает `threads`, `eventlet`, `gevent`, `solo` и custom pools. \n\nВ зависимости от `--pool` тело задачи выполняется:\n\n```text\nprefork  -> в дочернем процессе;\nthreads  -> в потоке;\ngevent   -> в greenlet;\neventlet -> в greenlet;\nsolo     -> в главном потоке worker’а.\n```\n\n### 5. Запускается Celery tracer\n\nCelery не вызывает пользовательскую функцию «голым» вызовом. Сначала запускается внутренняя обёртка выполнения — tracer.\n\nОна отвечает за:\n\n- создание контекста текущей задачи;\n    \n- измерение времени;\n    \n- отправку сигналов;\n    \n- установку `STARTED`, если включено;\n    \n- обработку результата;\n    \n- обработку исключений;\n    \n- `RETRY`, `FAILURE`, `SUCCESS`;\n    \n- callbacks и errbacks;\n    \n- запись результата в result backend;\n    \n- логирование.\n    \n\nМодуль `celery.app.trace` описан как центральная часть выполнения задачи: он перехватывает исключения и обновляет result backend соответствующим состоянием.\n\nУпрощённо:\n\n```python\ndef trace_task(task, task_id, args, kwargs, request):\n    try:\n        result = task.run(*args, **kwargs)\n    except Retry:\n        set_state(\"RETRY\")\n    except Exception as exc:\n        set_state(\"FAILURE\")\n    else:\n        set_state(\"SUCCESS\")\n        return result\n```\n\nРеальная реализация значительно сложнее.\n\n### 6. Вызывается `Task.run()`\n\nДля обычной задачи:\n\n```python\n@app.task\ndef generate_report(report_id: int) -> str:\n    return f\"report-{report_id}.pdf\"\n```\n\nCelery создаёт объект задачи, чей `run()` вызывает исходную функцию:\n\n```text\nTask.run(42)\n    |\n    v\ngenerate_report(42)\n```\n\nКонцептуально это можно представить так:\n\n```python\nclass GenerateReportTask(Task):\n    def run(self, report_id: int) -> str:\n        return generate_report(report_id)\n```\n\nДокументация Celery прямо определяет `Task.run()` как тело задачи, исполняемое workers. При вызове объекта задачи применяется `run()`, если только пользователь не переопределил `__call__()`. \n\nВнутренняя оптимизированная реализация tracer может вызвать `task.run()` напрямую, если у задачи нет собственного переопределённого `__call__()`:\n\n```text\nобычная Task:\n    tracer -> task.run()\n\nTask с кастомным __call__:\n    tracer -> task.__call__() -> task.run()\n```\n\nПоэтому пользовательский код обычно начинается именно внутри `run()`.\n\n### Что происходит с `bind=True`\n\nЗадача:\n\n```python\n@app.task(bind=True)\ndef generate_report(self, report_id: int) -> None:\n    print(self.request.id)\n```\n\nне превращает `self` в worker или Request. `self` — это объект Celery Task:\n\n```text\nself\n    -> экземпляр Task\n\nself.request\n    -> Request текущего выполнения\n```\n\nФактический вызов логически выглядит так:\n\n```python\ntask.run(42)\n```\n\nПри этом связанный метод автоматически передаёт объект `task` как `self`.\n\n### Сигналы вокруг выполнения\n\nПеред телом задачи отправляется:\n\n```text\ntask_prerun\n```\n\nПосле завершения попытки:\n\n```text\ntask_postrun\n```\n\nТакже могут отправляться:\n\n```text\ntask_success\ntask_failure\ntask_retry\ntask_internal_error\n```\n\n`task_prerun` отправляется непосредственно перед выполнением задачи, а `task_postrun` — после выполнения. \n\nПример:\n\n```python\nfrom celery.signals import task_postrun, task_prerun\n\n\n@task_prerun.connect\ndef before_task(task_id=None, task=None, **kwargs) -> None:\n    print(f\"Starting {task.name}: {task_id}\")\n\n\n@task_postrun.connect\ndef after_task(\n    task_id=None,\n    task=None,\n    state=None,\n    **kwargs,\n) -> None:\n    print(f\"Finished {task.name}: {state}\")\n```\n\nПорядок можно представить так:\n\n```text\ntask_prerun\n    |\n    v\nTask.run()\n    |\n    v\nобработка результата или исключения\n    |\n    v\ntask_success / task_failure / task_retry\n    |\n    v\ntask_postrun\n```\n\n### Что происходит при успешном возврате\n\n```python\n@app.task\ndef add(a: int, b: int) -> int:\n    return a + b\n```\n\nПри вызове:\n\n```python\nadd.delay(2, 3)\n```\n\nworker выполняет:\n\n```python\nresult = task.run(2, 3)\n```\n\nПосле возврата `5` tracer:\n\n```text\n1. Сохраняет результат в result backend, если он используется.\n2. Устанавливает состояние SUCCESS.\n3. Вызывает success hooks.\n4. Запускает callbacks или следующую задачу chain.\n5. Подтверждает сообщение в соответствии с ack-настройками.\n```\n\nCelery tracer сохраняет успешный результат и устанавливает состояние `SUCCESS`. \n\n### Что происходит при исключении\n\n```python\n@app.task\ndef generate_report(report_id: int) -> None:\n    raise RuntimeError(\"Generation failed\")\n```\n\nИсключение перехватывается не worker-процессом вручную, а tracer:\n\n```text\nTask.run()\n    |\n    | RuntimeError\n    v\nCelery tracer\n    |\n    +--> FAILURE\n    +--> сохранение exception/traceback\n    +--> on_failure\n    +--> task_failure\n```\n\nЕсли задача вызывает:\n\n```python\nraise self.retry(countdown=30, exc=exc)\n```\n\nCelery воспринимает `Retry` как специальный управляющий исход, переводит задачу в `RETRY` и публикует новую попытку. Tracer различает успешное завершение, `Retry` и обычное исключение. \n\n### Когда отправляется ACK RabbitMQ\n\nЭто зависит от `acks_late`.\n\nПо умолчанию:\n\n```python\ntask_acks_late = False\n```\n\nУсловная последовательность:\n\n```text\nworker получил задачу\n    |\n    v\nперед выполнением ACK\n    |\n    v\nTask.run()\n```\n\nПри:\n\n```python\ntask_acks_late = True\n```\n\nпоследовательность меняется:\n\n```text\nworker получил задачу\n    |\n    v\nTask.run()\n    |\n    v\nзавершение попытки\n    |\n    v\nACK\n```\n\nCelery указывает, что при `acks_late=True` сообщение подтверждается после выполнения, а не перед ним. Это повышает вероятность повторной доставки при падении процесса, поэтому задача должна быть идемпотентной.\n\n### Что именно «запускается»\n\nДля такой задачи:\n\n```python\n@app.task\ndef send_email(user_id: int) -> None:\n    service = build_email_service()\n    service.send_to_user(user_id)\n```\n\nкогда worker берёт её в исполнение, запускается следующая цепочка:\n\n```text\nCelery execution tracer\n    |\n    v\nобъект Task\n    |\n    v\nTask.run(user_id)\n    |\n    v\nисходная функция send_email(user_id)\n    |\n    v\nbuild_email_service()\n    |\n    v\nservice.send_to_user(user_id)\n```\n\nТо есть непосредственно ваш код начинается с тела функции:\n\n```python\nservice = build_email_service()\n```\n\n### Что не запускается заново для каждой задачи\n\nОбычно для каждой задачи не запускаются заново:\n\n```text\nCelery worker;\nновый контейнер;\nновый Python-интерпретатор;\nновый prefork-процесс;\nвесь модуль tasks.py;\nFastAPI/Django-приложение с нуля.\n```\n\nWorker и дочерние процессы уже запущены, модули задач импортированы, а объекты `Task` зарегистрированы. Конкретный pool slot получает новый Request и вызывает тело зарегистрированной задачи.\n\n### Итоговая цепочка\n\n```text\nRabbitMQ доставляет сообщение\n        |\n        v\nCelery Consumer десериализует его\n        |\n        v\nПо имени находится зарегистрированный Task\n        |\n        v\nСоздаётся Request конкретного запуска\n        |\n        v\nRequest передаётся в execution pool\n        |\n        v\nЗапускается celery.app.trace\n        |\n        v\nОтправляется task_prerun\n        |\n        v\nВызывается Task.run(*args, **kwargs)\n        |\n        v\nВыполняется исходная Python-функция\n        |\n        v\nSUCCESS / FAILURE / RETRY\n        |\n        v\nСохраняется результат и отправляется task_postrun\n        |\n        v\nСообщение подтверждается согласно ack-настройкам\n```\n\nГлавное различие:\n\n```text\nWorker получил сообщение\n    — Celery создал Request и подготовил выполнение.\n\nWorker начал задачу\n    — execution pool запустил tracer,\n      который вызвал Task.run() и тело вашей функции.\n```"
