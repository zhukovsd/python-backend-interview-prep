  id = 30
  question = "Как Celery управляет состояниями task?"
  answer = "### Общая модель\n\nCelery управляет состояниями задачи через три основных компонента:\n\n```text\nWorker / tracer\n    определяет результат выполнения\n        |\n        v\nResult backend\n    хранит последнее состояние и метаданные\n        |\n        v\nAsyncResult\n    позволяет клиенту прочитать состояние\n```\n\nОтдельно существует поток **Celery Events**, используемый Flower и другими системами мониторинга. Events и result backend — это два разных механизма. \n\n### Где хранится состояние\n\nСостояние задачи не хранится в RabbitMQ как часть жизненного цикла Celery.\n\nRabbitMQ знает только состояние доставки сообщения:\n\n```text\nready\nunacknowledged\nacknowledged\nrequeued\n```\n\nCelery-состояния:\n\n```text\nPENDING\nSTARTED\nRETRY\nSUCCESS\nFAILURE\nREVOKED\n```\n\nобычно хранятся в **result backend**:\n\n```python\napp = Celery(\n    \"project\",\n    broker=\"amqp://rabbitmq//\",\n    backend=\"redis://redis:6379/0\",\n)\n```\n\nВ качестве result backend можно использовать Redis, SQL-базу, RPC backend и другие поддерживаемые хранилища. По умолчанию result backend вообще не настроен. \n\n```text\nRabbitMQ\n    хранит сообщение задачи\n\nRedis result backend\n    хранит состояние и результат задачи\n```\n\n### Типичный жизненный цикл\n\n```text\nPENDING\n    |\n    v\nSTARTED       только если включён track_started\n    |\n    +------------------+\n    |                  |\n    v                  v\nSUCCESS             FAILURE\n    ^\n    |\nRETRY\n```\n\nРеальный цикл с повторными попытками может выглядеть так:\n\n```text\nPENDING\n    |\nSTARTED\n    |\nRETRY\n    |\nSTARTED\n    |\nRETRY\n    |\nSTARTED\n    |\nSUCCESS\n```\n\nПри этом result backend обычно хранит **последнее состояние**, а не полноценную историю всех переходов. Когда задача переходит в новое состояние, предыдущая запись заменяется. \n\n### `PENDING`\n\nПосле публикации:\n\n```python\nresult = generate_report.delay(report_id)\n```\n\nCelery возвращает:\n\n```python\nAsyncResult(task_id)\n```\n\nНо это ещё не означает, что в result backend появилась запись:\n\n```python\nprint(result.state)\n# PENDING\n```\n\n`PENDING` имеет двойной смысл:\n\n```text\nзадача ожидает выполнения\n\nили\n\nCelery ничего не знает о task_id\n```\n\nЛюбой неизвестный result backend идентификатор считается `PENDING`. Поэтому по этому состоянию нельзя точно понять:\n\n- находится ли сообщение в RabbitMQ;\n    \n- было ли оно вообще опубликовано;\n    \n- получил ли его worker;\n    \n- уже выполняется ли задача при отключённом `track_started`;\n    \n- был ли результат удалён по истечении срока хранения.\n    \n\nНапример:\n\n```python\nresult = app.AsyncResult(\"несуществующий-id\")\n\nprint(result.state)\n# PENDING\n```\n\n### `RECEIVED`\n\nКогда worker получает сообщение от брокера, он может отправить событие:\n\n```text\ntask-received\n```\n\nВ мониторинге появляется состояние:\n\n```text\nRECEIVED\n```\n\nНо `RECEIVED` обычно относится к **Celery Events**, а не к состояниям, записанным в result backend:\n\n```text\nRabbitMQ -> Worker\n              |\n              +--> task-received event\n              |\n              +--> задача может оставаться reserved\n```\n\nПолученная задача ещё может ожидать свободного процесса execution pool. Поэтому:\n\n```text\nRECEIVED ≠ STARTED\n```\n\nОфициальная таблица состояний прямо отмечает, что `RECEIVED` используется только в событиях.\n\n### `STARTED`\n\nНепосредственно перед выполнением тела задачи worker может записать:\n\n```text\nSTARTED\n```\n\nНо по умолчанию это отключено:\n\n```python\napp.conf.task_track_started = True\n```\n\nЛибо для отдельной задачи:\n\n```python\n@app.task(track_started=True)\ndef generate_report(report_id: int) -> str:\n    ...\n```\n\nТогда в result backend записывается состояние `STARTED`, а в метаданных могут находиться PID и hostname процесса worker:\n\n```python\nresult = generate_report.delay(42)\n\nprint(result.state)\n# STARTED\n\nprint(result.info)\n# {\"pid\": 124, \"hostname\": \"celery@worker-1\"}\n```\n\nБез `track_started=True` задача обычно переходит для наблюдателя сразу:\n\n```text\nPENDING -> SUCCESS\n```\n\nили:\n\n```text\nPENDING -> FAILURE\n```\n\nхотя фактически некоторое время выполнялась.\n\n### Кто обновляет состояние\n\nОсновные состояния устанавливает внутренний Celery tracer — механизм, который оборачивает вызов `Task.run()`.\n\nУпрощённо:\n\n```python\ndef trace_task(task, task_id, args, kwargs):\n    try:\n        result = task.run(*args, **kwargs)\n    except Retry as exc:\n        backend.store_result(task_id, exc, \"RETRY\")\n    except Exception as exc:\n        backend.store_result(task_id, exc, \"FAILURE\")\n    else:\n        backend.store_result(task_id, result, \"SUCCESS\")\n```\n\nРеальный `celery.app.trace`:\n\n- перехватывает исключения;\n    \n- обрабатывает `Retry`;\n    \n- вызывает task hooks;\n    \n- сохраняет результат;\n    \n- обновляет result backend;\n    \n- формирует события мониторинга.\n    \n### `SUCCESS`\n\nЕсли функция завершилась без исключения:\n\n```python\n@app.task\ndef add(a: int, b: int) -> int:\n    return a + b\n```\n\nworker сохраняет:\n\n```text\nstate:  SUCCESS\nresult: 5\n```\n\nПолучение:\n\n```python\nresult = add.delay(2, 3)\n\nvalue = result.get(timeout=10)\n\nprint(value)\n# 5\n\nprint(result.state)\n# SUCCESS\n\nprint(result.result)\n# 5\n```\n\nCelery сначала сохраняет результат и состояние `SUCCESS` в backend, а затем вызывает `on_success()`. Поэтому внешний клиент уже может видеть `SUCCESS`, пока обработчик `on_success()` ещё выполняется. \n\n### `FAILURE`\n\nЕсли тело задачи выбросило необработанное исключение:\n\n```python\n@app.task\ndef generate_report(report_id: int) -> None:\n    raise RuntimeError(\"Generation failed\")\n```\n\nCelery записывает:\n\n```text\nstate:     FAILURE\nresult:    RuntimeError(...)\ntraceback: ...\n```\n\n```python\nresult = generate_report.delay(42)\n\ntry:\n    result.get(timeout=10)\nexcept RuntimeError:\n    ...\n\nprint(result.state)\n# FAILURE\n\nprint(result.result)\n# RuntimeError(\"Generation failed\")\n\nprint(result.traceback)\n```\n\nСостояние записывается в backend до вызова `on_failure()`. Поэтому клиент может увидеть `FAILURE`, когда пользовательский failure hook ещё не закончил работу. \n\n### `RETRY`\n\nПри вызове:\n\n```python\nraise self.retry(\n    exc=exc,\n    countdown=30,\n)\n```\n\nCelery выбрасывает специальное исключение `Retry`. Оно не считается обычной ошибкой задачи.\n\nCelery:\n\n1. записывает состояние `RETRY`;\n    \n2. сохраняет исходное исключение и traceback;\n    \n3. публикует новую попытку;\n    \n4. использует тот же `task_id`;\n    \n5. обычно отправляет задачу в ту же очередь.\n    \n\n```text\nTask ID: 123\n\nпопытка 1 -> RETRY\nпопытка 2 -> RETRY\nпопытка 3 -> SUCCESS\n```\n\n`on_retry()` вызывается после обновления backend до `RETRY`, но до планирования следующей попытки. \n\nПример:\n\n```python\n@app.task(\n    bind=True,\n    max_retries=5,\n)\ndef call_provider(self, payment_id: int) -> None:\n    try:\n        provider.process(payment_id)\n    except ProviderTimeout as exc:\n        raise self.retry(\n            exc=exc,\n            countdown=30,\n        )\n```\n\n### `REVOKED`\n\nЗадачу можно отозвать:\n\n```python\napp.control.revoke(task_id)\n```\n\nили:\n\n```python\nresult.revoke()\n```\n\nТогда её состояние может стать:\n\n```text\nREVOKED\n```\n\nВажно: обычный revoke не обязательно прекращает уже выполняющуюся задачу. По умолчанию worker запоминает task ID и не запускает её, если она ещё не начала выполняться. Принудительное завершение является отдельным режимом и зависит от используемого execution pool. Событие `task-revoked` может содержать признаки `terminated`, сигнала завершения и истечения срока задачи. \n\n### Пользовательские состояния\n\nЗадача может самостоятельно записывать произвольное состояние через `update_state()`:\n\n```python\n@app.task(bind=True)\ndef process_file(self, file_id: int) -> None:\n    total = 100\n\n    for current in range(total):\n        process_item(current)\n\n        self.update_state(\n            state=\"PROGRESS\",\n            meta={\n                \"current\": current + 1,\n                \"total\": total,\n                \"percent\": current + 1,\n            },\n        )\n```\n\n`update_state()` фактически вызывает backend и сохраняет:\n\n```text\ntask_id\nstate\nmeta\n```\n\nПо умолчанию используется ID текущей задачи. \n\nКлиент:\n\n```python\nresult = app.AsyncResult(task_id)\n\nprint(result.state)\n# PROGRESS\n\nprint(result.info)\n# {\n#     \"current\": 65,\n#     \"total\": 100,\n#     \"percent\": 65\n# }\n```\n\nПосле завершения Celery заменит пользовательское состояние:\n\n```text\nPROGRESS -> SUCCESS\n```\n\nили:\n\n```text\nPROGRESS -> FAILURE\n```\n\n### Result backend хранит последнее состояние\n\nУсловная запись в Redis может выглядеть так:\n\n```json\n{\n  \"status\": \"PROGRESS\",\n  \"result\": {\n    \"current\": 65,\n    \"total\": 100\n  },\n  \"traceback\": null,\n  \"children\": [],\n  \"task_id\": \"123\"\n}\n```\n\nПозже она заменяется:\n\n```json\n{\n  \"status\": \"SUCCESS\",\n  \"result\": {\n    \"file_url\": \"/files/result.csv\"\n  },\n  \"traceback\": null,\n  \"children\": [],\n  \"task_id\": \"123\"\n}\n```\n\nCelery не предоставляет через обычный `AsyncResult` последовательность:\n\n```text\nPENDING -> STARTED -> PROGRESS 10 -> PROGRESS 50 -> SUCCESS\n```\n\nОн показывает последнее известное backend состояние. Для полноценной истории нужно отдельно сохранять переходы или обрабатывать Celery Events. \n\n### Celery Events\n\nПараллельно worker может публиковать события:\n\n```text\ntask-sent\ntask-received\ntask-started\ntask-succeeded\ntask-failed\ntask-retried\ntask-revoked\ntask-rejected\n```\n\nИх используют:\n\n```text\nFlower\ncelery events\nсобственный event receiver\nсистема мониторинга\n```\n\n```text\nWorker\n    |\n    +--> result backend\n    |       последнее состояние и результат\n    |\n    +--> event stream\n            события жизненного цикла\n```\n\nEvents дают более подробную картину происходящего, но сами по себе не являются постоянным хранилищем. Для истории их нужно собирать и сохранять отдельно. Официальная документация предупреждает, что даже один worker может генерировать большое количество событий. \n\n### Result backend и Events решают разные задачи\n\n|Механизм|Назначение|\n|---|---|\n|Result backend|Получить последнее состояние, результат или ошибку по `task_id`|\n|Celery Events|Мониторить жизненный цикл workers и задач в реальном времени|\n|Broker|Доставить сообщение задачи worker’у|\n|Бизнес-таблица задач|Хранить надёжное прикладное состояние операции|\n\nДля пользовательского API не всегда правильно использовать `AsyncResult` как единственный источник истины. Для важных длительных операций часто создают собственную таблицу:\n\n```text\njobs\n├── id\n├── celery_task_id\n├── status\n├── progress\n├── result\n├── error_code\n├── created_at\n├── started_at\n└── finished_at\n```\n\nCelery task обновляет эту таблицу независимо от технического состояния Celery:\n\n```text\nCelery STARTED    -> бизнес-статус running\nCelery SUCCESS    -> бизнес-статус completed\nCelery FAILURE    -> бизнес-статус failed\n```\n\nЭто позволяет отделить техническое состояние выполнения от состояния бизнес-операции.\n\n### Что делает `task_ignore_result`\n\nПри настройке:\n\n```python\napp.conf.task_ignore_result = True\n```\n\nCelery не сохраняет успешные return values в result backend:\n\n```python\n@app.task(ignore_result=True)\ndef send_email(user_id: int) -> None:\n    ...\n```\n\nТогда нельзя надёжно использовать `AsyncResult` для получения результата и проверки завершения.\n\nМожно сохранить только ошибки:\n\n```python\napp.conf.task_ignore_result = True\napp.conf.task_store_errors_even_if_ignored = True\n```\n\n`result_expires` задаёт срок хранения сохранённых результатов; значение по умолчанию — один день, хотя точное удаление зависит от backend. \n\n### Практическая конфигурация\n\n```python\nfrom celery import Celery\n\napp = Celery(\n    \"project\",\n    broker=\"amqp://rabbitmq//\",\n    backend=\"redis://redis:6379/1\",\n)\n\napp.conf.update(\n    task_track_started=True,\n    task_ignore_result=False,\n    task_store_errors_even_if_ignored=True,\n    result_expires=86_400,\n    result_extended=True,\n)\n```\n\nЗадача:\n\n```python\n@app.task(\n    bind=True,\n    autoretry_for=(ConnectionError,),\n    retry_backoff=True,\n    retry_jitter=True,\n    max_retries=5,\n)\ndef generate_report(\n    self,\n    report_id: int,\n) -> dict[str, str]:\n    self.update_state(\n        state=\"PROGRESS\",\n        meta={\n            \"stage\": \"loading_data\",\n            \"percent\": 10,\n        },\n    )\n\n    load_data(report_id)\n\n    self.update_state(\n        state=\"PROGRESS\",\n        meta={\n            \"stage\": \"building_document\",\n            \"percent\": 70,\n        },\n    )\n\n    path = build_document(report_id)\n\n    return {\n        \"path\": path,\n    }\n```\n\nНаблюдаемая последовательность:\n\n```text\nPENDING\n    |\nSTARTED\n    |\nPROGRESS {stage: loading_data, percent: 10}\n    |\nPROGRESS {stage: building_document, percent: 70}\n    |\nSUCCESS {path: ...}\n```\n\n### Важное различие\n\n```text\nСостояние Celery\n    описывает техническое выполнение task.\n\nСостояние RabbitMQ\n    описывает доставку сообщения.\n\nБизнес-состояние\n    описывает результат операции для пользователя.\n```\n\nНапример:\n\n```text\nRabbitMQ:\n    сообщение уже ACK\n\nCelery:\n    SUCCESS\n\nБизнес-объект:\n    report.status = completed\n```\n\nЭти три состояния связаны, но не являются одним и тем же.\n\n### Итоговая цепочка\n\n```text\n1. Producer вызывает delay().\n2. Создаётся task_id и сообщение отправляется брокеру.\n3. AsyncResult сначала показывает PENDING.\n4. Worker получает сообщение и отправляет task-received event.\n5. При task_track_started=True backend получает STARTED.\n6. Task может записывать пользовательские состояния через update_state().\n7. При retry backend получает RETRY, а сообщение публикуется снова.\n8. При успешном возврате backend получает SUCCESS и return value.\n9. При исключении backend получает FAILURE, exception и traceback.\n10. AsyncResult читает последнее сохранённое состояние из backend.\n11. Flower строит более подробную картину по Celery Events.\n```\n\nГлавное: Celery не ведёт строгую долговечную историю state machine автоматически. Worker определяет очередной исход, result backend хранит последнее состояние, а event-система передаёт события жизненного цикла для мониторинга."
