[[questions]]
  id = 5
  question = "Преимущества очередей (Celery)"
  answer = "### Преимущества очередей задач в Celery\n\nCelery использует брокер сообщений — например, RabbitMQ или Redis — чтобы передавать задачи от приложения отдельным Worker-процессам.\n\n```text\nFastAPI / Django\n      │ task.delay(...)\n      ▼\nBroker\n      │ очередь задач\n      ▼\nCelery Worker\n      │\n      ▼\nВыполнение операции\n```\n\n### 1. Быстрый ответ клиенту\n\nДолгая операция не выполняется внутри HTTP-запроса:\n\n```python\n@app.post(\"/reports\", status_code=202)\nasync def create_report(report_id: int):\n    generate_report.delay(report_id)\n\n    return {\n        \"report_id\": report_id,\n        \"status\": \"processing\",\n    }\n```\n\nAPI только ставит задачу в очередь, а Worker выполняет её отдельно. Это уменьшает время HTTP-ответа и не удерживает процесс веб-приложения занятой фоновой работой. В Celery клиент публикует сообщение в очередь, брокер передаёт его одному из Worker-ов. \n\n### 2. Буферизация всплесков нагрузки\n\nОчередь отделяет скорость создания задач от скорости их выполнения:\n\n```text\nAPI создаёт 10 000 задач\n          ↓\n      очередь\n          ↓\nWorker-ы обрабатывают их\nс доступной скоростью\n```\n\nБез очереди резкий поток запросов пришлось бы немедленно обрабатывать приложению, БД или внешнему сервису. Очередь временно накапливает работу и позволяет Worker-ам забирать её постепенно.\n\nНо очередь не устраняет перегрузку автоматически: необходимо контролировать её длину, скорость поступления задач и производительность Worker-ов.\n\n### 3. Горизонтальное масштабирование\n\nНесколько Worker-ов могут обрабатывать одну очередь:\n\n```text\n                 ┌── Worker 1\nQueue ───────────┼── Worker 2\n                 ├── Worker 3\n                 └── Worker 4\n```\n\nЕсли задач становится больше, можно добавить Worker-процессы или отдельные серверы без масштабирования HTTP-приложения. Celery рассчитан на распределение работы между потоками или машинами и поддерживает несколько Worker-ов и брокеров. \n\n### 4. Независимое масштабирование разных типов работы\n\nЗадачи можно разделить по очередям:\n\n```text\nemails       → Worker-ы для писем\nreports      → Worker-ы для отчётов\nimages       → Worker-ы обработки изображений\nintegrations → Worker-ы внешних API\n```\n\nНапример:\n\n```python\napp.conf.task_routes = {\n    \"tasks.send_email\": {\n        \"queue\": \"emails\",\n    },\n    \"tasks.generate_report\": {\n        \"queue\": \"reports\",\n    },\n}\n```\n\nWorker можно запустить только для выбранных очередей:\n\n```bash\ncelery -A app worker -Q reports --loglevel=INFO\n```\n\nCelery поддерживает маршрутизацию задач по очередям и запуск Worker-а с ограниченным набором потребляемых очередей. \n\nЭто позволяет выделить больше ресурсов тяжёлым отчётам и не допустить, чтобы они задерживали короткие задачи отправки писем.\n\n### 5. Изоляция веб-приложения от тяжёлой работы\n\nCPU-, I/O- и memory-intensive операции выполняются не в процессе FastAPI или Django:\n\n```text\nWeb application:\nпринимает запросы\n\nCelery Worker:\nгенерирует PDF;\nобрабатывает файл;\nизменяет изображения;\nвызывает внешние API.\n```\n\nСбой конкретной фоновой задачи не обязан приводить к падению HTTP-запроса или всего веб-приложения.\n\nПри этом Celery не превращает CPU-bound задачу в быструю автоматически. Производительность зависит от количества Worker-процессов, оборудования и характера задачи.\n\n### 6. Повторные попытки\n\nПри временной ошибке задачу можно выполнить повторно:\n\n```python\n@app.task(\n    autoretry_for=(ConnectionError, TimeoutError),\n    retry_backoff=True,\n    retry_jitter=True,\n    retry_kwargs={\"max_retries\": 5},\n)\ndef send_to_external_api(operation_id: int) -> None:\n    external_client.send(operation_id)\n```\n\nЭто полезно при временной недоступности:\n\n- внешнего API;\n    \n- SMTP-сервера;\n    \n- объектного хранилища;\n    \n- сетевого ресурса;\n    \n- другого микросервиса.\n    \n\nCelery поддерживает повтор задачи через `retry()` и автоматические retries. \n\nПовторные попытки требуют идемпотентности:\n\n```python\n@app.task\ndef process_payment(payment_id: str) -> None:\n    if payment_repository.is_processed(payment_id):\n        return\n\n    payment_service.process(payment_id)\n```\n\nИначе повторная доставка может создать двойную запись, отправить два письма или дважды выполнить финансовую операцию.\n\n### 7. Восстановление после падения Worker-а\n\nCelery и брокер поддерживают acknowledgements — подтверждения получения или обработки сообщений.\n\nПри подходящей настройке задача подтверждается после выполнения:\n\n```python\n@app.task(\n    acks_late=True,\n)\ndef process_batch(batch_id: int) -> None:\n    ...\n```\n\nЕсли Worker аварийно завершится до подтверждения, сообщение может быть возвращено в очередь и обработано повторно. Именно поэтому задача с поздним подтверждением должна быть идемпотентной. Официальная документация отдельно связывает `acks_late` и возможность повторного выполнения задачи после сбоя Worker-а. \n\nЭто не гарантия «ровно один раз». В практической системе нужно исходить из модели:\n\n```text\nЗадача может быть доставлена\nи выполнена более одного раза.\n```\n\n### 8. Управление справедливым распределением нагрузки\n\nWorker может заранее зарезервировать несколько задач. Параметры prefetch позволяют контролировать, сколько сообщений он получает заранее.\n\nНапример:\n\n```python\napp.conf.worker_prefetch_multiplier = 1\n```\n\nЭто особенно полезно для долгих задач: один Worker не должен заранее забрать слишком много работы, пока другие Worker-ы простаивают. Документация Celery описывает связь prefetch multiplier с количеством зарезервированных задач и рекомендует разделять долгие и короткие задачи по Worker-ам и очередям. \n\n### 9. Параллельная обработка больших объёмов\n\nБольшую операцию можно разбить на батчи:\n\n```text\n1 000 000 записей\n        ↓\n1 000 батчей\n        ↓\nочередь Celery\n        ↓\nнесколько Worker-ов\n```\n\n```python\nfrom celery import group\n\nworkflow = group(\n    process_batch.s(batch_id)\n    for batch_id in batch_ids\n)\n\nworkflow.apply_async()\n```\n\nПреимущества:\n\n```text\nчасти обрабатываются параллельно;\nошибка одного батча не требует повторять все данные;\nможно отслеживать прогресс;\nнагрузка распределяется между Worker-ами;\nможно добавлять вычислительные ресурсы.\n```\n\n### 10. Ослабление временной связанности\n\nProducer и Worker не обязаны одновременно выполнять одну операцию:\n\n```text\nAPI опубликовал задачу\n        ↓\nWorker может обработать её позднее\n```\n\nВеб-приложению не нужно знать:\n\n- какой конкретно Worker выполнит задачу;\n    \n- на каком сервере он находится;\n    \n- сколько экземпляров Worker-а запущено;\n    \n- когда именно задача начнёт выполняться.\n    \n\nЭто упрощает независимое масштабирование и развёртывание компонентов.\n\n### 11. Управление приоритетами и классами задач\n\nРазные очереди позволяют отделить важные операции от менее срочных:\n\n```text\ncritical   → платёжные статусы\ndefault    → обычная обработка\nlow        → отчёты и архивирование\n```\n\nДаже без брокерных приоритетов раздельные очереди позволяют выделить отдельное количество Worker-ов каждому классу задач.\n\nНапример:\n\n```bash\ncelery -A app worker -Q critical --concurrency=4\ncelery -A app worker -Q reports --concurrency=2\n```\n\n### 12. Построение сложных workflow\n\nCelery Canvas позволяет объединять задачи:\n\n```text\nchain — последовательность;\ngroup — параллельная группа;\nchord — группа с общей финализацией;\nchunks — пакетная обработка аргументов.\n```\n\nНапример:\n\n```text\nобработать батчи параллельно\n          ↓\nдождаться всех\n          ↓\nсформировать итоговый отчёт\n```\n\n```python\nfrom celery import chord\n\nchord(\n    process_batch.s(batch_id)\n    for batch_id in batch_ids\n)(\n    finalize_report.s(job_id)\n)\n```\n\n### 13. Выполнение задач по расписанию\n\nС помощью Celery Beat задачи можно публиковать периодически:\n\n```python\napp.conf.beat_schedule = {\n    \"remove-expired-files\": {\n        \"task\": \"tasks.remove_expired_files\",\n        \"schedule\": 3600.0,\n    },\n}\n```\n\n```text\nCelery Beat\n     ↓\nBroker\n     ↓\nCelery Worker\n```\n\nЭто применяют для очистки данных, синхронизации, формирования отчётов и регулярных проверок.\n\n### Ограничения\n\nОчереди Celery добавляют собственную сложность:\n\n```text\nнужен Redis или RabbitMQ;\nнужно обслуживать Worker-ы;\nнужно следить за длиной очередей;\nвозможны повторные выполнения;\nнужна идемпотентность;\nнужны мониторинг и алерты;\nнужно проектировать тайм-ауты и retries;\nнужно контролировать размер сообщений.\n```\n\nCelery также не гарантирует завершение любой задачи сам по себе. Надёжность зависит от:\n\n- настроек брокера;\n    \n- persistence сообщений;\n    \n- acknowledgements;\n    \n- обработки повторов;\n    \n- идемпотентности;\n    \n- мониторинга;\n    \n- способа публикации задачи.\n    \n\nНапример, операция:\n\n```python\nsave_order()\nsend_notification.delay(order_id)\n```\n\nможет потерять сообщение, если процесс завершится между записью в БД и публикацией задачи. Для критичной доставки используют Transactional Outbox или другой механизм согласования БД и брокера.\n\n### Итог\n\nГлавные преимущества очередей Celery:\n\n```text\n1. Быстрый ответ HTTP API\n2. Фоновое выполнение длительных операций\n3. Буферизация всплесков нагрузки\n4. Горизонтальное масштабирование Worker-ов\n5. Разделение задач по очередям\n6. Повторные попытки после временных ошибок\n7. Возможность повторной доставки после сбоя\n8. Параллельная обработка данных\n9. Независимое масштабирование разных типов задач\n10. Построение последовательных и параллельных workflow\n11. Запуск задач по расписанию\n12. Снижение прямой связанности компонентов\n```\n\nОчередь особенно полезна, когда работу необязательно завершать внутри текущего HTTP-запроса и её можно выполнить отдельно, повторить или распределить между несколькими Worker-ами."
