[[questions]]
  id = 25
  question = "Что делать, если ни один message broker не подходит под требования?"
  answer = "### Сначала проверить сами требования\n\nЕсли «не подходит ни один брокер», обычно возможны три причины:\n\n1. Требования противоречат друг другу.\n    \n2. Выбран неверный класс инструмента.\n    \n3. Один компонент пытаются использовать для нескольких разных задач.\n    \n\nНапример, сложно одновременно получить:\n\n```text\nглобальный строгий порядок\n+ неограниченное горизонтальное масштабирование\n+ минимальную задержку\n+ exactly once для внешней БД\n+ длительное хранение\n+ низкую стоимость\n```\n\nКаждое требование нужно перевести в измеряемую форму:\n\n```text\nНагрузка:             10 000 сообщений/с\nМаксимальная задержка: p99 < 100 мс\nХранение:             30 дней\nРазмер сообщения:     до 64 КБ\nПорядок:              по order_id\nГарантия:              at least once\nRPO:                   0\nRTO:                   5 минут\nКоличество consumers: 20 групп\n```\n\nПосле этого требования делят на:\n\n- обязательные;\n    \n- желательные;\n    \n- те, которые можно реализовать на уровне приложения;\n    \n- те, которыми можно пожертвовать.\n    \n\n### Не обязательно искать один универсальный брокер\n\nЧасто правильное решение — использовать несколько механизмов для разных типов взаимодействия:\n\n```text\nКоманды и фоновые задачи  -> очередь задач\nДоменные события          -> журнал событий\nДлительные процессы       -> workflow engine\nСинхронные операции       -> HTTP/gRPC\nБольшие файлы             -> S3/MinIO\nАтомарность с БД          -> transactional outbox\n```\n\nНапример:\n\n```text\nHTTP API\n   |\n   +--> PostgreSQL + Outbox\n   |\n   +--> RabbitMQ для фоновых задач\n   |\n   +--> Kafka для аналитических событий\n   |\n   +--> Temporal для длительных бизнес-процессов\n```\n\nЭто лучше, чем заставлять один брокер одновременно быть task queue, event store, workflow engine и базой аудита.\n\n### Вариант 1: использовать PostgreSQL как очередь\n\nЕсли нагрузка умеренная, а задачи тесно связаны с транзакциями БД, отдельный брокер может быть не нужен.\n\nТаблица задач:\n\n```sql\nCREATE TABLE jobs (\n    id UUID PRIMARY KEY,\n    job_type TEXT NOT NULL,\n    payload JSONB NOT NULL,\n\n    status TEXT NOT NULL DEFAULT 'pending',\n    priority INTEGER NOT NULL DEFAULT 0,\n\n    attempts INTEGER NOT NULL DEFAULT 0,\n    max_attempts INTEGER NOT NULL DEFAULT 5,\n\n    run_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),\n    locked_until TIMESTAMPTZ,\n    worker_id TEXT,\n\n    created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),\n    finished_at TIMESTAMPTZ\n);\n\nCREATE INDEX jobs_pending_idx\nON jobs (priority DESC, run_at, created_at)\nWHERE status = 'pending';\n```\n\nWorker выбирает задачи:\n\n```sql\nWITH selected_jobs AS (\n    SELECT id\n    FROM jobs\n    WHERE status = 'pending'\n      AND run_at <= NOW()\n      AND (\n          locked_until IS NULL\n          OR locked_until < NOW()\n      )\n    ORDER BY priority DESC, run_at, created_at\n    FOR UPDATE SKIP LOCKED\n    LIMIT 10\n)\nUPDATE jobs\nSET status = 'running',\n    worker_id = :worker_id,\n    locked_until = NOW() + INTERVAL '5 minutes',\n    attempts = attempts + 1\nFROM selected_jobs\nWHERE jobs.id = selected_jobs.id\nRETURNING jobs.*;\n```\n\n`SKIP LOCKED` позволяет нескольким workers пропускать уже заблокированные строки; документация PostgreSQL прямо отмечает queue-like таблицы как подходящий сценарий такого механизма. \n\nПреимущества:\n\n- задача и бизнес-данные сохраняются в одной транзакции;\n    \n- не возникает dual-write между БД и брокером;\n    \n- легко делать поиск и аудит;\n    \n- не нужна отдельная инфраструктура;\n    \n- можно реализовать приоритеты, расписание и retry.\n    \n\nНедостатки:\n\n- очередь нагружает основную БД;\n    \n- требуется очистка завершённых задач;\n    \n- сложнее добиться очень высокой пропускной способности;\n    \n- нужно самостоятельно реализовать leases, retries, DLQ и мониторинг;\n    \n- длительное удержание транзакций недопустимо.\n    \n\nДля небольших и средних backend-систем это часто практичнее отдельного брокера.\n\n### LISTEN/NOTIFY — только как сигнал пробуждения\n\nМожно объединить таблицу задач и PostgreSQL `NOTIFY`:\n\n```text\nINSERT job\n    |\n    +--> COMMIT\n    |\n    +--> NOTIFY jobs_created\n              |\n              v\n          Worker просыпается\n              |\n              v\n        читает таблицу jobs\n```\n\n```sql\nNOTIFY jobs_created, 'new-job';\n```\n\n`NOTIFY` предоставляет простой IPC-механизм между процессами, работающими с одной PostgreSQL, а структурированные данные документация рекомендует хранить в таблице и передавать через уведомление только ключ. Payload по умолчанию ограничен значением менее 8000 байт. \n\nПрактический вывод: `NOTIFY` лучше использовать не как надёжную очередь, а как необязательный сигнал, ускоряющий polling. Источником истины остаётся таблица:\n\n```text\nWorker получил NOTIFY\n    -> сразу проверил jobs\n\nWorker пропустил NOTIFY\n    -> периодический polling всё равно найдёт jobs\n```\n\n### Вариант 2: Redis Streams\n\nКогда полноценный Kafka слишком тяжёлый, но нужны:\n\n- упорядоченный поток;\n    \n- consumer groups;\n    \n- acknowledgements;\n    \n- повторное чтение;\n    \n- обработка зависших сообщений;\n    \n- ограниченный retention,\n    \n\nможно использовать Redis Streams.\n\n```text\nXADD\n  |\n  v\nRedis Stream\n  |\n  +--> Consumer Group A\n  |\n  +--> Consumer Group B\n```\n\nRedis Streams предоставляет append-only журнал, consumer groups, `XACK`, pending entries и механизмы `XCLAIM`/`XAUTOCLAIM` для перехвата сообщений от упавших consumers. Также поддерживается replay по идентификаторам и ограничение размера stream. \n\nНо Redis Streams не стоит выбирать только потому, что Redis уже используется как кэш. Нужно отдельно проверить:\n\n- режим персистентности;\n    \n- репликацию;\n    \n- failover;\n    \n- memory policy;\n    \n- допустимость потери последних записей;\n    \n- поведение при полном объёме памяти.\n    \n\n### Вариант 3: workflow engine\n\nИногда проекту нужен не брокер, а управление длительными процессами.\n\nНапример:\n\n```text\nСоздать заказ\n    |\n    v\nЗарезервировать товар\n    |\n    v\nСписать оплату\n    |\n    +-- ошибка -> отменить резерв\n    |\n    v\nОрганизовать доставку\n    |\n    v\nЖдать подтверждение несколько дней\n```\n\nОбычный брокер доставляет сообщения, но сам по себе не решает полностью:\n\n- хранение состояния процесса;\n    \n- таймеры на часы и дни;\n    \n- последовательность шагов;\n    \n- compensation;\n    \n- ожидание внешнего сигнала;\n    \n- возобновление после падения;\n    \n- управление версиями выполняющихся процессов.\n    \n\nДля этого больше подходит workflow engine, например Temporal. Его модель рассчитана на возобновление выполнения после падений, сетевых ошибок и инфраструктурных сбоев, включая процессы, продолжающиеся длительное время. \n\n```text\nBroker:\n    доставь сообщение обработчику\n\nWorkflow engine:\n    надёжно выполни многошаговый процесс\n    и сохрани его состояние между шагами\n```\n\n### Вариант 4: синхронный HTTP или gRPC\n\nЕсли отправителю немедленно нужен результат, асинхронный брокер может быть неверным выбором.\n\n```text\nService A\n    |\n    | HTTP/gRPC request\n    v\nService B\n    |\n    | response\n    v\nService A\n```\n\nИспользовать прямой вызов разумно, когда:\n\n- операция короткая;\n    \n- клиенту нужен немедленный ответ;\n    \n- вызываемый сервис обязан быть доступен сейчас;\n    \n- запрос имеет естественную request/response семантику;\n    \n- повторное выполнение можно контролировать через idempotency key.\n    \n\nНужно добавить:\n\n```text\ntimeout\nограниченный retry\ncircuit breaker\nconcurrency limit\nидемпотентность\nнаблюдаемость\n```\n\nНе следует помещать любой межсервисный вызов в брокер только ради формальной «асинхронности».\n\n### Вариант 5: object storage и передача ссылки\n\nКогда брокеры не подходят из-за размера сообщений, обычно не нужно искать брокер с большими лимитами.\n\n```text\nProducer\n    |\n    | файл\n    v\nS3 / MinIO\n    |\n    | object_key\n    v\nОчередь или таблица задач\n```\n\nСообщение:\n\n```json\n{\n  \"job_id\": \"job-842\",\n  \"bucket\": \"imports\",\n  \"object_key\": \"payments/2026/07/file-842.csv\",\n  \"checksum\": \"sha256:...\"\n}\n```\n\nТаким способом отдельно решаются:\n\n- хранение больших данных;\n    \n- доставка небольшой команды;\n    \n- повторное скачивание;\n    \n- контроль целостности;\n    \n- retention файлов.\n    \n\n### Вариант 6: transactional outbox и polling\n\nЕсли основная проблема — гарантировать публикацию после изменения БД, не обязательно менять брокер.\n\n```text\nBEGIN\n\nИзменить бизнес-данные\nДобавить событие в outbox\n\nCOMMIT\n```\n\n```text\nOutbox relay\n    |\n    +--> выбранный брокер\n    |\n    +--> HTTP endpoint\n    |\n    +--> внутренний worker\n```\n\nOutbox отделяет надёжное сохранение события от способа его доставки. Позже транспорт можно заменить, не изменяя бизнес-транзакцию.\n\n```sql\nCREATE TABLE outbox (\n    id UUID PRIMARY KEY,\n    message_type TEXT NOT NULL,\n    payload JSONB NOT NULL,\n    created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),\n    published_at TIMESTAMPTZ,\n    attempts INTEGER NOT NULL DEFAULT 0\n);\n```\n\nЭто особенно полезно, когда ни один транспорт не может участвовать в одной атомарной транзакции с PostgreSQL.\n\n### Можно комбинировать компоненты\n\nНапример, требования:\n\n```text\nАтомарность с PostgreSQL\nНебольшая задержка\nReplay на 24 часа\nНесколько независимых consumers\nБез отдельного Kafka-кластера\n```\n\nВозможное решение:\n\n```text\nBusiness transaction\n        |\n        v\nPostgreSQL outbox\n        |\n        v\nOutbox relay\n        |\n        v\nRedis Stream\n        |\n        +--> Consumer Group A\n        +--> Consumer Group B\n```\n\nИли:\n\n```text\nPostgreSQL jobs\n    |\n    +--> LISTEN/NOTIFY для пробуждения\n    |\n    +--> polling как гарантия\n    |\n    +--> SKIP LOCKED для распределения задач\n```\n\n### Когда действительно писать собственное решение\n\nСобственная система оправдана только при уникальных требованиях, например:\n\n- специализированное оборудование или нестандартная сеть;\n    \n- крайне специфичный протокол;\n    \n- необычные требования к задержке;\n    \n- особая модель безопасности или изоляции;\n    \n- жёсткие ограничения среды;\n    \n- достаточно узкая задача, которую нельзя решить существующими средствами.\n    \n\nНо лучше создавать **узкий доменный компонент**, а не новый универсальный RabbitMQ или Kafka.\n\nНапример:\n\n```text\nПлохо:\n    собственный универсальный message broker\n\nРазумнее:\n    специализированный scheduler заданий\n    для конкретного типа вычислений\n```\n\n### Что придётся реализовать самостоятельно\n\nДаже узкая очередь быстро потребует:\n\n```text\nНадёжное хранение\nWAL или append-only log\nfsync\nВосстановление после падения\n\nДоставка\nacknowledgements\nredelivery\nconsumer leases\ndeduplication\n\nУправление нагрузкой\nbackpressure\nrate limiting\nbatching\nflow control\n\nОтказоустойчивость\nрепликация\nleader election\nquorum\nfailover\n\nЭксплуатация\nметрики\ntracing\nадминистративный API\nочистка данных\nобновление без остановки\n\nБезопасность\nаутентификация\nавторизация\nTLS\nаудит\n\nКонтракты\nschema versioning\nсовместимость\nограничения размера\n```\n\nНаиболее сложные ошибки проявляются не в штатной работе, а в ситуациях:\n\n```text\nсообщение записалось, но ответ потерялся;\nconsumer выполнил операцию, но не подтвердил;\nleader сменился во время записи;\nдве реплики считают себя leader;\nдиск заполнен;\nпроцесс упал между двумя обновлениями;\nстарый consumer получил новую схему.\n```\n\nПоэтому собственную реализацию следует оценивать как отдельный инфраструктурный продукт, а не как несколько таблиц и background loop.\n\n### Практический алгоритм\n\n```text\n1. Формализовать требования числами и SLA.\n\n2. Отделить:\n       команды;\n       события;\n       фоновые задачи;\n       длительные workflows;\n       большие данные;\n       синхронные вызовы.\n\n3. Проверить, действительно ли всем сценариям\n   нужен один и тот же транспорт.\n\n4. Перенести часть требований на приложение:\n       idempotency;\n       deduplication;\n       ordering по business key;\n       retry policy;\n       schema versioning.\n\n5. Рассмотреть:\n       PostgreSQL job table;\n       transactional outbox;\n       Redis Streams;\n       workflow engine;\n       HTTP/gRPC;\n       object storage.\n\n6. Собрать композицию из нескольких компонентов,\n   если один продукт не покрывает всё.\n\n7. Собственную систему создавать только после:\n       прототипа;\n       нагрузочных тестов;\n       failure-тестов;\n       оценки стоимости разработки и поддержки.\n```\n\n### Итог\n\nЕсли ни один брокер не подходит полностью, правильный вывод обычно не «нужно написать свой Kafka», а:\n\n```text\nЛибо требования нужно пересмотреть,\n\nлибо задача на самом деле требует\nне брокера, а другого класса системы,\n\nлибо архитектуру нужно разделить\nна несколько специализированных компонентов.\n```\n\nНа практике наиболее безопасная основа для нестандартных требований:\n\n```text\nPostgreSQL как источник истины\n    +\nTransactional Outbox\n    +\nидемпотентные обработчики\n    +\nспециализированный транспорт для каждого сценария\n```\n\nСобственный брокер остаётся последним вариантом, когда требования действительно уникальны и команда готова постоянно поддерживать распределённую инфраструктурную систему."
