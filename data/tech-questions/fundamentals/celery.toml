[[questions]]
  id = 2
  question = "Для каких целей применяется Celery?"
  answer = "### Для каких целей применяется Celery\n\nCelery применяют для выполнения задач **вне основного процесса веб-приложения** и распределения работы между отдельными Worker-процессами или серверами.\n\nОбщая схема:\n\n```text\nFastAPI / Django\n        │\n        │ отправляет сообщение о задаче\n        ▼\nRedis / RabbitMQ / другой broker\n        │\n        ▼\nCelery Worker\n        │\n        └── выполняет задачу\n```\n\nПриложение публикует сообщение в очередь, брокер доставляет его Worker-у, а Worker выполняет функцию, зарегистрированную как Celery task. Несколько Worker-ов позволяют распределять работу и горизонтально масштабировать обработку. \n\n### 1. Длительные фоновые операции\n\nCelery используют, когда HTTP-запрос не должен ждать завершения операции:\n\n```python\n@app.post(\"/reports\")\nasync def create_report(report_id: int):\n    generate_report.delay(report_id)\n\n    return {\n        \"report_id\": report_id,\n        \"status\": \"processing\",\n    }\n```\n\nТипичные задачи:\n\n```text\nгенерация PDF и отчётов;\nобработка изображений и видео;\nимпорт и экспорт данных;\nархивация файлов;\nмассовая обработка записей;\nобращение к медленным внешним API.\n```\n\nПользователь получает ответ сразу, а обработка продолжается отдельным Worker-ом.\n\n### 2. Отправка писем и уведомлений\n\nОтправка электронной почты, push-уведомлений или сообщений во внешние системы может быть медленной либо временно завершаться ошибкой:\n\n```python\n@app.task\ndef send_registration_email(user_id: int) -> None:\n    user = load_user(user_id)\n    email_client.send(user.email)\n```\n\nЗапуск:\n\n```python\nsend_registration_email.delay(user.id)\n```\n\nЭто отделяет бизнес-операцию от доступности SMTP-сервера или стороннего провайдера.\n\nВажно сначала сохранить основное состояние в БД, а затем надёжно опубликовать задачу. Простая последовательность:\n\n```python\nsave_user()\nsend_email.delay(user.id)\n```\n\nможет потерять задачу, если приложение завершится между двумя действиями. Для критичных операций обычно применяют Transactional Outbox либо публикацию после успешного завершения транзакции.\n\n### 3. Повторные попытки после временных ошибок\n\nCelery поддерживает повторный запуск задач:\n\n```python\n@app.task(\n    autoretry_for=(ConnectionError, TimeoutError),\n    retry_backoff=True,\n    retry_kwargs={\"max_retries\": 5},\n)\ndef request_external_service(order_id: int) -> None:\n    external_client.send_order(order_id)\n```\n\nПовторные попытки полезны при временной недоступности:\n\n```text\nвнешнего API;\nSMTP-сервера;\nобъектного хранилища;\nсетевого ресурса;\nудалённого микросервиса.\n```\n\nПри вызове `retry` Celery отправляет новое сообщение с тем же идентификатором задачи и сохраняет исходную очередь; автоматический retry настраивается через `autoretry_for`. \n\nЗадача должна быть идемпотентной, поскольку повторное выполнение не должно создавать второй платёж, второй заказ или повторную запись:\n\n```python\n@app.task\ndef process_payment(payment_id: str) -> None:\n    if payment_already_processed(payment_id):\n        return\n\n    execute_payment(payment_id)\n```\n\nДокументация Celery прямо связывает позднее подтверждение сообщения через `acks_late` с требованием идемпотентности задачи. \n\n### 4. Параллельная обработка больших объёмов данных\n\nБольшой набор данных можно разделить на независимые части:\n\n```text\n1 000 000 записей\n        ↓\nбатчи по 1 000 записей\n        ↓\n1 000 Celery-задач\n        ↓\nнесколько Worker-ов\n```\n\nПример:\n\n```python\n@app.task\ndef process_batch(record_ids: list[int]) -> int:\n    processed = 0\n\n    for record_id in record_ids:\n        process_record(record_id)\n        processed += 1\n\n    return processed\n```\n\nCelery предоставляет Canvas-примитивы для организации подобных процессов:\n\n```text\ngroup  — параллельный запуск задач;\nchain  — последовательное выполнение;\nchord  — группа задач с финальной задачей;\nchunks — разбиение данных на части.\n```\n\nЭти механизмы входят в официальный Canvas API Celery.\n\nПример параллельной обработки:\n\n```python\nfrom celery import group\n\nworkflow = group(\n    process_batch.s(batch)\n    for batch in batches\n)\n\nworkflow.apply_async()\n```\n\n### 5. Выполнение цепочек задач\n\nИногда следующая задача должна запускаться после предыдущей:\n\n```text\nполучить файл\n    ↓\nпроверить файл\n    ↓\nобработать данные\n    ↓\nсформировать отчёт\n    ↓\nуведомить пользователя\n```\n\nЭто можно представить через `chain`:\n\n```python\nfrom celery import chain\n\nworkflow = chain(\n    download_file.s(file_id),\n    validate_file.s(),\n    process_file.s(),\n    generate_report.s(),\n)\n\nworkflow.apply_async()\n```\n\nДля параллельной обработки с итоговой агрегацией используется `chord`:\n\n```python\nfrom celery import chord\n\nchord(\n    process_batch.s(batch)\n    for batch in batches\n)(\n    aggregate_results.s(job_id)\n)\n```\n\nCallback у `chord` запускается после завершения группы задач; для работы chord обычно требуется подходящий result backend. \n\n### 6. Периодические задачи\n\nCelery Beat используется как планировщик:\n\n```text\nCelery Beat\n     │ создаёт задачи по расписанию\n     ▼\nBroker\n     ▼\nCelery Worker\n```\n\nПример:\n\n```python\napp.conf.beat_schedule = {\n    \"delete-expired-sessions\": {\n        \"task\": \"tasks.delete_expired_sessions\",\n        \"schedule\": 3600.0,\n    },\n}\n```\n\nТипичные периодические операции:\n\n```text\nочистка истёкших токенов;\nформирование ежедневных отчётов;\nсинхронизация с внешней системой;\nпроверка неоплаченных заказов;\nудаление временных файлов;\nобновление кеша.\n```\n\nCelery Beat только публикует задачи по расписанию; непосредственно их выполняют Worker-ы. Для одного расписания должен работать один активный scheduler, иначе возможна публикация дублирующихся задач. \n\n### 7. Разделение задач по очередям\n\nРазные виды задач можно направлять в разные очереди:\n\n```text\nemails     → Worker-ы для писем\nreports    → Worker-ы для отчётов\npayments   → Worker-ы для платёжных операций\nimages     → Worker-ы для обработки изображений\n```\n\nПример конфигурации:\n\n```python\napp.conf.task_routes = {\n    \"tasks.send_email\": {\n        \"queue\": \"emails\",\n    },\n    \"tasks.generate_report\": {\n        \"queue\": \"reports\",\n    },\n    \"tasks.resize_image\": {\n        \"queue\": \"images\",\n    },\n}\n```\n\nЗапуск Worker-а только для определённой очереди:\n\n```bash\ncelery -A application worker -Q reports --loglevel=INFO\n```\n\nCelery поддерживает маршрутизацию задач в разные очереди через `task_routes` и конфигурацию очередей. \n\nЭто позволяет:\n\n```text\nнезависимо масштабировать Worker-ы;\nне блокировать быстрые задачи тяжёлыми;\nзадавать разную concurrency;\nиспользовать разные лимиты ресурсов;\nразделять задачи по приоритету и назначению.\n```\n\n### 8. Отложенный запуск\n\nЗадачу можно запланировать на определённое время или через интервал:\n\n```python\nsend_reminder.apply_async(\n    args=[order_id],\n    countdown=300,\n)\n```\n\nЛибо:\n\n```python\nsend_reminder.apply_async(\n    args=[order_id],\n    eta=scheduled_datetime,\n)\n```\n\nЭто подходит для коротких отложенных операций:\n\n```text\nотправить напоминание через пять минут;\nповторить проверку позднее;\nснять временную блокировку;\nпроверить статус внешней операции.\n```\n\nДля большого количества задач, запланированных далеко в будущем, зачастую надёжнее хранить расписание в БД и периодически выбирать готовые к запуску записи, а не удерживать множество ETA-задач внутри инфраструктуры Celery.\n\n### 9. Сохранение статуса и результата задачи\n\nПри настроенном result backend можно получить:\n\n```text\nидентификатор задачи;\nтекущее состояние;\nрезультат;\nинформацию об ошибке.\n```\n\nПример:\n\n```python\nresult = generate_report.delay(report_id)\n\nreturn {\n    \"task_id\": result.id,\n}\n```\n\nПозже:\n\n```python\nfrom celery.result import AsyncResult\n\nresult = AsyncResult(task_id)\n\nreturn {\n    \"status\": result.status,\n    \"result\": result.result if result.successful() else None,\n}\n```\n\nBroker и result backend выполняют разные задачи:\n\n```text\nBroker         — передаёт сообщения Worker-ам;\nResult Backend — хранит состояния и результаты.\n```\n\nCelery поддерживает различные брокеры и result backend; например, RabbitMQ обычно используется как broker, а Redis может выступать и broker, и backend. \n\nДля длительных бизнес-процессов часто лучше хранить пользовательский статус отдельно в своей БД:\n\n```text\nPENDING\nPROCESSING\nCOMPLETED\nPARTIALLY_COMPLETED\nFAILED\n```\n\nCelery-состояние описывает техническое выполнение задачи, а запись в доменной БД — состояние бизнес-операции.\n\n### Когда Celery оправдан\n\nCelery обычно полезен, когда необходимо хотя бы одно из следующего:\n\n```text\nвыполнить работу после завершения HTTP-запроса;\nраспределить обработку между процессами или серверами;\nбуферизовать всплески нагрузки;\nповторять временно неудачные операции;\nразделять задачи по очередям;\nвыполнять задачи по расписанию;\nстроить цепочки и группы фоновых операций;\nмасштабировать Worker-ы независимо от API.\n```\n\n### Когда Celery может быть избыточен\n\nCelery не всегда нужен для:\n\n```text\nочень короткой некритичной операции;\nобычного async I/O внутри текущего запроса;\nзадачи, результат которой необходим до ответа клиенту;\nнебольшого проекта без потребности в очередях и Worker-ах.\n```\n\nНапример, `asyncio` помогает конкурентно ожидать I/O внутри процесса, но не предоставляет отдельную устойчивую очередь, независимые Worker-ы, маршрутизацию и повторную доставку.\n\nДля небольших операций FastAPI `BackgroundTasks` может быть проще, однако такие задачи выполняются в процессе приложения и не обладают теми же гарантиями и возможностями распределённой очереди.\n\n### Итог\n\nCelery применяется как инфраструктура фонового и распределённого выполнения:\n\n```text\nвеб-приложение\n      │\n      │ публикует задачу\n      ▼\nbroker\n      │\n      ▼\nодин или несколько Worker-ов\n      │\n      ├── выполняют работу\n      ├── повторяют временные ошибки\n      ├── обрабатывают задачи параллельно\n      └── сохраняют результат при необходимости\n```\n\nCelery особенно оправдан для длительных, повторяемых, распределяемых и независимо масштабируемых задач, которые не должны выполняться внутри HTTP-запроса."
