  question = "Можно ли сказать, что worker — это отдельный Python-процесс?"
  answer = "### Да, но с уточнением\n\nНа высоком уровне можно сказать:\n\n> **Celery worker — это отдельный Python-процесс, который подключается к брокеру и получает задачи.**\n\nНапример, команда:\n\n```bash\ncelery -A app.celery_app worker --loglevel=INFO\n```\n\nзапускает отдельный процесс операционной системы — главный процесс worker. Он управляет подключением к брокеру, приёмом сообщений, планированием и пулом выполнения задач.\n\n### При `prefork` задача выполняется не в главном процессе\n\nПо умолчанию Celery использует пул `prefork`. Главный процесс worker создаёт несколько дочерних Python-процессов и передаёт им задачи:\n\n```text\nCelery worker — главный процесс\n├── дочерний процесс 1 -> выполняет task\n├── дочерний процесс 2 -> выполняет task\n├── дочерний процесс 3 -> выполняет task\n└── дочерний процесс 4 -> выполняет task\n```\n\nНапример:\n\n```bash\ncelery -A app.celery_app worker --concurrency=4\n```\n\nозначает, что worker управляет пулом примерно из четырёх исполнительных процессов. Новая task обычно не создаёт новый процесс: Celery использует уже запущенные процессы пула повторно. `prefork` остаётся стандартным и рекомендуемым режимом для большинства сценариев. \n\nТо есть точнее говорить:\n\n```text\nWorker — отдельный главный Python-процесс.\n\nПри prefork:\ntask выполняется в одном из дочерних Python-процессов worker.\n```\n\n### Зависит от выбранного pool\n\nWorker не обязательно выполняет задачи через дочерние процессы:\n\n```text\nprefork\n    главный процесс + дочерние процессы\n\nthreads\n    один процесс + несколько потоков\n\ngevent / eventlet\n    один процесс + множество greenlets\n\nsolo\n    один процесс, задачи выполняются последовательно\n    в главном потоке worker\n```\n\nCelery официально поддерживает `prefork`, `threads`, `eventlet`, `gevent`, `solo` и пользовательские реализации pool. \n\nНапример:\n\n```bash\ncelery -A app worker --pool=threads --concurrency=10\n```\n\nЗдесь существует отдельный процесс worker, но задачи исполняются его потоками.\n\n```bash\ncelery -A app worker --pool=solo\n```\n\nЗдесь задачи исполняются непосредственно в главном потоке worker.\n\n### Worker — не отдельный процесс для каждой задачи\n\nНеправильное представление:\n\n```text\nПришла задача\n    -> Celery создал новый процесс\n    -> задача завершилась\n    -> процесс уничтожился\n```\n\nОбычная модель `prefork`:\n\n```text\nПри запуске worker\n    -> заранее создаётся пул дочерних процессов\n\nПришла задача\n    -> выбирается свободный процесс пула\n    -> выполняется Task.run()\n    -> процесс остаётся ждать следующую задачу\n```\n\nПроцесс можно периодически заменять настройкой `worker_max_tasks_per_child`, например для ограничения последствий утечек памяти, но это не означает создание нового процесса на каждую задачу.\n\n### Несколько workers\n\nНа одной машине можно запустить несколько независимых worker:\n\n```text\nworker-reports\n    └── собственный пул процессов\n\nworker-emails\n    └── собственный пул процессов\n```\n\n```bash\ncelery -A app worker \\\n    --hostname=reports@%h \\\n    --queues=reports \\\n    --concurrency=4\n\ncelery -A app worker \\\n    --hostname=emails@%h \\\n    --queues=emails \\\n    --concurrency=8\n```\n\nКаждый такой worker — отдельный главный процесс со своим соединением, настройками и пулом выполнения. Celery поддерживает запуск нескольких именованных workers на одной машине.\n\n### Итог\n\nНаиболее точная формулировка:\n\n```text\nCelery worker — это отдельный запущенный экземпляр Celery,\nобычно представленный главным Python-процессом.\n\nПри стандартном prefork этот процесс управляет пулом\nдочерних Python-процессов, в которых непосредственно\nвыполняются задачи.\n```\n\nПоэтому выражение «worker — отдельный Python-процесс» допустимо как упрощение, но **worker не всегда равен процессу, который непосредственно выполняет task**."
