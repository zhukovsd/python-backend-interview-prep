[[questions]]
  id = 21
  question = "Как сделать, чтобы два consumer-а получили одно и то же сообщение?"
  answer = "### Основной способ — отдельная очередь для каждого consumer\n\nЧтобы два consumer’а получили одно и то же сообщение, они должны читать **из разных очередей**, привязанных к одному exchange.\n\n```text\n                         +--> queue.consumer_a --> Consumer A\nPublisher --> Exchange --|\n                         +--> queue.consumer_b --> Consumer B\n```\n\nRabbitMQ создаёт копию сообщения для каждой подходящей очереди. После этого каждая очередь доставляет свою копию независимо. \n\n### Почему нельзя подключить оба consumer к одной очереди\n\nТакая схема:\n\n```text\n                       +--> Consumer A\nPublisher --> Queue ---|\n                       +--> Consumer B\n```\n\nсоздаёт **competing consumers**. RabbitMQ распределяет сообщения между ними:\n\n```text\nM1 -> Consumer A\nM2 -> Consumer B\nM3 -> Consumer A\nM4 -> Consumer B\n```\n\nОба consumer не получают каждое сообщение. Такая модель используется для горизонтального масштабирования обработчиков одной задачи. \n\n### Вариант 1: fanout exchange\n\n`fanout` отправляет сообщение во все привязанные очереди и игнорирует `routing_key`.\n\n```text\n                         +--> notification.queue\nevents.fanout exchange --|\n                         +--> analytics.queue\n```\n\nProducer:\n\n```python\nchannel.basic_publish(\n    exchange=\"events.fanout\",\n    routing_key=\"\",\n    body=message,\n)\n```\n\nНастройка очередей:\n\n```python\nchannel.exchange_declare(\n    exchange=\"events.fanout\",\n    exchange_type=\"fanout\",\n    durable=True,\n)\n\nchannel.queue_declare(\n    queue=\"notification.queue\",\n    durable=True,\n)\n\nchannel.queue_declare(\n    queue=\"analytics.queue\",\n    durable=True,\n)\n\nchannel.queue_bind(\n    exchange=\"events.fanout\",\n    queue=\"notification.queue\",\n)\n\nchannel.queue_bind(\n    exchange=\"events.fanout\",\n    queue=\"analytics.queue\",\n)\n```\n\nТеперь одно опубликованное сообщение попадёт в обе очереди:\n\n```text\nnotification.queue -> Consumer A\nanalytics.queue    -> Consumer B\n```\n\nЭто классический паттерн Publish/Subscribe. \n\n### Вариант 2: topic exchange\n\nЕсли consumer’ам нужны не все сообщения, а только определённые типы событий, используют `topic`.\n\n```text\nExchange: domain.events\n\npayment.*       -> accounting.queue\npayment.#       -> audit.queue\n*.completed     -> notification.queue\n```\n\nProducer публикует:\n\n```python\nchannel.basic_publish(\n    exchange=\"domain.events\",\n    routing_key=\"payment.completed\",\n    body=message,\n)\n```\n\nСообщение попадёт во все очереди, binding которых совпал с `payment.completed`.\n\n```text\npayment.completed\n    |\n    +--> accounting.queue\n    +--> audit.queue\n    +--> notification.queue\n```\n\nTopic exchange доставляет сообщение всем подходящим очередям, а не только первой найденной. \n\n### Вариант 3: direct exchange\n\nДля точного совпадения используют `direct exchange`:\n\n```text\nExchange: payments.direct\n\npayment.completed -> accounting.queue\npayment.completed -> notification.queue\n```\n\nОбе очереди имеют одинаковый binding key:\n\n```python\nchannel.queue_bind(\n    exchange=\"payments.direct\",\n    queue=\"accounting.queue\",\n    routing_key=\"payment.completed\",\n)\n\nchannel.queue_bind(\n    exchange=\"payments.direct\",\n    queue=\"notification.queue\",\n    routing_key=\"payment.completed\",\n)\n```\n\nПубликация:\n\n```python\nchannel.basic_publish(\n    exchange=\"payments.direct\",\n    routing_key=\"payment.completed\",\n    body=message,\n)\n```\n\nОбе очереди получат копию.\n\n### Подтверждения выполняются независимо\n\nКаждый consumer подтверждает собственную копию сообщения:\n\n```text\nConsumer A обработал -> ack для queue.consumer_a\nConsumer B обработал -> ack для queue.consumer_b\n```\n\nНапример:\n\n```text\nConsumer A -> ACK\nConsumer B -> упал до ACK\n```\n\nРезультат:\n\n```text\nqueue.consumer_a:\n    сообщение удалено\n\nqueue.consumer_b:\n    сообщение возвращено в очередь\n    и будет доставлено повторно\n```\n\nОшибка одного consumer не влияет на сообщение в другой очереди.\n\n### Постоянные и временные подписчики\n\n#### Consumer должен получить сообщение даже после перезапуска\n\nНужна отдельная постоянная очередь:\n\n```python\nchannel.queue_declare(\n    queue=\"analytics.queue\",\n    durable=True,\n)\n```\n\nСообщения смогут накапливаться, пока consumer отключён. Для сохранения сообщений при перезапуске брокера publisher также должен публиковать persistent-сообщения, а очередь должна быть durable.\n\n#### Сообщения нужны только пока consumer подключён\n\nМожно создать временную эксклюзивную очередь:\n\n```python\nresult = channel.queue_declare(\n    queue=\"\",\n    exclusive=True,\n)\n\nqueue_name = result.method.queue\n\nchannel.queue_bind(\n    exchange=\"events.fanout\",\n    queue=queue_name,\n)\n```\n\nRabbitMQ назначит случайное имя, а очередь будет удалена после закрытия соединения. Сообщения, опубликованные до создания и привязки этой очереди, consumer не получит. \n\n### Важное различие\n\nЕсли это две реплики одного сервиса:\n\n```text\nEmail Worker 1\nEmail Worker 2\n```\n\nи письмо должен отправить только один worker, нужна **одна общая очередь**:\n\n```text\nemail.queue\n    |\n    +--> Worker 1\n    +--> Worker 2\n```\n\nЕсли это два независимых сервиса:\n\n```text\nNotification Service\nAnalytics Service\n```\n\nи оба должны обработать событие, нужны **две разные очереди**:\n\n```text\npayment.completed\n    |\n    +--> notification.queue\n    +--> analytics.queue\n```\n\n### Итог\n\n```text\nОдна очередь + два consumer\n    = сообщение получает один из consumer’ов.\n\nДве очереди + один exchange\n    = каждый consumer получает свою копию сообщения.\n```\n\nНаиболее типичная схема:\n\n```text\nPublisher\n    |\n    v\nTopic/Fanout Exchange\n    |\n    +--> service_a.queue --> Consumer A\n    |\n    +--> service_b.queue --> Consumer B\n```"
  popularity = 2.63

[[questions]]
  id = 22
  question = "Что будет, если не удалось отправить сообщение в RabbitMQ?"
  answer = "### Что значит «не удалось отправить»\n\nОтправка сообщения в RabbitMQ проходит несколько этапов:\n\n```text\nПриложение\n    |\n    | basic.publish\n    v\nRabbitMQ node\n    |\n    v\nExchange\n    |\n    | routing\n    v\nQueue\n    |\n    | сохранение / репликация\n    v\nPublisher confirm\n```\n\nОшибка может произойти на любом этапе. Последствия зависят от того, включены ли:\n\n- `publisher confirms`;\n    \n- флаг `mandatory`;\n    \n- persistent-сообщения;\n    \n- durable или quorum queue;\n    \n- повторные попытки публикации;\n    \n- transactional outbox.\n    \n\n### 1. Соединение с RabbitMQ отсутствует\n\nНапример:\n\n- RabbitMQ не запущен;\n    \n- DNS не разрешился;\n    \n- сеть недоступна;\n    \n- TCP-соединение разорвано;\n    \n- закрыт AMQP-канал;\n    \n- publisher не прошёл аутентификацию.\n    \n\n```text\nApplication --X--> RabbitMQ\n```\n\nВ этом случае клиентская библиотека обычно возвращает исключение. Сообщение не будет автоматически отправлено после восстановления соединения, если приложение само не реализовало буферизацию или повторную публикацию. RabbitMQ прямо отмечает, что публикации во время недоступного соединения не сохраняются клиентом для последующей доставки.\n\nПример обработки:\n\n```python\ntry:\n    await publisher.publish(message)\nexcept ConnectionError:\n    logger.exception(\"RabbitMQ is unavailable\")\n    raise\n```\n\nОдного перехвата ошибки недостаточно: сообщение нужно сохранить для последующей повторной отправки либо считать всю бизнес-операцию неуспешной.\n\n### 2. Метод публикации завершился без ошибки, но confirms не используются\n\nОбычный вызов:\n\n```python\nchannel.basic_publish(\n    exchange=\"events\",\n    routing_key=\"payment.completed\",\n    body=body,\n)\n```\n\nможет означать только то, что клиент передал данные в сетевой буфер. Это не доказывает, что RabbitMQ:\n\n- получил сообщение;\n    \n- успешно обработал его;\n    \n- направил в очередь;\n    \n- сохранил на диске;\n    \n- реплицировал.\n    \n\nДля подтверждения принятия сообщения брокером используют **publisher confirms**. Они включаются на уровне AMQP-канала. \n\n```text\nPublisher -- message --> RabbitMQ\nPublisher <-- confirm -- RabbitMQ\n```\n\nБез confirms при сетевом сбое publisher может считать отправку успешной, хотя сообщение фактически было потеряно.\n\n### 3. RabbitMQ прислал publisher `ack`\n\nPublisher confirm `ack` означает, что RabbitMQ принял ответственность за опубликованное сообщение в соответствии с типом очереди и условиями публикации. Это не то же самое, что consumer acknowledgement: publisher confirm относится к публикации, а consumer `ack` — к обработке сообщения.\n\n```text\nProducer -- publish --> RabbitMQ\nProducer <-- ack ----- RabbitMQ\n```\n\nПосле получения confirm publisher обычно удаляет сообщение из своего локального списка неподтверждённых публикаций.\n\n### 4. RabbitMQ прислал publisher `nack`\n\n`basic.nack` со стороны RabbitMQ означает, что брокер не смог принять ответственность за сообщение.\n\nЭто может произойти, например, при внутренних проблемах брокера, потере лидера или невозможности безопасно сохранить сообщение. При сетевых разделениях confirms могут задерживаться или возвращаться как `nack`.\n\n```text\nPublisher -- message --> RabbitMQ\nPublisher <-- nack ---- RabbitMQ\n```\n\nТакое сообщение нужно считать неотправленным и обычно публиковать повторно:\n\n```python\ntry:\n    await publish_with_confirm(message)\nexcept PublishNackError:\n    await schedule_retry(message)\n```\n\nПовторная публикация может привести к дубликату, поэтому сообщение должно иметь стабильный `message_id`, а consumers должны быть идемпотентными.\n\n### 5. Confirm не пришёл из-за timeout\n\nВозможна неопределённая ситуация:\n\n```text\n1. Publisher отправил сообщение.\n2. RabbitMQ принял и сохранил его.\n3. Confirm потерялся из-за разрыва соединения.\n4. Publisher не знает результат публикации.\n```\n\n```text\nPublisher -- message --> RabbitMQ\nPublisher <--X-- ack\n```\n\nPublisher не может достоверно определить, было сообщение принято или нет. Поэтому он обычно повторяет публикацию, принимая риск дубликата.\n\n```text\nИсходное сообщение принято RabbitMQ\n+\nPublisher отправил его повторно\n=\nConsumer может получить два экземпляра\n```\n\nНадёжная публикация обычно обеспечивает **at least once**, а не автоматическое exactly once. Клиент должен отслеживать неподтверждённые публикации и повторно отправлять их после восстановления соединения. \n\n### 6. Exchange существует, но сообщение не попало ни в одну очередь\n\nПредположим:\n\n```text\nexchange: payments\nrouting_key: payment.refunded\n\nbindings:\n    payment.completed -> completed.queue\n    payment.failed    -> failed.queue\n```\n\nДля `payment.refunded` подходящего binding нет. Сообщение становится **unroutable**.\n\n#### Без `mandatory=true`\n\nRabbitMQ может отбросить сообщение:\n\n```text\nPublisher -> Exchange -> нет подходящей очереди -> сообщение отброшено\n```\n\n#### С `mandatory=true`\n\nRabbitMQ возвращает сообщение publisher’у через `basic.return`:\n\n```python\nchannel.basic_publish(\n    exchange=\"payments\",\n    routing_key=\"payment.refunded\",\n    body=body,\n    mandatory=True,\n)\n```\n\n```text\nPublisher -- publish --------> Exchange\nPublisher <-- basic.return --- Exchange\n```\n\nRabbitMQ возвращает mandatory-сообщение, если оно не смогло быть направлено ни в одну очередь. \n\n### Важная особенность confirms\n\nUnroutable-сообщение может получить publisher confirm `ack`, потому что broker успешно обработал публикацию и установил, что подходящих очередей нет.\n\nПри `mandatory=true` последовательность будет такой:\n\n```text\n1. basic.return\n2. basic.ack\n```\n\nСледовательно:\n\n```text\npublisher confirm ack\n    ≠\nсообщение гарантированно попало в очередь\n```\n\nДля проверки обеих сторон нужно сочетать:\n\n```text\npublisher confirms\n+\nmandatory=true и обработчик basic.return\n```\n\nPublisher confirms отвечают за принятие публикации брокером, а `mandatory` — за обнаружение отсутствия маршрута в очередь.\n\n### 7. Можно использовать Alternate Exchange\n\nВместо возврата или удаления unroutable-сообщений exchange можно настроить с alternate exchange:\n\n```text\nmain.exchange\n    |\n    | нет подходящего binding\n    v\nalternate.exchange\n    |\n    v\nunrouted.queue\n```\n\nЭто позволяет собирать сообщения с неверными routing keys или отсутствующими bindings в отдельной очереди. Сообщение, направленное через alternate exchange, считается маршрутизированным и не возвращается publisher’у по `mandatory`. \n\n### 8. Exchange не существует\n\nЕсли publisher публикует сообщение в несуществующий exchange, RabbitMQ закрывает AMQP-канал с протокольной ошибкой.\n\n```text\nbasic.publish\n    exchange = unknown.exchange\n        |\n        v\nchannel closed\n```\n\nСообщение не будет доставлено. Publisher должен:\n\n1. обработать закрытие канала;\n    \n2. восстановить topology;\n    \n3. открыть новый channel;\n    \n4. повторить публикацию при необходимости.\n    \n\nПоэтому exchanges, queues и bindings обычно объявляются при запуске приложения или управляются централизованно через инфраструктурную конфигурацию.\n\n### 9. Сообщение направлено в очередь, но брокер перезапустился\n\nЧтобы сообщение могло пережить перезапуск брокера, обычно нужны одновременно:\n\n```text\ndurable queue\n+\npersistent message\n```\n\n```python\nproperties = pika.BasicProperties(\n    delivery_mode=2,\n)\n```\n\nDurable-очередь восстанавливается после перезапуска, а сообщение должно быть отмечено как persistent. RabbitMQ рекомендует сочетать durable queues и persistent messages для сохранения данных. \n\nНо это не заменяет publisher confirms: без confirm publisher не знает, успел ли RabbitMQ сохранить сообщение.\n\n### 10. Quorum queue и надёжность confirm\n\nДля quorum queue RabbitMQ отправляет publisher confirm после того, как сообщение успешно реплицировано на большинство реплик и считается безопасным в рамках алгоритма quorum queue.\n\n```text\nPublisher\n    |\n    v\nLeader\n    |\n    +--> Replica 2\n    +--> Replica 3\n          |\n          v\n       quorum reached\n          |\n          v\n    publisher confirm\n```\n\nЭто обеспечивает более сильные гарантии, чем нереплицированная classic queue. \n\nДля важных бизнес-сообщений обычно используют:\n\n```text\nquorum queue\npersistent message\npublisher confirms\nmanual consumer acknowledgements\n```\n\n### 11. Бизнес-операция прошла, но публикация не удалась\n\nЭто наиболее опасная ситуация.\n\nНапример:\n\n```text\n1. Создали платёж в PostgreSQL.\n2. Транзакция успешно завершилась.\n3. Попытались отправить payment.created.\n4. RabbitMQ оказался недоступен.\n```\n\nРезультат:\n\n```text\nPostgreSQL:\n    payment существует\n\nRabbitMQ:\n    события нет\n\nДругие сервисы:\n    ничего не знают о платеже\n```\n\nПростой retry внутри HTTP-запроса не решает проблему полностью: процесс может упасть после commit БД, но до сохранения информации о необходимости повторной отправки.\n\n### Transactional Outbox\n\nНадёжное решение — сохранять бизнес-изменение и исходящее событие в одной транзакции PostgreSQL:\n\n```text\nBEGIN\n\nINSERT INTO payments (...);\n\nINSERT INTO outbox (\n    message_id,\n    event_type,\n    payload,\n    status\n);\n\nCOMMIT\n```\n\nПосле этого отдельный worker публикует записи из outbox:\n\n```text\nPostgreSQL outbox\n        |\n        v\nPublisher worker\n        |\n        | publisher confirm\n        v\nRabbitMQ\n```\n\nПосле confirm запись отмечается отправленной:\n\n```sql\nUPDATE outbox\nSET status = 'published'\nWHERE message_id = :message_id;\n```\n\nЕсли RabbitMQ недоступен, событие остаётся в outbox и будет отправлено позже:\n\n```text\nRabbitMQ недоступен\n        |\n        v\noutbox сохраняется\n        |\n        v\nследующая попытка публикации\n```\n\nИз-за неопределённого результата публикации outbox-worker всё равно может отправить сообщение повторно. Поэтому consumers должны дедуплицировать сообщения по `message_id`.\n\n### Как правильно повторять публикацию\n\nНе следует выполнять бесконечные немедленные retries:\n\n```python\nwhile True:\n    await publish(message)\n```\n\nЭто создаёт retry storm и усиливает нагрузку на недоступный RabbitMQ.\n\nИспользуют:\n\n```text\nограниченное число быстрых попыток\nexponential backoff\njitter\nлокальный outbox\nalerts\nидемпотентные consumers\n```\n\nПример задержек:\n\n```text\n1-я попытка: сразу\n2-я попытка: через 1 секунду\n3-я попытка: через 2 секунды\n4-я попытка: через 4 секунды\n5-я попытка: через 8 секунд\n```\n\nДля фонового publisher процесс не должен удалять сообщение из собственного надёжного хранилища, пока не получил соответствующий confirm.\n\n### Практическая конфигурация надёжной отправки\n\n```text\n1. Durable или quorum queue.\n2. Persistent messages.\n3. Publisher confirms.\n4. mandatory=true либо alternate exchange.\n5. Обработка basic.return.\n6. Обработка nack и confirm timeout.\n7. Переподключение и повторная публикация.\n8. Стабильный message_id.\n9. Идемпотентные consumers.\n10. Transactional outbox для связи с транзакцией БД.\n```\n\n### Итог\n\n```text\nОшибка до отправки:\n    сообщение не попало в RabbitMQ\n\nPublisher nack:\n    broker не принял ответственность\n    → нужна повторная публикация\n\nConfirm timeout или разрыв соединения:\n    результат неизвестен\n    → повторная публикация возможна с дубликатом\n\nUnroutable без mandatory:\n    сообщение может быть отброшено\n\nUnroutable с mandatory:\n    сообщение возвращается publisher’у\n\nБД закоммичена, RabbitMQ недоступен:\n    возникает проблема dual write\n    → transactional outbox\n```\n\nГлавное правило:\n\n```text\nУспешный вызов basic.publish сам по себе\nне гарантирует доставку сообщения.\n\nДля надёжности нужны publisher confirms,\nконтроль маршрутизации и сохранённый механизм повторной отправки.\n```"
