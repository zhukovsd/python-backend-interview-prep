[[questions]]
  id = 1
  question = "Что такое Celery"
  answer = "### Что такое Celery\n\n**Celery** — это Python-фреймворк для выполнения задач вне основного процесса приложения: в фоне, по расписанию или на отдельных серверах.\n\nПриложение не выполняет тяжёлую операцию непосредственно. Оно отправляет сообщение с заданием в очередь, после чего отдельный процесс Celery Worker получает и выполняет его. Celery называет такую единицу работы `task`. \n\n```text\nКлиент\n   │\n   ▼\nFastAPI / Django\n   │ отправляет задачу\n   ▼\nBroker: Redis / RabbitMQ\n   │\n   ▼\nCelery Worker\n   │ выполняет задачу\n   ▼\nResult Backend — при необходимости\n```\n\n### Пример задачи\n\nПользователь регистрируется, после чего ему нужно отправить письмо.\n\nБез Celery:\n\n```python\n@app.post(\"/register\")\ndef register(data: RegisterData):\n    user = create_user(data)\n\n    send_email(user.email)  # запрос ждёт отправки письма\n\n    return {\"user_id\": user.id}\n```\n\nЕсли почтовый сервер отвечает пять секунд, пользователь будет ждать эти пять секунд.\n\nС Celery:\n\n```python\n@app.post(\"/register\")\ndef register(data: RegisterData):\n    user = create_user(data)\n\n    send_email.delay(user.email)\n\n    return {\"user_id\": user.id}\n```\n\nМетод `.delay()` не отправляет письмо самостоятельно. Он помещает сообщение о задаче в брокер, после чего свободный Worker выполняет её отдельно.\n\n### Основные компоненты\n\n#### 1. Producer\n\nПриложение, которое создаёт задачу:\n\n```python\nsend_email.delay(\"user@example.com\")\n```\n\nProducer может быть:\n\n```text\nFastAPI;\nDjango;\nCLI-команда;\nдругой Worker;\nпериодический планировщик Celery Beat.\n```\n\n#### 2. Broker\n\nBroker хранит и передаёт сообщения с задачами:\n\n```text\nПриложение → Broker → Worker\n```\n\nЧасто используют:\n\n- RabbitMQ;\n    \n- Redis;\n    \n- Amazon SQS.\n    \n\nRabbitMQ является полноценным брокером сообщений; Redis в Celery может использоваться и как broker, и как result backend. \n\nBroker не выполняет задачу. Он только передаёт сообщение Worker-у.\n\nПример содержимого сообщения:\n\n```json\n{\n  \"task\": \"tasks.send_email\",\n  \"args\": [\"user@example.com\"],\n  \"kwargs\": {}\n}\n```\n\n#### 3. Worker\n\nWorker — отдельный процесс, который постоянно получает задачи из очереди и выполняет их:\n\n```bash\ncelery -A tasks worker --loglevel=INFO\n```\n\nМожно запустить несколько Worker-ов:\n\n```text\n                  ┌── Worker 1\nRedis/RabbitMQ ───┼── Worker 2\n                  ├── Worker 3\n                  └── Worker 4\n```\n\nЭто позволяет распределять задачи между несколькими процессами или машинами. Celery поддерживает работу с несколькими Worker-ами и горизонтальное масштабирование. \n\n#### 4. Result Backend\n\nResult Backend хранит состояние и результат задачи:\n\n```text\nPENDING\nSTARTED\nSUCCESS\nFAILURE\nRETRY\nREVOKED\n```\n\nНапример:\n\n```python\nresult = add.delay(10, 20)\n\nprint(result.id)\nprint(result.status)\nprint(result.get())\n```\n\nВ качестве backend могут использоваться Redis, SQL-база, RPC и другие поддерживаемые хранилища. Result Backend необязателен: если результат выполнения не нужен, его можно не настраивать. \n\n### Минимальный пример\n\nУстановка:\n\n```bash\npip install celery redis\n```\n\nФайл `tasks.py`:\n\n```python\nfrom celery import Celery\n\napp = Celery(\n    \"tasks\",\n    broker=\"redis://localhost:6379/0\",\n    backend=\"redis://localhost:6379/1\",\n)\n\n\n@app.task\ndef add(left: int, right: int) -> int:\n    return left + right\n```\n\nЗапуск Worker:\n\n```bash\ncelery -A tasks worker --loglevel=INFO\n```\n\nОтправка задачи:\n\n```python\nfrom tasks import add\n\nresult = add.delay(10, 20)\n\nprint(result.id)\n```\n\nПроисходит следующее:\n\n```text\n1. add.delay(10, 20) создаёт сообщение\n2. Сообщение попадает в Redis\n3. Worker получает сообщение\n4. Worker вызывает add(10, 20)\n5. Результат 30 сохраняется в Redis backend\n```\n\nПолучение результата:\n\n```python\nprint(result.get(timeout=10))\n```\n\nРезультат:\n\n```text\n30\n```\n\nВ веб-приложении обычно не следует вызывать `result.get()` прямо внутри HTTP-запроса: это снова заставит запрос ждать завершения фоновой задачи.\n\n### Что обычно выполняют через Celery\n\nТипичные задачи:\n\n```text\nотправка электронной почты;\nобработка загруженных файлов;\nгенерация PDF и отчётов;\nизменение размера изображений;\nимпорт и экспорт данных;\nобращения к медленным внешним API;\nотправка уведомлений;\nпериодическая очистка данных;\nмассовая обработка записей;\nповторные попытки после временных ошибок.\n```\n\nНапример:\n\n```python\n@app.task\ndef generate_report(report_id: int) -> None:\n    report = load_report(report_id)\n    file_path = create_pdf(report)\n    upload_to_storage(file_path)\n```\n\nHTTP-запрос только запускает работу:\n\n```python\ntask = generate_report.delay(report_id)\n\nreturn {\n    \"task_id\": task.id,\n    \"status\": \"processing\",\n}\n```\n\n### Повторные попытки\n\nCelery позволяет повторить задачу после временной ошибки:\n\n```python\nfrom celery import Celery\n\napp = Celery(\"tasks\")\n\n\n@app.task(\n    autoretry_for=(ConnectionError,),\n    retry_backoff=True,\n    retry_kwargs={\"max_retries\": 5},\n)\ndef call_external_api() -> None:\n    send_request()\n```\n\nНапример, если внешний сервис временно недоступен, Celery повторит операцию позднее. Celery поддерживает автоматический retry через параметры декоратора задачи. \n\nЗадачи с повторными попытками желательно делать идемпотентными:\n\n```text\nодин запуск     → корректный результат;\nповторный запуск → тот же корректный результат,\n                    без двойного списания или записи.\n```\n\nНапример, вместо безусловного создания платежа:\n\n```python\ncreate_payment(order_id)\n```\n\nнужно проверять уникальный идентификатор операции:\n\n```python\nif payment_exists(idempotency_key):\n    return\n\ncreate_payment(\n    order_id=order_id,\n    idempotency_key=idempotency_key,\n)\n```\n\nЭто важно, поскольку сочетание повторных попыток, позднего подтверждения сообщения и аварий Worker-а может привести к повторной обработке задачи. Документация Celery отдельно связывает `acks_late` с требованием идемпотентности задачи. \n\n### Периодические задачи и Celery Beat\n\nCelery Beat — планировщик, который отправляет задачи по расписанию:\n\n```text\nCelery Beat → Broker → Celery Worker\n```\n\nСам Beat не выполняет задачу. Её выполняет Worker.\n\nПример:\n\n```python\napp.conf.beat_schedule = {\n    \"clear-expired-tokens\": {\n        \"task\": \"tasks.clear_expired_tokens\",\n        \"schedule\": 3600.0,\n    },\n}\n```\n\nЗадача будет отправляться каждый час.\n\nЗапуск:\n\n```bash\ncelery -A tasks beat --loglevel=INFO\n```\n\nCelery Beat поддерживает интервальные и периодические расписания; в каждый момент обычно должен работать один экземпляр планировщика для конкретного расписания, иначе задачи могут создаваться повторно. \n\n### Несколько очередей\n\nРазные типы задач можно разделить:\n\n```text\nemails  → Worker для писем\nreports → Worker для отчётов\nimages  → Worker для изображений\n```\n\nНапример:\n\n```python\napp.conf.task_routes = {\n    \"tasks.send_email\": {\"queue\": \"emails\"},\n    \"tasks.generate_report\": {\"queue\": \"reports\"},\n}\n```\n\nЗапуск отдельных Worker-ов:\n\n```bash\ncelery -A tasks worker -Q emails --loglevel=INFO\n```\n\n```bash\ncelery -A tasks worker -Q reports --loglevel=INFO\n```\n\nЭто позволяет независимо масштабировать разные типы работы.\n\n### Celery не создаёт отдельный поток в FastAPI\n\nВажно различать:\n\n```text\nasync def\n```\n\nи:\n\n```text\nCelery task\n```\n\n`async def` позволяет эффективно ожидать I/O внутри процесса приложения.\n\nCelery передаёт работу другому процессу, Worker-у или серверу:\n\n```text\nFastAPI process\n      │\n      ▼\nBroker\n      │\n      ▼\nCelery worker process\n```\n\nПоэтому Celery применяют, когда работа должна:\n\n- продолжаться после завершения HTTP-запроса;\n    \n- переживать перезапуск веб-приложения при корректно настроенном брокере;\n    \n- выполняться отдельными Worker-ами;\n    \n- распределяться между машинами;\n    \n- повторяться после ошибки;\n    \n- запускаться по расписанию.\n    \n\n### Недостатки Celery\n\nCelery добавляет инфраструктурную сложность:\n\n```text\nнужен брокер;\nнужно запускать Worker-ы;\nнужно контролировать очереди;\nнужны мониторинг и логирование;\nнужно обрабатывать повторные задачи;\nнеобходимо следить за зависшими задачами;\nнужно проектировать идемпотентность;\nнужно управлять результатами и сроком их хранения.\n```\n\nПоэтому Celery не требуется для любой маленькой фоновой операции.\n\n### Итог\n\n```text\nCelery — система распределённого выполнения фоновых задач.\n\nПриложение создаёт задачу.\nBroker передаёт её.\nWorker выполняет.\nResult Backend при необходимости сохраняет результат.\nCelery Beat создаёт задачи по расписанию.\n```\n\nОсновная схема:\n\n```text\nFastAPI / Django\n        │\n        │ task.delay(...)\n        ▼\nRedis / RabbitMQ\n        │\n        ▼\nCelery Worker\n        │\n        ├── отправляет письмо\n        ├── создаёт отчёт\n        ├── обрабатывает файл\n        └── вызывает внешний API\n```"
