[[questions]]
  id = 32
  question = "HTTP REST vs Брокеры сообщений"
  answer = "### Главное различие\n\nHTTP/REST и брокеры сообщений решают разные задачи:\n\n```text\nHTTP/REST:\n«Выполни операцию сейчас и верни мне результат».\n\nMessage broker:\n«Прими сообщение и доставь его обработчику, когда тот сможет его обработать».\n```\n\nHTTP — протокол взаимодействия клиента и сервера по модели запрос–ответ. REST — архитектурный стиль построения API поверх HTTP, где взаимодействие обычно организовано вокруг ресурсов, URI, HTTP-методов и представлений ресурсов. HTTP является stateless-протоколом: каждый запрос должен быть понятен независимо от предыдущих соединений и сообщений.\n\nБрокер принимает сообщения от producers, маршрутизирует их, сохраняет в очередях или журнале и доставляет consumers. Например, RabbitMQ может хранить сообщение до появления доступного consumer, а Kafka хранит события в partitioned log независимо от факта их чтения. \n\n### Общая схема\n\n#### HTTP\n\n```text\nService A\n    |\n    | HTTP request\n    v\nService B\n    |\n    | HTTP response\n    v\nService A\n```\n\nService A обычно ожидает:\n\n- статус ответа;\n    \n- данные;\n    \n- ошибку;\n    \n- timeout.\n    \n\n#### Брокер\n\n```text\nService A\n    |\n    | publish\n    v\nMessage broker\n    |\n    | delivery\n    v\nService B\n```\n\nProducer обычно получает подтверждение того, что брокер принял сообщение, но не результат бизнес-обработки consumer’ом.\n\n### Сравнение\n\n|Характеристика|HTTP/REST|Брокер сообщений|\n|---|---|---|\n|Модель|Request/response|Publish/consume|\n|Типичное выполнение|Синхронное|Асинхронное|\n|Нужен немедленный ответ|Да|Обычно нет|\n|Доступность получателя|Нужен во время запроса|Может быть временно недоступен|\n|Хранение запроса|Обычно отсутствует|Сообщение может храниться|\n|Повторная доставка|Реализует клиент|Часто встроена|\n|Несколько получателей|Нужны отдельные вызовы|Pub/Sub и несколько очередей/groups|\n|Backpressure|Ограничения, 429/503, connection pools|Очередь накапливает сообщения|\n|Порядок|Определяется приложением|Возможен в очереди или partition|\n|Retry|Клиент или proxy|Broker/client/consumer policy|\n|Получение результата|Непосредственно в response|Отдельное хранилище, событие или callback|\n|Инфраструктура|Проще|Сложнее в эксплуатации|\n\n### Синхронность и асинхронность\n\nПри обычном HTTP-вызове вызывающий сервис ждёт ответ:\n\n```python\nresponse = await http_client.post(\n    \"http://payment-service/payments\",\n    json={\"order_id\": 451},\n    timeout=5,\n)\n\nresponse.raise_for_status()\n```\n\nПока Payment Service не ответит, вызывающий код не знает результат операции.\n\n```text\nOrder Service\n    |\n    | ждёт\n    v\nPayment Service\n    |\n    | 201 / 409 / 500\n    v\nOrder Service продолжает работу\n```\n\nЧерез брокер producer публикует команду:\n\n```json\n{\n  \"message_id\": \"cmd-451\",\n  \"message_type\": \"payment.process\",\n  \"order_id\": 451\n}\n```\n\n```text\nOrder Service\n    |\n    | publish\n    v\nRabbitMQ\n    |\n    v\nOrder Service продолжает работу\n\nПозже:\nRabbitMQ -> Payment Consumer\n```\n\nЗавершение `publish` не означает, что платёж уже выполнен. Publisher confirm в RabbitMQ означает, что брокер принял ответственность за сообщение, а consumer acknowledgement означает, что consumer получил или обработал доставку. Это независимые подтверждения. \n\n### Связанность по времени\n\nHTTP создаёт временную связанность:\n\n```text\nService A работает\n+\nService B должен быть доступен сейчас\n+\nсеть между ними должна работать\n```\n\nЕсли Service B недоступен:\n\n```text\nService A -> timeout / 502 / 503\n```\n\nПри временной перегрузке HTTP-сервис может вернуть `503 Service Unavailable` и указать `Retry-After`. \n\nБрокер уменьшает временную связанность:\n\n```text\nService A публикует сообщение\nService B временно выключен\nСообщение остаётся в очереди\nService B запускается\nСообщение доставляется\n```\n\nRabbitMQ может сохранить корректно маршрутизированное сообщение в очереди до его потребления. Для важных сообщений дополнительно нужны соответствующая durability, persistent messages и подтверждение публикации. \n\nНо брокер не устраняет все зависимости. Producer всё равно зависит от доступности самого брокера либо должен использовать outbox для сохранения сообщения в локальной БД.\n\n### Ошибки и повторы\n\n#### HTTP\n\nКлиент может получить явный результат:\n\n```http\nHTTP/1.1 409 Conflict\n```\n\n```json\n{\n  \"code\": \"INSUFFICIENT_BALANCE\"\n}\n```\n\nНо при timeout возникает неопределённость:\n\n```text\n1. Сервер выполнил операцию.\n2. Ответ потерялся.\n3. Клиент получил timeout.\n4. Клиент повторил запрос.\n```\n\nПоэтому изменяющим операциям часто нужен `Idempotency-Key` или другой механизм дедупликации:\n\n```http\nPOST /payments\nIdempotency-Key: order-451-payment\n```\n\n#### Брокер\n\nПри использовании acknowledgements обычно получается `at least once`:\n\n```text\nСообщение будет обработано один или более раз.\n```\n\nНапример:\n\n```text\n1. Consumer изменил PostgreSQL.\n2. Consumer упал до ACK.\n3. Broker повторно доставил сообщение.\n4. Бизнес-операция может выполниться повторно.\n```\n\nRabbitMQ прямо предупреждает о повторных доставках при сетевых и consumer-сбоях и рекомендует идемпотентную обработку. Kafka также использует at-least-once по умолчанию: consumer может обработать запись, упасть до сохранения offset и получить её повторно. \n\nСледовательно, идемпотентность нужна в обоих вариантах:\n\n```sql\nCREATE TABLE processed_messages (\n    consumer_name TEXT NOT NULL,\n    message_id UUID NOT NULL,\n    processed_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),\n\n    PRIMARY KEY (consumer_name, message_id)\n);\n```\n\n### Получение результата\n\nВ HTTP результат естественно возвращается в response:\n\n```json\n{\n  \"payment_id\": 842,\n  \"status\": \"completed\"\n}\n```\n\nЧерез брокер результат обычно получают другим способом:\n\n```text\n1. Consumer обновляет статус в БД.\n2. Клиент запрашивает GET /jobs/{id}.\n\nили\n\n1. Consumer публикует payment.completed.\n2. Другой сервис подписывается на событие.\n\nили\n\n1. Consumer вызывает webhook.\n```\n\nДля запуска асинхронной обработки через HTTP обычно возвращают:\n\n```http\nHTTP/1.1 202 Accepted\nLocation: /jobs/job-842\n```\n\n```json\n{\n  \"job_id\": \"job-842\",\n  \"status\": \"queued\"\n}\n```\n\n`202 Accepted` означает, что запрос принят, но обработка ещё не завершена и может в дальнейшем не состояться. HTTP сам не отправляет клиенту новый status code после завершения фоновой операции, поэтому нужен polling, webhook, WebSocket или другой механизм.\n\n### Один или несколько получателей\n\nПри HTTP Service A должен явно вызвать каждого получателя:\n\n```text\nOrder Service\n    |\n    +--> Notification Service\n    +--> Analytics Service\n    +--> Loyalty Service\n```\n\nЭто увеличивает связанность Order Service с количеством downstream-сервисов.\n\nПри использовании брокера producer публикует одно событие:\n\n```text\norder.completed\n       |\n       v\nExchange / Topic\n       |\n       +--> notification.queue\n       +--> analytics.queue\n       +--> loyalty.queue\n```\n\nRabbitMQ маршрутизирует одно сообщение в несколько очередей. Каждая очередь получает собственную копию, поэтому её consumers подтверждают обработку независимо.\n\nВ Kafka разные consumer groups независимо читают один topic. Внутри каждой consumer group partition в конкретный момент обрабатывается одним consumer, а позиция чтения хранится как offset.\n\n### Нагрузка и backpressure\n\nПри HTTP резкий рост запросов сразу передаётся downstream-сервису:\n\n```text\nAPI получает 10 000 запросов\n        |\n        v\nPayment Service получает 10 000 вызовов\n```\n\nЗащита строится через:\n\n```text\nrate limiting\ntimeouts\nconcurrency limits\ncircuit breaker\nload shedding\nHTTP 429 / 503\n```\n\nБрокер способен сгладить кратковременный всплеск:\n\n```text\nProducer: 1000 сообщений/с\nConsumer: 500 сообщений/с\nОчередь растёт на 500 сообщений/с\n```\n\nНо брокер не создаёт дополнительную вычислительную мощность. Если producer постоянно быстрее consumers, очередь или consumer lag будут бесконечно расти:\n\n```text\npublish rate > processing rate\n    → backlog\n    → рост задержки\n    → исчерпание диска или retention\n```\n\nТо есть очередь помогает пережить краткосрочную перегрузку, но не решает постоянный недостаток производительности.\n\n### Хранение и повторное чтение\n\nОбычный HTTP-запрос после обработки не становится долговечным журналом событий. Для повторного выполнения данные нужно отдельно сохранять.\n\nRabbitMQ queue обычно ориентирована на доставку и удаление сообщения после подтверждения consumer’ом. Consumer acknowledgements позволяют брокеру удалить сообщение только после подтверждения обработки.\n\nKafka ориентирована на сохранение событий в topics. События можно читать, хранить и обрабатывать повторно; consumer group хранит offset отдельно для каждой partition. Retention определяет, как долго записи остаются доступными. \n\nПоэтому:\n\n```text\nRabbitMQ:\n    выполнить задачу\n\nKafka:\n    сохранить событие и дать системам читать его независимо\n```\n\n### Когда лучше HTTP/REST\n\nHTTP подходит, когда:\n\n- клиенту немедленно нужен результат;\n    \n- операция короткая;\n    \n- вызывающий сервис должен знать, успешна ли операция;\n    \n- это чтение актуального состояния;\n    \n- взаимодействие естественно выражается через ресурс;\n    \n- временная недоступность получателя должна считаться ошибкой текущей операции.\n    \n\nПримеры:\n\n```text\nGET /users/42\nGET /products?category=books\nPOST /payments/authorize\nPUT /profile\nDELETE /sessions/current\n```\n\nОсобенно естественно HTTP подходит для:\n\n```text\nfrontend -> backend\nmobile client -> API\nвнешний партнёр -> public API\nпростые синхронные межсервисные запросы\n```\n\n### Когда лучше брокер\n\nБрокер подходит, когда:\n\n- результат не нужен немедленно;\n    \n- задача может выполняться долго;\n    \n- получатель может быть временно недоступен;\n    \n- нужно сгладить всплеск нагрузки;\n    \n- нужны retry и DLQ;\n    \n- одно событие должны получить несколько систем;\n    \n- нужна независимая обработка;\n    \n- требуется поток или история событий;\n    \n- вызывающий сервис не должен знать всех подписчиков.\n    \n\nПримеры:\n\n```text\nemail.send\nreport.generate\nimage.resize\nfile.scan\npayment.completed\norder.created\nsearch.reindex\nanalytics.track\n```\n\n### Обычно используются вместе\n\nТипичная архитектура:\n\n```text\nClient\n   |\n   | HTTP\n   v\nBackend API\n   |\n   | сохраняет бизнес-данные\n   | создаёт outbox-запись\n   v\nPostgreSQL\n   |\n   v\nOutbox relay\n   |\n   v\nRabbitMQ / Kafka\n   |\n   +--> Worker\n   +--> Notification Service\n   +--> Analytics Service\n```\n\nКлиент получает быстрый HTTP-ответ:\n\n```http\nHTTP/1.1 202 Accepted\n```\n\n```json\n{\n  \"job_id\": \"job-842\",\n  \"status\": \"accepted\",\n  \"status_url\": \"/jobs/job-842\"\n}\n```\n\nА фактическая обработка выполняется асинхронно.\n\n### Пример выбора\n\nДопустим, пользователь загружает файл для генерации отчёта.\n\nПлохой синхронный вариант:\n\n```text\nPOST /reports\n    |\n    +--> прочитать миллион строк\n    +--> выполнить запросы\n    +--> создать PDF\n    +--> загрузить в S3\n    +--> ждать 60 секунд\n    +--> вернуть ответ\n```\n\nЛучше:\n\n```text\nPOST /reports\n    |\n    +--> создать job\n    +--> поставить задачу в RabbitMQ\n    +--> вернуть 202\n\nWorker\n    |\n    +--> создать PDF\n    +--> загрузить в S3\n    +--> обновить job.status\n```\n\nНо проверку простого баланса счёта разумнее выполнить через HTTP:\n\n```text\nGET /accounts/42/balance\n```\n\nЗдесь вызывающему коду нужен актуальный ответ непосредственно сейчас.\n\n### Итог\n\n```text\nHTTP/REST:\n    синхронное взаимодействие;\n    запрос и непосредственный ответ;\n    получатель должен быть доступен;\n    хорошо подходит для API и получения текущего состояния.\n\nMessage broker:\n    асинхронное взаимодействие;\n    отправитель и обработчик разделены во времени;\n    сообщение может храниться и доставляться повторно;\n    хорошо подходит для фоновых задач, событий и распределения нагрузки.\n```\n\nОни не являются взаимозаменяемыми конкурентами. Наиболее практичная схема:\n\n```text\nHTTP — внешняя граница и синхронные операции.\n\nRabbitMQ — команды и фоновые задачи.\n\nKafka — потоки и долговременная история событий.\n```"
