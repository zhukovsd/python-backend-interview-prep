  id = 14
  question = "RabbitMQ vs Kafka"
  answer = "### Главное различие\n\n**RabbitMQ — брокер сообщений**, ориентированный на доставку конкретного сообщения конкретному обработчику.\n\n**Kafka — распределённый журнал событий**, ориентированный на долговременное хранение потока событий, повторное чтение и обработку больших объёмов данных.\n\n```text\nRabbitMQ:\n\nProducer -> Exchange -> Queue -> Consumer -> ACK -> сообщение удалено\n\n\nKafka:\n\nProducer -> Topic -> Partitioned Log\n                         |\n                         +-> Consumer Group A\n                         +-> Consumer Group B\n                         +-> повторное чтение с нужного offset\n```\n\n### Сравнение\n\n|Характеристика|RabbitMQ|Kafka|\n|---|---|---|\n|Основная модель|Очередь сообщений|Распределённый журнал событий|\n|Получение|Broker отправляет сообщения consumer’у|Consumer сам запрашивает записи|\n|После обработки|Обычно удаляется после `ack`|Хранится до истечения retention|\n|Повторное чтение|Для обычной очереди не предусмотрено|Штатная операция через offsets|\n|Маршрутизация|Exchanges, routing keys, bindings, headers|Topic, partition, record key|\n|Масштабирование consumers|Конкурирующие consumers одной очереди|Consumer groups и partitions|\n|Порядок|Очередь FIFO, но consumers и redelivery могут его нарушить|Гарантирован внутри partition|\n|Подтверждение|`ack`, `nack`, `reject`, `requeue` для сообщения|Commit offset для partition|\n|Типичные задачи|Фоновые задачи, команды, RPC, уведомления|Event streaming, CDC, аналитика, журнал событий|\n|Приоритеты сообщений|Поддерживаются priority queues|Нативного приоритета записей нет|\n|Replay|Только через дополнительную архитектуру или RabbitMQ Streams|Встроен в основную модель|\n\nОбычные RabbitMQ queues используют деструктивное потребление: после успешного подтверждения сообщение удаляется. Kafka сохраняет записи независимо от того, были ли они прочитаны, пока их не удалит политика retention или compaction. \n\n---\n\n### RabbitMQ: сообщение должно быть выполнено\n\nТипичная задача:\n\n```json\n{\n  \"task_id\": \"task-125\",\n  \"type\": \"generate_report\",\n  \"user_id\": 42\n}\n```\n\nСхема обработки:\n\n```text\nProducer\n   |\n   v\nExchange\n   |\n   v\nreport.generate.queue\n   |\n   +--> Worker 1\n   +--> Worker 2\n   +--> Worker 3\n```\n\nRabbitMQ выбирает одного свободного consumer’а. После успешной обработки consumer отправляет:\n\n```text\nbasic.ack\n```\n\nПри временной ошибке:\n\n```text\nbasic.nack(requeue=true)\n```\n\nПри постоянной ошибке:\n\n```text\nbasic.nack(requeue=false)\n        |\n        v\nDead Letter Exchange\n```\n\nRabbitMQ хранит состояние отдельного сообщения: готово ли оно к доставке или уже доставлено, но ещё не подтверждено. Manual acknowledgement и prefetch позволяют контролировать количество одновременно обрабатываемых сообщений. \n\nRabbitMQ особенно удобен для:\n\n- Celery tasks;\n    \n- отправки email, SMS и push;\n    \n- обработки файлов;\n    \n- генерации отчётов;\n    \n- обработки платежной команды;\n    \n- retry и DLQ;\n    \n- RPC request/reply;\n    \n- сложной маршрутизации по routing key;\n    \n- задач с разными приоритетами.\n    \n\n---\n\n### Kafka: событие должно быть сохранено\n\nТипичное событие:\n\n```json\n{\n  \"event_id\": \"evt-125\",\n  \"event_type\": \"payment.completed\",\n  \"payment_id\": 451,\n  \"user_id\": 42,\n  \"amount\": \"35.00\",\n  \"currency\": \"AZN\"\n}\n```\n\nСобытие записывается в topic:\n\n```text\npayments\n├── partition 0: [0][1][2][3][4]\n├── partition 1: [0][1][2][3]\n└── partition 2: [0][1][2][3][4][5]\n```\n\nКаждая запись имеет `offset`:\n\n```text\npartition: 1\noffset:    1527\n```\n\nConsumer читает записи и сохраняет позицию:\n\n```text\ncommitted offset = 1528\n```\n\nKafka не удаляет запись после commit offset. Commit означает только:\n\n```text\nConsumer group обработала записи до этой позиции.\n```\n\nДругой consumer group может независимо прочитать те же события:\n\n```text\npayment.completed\n        |\n        +--> analytics-group\n        +--> notifications-group\n        +--> fraud-detection-group\n        +--> accounting-group\n```\n\nKafka хранит потоки событий надёжно и позволяет обрабатывать их как в реальном времени, так и повторно. Consumer сам запрашивает данные у broker, что позволяет эффективно использовать batching и регулировать скорость чтения. \n\nKafka подходит для:\n\n- CDC из PostgreSQL;\n    \n- аудита изменений;\n    \n- аналитики;\n    \n- сбора логов;\n    \n- потоковой обработки;\n    \n- Event Sourcing;\n    \n- построения data pipelines;\n    \n- передачи событий между большим количеством систем;\n    \n- восстановления состояния из истории событий;\n    \n- обработки больших непрерывных потоков данных.\n    \n\n---\n\n### Маршрутизация\n\n#### RabbitMQ\n\nProducer публикует сообщение в exchange:\n\n```text\nExchange: domain.events\nRouting key: payment.completed\n```\n\nBindings определяют очереди:\n\n```text\npayment.*          -> accounting.queue\npayment.completed  -> notifications.queue\n*.failed           -> failures.queue\n```\n\nRabbitMQ предоставляет разные типы exchanges:\n\n```text\ndirect\ntopic\nfanout\nheaders\n```\n\nЭто позволяет гибко направлять сообщения в разные очереди.\n\n#### Kafka\n\nВ Kafka нет аналога RabbitMQ exchange. Основные средства распределения:\n\n```text\ntopic\npartition\nrecord key\nconsumer group\n```\n\nНапример:\n\n```text\ntopic: payment-events\nkey:   payment_id=451\n```\n\nОдинаковый key обычно направляет связанные события в одну partition:\n\n```text\npayment 451 created\npayment 451 authorized\npayment 451 completed\n```\n\nЭто позволяет сохранить их порядок внутри partition. Kafka гарантирует порядок событий в рамках конкретной topic-partition, но не глобально между всеми partitions. \n\n---\n\n### Масштабирование consumers\n\n#### RabbitMQ\n\nК одной очереди можно подключить несколько competing consumers:\n\n```text\nQueue\n  |\n  +--> Consumer A\n  +--> Consumer B\n  +--> Consumer C\n```\n\nКаждое сообщение получает только один consumer.\n\nУвеличение количества workers обычно увеличивает параллельность обработки, пока ограничением не станут сама очередь, broker или внешние ресурсы.\n\n#### Kafka\n\nConsumers объединяются в consumer group:\n\n```text\nTopic: 4 partitions\nConsumer group: payments\n\nPartition 0 -> Consumer A\nPartition 1 -> Consumer A\nPartition 2 -> Consumer B\nPartition 3 -> Consumer B\n```\n\nВнутри одной группы каждая partition в конкретный момент назначена одному consumer.\n\nЕсли partitions четыре, а consumers восемь:\n\n```text\nConsumer A -> partition 0\nConsumer B -> partition 1\nConsumer C -> partition 2\nConsumer D -> partition 3\n\nConsumer E -> простаивает\nConsumer F -> простаивает\nConsumer G -> простаивает\nConsumer H -> простаивает\n```\n\nСледовательно, максимальная параллельность consumer group ограничена количеством partitions. При изменении состава группы Kafka перераспределяет partitions между consumers — выполняет rebalance. \n\n---\n\n### Подтверждение обработки\n\n#### RabbitMQ\n\nПодтверждается конкретная доставка:\n\n```python\nchannel.basic_ack(delivery_tag=delivery_tag)\n```\n\nRabbitMQ знает, какие отдельные сообщения находятся в состоянии `unacked`.\n\nЕсли consumer упал до `ack`, сообщение возвращается в очередь и может быть доставлено повторно.\n\n#### Kafka\n\nConsumer подтверждает позицию в partition:\n\n```text\npartition 2: committed offset = 120\n```\n\nЭто означает, что записи до данной позиции считаются обработанными consumer group.\n\nKafka не ведёт для consumer group отдельный `ack` на каждую запись в модели RabbitMQ. Состояние обработки компактно представляется offset для каждой partition. \n\n---\n\n### Повторное чтение\n\nВ Kafka можно изменить offset:\n\n```text\nТекущий offset: 10000\nНовый offset:   5000\n```\n\nПосле этого consumer повторно прочитает события:\n\n```text\n5000, 5001, 5002, ...\n```\n\nЭто полезно, когда:\n\n- исправили ошибку consumer;\n    \n- нужно пересчитать аналитику;\n    \n- появился новый сервис;\n    \n- нужно восстановить состояние;\n    \n- изменилась бизнес-логика обработки.\n    \n\nВ обычной RabbitMQ queue подтверждённое сообщение удаляется, поэтому повторное чтение невозможно без:\n\n- повторной публикации;\n    \n- отдельного хранилища событий;\n    \n- архива;\n    \n- DLQ;\n    \n- использования RabbitMQ Streams.\n    \n\n---\n\n### Порядок сообщений\n\n#### RabbitMQ\n\nОчередь логически FIFO:\n\n```text\nM1 -> M2 -> M3\n```\n\nНо наблюдаемый порядок может измениться из-за:\n\n- нескольких consumers;\n    \n- разных скоростей обработки;\n    \n- `nack` и requeue;\n    \n- повторной доставки;\n    \n- приоритетов;\n    \n- пакетной обработки.\n    \n\nНапример:\n\n```text\nConsumer A получил M1 и обрабатывает 10 секунд\nConsumer B получил M2 и обработал за 1 секунду\n\nРезультат:\nM2 завершено раньше M1\n```\n\nОфициальная документация RabbitMQ отдельно отмечает, что приоритеты, повторная постановка в очередь и несколько consumers влияют на наблюдаемый порядок. \n\n#### Kafka\n\nПорядок гарантирован внутри partition:\n\n```text\nPartition 0:\n\noffset 10 -> order.created\noffset 11 -> order.paid\noffset 12 -> order.shipped\n```\n\nМежду разными partitions общего порядка нет:\n\n```text\nPartition 0: A1 A2 A3\nPartition 1: B1 B2 B3\n```\n\nНельзя однозначно утверждать, что `A2` произошло раньше `B2`, только исходя из offsets.\n\n---\n\n### Гарантии доставки\n\nОбе системы обычно используются с семантикой **at least once**:\n\n```text\nСообщение или событие может обработаться повторно.\n```\n\n#### RabbitMQ\n\nПовтор возникает, например, когда:\n\n```text\n1. Consumer изменил базу данных.\n2. Consumer упал до отправки ack.\n3. RabbitMQ повторно доставил сообщение.\n```\n\n#### Kafka\n\nПовтор возникает, когда:\n\n```text\n1. Consumer обработал записи.\n2. Consumer упал до commit offset.\n3. После перезапуска чтение начинается со старого offset.\n```\n\nKafka поддерживает транзакции и exactly-once processing при чтении, обработке и записи обратно в Kafka, в частности через Kafka Streams. При записи во внешнюю PostgreSQL, HTTP API или другую систему всё равно требуется координация, идемпотентность или дедупликация. \n\n---\n\n### Производительность\n\nНекорректно утверждать, что Kafka всегда быстрее RabbitMQ. Они оптимизированы под разные модели.\n\nKafka проектировалась вокруг:\n\n```text\nappend-only log\npartitions\nsequential disk I/O\nbatching\ncompression\npull consumption\n```\n\nЭто хорошо подходит для очень больших постоянных потоков событий.\n\nRabbitMQ проектировался вокруг:\n\n```text\nqueues\nper-message delivery\nack/nack\nrouting\nconsumer prefetch\nTTL\npriorities\ndead lettering\n```\n\nЭто хорошо подходит для оперативной доставки команд и фоновых задач.\n\nДля RabbitMQ максимальный throughput также можно получать через **RabbitMQ Streams и Super Streams**, которые используют недеструктивное чтение, retention и partitioned streams. RabbitMQ рекомендует Streams для нагрузок, где обычные очереди достигают пределов пропускной способности. \n\n---\n\n### RabbitMQ Streams частично сближает системы\n\nСовременный RabbitMQ поддерживает Streams:\n\n```text\nRabbitMQ Stream:\n\nProducer -> append-only stream -> Consumer\n```\n\nОсобенности:\n\n- сообщения не удаляются после чтения;\n    \n- consumer может читать их повторно;\n    \n- используются offsets;\n    \n- данные постоянно хранятся и реплицируются;\n    \n- Super Streams позволяют разбить поток на partitions;\n    \n- доступен отдельный высокопроизводительный Stream Protocol.\n    \n\nТаким образом, сравнивать Kafka только с обычными RabbitMQ queues не всегда корректно. RabbitMQ Streams закрывает часть streaming-сценариев, но Kafka остаётся более цельной экосистемой для распределённых event pipelines и stream processing. \n\n---\n\n### Что выбрать\n\n#### RabbitMQ лучше, когда\n\n```text\nСообщение — это работа, которую должен выполнить один обработчик.\n```\n\nПримеры:\n\n- Celery;\n    \n- отправка email;\n    \n- генерация PDF;\n    \n- обработка изображения;\n    \n- выполнение платежной команды;\n    \n- retry с задержкой;\n    \n- DLQ;\n    \n- RPC;\n    \n- разные приоритеты задач;\n    \n- сложная маршрутизация;\n    \n- короткоживущие очереди.\n    \n\n#### Kafka лучше, когда\n\n```text\nСообщение — это событие, историю которого нужно сохранить.\n```\n\nПримеры:\n\n- `user.registered`;\n    \n- `payment.completed`;\n    \n- CDC из PostgreSQL;\n    \n- аудит;\n    \n- аналитика;\n    \n- поток логов;\n    \n- fraud detection;\n    \n- построение витрин данных;\n    \n- повторный пересчёт событий;\n    \n- десятки независимых consumer groups;\n    \n- Kafka Streams и stream processing.\n    \n\n#### Использование вместе\n\nЧасто системы не заменяют друг друга:\n\n```text\nPostgreSQL\n    |\n    | CDC\n    v\nKafka\n    |\n    +--> Analytics\n    +--> Audit\n    +--> Fraud Detection\n    |\n    v\nNotification Service\n    |\n    | конкретная фоновая задача\n    v\nRabbitMQ\n    |\n    +--> Email Worker\n    +--> Push Worker\n```\n\n### Итог\n\n```text\nRabbitMQ:\n«Доставь эту задачу подходящему обработчику\nи удали её после успешного выполнения».\n\nKafka:\n«Сохрани это событие в журнале\nи разреши разным системам читать его независимо».\n```\n\nДля фоновых задач, Celery, команд, retry и гибкой маршрутизации обычно выбирают **RabbitMQ**. Для потоков событий, CDC, аналитики, replay и длительного хранения истории — **Kafka**."
  popularity = 2.63

[[questions]]
  id = 15
  question = "Какой формат сообщений используется в Apache Kafka?"
  answer = "### Единого формата данных в Kafka нет\n\nApache Kafka не требует использовать JSON, Avro, Protobuf или другой конкретный формат. Для Kafka ключ и значение сообщения — это непрозрачные массивы байтов:\n\n```text\nkey:   byte[]\nvalue: byte[]\n```\n\nProducer сериализует объект в байты, Kafka сохраняет и передаёт эти байты без анализа содержимого, а consumer десериализует их обратно. Выбор формата является частью контракта между producer и consumer. \n\n### Структура Kafka record\n\nНа уровне приложения сообщение обычно представляется так:\n\n```text\nKafka record\n├── topic\n├── partition\n├── offset\n├── timestamp\n├── key\n├── value\n└── headers\n```\n\nПример:\n\n```text\ntopic:     payment-events\npartition: 3\noffset:    1527\ntimestamp: 1785177600000\n\nkey:\n    \"payment-451\"\n\nvalue:\n    {\"payment_id\":451,\"status\":\"completed\"}\n\nheaders:\n    event-type     = payment.completed\n    schema-version = 2\n    trace-id       = trace-721\n```\n\nВ хранимом формате непосредственно record содержит `timestampDelta`, `offsetDelta`, `key`, `value` и headers. Несколько records объединяются в `RecordBatch`, где находятся базовый offset, временные метки, CRC, параметры транзакции и сжатия.\n\n### `key`\n\nКлюч необязателен и может быть `null`.\n\n```json\n{\n  \"key\": \"payment-451\"\n}\n```\n\nКлюч обычно используется для:\n\n- выбора partition;\n    \n- сохранения порядка событий одной сущности;\n    \n- log compaction;\n    \n- группировки связанных событий.\n    \n\nНапример, все события платежа получают одинаковый ключ:\n\n```text\nkey = payment-451\n\npayment.created\npayment.authorized\npayment.completed\npayment.refunded\n```\n\nПри стандартном partitioner одинаковый сериализованный ключ направляет записи в одну partition, пока количество partitions и логика partitioner не меняются. Внутри partition Kafka сохраняет порядок записей. Конкретный тип ключа также определяется serializer’ом producer’а. \n\nКлюч может быть строкой:\n\n```text\n\"payment-451\"\n```\n\nчислом:\n\n```text\n451\n```\n\nUUID:\n\n```text\n0190f81a-8972-7d30-a021-72d774148f41\n```\n\nили сериализованной структурой.\n\n### `value`\n\n`value` содержит полезную нагрузку сообщения:\n\n```json\n{\n  \"event_id\": \"evt-125\",\n  \"event_type\": \"payment.completed\",\n  \"event_version\": 2,\n  \"occurred_at\": \"2026-07-27T18:40:00Z\",\n  \"data\": {\n    \"payment_id\": 451,\n    \"amount\": \"35.00\",\n    \"currency\": \"AZN\"\n  }\n}\n```\n\nKafka не знает, что внутри находится JSON. До отправки это значение превращается в `byte[]`, например:\n\n```text\n7b 22 65 76 65 6e 74 5f 69 64 22 3a ...\n```\n\nConsumer должен использовать совместимый deserializer.\n\n### `headers`\n\nHeaders — это список пар:\n\n```text\nString -> byte[]\n```\n\nНапример:\n\n```text\nevent-type:      payment.completed\nschema-version:  2\ncontent-type:    application/json\ncorrelation-id:  operation-821\ntrace-id:        trace-721\n```\n\nКлюч header не может быть `null`, значение может быть `null`. Порядок headers сохраняется, причём разрешено несколько headers с одинаковым ключом. \n\nHeaders обычно используют для технических метаданных:\n\n- версия схемы;\n    \n- тип события;\n    \n- distributed tracing;\n    \n- correlation ID;\n    \n- идентификатор producer’а;\n    \n- content type;\n    \n- tenant ID.\n    \n\nОсновные бизнес-данные лучше хранить в `value`, поскольку headers не должны превращаться во второе тело сообщения.\n\n### `timestamp`\n\nКаждый record имеет временную метку. Она может означать:\n\n```text\nCreateTime\n```\n\nВремя создания сообщения producer’ом.\n\nИли:\n\n```text\nLogAppendTime\n```\n\nВремя записи сообщения broker’ом.\n\nВнутри `RecordBatch` хранится базовая временная метка, а отдельные records содержат смещение относительно неё. \n\nБизнес-время события всё равно часто сохраняют внутри payload:\n\n```json\n{\n  \"occurred_at\": \"2026-07-27T18:40:00Z\"\n}\n```\n\nПоскольку Kafka timestamp и бизнес-время могут означать разные моменты:\n\n```text\noccurred_at    — когда произошло событие;\nrecord timestamp — когда producer создал или broker записал record.\n```\n\n### Наиболее распространённые форматы\n\n#### JSON\n\n```json\n{\n  \"event_type\": \"user.registered\",\n  \"event_version\": 1,\n  \"data\": {\n    \"user_id\": 125,\n    \"email\": \"user@example.com\"\n  }\n}\n```\n\nПреимущества:\n\n- легко читать;\n    \n- просто отлаживать;\n    \n- поддерживается почти всеми языками;\n    \n- удобно просматривать через CLI.\n    \n\nНедостатки:\n\n- относительно большой размер;\n    \n- типы данных ограничены JSON;\n    \n- схема не встроена в сообщение;\n    \n- без дополнительной проверки producer и consumer могут по-разному понимать структуру.\n    \n\nПример сериализации:\n\n```python\nimport json\n\nvalue = json.dumps(\n    {\n        \"event_type\": \"user.registered\",\n        \"event_version\": 1,\n        \"data\": {\"user_id\": 125},\n    }\n).encode(\"utf-8\")\n```\n\n#### Avro\n\nAvro использует бинарное представление и отдельную схему:\n\n```json\n{\n  \"type\": \"record\",\n  \"name\": \"PaymentCompleted\",\n  \"fields\": [\n    {\"name\": \"payment_id\", \"type\": \"long\"},\n    {\"name\": \"amount\", \"type\": \"string\"},\n    {\"name\": \"currency\", \"type\": \"string\"}\n  ]\n}\n```\n\nОбычно вместе с Avro применяется Schema Registry. В Kafka record сохраняется бинарный payload и идентификатор схемы, по которому consumer находит нужную схему.\n\nSchema Registry не является обязательной встроенной частью Kafka broker: это отдельный компонент архитектуры.\n\n#### Protocol Buffers\n\nПример схемы:\n\n```protobuf\nmessage PaymentCompleted {\n  int64 payment_id = 1;\n  string amount = 2;\n  string currency = 3;\n}\n```\n\nПреимущества:\n\n- компактный бинарный формат;\n    \n- строгие типы;\n    \n- генерация классов;\n    \n- поддержка эволюции схемы.\n    \n\nВ Kafka хранится результат сериализации Protobuf-сообщения в `byte[]`.\n\n#### String\n\nДля простых событий можно отправлять обычную строку:\n\n```text\npayment.completed\n```\n\nИли CSV:\n\n```text\n451,35.00,AZN,completed\n```\n\nЭто просто, но неудобно для сложных контрактов и развития схемы.\n\n#### Raw bytes\n\nМожно отправлять произвольные байты:\n\n```text\nPDF\nизображение\nархив\nзашифрованный payload\nсобственный бинарный протокол\n```\n\nТехнически это возможно, но крупные файлы обычно хранят в S3 или MinIO, а через Kafka передают идентификатор объекта:\n\n```json\n{\n  \"file_id\": \"file-125\",\n  \"bucket\": \"documents\",\n  \"object_key\": \"reports/2026/report-125.pdf\"\n}\n```\n\n### Serializer и deserializer\n\nProducer использует serializer:\n\n```text\nPython/Java object\n        |\n        v\nSerializer\n        |\n        v\nbyte[]\n        |\n        v\nKafka\n```\n\nConsumer выполняет обратное преобразование:\n\n```text\nKafka\n  |\n  v\nbyte[]\n  |\n  v\nDeserializer\n  |\n  v\nPython/Java object\n```\n\nВ Kafka-клиентах key и value настраиваются независимо:\n\n```properties\nkey.serializer=org.apache.kafka.common.serialization.StringSerializer\nvalue.serializer=org.apache.kafka.common.serialization.StringSerializer\n```\n\nConsumer:\n\n```properties\nkey.deserializer=org.apache.kafka.common.serialization.StringDeserializer\nvalue.deserializer=org.apache.kafka.common.serialization.StringDeserializer\n```\n\nKafka предоставляет стандартные serializers/deserializers для строк, байтов, чисел, UUID и некоторых других базовых типов. Для пользовательских объектов применяется собственный serializer либо библиотека JSON, Avro или Protobuf. \n\n### Пример корректного события\n\n```json\n{\n  \"event_id\": \"0190f81a-8972-7d30-a021-72d774148f41\",\n  \"event_type\": \"payment.completed\",\n  \"event_version\": 2,\n  \"occurred_at\": \"2026-07-27T18:40:00Z\",\n  \"producer\": \"payment-service\",\n  \"data\": {\n    \"payment_id\": 451,\n    \"user_id\": 125,\n    \"amount\": \"35.00\",\n    \"currency\": \"AZN\"\n  }\n}\n```\n\nKafka record:\n\n```text\ntopic:     payment-events\nkey:       payment-451\nvalue:     JSON / Avro / Protobuf bytes\n\nheaders:\n    content-type     = application/json\n    schema-version   = 2\n    trace-id         = trace-721\n```\n\n### Record и RecordBatch\n\nProducer обычно не отправляет каждую запись отдельным сетевым запросом. Kafka-клиент накапливает records и объединяет их в batches:\n\n```text\nRecordBatch\n├── Record 1\n├── Record 2\n├── Record 3\n└── Record 4\n```\n\nСжатие применяется к batch, а не независимо к каждому отдельному record. Актуальный формат поддерживает:\n\n```text\nnone\ngzip\nsnappy\nlz4\nzstd\n```\n\nBatch также содержит CRC, количество records, producer ID, sequence number и признаки транзакционного или управляющего batch.\n\n### Какой формат выбирать\n\nДля небольших внутренних сервисов:\n\n```text\nJSON + версия схемы\n```\n\nДля строгих контрактов и большого количества сервисов:\n\n```text\nProtobuf или Avro + Schema Registry\n```\n\nДля аналитических потоков и интеграции с data platform часто используют:\n\n```text\nAvro\n```\n\nДля сервисов с уже развитой Protobuf/gRPC-инфраструктурой:\n\n```text\nProtobuf\n```\n\nГлавное правило:\n\n```text\nKafka определяет контейнер record и бинарный формат хранения,\nно формат содержимого key и value определяет приложение.\n```"
  popularity = 2.63

[[questions]]
  id = 16
  question = "Какие основные роли и сущности существуют в RabbitMQ?"
  answer = "### Общая схема RabbitMQ\n\n```text\nPublisher\n    |\n    | publish(message, exchange, routing_key)\n    v\nExchange\n    |\n    | Binding\n    v\nQueue\n    |\n    | delivery\n    v\nConsumer\n    |\n    | ack / nack\n    v\nRabbitMQ\n```\n\nRabbitMQ принимает сообщения от publishers, маршрутизирует их через exchanges, помещает в очереди и доставляет consumers. В модели AMQP 0-9-1 producer обычно не отправляет сообщение напрямую в очередь — он публикует его в exchange. \n\n### Основные роли\n\n#### Publisher — отправитель сообщений\n\nPublisher, или producer, — приложение, которое создаёт и публикует сообщения.\n\nПримеры:\n\n- API после создания заказа;\n    \n- Payment Service после завершения платежа;\n    \n- Celery-клиент, создающий фоновую задачу;\n    \n- сервис, отправляющий доменное событие.\n    \n\n```text\nPublisher:\n    exchange    = domain.events\n    routing_key = payment.completed\n    body        = {...}\n```\n\nPublisher обычно поддерживает долговременное соединение с RabbitMQ, а не открывает новое соединение для каждого сообщения. Для надёжной публикации может использовать `publisher confirms`, чтобы получить подтверждение принятия сообщения брокером. \n\n#### Consumer — получатель и обработчик\n\nConsumer — приложение или зарегистрированная подписка, которая получает сообщения из очереди.\n\n```text\npayments.queue\n       |\n       +--> Consumer 1\n       +--> Consumer 2\n       +--> Consumer 3\n```\n\nConsumers читают сообщения именно из очередей. После обработки consumer обычно отправляет:\n\n```text\nbasic.ack\n```\n\nПри ошибке:\n\n```text\nbasic.nack\nbasic.reject\n```\n\nОдин и тот же процесс может одновременно выступать publisher и consumer. В RabbitMQ термин consumer также обозначает зарегистрированную подписку на доставку сообщений, а не только весь процесс приложения. \n\n#### Broker\n\nBroker — сервер RabbitMQ, который:\n\n- принимает подключения;\n    \n- аутентифицирует клиентов;\n    \n- принимает сообщения;\n    \n- выполняет маршрутизацию;\n    \n- хранит сообщения в очередях;\n    \n- доставляет сообщения consumers;\n    \n- отслеживает подтверждения;\n    \n- управляет topology: exchanges, queues и bindings.\n    \n\n```text\nPublisher -> RabbitMQ Broker -> Consumer\n```\n\nБрокер может состоять из одного RabbitMQ node или нескольких nodes, объединённых в cluster. \n\n#### Administrator / Operator\n\nЭто человек или автоматизированная система, которая управляет RabbitMQ:\n\n- создаёт пользователей и virtual hosts;\n    \n- назначает permissions;\n    \n- задаёт policies;\n    \n- настраивает limits;\n    \n- следит за состоянием очередей и соединений;\n    \n- управляет кластером;\n    \n- анализирует накопившиеся и неподтверждённые сообщения.\n    \n\nЭто не роль AMQP-доставки сообщений, но важная эксплуатационная роль.\n\n---\n\n### Основные сущности\n\n### Message\n\nMessage — передаваемая единица данных.\n\nУсловно сообщение состоит из:\n\n```text\nMessage\n├── body\n├── properties\n└── headers\n```\n\nПример тела:\n\n```json\n{\n  \"event_type\": \"payment.completed\",\n  \"payment_id\": 451,\n  \"amount\": \"35.00\",\n  \"currency\": \"AZN\"\n}\n```\n\nПример свойств:\n\n```text\ncontent_type   = application/json\ndelivery_mode  = persistent\nmessage_id     = evt-451\ncorrelation_id = operation-125\ntype           = payment.completed\n```\n\nRabbitMQ не обязан понимать структуру `body`: для брокера это полезная нагрузка, которую формирует publisher и интерпретирует consumer. Свойства и headers в основном устанавливаются publisher’ом. \n\n### Exchange\n\nExchange принимает сообщения от publisher и решает, в какие очереди или другие exchanges их направить.\n\n```text\nPublisher\n    |\n    v\nExchange\n    |\n    +--> Queue A\n    +--> Queue B\n```\n\nExchange сам по себе обычно не является хранилищем сообщений. Его основная задача — маршрутизация на основании:\n\n- типа exchange;\n    \n- routing key;\n    \n- bindings;\n    \n- binding arguments или headers.\n    \n\nRabbitMQ поддерживает основные типы exchanges:\n\n```text\ndirect\nfanout\ntopic\nheaders\n```\n\n#### Direct exchange\n\nСопоставляет routing key с binding key по точному совпадению.\n\n```text\nrouting_key: payment.completed\nbinding_key: payment.completed\n```\n\n```text\ndirect exchange\n    |\n    +-- payment.completed --> payment.queue\n```\n\n#### Topic exchange\n\nИспользует шаблоны routing key.\n\n```text\npayment.*\npayment.#\n*.failed\n```\n\nНапример:\n\n```text\npayment.completed\npayment.failed\norder.failed\n```\n\n#### Fanout exchange\n\nОтправляет копию сообщения во все связанные очереди, игнорируя routing key.\n\n```text\nfanout exchange\n    |\n    +--> notifications.queue\n    +--> analytics.queue\n    +--> audit.queue\n```\n\n#### Headers exchange\n\nМаршрутизирует сообщения по значениям headers, а не по обычному routing key.\n\n### Queue\n\nQueue хранит сообщения до момента их доставки и успешного подтверждения consumer’ом.\n\n```text\nQueue:\n\n[M1] [M2] [M3] [M4]\n          |\n          v\n       Consumer\n```\n\nОсновные свойства очереди:\n\n```text\nname\ndurable\nexclusive\nauto-delete\narguments\n```\n\n- `durable` — очередь переживает перезапуск брокера;\n    \n- `exclusive` — очередь привязана к одному соединению;\n    \n- `auto-delete` — удаляется после исчезновения последнего consumer при выполнении условий;\n    \n- `arguments` — дополнительные настройки, например TTL, лимит длины, тип очереди или dead lettering.\n    \n\nОчередь должна быть объявлена до использования. Повторное объявление допустимо, только если параметры совпадают с уже существующей очередью; иначе RabbitMQ закрывает канал с ошибкой `PRECONDITION_FAILED`. \n\n### Binding\n\nBinding — правило связи между exchange и очередью.\n\n```text\nExchange\n    |\n    | binding_key = payment.completed\n    v\nQueue\n```\n\nBinding сообщает exchange:\n\n```text\nКакие сообщения нужно направлять в эту очередь.\n```\n\nУ binding могут быть:\n\n- source exchange;\n    \n- destination queue или другой exchange;\n    \n- binding key;\n    \n- дополнительные arguments.\n    \n\n```text\ndomain.events\n    |\n    | payment.*\n    v\naccounting.queue\n```\n\nОдин exchange может иметь множество bindings, и одна очередь может быть связана с несколькими exchanges. RabbitMQ также поддерживает exchange-to-exchange bindings. \n\n### Routing key\n\nRouting key — строка, которую publisher указывает при публикации сообщения.\n\n```text\npayment.completed\norder.created\nnotification.email\n```\n\n```text\nPublisher:\n    exchange    = domain.events\n    routing_key = payment.completed\n```\n\nExchange использует routing key вместе с bindings для выбора очередей. Точное поведение зависит от типа exchange.\n\nВажно различать:\n\n```text\nrouting key — у публикуемого сообщения;\nbinding key — у связи exchange с очередью.\n```\n\nДля direct exchange они должны совпасть. Для topic exchange binding key может быть шаблоном. \n\n### Default exchange\n\nВ каждом virtual host существует специальный direct exchange с пустым именем:\n\n```text\nexchange = \"\"\n```\n\nПри объявлении очереди RabbitMQ автоматически связывает её с default exchange, используя имя очереди как routing key.\n\nНапример:\n\n```text\nexchange:    \"\"\nrouting_key: payments.queue\n```\n\nСообщение будет направлено непосредственно в:\n\n```text\npayments.queue\n```\n\nЭто выглядит как публикация напрямую в очередь, но технически сообщение всё равно проходит через default exchange. \n\n### Virtual host\n\nVirtual host, или `vhost`, — логически изолированная область внутри RabbitMQ.\n\n```text\nRabbitMQ cluster\n├── vhost: /\n├── vhost: development\n├── vhost: staging\n└── vhost: production\n```\n\nВнутри vhost находятся:\n\n- exchanges;\n    \n- queues;\n    \n- bindings;\n    \n- permissions;\n    \n- policies;\n    \n- connections, работающие с этим vhost;\n    \n- другие topology-ресурсы.\n    \n\nСоединение с одним vhost не может напрямую использовать exchanges и queues другого vhost. Права пользователей также назначаются в контексте конкретного virtual host. Это логическая, а не физическая изоляция ресурсов. \n\n### Connection\n\nConnection — долговременное сетевое соединение между приложением и RabbitMQ.\n\nДля AMQP 0-9-1 обычно используется TCP:\n\n```text\nApplication ===== TCP connection ===== RabbitMQ node\n```\n\nСоединение содержит:\n\n- аутентифицированного пользователя;\n    \n- выбранный virtual host;\n    \n- один или несколько channels;\n    \n- параметры heartbeat;\n    \n- сетевое состояние.\n    \n\nОткрывать новое connection для каждого сообщения не следует: RabbitMQ и поддерживаемые протоколы рассчитаны преимущественно на долгоживущие соединения. Для publisher и consumer часто используют отдельные connections, чтобы publisher flow control не мешал consumer acknowledgements. \n\n### Channel\n\nChannel — лёгкое логическое соединение внутри одного физического connection.\n\n```text\nTCP Connection\n├── Channel 1 — publishing\n├── Channel 2 — consuming\n└── Channel 3 — topology declarations\n```\n\nChannels позволяют не создавать большое количество TCP-соединений:\n\n```text\nодин TCP connection\n        |\n        +--> несколько AMQP channels\n```\n\nChannel не может существовать без connection. При закрытии connection закрываются все его channels. Большинство протокольных ошибок, связанных с queue или exchange declaration, закрывают только конкретный channel, а не всё TCP-соединение. \n\n### Consumer subscription\n\nConsumer в протокольном смысле — зарегистрированная подписка на очередь.\n\n```text\nqueue: payments.queue\nconsumer_tag: consumer-payment-1\n```\n\nConsumer subscription включает:\n\n- имя очереди;\n    \n- consumer tag;\n    \n- acknowledgement mode;\n    \n- consumer arguments;\n    \n- иногда признаки exclusive или single active consumer;\n    \n- callback приложения для обработки доставки.\n    \n\n`consumer_tag` идентифицирует подписку в пределах канала. Одно приложение может зарегистрировать несколько consumers.\n\n### Delivery\n\nDelivery — конкретная передача сообщения из очереди consumer’у.\n\nПри доставке RabbitMQ добавляет метаданные:\n\n```text\ndelivery_tag\nredelivered\nexchange\nrouting_key\nconsumer_tag\n```\n\n`delivery_tag` нужен для `ack`, `nack` и `reject`. Он относится не к самому сообщению глобально, а к конкретной доставке в пределах канала. `redelivered=true` означает, что сообщение ранее уже доставлялось и было возвращено в очередь.\n\n### User и permissions\n\nUser — учётная запись, через которую приложение подключается к RabbitMQ.\n\nПри установлении connection RabbitMQ:\n\n```text\n1. Аутентифицирует пользователя.\n2. Проверяет доступ к выбранному vhost.\n3. Проверяет permissions на конкретные ресурсы.\n```\n\nОсновные категории AMQP 0-9-1 permissions:\n\n```text\nconfigure\nwrite\nread\n```\n\nОни управляют возможностью:\n\n- объявлять и изменять topology;\n    \n- публиковать сообщения;\n    \n- читать сообщения из очередей.\n    \n\nПользователь может иметь разные права в разных virtual hosts. Production-системам не рекомендуется использовать стандартного пользователя `guest`; следует создавать отдельные учётные записи приложений.\n\n### Node\n\nNode — отдельный запущенный экземпляр RabbitMQ.\n\n```text\nRabbitMQ Node\n├── connections\n├── channels\n├── exchanges\n├── queues\n└── runtime state\n```\n\nПриложение подключается к конкретному node. Один node может работать самостоятельно либо входить в cluster.\n\n### Cluster\n\nCluster — логическая группа RabbitMQ nodes.\n\n```text\nRabbitMQ Cluster\n├── Node 1\n├── Node 2\n└── Node 3\n```\n\nNodes кластера совместно используют распределённые сведения о:\n\n- users;\n    \n- virtual hosts;\n    \n- exchanges;\n    \n- queues и streams;\n    \n- bindings;\n    \n- policies;\n    \n- runtime parameters.\n    \n\nПри этом репликация содержимого сообщений зависит от типа очереди или stream. Сам факт нахождения nodes в кластере не означает, что содержимое любой очереди автоматически реплицируется между всеми nodes; для реплицируемых сообщений применяются, например, quorum queues или streams. \n\n### Дополнительные важные сущности\n\n#### Dead Letter Exchange\n\nDead Letter Exchange — exchange, куда RabbitMQ может перенаправлять сообщения, которые:\n\n- отклонены с `requeue=false`;\n    \n- превысили TTL;\n    \n- были вытеснены из-за ограничения длины очереди;\n    \n- в некоторых типах очередей превысили лимит доставок.\n    \n\n```text\nmain.queue\n    |\n    | rejected / expired\n    v\ndead-letter.exchange\n    |\n    v\ndead-letter.queue\n```\n\nDLX — обычный exchange, используемый RabbitMQ для повторной маршрутизации проблемного сообщения.\n\n#### Policy\n\nPolicy — серверное правило, которое применяет настройки к группе ресурсов по шаблону имени.\n\nНапример, через policy часто задают:\n\n```text\ndead-letter exchange\nmessage TTL\nqueue limits\nfederation\n```\n\nPolicies удобнее жёсткого указания части параметров в коде приложения, поскольку их можно менять операционно без повторного развёртывания всех producers и consumers.\n\n#### Stream\n\nStream — append-only структура RabbitMQ для длительного хранения и повторного чтения сообщений.\n\nВ отличие от обычной очереди:\n\n```text\nQueue:\nack -> сообщение обычно удаляется\n\nStream:\nпрочтение не удаляет сообщение\n```\n\nStreams используются для streaming-нагрузок, retention и replay. Это отдельная модель хранения, хотя exchanges также могут маршрутизировать сообщения в streams. \n\n### Как всё связано\n\n```text\nRabbitMQ Cluster\n│\n├── Node\n│   └── Connection\n│       └── Channel\n│\n└── Virtual Host\n    ├── Users and permissions\n    ├── Exchanges\n    │   └── Bindings\n    ├── Queues / Streams\n    │   └── Consumer subscriptions\n    └── Policies\n```\n\nПуть сообщения:\n\n```text\n1. Publisher открывает connection и channel.\n2. Publisher публикует message в exchange.\n3. Publisher указывает routing key.\n4. Exchange проверяет bindings.\n5. Сообщение попадает в одну или несколько queues.\n6. RabbitMQ доставляет его consumer.\n7. Consumer обрабатывает сообщение.\n8. Consumer отправляет ack или nack.\n```\n\n### Ключевые сущности, которые нужно знать в первую очередь\n\n```text\nРоли:\n    Publisher\n    Consumer\n    Broker\n\nМаршрутизация:\n    Exchange\n    Binding\n    Routing key\n\nХранение:\n    Queue\n    Stream\n    Message\n\nСоединение:\n    Connection\n    Channel\n    Consumer subscription\n\nИзоляция и безопасность:\n    Virtual host\n    User\n    Permissions\n\nИнфраструктура:\n    Node\n    Cluster\n    Policy\n```\n\nГлавная цепочка RabbitMQ:\n\n```text\nPublisher\n    -> Exchange\n    -> Binding\n    -> Queue\n    -> Consumer\n    -> Acknowledgement\n```"
  popularity = 2.63

[[questions]]
  id = 17
  question = "Что такое партиция (partition) в Kafka?"
  answer = "### Что такое partition\n\n**Partition — это упорядоченная часть Kafka topic, представляющая собой отдельный append-only журнал записей.**\n\nTopic может состоять из одной или нескольких partitions:\n\n```text\nTopic: orders\n\nPartition 0: [0][1][2][3]\nPartition 1: [0][1][2]\nPartition 2: [0][1][2][3][4]\n```\n\nKafka разделяет topic на заранее заданное количество partitions, пронумерованных от `0` до `P - 1`. Каждая partition хранится и обрабатывается независимо.\n\n### Записи внутри partition\n\nНовые записи добавляются в конец журнала:\n\n```text\nPartition 0:\n\noffset 0 -> order.created\noffset 1 -> order.paid\noffset 2 -> order.shipped\noffset 3 -> order.delivered\n```\n\nКаждая запись получает `offset` — её позицию внутри конкретной partition.\n\nВажно:\n\n```text\n(topic, partition, offset)\n```\n\nвместе однозначно определяют позицию записи:\n\n```text\ntopic:     orders\npartition: 0\noffset:    153\n```\n\nOffset не является глобальным идентификатором всего topic. В другой partition может существовать запись с таким же offset:\n\n```text\norders / partition 0 / offset 153\norders / partition 1 / offset 153\n```\n\nConsumer при чтении указывает broker’у partition и offset, начиная с которого нужно вернуть данные. Позицию можно переместить назад и повторно прочитать записи. \n\n### Зачем Kafka нужны partitions\n\nPartition решает три основные задачи:\n\n```text\n1. Масштабирование хранения\n2. Параллельная обработка\n3. Сохранение порядка связанных событий\n```\n\n#### Распределение данных между brokers\n\nРазные partitions одного topic могут иметь лидеров на разных brokers:\n\n```text\nKafka cluster\n\nBroker 1:\n    orders-0\n    payments-1\n\nBroker 2:\n    orders-1\n    payments-2\n\nBroker 3:\n    orders-2\n    payments-0\n```\n\nЭто позволяет распределить дисковую, сетевую и вычислительную нагрузку по кластеру. Producer отправляет запись непосредственно broker’у, который является лидером выбранной partition. \n#### Параллельная обработка\n\nPartitions распределяются между consumers одной consumer group:\n\n```text\nTopic: orders\nPartitions: 4\n\nConsumer group: order-service\n\nPartition 0 -> Consumer A\nPartition 1 -> Consumer A\nPartition 2 -> Consumer B\nPartition 3 -> Consumer B\n```\n\nВ традиционной consumer group одна partition в конкретный момент назначается только одному consumer этой группы. Благодаря этому consumer получает записи своей partition последовательно. \n\nКоличество partitions определяет верхнюю границу полезного параллелизма внутри группы:\n\n```text\n3 partitions\n5 consumers\n```\n\nРаспределение будет примерно таким:\n\n```text\nPartition 0 -> Consumer A\nPartition 1 -> Consumer B\nPartition 2 -> Consumer C\n\nConsumer D -> без partition\nConsumer E -> без partition\n```\n\nДополнительные consumers не ускорят обработку этой группы, пока количество partitions не будет увеличено.\n\n### Порядок сообщений\n\nKafka гарантирует порядок только внутри одной partition:\n\n```text\nPartition 0:\n\noffset 10 -> order.created\noffset 11 -> order.paid\noffset 12 -> order.shipped\n```\n\nConsumer прочитает их в этом порядке.\n\nНо глобального порядка между разными partitions нет:\n\n```text\nPartition 0: A1 -> A2 -> A3\nPartition 1: B1 -> B2 -> B3\n```\n\nKafka гарантирует:\n\n```text\nA1 раньше A2 раньше A3\nB1 раньше B2 раньше B3\n```\n\nНо из offsets нельзя сделать вывод, было ли `A2` раньше `B2`. Официальная модель Kafka рассматривает каждую partition как отдельный полностью упорядоченный журнал. \n\n### Как producer выбирает partition\n\nProducer может:\n\n1. явно указать номер partition;\n    \n2. выбрать partition по ключу;\n    \n3. позволить partitioner’у выбрать её автоматически.\n    \n\nПример записи:\n\n```text\ntopic: orders\nkey:   user-125\nvalue: {...}\n```\n\nОбычно partition выбирается приблизительно так:\n\n```text\nhash(serialized_key) -> partition\n```\n\nПоэтому записи с одинаковым ключом обычно попадают в одну partition:\n\n```text\nkey = order-451\n\norder.created   -> Partition 2\norder.paid      -> Partition 2\norder.shipped   -> Partition 2\norder.delivered -> Partition 2\n```\n\nЭто позволяет сохранить порядок событий одной сущности. Kafka официально описывает semantic partitioning как использование ключа, например `user_id`, чтобы связанные данные попадали в одну partition и обрабатывались одним consumer. \n\n### Пример с заказами\n\nПусть topic содержит четыре partitions:\n\n```text\nTopic: order-events\n\nPartition 0\nPartition 1\nPartition 2\nPartition 3\n```\n\nProducer публикует события с ключом `order_id`:\n\n```json\n{\n  \"key\": \"order-451\",\n  \"value\": {\n    \"event_type\": \"order.created\"\n  }\n}\n```\n\nВсе события заказа `451` попадают, например, в partition `2`:\n\n```text\nPartition 2:\n\noffset 100 -> order-451 created\noffset 101 -> order-451 paid\noffset 102 -> order-451 shipped\n```\n\nДругой заказ может попасть в другую partition:\n\n```text\nPartition 0:\n\noffset 87 -> order-782 created\noffset 88 -> order-782 cancelled\n```\n\nТаким образом, Kafka параллельно обрабатывает разные заказы, но сохраняет последовательность событий каждого заказа.\n\n### Partition и consumer offset\n\nConsumer group хранит отдельный committed offset для каждой partition:\n\n```text\nConsumer group: order-service\n\nPartition 0 -> committed offset 150\nPartition 1 -> committed offset 208\nPartition 2 -> committed offset 103\nPartition 3 -> committed offset 91\n```\n\nЭто означает, что прогресс чтения каждой partition отслеживается независимо.\n\nConsumer может отставать только по одной partition:\n\n```text\nPartition 0 lag: 0\nPartition 1 lag: 0\nPartition 2 lag: 50 000\nPartition 3 lag: 0\n```\n\nТакое часто происходит, когда в одной partition оказались особенно тяжёлые сообщения или данные распределились неравномерно.\n\n### Partition и replication\n\nPartition является также единицей репликации Kafka.\n\nУ partition есть:\n\n- один leader;\n    \n- ноль или несколько followers;\n    \n- replication factor — общее количество копий.\n    \n\n```text\nPartition orders-0\n\nBroker 1 -> Leader\nBroker 2 -> Follower\nBroker 3 -> Follower\n```\n\nProducer записывает данные в leader. Followers копируют его журнал, сохраняя те же offsets и порядок записей. При отказе leader Kafka может выбрать новый leader из доступных реплик. \n\nВажно различать:\n\n```text\nPartition — логическая часть данных topic.\nReplica   — копия этой partition на конкретном broker.\n```\n\nНапример:\n\n```text\nTopic: orders\nPartitions: 3\nReplication factor: 3\n```\n\nЭто означает:\n\n```text\n3 логические partitions\n9 физических replicas\n```\n\n### Проблема неравномерного распределения\n\nЕсли ключи распределяются плохо, одна partition может получить большую часть сообщений:\n\n```text\nPartition 0: 1 000 сообщений\nPartition 1: 1 100 сообщений\nPartition 2: 500 000 сообщений\n```\n\nЭто называется partition skew или hot partition.\n\nНапример, если ключом является страна:\n\n```text\nkey = country\n```\n\nи 80% пользователей находятся в одной стране, соответствующая partition станет перегруженной.\n\nПоэтому ключ должен одновременно:\n\n- сохранять необходимый порядок;\n    \n- достаточно равномерно распределять нагрузку;\n    \n- не создавать одну горячую partition.\n    \n\n### Можно ли увеличить количество partitions\n\nКоличество partitions topic можно увеличить:\n\n```text\nбыло: 3\nстало: 6\n```\n\nНо после увеличения результат хеширования ключей может измениться:\n\n```text\nhash(key) % 3 != hash(key) % 6\n```\n\nПоэтому будущие сообщения с тем же ключом могут начать попадать в другую partition.\n\nСтарые записи физически не перераспределяются автоматически:\n\n```text\nстарые события order-451 -> Partition 1\nновые события order-451  -> Partition 4\n```\n\nЭто может нарушить ожидаемый порядок событий одной сущности. Поэтому количество partitions желательно планировать заранее, особенно когда порядок по ключу критичен.\n\n### Одна partition\n\nTopic с одной partition:\n\n```text\nTopic: audit\n\nPartition 0:\n[M1][M2][M3][M4]\n```\n\nПреимущества:\n\n- общий порядок всех записей;\n    \n- простая модель обработки.\n    \n\nНедостатки:\n\n- ограниченный параллелизм;\n    \n- один consumer традиционной consumer group активно обрабатывает partition;\n    \n- лидер partition становится точкой концентрации нагрузки.\n    \n\n### Несколько partitions\n\n```text\nTopic: events\n\nPartition 0\nPartition 1\nPartition 2\nPartition 3\n```\n\nПреимущества:\n\n- параллельное чтение и запись;\n    \n- распределение данных между brokers;\n    \n- горизонтальное масштабирование.\n    \n\nНедостатки:\n\n- нет общего порядка между partitions;\n    \n- сложнее выбрать правильный ключ;\n    \n- возможны горячие partitions;\n    \n- изменение количества partitions может повлиять на распределение ключей.\n    \n\n### Итог\n\n```text\nTopic\n    |\n    +--> Partition 0: упорядоченный журнал\n    +--> Partition 1: упорядоченный журнал\n    +--> Partition 2: упорядоченный журнал\n```\n\nPartition — это базовая единица параллелизма, порядка, хранения и репликации Kafka.\n\nГлавные правила:\n\n```text\n1. Порядок гарантирован только внутри partition.\n2. Offset уникален только внутри partition.\n3. Один ключ обычно направляет связанные события в одну partition.\n4. В consumer group partition назначается одному consumer.\n5. Максимальный параллелизм группы зависит от количества partitions.\n6. Каждая partition может иметь несколько replicas, но одного leader.\n```"
  popularity = 2.63

[[questions]]
  id = 18
  question = "Что будет, если партиция (partition) в Kafka заполнится?"
  answer = "### Кратко\n\nУ Kafka partition обычно **не имеет состояния «заполнена, больше записывать нельзя»**. Это постоянно растущий журнал, который Kafka разбивает на сегменты. При достижении настроенного срока или размера хранения старые сегменты удаляются либо уплотняются. Новые записи продолжают добавляться в конец partition.\n\nПроблема возникает не тогда, когда достигнут `retention.bytes`, а когда заканчивается физическое место на диске broker’а.\n\n### 1. Достигнут `retention.bytes`\n\nДля topic можно установить максимальный объём одной partition:\n\n```properties\nretention.bytes=10737418240\n```\n\nЭто примерно 10 GiB на каждую partition.\n\nПри политике:\n\n```properties\ncleanup.policy=delete\n```\n\nKafka начинает удалять самые старые закрытые log segments:\n\n```text\nPartition:\n\n[segment 0] [segment 1] [segment 2] [active segment]\n      |\n      └── удаляются старые сегменты\n\nНовые сообщения ------------------------------>\n```\n\nЗапись producer’ов при этом не останавливается. `retention.bytes` определяет объём сохраняемой истории, а не жёсткую вместимость очереди. По умолчанию `retention.bytes=-1`, то есть ограничения по размеру нет; действует временной retention, который по умолчанию составляет семь дней. \n\n### 2. Размер может временно превысить лимит\n\nKafka удаляет данные не по одному сообщению, а целыми log segments:\n\n```text\nPartition\n├── 00000000000000000000.log\n├── 00000000000001000000.log\n├── 00000000000002000000.log\n└── active.log\n```\n\nПоэтому `retention.bytes=10 GiB` не означает, что размер всегда строго ограничен десятью гибибайтами. Partition может временно быть больше лимита, потому что:\n\n- активный segment ещё нельзя удалить;\n    \n- очистка выполняется периодически;\n    \n- удаление производится целыми файлами;\n    \n- segment сначала должен быть закрыт — rolled.\n    \n\nПараметр `segment.bytes` задаёт размер segment-файла; по умолчанию это 1 GiB. Чем больше segment, тем менее точно Kafka может соблюдать retention по размеру. \n\n### 3. Что будет с медленным consumer\n\nУдаление старых records не зависит от того, успели ли все consumer groups их прочитать.\n\nНапример:\n\n```text\nPartition:\n\noffset 1000 ... 5000 ... 10000\n             ^\n             consumer читает отсюда\n\nKafka удаляет записи до offset 7000\n```\n\nConsumer больше не сможет прочитать offsets `5000–6999`. Его сохранённый offset больше не существует.\n\nДальнейшее поведение определяется `auto.offset.reset`:\n\n```properties\nauto.offset.reset=earliest\n```\n\nConsumer продолжит с самого раннего ещё существующего offset.\n\n```properties\nauto.offset.reset=latest\n```\n\nConsumer перейдёт в конец partition и пропустит накопленные данные.\n\n```properties\nauto.offset.reset=none\n```\n\nConsumer получит исключение и должен обработать ситуацию самостоятельно. В Kafka 4.3 также доступен вариант `by_duration`, позволяющий начать чтение с позиции, соответствующей заданной давности.\n\nПоэтому `retention.ms` и `retention.bytes` должны учитывать максимальный ожидаемый consumer lag.\n\n### 4. Что происходит при `cleanup.policy=compact`\n\nПри compaction Kafka не удаляет данные только потому, что partition достигла определённого размера. Она сохраняет последнее значение для каждого ключа:\n\n```text\nДо compaction:\n\nuser-1 -> name=A\nuser-2 -> name=B\nuser-1 -> name=C\n\nПосле compaction:\n\nuser-2 -> name=B\nuser-1 -> name=C\n```\n\n```properties\ncleanup.policy=compact\n```\n\nПри большом количестве уникальных ключей partition всё равно может постоянно расти, поскольку для каждого ключа необходимо сохранить хотя бы последнее значение.\n\nМожно совместить две политики:\n\n```properties\ncleanup.policy=compact,delete\n```\n\nТогда Kafka выполняет compaction, но также удаляет старые сегменты по `retention.ms` и `retention.bytes`. \n\n### 5. Что будет, если заполнится физический диск\n\nЭто уже аварийная ситуация:\n\n```text\nPartition продолжает расти\n        |\n        v\nНа broker заканчивается место\n        |\n        v\nKafka не может записывать новые log segments\n```\n\nKafka может пометить соответствующий log directory как offline. Для контроля этого состояния предусмотрены метрики `LogDirectoryOffline` и `OfflineLogDirectoryCount`. \n\nДальнейшее зависит от репликации.\n\n#### Есть синхронизированная replica\n\n```text\nBroker 1: Leader  — диск заполнен\nBroker 2: Follower — исправен\nBroker 3: Follower — исправен\n```\n\nKafka может перенести leadership partition на исправную replica:\n\n```text\nBroker 2: новый Leader\n```\n\nКластер обнаруживает отказ broker’а и выбирает новых leaders для его partitions, если подходящие replicas доступны. \n\n#### Исправной replica нет\n\n```text\nReplication factor = 1\n```\n\nили остальные replicas сильно отстали:\n\n```text\nLeader unavailable\nNo eligible replica\n```\n\nPartition становится недоступной для записи, а иногда и для чтения. Producer начинает получать ошибки, выполнять retries и в конечном итоге завершает отправку ошибкой после истечения настроенного timeout.\n\n### 6. Почему Kafka сама не удалит всё при заполнении диска\n\nRetention не гарантирует мгновенного освобождения места.\n\nНапример:\n\n```properties\ncleanup.policy=delete\nretention.ms=604800000\nretention.bytes=-1\n```\n\nKafka обязана сохранять данные семь дней. Если диск заполнится за два дня, старые segments ещё не подходят под временной retention и автоматически удалены не будут.\n\nАналогично при:\n\n```properties\ncleanup.policy=compact\n```\n\ncompaction удаляет устаревшие версии ключей, но не обязана уменьшать журнал до конкретного безопасного размера.\n\n### Как предотвращают заполнение диска\n\nОбычно контролируют:\n\n```text\nСвободное место на дисках broker’ов\nРазмер partitions и topics\nСкорость записи байтов\nСкорость удаления segments\nConsumer lag\nOffline log directories\nUnder-replicated partitions\n```\n\nИ устанавливают разумные ограничения:\n\n```properties\ncleanup.policy=delete\nretention.ms=259200000\nretention.bytes=53687091200\nsegment.bytes=1073741824\n```\n\nЗдесь:\n\n```text\nretention.ms    = 3 дня\nretention.bytes = 50 GiB на partition\nsegment.bytes   = 1 GiB\n```\n\nПри наличии tiered storage закрытые segments можно переносить во внешнее хранилище, оставляя на локальных дисках только более свежую часть журнала. Для этого отдельно настраиваются локальные и общие ограничения retention. \n\n### Итоговая схема\n\n```text\nДостигнут retention.bytes\n        |\n        v\nУдаляются старые закрытые segments\n        |\n        v\nЗапись новых сообщений продолжается\n```\n\n```text\nЗаполнен физический диск broker’а\n        |\n        +--> есть исправная replica\n        |        |\n        |        v\n        |   leadership переносится\n        |\n        +--> исправной replica нет\n                 |\n                 v\n        partition становится недоступной\n```\n\nТаким образом, partition не «заполняется» как обычная очередь фиксированного размера. Она либо очищает старую историю согласно retention, либо продолжает расти до тех пор, пока не закончится место на диске."
  popularity = 2.63

[[questions]]
  id = 19
  question = "Что такое routing key в RabbitMQ?"
  answer = "### Что такое routing key\n\n**Routing key** — это строка, которую publisher указывает при публикации сообщения. Exchange использует её вместе с bindings, чтобы определить, в какие очереди направить сообщение.\n\n```text\nPublisher\n    |\n    | exchange = domain.events\n    | routing_key = payment.completed\n    v\nExchange\n    |\n    | проверяет bindings\n    v\nQueue\n```\n\nRouting key можно воспринимать как **логический адрес или признак сообщения**, но это не обязательно имя очереди. \n\nПример публикации:\n\n```python\nchannel.basic_publish(\n    exchange=\"domain.events\",\n    routing_key=\"payment.completed\",\n    body=message,\n)\n```\n\nЗдесь:\n\n```text\ndomain.events      — exchange, куда публикуется сообщение\npayment.completed  — routing key сообщения\n```\n\n### Routing key и binding key\n\nИх важно различать.\n\n**Routing key** задаёт publisher при отправке сообщения:\n\n```text\npayment.completed\n```\n\n**Binding key** задаётся при связывании очереди с exchange:\n\n```text\nExchange:    domain.events\nQueue:       accounting.queue\nBinding key: payment.completed\n```\n\n```text\nPublisher отправляет:\nrouting_key = payment.completed\n\nExchange проверяет:\nbinding_key = payment.completed\n```\n\nДальнейшее сопоставление зависит от типа exchange. \n\n### Direct exchange\n\nУ `direct exchange` routing key должен точно совпасть с binding key:\n\n```text\nrouting_key == binding_key\n```\n\nНапример:\n\n```text\nExchange: payments.direct\n\nBinding:\npayment.completed -> notifications.queue\npayment.failed    -> retry.queue\n```\n\nСообщение:\n\n```text\nrouting_key = payment.completed\n```\n\nпопадёт в:\n\n```text\nnotifications.queue\n```\n\nно не попадёт в `retry.queue`.\n\n```text\npayments.direct\n    |\n    | payment.completed\n    v\nnotifications.queue\n```\n\nЕсли несколько очередей связаны с direct exchange одним binding key, каждая из них получит копию сообщения. \n\n### Topic exchange\n\n`Topic exchange` сопоставляет routing key с шаблоном binding key.\n\nRouting key обычно состоит из слов, разделённых точками:\n\n```text\npayment.completed\npayment.card.failed\norder.created\nuser.profile.updated\n```\n\nВ binding key доступны специальные символы:\n\n```text\n* — ровно одно слово\n# — ноль или несколько слов\n```\n\nПримеры:\n\n```text\npayment.*       -> ровно два слова:\n                   payment.completed\n                   payment.failed\n\npayment.#       -> любое количество частей после payment:\n                   payment.completed\n                   payment.card.failed\n                   payment.provider.timeout\n\n*.failed        -> order.failed\n                   payment.failed\n\n#.failed        -> payment.card.failed\n                   order.failed\n```\n\nСхема:\n\n```text\nTopic exchange: domain.events\n\npayment.*   -> accounting.queue\n*.failed    -> failures.queue\npayment.#   -> payment-audit.queue\n```\n\nСообщение:\n\n```text\nrouting_key = payment.failed\n```\n\nпопадёт во все три очереди, поскольку соответствует всем трём шаблонам. Topic exchange маршрутизирует сообщения во все очереди, чьи binding patterns совпали с routing key. \n\n### Fanout exchange\n\n`Fanout exchange` полностью игнорирует routing key:\n\n```python\nchannel.basic_publish(\n    exchange=\"logs.fanout\",\n    routing_key=\"любое-значение\",\n    body=message,\n)\n```\n\nСообщение будет скопировано во все очереди, связанные с exchange:\n\n```text\nlogs.fanout\n    |\n    +--> console.queue\n    +--> file.queue\n    +--> monitoring.queue\n```\n\nПоэтому при `fanout` routing key обычно передают как пустую строку:\n\n```python\nrouting_key=\"\"\n```\n\nно её значение всё равно не участвует в маршрутизации.\n\n### Headers exchange\n\n`Headers exchange` маршрутизирует сообщения по AMQP headers, поэтому обычный routing key для выбора очереди не используется:\n\n```text\nheaders:\n    format = pdf\n    region = az\n```\n\nBinding может проверять именно эти заголовки, а не строку `payment.completed`. \n\n### Default exchange\n\nВ RabbitMQ существует специальный direct exchange с пустым именем:\n\n```text\nexchange = \"\"\n```\n\nПри создании каждая очередь автоматически связывается с ним binding key, равным имени очереди.\n\n```text\nQueue name: payments.queue\nAutomatic binding key: payments.queue\n```\n\nПоэтому можно опубликовать:\n\n```python\nchannel.basic_publish(\n    exchange=\"\",\n    routing_key=\"payments.queue\",\n    body=message,\n)\n```\n\nСообщение попадёт в очередь `payments.queue`.\n\nЭто выглядит как отправка непосредственно в очередь, но технически сообщение проходит через default exchange. Только в этом случае routing key обычно непосредственно равен имени очереди. \n\n### Что будет, если routing key не совпал\n\nПредположим:\n\n```text\nExchange: payments.direct\n\nBindings:\npayment.completed -> completed.queue\npayment.failed    -> failed.queue\n```\n\nPublisher отправил:\n\n```text\nrouting_key = payment.refunded\n```\n\nСовпадающего binding нет, поэтому сообщение является **unroutable** — exchange не может направить его ни в одну очередь.\n\nПо умолчанию такое сообщение может быть отброшено брокером. Для контроля используют:\n\n- флаг `mandatory`;\n    \n- обработку возврата сообщения publisher’у;\n    \n- alternate exchange.\n    \n\nRouting key сам по себе не создаёт очередь и не сохраняет сообщение: должна существовать подходящая связь exchange с очередью.\n\n### Как выбирать routing key\n\nДля событий удобно использовать структуру:\n\n```text\n<сущность>.<событие>\n```\n\nПримеры:\n\n```text\nuser.registered\norder.created\npayment.completed\npayment.failed\nfile.uploaded\n```\n\nДля более детальной классификации:\n\n```text\n<область>.<сущность>.<событие>\n```\n\n```text\nbilling.payment.completed\nbilling.payment.failed\nusers.profile.updated\nstorage.file.deleted\n```\n\nИли:\n\n```text\n<сущность>.<канал>.<действие>\n```\n\n```text\nnotification.email.send\nnotification.sms.send\nnotification.push.send\n```\n\nЛучше описывать routing key через бизнес-смысл сообщения, а не через имя конкретного consumer:\n\n```text\nХорошо:\npayment.completed\n\nСильная связанность:\nsend-to-accounting-service\n```\n\nВ первом случае к событию позже можно подключить несколько независимых очередей:\n\n```text\npayment.completed\n    |\n    +--> accounting.queue\n    +--> notifications.queue\n    +--> analytics.queue\n```\n\n### Итог\n\n```text\nrouting key\n    — задаётся publisher;\n    — относится к конкретной публикации;\n    — передаётся exchange;\n    — используется для выбора подходящих bindings;\n    — интерпретируется в зависимости от типа exchange.\n```\n\nГлавная цепочка:\n\n```text\nPublisher указывает routing key\n        |\n        v\nExchange сравнивает её с binding keys\n        |\n        v\nСообщение направляется в подходящие очереди\n```\n\nДля `direct` требуется точное совпадение, для `topic` используются шаблоны, `fanout` routing key игнорирует, а у default exchange она равна имени целевой очереди."
  popularity = 2.63

[[questions]]
  id = 20
  question = "Как решать проблемы с нагрузкой в backend-приложении?"
  answer = "### Главный принцип\n\nПроблемы с нагрузкой решают не добавлением серверов «на глаз», а последовательностью:\n\n```text\nИзмерить\n    → воспроизвести\n    → найти узкое место\n    → устранить его\n    → повторно измерить\n    → только затем масштабировать\n```\n\nНагрузка может упираться не в backend-код, а в PostgreSQL, внешний API, пул соединений, очередь, диск, сеть, блокировки или слишком большие ответы.\n\n### 1. Сначала определить симптомы\n\nМинимально нужно собирать:\n\n```text\nТрафик:\n    RPS\n    количество одновременных запросов\n\nЗадержки:\n    p50\n    p95\n    p99\n\nОшибки:\n    HTTP 5xx\n    HTTP 429\n    timeouts\n    ошибки подключения\n\nРесурсы:\n    CPU\n    RAM\n    диск\n    сеть\n    количество открытых соединений\n\nЗависимости:\n    время SQL-запросов\n    использование пула БД\n    latency внешних API\n    размер очередей\n    количество unacked-сообщений\n```\n\nСреднее время ответа недостаточно. Например:\n\n```text\naverage = 100 ms\np99     = 4 s\n```\n\nСреднее выглядит нормально, но каждый сотый запрос работает четыре секунды.\n\nДля распределённого приложения полезны одновременно метрики, логи и traces: trace позволяет увидеть, сколько времени запрос провёл в приложении, PostgreSQL, Redis и внешних сервисах. OpenTelemetry предназначен для сбора именно таких сигналов наблюдаемости.\n\n### 2. Воспроизвести нагрузку\n\nНагрузочный тест должен быть похож на реальный трафик:\n\n```text\nнеправильно:\n    100% запросов GET /health\n\nправильно:\n    50% чтение списка\n    20% получение объекта\n    15% создание\n    10% обновление\n    5% тяжёлые операции\n```\n\nПроверяют несколько режимов:\n\n```text\nLoad test:\n    ожидаемая штатная нагрузка\n\nStress test:\n    постепенное увеличение до отказа\n\nSpike test:\n    резкий скачок трафика\n\nSoak test:\n    длительная нагрузка для поиска утечек\n```\n\nВажно определить точку деградации:\n\n```text\n100 RPS  -> p95 120 ms\n300 RPS  -> p95 180 ms\n500 RPS  -> p95 900 ms\n600 RPS  -> timeouts\n```\n\nЭто показывает, что система начинает насыщаться примерно между `300` и `500 RPS`.\n\n### 3. Найти тип узкого места\n\nУсловная диагностика:\n\n```text\nCPU около 100%\n    → CPU-bound код или недостаточно процессов\n\nCPU низкий, ответы медленные\n    → ожидание БД, сети, блокировок или пула соединений\n\nПул БД полностью занят\n    → слишком много запросов, медленные запросы или долгие транзакции\n\nRAM постоянно растёт\n    → утечка, неограниченный кэш, накопление объектов\n\nRabbitMQ queue растёт\n    → consumers обрабатывают медленнее, чем publishers публикуют\n\nОшибки появляются только при всплеске\n    → нет backpressure, лимитов или запаса соединений\n```\n\n### 4. Оптимизировать базу данных\n\nВ backend-приложениях база часто становится первым серьёзным ограничением.\n\nНачинать нужно со статистики реальных запросов и:\n\n```sql\nEXPLAIN (ANALYZE, BUFFERS)\nSELECT ...\n```\n\n`EXPLAIN ANALYZE` фактически выполняет запрос и показывает реальные времена, количество строк и работу узлов плана. PostgreSQL использует статистику `ANALYZE` при выборе плана запроса. ([PostgreSQL](https://www.postgresql.org/docs/current/using-explain.html?utm_source=chatgpt.com \"Documentation: 18: 14.1. Using EXPLAIN\"))\n\nПроверяют:\n\n```text\nSequential Scan больших таблиц\nневерные оценки rows\nдорогие Sort\nмногократные Nested Loop\nчтение большого количества buffers\nRows Removed by Filter\nвременные файлы на диске\nдолгое ожидание locks\n```\n\nОсновные меры:\n\n#### Устранить N+1\n\nПлохо:\n\n```python\nusers = await get_users()\n\nfor user in users:\n    user.orders = await get_orders(user.id)\n```\n\nПри 100 пользователях получается:\n\n```text\n1 запрос пользователей\n100 запросов заказов\n--------------------\n101 SQL-запрос\n```\n\nНужно использовать:\n\n```text\nJOIN\nselect_related\nprefetch_related\nselectinload\njoinedload\n```\n\nв зависимости от ORM.\n\n#### Создать подходящие индексы\n\nИндекс должен соответствовать реальному запросу:\n\n```sql\nSELECT *\nFROM payments\nWHERE user_id = 42\n  AND status = 'pending'\nORDER BY created_at DESC\nLIMIT 20;\n```\n\nВозможный индекс:\n\n```sql\nCREATE INDEX idx_payments_user_status_created\nON payments (user_id, status, created_at DESC);\n```\n\nНо индексы не бесплатны: они занимают место и замедляют `INSERT`, `UPDATE` и `DELETE`. Их использование нужно проверять через `EXPLAIN` и статистику PostgreSQL. \n\n#### Ограничить объём данных\n\nПлохо:\n\n```sql\nSELECT *\nFROM payments;\n```\n\nЛучше:\n\n```sql\nSELECT id, amount, status, created_at\nFROM payments\nWHERE user_id = $1\nORDER BY created_at DESC\nLIMIT 50;\n```\n\nНужны:\n\n```text\npagination\nфильтрация\nвыбор только нужных колонок\nограничение максимального limit\n```\n\n#### Сократить транзакции\n\nНе следует держать транзакцию открытой во время внешнего HTTP-запроса:\n\n```python\nasync with transaction():\n    await update_payment()\n\n    # Транзакция и locks продолжают удерживаться.\n    await external_provider.request()\n```\n\nВнешний вызов может зависнуть, пока соединение с БД и блокировки остаются занятыми.\n\n#### Настроить пул соединений\n\nСлишком маленький пул создаёт очередь ожидания:\n\n```text\n100 запросов\n10 соединений\n90 запросов ждут\n```\n\nНо слишком большой пул тоже опасен:\n\n```text\n10 replicas × 50 connections = 500 connections к PostgreSQL\n```\n\nПул должен рассчитываться для всей системы, а не для одного процесса.\n\n### 5. Использовать кэш там, где он оправдан\n\nКэш полезен для данных, которые:\n\n- часто читаются;\n    \n- редко меняются;\n    \n- дорого вычисляются;\n    \n- допускают небольшую задержку обновления.\n    \n\n```text\nRequest\n   |\n   v\nRedis cache\n   |\n   +-- hit  -> вернуть результат\n   |\n   +-- miss -> PostgreSQL -> записать в Redis\n```\n\nRedis может использоваться как внешний кэш, а client-side caching позволяет хранить часть данных непосредственно в процессах приложения. \n\nПример cache-aside:\n\n```python\nasync def get_product(product_id: int) -> dict:\n    key = f\"product:{product_id}\"\n\n    cached = await redis.get(key)\n    if cached is not None:\n        return json.loads(cached)\n\n    product = await repository.get_product(product_id)\n\n    await redis.set(\n        key,\n        json.dumps(product),\n        ex=60,\n    )\n\n    return product\n```\n\nНужно заранее решить:\n\n```text\nTTL\nинвалидацию\nповедение при недоступности Redis\nдопустимость устаревших данных\nзащиту от cache stampede\n```\n\n#### Cache stampede\n\nЕсли популярный ключ истёк, сотни запросов одновременно идут в БД:\n\n```text\ncache expired\n     |\n     +--> request 1 -> DB\n     +--> request 2 -> DB\n     +--> request 3 -> DB\n     ...\n```\n\nМеры:\n\n```text\ndistributed lock\nsingle flight\nTTL с небольшим случайным разбросом\nобновление до фактического истечения\nstale-while-revalidate\n```\n\nНе следует кэшировать всё подряд. Часто достаточно исправить SQL-запрос или добавить индекс.\n\n### 6. Правильно использовать async\n\nАсинхронность помогает при ожидании I/O:\n\n```text\nPostgreSQL\nRedis\nHTTP API\nS3\nRabbitMQ\n```\n\nОна не ускоряет CPU-bound вычисления:\n\n```text\nобработка больших изображений\nсжатие\nшифрование\nпарсинг огромного файла\nмашинное обучение\nсложные вычисления\n```\n\nКритическая ошибка в FastAPI:\n\n```python\nimport requests\n\n\n@app.get(\"/data\")\nasync def get_data():\n    response = requests.get(\"https://service\")\n    return response.json()\n```\n\n`requests.get()` блокирует поток event loop.\n\nНужно использовать асинхронный клиент:\n\n```python\nimport httpx\n\n\n@app.get(\"/data\")\nasync def get_data():\n    async with httpx.AsyncClient(timeout=5) as client:\n        response = await client.get(\"https://service\")\n        response.raise_for_status()\n        return response.json()\n```\n\nЛибо выполнять синхронную работу в thread pool, если библиотека не поддерживает async.\n\nТакже необходимо:\n\n```text\nзадавать timeouts\nпереиспользовать HTTP-клиенты\nиспользовать connection pooling\nограничивать concurrency\nне создавать клиент на каждый запрос\n```\n\n### 7. CPU-bound работу выносить из HTTP-запроса\n\nПлохо:\n\n```text\nPOST /reports\n    → собрать данные\n    → построить PDF\n    → загрузить в S3\n    → отправить email\n    → через 40 секунд вернуть ответ\n```\n\nЛучше:\n\n```text\nPOST /reports\n    |\n    | создать job\n    v\n202 Accepted\n    |\n    v\nRabbitMQ\n    |\n    v\nWorker\n    |\n    +--> построить PDF\n    +--> загрузить в S3\n    +--> обновить статус\n```\n\nHTTP-обработчик должен выполнять только то, что необходимо для немедленного ответа пользователю.\n\nДля RabbitMQ важно настраивать `prefetch`: он ограничивает количество неподтверждённых сообщений, переданных consumer’у. Слишком большой `prefetch` может перегрузить worker памятью и ухудшить распределение задач; слишком маленький ограничивает throughput. \n\n```python\nchannel.basic_qos(prefetch_count=10)\n```\n\nЕсли очередь продолжает расти:\n\n```text\nскорость публикации > скорость обработки\n```\n\nВарианты:\n\n```text\nувеличить число consumers\nускорить обработку одной задачи\nразделить тяжёлые задачи\nиспользовать batching\nуменьшить входной поток\nпроверить внешние зависимости workers\n```\n\n### 8. Масштабировать процессы и экземпляры\n\nОдин Python-процесс обычно использует одно ядро для выполнения Python-кода в конкретный момент. Для задействования нескольких ядер запускают несколько worker-процессов:\n\n```bash\nuvicorn app.main:app --workers 4\n```\n\nFastAPI прямо рекомендует использовать репликацию процессов, когда нужно задействовать несколько ядер и обслуживать больше запросов. В контейнерной оркестрации часто используют несколько отдельных контейнеров приложения вместо большого количества процессов внутри одного контейнера.\n\nНо количество workers нельзя выбирать только по формуле:\n\n```text\nworkers = CPU × 2 + 1\n```\n\nНужно проводить тесты, потому что ограничением может быть:\n\n```text\nPostgreSQL\nRAM\nпул соединений\nвнешний API\nдиск\nлимит файловых дескрипторов\n```\n\n#### Вертикальное масштабирование\n\n```text\nбольше CPU\nбольше RAM\nбыстрее диск\n```\n\nПросто, но имеет физический предел и создаёт крупную точку отказа.\n\n#### Горизонтальное масштабирование\n\n```text\nLoad Balancer\n    |\n    +--> Backend 1\n    +--> Backend 2\n    +--> Backend 3\n```\n\nДля него приложение должно быть максимально stateless:\n\n```text\nсессии не в памяти процесса\nфайлы не только на локальном диске\nобщий Redis\nобщая БД\nобщее S3/MinIO\n```\n\nKubernetes HPA может изменять количество replicas по CPU, памяти или пользовательским метрикам. Для backend полезнее иногда масштабироваться не по CPU, а по RPS, latency или длине очереди.\n\n### 9. Добавить backpressure\n\nСистема не должна бесконечно принимать работу, которую не способна выполнить.\n\n```text\n100 запросов/сек входят\n50 запросов/сек обрабатываются\n------------------------------\nочередь растёт на 50 запросов/сек\n```\n\nБез ограничений это заканчивается:\n\n```text\nростом RAM\nпереполнением пулов\nтайм-аутами\nкаскадным отказом\n```\n\nОсновные механизмы:\n\n#### Rate limiting\n\n```text\n100 запросов в минуту на пользователя\n10 тяжёлых операций одновременно\n500 запросов в секунду на endpoint\n```\n\nПри превышении возвращают:\n\n```http\n429 Too Many Requests\nRetry-After: 10\n```\n\n#### Ограничение concurrency\n\n```python\nsemaphore = asyncio.Semaphore(20)\n\n\nasync def call_provider():\n    async with semaphore:\n        return await provider.request()\n```\n\nДаже если приложение получает тысячу запросов, к нестабильному внешнему сервису одновременно уйдёт не более двадцати.\n\n#### Timeouts\n\nTimeout должен существовать на каждом сетевом уровне:\n\n```text\nHTTP client timeout\nDB statement timeout\npool acquisition timeout\nRabbitMQ operation timeout\nreverse proxy timeout\n```\n\nБез timeout один зависший сервис постепенно занимает все соединения и workers.\n\n#### Circuit breaker\n\nПосле серии ошибок вызовы временно блокируются:\n\n```text\nClosed\n   |\nмного ошибок\n   v\nOpen\n   |\nчерез timeout\n   v\nHalf-open\n```\n\nЭто защищает приложение от постоянного ожидания уже недоступного сервиса.\n\n#### Load shedding\n\nПри перегрузке лучше быстро отклонить часть запросов, чем позволить упасть всей системе:\n\n```text\n503 Service Unavailable\n429 Too Many Requests\n```\n\n### 10. Уменьшить стоимость одного запроса\n\nНередко масштабирование не требуется, если запрос можно сделать дешевле.\n\nПроверить:\n\n```text\nсколько SQL-запросов выполняется\nсколько данных сериализуется\nкакой размер JSON-ответа\nсколько внешних вызовов выполняется\nнет ли повторных вычислений\nнет ли повторного чтения одного объекта\n```\n\nПримеры:\n\n#### Параллельные независимые I/O-операции\n\nПоследовательно:\n\n```python\nuser = await get_user()\npayments = await get_payments()\nnotifications = await get_notifications()\n```\n\nЕсли операции независимы:\n\n```python\nuser, payments, notifications = await asyncio.gather(\n    get_user(),\n    get_payments(),\n    get_notifications(),\n)\n```\n\nНо нельзя бесконтрольно создавать тысячи задач:\n\n```python\nawait asyncio.gather(\n    *(call_external_api(item) for item in million_items)\n)\n```\n\nЗдесь нужен semaphore, очередь или пакетная обработка.\n\n#### Batching\n\nВместо:\n\n```text\n1000 отдельных INSERT\n```\n\nиспользовать:\n\n```text\nbulk INSERT\nCOPY\nexecutemany\n```\n\nВместо 100 запросов к внешнему API — один batch-запрос, если API это поддерживает.\n\n#### Уменьшение ответа\n\n```text\npagination\nfield selection\nкомпрессия\nCDN для статических данных\nS3/MinIO для файлов\n```\n\nБольшие файлы не следует передавать через процесс приложения, если клиент может получить подписанную ссылку на объектное хранилище.\n\n### 11. Профилировать код\n\nЕсли CPU загружен, нужно найти конкретные функции, а не оптимизировать случайные участки.\n\nВ Python можно начать с `cProfile`, который предоставляет детерминированное профилирование и показывает количество вызовов и время выполнения функций.\n\n```bash\npython -m cProfile -o profile.out app.py\n```\n\nНужно искать:\n\n```text\nгорячие циклы\nлишнюю сериализацию\nрегулярные выражения\nкопирование больших структур\nчастый JSON encode/decode\nсинхронные операции в async-коде\nдорогую валидацию\n```\n\nПрофилирование под искусственным единичным запросом может не показать конкуренцию, блокировки и проблемы пула, поэтому его нужно сочетать с нагрузочным тестированием.\n\n### 12. Не допустить каскадного отказа\n\nРассмотрим цепочку:\n\n```text\nAPI\n |\n v\nPayment Service\n |\n v\nExternal Provider\n```\n\nProvider замедлился:\n\n```text\nprovider latency растёт\n    → запросы API ждут\n    → соединения заканчиваются\n    → очередь запросов растёт\n    → память растёт\n    → API перестаёт отвечать\n```\n\nЗащита:\n\n```text\nкороткий timeout\nограничение одновременных вызовов\ncircuit breaker\nretry только для безопасных операций\nexponential backoff\njitter\nограниченное количество retry\n```\n\nНельзя делать бесконечные немедленные повторы:\n\n```python\nwhile True:\n    try:\n        return await provider.request()\n    except Exception:\n        continue\n```\n\nТакой код усиливает нагрузку на уже падающий сервис.\n\n### Практический порядок действий\n\n```text\n1. Зафиксировать текущие p95, p99, RPS и error rate.\n\n2. Найти самый медленный endpoint.\n\n3. По trace определить:\n       приложение\n       PostgreSQL\n       Redis\n       внешний API\n       очередь\n\n4. Проверить SQL через EXPLAIN ANALYZE.\n\n5. Устранить:\n       N+1\n       отсутствие индексов\n       лишние данные\n       блокирующий I/O\n       долгие транзакции\n\n6. Добавить:\n       timeouts\n       connection pools\n       concurrency limits\n       rate limiting\n\n7. Вынести тяжёлые операции в background workers.\n\n8. Добавить кэш для действительно горячих чтений.\n\n9. Повторить нагрузочный тест.\n\n10. После оптимизации масштабировать workers или replicas.\n\n11. Проверить, выдерживают ли рост:\n       PostgreSQL\n       Redis\n       RabbitMQ\n       внешние сервисы\n\n12. Установить alerts до достижения критического состояния.\n```\n\n### Что обычно делают неправильно\n\n```text\nДобавляют workers, не проверив PostgreSQL\n    → база перегружается ещё сильнее.\n\nДобавляют Redis перед медленным запросом\n    → скрывают плохой SQL и получают проблему инвалидации.\n\nДелают всё async\n    → CPU-bound код продолжает блокировать event loop.\n\nСоздают неограниченное количество asyncio tasks\n    → заканчиваются память и соединения.\n\nУвеличивают pool_size на каждой replica\n    → превышают лимит соединений PostgreSQL.\n\nИспользуют бесконечные retries\n    → усиливают аварию.\n\nПринимают все запросы без ограничений\n    → перегрузка распространяется на всю систему.\n```\n\n### Итоговая стратегия\n\n```text\nСначала:\n    observability\n    нагрузочный тест\n    поиск bottleneck\n\nЗатем:\n    оптимизация SQL и кода\n    кэширование\n    batching\n    background jobs\n    timeouts и backpressure\n\nПосле этого:\n    несколько workers\n    горизонтальное масштабирование\n    autoscaling\n```\n\nМасштабирование компенсирует рост нормальной нагрузки. Оно не исправляет медленные SQL-запросы, блокировки, утечки памяти и неограниченную конкуренцию."
