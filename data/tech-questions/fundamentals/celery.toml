  id = 31
  question = "Как отменить задачу (task) в Celery?"
  answer = "### Основной механизм — `revoke`\n\nВ Celery отмена задачи называется **revocation**. Команда `revoke` сообщает workers, что задачу с указанным `task_id` не следует выполнять:\n\n```python\nresult = generate_report.delay(report_id)\n\nresult.revoke()\n```\n\nЭквивалентные варианты:\n\n```python\nfrom celery.result import AsyncResult\n\nAsyncResult(task_id, app=celery_app).revoke()\n```\n\n```python\ncelery_app.control.revoke(task_id)\n```\n\nЧерез CLI:\n\n```bash\ncelery -A app.celery_app control revoke <task_id>\n```\n\nCelery рассылает команду workers через механизм remote control. Worker сохраняет `task_id` в списке отозванных задач и пропускает её, когда попытается выполнить. Это не обязательно физически удаляет сообщение из очереди RabbitMQ.\n\n### Если задача ещё не начала выполняться\n\nДля задачи в состоянии:\n\n```text\nqueued\nreserved\nscheduled\n```\n\nобычного `revoke()` обычно достаточно:\n\n```python\ncelery_app.control.revoke(task_id)\n```\n\nСхема:\n\n```text\nRabbitMQ\n   |\n   | сообщение доставлено worker\n   v\nWorker проверяет task_id\n   |\n   +-- task_id revoked -> не выполнять\n   |\n   +-- task_id обычный -> передать в execution pool\n```\n\nВ Celery 5.6 при отзыве задачи result backend сразу обновляется до состояния `REVOKED`. Раньше это состояние могло появляться только после того, как worker встретил отозванную задачу. \n\nПроверка:\n\n```python\nresult = celery_app.AsyncResult(task_id)\n\nprint(result.state)\n# REVOKED\n```\n\n### Если задача уже выполняется\n\nОбычный revoke:\n\n```python\nresult.revoke()\n```\n\nне останавливает уже выполняющийся Python-код:\n\n```text\nЗадача ожидает выполнения\n    -> revoke предотвращает запуск\n\nЗадача уже active\n    -> revoke сам по себе её не прерывает\n```\n\nCelery прямо указывает, что worker пропустит отозванную задачу, но уже выполняющуюся задачу не завершит без `terminate=True`. \n\n### Принудительное завершение\n\nТехнически можно использовать:\n\n```python\nresult.revoke(\n    terminate=True,\n    signal=\"SIGTERM\",\n)\n```\n\nили:\n\n```python\ncelery_app.control.revoke(\n    task_id,\n    terminate=True,\n    signal=\"SIGTERM\",\n)\n```\n\nЧерез CLI:\n\n```bash\ncelery -A app.celery_app control revoke \\\n    <task_id> \\\n    --terminate \\\n    --signal=SIGTERM\n```\n\nДля жёсткого завершения:\n\n```python\nresult.revoke(\n    terminate=True,\n    signal=\"SIGKILL\",\n)\n```\n\nНо `terminate=True` завершает **процесс execution pool**, а не аккуратно останавливает конкретную бизнес-операцию. Между обнаружением задачи и отправкой сигнала процесс теоретически уже может перейти к другой работе. Поэтому документация Celery называет этот механизм крайней административной мерой и предупреждает, что его нельзя использовать как обычный программный способ отмены задач. \n\nТакже могут остаться незавершённые побочные эффекты:\n\n```text\nФайл записан частично\nТранзакция прервана\nВнешний API уже вызван\nСтатус в БД не обновлён\nВременные ресурсы не освобождены\n```\n\nПоэтому схема:\n\n```python\nresult.revoke(terminate=True)\n```\n\nне является аналогом безопасного `asyncio.Task.cancel()`.\n\n### Рекомендуемый способ для выполняющейся задачи\n\nДля долгих задач следует реализовать **кооперативную отмену**:\n\n```text\n1. Клиент устанавливает флаг отмены.\n2. Задача периодически проверяет флаг.\n3. Задача завершает текущий безопасный этап.\n4. Выполняет очистку.\n5. Ставит бизнес-статус cancelled.\n6. Завершается самостоятельно.\n```\n\nНапример, состояние операции хранится в PostgreSQL:\n\n```sql\nCREATE TABLE jobs (\n    id UUID PRIMARY KEY,\n    status TEXT NOT NULL,\n    cancellation_requested BOOLEAN NOT NULL DEFAULT FALSE\n);\n```\n\nЗапрос отмены:\n\n```sql\nUPDATE jobs\nSET cancellation_requested = TRUE\nWHERE id = :job_id\n  AND status IN ('queued', 'running');\n```\n\nCelery-задача:\n\n```python\nclass JobCancelled(Exception):\n    pass\n\n\n@celery_app.task(bind=True)\ndef process_file(self, job_id: str) -> None:\n    job_repository.mark_running(job_id)\n\n    try:\n        for batch in load_batches(job_id):\n            if job_repository.is_cancellation_requested(job_id):\n                raise JobCancelled\n\n            process_batch(batch)\n\n        job_repository.mark_succeeded(job_id)\n\n    except JobCancelled:\n        cleanup_partial_results(job_id)\n        job_repository.mark_cancelled(job_id)\n```\n\nПроверять флаг лучше между атомарными этапами, а не в произвольной точке:\n\n```text\nПолучить batch\n    -> проверить отмену\n    -> обработать batch\n    -> зафиксировать результат\n    -> проверить отмену\n```\n\nТак задача не будет остановлена посреди критической операции.\n\n### `celery.contrib.abortable`\n\nCelery предоставляет экспериментально-прикладной механизм `AbortableTask`:\n\n```python\nfrom celery.contrib.abortable import AbortableTask\n\n\n@celery_app.task(bind=True, base=AbortableTask)\ndef long_task(self) -> None:\n    for item in get_items():\n        if self.is_aborted():\n            cleanup()\n            return\n\n        process(item)\n```\n\nProducer:\n\n```python\nresult = long_task.delay()\n\nresult.abort()\n```\n\n`abort()` только устанавливает состояние `ABORTED`; task должна самостоятельно вызывать `is_aborted()` и прекращать работу. Остановка не мгновенная и вообще не гарантируется, если задача не проверяет этот флаг. Кроме того, встроенная реализация `AbortableTask` работает только с database result backends. \n\nПоэтому при Redis result backend обычно практичнее использовать собственный флаг отмены в Redis или PostgreSQL.\n\nПример с Redis:\n\n```python\ndef cancellation_key(job_id: str) -> str:\n    return f\"jobs:{job_id}:cancelled\"\n\n\ndef request_cancellation(job_id: str) -> None:\n    redis.set(\n        cancellation_key(job_id),\n        \"1\",\n        ex=86_400,\n    )\n\n\ndef is_cancelled(job_id: str) -> bool:\n    return bool(redis.exists(cancellation_key(job_id)))\n```\n\n### Комбинация revoke и кооперативной отмены\n\nНа практике неизвестно, начала задача выполняться или всё ещё ждёт. Поэтому можно применить оба механизма:\n\n```python\ndef cancel_job(job_id: str, task_id: str) -> None:\n    job_repository.request_cancellation(job_id)\n\n    celery_app.control.revoke(\n        task_id,\n        terminate=False,\n    )\n```\n\nРезультат:\n\n```text\nЗадача ещё не запущена:\n    revoke предотвращает запуск\n\nЗадача уже выполняется:\n    revoke её не остановит,\n    но она заметит cancellation_requested\n\nЗадача завершилась до запроса:\n    отмена не должна менять completed на cancelled\n```\n\nОбновление состояния нужно делать условно:\n\n```sql\nUPDATE jobs\nSET cancellation_requested = TRUE\nWHERE id = :job_id\n  AND status IN ('accepted', 'queued', 'running');\n```\n\n### Отмена нескольких задач\n\nМожно передать список идентификаторов:\n\n```python\ncelery_app.control.revoke([\n    task_id_1,\n    task_id_2,\n    task_id_3,\n])\n```\n\nДля `GroupResult`:\n\n```python\ngroup_result.revoke()\n```\n\nCelery поддерживает пакетный revoke, чтобы не отправлять отдельную управляющую команду для каждого task ID. \n\n### Отмена по stamped headers\n\nЕсли задачи принадлежат одной бизнес-операции, можно добавить stamps и отменить все задачи с определённым заголовком:\n\n```python\nsignature = process_item.s(item_id).stamp(\n    operation_id=operation_id,\n)\n\nsignature.apply_async()\n```\n\nОтмена:\n\n```python\ncelery_app.control.revoke_by_stamped_headers({\n    \"operation_id\": operation_id,\n})\n```\n\nС принудительным завершением:\n\n```python\ncelery_app.control.revoke_by_stamped_headers(\n    {\"operation_id\": operation_id},\n    terminate=True,\n)\n```\n\n`revoke_by_stamped_headers` поддерживается начиная с Celery 5.3. Список отозванных stamps не сохраняется после перезапуска workers, а поиск активных задач с `terminate=True` может быть дорогим при высокой concurrency.\n\n### Сохранение revoke после перезапуска worker\n\nПо умолчанию workers держат список отозванных task ID в памяти. Если все workers перезапустятся, список может исчезнуть.\n\nДля сохранения используется `--statedb`:\n\n```bash\ncelery -A app.celery_app worker \\\n    --statedb=/var/run/celery/worker.state \\\n    --loglevel=INFO\n```\n\nДля нескольких workers:\n\n```bash\ncelery multi start 2 \\\n    -A app.celery_app \\\n    --statedb=/var/run/celery/%n.state\n```\n\nCelery синхронизирует revoke-списки между работающими workers, а `statedb` позволяет сохранить их между перезапусками. Remote control и revoke поддерживаются брокерами RabbitMQ и Redis.\n\n### Отмена по сроку действия\n\nЕсли задача не имеет смысла после определённого момента, вместо ручной отмены можно установить `expires`:\n\n```python\ntask.apply_async(\n    args=[job_id],\n    expires=300,\n)\n```\n\nИли конкретное время:\n\n```python\nfrom datetime import datetime, timedelta, timezone\n\ntask.apply_async(\n    args=[job_id],\n    expires=datetime.now(timezone.utc) + timedelta(minutes=5),\n)\n```\n\nКогда worker получает просроченную задачу, Celery помечает её как `REVOKED` и не выполняет. \n\n### Ограничение времени выполнения\n\nДля защиты от зависших задач используются soft и hard time limits:\n\n```python\n@celery_app.task(\n    soft_time_limit=300,\n    time_limit=330,\n)\ndef generate_report(report_id: str) -> None:\n    ...\n```\n\nОбработка мягкого лимита:\n\n```python\nfrom celery.exceptions import SoftTimeLimitExceeded\n\n\n@celery_app.task(\n    soft_time_limit=300,\n    time_limit=330,\n)\ndef generate_report(report_id: str) -> None:\n    try:\n        build_report(report_id)\n    except SoftTimeLimitExceeded:\n        cleanup_partial_report(report_id)\n        raise\n```\n\nSoft limit выбрасывает исключение, которое task может обработать для очистки. Hard limit принудительно завершает исполнительный процесс. Это защита от зависания, а не пользовательская отмена.\n\n### Не путать технический и бизнес-статус\n\nCelery может показать:\n\n```text\nREVOKED\n```\n\nНо клиенту обычно нужен бизнес-статус:\n\n```text\ncancellation_requested\ncancelled\ntoo_late_to_cancel\ncompleted\n```\n\nРекомендуемая модель:\n\n```text\nqueued\n   |\n   +-- запрос отмены до старта --> cancelled\n   |\n   v\nrunning\n   |\n   +-- cancellation_requested\n   |          |\n   |          v\n   |      cancelled\n   |\n   +--> succeeded\n   +--> failed\n```\n\nEndpoint отмены:\n\n```http\nPOST /jobs/{job_id}/cancel\n```\n\nПример ответа:\n\n```json\n{\n  \"job_id\": \"0190f81a-8972-7d30-a021-72d774148f41\",\n  \"status\": \"cancellation_requested\"\n}\n```\n\nНе следует сразу возвращать `cancelled`, если выполняющаяся задача ещё не дошла до точки проверки.\n\n### Практический вариант\n\n```python\ndef cancel_job(job_id: str) -> str:\n    job = job_repository.get(job_id)\n\n    if job.status in {\"succeeded\", \"failed\", \"cancelled\"}:\n        return job.status\n\n    job_repository.request_cancellation(job_id)\n\n    if job.celery_task_id:\n        celery_app.control.revoke(\n            job.celery_task_id,\n            terminate=False,\n        )\n\n    return \"cancellation_requested\"\n```\n\nTask:\n\n```python\n@celery_app.task(bind=True)\ndef process_job(self, job_id: str) -> None:\n    if job_repository.is_cancellation_requested(job_id):\n        job_repository.mark_cancelled(job_id)\n        return\n\n    job_repository.mark_running(job_id)\n\n    for step in build_steps(job_id):\n        if job_repository.is_cancellation_requested(job_id):\n            cleanup(job_id)\n            job_repository.mark_cancelled(job_id)\n            return\n\n        execute_step(step)\n\n    job_repository.mark_succeeded(job_id)\n```\n\n### Итог\n\n```text\nЗадача ещё не выполняется:\n    result.revoke()\n\nЗадача уже выполняется:\n    кооперативный флаг отмены в БД или Redis\n\nЗависший процесс:\n    terminate=True только как крайняя административная мера\n\nЗадача потеряла актуальность:\n    expires\n\nЗадача превысила допустимое время:\n    soft_time_limit + time_limit\n```\n\nНаиболее безопасная схема:\n\n```text\nrequest cancellation\n    +\nrevoke без terminate\n    +\nпериодическая проверка флага внутри task\n    +\nочистка и идемпотентное обновление бизнес-статуса\n```"
