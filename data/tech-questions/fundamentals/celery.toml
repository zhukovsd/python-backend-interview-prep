  question = "Как работает consumer в RabbitMQ и как происходит доставка и подтверждение сообщений?"
  answer = "### Что такое consumer\n\nConsumer — это приложение или процесс, который подписывается на очередь RabbitMQ и обрабатывает поступающие сообщения.\n\nОбычно consumer:\n\n1. устанавливает TCP-соединение с RabbitMQ;\n    \n2. открывает AMQP-канал;\n    \n3. подписывается на очередь через `basic.consume`;\n    \n4. получает сообщения от RabbitMQ;\n    \n5. обрабатывает их;\n    \n6. отправляет подтверждение `ack` либо отказ `nack/reject`.\n    \n\nОбычно используется постоянная подписка: RabbitMQ сам отправляет сообщения consumer’у через `basic.deliver`. Получение сообщений по одному через `basic.get` считается неэффективным и не рекомендуется для обычной обработки очередей. \n\n### Общая схема\n\n```text\nProducer\n   |\n   | basic.publish\n   v\nExchange\n   |\n   | routing\n   v\nQueue\n   |\n   | basic.deliver\n   v\nConsumer\n   |\n   +-- успех ------------------> basic.ack\n   |\n   +-- временная ошибка -------> basic.nack(requeue=True)\n   |\n   +-- постоянная ошибка ------> basic.nack(requeue=False)\n   |\n   +-- процесс упал -----------> автоматический requeue\n```\n\n### Полный жизненный цикл сообщения\n\nПредположим, в очереди находится сообщение:\n\n```json\n{\n  \"payment_id\": 451,\n  \"operation\": \"process\"\n}\n```\n\n#### 1. Consumer подписывается на очередь\n\nНапример, через Python-библиотеку Pika:\n\n```python\nchannel.basic_qos(prefetch_count=10)\n\nchannel.basic_consume(\n    queue=\"payments\",\n    on_message_callback=process_message,\n    auto_ack=False,\n)\n```\n\nЗдесь:\n\n- `queue=\"payments\"` — очередь, из которой читаются сообщения;\n    \n- `auto_ack=False` — включены ручные подтверждения;\n    \n- `prefetch_count=10` — у consumer может одновременно находиться не более десяти неподтверждённых сообщений.\n    \n\n### 2. RabbitMQ выбирает consumer\n\nЕсли к одной очереди подключено несколько consumers, RabbitMQ распределяет сообщения между ними.\n\n```text\nQueue: M1 M2 M3 M4 M5 M6\n\nConsumer A <- M1, M3, M5\nConsumer B <- M2, M4, M6\n```\n\nВ простом случае распределение напоминает round-robin: очередное сообщение передаётся следующему consumer. Однако RabbitMQ учитывает ограничения `prefetch`, наличие неподтверждённых сообщений и состояние consumers. \n\nВажно: сообщение передаётся только одному consumer данной очереди. Если нужно, чтобы несколько сервисов получили собственную копию события, каждому сервису нужна отдельная очередь:\n\n```text\n                    +--> notification_queue --> Notification Consumer\npayment.completed --+\n                    +--> analytics_queue -----> Analytics Consumer\n```\n\n### 3. RabbitMQ доставляет сообщение\n\nRabbitMQ отправляет consumer’у:\n\n```text\nbody\nproperties\nheaders\nrouting_key\nexchange\ndelivery_tag\nredelivered\n```\n\n`delivery_tag` — идентификатор конкретной доставки сообщения.\n\nНапример:\n\n```text\ndelivery_tag = 42\nredelivered = false\n```\n\n`delivery_tag` действует только в пределах конкретного AMQP-канала. Подтверждение должно быть отправлено через тот же канал, по которому было получено сообщение. Попытка подтвердить сообщение через другой канал приводит к ошибке `unknown delivery tag` и закрытию канала. \n\n### 4. Сообщение переходит в состояние unacked\n\nПри ручном подтверждении RabbitMQ не удаляет сообщение сразу после отправки consumer’у.\n\nУсловно в очереди существуют два состояния:\n\n```text\nmessages_ready\n    Сообщения ожидают доставки.\n\nmessages_unacknowledged\n    Сообщения уже доставлены consumer’ам,\n    но ещё не подтверждены.\n```\n\nНапример:\n\n```text\nQueue:\n    ready:  90\n    unacked: 10\n```\n\nЭти десять сообщений находятся у consumer’ов в обработке.\n\n### 5. Consumer обрабатывает сообщение\n\n```python\nimport json\nimport logging\n\nlogger = logging.getLogger(__name__)\n\n\ndef process_message(channel, method, properties, body: bytes) -> None:\n    try:\n        message = json.loads(body)\n\n        process_payment(message[\"payment_id\"])\n\n        channel.basic_ack(\n            delivery_tag=method.delivery_tag,\n        )\n\n    except TemporaryError:\n        channel.basic_nack(\n            delivery_tag=method.delivery_tag,\n            requeue=True,\n        )\n\n    except Exception:\n        logger.exception(\"Permanent message processing error\")\n\n        channel.basic_nack(\n            delivery_tag=method.delivery_tag,\n            requeue=False,\n        )\n```\n\n### Положительное подтверждение: `basic.ack`\n\nПосле успешного выполнения операции consumer отправляет:\n\n```python\nchannel.basic_ack(\n    delivery_tag=method.delivery_tag,\n)\n```\n\nЭто означает:\n\n```text\nConsumer:\n    Сообщение успешно обработано.\n    RabbitMQ больше не отвечает за него.\n\nRabbitMQ:\n    Удаляет сообщение из очереди.\n```\n\nПодтверждение нужно отправлять после фактического завершения необходимой операции:\n\n```python\nsave_to_database()\nsend_external_request()\nupdate_status()\n\nchannel.basic_ack(delivery_tag)\n```\n\nНо порядок зависит от бизнес-логики. Обычно подтверждение отправляется после фиксации результата в базе данных или другом надёжном хранилище. После получения `ack` RabbitMQ имеет право окончательно удалить сообщение.\n\n### Отрицательное подтверждение: `basic.nack`\n\n`basic.nack` означает, что consumer не смог нормально обработать сообщение.\n\n#### Вернуть сообщение в очередь\n\n```python\nchannel.basic_nack(\n    delivery_tag=method.delivery_tag,\n    requeue=True,\n)\n```\n\nRabbitMQ возвращает сообщение в очередь, после чего оно может быть отправлено:\n\n- тому же consumer;\n    \n- другому consumer;\n    \n- сразу же повторно, если очередь и `prefetch` это позволяют.\n    \n\nПри повторной доставке RabbitMQ устанавливает:\n\n```text\nredelivered = true\n```\n\nЭтот флаг показывает, что сообщение уже доставлялось раньше, но не гарантирует, что предыдущий consumer действительно успел начать его обработку. \n\n#### Не возвращать сообщение\n\n```python\nchannel.basic_nack(\n    delivery_tag=method.delivery_tag,\n    requeue=False,\n)\n```\n\nТогда сообщение:\n\n```text\nесть Dead Letter Exchange\n        |\n        v\nпопадает в DLX / DLQ\n\nнет Dead Letter Exchange\n        |\n        v\nудаляется\n```\n\nТак обычно поступают с сообщениями, которые невозможно обработать:\n\n- повреждённый JSON;\n    \n- отсутствуют обязательные поля;\n    \n- неизвестная версия схемы;\n    \n- операция принципиально недопустима;\n    \n- превышено количество повторных попыток.\n    \n\nПоведение `requeue=False` официально определяется так: сообщение направляется в Dead Letter Exchange, если он настроен, иначе отбрасывается. \n\n### `basic.reject` и `basic.nack`\n\nОба метода позволяют отклонить сообщение:\n\n```python\nchannel.basic_reject(\n    delivery_tag=tag,\n    requeue=False,\n)\n```\n\n```python\nchannel.basic_nack(\n    delivery_tag=tag,\n    multiple=False,\n    requeue=False,\n)\n```\n\nОсновное различие:\n\n- `basic.reject` работает с одним сообщением;\n    \n- `basic.nack` может отклонить одно сообщение или сразу несколько через `multiple=True`.\n    \n\n`basic.nack` является расширением RabbitMQ для AMQP 0-9-1. \n\n### Пакетное подтверждение\n\nМожно подтвердить сразу несколько сообщений:\n\n```python\nchannel.basic_ack(\n    delivery_tag=42,\n    multiple=True,\n)\n```\n\nЭто подтвердит все неподтверждённые доставки на этом канале с тегами до `42` включительно.\n\nНапример:\n\n```text\nUnacked delivery tags:\n\n39\n40\n41\n42\n```\n\nПосле:\n\n```text\nbasic_ack(delivery_tag=42, multiple=True)\n```\n\nбудут подтверждены все четыре сообщения.\n\nТакой подход уменьшает количество сетевых запросов, но требует осторожности при параллельной обработке: нельзя подтвердить сообщение, которое ещё не было успешно обработано.\n\n### Что происходит при падении consumer\n\nПредположим:\n\n```text\n1. RabbitMQ доставил сообщение.\n2. Consumer начал обработку.\n3. Consumer записал результат в БД.\n4. Consumer упал до отправки ack.\n```\n\nRabbitMQ видит, что канал или соединение закрылись, а сообщение осталось в состоянии `unacked`.\n\nТогда RabbitMQ автоматически возвращает сообщение в очередь:\n\n```text\nunacked -> ready -> повторная доставка\n```\n\nОно может быть передано другому consumer. Автоматический `requeue` выполняется при:\n\n- падении процесса consumer;\n    \n- закрытии канала;\n    \n- закрытии соединения;\n    \n- потере TCP-соединения;\n    \n- некоторых протокольных ошибках канала. \n    \n\n### Почему сообщение может обработаться дважды\n\nРассмотрим ситуацию:\n\n```text\nConsumer                     PostgreSQL                 RabbitMQ\n    |                            |                         |\n    | INSERT payment_result     |                         |\n    |-------------------------->|                         |\n    | COMMIT                     |                         |\n    |<--------------------------|                         |\n    |                                                      |\n    | basic.ack ------------------------------------------>|\n    X соединение оборвалось\n```\n\nРезультат уже сохранён в PostgreSQL, но RabbitMQ мог не получить `ack`.\n\nБрокер повторно доставит сообщение:\n\n```text\npayment_id = 451\nredelivered = true\n```\n\nПоэтому ручные подтверждения обеспечивают семантику **at least once**:\n\n```text\nсообщение будет обработано один или более раз\n```\n\nОни не обеспечивают автоматически `exactly once`. Consumer должен быть идемпотентным. RabbitMQ рекомендует проектировать consumers так, чтобы повторная доставка не нарушала состояние системы. \n\nПример идемпотентности:\n\n```sql\nCREATE TABLE processed_messages (\n    message_id UUID PRIMARY KEY,\n    processed_at TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n```\n\nConsumer внутри транзакции проверяет `message_id`:\n\n```python\nasync with database.transaction():\n    inserted = await save_message_id_if_absent(message_id)\n\n    if not inserted:\n        # Сообщение уже обрабатывалось.\n        return\n\n    await perform_business_operation()\n```\n\nПосле успешной фиксации транзакции отправляется `ack`.\n\n### Автоматическое подтверждение\n\nПри `auto_ack=True` RabbitMQ считает сообщение успешно доставленным сразу после его отправки consumer’у:\n\n```python\nchannel.basic_consume(\n    queue=\"payments\",\n    on_message_callback=process_message,\n    auto_ack=True,\n)\n```\n\nСхема:\n\n```text\nRabbitMQ отправил сообщение\n        |\n        v\nRabbitMQ сразу считает его обработанным\n        |\n        v\nConsumer начинает работу\n```\n\nЕсли consumer упадёт во время обработки, сообщение уже не будет возвращено в очередь.\n\n```text\nДоставка -> автоматическое удаление -> падение consumer\n                                     -> сообщение потеряно\n```\n\nАвтоматический режим даёт высокую пропускную способность, но снижает надёжность и может перегрузить consumer большим количеством сообщений в памяти. Для важных бизнес-операций обычно используют `auto_ack=False`. \n\n### Как работает prefetch\n\n`prefetch_count` ограничивает количество сообщений, которые RabbitMQ может передать consumer’у без получения подтверждений.\n\n```python\nchannel.basic_qos(prefetch_count=10)\n```\n\nОзначает:\n\n```text\nConsumer получил 10 сообщений\n        |\n        v\nRabbitMQ временно прекращает отправку этому consumer\n        |\n        v\nConsumer отправляет ack\n        |\n        v\nRabbitMQ отправляет следующее сообщение\n```\n\nДля RabbitMQ значение применяется отдельно к каждому новому consumer:\n\n```text\nConsumer A: максимум 10 unacked\nConsumer B: максимум 10 unacked\nConsumer C: максимум 10 unacked\n```\n\nЗначение `0` означает отсутствие ограничения. \n\n#### `prefetch_count=1`\n\n```python\nchannel.basic_qos(prefetch_count=1)\n```\n\nRabbitMQ не отправит consumer’у новое сообщение, пока тот не подтвердит предыдущее.\n\n```text\nConsumer A обрабатывает M1\nConsumer B свободен\n\nСледующее M2 -> Consumer B\n```\n\nЭто полезно для тяжёлых задач и более равномерного распределения, но может снизить общую производительность. \n\n### Опасность бесконечного requeue\n\nПлохая схема:\n\n```python\nexcept Exception:\n    channel.basic_nack(\n        delivery_tag=tag,\n        requeue=True,\n    )\n```\n\nЕсли ошибка постоянная, получится цикл:\n\n```text\nполучение\n   |\nошибка\n   |\nrequeue\n   |\nповторное получение\n   |\nошибка\n   |\nrequeue\n```\n\nЭто создаёт нагрузку на CPU и сеть. RabbitMQ отдельно предупреждает о возможности таких циклов повторной доставки. \n\nОбычно применяют:\n\n```text\nосновная очередь\n      |\n      | ошибка\n      v\nretry-очередь с TTL\n      |\n      | через некоторое время\n      v\nосновная очередь\n      |\n      | превышен retry limit\n      v\ndead-letter queue\n```\n\nКоличество попыток можно хранить в заголовке сообщения или определять через механизм dead lettering.\n\n### Тайм-аут подтверждения\n\nВ RabbitMQ 4.3 timeout подтверждения поддерживается только quorum queues. Если consumer слишком долго не подтверждает сообщение, RabbitMQ закрывает его канал с ошибкой `PRECONDITION_FAILED`, а неподтверждённые сообщения этого канала возвращаются в очередь. Значение по умолчанию — 30 минут; проверка выполняется периодически. \n\n### Consumer acknowledgement и publisher confirm — не одно и то же\n\nЭто два независимых механизма:\n\n```text\nProducer -- publisher confirm --> RabbitMQ\nConsumer -- consumer ack -------> RabbitMQ\n```\n\n`Publisher confirm` означает:\n\n```text\nRabbitMQ принял ответственность за опубликованное сообщение.\n```\n\n`Consumer ack` означает:\n\n```text\nConsumer принял и успешно обработал доставленное сообщение.\n```\n\nПодтверждение от consumer не отправляется напрямую producer’у. RabbitMQ отдельно ведёт состояние публикации и состояние доставки.\n\n### Итоговая схема надёжной обработки\n\n```text\n1. Consumer подписывается с auto_ack=False.\n2. RabbitMQ доставляет сообщение и присваивает delivery_tag.\n3. Сообщение переходит из ready в unacked.\n4. Consumer валидирует данные.\n5. Consumer выполняет идемпотентную бизнес-операцию.\n6. После успешного commit отправляется basic.ack.\n7. При временной ошибке применяется контролируемый retry.\n8. При постоянной ошибке сообщение направляется в DLQ.\n9. Если consumer падает до ack, RabbitMQ повторно доставляет сообщение.\n```\n\nГлавный принцип:\n\n```text\nack отправляется не после получения сообщения,\nа после успешного завершения всей необходимой обработки.\n```"
  popularity = 2.63

