[[questions]]
  id = 11
  question = "Какие сообщения и данные обычно отправляют через RabbitMQ?"
  answer = "### Что именно передают через RabbitMQ\n\nRabbitMQ не задаёт формат сообщения. Для брокера тело сообщения — это массив байтов; он обычно не понимает содержимое JSON, Protobuf или другого формата. RabbitMQ маршрутизирует сообщение по `exchange`, `routing_key`, bindings и иногда headers. Структурированные данные обычно сериализуют в JSON, Protocol Buffers, MessagePack и другие форматы. \n\n### 1. Команды и фоновые задачи\n\nКоманда сообщает потребителю, что нужно сделать:\n\n```json\n{\n  \"task_id\": \"task-7842\",\n  \"user_id\": 125,\n  \"report_type\": \"monthly\",\n  \"period\": \"2026-07\"\n}\n```\n\nПримеры:\n\n```text\nemail.send\nreport.generate\nimage.resize\npayment.process\nsearch.index_document\nnotification.push\n```\n\nТипичные задачи:\n\n- отправка email или push-уведомления;\n    \n- генерация PDF;\n    \n- обработка изображения;\n    \n- импорт большого файла;\n    \n- пересчёт статистики;\n    \n- обращение к медленному внешнему API;\n    \n- выполнение Celery task.\n    \n\nВ Work Queue несколько воркеров обычно конкурируют за сообщения, поэтому каждое сообщение обрабатывается одним из них. RabbitMQ прямо описывает task queues как способ отложить ресурсоёмкую работу и распределить её между воркерами. \n\n### 2. События\n\nСобытие сообщает, что что-то уже произошло:\n\n```json\n{\n  \"event_id\": \"evt-018a\",\n  \"order_id\": 8421,\n  \"user_id\": 125,\n  \"total\": \"149.90\",\n  \"currency\": \"AZN\",\n  \"occurred_at\": \"2026-07-27T18:40:00Z\"\n}\n```\n\nПримеры названий:\n\n```text\nuser.registered\norder.created\npayment.completed\npayment.failed\nfile.uploaded\nprofile.avatar.changed\n```\n\nНа одно событие могут реагировать разные сервисы:\n\n```text\npayment.completed\n        |\n        +--> Notification Service\n        +--> Analytics Service\n        +--> Accounting Service\n        +--> Loyalty Service\n```\n\nДля такой схемы используются `fanout` или `topic` exchange. `Fanout` отправляет копию сообщения во все связанные очереди, а `topic` позволяет сервисам подписываться только на нужные шаблоны routing key. \n\n### 3. Сигналы для синхронизации сервисов\n\nЧерез RabbitMQ часто отправляют небольшие сообщения о необходимости обновить локальное состояние:\n\n```json\n{\n  \"product_id\": 512,\n  \"version\": 7\n}\n```\n\nПримеры:\n\n```text\ncache.invalidate\nsearch.product.reindex\npermissions.changed\nconfiguration.updated\ninventory.changed\n```\n\nЗдесь обычно передают идентификатор объекта и версию изменения, а не всю таблицу базы данных.\n\n### 4. Уведомления\n\nСообщение может содержать данные для отправки пользователю:\n\n```json\n{\n  \"notification_id\": \"ntf-281\",\n  \"user_id\": 125,\n  \"channel\": \"email\",\n  \"template\": \"payment_success\",\n  \"variables\": {\n    \"payment_id\": 821,\n    \"amount\": \"35.00\",\n    \"currency\": \"AZN\"\n  }\n}\n```\n\nОдин сервис формирует бизнес-событие, а отдельный consumer решает, отправить email, SMS, push или WebSocket-сообщение.\n\n### 5. RPC-запросы и ответы\n\nRabbitMQ поддерживает request/reply:\n\n```json\n{\n  \"user_id\": 125\n}\n```\n\nВ свойствах сообщения указываются:\n\n```text\ncorrelation_id = \"req-7821\"\nreply_to       = \"response.queue\"\n```\n\nОтвет содержит тот же `correlation_id`, чтобы клиент мог сопоставить его с запросом. RabbitMQ документирует `correlation_id` и `reply_to` как стандартные свойства для RPC-паттерна. \n\nRPC через брокер стоит применять осторожно: он создаёт временную связанность между сервисами и может превратить асинхронную архитектуру в сложный аналог HTTP-вызовов.\n\n### 6. Логи и технические события\n\nЧерез RabbitMQ могут передаваться:\n\n```json\n{\n  \"level\": \"ERROR\",\n  \"service\": \"payment-service\",\n  \"message\": \"Provider timeout\",\n  \"trace_id\": \"trace-721\",\n  \"timestamp\": \"2026-07-27T18:42:10Z\"\n}\n```\n\nПримеры:\n\n```text\nlogs.error\naudit.user_login\nsecurity.access_denied\nmonitoring.service_unavailable\n```\n\nДля очень большого непрерывного потока логов и аналитических данных обычно рассматривают специализированные системы или RabbitMQ Streams, а обычные очереди оставляют для рабочих сообщений и событий.\n\n### Из чего состоит сообщение\n\nПрактически сообщение состоит из трёх частей.\n\n#### Тело — `body`\n\nОсновные данные:\n\n```json\n{\n  \"payment_id\": 451,\n  \"status\": \"completed\"\n}\n```\n\n#### Свойства сообщения\n\n```text\ncontent_type    = application/json\ncontent_encoding = utf-8\ntype            = payment.completed\nmessage_id      = evt-0192\ncorrelation_id  = operation-828\ntimestamp       = 1785177600\ndelivery_mode   = 2\nexpiration      = 60000\napp_id          = payment-service\n```\n\nRabbitMQ поддерживает свойства `delivery_mode`, `type`, `headers`, `content_type`, `message_id`, `correlation_id`, `reply_to`, `expiration`, `timestamp`, `user_id` и `app_id`. Большинство из них устанавливает publisher.\n\n#### Пользовательские headers\n\n```json\n{\n  \"trace_id\": \"trace-721\",\n  \"schema_version\": 2,\n  \"tenant_id\": \"company-15\",\n  \"source\": \"payment-service\"\n}\n```\n\nHeaders удобно использовать для технической метаинформации, трассировки, версии схемы и маршрутизации. Основные бизнес-данные лучше оставлять в `body`.\n\n### Что обычно не следует отправлять\n\n#### Большие файлы\n\nНе стоит помещать в сообщение PDF, видео, архивы и крупные изображения.\n\nЛучше:\n\n```json\n{\n  \"file_id\": \"file-129\",\n  \"storage_key\": \"reports/2026/07/report-129.pdf\",\n  \"bucket\": \"documents\",\n  \"checksum\": \"sha256:...\"\n}\n```\n\nСам файл хранится в S3/MinIO, а через RabbitMQ передаётся ссылка или ключ объекта. В актуальной документации RabbitMQ значение `max_message_size` по умолчанию составляет 16 MiB, но даже допустимые крупные сообщения увеличивают нагрузку на сеть, память, диски и репликацию. \n\n#### Объекты ORM и Python-объекты\n\nНе следует отправлять:\n\n```python\nbody = pickle.dumps(user_model)\n```\n\nЭто связывает producer и consumer с конкретным языком, классом и версией кода. `pickle` также опасен при обработке недоверенных данных.\n\nЛучше отправить независимый контракт:\n\n```json\n{\n  \"user_id\": 125,\n  \"email\": \"user@example.com\",\n  \"schema_version\": 1\n}\n```\n\n#### Чувствительные данные без необходимости\n\nНе следует без причины передавать:\n\n- пароли;\n    \n- приватные ключи;\n    \n- полные данные банковской карты;\n    \n- access- и refresh-токены;\n    \n- персональные данные, не нужные consumer.\n    \n\nОбычно передают идентификатор:\n\n```json\n{\n  \"payment_id\": 451\n}\n```\n\nConsumer получает необходимые данные из доступного ему защищённого источника.\n\n### Практический формат события\n\n```json\n{\n  \"event_id\": \"0190f81a-8972-7d30-a021-72d774148f41\",\n  \"event_type\": \"payment.completed\",\n  \"event_version\": 1,\n  \"occurred_at\": \"2026-07-27T18:40:00Z\",\n  \"producer\": \"payment-service\",\n  \"data\": {\n    \"payment_id\": 451,\n    \"user_id\": 125,\n    \"amount\": \"35.00\",\n    \"currency\": \"AZN\"\n  }\n}\n```\n\nСвойства:\n\n```text\nexchange:       domain.events\nrouting_key:    payment.completed\ncontent_type:   application/json\ntype:           payment.completed\nmessage_id:     0190f81a-8972-7d30-a021-72d774148f41\ndelivery_mode:  persistent\n```\n\nГлавный принцип: через RabbitMQ передают не произвольные выгрузки базы данных, а небольшие самостоятельные сообщения — команду, событие или уведомление — с понятным контрактом, идентификатором, типом и версией схемы."
  popularity = 2.63

