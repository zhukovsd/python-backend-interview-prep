  id = 9
  question = "Какой метод должен быть реализован в классе, чтобы его экземпляр можно было использовать как декоратор функций?"
  answer = "Чтобы экземпляр класса можно было использовать как декоратор функции, в классе должен быть реализован метод:\n\n```python\n__call__\n```\n\nПотому что декоратор должен быть вызываемым объектом — `callable`. В Python объект становится вызываемым, если его класс реализует `__call__`. Официальная документация описывает `object.__call__` как метод, который вызывается при вызове экземпляра как функции.\n\n\n---\n\n### Пример\n\n```python\nfrom functools import wraps\n\n\nclass Logger:\n    def __call__(self, func):\n        @wraps(func)\n        def wrapper(*args, **kwargs):\n            print(f\"Вызов функции: {func.__name__}\")\n            return func(*args, **kwargs)\n\n        return wrapper\n\n\nlogger = Logger()\n\n\n@logger\ndef add(a, b):\n    return a + b\n\n\nprint(add(2, 3))\n```\n\nРезультат:\n\n```text\nВызов функции: add\n5\n```\n\n---\n\n### Что здесь происходит\n\nЗапись:\n\n```python\n@logger\ndef add(a, b):\n    return a + b\n```\n\nэквивалентна:\n\n```python\ndef add(a, b):\n    return a + b\n\nadd = logger(add)\n```\n\nА так как `logger` — это экземпляр класса, выражение:\n\n```python\nlogger(add)\n```\n\nработает только потому, что у класса `Logger` есть метод:\n\n```python\ndef __call__(self, func):\n    ...\n```\n\nТо есть Python фактически вызывает:\n\n```python\nLogger.__call__(logger, add)\n```\n\n---\n\n### Схема\n\n```text\nLogger()\n↓\nсоздаётся объект logger\n\n@logger\n↓\nPython вызывает logger(add)\n\nlogger(add)\n↓\nсрабатывает logger.__call__(add)\n\n__call__ возвращает wrapper\n↓\nadd теперь указывает на wrapper\n```\n\n---\n\n### Декоратор-класс с параметрами\n\nЧасто класс-декоратор используют, когда декоратору нужны настройки.\n\n```python\nfrom functools import wraps\n\n\nclass Repeat:\n    def __init__(self, times):\n        self.times = times\n\n    def __call__(self, func):\n        @wraps(func)\n        def wrapper(*args, **kwargs):\n            result = None\n\n            for _ in range(self.times):\n                result = func(*args, **kwargs)\n\n            return result\n\n        return wrapper\n\n\n@Repeat(3)\ndef say_hello():\n    print(\"Hello\")\n\n\nsay_hello()\n```\n\nРезультат:\n\n```text\nHello\nHello\nHello\n```\n\n---\n\n### Как это раскрывается\n\n```python\n@Repeat(3)\ndef say_hello():\n    print(\"Hello\")\n```\n\nпримерно равно:\n\n```python\ndef say_hello():\n    print(\"Hello\")\n\ndecorator = Repeat(3)\nsay_hello = decorator(say_hello)\n```\n\nРазбор:\n\n```text\nRepeat(3)\n↓\nвызывается __init__\n↓\nсоздаётся объект decorator с self.times = 3\n\ndecorator(say_hello)\n↓\nвызывается __call__\n↓\nвозвращается wrapper\n```\n\n---\n\n### Главное\n\nМинимальный шаблон класса-декоратора:\n\n```python\nfrom functools import wraps\n\n\nclass MyDecorator:\n    def __call__(self, func):\n        @wraps(func)\n        def wrapper(*args, **kwargs):\n            return func(*args, **kwargs)\n\n        return wrapper\n```\n\nИспользование:\n\n```python\ndecorator = MyDecorator()\n\n\n@decorator\ndef func():\n    ...\n```\n\nИтог:\n\n```text\nэкземпляр класса может быть декоратором,\nесли он является callable-объектом\n\nдля этого в классе нужен метод __call__\n```"
