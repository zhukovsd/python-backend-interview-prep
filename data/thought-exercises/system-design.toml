[category]
  id = 8
  title = "System Design"

[[exercises]]
  id = 1
  exercise = "В компании есть несколько внутренних приложений, например биллинг, CRM и веб-портал, которым нужно работать с внешним эквайером: принимать платежи, делать возвраты, проверять статусы и получать чеки.  \n\nНужно спроектировать единый интеграционный сервис, через который внутренние системы будут взаимодействовать с внешними эквайерами, например Сбербанком, ЮKassa и другими. В дальнейшем система должна поддерживать подключение сразу нескольких эквайеров.  \n\nФункциональные требования:  \n\n- генерация ссылки на оплату с автоматическим выбором эквайринга\n- информирование систем-потребителей об изменении статуса платежа\n- передача чека в системы-потребители\n\nТребуется подготовить краткое описание или документ, в котором нужно:  \n\n1. описать ключевые компоненты архитектуры сервиса\n2. продумать взаимодействие внутренних сервисов с интеграционной прослойкой\n3. описать API-контракт между внутренними системами и прослойкой\n4. описать взаимодействие прослойки с внешним эквайером, включая вебхуки, подписи и другие аспекты\n5. определить, какие данные нужно хранить и зачем\n6. предложить механизм обработки ошибок, таймаутов, повторов и защиты от дублей\n7. показать, как архитектура будет расширяться под новых эквайеров\n8. продумать безопасность: аутентификацию, защиту от подмены, шифрование и другое\n9. описать мониторинг сервиса\n10 .перечислить возможные риски и ограничения на старте"

