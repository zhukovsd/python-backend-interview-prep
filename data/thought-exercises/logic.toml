[[exercises]]
  id = 1
  exercise = "Есть две целочисленные переменные а и b.\r\nОни содержат какие-то неизвестные вам\r\nзначения. Пускай а = M, b = N.\r\nНужно их значения поменять местами.\r\nНо, нельзя \"a, b = b, a\" и использовать\r\nпромежуточную переменную, регистр, ячейку\r\nпамяти.\r\nМожно использовать любую математику.\r\nМожно за несколько шагов."
