  id = 20
  question = "Отфильтруй список по истинности и наличию элементов во втором списке"
  answer = "**Условие задачи**\nНужно сказать результат выполнения кода ниже и объяснить как он работает\n```python\na = ['a', 'b', 3, 'true', True, 1, 0]\nb = ['0', 1, 3, 5, 7]\n\nc = [x for x in a if x and x in b]\n\nprint(f\"{c = }\")\n```\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* Список `c` собирается через list comprehension.\r\n* В результат попадут только те элементы `x`, для которых условие `x and x in b` истинно.\r\n* Сначала проверяется истинность самого `x`.\r\n* Если `x` ложный, проверка `x in b` уже не выполняется.\r\n* В Python число `0` является ложным значением.\r\n* В Python `True == 1`, поэтому `True in b` вернёт `True`, так как в списке `b` есть число `1`.\r\n  \r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\n```python\r\na = ['a', 'b', 3, 'true', True, 1, 0]\r\nb = ['0', 1, 3, 5, 7]\r\n\r\nc = [x for x in a if x and x in b]\r\n\r\nprint(f\"{c = }\")\r\n```\r\n\r\nРезультат:\r\n\r\n```text\r\nc = [3, True, 1]\r\n```\r\n\r\nРазбор по элементам:\r\n\r\n```text\r\n'a'    -> truthy, но 'a' нет в b          -> не попадает\r\n'b'    -> truthy, но 'b' нет в b          -> не попадает\r\n3      -> truthy и 3 есть в b             -> попадает\r\n'true' -> truthy, но 'true' нет в b       -> не попадает\r\nTrue   -> truthy и True == 1, а 1 есть в b -> попадает\r\n1      -> truthy и 1 есть в b             -> попадает\r\n0      -> falsy                           -> не попадает\r\n```\r\n\r\nКлючевой момент здесь — проверка:\r\n\r\n```python\r\nx and x in b\r\n```\r\n\r\nОна означает: сначала проверить, является ли `x` истинным значением, и только потом проверить наличие `x` в списке `b`.\r\n\r\nЭлемент `0` не попадает в результат, потому что `0` является ложным значением.\r\n\r\nЭлемент `True` попадает в результат, потому что в Python:\r\n\r\n```python\r\nTrue == 1\r\n```\r\n\r\nпоэтому выражение:\r\n\r\n```python\r\nTrue in [0, 1, 3, 5, 7]\r\n```\r\n\r\nбудет истинным.\r\n{{< /details >}}\r\n"
  filepath = "list-truthy-filter"

[[tasks]]
  id = 21
  question = "Сказать результат выполнения вложенного цикла по двум спискам и сложение элементов"
  answer = "**Условие задачи**\nДаны два списка a и b из предыдущей задачи. Необходимо сказать что будет результатом вывода print\n```python\nfor x in a:\n    for y in b:\n        print(x + y)\n```\nКак изменить код, чтобы для строковых была конкатенация, для int - сумма, а остальные варианты пропускались?\nНашиши оптимизтрованный вариант.\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* В Python оператор `+` работает по-разному для разных типов.\r\n* Строка + строка даёт конкатенацию.\r\n* Число + число даёт сумму.\r\n* Строка + число вызовет `TypeError`.\r\n* В исходном цикле программа остановится на первой несовместимой паре.\r\n* Важно учитывать, что `bool` является подклассом `int`, поэтому `True` лучше отдельно исключить, если нужны именно целые числа.\r\n  \r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\nИсходные списки:\r\n\r\n```python\r\na = ['a', 'b', 3, 'true', True, 1, 0]\r\nb = ['0', 1, 3, 5, 7]\r\n\r\nfor x in a:\r\n    for y in b:\r\n        print(x + y)\r\n```\r\n\r\nСначала будет выполнено:\r\n\r\n```python\r\n'a' + '0'\r\n```\r\n\r\nЭто корректная конкатенация строк, поэтому на экран выведется:\r\n\r\n```text\r\na0\r\n```\r\n\r\nПосле этого будет попытка выполнить:\r\n\r\n```python\r\n'a' + 1\r\n```\r\n\r\nЭто уже ошибка, потому что строку нельзя складывать с числом.\r\n\r\nИтоговый вывод:\r\n\r\n```text\r\na0\r\nTypeError: can only concatenate str (not \"int\") to str\r\n```\r\n\r\nОстальные пары обработаны не будут, потому что программа остановится на ошибке.\r\n\r\nОптимизированный вариант:\r\n\r\n```python\r\na = ['a', 'b', 3, 'true', True, 1, 0]\r\nb = ['0', 1, 3, 5, 7]\r\n\r\na_strings = [x for x in a if type(x) is str]\r\nb_strings = [x for x in b if type(x) is str]\r\n\r\na_ints = [x for x in a if type(x) is int]\r\nb_ints = [x for x in b if type(x) is int]\r\n\r\nfor x in a_strings:\r\n    for y in b_strings:\r\n        print(x + y)\r\n\r\nfor x in a_ints:\r\n    for y in b_ints:\r\n        print(x + y)\r\n```\r\n\r\nРезультат:\r\n\r\n```text\r\na0\r\nb0\r\ntrue0\r\n4\r\n6\r\n8\r\n10\r\n2\r\n4\r\n6\r\n8\r\n1\r\n3\r\n5\r\n7\r\n```\r\n\r\nЗдесь сначала отдельно выбираются строки, отдельно целые числа. После этого программа обрабатывает только совместимые пары:\r\n\r\n```python\r\nstr + str\r\nint + int\r\n```\r\n\r\nВсе остальные варианты пропускаются. Используется `type(x) is int`, а не `isinstance(x, int)`, чтобы `True` не считался числом. В Python `bool` наследуется от `int`, поэтому `isinstance(True, int)` вернул бы `True`.\r\n{{< /details >}}\r\n"
  filepath = "nested-loops-sum"

