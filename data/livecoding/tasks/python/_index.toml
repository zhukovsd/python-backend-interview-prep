  question = "Порядок поиска атрибута при множественном наследовании-2"
  answer = "**Условие зададчи:** \nДаны два родительских класса с одноименным атрибутом класса x и дочерний класс, который наследуется сразу от обоих родителей.\n```python\nclass A:\n    x = 5\n\nclass B:\n    x = 10\n\nclass C(A, B):\n    pass\n```\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* У класса `C` используется множественное наследование.\r\n* Оба родительских класса имеют атрибут `x`.\r\n* В Python порядок поиска атрибутов определяется MRO.\r\n* Для `class C(A, B)` поиск идёт так: `C -> A -> B -> object`.\r\n* Так как у `C` собственного атрибута `x` нет, Python сначала найдёт `x` в классе `A`.\r\n  \r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\n```python\r\nclass A:\r\n    x = 5\r\n\r\nclass B:\r\n    x = 10\r\n\r\nclass C(A, B):\r\n    pass\r\n\r\n\r\nprint(C.x)\r\nprint(C.__mro__)\r\n```\r\n\r\nРезультат:\r\n\r\n```text\r\n5\r\n(<class '__main__.C'>, <class '__main__.A'>, <class '__main__.B'>, <class 'object'>)\r\n```\r\n\r\nПри обращении:\r\n\r\n```python\r\nC.x\r\n```\r\n\r\nPython ищет атрибут `x` по MRO — method resolution order:\r\n\r\n```text\r\nC -> A -> B -> object\r\n```\r\n\r\nВ самом классе `C` атрибута `x` нет. Затем Python смотрит в первый родительский класс `A` и находит:\r\n\r\n```python\r\nx = 5\r\n```\r\n\r\nПоэтому результат:\r\n\r\n```text\r\n5\r\n```\r\n\r\nАтрибут `B.x` равен `10`, но до класса `B` поиск уже не дойдёт, потому что нужный атрибут был найден в `A`.\r\n\r\nЕсли изменить порядок наследования:\r\n\r\n```python\r\nclass C(B, A):\r\n    pass\r\n\r\n\r\nprint(C.x)\r\n```\r\n\r\nРезультат будет:\r\n\r\n```text\r\n10\r\n```\r\n\r\nПотому что MRO изменится:\r\n\r\n```text\r\nC -> B -> A -> object\r\n```\r\n\r\n{{< /details >}}\r\n"
