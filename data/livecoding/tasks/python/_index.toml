  question = "Разобрать метакласс с попыткой реализации Singleton"
  answer = "**Условие задачи**\nРазберите поведение метакласса и определите, какую задачу пытается решить данная реализация. Нужно понять, как работает переопределение __new__ в метаклассе и к чему приведёт сохранение экземпляра в атрибуте класса.\n```python\nclass NewCls(type):\n    _instance = None\n\n    def __new__(cls, *args, **kwargs):\n        if not cls._instance:\n            cls._instance = super().__new__(cls, *args, **kwargs)\n        return cls._instance\n```\nЧто выведут принты?\n```python\ntest = NewCls(\"X\", (object,), {\"a\": 1, \"b\": 2})\nprint(test.a) >>\n\ntest2 = NewCls(\"X\", (object,), {\"a\": 12, \"b\": 22})\nprint(test2.a) >>\n```\nИзменили код, что теперь выведут принты?\n```python\nclass NewCls(type):\n    _instance = None\n\n    def __new__(cls, *args, **kwargs):\n        if not cls._instance:\n            cls._instance = super().__new__(cls, *args, **kwargs)\n        return cls._instance\n\n    def __init__(self, *args):\n        self.a = args\n\ntest = NewCls(\"X\", (object,), {\"a\": 1, \"b\": 2})\nprint(test.a) >>\n\ntest2 = NewCls(\"X\", (object,), {\"a\": 12, \"b\": 22})\nprint(test2.a) >>\n```\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* `NewCls` наследуется от `type`, значит это метакласс.\r\n* Вызов `NewCls(\"X\", (object,), {...})` динамически создаёт класс `X`.\r\n* Метод `__new__` отвечает за создание нового объекта-класса.\r\n* В `_instance` сохраняется первый созданный класс.\r\n* При повторном вызове новый класс уже не создаётся, возвращается тот же самый объект.\r\n* Такая реализация пытается сделать singleton, но не для экземпляров обычного класса, а для классов, создаваемых этим метаклассом.\r\n* Во втором примере добавлен `__init__`, который выполняется при каждом вызове `NewCls(...)` и перезаписывает атрибут `a`.\r\n\r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\nПервый вариант:\r\n\r\n```python\r\nclass NewCls(type):\r\n    _instance = None\r\n\r\n    def __new__(cls, *args, **kwargs):\r\n        if not cls._instance:\r\n            cls._instance = super().__new__(cls, *args, **kwargs)\r\n        return cls._instance\r\n\r\n\r\ntest = NewCls(\"X\", (object,), {\"a\": 1, \"b\": 2})\r\nprint(test.a)\r\n\r\ntest2 = NewCls(\"X\", (object,), {\"a\": 12, \"b\": 22})\r\nprint(test2.a)\r\n```\r\n\r\nРезультат:\r\n\r\n```text\r\n1\r\n1\r\n```\r\n\r\nПочему так:\r\n\r\n```python\r\ntest = NewCls(\"X\", (object,), {\"a\": 1, \"b\": 2})\r\n```\r\n\r\nПри первом вызове `_instance` ещё равен `None`, поэтому создаётся новый класс `X` с атрибутами:\r\n\r\n```python\r\na = 1\r\nb = 2\r\n```\r\n\r\nПоэтому:\r\n\r\n```python\r\nprint(test.a)\r\n```\r\n\r\nвыведет:\r\n\r\n```text\r\n1\r\n```\r\n\r\nДальше выполняется:\r\n\r\n```python\r\ntest2 = NewCls(\"X\", (object,), {\"a\": 12, \"b\": 22})\r\n```\r\n\r\nНо новый класс уже не создаётся, потому что `NewCls._instance` уже хранит первый созданный класс. Поэтому `test2` получает ссылку на тот же самый класс, что и `test`.\r\n\r\nФактически:\r\n\r\n```python\r\ntest is test2  # True\r\n```\r\n\r\nПоэтому `test2.a` всё ещё равно `1`.\r\n\r\nВторой вариант:\r\n\r\n```python\r\nclass NewCls(type):\r\n    _instance = None\r\n\r\n    def __new__(cls, *args, **kwargs):\r\n        if not cls._instance:\r\n            cls._instance = super().__new__(cls, *args, **kwargs)\r\n        return cls._instance\r\n\r\n    def __init__(self, *args):\r\n        self.a = args\r\n\r\n\r\ntest = NewCls(\"X\", (object,), {\"a\": 1, \"b\": 2})\r\nprint(test.a)\r\n\r\ntest2 = NewCls(\"X\", (object,), {\"a\": 12, \"b\": 22})\r\nprint(test2.a)\r\n```\r\n\r\nРезультат:\r\n\r\n```text\r\n('X', (<class 'object'>,), {'a': 1, 'b': 2})\r\n('X', (<class 'object'>,), {'a': 12, 'b': 22})\r\n```\r\n\r\nВо втором варианте после `__new__` вызывается `__init__` метакласса:\r\n\r\n```python\r\ndef __init__(self, *args):\r\n    self.a = args\r\n```\r\n\r\nЗдесь `self` — это созданный класс `X`, а `args` — аргументы, переданные в `NewCls(...)`:\r\n\r\n```python\r\n\"X\", (object,), {\"a\": 1, \"b\": 2}\r\n```\r\n\r\nПоэтому после первого создания `test.a` уже не равно `1`. Атрибут `a` перезаписывается кортежем аргументов:\r\n\r\n```python\r\n('X', (<class 'object'>,), {'a': 1, 'b': 2})\r\n```\r\n\r\nПри втором вызове новый класс снова не создаётся, возвращается тот же объект. Но `__init__` выполняется повторно и снова перезаписывает `a`:\r\n\r\n```python\r\n('X', (<class 'object'>,), {'a': 12, 'b': 22})\r\n```\r\n\r\nГлавная идея: `__new__` в этом метаклассе пытается реализовать singleton для создаваемых классов. Но во втором варианте `__init__` ломает ожидаемое поведение, потому что при каждом вызове заново меняет атрибут `a` у одного и того же сохранённого класса.\r\n{{< /details >}}\r\n"
  filepath = "metaclass-singleton-attempt"

[[tasks]]
  id = 17
  question = "Оптимизировать вычисление факториала"
  answer = "**Условие задачи**\nФункция работает слишком медленно на больших входных данных. Нужно предложить более эффективное решение, сохранив корректность результата.\n```python\ndef test(x):\n    y = 1\n    for i in range(1, x + 1):\n        y *= i\n    return y\n```\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* Функция считает факториал числа `x`.\r\n* Факториал — это произведение всех чисел от `1` до `x`.\r\n* Ручной цикл на Python работает медленнее на больших значениях.\r\n* Более эффективный вариант — использовать встроенную функцию `math.factorial()`.\r\n* Она уже оптимизирована и реализована быстрее, чем обычный Python-цикл.\r\n* Нужно также обработать отрицательные значения, потому что факториал для отрицательных целых чисел не определён.\r\n  \r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\n```python\r\nimport math\r\n\r\n\r\ndef test(x: int) -> int:\r\n    if x < 0:\r\n        raise ValueError(\"x must be non-negative\")\r\n\r\n    return math.factorial(x)\r\n```\r\n\r\nИсходная функция:\r\n\r\n```python\r\ndef test(x):\r\n    y = 1\r\n    for i in range(1, x + 1):\r\n        y *= i\r\n    return y\r\n```\r\n\r\nсчитает факториал числа `x`.\r\n\r\nНапример:\r\n\r\n```python\r\ntest(5)\r\n```\r\n\r\nдолжно вернуть:\r\n\r\n```text\r\n120\r\n```\r\n\r\nПотому что:\r\n\r\n```text\r\n1 * 2 * 3 * 4 * 5 = 120\r\n```\r\n\r\nОптимизированное решение использует `math.factorial(x)`. Оно сохраняет тот же результат, но работает быстрее, потому что это стандартная оптимизированная реализация факториала.\r\n\r\nПример:\r\n\r\n```python\r\nprint(test(5))   # 120\r\nprint(test(10))  # 3628800\r\n```\r\n\r\n{{< /details >}}\r\n"
  filepath = "optimize-factorial"

[[tasks]]
  id = 18
  question = "Что будет выведено при изменение словаря через другую переменную"
  answer = "**Условие задачи**\nДан словарь, который присваивается второй переменной. Необходимо определить, что будет выведено после изменения словаря через вторую переменную.\n```python\na = {'a': 1}\nb = a\nb['b'] = 2\n\nprint(f\"{a = }\")\nprint(f\"{b = }\")\n```\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* Словарь — изменяемый объект.\r\n* При выполнении `b = a` новый словарь не создаётся.\r\n* Переменные `a` и `b` начинают ссылаться на один и тот же объект.\r\n* Поэтому изменение через `b` также видно через `a`.\r\n* Операция `b['b'] = 2` добавляет новый ключ в общий словарь.\r\n\r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\n```python\r\na = {'a': 1}\r\nb = a\r\nb['b'] = 2\r\n\r\nprint(f\"{a = }\")\r\nprint(f\"{b = }\")\r\n```\r\n\r\nРезультат:\r\n\r\n```text\r\na = {'a': 1, 'b': 2}\r\nb = {'a': 1, 'b': 2}\r\n```\r\n\r\nПосле строки:\r\n\r\n```python\r\nb = a\r\n```\r\n\r\nпеременные `a` и `b` указывают на один и тот же словарь.\r\n\r\nПоэтому при изменении:\r\n\r\n```python\r\nb['b'] = 2\r\n```\r\n\r\nменяется не отдельная копия, а исходный объект словаря. Из-за этого при выводе `a` и `b` результат будет одинаковым.\r\n\r\nПроверить это можно так:\r\n\r\n```python\r\nprint(a is b)  # True\r\n```\r\n\r\nЕсли нужен отдельный словарь, нужно сделать копию:\r\n\r\n```python\r\na = {'a': 1}\r\nb = a.copy()\r\n\r\nb['b'] = 2\r\n\r\nprint(f\"{a = }\")  # a = {'a': 1}\r\nprint(f\"{b = }\")  # b = {'a': 1, 'b': 2}\r\n```\r\n\r\n{{< /details >}}\r\n"
  filepath = "dict-reference-mutation"

[[tasks]]
  id = 19
  question = "Определить разницу между изменяемыми и неизменяемыми объектами"
  answer = "**Условие задачи**\nДаны список и кортеж. Нужно определить, что произойдет при попытке изменить элемент списка и элемент кортежа по индексу.\n```python\na = [1, 2, 3, 4, 5]\na[2] = 100\n\nprint(f\"{a = }\")\n\nb = (1, 2, 3, 4, 5)\nb[3] = 100\n\nprint(f\"{b = }\")\n```\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* Список `list` является изменяемым типом данных.\r\n* Поэтому элемент списка можно изменить по индексу.\r\n* Кортеж `tuple` является неизменяемым типом данных.\r\n* Поэтому попытка изменить элемент кортежа по индексу приведёт к ошибке.\r\n* После ошибки выполнение программы остановится, если ошибка не обработана через `try/except`.\r\n  \r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\n```python\r\na = [1, 2, 3, 4, 5]\r\na[2] = 100\r\n\r\nprint(f\"{a = }\")\r\n\r\nb = (1, 2, 3, 4, 5)\r\nb[3] = 100\r\n\r\nprint(f\"{b = }\")\r\n```\r\n\r\nСначала список изменится успешно:\r\n\r\n```python\r\na[2] = 100\r\n```\r\n\r\nИндекс `2` — это третий элемент списка. Поэтому список станет таким:\r\n\r\n```text\r\na = [1, 2, 100, 4, 5]\r\n```\r\n\r\nПосле этого выполняется попытка изменить кортеж:\r\n\r\n```python\r\nb[3] = 100\r\n```\r\n\r\nНо кортежи в Python неизменяемые, поэтому будет ошибка:\r\n\r\n```text\r\nTypeError: 'tuple' object does not support item assignment\r\n```\r\n\r\nИтоговый вывод будет таким:\r\n\r\n```text\r\na = [1, 2, 100, 4, 5]\r\nTypeError: 'tuple' object does not support item assignment\r\n```\r\n\r\nСтрока:\r\n\r\n```python\r\nprint(f\"{b = }\")\r\n```\r\n\r\nне выполнится, потому что программа остановится на ошибке при попытке изменить элемент кортежа.\r\n{{< /details >}}\r\n"
  filepath = "mutable-vs-immutable"

