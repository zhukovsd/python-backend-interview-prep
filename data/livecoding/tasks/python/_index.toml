  id = 48
  question = "Что выведет код с изменяемым аргументом по умолчанию"
  answer = "**Условие задачи:**  \nДана функция с аргументом по умолчанию в виде списка. Нужно определить, что выведет программа при последовательных вызовах этой функции, и объяснить причину такого поведения.\n```python\ndef extendList(val, list=[]):\n  list.append(val)\n  return list\n \n list1 = extendList(10)\n list2 = extendList(123, [])\n list3 = extendList('a')\n \n print \"\"list1 = %s\"\" % list1\n print \"\"list2 = %s\"\" % list2\n print \"\"list3 = %s\"\" % list3\n```\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* Аргумент по умолчанию `list=[]` создаётся один раз в момент определения функции.\r\n* Если функцию вызвать без второго аргумента, будет использоваться один и тот же список.\r\n* `list1` и `list3` используют общий список по умолчанию.\r\n* `list2` использует отдельный список, потому что он передан явно: `[]`.\r\n* Не стоит называть параметр `list`, потому что так перекрывается встроенный тип `list`.\r\n  {{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\nИсходная идея кода:\r\n\r\n```python\r\ndef extendList(val, list=[]):\r\n    list.append(val)\r\n    return list\r\n\r\n\r\nlist1 = extendList(10)\r\nlist2 = extendList(123, [])\r\nlist3 = extendList(\"a\")\r\n\r\nprint(\"list1 = %s\" % list1)\r\nprint(\"list2 = %s\" % list2)\r\nprint(\"list3 = %s\" % list3)\r\n```\r\n\r\nРезультат:\r\n\r\n```text\r\nlist1 = [10, 'a']\r\nlist2 = [123]\r\nlist3 = [10, 'a']\r\n```\r\n\r\nРазбор:\r\n\r\n```python\r\nlist1 = extendList(10)\r\n```\r\n\r\nФункция вызывается без второго аргумента, поэтому используется список по умолчанию. После добавления `10` он становится таким:\r\n\r\n```python\r\n[10]\r\n```\r\n\r\nДальше:\r\n\r\n```python\r\nlist2 = extendList(123, [])\r\n```\r\n\r\nЗдесь вторым аргументом явно передан новый пустой список. Поэтому `123` добавляется не в общий список по умолчанию, а в отдельный список:\r\n\r\n```python\r\n[123]\r\n```\r\n\r\nДальше:\r\n\r\n```python\r\nlist3 = extendList(\"a\")\r\n```\r\n\r\nФункция снова вызывается без второго аргумента, поэтому снова используется тот же самый список по умолчанию, в котором уже лежит `10`. После добавления `\"a\"` он становится таким:\r\n\r\n```python\r\n[10, \"a\"]\r\n```\r\n\r\nТак как `list1` и `list3` ссылаются на один и тот же список, при выводе оба будут равны:\r\n\r\n```python\r\n[10, \"a\"]\r\n```\r\n\r\nПравильная реализация без изменяемого аргумента по умолчанию:\r\n\r\n```python\r\ndef extend_list(val, items=None):\r\n    if items is None:\r\n        items = []\r\n\r\n    items.append(val)\r\n    return items\r\n```\r\n\r\nВ таком варианте новый список создаётся при каждом вызове функции без второго аргумента, поэтому данные между вызовами не будут случайно накапливаться.\r\n{{< /details >}}\r\n"
  filepath = "mutable-default-output"
