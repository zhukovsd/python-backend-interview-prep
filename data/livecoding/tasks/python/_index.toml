  question = "Сказать результат формирования строк с результатами целочисленного деления"
  answer = "**Условие задачи**\nНужно сказать результат выполнения кода ниже и объяснить как он работает\n```python\na = [1, 2, 3, 4, 5, 6]\nb = [2, 3, 4, 5, 6, 7]\n\nc = [f\"{x} // {y} = {x // y}\" for x in a for y in b if x // y > 1]\n\nfor i in c:\n    print(f\"{i = }\")\n```\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* Здесь используется вложенный list comprehension.\r\n* Сначала берётся элемент `x` из списка `a`.\r\n* Затем для каждого `x` перебираются все `y` из списка `b`.\r\n* В результат попадают только те пары, где `x // y > 1`.\r\n* Оператор `//` выполняет целочисленное деление.\r\n* Условие `x // y > 1` означает, что результат деления должен быть минимум `2`.\r\n  \r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\n```python\r\na = [1, 2, 3, 4, 5, 6]\r\nb = [2, 3, 4, 5, 6, 7]\r\n\r\nc = [f\"{x} // {y} = {x // y}\" for x in a for y in b if x // y > 1]\r\n\r\nfor i in c:\r\n    print(f\"{i = }\")\r\n```\r\n\r\nРезультат:\r\n\r\n```text\r\ni = '4 // 2 = 2'\r\ni = '5 // 2 = 2'\r\ni = '6 // 2 = 3'\r\ni = '6 // 3 = 2'\r\n```\r\n\r\nРазбор подходящих пар:\r\n\r\n```text\r\n1 // 2 = 0  -> не подходит\r\n2 // 2 = 1  -> не подходит\r\n3 // 2 = 1  -> не подходит\r\n4 // 2 = 2  -> подходит\r\n5 // 2 = 2  -> подходит\r\n6 // 2 = 3  -> подходит\r\n6 // 3 = 2  -> подходит\r\n```\r\n\r\nСписок `c` после выполнения list comprehension будет таким:\r\n\r\n```python\r\n[\r\n    \"4 // 2 = 2\",\r\n    \"5 // 2 = 2\",\r\n    \"6 // 2 = 3\",\r\n    \"6 // 3 = 2\"\r\n]\r\n```\r\n\r\nЗатем цикл:\r\n\r\n```python\r\nfor i in c:\r\n    print(f\"{i = }\")\r\n```\r\n\r\nвыводит каждый элемент списка. Запись `f\"{i = }\"` показывает не только значение переменной, но и её имя. Так как `i` является строкой, значение выводится в кавычках.\r\n{{< /details >}}\r\n"
  filepath = "floor-division-strings"

