  question = "Мини код ревью Python кода (Продолжение)"
  answer = "**Условие задачи:**\nРасскажи как работает код ниже\n```python\nimport datetime\nfrom functools import wraps\nimport time\n\n\ndef decorator(func):\n    @wraps(func)\n    def inner(*args, **kwargs):\n        start_time = datetime.datetime.now()\n        result = func(*args, **kwargs)\n        time.sleep(2)\n        end_time = datetime.datetime.now()\n        print(end_time - start_time)\n        return result\n    return inner\n\n\n@decorator('test')\ndef start_func(a, b):\n    return a + b\n\n\nt = start_func(1, 2)\nprint(t)\n```\n```python\n# В чем проблема этого кода?\nfrom fastapi import FastAPI\n\napp = FastAPI()\n\n\n@app.get(\"/item\")\nasync def read_users():\n    return [\"Rick\", \"Morty\"]\n\n\n@app.get(\"/item\")\nasync def read_users2():\n    return [\"Bean\", \"Elfo\"]\n```\n```python\ndef func1():\n    print(1)\n\n\ndef func2():\n    print(2)\n\n\nres1 = func1() and func2()\nres2 = 0 or '5'\n\n\nprint(res1)\nprint(res2)\n```\n```python\nrow = [['_'] * 3] * 3\nrow[1][2] = 'X'\nprint(row)\n\n# Выбери вариант ответа\n1 — [['_', '_', '_'], ['_', '_', 'X'], ['_', '_', '_']]\n2 — [['_', '_', 'X'], ['_', '_', 'X'], ['_', '_', 'X']]\n```\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* В первом фрагменте проблема в строке `@decorator('test')`.\r\n* Функция `decorator` написана как обычный декоратор, а используется как декоратор с аргументом.\r\n* Во FastAPI-фрагменте два обработчика зарегистрированы на один и тот же путь `GET /item`.\r\n* В выражении `func1() and func2()` вторая функция не вызовется, потому что `func1()` возвращает `None`.\r\n* В выражении `0 or '5'` результатом будет строка `'5'`.\r\n* В `row = [['_'] * 3] * 3` создаются три ссылки на один и тот же внутренний список.\r\n  \r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\nПервый фрагмент:\r\n\r\n```python\r\nimport datetime\r\nfrom functools import wraps\r\nimport time\r\n\r\n\r\ndef decorator(func):\r\n    @wraps(func)\r\n    def inner(*args, **kwargs):\r\n        start_time = datetime.datetime.now()\r\n        result = func(*args, **kwargs)\r\n        time.sleep(2)\r\n        end_time = datetime.datetime.now()\r\n        print(end_time - start_time)\r\n        return result\r\n    return inner\r\n\r\n\r\n@decorator('test')\r\ndef start_func(a, b):\r\n    return a + b\r\n\r\n\r\nt = start_func(1, 2)\r\nprint(t)\r\n```\r\n\r\nКод упадёт с ошибкой ещё на этапе объявления функции:\r\n\r\n```text\r\nTypeError: 'str' object is not callable\r\n```\r\n\r\nПроблема здесь:\r\n\r\n```python\r\n@decorator('test')\r\n```\r\n\r\nФункция `decorator` ожидает функцию:\r\n\r\n```python\r\ndef decorator(func):\r\n```\r\n\r\nНо ей передали строку `'test'`. Поэтому внутри `decorator` переменная `func` становится строкой, а не функцией.\r\n\r\nДальше Python пытается применить результат `decorator('test')` к функции `start_func`. В итоге вызывается `inner(start_func)`, а внутри `inner` выполняется:\r\n\r\n```python\r\nresult = func(*args, **kwargs)\r\n```\r\n\r\nНо `func` — это строка `'test'`, а строку нельзя вызвать как функцию. Поэтому возникает ошибка.\r\n\r\nПравильный вариант без аргумента у декоратора:\r\n\r\n```python\r\nimport datetime\r\nfrom functools import wraps\r\nimport time\r\n\r\n\r\ndef decorator(func):\r\n    @wraps(func)\r\n    def inner(*args, **kwargs):\r\n        start_time = datetime.datetime.now()\r\n        result = func(*args, **kwargs)\r\n        time.sleep(2)\r\n        end_time = datetime.datetime.now()\r\n        print(end_time - start_time)\r\n        return result\r\n\r\n    return inner\r\n\r\n\r\n@decorator\r\ndef start_func(a, b):\r\n    return a + b\r\n\r\n\r\nt = start_func(1, 2)\r\nprint(t)\r\n```\r\n\r\nПримерный результат:\r\n\r\n```text\r\n0:00:02.000...\r\n3\r\n```\r\n\r\nЕсли нужно именно использовать запись `@decorator('test')`, тогда нужен декоратор-фабрика:\r\n\r\n```python\r\nimport datetime\r\nfrom functools import wraps\r\nimport time\r\n\r\n\r\ndef decorator(name):\r\n    def outer(func):\r\n        @wraps(func)\r\n        def inner(*args, **kwargs):\r\n            start_time = datetime.datetime.now()\r\n            result = func(*args, **kwargs)\r\n            time.sleep(2)\r\n            end_time = datetime.datetime.now()\r\n            print(name)\r\n            print(end_time - start_time)\r\n            return result\r\n\r\n        return inner\r\n\r\n    return outer\r\n\r\n\r\n@decorator(\"test\")\r\ndef start_func(a, b):\r\n    return a + b\r\n\r\n\r\nt = start_func(1, 2)\r\nprint(t)\r\n```\r\n\r\nВторой фрагмент:\r\n\r\n```python\r\nfrom fastapi import FastAPI\r\n\r\napp = FastAPI()\r\n\r\n\r\n@app.get(\"/item\")\r\nasync def read_users():\r\n    return [\"Rick\", \"Morty\"]\r\n\r\n\r\n@app.get(\"/item\")\r\nasync def read_users2():\r\n    return [\"Bean\", \"Elfo\"]\r\n```\r\n\r\nПроблема в том, что оба обработчика зарегистрированы на один и тот же маршрут:\r\n\r\n```text\r\nGET /item\r\nGET /item\r\n```\r\n\r\nЭто дублирование маршрута. Для одного HTTP-метода и одного пути должен быть один обработчик.\r\n\r\nНа практике первый зарегистрированный обработчик будет найден раньше:\r\n\r\n```python\r\n@app.get(\"/item\")\r\nasync def read_users():\r\n    return [\"Rick\", \"Morty\"]\r\n```\r\n\r\nА второй обработчик с тем же путём фактически станет недостижимым для обычного запроса `GET /item`.\r\n\r\nПравильно сделать разные пути:\r\n\r\n```python\r\nfrom fastapi import FastAPI\r\n\r\napp = FastAPI()\r\n\r\n\r\n@app.get(\"/rick-and-morty\")\r\nasync def read_users():\r\n    return [\"Rick\", \"Morty\"]\r\n\r\n\r\n@app.get(\"/disenchantment\")\r\nasync def read_users2():\r\n    return [\"Bean\", \"Elfo\"]\r\n```\r\n\r\nТретий фрагмент:\r\n\r\n```python\r\ndef func1():\r\n    print(1)\r\n\r\n\r\ndef func2():\r\n    print(2)\r\n\r\n\r\nres1 = func1() and func2()\r\nres2 = 0 or '5'\r\n\r\n\r\nprint(res1)\r\nprint(res2)\r\n```\r\n\r\nРезультат:\r\n\r\n```text\r\n1\r\nNone\r\n5\r\n```\r\n\r\nРазбор:\r\n\r\n```python\r\nres1 = func1() and func2()\r\n```\r\n\r\nСначала вызывается `func1()`. Она печатает:\r\n\r\n```text id=\"xm4qm0\"\r\n1\r\n```\r\n\r\nНо явно ничего не возвращает, значит результат функции — `None`.\r\n\r\nПолучается:\r\n\r\n```python\r\nres1 = None and func2()\r\n```\r\n\r\n`None` — ложное значение, поэтому оператор `and` останавливается на первом ложном значении и `func2()` уже не вызывается.\r\n\r\nПоэтому:\r\n\r\n```python\r\nres1 = None\r\n```\r\n\r\nДальше:\r\n\r\n```python\r\nres2 = 0 or '5'\r\n```\r\n\r\n`0` — ложное значение, поэтому `or` возвращает первое истинное значение справа, то есть строку `'5'`.\r\n\r\nЧетвёртый фрагмент:\r\n\r\n```python\r\nrow = [['_'] * 3] * 3\r\nrow[1][2] = 'X'\r\nprint(row)\r\n```\r\n\r\nПравильный вариант ответа:\r\n\r\n```text\r\n2 — [['_', '_', 'X'], ['_', '_', 'X'], ['_', '_', 'X']]\r\n```\r\n\r\nРезультат:\r\n\r\n```python\r\n[['_', '_', 'X'], ['_', '_', 'X'], ['_', '_', 'X']]\r\n```\r\n\r\nПричина в строке:\r\n\r\n```python\r\nrow = [['_'] * 3] * 3\r\n```\r\n\r\nОна создаёт не три независимых списка, а три ссылки на один и тот же внутренний список.\r\n\r\nТо есть все строки матрицы ссылаются на один объект. Поэтому изменение:\r\n\r\n```python\r\nrow[1][2] = 'X'\r\n```\r\n\r\nменяет третий элемент в общем внутреннем списке, и это видно сразу во всех трёх строках.\r\n\r\nПравильное создание независимых строк:\r\n\r\n```python\r\nrow = [['_'] * 3 for _ in range(3)]\r\nrow[1][2] = 'X'\r\nprint(row)\r\n```\r\n\r\nРезультат будет:\r\n\r\n```python\r\n[['_', '_', '_'], ['_', '_', 'X'], ['_', '_', '_']]\r\n```\r\n\r\n{{< /details >}}\r\n"
