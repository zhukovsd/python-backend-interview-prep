[[tasks]]
  id = 41
  question = "Удаление дубликатов объектов Author во множестве"
  answer = "**Условие зададчи:**  \nИз нескольких источников поступают данные об одном и том же авторе научных публикаций. Данные из каждого источника преобразуются в объект класса Author, после чего все объекты добавляются во множество set для автоматического удаления дублей.  \nНужно доработать класс Author так, чтобы при добавлении объектов в множество дубликаты автоматически схлопывались в один объект.  \nДубликатами считаются записи, у которых совпадает хотя бы один идентификатор или одно из значений полей. Например, если у двух авторов совпадает rinc_id, такие записи должны считаться одним и тем же автором, даже если имя записано по-разному.  \nОжидаемое поведение по примеру на скрине: после добавления нескольких пересекающихся записей во множестве должен остаться один объект с объединенными данными.  \n```python\nfrom dataclasses import dataclass\nfrom typing import List, Optional\n\n\n@dataclass\nclass Author:\n    name: Optional[List[str]] = None\n    rinc_id: Optional[List[str]] = None\n    scopus_id: Optional[List[str]] = None\n\n\nif __name__ == '__main__':\n    all_author = set()\n    all_author.add(Author(['Иван'], ['123321']))\n    all_author.add(Author(['Иванов'], ['123321']))\n    all_author.add(Author(['Иванов'], scopus_id=['123321']))\n    all_author.add(Author(['Иван'], scopus_id=['123321']))\n    print(all_author)  # -> {Author(name=['Иванов', 'Иван'], rinc_id=['123321'], scopus_id=['123321'])}\n```"
  filepath = "author-set-dedup"

