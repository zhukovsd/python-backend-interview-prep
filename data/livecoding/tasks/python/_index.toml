  id = 41
  question = "Удаление дубликатов объектов Author во множестве"
  answer = "**Условие зададчи:**  \nИз нескольких источников поступают данные об одном и том же авторе научных публикаций. Данные из каждого источника преобразуются в объект класса Author, после чего все объекты добавляются во множество set для автоматического удаления дублей.  \nНужно доработать класс Author так, чтобы при добавлении объектов в множество дубликаты автоматически схлопывались в один объект.  \nДубликатами считаются записи, у которых совпадает хотя бы один идентификатор или одно из значений полей. Например, если у двух авторов совпадает rinc_id, такие записи должны считаться одним и тем же автором, даже если имя записано по-разному.  \nОжидаемое поведение по примеру на скрине: после добавления нескольких пересекающихся записей во множестве должен остаться один объект с объединенными данными.  \n```python\nfrom dataclasses import dataclass\nfrom typing import List, Optional\n\n\n@dataclass\nclass Author:\n    name: Optional[List[str]] = None\n    rinc_id: Optional[List[str]] = None\n    scopus_id: Optional[List[str]] = None\n\n\nif __name__ == '__main__':\n    all_author = set()\n    all_author.add(Author(['Иван'], ['123321']))\n    all_author.add(Author(['Иванов'], ['123321']))\n    all_author.add(Author(['Иванов'], scopus_id=['123321']))\n    all_author.add(Author(['Иван'], scopus_id=['123321']))\n    print(all_author)  # -> {Author(name=['Иванов', 'Иван'], rinc_id=['123321'], scopus_id=['123321'])}\n```\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* Обычный `set` сам по себе не умеет объединять данные объектов.\r\n* `set.add()` может только добавить объект или не добавить его, если считает дубликатом.\r\n* Если объект уже есть в `set`, новый объект просто отбрасывается, но данные старого объекта автоматически не обновляются.\r\n* Для корректного решения нужен отдельный контейнер, который при добавлении ищет пересечение и вручную объединяет данные.\r\n* Дубликатами считаем авторов, у которых пересекается хотя бы одно значение в `name`, `rinc_id` или `scopus_id`.\r\n* При нахождении дубликата нужно объединить списки без повторов.\r\n  \r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\n```python\r\nfrom dataclasses import dataclass, field\r\nfrom typing import Iterable\r\n\r\n\r\n@dataclass\r\nclass Author:\r\n    name: list[str] = field(default_factory=list)\r\n    rinc_id: list[str] = field(default_factory=list)\r\n    scopus_id: list[str] = field(default_factory=list)\r\n\r\n    def has_intersection(self, other: \"Author\") -> bool:\r\n        return (\r\n            bool(set(self.name) & set(other.name))\r\n            or bool(set(self.rinc_id) & set(other.rinc_id))\r\n            or bool(set(self.scopus_id) & set(other.scopus_id))\r\n        )\r\n\r\n    def merge(self, other: \"Author\") -> None:\r\n        self.name = self._merge_lists(self.name, other.name)\r\n        self.rinc_id = self._merge_lists(self.rinc_id, other.rinc_id)\r\n        self.scopus_id = self._merge_lists(self.scopus_id, other.scopus_id)\r\n\r\n    @staticmethod\r\n    def _merge_lists(first: list[str], second: list[str]) -> list[str]:\r\n        result = []\r\n\r\n        for value in first + second:\r\n            if value not in result:\r\n                result.append(value)\r\n\r\n        return result\r\n\r\n\r\nclass AuthorSet:\r\n    def __init__(self):\r\n        self.authors: list[Author] = []\r\n\r\n    def add(self, author: Author) -> None:\r\n        for existing_author in self.authors:\r\n            if existing_author.has_intersection(author):\r\n                existing_author.merge(author)\r\n                return\r\n\r\n        self.authors.append(author)\r\n\r\n    def __iter__(self):\r\n        return iter(self.authors)\r\n\r\n    def __repr__(self):\r\n        return repr(set(map(repr, self.authors)))\r\n```\r\n\r\nПример использования:\r\n\r\n```python\r\nif __name__ == \"__main__\":\r\n    all_author = AuthorSet()\r\n\r\n    all_author.add(Author([\"Иван\"], [\"123321\"]))\r\n    all_author.add(Author([\"Иванов\"], [\"123321\"]))\r\n    all_author.add(Author([\"Иванов\"], scopus_id=[\"123321\"]))\r\n    all_author.add(Author([\"Иван\"], scopus_id=[\"123321\"]))\r\n\r\n    for author in all_author:\r\n        print(author)\r\n```\r\n\r\nРезультат:\r\n\r\n```text\r\nAuthor(name=['Иван', 'Иванов'], rinc_id=['123321'], scopus_id=['123321'])\r\n```\r\n\r\nЗдесь обычный `set` заменён на специальный контейнер `AuthorSet`.\r\n\r\nПричина: обычный `set` не подходит для такой логики. Он использует `__hash__` и `__eq__`, чтобы понять, есть ли объект во множестве. Но если объект уже есть, `set` не вызывает никакого автоматического объединения данных. Новый объект просто не добавляется.\r\n\r\nПоэтому правильная логика такая:\r\n\r\n```text\r\n1. При добавлении нового автора пройтись по уже сохранённым авторам.\r\n2. Проверить, есть ли пересечение по name, rinc_id или scopus_id.\r\n3. Если пересечение есть — объединить данные.\r\n4. Если пересечения нет — добавить автора как новую запись.\r\n```\r\n\r\nЕсли строго пытаться сделать это через обычный `set`, придётся мутировать объекты внутри `__eq__`, но это плохая практика. Такой код будет неочевидным, нестабильным и может нарушить правила работы `set`.\r\n\r\nБолее аккуратный вариант с сохранением вывода как у множества:\r\n\r\n```python\r\nfrom dataclasses import dataclass, field\r\n\r\n\r\n@dataclass\r\nclass Author:\r\n    name: list[str] = field(default_factory=list)\r\n    rinc_id: list[str] = field(default_factory=list)\r\n    scopus_id: list[str] = field(default_factory=list)\r\n\r\n    def has_intersection(self, other: \"Author\") -> bool:\r\n        return any([\r\n            set(self.name) & set(other.name),\r\n            set(self.rinc_id) & set(other.rinc_id),\r\n            set(self.scopus_id) & set(other.scopus_id),\r\n        ])\r\n\r\n    def merge(self, other: \"Author\") -> None:\r\n        self.name = list(dict.fromkeys(self.name + other.name))\r\n        self.rinc_id = list(dict.fromkeys(self.rinc_id + other.rinc_id))\r\n        self.scopus_id = list(dict.fromkeys(self.scopus_id + other.scopus_id))\r\n\r\n\r\nclass AuthorSet:\r\n    def __init__(self):\r\n        self._items: list[Author] = []\r\n\r\n    def add(self, author: Author) -> None:\r\n        for item in self._items:\r\n            if item.has_intersection(author):\r\n                item.merge(author)\r\n                return\r\n\r\n        self._items.append(author)\r\n\r\n    def __repr__(self):\r\n        return \"{\" + \", \".join(repr(item) for item in self._items) + \"}\"\r\n\r\n\r\nall_author = AuthorSet()\r\n\r\nall_author.add(Author([\"Иван\"], [\"123321\"]))\r\nall_author.add(Author([\"Иванов\"], [\"123321\"]))\r\nall_author.add(Author([\"Иванов\"], scopus_id=[\"123321\"]))\r\nall_author.add(Author([\"Иван\"], scopus_id=[\"123321\"]))\r\n\r\nprint(all_author)\r\n```\r\n\r\nРезультат:\r\n\r\n```text\r\n{Author(name=['Иван', 'Иванов'], rinc_id=['123321'], scopus_id=['123321'])}\r\n```\r\n\r\nГлавный вывод: для автоматического удаления дублей без объединения достаточно `set`, но для удаления дублей с объединением данных нужен собственный контейнер или отдельная функция агрегации.\r\n{{< /details >}}\r\n"
  filepath = "author-set-dedup"

[[tasks]]
  id = 42
  question = "Порядок поиска атрибута при множественном наследовании"
  answer = "**Условие зададчи:** \nДаны два родительских класса с одноименным атрибутом класса x и дочерний класс, который наследуется сразу от обоих родителей.\n```python\nclass A:\n    x = 5\n\nclass B:\n    x = 10\n\nclass C(A, B):\n    pass\n```\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* Класс `C` наследуется сразу от `A` и `B`.\r\n* В Python при множественном наследовании атрибуты ищутся по порядку MRO.\r\n* MRO — это порядок разрешения методов и атрибутов.\r\n* Для `class C(A, B)` сначала проверяется сам `C`, потом `A`, потом `B`.\r\n* Так как у `C` собственного атрибута `x` нет, Python найдёт `x` в классе `A`.\r\n  \r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\n```python\r\nclass A:\r\n    x = 5\r\n\r\nclass B:\r\n    x = 10\r\n\r\nclass C(A, B):\r\n    pass\r\n\r\n\r\nprint(C.x)\r\nprint(C.__mro__)\r\n```\r\n\r\nРезультат:\r\n\r\n```text\r\n5\r\n(<class '__main__.C'>, <class '__main__.A'>, <class '__main__.B'>, <class 'object'>)\r\n```\r\n\r\nПри обращении:\r\n\r\n```python\r\nC.x\r\n```\r\n\r\nPython ищет атрибут `x` в таком порядке:\r\n\r\n```text\r\nC -> A -> B -> object\r\n```\r\n\r\nВ самом классе `C` атрибута `x` нет. Затем Python смотрит в первый родительский класс `A` и находит там:\r\n\r\n```python\r\nx = 5\r\n```\r\n\r\nПоэтому результат будет:\r\n\r\n```text\r\n5\r\n```\r\n\r\nАтрибут `B.x` равен `10`, но до него поиск не дойдёт, потому что подходящий атрибут уже найден в `A`.\r\n\r\nЕсли изменить порядок наследования:\r\n\r\n```python\r\nclass C(B, A):\r\n    pass\r\n```\r\n\r\nтогда результат был бы другим:\r\n\r\n```python\r\nprint(C.x)  # 10\r\n```\r\n\r\nПотому что порядок поиска стал бы:\r\n\r\n```text\r\nC -> B -> A -> object\r\n```\r\n\r\n{{< /details >}}\r\n"
  filepath = "multiple-inheritance-mro"

[[tasks]]
  id = 43
  question = "Реализация банкомата с внесением и выдачей купюр"
  answer = "**Условие задачи:**  \nРеализовать класс \"\"Банкомат\"\"\nЕсть валюты:\ncurrencies = [RUB, USD, EUR]\nМонеты/купюры каждой валюты бывают ТОЛьКО такого номинала:\nnominal = [1, 5, 10, 50, 100, 500, 1000, 5000]\nНужно разработать класс \"\"Банкомат\"\" со следующими возможностями:\nПринять в банкомат несколько монет/купюр:\nput(currency, nominal, count) -> None\nВыдать из банкомата определенную сумму денег в определенной валюте:\nget(currency, amount) -> [(nominal, count), …] | raise Unavailable Error\nОтветом должен быть список, каким образом банкомат выдаст нужную сумму, какими монетами/купюрами, в\nкаком количестве.\nБанкомат обычный, сам деньги не печатает, может выдавать только то, что в него положили.\nЕсли выдать требуемую сумму нет возможности - бросаем исключение Unavailable Error.\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* Нужно хранить деньги отдельно по каждой валюте.\r\n* Для хранения удобно использовать вложенный словарь: `currency -> nominal -> count`.\r\n* Метод `put()` должен увеличивать количество купюр или монет нужного номинала.\r\n* Метод `get()` должен попытаться собрать нужную сумму из доступных номиналов.\r\n* Начинать выдачу лучше с самого крупного номинала.\r\n* Если сумму собрать нельзя, нужно выбросить исключение `UnavailableError`.\r\n* Если выдача успешна, нужно уменьшить количество купюр в банкомате.\r\n  \r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\n```python\r\nclass UnavailableError(Exception):\r\n    pass\r\n\r\n\r\nclass ATM:\r\n    currencies = {\"RUB\", \"USD\", \"EUR\"}\r\n    nominals = [1, 5, 10, 50, 100, 500, 1000, 5000]\r\n\r\n    def __init__(self):\r\n        self.storage = {\r\n            currency: {\r\n                nominal: 0\r\n                for nominal in self.nominals\r\n            }\r\n            for currency in self.currencies\r\n        }\r\n\r\n    def put(self, currency: str, nominal: int, count: int) -> None:\r\n        self._validate_currency(currency)\r\n        self._validate_nominal(nominal)\r\n\r\n        if count <= 0:\r\n            raise ValueError(\"count must be positive\")\r\n\r\n        self.storage[currency][nominal] += count\r\n\r\n    def get(self, currency: str, amount: int) -> list[tuple[int, int]]:\r\n        self._validate_currency(currency)\r\n\r\n        if amount <= 0:\r\n            raise ValueError(\"amount must be positive\")\r\n\r\n        result = []\r\n        remaining_amount = amount\r\n\r\n        for nominal in sorted(self.nominals, reverse=True):\r\n            available_count = self.storage[currency][nominal]\r\n\r\n            if available_count == 0:\r\n                continue\r\n\r\n            needed_count = remaining_amount // nominal\r\n            count_to_take = min(available_count, needed_count)\r\n\r\n            if count_to_take > 0:\r\n                result.append((nominal, count_to_take))\r\n                remaining_amount -= nominal * count_to_take\r\n\r\n        if remaining_amount != 0:\r\n            raise UnavailableError(\"Requested amount is unavailable\")\r\n\r\n        for nominal, count in result:\r\n            self.storage[currency][nominal] -= count\r\n\r\n        return result\r\n\r\n    def _validate_currency(self, currency: str) -> None:\r\n        if currency not in self.currencies:\r\n            raise ValueError(\"unsupported currency\")\r\n\r\n    def _validate_nominal(self, nominal: int) -> None:\r\n        if nominal not in self.nominals:\r\n            raise ValueError(\"unsupported nominal\")\r\n```\r\n\r\nПример использования:\r\n\r\n```python\r\natm = ATM()\r\n\r\natm.put(\"RUB\", 1000, 2)\r\natm.put(\"RUB\", 500, 3)\r\natm.put(\"RUB\", 100, 10)\r\n\r\nprint(atm.get(\"RUB\", 2600))\r\n```\r\n\r\nРезультат:\r\n\r\n```text\r\n[(1000, 2), (500, 1), (100, 1)]\r\n```\r\n\r\nПосле успешной выдачи деньги списываются из банкомата:\r\n\r\n```python\r\nprint(atm.storage[\"RUB\"])\r\n```\r\n\r\nНапример, после выдачи `2600` рублей в банкомате останется меньше купюр номиналом `1000`, `500` и `100`.\r\n\r\nЕсли нужную сумму выдать невозможно:\r\n\r\n```python\r\natm = ATM()\r\n\r\natm.put(\"USD\", 100, 1)\r\n\r\nprint(atm.get(\"USD\", 150))\r\n```\r\n\r\nбудет ошибка:\r\n\r\n```text\r\nUnavailableError: Requested amount is unavailable\r\n```\r\n\r\nПотому что в банкомате есть только одна купюра `100 USD`, а суммы `150 USD` доступными номиналами собрать нельзя.\r\n\r\nЛогика метода `get()`:\r\n\r\n```text\r\n1. Проверяем валюту и сумму.\r\n2. Идём по номиналам от большего к меньшему.\r\n3. Для каждого номинала считаем, сколько купюр можно взять.\r\n4. Не берём больше, чем есть в банкомате.\r\n5. Уменьшаем остаток суммы.\r\n6. Если остаток стал 0 — выдача возможна.\r\n7. Если после прохода остаток не 0 — бросаем UnavailableError.\r\n8. Только после успешной проверки списываем купюры из хранилища.\r\n```\r\n\r\nВажно, что списание происходит только после того, как сумма успешно собрана. Если сумму собрать нельзя, состояние банкомата не меняется.\r\n{{< /details >}}\r\n"
  filepath = "atm-cash-machine"

