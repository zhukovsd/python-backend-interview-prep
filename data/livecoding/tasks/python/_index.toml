  id = 46
  question = "Сжатие повторяющихся символов в строке"
  answer = "**Условие задачи:**  \nНаписать функцию curtail_str(letters: str) -> str, которая сжимает строку по сериям подряд идущих одинаковых символов.  \n\nПравила:  \n- если символ встречается подряд один раз, он остается без изменений\n- если символ повторяется подряд несколько раз, вместо этой группы нужно записать символ и количество повторений\n- обрабатываются только подряд идущие одинаковые символы\n\n**Примеры:**  \n```python\n\"\" -> \"\"\n\"ABC\" -> \"ABC\"\n\"AAA\" -> \"A3\"\n\"AAABBXYZDDDDA\" -> \"A3B2XYZD4A\"\n\"ABCABCABCCCCC\" -> \"ABCABCABC5\"\n```\n**Код задачи:**  \n```python\ndef curtail_str(letters: str) -> str:\n    ...\n\n\nassert curtail_str(\"\") == \"\"\nassert curtail_str(\"ABC\") == \"ABC\"\nassert curtail_str(\"AAA\") == \"A3\"\nassert curtail_str(\"AAABBXYZDDDDA\") == \"A3B2XYZD4A\"\nassert curtail_str(\"ABCABCABCCCCC\") == \"ABCABCABC5\"\n\nprint(\"done\")\n```\n**Дополнительно:**  \n- Почему в result выбран тип данных str?\n- Оцени свой алгоритм с точки зрения On\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* Нужно идти по строке слева направо.\r\n* Нужно хранить текущий символ и количество его подряд идущих повторений.\r\n* Если следующий символ такой же — увеличиваем счётчик.\r\n* Если следующий символ другой — записываем предыдущую группу в результат.\r\n* Если символ встретился один раз, записываем только символ.\r\n* Если символ повторился несколько раз, записываем символ и количество.\r\n* Для результата лучше использовать список, а в конце собрать строку через `\"\".join(...)`.\r\n\r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\n```python\r\ndef curtail_str(letters: str) -> str:\r\n    if not letters:\r\n        return \"\"\r\n\r\n    result = []\r\n\r\n    current_char = letters[0]\r\n    count = 1\r\n\r\n    for char in letters[1:]:\r\n        if char == current_char:\r\n            count += 1\r\n        else:\r\n            if count == 1:\r\n                result.append(current_char)\r\n            else:\r\n                result.append(f\"{current_char}{count}\")\r\n\r\n            current_char = char\r\n            count = 1\r\n\r\n    if count == 1:\r\n        result.append(current_char)\r\n    else:\r\n        result.append(f\"{current_char}{count}\")\r\n\r\n    return \"\".join(result)\r\n```\r\n\r\nПроверка:\r\n\r\n```python\r\nassert curtail_str(\"\") == \"\"\r\nassert curtail_str(\"ABC\") == \"ABC\"\r\nassert curtail_str(\"AAA\") == \"A3\"\r\nassert curtail_str(\"AAABBXYZDDDDA\") == \"A3B2XYZD4A\"\r\nassert curtail_str(\"ABCABCABCCCCC\") == \"ABCABCABC5\"\r\n\r\nprint(\"done\")\r\n```\r\n\r\nРезультат:\r\n\r\n```text\r\ndone\r\n```\r\n\r\nКак работает алгоритм:\r\n\r\n```text\r\n\"AAABBXYZDDDDA\"\r\n```\r\n\r\nСтрока разбивается на подряд идущие группы:\r\n\r\n```text\r\nAAA -> A3\r\nBB  -> B2\r\nX   -> X\r\nY   -> Y\r\nZ   -> Z\r\nDDDD -> D4\r\nA   -> A\r\n```\r\n\r\nИтог:\r\n\r\n```text\r\nA3B2XYZD4A\r\n```\r\n\r\nПочему `result` лучше делать списком, а не строкой:\r\n\r\n```python\r\nresult = []\r\n```\r\n\r\nФункция должна вернуть строку, но собирать результат через список эффективнее. Если делать так:\r\n\r\n```python\r\nresult += piece\r\n```\r\n\r\nто при каждой конкатенации может создаваться новая строка, потому что строки в Python неизменяемые. На больших строках это может привести к лишним копированиям.\r\n\r\nПоэтому лучше добавлять части в список:\r\n\r\n```python\r\nresult.append(piece)\r\n```\r\n\r\nа в конце один раз собрать строку:\r\n\r\n```python\r\nreturn \"\".join(result)\r\n```\r\n\r\nОценка сложности:\r\n\r\n```text\r\nВремя: O(n)\r\nПамять: O(n)\r\n```\r\n\r\n`n` — длина входной строки. Алгоритм проходит по строке один раз, поэтому время работы линейное. Дополнительная память нужна для списка частей результата.\r\n{{< /details >}}\r\n"
  filepath = "string-run-length"

