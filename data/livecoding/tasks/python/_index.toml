  id = 39
  question = "Обратный словарь со сменой ключей и значений"
  answer = "**Условие задачи:**  \nНаписать функцию, которая принимает словарь и возвращает новый словарь, в котором ключи и значения поменяны местами.\n\n**Пример:**  \n```python\n# {1: 2, 3: 4} -> {2: 1, 4: 3}\n\ndef reverse_dict(old_dict: dict):\n    new_dict = {}\n```\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* Нужно пройтись по парам `key, value` исходного словаря.\r\n* В новом словаре старое значение должно стать ключом.\r\n* Старый ключ должен стать значением.\r\n* Для обхода словаря удобно использовать `.items()`.\r\n* Важно: значения исходного словаря должны быть хешируемыми, потому что в новом словаре они станут ключами.\r\n* Если в исходном словаре есть одинаковые значения, в новом словаре останется только последняя пара.\r\n  \r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\n```python\r\ndef reverse_dict(old_dict: dict) -> dict:\r\n    new_dict = {}\r\n\r\n    for key, value in old_dict.items():\r\n        new_dict[value] = key\r\n\r\n    return new_dict\r\n```\r\n\r\nПример использования:\r\n\r\n```python\r\nold_dict = {\r\n    1: 2,\r\n    3: 4\r\n}\r\n\r\nprint(reverse_dict(old_dict))\r\n```\r\n\r\nРезультат:\r\n\r\n```text\r\n{2: 1, 4: 3}\r\n```\r\n\r\nФункция проходит по исходному словарю и меняет местами ключи и значения. Например, пара `1: 2` превращается в `2: 1`, а пара `3: 4` превращается в `4: 3`.\r\n\r\nКороткий вариант через dict comprehension:\r\n\r\n```python\r\ndef reverse_dict(old_dict: dict) -> dict:\r\n    return {\r\n        value: key\r\n        for key, value in old_dict.items()\r\n    }\r\n```\r\n\r\nВажно учитывать ситуацию с одинаковыми значениями:\r\n\r\n```python\r\nold_dict = {\r\n    \"a\": 1,\r\n    \"b\": 1\r\n}\r\n\r\nprint(reverse_dict(old_dict))\r\n```\r\n\r\nРезультат будет:\r\n\r\n```text\r\n{1: 'b'}\r\n```\r\n\r\nТак происходит потому, что ключи в словаре должны быть уникальными. Значение `1` становится ключом нового словаря, и последняя запись перезаписывает предыдущую.\r\n{{< /details >}}\r\n"
  filepath = "reverse-dict"

