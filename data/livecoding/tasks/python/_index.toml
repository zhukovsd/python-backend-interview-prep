  question = "Асинхронный декоратор медленных вызовов"
  answer = "**Условие здаадчи:**  \nДан асинхронный код. Нужно реализовать декоратор slowlog(threshold=3), который измеряет время выполнения асинхронной функции.\n\nТребования:\n\nесли функция выполняется быстрее или ровно за threshold секунд, логирование не выполняется\nесли функция выполняется дольше threshold секунд, нужно что-то залогировать\nдекоратор должен корректно работать с async def функциями\nвозвращаемое значение исходной функции должно сохраняться без изменений\n\n```python\nimport asyncio\r\n\r\n@slowlog(threshold=3)\r\nasync def some_func(seconds):\r\n    await asyncio.sleep(seconds)\r\n    return seconds * 2\r\n\r\nassert asyncio.run(some_func(1)) == 2  # не должно логгироваться\r\nassert asyncio.run(some_func(5)) == 10  # должно логгироваться\r\n\r\n# После превышения threshold секунд, мы логгируем что-то\n```"
  filepath = "async-slowlog-decorator"

