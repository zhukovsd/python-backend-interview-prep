  answer = "**Условие задачи**\nРеализовать функцию-декоратор formatter(), которая принимает название HTML-тега и оборачивает результат декорируемой функции в этот тег.\nДекоратор должен работать с функциями, принимающими разное количество аргументов.\nПример: если функция возвращает строку \"hello, Bob\", а декоратор вызван как @formatter('b'), итоговый результат должен быть \"<b>hello, Bob</b>\".\n```python\n# Сделать декоратор\ndef formatter:\n    ...\n\n\n@formatter('b')\ndef hello(name):\n    return f'hello, {name}'\n\n\n@formatter('i')\ndef goodbye(name, reason):\n    return f'goodbye, {name}: {reason}'\n\n\nprint(hello('Bob'))\nassert hello('Bob') == '<b>hello, Bob</b>'\nprint(goodbye('John', 'not good enough'))\nassert goodbye('John', 'not good enough') == '<i>goodbye, John: not good enough</i>'\n```"
