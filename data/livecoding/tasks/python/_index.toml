  answer = "**Условие задачи:**\nРасскажи как работает код ниже\n```python\na = 10\nb = a\n\ndel(a)\n\nc = b\n\nprint(c)\n```\n```python\nclass Test():\n    a = 123\n\ntest = Test()\ntest2 = Test()\n\nTest.a = 345\n\nprint(Test.a)\nprint(test2.a)\n```\n```python\n# В чем проблема этого кода?\nfrom fastapi import FastAPI\n\napp = FastAPI()\n\n\n@app.get(\"/item\")\nasync def read_user():\n    return [\"Rick\", \"Morty\"]\n\n\n@app.get(\"/item\")\nasync def read_user2():\n    return [\"Bean\", \"Elfo\"]\n```\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* `del(a)` удаляет имя `a`, а не сам объект, если на объект ещё есть другие ссылки.\r\n* После `b = a` переменные `a` и `b` ссылаются на один и тот же объект `10`.\r\n* Атрибут класса доступен через сам класс и через экземпляры класса.\r\n* Если у экземпляра нет собственного атрибута `a`, Python берёт `a` из класса.\r\n* В FastAPI нельзя нормально объявлять два обработчика с одинаковым HTTP-методом и одинаковым путём.\r\n* При одинаковом `GET /item` один endpoint фактически перекрывает другой с точки зрения маршрутизации/документации.\r\n  \r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\nПервый фрагмент:\r\n\r\n```python\r\na = 10\r\nb = a\r\n\r\ndel(a)\r\n\r\nc = b\r\n\r\nprint(c)\r\n```\r\n\r\nРезультат:\r\n\r\n```text\r\n10\r\n```\r\n\r\nРазбор:\r\n\r\n```python\r\na = 10\r\nb = a\r\n```\r\n\r\nПосле этого `a` и `b` указывают на один и тот же объект `10`.\r\n\r\nДальше:\r\n\r\n```python\r\ndel(a)\r\n```\r\n\r\nудаляет только имя `a`. Сам объект `10` не исчезает, потому что на него всё ещё ссылается переменная `b`.\r\n\r\nПотом:\r\n\r\n```python\r\nc = b\r\n```\r\n\r\nпеременная `c` тоже начинает ссылаться на значение `10`, поэтому:\r\n\r\n```python\r\nprint(c)\r\n```\r\n\r\nвыведет:\r\n\r\n```text\r\n10\r\n```\r\n\r\nВторой фрагмент:\r\n\r\n```python\r\nclass Test():\r\n    a = 123\r\n\r\ntest = Test()\r\ntest2 = Test()\r\n\r\nTest.a = 345\r\n\r\nprint(Test.a)\r\nprint(test2.a)\r\n```\r\n\r\nРезультат:\r\n\r\n```text\r\n345\r\n345\r\n```\r\n\r\nРазбор:\r\n\r\n```python\r\nclass Test():\r\n    a = 123\r\n```\r\n\r\n`a` — это атрибут класса, а не атрибут конкретного объекта.\r\n\r\nКогда создаются объекты:\r\n\r\n```python\r\ntest = Test()\r\ntest2 = Test()\r\n```\r\n\r\nу них нет собственного атрибута `a`. Поэтому при обращении:\r\n\r\n```python\r\ntest2.a\r\n```\r\n\r\nPython ищет `a` сначала у объекта `test2`, не находит, затем берёт `a` из класса `Test`.\r\n\r\nПосле строки:\r\n\r\n```python\r\nTest.a = 345\r\n```\r\n\r\nатрибут класса меняется с `123` на `345`.\r\n\r\nПоэтому:\r\n\r\n```python\r\nprint(Test.a)\r\nprint(test2.a)\r\n```\r\n\r\nвыведет:\r\n\r\n```text\r\n345\r\n345\r\n```\r\n\r\nТретий фрагмент:\r\n\r\n```python\r\nfrom fastapi import FastAPI\r\n\r\napp = FastAPI()\r\n\r\n\r\n@app.get(\"/item\")\r\nasync def read_user():\r\n    return [\"Rick\", \"Morty\"]\r\n\r\n\r\n@app.get(\"/item\")\r\nasync def read_user2():\r\n    return [\"Bean\", \"Elfo\"]\r\n```\r\n\r\nПроблема в том, что оба обработчика зарегистрированы на один и тот же маршрут:\r\n\r\n```text\r\nGET /item\r\nGET /item\r\n```\r\n\r\nЭто плохая и неоднозначная реализация. Для одного HTTP-метода и одного URL должен быть один обработчик.\r\n\r\nНа практике первый зарегистрированный обработчик может обработать запрос:\r\n\r\n```python\r\n@app.get(\"/item\")\r\nasync def read_user():\r\n    return [\"Rick\", \"Morty\"]\r\n```\r\n\r\nТо есть при запросе `GET /item` можно получить:\r\n\r\n```python\r\n[\"Rick\", \"Morty\"]\r\n```\r\n\r\nА второй обработчик:\r\n\r\n```python\r\n@app.get(\"/item\")\r\nasync def read_user2():\r\n    return [\"Bean\", \"Elfo\"]\r\n```\r\n\r\nокажется недостижимым для этого же маршрута.\r\n\r\nИсправить можно так — сделать разные пути:\r\n\r\n```python\r\nfrom fastapi import FastAPI\r\n\r\napp = FastAPI()\r\n\r\n\r\n@app.get(\"/rick-and-morty\")\r\nasync def read_user():\r\n    return [\"Rick\", \"Morty\"]\r\n\r\n\r\n@app.get(\"/disenchantment\")\r\nasync def read_user2():\r\n    return [\"Bean\", \"Elfo\"]\r\n```\r\n\r\nИли оставить один путь, но сделать один обработчик:\r\n\r\n```python\r\nfrom fastapi import FastAPI\r\n\r\napp = FastAPI()\r\n\r\n\r\n@app.get(\"/item\")\r\nasync def read_items():\r\n    return {\r\n        \"rick_and_morty\": [\"Rick\", \"Morty\"],\r\n        \"disenchantment\": [\"Bean\", \"Elfo\"],\r\n    }\r\n```\r\n\r\nИтог:\r\n\r\n```text\r\n1. Первый код выведет 10.\r\n2. Второй код выведет 345 и 345.\r\n3. В FastAPI-коде проблема в дублировании маршрута GET /item.\r\n```\r\n\r\n{{< /details >}}\r\n"
  filepath = "mini-code-reviev"

