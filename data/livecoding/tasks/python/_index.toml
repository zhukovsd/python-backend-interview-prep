  id = 12
  question = "Разобрать метакласс с попыткой реализации Singleton"
  answer = "**Условие задачи**\nРазберите поведение метакласса и определите, какую задачу пытается решить данная реализация. Нужно понять, как работает переопределение __new__ в метаклассе и к чему приведёт сохранение экземпляра в атрибуте класса.\n```python\nclass NewCls(type):\n    _instance = None\n\n    def __new__(cls, *args, **kwargs):\n        if not cls._instance:\n            cls._instance = super().__new__(cls, *args, **kwargs)\n        return cls._instance\n```\nЧто выведут принты?\n```python\ntest = NewCls(\"X\", (object,), {\"a\": 1, \"b\": 2})\nprint(test.a) >>\n\ntest2 = NewCls(\"X\", (object,), {\"a\": 12, \"b\": 22})\nprint(test2.a) >>\n```\nИзменили код, что теперь выведут принты?\n```python\nclass NewCls(type):\r\n    _instance = None\r\n\r\n    def __new__(cls, *args, **kwargs):\r\n        if not cls._instance:\r\n            cls._instance = super().__new__(cls, *args, **kwargs)\r\n        return cls._instance\r\n\r\n    def __init__(self, *args):\r\n        self.a = args\r\n\r\ntest = NewCls(\"X\", (object,), {\"a\": 1, \"b\": 2})\r\nprint(test.a) >>\r\n\r\ntest2 = NewCls(\"X\", (object,), {\"a\": 12, \"b\": 22})\r\nprint(test2.a) >>\n```"
  filepath = "metaclass-singleton-attempt"

