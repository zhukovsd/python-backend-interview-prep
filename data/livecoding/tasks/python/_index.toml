  id = 23
  question = "Объяснить как работает поиск максимального случайного числа в цикле и сказать результат выполнения"
  answer = "**Условие задачи**\nНужно сказать результат выполнения кода ниже и объяснить как он работает\n```python\nfrom random import randint\n\nx = 100\ny = 0\n\nfor i in range(x):\n    z = x + randint(0, x)\n    if z > y:\n        y = z\n\nprint(f\"{y = }\")\n```\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* `randint(0, x)` возвращает случайное целое число от `0` до `x` включительно.\r\n* Так как `x = 100`, выражение `randint(0, x)` даёт число от `0` до `100`.\r\n* Значит `z = x + randint(0, x)` даёт число от `100` до `200`.\r\n* Переменная `y` хранит максимальное значение `z`, которое встретилось за 100 итераций.\r\n* Точный результат заранее определить нельзя, потому что используется случайность.\r\n  \r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\n```python\r\nfrom random import randint\r\n\r\nx = 100\r\ny = 0\r\n\r\nfor i in range(x):\r\n    z = x + randint(0, x)\r\n    if z > y:\r\n        y = z\r\n\r\nprint(f\"{y = }\")\r\n```\r\n\r\nТочный вывод заранее предсказать нельзя, потому что используется случайная функция `randint()`.\r\n\r\nНо можно определить диапазон результата:\r\n\r\n```text\r\ny = число от 100 до 200\r\n```\r\n\r\nНапример, возможный вывод:\r\n\r\n```text\r\ny = 200\r\n```\r\n\r\nИли:\r\n\r\n```text id=\"p7f4cm\"\r\ny = 198\r\n```\r\n\r\nКак работает код:\r\n\r\n```python\r\nz = x + randint(0, x)\r\n```\r\n\r\nТак как `x = 100`, значение `z` каждый раз будет случайным числом от `100` до `200` включительно.\r\n\r\nЦикл выполняется 100 раз:\r\n\r\n```python\r\nfor i in range(x):\r\n```\r\n\r\nНа каждой итерации создаётся новое случайное значение `z`. Если оно больше текущего `y`, то `y` обновляется:\r\n\r\n```python \r\nif z > y:\r\n    y = z\r\n```\r\n\r\nВ итоге `y` будет максимальным случайным числом, которое выпало за 100 попыток. Чаще всего результат будет близок к `200`, но строго гарантировать `200` нельзя.\r\n{{< /details >}}\r\n"
  filepath = "random-max-loop"

[[tasks]]
  id = 24
  question = "Объяснить как работает изменяемый аргумент по умолчанию в функции"
  answer = "**Условие задачи**\nНужно сказать результат выполнения кода ниже и объяснить как он работает\n```python\ndef extendList(val, list=[]):\n    list.append(val)\n    return list\n\nlist1 = extendList(10)\nlist2 = extendList(123, [])\nlist3 = extendList('a')\n\nprint(f\"{list1 = }\")\nprint(f\"{list2 = }\")\nprint(f\"{list3 = }\")\n```\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* В Python значения аргументов по умолчанию создаются один раз в момент объявления функции.\r\n* `list=[]` — изменяемый объект.\r\n* Поэтому один и тот же список будет переиспользоваться между вызовами функции.\r\n* `list1` и `list3` используют общий список по умолчанию.\r\n* `list2` получает отдельный список, потому что он передан явно: `[]`.\r\n* Также не стоит называть параметр `list`, потому что так перекрывается встроенный тип `list`.\r\n  \r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\n```python\r\ndef extendList(val, list=[]):\r\n    list.append(val)\r\n    return list\r\n\r\nlist1 = extendList(10)\r\nlist2 = extendList(123, [])\r\nlist3 = extendList('a')\r\n\r\nprint(f\"{list1 = }\")\r\nprint(f\"{list2 = }\")\r\nprint(f\"{list3 = }\")\r\n```\r\n\r\nРезультат:\r\n\r\n```text\r\nlist1 = [10, 'a']\r\nlist2 = [123]\r\nlist3 = [10, 'a']\r\n```\r\n\r\nРазбор:\r\n\r\n```python\r\nlist1 = extendList(10)\r\n```\r\n\r\nФункция вызывается без второго аргумента, поэтому используется список по умолчанию. В него добавляется `10`:\r\n\r\n```python\r\n[10]\r\n```\r\n\r\nДальше:\r\n\r\n```python\r\nlist2 = extendList(123, [])\r\n```\r\n\r\nЗдесь передан новый отдельный список `[]`. В него добавляется `123`:\r\n\r\n```python\r\n[123]\r\n```\r\n\r\nДальше:\r\n\r\n```python\r\nlist3 = extendList('a')\r\n```\r\n\r\nФункция снова вызывается без второго аргумента, поэтому используется тот же самый список по умолчанию, который уже содержит `10`. В него добавляется `'a'`:\r\n\r\n```python\r\n[10, 'a']\r\n```\r\n\r\nТак как `list1` и `list3` ссылаются на один и тот же список, при выводе они будут одинаковыми:\r\n\r\n```python\r\nlist1 is list3  # True\r\n```\r\n\r\nПравильная реализация:\r\n\r\n```python\r\ndef extend_list(val, items=None):\r\n    if items is None:\r\n        items = []\r\n\r\n    items.append(val)\r\n    return items\r\n```\r\n\r\nВ таком варианте новый список создаётся внутри функции при каждом вызове без второго аргумента.\r\n{{< /details >}}\r\n"
  filepath = "mutable-default-arg"

[[tasks]]
  id = 25
  question = "Наследование атрибута класса"
  answer = "**Условие задачи**\nДан родительский класс с атрибутом класса. От него наследуются два дочерних класса, в которых собственные атрибуты не объявлены.\nНужно определить, какое значение будет выведено при обращении к этому атрибуту через родительский класс и через оба дочерних класса.\n```python\nclass Parent(object):\n    x = 1\n\nclass Child1(Parent):\n    pass\n\nclass Child2(Parent):\n    pass\n\nprint(Parent.x, Child1.x, Child2.x)\n```\nЧто будет если мы определим поле х у наследника?\n```python\nChild1.x = 2\nprint(Parent.x, Child1.x, Child2.x)\n```\nА в случае если переопределим у класса от которого наследуемся? (При условии что код выше уже отработал)\n```python\nParent.x = 3\nprint(Parent.x, Child1.x, Child2.x)\n```\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* `x` объявлен как атрибут класса `Parent`.\r\n* Если у дочернего класса нет собственного `x`, Python ищет его у родителя.\r\n* `Child1.x = 2` не меняет `Parent.x`, а создаёт или переопределяет атрибут `x` именно у `Child1`.\r\n* После этого `Child1.x` уже берётся из самого `Child1`, а не из `Parent`.\r\n* Если затем изменить `Parent.x`, это повлияет на `Child2.x`, потому что `Child2` всё ещё берёт `x` у родителя.\r\n* На `Child1.x` это уже не повлияет, потому что у `Child1` есть собственный атрибут `x`.\r\n  \r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\n```python\r\nclass Parent(object):\r\n    x = 1\r\n\r\nclass Child1(Parent):\r\n    pass\r\n\r\nclass Child2(Parent):\r\n    pass\r\n\r\nprint(Parent.x, Child1.x, Child2.x)\r\n```\r\n\r\nРезультат:\r\n\r\n```text\r\n1 1 1\r\n```\r\n\r\nУ `Child1` и `Child2` нет собственного атрибута `x`, поэтому оба класса берут его у родительского класса `Parent`.\r\n\r\nДальше:\r\n\r\n```python\r\nChild1.x = 2\r\nprint(Parent.x, Child1.x, Child2.x)\r\n```\r\n\r\nРезультат:\r\n\r\n```text\r\n1 2 1\r\n```\r\n\r\nСтрока:\r\n\r\n```python\r\nChild1.x = 2\r\n```\r\n\r\nне изменяет `Parent.x`. Она создаёт собственный атрибут `x` внутри класса `Child1`.\r\n\r\nПоэтому:\r\n\r\n```text\r\nParent.x = 1\r\nChild1.x = 2\r\nChild2.x = 1\r\n```\r\n\r\nДальше, при условии что предыдущий код уже выполнился:\r\n\r\n```python\r\nParent.x = 3\r\nprint(Parent.x, Child1.x, Child2.x)\r\n```\r\n\r\nРезультат:\r\n\r\n```text\r\n3 2 3\r\n```\r\n\r\n`Parent.x` изменился на `3`.\r\n\r\n`Child2.x` тоже стал `3`, потому что `Child2` всё ещё не имеет собственного `x` и берёт значение у `Parent`.\r\n\r\n`Child1.x` остался `2`, потому что у `Child1` уже есть собственный атрибут `x`, который перекрывает родительский.\r\n{{< /details >}}\r\n"
  filepath = "class-attribute-inheritance"

[[tasks]]
  id = 26
  question = "Найти ошибки в коде асинхронных HTTP-запросов через aiohttp и asyncio.gather"
  answer = "**Условие задачи**\nНайти ошибки в коде ниже\n```python\nimport aiohttp\nimport asyncio\n\nurl = 'https://en.wikipedia.org/w/api.php?action=query&prop=extracts&exintro&explaintext&titles={title}'\nTitles = ['Python', 'Dog', 'Cat']\n\nasync def make_req(session, title: str) -> dict:\n    async with session.get(url.format(title)) as response:\n        return await response.json()\n\nasync def main(titles: list = None):\n    async with aiohttp.ClientSession() as session:\n        tasks = [make_req(session, title) for title in Titles]\n        responses = asyncio.gather(*tasks)\n        for response in responses:\n            print(response)\n\nawait main(titles=Titles)\n```\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* В строке `url.format(title)` используется неправильная подстановка значения.\r\n* В шаблоне URL стоит именованный плейсхолдер `{title}`, значит нужно использовать `url.format(title=title)`.\r\n* В `main()` передаётся параметр `titles`, но внутри используется глобальная переменная `Titles`.\r\n* `asyncio.gather(*tasks)` нужно обязательно ожидать через `await`.\r\n* В обычном `.py` файле нельзя писать `await main(...)` на верхнем уровне.\r\n* Для запуска асинхронной функции в обычном скрипте нужно использовать `asyncio.run(...)`.\r\n* Лучше не собирать URL строкой, а передавать query-параметры через `params`.\r\n\r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\nОшибки в исходном коде:\r\n\r\n```python\r\nasync with session.get(url.format(title)) as response:\r\n```\r\n\r\nЗдесь ошибка, потому что в строке URL используется именованный плейсхолдер:\r\n\r\n```python\r\n{title}\r\n```\r\n\r\nЗначит нужно писать так:\r\n\r\n```python\r\nurl.format(title=title)\r\n```\r\n\r\nДальше:\r\n\r\n```python\r\ntasks = [make_req(session, title) for title in Titles]\r\n```\r\n\r\nФункция `main()` принимает аргумент `titles`, но внутри используется глобальная переменная `Titles`. Правильно использовать переданный аргумент:\r\n\r\n```python\r\ntasks = [make_req(session, title) for title in titles]\r\n```\r\n\r\nДальше:\r\n\r\n```python\r\nresponses = asyncio.gather(*tasks)\r\n```\r\n\r\n`asyncio.gather()` возвращает awaitable-объект. Его нужно ожидать:\r\n\r\n```python\r\nresponses = await asyncio.gather(*tasks)\r\n```\r\n\r\nИсправленный вариант:\r\n\r\n```python\r\nimport aiohttp\r\nimport asyncio\r\n\r\n\r\nURL = \"https://en.wikipedia.org/w/api.php\"\r\n\r\n\r\nasync def make_req(session: aiohttp.ClientSession, title: str) -> dict:\r\n    params = {\r\n        \"action\": \"query\",\r\n        \"prop\": \"extracts\",\r\n        \"exintro\": True,\r\n        \"explaintext\": True,\r\n        \"titles\": title,\r\n        \"format\": \"json\",\r\n    }\r\n\r\n    async with session.get(URL, params=params) as response:\r\n        response.raise_for_status()\r\n        return await response.json()\r\n\r\n\r\nasync def main(titles: list[str]) -> None:\r\n    async with aiohttp.ClientSession() as session:\r\n        tasks = [\r\n            make_req(session, title)\r\n            for title in titles\r\n        ]\r\n\r\n        responses = await asyncio.gather(*tasks)\r\n\r\n        for response in responses:\r\n            print(response)\r\n\r\n\r\ntitles = [\"Python\", \"Dog\", \"Cat\"]\r\n\r\nasyncio.run(main(titles))\r\n```\r\n\r\nЧто было исправлено:\r\n\r\n```text\r\n1. URL теперь собирается через params, а не через ручной format.\r\n2. В запрос добавлен format=json, чтобы API вернул JSON.\r\n3. main() использует переданный аргумент titles, а не глобальную переменную Titles.\r\n4. asyncio.gather() теперь ожидается через await.\r\n5. Для запуска используется asyncio.run(main(titles)).\r\n6. Добавлен response.raise_for_status(), чтобы HTTP-ошибки не игнорировались.\r\n```\r\n\r\nБолее близкий к исходному коду вариант:\r\n\r\n```python\r\nimport aiohttp\r\nimport asyncio\r\n\r\n\r\nurl = \"https://en.wikipedia.org/w/api.php?action=query&prop=extracts&exintro&explaintext&format=json&titles={title}\"\r\ntitles = [\"Python\", \"Dog\", \"Cat\"]\r\n\r\n\r\nasync def make_req(session, title: str) -> dict:\r\n    async with session.get(url.format(title=title)) as response:\r\n        response.raise_for_status()\r\n        return await response.json()\r\n\r\n\r\nasync def main(titles: list[str]) -> None:\r\n    async with aiohttp.ClientSession() as session:\r\n        tasks = [\r\n            make_req(session, title)\r\n            for title in titles\r\n        ]\r\n\r\n        responses = await asyncio.gather(*tasks)\r\n\r\n        for response in responses:\r\n            print(response)\r\n\r\n\r\nasyncio.run(main(titles))\r\n```\r\n\r\nГлавная причина ошибки: корутины были собраны через `asyncio.gather()`, но результат `gather()` не был ожидаем через `await`. Плюс в URL была неправильная подстановка значения в `{title}`.\r\n{{< /details >}}\r\n"
  filepath = "async-aiohttp-gather"

[[tasks]]
  id = 27
  question = "Сказать результат сравнения идентичности строк"
  answer = "**Условие задачи**\nПроверить, указывают ли две переменные со строковым значением \"hello\" на один и тот же объект в памяти с помощью оператора is.\n```python\na = \"hello\"\nb = \"hello\"\n\na == b\na is b\n```\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* Оператор `==` сравнивает значения объектов.\r\n* Оператор `is` проверяет, указывают ли переменные на один и тот же объект в памяти.\r\n* Строковые литералы вроде `\"hello\"` в CPython обычно интернируются.\r\n* Поэтому две переменные с одинаковым строковым литералом могут ссылаться на один и тот же объект.\r\n* Для сравнения строк по содержимому нужно использовать `==`, а не `is`.\r\n  \r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\n```python\r\na = \"hello\"\r\nb = \"hello\"\r\n\r\nprint(a == b)\r\nprint(a is b)\r\n```\r\n\r\nРезультат в CPython обычно будет таким:\r\n\r\n```text\r\nTrue\r\nTrue\r\n```\r\n\r\nРазбор:\r\n\r\n```python\r\na == b\r\n```\r\n\r\nВернёт:\r\n\r\n```text\r\nTrue\r\n```\r\n\r\nПотому что значения строк одинаковые:\r\n\r\n```python\r\n\"hello\" == \"hello\"\r\n```\r\n\r\nДальше:\r\n\r\n```python\r\na is b\r\n```\r\n\r\nТоже обычно вернёт:\r\n\r\n```text\r\nTrue\r\n```\r\n\r\nПотому что строка `\"hello\"` является строковым литералом, и Python обычно интернирует такие строки. В результате `a` и `b` могут ссылаться на один и тот же объект в памяти.\r\n\r\nНо важный момент: для строк нельзя полагаться на `is` при сравнении содержимого. Правильное сравнение строк — через `==`.\r\n\r\nОператор `is` нужен для проверки идентичности объектов, например:\r\n\r\n```python\r\nx is None\r\n```\r\n\r\n{{< /details >}}\r\n"
  filepath = "string-identity-check"

