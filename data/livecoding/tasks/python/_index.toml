  id = 35
  question = "Увеличение значений словаря на единицу"
  answer = "**Условие задачи:**  \nЕсть словарь, надо значение каждого ключа увеличить на +1, вернуть тот же словарь.  \n```python\ndict1 = {'fy2yy1': 45, 'gh12h2hh': 98, 'b1r22rr3n2': 12}\n```\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* Нужно пройтись по всем ключам словаря.\r\n* По каждому ключу нужно увеличить значение на `1`.\r\n* Так как нужно вернуть тот же словарь, нельзя создавать новый словарь через dict comprehension.\r\n* Значения можно менять прямо внутри исходного словаря.\r\n* Безопасно итерироваться по ключам через `for key in data`.\r\n  \r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\n```python\r\ndef increment_values(data: dict[str, int]) -> dict[str, int]:\r\n    for key in data:\r\n        data[key] += 1\r\n\r\n    return data\r\n```\r\n\r\nПример использования:\r\n\r\n```python\r\ndict1 = {\r\n    \"fy2yy1\": 45,\r\n    \"gh12h2hh\": 98,\r\n    \"b1r22rr3n2\": 12\r\n}\r\n\r\nresult = increment_values(dict1)\r\n\r\nprint(result)\r\nprint(result is dict1)\r\n```\r\n\r\nРезультат:\r\n\r\n```text\r\n{'fy2yy1': 46, 'gh12h2hh': 99, 'b1r22rr3n2': 13}\r\nTrue\r\n```\r\n\r\nФункция проходит по ключам словаря и увеличивает значение каждого ключа на `1`.\r\n\r\nВажно: функция возвращает тот же самый словарь, а не создаёт новый. Это видно по проверке:\r\n\r\n```python\r\nresult is dict1\r\n```\r\n\r\nОна вернёт `True`.\r\n{{< /details >}}\r\n"
  filepath = "dict-values-plus-one"

