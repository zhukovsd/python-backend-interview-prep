  id = 47
  question = "Асинхронный декоратор медленных вызовов"
  answer = "**Условие здаадчи:**  \nДан асинхронный код. Нужно реализовать декоратор slowlog(threshold=3), который измеряет время выполнения асинхронной функции.\n\nТребования:\n\nесли функция выполняется быстрее или ровно за threshold секунд, логирование не выполняется\nесли функция выполняется дольше threshold секунд, нужно что-то залогировать\nдекоратор должен корректно работать с async def функциями\nвозвращаемое значение исходной функции должно сохраняться без изменений\n\n```python\nimport asyncio\n\n@slowlog(threshold=3)\nasync def some_func(seconds):\n    await asyncio.sleep(seconds)\n    return seconds * 2\n\nassert asyncio.run(some_func(1)) == 2  # не должно логгироваться\nassert asyncio.run(some_func(5)) == 10  # должно логгироваться\n\n# После превышения threshold секунд, мы логгируем что-то\n```\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* Декоратор должен принимать параметр `threshold`, значит нужен декоратор-фабрика.\r\n* Так как декорируемая функция асинхронная, обёртка тоже должна быть `async def`.\r\n* Внутри обёртки нужно вызвать исходную функцию через `await`.\r\n* Для измерения времени лучше использовать `time.perf_counter()`.\r\n* Если время выполнения больше `threshold`, нужно выполнить логирование.\r\n* Возвращаемое значение исходной функции нужно вернуть без изменений.\r\n* Чтобы сохранить имя и метаданные функции, стоит использовать `functools.wraps`.\r\n  \r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\n```python\r\nimport asyncio\r\nimport time\r\nfrom functools import wraps\r\n\r\n\r\ndef slowlog(threshold: float = 3):\r\n    def decorator(func):\r\n        @wraps(func)\r\n        async def wrapper(*args, **kwargs):\r\n            start_time = time.perf_counter()\r\n\r\n            result = await func(*args, **kwargs)\r\n\r\n            end_time = time.perf_counter()\r\n            duration = end_time - start_time\r\n\r\n            if duration > threshold:\r\n                print(\r\n                    f\"Slow function: {func.__name__} \"\r\n                    f\"worked {duration:.2f} seconds\"\r\n                )\r\n\r\n            return result\r\n\r\n        return wrapper\r\n\r\n    return decorator\r\n```\r\n\r\nПример использования:\r\n\r\n```python\r\n@slowlog(threshold=3)\r\nasync def some_func(seconds):\r\n    await asyncio.sleep(seconds)\r\n    return seconds * 2\r\n\r\n\r\nassert asyncio.run(some_func(1)) == 2   # не логгируется\r\nassert asyncio.run(some_func(5)) == 10  # логгируется\r\n```\r\n\r\nПримерный вывод для второго вызова:\r\n\r\n```text\r\nSlow function: some_func worked 5.00 seconds\r\n```\r\n\r\nДекоратор `slowlog(threshold=3)` сначала возвращает обычный декоратор `decorator`, а тот уже принимает исходную функцию `func`.\r\n\r\nТак как `some_func` является асинхронной функцией, внутри `wrapper` обязательно используется:\r\n\r\n```python\r\nresult = await func(*args, **kwargs)\r\n```\r\n\r\nБез `await` функция не была бы выполнена нормально, а вместо результата вернулась бы coroutine.\r\n\r\nПроверка времени выполняется после завершения функции:\r\n\r\n```python\r\nif duration > threshold:\r\n    print(...)\r\n```\r\n\r\nПо условию логирование должно быть только если функция работает дольше `threshold`. Поэтому при `duration == threshold` логирования не будет.\r\n\r\nСложность по времени самого декоратора — `O(1)`, если не учитывать время работы исходной функции. По памяти — `O(1)`.\r\n{{< /details >}}\r\n"
  filepath = "async-slowlog-decorator"

