  id = 36
  question = "Замена цифры в ключах словаря"
  answer = "**Условие задачи:**  \nДан словарь. Нужно пройти по его ключам, найти в каждом ключе все вхождения цифры 2 и заменить их на 3, сохранив соответствующие значения.\n\n```python\ndict1 = {'fy2yy1': 45, 'gh12h2hh': 98, 'b1r22rr3n2': 12}\n```\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* Ключ словаря нельзя изменить напрямую.\r\n* Нужно создать новый ключ на основе старого.\r\n* Для замены всех вхождений цифры `\"2\"` на `\"3\"` удобно использовать метод `.replace()`.\r\n* Значение нужно оставить тем же самым.\r\n* Самый простой вариант — собрать новый словарь через dict comprehension.\r\n  \r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\n```python\r\ndict1 = {\r\n    \"fy2yy1\": 45,\r\n    \"gh12h2hh\": 98,\r\n    \"b1r22rr3n2\": 12\r\n}\r\n\r\nresult = {\r\n    key.replace(\"2\", \"3\"): value\r\n    for key, value in dict1.items()\r\n}\r\n\r\nprint(result)\r\n```\r\n\r\nРезультат:\r\n\r\n```text\r\n{'fy3yy1': 45, 'gh13h3hh': 98, 'b1r33rr3n3': 12}\r\n```\r\n\r\nМетод:\r\n\r\n```python\r\nkey.replace(\"2\", \"3\")\r\n```\r\n\r\nзаменяет все вхождения символа `\"2\"` в ключе на символ `\"3\"`. Значение при этом не меняется и переносится в новый словарь.\r\n\r\nЕсли нужно изменить именно исходный словарь, можно сделать так:\r\n\r\n```python\r\ndict1 = {\r\n    \"fy2yy1\": 45,\r\n    \"gh12h2hh\": 98,\r\n    \"b1r22rr3n2\": 12\r\n}\r\n\r\nupdated = {\r\n    key.replace(\"2\", \"3\"): value\r\n    for key, value in dict1.items()\r\n}\r\n\r\ndict1.clear()\r\ndict1.update(updated)\r\n\r\nprint(dict1)\r\n```\r\n\r\nРезультат:\r\n\r\n```text\r\n{'fy3yy1': 45, 'gh13h3hh': 98, 'b1r33rr3n3': 12}\r\n```\r\n\r\nВторой вариант сохраняет сам объект словаря `dict1`, но заменяет его содержимое на обновлённые пары ключ-значение.\r\n{{< /details >}}\r\n"
  filepath = "dict-key-replace"

