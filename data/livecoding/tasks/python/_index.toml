  id = 40
  question = "Бесконечный генератор для итерируемого объекта"
  answer = "**Условие задачи:**  \nНаписать бесконечный генератор, который принимает любой итерируемый объект и по кругу возвращает его элементы без завершения.\n\n**Пример:**  \n```python\n# [1, 2, 3] -> 1, 2, 3, 1, 2, 3, ...\n\nfrom typing import Iterable\n\ndef my_gen(inp_value: Iterable):\n    ...\n```\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* Нужна функция-генератор, значит внутри должен быть `yield`.\r\n* Нужно пройти по переданному итерируемому объекту.\r\n* После последнего элемента генератор должен снова начать с первого.\r\n* Для этого можно использовать бесконечный цикл `while True`.\r\n* Чтобы можно было повторно проходить по данным, входной объект лучше сохранить в `tuple` или `list`.\r\n* Если передан пустой итерируемый объект, бесконечно возвращать нечего.\r\n  \r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\n```python\r\nfrom typing import Iterable, Iterator, TypeVar\r\n\r\n\r\nT = TypeVar(\"T\")\r\n\r\n\r\ndef my_gen(inp_value: Iterable[T]) -> Iterator[T]:\r\n    values = tuple(inp_value)\r\n\r\n    if not values:\r\n        return\r\n\r\n    while True:\r\n        for item in values:\r\n            yield item\r\n```\r\n\r\nПример использования:\r\n\r\n```python\r\ngen = my_gen([1, 2, 3])\r\n\r\nfor _ in range(10):\r\n    print(next(gen), end=\" \")\r\n```\r\n\r\nРезультат:\r\n\r\n```text\r\n1 2 3 1 2 3 1 2 3 1\r\n```\r\n\r\nФункция сначала сохраняет элементы входного итерируемого объекта в `tuple`:\r\n\r\n```python\r\nvalues = tuple(inp_value)\r\n```\r\n\r\nЭто нужно, чтобы по элементам можно было проходить снова и снова. Затем запускается бесконечный цикл:\r\n\r\n```python\r\nwhile True:\r\n```\r\n\r\nВнутри него функция каждый раз проходит по сохранённым значениям и отдаёт элементы через `yield`.\r\n\r\nАльтернативный короткий вариант через стандартную библиотеку:\r\n\r\n```python\r\nfrom itertools import cycle\r\nfrom typing import Iterable, Iterator, TypeVar\r\n\r\n\r\nT = TypeVar(\"T\")\r\n\r\n\r\ndef my_gen(inp_value: Iterable[T]) -> Iterator[T]:\r\n    return cycle(inp_value)\r\n```\r\n\r\n`itertools.cycle()` делает то же самое: бесконечно возвращает элементы итерируемого объекта по кругу.\r\n{{< /details >}}\r\n"
  filepath = "infinite-iterable-generator"

