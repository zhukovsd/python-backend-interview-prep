category = "SQL"

[[tasks]]
  id = 1
  question = "Найди id юнитов, которые были проданы на сумму более 1000 рублей после 10:00 сегодняшнего дня. > \"2024-06-03 10:00\""
  answer = "```sql\n-- Создание таблицы Unit\nCREATE TABLE Unit (\n    Id INT PRIMARY KEY,\n    Price DECIMAL(10, 2)\n);\n\n-- Создание таблицы Sales\nCREATE TABLE Sales (\n    Id INT PRIMARY KEY,\n    Unit_id INT,\n    Sale_time TIMESTAMP,\n    FOREIGN KEY (Unit_id) REFERENCES Unit(Id)\n);\n```\n\n{{< hint warning >}}\n**Спойлеры к решению**  \n{{< /hint >}}\n\n{{< details \"Подсказки\" close >}}\n- Нужно выбрать `Unit.Id`, у которых сумма продаж превышает `1000` рублей.\n- Для фильтрации использовать `SUM(Price) > 1000` и `Sale_time > '2024-06-03 10:00'`.\n- Объединяем таблицы через `JOIN` по `Unit.Id = Sales.Unit_id`.\n- Используем `GROUP BY Unit_id`, чтобы агрегировать суммы.\n{{< /details >}}\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT u.Id \nFROM Unit u\nJOIN Sales s ON u.Id = s.Unit_id\nWHERE s.Sale_time > '2024-06-03 10:00'\nGROUP BY u.Id\nHAVING SUM(u.Price) > 1000;\n```\n\nЭтот SQL-запрос выбирает идентификаторы юнитов (`Id`), у которых сумма продаж после 10:00 превышает 1000 рублей. ✅\n{{< /details >}}"
  filepath = "units-sold-after-time"

[[tasks]]
  id = 2
  question = "Создай таблицы пользователей и заказов"
  answer = "**Условие задачи:**  \nРеализовать SQL-схему базы данных из двух таблиц: users и orders.  \nТаблица users должна хранить пользователей и содержать поля:\n- id\n- name\n\nТаблица orders должна хранить заказы пользователей и содержать поля:\n- id\n- user_id\n- order_date\n\nПоле orders.user_id должно быть внешним ключом, связанным с users.id.\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n{{< details \"Подсказки\" close >}}\n- Сначала нужно создать таблицу `users`, потому что на неё будет ссылаться таблица `orders`.\n- Поле `users.id` должно быть первичным ключом.\n- Поле `orders.id` тоже должно быть первичным ключом.\n- Поле `orders.user_id` должно ссылаться на `users.id` через `FOREIGN KEY`.\n- Таблица `orders` создаётся после `users`, иначе внешний ключ не сможет сослаться на ещё несуществующую таблицу.  \n{{< /details >}}\n    \n\n{{< details \"Решение\" close >}}\n\n```sql\nCREATE TABLE users (\n    id SERIAL PRIMARY KEY,\n    name VARCHAR(255) NOT NULL\n);\n\nCREATE TABLE orders (\n    id SERIAL PRIMARY KEY,\n    user_id INTEGER NOT NULL,\n    order_date DATE NOT NULL,\n    CONSTRAINT fk_orders_user\n        FOREIGN KEY (user_id)\n        REFERENCES users(id)\n);\n```\n\nЭта SQL-схема создаёт две таблицы: `users` для хранения пользователей и `orders` для хранения заказов. Поле `orders.user_id` связано с `users.id` через внешний ключ, поэтому заказ не может ссылаться на несуществующего пользователя.  \n{{< /details >}}"
  filepath = "create-users-orders-tables"

[[tasks]]
  id = 3
  question = "Реализовать таблицы книг и авторов"
  answer = "**Условие задачи:**  \nРеализовать SQL-схему базы данных из двух таблиц: books и autors. Нужно использовать связь многие ко многим.\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* Связь многие ко многим нельзя нормально реализовать только двумя таблицами.\r\n* Нужна третья промежуточная таблица, например `book_autors`.\r\n* В таблице `books` хранятся книги.\r\n* В таблице `autors` хранятся авторы.\r\n* В таблице `book_autors` хранятся пары `book_id` и `autor_id`.\r\n* Поля `book_id` и `autor_id` должны быть внешними ключами.\r\n* Чтобы одна и та же пара книга-автор не дублировалась, можно сделать составной первичный ключ из `book_id` и `autor_id`.\r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\n```sql\r\nCREATE TABLE books (\r\n    id SERIAL PRIMARY KEY,\r\n    title VARCHAR(255) NOT NULL\r\n);\r\n\r\nCREATE TABLE autors (\r\n    id SERIAL PRIMARY KEY,\r\n    name VARCHAR(255) NOT NULL\r\n);\r\n\r\nCREATE TABLE book_autors (\r\n    book_id INTEGER NOT NULL,\r\n    autor_id INTEGER NOT NULL,\r\n\r\n    PRIMARY KEY (book_id, autor_id),\r\n\r\n    CONSTRAINT fk_book_autors_book\r\n        FOREIGN KEY (book_id)\r\n        REFERENCES books(id)\r\n        ON DELETE CASCADE,\r\n\r\n    CONSTRAINT fk_book_autors_autor\r\n        FOREIGN KEY (autor_id)\r\n        REFERENCES autors(id)\r\n        ON DELETE CASCADE\r\n);\r\n```\r\n\r\nЭта схема реализует связь многие ко многим: одна книга может иметь нескольких авторов, и один автор может быть связан с несколькими книгами. Для этого используется промежуточная таблица `book_autors`, которая хранит пары `book_id` и `autor_id`.\r\n{{< /details >}}\r\n"
  filepath = "сreate-books-autors-tables"

[[tasks]]
  id = 4
  question = "Поиск пропущенного значения в числовой последовательности SQL-запросом"
  answer = "**Условие задачи:**  \nНаписать SQL-запрос, который находит пропущенные значения в числовой последовательности.  \nНапример, если в данных есть значения 1, 2, 3, 5, запрос должен определить, что пропущено значение 4.  \nЗапрос должен находить отсутствующие числа внутри последовательности на основе имеющихся значений в таблице.  \n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* Нужно найти минимальное и максимальное значение в существующей последовательности.\r\n* Затем нужно сгенерировать полный диапазон чисел от `MIN(value)` до `MAX(value)`.\r\n* После этого сравнить полный диапазон с реальными значениями из таблицы.\r\n* Числа, которых нет в исходной таблице, и будут пропущенными.\r\n* В PostgreSQL удобно использовать функцию `generate_series()`.\r\n  {{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\n```sql\r\nSELECT gs.number AS missing_number\r\nFROM generate_series(\r\n    (SELECT MIN(value) FROM numbers),\r\n    (SELECT MAX(value) FROM numbers)\r\n) AS gs(number)\r\nLEFT JOIN numbers n ON n.value = gs.number\r\nWHERE n.value IS NULL;\r\n```\r\n\r\nЭтот SQL-запрос находит пропущенные числа внутри последовательности.\r\nНапример, если в таблице `numbers` есть значения `1, 2, 3, 5`, то `generate_series()` создаст полный ряд `1, 2, 3, 4, 5`, а `LEFT JOIN` покажет, что значения `4` нет в таблице.\r\n\r\nЗдесь предполагается, что таблица называется `numbers`, а числовое поле — `value`.\r\n{{< /details >}}\r\n"
  filepath = "missing-sequence-sql"

[[tasks]]
  id = 5
  question = "Проектирование схемы БД для клиентов, счетов и платежей"
  answer = "**Условие задачи:**  \nНеобходимо спроектировать реляционную схему базы данных для трех сущностей:  \n- клиенты\n- счета\n- платежи\n\nНужно определить:  \n- какие поля должны быть у каждой сущности\n- какие первичные и внешние ключи нужны\n- как связаны между собой клиенты, счета и платежи\n\nОжидается, что:  \n- один клиент может иметь несколько счетов\n- каждый счет принадлежит одному клиенту\n- платежи должны быть связаны со счетами\n- по схеме должно быть понятно, откуда списываются и куда зачисляются деньги, если это предусмотрено логикой\n\nНужно составить структуру таблиц и описать связи между ними.  \n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* Между `clients` и `accounts` связь один ко многим: один клиент может иметь несколько счетов.\r\n* В таблице `accounts` нужен внешний ключ `client_id`, который ссылается на `clients.id`.\r\n* Платеж лучше связать сразу с двумя счетами: `from_account_id` и `to_account_id`.\r\n* `from_account_id` показывает, откуда списываются деньги.\r\n* `to_account_id` показывает, куда зачисляются деньги.\r\n* Для суммы платежа лучше использовать `NUMERIC`, а не `FLOAT`.\r\n* Для платежа желательно добавить ограничение `amount > 0`.\r\n* Чтобы нельзя было перевести деньги с одного счёта на тот же самый счёт, можно добавить `CHECK (from_account_id <> to_account_id)`.\r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\n```sql\r\nCREATE TABLE clients (\r\n    id SERIAL PRIMARY KEY,\r\n    full_name VARCHAR(255) NOT NULL,\r\n    email VARCHAR(255) UNIQUE,\r\n    phone VARCHAR(50),\r\n    created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP\r\n);\r\n\r\nCREATE TABLE accounts (\r\n    id SERIAL PRIMARY KEY,\r\n    client_id INTEGER NOT NULL,\r\n    account_number VARCHAR(50) NOT NULL UNIQUE,\r\n    balance NUMERIC(14, 2) NOT NULL DEFAULT 0,\r\n    currency CHAR(3) NOT NULL DEFAULT 'RUB',\r\n    status VARCHAR(30) NOT NULL DEFAULT 'active',\r\n    created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,\r\n\r\n    CONSTRAINT fk_accounts_client\r\n        FOREIGN KEY (client_id)\r\n        REFERENCES clients(id)\r\n        ON DELETE RESTRICT\r\n);\r\n\r\nCREATE TABLE payments (\r\n    id SERIAL PRIMARY KEY,\r\n    from_account_id INTEGER NOT NULL,\r\n    to_account_id INTEGER NOT NULL,\r\n    amount NUMERIC(14, 2) NOT NULL,\r\n    currency CHAR(3) NOT NULL DEFAULT 'RUB',\r\n    status VARCHAR(30) NOT NULL DEFAULT 'created',\r\n    purpose TEXT,\r\n    payment_date TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,\r\n\r\n    CONSTRAINT fk_payments_from_account\r\n        FOREIGN KEY (from_account_id)\r\n        REFERENCES accounts(id)\r\n        ON DELETE RESTRICT,\r\n\r\n    CONSTRAINT fk_payments_to_account\r\n        FOREIGN KEY (to_account_id)\r\n        REFERENCES accounts(id)\r\n        ON DELETE RESTRICT,\r\n\r\n    CONSTRAINT chk_payments_amount_positive\r\n        CHECK (amount > 0),\r\n\r\n    CONSTRAINT chk_payments_different_accounts\r\n        CHECK (from_account_id <> to_account_id)\r\n);\r\n```\r\n\r\nСвязи в этой схеме:\r\n\r\n```text\r\nclients 1 ─── N accounts\r\n\r\naccounts 1 ─── N payments через payments.from_account_id\r\naccounts 1 ─── N payments через payments.to_account_id\r\n```\r\n\r\nТаблица `clients` хранит клиентов.\r\nТаблица `accounts` хранит счета клиентов, каждый счёт принадлежит одному клиенту через поле `client_id`.\r\nТаблица `payments` хранит платежи между счетами: поле `from_account_id` показывает счёт списания, а поле `to_account_id` показывает счёт зачисления.\r\n\r\nНапример, если клиент переводит деньги со своего счёта на счёт другого клиента, в `payments` сохраняется одна запись: от какого счёта ушли деньги, на какой счёт пришли деньги, сумма, валюта, дата и статус платежа.\r\n{{< /details >}}\r\n"
  filepath = "client-account-payment-db"

[[tasks]]
  id = 6
  question = "Получение топ-10 самых крупных счетов в реальном времени"
  answer = "**Условие задачи:**  \nНеобходимо организовать получение в режиме реального времени 10 самых крупных счетов.  \nПод крупными счетами понимаются счета с наибольшим балансом или остатком средств. Решение должно позволять быстро получать актуальный топ-10 при частом изменении данных, например при поступлении новых платежей, списаний или обновлении баланса.  \nНужно продумать способ хранения, обновления и выборки данных так, чтобы список крупнейших счетов всегда был максимально актуальным и получался с минимальной задержкой.\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* Основной источник правды — таблица `accounts`, где хранится актуальный `balance`.\r\n* Чтобы быстро получать топ-10, нужен индекс по `balance` в порядке убывания.\r\n* Запрос должен использовать `ORDER BY balance DESC LIMIT 10`.\r\n* Баланс должен обновляться при каждом платеже, списании или пополнении.\r\n* Для денежных значений нужно использовать `NUMERIC`, а не `FLOAT`.\r\n* Для конкурентных переводов желательно блокировать изменяемые счета через `SELECT ... FOR UPDATE`.\r\n* `MATERIALIZED VIEW` для строго real-time хуже, потому что её нужно обновлять отдельно.\r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\n```sql id=\"q9r2bk\"\r\nCREATE TABLE clients (\r\n    id SERIAL PRIMARY KEY,\r\n    full_name VARCHAR(255) NOT NULL\r\n);\r\n\r\nCREATE TABLE accounts (\r\n    id SERIAL PRIMARY KEY,\r\n    client_id INTEGER NOT NULL,\r\n    account_number VARCHAR(50) NOT NULL UNIQUE,\r\n    balance NUMERIC(14, 2) NOT NULL DEFAULT 0,\r\n    currency CHAR(3) NOT NULL DEFAULT 'RUB',\r\n    updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,\r\n\r\n    CONSTRAINT fk_accounts_client\r\n        FOREIGN KEY (client_id)\r\n        REFERENCES clients(id),\r\n\r\n    CONSTRAINT chk_accounts_balance_non_negative\r\n        CHECK (balance >= 0)\r\n);\r\n\r\nCREATE TABLE payments (\r\n    id SERIAL PRIMARY KEY,\r\n    from_account_id INTEGER,\r\n    to_account_id INTEGER,\r\n    amount NUMERIC(14, 2) NOT NULL,\r\n    created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,\r\n\r\n    CONSTRAINT fk_payments_from_account\r\n        FOREIGN KEY (from_account_id)\r\n        REFERENCES accounts(id),\r\n\r\n    CONSTRAINT fk_payments_to_account\r\n        FOREIGN KEY (to_account_id)\r\n        REFERENCES accounts(id),\r\n\r\n    CONSTRAINT chk_payments_amount_positive\r\n        CHECK (amount > 0),\r\n\r\n    CONSTRAINT chk_payments_accounts_different\r\n        CHECK (\r\n            from_account_id IS NULL\r\n            OR to_account_id IS NULL\r\n            OR from_account_id <> to_account_id\r\n        )\r\n);\r\n\r\nCREATE INDEX idx_accounts_balance_desc\r\nON accounts (balance DESC, id);\r\n```\r\n\r\nЗапрос для получения 10 самых крупных счетов:\r\n\r\n```sql id=\"x4m8sv\"\r\nSELECT \r\n    id,\r\n    client_id,\r\n    account_number,\r\n    balance,\r\n    currency\r\nFROM accounts\r\nORDER BY balance DESC, id\r\nLIMIT 10;\r\n```\r\n\r\nПример обновления баланса при переводе между счетами:\r\n\r\n```sql id=\"d7n3ca\"\r\nBEGIN;\r\n\r\nSELECT id\r\nFROM accounts\r\nWHERE id IN (:from_account_id, :to_account_id)\r\nFOR UPDATE;\r\n\r\nUPDATE accounts\r\nSET \r\n    balance = balance - :amount,\r\n    updated_at = CURRENT_TIMESTAMP\r\nWHERE id = :from_account_id;\r\n\r\nUPDATE accounts\r\nSET \r\n    balance = balance + :amount,\r\n    updated_at = CURRENT_TIMESTAMP\r\nWHERE id = :to_account_id;\r\n\r\nINSERT INTO payments (\r\n    from_account_id,\r\n    to_account_id,\r\n    amount\r\n)\r\nVALUES (\r\n    :from_account_id,\r\n    :to_account_id,\r\n    :amount\r\n);\r\n\r\nCOMMIT;\r\n```\r\n\r\nИдея решения: актуальный остаток хранится в `accounts.balance`, а быстрый доступ к крупнейшим счетам обеспечивает индекс `idx_accounts_balance_desc`. При запросе топ-10 база может идти по индексу от самых больших балансов и брать только первые 10 строк, вместо полного сканирования и сортировки всей таблицы.\r\n\r\nДля строгого real-time лучше не использовать отдельную таблицу `top_accounts`, потому что её придётся постоянно синхронизировать. Надёжнее хранить актуальные балансы в `accounts` и получать топ через индексированный запрос.\r\n\r\nЕсли нагрузка очень высокая, можно дополнительно держать кэш в Redis Sorted Set, где `score` — это баланс, а `member` — `account_id`. Но PostgreSQL всё равно должен оставаться источником правды, а Redis — только быстрым read-cache.\r\n\r\nДокументация PostgreSQL: B-tree индекс подходит для отсортированных значений, а индексы могут использоваться для `ORDER BY`, особенно вместе с `LIMIT`. ([postgresql.org][1])\r\n{{< /details >}}\r\n\r\n\r\n"
  filepath = "top-accounts-realtime"
