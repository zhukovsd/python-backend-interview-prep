  question = "Дизайн REST API для сущности группы"
  answer = "**Условие задачи:**  \nНеобходимо спроектировать REST API для сущности Группа.  \n\nНужно предложить интерфейс для:  \n\n- создания группы\n- получения группы или списка групп\n- изменения группы\n- удаления группы\n- добавления и удаления связей, если группа содержит сотрудников или вложенные группы\n\n**Пример интерфейса:**  \n- Создание группы:  \n```http\nPOST /api/v1/groups/\n```\n- Получение списка групп:\n```http\nGET /api/v1/groups/\n```\n- Получение одной группы:\n```http\nGET /api/v1/groups/{group_id}/\n```\n- Частичное изменение группы:\n```http\nPATCH /api/v1/groups/{group_id}/\n```\n- Полное обновление группы:\n```http\nPUT /api/v1/groups/{group_id}/\n```\n- Удаление группы:\n```http\nDELETE /api/v1/groups/{group_id}/\n```\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* Основной ресурс — `groups`.\r\n* Для создания группы используется `POST /api/v1/groups/`.\r\n* Для получения списка групп используется `GET /api/v1/groups/`.\r\n* Для получения одной группы используется `GET /api/v1/groups/{group_id}/`.\r\n* Для частичного изменения используется `PATCH`.\r\n* Для полного обновления используется `PUT`.\r\n* Для удаления используется `DELETE`.\r\n* Связи с сотрудниками и вложенными группами лучше вынести в отдельные endpoints.\r\n* Добавление связи удобно делать через `POST`.\r\n* Удаление связи удобно делать через `DELETE`.\r\n  \r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\n### Основной REST API для групп\r\n\r\n```http\r\nPOST /api/v1/groups/\r\n```\r\n\r\nСоздание группы.\r\n\r\nПример запроса:\r\n\r\n```json\r\n{\r\n  \"name\": \"Backend\",\r\n  \"description\": \"Backend development team\"\r\n}\r\n```\r\n\r\nПример ответа:\r\n\r\n```json\r\n{\r\n  \"id\": 1,\r\n  \"name\": \"Backend\",\r\n  \"description\": \"Backend development team\"\r\n}\r\n```\r\n\r\nПолучение списка групп:\r\n\r\n```http\r\nGET /api/v1/groups/\r\n```\r\n\r\nПример ответа:\r\n\r\n```json\r\n[\r\n  {\r\n    \"id\": 1,\r\n    \"name\": \"Backend\",\r\n    \"description\": \"Backend development team\"\r\n  },\r\n  {\r\n    \"id\": 2,\r\n    \"name\": \"Python\",\r\n    \"description\": \"Python developers\"\r\n  }\r\n]\r\n```\r\n\r\nПолучение одной группы:\r\n\r\n```http\r\nGET /api/v1/groups/{group_id}/\r\n```\r\n\r\nПример ответа:\r\n\r\n```json\r\n{\r\n  \"id\": 1,\r\n  \"name\": \"Backend\",\r\n  \"description\": \"Backend development team\",\r\n  \"employees\": [\r\n    {\r\n      \"id\": 10,\r\n      \"personnel_number\": \"EMP-001\",\r\n      \"name\": \"Ivan Ivanov\",\r\n      \"email\": \"ivan@example.com\"\r\n    }\r\n  ],\r\n  \"child_groups\": [\r\n    {\r\n      \"id\": 2,\r\n      \"name\": \"Python\"\r\n    }\r\n  ],\r\n  \"parent_groups\": []\r\n}\r\n```\r\n\r\nЧастичное изменение группы:\r\n\r\n```http\r\nPATCH /api/v1/groups/{group_id}/\r\n```\r\n\r\nПример запроса:\r\n\r\n```json\r\n{\r\n  \"description\": \"Backend and API development team\"\r\n}\r\n```\r\n\r\nПолное обновление группы:\r\n\r\n```http\r\nPUT /api/v1/groups/{group_id}/\r\n```\r\n\r\nПример запроса:\r\n\r\n```json\r\n{\r\n  \"name\": \"Backend\",\r\n  \"description\": \"Backend and API development team\"\r\n}\r\n```\r\n\r\nУдаление группы:\r\n\r\n```http\r\nDELETE /api/v1/groups/{group_id}/\r\n```\r\n\r\nПример ответа:\r\n\r\n```http\r\n204 No Content\r\n```\r\n\r\n### API для сотрудников внутри группы\r\n\r\nДобавить сотрудника в группу:\r\n\r\n```http\r\nPOST /api/v1/groups/{group_id}/employees/\r\n```\r\n\r\nПример запроса:\r\n\r\n```json\r\n{\r\n  \"employee_id\": 10\r\n}\r\n```\r\n\r\nПример ответа:\r\n\r\n```json\r\n{\r\n  \"group_id\": 1,\r\n  \"employee_id\": 10\r\n}\r\n```\r\n\r\nУдалить сотрудника из группы:\r\n\r\n```http\r\nDELETE /api/v1/groups/{group_id}/employees/{employee_id}/\r\n```\r\n\r\nПример ответа:\r\n\r\n```http\r\n204 No Content\r\n```\r\n\r\nПолучить сотрудников группы:\r\n\r\n```http\r\nGET /api/v1/groups/{group_id}/employees/\r\n```\r\n\r\nПример ответа:\r\n\r\n```json\r\n[\r\n  {\r\n    \"id\": 10,\r\n    \"personnel_number\": \"EMP-001\",\r\n    \"name\": \"Ivan Ivanov\",\r\n    \"email\": \"ivan@example.com\"\r\n  }\r\n]\r\n```\r\n\r\n### API для вложенных групп\r\n\r\nДобавить вложенную группу:\r\n\r\n```http\r\nPOST /api/v1/groups/{group_id}/child-groups/\r\n```\r\n\r\nПример запроса:\r\n\r\n```json\r\n{\r\n  \"child_group_id\": 2\r\n}\r\n```\r\n\r\nЭто означает, что группа `2` будет добавлена внутрь группы `1`.\r\n\r\nПример ответа:\r\n\r\n```json\r\n{\r\n  \"parent_group_id\": 1,\r\n  \"child_group_id\": 2\r\n}\r\n```\r\n\r\nУдалить вложенную группу:\r\n\r\n```http\r\nDELETE /api/v1/groups/{group_id}/child-groups/{child_group_id}/\r\n```\r\n\r\nПример ответа:\r\n\r\n```http\r\n204 No Content\r\n```\r\n\r\nПолучить вложенные группы:\r\n\r\n```http\r\nGET /api/v1/groups/{group_id}/child-groups/\r\n```\r\n\r\nПример ответа:\r\n\r\n```json\r\n[\r\n  {\r\n    \"id\": 2,\r\n    \"name\": \"Python\",\r\n    \"description\": \"Python developers\"\r\n  }\r\n]\r\n```\r\n\r\nПолучить родительские группы:\r\n\r\n```http\r\nGET /api/v1/groups/{group_id}/parent-groups/\r\n```\r\n\r\nПример ответа:\r\n\r\n```json\r\n[\r\n  {\r\n    \"id\": 1,\r\n    \"name\": \"Backend\",\r\n    \"description\": \"Backend development team\"\r\n  }\r\n]\r\n```\r\n\r\n### Итоговый список endpoints\r\n\r\n```text\r\nPOST   /api/v1/groups/\r\nGET    /api/v1/groups/\r\nGET    /api/v1/groups/{group_id}/\r\nPATCH  /api/v1/groups/{group_id}/\r\nPUT    /api/v1/groups/{group_id}/\r\nDELETE /api/v1/groups/{group_id}/\r\n\r\nGET    /api/v1/groups/{group_id}/employees/\r\nPOST   /api/v1/groups/{group_id}/employees/\r\nDELETE /api/v1/groups/{group_id}/employees/{employee_id}/\r\n\r\nGET    /api/v1/groups/{group_id}/child-groups/\r\nPOST   /api/v1/groups/{group_id}/child-groups/\r\nDELETE /api/v1/groups/{group_id}/child-groups/{child_group_id}/\r\n\r\nGET    /api/v1/groups/{group_id}/parent-groups/\r\n```\r\n\r\n### Важные проверки\r\n\r\n```text\r\n1. Нельзя создать две группы с одинаковым name, если name должен быть уникальным.\r\n2. Нельзя добавить в группу несуществующего сотрудника.\r\n3. Нельзя добавить несуществующую вложенную группу.\r\n4. Нельзя добавить группу саму в себя.\r\n5. Желательно запретить циклические связи групп.\r\n6. Повторное добавление одной и той же связи должно либо игнорироваться, либо возвращать 409 Conflict.\r\n```\r\n\r\nПример ошибки при попытке добавить группу саму в себя:\r\n\r\n```json\r\n{\r\n  \"detail\": \"Group cannot contain itself\"\r\n}\r\n```\r\n\r\nПример ошибки при повторном добавлении связи:\r\n\r\n```json\r\n{\r\n  \"detail\": \"Relation already exists\"\r\n}\r\n```\r\n\r\nТакой интерфейс разделяет обычные CRUD-операции над группой и операции управления связями. Это делает API понятным: сама группа редактируется через `/groups/{group_id}/`, а связи с сотрудниками и вложенными группами управляются через отдельные вложенные ресурсы.\r\n{{< /details >}}\r\n"
  filepath = "group-rest-api"
