  id = 1
  question = "Создание модели сотрудников и групп в SQLAlchemy"
  answer = "**Условие задачи:**  \nНеобходимо спроектировать модели в SQLAlchemy для двух сущностей: Employee и Group.  \nДля сущности Employee должны храниться:  \n- табельный номер\n- имя\n- email\n  \nДля сущности Group должны храниться:  \n- имя или название группы\n- описание группы\n  \nТакже нужно реализовать связи между таблицами:  \n- у одной группы может быть несколько сотрудников\n- один сотрудник может состоять в нескольких группах\n- одна группа может включать в себя другие группы\n- одна группа может входить в состав нескольких других групп\n  \nТо есть требуется реализовать:  \n- связь many-to-many между сотрудниками и группами\n- самоссылочную many-to-many связь для групп\n\nНужно описать SQLAlchemy-модели и связи между ними.\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* Между `Employee` и `Group` нужна связь many-to-many.\r\n* Для many-to-many в SQLAlchemy используется промежуточная таблица и параметр `secondary`.\r\n* Между `Group` и `Group` тоже нужна many-to-many связь, но самоссылочная.\r\n* Для самоссылочной many-to-many связи нужны две колонки: `parent_group_id` и `child_group_id`.\r\n* `parent_group_id` показывает группу-родителя.\r\n* `child_group_id` показывает вложенную группу.\r\n* Для таблиц-связок удобно использовать составной первичный ключ, чтобы не было дублей связей.\r\n  \r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\n```python\r\nfrom __future__ import annotations\r\n\r\nfrom sqlalchemy import ForeignKey, String, Table, Column, Text\r\nfrom sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column, relationship\r\n\r\n\r\nclass Base(DeclarativeBase):\r\n    pass\r\n\r\n\r\nemployee_group = Table(\r\n    \"employee_group\",\r\n    Base.metadata,\r\n    Column(\r\n        \"employee_id\",\r\n        ForeignKey(\"employees.id\", ondelete=\"CASCADE\"),\r\n        primary_key=True,\r\n    ),\r\n    Column(\r\n        \"group_id\",\r\n        ForeignKey(\"groups.id\", ondelete=\"CASCADE\"),\r\n        primary_key=True,\r\n    ),\r\n)\r\n\r\n\r\ngroup_group = Table(\r\n    \"group_group\",\r\n    Base.metadata,\r\n    Column(\r\n        \"parent_group_id\",\r\n        ForeignKey(\"groups.id\", ondelete=\"CASCADE\"),\r\n        primary_key=True,\r\n    ),\r\n    Column(\r\n        \"child_group_id\",\r\n        ForeignKey(\"groups.id\", ondelete=\"CASCADE\"),\r\n        primary_key=True,\r\n    ),\r\n)\r\n\r\n\r\nclass Employee(Base):\r\n    __tablename__ = \"employees\"\r\n\r\n    id: Mapped[int] = mapped_column(primary_key=True)\r\n    personnel_number: Mapped[str] = mapped_column(\r\n        String(50),\r\n        unique=True,\r\n        nullable=False,\r\n    )\r\n    name: Mapped[str] = mapped_column(String(255), nullable=False)\r\n    email: Mapped[str] = mapped_column(String(255), unique=True, nullable=False)\r\n\r\n    groups: Mapped[list[Group]] = relationship(\r\n        secondary=employee_group,\r\n        back_populates=\"employees\",\r\n    )\r\n\r\n\r\nclass Group(Base):\r\n    __tablename__ = \"groups\"\r\n\r\n    id: Mapped[int] = mapped_column(primary_key=True)\r\n    name: Mapped[str] = mapped_column(String(255), unique=True, nullable=False)\r\n    description: Mapped[str | None] = mapped_column(Text, nullable=True)\r\n\r\n    employees: Mapped[list[Employee]] = relationship(\r\n        secondary=employee_group,\r\n        back_populates=\"groups\",\r\n    )\r\n\r\n    child_groups: Mapped[list[Group]] = relationship(\r\n        \"Group\",\r\n        secondary=group_group,\r\n        primaryjoin=id == group_group.c.parent_group_id,\r\n        secondaryjoin=id == group_group.c.child_group_id,\r\n        back_populates=\"parent_groups\",\r\n    )\r\n\r\n    parent_groups: Mapped[list[Group]] = relationship(\r\n        \"Group\",\r\n        secondary=group_group,\r\n        primaryjoin=id == group_group.c.child_group_id,\r\n        secondaryjoin=id == group_group.c.parent_group_id,\r\n        back_populates=\"child_groups\",\r\n    )\r\n```\r\n\r\nСвязь сотрудников и групп:\r\n\r\n```text\r\nemployees N ─── M groups\r\n```\r\n\r\nОна реализована через промежуточную таблицу:\r\n\r\n```python\r\nemployee_group\r\n```\r\n\r\nВ ней хранятся пары:\r\n\r\n```text\r\nemployee_id\r\ngroup_id\r\n```\r\n\r\nЭто означает, что один сотрудник может состоять в нескольких группах, и одна группа может содержать нескольких сотрудников. В SQLAlchemy many-to-many связь обычно описывается через промежуточную таблицу, переданную в `relationship(..., secondary=...)`. ([Документация SQLAlchemy][1])\r\n\r\nСамоссылочная связь групп:\r\n\r\n```text\r\ngroups N ─── M groups\r\n```\r\n\r\nОна реализована через таблицу:\r\n\r\n```python\r\ngroup_group\r\n```\r\n\r\nВ ней хранятся пары:\r\n\r\n```text\r\nparent_group_id\r\nchild_group_id\r\n```\r\n\r\nНапример:\r\n\r\n```text\r\nparent_group_id = 1\r\nchild_group_id = 2\r\n```\r\n\r\nозначает, что группа `2` входит внутрь группы `1`.\r\n\r\nПоле:\r\n\r\n```python\r\nchild_groups\r\n```\r\n\r\nпоказывает группы, которые входят в текущую группу.\r\n\r\nПоле:\r\n\r\n```python\r\nparent_groups\r\n```\r\n\r\nпоказывает группы, в состав которых входит текущая группа.\r\n\r\nДля самоссылочной many-to-many связи нужно явно указать `primaryjoin` и `secondaryjoin`, потому что SQLAlchemy должен понимать, какая колонка таблицы-связки отвечает за родительскую группу, а какая — за дочернюю. В документации SQLAlchemy такая схема описывается как self-referential many-to-many relationship. ([Документация SQLAlchemy][2])\r\n\r\nПример использования:\r\n\r\n```python\r\nemployee = Employee(\r\n    personnel_number=\"EMP-001\",\r\n    name=\"Ivan Ivanov\",\r\n    email=\"ivan@example.com\",\r\n)\r\n\r\nbackend_group = Group(\r\n    name=\"Backend\",\r\n    description=\"Backend developers\",\r\n)\r\n\r\npython_group = Group(\r\n    name=\"Python\",\r\n    description=\"Python developers\",\r\n)\r\n\r\nbackend_group.employees.append(employee)\r\nbackend_group.child_groups.append(python_group)\r\n```\r\n\r\nПосле этого:\r\n\r\n```python\r\nemployee.groups\r\n```\r\n\r\nбудет содержать группу `Backend`.\r\n\r\nА:\r\n\r\n```python\r\nbackend_group.child_groups\r\n```\r\n\r\nбудет содержать группу `Python`.\r\n\r\nПри этом:\r\n\r\n```python\r\npython_group.parent_groups\r\n```\r\n\r\nбудет содержать группу `Backend`.\r\n{{< /details >}}\r\n"
  filepath = "sqlalchemy-employee-group"
