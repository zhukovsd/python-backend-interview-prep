  id = 2
  question = "Загрузка платежей с проверкой блокировки записи в БД"
  answer = "**Условие задачи:**  \nДан API-эндпоинт на FastAPI для загрузки файла со списком платежей. Файл содержит до 1000 записей, каждая из которых включает ИНН получателя, номер счета, сумму и назначение платежа.  \nНужно доработать обработку загрузки так, чтобы при сохранении платежей дополнительно выполнялась проверка: не заблокирована ли соответствующая запись в базе данных.  \nЕсли запись заблокирована, такая операция должна корректно обрабатываться и учитываться при формировании результата обработки файла.  \nПредложи дополнительные способы оптимизации\n```python\n# ---\n# Дано: загрузка списка платежей (до 1000 в файле): ИНН, реквизиты\n# Клиент загружает списки платежей, исходим из того что мы знаем кто это делает. Момент с авторизацией и идентификацией клиента специально опущен\n\nfrom fastapi import FastAPI, UploadFile, HTTPException\nfrom pydantic import BaseModel\nfrom typing import List\n\napp = FastAPI()\n\n\nclass PaymentData(BaseModel):\n    inn: str  # ИНН получателя\n    account_number: str  # Номер (ID) счета\n    amount: float  # Сумма платежа\n    purpose: str  # Назначение платежа\n\n\nclass PaymentResponse(BaseModel):\n    status: str\n    message: str\n    processed_count: int\n    errors_count: int\n\n\ndef parse_file(file):\n    ...\n\n\ndef save_payments(data: list[PaymentData]):\n    ...\n\n\n@app.post(\"/api/payments/upload\", response_model=PaymentResponse)\nasync def upload_payments(customer_code, file: UploadFile):\n    try:\n        payments_data: list[PaymentData] = parse_file(file)\n        processed_count, errors_count = save_payments(payments_data)\n    except Exception as e:\n        raise HTTPException(status_code=500, detail=f\"Ошибка при обработке файла: {str(e)}\")\n\n    return PaymentResponse(\n        status=\"success\",\n        message=\"Файл успешно обработан\",\n        processed_count=processed_count,\n        errors_count=errors_count\n    )\n```"
  filepath = "payment-upload-lock-check"
