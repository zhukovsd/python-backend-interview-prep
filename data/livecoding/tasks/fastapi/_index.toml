  id = 1
  question = "Критика кода перевода средств в FastAPI"
  answer = "**Условие задачи:**  \nДан фрагмент кода на FastAPI и asyncpg, реализующий создание таблицы пользователей и эндпоинт для перевода денег между пользователями.\n\nНужно провести критический разбор этого кода: найти архитектурные, логические, SQL-, безопасностные и синтаксические проблемы, а также указать, почему такая реализация может приводить к ошибкам, уязвимостям или некорректной работе сервиса.\n \n```python\n\"import asyncpg\nfrom fastapi import FastAPI, Body, HTTPException\napp FastAPI()\nDB_DSN = \"\"postgresql://test:test@localhost/testdb\"\"\nasync def get_connection()-> asyncpg.Connection: \nreturn await asyncpg.connect(DB_DSN)\n\n@app.on_event(\"\"startup\"\")\nasync def on_startup():\nconn = await get_connection()\nawait conn.execute(\n‘’’CREATE TABLE IF NOT EXISTS \"\"user\"\" (\n id TEXT NOT NULL, \nname TEXT NOT NULL, \nbalance DOUBLE PRECISION )’’’\n\n\n@app.post(\"\"/transfer\"\")\nasync def transfer(\nfrom user: str = Body(),\nto_user: str = Body(),\namount: float = Body(),):\nconn await get_connection()\nrow = await conn.fetchrow(f'select id, balance from \"\"user\"\" where id = {from_user}')\nif row[\"\"balance\"\"] < amount:\nraise HTTPException(status_code=400, detail=\"\"Insufficient funds\"\")\nawait conn.execute(f'UPDATE \"\"user\"\" SET balance = balance -{amount} WHERE id = (from_user}')\nawait.conn.execute(f'UPDATE \"\"user\"\" SET balance balance + {amount} WHERE id = {to_user}')\nreturn {\"\"success\"\": True}\"\n```"
  filepath = "fastapi-transfer-review"

