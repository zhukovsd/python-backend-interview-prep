[[tasks]]
  id = 1
  question = "Критика кода перевода средств в FastAPI"
  answer = "**Условие задачи:**  \nДан фрагмент кода на FastAPI и asyncpg, реализующий создание таблицы пользователей и эндпоинт для перевода денег между пользователями.\n\nНужно провести критический разбор этого кода: найти архитектурные, логические, SQL-, безопасностные и синтаксические проблемы, а также указать, почему такая реализация может приводить к ошибкам, уязвимостям или некорректной работе сервиса.\n \n```python\n\"import asyncpg\nfrom fastapi import FastAPI, Body, HTTPException\napp FastAPI()\nDB_DSN = \"\"postgresql://test:test@localhost/testdb\"\"\nasync def get_connection()-> asyncpg.Connection: \nreturn await asyncpg.connect(DB_DSN)\n\n@app.on_event(\"\"startup\"\")\nasync def on_startup():\nconn = await get_connection()\nawait conn.execute(\n‘’’CREATE TABLE IF NOT EXISTS \"\"user\"\" (\n id TEXT NOT NULL, \nname TEXT NOT NULL, \nbalance DOUBLE PRECISION )’’’\n\n\n@app.post(\"\"/transfer\"\")\nasync def transfer(\nfrom user: str = Body(),\nto_user: str = Body(),\namount: float = Body(),):\nconn await get_connection()\nrow = await conn.fetchrow(f'select id, balance from \"\"user\"\" where id = {from_user}')\nif row[\"\"balance\"\"] < amount:\nraise HTTPException(status_code=400, detail=\"\"Insufficient funds\"\")\nawait conn.execute(f'UPDATE \"\"user\"\" SET balance = balance -{amount} WHERE id = (from_user}')\nawait.conn.execute(f'UPDATE \"\"user\"\" SET balance balance + {amount} WHERE id = {to_user}')\nreturn {\"\"success\"\": True}\"\n```\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* В коде есть синтаксические ошибки: `app FastAPI()`, `conn await get_connection()`, `await.conn.execute(...)`.\r\n* Таблица названа `\"user\"` — это неудобное имя, лучше использовать `users`.\r\n* Подключение к БД создаётся на каждый запрос и не закрывается.\r\n* Для FastAPI-сервиса лучше использовать пул соединений.\r\n* SQL собирается через f-string, что создаёт SQL-инъекцию.\r\n* Денежные суммы нельзя хранить в `DOUBLE PRECISION` и принимать как `float`.\r\n* Перевод денег должен выполняться внутри транзакции.\r\n* При конкурентных запросах нужно блокировать строки пользователей.\r\n* Нужно проверять существование обоих пользователей.\r\n* Нужно проверять, что сумма положительная.\r\n  \r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\nВ коде смешаны сразу несколько типов проблем: синтаксис, SQL-инъекции, некорректная работа с соединениями, отсутствие транзакции, race condition при переводе денег и неправильный тип для баланса.\r\n\r\nИсходный код в текущем виде даже не запустится.\r\n\r\n### 1. Синтаксические ошибки\r\n\r\nОшибка:\r\n\r\n```python\r\napp FastAPI()\r\n```\r\n\r\nДолжно быть:\r\n\r\n```python\r\napp = FastAPI()\r\n```\r\n\r\nОшибка:\r\n\r\n```python\r\nconn await get_connection()\r\n```\r\n\r\nДолжно быть:\r\n\r\n```python\r\nconn = await get_connection()\r\n```\r\n\r\nОшибка:\r\n\r\n```python\r\nawait.conn.execute(...)\r\n```\r\n\r\nДолжно быть:\r\n\r\n```python\r\nawait conn.execute(...)\r\n```\r\n\r\nОшибка в имени параметра:\r\n\r\n```python\r\nfrom user: str = Body()\r\n```\r\n\r\nВ Python нельзя использовать пробел в имени переменной. Также лучше не использовать имя `from`, потому что это ключевое слово языка.\r\n\r\nПравильно:\r\n\r\n```python\r\nfrom_user: str = Body()\r\n```\r\n\r\nТакже в `CREATE TABLE` не закрыт вызов `conn.execute(...)`: не хватает закрывающих скобок и закрытия соединения.\r\n\r\n### 2. Неправильное управление соединениями\r\n\r\nВ коде каждый раз создаётся новое соединение:\r\n\r\n```python\r\nasync def get_connection() -> asyncpg.Connection:\r\n    return await asyncpg.connect(DB_DSN)\r\n```\r\n\r\nНо соединения нигде не закрываются. Это приведёт к утечке соединений и со временем база начнёт отказывать в новых подключениях.\r\n\r\nДля серверных приложений лучше использовать пул соединений. В документации asyncpg прямо указано, что для приложений, которые часто обрабатывают запросы и берут соединение на короткое время, рекомендуется использовать connection pool. Там же показан типичный паттерн `async with pool.acquire() as connection`. ([Magic Stack][1])\r\n\r\n### 3. Устаревший способ startup-логики\r\n\r\nВ коде используется:\r\n\r\n```python\r\n@app.on_event(\"startup\")\r\n```\r\n\r\nСейчас в FastAPI рекомендованный способ для startup/shutdown-логики — `lifespan`. В официальной документации FastAPI указано, что `startup` и `shutdown` event handlers являются альтернативным deprecated-подходом, а рекомендуется использовать `lifespan` параметр приложения. ([FastAPI][2])\r\n\r\nЭто не главная ошибка в задаче, но для нового кода лучше сразу использовать `lifespan`.\r\n\r\n### 4. Ошибка в SQL-схеме\r\n\r\nИсходный SQL:\r\n\r\n```sql\r\nCREATE TABLE IF NOT EXISTS \"user\" (\r\n    id TEXT NOT NULL,\r\n    name TEXT NOT NULL,\r\n    balance DOUBLE PRECISION\r\n)\r\n```\r\n\r\nПроблемы:\r\n\r\n```text\r\n1. Нет PRIMARY KEY.\r\n2. balance допускает NULL.\r\n3. balance может стать отрицательным.\r\n4. Для денег используется DOUBLE PRECISION.\r\n5. Таблица названа \"user\", лучше не использовать такое имя.\r\n```\r\n\r\nДля денег нельзя использовать `DOUBLE PRECISION`, потому что это тип с плавающей точкой. Он может давать ошибки округления. PostgreSQL рекомендует использовать `numeric` для денежных сумм и других значений, где нужна точность. ([PostgreSQL][3])\r\n\r\nЛучше:\r\n\r\n```sql\r\nCREATE TABLE IF NOT EXISTS users (\r\n    id TEXT PRIMARY KEY,\r\n    name TEXT NOT NULL,\r\n    balance NUMERIC(18, 2) NOT NULL DEFAULT 0,\r\n    CONSTRAINT chk_users_balance_non_negative CHECK (balance >= 0)\r\n);\r\n```\r\n\r\n### 5. SQL-инъекция\r\n\r\nОпасный код:\r\n\r\n```python\r\nrow = await conn.fetchrow(\r\n    f'select id, balance from \"user\" where id = {from_user}'\r\n)\r\n```\r\n\r\nПроблема: пользовательское значение вставляется прямо в SQL-строку. Если `from_user` придёт из запроса, злоумышленник сможет подставить SQL-код.\r\n\r\nНужно использовать параметры asyncpg:\r\n\r\n```python\r\nrow = await conn.fetchrow(\r\n    \"SELECT id, balance FROM users WHERE id = $1\",\r\n    from_user,\r\n)\r\n```\r\n\r\nВ документации asyncpg в примере запрос выполняется с передачей аргумента отдельно от SQL-строки: `fetchval('select 2 ^ $1', power)`. Это и есть правильный стиль параметризации запросов. ([Magic Stack][1])\r\n\r\n### 6. Отсутствие транзакции\r\n\r\nПеревод денег состоит минимум из двух операций:\r\n\r\n```text\r\n1. Списать деньги с одного пользователя.\r\n2. Зачислить деньги другому пользователю.\r\n```\r\n\r\nВ исходном коде эти операции выполняются отдельно. Если первая операция выполнится, а вторая упадёт, деньги будут списаны, но не будут зачислены.\r\n\r\nНужна транзакция:\r\n\r\n```python\r\nasync with conn.transaction():\r\n    ...\r\n```\r\n\r\nВ asyncpg транзакции создаются через `Connection.transaction()`, а без явного transaction block изменения применяются сразу в режиме auto-commit. ([Magic Stack][1])\r\n\r\n### 7. Race condition при одновременных переводах\r\n\r\nОпасный сценарий:\r\n\r\n```text\r\n1. У пользователя баланс 100.\r\n2. Одновременно приходят два перевода по 80.\r\n3. Оба запроса читают баланс 100.\r\n4. Оба считают, что денег хватает.\r\n5. Оба списывают деньги.\r\n6. Баланс становится некорректным.\r\n```\r\n\r\nНужно блокировать строку отправителя на время транзакции:\r\n\r\n```sql\r\nSELECT id, balance\r\nFROM users\r\nWHERE id = $1\r\nFOR UPDATE;\r\n```\r\n\r\nТогда второй перевод будет ждать, пока первый завершится, и увидит уже обновлённый баланс.\r\n\r\n### 8. Нет проверки существования пользователей\r\n\r\nВ коде сразу используется:\r\n\r\n```python\r\nif row[\"balance\"] < amount:\r\n```\r\n\r\nНо если отправитель не найден, `row` будет `None`, и код упадёт с ошибкой:\r\n\r\n```text\r\nTypeError: 'NoneType' object is not subscriptable\r\n```\r\n\r\nНужно проверить:\r\n\r\n```python\r\nif row is None:\r\n    raise HTTPException(status_code=404, detail=\"Sender not found\")\r\n```\r\n\r\nТакже нужно проверить получателя.\r\n\r\n### 9. Нет проверки суммы\r\n\r\nСейчас можно передать:\r\n\r\n```json\r\n{\r\n  \"from_user\": \"1\",\r\n  \"to_user\": \"2\",\r\n  \"amount\": -100\r\n}\r\n```\r\n\r\nТогда выражение:\r\n\r\n```sql\r\nbalance = balance - (-100)\r\n```\r\n\r\nувеличит баланс отправителя.\r\n\r\nНужно запретить:\r\n\r\n```text\r\namount <= 0\r\n```\r\n\r\nТакже нужно ограничить точность суммы, например максимум 2 знака после запятой.\r\n\r\n### 10. Ошибки в UPDATE-запросах\r\n\r\nОшибка:\r\n\r\n```python\r\nawait conn.execute(f'UPDATE \"user\" SET balance = balance -{amount} WHERE id = (from_user}')\r\n```\r\n\r\nПроблемы:\r\n\r\n```text\r\n1. from_user написан как текст внутри SQL, а не как значение переменной.\r\n2. Нет параметризации.\r\n3. Скобки некорректные.\r\n4. Нет пробела между минусом и amount.\r\n```\r\n\r\nОшибка:\r\n\r\n```python\r\nawait.conn.execute(f'UPDATE \"user\" SET balance balance + {amount} WHERE id = {to_user}')\r\n```\r\n\r\nПроблемы:\r\n\r\n```text\r\n1. await.conn — синтаксически неверно.\r\n2. Пропущен знак = после balance.\r\n3. SQL-инъекция через to_user.\r\n```\r\n\r\nПравильно:\r\n\r\n```python\r\nawait conn.execute(\r\n    \"UPDATE users SET balance = balance - $1 WHERE id = $2\",\r\n    amount,\r\n    from_user,\r\n)\r\n\r\nawait conn.execute(\r\n    \"UPDATE users SET balance = balance + $1 WHERE id = $2\",\r\n    amount,\r\n    to_user,\r\n)\r\n```\r\n\r\n### 11. Неправильный API-контракт\r\n\r\nСейчас параметры описаны так:\r\n\r\n```python\r\nfrom_user: str = Body()\r\nto_user: str = Body()\r\namount: float = Body()\r\n```\r\n\r\nТакой вариант возможен, но лучше описать отдельную Pydantic-модель запроса. Так проще валидировать данные.\r\n\r\nНапример:\r\n\r\n```python\r\nfrom decimal import Decimal\r\nfrom pydantic import BaseModel, Field\r\n\r\n\r\nclass TransferRequest(BaseModel):\r\n    from_user: str\r\n    to_user: str\r\n    amount: Decimal = Field(gt=0, decimal_places=2)\r\n```\r\n\r\n### 12. Исправленный каркас\r\n\r\n```python\r\nfrom contextlib import asynccontextmanager\r\nfrom decimal import Decimal\r\n\r\nimport asyncpg\r\nfrom fastapi import FastAPI, HTTPException\r\nfrom pydantic import BaseModel, Field\r\n\r\n\r\nDB_DSN = \"postgresql://test:test@localhost/testdb\"\r\n\r\n\r\nclass TransferRequest(BaseModel):\r\n    from_user: str\r\n    to_user: str\r\n    amount: Decimal = Field(gt=0, decimal_places=2)\r\n\r\n\r\n@asynccontextmanager\r\nasync def lifespan(app: FastAPI):\r\n    app.state.pool = await asyncpg.create_pool(DB_DSN)\r\n\r\n    async with app.state.pool.acquire() as conn:\r\n        await conn.execute(\r\n            \"\"\"\r\n            CREATE TABLE IF NOT EXISTS users (\r\n                id TEXT PRIMARY KEY,\r\n                name TEXT NOT NULL,\r\n                balance NUMERIC(18, 2) NOT NULL DEFAULT 0,\r\n                CONSTRAINT chk_users_balance_non_negative CHECK (balance >= 0)\r\n            )\r\n            \"\"\"\r\n        )\r\n\r\n    yield\r\n\r\n    await app.state.pool.close()\r\n\r\n\r\napp = FastAPI(lifespan=lifespan)\r\n\r\n\r\n@app.post(\"/transfer\")\r\nasync def transfer(data: TransferRequest):\r\n    if data.from_user == data.to_user:\r\n        raise HTTPException(\r\n            status_code=400,\r\n            detail=\"Cannot transfer money to the same user\",\r\n        )\r\n\r\n    async with app.state.pool.acquire() as conn:\r\n        async with conn.transaction():\r\n            sender = await conn.fetchrow(\r\n                \"\"\"\r\n                SELECT id, balance\r\n                FROM users\r\n                WHERE id = $1\r\n                FOR UPDATE\r\n                \"\"\",\r\n                data.from_user,\r\n            )\r\n\r\n            if sender is None:\r\n                raise HTTPException(\r\n                    status_code=404,\r\n                    detail=\"Sender not found\",\r\n                )\r\n\r\n            receiver = await conn.fetchrow(\r\n                \"\"\"\r\n                SELECT id\r\n                FROM users\r\n                WHERE id = $1\r\n                FOR UPDATE\r\n                \"\"\",\r\n                data.to_user,\r\n            )\r\n\r\n            if receiver is None:\r\n                raise HTTPException(\r\n                    status_code=404,\r\n                    detail=\"Receiver not found\",\r\n                )\r\n\r\n            if sender[\"balance\"] < data.amount:\r\n                raise HTTPException(\r\n                    status_code=400,\r\n                    detail=\"Insufficient funds\",\r\n                )\r\n\r\n            await conn.execute(\r\n                \"\"\"\r\n                UPDATE users\r\n                SET balance = balance - $1\r\n                WHERE id = $2\r\n                \"\"\",\r\n                data.amount,\r\n                data.from_user,\r\n            )\r\n\r\n            await conn.execute(\r\n                \"\"\"\r\n                UPDATE users\r\n                SET balance = balance + $1\r\n                WHERE id = $2\r\n                \"\"\",\r\n                data.amount,\r\n                data.to_user,\r\n            )\r\n\r\n    return {\"success\": True}\r\n```\r\n\r\n### 13. Что ещё нужно добавить в реальном сервисе\r\n\r\n```text\r\n1. Таблицу transfer_operations для истории переводов.\r\n2. Idempotency-Key, чтобы повтор запроса не создавал повторный перевод.\r\n3. Авторизацию: пользователь не должен переводить деньги с чужого счёта.\r\n4. Логирование операций.\r\n5. Метрики успешных и неуспешных переводов.\r\n6. Обработку таймаутов БД.\r\n7. Миграции через Alembic, а не CREATE TABLE внутри приложения.\r\n8. Тесты на конкурентные переводы.\r\n9. Индексы по from_user, to_user, created_at в таблице переводов.\r\n10. Аудит изменения баланса.\r\n```\r\n\r\nИтог: главная проблема не только в синтаксисе. Даже если исправить синтаксис, код останется опасным: он уязвим к SQL-инъекции, теряет соединения, выполняет перевод без транзакции, допускает гонки при конкурентных запросах, использует `float` для денег и не валидирует входные данные.\r\n{{< /details >}}\r\n"
  filepath = "fastapi-transfer-review"

[[tasks]]
  id = 2
  question = "Загрузка платежей с проверкой блокировки записи в БД"
  answer = "**Условие задачи:**  \nДан API-эндпоинт на FastAPI для загрузки файла со списком платежей. Файл содержит до 1000 записей, каждая из которых включает ИНН получателя, номер счета, сумму и назначение платежа.  \nНужно доработать обработку загрузки так, чтобы при сохранении платежей дополнительно выполнялась проверка: не заблокирована ли соответствующая запись в базе данных.  \nЕсли запись заблокирована, такая операция должна корректно обрабатываться и учитываться при формировании результата обработки файла.  \nПредложи дополнительные способы оптимизации\n```python\n# ---\n# Дано: загрузка списка платежей (до 1000 в файле): ИНН, реквизиты\n# Клиент загружает списки платежей, исходим из того что мы знаем кто это делает. Момент с авторизацией и идентификацией клиента специально опущен\n\nfrom fastapi import FastAPI, UploadFile, HTTPException\nfrom pydantic import BaseModel\nfrom typing import List\n\napp = FastAPI()\n\n\nclass PaymentData(BaseModel):\n    inn: str  # ИНН получателя\n    account_number: str  # Номер (ID) счета\n    amount: float  # Сумма платежа\n    purpose: str  # Назначение платежа\n\n\nclass PaymentResponse(BaseModel):\n    status: str\n    message: str\n    processed_count: int\n    errors_count: int\n\n\ndef parse_file(file):\n    ...\n\n\ndef save_payments(data: list[PaymentData]):\n    ...\n\n\n@app.post(\"/api/payments/upload\", response_model=PaymentResponse)\nasync def upload_payments(customer_code, file: UploadFile):\n    try:\n        payments_data: list[PaymentData] = parse_file(file)\n        processed_count, errors_count = save_payments(payments_data)\n    except Exception as e:\n        raise HTTPException(status_code=500, detail=f\"Ошибка при обработке файла: {str(e)}\")\n\n    return PaymentResponse(\n        status=\"success\",\n        message=\"Файл успешно обработан\",\n        processed_count=processed_count,\n        errors_count=errors_count\n    )\n```\n\n{{< hint warning >}}\r\n**Спойлеры к решению**\r\n{{< /hint >}}\r\n\r\n{{< details \"Подсказки\" close >}}\r\n\r\n* Текущий `PaymentResponse` слишком бедный: он не показывает, какие строки файла не обработались и почему.\r\n* Сумму платежа лучше хранить как `Decimal`, а не `float`.\r\n* `UploadFile` в FastAPI читается асинхронно, поэтому `parse_file(file)` лучше сделать `async`.\r\n* Проверку блокировки лучше делать на уровне БД.\r\n* Если блокировка бизнесовая, например поле `is_blocked`, нужно проверять это поле.\r\n* Если речь именно про database lock, можно использовать `SELECT ... FOR UPDATE NOWAIT` или `SELECT ... FOR UPDATE SKIP LOCKED`.\r\n* При обработке файла до 1000 записей не стоит делать по одному запросу на каждую проверку, лучше группировать данные и делать batch-запросы.\r\n  \r\n{{< /details >}}\r\n\r\n{{< details \"Решение\" close >}}\r\n\r\n### 1. Что не так в текущем варианте\r\n\r\nИсходная схема:\r\n\r\n```python\r\npayments_data: list[PaymentData] = parse_file(file)\r\nprocessed_count, errors_count = save_payments(payments_data)\r\n```\r\n\r\nПроблемы:\r\n\r\n```text\r\n1. parse_file(file) синхронный, хотя UploadFile обычно читается асинхронно.\r\n2. save_payments(data) ничего не говорит о причинах ошибок.\r\n3. amount имеет тип float, что плохо для денег.\r\n4. Нет построчного результата обработки.\r\n5. Нет проверки существования счёта.\r\n6. Нет проверки блокировки записи.\r\n7. Нет защиты от дублей в файле.\r\n8. Нет транзакционной логики.\r\n9. Нет разделения успешных и неуспешных строк.\r\n10. Любая ошибка превращается в HTTP 500, хотя часть ошибок может быть нормальным результатом обработки файла.\r\n```\r\n\r\nДля денег лучше использовать:\r\n\r\n```python\r\nDecimal\r\n```\r\n\r\nа не:\r\n\r\n```python\r\nfloat\r\n```\r\n\r\nПотому что `float` может давать ошибки округления.\r\n\r\n### 2. Улучшенные модели ответа\r\n\r\nЛучше возвращать не только количество ошибок, но и список ошибок по строкам файла.\r\n\r\n```python\r\nfrom decimal import Decimal\r\nfrom pydantic import BaseModel, Field\r\n\r\n\r\nclass PaymentData(BaseModel):\r\n    row_number: int\r\n    inn: str\r\n    account_number: str\r\n    amount: Decimal = Field(gt=0)\r\n    purpose: str\r\n\r\n\r\nclass PaymentRowError(BaseModel):\r\n    row_number: int\r\n    inn: str | None = None\r\n    account_number: str | None = None\r\n    code: str\r\n    message: str\r\n\r\n\r\nclass PaymentResponse(BaseModel):\r\n    status: str\r\n    message: str\r\n    processed_count: int\r\n    errors_count: int\r\n    errors: list[PaymentRowError] = []\r\n```\r\n\r\nПример ошибки по строке:\r\n\r\n```json\r\n{\r\n  \"row_number\": 15,\r\n  \"inn\": \"7700000000\",\r\n  \"account_number\": \"40702810000000000001\",\r\n  \"code\": \"ACCOUNT_LOCKED\",\r\n  \"message\": \"Счёт заблокирован\"\r\n}\r\n```\r\n\r\nТак клиент сможет понять, какие именно записи не были сохранены.\r\n\r\n### 3. Вариант 1 — если блокировка бизнесовая\r\n\r\nНапример, в таблице счетов есть поле:\r\n\r\n```sql\r\nis_blocked BOOLEAN NOT NULL DEFAULT FALSE\r\n```\r\n\r\nТогда перед сохранением платежа нужно проверить, что счёт существует и не заблокирован.\r\n\r\nПример таблиц:\r\n\r\n```sql\r\nCREATE TABLE accounts (\r\n    id BIGSERIAL PRIMARY KEY,\r\n    customer_code TEXT NOT NULL,\r\n    inn TEXT NOT NULL,\r\n    account_number TEXT NOT NULL,\r\n    is_blocked BOOLEAN NOT NULL DEFAULT FALSE,\r\n\r\n    UNIQUE (customer_code, inn, account_number)\r\n);\r\n\r\nCREATE TABLE payments (\r\n    id BIGSERIAL PRIMARY KEY,\r\n    account_id BIGINT NOT NULL REFERENCES accounts(id),\r\n    amount NUMERIC(18, 2) NOT NULL,\r\n    purpose TEXT NOT NULL,\r\n    status TEXT NOT NULL,\r\n    created_at TIMESTAMP NOT NULL DEFAULT now()\r\n);\r\n```\r\n\r\nПример обработки через `asyncpg`:\r\n\r\n```python\r\nfrom decimal import Decimal\r\n\r\nimport asyncpg\r\nfrom fastapi import FastAPI, UploadFile, HTTPException\r\nfrom pydantic import BaseModel, Field\r\n\r\n\r\napp = FastAPI()\r\n\r\n\r\nclass PaymentData(BaseModel):\r\n    row_number: int\r\n    inn: str\r\n    account_number: str\r\n    amount: Decimal = Field(gt=0)\r\n    purpose: str\r\n\r\n\r\nclass PaymentRowError(BaseModel):\r\n    row_number: int\r\n    inn: str | None = None\r\n    account_number: str | None = None\r\n    code: str\r\n    message: str\r\n\r\n\r\nclass PaymentResponse(BaseModel):\r\n    status: str\r\n    message: str\r\n    processed_count: int\r\n    errors_count: int\r\n    errors: list[PaymentRowError] = []\r\n\r\n\r\nasync def parse_file(file: UploadFile) -> list[PaymentData]:\r\n    content = await file.read()\r\n\r\n    # Здесь должна быть реальная логика парсинга CSV/XLSX/JSON.\r\n    # Важно: row_number лучше проставлять сразу при парсинге.\r\n    raise NotImplementedError\r\n\r\n\r\nasync def save_payments(\r\n    conn: asyncpg.Connection,\r\n    customer_code: str,\r\n    payments: list[PaymentData],\r\n) -> tuple[int, list[PaymentRowError]]:\r\n    processed_count = 0\r\n    errors: list[PaymentRowError] = []\r\n\r\n    async with conn.transaction():\r\n        for payment in payments:\r\n            account = await conn.fetchrow(\r\n                \"\"\"\r\n                SELECT id, is_blocked\r\n                FROM accounts\r\n                WHERE customer_code = $1\r\n                  AND inn = $2\r\n                  AND account_number = $3\r\n                \"\"\",\r\n                customer_code,\r\n                payment.inn,\r\n                payment.account_number,\r\n            )\r\n\r\n            if account is None:\r\n                errors.append(\r\n                    PaymentRowError(\r\n                        row_number=payment.row_number,\r\n                        inn=payment.inn,\r\n                        account_number=payment.account_number,\r\n                        code=\"ACCOUNT_NOT_FOUND\",\r\n                        message=\"Счёт не найден\",\r\n                    )\r\n                )\r\n                continue\r\n\r\n            if account[\"is_blocked\"]:\r\n                errors.append(\r\n                    PaymentRowError(\r\n                        row_number=payment.row_number,\r\n                        inn=payment.inn,\r\n                        account_number=payment.account_number,\r\n                        code=\"ACCOUNT_LOCKED\",\r\n                        message=\"Счёт заблокирован\",\r\n                    )\r\n                )\r\n                continue\r\n\r\n            await conn.execute(\r\n                \"\"\"\r\n                INSERT INTO payments (\r\n                    account_id,\r\n                    amount,\r\n                    purpose,\r\n                    status\r\n                )\r\n                VALUES ($1, $2, $3, $4)\r\n                \"\"\",\r\n                account[\"id\"],\r\n                payment.amount,\r\n                payment.purpose,\r\n                \"created\",\r\n            )\r\n\r\n            processed_count += 1\r\n\r\n    return processed_count, errors\r\n```\r\n\r\nEndpoint:\r\n\r\n```python\r\n@app.post(\"/api/payments/upload\", response_model=PaymentResponse)\r\nasync def upload_payments(customer_code: str, file: UploadFile):\r\n    try:\r\n        payments_data = await parse_file(file)\r\n\r\n        async with app.state.pool.acquire() as conn:\r\n            processed_count, errors = await save_payments(\r\n                conn=conn,\r\n                customer_code=customer_code,\r\n                payments=payments_data,\r\n            )\r\n\r\n    except HTTPException:\r\n        raise\r\n    except Exception as e:\r\n        raise HTTPException(\r\n            status_code=500,\r\n            detail=f\"Ошибка при обработке файла: {str(e)}\",\r\n        )\r\n\r\n    return PaymentResponse(\r\n        status=\"success\" if not errors else \"partial_success\",\r\n        message=\"Файл обработан\",\r\n        processed_count=processed_count,\r\n        errors_count=len(errors),\r\n        errors=errors,\r\n    )\r\n```\r\n\r\n### 4. Вариант 2 — если речь именно про DB-lock\r\n\r\nЕсли нужно проверить, что строка не заблокирована другой транзакцией, можно использовать:\r\n\r\n```sql\r\nSELECT ...\r\nFOR UPDATE NOWAIT\r\n```\r\n\r\n`NOWAIT` означает: если строка уже заблокирована другой транзакцией, не ждать, а сразу выбросить ошибку.\r\n\r\nПример:\r\n\r\n```python\r\nfrom asyncpg.exceptions import LockNotAvailableError\r\n\r\n\r\nasync def save_payments_with_db_lock_check(\r\n    conn: asyncpg.Connection,\r\n    customer_code: str,\r\n    payments: list[PaymentData],\r\n) -> tuple[int, list[PaymentRowError]]:\r\n    processed_count = 0\r\n    errors: list[PaymentRowError] = []\r\n\r\n    async with conn.transaction():\r\n        for payment in payments:\r\n            try:\r\n                account = await conn.fetchrow(\r\n                    \"\"\"\r\n                    SELECT id\r\n                    FROM accounts\r\n                    WHERE customer_code = $1\r\n                      AND inn = $2\r\n                      AND account_number = $3\r\n                    FOR UPDATE NOWAIT\r\n                    \"\"\",\r\n                    customer_code,\r\n                    payment.inn,\r\n                    payment.account_number,\r\n                )\r\n\r\n            except LockNotAvailableError:\r\n                errors.append(\r\n                    PaymentRowError(\r\n                        row_number=payment.row_number,\r\n                        inn=payment.inn,\r\n                        account_number=payment.account_number,\r\n                        code=\"ROW_LOCKED\",\r\n                        message=\"Запись сейчас заблокирована другой операцией\",\r\n                    )\r\n                )\r\n                continue\r\n\r\n            if account is None:\r\n                errors.append(\r\n                    PaymentRowError(\r\n                        row_number=payment.row_number,\r\n                        inn=payment.inn,\r\n                        account_number=payment.account_number,\r\n                        code=\"ACCOUNT_NOT_FOUND\",\r\n                        message=\"Счёт не найден\",\r\n                    )\r\n                )\r\n                continue\r\n\r\n            await conn.execute(\r\n                \"\"\"\r\n                INSERT INTO payments (\r\n                    account_id,\r\n                    amount,\r\n                    purpose,\r\n                    status\r\n                )\r\n                VALUES ($1, $2, $3, $4)\r\n                \"\"\",\r\n                account[\"id\"],\r\n                payment.amount,\r\n                payment.purpose,\r\n                \"created\",\r\n            )\r\n\r\n            processed_count += 1\r\n\r\n    return processed_count, errors\r\n```\r\n\r\nВ этом варианте заблокированная строка не ломает обработку всего файла. Она просто попадает в результат как ошибка конкретной строки.\r\n\r\nНапример:\r\n\r\n```json\r\n{\r\n  \"status\": \"partial_success\",\r\n  \"message\": \"Файл обработан\",\r\n  \"processed_count\": 998,\r\n  \"errors_count\": 2,\r\n  \"errors\": [\r\n    {\r\n      \"row_number\": 12,\r\n      \"inn\": \"7700000000\",\r\n      \"account_number\": \"40702810000000000001\",\r\n      \"code\": \"ROW_LOCKED\",\r\n      \"message\": \"Запись сейчас заблокирована другой операцией\"\r\n    },\r\n    {\r\n      \"row_number\": 45,\r\n      \"inn\": \"7800000000\",\r\n      \"account_number\": \"40702810000000000002\",\r\n      \"code\": \"ACCOUNT_NOT_FOUND\",\r\n      \"message\": \"Счёт не найден\"\r\n    }\r\n  ]\r\n}\r\n```\r\n\r\n### 5. Более оптимальный batch-подход\r\n\r\nДля файла до 1000 строк можно не ходить в БД по каждой строке отдельно. Лучше сначала собрать все уникальные пары:\r\n\r\n```text\r\ninn + account_number\r\n```\r\n\r\nПотом одним запросом получить все подходящие счета.\r\n\r\nИдея:\r\n\r\n```python\r\nkeys = {\r\n    (payment.inn, payment.account_number)\r\n    for payment in payments\r\n}\r\n```\r\n\r\nДальше одним SQL-запросом получить счета:\r\n\r\n```sql\r\nSELECT id, inn, account_number, is_blocked\r\nFROM accounts\r\nWHERE customer_code = $1\r\n  AND (inn, account_number) = ANY($2)\r\n```\r\n\r\nНо с `asyncpg` удобнее передать данные через `unnest`.\r\n\r\nПример:\r\n\r\n```python\r\nasync def get_accounts_map(\r\n    conn: asyncpg.Connection,\r\n    customer_code: str,\r\n    payments: list[PaymentData],\r\n) -> dict[tuple[str, str], asyncpg.Record]:\r\n    inns = [payment.inn for payment in payments]\r\n    account_numbers = [payment.account_number for payment in payments]\r\n\r\n    rows = await conn.fetch(\r\n        \"\"\"\r\n        WITH input_data AS (\r\n            SELECT *\r\n            FROM unnest($2::text[], $3::text[]) AS t(inn, account_number)\r\n        )\r\n        SELECT DISTINCT\r\n            a.id,\r\n            a.inn,\r\n            a.account_number,\r\n            a.is_blocked\r\n        FROM accounts a\r\n        JOIN input_data i\r\n          ON i.inn = a.inn\r\n         AND i.account_number = a.account_number\r\n        WHERE a.customer_code = $1\r\n        \"\"\",\r\n        customer_code,\r\n        inns,\r\n        account_numbers,\r\n    )\r\n\r\n    return {\r\n        (row[\"inn\"], row[\"account_number\"]): row\r\n        for row in rows\r\n    }\r\n```\r\n\r\nПосле этого можно обрабатывать список платежей уже без отдельного `SELECT` на каждую строку:\r\n\r\n```python\r\nasync def save_payments_batch(\r\n    conn: asyncpg.Connection,\r\n    customer_code: str,\r\n    payments: list[PaymentData],\r\n) -> tuple[int, list[PaymentRowError]]:\r\n    processed_count = 0\r\n    errors: list[PaymentRowError] = []\r\n    rows_to_insert = []\r\n\r\n    async with conn.transaction():\r\n        accounts_map = await get_accounts_map(\r\n            conn=conn,\r\n            customer_code=customer_code,\r\n            payments=payments,\r\n        )\r\n\r\n        for payment in payments:\r\n            key = (payment.inn, payment.account_number)\r\n            account = accounts_map.get(key)\r\n\r\n            if account is None:\r\n                errors.append(\r\n                    PaymentRowError(\r\n                        row_number=payment.row_number,\r\n                        inn=payment.inn,\r\n                        account_number=payment.account_number,\r\n                        code=\"ACCOUNT_NOT_FOUND\",\r\n                        message=\"Счёт не найден\",\r\n                    )\r\n                )\r\n                continue\r\n\r\n            if account[\"is_blocked\"]:\r\n                errors.append(\r\n                    PaymentRowError(\r\n                        row_number=payment.row_number,\r\n                        inn=payment.inn,\r\n                        account_number=payment.account_number,\r\n                        code=\"ACCOUNT_LOCKED\",\r\n                        message=\"Счёт заблокирован\",\r\n                    )\r\n                )\r\n                continue\r\n\r\n            rows_to_insert.append(\r\n                (\r\n                    account[\"id\"],\r\n                    payment.amount,\r\n                    payment.purpose,\r\n                    \"created\",\r\n                )\r\n            )\r\n\r\n        if rows_to_insert:\r\n            await conn.executemany(\r\n                \"\"\"\r\n                INSERT INTO payments (\r\n                    account_id,\r\n                    amount,\r\n                    purpose,\r\n                    status\r\n                )\r\n                VALUES ($1, $2, $3, $4)\r\n                \"\"\",\r\n                rows_to_insert,\r\n            )\r\n\r\n        processed_count = len(rows_to_insert)\r\n\r\n    return processed_count, errors\r\n```\r\n\r\nТакой подход лучше, чем делать 1000 отдельных `SELECT`.\r\n\r\n### 6. Если нужно batch-поведение с DB-lock\r\n\r\nЕсли задача именно про строки, заблокированные другой транзакцией, можно использовать `FOR UPDATE SKIP LOCKED`.\r\n\r\nИдея:\r\n\r\n```sql\r\nSELECT ...\r\nFROM accounts\r\nWHERE ...\r\nFOR UPDATE SKIP LOCKED\r\n```\r\n\r\nТогда БД вернёт только те строки, которые удалось заблокировать. Заблокированные другой транзакцией строки будут пропущены.\r\n\r\nПосле этого логика такая:\r\n\r\n```text\r\n1. Собрали все счета из файла.\r\n2. Попытались получить их через FOR UPDATE SKIP LOCKED.\r\n3. То, что вернулось, можно обрабатывать.\r\n4. То, что не вернулось, но существует в БД, считаем временно заблокированным.\r\n5. То, чего нет в БД, считаем ACCOUNT_NOT_FOUND.\r\n```\r\n\r\nНо тут важно отличить:\r\n\r\n```text\r\nне найдено в БД\r\n```\r\n\r\nот:\r\n\r\n```text\r\nесть в БД, но заблокировано другой транзакцией\r\n```\r\n\r\nДля этого можно сделать два запроса:\r\n\r\n```text\r\n1. Обычный SELECT — узнать, какие счета вообще существуют.\r\n2. SELECT ... FOR UPDATE SKIP LOCKED — узнать, какие удалось заблокировать.\r\n```\r\n\r\n### 7. Что лучше вернуть клиенту\r\n\r\nНе стоит возвращать просто:\r\n\r\n```json\r\n{\r\n  \"status\": \"success\",\r\n  \"processed_count\": 900,\r\n  \"errors_count\": 100\r\n}\r\n```\r\n\r\nЛучше вернуть детальную информацию:\r\n\r\n```json\r\n{\r\n  \"status\": \"partial_success\",\r\n  \"message\": \"Файл обработан частично\",\r\n  \"processed_count\": 900,\r\n  \"errors_count\": 100,\r\n  \"errors\": [\r\n    {\r\n      \"row_number\": 10,\r\n      \"inn\": \"7700000000\",\r\n      \"account_number\": \"40702810000000000001\",\r\n      \"code\": \"ACCOUNT_LOCKED\",\r\n      \"message\": \"Счёт заблокирован\"\r\n    }\r\n  ]\r\n}\r\n```\r\n\r\nСтатусы можно сделать такими:\r\n\r\n```text\r\nsuccess         — все строки обработаны\r\npartial_success — часть строк обработана, часть отклонена\r\nfailed          — файл вообще не удалось обработать\r\n```\r\n\r\n### 8. Дополнительные способы оптимизации\r\n\r\n```text\r\n1. Читать и парсить файл потоково, а не загружать огромный файл целиком.\r\n2. Ограничить размер файла на уровне API.\r\n3. Проверять content-type и расширение файла.\r\n4. Валидировать строки файла до похода в БД.\r\n5. Удалять дубли внутри файла до сохранения.\r\n6. Делать batch-проверку счетов.\r\n7. Делать batch-insert платежей.\r\n8. Использовать пул соединений к БД.\r\n9. Добавить индексы на customer_code, inn, account_number.\r\n10. Не держать транзакцию открытой во время парсинга файла.\r\n11. Использовать Decimal для суммы.\r\n12. Для долгой обработки файла можно сохранять upload job и обрабатывать файл в фоне через очередь.\r\n13. Добавить idempotency-key для повторной загрузки файла.\r\n14. Хранить hash файла, чтобы не обработать один и тот же файл дважды.\r\n15. Добавить таблицу payment_imports для истории загрузок.\r\n```\r\n\r\nИндексы:\r\n\r\n```sql\r\nCREATE UNIQUE INDEX idx_accounts_customer_inn_account\r\nON accounts (customer_code, inn, account_number);\r\n\r\nCREATE INDEX idx_payments_account_id\r\nON payments (account_id);\r\n```\r\n\r\nДля истории загрузок:\r\n\r\n```sql\r\nCREATE TABLE payment_imports (\r\n    id BIGSERIAL PRIMARY KEY,\r\n    customer_code TEXT NOT NULL,\r\n    file_name TEXT NOT NULL,\r\n    file_hash TEXT NOT NULL,\r\n    status TEXT NOT NULL,\r\n    processed_count INTEGER NOT NULL DEFAULT 0,\r\n    errors_count INTEGER NOT NULL DEFAULT 0,\r\n    created_at TIMESTAMP NOT NULL DEFAULT now(),\r\n\r\n    UNIQUE (customer_code, file_hash)\r\n);\r\n```\r\n\r\nЭто позволит защититься от повторной обработки одного и того же файла.\r\n\r\n### 9. Итоговая архитектурная идея\r\n\r\n```text\r\n1. Endpoint принимает файл.\r\n2. Файл парсится и валидируется.\r\n3. Создаётся запись об импорте файла.\r\n4. Счета из файла проверяются batch-запросом.\r\n5. Заблокированные записи не сохраняются как платежи.\r\n6. По каждой проблемной строке формируется ошибка.\r\n7. Валидные платежи сохраняются пачкой.\r\n8. Клиент получает summary + список ошибок.\r\n```\r\n\r\nГлавное: заблокированная запись не должна приводить к падению всей загрузки. Это нормальный частичный результат обработки файла, который должен попасть в `errors` с понятным кодом, например `ACCOUNT_LOCKED` или `ROW_LOCKED`.\r\n{{< /details >}}\r\n"
